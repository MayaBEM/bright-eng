 to use your own device, please arrive by 9:45 so that the connection ____ before the audience enters.`,`____ The organisers will cover your return airfare and two nights at the conference hotel.`,`Please send your slide deck and a short biography ____ 20 February so that we can print the programme.`],signature:`Kind regards, Somrudee Panit, Conference Chair`}],[oi([`will take place`,`took place`,`has taken place`,`is taking`],0,`งานประชุมจะจัดขึ้นในวันที่ 8 มีนาคมซึ่งเป็นอนาคต จึงใช้ will take place`,[`verb-tense`]),oi([`tests`,`can be tested`,`testing`,`to test`],1,`การเชื่อมต่อถูกทดสอบ ไม่ได้ทดสอบตัวเอง จึงต้องใช้รูป passive can be tested`,[`passive`]),oi([`We are pleased to confirm your travel arrangements.`,`Unfortunately the session has been cancelled.`,`Registration closes at the end of this week.`,`Please note that speakers pay their own expenses.`],0,`ประโยคถัดไประบุว่าผู้จัดจะออกค่าตั๋วเครื่องบินและที่พักให้ ประโยคที่เติมจึงต้องเป็นการยืนยันเรื่องการเดินทาง ส่วนตัวเลือกที่บอกว่าวิทยากรต้องจ่ายเองขัดกันโดยตรง`,[`sentence-insert`,`cohesion`]),oi([`by`,`until`,`since`,`within`],0,`by + วันที่ ใช้กับเส้นตายของการส่งเอกสาร ส่วน until ใช้กับสิ่งที่ทำต่อเนื่อง`,[`preposition`])]),ai(6,`ft1-143`,`Refer to the following notice.`,[{kind:`notice`,title:`Library Self-Service Kiosks`,body:[`From 1 April, all borrowing and returning at the Central Library will be done at the new self-service kiosks near the main entrance. The kiosks ____ accept both staff cards and public membership cards.`,`Using a kiosk takes about twenty seconds. Place your books on the pad, tap your card, and take the printed slip. ____`,`Library assistants will be on hand for the first two weeks to help anyone who is ____ with the machines.`,`The service desk will remain open for enquiries, reservations and fines, so please do not queue there ____ you only wish to borrow a book.`]}],[oi([`will`,`would`,`have`,`are`],0,`ประโยคบอกสิ่งที่จะเกิดตั้งแต่ 1 เมษายน จึงใช้ will accept`,[`verb-tense`]),oi([`The slip shows your due dates.`,`Kiosks are available in every branch.`,`Membership cards cost fifty baht.`,`The library closes at six on Sundays.`],0,`ย่อหน้ากำลังอธิบายขั้นตอนการใช้ตู้และจบที่การรับสลิป ประโยคที่เติมจึงควรขยายเรื่องสลิปให้ต่อเนื่อง ตัวเลือกอื่นเปลี่ยนหัวข้อกะทันหัน`,[`sentence-insert`,`cohesion`]),oi([`unfamiliar`,`unfamiliarly`,`unfamiliarity`,`familiarize`],0,`หลัง is ต้องการคำคุณศัพท์ และสำนวนคือ be unfamiliar with แปลว่าไม่คุ้นเคยกับ`,[`word-form`]),oi([`if`,`unless`,`so that`,`in order to`],0,`ความหมายคือถ้าเพียงต้องการยืมหนังสือก็ไม่ต้องต่อคิวที่เคาน์เตอร์ จึงใช้ if`,[`conjunction`])])],mi=[ai(7,`ft1-147`,`Refer to the following text-message chain.`,[{kind:`chat`,body:[],chat:[{speaker:`Wanida Chai`,time:`2:05 P.M.`,text:`I am at the venue. The room is set for 40 but we have 55 registered.`},{speaker:`Peter Nolan`,time:`2:07 P.M.`,text:`The hotel said they could add chairs with an hour of notice. Have you asked at the desk?`},{speaker:`Wanida Chai`,time:`2:09 P.M.`,text:`Just did. They can bring 15 more by three, but then the aisles get narrow.`},{speaker:`Peter Nolan`,time:`2:10 P.M.`,text:`Better narrow than standing. Take the chairs and move the refreshment table outside.`}]}],[[`What problem does Ms. Chai report?`,[`The room is too small for the group`,`The event was cancelled`,`The hotel lost a booking`,`Registration closed early`],0,`เธอบอกว่าห้องจัดที่นั่งไว้ 40 ที่ แต่มีผู้ลงทะเบียน 55 คน`,[`detail`]],[`At 2:10 P.M., what does Mr. Nolan mean when he writes, "Better narrow than standing"?`,[`He prefers a different room`,`He accepts the crowded layout`,`He wants fewer guests`,`He will arrive late`],1,`ประโยคก่อนหน้าบอกว่าถ้าเพิ่มเก้าอี้ ทางเดินจะแคบ คำตอบของเขาจึงหมายความว่ายอมให้ทางเดินแคบดีกว่าปล่อยให้คนต้องยืน`,[`speaker-intent`]]]),ai(7,`ft1-149`,`Refer to the following notice.`,[{kind:`notice`,title:`Cycle Parking — Level P2`,body:[`Bicycle racks on level P2 will be relocated to the north wall between 4 and 6 May to make space for two electric-vehicle charging bays.`,`During those three days, please leave bicycles in the temporary rack beside the security office. Any bicycle left in the old location after 6 P.M. on 3 May will be moved by security, and owners will have to collect it from the office with photo identification.`,`The new racks will hold 48 bicycles, twelve more than before, and will be covered.`]}],[[`What is the main purpose of the notice?`,[`To announce a temporary relocation`,`To ban bicycles from the building`,`To advertise charging bays`,`To report a theft`],0,`ประกาศแจ้งว่าที่จอดจักรยานจะถูกย้ายชั่วคราวระหว่างวันที่ 4–6 พฤษภาคม`,[`purpose`]],[`What will happen to a bicycle left in the old racks on 4 May?`,[`It will be removed by security`,`It will be charged a fee`,`It will be donated`,`It will be repaired`],0,`ประกาศระบุว่าจักรยานที่ยังอยู่ที่เดิมหลัง 18:00 น. ของวันที่ 3 พฤษภาคมจะถูกฝ่ายรักษาความปลอดภัยย้ายออก`,[`detail`]]]),ai(7,`ft1-151`,`Refer to the following advertisement.`,[{kind:`advertisement`,title:`Thonglor Coworking — Meeting Rooms by the Hour`,body:[`Need a professional room for an hour, not a year? Our four meeting rooms seat between four and sixteen people and can be booked online in one minute.`,`All rooms include a large screen, whiteboard, filtered water and fast internet. Rooms for eight or more also include a video-conference camera and microphone at no extra cost.`,`Rates start at 400 baht per hour. Book ten hours in advance and pay for nine. Cancellations made more than twenty-four hours ahead are refunded in full; later cancellations are charged half the rate.`,`Our address is 88 Sukhumvit 55, two minutes from Thong Lo BTS. Reception is staffed from 8 A.M. to 8 P.M., seven days a week.`]}],[[`What is being advertised?`,[`Serviced apartments`,`Hourly meeting rooms`,`Video production services`,`Office furniture`],1,`โฆษณาเสนอห้องประชุมที่จองเป็นรายชั่วโมงได้`,[`gist-topic`]],[`What is included only in the larger rooms?`,[`A whiteboard`,`Filtered water`,`Video-conference equipment`,`Fast internet`],2,`ย่อหน้าที่สองบอกว่าห้องที่นั่งได้แปดคนขึ้นไปจะมีกล้องและไมโครโฟนสำหรับประชุมทางไกลรวมอยู่ด้วย`,[`detail`]],[`What happens if a booking is cancelled twelve hours in advance?`,[`It is fully refunded`,`It is charged half the rate`,`It is moved to another day`,`It is charged in full`],1,`โฆษณาระบุว่าคืนเงินเต็มจำนวนเฉพาะการยกเลิกล่วงหน้าเกิน 24 ชั่วโมง หากช้ากว่านั้นคิดครึ่งราคา`,[`scanning`]]]),ai(7,`ft1-154`,`Refer to the following e-mail.`,[{kind:`email`,meta:[{label:`To`,value:`All Regional Sales Staff`},{label:`From`,value:`Ornuma Sae-lim, Sales Operations`},{label:`Date`,value:`3 September`},{label:`Subject`,value:`Quarterly report template`}],body:[`Dear colleagues,`,`From this quarter, regional reports must use the new template, which is attached and also stored in the shared drive.`,`The most important change is the customer section. Instead of listing every account, please report only accounts worth more than one hundred thousand baht and any account that has cancelled. Head office will pull the remaining data directly from the system.`,`This should cut the time each report takes from roughly four hours to under one. If a report takes you longer than that, tell me — it usually means a field is being filled in twice.`,`Reports are due on the fifth working day after the quarter ends, one day later than before.`],signature:`Ornuma`}],[[`What is the main purpose of the e-mail?`,[`To announce a new reporting template`,`To hire additional staff`,`To cancel a quarterly meeting`,`To request customer feedback`],0,`อีเมลแจ้งว่าตั้งแต่ไตรมาสนี้ต้องใช้เทมเพลตรายงานใหม่`,[`purpose`]],[`Which accounts must still be listed individually?`,[`All accounts`,`Accounts over 100,000 baht and cancelled accounts`,`Only new accounts`,`Only accounts outside Bangkok`],1,`อีเมลระบุว่าให้รายงานเฉพาะบัญชีที่มีมูลค่าเกินหนึ่งแสนบาทและบัญชีที่ยกเลิก`,[`detail`]],[`What does Ms. Sae-lim ask staff to do if a report takes too long?`,[`Ask a colleague for help`,`Contact her`,`Use the old template`,`Submit it late`],1,`เธอบอกว่าถ้าใช้เวลานานกว่าหนึ่งชั่วโมงให้แจ้งเธอ เพราะมักแปลว่ามีการกรอกข้อมูลซ้ำ`,[`next-action`]]]),ai(7,`ft1-157`,`Refer to the following article.`,[{kind:`article`,title:`Ferry Operator Adds Weekend Service to Koh Sichang`,body:[`SI RACHA — Andaman Blue Ferries will add two weekend sailings to Koh Sichang from 1 October, bringing the total to eight a day.`,`The operator says weekday demand has been stable for three years, but weekend sailings have run at more than ninety percent of capacity since the pier was renovated in 2023. Passengers have often waited for the next boat.`,`The extra sailings depart at 7:15 A.M. and 6:40 P.M. on Saturdays and Sundays. The early service is aimed at day visitors, while the evening one allows workers on the island to return to the mainland after their shifts.`,`Ticket prices will not change. However, the company will stop selling tickets on board from October; all tickets must be bought at the pier office or through the mobile application. A spokesperson said the change would cut boarding time by about four minutes per sailing.`]}],[[`What is the article mainly about?`,[`A price increase`,`An expanded ferry schedule`,`A pier renovation`,`A new mobile application`],1,`บทความรายงานว่าบริษัทเรือเฟอร์รีจะเพิ่มเที่ยวเรือช่วงสุดสัปดาห์`,[`gist-topic`]],[`Why is the evening sailing being added?`,[`To serve island workers returning home`,`To reduce fuel costs`,`To replace a cancelled route`,`To attract tour groups`],0,`บทความระบุว่าเที่ยวเย็นมีไว้ให้คนทำงานบนเกาะกลับเข้าฝั่งหลังเลิกงาน`,[`detail`]],[`What change will take effect in October?`,[`Tickets will cost more`,`Tickets will not be sold on board`,`The pier will close for repairs`,`Weekday sailings will be reduced`],1,`ย่อหน้าสุดท้ายบอกว่าตั้งแต่เดือนตุลาคมจะเลิกขายตั๋วบนเรือ ต้องซื้อที่ท่าเรือหรือผ่านแอปพลิเคชัน`,[`detail`]]]),ai(7,`ft1-160`,`Refer to the following online chat discussion.`,[{kind:`chat`,body:[],chat:[{speaker:`Rachel Okoro`,time:`9:02 A.M.`,text:`Team, the client moved the design review to Thursday. Can we have the three concepts ready?`},{speaker:`Nattapong Sri`,time:`9:04 A.M.`,text:`Concepts one and two are done. Three needs the photography, and the shoot is Wednesday afternoon.`},{speaker:`Marisol Vega`,time:`9:06 A.M.`,text:`I can mock up concept three with stock images and swap the real photos in on Thursday morning.`},{speaker:`Rachel Okoro`,time:`9:07 A.M.`,text:`That works, as long as we tell the client the images are placeholders.`},{speaker:`Nattapong Sri`,time:`9:09 A.M.`,text:`I will add a note on the first slide. Marisol, send me the file by six on Wednesday.`},{speaker:`Marisol Vega`,time:`9:10 A.M.`,text:`Will do.`}]}],[[`What has changed about the review?`,[`Its date`,`Its location`,`The client`,`The number of concepts`],0,`ข้อความแรกบอกว่าลูกค้าเลื่อนการรีวิวงานออกแบบมาเป็นวันพฤหัสบดี`,[`detail`]],[`Why is concept three not finished?`,[`The client has not approved it`,`The photography is not done`,`A designer is on leave`,`The budget was cut`],1,`Nattapong บอกว่าแนวคิดที่สามยังรอภาพถ่าย และการถ่ายภาพอยู่บ่ายวันพุธ`,[`detail`]],[`What does Ms. Vega offer to do?`,[`Postpone the shoot`,`Present the concepts herself`,`Use temporary images`,`Contact the client`],2,`เธอเสนอทำตัวอย่างงานด้วยภาพสต็อกก่อน แล้วค่อยเปลี่ยนเป็นภาพจริงเช้าวันพฤหัสบดี`,[`detail`]],[`At 9:10 A.M., what does Ms. Vega most likely agree to do?`,[`Attend the shoot`,`Send a file by Wednesday evening`,`Write the client note`,`Book a meeting room`],1,`ข้อความก่อนหน้าคือคำขอให้ส่งไฟล์ภายในหกโมงเย็นวันพุธ คำว่า Will do จึงหมายถึงตกลงตามนั้น`,[`speaker-intent`]]]),ai(7,`ft1-164`,`Refer to the following letter.`,[{kind:`letter`,meta:[{label:`To`,value:`Mr. Julian Reyes, Reyes Interiors`},{label:`Date`,value:`18 June`}],body:[`Dear Mr. Reyes,`,`I am writing about the reception desk your team installed at our clinic on 2 June.`,`The workmanship is excellent and the desk fits the space perfectly. However, the cable opening was cut on the left side, while our power outlet is on the right. At the moment a cable runs across the floor, which we cannot leave in a patient area.`,`I would be grateful if a technician could cut a second opening on the right. I understand the drawing we approved did show the opening on the left, so I am happy to pay for the additional work if that is your policy.`,`Our quietest period is between one and three in the afternoon on weekdays. Please let me know which day suits your team.`],signature:`Sincerely, Dr. Napat Wisetsri, Clinic Director`}],[[`Why did Dr. Wisetsri write the letter?`,[`To request a modification`,`To cancel an order`,`To dispute an invoice`,`To recommend the company`],0,`จดหมายขอให้ช่างมาเจาะช่องร้อยสายเพิ่มอีกด้านหนึ่ง`,[`purpose`]],[`What does Dr. Wisetsri acknowledge?`,[`The desk arrived late`,`The approved drawing showed the current design`,`The price was higher than quoted`,`The colour is wrong`],1,`เขายอมรับว่าแบบที่อนุมัติไปนั้นระบุช่องไว้ด้านซ้ายจริง จึงยินดีจ่ายค่าแก้ไข`,[`detail`]],[`What does Dr. Wisetsri suggest about scheduling?`,[`Work should be done at night`,`Weekday early afternoons are best`,`Any weekend day is fine`,`The clinic will close for a day`],1,`เขาบอกว่าช่วงที่คนไข้น้อยที่สุดคือบ่ายโมงถึงบ่ายสามในวันธรรมดา`,[`detail`]]]),ai(7,`ft1-167`,`Refer to the following Web page.`,[{kind:`webpage`,title:`Sunbird Airways — Baggage Questions`,body:[`How much cabin baggage may I bring? One piece up to 7 kg plus one small personal item. Economy Light fares do not include checked baggage.`,`Can I add checked baggage after booking? Yes. Adding 20 kg online costs 590 baht; the same allowance bought at the airport costs 1,200 baht. Online purchases must be made at least three hours before departure.`,`What if my bag is overweight at check-in? Bags between 20 and 32 kg are charged 150 baht per extra kilogram. Bags over 32 kg cannot be accepted and must be sent as cargo.`,`My bag did not arrive. Report it at the arrivals desk before leaving the airport. Claims made after you leave the terminal can take up to twenty-one days to process instead of seven.`]}],[[`What is included in every fare?`,[`20 kg of checked baggage`,`One cabin bag and a personal item`,`Priority boarding`,`Airport lounge access`],1,`ข้อแรกระบุว่าทุกคนนำสัมภาระขึ้นเครื่องได้หนึ่งชิ้นไม่เกิน 7 กิโลกรัม บวกของใช้ส่วนตัวชิ้นเล็กหนึ่งชิ้น ส่วนสัมภาระใต้ท้องเครื่องไม่รวมในตั๋ว Economy Light`,[`detail`]],[`How much does a passenger save by adding baggage online?`,[`150 baht`,`590 baht`,`610 baht`,`1,200 baht`],2,`ซื้อออนไลน์ 590 บาท ซื้อที่สนามบิน 1,200 บาท ส่วนต่างคือ 610 บาท`,[`scanning`]],[`What is indicated about a 35-kilogram bag?`,[`It is charged 150 baht per extra kilogram`,`It may be checked with prior approval`,`It cannot be checked in`,`It counts as two bags`],2,`เว็บเพจระบุว่ากระเป๋าหนักเกิน 32 กิโลกรัมรับเช็คอินไม่ได้ ต้องส่งเป็นคาร์โก`,[`detail`]]]),ai(7,`ft1-170`,`Refer to the following online review.`,[{kind:`review`,title:`Baan Klang Suan Guesthouse — 4 out of 5 stars`,meta:[{label:`Reviewer`,value:`J. Prasert`},{label:`Stayed`,value:`2 nights in February`}],body:[`I stayed here on a work trip and would come back. The room was small but spotless, and the bed was genuinely comfortable — not something I can say about most guesthouses at this price.`,`The staff were the highlight. When my meeting moved to seven in the morning, they arranged breakfast an hour before the kitchen normally opens, without being asked twice.`,`Two warnings. First, the guesthouse is on a small lane and taxi drivers could not find it; use the map link in the confirmation e-mail rather than the name. Second, the walls are thin, so bring earplugs if you are a light sleeper.`,`For business travellers, the desk in the room is a good size and the internet held up for two video calls at once.`]}],[[`What did the reviewer appreciate most?`,[`The location`,`The room size`,`The staff`,`The breakfast menu`],2,`ผู้รีวิวเขียนว่าพนักงานคือจุดเด่นที่สุด และยกตัวอย่างเรื่องการจัดอาหารเช้าให้ก่อนเวลา`,[`detail`]],[`What problem does the reviewer warn about?`,[`Slow internet`,`Noise between rooms`,`An uncomfortable bed`,`A late check-in`],1,`เขาเตือนว่าผนังบาง ทำให้ได้ยินเสียงจากห้องข้าง ๆ`,[`detail`]],[`What does the reviewer recommend doing?`,[`Booking directly by phone`,`Sharing the map link with the driver`,`Requesting a room upgrade`,`Arriving before noon`],1,`เขาแนะนำให้ใช้ลิงก์แผนที่ในอีเมลยืนยันแทนการบอกชื่อที่พัก เพราะคนขับแท็กซี่หาไม่เจอ`,[`inference`]]]),ai(7,`ft1-173`,`Refer to the following memo.`,[{kind:`memo`,meta:[{label:`To`,value:`Production Supervisors`},{label:`From`,value:`Chalida Rattanakul, Operations`},{label:`Date`,value:`7 August`},{label:`Subject`,value:`Trial of the four-day week`}],body:[`From 1 September, line three will trial a four-day working week for three months. Staff will work four ten-hour days instead of five eight-hour days, with the same pay.`,`The trial covers line three only. If output per hour holds within two percent of the current figure, we will extend the trial to lines one and two in December.`,`Supervisors should note two things. Breaks increase from thirty to forty-five minutes on a ten-hour day, and no employee may work more than four consecutive days without a rest day.`,`Please discuss the schedule with your teams this week and send me the rota by 20 August. Staff who prefer the current pattern may transfer to another line for the trial period; nobody will be required to change.`]}],[[`What is the purpose of the memo?`,[`To announce a schedule trial`,`To reduce staff pay`,`To close a production line`,`To order new equipment`],0,`บันทึกแจ้งว่าสายการผลิตที่สามจะทดลองทำงานสัปดาห์ละสี่วันเป็นเวลาสามเดือน`,[`purpose`]],[`What condition would lead to expanding the trial?`,[`Staff satisfaction surveys`,`Output per hour staying within two percent`,`A drop in overtime costs`,`Approval from the union`],1,`บันทึกระบุว่าถ้าผลผลิตต่อชั่วโมงยังอยู่ในช่วงบวกลบสองเปอร์เซ็นต์ จะขยายไปสายหนึ่งและสอง`,[`detail`]],[`What is stated about employees who dislike the new pattern?`,[`They may move to another line`,`They must take unpaid leave`,`They will be reassigned automatically`,`They may work from home`],0,`ย่อหน้าสุดท้ายบอกว่าพนักงานที่ชอบตารางเดิมสามารถย้ายไปสายอื่นได้ และไม่มีใครถูกบังคับให้เปลี่ยน`,[`detail`]]])],hi=[ai(7,`ft1-176`,`Refer to the following advertisement and e-mail.`,[{kind:`advertisement`,title:`Pak Nam Print — Bulk Printing for Events`,body:[`Programmes, badges, banners and signage, printed in Samut Prakan and delivered anywhere in Thailand.`,`Standard turnaround is five working days. Rush service (two working days) adds 30 percent to the order total. Orders above 20,000 baht include free delivery within Bangkok and the surrounding provinces.`,`Proofs are sent by e-mail within one working day of receiving artwork. Printing does not begin until you approve the proof in writing, so please check spelling and dates carefully.`,`We are closed on public holidays. Orders received after 4 P.M. are logged the following working day.`]},{kind:`email`,meta:[{label:`To`,value:`orders@paknamprint.co.th`},{label:`From`,value:`events@thaicivilsociety.org`},{label:`Date`,value:`Monday 12 May, 4:40 P.M.`},{label:`Subject`,value:`Conference programmes — 600 copies`}],body:[`Hello,`,`We need 600 programmes for our conference on Monday 26 May. The artwork is attached as a print-ready PDF.`,`Our budget is 22,000 baht including delivery to our office in Bangkok. We would like the programmes in our hands no later than Thursday 22 May so that we can insert the delegate cards ourselves.`,`Please confirm whether standard turnaround is enough, and send the proof as soon as you can. Our director must approve it, and she is travelling until Wednesday.`],signature:`Kanya Wattana, Events Officer`}],[[`What does the advertisement indicate about printing?`,[`It begins as soon as artwork arrives`,`It requires written approval of a proof`,`It takes place overnight`,`It is done in Bangkok`],1,`โฆษณาระบุว่าจะไม่เริ่มพิมพ์จนกว่าลูกค้าจะอนุมัติปรู๊ฟเป็นลายลักษณ์อักษร`,[`detail`]],[`When will the order most likely be logged?`,[`Monday 12 May`,`Tuesday 13 May`,`Wednesday 14 May`,`Thursday 15 May`],1,`ต้องรวมสองเอกสาร อีเมลส่งเวลา 16:40 น. วันจันทร์ และโฆษณาบอกว่าคำสั่งซื้อหลัง 16:00 น. จะถูกบันทึกในวันทำการถัดไป จึงเป็นวันอังคารที่ 13 พฤษภาคม`,[`cross-reference`]],[`Why does Ms. Wattana mention her director?`,[`To explain a possible delay in approval`,`To request a discount`,`To change the delivery address`,`To introduce a new contact`],0,`เธอบอกว่าผู้อำนวยการต้องเป็นคนอนุมัติปรู๊ฟและเดินทางอยู่จนถึงวันพุธ ซึ่งอธิบายว่าทำไมการอนุมัติอาจช้า`,[`speaker-intent`,`cross-reference`]],[`What will the organisation most likely receive at no additional cost?`,[`Rush service`,`Delivery`,`Extra copies`,`Design work`],1,`งบประมาณคือ 22,000 บาท ซึ่งเกิน 20,000 บาท จึงเข้าเงื่อนไขส่งฟรีในกรุงเทพฯ ตามที่โฆษณาระบุ`,[`cross-reference`]],[`What does Ms. Wattana plan to do after delivery?`,[`Print additional banners`,`Insert delegate cards`,`Return unused copies`,`Send a second proof`],1,`อีเมลบอกว่าต้องได้ของภายในวันพฤหัสบดีที่ 22 เพื่อจะได้ใส่บัตรผู้เข้าร่วมเอง`,[`detail`]]]),ai(7,`ft1-181`,`Refer to the following notice and e-mail.`,[{kind:`notice`,title:`Ratchada Tower — Annual Fire Drill, Wednesday 15 October`,body:[`The building’s annual fire drill will take place on Wednesday 15 October. The alarm will sound at 10:00 A.M. and again at 2:00 P.M.`,`At the first alarm, all tenants on floors 1–15 must leave the building by the nearest stairwell and gather at the assembly point in the car park. At the second alarm, floors 16–30 will do the same.`,`Floor wardens must collect the visitor list from reception before 9:30 A.M. and report the head count to the fire officer at the assembly point.`,`Lifts will be disabled for fifteen minutes after each alarm. Tenants who cannot use stairs should register with reception before 10 October so that assistance can be arranged.`]},{kind:`email`,meta:[{label:`To`,value:`All Staff — Silver Oak Consulting`},{label:`From`,value:`Office Manager`},{label:`Date`,value:`9 October`},{label:`Subject`,value:`Fire drill — what our team must do`}],body:[`Team, we are on floor 22, so please read the building notice carefully — our alarm is the afternoon one, not the morning one.`,`Anna Kittikul and I are the floor wardens. We will collect the visitor list, so please make sure every visitor is signed in at our own front desk before lunch.`,`If you have a client meeting that afternoon, move it to the morning or to Thursday. Meetings running during the drill cannot continue, and the lifts will be unavailable for a quarter of an hour afterwards.`,`Finally, if the stairs are difficult for you, tell me today so that I can register you with reception before the deadline.`]}],[[`When will the staff of Silver Oak Consulting evacuate?`,[`At 9:30 A.M.`,`At 10:00 A.M.`,`At 2:00 P.M.`,`At 2:15 P.M.`],2,`ต้องเชื่อมสองเอกสาร ประกาศบอกว่าชั้น 16–30 อพยพตอนสัญญาณครั้งที่สองเวลา 14:00 น. และอีเมลระบุว่าบริษัทอยู่ชั้น 22`,[`cross-reference`]],[`What are floor wardens required to do?`,[`Test the alarm system`,`Report a head count`,`Escort visitors to the lifts`,`Inspect the stairwells`],1,`ประกาศระบุว่าผู้ดูแลประจำชั้นต้องรายงานจำนวนคนให้เจ้าหน้าที่ดับเพลิงที่จุดรวมพล`,[`detail`]],[`What does the office manager ask staff to do about meetings?`,[`Hold them in the car park`,`Reschedule afternoon meetings`,`Invite clients to observe the drill`,`Record them for absent colleagues`],1,`อีเมลขอให้ย้ายการประชุมกับลูกค้าช่วงบ่ายไปเป็นช่วงเช้าหรือวันพฤหัสบดี`,[`detail`]],[`What is the deadline for requesting evacuation assistance?`,[`9 October`,`10 October`,`15 October`,`16 October`],1,`ประกาศระบุว่าต้องลงทะเบียนกับแผนกต้อนรับก่อนวันที่ 10 ตุลาคม`,[`scanning`]],[`What is suggested about Ms. Kittikul?`,[`She works on floor 15`,`She will collect the visitor list`,`She is the fire officer`,`She cannot use the stairs`],1,`อีเมลบอกว่าเธอกับผู้จัดการสำนักงานเป็นผู้ดูแลประจำชั้นและจะเป็นผู้ไปรับรายชื่อผู้มาเยือน`,[`cross-reference`]]]),ai(7,`ft1-186`,`Refer to the following schedule, e-mail and form.`,[{kind:`schedule`,title:`Northern Craft Fair — Workshop Timetable, Saturday 8 February`,body:[`All workshops are held in the Pavilion. Places are limited to the numbers shown.`],table:{headers:[`Time`,`Workshop`,`Places`,`Fee`],rows:[[`09:30 – 11:00`,`Natural indigo dyeing`,`12`,`450`],[`11:30 – 13:00`,`Bamboo basket weaving`,`10`,`380`],[`14:00 – 15:30`,`Celadon glazing`,`8`,`600`],[`16:00 – 17:30`,`Hand-carved wooden spoons`,`14`,`350`]]}},{kind:`email`,meta:[{label:`To`,value:`workshops@northerncraftfair.th`},{label:`From`,value:`b.ratchani@mailbox.co.th`},{label:`Date`,value:`20 January`},{label:`Subject`,value:`Two places, please`}],body:[`Hello,`,`I would like two places at the indigo dyeing workshop for my sister and me. We arrive from Lampang at nine, so an early start is fine.`,`We would also like to join a second workshop in the afternoon, but not the one that finishes latest, as our bus home leaves at four thirty.`,`Could you also confirm whether materials are included in the fee? My sister is left-handed, so if any tools are provided, she may need a different one.`],signature:`Bussaba Ratchani`},{kind:`form`,title:`Northern Craft Fair — Booking Confirmation 2214`,meta:[{label:`Name`,value:`B. Ratchani (2 participants)`},{label:`Issued`,value:`22 January`}],table:{headers:[`Workshop`,`Participants`,`Fee each`,`Total`],rows:[[`Natural indigo dyeing`,`2`,`450`,`900`],[`Celadon glazing`,`2`,`600`,`1,200`],[``,``,`Amount due`,`2,100`]]},body:[`All materials are included. Left-handed tools are available on request at the Pavilion desk.`]}],[[`Which workshop has the fewest places?`,[`Indigo dyeing`,`Basket weaving`,`Celadon glazing`,`Wooden spoons`],2,`ตารางระบุว่าเวิร์กช็อปเคลือบเซลาดอนรับได้ 8 คน ซึ่งน้อยที่สุด`,[`scanning`]],[`Why did Ms. Ratchani rule out one afternoon workshop?`,[`It was fully booked`,`It costs too much`,`It ends after her bus leaves`,`It is held outdoors`],2,`เธอบอกว่าไม่เอาคลาสที่จบช้าที่สุด เพราะรถกลับบ้านออกบ่ายสี่ครึ่ง ซึ่งคือคลาสแกะสลักช้อนที่จบ 17:30 น.`,[`cross-reference`]],[`How much will Ms. Ratchani pay in total?`,[`1,050 baht`,`1,200 baht`,`2,100 baht`,`2,400 baht`],2,`ใบยืนยันการจองระบุยอดที่ต้องชำระ 2,100 บาทสำหรับสองคนในสองเวิร์กช็อป`,[`scanning`]],[`What does the confirmation indicate about her question?`,[`Materials cost extra`,`Materials are included`,`Tools must be brought from home`,`Only one tool set is available`],1,`ใบยืนยันระบุว่ารวมวัสดุทั้งหมดแล้ว ซึ่งตอบคำถามที่เธอถามในอีเมล`,[`cross-reference`]],[`What should Ms. Ratchani’s sister do at the fair?`,[`Arrive thirty minutes early`,`Ask at the Pavilion desk for a tool`,`Pay a supplement in cash`,`Register for a third workshop`],1,`ใบยืนยันบอกว่ามีอุปกรณ์สำหรับคนถนัดซ้ายให้ขอได้ที่เคาน์เตอร์ในศาลา`,[`cross-reference`]]]),ai(7,`ft1-191`,`Refer to the following job posting, e-mail and interview note.`,[{kind:`webpage`,title:`Logistics Coordinator — Laem Chabang`,body:[`Blue Harbour Freight is recruiting a Logistics Coordinator to manage export bookings for our automotive clients.`,`Essential: at least two years of freight-forwarding experience; familiarity with export documentation; conversational English; and availability to start within one month.`,`Preferred: experience with automotive clients, and a second foreign language.`,`The role is based at our Laem Chabang office five days a week. Applications close on 14 July; interviews will be held in the last week of July.`]},{kind:`email`,meta:[{label:`To`,value:`recruit@blueharbourfreight.com`},{label:`From`,value:`w.chansiri@mailbox.co.th`},{label:`Date`,value:`11 July`},{label:`Subject`,value:`Logistics Coordinator application`}],body:[`Dear Recruitment Team,`,`Please consider my application for the Logistics Coordinator position.`,`I have worked for three years at a freight forwarder in Bangkok, preparing export documents for electronics shippers. I speak English daily with overseas agents and also studied Japanese for four years.`,`I have not handled automotive cargo, but the documentation for both is largely the same, and I learn quickly.`,`I am currently serving a two-month notice period, which ends on 10 September.`],signature:`Wichuda Chansiri`},{kind:`memo`,title:`Interview note — W. Chansiri, 29 July`,meta:[{label:`Interviewer`,value:`P. Sombat, Operations Manager`}],body:[`Strong candidate. Documentation knowledge is well above the level we expected, and her Japanese would help with the Nagoya account.`,`One issue: she cannot start before September, which does not meet our stated requirement. Team is short-staffed from August.`,`Recommendation: offer the role but ask whether her current employer would release her earlier. If not, consider a part-time handover during August.`]}],[[`Which essential requirement does Ms. Chansiri NOT meet?`,[`Freight-forwarding experience`,`Export documentation knowledge`,`Availability to start`,`Conversational English`],2,`ประกาศระบุว่าต้องเริ่มงานได้ภายในหนึ่งเดือน แต่เธอต้องแจ้งลาออกล่วงหน้าสองเดือน ซึ่งบันทึกสัมภาษณ์ก็ยืนยันประเด็นนี้`,[`cross-reference`,`not-true`]],[`What does Ms. Chansiri offer that is listed as preferred?`,[`A second foreign language`,`Automotive experience`,`A management qualification`,`Overseas work experience`],0,`ประกาศระบุว่าภาษาต่างประเทศที่สองเป็นคุณสมบัติที่อยากได้ และเธอเรียนภาษาญี่ปุ่นมาสี่ปี`,[`cross-reference`]],[`What does Mr. Sombat say about her documentation knowledge?`,[`It is weaker than expected`,`It exceeds expectations`,`It was not assessed`,`It applies only to electronics`],1,`บันทึกสัมภาษณ์เขียนว่าความรู้ด้านเอกสารของเธอสูงกว่าที่คาดไว้มาก`,[`detail`]],[`What solution does Mr. Sombat propose?`,[`Reopening the search`,`Hiring a temporary agency worker`,`A part-time handover in August`,`Delaying the start date to October`],2,`เขาเสนอว่าถ้านายจ้างเดิมไม่ปล่อยตัวเร็วขึ้น ให้พิจารณาการส่งมอบงานแบบพาร์ตไทม์ในเดือนสิงหาคม`,[`detail`]],[`When did Ms. Chansiri submit her application?`,[`Before the closing date`,`On the closing date`,`One day late`,`After interviews began`],0,`ประกาศปิดรับ 14 กรกฎาคม อีเมลของเธอลงวันที่ 11 กรกฎาคม จึงส่งก่อนกำหนด`,[`cross-reference`]]]),ai(7,`ft1-196`,`Refer to the following article, e-mail and notice.`,[{kind:`article`,title:`City Trials Refill Stations to Cut Plastic Waste`,body:[`CHIANG MAI — The city will install twenty free drinking-water refill stations in public buildings this year, starting with four in the municipal library on Suthep Road.`,`Officials estimate that each station replaces about nine thousand single-use bottles a year. A similar programme in Khon Kaen cut bottled-water sales in council buildings by more than half.`,`The stations will be maintained by the supplier under a three-year contract, with filters changed every four months. Usage will be published on the city website each quarter.`]},{kind:`email`,meta:[{label:`To`,value:`facilities@cmlibrary.go.th`},{label:`From`,value:`Somsak Kliangthong, Aqua Pure Services`},{label:`Date`,value:`3 March`},{label:`Subject`,value:`Installation dates`}],body:[`Dear Facilities Team,`,`We can install the four stations on 18 and 19 March. Two units will go on the ground floor near the entrance, one on the second floor beside the study room, and one on the third floor.`,`Each installation needs about two hours, and the water to that section of the floor must be shut off during the work.`,`Please confirm which two hours on each day cause the least disruption. We would also suggest putting the third-floor unit near the lift rather than at the far end of the corridor, as the drainage connection is much simpler there.`],signature:`Somsak`},{kind:`notice`,title:`Library Notice — Water Supply, 18 & 19 March`,body:[`Water will be shut off in parts of the library while new refill stations are installed.`,`Ground floor: 18 March, 8:00–10:00 A.M. Second floor: 18 March, 2:00–4:00 P.M. Third floor: 19 March, 8:00–10:00 A.M.`,`The third-floor station will be placed beside the lift, as recommended by the supplier. Restrooms on each floor will be closed during that floor’s work; the basement restrooms remain open throughout.`,`The library will open at its usual time on both days.`]}],[[`According to the article, what will happen every four months?`,[`A new station will be installed`,`Filters will be replaced`,`Usage data will be published`,`The contract will be reviewed`],1,`บทความระบุว่าผู้จัดหาจะเปลี่ยนไส้กรองทุกสี่เดือนภายใต้สัญญาสามปี`,[`detail`]],[`How many stations will be installed on the ground floor?`,[`One`,`Two`,`Three`,`Four`],1,`อีเมลระบุว่าสองเครื่องจะติดตั้งที่ชั้นล่างใกล้ทางเข้า`,[`scanning`]],[`What suggestion from Mr. Kliangthong was accepted?`,[`Installing on a weekend`,`Placing a unit near the lift`,`Reducing the number of units`,`Closing the library early`],1,`ต้องเชื่อมสองเอกสาร เขาเสนอให้ติดเครื่องชั้นสามไว้ใกล้ลิฟต์ และประกาศของห้องสมุดยืนยันว่าจะวางไว้ตรงนั้นตามคำแนะนำ`,[`cross-reference`]],[`What is indicated about the second-floor work?`,[`It happens in the morning`,`It takes place in the afternoon`,`It has been postponed`,`It requires the floor to close`],1,`ประกาศระบุว่าชั้นสองจะปิดน้ำวันที่ 18 มีนาคม เวลา 14:00–16:00 น. ซึ่งเป็นช่วงบ่าย`,[`detail`]],[`What can library users do during the shutdowns?`,[`Use the basement restrooms`,`Borrow bottled water at the desk`,`Enter through a side door`,`Visit another branch`],0,`ประกาศบอกว่าห้องน้ำชั้นใต้ดินเปิดตลอดเวลา แม้ห้องน้ำชั้นที่กำลังทำงานจะปิด`,[`detail`]]])],gi=[...fi,...pi,...mi,...hi],_i=(e,t,n,r,i,a)=>({kind:`photo`,part:1,scene:t,audio:[{speaker:`Narrator`,voice:`narrator`,text:`Look at the picture and listen to the four statements.`},{speaker:`(A)`,voice:`w1`,text:n[0]},{speaker:`(B)`,voice:`w1`,text:n[1]},{speaker:`(C)`,voice:`w1`,text:n[2]},{speaker:`(D)`,voice:`w1`,text:n[3]}],question:{id:`p1-${e}  a manager`,`A listener call-in`],2,`ประโยคสุดท้ายบอกว่าหลังพักโฆษณาจะสัมภาษณ์ผู้จัดการตลาดเรื่องค่าเช่า`,[`next-action`]]])],L=(e,t,n,r,i,a)=>({kind:`sentence`,part:5,question:{id:`p5-${e}`,prompt:t,choices:n,answer:r,explanationTh:i,tags:a}}),wi=[L(`01`,`The board of directors ____ the merger proposal at last Thursday's meeting.`,[`approve`,`approved`,`approving`,`approval`],1,`ประโยคมีตัวบอกเวลาชัดเจนว่า last Thursday จึงต้องใช้กริยาช่องที่ 2 คือ approved ส่วน approve เป็นปัจจุบันซึ่งขัดกับเวลา approving เป็น -ing ที่ยืนเป็นกริยาแท้เดี่ยว ๆ ไม่ได้ และ approval เป็นคำนาม`,[`verb-tense`]),L(`02`,`All staff members must submit their expense reports ____ the fifth of each month.`,[`by`,`until`,`since`,`during`],0,`by = ภายใน/ไม่เกินวันที่กำหนด ใช้กับเส้นตายของการกระทำที่เกิดครั้งเดียว ส่วน until ใช้กับสิ่งที่ทำต่อเนื่องจนถึงเวลานั้น since ต้องคู่กับ perfect tense และ during ตามด้วยช่วงเวลา ไม่ใช่วันที่เจาะจง`,[`preposition`]),L(`03`,`Ms. Ortega delivered her sales pitch remarkably ____ for a first-time presenter.`,[`confide`,`confidence`,`confident`,`confidently`],3,`ช่องว่างอยู่หลัง remarkably ซึ่งเป็นคำวิเศษณ์ขยายคำวิเศษณ์อีกทีเพื่อขยายกริยา delivered จึงต้องใช้ confidently ที่เป็น adverb ส่วน confident เป็นคำคุณศัพท์ confidence เป็นคำนาม และ confide เป็นกริยา`,[`word-form`]),L(`04`,`____ the shipment clears customs before noon, we can still meet the delivery deadline.`,[`Despite`,`If`,`Whether`,`Unless`],1,`เนื้อความเป็นเงื่อนไข "ถ้า...ก็ยัง..." จึงใช้ If ส่วน Unless แปลว่า "ถ้าไม่" ซึ่งทำให้ความหมายกลับด้าน Despite ตามด้วยคำนามไม่ใช่ประโยค และ Whether ใช้กับทางเลือกสองทาง ไม่ใช่เงื่อนไขเดียว`,[`conjunction`]),L(`05`,`The new digital filing system is far more efficient than ____ one.`,[`previous`,`the previous`,`previously`,`previousness`],1,`หลัง than ต้องเป็นคำนามที่สมบูรณ์ คำว่า one เป็นคำนามนับได้เอกพจน์จึงต้องมี the นำหน้าเมื่อชี้เฉพาะระบบเดิม ตัวเลือก previous one ที่ไม่มี article จึงผิดหลักไวยากรณ์`,[`comparison`]),L(`06`,`Employees who commute by train are eligible for a monthly travel ____.`,[`allowance`,`allowing`,`allowable`,`allow`],0,`หลัง a monthly travel ต้องการคำนามมาปิดท้ายวลี allowance = เงินช่วยเหลือ/เบี้ยเลี้ยง ส่วน allowable เป็นคำคุณศัพท์ allow เป็นกริยา และ allowing เป็น -ing ที่ไม่ใช่คำนามในบริบทนี้`,[`word-form`,`vocabulary`]),L(`07`,`Please make sure that the conference room ____ before you leave the building.`,[`locks`,`locking`,`is locked`,`has locking`],2,`ห้องประชุมถูกล็อก ไม่ได้ล็อกตัวเอง จึงต้องใช้รูป passive คือ is locked ตัวเลือก locks เป็น active ที่ทำให้ห้องกลายเป็นผู้กระทำ ส่วนอีกสองตัวไม่ใช่รูปกริยาแท้ที่ถูกต้อง`,[`passive`]),L(`08`,`The technician will contact you as soon as your laptop ____ repaired.`,[`will be`,`has been`,`being`,`to be`],1,`ในอนุประโยคเวลา (as soon as, when, after) ห้ามใช้ will แม้ความหมายจะเป็นอนาคต ต้องใช้ present หรือ present perfect แทน จึงตอบ has been repaired`,[`verb-tense`]),L(`09`,`Neither the branch manager nor the assistants ____ available this afternoon.`,[`is`,`was`,`are`,`has been`],2,`โครงสร้าง neither A nor B ให้กริยาผันตามคำนามที่อยู่ใกล้กริยาที่สุด ในที่นี้คือ the assistants ซึ่งเป็นพหูพจน์ จึงใช้ are`,[`subject-verb`]),L(`10`,`The lobby renovation was completed ____ schedule and slightly under budget.`,[`ahead of`,`in front of`,`forward to`,`early of`],0,`ahead of schedule เป็นสำนวนแปลว่า "เร็วกว่ากำหนด" ส่วน in front of ใช้กับตำแหน่งทางกายภาพเท่านั้น อีกสองตัวเลือกไม่ใช่สำนวนที่มีใช้จริง`,[`preposition`,`vocabulary`]),L(`11`,`Mr. Haddad asked his team to review the contract ____ before signing it.`,[`thorough`,`thoroughness`,`thoroughly`,`more thorough`],2,`ช่องว่างขยายกริยา review จึงต้องใช้คำวิเศษณ์ thoroughly ส่วน thorough เป็นคำคุณศัพท์ที่ต้องขยายคำนาม และ thoroughness เป็นคำนาม`,[`word-form`]),L(`12`,`Sales in the eastern region have risen steadily ____ the campaign was launched.`,[`for`,`since`,`during`,`by`],1,`ประโยคใช้ present perfect (have risen) คู่กับจุดเริ่มต้นในอดีต จึงใช้ since ที่ตามด้วยอนุประโยค ส่วน for ตามด้วยช่วงเวลา during ตามด้วยคำนาม และ by บอกเส้นตาย`,[`conjunction`,`verb-tense`]),L(`13`,`The catering company provided far more food than the guests could possibly ____.`,[`consume`,`consumer`,`consumption`,`consuming`],0,`หลังกริยาช่วย could ต้องตามด้วยกริยาช่องที่ 1 เสมอ จึงตอบ consume ตัวเลือกที่เหลือเป็นคำนามหรือรูป -ing`,[`word-form`]),L(`14`,`Ms. Whitfield, ____ joined the firm in March, now supervises the entire audit team.`,[`she`,`who`,`whom`,`which`],1,`ช่องว่างเป็นประธานของอนุประโยคที่ขยายคน จึงใช้ who ส่วน whom ใช้เมื่อเป็นกรรม which ใช้กับสิ่งของ และ she จะทำให้เกิดสองประโยคซ้อนโดยไม่มีคำเชื่อม`,[`relative-clause`]),L(`15`,`Because of the storm, the outdoor ceremony was moved ____ to the main hall.`,[`indoors`,`indoor`,`inside of`,`interior`],0,`ช่องว่างขยายกริยา was moved จึงต้องใช้คำวิเศษณ์ indoors (เข้าไปข้างใน) ส่วน indoor เป็นคำคุณศัพท์ที่ต้องมีคำนามตาม เช่น an indoor pool`,[`word-form`]),L(`16`,`All visitors are required to wear a badge ____ they are inside the laboratory.`,[`while`,`during`,`meanwhile`,`within`],0,`ตามด้วยประโยคเต็ม (they are inside) จึงต้องใช้คำเชื่อม while ส่วน during เป็นบุพบทที่ตามด้วยคำนาม และ meanwhile เป็นคำวิเศษณ์เชื่อมประโยคสองประโยคที่แยกกัน`,[`conjunction`]),L(`17`,`The updated safety manual will be distributed to ____ works on the assembly line.`,[`whoever`,`whomever`,`whatever`,`who ever`],0,`ช่องว่างต้องเป็นประธานของกริยา works จึงใช้ whoever แม้ทั้งวลีจะทำหน้าที่เป็นกรรมของ to ก็ตาม ส่วน whomever ใช้เมื่อเป็นกรรมภายในอนุประโยค`,[`pronoun`]),L(`18`,`Our supplier's prices remain competitive ____ the recent increase in shipping costs.`,[`although`,`despite`,`however`,`because of`],1,`ตามด้วยวลีคำนาม (the recent increase) จึงต้องใช้บุพบท despite ส่วน although ต้องตามด้วยประโยค however เป็นคำวิเศษณ์เชื่อม และ because of ให้ความหมายเป็นเหตุผลซึ่งขัดกับเนื้อความ`,[`conjunction`]),L(`19`,`The marketing director praised the interns for their ____ to detail.`,[`attend`,`attentive`,`attention`,`attentively`],2,`หลัง their ต้องเป็นคำนาม และสำนวนที่ใ  and the last returns at 6:30 P.M.`,`We ____ for the inconvenience and thank you for your patience while the work is completed.`]}],[[[`repairs`,`is repaired`,`repairing`,`has repaired`],1,`พื้นผิวลานจอดถูกซ่อม ไม่ได้ซ่อมตัวเอง จึงต้องใช้ passive is repaired`,[`passive`]],[[`instead of`,`in spite of`,`as well as`,`according to`],0,`ความหมายคือแสดงบัตรพนักงานแทนการจ่ายเงิน จึงใช้ instead of`,[`vocabulary`]],[[`A shuttle bus will run every twenty minutes.`,`The car park has been permanently closed.`,`Visitors may use the staff spaces.`,`Parking fees will increase next year.`],0,`ประโยคถัดไปพูดถึงเวลารถเที่ยวแรกและเที่ยวสุดท้าย ประโยคที่เติมจึงต้องแนะนำเรื่องรถรับส่ง ตัวเลือกอื่นไม่เชื่อมกับข้อมูลเวลารถ`,[`sentence-insert`,`cohesion`]],[[`apologize`,`apology`,`apologetic`,`apologizing`],0,`ช่องว่างตามหลังประธาน We จึงต้องเป็นกริยาแท้ apologize`,[`word-form`]]]),Ti(`03`,`Refer to the following advertisement.`,[{kind:`advertisement`,title:`Chao Phraya Coworking — Now Open in Charoen Krung`,body:[`Looking for a quiet desk without a long-term lease? Chao Phraya Coworking offers ____ workspace by the day, week or month.`,`Every membership includes fast fibre internet, unlimited coffee and access to two meeting rooms. Day passes ____ at 350 baht, and monthly members receive twenty free hours of meeting-room time.`,`____ Members simply tap their card at the door.`,`Visit our website to book a free trial day, or drop by between 9 A.M. and 6 P.M. and ask for a ____.`]}],[[[`flexible`,`flexibly`,`flexibility`,`flex`],0,`ช่องว่างขยายคำนาม workspace จึงต้องเป็นคำคุณศัพท์ flexible`,[`word-form`]],[[`start`,`starts`,`starting`,`started`],0,`ประธานคือ Day passes ซึ่งเป็นพหูพจน์ จึงใช้กริยา start ไม่เติม s`,[`subject-verb`]],[[`The building is open twenty-four hours a day.`,`Printing is charged by the page.`,`Parking is not available on site.`,`All memberships require a one-year contract.`],0,`ประโยคถัดไปบอกว่าสมาชิกแค่แตะบัตรที่ประตู ประโยคที่เติมจึงควรพูดถึงการเปิดตลอด 24 ชั่วโมง ส่วนตัวเลือกที่บอกว่าต้องทำสัญญาหนึ่งปีขัดกับข้อความตอนต้นที่ว่าไม่ต้องเช่าระยะยาว`,[`sentence-insert`,`cohesion`]],[[`tour`,`tourist`,`touring`,`toured`],0,`หลัง a ต้องเป็นคำนามเอกพจน์ ask for a tour แปลว่าขอเข้าชมสถานที่`,[`word-form`]]]),Ti(`04`,`Refer to the following letter.`,[{kind:`letter`,meta:[{label:`To`,value:`Mr. Terence Okafor, 118 Windmill Road`},{label:`Date`,value:`2 September`}],body:[`Dear Mr. Okafor,`,`Thank you for your letter of 26 August regarding the damaged blender you ____ from our Silom store.`,`We have inspected the unit and agree that the fault was present before delivery. ____ Your replacement will be dispatched within three working days.`,`Because of the delay, we are also including a gift card ____ 500 baht, which can be used at any branch or online.`,`Once again, we are sorry for the trouble and hope you will continue to shop with us. Please contact me ____ if the new unit is not to your satisfaction.`],signature:`Sincerely, Waraporn Sirichai, Customer Care Manager`}],[[[`purchase`,`purchased`,`purchasing`,`to purchase`],1,`อนุประโยคขยาย blender ที่ลูกค้าซื้อไปแล้วในอดีต จึงใช้กริยาช่องที่ 2 purchased`,[`verb-tense`]],[[`You will therefore not be charged for the repair.`,`Unfortunately we cannot accept the return.`,`The item is no longer sold in Thailand.`,`Please return the blender to the factory yourself.`],0,`ย่อหน้าบอกว่าบริษัทยอมรับว่าสินค้ามีตำหนิและจะส่งของใหม่ให้ ประโยคที่เติมจึงต้องเป็นข่าวดีที่สอดคล้องกัน ตัวเลือกที่ปฏิเสธการคืนสินค้าขัดกับประโยคถัดไป`,[`sentence-insert`,`cohesion`]],[[`worth`,`cost`,`price`,`value`],0,`สำนวน a gift card worth 500 baht แปลว่าบัตรของขวัญมูลค่า 500 บาท คำอื่นต้องมีโครงสร้างต่างออกไป เช่น with a value of`,[`vocabulary`]],[[`direct`,`directly`,`direction`,`directed`],1,`ช่องว่างขยายกริยา contact จึงต้องใช้คำวิเศษณ์ directly`,[`word-form`]]]),Ti(`05`,`Refer to the following memo.`,[{kind:`memo`,meta:[{label:`To`,value:`Warehouse Team`},{label:`From`,value:`Operations Manager`},{label:`Subject`,value:`Updated lifting procedure`}],body:[`Following last month’s safety review, we are updating the procedure for handling pallets ____ more than twenty kilograms.`,`From Monday, two people must load any pallet above that weight. ____ It has already been installed near bay four.`,`Supervisors ____ a short briefing at the start of each shift this week to demonstrate the new steps.`,`Following the procedure carefully protects both you and your colleagues, so please take it ____.`]}],[[[`weighing`,`weighed`,`weighs`,`to weigh`],0,`ช่องว่างเป็นวลีลดรูปที่ขยาย pallets ในความหมาย active (พาเลตที่หนักเกิน) จึงใช้ present participle weighing`,[`participle`]],[[`A powered lift is also available for heavier loads.`,`The warehouse will close for two days.`,`Overtime will no longer be paid.`,`New staff will start next month.`],0,`ประโยคถัดไปบอกว่า "ติดตั้งไว้ใกล้ช่องสี่แล้ว" คำว่า It ต้องหมายถึงอุปกรณ์ ประโยคที่เติมจึงต้องแนะนำอุปกรณ์ยกของ`,[`sentence-insert`,`cohesion`]],[[`will hold`,`held`,`have held`,`holding`],0,`เนื้อความพูดถึงสิ่งที่จะเกิดสัปดาห์นี้หลังเริ่มใช้กฎใหม่วันจันทร์ จึงใช้อนาคต will hold`,[`verb-tense`]],[[`serious`,`seriously`,`seriousness`,`more serious`],1,`สำนวน take something seriously ต้องใช้คำวิเศษณ์ seriously`,[`word-form`]]])],Di=(e,t,n,r)=>({kind:`reading`,part:7,directions:t,documents:n,questions:r.map(([t,n,r,i,a],o)=>({id:`p7-${e}-${o+1}`,prompt:t,choices:n,answer:r,explanationTh:i,tags:a}))}),Oi=[Di(`01`,`Refer to the following text-message chain.`,[{kind:`chat`,body:[],chat:[{speaker:`Dara Suwan`,time:`8:42 A.M.`,text:`Morning. The printer on level three is jammed again and the annual reports are due at the board meeting at eleven.`},{speaker:`Ken Ito`,time:`8:44 A.M.`,text:`I can look at it, but I am at the Rama IV office until nine thirty.`},{speaker:`Dara Suwan`,time:`8:45 A.M.`,text:`That may be too late. Is there another machine that can handle two hundred colour pages?`},{speaker:`Ken Ito`,time:`8:47 A.M.`,text:`The one in the marketing studio can. The code is 4471. Just do not send it as one giant file.`},{speaker:`Dara Suwan`,time:`8:48 A.M.`,text:`Understood. I will split it into four batches.`}]}],[[`What is the problem?`,[`A meeting has been moved`,`A machine is not working`,`A file cannot be opened`,`A report is incomplete`],1,`ข้อความแรกบอกว่าเครื่องพิมพ์ชั้นสามกระดาษติดอีกแล้ว`,[`detail`]],[`At 8:48 A.M., what does Ms. Suwan most likely mean when she writes, "Understood"?`,[`She will wait for Mr. Ito to return`,`She will send the job in separate parts`,`She will cancel the print job`,`She will reschedule the board meeting`],1,`ประโยคก่อนหน้าคือคำเตือนว่าอย่าส่งเป็นไฟล์เดียวขนาดใหญ่ คำว่า Understood จึงหมายถึงเธอรับทราบและจะแบ่งส่งเป็นชุด ซึ่งเธอพูดต่อในประโยคเดียวกัน`,[`speaker-intent`]]]),Di(`02`,`Refer to the following advertisement.`,[{kind:`advertisement`,title:`Baan Suan Language Centre — Evening Courses for Working Adults`,body:[`Our ten-week evening courses are designed for people who work full time. Classes meet twice a week from 6:30 to 8:00 P.M. at our Ari campus, five minutes on foot from the BTS station.`,`Course fees are 7,900 baht and include all printed materials. Learners who register before 15 January pay 6,900 baht. Groups of three or more from the same company receive an additional 10 percent off the final price.`,`Every course ends with a mock examination and a one-to-one review with your teacher. Learners who miss more than four sessions may repeat the course once at no charge within twelve months.`,`Placement testing is free and takes about forty minutes. Book online or call 02-555-0181.`]}],[[`Who are the courses intended for?`,[`University students`,`Employed adults`,`Primary school children`,`Retired teachers`],1,`ย่อหน้าแรกระบุว่าออกแบบมาสำหรับคนที่ทำงานเต็มเวลา และเรียนช่วงเย็น`,[`gist-topic`]],[`How can a learner pay 6,900 baht?`,[`By paying in cash`,`By enrolling with a colleague`,`By registering before a certain date`,`By taking the placement test`],2,`ราคาลดเหลือ 6,900 บาทสำหรับผู้ที่ลงทะเบียนก่อนวันที่ 15 มกราคม`,[`scanning`]],[`What is NOT mentioned as being included?`,[`Printed materials`,`A mock examination`,`A meal during the break`,`A meeting with the teacher`],2,`ประกาศพูดถึงเอกสารประกอบ ข้อสอบเสมือนจริง และการคุยตัวต่อตัวกับครู แต่ไม่ได้กล่าวถึงอาหารระหว่างพัก`,[`not-true`]]]),Di(`03`,`Refer to the following notice.`,[{kind:`notice`,title:`Riverbank Tower — Water Supply Interruption`,body:[`Please be advised that the building’s water supply will be shut off on Wednesday, 8 October, from 9:00 A.M. to 4:00 P.M. so that the main pump can be replaced.`,`All floors will be affected, including the ground-floor retail units. Restrooms on level B1 will remain open, as they are connected to a separate tank.`,`Tenants are advised to store water for drinking and cleaning the evening before. Businesses that cannot operate without running water may apply for a one-day rent credit by writing to the management office before 3 October.`,`Work is expected to finish by 4:00 P.M., but a short delay is possible. Updates will be posted in the lobby and sent by SMS to registered tenants.`]}],[[`What is the purpose of the notice?`,[`To announce a rent increase`,`To warn of a service interruption`,`To advertise a new facility`,`To report a completed repair`],1,`ประกาศแจ้งว่าน้ำจะถูกตัดในวันพุธเพื่อเปลี่ยนปั๊มหลัก`,[`purpose`]],[`What will remain available during the shutdown?`,[`The retail units`,`The lobby café`,`The restrooms on level B1`,`The rooftop garden`],2,`ห้องน้ำชั้น B1 ยังใช้ได้เพราะต่อกับถังเก็บน้ำแยกต่างหาก`,[`detail`]],[`What must tenants do to receive a rent credit?`,[`Call the pump contractor`,`Write to the management office by 3 October`,`Register for SMS updates`,`Close their business for the day`],1,`ต้องเขียนแจ้งสำนักงานบริหารอาคารก่อนวันที่ 3 ตุลาคม`,[`scanning`]]]),Di(`04`,`Refer to the following article.`,[{kind:`article`,title:`Small Bakeries Find a Second Life in Office Districts`,body:[`BANGKOK — Five years ago, Pim Aroonrat sold bread from a single shop in Thonburi. Today her company, Kanom Rai, supplies fresh loaves to eleven office buildings before seven each morning.`,`The shift began by accident. In 2021, an office manager asked whether Ms. Aroonrat could deliver forty sandwiches for a meeting. The order repeated the following week, then twice a week, and within a year corporate deliveries had overtaken shop sales.`,`Ms. Aroonrat says the model works because offices are predictable. "A café has good days and bad days," she said. "An office orders the same quantity every Tuesday, so almost nothing is wasted."`,`The approach has drawbacks. Deliveries must arrive before staff sit down at their desks, which means baking begins at two in the morning. Ms. Aroonrat has also had to invest in refrigerated vans, which cost more than the original shop.`,`She now plans to license the model to bakers in Chiang Mai and Khon Kaen rather than open branches herself. "I would rather teach ten bakers than manage ten shops," she said.`]}],[[`What is the article mainly about?`,[`A bakery that shifted to corporate deliveries`,`A chain of cafés closing branches`,`A new type of bread`,`A shortage of delivery drivers`],0,`บทความเล่าว่าร้านเบเกอรี่เล็ก ๆ เปลี่ยนมาส่งขนมปังให้ออฟฟิศจนกลายเป็นรายได้หลัก`,[`gist-topic`]],[`How did the corporate business begin?`,[`Through an advertising campaign`,`With a single request for a meeting`,`By winning a government contract`,`After the shop closed`],1,`ย่อหน้าที่สองบอกว่าเริ่มจากผู้จัดการออฟฟิศคนหนึ่งขอให้ส่งแซนด์วิชสี่สิบชิ้นสำหรับการประชุม`,[`detail`]],[`The word "predictable" in paragraph 3 is closest in meaning to`,[`expensive`,`consistent`,`convenient`,`demanding`],1,`บริบทอธิบายว่าออฟฟิศสั่งจำนวนเท่าเดิมทุกวันอังคาร คำว่า predictable จึงใกล้เคียงกับ consistent คือคงเส้นคงวา`,[`synonym`,`vocabulary`]],[`What does Ms. Aroonrat plan to do next?`,[`Open branches in two cities`,`Sell the company`,`License her model to other bakers`,`Return to shop sales`],2,`ย่อหน้าสุดท้ายบอกว่าเธอจะให้สิทธิ์ใช้โมเดลกับช่างทำขนมปังในเชียงใหม่และขอนแก่น แทนที่จะเปิดสาขาเอง`,[`detail`]]]),Di(`05`,`Refer to the following e-mail.`,[{kind:`email`,meta:[{label:`To`,value:`Ramon Delacruz`},{label:`From`,value:`Sirinya Thongdee, Facilities`},{label:`Date`,value:`11 February`},{label:`Subject`,value:`Desk request — Room 502`}],body:[`Dear Ramon,`,`Thank you for your request for a second monitor and a larger desk for the new analyst joining your team on 3 March.`,`The monitor is straightforward; we have four in storage and one will be installed on 28 February. The desk is more difficult. Room 502 currently holds six desks, and fire regulations do not allow a seventh unless we remove the storage cabinet by the window.`,`If your team can move the cabinet contents to the shared archive on level two, we can install the larger desk on the same day as the monitor. Otherwise the earliest date is 20 March, when the neighbouring room is vacated.`,`Please let me know which option you prefer by Friday so that I can book the installers.`],signature:`Sirinya`}],[[`Why did Mr. Delacruz contact the facilities team?`,[`To report broken equipment`,`To request furniture for a new employee`,`To book a meeting room`,`To move his team to another floor`],1,`อีเมลตอบกลับคำขอเรื่องจอที่สองและโต๊ะใหญ่ขึ้นสำหรับนักวิเคราะห์คนใหม่`,[`purpose`]],[`What prevents the desk from being installed immediately?`,[`A budget limit`,`A supplier delay`,`A safety regulation`,`A staff shortage`],2,`กฎความปลอดภัยเรื่องอัคคีภัยไม่อนุญาตให้มีโต๊ะตัวที่เจ็ดหากยังไม่ย้ายตู้เก็บของ`,[`detail`]],[`What is Mr. Delacruz asked to do by Friday?`,[`Choose between two options`,`Approve a purchase order`,`Meet the installers`,`Confirm the new hire’s start date`],0,`ประโยคสุดท้ายขอให้แจ้งภายในวันศุกร์ว่าจะเลือกทางเลือกใด`,[`next-action`]]]),Di(`06`,`Refer to the following online review.`,[{kind:`review`,title:`Northgate Traveler adapter — 3 out of 5 stars`,meta:[{label:`Reviewer`,value:`K. Chaiwat`},{label:`Posted`,value:`19 July`}],body:[`I bought this adapter before a three-week trip through Vietnam, Japan and Germany, and it did save space in my bag. One unit really did replace the three chargers I usually carry.`,`The build quality is good and the folding plugs feel solid after a month of daily use. Charging my laptop and phone at the same time worked without any slowdown.`,`My complaint is the packaging. The box promised a carrying pouch and a printed country guide, and neither was inside. Customer service replied within a day and posted the pouch, but the guide is apparently no longer produced — the website should say so.`,`I would still recommend it to frequent travellers, but the company should update the box before someone else is disappointed.`]}],[[`What did the reviewer like about the product?`,[`Its low price`,`Its packaging`,`Its build quality`,`Its printed guide`],2,`ย่อหน้าที่สองชมว่าวัสดุแข็งแรงและขาปลั๊กพับยังแน่นหลังใช้มาหนึ่งเดือน`,[`detail`]],[`What was missing from the box?`,[`A charging cable`,`A carrying pouch and a country guide`,`A warranty card`,`A replacement plug`],1,`ผู้รีวิวบอกว่ากล่องระบุว่ามีซองใส่และคู่มือประเทศ แต่ไม่มีทั้งสองอย่างอยู่ข้างใน`,[`detail`]],[`What does the reviewer suggest the company do?`,[`Lower the price`,`Improve customer service`,`Correct the product packaging`,`Offer a longer warranty`],2,`ประโยคสุดท้ายบอกว่าบริษัทควรแก้ข้อมูลบนกล่องก่อนที่ลูกค้าคนอื่นจะผิดหวัง และการบริการลูกค้าเขากลับชมว่าตอบเร็ว`,[`inference`]]]),Di(`07`,`Refer to the following schedule.`,[{kind:`schedule`,title:`Regional Logistics Forum — Day 2 (Sala Ballroom)`,body:[`Sessions marked with an asterisk require advance sign-up at the registration desk.`],table:{headers:[`Time`,`Session`,`Speaker`],rows:[[`9:00 – 10:15`,`Cold-chain shipping in tropical climates`,`Dr. Ratana Bunmee`],[`10:30 – 11:45`,`Warehouse automation on a small budget*`,`Hiroshi Tanabe`],[`12:00 – 13:00`,`Lunch (Garden Terrace)`,`—`],[`13:15 – 14:30`,`Customs paperwork after the new rules`,`Fatima Zahra`],[`14:45 – 16:00`,`Panel: hiring and keeping drivers*`,`Four regional operators`]]}}],[[`Which session is about staffing?`,[`The 9:00 session`,`The 10:30 session`,`The 13:15 session`,`The 14:45 session`],3,`เซสชัน 14:45 คือแผงเสวนาเรื่องการจ้างและรักษาคนขับรถ ซึ่งเป็นเรื่องบุคลากร`,[`scanning`]],[`What do the two starred sessions have in common?`,[`They are held after lunch`,`They require advance sign-up`,`They last two hours`,`They are led by doctors`],1,`หมายเหตุใต้หัวข้อบอกว่าเซสชันที่มีเครื่องหมายดอกจันต้องลงชื่อล่วงหน้าที่จุดลงทะเบียน`,[`detail`]],[`Where will lunch be served?`,[`In the Sala Ballroom`,`At the registration desk`,`On the Garden Terrace`,`In the warehouse`],2,`ตารางระบุว่าอาหารกลางวันจัดที่ Garden Terrace`,[`scanning`]]])],ki=[Di(`08`,`Refer to the following e-mail and reply.`,[{kind:`email`,meta:[{label:`To`,value:`events@sathorngardenhotel.co.th`},{label:`From`,value:`p.wongsa@northlinepharma.com`},{label:`Date`,value:`4 May`},{label:`Subject`,value:`Training day, 19 June`}],body:[`Dear Events Team,`,`I am organising a one-day training session for our sales staff on Friday 19 June and would like a quotation.`,`We expect 45 participants. We need a room set up in classroom style, a projector, and morning and afternoon coffee breaks. Lunch should be a buffet with at least two vegetarian main dishes.`,`We would also like the room from 8:00 A.M. so that our trainer can test the equipment before the 9:00 start.`,`Could you confirm whether parking is included for four company cars?`],signature:`Pattarapon Wongsa, Learning & Development`},{kind:`email`,meta:[{label:`To`,value:`p.wongsa@northlinepharma.com`},{label:`From`,value:`events@sathorngardenhotel.co.th`},{label:`Date`,value:`6 May`},{label:`Subject`,value:`RE: Training day, 19 June`}],body:[`Dear Khun Pattarapon,`,`Thank you for your enquiry. The Orchid Room seats 60 in classroom style and is available on 19 June from 7:30 A.M., which gives your trainer extra se
