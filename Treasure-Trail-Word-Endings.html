<style>:root {
  --bg: #FBF4E4; --paper: #FFFDF7; --ink: #2E2419; --mut: #6B5B49; --line: #E5D7BA; --line2: #D4C29E;
  --coral: #E8623D; --teal: #137A7F; --gold: #F2B33D; --leaf: #4E7D3A; --sky: #3D8FB8;
  --good: #2F7A3B; --goodbg: #E3F1DF; --bad: #B8402A; --badbg: #FBE4DC;
  --e-ture: #D2492A; --e-sure: #9C3A1E; --e-tion: #137A7F; --e-sion: #1F5F99; --e-ous: #9A6500; --e-ful: #3E7D2F;
  --r: 14px; --sh: 0 2px 0 var(--line2);
  --head: 'Baloo 2', 'Andika', system-ui, sans-serif; --body: 'Andika', system-ui, sans-serif; --thai: 'Sarabun', 'Andika', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
html.big { font-size: 21px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5; }
#app { min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; outline: none; }
h1, h2, h3 { font-family: var(--head); line-height: 1.15; margin: 0; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.th { font-family: var(--thai); color: var(--mut); font-size: .9em; font-weight: 400; }
html.no-th .th, html.no-th .wth { display: none !important; }
.thmark { font-family: var(--thai); font-weight: 600; font-size: .85em; border: 1.5px solid currentColor; border-radius: 6px; padding: 0 5px; line-height: 1.4; }
.thbtn:not(.on) .thmark { text-decoration: line-through; opacity: .6; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
kbd { font-family: var(--body); }

/* ending colours */
.e-ture { --e: var(--e-ture); } .e-sure { --e: var(--e-sure); } .e-tion { --e: var(--e-tion); }
.e-sion { --e: var(--e-sion); } .e-ous { --e: var(--e-ous); } .e-ful { --e: var(--e-ful); }
b.end { color: var(--e); font-weight: 700; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
.chip { display: inline-block; font-family: var(--head); font-weight: 800; color: #fff; background: var(--e); border-radius: 8px; padding: .02em .45em .0em; letter-spacing: .02em; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; max-width: 1080px; width: 100%; margin: 0 auto; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand > .ic { width: 38px; height: 38px; color: var(--paper); background: var(--ink); border-radius: 50%; padding: 6px; }
.brand b { display: block; font-family: var(--head); font-size: 1.25rem; line-height: 1; }
.brand em { display: block; font-style: normal; color: var(--mut); font-size: .8rem; }

  background-image: radial-gradient(circle at 20% 80%, #CFE6DE 0 18%, transparent 18.5%), radial-gradient(circle at 85% 20%, #CFE6DE 0 14%, transparent 14.5%); }

    book: '<path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/>',
    flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    pencil: '<path d="M15 5l4 4L8 20H4v-4z"/><path d="M13 7l4 4"/>',
    bins: '<path d="M4 8h7v11H4zM13 8h7v11h-7zM4 5h7M13 5h7"/>',
    spell: '<path d="M4 18l4-12 4 12M5.5 14h5M14 18V6h3.5a3 3 0 0 1 0 6H14m0 0h4a3 3 0 0 1 0 6h-4"/>',
    ear: '<path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-5 2"/><path d="M10 10a2 2 0 0 1 4 0"/>',
    text: '<path d="M4 6h16M4 12h10M4 18h13"/>',
    big: '<path d="M4 18L9 6l5 12M5.6 14h6.8M16 11h5M18.5 8.5v5"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    test: '<path d="M8 4h8l2 2v14H6V6z"/><path d="M9 10h6M9 14h6M9 18h3"/>',
    redo: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/>',
  };
  const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

  // ---------- speech (whole words / sentences only)
  const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let voice = null;
  function pickVoice() {
    if (!canSpeak) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find((v) => /en-US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny/i.test(v.name)) || vs.find((v) => /en-US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, rate = 0.85) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/___/g, 'blank'));
      u.lang = 'en-US'; u.rate = rate; if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    } catch { /* ignore */ }
  }
  const sayBtn = (text, label = 'Listen') => canSpeak ? `<button class="say" data-say="${esc(text)}" type="button">${icon('speak')}<span>${label}</span></button>` : '';

  // ---------- helpers
  const ALL = ['ture', 'sure', 'tion', 'sion', 'ous', 'ful'];
  const FAM = Object.fromEntries(D.fams.map((f) => [f.id, f]));
  FAM.mix = { id: 'mix', n: 4, title: 'Mixed review', place: 'Treasure Island', endings: ALL, color: '#2E2419', soft: '#EFE6D3', core: D.fams.flatMap((f) => f.core), extra: [] };
  const famOf = (end) => D.fams.find((f) => f.endings.includes(end));
  const wordHTML = (w) => { const x = W[w]; return `${esc(x.stem)}<b class="end e-${x.end}">${x.end}</b>`; };
  const pic = (w, cls = '') => `<span class="pic ${cls}">${PIC[w] || ''}</span>`;
  const endChip = (e) => `<span class="chip e-${e}">${e}</span>`;
  const ACTS = {
    choose: { t: 'Choose the ending', th: 'ดูภาพ ฟังคำ แล้วเลือกตัวลงท้าย', ic: 'ear' },
    spell: { t: 'Spot the spelling', th: 'เลือกคำที่สะกดถูกต้อง', ic: 'spell' },
    sentence: { t: 'Finish the sentence', th: 'เลือกคำมาเติมประโยคให้สมบูรณ์', ic: 'text' },
    write: { t: 'Write the ending', th: 'พิมพ์ตัวลงท้ายให้ครบคำ', ic: 'pencil' },
    sort: { t: 'Sort the words', th: 'แตะคำ แล้วแตะตะกร้าที่ถูกต้อง', ic: 'bins' },
  };
  const famActs = (f) => (f.id === 'mix' ? ['sort', 'spell', 'sentence'] : ['choose', 'spell', 'sentence', 'write', 'sort']);
  const starsFor = (k) => prog.stars[k] || 0;
  const famStars = (f) => famActs(f).reduce((s, a) => s + starsFor(f.id + '-' + a), 0);
  const starRow = (n, max = 3) => `<span class="stars" aria-label="${n} of ${max} stars">${Array.from({ length: max }, (_, i) => icon('star', i < n ? 'on' : '')).join('')}</span>`;
  const toStars = (sc, tot) => { const r = sc / tot; return r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0; };

  // ---------- state
  let run = null; // practice run
  let test = null; // test run
  let storyPage = 0;

  function makeItems(f, act) {
    const pool = f.core.concat(f.extra);
    const pick = (arr, n) => shuffle(arr).slice(0, n);
    if (act === 'choose') return shuffle(pool.filter((w) => !W[w].noChoose)).map((w) => ({ w, opts: f.endings.slice(), a: f.endings.indexOf(W[w].end) }));
    if (act === 'write') return shuffle(pool).map((w) => ({ w, write: true }));
    if (act === 'spell') return (f.id === 'mix' ? pick(f.core, 8) : shuffle(f.core)).map((w) => { const o = shuffle([w, ...W[w].wrong]); return { w, opts: o, a: o.indexOf(w) }; });
    if (act === 'sentence') return (f.id === 'mix' ? pick(f.core, 8) : shuffle(f.core)).map((w) => { const o = shuffle([w, ...W[w].alt]); return { w, sent: W[w].sent, opts: o, a: o.indexOf(w) }; });
    if (act === 'sort') { const words = f.id === 'mix' ? shuffle(f.core) : shuffle(pool); return [{ sort: true, words, placed: {}, sel: null }]; }
    return [];
  }
  function startRun(fid, act) {
    const f = FAM[fid]; const items = makeItems(f, act);
    const total = act === 'sort' ? items[0].words.length : items.length;
    run = { fid, act, items, i: 0, score: 0, total, picked: null, done: false, ok: null, finished: false, key: fid + '-' + act };
  }
  function startStoryQuiz() {
    const items = D.story.quiz.map((q) => ({ q: q.q, opts: q.o, a: q.a, why: q.why }));
    run = { fid: 'story', act: 'quiz', items, i: 0, score: 0, total: items.length, picked: null, done: false, ok: null, finished: false, key: 'story-quiz' };
  }

  // ---------- routing
  function route() { return (location.hash.replace(/^#\/?/, '') || 'home').split('/'); }
  function go(h) { if (location.hash === h) render(); else location.hash = h; }
  window.addEventListener('hashchange', () => { if (canSpeak) speechSynthesis.cancel(); render(); window.scrollTo(0, 0); });

  function shell(body, { crumb = '' } = {}) {
    return `<header class="top"><a class="brand" href="#/home" aria-label="Treasure Trail home">${icon('compass')}<span><b>Treasure Trail</b><em>Word Endings</em></span></a>
      <nav class="nav"><a href="#/home" class="${crumb === 'home' ? 'cur' : ''}">${icon('home')}<span>Trail</span></a><a href="#/story" class="${crumb === 'story' ? 'cur' : ''}">${icon('book')}<span>Story</span></a><a href="#/tests" class="${crumb === 'tests' ? 'cur' : ''}">${icon('test')}<span>Tests</span></a>
      <button class="bigbtn thbtn ${prog.th ? 'on' : ''}" data-act="th" type="button" aria-pressed="${prog.th}" title="${prog.th ? 'Hide Thai' : 'Show Thai'}"><span class="thmark">ไทย</span><span>${prog.th ? 'Hide Thai' : 'Show Thai'}</span></button>
      <button class="bigbtn ${prog.big ? 'on' : ''}" data-act="big" type="button" aria-pressed="${prog.big}" title="Big screen text">${icon('big')}<span>Big text</span></button></nav></header>
      <main id="main" tabindex="-1">${body}</main>
      <footer class="foot"><span>© Bright EngMath</span><span>Treasure Trail · ture · sure · tion · sion · ous · ful</span></footer>`;
  }

  // ---------- HOME
  function home() {
    const stops = D.fams.map((f) => {
      const st = famStars(f); const max = famActs(f).length * 3;
      return `<li class="stop" style="--c:${f.color};--s:${f.soft}">
        <span class="stopn">${f.n}</span>
        <div class="stopbody"><p class="place">${esc(f.place)}</p><h3>${f.endings.map(endChip).join('<span class="amp">&amp;</span>')}</h3>
          <p class="wordsline">${f.core.map((w) => `<span>${wordHTML(w)}</span>`).join('')}</p>
          <div class="stopfoot"><span class="prog">${icon('star', 'on')} ${st} / ${max}</span><span class="acts"><a class="btn ghost" href="#/learn/${f.id}">${icon('book')}Learn</a><a class="btn" href="#/practice/${f.id}">${icon('pencil')}Practice</a></span></div></div>
        <span class="stoppic">${PIC[f.core[0]]}</span></li>`;
    }).join('');
    const tA = prog.tests.A, tB = prog.tests.B;
    return shell(`<section class="hero">
      <div class="herotext"><p class="kicker">Phonics · Word endings</p><h1>Follow the trail.<br>Find the <span class="hl">treasure</span>.</h1>
        <p class="lead">Learn six word endings, practise with games, read a story and take two tests.</p>
        <p class="th">เรียนรู้ตัวลงท้ายคำ 6 แบบ ฝึกด้วยเกม อ่านนิทาน และทำแบบทดสอบ 2 ชุด</p>
        <div class="endrow">${ALL.map(endChip).join('')}</div>
        <a class="btn big" href="#/learn/ts">Start the trail ${icon('right')}</a></div>
      <div class="heroart" aria-hidden="true"><div class="map"><span class="m1">${PIC.picture}</span><span class="m2">${PIC.station}</span><span class="m3">${PIC.beautiful}</span><span class="m4">${PIC.treasure}</span><svg class="path" viewBox="0 0 300 300" preserveAspectRatio="none"><path d="M60 60 C160 40 250 90 220 140 S70 170 80 230 S200 270 240 250"/></svg><span class="x">✕</span></div></div>
    </section>
    <section class="trail"><h2>The trail <span class="th">เส้นทางการเรียน</span></h2><ol class="stops">${stops}
      <li class="stop" style="--c:#2E2419;--s:#EFE6D3"><span class="stopn">4</span><div class="stopbody"><p class="place">Treasure Island</p><h3 class="plain">Mixed review</h3><p class="wordsline"><span>All 12 words together</span></p>
        <div class="stopfoot"><span class="prog">${icon('star', 'on')} ${famStars(FAM.mix)} / 9</span><span class="acts"><a class="btn" href="#/practice/mix">${icon('pencil')}Practice</a></span></div></div><span class="stoppic">${PIC.treasure}</span></li>
      <li class="stop" style="--c:#3D8FB8;--s:#DCEEF7"><span class="stopn">5</span><div class="stopbody"><p class="place">Story</p><h3 class="plain">${esc(D.story.title)}</h3><p class="wordsline"><span>Read along and answer 5 questions</span></p>
        <div class="stopfoot"><span class="prog">${icon('star', 'on')} ${starsFor('story-quiz')} / 3</span><span class="acts"><a class="btn" href="#/story">${icon('book')}Read</a></span></div></div><span class="stoppic">${PIC.excursion}</span></li>
      <li class="stop" style="--c:#4E7D3A;--s:#E1EED7"><span class="stopn">6</span><div class="stopbody"><p class="place">Final check</p><h3 class="plain">Test A &amp; Test B</h3><p class="wordsline"><span>20 questions each</span></p>
        <div class="stopfoot"><span class="prog">${tA != null ? `A: ${tA}/20` : 'A: –'} · ${tB != null ? `B: ${tB}/20` : 'B: –'}</span><span class="acts"><a class="btn ghost" href="#/test/A">${icon('test')}Test A</a><a class="btn" href="#/test/B">${icon('test')}Test B</a></span></div></div><span class="stoppic">${PIC.competition}</span></li>
    </ol></section>
    <details class="teacher"><summary>Teacher notes <span class="th">สำหรับครู</span></summary><div>
      <p><b>Suggested flow:</b> Learn → Practice (5 games) for each island → Mixed review → Story → Test A. Use Test B later as a retest.</p>
      <p><b>Sounds:</b> ture = /chər/ (picture), sure = /zhər/ (treasure), tion = /shən/ (station), sion = /zhən/ (television). ous and ful are suffixes: ous = having, ful = full of.</p>
      <p><b>Spelling rules:</b> fame → famous (drop e), beauty → beautiful (y → i), ful always has one l.</p>
      <p><b>ไทย / Hide Thai</b> (top right) turns all Thai helper text on or off, for English-only lessons.</p>
      <p><b>Big text</b> (top right) enlarges everything for projectors and Zoom. Keyboard: 1–3 choose, Enter checks or goes next. Progress is saved in this browser only.</p></div></details>`, { crumb: 'home' });
  }

  // ---------- LEARN
  function learn(fid) {
    const f = FAM[fid]; if (!f || fid === 'mix') return go('#/home');
    const cols = f.endings.map((e) => {
      const E = D.endings[e]; const ws = f.core.filter((w) => W[w].end === e);
      return `<section class="endcol"><div class="endhead"><span class="bigend e-${e}">${e}</span><div><p>${E.tip}</p><p class="th">${esc(E.th)}</p></div></div>
        <div class="wcards">${ws.map((w) => `<button class="wcard" type="button" data-say="${w}">${pic(w)}<span class="wword">${wordHTML(w)}</span><span class="wth">${esc(W[w].th)}</span><span class="wsay">${icon('speak')}</span></button>`).join('')}</div></section>`;
    }).join('');
    const math = fid === 'of' ? `<section class="math"><h3>Word math <span class="th">สูตรสร้างคำ</span></h3><div class="mrow">${D.wordMath.map((m) => `<div class="mcard"><p class="eq"><span>${m.base}</span> + <span class="e-${m.end}">${m.end}</span> = <b>${m.word}</b></p><p class="note">${m.note} <span class="th">${m.th}</span></p></div>`).join('')}</div></section>` : '';
    const extra = `<section class="tryit"><h3>Now try these <span class="th">ลองอ่านคำเหล่านี้</span></h3><div class="xrow">${f.extra.map((w) => `<button class="xchip" type="button" data-say="${w}">${pic(w, 'sm')}<span>${wordHTML(w)}</span><em class="th">${esc(W[w].th)}</em></button>`).join('')}</div></section>`;
    const idx = D.fams.indexOf(f);
    return shell(`<div class="band" style="--c:${f.color};--s:${f.soft}"><a class="back" href="#/home">${icon('left')}Trail</a><p class="place">Stop ${f.n} · ${esc(f.place)}</p><h1>${f.endings.map(endChip).join('<span class="amp">&amp;</span>')}</h1><p class="th">แตะการ์ดเพื่อฟังเสียงคำ ${canSpeak ? '' : '(เบราว์เซอร์นี้ไม่รองรับเสียง)'}</p></div>
      <div class="learn" style="--c:${f.color};--s:${f.soft}">${cols}</div>${math}${extra}
      <div class="cta"><a class="btn big" href="#/practice/${f.id}">Practice ${f.title} ${icon('right')}</a>${idx < 2 ? `<a class="btn ghost" href="#/learn/${D.fams[idx + 1].id}">Next island</a>` : ''}</div>`);
  }

  // ---------- PRACTICE HUB
  function practice(fid) {
    const f = FAM[fid]; if (!f) return go('#/home');
    const cards = famActs(f).map((a, i) => { const A = ACTS[a]; const k = f.id + '-' + a; return `<li><a class="actcard" href="#/play/${f.id}/${a}"><span class="actn">${i + 1}</span>${icon(A.ic, 'acti')}<span class="actt"><b>${A.t}</b><em class="th">${A.th}</em></span>${starRow(starsFor(k))}</a></li>`; }).join('');
    return shell(`<div class="band" style="--c:${f.color};--s:${f.soft}"><a class="back" href="#/home">${icon('left')}Trail</a><p class="place">Stop ${f.n} · ${esc(f.place)}</p><h1>${f.id === 'mix' ? 'Mixed review' : f.endings.map(endChip).join('<span class="amp">&amp;</span>')}</h1><p class="th">เลือกเกมฝึก เล่นให้ได้ 3 ดาว</p></div>
      <ol class="actlist" style="--c:${f.color};--s:${f.soft}">${cards}</ol>
      ${f.id !== 'mix' ? `<div class="cta"><a class="btn ghost" href="#/learn/${f.id}">${icon('book')}Review the lesson</a></div>` : ''}`);
  }

  // ---------- PLAY (practice + story quiz)
  function play() {
    const isStory = run.fid === 'story';
    const f = isStory ? { color: '#3D8FB8', soft: '#DCEEF7', title: 'Story quiz', place: D.story.title, endings: [] } : FAM[run.fid];
    const A = isStory ? { t: 'Story quiz', th: 'ตอบคำถามจากนิทาน' } : ACTS[run.act];
    const backHref = isStory ? '#/story' : '#/practice/' + run.fid;
    const head = `<div class="playhead" style="--c:${f.color};--s:${f.soft}"><a class="back" href="${backHref}">${icon('left')}${isStory ? 'Story' : esc(f.title)}</a><div><h1>${A.t}</h1><p class="th">${A.th}</p></div>
      <div class="meter"><span>${run.finished ? run.total : run.act === 'sort' ? Object.keys(run.items[0].placed).length : run.i + (run.done ? 1 : 0)} / ${run.total}</span><span class="bar"><i style="width:${(100 * (run.finished ? run.total : run.act === 'sort' ? Object.keys(run.items[0].placed).length : run.i + (run.done ? 1 : 0))) / run.total}%"></i></span><span class="sc">${icon('check')} ${run.score}</span></div></div>`;
    if (run.finished) {
      const st = toStars(run.score, run.total);
      const nextA = isStory ? null : famActs(f)[famActs(f).indexOf(run.act) + 1];
      return shell(`${head}<section class="done" style="--c:${f.color};--s:${f.soft}">${starRow(st)}<h2>${run.score} out of ${run.total}</h2><p>${st === 3 ? 'Brilliant! You found the treasure.' : st === 2 ? 'Great work! One more try for 3 stars?' : 'Good start. Try again to collect more stars.'}</p>
        <p class="th">${st === 3 ? 'เก่งมาก! ได้ 3 ดาวแล้ว' : 'ลองอีกครั้งเพื่อเก็บดาวให้ครบ'}</p>
        <div class="cta"><button class="btn ghost" data-act="again" type="button">${icon('redo')}Try again</button>${nextA ? `<a class="btn" href="#/play/${run.fid}/${nextA}">Next: ${ACTS[nextA].t} ${icon('right')}</a>` : `<a class="btn" href="${isStory ? '#/tests' : '#/home'}">${isStory ? 'Go to the tests' : 'Back to the trail'} ${icon('right')}</a>`}</div></section>`);
    }
    const it = run.items[run.i];
    if (it.sort) return shell(head + sortView(it, f));
    let prompt, body;
    if (it.write) {
      const x = W[it.w];
      prompt = `<div class="qpic">${pic(it.w, 'lg')}${sayBtn(it.w)}</div><p class="qword">${esc(x.stem)}<input id="wr" class="wr" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="6" aria-label="Type the ending" ${run.done ? 'disabled' : ''} value="${run.done ? esc(run.typed || '') : ''}"></p><p class="hint">Endings: ${f.endings.map(endChip).join(' ')}</p>`;
      body = run.done ? '' : `<div class="cta"><button class="btn big" data-act="checkwrite" type="button">Check answer</button></div>`;
    } else {
      if (it.q) prompt = `<p class="qtext">${esc(it.q)}</p>`;
      else if (it.sent) prompt = `<div class="qpic sm">${pic(it.w)}</div><p class="qtext">${esc(it.sent).replace('___', '<span class="blank">' + (run.done ? esc(it.opts[it.a]) : '') + '</span>')}</p>${sayBtn(it.sent.replace('___', 'blank'), 'Read')}`;
      else if (run.act === 'spell') prompt = `<div class="qpic">${pic(it.w, 'lg')}${sayBtn(it.w)}</div><p class="qtext">Which spelling is correct?</p>`;
      else { const x = W[it.w]; prompt = `<div class="qpic">${pic(it.w, 'lg')}${sayBtn(it.w)}</div><p class="qword">${esc(x.stem)}<span class="slot ${run.done ? 'e-' + x.end : ''}">${run.done ? x.end : ''}</span></p>`; }
      body = `<div class="opts n${it.opts.length} ${run.act === 'choose' ? 'endopts' : ''}">${it.opts.map((o, k) => {
        const cls = run.done ? (k === it.a ? 'right' : k === run.picked ? 'wrong' : 'dim') : '';
        return `<button class="opt ${run.act === 'choose' ? 'e-' + o : ''} ${cls}" data-k="${k}" type="button" ${run.done ? 'disabled' : ''}><kbd>${k + 1}</kbd><span>${esc(o)}</span>${run.done && k === it.a ? icon('check', 'mark') : run.done && k === run.picked ? icon('x', 'mark') : ''}</button>`;
      }).join('')}</div>`;
    }
    return shell(`${head}<section class="qcard" style="--c:${f.color};--s:${f.soft}">${prompt}${body}${run.done ? feedback(it) : ''}</section>`);
  }
  function feedback(it) {
    let msg;
    if (it.why) msg = it.why;
    else { const x = W[it.w]; msg = `${esc(x.stem)} + <b class="e-${x.end}">${x.end}</b> = <b>${it.w}</b>. ${D.endings[x.end].tip}`; }
    return `<div class="feedback ${run.ok ? 'good' : 'bad'}" role="status">${icon(run.ok ? 'check' : 'x', 'fbi')}<div><p class="fbt">${run.ok ? 'Yes! Well done.' : `Not quite. The answer is <b>${esc(it.write ? W[it.w].end : it.opts[it.a])}</b>.`}</p><p>${msg}</p></div></div>
      <div class="cta"><button class="btn big" id="next" data-act="next" type="button">${run.i + 1 < run.items.length ? 'Next' : 'Finish'} ${icon('right')}</button></div>`;
  }
  function sortView(it, f) {
    const checked = run.done;
    const chips = it.words.filter((w) => !it.placed[w]).map((w) => `<button class="schip ${it.sel === w ? 'sel' : ''}" data-sw="${w}" type="button" aria-pressed="${it.sel === w}">${pic(w, 'xs')}<span>${w}</span></button>`).join('');
    const bins = f.endings.map((e) => {
      const inBin = it.words.filter((w) => it.placed[w] === e);
      return `<div class="bin e-${e}" ><button class="binhead" data-bin="${e}" type="button" ${checked ? 'disabled' : ''}>${endChip(e)}<span class="binhint">${it.sel ? 'Tap to drop here' : ''}</span></button>
        <ul>${inBin.map((w) => { const ok = W[w].end === e; return `<li class="${checked ? (ok ? 'right' : 'wrong') : ''}"><button class="placed" data-unplace="${w}" type="button" ${checked ? 'disabled' : ''}>${checked ? icon(ok ? 'check' : 'x', 'mark') : ''}<span>${checked ? wordHTML(w) : w}</span></button>${checked && !ok ? `<em>→ ${W[w].end}</em>` : ''}</li>`; }).join('')}</ul></div>`;
    }).join('');
    const all = it.words.every((w) => it.placed[w]);
    return `<section class="sortbox" style="--c:${f.color};--s:${f.soft}"><p class="qtext sm">${it.sel ? `Now tap the basket for <b>${it.sel}</b>.` : 'Tap a word, then tap its ending basket. Tap a placed word to take it back.'}</p>
      <div class="pool">${chips || (checked ? '' : '<span class="empty">All words are in baskets. Press Check.</span>')}</div>
      <div class="bins n${f.endings.length}">${bins}</div>
      ${checked ? `<div class="feedback ${run.score === run.total ? 'good' : 'bad'}" role="status">${icon(run.score === run.total ? 'check' : 'x', 'fbi')}<div><p class="fbt">${run.score} of ${run.total} words in the right basket.</p><p>Look at the ending of each word: the last letters tell you the basket.</p></div></div><div class="cta"><button class="btn big" id="next" data-act="next" type="button">Finish ${icon('right')}</button></div>`
        : `<div class="cta"><button class="btn big" data-act="checksort" type="button" ${all ? '' : 'disabled'}>Check answer</button></div>`}</section>`;
  }
  function answer(k) {
    if (!run || run.done || run.finished) return;
    const it = run.items[run.i]; if (it.sort || it.write) return;
    run.picked = k; run.done = true; run.ok = k === it.a; if (run.ok) run.score++;
    if (it.w && run.act !== 'sentence') speak(it.w);
    render(); focusNext();
  }
  function checkWrite() {
    const it = run.items[run.i]; const el = document.getElementById('wr'); if (!el) return;
    const v = el.value.trim().toLowerCase();
    if (!v) { el.focus(); el.classList.add('shake'); return; }
    run.typed = v; run.done = true; run.ok = v === W[it.w].end || v === it.w; if (run.ok) run.score++;
    speak(it.w); render(); focusNext();
  }
  function next() {
    if (!run) return;
    if (run.i + 1 < run.items.length && !run.items[0].sort) { run.i++; run.done = false; run.picked = null; run.ok = null; run.typed = ''; render(); const wr = document.getElementById('wr'); if (wr) wr.focus(); }
    else { run.finished = true; prog.stars[run.key] = Math.max(starsFor(run.key), toStars(run.score, run.total)); save(); render(); }
  }
  const focusNext = () => { const n = document.getElementById('next'); if (n) n.focus({ preventScroll: true }); };

  // ---------- STORY
  const storyRe = new RegExp('\\b(' + Object.keys(W).join('|') + ')\\b', 'gi');
  function story() {
    const S = D.story; const p = S.pages[storyPage]; const last = storyPage === S.pages.length - 1;
    const text = esc(p.text).replace(storyRe, (m) => { const w = m.toLowerCase(); const x = W[w]; const cap = m[0] !== w[0]; const st = cap ? x.stem[0].toUpperCase() + x.stem.slice(1) : x.stem; return `<button class="sw" type="button" data-say="${w}">${esc(st)}<b class="end e-${x.end}">${x.end}</b></button>`; });
    return shell(`<div class="band" style="--c:#3D8FB8;--s:#DCEEF7"><a class="back" href="#/home">${icon('left')}Trail</a><p class="place">Story · Read along</p><h1 class="plain">${esc(S.title)}</h1><p class="th">อ่านตาม แตะคำที่มีสีเพื่อฟังเสียง</p></div>
      <section class="storybox"><div class="scene">${p.pics.map((w) => pic(w)).join('')}</div>
        <p class="pageno">Page ${storyPage + 1} of ${S.pages.length}</p><p class="stext">${text}</p>
        <div class="storyctl">${sayBtn(p.text, 'Read to me')}</div>
        <div class="cta between"><button class="btn ghost" data-act="sprev" type="button" ${storyPage === 0 ? 'disabled' : ''}>${icon('left')}Back</button>
        ${last ? `<button class="btn big" data-act="squiz" type="button">Story quiz ${icon('right')}</button>` : `<button class="btn big" data-act="snext" type="button">Next page ${icon('right')}</button>`}</div>
        <div class="dots">${S.pages.map((_, i) => `<span class="${i === storyPage ? 'on' : ''}"></span>`).join('')}</div></section>`, { crumb: 'story' });
  }

  // ---------- TESTS
  function tests() {
    const card = (id) => { const T = D.tests[id]; const best = prog.tests[id]; return `<li class="tcard"><h2>${T.title}</h2><p>20 questions · 5 parts</p><ul>${Object.values(D.parts).map((p, i) => `<li>Part ${i + 1}: ${p.en}</li>`).join('')}</ul><p class="best">${best != null ? `Best score: <b>${best} / 20</b>` : 'Not taken yet'}</p><a class="btn big" href="#/test/${id}">Start ${T.title} ${icon('right')}</a></li>`; };
    return shell(`<div class="band" style="--c:#4E7D3A;--s:#E1EED7"><a class="back" href="#/home">${icon('left')}Trail</a><p class="place">Final check</p><h1 class="plain">Tests</h1><p class="th">แบบทดสอบ 2 ชุด ชุดละ 20 ข้อ ใช้ชุด B สำหรับสอบซ้ำได้</p></div><ul class="tcards">${card('A')}${card('B')}</ul>`, { crumb: 'tests' });
  }
  function testIntro(id) {
    const T = D.tests[id]; if (!T) return go('#/tests');
    return shell(`<div class="band" style="--c:#4E7D3A;--s:#E1EED7"><a class="back" href="#/tests">${icon('left')}Tests</a><p class="place">Final check</p><h1 class="plain">${T.title}</h1></div>
      <section class="qcard intro"><h2>Before you start</h2><ul class="rules"><li>There are <b>20 questions</b> in 5 parts.</li><li>Choose one answer for each question. You can go back and change answers.</li><li>There are no hints. Your score shows at the end.</li></ul><p class="th">มี 20 ข้อ เลือกคำตอบข้อละ 1 คำตอบ ย้อนกลับไปแก้ได้ คะแนนจะแสดงตอนจบ</p>
      <div class="cta"><button class="btn big" data-act="tstart" data-id="${id}" type="button">Start ${T.title} ${icon('right')}</button></div></section>`, { crumb: 'tests' });
  }
  function testQ() {
    const T = D.tests[test.id]; const it = T.items[test.i]; const P = D.parts[it.p];
    let prompt = '';
    if (it.t === 'end') { const x = W[it.w]; prompt = `<div class="qpic">${pic(it.w, 'lg')}${sayBtn(it.w)}</div><p class="qword">${esc(x.stem)}<span class="slot"></span></p>`; }
    else if (it.t === 'spell') prompt = `<div class="qpic">${pic(it.w, 'lg')}${sayBtn(it.w)}</div><p class="qtext">Which spelling is correct?</p>`;
    else if (it.t === 'fill') prompt = `<p class="qtext">${esc(it.q).replace('___', '<span class="blank">' + (test.ans[test.i] != null ? esc(it.o[test.ans[test.i]]) : '') + '</span>')}</p>`;
    else if (it.t === 'read') prompt = `<div class="passage"><p class="plabel">Read</p><p>${esc(T.passage)}</p>${sayBtn(T.passage, 'Read to me')}</div><p class="qtext">${esc(it.q)}</p>`;
    else prompt = `<p class="qtext">${esc(it.q)}</p>`;
    const answered = test.ans.filter((a) => a != null).length; const last = test.i === T.items.length - 1;
    const missing = test.ans.map((a, i) => (a == null ? i + 1 : null)).filter(Boolean);
    return shell(`<div class="playhead" style="--c:#4E7D3A;--s:#E1EED7"><a class="back" href="#/tests">${icon('left')}Tests</a><div><h1>${T.title} · Part ${it.p}</h1><p>${P.en} <span class="th">${P.th}</span></p></div>
      <div class="meter"><span>Question ${test.i + 1} / 20</span><span class="bar"><i style="width:${(answered / 20) * 100}%"></i></span><span class="sc">${answered} answered</span></div></div>
      <section class="qcard test" style="--c:#4E7D3A;--s:#E1EED7"><p class="qnum">${test.i + 1}.</p>${prompt}
        <div class="opts n3 ${it.t === 'end' ? 'endopts' : ''}">${it.o.map((o, k) => `<button class="opt ${it.t === 'end' ? 'e-' + o : ''} ${test.ans[test.i] === k ? 'sel' : ''}" data-tk="${k}" type="button" aria-pressed="${test.ans[test.i] === k}"><kbd>${'abc'[k]}</kbd><span>${esc(o)}</span></button>`).join('')}</div>
        ${test.warn && missing.length ? `<div class="feedback bad" role="alert">${icon('x', 'fbi')}<div><p class="fbt">${missing.length} question${missing.length > 1 ? 's are' : ' is'} not answered yet: ${missing.map((n) => `<button class="link" data-goto="${n - 1}" type="button">${n}</button>`).join(', ')}</p><p>Answer them, or finish anyway.</p></div></div>` : ''}
        <div class="cta between"><button class="btn ghost" data-act="tprev" type="button" ${test.i === 0 ? 'disabled' : ''}>${icon('left')}Back</button>
        ${last ? `<span class="row">${test.warn && missing.length ? `<button class="btn ghost" data-act="tforce" type="button">Finish anyway</button>` : ''}<button class="btn big" id="next" data-act="tfinish" type="button">Finish ${icon('check')}</button></span>` : `<button class="btn big" id="next" data-act="tnext" type="button">Next ${icon('right')}</button>`}</div>
        <div class="qmap" aria-label="Question map">${T.items.map((_, i) => `<button class="${i === test.i ? 'cur' : ''} ${test.ans[i] != null ? 'ans' : ''}" data-goto="${i}" type="button" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div></section>`, { crumb: 'tests' });
  }
  function testResult() {
    const T = D.tests[test.id];
    const score = T.items.reduce((s, it, i) => s + (test.ans[i] === it.a ? 1 : 0), 0);
    const parts = Object.keys(D.parts).map((p) => { const its = T.items.map((it, i) => [it, i]).filter(([it]) => String(it.p) === p); return `<tr><td>Part ${p}</td><td>${D.parts[p].en}</td><td><b>${its.filter(([it, i]) => test.ans[i] === it.a).length}</b> / ${its.length}</td></tr>`; }).join('');
    const rev = T.items.map((it, i) => {
      const ok = test.ans[i] === it.a; const q = it.t === 'end' ? `Choose the ending: ${W[it.w].stem} ___` : it.t === 'spell' ? 'Which spelling is correct? (picture question)' : it.q;
      return `<li class="${ok ? 'right' : 'wrong'}">${icon(ok ? 'check' : 'x', 'mark')}<div><p><b>${i + 1}.</b> ${esc(q)}</p><p class="ra">Your answer: <b>${test.ans[i] != null ? esc(it.o[test.ans[i]]) : '—'}</b>${ok ? '' : ` · Correct: <b>${esc(it.o[it.a])}</b>`}</p><p class="why">${esc(it.why)}</p></div></li>`;
    }).join('');
    const pct = Math.round((score / 20) * 100);
    return shell(`<div class="band" style="--c:#4E7D3A;--s:#E1EED7"><a class="back" href="#/tests">${icon('left')}Tests</a><p class="place">${T.title} · Results</p><h1 class="plain">${score} / 20</h1><p class="th">${pct}% · ${pct >= 80 ? 'ยอดเยี่ยม!' : pct >= 60 ? 'ดีมาก ทบทวนข้อที่ผิดอีกนิด' : 'ทบทวนบทเรียนแล้วลองใหม่'}</p></div>
      <section class="results"><table class="ptable"><thead><tr><th>Part</th><th>Skill</th><th>Score</th></tr></thead><tbody>${parts}</tbody></table>
      <div class="cta"><button class="btn ghost" data-act="tretry" type="button">${icon('redo')}Try again</button><a class="btn" href="#/test/${test.id === 'A' ? 'B' : 'A'}">Take ${test.id === 'A' ? 'Test B' : 'Test A'}</a><a class="btn ghost" href="#/home">Trail</a></div>
      <h2>Check your answers <span class="th">ตรวจคำตอบ</span></h2><ol class="review">${rev}</ol></section>`, { crumb: 'tests' });
  }

  // ---------- render
  function render() {
    document.documentElement.classList.toggle('big', !!prog.big);
    document.documentElement.classList.toggle('no-th', !prog.th);
    const [r, a, b] = route();
    let html;
    if (r === 'learn') html = learn(a);
    else if (r === 'practice') html = practice(a);
    else if (r === 'play') { if (!FAM[a] || !ACTS[b] || !famActs(FAM[a]).includes(b)) return go('#/home'); if (!run || run.key !== a + '-' + b) startRun(a, b); html = play(); }
    else if (r === 'story' && a === 'quiz') { if (!run || run.key !== 'story-quiz') startStoryQuiz(); html = play(); }
    else if (r === 'story') { html = story(); }
    else if (r === 'tests') html = tests();
    else if (r === 'test') {
      if (!D.tests[a]) return go('#/tests');
      if (b === 'q' && test && test.id === a && !test.finished) html = testQ();
      else if (b === 'result' && test && test.id === a && test.finished) html = testResult();
      else html = testIntro(a);
    } else html = home();
    if (html === undefined) return;
    app.innerHTML = html;
    if (r !== 'play' && !(r === 'story' && a === 'quiz')) run = r === 'practice' || r === 'learn' || r === 'home' ? null : run;
  }

  // ---------- events
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a'); if (!t) return;
    if (t.dataset.say) { speak(t.dataset.say); }
    if (t.dataset.k != null && run) return answer(+t.dataset.k);
    if (t.dataset.tk != null && test) { test.ans[test.i] = +t.dataset.tk; render(); return; }
    if (t.dataset.goto != null && test) { test.i = +t.dataset.goto; render(); return; }
    if (t.dataset.sw && run) { const it = run.items[0]; it.sel = it.sel === t.dataset.sw ? null : t.dataset.sw; speak(t.dataset.sw); render(); return; }
    if (t.dataset.bin && run) { const it = run.items[0]; if (it.sel) { it.placed[it.sel] = t.dataset.bin; it.sel = null; render(); } return; }
    if (t.dataset.unplace && run && !run.done) { const it = run.items[0]; delete it.placed[t.dataset.unplace]; it.sel = t.dataset.unplace; render(); return; }
    const act = t.dataset.act; if (!act) return;
    if (act === 'big') { prog.big = !prog.big; save(); render(); }
    else if (act === 'th') { prog.th = !prog.th; save(); render(); }
    else if (act === 'next') next();
    else if (act === 'checkwrite') checkWrite();
    else if (act === 'checksort') { const it = run.items[0]; run.done = true; run.score = it.words.filter((w) => it.placed[w] === W[w].end).length; run.ok = run.score === run.total; render(); focusNext(); }
    else if (act === 'again') { if (run.fid === 'story') startStoryQuiz(); else startRun(run.fid, run.act); render(); }
    else if (act === 'snext') { storyPage = Math.min(storyPage + 1, D.story.pages.length - 1); render(); }
    else if (act === 'sprev') { storyPage = Math.max(storyPage - 1, 0); render(); }
    else if (act === 'squiz') { startStoryQuiz(); go('#/story/quiz'); }
    else if (act === 'tstart') { test = { id: t.dataset.id, ans: Array(20).fill(null), i: 0, finished: false, warn: false }; go(`#/test/${t.dataset.id}/q`); }
    else if (act === 'tnext') { test.i++; render(); }
    else if (act === 'tprev') { test.i = Math.max(0, test.i - 1); render(); }
    else if (act === 'tfinish' || act === 'tforce') {
      if (act === 'tfinish' && test.ans.some((x) => x == null)) { test.warn = true; render(); return; }
      test.finished = true; const T = D.tests[test.id]; const sc = T.items.reduce((s, it, i) => s + (test.ans[i] === it.a ? 1 : 0), 0);
      prog.tests[test.id] = Math.max(prog.tests[test.id] ?? 0, sc); save(); go(`#/test/${test.id}/result`);
    } else if (act === 'tretry') { const id = test.id; test = { id, ans: Array(20).fill(null), i: 0, finished: false, warn: false }; go(`#/test/${id}/q`); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'wr' && e.key === 'Enter') { e.preventDefault(); if (run && !run.done) checkWrite(); return; }
    if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const [r, , b] = route();
    const n = parseInt(e.key, 10);
    if ((r === 'play' || r === 'story') && run && !run.finished && !run.done && n >= 1 && n <= 3) { const it = run.items[run.i]; if (it.opts && n <= it.opts.length) { e.preventDefault(); answer(n - 1); } }
    else if (r === 'test' && b === 'q' && test && /^[abc1-3]$/i.test(e.key)) { const k = /[1-3]/.test(e.key) ? n - 1 : 'abc'.indexOf(e.key.toLowerCase()); test.ans[test.i] = k; render(); }
  });

  window.__tt = { state: () => ({ run, test, storyPage, prog }), data: D, start: startRun };
  render();
})();
</script>
</body>
</html>
