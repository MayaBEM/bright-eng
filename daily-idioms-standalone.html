 up the missed deadline too?`,speakerB:`No, don't add fuel to the fire, let's talk about that later.`},commonMistake:`It describes making a conflict worse, not literally starting a fire or a new argument from scratch — pair it with 'to' the fire, not 'on'.`,similarExpressions:[`Pour gasoline on the fire`,`Make matters worse`],icon:`flame`},{id:75,idiom:`The last straw.`,pronunciation:`de last straw`,category:`problems`,level:`B1`,englishMeaning:`The final small problem in a series of problems that finally makes someone lose patience completely.`,thaiMeaning:`ฟางเส้นสุดท้าย / สิ่งสุดท้ายที่ทำให้ทนไม่ไหว`,literalMeaning:`ฟางเส้นสุดท้ายที่ทำให้หลังอูฐหัก`,usage:`Use this when describing the specific moment or event that ends someone's tolerance after many smaller frustrations.`,formality:`neutral`,examples:[{english:`He was late again today, and that was the last straw — she finally reported him.`,thai:`วันนี้เขามาสายอีกแล้ว และนั่นคือฟางเส้นสุดท้ายที่ทำให้เธอทนไม่ไหวจนต้องรายงานเรื่องนี้`},{english:`The third broken promise was the last straw for their friendship.`,thai:`คำสัญญาที่ผิดครั้งที่สามคือฟางเส้นสุดท้ายที่ทำให้มิตรภาพของพวกเขาจบลง`}],dialogue:{speakerA:`Why did you finally quit that job?`,speakerB:`They cancelled my vacation with no notice — that was the last straw.`},commonMistake:`Always use it with 'the', as in 'the last straw' — dropping the article makes it sound unnatural in English.`,similarExpressions:[`The final straw`,`That does it`],icon:`warning`},{id:76,idiom:`Out of the frying pan and into the fire.`,pronunciation:`owt ov de fry-ing pan and in-too de fy-er`,category:`problems`,level:`B1`,englishMeaning:`To escape one bad situation only to end up in an even worse one.`,thaiMeaning:`หนีปัญหาหนึ่งไปเจอปัญหาที่หนักกว่า`,literalMeaning:`กระโดดออกจากกระทะทอดไปตกลงในกองไฟ`,usage:`Use this to describe a decision or escape that unexpectedly made things worse rather than better.`,formality:`neutral`,examples:[{english:`She left her strict boss for a new job, but it was out of the frying pan and into the fire — the new one is worse.`,thai:`เธอลาออกจากเจ้านายเข้มงวดไปทำงานใหม่ แต่กลับหนีเสือปะจระเข้ เพราะที่ใหม่แย่กว่าเดิม`},{english:`Switching flights to avoid the storm put us out of the frying pan and into the fire when we got stuck in an even bigger delay.`,thai:`การเปลี่ยนเที่ยวบินเพื่อหนีพายุกลับกลายเป็นหนีเสือปะจระเข้ เพราะเราติดอยู่กับความล่าช้าที่หนักกว่าเดิม`}],dialogue:{speakerA:`How's the new apartment away from your noisy neighbors?`,speakerB:`Honestly, it's out of the frying pan and into the fire — now there's construction outside every morning.`},commonMistake:`This idiom requires both halves together as one fixed phrase — do not shorten it to just "frying pan" or split it apart, or the meaning gets lost.`,similarExpressions:[`Jump from the frying pan into the fire`,`From bad to worse`],icon:`flame`},{id:77,idiom:`A tough nut to crack.`,pronunciation:`a tuf nut too krak`,category:`problems`,level:`B1`,englishMeaning:`A problem that is very difficult to solve, or a person who is very difficult to understand or convince.`,thaiMeaning:`ปัญหาหรือคนที่รับมือได้ยาก`,literalMeaning:`ถั่วเปลือกแข็งที่ผ่าให้แตกได้ยาก`,usage:`Use this when talking about a stubborn person, a tricky puzzle, or a persistent problem that resists easy solutions.`,formality:`neutral`,examples:[{english:`This math problem is a tough nut to crack; I've tried five different methods already.`,thai:`โจทย์คณิตศาสตร์ข้อนี้ยากมาก ฉันลองมาแล้วห้าวิธียังแก้ไม่ได้เลย`},{english:`The new client is a tough nut to crack — he rejects every proposal we send.`,thai:`ลูกค้าใหม่คนนี้รับมือยากมาก เขาปฏิเสธข้อเสนอทุกอย่างที่เราส่งไป`}],dialogue:{speakerA:`Did you convince him to sign the contract yet?`,speakerB:`Not yet, he's a tough nut to crack — I've had three meetings and he still won't commit.`},commonMistake:`It describes something hard to solve or someone hard to persuade — do not use it simply to mean a person is unfriendly or rude.`,similarExpressions:[`A hard nut to crack`,`A tricky customer`],icon:`brain`},{id:78,idiom:`Weather the storm.`,pronunciation:`wed-er de storm`,category:`problems`,level:`B1`,englishMeaning:`To survive and get through a difficult or dangerous period without giving up.`,thaiMeaning:`ผ่านพ้นช่วงเวลาที่ยากลำบาก`,literalMeaning:`ฝ่าฟันพายุจนผ่านพ้นไปได้`,usage:`Use this when talking about enduring a prolonged hardship, like a crisis, recession, or personal difficulty, until it passes.`,formality:`formal`,examples:[{english:`The small bakery managed to weather the storm during the economic downturn.`,thai:`ร้านเบเกอรี่เล็ก ๆ ร้านนั้นสามารถฝ่าฟันช่วงเศรษฐกิจตกต่ำจนผ่านพ้นมาได้`},{english:`Our marriage had to weather the storm of his job loss, but we came out stronger.`,thai:`ชีวิตแต่งงานของเราต้องผ่านพ้นช่วงที่เขาตกงานมาได้ และกลับแข็งแกร่งขึ้นกว่าเดิม`}],dialogue:{speakerA:`How is the company holding up after losing its biggest client?`,speakerB:`It's tough, but we're weathering the storm by cutting costs and focusing on new markets.`},commonMistake:`This implies actively enduring and surviving hardship over time — it is not the right phrase for a single sudden bad event that ends quickly.`,similarExpressions:[`Ride out the storm`,`Get through the rough patch`],icon:`storm`},{id:79,idiom:`Learn the hard way.`,pronunciation:`lern de hard way`,category:`problems`,level:`A2`,englishMeaning:`To learn something important only after making a mistake or suffering a bad experience, instead of being taught directly.`,thaiMeaning:`เรียนรู้จากประสบการณ์ที่เจ็บปวด`,literalMeaning:null,usage:`Use this when someone had to make a costly mistake themselves before understanding a lesson that others tried to warn them about.`,formality:`neutral`,examples:[{english:`You'll learn the hard way that you should always back up your files before an update.`,thai:`เธอจะได้เรียนรู้จากความเจ็บปวดว่าควรสำรองข้อมูลไว้ก่อนอัปเดตทุกครั้ง`},{english:`He had to learn the hard way not to trust every online seller after losing his deposit.`,thai:`เขาต้องเรียนรู้จากประสบการณ์อันเจ็บปวดว่าอย่าเชื่อผู้ขายออนไลน์ทุกคน หลังจากเสียเงินมัดจำไป`}],dialogue:{speakerA:`Why didn't you sign up for travel insurance this time?`,speakerB:`I learned the hard way last year when I had to pay for a cancelled flight myself.`},commonMistake:`It focuses on learning through a personal, often painful mistake — it does not simply mean learning something that is difficult or complicated.`,similarExpressions:[`Learn by experience`,`Live and learn`],icon:`book`},{id:80,idiom:`Every cloud has a silver lining.`,pronunciation:`ev-ree klowd haz a sil-ver ly-ning`,category:`problems`,level:`B1`,englishMeaning:`Even the worst situations usually have some small positive side, if you look for it.`,thaiMeaning:`ในเรื่องร้ายยังมีสิ่งดีซ่อนอยู่`,literalMeaning:`เมฆทุกก้อนมีขอบสีเงินซ่อนอยู่`,usage:`Use this to offer general optimism or comfort about a difficult situation, reminding someone that good can come from bad.`,formality:`formal`,examples:[{english:`I know the surgery was scary, but every cloud has a silver lining — you'll finally be pain-free.`,thai:`ฉันรู้ว่าการผ่าตัดน่ากลัว แต่ในเรื่องร้ายก็ยังมีสิ่งดีซ่อนอยู่ อย่างน้อยเธอก็จะหายปวดสักที`},{english:`The factory closed down, but every cloud has a silver lining, and many workers found better-paying jobs.`,thai:`โรงงานปิดตัวลงก็จริง แต่ในเรื่องร้ายยังมีสิ่งดีซ่อนอยู่ คนงานหลายคนได้งานใหม่ที่จ่ายดีกว่าเดิม`}],dialogue:{speakerA:`I'm so upset the trip got cancelled because of the weather.`,speakerB:`I know, but every cloud has a silver lining — now we have extra time to plan a better one.`},commonMistake:`This is a general, often proverbial statement about optimism in life — it sounds unnatural when applied to a very specific tiny inconvenience, like a delayed text message.`,similarExpressions:[`A blessing in disguise`,`Look on the bright side`],icon:`sun`}],Xn=[{id:81,idiom:`Break the ice.`,pronunciation:`breik dhuh ais`,category:`friendship`,level:`A2`,englishMeaning:`To say or do something that makes people feel more relaxed when they first meet.`,thaiMeaning:`เริ่มบทสนทนาเพื่อลดความเกร็ง`,literalMeaning:`ทุบน้ำแข็ง (ทำให้บรรยากาศที่แข็งทื่อละลาย)`,usage:`Use this when you want to start a conversation with strangers or ease tension in a new group.`,formality:`casual`,examples:[{english:`The manager told a joke to break the ice before the meeting started.`,thai:`ผู้จัดการเล่ามุกตลกเพื่อเริ่มบทสนทนาให้ทุกคนรู้สึกผ่อนคลายก่อนเริ่มประชุม`},{english:`At the party, she played a fun game to break the ice among the new students.`,thai:`ในงานปาร์ตี้ เธอเล่นเกมสนุกๆ เพื่อลดความเกร็งในหมู่นักเรียนใหม่`}],dialogue:{speakerA:`Everyone seems so quiet and nervous at this networking event.`,speakerB:`Let's break the ice by asking people about their weekend plans.`},commonMistake:`Remember to keep the article 'the' — it's 'break THE ice,' not 'break ice.' Also note the past tense is 'broke the ice,' not 'breaked.'`,similarExpressions:[`warm up the crowd`,`get the ball rolling`],icon:`spark`},{id:82,idiom:`Get along.`,pronunciation:`get uh-long`,category:`friendship`,level:`A2`,englishMeaning:`To have a friendly, easy relationship with someone day to day.`,thaiMeaning:`เข้ากันได้ดี`,literalMeaning:null,usage:`Use this to describe two or more people who have a comfortable, friendly relationship.`,formality:`neutral`,examples:[{english:`My sister and I didn't get along when we were kids, but now we're best friends.`,thai:`ตอนเด็กๆ ฉันกับพี่สาวเข้ากันไม่ค่อยได้ แต่ตอนนี้เรากลายเป็นเพื่อนสนิทกันแล้ว`},{english:`New coworkers usually need a few weeks to get along with the rest of the team.`,thai:`พนักงานใหม่มักต้องใช้เวลาสักสองสามสัปดาห์กว่าจะเข้ากับทีมที่เหลือได้ดี`}],dialogue:{speakerA:`How are you and your new roommate doing?`,speakerB:`Really well, actually — we get along better than I expected.`},commonMistake:`Don't forget the preposition 'with' when naming the other person — say 'get along WITH someone,' not just 'get along someone.'`,similarExpressions:[`hit it off`,`be on good terms`],icon:`smile`},{id:83,idiom:`See eye to eye.`,pronunciation:`see ai tuh ai`,category:`friendship`,level:`B1`,englishMeaning:`To agree with someone about something, especially after discussing it.`,thaiMeaning:`มีความคิดเห็นตรงกัน`,literalMeaning:`มองตาต่อตา (สบตากันตรงระดับเดียวกัน)`,usage:`Use this when two people finally agree on an opinion or decision, often after some disagreement.`,formality:`neutral`,examples:[{english:`My dad and I don't always see eye to eye on politics, but we still respect each other.`,thai:`พ่อกับฉันไม่ค่อยมีความเห็นตรงกันเรื่องการเมือง แต่เราก็ยังเคารพกันและกัน`},{english:`After a long discussion, the two business partners finally started to see eye to eye on the budget.`,thai:`หลังจากคุยกันนาน หุ้นส่วนธุรกิจทั้งสองก็เริ่มมีความเห็นตรงกันเรื่องงบประมาณในที่สุด`}],dialogue:{speakerA:`Did you and your manager agree on the new schedule?`,speakerB:`Yes, we finally see eye to eye after talking it through yesterday.`},commonMistake:`Use 'on' or 'about' before the topic — 'see eye to eye ON the budget,' not 'see eye to eye THE budget.' It's also most often used in the negative: 'we don't see eye to eye.'`,similarExpressions:[`be on the same page`,`agree to agree`],icon:`handshake`},{id:84,idiom:`Have someone's back.`,pronunciation:`hav sam-wonz bak`,category:`friendship`,level:`B1`,englishMeaning:`To support and protect someone when they need it.`,thaiMeaning:`คอยช่วยเหลือหรือสนับสนุนใครสักคน`,literalMeaning:`อยู่ข้างหลังคอยปกป้องใครสักคน (ตามตัวคือ 'มีหลังของใครสักคน')`,usage:`Use this to reassure someone that you'll support and defend them if they run into trouble.`,formality:`casual`,examples:[{english:`It's important to have someone's back, especially when they're going through a hard time.`,thai:`การคอยช่วยเหลือใครสักคน โดยเฉพาะตอนที่เขากำลังเจอเรื่องยากๆ ถือเป็นสิ่งสำคัญ`},{english:`A good friend will always have someone's back, no matter what mistakes they make.`,thai:`เพื่อนแท้จะคอยสนับสนุนใครสักคนเสมอ ไม่ว่าเขาจะทำพลาดแค่ไหนก็ตาม`}],dialogue:{speakerA:`Do you think this team really has each other's back?`,speakerB:`Definitely — it's a place where people always have someone's back.`},commonMistake:`Native speakers often say 'I've GOT your back' more than 'I have your back' in casual speech — both are correct, but don't drop the possessive 's on the name or pronoun.`,similarExpressions:[`back someone up`,`stand by someone`],icon:`shield`},{id:85,idiom:`Through thick and thin.`,pronunciation:`throo thik and thin`,category:`friendship`,level:`B1`,englishMeaning:`To stay loyal to someone no matter how hard things get.`,thaiMeaning:`ร่วมทุกข์ร่วมสุข`,literalMeaning:`ผ่านทั้งช่วงหนาและช่วงบาง (ทั้งช่วงดีและช่วงร้าย)`,usage:`Use this to describe loyalty that survives both good times and hard times.`,formality:`neutral`,examples:[{english:`They've been friends for twenty years and have supported each other through thick and thin.`,thai:`พวกเขาเป็นเพื่อนกันมายี่สิบปีและคอยสนับสนุนกันมาตลอดไม่ว่าจะสุขหรือทุกข์`},{english:`A real partner stays with you through thick and thin, not just when things are easy.`,thai:`คู่ชีวิตที่แท้จริงจะอยู่เคียงข้างคุณไม่ว่าจะยากลำบากแค่ไหน ไม่ใช่แค่ตอนที่ทุกอย่างราบรื่น`}],dialogue:{speakerA:`You two have known each other forever, huh?`,speakerB:`Yeah, we've been through thick and thin together since college.`},commonMistake:`The word order never changes — it's always 'thick AND thin,' never 'thin and thick,' even though that might feel more logical in Thai translation.`,similarExpressions:[`stick together`,`for better or worse`],icon:`umbrella`},{id:86,idiom:`Clear the air.`,pronunciation:`klir dhuh air`,category:`friendship`,level:`B1`,englishMeaning:`To talk openly about a problem so bad feelings don't linger.`,thaiMeaning:`พูดคุยเพื่อแก้ความเข้าใจผิด`,literalMeaning:`ทำให้อากาศปลอดโปร่ง (ขจัดความอึมครึมในความสัมพันธ์)`,usage:`Use this when people need an honest conversation to resolve tension or misunderstanding.`,formality:`neutral`,examples:[{english:`We need to sit down and clear the air before this misunderstanding gets any worse.`,thai:`เราต้องนั่งคุยกันเพื่อล้างความเข้าใจผิดก่อนที่เรื่องนี้จะบานปลายไปกว่านี้`},{english:`After the argument, they went for coffee to clear the air and talk things through.`,thai:`หลังจากทะเลาะกัน พวกเขาไปดื่มกาแฟด้วยกันเพื่อคุยแก้ความเข้าใจผิดให้เคลียร์`}],dialogue:{speakerA:`Things have felt tense between us since last week.`,speakerB:`I know, let's clear the air tonight over dinner.`},commonMistake:`This idiom is about resolving emotional tension through honest conversation — don't use it to literally mean opening a window or airing out a room.`,similarExpressions:[`talk things out`,`iron things out`],icon:`sun`},{id:87,idiom:`Give someone the cold shoulder.`,pronunciation:`giv sam-wan dhuh kohld shohl-der`,category:`friendship`,level:`B1`,englishMeaning:`To deliberately ignore or act unfriendly toward someone.`,thaiMeaning:`ทำเมินเฉยต่อใครสักคน`,literalMeaning:`ยื่นไหล่เย็นให้ (ตามตัวคือทำท่าเย็นชาใส่)`,usage:`Use this when someone is deliberately being distant or unfriendly toward another person.`,formality:`casual`,examples:[{english:`It's not fair to give someone the cold shoulder just because you're in a bad mood.`,thai:`การทำเมินเฉยใส่ใครสักคนเพียงเพราะคุณอารมณ์ไม่ดีนั้นไม่ยุติธรรมเลย`},{english:`Ever since the fight, she's chosen to give someone the cold shoulder instead of talking things out.`,thai:`ตั้งแต่ทะเลาะกัน เธอเลือกที่จะทำเมินเฉยใส่อีกฝ่ายแทนที่จะคุยกันให้เข้าใจ`}],dialogue:{speakerA:`Have you noticed Jake acting cold toward Mia?`,speakerB:`Yeah, he's decided to give someone the cold shoulder instead of just talking about it.`},commonMistake:`Always keep the article: 'THE cold shoulder,' not 'a cold shoulder' or 'cold shoulder' alone. You can also flip it: 'get the cold shoulder FROM someone.'`,similarExpressions:[`ignore someone`,`freeze someone out`],icon:`moon`},{id:88,idiom:`Hit it off.`,pronunciation:`hit it awf`,category:`friendship`,level:`A2`,englishMeaning:`To instantly feel a strong, easy connection with someone you just met.`,thaiMeaning:`ถูกคอกันตั้งแต่แรกพบ`,literalMeaning:`ตีกันติด (เข้ากันได้ทันทีตั้งแต่แรก)`,usage:`Use this to describe two people who became friends easily the very first time they met.`,formality:`casual`,examples:[{english:`We hit it off right away and talked for hours at the coffee shop.`,thai:`เราถูกคอกันตั้งแต่แรกเจอและคุยกันนานหลายชั่วโมงที่ร้านกาแฟ`},{english:`The two new students hit it off during their first class together.`,thai:`นักเรียนใหม่สองคนถูกคอกันตั้งแต่คาบเรียนแรกที่ได้เรียนด้วยกัน`}],dialogue:{speakerA:`How was your date last night?`,speakerB:`Great! We hit it off right from the very first hello.`},commonMistake:`The word 'it' is fixed in this phrase — don't replace it with 'them' or a name. Say 'we hit IT off,' not 'we hit them off.'`,similarExpressions:[`click with someone`,`get along`],icon:`flame`},{id:89,idiom:`Be there for someone.`,pronunciation:`bee thair for sam-wan`,category:`friendship`,level:`A2`,englishMeaning:`To show up and support someone whenever they need you.`,thaiMeaning:`อยู่เคียงข้างและช่วยเหลือใครสักคน`,literalMeaning:null,usage:`Use this to promise or describe ongoing emotional support in someone's life.`,formality:`neutral`,examples:[{english:`A real friend will always be there for someone, even in the middle of the night.`,thai:`เพื่อนแท้จะอยู่เคียงข้างและพร้อมช่วยเหลือเสมอ แม้แต่ยามดึกดื่น`},{english:`It means a lot to know you can be there for someone when they need support the most.`,thai:`การรู้ว่าคุณพร้อมอยู่เคียงข้างใครสักคนในยามที่เขาต้องการกำลังใจมากที่สุด ถือเป็นเรื่องที่มีความหมายมาก`}],dialogue:{speakerA:`I really appreciated you calling me during my hard week.`,speakerB:`Of course — I always try to be there for someone I care about.`},commonMistake:`Don't forget the preposition 'for' — it's 'be there FOR someone,' not just 'be there someone' or 'be there with someone' (which changes the meaning slightly).`,similarExpressions:[`stand by someone`,`have someone's back`],icon:`hands`},{id:90,idiom:`Bury the hatchet.`,pronunciation:`beh-ree dhuh hach-it`,category:`friendship`,level:`B1`,englishMeaning:`To stop an old argument and become friendly again.`,thaiMeaning:`เลิกทะเลาะและคืนดีกัน`,literalMeaning:`ฝังขวานลงดิน (เลิกใช้อาวุธ เลิกสู้รบกัน)`,usage:`Use this when former enemies or rivals decide to make peace and move on.`,formality:`neutral`,examples:[{english:`After years of not speaking, the brothers finally decided to bury the hatchet.`,thai:`หลังจากไม่คุยกันมาหลายปี สองพี่น้องก็ตัดสินใจเลิกทะเลาะและคืนดีกันในที่สุด`},{english:`The two rival companies agreed to bury the hatchet and start working together.`,thai:`สองบริษัทคู่แข่งตกลงที่จะเลิกบาดหมางกันและเริ่มร่วมงานกัน`}],dialogue:{speakerA:`Are you and your old business partner still not speaking?`,speakerB:`No, we finally sat down and decided to bury the hatchet last month.`},commonMistake:`This only works figuratively for ending a quarrel — don't confuse it with a literal violent image. Also keep the article: 'bury THE hatchet,' not 'bury a hatchet.'`,similarExpressions:[`make up`,`let bygones be bygones`],icon:`handshake`}],Zn=[{id:91,idiom:`Take it easy.`,pronunciation:`teik it ee-zee`,category:`everyday`,level:`A2`,englishMeaning:`This means to relax and not worry or work too hard.`,thaiMeaning:`ผ่อนคลาย / อย่ากังวลมาก`,literalMeaning:null,usage:`Say this to tell someone to relax, slow down, or not stress about something, or as a casual goodbye.`,formality:`casual`,examples:[{english:`You've been working all week, just take it easy this weekend.`,thai:`เธอทำงานหนักมาทั้งสัปดาห์แล้ว สุดสัปดาห์นี้ผ่อนคลายบ้างนะ`},{english:`Take it easy, we still have plenty of time before the deadline.`,thai:`ใจเย็น ๆ เรายังมีเวลาอีกเยอะก่อนถึงกำหนดส่ง`}],dialogue:{speakerA:`I'm so stressed about the exam tomorrow.`,speakerB:`Take it easy, you've studied hard and you'll do fine.`},commonMistake:`People also say "Take it easy" as a casual way to say goodbye, not just as advice to relax — the meaning depends on context.`,similarExpressions:[`Relax`,`Don't stress`,`Chill out`],icon:`sun`},{id:92,idiom:`Step on it.`,pronunciation:`step on it`,category:`everyday`,level:`A2`,englishMeaning:`This means to hurry up or drive faster.`,thaiMeaning:`เร็วเข้า`,literalMeaning:`ตามตัวหมายถึง "เหยียบมัน" คือเหยียบคันเร่งให้แรงขึ้น`,usage:`Use this when telling a driver to speed up, or more generally telling someone to hurry.`,formality:`casual`,examples:[{english:`The flight leaves in twenty minutes, so step on it!`,thai:`เครื่องบินจะออกในอีกยี่สิบนาที เร็วเข้าเถอะ!`},{english:`We're going to be late, can you step on it a little?`,thai:`เราจะไปสายแล้ว เร่งความเร็วอีกนิดได้ไหม`}],dialogue:{speakerA:`The meeting starts in five minutes and we're stuck in traffic.`,speakerB:`I know, step on it, we can still make it.`},commonMistake:`This is a casual spoken phrase, usually said to a driver — it can sound rude or too direct if used with a stranger like a taxi driver, so soften it with "please" in formal situations.`,similarExpressions:[`Hurry up`,`Put your foot down`,`Speed up`],icon:`clock`},{id:93,idiom:`Watch your step.`,pronunciation:`wach yor step`,category:`everyday`,level:`A2`,englishMeaning:`This means to be careful where you walk, or more generally to be careful about what you do.`,thaiMeaning:`ระวังทางเดิน / ระวังตัว`,literalMeaning:`ตามตัวหมายถึง "ระวังก้าวเดินของตัวเอง"`,usage:`Use this literally to warn someone about a physical hazard, or figuratively to warn someone to be careful about their behavior.`,formality:`casual`,examples:[{english:`The floor is wet, so watch your step near the entrance.`,thai:`พื้นเปียก ระวังทางเดินตรงทางเข้าด้วยนะ`},{english:`You'd better watch your step around the new manager, she notices everything.`,thai:`ระวังตัวหน่อยกับผู้จัดการคนใหม่ เธอสังเกตทุกอย่างเลย`}],dialogue:{speakerA:`Whoa, this staircase is really uneven.`,speakerB:`Yeah, watch your step, a few people have tripped here already.`},commonMistake:`When used figuratively as a warning about behavior, it can sound like a mild threat, so use a friendly tone with people you know well.`,similarExpressions:[`Be careful`,`Mind your step`,`Tread carefully`],icon:`warning`},{id:94,idiom:`It's a piece of cake.`,pronunciation:`its uh pees uv keik`,category:`everyday`,level:`A2`,englishMeaning:`Something is very easy.`,thaiMeaning:`มันง่ายมาก`,literalMeaning:`เค้กหนึ่งชิ้น`,usage:`Use it in casual conversations when you want to say that a task is easy.`,formality:`casual`,examples:[{english:`Don't worry about the test, it's a piece of cake once you've studied the vocabulary.`,thai:`ไม่ต้องกังวลเรื่องข้อสอบหรอก มันง่ายมากถ้าเธอทบทวนคำศัพท์มาแล้ว`},{english:`Fixing this problem won't take long, it's a piece of cake for someone with your experience.`,thai:`แก้ปัญหานี้ไม่นานหรอก มันง่ายมากสำหรับคนที่มีประสบการณ์แบบเธอ`}],dialogue:{speakerA:`Was the driving test difficult?`,speakerB:`Not at all. It was a piece of cake.`},commonMistake:`Do not normally use this expression in very formal academic writing.`,similarExpressions:[`Easy as pie`,`A walk in the park`,`Child's play`],icon:`smile`},{id:95,idiom:`I'm not buying it.`,pronunciation:`aim not bai-ing it`,category:`everyday`,level:`B1`,englishMeaning:`This means you do not believe what someone just told you.`,thaiMeaning:`ฉันไม่เชื่อเรื่องนั้น`,literalMeaning:null,usage:`Use this in casual conversation when someone gives an excuse or story that sounds suspicious and you want to say you doubt it.`,formality:`casual`,examples:[{english:`You say the dog ate your homework? I'm not buying it.`,thai:`บอกว่าหมากินการบ้านเหรอ ฉันไม่เชื่อเรื่องนั้นหรอก`},{english:`He claims he was just about to call me back, but I'm not buying it.`,thai:`เขาอ้างว่ากำลังจะโทรกลับหาฉันพอดี แต่ฉันไม่เชื่อหรอก`}],dialogue:{speakerA:`I swear I left early because of traffic, not because I overslept.`,speakerB:`Sorry, I'm not buying it, you're always late on Mondays.`},commonMistake:`This has nothing to do with shopping or purchasing — do not confuse it with literally buying a product; it only expresses disbelief.`,similarExpressions:[`I don't buy it`,`That doesn't add up`,`Yeah, right`],icon:`warning`},{id:96,idiom:`Zip your lips.`,pronunciation:`zip yor lips`,category:`everyday`,level:`B1`,englishMeaning:`This means to stop talking and keep quiet, especially about a secret.`,thaiMeaning:`เงียบไว้ / อย่าพูดออกไป`,literalMeaning:`ตามตัวหมายถึง "รูดซิปปิดปาก"`,usage:`Use this casually and directly when telling someone to stop talking or to keep a secret.`,formality:`casual`,examples:[{english:`This is a surprise party, so zip your lips around Anna.`,thai:`นี่เป็นปาร์ตี้เซอร์ไพรส์นะ อย่าปากโป้งกับแอนนาเชียว`},{english:`I'll tell you what happened, but you have to zip your lips about it.`,thai:`จะเล่าให้ฟังว่าเกิดอะไรขึ้น แต่ต้องเก็บเป็นความลับนะ`}],dialogue:{speakerA:`Can I tell Mark about the promotion?`,speakerB:`No way, zip your lips until it's official.`},commonMistake:`This is quite blunt and casual — it can sound rude if said to a boss or an elder, so use it only with close friends or peers.`,similarExpressions:[`Keep it under wraps`,`Button your lip`,`Keep it a secret`],icon:`chat`},{id:97,idiom:`Keep your cool.`,pronunciation:`keep yor kool`,category:`everyday`,level:`A2`,englishMeaning:`This means to stay calm and not get angry or upset, especially in a stressful situation.`,thaiMeaning:`ใจเย็นไว้`,literalMeaning:null,usage:`Use this to encourage someone to stay calm during a stressful or annoying situation.`,formality:`casual`,examples:[{english:`Whatever the customer says, just keep your cool and stay polite.`,thai:`ไม่ว่าลูกค้าจะพูดยังไง ใจเย็นไว้และสุภาพเข้าไว้`},{english:`Try to keep your cool even if the interview questions catch you off guard.`,thai:`พยายามใจเย็นไว้แม้ว่าคำถามสัมภาษณ์จะทำให้ตั้งตัวไม่ทัน`}],dialogue:{speakerA:`The printer broke again right before the deadline!`,speakerB:`Keep your cool, we can print it at the shop next door.`},commonMistake:`Use "cool" as a noun here (keep your cool), not as an adjective — do not say "keep cool your temper" or similar reordered versions.`,similarExpressions:[`Stay calm`,`Don't lose your temper`,`Keep a level head`],icon:`shield`},{id:98,idiom:`I'm in the dark.`,pronunciation:`aim in dhuh dark`,category:`everyday`,level:`B1`,englishMeaning:`This means you have no information about something that is happening.`,thaiMeaning:`ฉันไม่รู้อะไรเกี่ยวกับเรื่องนี้เลย`,literalMeaning:`ตามตัวหมายถึง "อยู่ในความมืด" คือมองไม่เห็นข้อมูลอะไรเลย`,usage:`Use this when you want to say you have not been told or informed about a situation.`,formality:`neutral`,examples:[{english:`Nobody told me about the schedule change, so I'm in the dark about it.`,thai:`ไม่มีใครบอกฉันเรื่องเปลี่ยนตารางเลย ฉันเลยไม่รู้อะไรเกี่ยวกับเรื่องนี้เลย`},{english:`Please explain what's going on, because right now I'm in the dark.`,thai:`ช่วยอธิบายหน่อยว่าเกิดอะไรขึ้น เพราะตอนนี้ฉันไม่รู้อะไรเลย`}],dialogue:{speakerA:`Do you know why the boss called an emergency meeting?`,speakerB:`No idea, I'm totally in the dark about it too.`},commonMistake:`This is followed by "about" plus the topic ("in the dark about the plan"), not "of" or "for" — getting the preposition wrong is a common learner error.`,similarExpressions:[`Out of the loop`,`Left in the dark`,`Kept in the dark`],icon:`moon`},{id:99,idiom:`It rings a bell.`,pronunciation:`it rings uh bel`,category:`everyday`,level:`B1`,englishMeaning:`This means something sounds familiar, even if you cannot remember all the details.`,thaiMeaning:`ฟังดูคุ้น ๆ`,literalMeaning:`ตามตัวหมายถึง "มันสั่นระฆัง" คือกระตุ้นความทรงจำขึ้นมา`,usage:`Use this when you recognize a name or piece of information but cannot fully recall where you know it from.`,formality:`casual`,examples:[{english:`I can't recall the details, but it rings a bell.`,thai:`จำรายละเอียดไม่ได้หรอก แต่ฟังดูคุ้น ๆ นะ`},{english:`The name Riverstone Tech - it rings a bell, but I can't remember why.`,thai:`ชื่อริเวอร์สโตน เทค ฟังดูคุ้น ๆ นะ แต่จำไม่ได้ว่าทำไม`}],dialogue:{speakerA:`Have you ever heard of a company called Riverstone Tech?`,speakerB:`Hmm, it rings a bell, but I can't remember where from.`},commonMistake:`Use "rings" for the general present habit or "rang" for a past moment ("that name rang a bell when I saw it") — don't leave the verb unconjugated.`,similarExpressions:[`Sounds familiar`,`I've heard that before`],icon:`brain`},{id:100,idiom:`Let's get the show on the road.`,pronunciation:`lets get dhuh shoh on dhuh rohd`,category:`everyday`,level:`B1`,englishMeaning:`This means to start doing something that has been planned, without any more delay.`,thaiMeaning:`มาเริ่มกันเลย`,literalMeaning:`ตามตัวหมายถึง "พาการแสดงออกสู่ถนน" คือเริ่มต้นออกเดินทางหรือลงมือทำ`,usage:`Use this to energetically signal that it is time to begin an activity, meeting, or trip after everyone is ready.`,formality:`casual`,examples:[{english:`Everyone is here and the bus is ready, so let's get the show on the road.`,thai:`ทุกคนมาพร้อมแล้ว รถบัสก็พร้อมแล้ว มาเริ่มออกเดินทางกันเลย`},{english:`We've talked long enough about the plan, let's get the show on the road and start building.`,thai:`คุยเรื่องแผนกันมานานพอแล้ว มาเริ่มลงมือสร้างกันเลยดีกว่า`}],dialogue:{speakerA:`Is everyone ready for the presentation?`,speakerB:`Yep, all set, let's get the show on the road!`},commonMistake:`This is an energetic, casual phrase for starting something — it does not literally involve a show or a road, so avoid using it in serious formal announcements.`,similarExpressions:[`Let's get started`,`Let's kick things off`,`Time to begin`],icon:`flame`}],M=[...Hn,...Un,...Wn,...Gn,...Kn,...qn,...Jn,...Yn,...Xn,...Zn].sort((e,t)=>e.id-t.id),Qn=e=>M.find(t=>t.id===e),$n=e=>M.filter(t=>t.category===e);function er(e=new Date){let t=new Date(e.getFullYear(),0,1);return M[Math.floor((e.getTime()-t.getTime())/864e5)%M.length]}var tr=[{id:`encouragement`,number:1,title:`Encourage
