ไม่ปล่อย`,usage:`Use this to comfort or motivate someone who is going through a tough or stressful period.`,formality:`casual`,examples:[{english:`I know finals week is exhausting, but hang in there — you're almost done.`,thai:`รู้ว่าสัปดาห์สอบมันเหนื่อยมาก แต่อดทนไว้นะ ใกล้จะเสร็จแล้ว`},{english:`Hang in there, the surgery went well and she's recovering fast.`,thai:`สู้ต่อไปนะ การผ่าตัดผ่านไปด้วยดีและเธอกำลังฟื้นตัวเร็วมาก`}],dialogue:{speakerA:`I don't think I can finish this project on time.`,speakerB:`Hang in there, we'll get through it together.`},commonMistake:`"Hang in there" is a phrase of encouragement, not a literal instruction to hold onto something — don't translate it word for word.`,similarExpressions:[`Stay strong`,`Keep going`,`Don't lose hope`],icon:`hands`},{id:2,idiom:`Keep your chin up.`,pronunciation:`keep yor chin up`,category:`encouragement`,level:`B1`,englishMeaning:`This means to stay positive and not let sadness or disappointment show.`,thaiMeaning:`อย่าท้อ / มองโลกในแง่ดีเข้าไว้`,literalMeaning:`เชิดคางขึ้น`,usage:`Use this to comfort someone who feels down or embarrassed and needs a boost of confidence.`,formality:`neutral`,examples:[{english:`You didn't get the part, but keep your chin up — there will be other auditions.`,thai:`คุณไม่ได้บทนี้ก็จริง แต่อย่าท้อนะ ยังมีออดิชั่นอื่นๆ อีก`},{english:`Keep your chin up, losing one client doesn't mean the business is failing.`,thai:`มองโลกในแง่ดีเข้าไว้ การเสียลูกค้าไปหนึ่งรายไม่ได้แปลว่าธุรกิจกำลังล้มเหลว`}],dialogue:{speakerA:`I'm so embarrassed about what happened at the meeting.`,speakerB:`Keep your chin up, everyone forgets things sometimes.`},commonMistake:`It's "keep your CHIN up," not "head up" or "nose up" — the specific body part in this idiom is fixed.`,similarExpressions:[`Stay positive`,`Look on the bright side`],icon:`sun`},{id:3,idiom:`Go for it.`,pronunciation:`go for it`,category:`encouragement`,level:`A2`,englishMeaning:`This means to take a chance and do something without hesitating.`,thaiMeaning:`ลุยเลย / ทำเลย`,literalMeaning:null,usage:`Use this to encourage someone who is hesitant to take an opportunity or try something new.`,formality:`casual`,examples:[{english:`If you really want to start your own bakery, just go for it.`,thai:`ถ้าคุณอยากเปิดร้านเบเกอรี่ของตัวเองจริงๆ ก็ลุยเลย`},{english:`She was scared to ask for a raise, but her friend told her to go for it.`,thai:`เธอกลัวที่จะขอขึ้นเงินเดือน แต่เพื่อนบอกให้เธอลุยเลย`}],dialogue:{speakerA:`I've always wanted to try stand-up comedy, but I'm scared.`,speakerB:`Go for it — the worst that happens is a few quiet laughs.`},commonMistake:`"Go for it" needs something already established for the speaker to pursue — it rarely opens a conversation on its own.`,similarExpressions:[`Take the plunge`,`Just do it`],icon:`spark`},{id:4,idiom:`You've got this.`,pronunciation:`yoov got this`,category:`encouragement`,level:`A2`,englishMeaning:`This means expressing confidence that someone is capable of succeeding at something.`,thaiMeaning:`คุณทำได้แน่นอน`,literalMeaning:null,usage:`Use this right before someone faces a challenge, like a test, interview, or performance, to reassure them.`,formality:`casual`,examples:[{english:`Take a deep breath before your presentation — you've got this.`,thai:`หายใจลึกๆ ก่อนพรีเซนต์นะ คุณทำได้แน่นอน`},{english:`The coach looked at the nervous player and said, "You've got this."`,thai:`โค้ชมองไปที่นักกีฬาที่กำลังตื่นเต้นแล้วพูดว่า 'คุณทำได้แน่นอน'`}],dialogue:{speakerA:`What if I mess up during the recital?`,speakerB:`You've got this, you've practiced for months.`},commonMistake:`Note the contraction "You've" (you have) — don't write it as "You get this," which changes the meaning entirely.`,similarExpressions:[`You can do it`,`You'll do great`],icon:`trophy`},{id:5,idiom:`Don't give up.`,pronunciation:`dohnt giv up`,category:`encouragement`,level:`A2`,englishMeaning:`This means to continue trying instead of stopping when a task gets difficult.`,thaiMeaning:`อย่ายอมแพ้`,literalMeaning:null,usage:`Use this to motivate someone who is struggling or tempted to quit a difficult task.`,formality:`neutral`,examples:[{english:`Learning a new language is hard, but don't give up after just one bad week.`,thai:`การเรียนภาษาใหม่มันยากก็จริง แต่อย่ายอมแพ้เพียงเพราะสัปดาห์แรกที่ย่ำแย่`},{english:`Don't give up on your dream just because one investor said no.`,thai:`อย่ายอมแพ้ต่อความฝันของคุณเพียงเพราะนักลงทุนคนหนึ่งปฏิเสธ`}],dialogue:{speakerA:`I keep failing my driving test.`,speakerB:`Don't give up, most people need more than one try.`},commonMistake:`"Give up" often takes "on" plus an object (give up on something) — "Don't give up" alone, without an object, is also correct and very common.`,similarExpressions:[`Keep trying`,`Never say die`],icon:`storm`},{id:6,idiom:`Keep up the good work.`,pronunciation:`keep up thuh good werk`,category:`encouragement`,level:`B1`,englishMeaning:`This means to praise someone and encourage them to continue performing well.`,thaiMeaning:`ทำดีต่อไปนะ`,literalMeaning:null,usage:`Use this to compliment someone's ongoing effort or performance and encourage them to maintain it.`,formality:`neutral`,examples:[{english:`Your sales numbers have improved every month — keep up the good work.`,thai:`ยอดขายของคุณดีขึ้นทุกเดือนเลย ทำดีต่อไปนะ`},{english:`The teacher wrote "Keep up the good work!" on the top of my essay.`,thai:`ครูเขียนว่า 'ทำดีต่อไปนะ!' ไว้ด้านบนของเรียงความของฉัน`}],dialogue:{speakerA:`Did I do okay on this month's report?`,speakerB:`You did great — keep up the good work.`},commonMistake:`This is said to someone whose work is ALREADY good — using it on someone who is struggling can sound sarcastic or insincere.`,similarExpressions:[`Well done`,`Nice job`],icon:`handshake`},{id:7,idiom:`Give it your best shot.`,pronunciation:`giv it yor best shot`,category:`encouragement`,level:`B1`,englishMeaning:`This means to try as hard as you possibly can at something, even if you might fail.`,thaiMeaning:`ลองทำให้เต็มที่ที่สุด`,literalMeaning:`ยิงให้ดีที่สุดสักนัด`,usage:`Use this to encourage someone to put in maximum effort, especially before a competition or attempt.`,formality:`casual`,examples:[{english:`Nobody expects you to be perfect, just give it your best shot.`,thai:`ไม่มีใครคาดหวังให้คุณสมบูรณ์แบบหรอก แค่ลองทำให้เต็มที่ที่สุดก็พอ`},{english:`Even if you're not ready for the interview, give it your best shot.`,thai:`ถึงแม้คุณจะยังไม่พร้อมสำหรับการสัมภาษณ์ ก็ลองทำให้เต็มที่ที่สุด`}],dialogue:{speakerA:`I probably won't win the race, but I'll still run.`,speakerB:`That's the spirit, just give it your best shot.`},commonMistake:`"Shot" here means an attempt, not a literal shot (a drink or a gunshot) — don't confuse it with those other meanings.`,similarExpressions:[`Do your best`,`Give it 100%`],icon:`flame`},{id:8,idiom:`Practice makes perfect.`,pronunciation:`prak-tis mayks per-fekt`,category:`encouragement`,level:`B1`,englishMeaning:`This means that repeating an activity often is how a person becomes skilled at it.`,thaiMeaning:`การฝึกฝนทำให้เก่งขึ้น`,literalMeaning:null,usage:`Use this to remind someone that improvement comes gradually through repeated effort, not instantly.`,formality:`neutral`,examples:[{english:`My piano teacher always reminds me that practice makes perfect.`,thai:`ครูเปียโนของฉันมักเตือนเสมอว่าการฝึกฝนทำให้เก่งขึ้น`},{english:`Don't worry if your first pancake looks terrible — practice makes perfect.`,thai:`ไม่ต้องกังวลถ้าแพนเค้กแผ่นแรกของคุณดูแย่ การฝึกฝนทำให้เก่งขึ้น`}],dialogue:{speakerA:`My guitar chords still sound terrible.`,speakerB:`Keep at it, practice makes perfect.`},commonMistake:`This is a general proverb usually said without "the" — it's "practice," not "the practice," makes perfect.`,similarExpressions:[`Practice makes progress`],icon:`brain`},{id:9,idiom:`The sky's the limit.`,pronunciation:`thuh skyz thuh lim-it`,category:`encouragement`,level:`B1`,englishMeaning:`This means that there is no restriction on how far someone can go or how much they can achieve.`,thaiMeaning:`ไม่มีขีดจำกัดสำหรับสิ่งที่คุณทำได้`,literalMeaning:`ท้องฟ้าคือขีดจำกัด`,usage:`Use this to express that someone's potential or opportunities are essentially unlimited.`,formality:`neutral`,examples:[{english:`With her talent and work ethic, the sky's the limit for her career.`,thai:`ด้วยพรสวรรค์และความขยันของเธอ ไม่มีขีดจำกัดสำหรับอนาคตในอาชีพของเธอเลย`},{english:`Once you learn to code, the sky's the limit for what you can build.`,thai:`พอคุณเรียนเขียนโค้ดเป็นแล้ว คุณจะสร้างอะไรก็ได้แบบไม่มีขีดจำกัด`}],dialogue:{speakerA:`Do you think I could ever start my own company?`,speakerB:`Absolutely — the sky's the limit for someone like you.`},commonMistake:`The apostrophe matters: it's "sky's" (sky is), not "skies" — a common spelling mistake for learners.`,similarExpressions:[`Nothing can stop you`,`Reach for the stars`],icon:`compass`},{id:10,idiom:`Believe in yourself.`,pronunciation:`bee-leev in yor-self`,category:`encouragement`,level:`A2`,englishMeaning:`This means to trust your own abilities instead of doubting yourself.`,thaiMeaning:`เชื่อมั่นในตัวเอง`,literalMeaning:null,usage:`Use this to encourage someone who is nervous or unsure of their own abilities.`,formality:`neutral`,examples:[{english:`You need to believe in yourself before anyone else will believe in you.`,thai:`คุณต้องเชื่อมั่นในตัวเองก่อน คนอื่นถึงจะเชื่อมั่นในตัวคุณ`},{english:`Believe in yourself and take the exam with confidence.`,thai:`เชื่อมั่นในตัวเองแล้วเข้าสอบด้วยความมั่นใจ`}],dialogue:{speakerA:`I'm scared I'll freeze up on stage.`,speakerB:`Just believe in yourself and the words will come.`},commonMistake:`Saying this to a stranger or in a formal business context can sound overly casual or even slightly patronizing — reserve it for close relationships.`,similarExpressions:[`Trust yourself`,`Have faith in yourself`],icon:`heart`}],Un=[{id:11,idiom:`I'm swamped.`,pronunciation:`aym swahmpt`,category:`work-study`,level:`A2`,englishMeaning:`You say this to explain that you have way too much work to handle right now.`,thaiMeaning:`ฉันยุ่งมาก / งานท่วมหัว`,literalMeaning:`ฉันถูกน้ำท่วม`,usage:`Use it when someone asks for your time or help and you need to explain you have too much on your plate.`,formality:`casual`,examples:[{english:`Sorry, I can't grab lunch today, I'm swamped with reports.`,thai:`ขอโทษนะ วันนี้ไปกินข้าวเที่ยงด้วยกันไม่ได้ ฉันยุ่งกับรายงานมากเลย`},{english:`Every exam season, it's the same story — I'm swamped and barely have time to eat.`,thai:`พอถึงช่วงสอบทีไร ก็เป็นแบบนี้ทุกที ฉันยุ่งมากจนแทบไม่มีเวลากินข้าว`}],dialogue:{speakerA:`Can you help me move some furniture this weekend?`,speakerB:`I wish I could, but I'm swamped with finals right now.`},commonMistake:`Don't confuse this with being physically wet — it has nothing to do with water, only workload.`,similarExpressions:[`snowed under`,`up to my ears in work`],icon:`storm`},{id:12,idiom:`Hit the books.`,pronunciation:`hit thuh books`,category:`work-study`,level:`A2`,englishMeaning:`It means you need to start studying seriously, often for a test.`,thaiMeaning:`ตั้งใจอ่านหนังสือ`,literalMeaning:`ตีหนังสือ`,usage:`Use it when talking about starting or needing to do focused study, especially before an exam.`,formality:`casual`,examples:[{english:`I can't watch the movie tonight, I really need to hit the books before my exam.`,thai:`คืนนี้ดูหนังไม่ได้แล้ว ฉันต้องตั้งใจอ่านหนังสือก่อนสอบจริงๆ`},{english:`It’s already April, so it’s time to hit the books for the entrance exam.`,thai:`เข้าเดือนเมษายนแล้ว ถึงเวลาต้องตั้งใจอ่านหนังสือเตรียมสอบเข้าแล้วนะ`}],dialogue:{speakerA:`Want to play video games after school?`,speakerB:`Can’t, man. I need to hit the books — I have a chemistry test tomorrow.`},commonMistake:`It only refers to studying, not to literally hitting or damaging a book.`,similarExpressions:[`cram for a test`,`buckle down`],icon:`book`},{id:13,idiom:`Learn the ropes.`,pronunciation:`lurn thuh rohps`,category:`work-study`,level:`B1`,englishMeaning:`It means figuring out how a job or task works, usually when you are new to it.`,thaiMeaning:`เรียนรู้วิธีการทำงาน`,literalMeaning:`เรียนรู้เชือก`,usage:`Use it when talking about a new employee or beginner getting used to how things are done.`,formality:`neutral`,examples:[{english:`It's only her first week, so she'll need time to learn the ropes.`,thai:`เพิ่งเป็นสัปดาห์แรกของเธอเอง เธอเลยยังต้องใช้เวลาเรียนรู้วิธีการทำงานอยู่`},{english:`My manager spent two days showing me how to learn the ropes before leaving me on my own.`,thai:`หัวหน้าฉันใช้เวลาสองวันสอนให้ฉันเรียนรู้วิธีการทำงานก่อนจะปล่อยให้ทำเองคนเดียว`}],dialogue:{speakerA:`How is the new intern doing so far?`,speakerB:`Pretty well, she's a fast learner and picking up the ropes quickly.`},commonMistake:`It refers only to learning a job or process, not actual physical rope or sailing skills.`,similarExpressions:[`get up to speed`,`find your feet`],icon:`hands`},{id:14,idiom:`Get the ball rolling.`,pronunciation:`get thuh bawl roh-ling`,category:`work-study`,level:`A2`,englishMeaning:`It means to start something that has been planned or delayed.`,thaiMeaning:`เริ่มลงมือทำ`,literalMeaning:`ทำให้ลูกบอลกลิ้ง`,usage:`Use it to encourage a group to begin a project, meeting, or task after planning is done.`,formality:`neutral`,examples:[{english:`Everyone's here, so let's get the ball rolling on the presentation.`,thai:`ทุกคนมากันครบแล้ว งั้นเรามาเริ่มลงมือทำการนำเสนอกันเลยดีกว่า`},{english:`After weeks of just talking about the new website, we need to get the ball rolling now.`,thai:`หลังจากคุยกันเรื่องเว็บไซต์ใหม่มาหลายสัปดาห์ ตอนนี้เราต้องเริ่มลงมือทำจริงจังได้แล้ว`}],dialogue:{speakerA:`We keep postponing the renovation plan.`,speakerB:`I know, let’s just get the ball rolling this week instead of waiting any longer.`},commonMistake:`It describes starting an action, not literally rolling a ball or beginning a sport.`,similarExpressions:[`kick things off`,`get the show on the road`],icon:`spark`},{id:15,idiom:`Back to square one.`,pronunciation:`bak too skwair wuhn`,category:`work-study`,level:`B1`,englishMeaning:`It means you have to start over from the beginning because something failed.`,thaiMeaning:`กลับไปเริ่มต้นใหม่`,literalMeaning:`กลับไปที่ช่องหมายเลขหนึ่ง`,usage:`Use it when a plan falls apart and you have no choice but to restart from the beginning.`,formality:`casual`,examples:[{english:`The client rejected our design, so it’s back to square one for the whole project.`,thai:`ลูกค้าไม่ชอบดีไซน์ของเรา เลยต้องกลับไปเริ่มต้นใหม่ทั้งโปรเจกต์เลย`},{english:`My laptop crashed and I lost the file, so now I’m back to square one on my essay.`,thai:`แล็ปท็อปฉันค้างแล้วไฟล์หาย ตอนนี้เลยต้องกลับไปเริ่มต้นเขียนเรียงความใหม่`}],dialogue:{speakerA:`Did the funding proposal get approved?`,speakerB:`No, they turned it down completely, so we're back to square one.`},commonMistake:`There is no literal "square" involved — it simply means restarting from zero, not returning to a real location.`,similarExpressions:[`start from scratch`,`back to the drawing board`],icon:`compass`},{id:16,idiom:`Call it a day.`,pronunciation:`kawl it uh day`,category:`work-study`,level:`A2`,englishMeaning:`It means deciding to stop working for now because you have done enough.`,thaiMeaning:`เลิกทำงานสำหรับวันนี้`,literalMeaning:null,usage:`Use it at the end of a work session when you or your team decide to stop for the day.`,formality:`casual`,examples:[{english:`It's already 8 pm, let's call it a day and finish the rest tomorrow.`,thai:`สองทุ่มแล้ว เลิกทำงานสำหรับวันนี้กันเถอะ แล้วค่อยทำต่อพรุ่งนี้`},{english:`After six hours of studying, I decided to call it a day and get some sleep.`,thai:`หลังจากอ่านหนังสือมาหกชั่วโมง ฉันตัดสินใจเลิกสำหรับวันนี้แล้วไปนอน`}],dialogue:{speakerA:`We’ve been debugging this for hours and still no luck.`,speakerB:`Let's just call it a day. We can look at it again with fresh eyes tomorrow.`},commonMistake:`It means stopping an activity for the day, not literally naming or labeling something "a day".`,similarExpressions:[`wrap it up`,`knock off for the day`],icon:`moon`},{id:17,idiom:`Burn the midnight oil.`,pronunciation:`burn thuh mid-nyt oyl`,category:`work-study`,level:`B1`,englishMeaning:`It means working or studying very late into the night.`,thaiMeaning:`ทำงานหรืออ่านหนังสือจนดึก`,literalMeaning:`เผาน้ำมันตอนเที่ยงคืน`,usage:`Use it to describe someone staying up late to finish work or prepare for something important.`,formality:`neutral`,examples:[{english:`I have to burn the midnight oil this week if I want to finish this thesis on time.`,thai:`สัปดาห์นี้ฉันต้องทำงานจนดึกถ้าอยากให้วิทยานิพนธ์เสร็จทันเวลา`},{english:`He tends to burn the midnight oil before every exam and still feels unprepared.`,thai:`เขามักจะอ่านหนังสือจนดึกก่อนสอบทุกครั้ง แต่ก็ยังรู้สึกว่าเตรียมตัวไม่พออยู่ดี`}],dialogue:{speakerA:`You look exhausted today, what happened?`,speakerB:`I was burning the midnight oil finishing the quarterly report.`},commonMistake:`This is about staying up late working, not about actual oil lamps or fire safety.`,similarExpressions:[`pull an all-nighter`,`stay up late`],icon:`flame`},{id:18,idiom:`On the right track.`,pronunciation:`on thuh ryt trak`,category:`work-study`,level:`A2`,englishMeaning:`It means you are making good progress and doing things correctly.`,thaiMeaning:`กำลังมาถูกทาง`,literalMeaning:`อยู่บนรางที่ถูกต้อง`,usage:`Use it to reassure someone, or yourself, that a plan or effort is heading toward success.`,formality:`neutral`,examples:[{english:`Your draft looks great, I think you’re on the right track for the final version.`,thai:`ร่างของคุณดูดีมากเลย ฉันว่าคุณกำลังมาถูกทางสำหรับฉบับสมบูรณ์แล้ว`},{english:`After changing our strategy, sales went up, so we’re finally on the right track.`,thai:`หลังจากปรับกลยุทธ์ใหม่ ยอดขายก็เพิ่มขึ้น ในที่สุดเราก็มาถูกทางแล้ว`}],dialogue:{speakerA:`Do you think this business plan will actually work?`,speakerB:`Based on the numbers so far, I’d say we’re definitely on the right track.`},commonMistake:`It refers to making correct progress, not to literal train tracks or physical roads.`,similarExpressions:[`heading in the right direction`,`making headway`],icon:`compass`},{id:19,idiom:`Get down to business.`,pronunciation:`get down too biz-nis`,category:`work-study`,level:`B1`,englishMeaning:`It means to stop chatting or wasting time and start focusing on the real work.`,thaiMeaning:`เริ่มทำงานอย่างจริงจัง`,literalMeaning:null,usage:`Use it in meetings or work settings when it is time to move past small talk and focus on the task.`,formality:`formal`,examples:[{english:`Okay everyone, let's get down to business and go over today's agenda.`,thai:`เอาล่ะทุกคน มาเริ่มทำงานกันอย่างจริงจังและดูวาระวันนี้กันเถอะ`},{english:`After a bit of small talk, it was time for both companies to get down to business and sign the contract.`,thai:`หลังจากคุยเล่นกันเล็กน้อย ก็ถึงเวลาที่ทั้งสองบริษัทต้องเริ่มทำงานอย่างจริงจังและเซ็นสัญญากัน`}],dialogue:{speakerA:`Thanks for the coffee, it was nice catching up.`,speakerB:`Likewise, but now let’s get down to business and review the budget.`},commonMistake:`It applies to any serious task, not only to commercial "business" in the company sense.`,similarExpressions:[`get to the point`,`get serious`],icon:`handshake`},{id:20,idiom:`Think outside the box.`,pronunciation:`think owt-syd thuh boks`,category:`work-study`,level:`B1`,englishMeaning:`It means to come up with creative ideas instead of using the usual or obvious approach.`,thaiMeaning:`คิดนอกกรอบ`,literalMeaning:`คิดออกไปนอกกล่อง`,usage:`Use it when encouraging creative or unconventional solutions to a problem.`,formality:`neutral`,examples:[{english:`The old marketing plan isn’t working, so we need to think outside the box.`,thai:`แผนการตลาดแบบเดิมใช้ไม่ได้ผลแล้ว เราเลยต้องคิดนอกกรอบกันบ้าง`},{english:`She managed to think outside the box and solved the problem in a way no one expected.`,thai:`เธอคิดนอกกรอบและแก้ปัญหาด้วยวิธีที่ไม่มีใครคาดคิดมาก่อน`}],dialogue:{speakerA:`We keep getting the same disappointing results every quarter.`,speakerB:`Maybe it’s time we think outside the box instead of repeating the same strategy.`},commonMistake:`There is no real box involved — don’t use it literally about a physical container.`,similarExpressions:[`think creatively`,`break the mold`],icon:`brain`}],Wn=[{id:21,idiom:`I'm over the moon.`,pronunciation:`aim oh-ver duh moon`,category:`feelings`,level:`A2`,englishMeaning:`You feel extremely happy and excited about something good that happened.`,thaiMeaning:`ฉันดีใจมาก`,literalMeaning:`อยู่เหนือดวงจันทร์ (ภาพความสุขล้นเหลือราวกับลอยขึ้นไปอยู่บนฟ้า)`,usage:`Use this to react to genuinely wonderful news, like an achievement or a happy surprise.`,formality:`casual`,examples:[{english:`I'm over the moon about getting accepted into the exchange program.`,thai:`ฉันดีใจสุดๆ ที่ได้รับคัดเลือกเข้าโครงการแลกเปลี่ยน`},{english:`Honestly, I'm over the moon right now because we just found out the baby is healthy.`,thai:`พูดตรงๆ ว่าตอนนี้ฉันดีใจมากๆ เพราะเพิ่งรู้ว่าลูกในท้องแข็งแรงดี`}],dialogue:{speakerA:`You look so happy today, what's going on?`,speakerB:`I just got the scholarship — I'm over the moon!`},commonMistake:`People sometimes confuse this with 'once in a blue moon' (which means rarely) — 'over the moon' is only about happiness, not frequency.`,similarExpressions:[`on cloud nine`,`thrilled to bits`,`walking on air`],icon:`moon`},{id:22,idiom:`I'm feeling blue.`,pronunciation:`aim fee-ling bloo`,category:`feelings`,level:`A2`,englishMeaning:`You feel sad or low, often for no clear big reason.`,thaiMeaning:`ฉันรู้สึกเศร้า`,literalMeaning:`รู้สึกเป็นสีฟ้า (ภาษาอังกฤษเปรียบสีฟ้าอมเทาเป็นสัญลักษณ์ของความเศร้าหมอง)`,usage:`Use this for a quiet, everyday sadness, like feeling down on a gray, uneventful day.`,formality:`casual`,examples:[{english:`I'm feeling blue today, maybe because of this gloomy weather.`,thai:`วันนี้ฉันรู้สึกเศร้าๆ อยู่นะ อาจเป็นเพราะอากาศครึ้มแบบนี้`},{english:`Ever since my best friend moved abroad, I'm feeling blue most evenings.`,thai:`ตั้งแต่เพื่อนสนิทย้ายไปอยู่ต่างประเทศ ฉันรู้สึกเศร้าแทบทุกเย็นเลย`}],dialogue:{speakerA:`You've been so quiet lately. Is something wrong?`,speakerB:`Not really wrong — I'm feeling blue since the semester ended.`},commonMistake:`This describes mood, not literally being blue-colored — don't use it to talk about an object's actual color.`,similarExpressions:[`feeling down`,`down in the dumps`,`in low spirits`],icon:`storm`},{id:23,idiom:`I'm under the weather.`,pronunciation:`aim un-der duh weh-ther`,category:`feelings`,level:`A2`,englishMeaning:`You feel a little sick, like you're coming down with a cold, not seriously ill.`,thaiMeaning:`ฉันรู้สึกไม่ค่อยสบาย`,literalMeaning:`อยู่ใต้สภาพอากาศ (มาจากภาพลูกเรือที่ไม่สบายต้องลงไปพักใต้ดาดฟ้าเพื่อหลบพายุ)`,usage:`Use this to explain mild illness, especially when excusing yourself from work, school, or plans.`,formality:`neutral`,examples:[{english:`I'm under the weather today, so I'll skip the gym and rest instead.`,thai:`วันนี้ฉันรู้สึกไม่ค่อยสบาย เลยขอข้ามยิมแล้วพักผ่อนดีกว่า`},{english:`Sorry I missed the meeting — I'm under the weather with a bad cold.`,thai:`ขอโทษที่พลาดประชุมไปนะ ฉันรู้สึกไม่ค่อยสบาย เป็นหวัดหนักเลย`}],dialogue:{speakerA:`Why weren't you at school yesterday?`,speakerB:`I'm under the weather, just a small cold, nothing serious.`},commonMistake:`It refers to feeling sick, not the actual weather — don't use it to describe rain or temperature.`,similarExpressions:[`not feeling well`,`feeling off`,`coming down with something`],icon:`umbrella`},{id:24,idiom:`I'm on cloud nine.`,pronunciation:`aim on klowd nain`,category:`feelings`,level:`B1`,englishMeaning:`You feel a deep, lasting happiness, usually about something you've been hoping for.`,thaiMeaning:`ฉันมีความสุขมาก`,literalMeaning:`อยู่บนก้อนเมฆที่เก้า (ภาพความสุขล้นฟ้า ลอยอยู่สูงเหนือเมฆชั้นพิเศษ)`,usage:`Use this for a peak, lasting happiness, often related to love, success, or a big personal win.`,formality:`casual`,examples:[{english:`Ever since she proposed, I'm on cloud nine and can't stop grinning.`,thai:`ตั้งแต่เธอขอแต่งงาน ฉันมีความสุขมากจนยิ้มไม่หุบเลย`},{english:`I'm on cloud nine after finally finishing my thesis after two years of work.`,thai:`ฉันมีความสุขสุดๆ หลังจากในที่สุดก็เขียนวิทยานิพนธ์เสร็จหลังทำงานมาสองปี`}],dialogue:{speakerA:`You've been smiling all week — what's the secret?`,speakerB:`I'm on cloud nine, we just bought our first house!`},commonMistake:`This is stronger and more lasting than a quick burst of joy — don't use it for tiny, everyday pleasant surprises.`,similarExpressions:[`over the moon`,`on top of the world`,`walking on air`],icon:`sun`},{id:25,idiom:`I'm fed up.`,pronunciation:`aim fed up`,category:`feelings`,level:`A2`,englishMeaning:`You have lost patience with something and can't tolerate it anymore.`,thaiMeaning:`ฉันเบื่อหรือทนไม่ไหวแล้ว`,literalMeaning:null,usage:`Use this when you're frustrated after putting up with a problem for too long.`,formality:`casual`,examples:[{english:`I'm fed up with all the traffic on this road every single morning.`,thai:`ฉันทนไม่ไหวแล้วกับรถติดบนถนนนี้ทุกเช้าเลย`},{english:`Honestly, I'm fed up with him canceling our plans at the last minute.`,thai:`พูดตรงๆ ว่าฉันเบื่อเต็มทนแล้วที่เขาชอบยกเลิกนัดกะทันหันตลอด`}],dialogue:{speakerA:`Why do you look so annoyed?`,speakerB:`I'm fed up with my neighbor's loud music every night.`},commonMistake:`This is usually followed by 'with' + noun/gerund ('fed up with something'), not 'fed up of' in standard usage.`,similarExpressions:[`sick and tired of`,`had enough`,`at the end of my rope`],icon:`warning`},{id:26,idiom:`It gets on my nerves.`,pronunciation:`it gets on mai nurvz`,category:`feelings`,level:`B1`,englishMeaning:`Something repeatedly annoys or irritates you.`,thaiMeaning:`มันทำให้ฉันรำคาญมาก`,literalMeaning:`มันไปแตะเส้นประสาทของฉัน (ภาพเหมือนมีบางอย่างมากระทบเส้นประสาทโดยตรงจนหงุดหงิด)`,usage:`Use this for a specific repeated behavior or sound that irritates you over time.`,formality:`casual`,examples:[{english:`He chews so loudly that it gets on my nerves every time we eat together.`,thai:`เขาเคี้ยวอาหารเสียงดังมากจนทำให้ฉันรำคาญทุกครั้งที่กินด้วยกัน`},{english:`That dripping faucet is so annoying — it gets on my nerves every night when I try to sleep.`,thai:`เสียงก๊อกน้ำหยดนั่นน่ารำคาญมาก มันทำให้ฉันรำคาญทุกคืนตอนพยายามจะนอน`}],dialogue:{speakerA:`Why do you look so irritated?`,speakerB:`My coworker keeps tapping his pen — it gets on my nerves so much.`},commonMistake:`The subject is usually the thing that annoys ('it', 'that', 'the noise'), not the annoyed person — don't say 'I get on my nerves.'`,similarExpressions:[`drives me crazy`,`gets under my skin`,`irritates me`],icon:`flame`},{id:27,idiom:`I have butterflies in my stomach.`,pronunciation:`aim hav buh-ter-flais in mai stuh-muhk`,category:`feelings`,level:`B1`,englishMeaning:`You feel a fluttery, nervous excitement before something important.`,thaiMeaning:`ฉันรู้สึกประหม่า`,literalMeaning:`มีผีเสื้อบินอยู่ในท้อง (ภาพความรู้สึกสั่นระริกในท้องเวลาตื่นเต้นหรือประหม่า)`,usage:`Use this before a nerve-wracking event, like a performance, interview, or first date.`,formality:`casual`,examples:[{english:`I have butterflies in my stomach before every job interview.`,thai:`ฉันรู้สึกประหม่าทุกครั้งก่อนไปสัมภาษณ์งาน`},{english:`Right before walking on stage, I have butterflies in my stomach every time.`,thai:`ก่อนขึ้นเวทีทุกครั้ง ฉันจะรู้สึกประหม่าเป็นประจำเลย`}],dialogue:{speakerA:`Are you nervous about the presentation tomorrow?`,speakerB:`Yeah, I already have butterflies in my stomach just thinking about it.`},commonMistake:`This means nervous anticipation, not literal nausea or food poisoning — don't use it for actually feeling unwell.`,similarExpressions:[`nervous wreck`,`on edge`,`stomach in knots`],icon:`heart`},{id:28,idiom:`I'm scared to death.`,pronunciation:`aim skaird tuh deth`,category:`feelings`,level:`B1`,englishMeaning:`You feel extremely frightened, often said as a dramatic exaggeration.`,thaiMeaning:`ฉันกลัวมาก`,literalMeaning:`กลัวจนตาย (เป็นการพูดเกินจริงเพื่อเน้นย้ำความกลัวอย่างสุดขีด)`,usage:`Use this to emphasize intense fear, often dramatically, like about spiders, heights, or scary movies.`,formality:`casual`,examples:[{english:`I'm scared to death of spiders — even a photo of one makes me jump.`,thai:`ฉันกลัวแมงมุมมาก แค่เห็นรูปก็สะดุ้งแล้ว`},{english:`Watching that horror movie alone, I'm scared to death the whole time.`,thai:`ตอนดูหนังผีเรื่องนั้นคนเดียว ฉันกลัวมากตลอดทั้งเรื่องเลย`}],dialogue:{speakerA:`Do you want to go on the roller coaster with us?`,speakerB:`No way, I'm scared to death of heights!`},commonMistake:`This is hyperbole for fear, not a literal statement — don't take it as describing real danger of dying.`,similarExpressions:[`scared stiff`,`terrified`,`frightened out of my wits`],icon:`shield`},{id:29,idiom:`I'm in a good mood.`,pronunciation:`aim in ah gud mood`,category:`feelings`,level:`A2`,englishMeaning:`You feel cheerful and pleasant right now, ready to enjoy things.`,thaiMeaning:`ฉันอารมณ์ดี`,literalMeaning:null,usage:`Use this to describe your general pleasant emotional state at a given moment.`,formality:`neutral`,examples:[{english:`I'm in a good mood today because it's finally Friday.`,thai:`วันนี้ฉันอารมณ์ดีมากเพราะในที่สุดก็ถึงวันศุกร์แล้ว`},{english:`I'm in a good mood after that relaxing weekend at the beach.`,thai:`ฉันอารมณ์ดีมากหลังจากไปพักผ่อนที่ชายหาดเมื่อสุดสัปดาห์`}],dialogue:{speakerA:`You seem extra cheerful this morning.`,speakerB:`I'm in a good mood, I just got some great news from my family.`},commonMistake:`Remember 'mood' is singular and uncountable here — don't say 'in a good moods.'`,similarExpressions:[`in high spirits`,`feeling great`,`in a great frame of mind`],icon:`smile`},{id:30,idiom:`I'm at my wit's end.`,pronunciation:`aim at mai wits end`,category:`feelings`,level:`B1`,englishMeaning:`You have tried everything and don't know what else to do about a problem.`,thaiMeaning:`ฉันไม่รู้จะทำอย่างไรแล้ว`,literalMeaning:`อยู่สุดปลายสติปัญญา (ภาพเหมือนใช้ความคิดจนหมดหนทางแล้ว)`,usage:`Use this when a persistent problem has exhausted your patience and ideas for solving it.`,formality:`neutral`,examples:[{english:`I'm at my wit's end trying to get my toddler to sleep through the night.`,thai:`ฉันไม่รู้จะทำอย่างไรแล้วกับการพยายามให้ลูกวัยเตาะแตะนอนหลับยาวตลอดคืน`},{english:`After three failed attempts, I'm at my wit's end with this broken printer.`,thai:`หลังจากลองมาสามครั้งแล้วไม่สำเร็จ ฉันไม่รู้จะทำยังไงแล้วกับเครื่องพิมพ์ที่เสียตัวนี้`}],dialogue:{speakerA:`You look exhausted. What is going on?`,speakerB:`I'm at my wit's end with this project, nothing I try seems to work.`},commonMistake:`The spelling is 'wit's end' (with an apostrophe, meaning the limit of one's cleverness), not 'wits end' or 'width's end.'`,similarExpressions:[`at the end of my rope`,`at a loss`,`pulling my hair out`],icon:`brain`}],Gn=[{id:31,idiom:`I'm all ears.`,pronunciation:`aim awl ears`,category:`communication`,level:`A2`,englishMeaning:`This means you are ready and eager to listen to what someone is about to say.`,thaiMeaning:`ฉันพร้อมฟังเต็มที่`,literalMeaning:`เหมือนตัวเองกลายเป็น "หูล้วน ๆ" คือตั้งใจฟังสุด ๆ`,usage:`Say this when someone wants to tell you something and you want to show you are fully focused on listening.`,formality:`casual`,examples:[{english:`Go ahead and tell me what happened, I'm all ears.`,thai:`เล่ามาได้เลยว่าเกิดอะไรขึ้น ฉันพร้อมฟังเต็มที่`},{english:`Sit down and relax, I'm all ears whenever you're ready to talk.`,thai:`นั่งลงก่อน ผ่อนคลายหน่อย ฉันพร้อมฟังเมื่อไหร่ที่เธอพร้อมจะพูด`}],dialogue:{speakerA:`Can I tell you something important?`,speakerB:`Of course, I'm all ears.`},commonMistake:`This phrase is used alone as a short reply, not as a verb — avoid saying "I ear" or trying to conjugate it like a regular verb.`,similarExpressions:[`I'm listening`,`Go ahead, I'm with you`],icon:`chat`},{id:32,idiom:`It slipped my mind.`,pronunciation:`it slipt mai maind`,category:`communication`,level:`A2`,englishMeaning:`This means you forgot to do or say something, usually without meaning to.`,thaiMeaning:`ฉันลืมไปเลย`,literalMeaning:`เหมือนความคิดนั้น "ลื่นหลุด" ออกไปจากหัวโดยไม่ทันรู้ตัว`,usage:`Use this to apologize or explain politely when you forgot to do something, often to soften the blame.`,formality:`neutral`,examples:[{english:`I'm so sorry, it slipped my mind that today was your birthday.`,thai:`ขอโทษจริง ๆ ฉันลืมไปเลยว่าวันนี้เป็นวันเกิดของเธอ`},{english:`I meant to reply to your email, but it slipped my mind with everything going on.`,thai:`ตั้งใจจะตอบอีเมลเธออยู่ แต่ด้วยเรื่องยุ่ง ๆ ก็เลยลืมไปเลย`}],dialogue:{speakerA:`Did you call the client back yesterday?`,speakerB:`Oh no, it slipped my mind. I'll do it right now.`},commonMistake:`Use "slipped" (past tense) when the forgetting already happened — people often mistakenly leave out "my" and just say "it slipped mind", which is incorrect.`,similarExpressions:[`I forgot`,`It went out of my head`],icon:`brain`},{id:33,idiom:`Keep me posted.`,pronunciation:`keep mee pohs-tid`,category:`communication`,level:`A2`,englishMeaning:`This means you want someone to keep giving you updates about a situation as it develops.`,thaiMeaning:`คอยอัปเดตฉันด้วย`,literalMeaning:null,usage:`Use this when you want to stay informed about something that is ongoing or might change, like a project or a health situation.`,formality:`neutral`,examples:[{english:`I have a meeting during the interview, so please keep me posted on how it goes.`,thai:`ฉันติดประชุมช่วงสัมภาษณ์ ฝากคอยอัปเดตด้วยนะว่าเป็นยังไงบ้าง`},{english:`The doctor said the test results will take a few days, so keep me posted when you hear back.`,thai:`หมอบอกว่าผลตรวจจะออกในอีกไม่กี่วัน พอรู้ผลแล้วช่วยอัปเดตฉันด้วยนะ`}],dialogue:{speakerA:`We're still waiting to hear if the flight got cancelled.`,speakerB:`Okay, keep me posted, I need to know before I leave the house.`},commonMistake:`This is usually followed by "on" plus the topic ("keep me posted on the results"), not "about" — both can work, but "on" sounds more natural in everyday speech.`,similarExpressions:[`Keep me in the loop`,`Let me know how it goes`],icon:`compass`},{id:34,idiom:`Get to the point.`,pronunciation:`get too dhuh point`,category:`communication`,level:`A2`,englishMeaning:`This means to stop giving unnecessary details and say the main thing you want to say.`,thaiMeaning:`เข้าเรื่องเลย`,literalMeaning:null,usage:`Use this when someone is talking too long or going around the topic and you want them to say the important part directly.`,formality:`casual`,examples:[{english:`We only have five minutes left, so can you please get to the point?`,thai:`เราเหลือเวลาแค่ห้านาทีแล้ว เข้าเรื่องเลยได้ไหม`},{english:`He always tells long stories before he can get to the point.`,thai:`เขามักจะเล่าเรื่องยาว ๆ ก่อนที่จะเข้าเรื่องสักที`}],dialogue:{speakerA:`So, funny story, it all started last Tuesday when...`,speakerB:`Just get to the point, what happened to the car?`},commonMistake:`This can sound rude or impatient if said bluntly to someone senior or in a formal meeting — soften it with "sorry, but" or "if I may" in professional settings.`,similarExpressions:[`Cut to the chase`,`Don't beat around the bush`],icon:`compass`},{id:35,idiom:`Speak your mind.`,pronunciation:`speek yor maind`,category:`communication`,level:`B1`,englishMeaning:`This means to say honestly what you really think, even if it might not be popular.`,thaiMeaning:`พูดสิ่งที่คิดออกมาตรง ๆ`,literalMeaning:`เหมือนพูดสิ่งที่อยู่ใน "ใจ" ออกมาตรง ๆ ไม่เก็บไว้`,usage:`Use this to encourage someone to share their honest opinion, or to describe someone who is known for being direct and open.`,formality:`neutral`,examples:[{english:`Don't be afraid, this is a safe space to speak your mind.`,thai:`ไม่ต้องกลัวนะ ที่นี่เป็นพื้นที่ปลอดภัยที่จะพูดสิ่งที่คิดออกมาตรง ๆ`},{english:`Her mentor always told her, "When you disagree in a meeting, speak your mind."`,thai:`พี่เลี้ยงของเธอมักจะบอกเสมอว่า "ถ้าไม่เห็นด้วยในที่ประชุม ก็พูดสิ่งที่คิดออกมาตรง ๆ ไปเลย"`}],dialogue:{speakerA:`I have some concerns about the new plan, but I don't want to cause trouble.`,speakerB:`It's okay, speak your mind, we need honest feedback.`},commonMistake:`When talking about a specific person, remember to change the possessive: "speak your mind" becomes "speak her mind" or "speak his mind", not "speak their own mind".`,similarExpressions:[`Say what you think`,`Be upfront`],icon:`chat`},{id:36,idiom:`Read between the lines.`,pronunciation:`reed bee-tween dhuh lains`,category:`communication`,level:`B1`,englishMeaning:`This means to understand a hidden or real meaning that is not directly stated.`,thaiMeaning:`เข้าใจความหมายที่ซ่อนอยู่`,literalMeaning:`ภาพจากการ "อ่านช่องว่างระหว่างบรรทัด" ของข้อความ เพื่อจับใจความที่ไม่ได้เขียนไว้ตรง ๆ`,usage:`Use this when talking about noticing an implied meaning in someone's words, tone, or a written message.`,formality:`neutral`,examples:[{english:`She said she was 'fine' with the plan, but if you read between the lines, she clearly wasn't happy.`,thai:`เธอบอกว่า 'โอเค' กับแผนนี้ แต่ถ้าอ่านความหมายที่ซ่อนอยู่จริง ๆ ก็รู้ว่าเธอไม่ค่อยพอใจเท่าไหร่`},{english:`You have to read between the lines with his emails, he never says exactly what he wants.`,thai:`ต้องพยายามเข้าใจความหมายที่ซ่อนอยู่ในอีเมลของเขา เพราะเขาไม่เคยบอกตรง ๆ ว่าต้องการอะไร`}],dialogue:{speakerA:`The client just said 'we'll think about it and get back to you'.`,speakerB:`If you read between the lines, that usually means no.`},commonMistake:`This describes interpreting hidden meaning, not literal reading skill — it is never used for someone who is simply bad at reading text.`,similarExpressions:[`Pick up on hints`,`Get the subtext`],icon:`book`},{id:37,idiom:`Word of mouth.`,pronunciation:`werd uv mauth`,category:`communication`,level:`B1`,englishMeaning:`This means information that spreads by people telling each other, rather than through ads or official news.`,thaiMeaning:`การบอกต่อกันปากต่อปาก`,literalMeaning:`คำพูดที่ส่งต่อ "จากปากสู่ปาก" ของคนหนึ่งไปสู่อีกคนหนึ่ง`,usage:`Use this when explaining how news, recommendations, or reputations spread informally between people.`,formality:`neutral`,examples:[{english:`This restaurant doesn't advertise at all, it's all word of mouth.`,thai:`ร้านนี้ไม่ลงโฆษณาเลย ดังได้ก็เพราะการบอกต่อกันปากต่อปากล้วน ๆ`},{english:`I heard about the job opening through word of mouth from a former colleague.`,thai:`ฉันรู้เรื่องตำแหน่งงานว่างนี้จากการบอกต่อปากต่อปากจากเพื่อนร่วมงานเก่า`}],dialogue:{speakerA:`How did you find this hair salon? It's amazing.`,speakerB:`Word of mouth, my sister recommended it.`},commonMistake:`This is a noun phrase, usually used with "by" or "through" ("by word of mouth"), not as a verb — you cannot say "we word of mouth it".`,similarExpressions:[`Grapevine`,`Buzz`],icon:`chat`},{id:38,idiom:`Let the cat out of the bag.`,pronunciation:`let dhuh cat out uv dhuh bag`,category:`communication`,level:`B1`,englishMeaning:`This means to accidentally reveal a secret that was supposed to stay hidden.`,thaiMeaning:`เผลอเปิดเผยความลับ`,literalMeaning:`ภาพของ "แมวที่หลุดออกมาจากถุง" ซึ่งเดิมทีถูกซ่อนไว้ข้างใน`,usage:`Use this when someone accidentally reveals a surprise, secret plan, or piece of confidential information.`,formality:`casual`,examples:[{english:`We were planning a surprise party, but my brother let the cat out of the bag.`,thai:`เราวางแผนจัดปาร์ตี้เซอร์ไพรส์อยู่ดี ๆ แต่น้องชายฉันดันเผลอเปิดเผยความลับซะก่อน`},{english:`Please don't let the cat out of the bag about the engagement until we announce it.`,thai:`อย่าเพิ่งเผลอเปิดเผยความลับเรื่องหมั้นนะ จนกว่าเราจะประกาศเอง`}],dialogue:{speakerA:`Wait, you're moving to Chiang Mai? How do I already know that?`,speakerB:`Oops, sorry, I guess someone let the cat out of the bag.`},commonMistake:`This idiom is about revealing a secret unintentionally or carelessly, not about confessing on purpose — for a deliberate confession, "come clean" fits better.`,similarExpressions:[`Spill the beans`,`Give the game away`],icon:`key`},{id:39,idiom:`Actions speak louder than words.`,pronunciation:`ak-shuhns speek lau-der dhan werds`,category:`communication`,level:`B1`,englishMeaning:`This means what someone actually does matters more than what they promise or say.`,thaiMeaning:`การกระทำสำคัญกว่าคำพูด`,literalMeaning:`เปรียบ "การกระทำ" ว่าดัง (มีน้ำหนัก) กว่า "คำพูด" ในการสื่อความหมาย`,usage:`Use this proverb when judging or advising someone based on real behavior instead of promises or apologies.`,formality:`formal`,examples:[{english:`He keeps saying sorry, but actions speak louder than words, so let's see if he actually changes.`,thai:`เขาขอโทษอยู่นั่นแหละ แต่การกระทำสำคัญกว่าคำพูด ลองดูก่อนว่าเขาจะเปลี่ยนจริงไหม`},{english:`The company talks a lot about sustainability, but actions speak louder than words when it comes to real change.`,thai:`บริษัทพูดเรื่องความยั่งยืนเยอะมาก แต่การกระทำสำคัญกว่าคำพูด ถ้าอยากเห็นการเปลี่ยนแปลงจริง ๆ`}],dialogue:{speakerA:`He promised he'd help more around the house this time.`,speakerB:`We'll see. Actions speak louder than words in my experience.`},commonMistake:`As a fixed proverb, the wording stays exactly the same every time — do not change the tense or add words like "always" in the middle of the phrase.`,similarExpressions:[`Talk is cheap`,`Show, don't tell`],icon:`shield`},{id:40,idiom:`We're on the same page.`,pronunciation:`weer on dhuh saym payj`,category:`communication`,level:`B1`,englishMeaning:`This means two or more people understand or agree with each other about something.`,thaiMeaning:`เราเข้าใจตรงกัน`,literalMeaning:`ภาพของคนที่กำลังอ่าน "หน้าเดียวกัน" ของหนังสือ คือเข้าใจตรงกันในเรื่องเดียวกัน`,usage:`Use this to confirm mutual understanding or agreement before moving forward with a plan or decision, often in work settings.`,formality:`neutral`,examples:[{english:`Before we start the project, let's make sure we're on the same page about the deadline.`,thai:`ก่อนเริ่มโปรเจกต์ เรามาทำความเข้าใจตรงกันเรื่องกำหนดส่งก่อนดีกว่า`},{english:`I think we're on the same page about the budget, but let's confirm with the team.`,thai:`ฉันว่าเราเข้าใจตรงกันเรื่องงบประมาณแล้วนะ แต่ลองยืนยันกับทีมอีกทีดีกว่า`}],dialogue:{speakerA:`So the plan is to launch next Monday, right?`,speakerB:`Yes, exactly, glad we're on the same page.`},commonMistake:`This describes shared understanding between people, not literal physical pages — it should not be used to talk about actual books or documents.`,similarExpressions:[`See eye to eye`,`In agreement`],icon:`handshake`}],Kn=[{id:41,idiom:`Pull the trigger.`,pronunciation:`pull thuh trig-ger`,category:`decisions`,level:`B1`,englishMeaning:`You finally decide to do something you've been hesitating about.`,thaiMeaning:`ตัดสินใจลงมือทำ`,literalMeaning:`ดึงไกปืน (ลั่นไกยิง)`,usage:`Use when someone finally commits to a decision after hesitating, especially something big or risky.`,formality:`casual`,examples:[{english:`I've been thinking about starting my own business for years, but I finally decided to pull the trigger last month.`,thai:`ฉันคิดเรื่องเปิดธุรกิจของตัวเองมาหลายปีแล้ว แต่ในที่สุดเดือนที่แล้วก็ตัดสินใจลงมือทำสักที`},{english:`He kept comparing prices for weeks before deciding to pull the trigger and buy the car.`,thai:`เขาเปรียบเทียบราคาอยู่หลายสัปดาห์ก่อนจะตัดสินใจลงมือซื้อรถคันนั้นในที่สุด`}],dialogue:{speakerA:`Are you still deciding about the new apartment?`,speakerB:`No, I pulled the trigger yesterday — I signed the lease!`},commonMistake:`Learners often say "pull a trigger" — it's always "pull the trigger," and it should describe a decisive commitment, not just any small choice.`,similarExpressions:[`Take the plunge`,`Make the call`,`Go for it`],icon:`spark`},{id:42,idiom:`Make up your mind.`,pronunciation:`make uhp yor mynd`,category:`decisions`,level:`A2`,englishMeaning:`You need to choose one option and stop going back and forth.`,thaiMeaning:`ตัดสินใจให้ได้`,literalMeaning:null,usage:`Use when telling someone (or yourself) to stop hesitating between choices and decide already.`,formality:`casual`,examples:[{english:`You've changed your order three times — please make up your mind!`,thai:`คุณเปลี่ยนออเดอร์มาสามรอบแล้วนะ ตัดสินใจให้ได้สักทีเถอะ!`},{english:`Stop overthinking and just make up your mind already!`,thai:`เลิกคิดมากได้แล้ว ตัดสินใจให้ได้สักทีเถอะ!`}],dialogue:{speakerA:`Do you want pizza or sushi tonight?`,speakerB:`I can't make up my mind — can we just get both?`},commonMistake:`Don't drop "up" — "make your mind" isn't correct English; it must be "make up your mind," and the possessive changes with the subject (my/his/her mind).`,similarExpressions:[`Decide once and for all`,`Come to a decision`],icon:`brain`},{id:43,idiom:`Sleep on it.`,pronunciation:`sleep on it`,category:`decisions`,level:`A2`,englishMeaning:`You wait until the next day to decide, so you can think about it more clearly.`,thaiMeaning:`ขอเวลาคิดดูก่อนหนึ่งคืน`,literalMeaning:`นอนทับมัน (นอนคิดดูก่อน)`,usage:`Use when you want to postpone a decision until after a night's rest, to think with a clear head.`,formality:`neutral`,examples:[{english:`That's a big offer — why don't you sleep on it and give me your answer tomorrow?`,thai:`ข้อเสนอนี้ใหญ่นะ ทำไมไม่ลองขอเวลาคิดดูก่อนหนึ่งคืนแล้วค่อยตอบพรุ่งนี้ล่ะ?`},{english:`I was going to accept the job right away, but I decided to sleep on it first.`,thai:`ตอนแรกฉันจะตอบรับงานนั้นทันที แต่ตัดสินใจขอเวลาคิดดูก่อนหนึ่งคืน`}],dialogue:{speakerA:`So, are you buying the house or not?`,speakerB:`It's a huge decision — let me sleep on it tonight.`},commonMistake:`This phrase means postponing a decision overnight, not literally falling asleep on top of something — don't translate it word for word.`,similarExpressions:[`Think it over`,`Give it some thought`],icon:`moon`},{id:44,idiom:`Take a chance.`,pronunciation:`take uh chans`,category:`decisions`,level:`A2`,englishMeaning:`You try something even though the result isn't certain.`,thaiMeaning:`ลองเสี่ยงดู`,literalMeaning:null,usage:`Use when encouraging someone to try something risky or uncertain, or describing your own decision to do so.`,formality:`casual`,examples:[{english:`I don't know if this recipe will turn out well, but let's take a chance and try it.`,thai:`ฉันไม่รู้ว่าสูตรนี้จะออกมาอร่อยไหม แต่ลองเสี่ยงดูกันเถอะ`},{english:`Even though she didn't meet all the requirements, she decided to take a chance and apply for the job.`,thai:`แม้ว่าคุณสมบัติของเธอจะไม่ครบตามที่ต้องการทุกข้อ แต่เธอก็ตัดสินใจลองเสี่ยงดูและสมัครงานนั้น`}],dialogue:{speakerA:`What if the investment doesn't work out?`,speakerB:`It might not, but I want to take a chance anyway.`},commonMistake:`Don't confuse this with "by chance" (meaning "by accident") — "take a chance" always means a deliberate risk you choose to accept.`,similarExpressions:[`Take a risk`,`Roll the dice`,`Give it a shot`],icon:`compass`},{id:45,idiom:`Play it safe.`,pronunciation:`play it seyf`,category:`decisions`,level:`A2`,englishMeaning:`You choose the option with the least risk instead of trying something bold.`,thaiMeaning:`เลือกทางที่ปลอดภัย`,literalMeaning:null,usage:`Use when someone avoids risk and chooses a cautious, predictable option instead.`,formality:`neutral`,examples:[{english:`Instead of investing everything in one stock, it's smarter to play it safe and spread your money around.`,thai:`แทนที่จะทุ่มเงินทั้งหมดลงหุ้นตัวเดียว ฉลาดกว่าถ้าจะเลือกทางที่ปลอดภัยและกระจายเงินลงทุน`},{english:`We could try the shortcut through the forest, but let's play it safe and stick to the main road.`,thai:`เราจะลองไปทางลัดผ่านป่าก็ได้ แต่เอาเป็นว่าเลือกทางที่ปลอดภัยแล้วไปตามถนนหลักดีกว่า`}],dialogue:{speakerA:`Should we bet on the underdog team?`,speakerB:`Let's play it safe and go with the favorite instead.`},commonMistake:`This describes a cautious strategy or choice, not literally "playing" a game — it's often used about decisions, money, or plans.`,similarExpressions:[`Err on the side of caution`,`Not rock the boat`],icon:`shield`},{id:46,idiom:`Take matters into your own hands.`,pronunciation:`take mat-ers in-too yor ohn hands`,category:`decisions`,level:`B1`,englishMeaning:`You stop waiting for others and personally deal with a problem yourself.`,thaiMeaning:`จัดการเรื่องนั้นด้วยตัวเอง`,literalMeaning:`เอาเรื่องราวมาไว้ในมือของตัวเอง`,usage:`Use when someone decides to solve a problem themselves instead of relying on others or waiting for help.`,formality:`neutral`,examples:[{english:`When no one fixes the problem, you just have to take matters into your own hands.`,thai:`เมื่อไม่มีใครแก้ปัญหาให้ คุณก็ต้องจัดการเรื่องนั้นด้วยตัวเองแล้วล่ะ`},{english:`If nobody helps you fix the scheduling mess, you might need to take matters into your own hands and sort it out yourself.`,thai:`ถ้าไม่มีใครช่วยแก้ปัญหาตารางเวลาที่ยุ่งเหยิงให้คุณ คุณอาจต้องจัดการเรื่องนั้นด้วยตัวเองแล้วลงมือแก้ไขเอง`}],dialogue:{speakerA:`The IT department still hasn't fixed my computer.`,speakerB:`Just take matters into your own hands and restart it yourself.`},commonMistake:`Keep the possessive matching the subject — "into my own hands," "into her own hands" — dropping "own" or changing the pronoun sounds unnatural.`,similarExpressions:[`Handle it yourself`,`Deal with it directly`],icon:`hands`},{id:47,idiom:`Cross that bridge when we come to it.`,pronunciation:`kraws that brij wen wee kuhm too it`,category:`decisions`,level:`B1`,englishMeaning:`You decide not to worry about a future problem until it actually happens.`,thaiMeaning:`ค่อยจัดการเมื่อปัญหานั้นมาถึง`,literalMeaning:`ข้ามสะพานนั้นตอนที่เราไปถึง`,usage:`Use when someone wants to postpone worrying about a potential future problem until it becomes real.`,formality:`neutral`,examples:[{english:`What if the flight gets cancelled? — Let's cross that bridge when we come to it and just enjoy the trip for now.`,thai:`ถ้าเที่ยวบินถูกยกเลิกล่ะ? — ค่อยจัดการเมื่อปัญหานั้นมาถึงก็แล้วกัน ตอนนี้สนุกกับทริปไปก่อนดีกว่า`},{english:`I know the loan payment might be hard next year, but let's cross that bridge when we come to it.`,thai:`ฉันรู้ว่าการผ่อนชำระเงินกู้ปีหน้าอาจจะลำบาก แต่เอาไว้ค่อยจัดการเมื่อปัญหานั้นมาถึงก็แล้วกัน`}],dialogue:{speakerA:`What will we do if the client cancels the contract?`,speakerB:`Let's cross that bridge when we come to it — no need to panic now.`},commonMistake:`Don't say "cross the bridge when it comes" — it's the bridge you "come to," not the problem, and the phrase always keeps "that bridge."`,similarExpressions:[`Deal with it later`,`Not borrow trouble`],icon:`clock`},{id:48,idiom:`Bite the bullet.`,pronunciation:`byte thuh bull-it`,category:`decisions`,level:`B1`,englishMeaning:`You force yourself to do something difficult or unpleasant because it has to be done.`,thaiMeaning:`ยอมเผชิญสิ่งที่ยากหรือไม่พึงประสงค์`,literalMeaning:`กัดลูกกระสุนปืน (ทนความเจ็บปวด)`,usage:`Use when someone finally accepts and faces a hard, uncomfortable, or unavoidable task.`,formality:`casual`,examples:[{english:`I hate going to the dentist, but I know I need to bite the bullet and make an appointment.`,thai:`ฉันเกลียดการไปหาหมอฟันมาก แต่ก็รู้ว่าต้องยอมเผชิญและนัดหมายไปตรวจสักที`},{english:`The company had to bite the bullet and lay off some employees to survive the crisis.`,thai:`บริษัทต้องยอมเผชิญสิ่งที่ไม่พึงประสงค์ด้วยการปลดพนักงานบางส่วนเพื่อให้อยู่รอดในช่วงวิกฤต`}],dialogue:{speakerA:`Are you ever going to tell your boss about the mistake?`,speakerB:`Yeah, I'll just bite the bullet and tell him tomorrow morning.`},commonMistake:`This idiom refers to enduring something unpleasant, not literally chewing anything — avoid using it for small, easy decisions that involve no discomfort.`,similarExpressions:[`Grit your teeth`,`Face the music`],icon:`warning`},{id:49,idiom:`Go with the flow.`,pronunciation:`go with thuh floh`,category:`decisions`,level:`A2`,englishMeaning:`You relax and accept things as they happen instead of trying to control every detail.`,thaiMeaning:`ปล่อยไปตามสถานการณ์`,literalMeaning:`ไหลไปตามกระแสน้ำ`,usage:`Use when describing a relaxed, easygoing attitude toward plans or unexpected changes.`,formality:`casual`,examples:[{english:`We didn't book anything for the trip — we just wanted to go with the flow and see what happens.`,thai:`เราไม่ได้จองอะไรไว้ล่วงหน้าสำหรับทริปนี้เลย แค่อยากปล่อยไปตามสถานการณ์แล้วดูว่าจะเป็นยังไง`},{english:`The schedule keeps changing, but he prefers to go with the flow and not complain.`,thai:`ตารางเวลาเปลี่ยนไปเรื่อยๆ แต่เขาก็เลือกที่จะปล่อยไปตามสถานการณ์โดยไม่บ่นอะไร`}],dialogue:{speakerA:`The meeting time changed again — are you annoyed?`,speakerB:`Not really, I try to just go with the flow these days.`},commonMistake:`This describes a general attitude of flexibility, not a one-time decision — it's usually used in the simple present to describe someone's personality or habit.`,similarExpressions:[`Roll with it`,`Take it as it comes`],icon:`sun`},{id:50,idiom:`Take the first step.`,pronunciation:`take thuh ferst step`,category:`decisions`,level:`A2`,englishMeaning:`You begin doing something you've been putting off, even if it's small.`,thaiMeaning:`เริ่มก้าวแรก`,literalMeaning:null,usage:`Use when encouraging someone to start a task or goal, especially after hesitating for a long time.`,formality:`neutral`,examples:[{english:`If you want to change careers, you have to take the first step and update your resume.`,thai:`ถ้าอยากเปลี่ยนสายอาชีพ คุณต้องเริ่มก้าวแรกด้วยการอัปเดตเรซูเม่ของตัวเอง`},{english:`It took her months to decide, but she was finally ready to take the first step and sign up for the class.`,thai:`เธอใช้เวลาหลายเดือนกว่าจะตัดสินใจ แต่ในที่สุดก็พร้อมจะเริ่มก้าวแรกด้วยการสมัครเรียนคอร์สนั้น`}],dialogue:{speakerA:`I really want to learn to swim, but I'm scared.`,speakerB:`Just take the first step — sign up for one lesson and see how it feels.`},commonMistake:`Always use "the first step," not "a first step," when referring to this fixed idiom about starting something important.`,similarExpressions:[`Get the ball rolling`,`Start somewhere`],icon:`key`}],qn=[{id:51,idiom:`Hold your horses.`,pronunciation:`hohld yor hor-siz`,category:`time-patience`,level:`A2`,englishMeaning:`You are telling someone to slow down and not rush into something.`,thaiMeaning:`ใจเย็น ๆ / รอก่อน`,literalMeaning:`แปลตรงตัวว่า "ดึงบังเหียนม้าไว้" คือหยุดม้าไม่ให้วิ่งออกไปก่อน`,usage:`Use it casually to tell someone to wait or calm down before acting too quickly.`,formality:`casual`,examples:[{english:`Hold your horses, we still need to check the price before we buy it.`,thai:`ใจเย็นก่อนสิ เรายังต้องเช็คราคาก่อนที่จะซื้อมันเลยนะ`},{english:`Whoa, hold your horses! The meeting hasn't even started yet.`,thai:`เฮ้ย ใจเย็น ๆ ก่อน การประชุมยังไม่เริ่มเลยด้วยซ้ำ`}],dialogue:{speakerA:`Let's just send the email right now, no need to review it!`,speakerB:`Hold your horses, let me read it one more time first.`},commonMistake:`This is spoken and casual — do not use it in formal writing or with someone you need to show respect to, like a boss or a client, since it can sound bossy.`,similarExpressions:[`Slow down`,`Keep your shirt on`,`Wait a second`],icon:`hands`},{id:52,idiom:`Better late than never.`,pronunciation:`bet-ter layt than ne-ver`,category:`time-patience`,level:`A2`,englishMeaning:`Doing something late is still better than not doing it at all.`,thaiMeaning:`มาช้ายังดีกว่าไม่มา`,literalMeaning:null,usage:`Say this to comfort someone who arrives late or finishes something behind schedule.`,formality:`neutral`,examples:[{english:`She finally replied to my message after two weeks, but better late than never.`,thai:`เธอเพิ่งตอบข้อความฉันหลังจากผ่านไปสองอาทิตย์ แต่มาช้ายังดีกว่าไม่มา`},{english:`He submitted the report a day late, but I told him better late than never.`,thai:`เขาส่งรายงานช้าไปหนึ่งวัน แต่ฉันบอกเขาว่ามาช้ายังดีกว่าไม่มา`}],dialogue:{speakerA:`I'm so sorry I'm three days late returning your book!`,speakerB:`Don't worry about it — better late than never.`},commonMistake:`It works as a complete standalone sentence, so avoid forcing it into a longer sentence like "he is better late than never" — just say it on its own after mentioning the delay.`,similarExpressions:[`It's the thought that counts`,`At least you made it`],icon:`clock`},{id:53,idiom:`Time flies.`,pronunciation:`tighm flighs`,category:`time-patience`,level:`A2`,englishMeaning:`Time seems to pass very quickly, especially when you are busy or having fun.`,thaiMeaning:`เวลาผ่านไปเร็วมาก`,literalMeaning:`แปลตรงตัวว่า "เวลาบิน" ใช้เปรียบเทียบว่าเวลาผ่านไปเร็วเหมือนสิ่งที่บินได้`,usage:`Use it when you are surprised at how quickly time has passed, often when reflecting on the past.`,formality:`casual`,examples:[{english:`I can't believe it's already been five years since we graduated — time flies.`,thai:`ไม่อยากเชื่อเลยว่าผ่านมาห้าปีแล้วตั้งแต่เราเรียนจบ เวลาผ่านไปเร็วจริง ๆ`},{english:`Time flies when you're having a good conversation like this.`,thai:`เวลาผ่านไปเร็วมากเวลาที่เราได้คุยกันสนุก ๆ แบบนี้`}],dialogue:{speakerA:`Wow, is it already 9 PM? We just got here!`,speakerB:`I know, time flies when you're having fun.`},commonMistake:`It is almost always used with "when" to add a reason (time flies when...), so using it completely alone can sound a bit unfinished in conversation.`,similarExpressions:[`Where did the time go?`,`The time just flew by`],icon:`clock`},{id:54,idiom:`In the nick of time.`,pronunciation:`in thuh nik uv tighm`,category:`time-patience`,level:`B1`,englishMeaning:`Something happens at the very last possible moment, just before it would be too late.`,thaiMeaning:`ทันเวลาแบบฉิวเฉียด`,literalMeaning:`"nick" หมายถึงรอยบากเล็ก ๆ สื่อถึงช่วงเวลาแคบ ๆ ก่อนที่ทุกอย่างจะสายเกินไป`,usage:`Use it to describe a close call, when someone or something arrives or is finished right before a deadline or danger.`,formality:`neutral`,examples:[{english:`We caught the last train in the nick of time, just as the doors were closing.`,thai:`เราขึ้นรถไฟเที่ยวสุดท้ายได้ทันเวลาแบบฉิวเฉียด ในจังหวะที่ประตูกำลังจะปิดพอดี`},{english:`The doctor arrived in the nick of time to save the patient.`,thai:`หมอมาถึงทันเวลาแบบฉิวเฉียดจนสามารถช่วยชีวิตคนไข้ไว้ได้`}],dialogue:{speakerA:`Did you make it to the airport before check-in closed?`,speakerB:`Barely — we got there in the nick of time.`},commonMistake:`Always includes "the" — it is "in the nick of time," not "in nick of time" — dropping the article is a common learner error.`,similarExpressions:[`Just in time`,`By a hair's breadth`,`At the eleventh hour`],icon:`clock`},{id:55,idiom:`Once in a blue moon.`,pronunciation:`wuhns in uh bloo moon`,category:`time-patience`,level:`B1`,englishMeaning:`Something happens extremely rarely, almost never.`,thaiMeaning:`นาน ๆ ครั้ง`,literalMeaning:`"blue moon" คือดวงจันทร์เต็มดวงครั้งที่สองในเดือนเดียวกัน ซึ่งเกิดขึ้นน้อยมาก จึงใช้แทนความหมายว่า "นาน ๆ จะเกิดขึ้นที"`,usage:`Use it to emphasize how uncommon or infrequent something is, often in a light, conversational way.`,formality:`casual`,examples:[{english:`My grandmother visits the city once in a blue moon, so we always celebrate when she comes.`,thai:`คุณยายมาเที่ยวในเมืองนาน ๆ ครั้ง เราเลยฉลองกันทุกครั้งที่ท่านมา`},{english:`He eats fast food once in a blue moon, but otherwise he cooks at home.`,thai:`เขากินฟาสต์ฟู้ดนาน ๆ ครั้ง แต่ปกติแล้วเขาทำอาหารกินเองที่บ้าน`}],dialogue:{speakerA:`Do you two still argue about small things?`,speakerB:`Only once in a blue moon these days.`},commonMistake:`It describes frequency, not a single rare event in the past — avoid using it for a one-time occurrence like "I saw a shooting star once in a blue moon" (say "once" or "one rare time" instead).`,similarExpressions:[`Rarely ever`,`Few and far between`,`Once in a while`],icon:`moon`},{id:56,idiom:`Around the clock.`,pronunciation:`uh-rownd thuh klok`,category:`time-patience`,level:`B1`,englishMeaning:`Something continues nonstop, all day and all night, without stopping.`,thaiMeaning:`ตลอดยี่สิบสี่ชั่วโมง`,literalMeaning:`สื่อภาพเข็มนาฬิกาที่หมุนไปรอบ ๆ หน้าปัดไม่หยุด เหมือนเวลาที่ผ่านไปตลอดทั้งวันทั้งคืน`,usage:`Use it to describe continuous work, care, or activity that runs 24 hours a day.`,formality:`neutral`,examples:[{english:`The nurses worked around the clock to take care of the patients during the storm.`,thai:`พยาบาลทำงานตลอดยี่สิบสี่ชั่วโมงเพื่อดูแลคนไข้ในช่วงที่เกิดพายุ`},{english:`This convenience store is open around the clock, even on holidays.`,thai:`ร้านสะดวกซื้อนี้เปิดตลอดยี่สิบสี่ชั่วโมง แม้แต่ในวันหยุดก็ตาม`}],dialogue:{speakerA:`How did the team finish the project so fast?`,speakerB:`They worked around the clock for the whole week.`},commonMistake:`It describes continuous duration, so it should not be paired with a single point in time — say "we worked around the clock" not "we worked around the clock at 9 PM."`,similarExpressions:[`Day and night`,`Nonstop`,`Round the clock`],icon:`clock`},{id:57,idiom:`At the last minute.`,pronunciation:`at thuh last mi-nit`,category:`time-patience`,level:`A2`,englishMeaning:`Something is done or decided very close to a deadline, right before it is too late.`,thaiMeaning:`ในนาทีสุดท้าย`,literalMeaning:null,usage:`Use it to describe last-minute decisions, changes, or actions that happen right before a deadline.`,formality:`neutral`,examples:[{english:`He always packs his suitcase at the last minute before a trip.`,thai:`เขาเก็บกระเป๋าเดินทางในนาทีสุดท้ายก่อนออกเดินทางทุกครั้ง`},{english:`We changed the venue at the last minute because it started raining.`,thai:`เราเปลี่ยนสถานที่จัดงานในนาทีสุดท้ายเพราะฝนเริ่มตก`}],dialogue:{speakerA:`Why is your presentation still not finished?`,speakerB:`I always end up doing things at the last minute, I know it's a bad habit.`},commonMistake:`Remember the preposition "at," not "in" or "on" — it is "at the last minute," a fixed phrase that does not change with tense.`,similarExpressions:[`Last-minute`,`At the eleventh hour`,`Just in time`],icon:`clock`},{id:58,idiom:`Sooner or later.`,pronunciation:`soo-ner or lay-ter`,category:`time-patience`,level:`A2`,englishMeaning:`Something is certain to happen eventually, even if you do not know exactly when.`,thaiMeaning:`ไม่ช้าก็เร็ว`,literalMeaning:null,usage:`Use it to say that an outcome is inevitable, whether it happens soon or after some delay.`,formality:`neutral`,examples:[{english:`Sooner or later, you'll have to tell your parents about the accident.`,thai:`ไม่ช้าก็เร็ว คุณก็ต้องบอกพ่อแม่เรื่องอุบัติเหตุอยู่ดี`},{english:`Sooner or later, the truth always comes out.`,thai:`ไม่ช้าก็เร็ว ความจริงก็จะเปิดเผยออกมาเสมอ`}],dialogue:{speakerA:`I don't think anyone noticed I broke the vase.`,speakerB:`Sooner or later, someone will find out, trust me.`},commonMistake:`It usually starts a sentence as an introductory phrase followed by a comma — avoid squeezing it awkwardly in the middle without proper punctuation.`,similarExpressions:[`Eventually`,`In due time`,`One way or another`],icon:`clock`},{id:59,idiom:`That ship has sailed.`,pronunciation:`that ship haz sayld`,category:`time-patience`,level:`B1`,englishMeaning:`The chance to do something has already passed and it is now too late.`,thaiMeaning:`สายเกินไปแล้ว / โอกาสนั้นผ่านไปแล้ว`,literalMeaning:`แปลตรงตัวว่า "เรือลำนั้นออกไปแล้ว" สื่อว่าโอกาสได้ล่องเรือไปพร้อมกันได้ผ่านพ้นไปแล้ว`,usage:`Use it to tell someone, sometimes with a hint of regret, that an opportunity is gone and cannot be recovered.`,formality:`casual`,examples:[{english:`I wanted to apply for that scholarship, but that ship has sailed since the deadline passed.`,thai:`ฉันอยากสมัครทุนนั้น แต่สายเกินไปแล้วเพราะกำหนดส่งผ่านไปแล้ว`},{english:`You could have asked her out last year, but that ship has sailed — she's married now.`,thai:`คุณน่าจะชวนเธอออกเดทตั้งแต่ปีที่แล้ว แต่ตอนนี้โอกาสนั้นผ่านไปแล้ว เธอแต่งงานแล้ว`}],dialogue:{speakerA:`Maybe I should still apply for that job opening from last month.`,speakerB:`Sorry, that ship has sailed — they already hired someone.`},commonMistake:`It refers to a missed opportunity, not literal transportation — do not use it when talking about an actual boat or ship leaving a port.`,similarExpressions:[`Missed the boat`,`Too little, too late`,`The window has closed`],icon:`clock`},{id:60,idiom:`Take your time.`,pronunciation:`tayk yor tighm`,category:`time-patience`,level:`A2`,englishMeaning:`You are telling someone there is no rush and they can do something slowly and carefully.`,thaiMeaning:`ไม่ต้องรีบ / ค่อย ๆ ทำ`,literalMeaning:null,usage:`Use it kindly to reassure someone that they do not need to hurry, especially when they seem stressed or rushed.`,formality:`casual`,examples:[{english:`Take your time, there's no need to rush your answer.`,thai:`ไม่ต้องรีบนะ ค่อย ๆ ตอบก็ได้`},{english:`The interviewer smiled and said, "Take your time," before I answered each question.`,thai:`ผู้สัมภาษณ์ยิ้มแล้วบอกว่า "ค่อย ๆ ตอบก็ได้" ก่อนที่ฉันจะตอบคำถามแต่ละข้อ`}],dialogue:{speakerA:`I'm so nervous, I might mess up my speech.`,speakerB:`It's okay, just take your time and breathe.`},commonMistake:`The possessive changes with the subject (take your time, take his time, take my time) — do not keep "your" fixed regardless of who you are speaking about.`,similarExpressions:[`No rush`,`Take it easy`,`There's no hurry`],icon:`sun`}],Jn=[{id:61,idiom:`It costs an arm and a leg.`,pronunciation:`it kosts an ahm and uh leg`,category:`money-value`,level:`A2`,englishMeaning:`You say this when something is extremely expensive.`,thaiMeaning:`มันแพงมาก`,literalMeaning:`มันแพงจนต้องจ่ายด้วยแขนและขา`,usage:`Use it to complain or comment on the very high price of something you bought or saw.`,formality:`casual`,examples:[{english:`The new laptop is amazing, but it costs an arm and a leg.`,thai:`โน้ตบุ๊กเครื่องใหม่เจ๋งมาก แต่มันแพงมากเลย`},{english:`I love that jacket, but it costs an arm and a leg, so I'll wait for a discount.`,thai:`ฉันชอบแจ็คเก็ตตัวนั้นมาก แต่มันแพงมาก เลยขอรอให้ลดราคาก่อน`}],dialogue:{speakerA:`Did you buy that new phone you wanted?`,speakerB:`No way, it costs an arm and a leg. I'll wait for a sale.`},commonMistake:`It is always used for prices, not for pain or injury — never use it to describe something physically hurting you.`,similarExpressions:[`cost a fortune`,`pay a king’s ransom`],icon:`coin`},{id:62,idiom:`Dirt cheap.`,pronunciation:`durt cheep`,category:`money-value`,level:`A2`,englishMeaning:`You say this when something is very inexpensive, often surprisingly so.`,thaiMeaning:`ราคาถูกมาก`,literalMeaning:null,usage:`Use it when praising a great bargain or explaining why something was easy to afford.`,formality:`casual`,examples:[{english:`These mangoes are dirt cheap at the morning market right now.`,thai:`มะม่วงที่ตลาดเช้าตอนนี้ราคาถูกมาก`},{english:`I found a hotel near the beach that was dirt cheap for a whole week.`,thai:`ฉันเจอโรงแรมใกล้ชายหาดที่ราคาถูกมากสำหรับพักทั้งอาทิตย์`}],dialogue:{speakerA:`Where did you get that jacket? It looks great.`,speakerB:`Thanks! It was dirt cheap, only 200 baht at the outlet sale.`},commonMistake:`Keep it casual — it's a bit informal, so avoid it in formal writing or business reports; say 'very affordable' instead.`,similarExpressions:[`a steal`,`cheap as chips`],icon:`coin`},{id:63,idiom:`Break the bank.`,pronunciation:`brayk thuh bank`,category:`money-value`,level:`B1`,englishMeaning:`It means to spend so much money that it seriously hurts your finances.`,thaiMeaning:`ใช้เงินมากจนแทบหมดตัว`,literalMeaning:`ทำให้ธนาคารพัง`,usage:`Use it to describe a purchase or plan that would use up most or all of your available money.`,formality:`neutral`,examples:[{english:`We don't have to break the bank to have a nice birthday dinner.`,thai:`เราไม่จำเป็นต้องใช้เงินจนแทบหมดตัวเพื่อมื้อค่ำวันเกิดดีๆ`},{english:`Buying a used car instead of a new one won’t break the bank.`,thai:`ซื้อรถมือสองแทนรถใหม่จะไม่ทำให้เราใช้เงินจนหมดตัว`}],dialogue:{speakerA:`Should we book the fancy resort for the trip?`,speakerB:`Let's find something nice that won't break the bank, okay?`},commonMistake:`It's almost always used in the negative ('won't break the bank') to reassure someone something is affordable.`,similarExpressions:[`cost a fortune`,`clean you out`],icon:`coin`},{id:64,idiom:`Save for a rainy day.`,pronunciation:`sayv for uh rayny day`,category:`money-value`,level:`B1`,englishMeaning:`It means to keep money aside now in case you need it during a difficult time later.`,thaiMeaning:`เก็บเงินไว้ใช้ยามจำเป็น`,literalMeaning:`เก็บเงินไว้สำหรับวันที่ฝนตก`,usage:`Use it when talking about the habit or wisdom of setting money aside for future emergencies.`,formality:`neutral`,examples:[{english:`My grandmother always told me to save for a rainy day.`,thai:`คุณยายของฉันสอนเสมอว่าให้เก็บเงินไว้ใช้ยามจำเป็น`},{english:`He puts a small amount from every paycheck aside to save for a rainy day.`,thai:`เขากันเงินส่วนหนึ่งจากทุกเดือนเก็บไว้ใช้ยามจำเป็นเสมอ`}],dialogue:{speakerA:`Why don’t you spend your whole bonus on a new TV?`,speakerB:`I'd rather save for a rainy day, you never know what might happen.`},commonMistake:`It refers to a metaphorical hard time, not literal weather — don't use it to talk about actual rain.`,similarExpressions:[`put money aside`,`a nest egg`],icon:`umbrella`},{id:65,idiom:`Money doesn't grow on trees.`,pronunciation:`muhny duznt groh on treez`,category:`money-value`,level:`A2`,englishMeaning:`You say this to remind someone that money is limited and must be earned, not wasted.`,thaiMeaning:`เงินไม่ได้หามาง่าย ๆ`,literalMeaning:`เงินไม่ได้งอกขึ้นบนต้นไม้`,usage:`Use it, often to a child or a careless spender, as a gentle warning against wasting money.`,formality:`casual`,examples:[{english:`You can't buy every new game, money doesn't grow on trees, you know.`,thai:`ลูกซื้อเกมใหม่ทุกตัวไม่ได้หรอกนะ เงินไม่ได้หามาง่ายๆ`},{english:`Dad reminded us that money doesn't grow on trees before we went shopping.`,thai:`พ่อเตือนเราว่าเงินไม่ได้หามาง่ายๆ ก่อนที่เราจะออกไปช้อปปิ้ง`}],dialogue:{speakerA:`Can I get the newest sneakers this weekend?`,speakerB:`Money doesn't grow on trees, honey. Let's wait until your birthday.`},commonMistake:`It is usually said as friendly advice or a mild scolding, not as a harsh insult.`,similarExpressions:[`you can't spend what you don't have`],icon:`coin`},{id:66,idiom:`Get your money's worth.`,pronunciation:`get yor muhneez wurth`,category:`money-value`,level:`B1`,englishMeaning:`It means to receive good value or benefit that matches what you paid.`,thaiMeaning:`ได้รับสิ่งที่คุ้มค่ากับเงินที่จ่าย`,literalMeaning:null,usage:`Use it when evaluating whether a purchase, ticket, or subscription was worth its price.`,formality:`neutral`,examples:[{english:`Eat as much as you can at the buffet to get your money's worth.`,thai:`กินให้เต็มที่ที่บุฟเฟต์เพื่อให้คุ้มกับเงินที่จ่ายไป`},{english:`With a gym membership this expensive, you should go every day to get your money's worth.`,thai:`สมาชิกฟิตเนสแพงขนาดนี้ ควรไปให้ทุกวันเพื่อให้คุ้มกับเงินที่จ่าย`}],dialogue:{speakerA:`Was the concert ticket worth the price?`,speakerB:`Definitely, the show lasted four hours, I got my money’s worth.`},commonMistake:`Remember the possessive apostrophe in 'money's' — it's a common spelling slip in writing.`,similarExpressions:[`good bang for your buck`,`worth every penny`],icon:`trophy`},{id:67,idiom:`Make ends meet.`,pronunciation:`mayk endz meet`,category:`money-value`,level:`B1`,englishMeaning:`It means to earn just enough money to cover your basic living expenses.`,thaiMeaning:`หาเงินให้พอกับค่าใช้จ่าย`,literalMeaning:`ทำให้ปลายทั้งสองข้างมาบรรจบกัน`,usage:`Use it when talking about the struggle or effort of covering everyday costs like rent and food.`,formality:`neutral`,examples:[{english:`Since prices went up, it’s been harder for us to make ends meet.`,thai:`ตั้งแต่ของขึ้นราคา เราหาเงินให้พอกับค่าใช้จ่ายยากขึ้นมาก`},{english:`She works two jobs just to make ends meet in the city.`,thai:`เธอทำงานสองงานเพียงเพื่อหาเงินให้พอกับค่าใช้จ่ายในเมือง`}],dialogue:{speakerA:`How are you managing with the new rent prices?`,speakerB:`It's tight, but we're making ends meet for now.`},commonMistake:`It's about covering basic necessities, not about luxury spending or making a profit.`,similarExpressions:[`scrape by`,`get by financially`],icon:`coin`},{id:68,idiom:`Pay through the nose.`,pronunciation:`pay throo thuh nohz`,category:`money-value`,level:`B1`,englishMeaning:`It means to pay a price that is much higher than it should be.`,thaiMeaning:`จ่ายแพงเกินควร`,literalMeaning:`จ่ายผ่านจมูก`,usage:`Use it to complain about being overcharged or forced into an unfairly high price.`,formality:`neutral`,examples:[{english:`Tourists often pay through the nose for taxis near the airport.`,thai:`นักท่องเที่ยวมักจ่ายค่าแท็กซี่แพงเกินควรใกล้สนามบิน`},{english:`We always pay through the nose for parking during the festival weekend.`,thai:`เราต้องจ่ายค่าจอดรถแพงเกินควรทุกครั้งช่วงสุดสัปดาห์ที่มีเทศกาล`}],dialogue:{speakerA:`How much was the repair for your car?`,speakerB:`Don’t ask, I paid through the nose because I didn’t compare prices first.`},commonMistake:`Always followed by 'for' + the item or service — don't drop the preposition (e.g. 'pay through the nose for it').`,similarExpressions:[`get ripped off`,`pay top dollar`],icon:`warning`},{id:69,idiom:`A rip-off.`,pronunciation:`uh rip-awf`,category:`money-value`,level:`A2`,englishMeaning:`You say this when you feel something was priced unfairly higher than its real value.`,thaiMeaning:`ของแพงเกินจริง / ถูกเอาเปรียบเรื่องราคา`,literalMeaning:null,usage:`Use it, often in a frustrated or complaining tone, right after realizing you overpaid for something.`,formality:`casual`,examples:[{english:`Fifteen dollars for a small bottle of water at the stadium? What a rip-off!`,thai:`น้ำขวดเล็กในสนามราคาตั้งสิบห้าดอลลาร์เนี่ยนะ แพงเกินจริงชัดๆ`},{english:`That souvenir shop is such a rip-off, everything costs double the normal price.`,thai:`ร้านขายของที่ระลึกนั้นเอาเปรียบลูกค้ามาก ทุกอย่างแพงเป็นสองเท่าของราคาปกติ`}],dialogue:{speakerA:`How much did you pay for that phone case?`,speakerB:`Way too much, it was a total rip-off compared to the online price.`},commonMistake:`It can describe both a specific item ('that was a rip-off') and a place ('this shop is a rip-off') — check which noun it's modifying.`,similarExpressions:[`a scam`,`daylight robbery`],icon:`warning`},{id:70,idiom:`On a tight budget.`,pronunciation:`on uh tyt buhjit`,category:`money-value`,level:`A2`,englishMeaning:`It means you have only a limited amount of money to spend and must plan carefully.`,thaiMeaning:`มีงบจำกัด`,literalMeaning:null,usage:`Use it to explain why you are choosing cheaper options or being careful with spending.`,formality:`neutral`,examples:[{english:`We're on a tight budget this month, so let's cook at home instead of eating out.`,thai:`เดือนนี้เรามีงบจำกัด เลยทำอาหารกินเองที่บ้านดีกว่าไปกินข้างนอก`},{english:`The students planned a trip on a tight budget by sharing rooms and taking buses.`,thai:`นักเรียนวางแผนทริปแบบมีงบจำกัดโดยพักห้องรวมกันและนั่งรถบัส`}],dialogue:{speakerA:`Want to try that new fancy restaurant this weekend?`,speakerB:`I'm on a tight budget right now, can we go somewhere cheaper?`},commonMistake:`Use the preposition 'on' before it ('on a tight budget'), not 'in' or 'with', which are common errors.`,similarExpressions:[`strapped for cash`,`watching every baht`],icon:`coin`}],Yn=[{id:71,idiom:`It's not the end of the world.`,pronunciation:`its not de end ov de wurld`,category:`problems`,level:`A2`,englishMeaning:`You say this to comfort someone and remind them that a bad situation is not actually a disaster.`,thaiMeaning:`มันไม่ได้เลวร้ายขนาดนั้น`,literalMeaning:null,usage:`Use this to reassure a friend or family member who is upset about a mistake or setback.`,formality:`casual`,examples:[{english:`You failed one quiz, but it's not the end of the world — you can retake it next week.`,thai:`เธอสอบตกแค่ควิซเดียวเอง มันไม่ได้เลวร้ายขนาดนั้นหรอก อาทิตย์หน้าก็สอบใหม่ได้`},{english:`We missed the flight, but it's not the end of the world; there's another one in two hours.`,thai:`เราตกเครื่องบินก็จริง แต่มันไม่ได้เลวร้ายขนาดนั้น อีกสองชั่วโมงก็มีเที่ยวต่อไป`}],dialogue:{speakerA:`I spilled coffee all over my presentation notes right before the meeting!`,speakerB:`It's not the end of the world — just grab a fresh copy from your laptop.`},commonMistake:`This phrase comforts someone about a real but minor problem — do not use it for genuinely serious or life-changing situations, or it can sound dismissive.`,similarExpressions:[`It could be worse`,`Don't sweat it`],icon:`smile`},{id:72,idiom:`Face the music.`,pronunciation:`fays de myoo-zik`,category:`problems`,level:`B1`,englishMeaning:`To accept responsibility and deal with the unpleasant consequences of something you did, instead of avoiding them.`,thaiMeaning:`ยอมรับผลจากสิ่งที่ตัวเองทำ`,literalMeaning:`หันไปเผชิญหน้ากับเสียงดนตรี (ภาพจากทหารที่ถูกไล่ออกพร้อมเสียงกลองประจาน)`,usage:`Use this when someone must stop avoiding a problem and finally deal with criticism or punishment for their actions.`,formality:`neutral`,examples:[{english:`He broke the vase and knew he'd have to face the music when his mom got home.`,thai:`เขาทำแจกันแตกและรู้ดีว่าต้องยอมรับผลเมื่อแม่กลับมาถึงบ้าน`},{english:`The manager finally had to face the music after the project failed so badly.`,thai:`ผู้จัดการในที่สุดก็ต้องยอมรับผลที่เกิดขึ้นหลังจากโปรเจกต์ล้มเหลวอย่างหนัก`}],dialogue:{speakerA:`Are you going to tell the client the deadline slipped?`,speakerB:`Yeah, I have to face the music and explain what happened.`},commonMistake:`It always implies facing consequences you caused yourself — do not use it for bad luck or events outside your control.`,similarExpressions:[`Own up to it`,`Take the heat`],icon:`warning`},{id:73,idiom:`A blessing in disguise.`,pronunciation:`a bles-sing in dis-gyz`,category:`problems`,level:`B1`,englishMeaning:`Something that seems bad or unlucky at first but later turns out to bring an unexpected benefit.`,thaiMeaning:`เรื่องร้ายที่กลับกลายเป็นเรื่องดี`,literalMeaning:`พรที่มาในคราบปลอมตัว (ของดีที่แฝงมาในรูปของสิ่งไม่ดี)`,usage:`Use this when looking back at a past misfortune that eventually led to something positive.`,formality:`neutral`,examples:[{english:`Losing that job was a blessing in disguise — it pushed me to start my own business.`,thai:`การตกงานครั้งนั้นกลับกลายเป็นเรื่องดี เพราะมันผลักดันให้ฉันเริ่มทำธุรกิจของตัวเอง`},{english:`The delayed flight turned out to be a blessing in disguise since we avoided the storm.`,thai:`เที่ยวบินที่ล่าช้ากลับกลายเป็นเรื่องดี เพราะทำให้เรารอดพ้นจากพายุ`}],dialogue:{speakerA:`I can't believe our apartment fell through right before the move.`,speakerB:`Honestly, it might be a blessing in disguise — we found a much better one after that.`},commonMistake:`This is used only in hindsight, after the good outcome is already clear — avoid using it to predict a future benefit you are not yet sure of.`,similarExpressions:[`Every cloud has a silver lining`,`Things happen for a reason`],icon:`sun`},{id:74,idiom:`Add fuel to the fire.`,pronunciation:`ad fyoo-el too de fy-er`,category:`problems`,level:`B1`,englishMeaning:`To do or say something that makes an already bad or tense situation even worse.`,thaiMeaning:`ทำให้สถานการณ์แย่ลง`,literalMeaning:`เติมเชื้อเพลิงลงไปในกองไฟ`,usage:`Use this to criticize an action or comment that escalates an argument, conflict, or crisis.`,formality:`neutral`,examples:[{english:`Telling him he was wrong in front of everyone will only add fuel to the fire.`,thai:`การบอกเขาต่อหน้าทุกคนว่าเขาผิด จะยิ่งทำให้สถานการณ์แย่ลงไปอีก`},{english:`Raising prices during the shortage would just add fuel to the fire of public anger.`,thai:`การขึ้นราคาสินค้าช่วงขาดแคลนจะยิ่งเติมเชื้อไฟให้ความโกรธของประชาชนลุกลามหนักขึ้น`}],dialogue:{speakerA:`They're already fighting about the budget — should I bring
