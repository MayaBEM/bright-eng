ans to hold someone close?`,clueTh:`คำใดแปลว่าโอบกอดใครสักคน`,options:[`hug`,`run`,`sun`],answer:`hug`},speaking:`Say what you like to do when the sun is up.`,speakingTh:`บอกว่าคุณชอบทำอะไรตอนแดดออก`},{id:`s11`,title:`The Duck and the Rock`,level:1,focus:`ck at the end of words`,focusTh:`ck ท้ายคำ`,vocab:[{word:`duck`,th:`เป็ด`},{word:`rock`,th:`ก้อนหิน`},{word:`quick`,th:`เร็ว`}],lines:[`A duck sat on a rock.`,`The duck is quick.`,`It can pick up a stick.`,`Then the duck swam off.`],linesTh:[`เป็ดนั่งอยู่บนก้อนหิน`,`เป็ดตัวนี้เร็วมาก`,`มันคาบกิ่งไม้ขึ้นมาได้`,`จากนั้นเป็ดก็ว่ายน้ำจากไป`],questions:[{id:`s11-q1`,question:`Where did the duck sit?`,questionTh:`เป็ดนั่งที่ไหน`,options:[`on a rock`,`on a log`,`in a bin`],answer:`on a rock`,explain:`The first sentence says the duck sat on a rock.`,explainTh:`ประโยคแรกบอกว่าเป็ดนั่งบนก้อนหิน`},{id:`s11-q2`,question:`What did the duck pick up?`,questionTh:`เป็ดคาบอะไรขึ้นมา`,options:[`a stick`,`a rock`,`a sock`],answer:`a stick`,explain:`The story says it can pick up a stick.`,explainTh:`เรื่องบอกว่ามันคาบกิ่งไม้ขึ้นมาได้`},{id:`s11-q3`,question:`Which words end with ck?`,questionTh:`คำใดลงท้ายด้วย ck`,options:[`duck, rock, stick`,`duck, swam, off`,`rock, sat, then`],answer:`duck, rock, stick`,explain:`All three end with the ck spelling for /k/.`,explainTh:`ทั้งสามคำลงท้ายด้วย ck ซึ่งแทนเสียง /k/`}],sequence:[`A duck sat on a rock.`,`It can pick up a stick.`,`Then the duck swam off.`],vocabTask:{clue:`Which word means "fast"?`,clueTh:`คำใดแปลว่า "เร็ว"`,options:[`quick`,`rock`,`duck`],answer:`quick`},speaking:`Find two more words that end with ck.`,speakingTh:`หาคำที่ลงท้ายด้วย ck อีกสองคำ`},{id:`s12`,title:`The Ship and the Shell`,level:1,focus:`sh`,focusTh:`ไดกราฟ sh`,vocab:[{word:`ship`,th:`เรือ`},{word:`shell`,th:`เปลือกหอย`},{word:`fish`,th:`ปลา`}],lines:[`I can see a ship.`,`A shell is in my hand.`,`A fish swam past the ship.`,`I wish I had a ship!`],linesTh:[`ฉันเห็นเรือลำหนึ่ง`,`เปลือกหอยอยู่ในมือของฉัน`,`ปลาว่ายผ่านเรือไป`,`ฉันอยากมีเรือสักลำ`],questions:[{id:`s12-q1`,question:`What is in my hand?`,questionTh:`ในมือของฉันมีอะไร`,options:[`a shell`,`a fish`,`a ship`],answer:`a shell`,explain:`The story says a shell is in my hand.`,explainTh:`เรื่องบอกว่าเปลือกหอยอยู่ในมือ`},{id:`s12-q2`,question:`What swam past the ship?`,questionTh:`อะไรว่ายผ่านเรือไป`,options:[`a fish`,`a duck`,`a crab`],answer:`a fish`,explain:`The story says a fish swam past the ship.`,explainTh:`เรื่องบอกว่าปลาว่ายผ่านเรือไป`},{id:`s12-q3`,question:`Which sound do ship, shell and fish share?`,questionTh:`ship, shell และ fish มีเสียงใดเหมือนกัน`,options:[`/sh/`,`/s/`,`/ch/`],answer:`/sh/`,explain:`All three words contain the digraph sh.`,explainTh:`ทั้งสามคำมีไดกราฟ sh`}],sequence:[`I can see a ship.`,`A fish swam past the ship.`,`I wish I had a ship!`],vocabTask:{clue:`Which word means the hard case an animal from the sea lives in?`,clueTh:`คำใดหมายถึงเปลือกแข็งของสัตว์ทะเล`,options:[`shell`,`ship`,`fish`],answer:`shell`},speaking:`Say /sh/ three times, then say "ship".`,speakingTh:`ออกเสียง /sh/ สามครั้ง แล้วพูดว่า "ship"`}],Ii=[{id:`s13`,title:`The Frog and the Flag`,level:2,focus:`l-blends: fl, fr, gl`,focusTh:`กลุ่มพยัญชนะ: fl, fr, gl`,vocab:[{word:`frog`,th:`กบ`},{word:`flag`,th:`ธง`},{word:`flat`,th:`แบน`},{word:`glad`,th:`ดีใจ`}],lines:[`A frog sat on a flat rock.`,`A red flag was next to the rock.`,`The wind made the flag flap.`,`The frog did not like the flap, flap, flap.`,`It hid in the grass.`,`Then the wind went still.`,`The frog was glad to sit on the rock again.`],linesTh:[`กบนั่งอยู่บนหินแบน`,`ธงสีแดงอยู่ข้างก้อนหิน`,`ลมพัดทำให้ธงสะบัด`,`กบไม่ชอบเสียงธงสะบัด`,`มันจึงไปซ่อนในพงหญ้า`,`จากนั้นลมก็สงบลง`,`กบดีใจที่ได้กลับมานั่งบนก้อนหินอีกครั้ง`],questions:[{id:`s13-q1`,question:`Where did the frog sit at the start?`,questionTh:`ตอนเริ่มเรื่องกบนั่งที่ไหน`,options:[`on a flat rock`,`in the grass`,`on the flag`],answer:`on a flat rock`,explain:`The first sentence says the frog sat on a flat rock.`,explainTh:`ประโยคแรกบอกว่ากบนั่งบนหินแบน`},{id:`s13-q2`,question:`Why did the frog hide?`,questionTh:`ทำไมกบถึงไปซ่อน`,options:[`it did not like the flapping flag`,`it was cold`,`a dog came`],answer:`it did not like the flapping flag`,explain:`The frog did not like the flap, flap, flap of the flag.`,explainTh:`กบไม่ชอบเสียงธงสะบัด`},{id:`s13-q3`,question:`What made the flag flap?`,questionTh:`อะไรทำให้ธงสะบัด`,options:[`the wind`,`the frog`,`the rain`],answer:`the wind`,explain:`The story says the wind made the flag flap.`,explainTh:`เรื่องบอกว่าลมทำให้ธงสะบัด`},{id:`s13-q4`,question:`How did the frog feel at the end?`,questionTh:`ตอนจบกบรู้สึกอย่างไร`,options:[`glad`,`sad`,`cross`],answer:`glad`,explain:`The last sentence says the frog was glad.`,explainTh:`ประโยคสุดท้ายบอกว่ากบดีใจ`}],sequence:[`A frog sat on a flat rock.`,`The wind made the flag flap.`,`The frog hid in the grass.`,`The frog sat on the rock again.`],vocabTask:{clue:`Which word means "happy"?`,clueTh:`คำใดแปลว่า "มีความสุข"`,options:[`glad`,`flat`,`flag`],answer:`glad`},speaking:`Tell someone about a sound you do not like. Say why.`,speakingTh:`เล่าให้ใครสักคนฟังว่าคุณไม่ชอบเสียงอะไร และเพราะอะไร`},{id:`s14`,title:`Chip the Chick`,level:2,focus:`ch`,focusTh:`ไดกราฟ ch`,vocab:[{word:`chick`,th:`ลูกไก่`},{word:`chop`,th:`สับ`},{word:`lunch`,th:`อาหารกลางวัน`},{word:`much`,th:`มาก`}],lines:[`Chip is a small chick.`,`Chip likes to sit on a chair.`,`At lunch, Mum will chop some corn.`,`Chip runs to the dish.`,`He eats much too fast!`,`Mum says, "Slow down, Chip."`,`Chip stops and eats bit by bit.`],linesTh:[`ชิปเป็นลูกไก่ตัวเล็ก`,`ชิปชอบเกาะอยู่บนเก้าอี้`,`ตอนกลางวันแม่จะสับข้าวโพด`,`ชิปวิ่งไปที่จาน`,`เขากินเร็วเกินไป`,`แม่บอกว่า "ช้า ๆ หน่อยนะ ชิป"`,`ชิปหยุดแล้วค่อย ๆ กินทีละนิด`],questions:[{id:`s14-q1`,question:`What is Chip?`,questionTh:`ชิปคืออะไร`,options:[`a chick`,`a duck`,`a frog`],answer:`a chick`,explain:`The first sentence says Chip is a small chick.`,explainTh:`ประโยคแรกบอกว่าชิปเป็นลูกไก่ตัวเล็ก`},{id:`s14-q2`,question:`What will Mum chop?`,questionTh:`แม่จะสับอะไร`,options:[`some corn`,`a chair`,`a dish`],answer:`some corn`,explain:`The story says Mum will chop some corn.`,explainTh:`เรื่องบอกว่าแม่จะสับข้าวโพด`},{id:`s14-q3`,question:`What did Chip do wrong?`,questionTh:`ชิปทำอะไรผิด`,options:[`he ate too fast`,`he ran away`,`he sat on the dish`],answer:`he ate too fast`,explain:`He ate much too fast, so Mum told him to slow down.`,explainTh:`เขากินเร็วเกินไป แม่จึงบอกให้ช้าลง`},{id:`s14-q4`,question:`What did Chip do at the end?`,questionTh:`ตอนจบชิปทำอะไร`,options:[`ate bit by bit`,`ran to the chair`,`went to sleep`],answer:`ate bit by bit`,explain:`The last sentence says Chip ate bit by bit.`,explainTh:`ประโยคสุดท้ายบอกว่าชิปค่อย ๆ กินทีละนิด`}],sequence:[`Chip is a small chick.`,`Mum will chop some corn.`,`Chip eats much too fast.`,`Chip eats bit by bit.`],vocabTask:{clue:`Which word means the meal we eat in the middle of the day?`,clueTh:`คำใดหมายถึงมื้ออาหารกลางวัน`,options:[`lunch`,`chick`,`chop`],answer:`lunch`},speaking:`Say four words that start with /ch/.`,speakingTh:`พูดคำที่ขึ้นต้นด้วยเสียง /ch/ สี่คำ`},{id:`s15`,title:`The Crab and the Nest`,level:2,focus:`r-blends and ending blends`,focusTh:`กลุ่มพยัญชนะ r และท้ายคำ`,vocab:[{word:`crab`,th:`ปู`},{word:`nest`,th:`รังนก`},{word:`sand`,th:`ทราย`},{word:`drop`,th:`ทำหล่น`}],lines:[`A crab ran on the wet sand.`,`It found a small nest.`,`The nest had a crack in it.`,`The crab did not drop the nest.`,`It put the nest next to a rock.`,`A bird came back and sat on the nest.`,`The crab went back to the sand.`],linesTh:[`ปูวิ่งบนหาดทรายเปียก`,`มันเจอรังนกเล็ก ๆ`,`รังนกมีรอยแตก`,`ปูไม่ได้ทำรังนกหล่น`,`มันวางรังนกไว้ข้างก้อนหิน`,`นกกลับมาและเกาะบนรัง`,`ปูกลับไปที่หาดทราย`],questions:[{id:`s15-q1`,question:`Where did the crab run?`,questionTh:`ปูวิ่งที่ไหน`,options:[`on the wet sand`,`in the nest`,`on a rock`],answer:`on the wet sand`,explain:`The first sentence says the crab ran on the wet sand.`,explainTh:`ประโยคแรกบอกว่าปูวิ่งบนหาดทรายเปียก`},{id:`s15-q2`,question:`What did the crab find?`,questionTh:`ปูเจออะไร`,options:[`a small nest`,`a big shell`,`a stick`],answer:`a small nest`,explain:`The crab found a small nest.`,explainTh:`ปูเจอรังนกเล็ก ๆ`},{id:`s15-q3`,question:`Where did the crab put the nest?`,questionTh:`ปูวางรังนกไว้ที่ไหน`,options:[`next to a rock`,`in the sea`,`on the sand`],answer:`next to a rock`,explain:`It put the nest next to a rock.`,explainTh:`มันวางรังนกไว้ข้างก้อนหิน`},{id:`s15-q4`,question:`Who came back at the end?`,questionTh:`ตอนจบใครกลับมา`,options:[`a bird`,`a crab`,`a fish`],answer:`a bird`,explain:`A bird came back and sat on the nest.`,explainTh:`นกกลับมาและเกาะบนรัง`}],sequence:[`A crab ran on the wet sand.`,`It found a small nest.`,`It put the nest next to a rock.`,`A bird sat on the nest.`],vocabTask:{clue:`Which word means to let something fall?`,clueTh:`คำใดแปลว่าทำให้ของหล่น`,options:[`drop`,`nest`,`sand`],answer:`drop`},speaking:`Was the crab kind? Say why you think so.`,speakingTh:`ปูใจดีไหม บอกเหตุผลของคุณ`},{id:`s16`,title:`Stan Must Stop`,level:2,focus:`s-blends: st, sp, sk`,focusTh:`กลุ่มพยัญชนะ s: st, sp, sk`,vocab:[{word:`stop`,th:`หยุด`},{word:`step`,th:`ก้าว`},{word:`skip`,th:`กระโดดข้าม`},{word:`spot`,th:`จุด`}],lines:[`Stan can skip and run fast.`,`He skips down the steps.`,`At the end is a big red spot on the path.`,`The spot means stop.`,`Stan must stop and look.`,`A truck goes past.`,`Then Stan can step across.`],linesTh:[`สแตนกระโดดและวิ่งได้เร็ว`,`เขากระโดดลงบันได`,`ตรงปลายทางมีจุดสีแดงใหญ่บนทางเดิน`,`จุดนั้นหมายถึงให้หยุด`,`สแตนต้องหยุดและมองดู`,`รถบรรทุกแล่นผ่านไป`,`จากนั้นสแตนจึงเดินข้ามได้`],questions:[{id:`s16-q1`,question:`What can Stan do?`,questionTh:`สแตนทำอะไรได้`,options:[`skip and run fast`,`swim and sing`,`drive a truck`],answer:`skip and run fast`,explain:`The first sentence says Stan can skip and run fast.`,explainTh:`ประโยคแรกบอกว่าสแตนกระโดดและวิ่งได้เร็ว`},{id:`s16-q2`,question:`What does the red spot mean?`,questionTh:`จุดสีแดงหมายถึงอะไร`,options:[`stop`,`run`,`skip`],answer:`stop`,explain:`The story says the spot means stop.`,explainTh:`เรื่องบอกว่าจุดนั้นหมายถึงให้หยุด`},{id:`s16-q3`,question:`What went past?`,questionTh:`อะไรแล่นผ่านไป`,options:[`a truck`,`a bus`,`a bike`],answer:`a truck`,explain:`A truck goes past while Stan waits.`,explainTh:`รถบรรทุกแล่นผ่านไปตอนที่สแตนรออยู่`},{id:`s16-q4`,question:`Why is it good that Stan stopped?`,questionTh:`ทำไมการที่สแตนหยุดจึงเป็นเรื่องดี`,options:[`a truck was coming`,`he was tired`,`he lost his bag`],answer:`a truck was coming`,explain:`He stopped and looked, and a truck went past.`,explainTh:`เขาหยุดและมองดู แล้วรถบรรทุกก็แล่นผ่าน`}],sequence:[`Stan skips down the steps.`,`Stan sees a big red spot.`,`A truck goes past.`,`Stan steps across.`],vocabTask:{clue:`Which word means one movement of your foot?`,clueTh:`คำใดหมายถึงการก้าวเท้าหนึ่งครั้ง`,options:[`step`,`stop`,`spot`],answer:`step`},speaking:`What do you do before you cross a road? Say two things.`,speakingTh:`ก่อนข้ามถนนคุณทำอะไรบ้าง บอกมาสองอย่าง`},{id:`s17`,title:`The Truck in the Mud`,level:2,focus:`tr, dr, ck`,focusTh:`tr, dr และ ck`,vocab:[{word:`truck`,th:`รถบรรทุก`},{word:`mud`,th:`โคลน`},{word:`stuck`,th:`ติดแหง็ก`},{word:`drag`,th:`ลาก`}],lines:[`A truck went up a track.`,`The track was wet with mud.`,`The truck got stuck.`,`Dad and I ran to help.`,`We put a plank in the mud.`,`Then we drag the truck back.`,`The truck was free at last.`],linesTh:[`รถบรรทุกขึ้นไปตามทาง`,`ทางนั้นเปียกไปด้วยโคลน`,`รถบรรทุกติดหล่ม`,`พ่อกับฉันวิ่งไปช่วย`,`พวกเราวางไม้กระดานลงในโคลน`,`จากนั้นก็ลากรถบรรทุกถอยกลับ`,`ในที่สุดรถบรรทุกก็หลุดออกมา`],questions:[{id:`s17-q1`,question:`Why did the truck get stuck?`,questionTh:`ทำไมรถบรรทุกถึงติดหล่ม`,options:[`the track was wet with mud`,`it was too big`,`it had no wheels`],answer:`the track was wet with mud`,explain:`The track was wet with mud, so the truck got stuck.`,explainTh:`ทางเปียกโคลน รถบรรทุกจึงติดหล่ม`},{id:`s17-q2`,question:`Who ran to help?`,questionTh:`ใครวิ่งไปช่วย`,options:[`Dad and I`,`Mum and Ben`,`the driver`],answer:`Dad and I`,explain:`The story says Dad and I ran to help.`,explainTh:`เรื่องบอกว่าพ่อกับฉันวิ่งไปช่วย`},{id:`s17-q3`,question:`What did they put in the mud?`,questionTh:`พวกเขาวางอะไรลงในโคลน`,options:[`a plank`,`a rock`,`a rug`],answer:`a plank`,explain:`They put a plank in the mud.`,explainTh:`พวกเขาวางไม้กระดานลงในโคลน`},{id:`s17-q4`,question:`How does the story end?`,questionTh:`เรื่องจบอย่างไร`,options:[`the truck was free`,`the truck sank`,`they went home`],answer:`the truck was free`,explain:`The last sentence says the truck was free at last.`,explainTh:`ประโยคสุดท้ายบอกว่ารถบรรทุกหลุดออกมาได้`}],sequence:[`A truck went up a track.`,`The truck got stuck.`,`We put a plank in the mud.`,`The truck was free.`],vocabTask:{clue:`Which word means to pull something along the ground?`,clueTh:`คำใดแปลว่าลากของไปกับพื้น`,options:[`drag`,`drop`,`drum`],answer:`drag`},speaking:`Tell about a time you helped someone.`,speakingTh:`เล่าเรื่องตอนที่คุณเคยช่วยคนอื่น`},{id:`s18`,title:`The King and the Ring`,level:2,focus:`ng`,focusTh:`ไดกราฟ ng`,vocab:[{word:`king`,th:`กษัตริย์`},{word:`ring`,th:`แหวน`},{word:`sing`,th:`ร้องเพลง`},{word:`long`,th:`ยาว`}],lines:[`The king had a gold ring.`,`One day the ring went missing.`,`The king did not sing all day.`,`A small girl saw it in the long grass.`,`She ran to the king with the ring.`,`The king was so glad.`,`Then he sang a long, happy song.`],linesTh:[`กษัตริย์มีแหวนทองวงหนึ่ง`,`วันหนึ่งแหวนหายไป`,`กษัตริย์ไม่ร้องเพลงเลยทั้งวัน`,`เด็กหญิงตัวเล็กเห็นแหวนในพงหญ้าสูง`,`เธอวิ่งไปหากษัตริย์พร้อมแหวน`,`กษัตริย์ดีใจมาก`,`จากนั้นเขาก็ร้องเพลงยาว ๆ อย่างมีความสุข`],questions:[{id:`s18-q1`,question:`What did the king lose?`,questionTh:`กษัตริย์ทำอะไรหาย`,options:[`a gold ring`,`a long song`,`a green hat`],answer:`a gold ring`,explain:`The ring went missing.`,explainTh:`แหวนหายไป`},{id:`s18-q2`,question:`Where was the ring?`,questionTh:`แหวนอยู่ที่ไหน`,options:[`in the long grass`,`in the pond`,`in a box`],answer:`in the long grass`,explain:`A small girl saw it in the long grass.`,explainTh:`เด็กหญิงเห็นแหวนในพงหญ้าสูง`},{id:`s18-q3`,question:`Who found the ring?`,questionTh:`ใครเจอแหวน`,options:[`a small girl`,`the king`,`a bird`],answer:`a small girl`,explain:`The story says a small girl saw it.`,explainTh:`เรื่องบอกว่าเด็กหญิงตัวเล็กเป็นคนเห็น`},{id:`s18-q4`,question:`How do we know the king was happy?`,questionTh:`เรารู้ได้อย่างไรว่ากษัตริย์มีความสุข`,options:[`he sang a happy song`,`he ran away`,`he sat down`],answer:`he sang a happy song`,explain:`He sang a long, happy song at the end.`,explainTh:`ตอนจบเขาร้องเพลงยาว ๆ อย่างมีความสุข`}],sequence:[`The king had a gold ring.`,`The ring went missing.`,`A girl found it in the grass.`,`The king sang a happy song.`],vocabTask:{clue:`Which word is the opposite of "short"?`,clueTh:`คำใดตรงข้ามกับ "สั้น"`,options:[`long`,`ring`,`sing`],answer:`long`},speaking:`Sing or say one line of a song you like.`,speakingTh:`ร้องหรือพูดเนื้อเพลงที่คุณชอบหนึ่งท่อน`},{id:`s19`,title:`A Gift in the Tent`,level:2,focus:`ending blends: ft, nt, mp`,focusTh:`กลุ่มพยัญชนะท้ายคำ: ft, nt, mp`,vocab:[{word:`gift`,th:`ของขวัญ`},{word:`tent`,th:`เต็นท์`},{word:`lamp`,th:`โคมไฟ`},{word:`damp`,th:`ชื้น`}],lines:[`We put up a tent by the pond.`,`The grass was damp.`,`Dad lit a small lamp.`,`In the tent was a gift for me!`,`It was a soft, red hat.`,`I put it on and did a jump.`,`We sat and ate in the tent.`],linesTh:[`พวกเรากางเต็นท์ริมบ่อน้ำ`,`หญ้ามีความชื้น`,`พ่อจุดโคมไฟดวงเล็ก`,`ในเต็นท์มีของขวัญสำหรับฉัน`,`มันคือหมวกสีแดงเนื้อนุ่ม`,`ฉันสวมมันแล้วกระโดดดีใจ`,`พวกเรานั่งกินข้าวกันในเต็นท์`],questions:[{id:`s19-q1`,question:`Where did we put up the tent?`,questionTh:`พวกเรากางเต็นท์ที่ไหน`,options:[`by the pond`,`in the park`,`on a hill`],answer:`by the pond`,explain:`The first sentence says by the pond.`,explainTh:`ประโยคแรกบอกว่าริมบ่อน้ำ`},{id:`s19-q2`,question:`What was the gift?`,questionTh:`ของขวัญคืออะไร`,options:[`a soft, red hat`,`a small lamp`,`a big tent`],answer:`a soft, red hat`,explain:`The gift was a soft, red hat.`,explainTh:`ของขวัญคือหมวกสีแดงเนื้อนุ่ม`},{id:`s19-q3`,question:`Who lit the lamp?`,questionTh:`ใครจุดโคมไฟ`,options:[`Dad`,`Mum`,`I`],answer:`Dad`,explain:`The story says Dad lit a small lamp.`,explainTh:`เรื่องบอกว่าพ่อจุดโคมไฟดวงเล็ก`},{id:`s19-q4`,question:`What does "damp" mean?`,questionTh:`คำว่า "damp" แปลว่าอะไร`,options:[`a little wet`,`very hot`,`very big`],answer:`a little wet`,explain:`Damp means a little wet.`,explainTh:`damp แปลว่าชื้นหรือเปียกเล็กน้อย`}],sequence:[`We put up a tent by the pond.`,`Dad lit a small lamp.`,`I found a gift in the tent.`,`We sat and ate in the tent.`],vocabTask:{clue:`Which word means something you give to someone?`,clueTh:`คำใดหมายถึงสิ่งที่มอบให้ผู้อื่น`,options:[`gift`,`tent`,`lamp`],answer:`gift`},speaking:`What gift would you like? Say it in one sentence.`,speakingTh:`คุณอยากได้ของขวัญอะไร พูดเป็นประโยคเดียว`},{id:`s20`,title:`The Quick Quiz`,level:2,focus:`qu and ck`,focusTh:`qu และ ck`,vocab:[{word:`quiz`,th:`แบบทดสอบสั้น`},{word:`quick`,th:`เร็ว`},{word:`pick`,th:`เลือก`},{word:`clock`,th:`นาฬิกา`}],lines:[`Miss Fern set a quick quiz.`,`We had to pick the best word.`,`The clock went tick, tick, tick.`,`I did not rush.`,`I read each word to the end.`,`I got them all right!`,`Miss Fern said, "Good work."`],linesTh:[`ครูเฟิร์นให้ทำแบบทดสอบสั้น ๆ`,`พวกเราต้องเลือกคำที่ถูกต้องที่สุด`,`นาฬิกาเดินดังติ๊ก ติ๊ก ติ๊ก`,`ฉันไม่รีบร้อน`,`ฉันอ่านทุกคำจนจบ`,`ฉันตอบถูกหมดทุกข้อ`,`ครูเฟิร์นบอกว่า "ทำได้ดีมาก"`],questions:[{id:`s20-q1`,question:`What did we have to do in the quiz?`,questionTh:`ในแบบทดสอบพวกเราต้องทำอะไร`,options:[`pick the best word`,`write a story`,`draw a clock`],answer:`pick the best word`,explain:`We had to pick the best word.`,explainTh:`พวกเราต้องเลือกคำที่ถูกต้องที่สุด`},{id:`s20-q2`,question:`Did I rush?`,questionTh:`ฉันรีบร ็ก ๆ ถึงเปียก`,options:[`the whale made a splash`,`it was raining`,`the ship sank`],answer:`the whale made a splash`,explain:`The whale made a huge splash.`,explainTh:`ปลาวาฬสาดน้ำครั้งใหญ่`},{id:`s21-q3`,question:`How did the children feel?`,questionTh:`เด็ก ๆ รู้สึกอย่างไร`,options:[`they did not mind`,`they were cross`,`they were scared`],answer:`they did not mind`,explain:`The story says they did not mind at all.`,explainTh:`เรื่องบอกว่าพวกเขาไม่ถือสาเลย`},{id:`s21-q4`,question:`What did Meg wish?`,questionTh:`เม็กปรารถนาอะไร`,options:[`to swim like the whale`,`to sail a ship`,`to see a crab`],answer:`to swim like the whale`,explain:`Meg said she wished she could swim like that.`,explainTh:`เม็กบอกว่าอยากว่ายน้ำได้แบบปลาวาฬ`}],sequence:[`A big ship went past the rocks.`,`A whale swam next to it.`,`The whale made a huge splash.`,`The whale swam off to the deep sea.`],vocabTask:{clue:`Which word means to hope for something?`,clueTh:`คำใดแปลว่าหวังหรือปรารถนา`,options:[`wish`,`wash`,`whale`],answer:`wish`},speaking:`Say one wish of your own, starting with "I wish…".`,speakingTh:`บอกสิ่งที่คุณปรารถนาหนึ่งอย่าง เริ่มด้วย "I wish…"`},{id:`s22`,title:`Thumbs Up, Beth`,level:2,focus:`th`,focusTh:`ไดกราฟ th`,vocab:[{word:`thumb`,th:`นิ้วโป้ง`},{word:`think`,th:`คิด`},{word:`thin`,th:`บาง`},{word:`path`,th:`ทางเดิน`}],lines:[`Beth ran down a thin path.`,`She fell and bumped her thumb.`,`Mum said, "Let me think."`,`She got a cold pack for the thumb.`,`Beth did not cry much.`,`In a bit, the thumb felt better.`,`Beth gave Mum a big thumbs up.`],linesTh:[`เบธวิ่งลงไปตามทางเดินแคบ ๆ`,`เธอล้มและนิ้วโป้งกระแทก`,`แม่บอกว่า "ขอคิดก่อนนะ"`,`แม่หยิบเจลเย็นมาประคบนิ้วโป้ง`,`เบธไม่ได้ร้องไห้มาก`,`สักพักนิ้วโป้งก็ดีขึ้น`,`เบธยกนิ้วโป้งให้แม่`],questions:[{id:`s22-q1`,question:`What happened to Beth?`,questionTh:`เกิดอะไรขึ้นกับเบธ`,options:[`she bumped her thumb`,`she lost her hat`,`she got wet`],answer:`she bumped her thumb`,explain:`She fell and bumped her thumb.`,explainTh:`เธอล้มและนิ้วโป้งกระแทก`},{id:`s22-q2`,question:`What did Mum get?`,questionTh:`แม่หยิบอะไรมา`,options:[`a cold pack`,`a hot pot`,`a thin path`],answer:`a cold pack`,explain:`She got a cold pack for the thumb.`,explainTh:`แม่หยิบเจลเย็นมาประคบ`},{id:`s22-q3`,question:`Did Beth cry a lot?`,questionTh:`เบธร้องไห้มากไหม`,options:[`no`,`yes`,`the story does not say`],answer:`no`,explain:`The story says Beth did not cry much.`,explainTh:`เรื่องบอกว่าเบธไม่ได้ร้องไห้มาก`},{id:`s22-q4`,question:`What did Beth do at the end?`,questionTh:`ตอนจบเบธทำอะไร`,options:[`gave a thumbs up`,`ran down the path`,`went to bed`],answer:`gave a thumbs up`,explain:`Beth gave Mum a big thumbs up.`,explainTh:`เบธยกนิ้วโป้งให้แม่`}],sequence:[`Beth ran down a thin path.`,`She bumped her thumb.`,`Mum got a cold pack.`,`Beth gave a thumbs up.`],vocabTask:{clue:`Which word means a narrow way to walk?`,clueTh:`คำใดหมายถึงทางเดินแคบ ๆ`,options:[`path`,`thumb`,`think`],answer:`path`},speaking:`Show a thumbs up and say what it means.`,speakingTh:`ยกนิ้วโป้งขึ้นแล้วบอกว่ามันหมายถึงอะไร`}],I=[{id:`s23`,title:`The Kite and the Rain`,level:3,focus:`i_e, ai and ay`,focusTh:`i_e, ai และ ay`,vocab:[{word:`kite`,th:`ว่าว`},{word:`rain`,th:`ฝน`},{word:`day`,th:`วัน`},{word:`wait`,th:`รอ`}],lines:[`It was a bright day, so May made a kite.`,`She used thin sticks and a sheet of red paper.`,`The tail was made of rags.`,`May ran up the hill with her kite.`,`The wind came and the kite went high.`,`Then the sky went grey.`,`Rain began to fall on the hill.`,`May had to wait under a big tree.`,`The rain made the paper wet and soft.`,`May did not cry.`,`The next day she made a new kite.`,`This time she used cloth, not paper.`,`The new kite flew for a long, long time.`],linesTh:[`วันนั้นแดดสดใส เมย์จึงทำว่าว`,`เธอใช้ไม้เรียวบางกับกระดาษสีแดงหนึ่งแผ่น`,`หางว่าวทำจากเศษผ้า`,`เมย์วิ่งขึ้นเนินพร้อมกับว่าว`,`ลมพัดมาและว่าวก็ลอยสูง`,`จากนั้นท้องฟ้าก็เปลี่ยนเป็นสีเทา`,`ฝนเริ่มตกลงมาบนเนิน`,`เมย์ต้องรออยู่ใต้ต้นไม้ใหญ่`,`ฝนทำให้กระดาษ t time. What did you do?`,speakingTh:`เล่าเรื่องตอนที่ทำอะไรไม่สำเร็จในครั้งแรก แล้วคุณทำอย่างไรต่อ`},{id:`s24`,title:`Jade Bakes a Cake`,level:3,focus:`a_e and o_e`,focusTh:`a_e และ o_e`,vocab:[{word:`bake`,th:`อบ`},{word:`cake`,th:`เค้ก`},{word:`hope`,th:`หวัง`},{word:`plate`,th:`จาน`}],lines:[`It was Gran’s big day, so Jade made a cake.`,`She got eggs, milk and a cup of oats.`,`Dad let her use the big bowl.`,`Jade mixed and mixed until it was smooth.`,`They put the cake in to bake.`,`The home began to smell sweet.`,`"I hope it is not flat," said Jade.`,`When the time was up, Dad took it out.`,`The cake was tall and gold on top.`,`Jade put it on her best plate.`,`Gran came in and smiled a big smile.`,`They ate the cake and sang a song.`],linesTh:[`วันนั้นเป็นวันสำคัญของคุณย่า เจดจึงทำเค้ก`,`เธอเตรียมไข่ นม และข้าวโอ๊ตหนึ่งถ้วย`,`พ่ออนุญาตให้เธอใช้ชามใบใหญ่`,`เจดคนแป้งจนเนียน`,`พวกเขานำเค้กเข้าเตาอบ`,`บ้านเริ่มมีกลิ่นหอมหวาน`,`"หวังว่ามันจะไม่แฟบนะ" เจดพูด`,`เมื่อครบเวลา พ่อก็นำเค้กออกมา`,`เค้กขึ้นฟูและด้านบนเป็นสีทอง`,`เจดวางเค้กลงบนจานใบที่สวยที่สุด`,`คุณย่าเดินเข้ามาและยิ้มกว้าง`,`พวกเขากินเค้กและร้องเพลงด้วยกัน`],questions:[{id:`s24-q1`,question:`Why did Jade make a cake?`,questionTh:`ทำไมเจดถึงทำเค้ก`,options:[`it was Gran’s big day`,`she was hungry`,`it was a school task`],answer:`it was Gran’s big day`,explain:`The first sentence says it was Gran’s big day.`,explainTh:`ประโยคแรกบอกว่าเป็นวันสำคัญของคุณย่า`},{id:`s24-q2`,question:`What did Jade worry about?`,questionTh:`เจดกังวลเรื่องอะไร`,options:[`that the cake would be flat`,`that it would burn`,`that Gran would be late`],answer:`that the cake would be flat`,explain:`She said, "I hope it is not flat."`,explainTh:`เธอพูดว่า "หวังว่ามันจะไม่แฟบ"`},{id:`s24-q3`,question:`How was the cake when it came out?`,questionTh:`เค้กออกมาเป็นอย่างไร`,options:[`tall and gold on top`,`flat and grey`,`wet in the middle`],answer:`tall and gold on top`,explain:`The cake was tall and gold on top.`,explainTh:`เค้กขึ้นฟูและด้าน
