from. The helpers are called <i>volunteers</i>, and the paragraph mentions neither a fee nor a class.","eT":"ประโยคก่อนหน้าเอ่ยถึงใบตองกับเทียน และประโยคถัดไปบอกว่าของเหล่านี้ฟรี ดังนั้น <i>materials</i> จึงหมายถึงของที่นำมาพับเป็นเรือ คนที่มาช่วยในย่อหน้านี้เรียกว่า <i>volunteers</i> และย่อหน้านี้ก็ไม่ได้พูดถึงค่าธรรมเนียมหรือการเรียนการสอนเลย","a":0,"o":["the things the boat is made from","the people who help you","the lessons you take","the money you pay"],"s":"The word <i>materials</i> in paragraph 2 is closest in meaning to…","t":1},{"n":29,"p":"F","tag":"Inference","tagT":"การตีความสิ่งที่ผู้เขียนบอกเป็นนัย","h":"Ask yourself why the writers mention how long the clearing-up job lasted.","hT":"ลองคิดว่าทำไมคนเขียนต้องบอกว่าใช้เวลาเก็บกวาดนานแค่ไหน","e":"The poster asks everyone to carry rubbish home and then explains that the grass was “left in a dreadful state” and took two mornings to clear – a clear hint that people dropped their litter. Nothing in the text says that the crowd was small, that supplies ran out or that the weather spoiled the evening.","eT":"ป้ายขอให้ทุกคนเก็บขยะกลับบ้าน แล้วอธิบายต่อว่าสนามหญ้าถูกทิ้งไว้ “left in a dreadful state” และต้องใช้เวลาเก็บกวาดถึงสองเช้า ซึ่งเป็นการบอกเป็นนัยชัด ๆ ว่ามีคนทิ้งขยะไว้ ส่วนในเนื้อเรื่องไม่ได้บอกเลยว่าคนมาน้อย ของหมด หรืออากาศทำให้งานต้องเลิกก่อนเวลา","a":2,"o":["Fewer people came than the park had hoped.","It had to finish early because of the weather.","Many of the visitors left their litter behind.","The volunteers ran out of banana leaves."],"s":"What does the poster suggest about last year’s evening?","t":1},{"n":30,"p":"F","tag":"Main idea and purpose","tagT":"ใจความสำคัญและจุดประสงค์ของผู้เขียน","h":"Think about why someone would pin this up in a public place.","hT":"ลองคิดว่าคนเขียนติดป้ายนี้ไว้ในที่สาธารณะเพื่ออะไร","e":"The poster gives a date, a time, an activity, prices and travel advice – everything a family needs in order to come along. It does not recruit cleaners, it says nothing about how the money is spent, and the boat rides are part of one evening, not a weekly service.","eT":"ป้ายนี้บอกวัน เวลา กิจกรรม ราคา และวิธีเดินทาง ครบทุกอย่างที่ครอบครัวหนึ่งต้องรู้ถ้าจะมาร่วมงาน ไม่ได้ประกาศรับคนมาช่วยเก็บกวาด ไม่ได้บอกว่าเงินที่เก็บได้เอาไปใช้ทำอะไร และการนั่งเรือก็เป็นส่วนหนึ่งของงานเย็นนี้ ไม่ใช่บริการที่มีทุกสุดสัปดาห์","a":1,"o":["To explain how the park spends the money it collects.","To invite families to an evening by the canal and explain what happens there.","To advertise boat rides that run every weekend of the year.","To ask for volunteers to clean the park after the event."],"s":"What is the main purpose of this poster?","t":1}]},{"n":3,"name":"The Real Thing","nameT":"ระดับข้อสอบจริง","cefr":"A2–B1","mins":35,"total":30,"parts":[{"id":"A","t":"Grammar and Structure","tT":"ไวยากรณ์และโครงสร้างประโยค","i":"Choose the word or phrase that best completes each sentence.","iT":"เลือกคำหรือวลีที่เติมในช่องว่างได้ถูกต้องที่สุด","r":"1 – 10","c":10},{"id":"B","t":"Error Identification","tT":"หาจุดที่ผิด","i":"One of the four underlined parts is wrong. Choose the part that must be changed.","iT":"ในแต่ละประโยคมีส่วนที่ขีดเส้นใต้ 4 ส่วน และมี 1 ส่วนที่ผิด เลือกส่วนที่ต้องแก้","r":"11 – 14","c":4},{"id":"C","t":"Vocabulary and Collocation","tT":"คำศัพท์และคำที่ใช้คู่กัน","i":"Choose the word that fits the sentence best.","iT":"เลือกคำที่เข้ากับประโยคได้ดีที่สุด","r":"15 – 18","c":4},{"id":"D","t":"Everyday Conversation","tT":"บทสนทนาในชีวิตประจำวัน","i":"Choose the most natural reply.","iT":"เลือกคำตอบที่เป็นธรรมชาติที่สุดในสถานการณ์นั้น","r":"19 – 22","c":4},{"id":"E","t":"Cloze Passage","tT":"เติมคำในเนื้อเรื่อง","i":"Read the whole text first, then choose the best word for each numbered gap.","iT":"อ่านเนื้อเรื่องให้จบก่อน แล้วจึงเลือกคำที่เหมาะกับช่องว่างแต่ละช่อง","r":"23 – 26","c":4},{"id":"F","t":"Reading Comprehension","tT":"อ่านจับใจความ","i":"Read the text and answer the questions that follow.","iT":"อ่านเนื้อเรื่องแล้วตอบคำถาม","r":"27 – 30","c":4}],"texts":[{"t":"The Thursday Repair Table","tT":"โต๊ะซ่อมของวันพฤหัสบดี","p":["Every Thursday afternoon, three long tables are set out in the hall of the community centre in Ban Nong Yai. Anyone may bring along a broken kettle, a torn school bag or a radio that has gone silent. The volunteers behind the tables have been giving up their Thursdays <b>__23__</b> the centre opened, and they charge nothing at all. They do insist on one thing: you must sit beside them and watch, because the aim is to teach rather than simply to mend.","Krit, who is thirteen, arrived last month with a lamp that <b>__24__</b> working. An hour later he had fitted a new plug himself and could explain exactly what he had done. <b>__25__</b>, not every visitor goes home with something that works; a few machines are beyond saving. Even then the volunteers point out what went wrong and which parts can be used again, so nobody leaves without having learnt something. That, they say, is the real <b>__26__</b> of the Thursday table."]},{"t":"Before Dawn in a Rubber Grove","tT":"ก่อนรุ่งสางในสวนยาง","p":["In the rubber-growing provinces of southern Thailand the working day begins in the dark. Tappers walk between the rows of trees at about two in the morning, each with a lamp strapped to their forehead. They are not up so early for the cool air alone. Latex, the milky sap that becomes rubber, runs fastest in the hours before sunrise, and by the middle of the morning the flow has almost stopped.","The cut itself takes less than a minute and a great deal of practice. Using a curved knife, the tapper shaves a thin spiral groove in the bark, just deep enough to open the vessels that carry the latex but never deep enough to cut into the growing layer underneath. A tree that is cut too deeply heals badly and gives less for years afterwards. The latex trickles down the groove into a small cup fixed to the trunk.","By mid-morning the cups are collected and the latex is strained, mixed with acid so that it thickens, and pressed into pale sheets that are hung up to dry. Each tree is tapped only every second day, which gives the bark time to recover. Looked after in this way, one tree can go on producing for about twenty-five years."]}],"items":[{"n":1,"p":"A","tag":"Present perfect vs past simple","tagT":"Present perfect กับ past simple (ปัจจุบันสมบูรณ์ กับ อดีตธรรมดา)","h":"Look hard at the time phrase: is that period over, or are we still inside it?","hT":"ดูคำบอกเวลาในประโยคให้ดีว่าช่วงเวลานั้นจบไปแล้ว หรือเรายังอยู่ในช่วงนั้น","e":"<i>so far this week</i> looks back over a period that is still running, which is exactly what the present perfect is for, so <b>has sent</b> is the only form that fits. <b>sent</b> would need a finished past time such as <i>last week</i>, and English does not say <i>sent … so far</i>. <b>was sending</b> would turn a count of three emails into an unfinished action, and <b>had sent</b> needs an earlier past point to look back from.","eT":"<i>so far this week</i> มองย้อนช่วงเวลาที่ยังไม่จบ ซึ่งตรงกับหน้าที่ของ present perfect พอดี จึงต้องใช้ <b>has sent</b> เท่านั้น ถ้าจะใช้ <b>sent</b> ต้องมีเวลาในอดีตที่จบแล้ว เช่น <i>last week</i> และภาษาอังกฤษไม่พูดว่า <i>sent … so far</i> ส่วน <b>was sending</b> จะทำให้การส่งอีเมลสามฉบับกลายเป็นเรื่องที่ยังไม่เสร็จ และ <b>had sent</b> ต้องมีจุดเวลาในอดีตอีกจุดให้มองย้อนกลับไป","a":1,"o":["sent","has sent","was sending","had sent"],"s":"Siri <span class='bl'>_____</span> three emails to the ticket office so far this week, but nobody has replied yet."},{"n":2,"p":"A","tag":"Defining relative clauses","tagT":"Relative clause แบบจำเป็น (คำขยายนามที่ตัดออกไม่ได้)","h":"The missing word stands in for the shop, and a shop is not a person.","hT":"คำที่หายไปทำหน้าที่แทนคำนาม shop ซึ่งเป็นสิ่งของ ไม่ใช่คน","e":"The clause defines <i>the only shop</i>, and the subject of <i>sells</i> is a thing, so <b>that</b> is correct. <b>who</b> is only for people, <b>what</b> cannot introduce a relative clause after a noun, and <b>it</b> would give the clause a second subject.","eT":"ประโยคนี้ขยายคำว่า <i>the only shop</i> และประธานของ <i>sells</i> เป็นสิ่งของ จึงใช้ <b>that</b> ส่วน <b>who</b> ใช้กับคนเท่านั้น <b>what</b> ใช้นำ relative clause หลังคำนามไม่ได้ และถ้าใส่ <b>it</b> ประโยคย่อยจะมีประธานซ้อนกันสองตัว","a":2,"o":["what","who","that","it"],"s":"This is the only shop in the village <span class='bl'>_____</span> sells fresh coconut milk every morning."},{"n":3,"p":"A","tag":"The passive","tagT":"Passive voice (ประโยคถูกกระทำ)","h":"The hall did not do the action; the storm did it to the hall, and the time is finished.","hT":"ตัวอาคารไม่ได้เป็นผู้กระทำ แต่ถูกพายุกระทำ และเวลาที่บอกไว้เป็นอดีตที่จบแล้ว","e":"The storm acted on the hall, so a passive is needed, and <i>two years ago</i> is finished past time, which gives <b>was destroyed</b>. <b>has been destroyed</b> is tempting but the present perfect cannot sit with a definite past time; <b>destroyed</b> and <b>was destroying</b> are both active, and they would make the hall the thing doing the damage.","eT":"พายุเป็นผู้กระทำต่อตัวอาคาร จึงต้องใช้รูป passive และ <i>two years ago</i> เป็นเวลาในอดีตที่จบแล้ว คำตอบจึงเป็น <b>was destroyed</b> ส่วน <b>has been destroyed</b> ดูน่าเลือก แต่ present perfect ใช้คู่กับเวลาในอดีตที่ระบุชัดไม่ได้ และ <b>destroyed</b> กับ <b>was destroying</b> เป็นรูป active ทั้งคู่ ซึ่งจะกลายเป็นว่าตัวอาคารเป็นผู้ทำลาย","a":2,"o":["was destroying","destroyed","was destroyed","has been destroyed"],"s":"The old market hall <span class='bl'>_____</span> by a storm two years ago, and the stalls have stood in the car park ever since."},{"n":4,"p":"A","tag":"Question tags","tagT":"Question tag (ประโยคถามท้าย)","h":"The main sentence is negative, so the tag turns positive, and it reuses the same auxiliary.","hT":"ประโยคหลักเป็นรูปปฏิเสธ ส่วนหางคำถามจึงต้องเป็นรูปบอกเล่า และใช้กริยาช่วยตัวเดิม","e":"A negative statement takes a positive tag built on the same auxiliary, so <b>haven't</b> gives <b>have you?</b> <b>haven't you?</b> repeats the negative, and <b>did you?</b> and <b>do you?</b> change the auxiliary.","eT":"ประโยคบอกเล่าที่เป็นปฏิเสธต้องใช้หางคำถามรูปบอกเล่า และใช้กริยาช่วยตัวเดียวกัน เมื่อประโยคหลักมี <b>haven't</b> หางคำถามจึงเป็น <b>have you?</b> ส่วน <b>haven't you?</b> เป็นการใช้รูปปฏิเสธซ้ำอีกครั้ง และ <b>did you?</b> กับ <b>do you?</b> เปลี่ยนกริยาช่วยไปเป็นตัวอื่น","a":0,"o":["have you?","do you?","did you?","haven't you?"],"s":"Tul, you haven't handed in your science project yet, <span class='bl'>_____</span>"},{"n":5,"p":"A","tag":"Second conditional","tagT":"Second conditional (เงื่อนไขที่ไม่เป็นจริงในปัจจุบัน)","h":"<i>would take</i> in the main clause tells you this journey is imagined, not planned.","hT":"คำว่า <i>would take</i> ในประโยคหลักบอกว่าการเดินทางนี้เป็นเรื่องสมมติ ไม่ใช่แผนจริง","e":"<i>would</i> + infinitive in the main clause means the second conditional, so the <i>if</i> clause needs a past form: <b>weren't</b>. <b>aren't</b> belongs to the first conditional, which would need <i>will take</i>, <b>won't be</b> cannot follow <i>if</i> at all, and <b>hadn't been</b> would push the whole sentence into the past.","eT":"เมื่อประโยคหลักใช้ <i>would</i> + infinitive แสดงว่าเป็น second conditional ประโยค <i>if</i> จึงต้องใช้รูปอดีต คือ <b>weren't</b> ส่วน <b>aren't</b> เป็นของ first conditional ซึ่งประโยคหลักต้องเป็น <i>will take</i> <b>won't be</b> ตามหลัง <i>if</i> ไม่ได้เลย และ <b>hadn't been</b> จะทำให้ทั้งประโยคกลายเป็นเรื่องในอดีต","a":0,"o":["weren't","hadn't been","aren't","won't be"],"s":"Weera would take the train to Bangkok every month if the tickets <span class='bl'>_____</span> so expensive."},{"n":6,"p":"A","tag":"-ed / -ing adjectives","tagT":"คำคุณศัพท์ -ed กับ -ing (ผู้รู้สึก กับ สิ่งที่ทำให้รู้สึก)","h":"Does the talk feel something itself, or does it make the audience feel something?","hT":"ลองถามตัวเองว่าการบรรยายเป็นผู้รู้สึกเอง หรือเป็นสิ่งที่ทำให้ผู้ฟังรู้สึก","e":"The talk causes the feeling, so it takes the <i>-ing</i> adjective <b>fascinating</b>. <b>fascinated</b> describes the people who feel it, while <b>fascinate</b> is a verb and <b>fascination</b> a noun, and neither can follow <i>so</i>.","eT":"การบรรยายเป็นสิ่งที่ทำให้เกิดความรู้สึก จึงใช้คำคุณศัพท์รูป <i>-ing</i> คือ <b>fascinating</b> ส่วน <b>fascinated</b> ใช้กับคนที่รู้สึก และ <b>fascinate</b> เป็นกริยา <b>fascination</b> เป็นคำนาม ทั้งสองคำวางหลัง <i>so</i> ไม่ได้","a":1,"o":["fascinated","fascinating","fascinate","fascination"],"s":"The talk on volcanoes was so <span class='bl'>_____</span> that nobody in the hall noticed the hour had passed."},{"n":7,"p":"A","tag":"Past perfect","tagT":"Past perfect (อดีตที่เกิดก่อนอีกเหตุการณ์)","h":"Two things happened in the past: which one came first, and how does English mark it?","hT":"มีสองเหตุการณ์ในอดีต ให้คิดว่าเหตุการณ์ไหนเกิดขึ้นก่อน และภาษาอังกฤษใช้รูปใดบอกเหตุการณ์ที่เกิดก่อน","e":"The boat went before they arrived, so the earlier event takes the past perfect <b>had already left</b>. <b>has already left</b> would tie the boat to the present, which clashes with <i>reached</i> and <i>had to sleep</i>; <b>already leaves</b> is a present form, and <b>would already leave</b> describes something imagined rather than something that happened.","eT":"เรือออกไปก่อนที่พวกเขาจะมาถึง เหตุการณ์ที่เกิดก่อนจึงใช้ past perfect คือ <b>had already left</b> ส่วน <b>has already left</b> จะโยงเรื่องมาถึงปัจจุบัน ซึ่งขัดกับ <i>reached</i> และ <i>had to sleep</i> ที่เป็นอดีต ขณะที่ <b>already leaves</b> เป็นรูปปัจจุบัน และ <b>would already leave</b> ใช้พูดถึงเรื่องสมมติ ไม่ใช่เรื่องที่เกิดขึ้นจริง","a":3,"o":["would already leave","has already left","already leaves","had already left"],"s":"By the time Lucy and I reached the pier, the last boat <span class='bl'>_____</span>, so we had to sleep in the village."},{"n":8,"p":"A","tag":"Connectors of contrast and reason","tagT":"คำเชื่อมแสดงความขัดแย้งและเหตุผล (contrast / reason)","h":"The weather was bad but the market still opened, and the words after the gap are a noun phrase.","hT":"ฝนตกหนักแต่ตลาดก็ยังเปิด และคำที่ตามหลังช่องว่างเป็นคำนาม ไม่ใช่ประโยคเต็ม","e":"The two ideas contrast, and <i>the heavy rain</i> is a noun phrase, so <b>Despite</b> fits. <b>Although</b> needs a clause with a verb, <b>However</b> needs its own sentence, and <b>Because of</b> gives a reason, which turns the meaning upside down.","eT":"สองความคิดนี้ขัดแย้งกัน และ <i>the heavy rain</i> เป็นคำนาม จึงใช้ <b>Despite</b> ได้ ส่วน <b>Although</b> ต้องตามด้วยประโยคที่มีกริยา <b>However</b> ต้องขึ้นประโยคใหม่ และ <b>Because of</b> เป็นคำบอกเหตุผล ซึ่งทำให้ความหมายกลับตาลปัตร","a":0,"o":["Despite","Although","However","Because of"],"s":"<span class='bl'>_____</span> the heavy rain on Saturday morning, the floating market opened at six as usual."},{"n":9,"p":"A","tag":"Modals of deduction","tagT":"Modal ที่ใช้แสดงการคาดเดา","h":"The bicycle is the evidence, and <i>so</i> introduces a confident conclusion.","hT":"จักรยานที่ยังจอดอยู่คือหลักฐาน และคำว่า <i>so</i> นำไปสู่ข้อสรุปที่มั่นใจ","e":"Evidence plus <i>so</i> calls for the modal of near-certainty, <b>must</b>. <b>can't</b> would deny the very thing the bicycle proves, and <b>mustn't</b> and <b>needn't</b> are about rules and obligation, not deduction.","eT":"เมื่อมีหลักฐานและมีคำว่า <i>so</i> นำข้อสรุป เราใช้ modal ที่แสดงความมั่นใจมาก คือ <b>must</b> ส่วน <b>can't</b> จะปฏิเสธสิ่งที่จักรยานกำลังบอกเรา และ <b>mustn't</b> กับ <b>needn't</b> เป็นเรื่องกฎและความจำเป็น ไม่ใช่การคาดเดา","a":1,"o":["needn't","must","can't","mustn't"],"s":"It's nine o'clock and Fah's bicycle is still outside the library, so she <span class='bl'>_____</span> be inside revising."},{"n":10,"p":"A","tag":"Reported statements","tagT":"Reported speech (การเล่าคำพูดของผู้อื่น)","h":"He spoke in the past, so the future form inside his own words has to shift back a step.","hT":"เขาพูดไว้ในอดีต คำบอกอนาคตในคำพูดเดิมจึงต้องเปลี่ยนรูปถอยไปหนึ่งขั้น","e":"<i>said</i> is past and the time has already been shifted to <i>the following day</i>, so <i>I will bring</i> becomes <b>would</b> bring. <b>will</b> and <b>is going to</b> keep a present viewpoint, which clashes with that shifted time phrase, and <b>shall</b> is a present form that with <i>he</i> would sound like an order rather than a plan.","eT":"<i>said</i> เป็นอดีต และคำบอกเวลาก็ถอยไปเป็น <i>the following day</i> แล้ว ดังนั้น <i>I will bring</i> ในคำพูดเดิมจึงเปลี่ยนเป็น <b>would</b> bring ส่วน <b>will</b> และ <b>is going to</b> ยังมองจากปัจจุบัน ซึ่งขัดกับคำบอกเวลาที่ถอยไปแล้ว และ <b>shall</b> เป็นรูปปัจจุบัน ถ้าใช้กับ <i>he</i> จะฟังเหมือนการสั่ง ไม่ใช่การเล่าแผน","a":3,"o":["will","shall","is going to","would"],"s":"Nont said he <span class='bl'>_____</span> bring his guitar to the picnic the following day."},{"n":11,"p":"B","tag":"Subject–verb agreement","tagT":"ความสอดคล้องของประธานกับกริยา","h":"Find the real subject of the sentence; it is not the word <i>maps</i>.","hT":"หาประธานจริงของประโยคให้เจอ ประธานไม่ใช่คำว่า maps","e":"The subject is <b>the parcel</b>, which is singular, so the verb must be <b>has not arrived</b>. <i>of maps</i> and the relative clause sit between the subject and the verb and pull you towards a plural, but neither of them is the subject. The other three parts are right: <i>ordered</i> and <i>last term</i> belong to the finished past action inside the relative clause, and <i>arrived</i> is the correct participle after <i>has not</i>.","eT":"ประธานของประโยคคือ <b>the parcel</b> ซึ่งเป็นเอกพจน์ กริยาจึงต้องเป็น <b>has not arrived</b> ส่วน <i>of maps</i> และ relative clause ที่อยู่คั่นกลาง ทำให้เราเผลอใช้กริยาพหูพจน์ แต่ทั้งสองส่วนนั้นไม่ใช่ประธาน อีกสามส่วนถูกต้องแล้ว <i>ordered</i> กับ <i>last term</i> เป็นเหตุการณ์ในอดีตที่จบแล้วใน relative clause และ <i>arrived</i> เป็นรูป participle ที่ถูกต้องหลัง <i>has not</i>","a":2,"o":["ordered","last term","have","arrived"],"s":"The parcel of maps that the geography teacher <u class='u'>ordered</u><sup>A</sup> <u class='u'>last term</u><sup>B</sup> <u class='u'>have</u><sup>C</sup> not <u class='u'>arrived</u><sup>D</sup> yet.","fix":"has"},{"n":12,"p":"B","tag":"for and since with the present perfect","tagT":"การใช้ for กับ since ใน present perfect","h":"Three years is a length of time, not the moment something began.","hT":"three years เป็นความยาวของช่วงเวลา ไม่ใช่จุดเริ่มต้นของเหตุการณ์","e":"<b>since</b> marks the point at which something started, as in <i>since Year 7</i>, while <b>for</b> marks how long it has lasted, so <i>three years</i> needs <b>for</b>. The other three parts are all correct: <i>knows</i> agrees with <i>he</i>, <i>by heart</i> is a fixed phrase, and <i>needs</i> follows <i>rarely</i> normally.","eT":"<b>since</b> ใช้บอกจุดเริ่มต้น เช่น <i>since Year 7</i> แต่ <b>for</b> ใช้บอกว่านานเท่าไร ดังนั้น <i>three years</i> ต้องใช้ <b>for</b> ส่วนอีกสามส่วนถูกต้องแล้ว <i>knows</i> สอดคล้องกับ <i>he</i> <i>by heart</i> เป็นสำนวนที่ใช้คู่กัน และ <i>needs</i> ตามหลัง <i>rarely</i> ได้ปกติ","a":0,"o":["since","knows","by heart","needs"],"s":"Daniel has played in the school band <u class='u'>since</u><sup>A</sup> three years, so he <u class='u'>knows</u><sup>B</sup> all the pieces <u class='u'>by heart</u><sup>C</sup> and rarely <u class='u'>needs</u><sup>D</sup> the music.","fix":"for"},{"n":13,"p":"B","tag":"Uncountable nouns","tagT":"คำนามนับไม่ได้","h":"Some English nouns never take a plural <i>-s</i>, however much of them there is.","hT":"คำนามบางคำในภาษาอังกฤษเติม -s ไม่ได้เลย ไม่ว่าจะมีมากแค่ไหน","e":"<b>information</b> is uncountable in English, so it has no plural form and the <i>-s</i> must go. The other parts are sound: <i>bought</i> is the past of <i>buy</i>, <i>neither of us</i> is the right pattern, and <i>remembered to print</i> is the right pattern too, since <i>remember to do</i> something is about a task you must not forget — which is exactly what they did forget.","eT":"<b>information</b> เป็นคำนามนับไม่ได้ในภาษาอังกฤษ จึงไม่มีรูปพหูพจน์ ต้องตัด <i>-s</i> ออก ส่วนอีกสามส่วนถูกแล้ว <i>bought</i> เป็นอดีตของ <i>buy</i> <i>neither of us</i> เป็นโครงสร้างที่ถูกต้อง และ <i>remembered to print</i> ใช้ infinitive ถูกต้องเมื่อหมายถึงจำได้ว่าต้องทำอะไร","a":3,"o":["bought","neither","remembered","informations"],"s":"We <u class='u'>bought</u><sup>A</sup> a few bottles of water for the trip, but <u class='u'>neither</u><sup>B</sup> of us <u class='u'>remembered</u><sup>C</sup> to print the <u class='u'>informations</u><sup>D</sup> about the route.","fix":"information"},{"n":14,"p":"B","tag":"Verb patterns: verb + -ing","tagT":"โครงสร้าง verb + V-ing (กริยาที่ตามด้วยรูป -ing)","h":"Two of the verbs here decide the form of the verb that follows them, and English will not let both of them take an infinitive.","hT":"ในประโยคนี้มีกริยาสองตัวที่กำหนดรูปของกริยาที่ตามมา และภาษาอังกฤษไม่ยอมให้ทั้งสองตัวตามด้วย infinitive","e":"<b>suggest</b> takes a gerund or a <i>that</i> clause, never an infinitive, so the part must become <b>visiting</b>. The other three are sound: <i>My cousin</i> is a perfectly good subject, <i>decide</i>, in contrast, really does take an infinitive, and <i>because of</i> is right before the noun <i>the rain</i>.","eT":"<b>suggest</b> ตามด้วย gerund หรือ that clause เท่านั้น ไม่ตามด้วย infinitive จึงต้องแก้เป็น <b>visiting</b> ส่วนอีกสามส่วนถูกต้องแล้ว <i>My cousin</i> เป็นประธานที่ใช้ได้ปกติ <i>decide</i> ตามด้วย infinitive ได้จริง และ <i>because of</i> ก็ถูกต้องเพราะตามด้วยคำนาม <i>the rain</i>","a":1,"o":["My cousin","to visit","decided","because of"],"s":"<u class='u'>My cousin</u><sup>A</sup> suggested <u class='u'>to visit</u><sup>B</sup> the night market, but in the end we <u class='u'>decided</u><sup>C</sup> to stay at home <u class='u'>because of</u><sup>D</sup> the rain.","fix":"visiting"},{"n":15,"p":"C","tag":"Collocation: verb + noun","tagT":"Collocation: กริยา + คำนาม (คำที่ภาษาอังกฤษใช้คู่กัน)","h":"English pairs <i>an effort</i> with the same verb it pairs with <i>a mistake</i> and <i>a decision</i>.","hT":"ภาษาอังกฤษใช้กริยาตัวเดียวกับที่ใช้คู่กับ <i>a mistake</i> และ <i>a decision</i>","e":"The fixed collocation is <b>make an effort</b>, so <b>made</b> is the only choice. <b>did</b> goes with <i>homework</i> and <i>the washing-up</i>; <b>took</b> works only in the pattern <i>it took a lot of effort</i>, where the subject is <i>it</i> and not the person; and <b>gave</b> is not used with <i>an effort</i> at all in British English.","eT":"คำที่ใช้คู่กันอย่างตายตัวคือ <b>make an effort</b> ดังนั้นต้องเป็น <b>made</b> ส่วน <b>did</b> ใช้กับ <i>homework</i> หรือ <i>the washing-up</i> และ <b>took</b> ใช้ได้เฉพาะในรูป <i>it took a lot of effort</i> ที่มี <i>it</i> เป็นประธาน ไม่ใช่ตัวคน ส่วน <b>gave</b> ไม่ใช้คู่กับ <i>an effort</i> ในภาษาอังกฤษแบบบริติชเลย","a":1,"o":["gave","made","did","took"],"s":"Kanya <span class='bl'>_____</span> a real effort to speak English with the exchange students from Hanoi."},{"n":16,"p":"C","tag":"Phrasal verbs","tagT":"Phrasal verb (กริยาวลี)","h":"She is going to start a sport again, so which two-word verb means <i>begin a hobby</i>?","hT":"เธอกำลังจะเริ่มเล่นกีฬาอีกครั้ง ให้เลือก phrasal verb ที่หมายถึงเริ่มทำงานอดิเรก","e":"<b>take up</b> a sport or a hobby means to start doing it, which is exactly what Bee is doing. <b>put up</b> means to build or to raise, <b>bring up</b> means to raise a child or to mention a subject, and <b>look up</b> means to check in a book or online.","eT":"<b>take up</b> ใช้กับกีฬาหรืองานอดิเรก หมายถึงเริ่มทำสิ่งนั้น ซึ่งตรงกับสิ่งที่ Bee กำลังทำ ส่วน <b>put up</b> หมายถึงสร้างหรือยกขึ้น <b>bring up</b> หมายถึงเลี้ยงดูเด็กหรือยกเรื่องขึ้นมาพูด และ <b>look up</b> หมายถึงค้นหาในหนังสือหรือในอินเทอร์เน็ต","a":0,"o":["take up","bring up","look up","put up"],"s":"Bee has decided to <span class='bl'>_____</span> swimming again now that the new pool near her flat has opened."},{"n":17,"p":"C","tag":"Word formation: nouns from verbs","tagT":"การสร้างคำ: เปลี่ยนกริยาเป็นคำนาม","h":"The gap is the subject of <i>surprised</i>, so it has to be a noun.","hT":"ช่องว่างนี้เป็นประธานของกริยา <i>surprised</i> จึงต้องเป็นคำนาม","e":"<i>Arisa's</i> here is the possessive, not a short form of <i>Arisa is</i>, so the gap sits in front of the verb <i>surprised</i> and the sentence needs a noun: the noun from <i>determine</i> is <b>determination</b>. <b>determined</b> is an adjective and <b>determinedly</b> an adverb, so neither can be a subject, and <b>determine</b> would leave the sentence with two main verbs.","eT":"<i>Arisa's</i> ที่นี่เป็นรูปแสดงความเป็นเจ้าของ ไม่ใช่รูปย่อของ <i>Arisa is</i> ช่องว่างจึงอยู่หน้ากริยา <i>surprised</i> และประโยคต้องการคำนาม ซึ่งคำนามของ <i>determine</i> คือ <b>determination</b> ส่วน <b>determined</b> เป็นคำคุณศัพท์ <b>determinedly</b> เป็นคำกริยาวิเศษณ์ ทั้งสองคำทำหน้าที่ประธานไม่ได้ และถ้าใช้ <b>determine</b> ประโยคจะมีกริยาหลักสองตัว","a":2,"o":["determine","determined","determination","determinedly"],"s":"Arisa's <span class='bl'>_____</span> to finish the whole race surprised everybody in her family."},{"n":18,"p":"C","tag":"Vocabulary: adjectives for surfaces","tagT":"คำศัพท์: คำคุณศัพท์บอกลักษณะพื้นผิว","h":"Think what wet rock does to your feet, and why good shoes would help.","hT":"ลองคิดว่าหินเปียกทำให้เท้าเราเป็นอย่างไร และทำไมรองเท้าที่เกาะพื้นดีจึงช่วยได้","e":"<b>slippery</b> describes a wet surface that your feet slide on, which is why grip matters. <b>dusty</b> contradicts <i>after rain</i>, <b>sticky</b> suggests glue or sweets, and <b>rusty</b> is used of iron, not of stone.","eT":"<b>slippery</b> ใช้บอกพื้นเปียกที่เท้าลื่นไถล จึงเป็นเหตุผลที่ต้องใส่รองเท้าเกาะพื้นดี ส่วน <b>dusty</b> ขัดกับคำว่า <i>after rain</i> <b>sticky</b> ใช้กับกาวหรือขนมที่เหนียวติดมือ และ <b>rusty</b> ใช้กับเหล็กที่เป็นสนิม ไม่ใช้กับหิน","a":3,"o":["sticky","rusty","dusty","slippery"],"s":"The stone path beside the waterfall gets very <span class='bl'>_____</span> after rain, so wear shoes with a good grip."},{"n":19,"p":"D","tag":"Agreeing to a request","tagT":"การตอบรับเมื่อมีคนขอให้ช่วย","h":"A needs a small favour, so B should agree and sound relaxed about it.","hT":"A ขอให้ช่วยเรื่องเล็ก ๆ B จึงควรตอบรับ และพูดให้ดูสบาย ๆ ไม่เร่งร้อน","e":"A polite request with <i>Could you…?</i> is answered by agreeing and then reassuring A that there is no hurry. <b>Never mind, it isn't far.</b> answers a different problem, <b>No, I haven't seen your bag.</b> treats the bag as lost, and <b>Yes, I'd like two tickets, please.</b> is what A would say at the ticket window, not B.","eT":"คำขอสุภาพที่ขึ้นต้นว่า <i>Could you…?</i> เราตอบด้วยการรับปากก่อน แล้วบอกให้อีกฝ่ายไม่ต้องรีบ ส่วน <b>Never mind, it isn't far.</b> ไปตอบปัญหาคนละเรื่อง <b>No, I haven't seen your bag.</b> ทำเหมือนกระเป๋าหายไปแล้ว และ <b>Yes, I'd like two tickets, please.</b> เป็นคำที่ A จะพูดที่ช่องขายตั๋ว ไม่ใช่ B พูด","a":2,"o":["Never mind, it isn't far.","Yes, I'd like two tickets, please.","Yes, of course. Take your time.","No, I haven't seen your bag."],"s":"<b>A:</b> Could you keep an eye on my bag while I buy the tickets?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":20,"p":"D","tag":"Turning down an offer politely","tagT":"การปฏิเสธความช่วยเหลืออย่างสุภาพ","h":"B does not need help, but wants to sound grateful rather than blunt.","hT":"B ไม่ต้องการให้ช่วย แต่ก็อยากพูดให้ดูขอบคุณ ไม่ห้วน","e":"An offer with <i>Shall I…?</i> is refused by thanking the speaker first, which is what the key does. <b>Yes, you shall.</b> and <b>No, you shan't.</b> sound like orders from a head teacher, and <b>Of course I do.</b> answers a different question altogether.","eT":"คำเสนอช่วยที่ขึ้นต้นว่า <i>Shall I…?</i> ถ้าจะปฏิเสธ เราต้องขอบคุณก่อน ซึ่งคำตอบที่ถูกทำอย่างนั้น ส่วน <b>Yes, you shall.</b> และ <b>No, you shan't.</b> ฟังเหมือนครูใหญ่สั่งงาน และ <b>Of course I do.</b> เป็นการตอบคำถามคนละแบบ","a":3,"o":["No, you shan't.","Of course I do.","Yes, you shall.","That's very kind, but I can manage."],"s":"<b>A:</b> Shall I give you a hand with those chairs before the concert starts?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":21,"p":"D","tag":"Asking someone to repeat something","tagT":"การขอให้พูดซ้ำ","h":"B did not catch the number and needs to hear it once more.","hT":"B ฟังตัวเลขไม่ทัน จึงต้องขอให้อีกฝ่ายพูดอีกครั้ง","e":"A long number is easy to mishear, and the polite way to ask for it again is <i>would you mind repeating…?</i> The other three replies are about refusing, about not caring and about being unable to help, none of which fits a notice of payment.","eT":"ตัวเลขยาว ๆ ฟังพลาดได้ง่าย วิธีขออย่างสุภาพคือพูดว่า <i>would you mind repeating…?</i> ส่วนอีกสามคำตอบเป็นการปฏิเสธที่จะบอก การบอกว่าไม่สนใจ และการบอกว่าช่วยไม่ได้ ซึ่งไม่เข้ากับการแจ้งเรื่องเงินค่ามัดจำเลย","a":1,"o":["Sorry, I'd rather not say.","Sorry, would you mind repeating the figure?","Sorry, I'm afraid I can't help you.","Sorry, it doesn't matter to me."],"s":"<b>A:</b> The deposit for the trip is one thousand two hundred baht, payable by Friday.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":22,"p":"D","tag":"Reacting to bad news","tagT":"การแสดงความเห็นใจเมื่อได้ยินข่าวร้าย","h":"A is disappointed, so B should sound sorry first and then encouraging.","hT":"A รู้สึกเสียใจ B จึงควรแสดงความเห็นใจก่อน แล้วค่อยให้กำลังใจ","e":"Bad news is met with sympathy and then encouragement, which is exactly the shape of the key. <b>congratulations</b> celebrates good news, <b>that's a relief</b> treats the result as welcome, and <b>I don't mind at all</b> makes B sound uninterested.","eT":"เมื่อได้ยินข่าวร้าย เราแสดงความเห็นใจก่อนแล้วให้กำลังใจ ซึ่งตรงกับรูปแบบของคำตอบที่ถูก ส่วน <b>congratulations</b> ใช้ยินดีกับข่าวดี <b>that's a relief</b> ทำเหมือนผลนี้เป็นเรื่องดี และ <b>I don't mind at all</b> ทำให้ B ดูเหมือนไม่สนใจความรู้สึกของเพื่อน","a":0,"o":["Oh, what a shame. You can try again next term.","Oh, congratulations! Well done.","Oh, that's a relief.","Oh, I don't mind at all."],"s":"<b>A:</b> I didn't get into the choir. They only took six people this year.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":23,"p":"E","tag":"Time words with the present perfect","tagT":"คำบอกเวลาที่ใช้กับ present perfect","h":"Does the gap introduce the moment something began, or how long it has lasted?","hT":"ช่องนี้บอกจุดเริ่มต้นของเหตุการณ์ หรือบอกว่านานเท่าไร ลองดูให้ดี","e":"<i>the centre opened</i> is a single event, a starting point, so <b>since</b> is needed; <b>for</b> would require a length of time such as <i>six years</i>. <b>when</b> and <b>until</b> both point to a finished moment, and neither can follow <i>have been giving up</i>, a form which says the volunteers are still at it.","eT":"<i>the centre opened</i> เป็นเหตุการณ์เดียว คือจุดเริ่มต้น จึงต้องใช้ <b>since</b> ถ้าจะใช้ <b>for</b> ต้องตามด้วยความยาวของเวลา เช่น <i>six years</i> ส่วน <b>when</b> และ <b>until</b> ชี้ไปที่จุดเวลาที่จบแล้ว จึงตามหลัง <i>have been giving up</i> ไม่ได้ เพราะรูปนี้บอกว่าอาสาสมัครยังทำอยู่จนถึงวันนี้","a":3,"o":["for","when","until","since"],"s":"","t":0},{"n":24,"p":"E","tag":"Past perfect in a past narrative","tagT":"Past perfect ในเรื่องเล่าที่เป็นอดีต","h":"The lamp broke before Krit walked in, and the whole paragraph is told in the past.","hT":"โคมไฟเสียก่อนที่ Krit จะเดินเข้ามา และย่อหน้านี้เล่าเป็นอดีตทั้งหมด","e":"The lamp failed <i>before</i> he arrived, and the paragraph is a past narrative, so the earlier event takes the past perfect <b>had stopped</b>. <b>has stopped</b> would link the fault to the present, which clashes with <i>arrived last month</i>; <b>stops</b> would turn a one-off breakdown into something the lamp does regularly; and <b>was stopped</b> cannot stand in front of <i>working</i> at all.","eT":"โคมไฟเสียก่อนที่เขาจะมาถึง และย่อหน้านี้เล่าเรื่องในอดีต เหตุการณ์ที่เกิดก่อนจึงใช้ past perfect คือ <b>had stopped</b> ส่วน <b>has stopped</b> จะโยงความเสียมาถึงปัจจุบัน ซึ่งขัดกับ <i>arrived last month</i> ถ้าใช้ <b>stops</b> จะกลายเป็นว่าโคมไฟเสียเป็นประจำ ไม่ใช่เสียครั้งเดียว และ <b>was stopped</b> วางไว้หน้า <i>working</i> ไม่ได้เลย","a":2,"o":["has stopped","stops","had stopped","was stopped"],"s":"","t":0},{"n":25,"p":"E","tag":"Connector of contrast","tagT":"คำเชื่อมแสดงความขัดแย้ง","h":"Krit's story ended well; the next sentence does not. The two ideas pull opposite ways.","hT":"เรื่องของ Krit จบลงด้วยดี แต่ประโยคถัดไปไม่ใช่อย่างนั้น สองความคิดนี้สวนทางกัน","e":"The lamp was mended, yet the next sentence admits that some visitors leave with nothing working, so the text needs the contrast marker <b>However</b>. <b>Therefore</b> and <b>In addition</b> both signal agreement with what came before, and nothing is being illustrated, so <b>For example</b> is wrong too.","eT":"โคมไฟซ่อมได้สำเร็จ แต่ประโยคถัดไปยอมรับว่าผู้มาบางคนกลับบ้านโดยที่ของยังใช้ไม่ได้ เนื้อเรื่องจึงต้องใช้คำเชื่อมแสดงความขัดแย้งคือ <b>However</b> ส่วน <b>Therefore</b> และ <b>In addition</b> เป็นคำที่บอกว่าไปในทางเดียวกับข้อความก่อนหน้า และที่นี่ไม่ได้ยกตัวอย่าง จึงใช้ <b>For example</b> ไม่ได้","a":0,"o":["However","For example","In addition","Therefore"],"s":"","t":0},{"n":26,"p":"E","tag":"Vocabulary from the whole text","tagT":"คำศัพท์ที่ต้องอ่านทั้งเรื่องจึงจะเลือกได้","h":"Go back to the first paragraph: what did the volunteers say they were really trying to do?","hT":"กลับไปอ่านย่อหน้าแรกว่าอาสาสมัครบอกว่าสิ่งที่เขาต้องการทำจริง ๆ คืออะไร","e":"The first paragraph says that <i>the aim is to teach rather than simply to mend</i>, and the sentence just before the gap says that nobody leaves without having learnt something, so the real <b>purpose</b> of the table is teaching. <b>profit</b> is impossible because the volunteers <i>charge nothing at all</i>, <b>repair</b> would contradict the very sentence that puts teaching above mending, and nothing in the text calls the table a <b>problem</b>.","eT":"ย่อหน้าแรกบอกว่า <i>the aim is to teach rather than simply to mend</i> และประโยคก่อนช่องว่างก็บอกว่าไม่มีใครกลับไปโดยไม่ได้เรียนรู้อะไรเลย ดังนั้นสิ่งที่เป็น <b>purpose</b> จริง ๆ ของโต๊ะนี้คือการสอน ส่วน <b>profit</b> เป็นไปไม่ได้เพราะอาสาสมัคร <i>charge nothing at all</i> ส่วน <b>repair</b> ก็ขัดกับประโยคที่บอกว่าการสอนสำคัญกว่าการซ่อม และไม่มีตรงไหนในเรื่องที่บอกว่าโต๊ะนี้เป็น <b>problem</b>","a":1,"o":["problem","purpose","profit","repair"],"s":"","t":0},{"n":27,"p":"F","tag":"Reading for detail","tagT":"อ่านจับรายละเอียด","h":"Paragraph 1 gives a reason which has nothing to do with the tappers' own comfort.","hT":"ย่อหน้าแรกให้เหตุผลที่ไม่เกี่ยวกับความสบายของคนกรีดยางเลย","e":"Paragraph 1 says the sap <i>runs fastest in the hours before sunrise</i>, so the timing is about the sap, not the people. The text does mention cool air, but only to say that it is not the whole reason, and it never claims that the bark softens or that sunlight harms the trees.","eT":"ย่อหน้าแรกบอกว่าน้ำยาง <i>runs fastest in the hours before sunrise</i> ดังนั้นเวลาที่เลือกจึงเป็นเรื่องของน้ำยาง ไม่ใช่เรื่องของคน เนื้อเรื่องพูดถึงอากาศเย็นจริง แต่บอกว่านั่นไม่ใช่เหตุผลทั้งหมด และไม่ได้บอกเลยว่าเปลือกไม้นิ่มลง หรือแสงแดดทำให้ต้นยางเสียหาย","a":0,"o":["Latex flows more quickly before the sun comes up.","The bark is softer while it is still dark.","The trees are damaged by strong sunlight.","The knife stays sharper in the cool air."],"s":"According to paragraph 1, why do the tappers begin work at about two in the morning?","t":1},{"n":28,"p":"F","tag":"Vocabulary in context","tagT":"เดาความหมายคำศัพท์จากบริบท","h":"What has to be opened so a liquid can travel through the bark?","hT":"อะไรที่ต้องถูกเปิดออกเพื่อให้ของเหลวไหลผ่านเปลือกไม้ได้","e":"The text says the groove opens <i>the vessels that carry the latex</i>, so vessels are the small channels the sap moves through. The vessels are inside the bark, which rules out <b>outer layers</b>, and they are nothing like branches or leaves.","eT":"เนื้อเรื่องบอกว่ารอยกรีดเปิด <i>the vessels that carry the latex</i> ดังนั้น vessels คือท่อเล็ก ๆ ที่น้ำยางไหลผ่าน ท่อเหล่านี้อยู่ข้างในเปลือกไม้ จึงไม่ใช่ <b>outer layers</b> และไม่ใช่กิ่งหรือใบเลย","a":3,"o":["thick branches","young leaves","outer layers","narrow tubes"],"s":"The word <i>vessels</i> in paragraph 2 is closest in meaning to <span class='bl'>_____</span>","t":1},{"n":29,"p":"F","tag":"Inference","tagT":"การตีความสิ่งที่ผู้เขียนบอกเป็นนัย","h":"Paragraph 2 explains what happens when the knife goes too deep.","hT":"ย่อหน้าที่สองอธิบายว่าจะเกิดอะไรขึ้นถ้ากรีดลึกเกินไป","e":"Paragraph 2 says the cut needs <i>a great deal of practice</i> and that a tree cut too deeply <i>heals badly and gives less for years afterwards</i>; a tapper without that practice is the one who cuts too deep, so that is the consequence we can infer. The article says nothing about sharpening, about thin latex or about finishing a whole grove by dawn.","eT":"ย่อหน้าที่สองบอกว่ารอยกรีดต้องใช้ <i>a great deal of practice</i> และบอกว่าต้นที่กรีดลึกเกินไป <i>heals badly and gives less for years afterwards</i> คนที่ยังฝึกไม่พอคือคนที่กรีดลึกเกินไป ผลที่เราอนุมานได้จึงเป็นข้อนี้ เนื้อเรื่องไม่ได้พูดถึงการลับมีด น้ำยางที่เจือจางเกินไป หรือการกรีดให้ครบทั้งสวนก่อนฟ้าสาง","a":2,"o":["finish the whole grove before sunrise","collect latex that is too thin to use","harm the tree and reduce its latex for years","need to sharpen the knife more often"],"s":"The article suggests that a tapper who has not had enough practice will <span class='bl'>_____</span>","t":1},{"n":30,"p":"F","tag":"Main idea and purpose","tagT":"ใจความสำคัญและจุดประสงค์ของผู้เขียน","h":"Think about why the writer keeps mentioning timing and long experience.","hT":"ลองคิดว่าทำไมผู้เขียนพูดถึงจังหวะเวลาและความชำนาญอยู่เรื่อย ๆ","e":"Every paragraph joins skill to timing: the hours before dawn, the practised cut, the rest day between tappings, the twenty-five productive years. Pay, machines and the seasons are never mentioned, so the other three options cannot be the writer's point.","eT":"ทุกย่อหน้าโยงความชำนาญเข้ากับจังหวะเวลา ทั้งช่วงก่อนฟ้าสาง รอยกรีดที่ต้องฝึก วันพักระหว่างการกรีด และอายุให้ผลผลิตยี่สิบห้าปี เรื่องค่าแรง เครื่องจักร และฤดูกาลไม่ได้ถูกพูดถึงเลย อีกสามตัวเลือกจึงไม่ใช่ใจความที่ผู้เขียนต้องการสื่อ","a":1,"o":["It is slowly being taken over by machines.","It is a skilled job which has to fit the tree's own rhythm.","It is badly paid work which few young people want.","It is easier in the cool season than in the hot one."],"s":"What is the writer's main point about this work?","t":1}]},{"n":4,"name":"Sharpening Up","nameT":"ขัดให้คม","cefr":"B1","mins":35,"total":30,"parts":[{"id":"A","t":"Grammar and Structure","tT":"ไวยากรณ์และโครงสร้างประโยค","i":"Choose the word or phrase that best completes each sentence.","iT":"เลือกคำหรือวลีที่เติมในช่องว่างได้ถูกต้องที่สุด","r":"1 – 10","c":10},{"id":"B","t":"Error Identification","tT":"หาจุดที่ผิด","i":"One of the four underlined parts is wrong. Choose the part that must be changed.","iT":"ในแต่ละประโยคมีส่วนที่ขีดเส้นใต้ 4 ส่วน และมี 1 ส่วนที่ผิด เลือกส่วนที่ต้องแก้","r":"11 – 14","c":4},{"id":"C","t":"Vocabulary and Collocation","tT":"คำศัพท์และคำที่ใช้คู่กัน","i":"Choose the word that fits the sentence best.","iT":"เลือกคำที่เข้ากับประโยคได้ดีที่สุด","r":"15 – 18","c":4},{"id":"D","t":"Everyday Conversation","tT":"บทสนทนาในชีวิตประจำวัน","i":"Choose the most natural reply.","iT":"เลือกคำตอบที่เป็นธรรมชาติที่สุดในสถานการณ์นั้น","r":"19 – 22","c":4},{"id":"E","t":"Cloze Passage","tT":"เติมคำในเนื้อเรื่อง","i":"Read the whole text first, then choose the best word for each numbered gap.","iT":"อ่านเนื้อเรื่องให้จบก่อน แล้วจึงเลือกคำที่เหมาะกับช่องว่างแต่ละช่อง","r":"23 – 26","c":4},{"id":"F","t":"Reading Comprehension","tT":"อ่านจับใจความ","i":"Read the text and answer the questions that follow.","iT":"อ่านเนื้อเรื่องแล้วตอบคำถาม","r":"27 – 30","c":4}],"texts":[{"t":"The Floating Library","tT":"ห้องสมุดลอยน้ำ","p":["Every other Saturday morning a long wooden boat leaves the jetty at Ban Mae Pluang with nine crates of books lashed to the deck. The boat belongs to the district library, and for the past eleven years it <b>__23__</b> the same route around the reservoir, calling at twelve villages that no road reaches once the rains begin.","The crates are heavy, so the children themselves carry them up from the water. Nothing is computerised: the books are stamped out <b>__24__</b> hand and every loan is written into a thick notebook held together with a rubber band, because six of the stops have no electricity.","The journey is not easy. At two of the stops the jetty has rotted away, so the crates must be passed over the side into a smaller boat. <b>__25__</b>, in eleven years the service has failed to arrive only once.","Visitors often ask whether the books ever come back. Nearly all do: fewer than thirty have been lost in eleven years, which the librarian <b>__26__</b> to the fact that in a village of ninety everyone knows who has what."]},{"t":"Late to the Water","tT":"ลงน้ำช้ากว่าคนอื่น","p":["I learnt to swim at fifteen, which in my family is a slightly ridiculous thing for a boy to admit. My cousins had all been thrown into the canal behind my grandfather’s house before they could walk, and every one of them could swim by the age of three. I had been ill the summer my own turn came, and after that it was easier to say I did not feel like it than to admit I was afraid.","The pool in our district opens at six in the morning. When I finally signed up, the instructor, Khru Arisa, looked at the form and then at me, and put me down for Tuesdays at half past six. She never explained why. There were two other people in the water at that hour, both of them about seventy, and neither of them looked up once.","The first lesson was mostly standing. I held the rail with both hands while she talked about breathing, and I was <i>convinced</i> everybody in the building could hear my heart. By the fourth lesson I could cross the shallow end. By the twelfth I could swim a length, badly, with my head far too high.","I am not a good swimmer now. But last month my nine-year-old brother asked me to teach him, and I booked the pool for Tuesdays at half past six."]}],"items":[{"n":1,"p":"A","tag":"Past perfect continuous","tagT":"Past perfect continuous (อดีตสมบูรณ์กำลังดำเนินอยู่)","h":"The story is in the past, and the activity ran right up to the moment his fingers were covered in paint.","hT":"เรื่องนี้เล่าในอดีต และการทำงานดำเนินต่อเนื่องมาจนถึงจุดหนึ่งในอดีต คือตอนเที่ยง","e":"<i>since eight o’clock</i> measures an activity that was still going on at a past moment, so British English uses the past perfect continuous: <b>had been working</b>. <i>has been working</i> counts up to <b>now</b>, which clashes with <i>were covered</i>, and <i>was working</i> cannot take <i>since</i> at all, because only a perfect form can measure a stretch of time running up to a reference point.","eT":"<i>since eight o’clock</i> บอกช่วงเวลาของการกระทำที่ยังดำเนินอยู่ ณ จุดหนึ่งในอดีต จึงต้องใช้ <b>past perfect continuous</b> คือ <i>had been working</i> ส่วน <i>has been working</i> เป็น present perfect continuous ที่นับมาถึง <b>ปัจจุบัน</b> จึงขัดกับ <i>were covered</i> ที่เป็นอดีต และ <i>was working</i> (past continuous) ใช้กับ <i>since</i> ไม่ได้ เพราะมีแต่รูป perfect เท่านั้นที่บอกช่วงเวลาซึ่งลากมาถึงจุดอ้างอิงได้","a":3,"o":["would have been working","has been working","was working","had been working"],"s":"Tul’s fingers were covered in paint by lunchtime; he <span class='bl'>_____</span> on the stage backdrop since eight o’clock and still had a whole corner to finish."},{"n":2,"p":"A","tag":"Third conditional","tagT":"Third conditional (เงื่อนไขที่ไม่เป็นจริงในอดีต)","h":"Nothing here really happened, so the <i>if</i>-clause has to go one step further back than the ordinary past.","hT":"เหตุการณ์นี้ไม่ได้เกิดขึ้นจริงในอดีต ดังนั้นกริยาในอนุประโยค <i>if</i> ต้องถอยไปอีกหนึ่งขั้นจากอดีตธรรมดา","e":"The main clause <i>would never have cycled</i> fixes this as a third conditional, so the <i>if</i>-clause needs the past perfect: <b>had checked</b>. <i>If … would have checked</i> is heard in informal speech in some varieties but is not accepted in standard British English, and the plain past <i>checked</i> belongs to the second conditional, which talks about now rather than about a cycle ride that is already over.","eT":"ประโยคหลัง <i>would never have cycled</i> ชี้ชัดว่าเป็น third conditional ดังนั้นในอนุประโยค <i>if</i> ต้องใช้ past perfect คือ <b>had checked</b> รูป <i>If … would have checked</i> มีคนพูดอยู่บ้างในภาษาพูดบางถิ่น แต่ภาษาอังกฤษมาตรฐานแบบบริเตนไม่ยอมรับ ส่วน <i>checked</i> เฉย ๆ เป็นของ second conditional ซึ่งพูดถึงปัจจุบัน ไม่ใช่การปั่นจักรยานที่จบไปแล้ว","a":2,"o":["would have checked","has checked","had checked","checked"],"s":"If Weera <span class='bl'>_____</span> the forecast before setting off, he would never have cycled all the way to the market in those shoes."},{"n":3,"p":"A","tag":"Reported questions","tagT":"Reported questions (การเปลี่ยนคำถามเป็นคำพูดรายงาน)","h":"Inside a reported question the words sit in statement order, and the verb has already moved into the past.","hT":"ในคำถามที่ถูกนำมาเล่าต่อ (reported question) คำจะเรียงแบบประโยคบอกเล่า และกริยาถูกเปลี่ยนเป็นอดีตเรียบร้อยแล้ว","e":"A reported question drops the inversion of a direct question, so we need subject + verb: <b>how long the crossing took</b>. All three of the other options keep the auxiliary in front of the subject, which only happens in a real question; <i>how long had the crossing taken</i> would in any case push the crossing back before the moment of asking.","eT":"คำถามที่นำมาเล่าต่อจะไม่สลับกริยาช่วยมาไว้หน้าประธานเหมือนคำถามจริง จึงต้องเรียงเป็นประธาน + กริยา คือ <b>how long the crossing took</b> ตัวเลือกที่ผิดทั้งสามตัวยังวางกริยาช่วยไว้หน้าประธาน ซึ่งใช้ได้เฉพาะเวลาถามจริง ๆ และ <i>how long had the crossing taken</i> ยังทำให้เรือข้ามฟากเกิดขึ้นก่อนตอนที่ถามอีกด้วย","a":0,"o":["how long the crossing took","how long would the crossing take","how long did the crossing take","how long had the crossing taken"],"s":"Nobody on the pier knew the timetable, so I went over to the kiosk and asked the woman behind the counter <span class='bl'>_____</span>."},{"n":4,"p":"A","tag":"Non-defining relative clauses","tagT":"Non-defining relative clause (อนุประโยคขยายแบบให้ข้อมูลเสริม)","h":"The commas turn this into extra information, and the word in the gap must also be the subject of <i>has stood</i>.","hT":"เครื่องหมายจุลภาคสองตัวทำให้อนุประโยคนี้เป็นข้อมูลเสริม และคำในช่องว่างยังต้องทำหน้าที่เป็นประธานของ <i>has stood</i> ด้วย","e":"A non-defining clause after a comma takes <b>which</b> for a thing. You will sometimes hear <i>that</i> used this way in speech, but standard written British English keeps <i>that</i> for defining clauses with no commas. <i>where</i> cannot be the subject of <i>has stood</i>, and <i>what</i> never introduces a relative clause after a noun.","eT":"อนุประโยคขยายแบบให้ข้อมูลเสริมที่คั่นด้วยจุลภาค เมื่อขยายสิ่งของต้องใช้ <b>which</b> ในภาษาพูดบางครั้งจะได้ยินคนใช้ <i>that</i> แบบนี้อยู่บ้าง แต่ภาษาเขียนมาตรฐานแบบบริเตนเก็บ <i>that</i> ไว้ใช้กับอนุประโยคที่จำกัดความและไม่มีจุลภาค ส่วน <i>where</i> เป็นประธานของ <i>has stood</i> ไม่ได้ และ <i>what</i> ไม่ใช้ขึ้นต้นอนุประโยคขยายคำนาม","a":3,"o":["that","what","where","which"],"s":"My uncle’s noodle shop, <span class='bl'>_____</span> has stood on the same corner since my mother was at school, is to be knocked down in March."},{"n":5,"p":"A","tag":"Passive with modals","tagT":"Passive กับ modal verb (กรรมวาจกที่มีกริยาช่วย)","h":"The costumes do not act – somebody does something to them – and there is an obligation.","hT":"ชุดการแสดงไม่ได้เป็นผู้กระทำเอง แต่มีคนมาทำกับมัน และประโยคนี้สื่อความจำเป็นที่ต้องทำ","e":"A modal passive is <i>modal + be + past participle</i>, so the answer is <b>must be returned</b>. <i>must return</i> makes the costumes walk back on their own, <i>must have returned</i> is a guess about the past, and <i>must be returning</i> is an active progressive, which again gives the costumes something to do.","eT":"โครงสร้าง passive ที่มี modal คือ <i>modal + be + กริยาช่องสาม</i> ดังนั้นคำตอบคือ <b>must be returned</b> ถ้าใช้ <i>must return</i> จะกลายเป็นชุดเดินกลับไปเก็บเอง <i>must have returned</i> เป็นการคาดเดาเรื่องที่ผ่านไปแล้ว และ <i>must be returning</i> เป็น active แบบกำลังดำเนินอยู่ ซึ่งก็ทำให้ชุดเป็นผู้กระทำอีก","a":1,"o":["must return","must be returned","must be returning","must have returned"],"s":"Every costume <span class='bl'>_____</span> to the drama cupboard by Friday, or the dress rehearsal will have to be cancelled."},{"n":6,"p":"A","tag":"Causative have something done","tagT":"Causative: have something done (จ้าง/ให้คนอื่นทำให้)","h":"After <i>have</i> + object, the screen is on the receiving end of the action, not doing it.","hT":"หลัง <i>have</i> + กรรม ตัวหน้าจอเป็นสิ่งที่ถูกกระทำ ไม่ใช่ผู้กระทำ","e":"<i>have something done</i> uses the past participle, so Nont will <b>have it replaced</b> – somebody at the shop will do the work. <i>have it replace</i> would only be possible if the screen itself were doing the replacing, and neither <i>replacing</i> nor <i>to replace</i> fits the causative pattern after an object.","eT":"โครงสร้าง <i>have something done</i> ต้องใช้กริยาช่องสาม ดังนั้น Nont จะ <b>have it replaced</b> คือให้ร้านเปลี่ยนให้ ถ้าใช้ <i>have it replace</i> จะหมายความว่าหน้าจอเป็นคนไปเปลี่ยนเอง ส่วน <i>replacing</i> และ <i>to replace</i> ไม่เข้ากับโครงสร้าง causative ที่ตามหลังกรรม","a":0,"o":["replaced","replacing","replace","to replace"],"s":"The screen on Nont’s tablet is badly cracked, so at the weekend he is going to have it <span class='bl'>_____</span> at the little shop behind the market."},{"n":7,"p":"A","tag":"<i>used to</i> and <i>be used to</i>","tagT":"used to กับ be used to (เคยทำ กับ ชินกับ)","h":"This is a habit that belonged to the past and has stopped, and the verb after the gap has no ending on it.","hT":"ประโยคนี้พูดถึงกิจวัตรในอดีตที่เลิกทำไปแล้ว และกริยาที่ตามช่องว่างเป็นรูปไม่เติมอะไรเลย","e":"Both structures are good English, but they are built differently: <b>used to</b> + bare infinitive for a finished past habit, and <i>be used to</i> + <i>-ing</i> for being familiar with something. Since the gap is followed by the bare form <i>paddle</i>, only <b>used to</b> works; <i>were used to paddling</i> would have been correct, but <i>were used to paddle</i> is not.","eT":"ทั้งสองโครงสร้างเป็นภาษาอังกฤษที่ถูกต้อง แต่รูปต่างกัน <b>used to</b> ตามด้วยกริยารูปไม่ผัน ใช้กับกิจวัตรในอดีตที่จบแล้ว ส่วน <i>be used to</i> ตามด้วย <i>-ing</i> ใช้กับความคุ้นเคย เมื่อหลังช่องว่างเป็น <i>paddle</i> รูปเปล่า จึงเลือกได้แค่ <b>used to</b> ถ้าเป็น <i>were used to paddling</i> ก็จะถูก แต่ <i>were used to paddle</i> ใช้ไม่ได้","a":0,"o":["used to","are used to","were used to","would be used to"],"s":"When my grandparents lived by the river in Nan, they <span class='bl'>_____</span> paddle out to the sandbank every evening in the hot season."},{"n":8,"p":"A","tag":"<i>wish</i> + past","tagT":"wish + past simple (ความปรารถนาที่ขัดกับความจริง)","h":"After <i>wish</i>, English steps one tense back to show that the situation is not the real one.","hT":"หลัง <i>wish</i> ภาษาอังกฤษจะถอยกาลไปหนึ่งขั้น เพื่อแสดงว่าสิ่งที่พูดถึงไม่ใช่ความจริงในตอนนี้","e":"To wish about a present situation you cannot change, use <i>wish</i> + past simple: <b>had</b>. <i>has</i> states a fact rather than a wish, and <i>will have</i> cannot follow <i>wish</i> at all. <i>wish</i> + <i>would</i> does exist – <i>I wish he would stop humming</i> – but only for behaviour you want somebody to change or an event you are waiting for, never for a fixed state such as what a flat does or does not look out on, so <i>would have</i> is out.","eT":"เวลาปรารถนาถึงสถานการณ์ปัจจุบันที่เปลี่ยนไม่ได้ ให้ใช้ <i>wish</i> + past simple คือ <b>had</b> ส่วน <i>has</i> เป็นการบอกข้อเท็จจริงไม่ใช่ความปรารถนา และ <i>will have</i> ตามหลัง <i>wish</i> ไม่ได้เลย ส่วน <i>wish</i> + <i>would</i> มีใช้จริงในประโยคอื่น เช่น <i>I wish he would stop humming</i> แต่ใช้กับพฤติกรรมที่เราอยากให้อีกฝ่ายเปลี่ยน หรือเหตุการณ์ที่เรารอให้เกิด ไม่ใช้กับสภาพที่ตายตัวอย่างวิวที่ห้องของครอบครัวเธอมีหรือไม่มี จึงใช้ <i>would have</i> ไม่ได้","a":2,"o":["will have","has","had","would have"],"s":"Pim loves the coast and often says she wishes her family’s flat <span class='bl'>_____</span> a view of the bay."},{"n":9,"p":"A","tag":"Verb patterns that change meaning","tagT":"กริยาที่ความหมายเปลี่ยนตามรูปที่ตามมา (mean doing / mean to do)","h":"<i>mean</i> here is not about anybody’s intention – it is about what the job would have involved.","hT":"<i>mean</i> ในประโยคนี้ไม่ได้พูดถึงความตั้งใจของใคร แต่บอกว่างานนั้นต้องแลกมากับอะไร","e":"<i>mean</i> + <i>-ing</i> means to involve or to have as a consequence, and that is the sense here, so the answer is <b>digging</b>. The other pattern, <i>mean</i> + <i>to</i> + infinitive, means to intend, and it needs a person as its subject (<i>I meant to tell you</i>); the subject here is <i>sinking a deeper well</i>, so <i>to dig</i> is impossible. <i>to have dug</i> and <i>having dug</i> fit neither pattern.","eT":"<i>mean</i> + <i>-ing</i> แปลว่าเรื่องนั้นพ่วงมากับอะไร หรือทำให้ต้องทำอะไรตามมา ซึ่งเป็นความหมายในข้อนี้ คำตอบจึงเป็น <b>digging</b> ส่วนอีกโครงสร้างหนึ่งคือ <i>mean</i> + <i>to</i> + กริยา แปลว่าตั้งใจ และต้องมีคนเป็นประธาน เช่น <i>I meant to tell you</i> แต่ประธานในข้อนี้คือ <i>sinking a deeper well</i> จึงใช้ <i>to dig</i> ไม่ได้ และ <i>to have dug</i> กับ <i>having dug</i> ก็ไม่เข้ากับทั้งสองโครงสร้าง","a":1,"o":["to dig","digging","to have dug","having dug"],"s":"The village pump had dried up, but sinking a deeper well would have meant <span class='bl'>_____</span> through thirty metres of rock, so the farmers gave up the idea."},{"n":10,"p":"A","tag":"Subject–verb agreement","tagT":"ความสอดคล้องประธานกับกริยา (neither … nor)","h":"With <i>neither … nor</i>, look at the subject standing nearest the gap.","hT":"เมื่อประธานเชื่อมด้วย <i>neither … nor</i> ให้ดูประธานตัวที่อยู่ใกล้ช่องว่างที่สุด","e":"In <i>neither … nor</i> the verb agrees with the nearer subject, and here that is the plural <i>the players</i>, so we need <b>were</b>. <i>was</i>, <i>has been</i> and <i>is</i> are all singular, so none of them can follow <i>the players</i>; <i>has been</i> and <i>is</i> are in the wrong tense as well. To be fair, <i>was</i> would be right if the two subjects swapped places – <i>Neither the players nor the coach was expecting it</i>.","eT":"ในโครงสร้าง <i>neither … nor</i> กริยาจะสอดคล้องกับประธานตัวที่อยู่ใกล้กว่า ซึ่งในข้อนี้คือ <i>the players</i> ที่เป็นพหูพจน์ จึงใช้ <b>were</b> ส่วน <i>was</i> <i>has been</i> และ <i>is</i> เป็นรูปเอกพจน์ทั้งหมด จึงตามหลัง <i>the players</i> ไม่ได้ และ <i>has been</i> กับ <i>is</i> ยังผิดเรื่องกาลด้วย เพราะการแข่งถูกยกเลิกไปแล้ว พูดกันตรง ๆ ว่าถ้าสลับลำดับประธานเป็น <i>Neither the players nor the coach was expecting it</i> คำว่า <i>was</i> ก็จะถูก","a":1,"o":["was","were","has been","is"],"s":"Neither the coach nor the players <span class='bl'>_____</span> expecting the match to be called off so late in the afternoon."},{"n":11,"p":"B","tag":"Reported commands: say and tell","tagT":"คำสั่งที่นำมาเล่าต่อ: say กับ tell","h":"One of these two reporting verbs cannot have a person straight after it.","hT":"กริยารายงานคำพูดสองตัวนี้ มีตัวหนึ่งที่วางคนไว้หลังมันตรง ๆ ไม่ได้","e":"A reported command uses <i>tell somebody (not) to do something</i>. <i>say</i> cannot take a person as its object: you can <i>say something to us</i>, but not <i>say us</i>. So the chunk must become <b>told us not to take</b>. The other three are sound: <i>inside</i> is the right preposition for being within the shrine, <i>half the group</i> is a normal subject and British English is happy with <i>their phones</i> after it, and <i>already</i> is correctly placed between <i>had</i> and the participle.","eT":"คำสั่งที่นำมาเล่าต่อใช้โครงสร้าง <i>tell somebody (not) to do something</i> ส่วน <i>say</i> ไม่รับคนเป็นกรรมตรง เราพูดได้ว่า <i>say something to us</i> แต่พูดว่า <i>say us</i> ไม่ได้ จึงต้องแก้เป็น <b>told us not to take</b> อีกสามส่วนถูกหมด คือ <i>inside</i> เป็นบุพบทที่ถูกต้องเมื่อหมายถึงอยู่ในศาลเจ้า <i>half the group</i> ใช้เป็นประธานได้ปกติ และภาษาอังกฤษแบบบริเตนใช้ <i>their phones</i> ตามหลังได้ ส่วนการวาง <i>already</i> ไว้ระหว่าง <i>had</i> กับกริยาช่องสามก็ถูกต้อง","a":0,"o":["said us not to take","inside","half the group","already reached"],"s":"Our guide <u class='u'>said us not to take</u><sup>A</sup> photographs <u class='u'>inside</u><sup>B</sup> the shrine, but <u class='u'>half the group</u><sup>C</sup> had <u class='u'>already reached</u><sup>D</sup> for their phones.","fix":"told us not to take"},{"n":12,"p":"B","tag":"Concession: despite and although","tagT":"การขัดแย้ง: despite กับ although","h":"This word has to be followed by a noun or an <i>-ing</i> form, never by a clause with its own verb.","hT":"คำนี้ต้องตามด้วยคำนามหรือรูป <i>-ing</i> เท่านั้น ตามด้วยอนุประโยคที่มีกริยาของตัวเองไม่ได้","e":"<i>Despite</i> is a preposition, so it needs a noun phrase (<i>despite the broken lifts</i>) or an <i>-ing</i> form. Here it is followed by the full clause <i>the lifts were out of order</i>, which needs the conjunction <b>Although</b>. The rest is correct: <i>surprisingly well</i>, the singular <i>every one … reached</i>, and <i>before lunch</i>.","eT":"<i>Despite</i> เป็นคำบุพบท จึงต้องตามด้วยวลีคำนาม เช่น <i>despite the broken lifts</i> หรือรูป <i>-ing</i> แต่ในประโยคนี้ตามด้วยอนุประโยคเต็ม <i>the lifts were out of order</i> ซึ่งต้องใช้คำสันธาน <b>Although</b> ส่วนที่เหลือถูกต้อง คือ <i>surprisingly well</i> การใช้ <i>every one … reached</i> แบบเอกพจน์ และ <i>before lunch</i>","a":1,"o":["surprisingly well","Despite","reached","before"],"s":"The whole delivery went <u class='u'>surprisingly well</u><sup>A</sup>. <u class='u'>Despite</u><sup>B</sup> the lifts were out of order, every one of the forty boxes <u class='u'>reached</u><sup>C</sup> the fourth floor <u class='u'>before</u><sup>D</sup> lunch.","fix":"Although"},{"n":13,"p":"B","tag":"Comparison with <i>as … as</i>","tagT":"การเปรียบเทียบด้วย as … as","h":"The first half of this comparison frame is already in the sentence; the gap needs its matching partner, not the word that goes with a comparative.","hT":"ครึ่งแรกของโครงสร้างเปรียบเทียบอยู่ในประโยคเรียบร้อยแล้ว ช่องว่างต้องเติมคำคู่ของมัน ไม่ใช่คำที่ใช้กับรูปขั้นกว่า","e":"<i>twice as many … as</i> is a fixed comparison frame: the second half must be <b>as</b>, because there is no comparative form such as <i>more</i> or <i>bigger</i> in the sentence to justify <i>than</i>. The other three chunks are correct: the non-defining <i>which opened in April</i>, the quantifier <i>twice as many</i> with a plural noun, and the result linker <i>so</i>.","eT":"<i>twice as many … as</i> เป็นโครงสร้างเปรียบเทียบแบบตายตัว ครึ่งหลังต้องเป็น <b>as</b> เพราะในประโยคไม่มีรูปขั้นกว่าอย่าง <i>more</i> หรือ <i>bigger</i> ที่จะทำให้ใช้ <i>than</i> ได้ อีกสามส่วนถูกต้อง คืออนุประโยคขยายข้อมูลเสริม <i>which opened in April</i> คำบอกปริมาณ <i>twice as many</i> ที่ตามด้วยคำนามพหูพจน์ และคำเชื่อมบอกผล <i>so</i>","a":2,"o":["which opened","twice as many","than","so"],"s":"The new assembly hall, <u class='u'>which opened</u><sup>A</sup> in April, holds <u class='u'>twice as many</u><sup>B</sup> pupils <u class='u'>than</u><sup>C</sup> the old one, <u class='u'>so</u><sup>D</sup> nobody has to stand at the back any more.","fix":"as"},{"n":14,"p":"B","tag":"Subject–verb agreement across a phrase","tagT":"ความสอดคล้องประธานกับกริยาเมื่อมีวลีมาคั่น","h":"Check each verb against the noun that is really its subject – one of them has been matched to the wrong one.","hT":"ลองจับกริยาแต่ละตัวมาเทียบกับคำนามที่เป็นประธานจริงของมัน จะมีตัวหนึ่งที่จับคู่ผิดอยู่","e":"The subject of the last verb is the plural <i>the bottles</i>; <i>in my bag</i> is only a prepositional phrase in between, so the verb must be <b>feel</b>. The first chunk is a nice contrast – <i>a litre of water</i> really is singular, which is why <i>weighs</i> is right – and <i>almost exactly</i> and the non-defining <i>which is why</i> are both correct.","eT":"ประธานของกริยาตัวสุดท้ายคือ <i>the bottles</i> ซึ่งเป็นพหูพจน์ ส่วน <i>in my bag</i> เป็นแค่วลีบุพบทที่มาคั่น กริยาจึงต้องเป็น <b>feel</b> ส่วนแรกเป็นตัวเทียบที่ดี เพราะ <i>a litre of water</i> เป็นเอกพจน์จริง ๆ จึงใช้ <i>weighs</i> ได้ถูกต้อง และ <i>almost exactly</i> กับ <i>which is why</i> ที่เป็นอนุประโยคขยายข้อมูลเสริมก็ถูกทั้งคู่","a":3,"o":["a litre of water","almost exactly","which is why","feels"],"s":"Our science teacher explained that <u class='u'>a litre of water</u><sup>A</sup> weighs <u class='u'>almost exactly</u><sup>B</sup> a kilogram, <u class='u'>which is why</u><sup>C</sup> the bottles in my bag <u class='u'>feels</u><sup>D</sup> so heavy by Friday.","fix":"feel"},{"n":15,"p":"C","tag":"Collocation with <i>action</i>","tagT":"คำที่ใช้คู่กับ action (collocation)","h":"This is a fixed pair; the verb is the same one English uses with <i>steps</i> and <i>measures</i>.","hT":"ข้อนี้เป็นคำที่ใช้คู่กันแบบตายตัว กริยาตัวเดียวกับที่ใช้กับ <i>steps</i> และ <i>measures</i>","e":"English says <b>take action</b>, just as it says <i>take steps</i> and <i>take measures</i>. <i>make</i> goes with <i>a decision</i> or <i>an effort</i>, <i>do</i> with <i>the washing-up</i> or <i>your best</i>, and <i>give</i> with <i>a talk</i> or <i>an answer</i> – none of them pairs with <i>action</i>.","eT":"ภาษาอังกฤษใช้ว่า <b>take action</b> เช่นเดียวกับ <i>take steps</i> และ <i>take measures</i> ส่วน <i>make</i> ไปกับ <i>a decision</i> หรือ <i>an effort</i> คำว่า <i>do</i> ไปกับ <i>the washing-up</i> หรือ <i>your best</i> และ <i>give</i> ไปกับ <i>a talk</i> หรือ <i>an answer</i> ไม่มีตัวไหนใช้คู่กับ <i>action</i> ได้","a":0,"o":["taken","made","given","done"],"s":"After three letters from parents, the council has finally <span class='bl'>_____</span> action over the broken lights on the footbridge."},{"n":16,"p":"C","tag":"Precise adjectives","tagT":"การเลือกคำคุณศัพท์ให้ตรงความหมาย","h":"The clue is <i>crumble at a touch</i>: the word must mean easily broken.","hT":"คำใบ้อยู่ที่ <i>crumble at a touch</i> คำที่เติมต้องหมายถึงแตกหักเสียหายได้ง่าย","e":"<b>fragile</b> means easily broken or damaged, which is exactly why the jar is behind glass. <i>flexible</i> means it bends without breaking, <i>hollow</i> only says it is empty inside – true of any jar – and <i>transparent</i> describes glass, not the clay.","eT":"<b>fragile</b> หมายถึงแตกหักหรือเสียหายได้ง่าย ซึ่งเป็นเหตุผลที่ไหใบนี้ต้องอยู่ในตู้กระจก ส่วน <i>flexible</i> หมายถึงงอได้โดยไม่หัก <i>hollow</i> บอกแค่ว่ากลวง ซึ่งไหทุกใบก็กลวง และ <i>transparent</i> ใช้กับกระจก ไม่ใช่กับเนื้อดินเผา","a":1,"o":["flexible","fragile","transparent","hollow"],"s":"The museum keeps its oldest water jar in a glass case because the clay is now so <span class='bl'>_____</span> that it would crumble at a touch."},{"n":17,"p":"C","tag":"Phrasal verbs","tagT":"กริยาวลี (phrasal verbs)","h":"Our strikers were left behind, so the phrasal verb must mean to stay level with something moving fast.","hT":"กองหน้าของเราตามไม่ทัน กริยาวลีที่ต้องการจึงหมายถึงการตามให้ทันกับสิ่งที่เคลื่อนที่เร็ว","e":"<b>keep up with</b> something means to move or work at the same speed as it, which is what the strikers failed to do. <i>catch up on</i> means to make up lost time (<i>catch up on sleep</i>), <i>put up with</i> means to tolerate, and <i>get on with</i> means either to continue or to have a good relationship.","eT":"<b>keep up with</b> หมายถึงเคลื่อนไหวหรือทำงานได้ทันในความเร็วเดียวกัน ซึ่งเป็นสิ่งที่กองหน้าของเราทำไม่ได้ ส่วน <i>catch up on</i> คือการตามเก็บงานหรือเวลาที่เสียไป เช่น <i>catch up on sleep</i> คำว่า <i>put up with</i> คือการอดกลั้นหรือทนกับสิ่งที่ไม่ชอบ และ <i>get on with</i> คือการทำต่อไป หรือการเข้ากันได้ดีกับใคร","a":3,"o":["get on with","catch up on","put up with","keep up with"],"s":"Nobody expected the final to be so one-sided; our strikers simply could not <span class='bl'>_____</span> the pace of the Bangkok side."},{"n":18,"p":"C","tag":"Word formation","tagT":"การสร้างคำ (word formation)","h":"After a preposition and an adjective like <i>considerable</i>, the gap needs a noun.","hT":"หลังคำบุพบทและคำคุณศัพท์อย่าง <i>considerable</i> ช่องว่างต้องเป็นคำนาม","e":"<i>with considerable</i> ____ must end in a noun, and the noun in this family is <b>caution</b>. <i>cautious</i> is the adjective (<i>a cautious officer</i>), <i>cautiously</i> the adverb (<i>he wrote cautiously</i>), and <i>cautioned</i> a verb form.","eT":"วลี <i>with considerable</i> ____ ต้องปิดท้ายด้วยคำนาม และคำนามในตระกูลนี้คือ <b>caution</b> ส่วน <i>cautious</i> เป็นคำคุณศัพท์ เช่น <i>a cautious officer</i> คำว่า <i>cautiously</i> เป็นคำกริยาวิเศษณ์ เช่น <i>he wrote cautiously</i> และ <i>cautioned</i> เป็นรูปกริยา","a":2,"o":["cautious","cautiously","caution","cautioned"],"s":"Because the two witnesses gave completely different accounts, the officer recorded both statements with considerable <span class='bl'>_____</span>."},{"n":19,"p":"D","tag":"Responding to an apology","tagT":"การตอบรับคำขอโทษ","h":"B forgives the accident and plays it down.","hT":"ผู้พูด B ให้อภัยอุบัติเหตุครั้งนี้ และพูดทำให้เรื่องดูเล็กลง","e":"A friendly reply to an accident reassures the other person, and <b>Honestly, it doesn’t matter…</b> does exactly that. <i>I accept your apology</i> is cold and far too formal for a small accident like this, <i>That’s very kind of you</i> thanks somebody for a favour, and <i>I’m afraid so</i> confirms bad news rather than answering an apology.","eT":"การตอบคำขอโทษเรื่องอุบัติเหตุแบบเป็นมิตร คือการทำให้อีกฝ่ายสบายใจ ซึ่ง <b>Honestly, it doesn’t matter…</b> ทำหน้าที่นั้นพอดี ส่วน <i>I accept your apology</i> ฟังเย็นชาและเป็นทางการเกินไปสำหรับอุบัติเหตุเล็ก ๆ แบบนี้ <i>That’s very kind of you</i> ใช้ขอบคุณเวลามีคนช่วยอะไรให้ และ <i>I’m afraid so</i> ใช้ยืนยันข่าวร้าย ไม่ใช่ตอบคำขอโทษ","a":2,"o":["That’s very kind of you.","I’m afraid so.","Honestly, it doesn’t matter – they were only rough notes.","I accept your apology."],"s":"<b>A:</b> I’m terribly sorry – I’ve knocked your flask over and there’s tea all over your notes.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":20,"p":"D","tag":"Responding to a suggestion","tagT":"การตอบรับคำชักชวน","h":"A is making a suggestion, so B should agree and add a reason.","hT":"ผู้พูด A กำลังชักชวน ดังนั้น B ควรตอบตกลงแล้วเสริมเหตุผลสั้น ๆ","e":"<i>Shall we…?</i> is a suggestion, and the natural acceptance is <b>Good idea – it’s only five minutes from here.</b> <i>Yes, we shall</i> answers it as though it were a question about the future, which no English speaker says here; <i>Thanks, I already have</i> ignores the invitation; and <i>I’d love to have looked</i> refers to a chance already missed.","eT":"<i>Shall we…?</i> เป็นการชักชวน การตอบรับที่เป็นธรรมชาติคือ <b>Good idea – it’s only five minutes from here.</b> ส่วน <i>Yes, we shall</i> เป็นการตอบเหมือนถูกถามเรื่องอนาคต ซึ่งเจ้าของภาษาไม่พูดในสถานการณ์นี้ <i>Thanks, I already have</i> ไม่ได้ตอบคำชวนเลย และ <i>I’d love to have looked</i> พูดถึงโอกาสที่พลาดไปแล้ว","a":3,"o":["Yes, we shall.","I’d love to have looked.","Thanks, I already have.","Good idea – it’s only five minutes from here."],"s":"<b>A:</b> We’ve got two hours before the coach leaves. Shall we have a look at the market?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":21,"p":"D","tag":"Sympathy and encouragement","tagT":"การแสดงความเห็นใจและให้กำลังใจ","h":"This is bad news, so the reply needs sympathy plus a little encouragement.","hT":"นี่เป็นข่าวไม่ดี คำตอบจึงต้องแสดงความเห็นใจและให้กำลังใจอีกฝ่ายเล็กน้อย","e":"<b>Oh, that’s such a shame…</b> sympathises and then says something kind, which is what English speakers do with disappointing news. <i>Congratulations!</i> celebrates the opposite, <i>you can’t say you weren’t warned</i> is unkind, and <i>Yes, they only had room for one</i> merely repeats A’s words without responding to the feeling behind them.","eT":"<b>Oh, that’s such a shame…</b> แสดงความเห็นใจก่อน แล้วพูดอะไรดี ๆ ต่อ ซึ่งเป็นสิ่งที่เจ้าของภาษาทำเมื่อได้ยินข่าวที่น่าเสียดาย ส่วน <i>Congratulations!</i> เป็นการแสดงความยินดีซึ่งตรงข้ามกับสถานการณ์ <i>you can’t say you weren’t warned</i> ฟังเหมือนซ้ำเติม และ <i>Yes, they only had room for one</i> เป็นการพูดทวนคำของ A เฉย ๆ โดยไม่ตอบรับความรู้สึกของเขา","a":0,"o":["Oh, that’s such a shame. You played really well at the audition.","Well, you can’t say you weren’t warned.","Yes, they only had room for one.","Congratulations! You must be thrilled."],"s":"<b>A:</b> I didn’t get into the band in the end – they only had room for one more flute.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":22,"p":"D","tag":"Answering an alternative question","tagT":"การตอบคำถามแบบให้เลือก","h":"A has asked an either-or question, so a bare <i>yes</i> or <i>no</i> cannot possibly answer it.","hT":"A ถามแบบให้เลือกอย่างใดอย่างหนึ่ง การตอบว่าใช่หรือไม่ใช่เฉย ๆ จึงตอบคำถามไม่ได้","e":"An alternative question (<i>X or Y?</i>) must be answered by naming one of the options, so <b>The Saturday…</b> is the only possible reply. <i>Yes, that’s right</i>, <i>No, I don’t think so</i> and <i>Yes, please do</i> are all natural English in other situations, but none of them tells A which day the trip is on.","eT":"คำถามแบบให้เลือก (<i>X or Y?</i>) ต้องตอบด้วยการระบุตัวเลือกอย่างใดอย่างหนึ่ง จึงตอบได้แบบเดียวคือ <b>The Saturday…</b> ส่วน <i>Yes, that’s right</i> กับ <i>No, I don’t think so</i> และ <i>Yes, please do</i> ล้วนเป็นภาษาอังกฤษที่ใช้ได้ในสถานการณ์อื่น แต่ไม่มีอันไหนบอก A ได้ว่าทริปตรงกับวันไหน","a":1,"o":["Yes, that’s right.","The Saturday – I’ll put it on the board in a minute.","Yes, please do.","No, I don’t think so."],"s":"<b>A:</b> Sorry, I didn’t quite catch that. Is the trip on the Friday or the Saturday?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":23,"p":"E","tag":"Present perfect","tagT":"Present perfect (ปัจจุบันสมบูรณ์)","h":"<i>For the past eleven years</i> reaches right up to the moment of writing.","hT":"วลี <i>for the past eleven years</i> ลากช่วงเวลาจากอดีตมาถึงตอนที่เล่าเรื่องนี้พอดี","e":"A period that starts in the past and includes now takes the present perfect, so <b>has followed</b> is right. The past simple <i>followed</i> would shut the service off in the past, <i>is following</i> cannot be used with a <i>for</i> phrase stretching over eleven years, and <i>had followed</i> needs a later past event to look back from, which the passage does not give.","eT":"ช่วงเวลาที่เริ่มในอดีตและรวมถึงปัจจุบันต้องใช้ present perfect จึงตอบ <b>has followed</b> ถ้าใช้ past simple <i>followed</i> จะกลายเป็นว่าบริการนี้จบไปแล้วในอดีต ส่วน <i>is following</i> ใช้กับวลี <i>for</i> ที่ยาวถึงสิบเอ็ดปีไม่ได้ และ <i>had followed</i> ต้องมีเหตุการณ์อดีตอีกจุดให้ย้อนกลับไปมอง ซึ่งเนื้อเรื่องไม่ได้ให้ไว้","a":2,"o":["is following","followed","has followed","had followed"],"s":"","t":0},{"n":24,"p":"E","tag":"Preposition in a fixed phrase","tagT":"คำบุพบทในวลีสำเร็จรูป","h":"A set phrase meaning “without a machine”.","hT":"เป็นวลีสำเร็จรูปที่แปลว่า “ทำเอง ไม่ได้ใช้เครื่อง”","e":"The fixed phrase is <b>by hand</b>, meaning done by a person rather than a machine – it contrasts with <i>Nothing is computerised</i>. <i>with hand</i> would need a determiner (<i>with her hand</i>), and neither <i>on hand</i> (available) nor <i>in hand</i> (under control) means anything like “not by machine”.","eT":"วลีสำเร็จรูปคือ <b>by hand</b> หมายถึงทำด้วยคนไม่ใช่เครื่องจักร ซึ่งรับกับประโยค <i>Nothing is computerised</i> ก่อนหน้า ถ้าจะใช้ <i>with</i> ต้องมีคำนำหน้านาม เช่น <i>with her hand</i> ส่วน <i>on hand</i> แปลว่ามีพร้อมอยู่ และ <i>in hand</i> แปลว่าควบคุมได้อยู่ ไม่มีความหมายว่าไม่ได้ใช้เครื่อง","a":3,"o":["in","with","on","by"],"s":"","t":0},{"n":25,"p":"E","tag":"Linking words: concession","tagT":"คำเชื่อม: การขัดแย้ง","h":"The two ideas pull against each other – a hard journey, yet an almost perfect record.","hT":"สองความคิดนี้ขัดกัน คือการเดินทางลำบาก แต่สถิติการไปถึงแทบไม่พลาดเลย","e":"The gap joins difficulties to an unexpectedly good record, so it needs a concessive linker: <b>Even so</b>. <i>For instance</i> would introduce an example of the difficulties, <i>In addition</i> would add another one, and <i>As a result</i> would make the good record a consequence of the rotten jetties, which makes no sense.","eT":"ช่องว่างนี้เชื่อมความยากลำบากเข้ากับสถิติที่ดีเกินคาด จึงต้องใช้คำเชื่อมแสดงการขัดแย้งคือ <b>Even so</b> ถ้าใช้ <i>For instance</i> ต้องตามด้วยตัวอย่างของความลำบาก <i>In addition</i> ต้องเพิ่มความลำบากอีกข้อ และ <i>As a result</i> จะกลายเป็นว่าท่าเรือผุทำให้บริการไม่เคยพลาด ซึ่งไม่สมเหตุสมผล","a":1,"o":["As a result","Even so","In addition","For instance"],"s":"","t":0},{"n":26,"p":"E","tag":"Verb + preposition","tagT":"กริยาที่ใช้คู่กับบุพบท","h":"She is giving the reason for it, and the verb in the gap is followed by <i>to</i>.","hT":"เธอกำลังบอกสาเหตุของเรื่องนี้ และกริยาในช่องว่างตามด้วย <i>to</i>","e":"<b>attribute something to something</b> means to give it as the cause, which is exactly what the librarian is doing. <i>explain</i> takes <i>to somebody</i>, not <i>to a fact</i>; you <i>blame</i> something <i>on</i> a cause; and <i>remind</i> needs a person as its object.","eT":"<b>attribute something to something</b> หมายถึงบอกว่าสิ่งนั้นเป็นสาเหตุ ซึ่งตรงกับที่บรรณารักษ์กำลังทำ ส่วน <i>explain</i> ตามด้วย <i>to somebody</i> ไม่ใช่ <i>to a fact</i> คำว่า <i>blame</i> ต้องใช้กับ <i>on</i> เมื่อพูดถึงสาเหตุ และ <i>remind</i> ต้องมีคนเป็นกรรม","a":0,"o":["attributes","reminds","blames","explains"],"s":"","t":0},{"n":27,"p":"F","tag":"Reading for detail","tagT":"อ่านจับรายละเอียด","h":"Paragraph 1 mentions the canal behind a grandfather’s house – at what age did the cousins first go in?","hT":"ย่อหน้าแรกพูดถึงคลองหลังบ้านคุณตา ลองดูว่าพวกเขาถูกโยนลงน้ำตอนอายุเท่าไร","e":"Paragraph 1 says the cousins <i>had all been thrown into the canal … before they could walk</i> and that <i>every one of them could swim by the age of three</i>. Nobody taught the writer – he signed himself up for lessons at fifteen – nothing suggests the cousins were frightened, since he was the one who was afraid, and the district pool belongs to the later part of the story.","eT":"ย่อหน้าแรกบอกว่าลูกพี่ลูกน้องทุกคน <i>had all been thrown into the canal … before they could walk</i> และ <i>every one of them could swim by the age of three</i> คือว่ายน้ำได้ตั้งแต่ยังเล็กมาก ไม่มีใครมาสอนผู้เขียน เพราะเขาไปสมัครเรียนเองตอนอายุสิบห้า และไม่มีข้อความใดบอกว่าลูกพี่ลูกน้องกลัวน้ำ คนที่กลัวคือผู้เขียนเอง ส่วนสระว่ายน้ำของเขตเป็นเรื่องในช่วงหลังของเรื่อง","a":3,"o":["They were afraid of deep water too.","They taught him to swim in the canal.","They swim in the pool in his district.","They all learnt to swim as very young children."],"s":"What does the writer tell us about his cousins?","t":1},{"n":28,"p":"F","tag":"Vocabulary in context","tagT":"ความหมายของคำจากบริบท","h":"He could not really have known it, and yet he had no doubt about it at all.","hT":"เขาไม่มีทางรู้เรื่องนั้นได้จริง แต่ก็ไม่สงสัยเลยแม้แต่น้อย","e":"<i>I was convinced everybody could hear my heart</i> means he felt completely sure of it, so <b>certain</b> is the closest word. He is clearly not <i>pleased</i>, and although he may well have been embarrassed, <i>ashamed</i> describes a feeling rather than the state of being sure; <i>warned</i> would need somebody else to tell him.","eT":"ประโยค <i>I was convinced everybody could hear my heart</i> หมายถึงเขารู้สึกมั่นใจเต็มร้อยว่าเป็นอย่างนั้น ดังนั้นคำที่ใกล้ที่สุดคือ <b>certain</b> เขาไม่ได้รู้สึก <i>pleased</i> อย่างแน่นอน และแม้เขาอาจเขินอยู่บ้าง แต่ <i>ashamed</i> เป็นการบอกอารมณ์ ไม่ใช่การบอกว่ามั่นใจ ส่วน <i>warned</i> ต้องมีคนอื่นมาเตือนเขาก่อน","a":2,"o":["ashamed","pleased","certain","warned"],"s":"The word <i>convinced</i> in paragraph 3 is closest in meaning to","t":1},{"n":29,"p":"F","tag":"Inference","tagT":"การตีความสิ่งที่ผู้เขียนบอกเป็นนัย","h":"She gave no reason; look instead at who else was in the water at half past six.","hT":"เธอไม่ได้บอกเหตุผล ให้ดูแทนว่าตอนหกโมงครึ่งมีใครอยู่ในน้ำอีกบ้าง","e":"She looks at the form, then at him, and books him in half an hour after the pool opens, when the only other people in the water are two swimmers of about seventy who never once look up. Put that beside his fear, the pounding heart of the first lesson, and the last paragraph, where he chooses the very same slot for a nervous nine-year-old: what she was giving him was privacy. The text never mentions the temperature of the water, her other working hours, or the older swimmers needing anything.","eT":"เธอมองใบสมัคร แล้วมองหน้าเขา แล้วจัดให้เขาลงเวลาครึ่งชั่วโมงหลังสระเปิด ซึ่งมีคนอยู่ในน้ำแค่สองคน อายุราวเจ็ดสิบ และไม่เคยเงยหน้ามองเลยแม้แต่ครั้งเดียว เมื่อนำไปวางคู่กับความกลัว หัวใจที่เต้นแรงในบทเรียนแรก และย่อหน้าสุดท้ายที่เขาเลือกเวลาเดียวกันนี้ให้น้องวัยเก้าขวบที่กำลังกลัว จะเห็นว่าสิ่งที่เธอให้เขาคือความเป็นส่วนตัว เนื้อเรื่องไม่ได้พูดถึงอุณหภูมิของน้ำ เวลาทำงานอื่นของเธอ หรือการที่ผู้สูงอายุต้องการให้ช่วยอะไร","a":1,"o":["because the older swimmers needed his help","so hardly anybody would be watching him","because she only worked on Tuesday mornings","because the water is warmest early in the day"],"s":"Why did Khru Arisa most probably choose half past six on a Tuesday?","t":1},{"n":30,"p":"F","tag":"Purpose and attitude","tagT":"จุดประสงค์และทัศนคติของผู้เขียน","h":"He repeats one small detail from paragraph 2 on purpose – ask yourself why.","hT":"เขาเล่าซ้ำรายละเอียดเล็ก ๆ จากย่อหน้าที่สองอย่างตั้งใจ ลองถามตัวเองว่าทำซ้ำเพื่ออะไร","e":"The last paragraph repeats the exact slot Khru Arisa once chose for him, and the first sentence rules out any boast about his swimming: <i>I am not a good swimmer now</i>. He is passing on the kindness he was shown. Cost is never mentioned, and a writer who regretted the late start would not end on something he is doing happily.","eT":"ย่อหน้าสุดท้ายเล่าซ้ำช่วงเวลาเดียวกับที่ครูอาริสาเคยเลือกให้เขา และประโยคแรกก็ตัดเรื่องการอวดฝีมือออกไปแล้ว คือ <i>I am not a good swimmer now</i> สิ่งที่เขาทำคือการส่งต่อความเมตตาที่เคยได้รับ เรื่องค่าใช้จ่ายไม่มีกล่าวถึงเลย และถ้าเขาเสียดายที่เริ่มช้า เขาก็จะไม่ปิดเรื่องด้วยสิ่งที่กำลังทำอย่างมีความสุข","a":0,"o":["He wants to give his brother the same gentle start.","He thinks early morning lessons cost less.","He has finally become a strong swimmer.","He regrets having started so late."],"s":"What is the point of the last paragraph?","t":1}]},{"n":5,"name":"Champion Round","nameT":"รอบชิงแชมป์","cefr":"B1–B2","mins":35,"total":30,"parts":[{"id":"A","t":"Grammar and Structure","tT":"ไวยากรณ์และโครงสร้างประโยค","i":"Choose the word or phrase that best completes each sentence.","iT":"เลือกคำหรือวลีที่เติมในช่องว่างได้ถูกต้องที่สุด","r":"1 – 10","c":10},{"id":"B","t":"Error Identification","tT":"หาจุดที่ผิด","i":"One of the four underlined parts is wrong. Choose the part that must be changed.","iT":"ในแต่ละประโยคมีส่วนที่ขีดเส้นใต้ 4 ส่วน และมี 1 ส่วนที่ผิด เลือกส่วนที่ต้องแก้","r":"11 – 14","c":4},{"id":"C","t":"Vocabulary and Collocation","tT":"คำศัพท์และคำที่ใช้คู่กัน","i":"Choose the word that fits the sentence best.","iT":"เลือกคำที่เข้ากับประโยคได้ดีที่สุด","r":"15 – 18","c":4},{"id":"D","t":"Everyday Conversation","tT":"บทสนทนาในชีวิตประจำวัน","i":"Choose the most natural reply.","iT":"เลือกคำตอบที่เป็นธรรมชาติที่สุดในสถานการณ์นั้น","r":"19 – 22","c":4},{"id":"E","t":"Cloze Passage","tT":"เติมคำในเนื้อเรื่อง","i":"Read the whole text first, then choose the best word for each numbered gap.","iT":"อ่านเนื้อเรื่องให้จบก่อน แล้วจึงเลือกคำที่เหมาะกับช่องว่างแต่ละช่อง","r":"23 – 26","c":4},{"id":"F","t":"Reading Comprehension","tT":"อ่านจับใจความ","i":"Read the text and answer the questions that follow.","iT":"อ่านเนื้อเรื่องแล้วตอบคำถาม","r":"27 – 30","c":4}],"texts":[{"t":"The Lost Property Room","tT":"ห้องเก็บของหายที่สถานีรถไฟ","p":["Behind the ticket hall at Ban Khung Noi station there is a narrow room with shelves from floor to ceiling, and on them sits ev
