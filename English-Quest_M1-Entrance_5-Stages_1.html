<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Garden Quest — M.1 Entrance Practice</title>
<style>
:root{
  --sky:#B6DEF4; --sky2:#DCF0FB; --grass:#9ECB63; --grass2:#7FB246; --grass3:#6AA038;
  --soil:#9C6E49; --soil2:#84593A;
  --paper:#F8F0DB; --paper2:#FDF8EC; --paper3:#EDE1C3;
  --ink:#3C2C20; --ink2:#6F5842; --ink3:#9A826A;
  --sun:#F6C445; --coral:#F0866D; --pink:#EDA3C0; --teal:#5BBFA6; --violet:#9B8BD8;
  --good:#4FA86A; --goodbg:#DFF0DC; --bad:#D4624F; --badbg:#FAE3DC;
  --acc:var(--sun);
  --disp:"Avenir Next Rounded","Nunito","Quicksand","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans Thai",Arial,sans-serif;
  --w1:16px 20px 14px 22px / 20px 14px 22px 16px;
  --w2:12px 16px 10px 18px / 16px 10px 18px 12px;
  --w3:999px;
  --sh:3px 4px 0 0 var(--ink);
  --sh2:2px 3px 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);font-size:17px;line-height:1.55;color:var(--ink);
  background:var(--sky);position:relative;
  -webkit-text-size-adjust:100%;min-height:100%;
}
/* ---- the garden scene ---- */
.scene{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 46%,#EAF5DE 86%,#DCEFC9 100%)}
.clouds{position:absolute;inset:0 0 auto 0;height:340px;z-index:-1;pointer-events:none;opacity:.95;
  background-repeat:no-repeat;
  background-image:
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='62'><path d='M18 48c-9 0-16-7-16-15s7-15 16-15c2-10 11-16 21-16 9 0 17 5 20 13 3-2 7-3 11-3 11 0 20 8 21 19 8 1 15 8 15 17H18z' fill='%23FFFFFF' stroke='%233C2C20' stroke-width='2.4' stroke-linejoin='round'/></svg>"),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='50'><path d='M14 38C7 38 2 33 2 27s5-11 12-11c2-7 9-12 16-12 7 0 13 4 16 10 2-1 5-2 8-2 8 0 15 6 16 14 6 1 11 6 11 12H14z' fill='%23FFFFFF' stroke='%233C2C20' stroke-width='2.4' stroke-linejoin='round'/></svg>");
  background-position: 22px 104px, right 26px top 176px;
}
.hills{height:96px;margin-top:30px;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='96' preserveAspectRatio='none'><path d='M0 34c90-20 150 14 250 9s150-27 250-20 160 27 260 22 180-25 290-14 150 9 150 9V96H0z' fill='%239ECB63' stroke='%233C2C20' stroke-width='2.6'/></svg>") bottom center / 1200px 96px repeat-x}
.hills .tufts{display:flex;justify-content:center;gap:26px;padding-top:44px;font-size:19px;opacity:.9}
.wrap{max-width:840px;margin:0 auto;padding:0 16px;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
sup{font-size:.62em;font-weight:900;color:var(--coral);margin-left:1px}
u.u{text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--ink3)}
.hidden{display:none !important}

/* ---- HUD: a wooden sign hung on a string ---- */
.hud{position:sticky;top:0;z-index:40;padding:8px 0 0;
  background:linear-gradient(180deg,var(--sky) 58%,rgba(182,222,244,0) 100%)}
.hud .in{display:flex;align-items:center;gap:8px;min-height:50px;padding:7px 12px;max-width:840px;margin:0 auto;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w2);box-shadow:var(--sh)}
.logo{font-family:var(--disp);font-weight:900;letter-spacing:.01em;font-size:16.5px;white-space:nowrap;
  display:flex;align-items:center;gap:6px;min-width:0}
.logo i{font-style:normal;color:var(--grass3)}
.sp{flex:1}
.chip{border:2.2px solid var(--ink);background:var(--paper2);border-radius:var(--w3);padding:3px 11px;
  font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;
  display:flex;gap:5px;align-items:center;box-shadow:var(--sh2)}
.chip.xp{background:#FFF4D2}
.chip.sk{background:#FFE6D8}
.chip.tm{background:#DFF0FB}
.chip.tm.warn{background:#FAD9D2;border-color:#B4452F;color:#9C3A26}
.tog{display:flex;border:2.2px solid var(--ink);border-radius:var(--w3);overflow:hidden;background:var(--paper2);box-shadow:var(--sh2)}
.tog button{padding:4px 10px;font-size:12.5px;font-weight:900;color:var(--ink2)}
.tog button.on{background:var(--sun);color:var(--ink)}
.icon{width:32px;height:32px;border-radius:50%;border:2.2px solid var(--ink);background:var(--paper2);
  display:grid;place-items:center;font-size:14px;box-shadow:var(--sh2)}
.icon:active{transform:translate(2px,3px);box-shadow:none}
.bar{height:10px;margin:7px auto 0;max-width:816px;border:2.2px solid var(--ink);border-radius:999px;
  background:var(--paper3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .35s ease;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px)}

/* ---- home ---- */
.hero{text-align:center;padding:30px 0 4px}
.kicker{display:inline-block;font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:900;color:var(--ink2);background:var(--paper);border:2.2px solid var(--ink);
  border-radius:var(--w2);padding:5px 14px;box-shadow:var(--sh2);transform:rotate(-1.4deg)}
h1{font-family:var(--disp);font-size:clamp(33px,8vw,54px);line-height:1.02;margin:16px 0 6px;font-weight:900;
  letter-spacing:-.005em;text-shadow:2.5px 3px 0 #fff, 4px 5px 0 rgba(60,44,32,.18)}
h1 em{font-style:normal;color:var(--grass3)}
.tag{color:var(--ink2);max-width:44ch;margin:12px auto 0;font-size:15.5px}
.totals{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 4px}
.tot{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w2);padding:9px 16px;text-align:center;
  min-width:100px;box-shadow:var(--sh)}
.tot:nth-child(1){transform:rotate(-1.6deg)} .tot:nth-child(3){transform:rotate(1.4deg)}
.tot b{display:block;font-family:var(--disp);font-size:23px;line-height:1.15;font-weight:900}
.tot span{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);font-weight:900}

/* ---- the garden path of stages ---- */
.map{margin:26px 0 8px;position:relative}
.node{display:flex;gap:12px;align-items:stretch;margin:0 0 16px;position:relative}
.node .rail{flex:none;width:44px;display:flex;flex-direction:column;align-items:center}
.node .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--disp);font-weight:900;font-size:19px;color:var(--ink);background:var(--c);
  border:2.5px solid var(--ink);box-shadow:var(--sh)}
.node .wire{flex:1;width:0;border-left:3px dashed var(--ink3);margin:8px 0 -16px}
.node:last-child .wire{display:none}
.card{flex:1;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w1);
  padding:15px 16px 14px;box-shadow:var(--sh);position:relative}
.card::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
.card .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2{font-family:var(--disp);font-size:21px;margin:3px 0 0;font-weight:900;flex-basis:100%}
.card .cef{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--ink);
  background:var(--c);border:2px solid var(--ink);border-radius:var(--w3);padding:2px 10px}
.card p{margin:7px 0 0;color:var(--ink2);font-size:14.5px}
.stars{display:flex;gap:4px;margin-left:auto}
.stars{font-size:19px}
.stars i{font-style:normal;color:#E2D6B6}
.stars i.on{color:var(--coral);text-shadow:0 0 0 var(--ink)}
.best{font-size:12.5px;color:var(--ink2);margin-top:7px;font-weight:800}
.row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);border-radius:var(--w2);padding:10px 16px;font-family:var(--disp);
  font-weight:900;font-size:15.5px;background:var(--sun);color:var(--ink);flex:1;min-width:118px;
  text-align:center;box-shadow:var(--sh);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translate(3px,4px);box-shadow:none}
.btn.ghost{background:var(--paper2)}
.btn.go{background:var(--c)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:var(--sh2)}
.legend{display:grid;gap:12px;margin:24px 0 46px}
@media(min-width:640px){.legend{grid-template-columns:1fr 1fr}}
.leg{background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--w2);padding:13px 15px;box-shadow:var(--sh2)}
.leg h3{margin:0 0 4px;font-size:14.5px;font-family:var(--disp);font-weight:900}
.leg p{margin:0;font-size:14px;color:var(--ink2)}

/* ---- quiz: paper pinned on a soil board ---- */
.part{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 0;position:relative;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w2);padding:10px 14px;box-shadow:var(--sh)}
.part b{font-family:var(--disp);font-size:15.5px;font-weight:900}
.part span{font-size:12.5px;color:var(--ink2);margin-left:auto;font-weight:900;white-space:nowrap;
  background:var(--acc);border:2px solid var(--ink);border-radius:var(--w3);padding:1px 10px}
.part .ins{flex-basis:100%;font-size:13.5px;color:var(--ink2);margin-top:3px}
.txt{background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--w1);padding:14px 16px;
  margin-top:14px;box-shadow:var(--sh);position:relative}
.txt::before{content:"";position:absolute;top:-8px;left:22px;width:14px;height:14px;border-radius:50%;
  background:var(--coral);border:2.5px solid var(--ink)}
.txt h4{margin:0 0 7px;font-family:var(--disp);font-size:17px;font-weight:900}
.txt p{margin:0 0 9px;font-size:16px;line-height:1.7}
.txt p:last-child{margin:0}
.fold{display:none}
@media(max-width:720px){ .fold{display:block;width:100%;margin-top:10px} .txt.min .bd{display:none} }

.q{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w1);padding:19px 16px 17px;
  margin:22px 0 14px;box-shadow:var(--sh);position:relative}
.q::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;
  background:var(--acc);border:2.5px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
.qh{display:flex;gap:10px;align-items:baseline}
.qn{font-family:var(--disp);font-weight:900;font-size:19px;min-width:30px;color:var(--ink)}
.st{font-size:17.5px;line-height:1.6}
.bl{letter-spacing:.07em;color:var(--ink3)}
.ops{display:grid;gap:9px;margin-top:15px}
.op{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  border:2.2px solid var(--ink);background:var(--paper2);border-radius:var(--w2);padding:11px 13px;
  font-size:16.5px;line-height:1.5;box-shadow:var(--sh2);transition:transform .07s,box-shadow .07s,background .12s}
.op:hover:not([disabled]){background:#FFFBEF}
.op:active:not([disabled]){transform:translate(2px,3px);box-shadow:none}
.op .k{flex:none;width:26px;height:26px;border-radius:50%;border:2.2px solid var(--ink);
  display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink2);background:var(--paper3)}
.op.sel{background:#FFF3CF}
.op.sel .k{background:var(--sun)}
.op.ok{background:var(--goodbg);border-color:#2F7A48}
.op.ok .k{background:var(--good);border-color:#2F7A48;color:#fff}
.op.no{background:var(--badbg);border-color:#A8422F}
.op.no .k{background:var(--bad);border-color:#A8422F;color:#fff}
.op .mk{margin-left:auto;font-size:11.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.op.ok .mk{color:#2F7A48} .op.no .mk{color:#A8422F}
.op[disabled]{cursor:default;box-shadow:var(--sh2)}

.hint{margin-top:13px;border:2.2px dashed var(--ink3);border-radius:var(--w2);background:#EAF4FB;
  padding:11px 13px;font-size:15px}
.hint b{display:block;font-family:var(--disp);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink2);margin-bottom:3px}
.fb{margin-top:13px;border:2.2px solid var(--ink);border-radius:var(--w2);padding:12px 14px;font-size:15.5px;line-height:1.62}
.fb.y{background:var(--goodbg)} .fb.n{background:var(--badbg)}
.fb .lb{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:900;margin-bottom:6px}
.fb.y .lb{color:#2F7A48} .fb.n .lb{color:#A8422F}
.fb .xp{margin-left:auto;letter-spacing:0;font-size:13px;color:var(--ink)}
.fb .sk{margin-top:9px;font-size:13px;color:var(--ink2)}
.acts{display:flex;gap:9px;margin:15px 0 6px;flex-wrap:wrap}
.acts .btn{flex:1 1 140px}

/* number grid = seed tray on soil */
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 44px;padding:12px;
  background:var(--soil);border:2.5px solid var(--ink);border-radius:var(--w1);box-shadow:var(--sh);
  background-image:radial-gradient(rgba(0,0,0,.14) 1.2px, transparent 1.3px);background-size:11px 11px}
.grid button{width:35px;height:35px;border-radius:9px;border:2.2px solid var(--ink);background:var(--paper2);
  font-family:var(--disp);font-size:13px;font-weight:900;color:var(--ink2)}
.grid button.done{background:var(--paper3);color:var(--ink)}
.grid button.ok{background:var(--good);color:#fff}
.grid button.no{background:var(--bad);color:#fff}
.grid button.cur{box-shadow:0 0 0 3px var(--sun), 0 0 0 5px var(--ink)}

/* combo */
.burst{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:60;pointer-events:none;
  font-family:var(--disp);font-weight:900;font-size:30px;color:var(--ink);opacity:0;white-space:nowrap;
  background:var(--sun);border:2.5px solid var(--ink);border-radius:var(--w2);padding:8px 18px;box-shadow:var(--sh)}
.burst.go{animation:pop 1.05s ease-out}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6) rotate(-6deg)}
  22%{opacity:1;transform:translateX(-50%) scale(1.06) rotate(2deg)}
  70%{opacity:1;transform:translateX(-50%) translateY(-10px) rotate(-1deg)}
  100%{opacity:0;transform:translateX(-50%) translateY(-32px) scale(.95)}}
@media (prefers-reduced-motion: reduce){ .burst.go{animation:none} .btn:active,.op:active{transform:none} }

/* ---- result ---- */
.res{text-align:center;padding:26px 0 4px}
.res .big{font-family:var(--disp);font-size:clamp(48px,13vw,78px);line-height:1;font-weight:900;
  text-shadow:2.5px 3px 0 #fff,4px 5px 0 rgba(60,44,32,.16)}
.res .big small{font-size:.37em;color:var(--ink2);font-weight:900}
.bigstars{font-size:34px;letter-spacing:7px;margin-top:6px}
.bigstars i{font-style:normal;color:#E2D6B6}
.bigstars i.on{color:var(--coral)}
.rank{display:inline-block;margin-top:12px;background:var(--acc);border:2.5px solid var(--ink);
  border-radius:var(--w3);padding:6px 20px;font-family:var(--disp);font-weight:900;font-size:15px;box-shadow:var(--sh2)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:20px 0}
@media(min-width:620px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts div{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w2);padding:10px 8px;
  text-align:center;box-shadow:var(--sh2)}
.facts .v{font-family:var(--disp);font-size:21px;font-weight:900}
.facts .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:900}
h3.sec{font-family:var(--disp);font-size:19px;margin:26px 0 5px;font-weight:900}
.note{color:var(--ink2);font-size:14px;margin:0 0 12px}
.prow{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:9px 0;
  border-bottom:2px dashed var(--paper3)}
.prow .nm{font-size:15px;font-weight:700}
.prow .sc{font-size:13.5px;color:var(--ink2);font-weight:900;font-variant-numeric:tabular-nums}
.mtr{grid-column:1/-1;height:12px;border:2.2px solid var(--ink);border-radius:999px;background:var(--paper3);overflow:hidden}
.mtr i{display:block;height:100%;background:var(--good)}
.mtr i.m{background:var(--sun)} .mtr i.l{background:var(--bad)}
.rev{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--w2);margin:9px 0;
  overflow:hidden;box-shadow:var(--sh2)}
.rev>button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:11px 13px;font-size:15px}
.rev .dt{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  font-weight:900;color:#fff;border:2px solid var(--ink)}
.rev .dt.ok{background:var(--good)} .rev .dt.no{background:var(--bad)} .rev .dt.sk{background:var(--ink3)}
.rev .bd{display:none;padding:0 13px 13px;border-top:2px dashed var(--paper3);font-size:15px}
.rev.open .bd{display:block}
.rev .bd .ln{margin:11px 0 0}
.rev .bd .kk{font-family:var(--disp);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink2);font-weight:900}
.revise{background:#FFF6DC;border:2.5px solid var(--ink);border-radius:var(--w1);padding:13px 16px;margin:12px 0;
  box-shadow:var(--sh)}
.revise b{font-family:var(--disp);font-weight:900}
.revise ul{margin:8px 0 0;padding-left:20px} .revise li{margin:5px 0;font-size:15px}
footer{margin:0;padding:6px 0 34px;background:var(--grass);color:#35501F;font-size:12.5px;
  text-align:center;font-weight:800}

@media(max-width:760px){ .clouds{display:none} }
@media(max-width:560px){
  .hud .in{gap:6px;padding:6px 10px}
  .logo{font-size:0} .logo i{font-size:17px}
  .chip{padding:3px 8px;font-size:11.5px}
  .tog button{padding:4px 8px;font-size:11.5px}
  .icon{width:29px;height:29px;font-size:13px}
  .wrap{padding:0 12px}
  .grid{padding:10px}
}
@media(max-width:380px){
  body{font-size:16px}
  .op{padding:10px 11px;font-size:15.5px}
  .grid button{width:32px;height:32px;font-size:12px}
}
</style>
</head>
<body>
<div class="scene"></div><div class="clouds"></div>

<div class="hud">
  <div class="in">
    <div class="logo">🌱 English <i>Garden Quest</i></div>
    <div class="sp"></div>
    <span class="chip xp" id="cXp">🌱 0</span>
    <span class="chip sk hidden" id="cStreak">☀️ 0</span>
    <span class="chip tm hidden" id="cTime">00:00</span>
    <div class="tog" id="lang"><button data-l="en" class="on">EN</button><button data-l="th">ไทย</button></div>
    <button class="icon" id="bSound" title="sound">🔊</button>
    <button class="icon hidden" id="bQuit" title="exit">✕</button>
  </div>
  <div class="bar"><i id="pBar"></i></div>
</div>

<div class="burst" id="burst"></div>

<main>
<section id="home" class="wrap">
  <div class="hero">
    <div class="kicker" data-t="kicker"></div>
    <h1>English <em>Garden Quest</em></h1>
    <p class="tag" data-t="tagline"></p>
    <div class="totals">
      <div class="tot"><b id="tXp">0</b><span data-t="xp"></span></div>
      <div class="tot"><b id="tStars">0/15</b><span data-t="stars"></span></div>
      <div class="tot"><b>150</b><span data-t="qTotal"></span></div>
    </div>
  </div>
  <div class="map" id="map"></div>
  <div class="legend">
    <div class="leg"><h3 data-t="m1h"></h3><p data-t="m1p"></p></div>
    <div class="leg"><h3 data-t="m2h"></h3><p data-t="m2p"></p></div>

<script>const PAPERS=[{"n":1,"name":"First Steps","nameT":"ก้าวแรก","cefr":"A1–A2","mins":35,"total":30,"parts":[{"id":"A","t":"Grammar and Structure","tT":"ไวยากรณ์และโครงสร้างประโยค","i":"Choose the word or phrase that best completes each sentence.","iT":"เลือกคำหรือวลีที่เติมในช่องว่างได้ถูกต้องที่สุด","r":"1 – 10","c":10},{"id":"B","t":"Error Identification","tT":"หาจุดที่ผิด","i":"One of the four underlined parts is wrong. Choose the part that must be changed.","iT":"ในแต่ละประโยคมีส่วนที่ขีดเส้นใต้ 4 ส่วน และมี 1 ส่วนที่ผิด เลือกส่วนที่ต้องแก้","r":"11 – 14","c":4},{"id":"C","t":"Vocabulary and Collocation","tT":"คำศัพท์และคำที่ใช้คู่กัน","i":"Choose the word that fits the sentence best.","iT":"เลือกคำที่เข้ากับประโยคได้ดีที่สุด","r":"15 – 18","c":4},{"id":"D","t":"Everyday Conversation","tT":"บทสนทนาในชีวิตประจำวัน","i":"Choose the most natural reply.","iT":"เลือกคำตอบที่เป็นธรรมชาติที่สุดในสถานการณ์นั้น","r":"19 – 22","c":4},{"id":"E","t":"Cloze Passage","tT":"เติมคำในเนื้อเรื่อง","i":"Read the whole text first, then choose the best word for each numbered gap.","iT":"อ่านเนื้อเรื่องให้จบก่อน แล้วจึงเลือกคำที่เหมาะกับช่องว่างแต่ละช่อง","r":"23 – 26","c":4},{"id":"F","t":"Reading Comprehension","tT":"อ่านจับใจความ","i":"Read the text and answer the questions that follow.","iT":"อ่านเนื้อเรื่องแล้วตอบคำถาม","r":"27 – 30","c":4}],"texts":[{"t":"Nont’s Old Bicycle","tT":"จักรยานคันเก่าของนนท์","p":["Nont lives in a small village in the north of Thailand. Last month his uncle gave him an old bicycle. The paint was dirty and the bell did not work, so Nont <b>__23__</b> it with his father on Sunday. They cleaned every part and painted the frame bright blue.","Now Nont rides to school <b>__24__</b> his bicycle every morning, and the journey takes about fifteen minutes. There is <b>__25__</b> safe place for bicycles beside the school gate, and he always locks his bicycle there.","His friends think the bicycle looks <b>__26__</b> now. Three of them want to paint their own bicycles blue too."]},{"t":"Inside a Pencil","tT":"ข้างในดินสอหนึ่งแท่ง","p":["Almost every pupil carries a pencil, but not many of us know what is inside. The grey part is not lead at all. It is graphite, a soft, dark mineral that comes out of the ground.","Graphite on its own breaks very easily. In a factory, workers mix it with clay and water, roll the mixture into thin sticks and bake them in a hot oven. More clay makes a harder stick and a paler line; less clay makes a softer stick and a darker line. That is why the letters on a pencil, such as H or B, tell you how dark your writing will be.","The wooden case is often cedar, which is light and easy to sharpen. A pencil costs very little, needs no battery and never dries up, so many artists still reach for one first."]}],"items":[{"n":1,"p":"A","tag":"Present simple – third person singular","tagT":"Present simple (ประธานเอกพจน์บุรุษที่ 3 กริยาเติม -s)","h":"<i>Danai</i> is one person, so the verb needs an extra letter at the end.","hT":"<i>Danai</i> เป็นคนคนเดียว กริยาจึงต้องเติมตัวอักษรเพิ่มที่ท้ายคำ","e":"<i>Every day</i> shows a habit, so we need the present simple, and with a single person (<i>Danai</i>) the verb takes <b>-s</b>. <i>Eat</i> has no <b>-s</b>, while <i>eating</i> and <i>to eat</i> cannot stand alone as the main verb of a sentence.","eT":"<i>Every day</i> บอกว่าเป็นสิ่งที่ทำเป็นกิจวัตร จึงใช้ <b>present simple</b> และเมื่อประธานเป็นคนคนเดียวอย่าง <i>Danai</i> กริยาต้องเติม <b>-s</b> ส่วน <i>eat</i> ยังไม่ได้เติม -s และ <i>eating</i> กับ <i>to eat</i> ก็ทำหน้าที่เป็นกริยาแท้ของประโยคไม่ได้","a":3,"o":["eating","eat","to eat","eats"],"s":"Danai <span class='bl'>_____</span> his breakfast at seven o’clock every day."},{"n":2,"p":"A","tag":"Irregular plural nouns","tagT":"คำนามพหูพจน์รูปพิเศษ (irregular plural)","h":"Some English nouns change their whole shape in the plural instead of adding <i>-s</i>.","hT":"คำนามบางคำในภาษาอังกฤษเปลี่ยนรูปทั้งคำเมื่อเป็นพหูพจน์ ไม่ได้เติม <i>-s</i> ธรรมดา","e":"<i>Child</i> has the irregular plural <b>children</b>, which is why we say <i>twelve children</i>. The forms <i>childs</i> and <i>childrens</i> do not exist in English, and the singular <i>child</i> cannot follow a number like <i>twelve</i>.","eT":"<i>child</i> มีรูปพหูพจน์พิเศษคือ <b>children</b> จึงพูดว่า <i>twelve children</i> ส่วนคำว่า <i>childs</i> และ <i>childrens</i> ไม่มีในภาษาอังกฤษ และ <i>child</i> ที่เป็นเอกพจน์ก็ตามหลังตัวเลขอย่าง <i>twelve</i> ไม่ได้","a":3,"o":["childrens","child","childs","children"],"s":"Twelve <span class='bl'>_____</span> are playing football in the park near our flat."},{"n":3,"p":"A","tag":"Present continuous","tagT":"Present continuous (กำลังเกิดขึ้นตอนนี้)","h":"<i>Listen!</i> tells you this is happening at this very moment.","hT":"คำว่า <i>Listen!</i> บอกว่าเหตุการณ์กำลังเกิดขึ้นเดี๋ยวนี้","e":"<i>Listen!</i> points to this very moment, so we need the present continuous: <b>am/is/are</b> plus an <i>-ing</i> verb. <i>Cries</i> and <i>cry</i> are present simple and describe habits, and <i>are</i> does not agree with the singular <i>the baby</i>.","eT":"<i>Listen!</i> ชี้ว่าเป็นเหตุการณ์ที่กำลังเกิดขึ้นในขณะนี้ จึงต้องใช้ <b>present continuous</b> คือ <b>am/is/are</b> + กริยาเติม <i>-ing</i> ส่วน <i>cries</i> และ <i>cry</i> เป็น present simple ที่ใช้กับสิ่งที่ทำเป็นปกติ และ <i>are</i> ก็ไม่สอดคล้องกับประธานเอกพจน์ <i>the baby</i>","a":2,"o":["cries","cry","is crying","are crying"],"s":"Listen! The baby <span class='bl'>_____</span> in the next room."},{"n":4,"p":"A","tag":"Prepositions of place","tagT":"คำบุพบทบอกสถานที่ (in / on / at)","h":"Think about a poster that touches a flat surface.","hT":"ลองนึกถึงโปสเตอร์ที่แปะแนบอยู่กับพื้นผิวเรียบ ๆ","e":"Anything that touches a flat surface sits <b>on</b> it, so a map hangs <i>on the wall</i>. <i>In the wall</i> would mean inside the bricks, <i>at the wall</i> describes a person standing beside it, and a map cannot be <i>under</i> a wall.","eT":"ของที่แนบอยู่กับพื้นผิวเรียบ ๆ ใช้ <b>on</b> แผนที่จึงแขวนอยู่ <i>on the wall</i> ส่วน <i>in the wall</i> จะหมายถึงอยู่ข้างในเนื้อผนัง <i>at the wall</i> ใช้กับคนที่ไปยืนอยู่ข้างผนัง และแผนที่ก็ไปอยู่ <i>under</i> ผนังไม่ได้","a":0,"o":["on","at","under","in"],"s":"The big map of Thailand is <span class='bl'>_____</span> the wall behind the teacher’s desk."},{"n":5,"p":"A","tag":"Past simple – irregular verbs","tagT":"Past simple (กริยาช่อง 2 แบบ irregular)","h":"<i>Last year</i> is finished time, and <i>go</i> is an irregular verb.","hT":"<i>Last year</i> เป็นเวลาในอดีตที่จบไปแล้ว และ <i>go</i> เป็นกริยา irregular","e":"<i>Last year</i> is finished past time, so the past simple is needed, and the past of <i>go</i> is the irregular form <b>went</b>. <i>Goed</i> is not an English word, <i>go</i> is the present, and <i>gone</i> is the third form, which needs a helping verb such as <i>have</i>, <i>has</i> or <i>had</i> in front of it.","eT":"<i>Last year</i> เป็นเวลาในอดีตที่จบไปแล้ว จึงต้องใช้ <b>past simple</b> และช่อง 2 ของ <i>go</i> คือรูป irregular ว่า <b>went</b> ส่วน <i>goed</i> ไม่มีในภาษาอังกฤษ <i>go</i> เป็นรูปปัจจุบัน และ <i>gone</i> เป็นกริยาช่อง 3 ซึ่งต้องมีกริยาช่วยอย่าง <i>have</i> <i>has</i> หรือ <i>had</i> นำหน้า","a":0,"o":["went","go","gone","goed"],"s":"We <span class='bl'>_____</span> to Chiang Mai by train last year."},{"n":6,"p":"A","tag":"Articles – a / an","tagT":"Article a / an (คำนำหน้านาม)","h":"Listen to the first sound of the word after the gap.","hT":"ฟังเสียงแรกของคำที่อยู่หลังช่องว่าง","e":"Before a vowel sound we use <b>an</b>, and <i>engineer</i> begins with the vowel sound /e/. <i>The</i> would point to one particular engineer we had already mentioned, and <i>some</i> goes with plurals and uncountable nouns, not with one job title like this.","eT":"หน้าคำที่ออกเสียงสระ ต้องใช้ <b>an</b> และ <i>engineer</i> ขึ้นต้นด้วยเสียงสระ /e/ ส่วน <i>the</i> จะหมายถึงวิศวกรคนที่เราพูดถึงมาก่อนแล้ว และ <i>some</i> ใช้กับคำนามพหูพจน์หรือคำนามนับไม่ได้ ไม่ได้ใช้กับชื่ออาชีพคำเดียวอย่างนี้","a":1,"o":["some","an","the","a"],"s":"Arisa wants to be <span class='bl'>_____</span> engineer when she grows up."},{"n":7,"p":"A","tag":"Comparative adjectives","tagT":"Comparative (การเปรียบเทียบขั้นกว่า)","h":"<i>Good</i> does not take <i>more</i>; it has its own special comparative form.","hT":"<i>good</i> ไม่ใช้ <i>more</i> นำหน้า แต่มีรูป comparative พิเศษของตัวเอง","e":"<i>Good</i> is irregular: its comparative is <b>better</b>, so <i>more good</i> and <i>gooder</i> are both impossible. <i>Best</i> is the superlative, and a superlative takes <i>the</i> in front of it and <i>of</i> or <i>in</i> after it, never <i>than</i>.","eT":"<i>good</i> เป็นคำที่ผันรูปแบบ irregular รูปขั้นกว่าของมันคือ <b>better</b> ดังนั้น <i>more good</i> และ <i>gooder</i> จึงใช้ไม่ได้ ส่วน <i>best</i> เป็นขั้นสูงสุด ซึ่งต้องมี <i>the</i> นำหน้าและตามด้วย <i>of</i> หรือ <i>in</i> ไม่ใช่ <i>than</i>","a":0,"o":["better","gooder","more good","best"],"s":"Fah’s handwriting is much <span class='bl'>_____</span> than mine."},{"n":8,"p":"A","tag":"There is / There are","tagT":"โครงสร้าง There is / There are","h":"Count the computers first, then choose a verb that matches them.","hT":"นับจำนวนคอมพิวเตอร์ก่อน แล้วค่อยเลือกกริยาให้สอดคล้องกัน","e":"We are saying that four computers exist, and <i>four computers</i> is plural, so we need <b>There are</b>. <i>There is</i> is only for one thing, <i>There has</i> cannot say that something exists (we only meet it in <i>there has been</i>), and <i>It is</i> would need a single thing that we had already named.","eT":"ประโยคนี้บอกว่ามีคอมพิวเตอร์อยู่สี่เครื่อง และ <i>four computers</i> เป็นพหูพจน์ จึงต้องใช้ <b>There are</b> ส่วน <i>There is</i> ใช้กับสิ่งเดียว <i>There has</i> ใช้บอกว่ามีสิ่งนั้นอยู่ไม่ได้ (จะเจอก็เฉพาะในรูป <i>there has been</i>) และ <i>It is</i> ต้องหมายถึงสิ่งเดียวที่เราเอ่ยถึงมาก่อนแล้ว","a":1,"o":["There is","There are","There has","It is"],"s":"<span class='bl'>_____</span> four new computers in the school library."},{"n":9,"p":"A","tag":"Possessive ’s","tagT":"การแสดงความเป็นเจ้าของด้วย ’s","h":"The house belongs to one boy, so his name must show that he owns it.","hT":"บ้านหลังนี้เป็นของเด็กผู้ชายคนหนึ่ง ชื่อของเขาจึงต้องอยู่ในรูปที่บอกความเป็นเจ้าของ","e":"To show that the house belongs to one boy we add an apostrophe and <b>s</b> to his name: <b>Krit’s house</b>. A name on its own cannot show ownership, <i>Krits</i> without the apostrophe would only be a plural, and <i>Krit is house</i> makes no sense at all.","eT":"การบอกว่าบ้านเป็นของเด็กผู้ชายคนหนึ่ง ต้องเติมเครื่องหมาย apostrophe กับ <b>s</b> ท้ายชื่อ เป็น <b>Krit’s house</b> ชื่อเปล่า ๆ บอกความเป็นเจ้าของไม่ได้ <i>Krits</i> ที่ไม่มี apostrophe จะกลายเป็นพหูพจน์ และ <i>Krit is house</i> ก็ไม่ได้ความหมายอะไรเลย","a":1,"o":["Krit is","Krit’s","Krits","Krit"],"s":"At the weekend we often play badminton at <span class='bl'>_____</span> house."},{"n":10,"p":"A","tag":"can / can’t for ability","tagT":"can และ can’t (ความสามารถ)","h":"The second half of the sentence tells you she is still not good at it.","hT":"ครึ่งหลังของประโยคบอกว่าเธอยังทำได้ไม่ดี","e":"<i>Yet</i> and the swimming lessons show that she is still unable to do it, so we need the negative <b>can’t</b>. <i>Can</i> would contradict the second half of the sentence, and <i>doesn’t can</i> and <i>not can</i> are impossible because <i>can</i> never takes <i>do</i> or <i>does</i>.","eT":"คำว่า <i>yet</i> และการที่เธอยังเรียนว่ายน้ำอยู่ บอกว่าเธอยังทำไม่ได้ดี จึงต้องใช้รูปปฏิเสธ <b>can’t</b> ถ้าใช้ <i>can</i> จะขัดกับครึ่งหลังของประโยค ส่วน <i>doesn’t can</i> และ <i>not can</i> ผิดโครงสร้าง เพราะ <i>can</i> ไม่เคยใช้ <i>do</i> หรือ <i>does</i> ช่วย","a":2,"o":["doesn’t can","can","can’t","not can"],"s":"Bee <span class='bl'>_____</span> swim very well yet, but she is having lessons at the pool."},{"n":11,"p":"B","tag":"Prepositions of time","tagT":"คำบุพบทบอกเวลา (in / on / at)","h":"Days of the week do not take the same preposition as months do.","hT":"วันในสัปดาห์ไม่ได้ใช้คำบุพบทตัวเดียวกับเดือน","e":"Days of the week take <b>on</b>, so it must be <i>on Saturday mornings</i>. <i>In</i> is used with months, seasons and years. The verb <i>is</i>, the adjective <i>open</i> and the linking word <i>but</i> all need no change.","eT":"วันในสัปดาห์ใช้ <b>on</b> จึงต้องเป็น <i>on Saturday mornings</i> ส่วน <i>in</i> ใช้กับเดือน ฤดู และปี ขณะที่กริยา <i>is</i> คำคุณศัพท์ <i>open</i> และคำเชื่อม <i>but</i> ไม่ต้องแก้อะไรเลย","a":2,"o":["is","open","in","but"],"s":"The village library <u class='u'>is</u><sup>A</sup> <u class='u'>open</u><sup>B</sup> <u class='u'>in</u><sup>C</sup> Saturday mornings, <u class='u'>but</u><sup>D</sup> it closes at noon.","fix":"on"},{"n":12,"p":"B","tag":"much / many with countable nouns","tagT":"much กับ many (คำนามนับได้และนับไม่ได้)","h":"<i>People</i> can be counted, so choose the quantity word for countable nouns.","hT":"คำว่า <i>people</i> นับจำนวนได้ จึงต้องใช้คำบอกปริมาณของคำนามที่นับได้","e":"<i>People</i> is a countable plural noun, so the quantity phrase must be <b>too many</b>. <i>Too much</i> goes only with uncountable nouns such as <i>water</i> or <i>noise</i>. <i>People</i>, <i>so</i> and <i>went</i> are all correct as they stand.","eT":"<i>people</i> เป็นคำนามพหูพจน์ที่นับได้ คำบอกปริมาณจึงต้องเป็น <b>too many</b> ส่วน <i>too much</i> ใช้กับคำนามนับไม่ได้อย่าง <i>water</i> หรือ <i>noise</i> เท่านั้น ขณะที่ <i>people</i>, <i>so</i> และ <i>went</i> เขียนถูกต้องอยู่แล้ว","a":0,"o":["too much","people","so","went"],"s":"There were <u class='u'>too much</u><sup>A</sup> <u class='u'>people</u><sup>B</sup> at the market, <u class='u'>so</u><sup>C</sup> we <u class='u'>went</u><sup>D</sup> home early.","fix":"too many"},{"n":13,"p":"B","tag":"Subject–verb agreement","tagT":"ความสอดคล้องของประธานกับกริยา","h":"Look at how many animals the pronoun <i>they</i> stands for.","hT":"ดูว่าคำว่า <i>they</i> แทนสัตว์กี่ตัว","e":"<i>They</i> stands for two dogs, which is plural, so the verb must be <b>are</b> and not <i>is</i>. The number <i>two</i>, the adjective <i>big</i> and the phrase <i>at home</i> are all written correctly.","eT":"<i>they</i> แทนสุนัขสองตัว ซึ่งเป็นพหูพจน์ กริยาจึงต้องเป็น <b>are</b> ไม่ใช่ <i>is</i> ส่วนจำนวน <i>two</i> คำคุณศัพท์ <i>big</i> และวลี <i>at home</i> เขียนถูกต้องหมดแล้ว","a":3,"o":["two","big","at home","is"],"s":"Tul has <u class='u'>two</u><sup>A</sup> <u class='u'>big</u><sup>B</sup> dogs <u class='u'>at home</u><sup>C</sup>, and they <u class='u'>is</u><sup>D</sup> very friendly.","fix":"are"},{"n":14,"p":"B","tag":"Possessive adjectives","tagT":"Possessive adjective (คำแสดงความเป็นเจ้าของที่ขยายคำนาม)","h":"In front of a noun you need the possessive form, not the subject form.","hT":"คำที่วางไว้หน้าคำนามต้องเป็นรูป possessive ไม่ใช่รูปประธาน","e":"<i>She</i> is a subject pronoun, but here the word sits in front of the noun <i>sister</i>, so the possessive adjective <b>her</b> is needed. <i>Walks</i> agrees with <i>Pim</i>, and <i>little</i> and <i>and</i> are both perfectly correct.","eT":"<i>she</i> เป็นคำสรรพนามที่ใช้เป็นประธาน แต่ตำแหน่งนี้อยู่หน้าคำนาม <i>sister</i> จึงต้องใช้ possessive adjective คือ <b>her</b> ส่วน <i>walks</i> สอดคล้องกับประธาน <i>Pim</i> แล้ว และ <i>little</i> กับ <i>and</i> ก็ถูกต้องทั้งคู่","a":1,"o":["walks","she","little","and"],"s":"Every morning Pim <u class='u'>walks</u><sup>A</sup> to school with <u class='u'>she</u><sup>B</sup> <u class='u'>little</u><sup>C</sup> sister <u class='u'>and</u><sup>D</sup> two friends.","fix":"her"},{"n":15,"p":"C","tag":"Everyday nouns – the kitchen","tagT":"คำศัพท์ของใช้ในครัว","h":"Which machine in a kitchen keeps food and drink cold?","hT":"ในครัว อะไรที่ทำให้อาหารและเครื่องดื่มเย็นอยู่ได้","e":"Only a <b>fridge</b> keeps food and drink cold. A <i>cupboard</i> is a dry store at room temperature, an <i>oven</i> makes things hot, and a <i>sink</i> is where you wash up.","eT":"มีแต่ <b>fridge</b> เท่านั้นที่เก็บอาหารและเครื่องดื่มให้เย็นได้ ส่วน <i>cupboard</i> เป็นตู้เก็บของแห้ง ๆ ที่อุณหภูมิห้อง <i>oven</i> ใช้ทำให้ของร้อน และ <i>sink</i> คืออ่างสำหรับล้างจาน","a":1,"o":["oven","fridge","cupboard","sink"],"s":"Please put the milk back in the <span class='bl'>_____</span> so that it stays cold."},{"n":16,"p":"C","tag":"Collocation – homework","tagT":"Collocation (คำที่ใช้คู่กัน) กับคำว่า homework","h":"English puts one particular everyday verb with <i>homework</i>, and it is not <i>make</i>.","hT":"ภาษาอังกฤษใช้กริยาธรรมดาตัวหนึ่งคู่กับคำว่า <i>homework</i> โดยเฉพาะ และไม่ใช่ <i>make</i>","e":"The fixed English phrase is <b>do your homework</b>. <i>Make</i> is for things you create, such as <i>make a cake</i>, while <i>take</i> and <i>give</i> are used with exams and lessons, not with homework.","eT":"วลีที่ภาษาอังกฤษใช้คู่กันแน่นอนคือ <b>do your homework</b> ส่วน <i>make</i> ใช้กับของที่เราสร้างขึ้นมา เช่น <i>make a cake</i> และ <i>take</i> กับ <i>give</i> มักใช้กับการสอบและการสอน ไม่ใช้กับการบ้าน","a":0,"o":["does","takes","makes","gives"],"s":"Weera always <span class='bl'>_____</span> his homework before dinner."},{"n":17,"p":"C","tag":"Phrasal verbs with put","tagT":"Phrasal verb (กริยาวลี) กลุ่ม put","h":"Which little word turns the meaning into dressing yourself?","hT":"คำเล็ก ๆ คำไหนที่ทำให้ความหมายกลายเป็นการสวมเสื้อผ้า","e":"<b>Put on</b> means to dress yourself in something. <i>Put off</i> means to delay, <i>put up</i> means to raise or build something, and <i>put away</i> means to tidy something back into its proper place.","eT":"<b>put on</b> หมายถึงสวมเสื้อผ้าหรือเครื่องแต่งตัว ส่วน <i>put off</i> หมายถึงเลื่อนออกไป <i>put up</i> หมายถึงยกขึ้นหรือสร้างขึ้น และ <i>put away</i> หมายถึงเก็บของเข้าที่ให้เรียบร้อย","a":2,"o":["put up","put off","put on","put away"],"s":"It’s very cold outside, so <span class='bl'>_____</span> your coat before you go."},{"n":18,"p":"C","tag":"Word formation – person nouns","tagT":"การสร้างคำ (verb + -er = คนที่ทำสิ่งนั้น)","h":"You need the noun for the person who does this, not the action itself.","hT":"ต้องการคำนามที่หมายถึงคนที่ทำสิ่งนั้น ไม่ใช่คำที่หมายถึงการกระทำ","e":"Adding <b>-er</b> to <i>sing</i> gives <b>singer</b>, the word for a person who sings. <i>Sing</i> and <i>singing</i> are verb forms, and a <i>song</i> is the thing she performs, not a person.","eT":"เติม <b>-er</b> ท้ายคำ <i>sing</i> จะได้ <b>singer</b> ซึ่งหมายถึงคนที่ร้องเพลง ส่วน <i>sing</i> และ <i>singing</i> เป็นรูปกริยา และ <i>song</i> คือเพลงที่เธอร้อง ไม่ใช่ตัวคน","a":3,"o":["sing","song","singing","singer"],"s":"Kanya is a wonderful <span class='bl'>_____</span> – she sings in the school concert every year."},{"n":19,"p":"D","tag":"Responding to thanks","tagT":"การตอบรับคำขอบคุณ","h":"What do you say back when somebody thanks you?","hT":"เวลามีคนขอบคุณเรา เราควรตอบกลับไปว่าอะไร","e":"<b>You’re welcome</b> is the normal reply to <i>thank you</i>. <i>Yes, please</i> accepts an offer, <i>No, thank you</i> refuses one, and <i>Here you are</i> is what you say as you hand something over.","eT":"<b>You’re welcome</b> เป็นคำตอบปกติเมื่อมีคนพูด <i>thank you</i> กับเรา ส่วน <i>Yes, please</i> ใช้ตอบรับเมื่อมีคนเสนอของให้ <i>No, thank you</i> ใช้ปฏิเสธ และ <i>Here you are</i> พูดตอนที่เรายื่นของส่งให้คนอื่น","a":1,"o":["Yes, please.","You’re welcome.","No, thank you.","Here you are."],"s":"<b>A:</b> Thank you very much for carrying my bags.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":20,"p":"D","tag":"Refusing food politely","tagT":"การปฏิเสธอาหารอย่างสุภาพ","h":"A polite <i>no</i> usually comes with a short reason.","hT":"การปฏิเสธอย่างสุภาพมักมีเหตุผลสั้น ๆ ต่อท้ายด้วย","e":"A polite refusal is a clear <i>no</i> plus a short reason. <i>Yes, I would like</i> is unfinished English, <i>Yes, I am full</i> contradicts itself, and <i>No, I don’t like you</i> talks rudely about the host instead of the rice.","eT":"การปฏิเสธอย่างสุภาพคือบอก <i>no</i> ให้ชัด แล้วให้เหตุผลสั้น ๆ ต่อท้าย ส่วน <i>Yes, I would like</i> เป็นประโยคที่ยังพูดไม่จบ <i>Yes, I am full</i> ขัดแย้งกันในตัวเอง และ <i>No, I don’t like you</i> กลายเป็นพูดจาไม่ดีกับเจ้าของบ้าน ไม่ได้พูดถึงข้าวเลย","a":3,"o":["Yes, I would like.","No, I don’t like you.","Yes, I am full.","No, thank you. I’m full."],"s":"<b>A:</b> Would you like some more rice?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":21,"p":"D","tag":"Asking for and giving directions","tagT":"การถามทางและการบอกทาง","h":"The question asks <i>where</i>, so the reply must give a position.","hT":"คำถามถามถึงสถานที่ คำตอบจึงต้องบอกตำแหน่ง","e":"A <i>where</i> question needs an answer that says in which place something is, and <b>It’s just round the corner, next to the bank</b> names the place and gives a landmark. The other three all mention buses, but none of them tells the stranger where to go.","eT":"คำถามที่ขึ้นต้นด้วย <i>where</i> ต้องการคำตอบที่บอกว่าสิ่งนั้นอยู่ที่ไหน และ <b>It’s just round the corner, next to the bank</b> บอกตำแหน่งพร้อมจุดสังเกตให้ด้วย อีกสามข้อพูดถึงรถเมล์เหมือนกัน แต่ไม่มีข้อไหนบอกคนที่มาถามว่าต้องไปทางใด","a":2,"o":["I’m afraid I’m late for the bus.","Yes, I catch the bus every day.","It’s just round the corner, next to the bank.","The bus is always crowded in the morning."],"s":"<b>A:</b> Excuse me, where is the nearest bus stop?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":22,"p":"D","tag":"Receiving a present","tagT":"การตอบรับเมื่อได้รับของขวัญ","h":"When somebody gives you a present, you answer warmly and politely.","hT":"เมื่อมีคนให้ของขวัญ ควรตอบด้วยน้ำเสียงที่อบอุ่นและสุภาพ","e":"Warm thanks are expected when somebody hands you a gift. <i>Never mind</i> and <i>Don’t worry about it</i> are both answers to an apology, and <i>Yes, it is my birthday</i> ignores the gift completely.","eT":"เมื่อมีคนยื่นของขวัญให้ เราควรขอบคุณด้วยน้ำเสียงอบอุ่น ส่วน <i>Never mind</i> และ <i>Don’t worry about it</i> เป็นคำตอบเวลามีคนมาขอโทษ และ <i>Yes, it is my birthday</i> ก็ไม่ได้พูดถึงของขวัญที่ได้รับเลย","a":0,"o":["Oh, how kind of you! Thank you.","Don’t worry about it.","Never mind.","Yes, it is my birthday."],"s":"<b>A:</b> Happy birthday, Fah! This little present is for you.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":23,"p":"E","tag":"Past simple – regular verbs","tagT":"Past simple (กริยาเติม -ed)","h":"<i>Last month</i> and <i>on Sunday</i> are both finished time.","hT":"<i>Last month</i> และ <i>on Sunday</i> เป็นเวลาในอดีตที่จบไปแล้วทั้งคู่","e":"The whole paragraph is about last month, so we need the past simple, and this regular verb just adds <b>-ed</b>. <i>Mends</i> and <i>is mending</i> describe the present, and the <i>-ing</i> form on its own cannot be the main verb.","eT":"ย่อหน้านี้เล่าเรื่องเมื่อเดือนที่แล้วทั้งย่อหน้า จึงต้องใช้ <b>past simple</b> และกริยาตัวนี้เป็นกริยาปกติที่เติม <b>-ed</b> ได้เลย ส่วน <i>mends</i> กับ <i>is mending</i> พูดถึงปัจจุบัน และรูป <i>-ing</i> เดี่ยว ๆ ก็เป็นกริยาแท้ของประโยคไม่ได้","a":2,"o":["is mending","mending","mended","mends"],"s":"","t":0},{"n":24,"p":"E","tag":"Prepositions with transport","tagT":"คำบุพบทกับยานพาหนะ (preposition + ยานพาหนะ)","h":"Think about where a rider sits – not inside the machine.","hT":"ลองคิดว่าคนขี่นั่งอยู่ตรงไหนของจักรยาน ไม่ใช่นั่งอยู่ข้างใน","e":"We travel <b>on</b> a bicycle, a bus or a train, but <b>in</b> a car or a taxi. <i>By</i> is possible only with no determiner (<i>by bicycle</i>), and it cannot come before <i>his</i>; <i>at</i> is never used for transport.","eT":"ภาษาอังกฤษใช้ <b>on</b> กับจักรยาน รถเมล์ และรถไฟ แต่ใช้ <b>in</b> กับรถยนต์และรถแท็กซี่ ส่วน <i>by</i> ใช้ได้เฉพาะเมื่อไม่มีคำนำหน้านาม เช่น <i>by bicycle</i> จะมาอยู่หน้า <i>his</i> ไม่ได้ และ <i>at</i> ก็ไม่ใช้กับยานพาหนะเลย","a":0,"o":["on","in","by","at"],"s":"","t":0},{"n":25,"p":"E","tag":"Articles – introducing something new","tagT":"Article (การเอ่ยถึงสิ่งที่ผู้อ่านยังไม่รู้จัก)","h":"<i>There is</i> introduces something the reader does not know yet.","hT":"<i>There is</i> ใช้เมื่อเอ่ยถึงสิ่งที่ผู้อ่านยังไม่รู้จัก","e":"<i>There is</i> tells the reader about something new, so the indefinite article <b>a</b> is needed before <i>safe place</i>. <i>An</i> goes before a vowel sound, <i>the</i> would mean we already knew the place, and <i>some</i> does not fit a singular noun here.","eT":"<i>There is</i> เป็นการบอกผู้อ่านถึงสิ่งที่ยังไม่เคยเอ่ยถึง จึงต้องใช้ article แบบไม่ชี้เฉพาะ คือ <b>a</b> วางหน้า <i>safe place</i> ส่วน <i>an</i> ใช้หน้าเสียงสระ <i>the</i> จะหมายถึงที่ที่เรารู้จักกันอยู่แล้ว และ <i>some</i> ก็ไม่เข้ากับคำนามเอกพจน์ตรงนี้","a":1,"o":["an","a","the","some"],"s":"","t":0},{"n":26,"p":"E","tag":"Vocabulary from context – adjectives","tagT":"เดาคำคุณศัพท์จากบริบท","h":"Father and son washed every part and painted the frame, so how does it look?","hT":"พ่อกับลูกล้างทุกชิ้นส่วนและทาสีโครงจักรยานใหม่ แล้วมันน่าจะดูเป็นอย่างไร","e":"The first paragraph says the paint was dirty and the bell did not work, and then father and son washed and painted it, so the bicycle now looks <b>clean</b>. <i>Dirty</i> and <i>broken</i> describe the bicycle before the repairs, and <i>noisy</i> is about sound, which this paragraph never mentions.","eT":"ย่อหน้าแรกบอกว่าสีสกปรกและกระดิ่งเสีย แล้วพ่อกับลูกก็ล้างและทาสีใหม่ จักรยานตอนนี้จึงดู <b>clean</b> ส่วน <i>dirty</i> และ <i>broken</i> เป็นสภาพก่อนซ่อม และ <i>noisy</i> พูดถึงเรื่องเสียง ซึ่งย่อหน้านี้ไม่ได้เอ่ยถึงเลย","a":3,"o":["dirty","broken","noisy","clean"],"s":"","t":0},{"n":27,"p":"F","tag":"Reading for detail","tagT":"อ่านจับรายละเอียด","h":"Read the first paragraph again, then look at what the workers add in the factory.","hT":"กลับไปอ่านย่อหน้าแรกอีกครั้ง แล้วดูว่าในโรงงานคนงานผสมอะไรลงไปอีก","e":"Paragraph 1 says the grey part is not lead but graphite, and paragraph 2 says the workers mix it with clay before baking it. Cedar is only the wooden case outside, and the water is used in the mixing and then dries away.","eT":"ย่อหน้าที่ 1 บอกว่าส่วนสีเทาไม่ใช่ lead แต่เป็น graphite และย่อหน้าที่ 2 บอกว่าคนงานผสมมันกับ clay ก่อนนำไปอบ ส่วน cedar เป็นแค่ปลอกไม้ด้านนอก และน้ำใช้แค่ตอนผสมแล้วก็แห้งไป","a":1,"o":["Soft clay only","Graphite mixed with clay","Cedar wood and clay","Lead mixed with water"],"s":"According to the text, what is the grey part of a pencil made of?","t":1},{"n":28,"p":"F","tag":"Vocabulary in context","tagT":"เดาความหมายคำศัพท์จากบริบท","h":"Find the word the writer sets against it later in the same sentence.","hT":"หาคำที่ผู้เขียนเอามาวางเปรียบกันในประโยคเดียวกัน","e":"The sentence sets <i>a harder stick and a paler line</i> against <i>a softer stick and a darker line</i>, so the word must be the opposite of <i>darker</i> – that is, lighter in colour. Thickness and straightness are never mentioned in the text.","eT":"ประโยคนี้วาง <i>a harder stick and a paler line</i> ไว้ตรงข้ามกับ <i>a softer stick and a darker line</i> คำนี้จึงต้องมีความหมายตรงข้ามกับ <i>darker</i> คือสีอ่อนกว่า ส่วนความหนาและความตรงของเส้นนั้น เนื้อเรื่องไม่ได้พูดถึงเลย","a":3,"o":["straighter","thicker","darker","lighter"],"s":"The word <i>paler</i> in paragraph 2 is closest in meaning to…","t":1},{"n":29,"p":"F","tag":"Inference","tagT":"การตีความสิ่งที่ผู้เขียนบอกเป็นนัย","h":"Think about which kind of stick leaves the darker mark, and what is inside it.","hT":"คิดว่าไส้แบบไหนเขียนออกมาเข้มกว่า และข้างในไส้แบบนั้นผสมอะไรอยู่","e":"The text says that less clay makes a softer stick and a darker line, so Pim needs the softer kind. More clay would make the pencil harder and the line paler, and the thickness of the wooden case has no effect on the mark at all.","eT":"เนื้อเรื่องบอกว่า clay น้อยลงทำให้ไส้นุ่มกว่าและเส้นเข้มกว่า ดังนั้น <i>Pim</i> ต้องใช้ดินสอไส้นุ่ม ถ้า clay มากขึ้นดินสอจะแข็งขึ้นและเส้นจะอ่อนลง และความหนาของปลอกไม้ก็ไม่มีผลกับความเข้มของเส้นเลย","a":0,"o":["A softer pencil","A harder pencil","A pencil with a thicker wooden case","A pencil with more clay in it"],"s":"Pim wants to draw a very dark line. Which pencil should she use?","t":1},{"n":30,"p":"F","tag":"Main idea and purpose","tagT":"ใจความสำคัญและจุดประสงค์ของผู้เขียน","h":"Ask yourself whether the writer is teaching a skill, selling something or describing an ordinary object.","hT":"ถามตัวเองว่าผู้เขียนกำลังสอนทักษะ ขายของ หรือเล่าเรื่องของใช้ธรรมดาชิ้นหนึ่ง","e":"The text describes what is inside a pencil, how the factory turns graphite into a stick, and why people still choose one, so the writer is explaining. Drawing is never taught, pens are never attacked, and no shop prices are compared.","eT":"เนื้อเรื่องเล่าว่าข้างในดินสอมีอะไร โรงงานเปลี่ยน graphite เป็นไส้ดินสอได้อย่างไร และทำไมคนยังเลือกใช้มันอยู่ จุดประสงค์ของผู้เขียนจึงเป็นการอธิบาย ไม่ได้สอนวาดรูป ไม่ได้ว่าปากกา และไม่ได้เทียบราคาดินสอตามร้านค้าเลย","a":2,"o":["To persuade readers to stop using pens at school","To teach readers how to draw pictures well","To explain how a simple pencil is made and why it is still useful","To compare the prices of pencils in different shops"],"s":"What is the writer’s main purpose in this text?","t":1}]},{"n":2,"name":"Building Up","nameT":"สร้างพื้นฐาน","cefr":"A2","mins":35,"total":30,"parts":[{"id":"A","t":"Grammar and Structure","tT":"ไวยากรณ์และโครงสร้างประโยค","i":"Choose the word or phrase that best completes each sentence.","iT":"เลือกคำหรือวลีที่เติมในช่องว่างได้ถูกต้องที่สุด","r":"1 – 10","c":10},{"id":"B","t":"Error Identification","tT":"หาจุดที่ผิด","i":"One of the four underlined parts is wrong. Choose the part that must be changed.","iT":"ในแต่ละประโยคมีส่วนที่ขีดเส้นใต้ 4 ส่วน และมี 1 ส่วนที่ผิด เลือกส่วนที่ต้องแก้","r":"11 – 14","c":4},{"id":"C","t":"Vocabulary and Collocation","tT":"คำศัพท์และคำที่ใช้คู่กัน","i":"Choose the word that fits the sentence best.","iT":"เลือกคำที่เข้ากับประโยคได้ดีที่สุด","r":"15 – 18","c":4},{"id":"D","t":"Everyday Conversation","tT":"บทสนทนาในชีวิตประจำวัน","i":"Choose the most natural reply.","iT":"เลือกคำตอบที่เป็นธรรมชาติที่สุดในสถานการณ์นั้น","r":"19 – 22","c":4},{"id":"E","t":"Cloze Passage","tT":"เติมคำในเนื้อเรื่อง","i":"Read the whole text first, then choose the best word for each numbered gap.","iT":"อ่านเนื้อเรื่องให้จบก่อน แล้วจึงเลือกคำที่เหมาะกับช่องว่างแต่ละช่อง","r":"23 – 26","c":4},{"id":"F","t":"Reading Comprehension","tT":"อ่านจับใจความ","i":"Read the text and answer the questions that follow.","iT":"อ่านเนื้อเรื่องแล้วตอบคำถาม","r":"27 – 30","c":4}],"texts":[{"t":"The Bamboo Bridge","tT":"สะพานไม้ไผ่","p":["Every December the people of Ban Nam Yen build a bamboo bridge across their river. The old wooden bridge fell down many years ago, and the village has never had enough money to replace it. So every year about thirty men and women work <b>__23__</b> three days, cutting bamboo and tying the poles together with rope.","The bridge is narrow, and nobody is allowed to ride a motorcycle on it. <b>__24__</b>, it saves the whole village a two-kilometre walk round the bend of the river. By the end of the dry season the bamboo has turned grey and the ropes are loose, so the bridge is pulled down before the rains come. Nobody <b>__25__</b> about that. The villagers enjoy <b>__26__</b> the new bridge together, and many of them say that those three days are the best of the year."]},{"t":"Lantern Boat Evening – a park poster","tT":"ป้ายประกาศงานลอยเรือโคมที่สวนสาธารณะ","p":["<b>LANTERN BOAT EVENING – KHLONG HAI PARK</b><br/>The second Saturday in November, 5 p.m. until 9 p.m. Bring the family down to the canal for music, hot food and a thousand floating lights.","<b>Make your own boat.</b> Our volunteers will show you how to fold a little boat from banana leaves and stand a candle in the middle. The <i>materials</i> are free. We ask one thing only: please carry your rubbish home with you. Last year the grass by the water was left in a dreadful state, and it took our team two mornings to clear it.","<b>Prices.</b> Entry is free. A bowl of noodles is 30 baht and a cup of iced tea is 15 baht. A canal boat ride is 50 baht for adults and 20 baht for children under twelve.","<b>Getting here.</b> The car park holds twelve cars only, so please come by songthaew. The last songthaew back to the town market leaves the park gate at 9.15 p.m."]}],"items":[{"n":1,"p":"A","tag":"Past continuous","tagT":"Past continuous (อดีตกาลกำลังกระทำ)","h":"The phrase names a moment in the middle of a journey that had already begun.","hT":"“this time yesterday” หมายถึงจังหวะที่การเดินทางกำลังดำเนินอยู่ในอดีต","e":"<i>This time yesterday</i> points to a moment in the past when the action was already in progress, so we need <b>was/were + -ing</b>. <i>Are sitting</i> and <i>have been sitting</i> both belong to the present, which clashes with <i>yesterday</i>.","eT":"<i>This time yesterday</i> คือจุดเวลาหนึ่งในอดีตที่เหตุการณ์กำลังเกิดขึ้นอยู่แล้ว จึงต้องใช้ <b>was/were + -ing</b> ส่วน <i>are sitting</i> กับ <i>have been sitting</i> เป็นรูปที่โยงกับปัจจุบัน จึงขัดกับคำว่า <i>yesterday</i>","a":2,"o":["sit","have been sitting","were sitting","are sitting"],"s":"This time yesterday we <span class='bl'>_____</span> on a coach halfway to Chiang Mai, with the rain hammering on the roof."},{"n":2,"p":"A","tag":"Present perfect with <i>since</i>","tagT":"Present perfect กับ since (ปัจจุบันกาลสมบูรณ์)","h":"<i>since</i> links a starting point in the past to the moment of speaking, so the verb has to stretch across both.","hT":"<i>since</i> ลากจากจุดเริ่มต้นในอดีตมาถึงตอนนี้ กริยาจึงต้องครอบคลุมทั้งสองช่วง","e":"<i>Since Year 4</i> gives the point where the action started and it is still true today, which is exactly what the <b>present perfect</b> is for. The past simple <i>played</i> would shut the orchestra days off in the past, but the second clause says he plays there <i>now</i>.","eT":"<i>since Year 4</i> บอกจุดที่เริ่มต้นในอดีตและเรื่องนี้ยังเป็นจริงถึงวันนี้ ซึ่งเป็นงานของ <b>present perfect</b> พอดี ถ้าใช้ past simple <i>played</i> จะกลายเป็นว่าเลิกเล่นไปแล้ว แต่ประโยคหลังบอกว่าเขายังเล่นอยู่ <i>now</i>","a":0,"o":["has played","plays","played","is playing"],"s":"Weera <span class='bl'>_____</span> in the school orchestra since Year 4, and he now plays the first violin."},{"n":3,"p":"A","tag":"<i>will</i> for a decision made as you speak","tagT":"will กับการตัดสินใจตอนที่พูด","h":"The speaker is choosing at this very second, after a pause to think.","hT":"ผู้พูดเพิ่งตัดสินใจเดี๋ยวนั้น สังเกตจากที่หยุดคิดก่อนตอบ","e":"A decision taken at the moment of speaking takes <b>will</b>, and <i>I’ll have…</i> is the fixed way of ordering food and drink in English. <i>I like</i> states a general taste, and an order needs <i>I’d like</i>; <i>I have</i> describes what is usual; and <i>I had</i> puts the drink in the past.","eT":"การตัดสินใจเดี๋ยวนั้นตอนพูดใช้ <b>will</b> และ <i>I’ll have…</i> เป็นรูปประจำที่ใช้สั่งอาหารและเครื่องดื่ม ส่วน <i>I like</i> บอกความชอบทั่ว ๆ ไป ถ้าจะสั่งต้องใช้ <i>I’d like</i> ส่วน <i>I have</i> บอกสิ่งที่ทำเป็นปกติ และ <i>I had</i> เป็นรูปอดีต","a":1,"o":["I had","I’ll have","I have","I like"],"s":"“What would you like to drink?” “Hmm, let me see… <span class='bl'>_____</span> a lime soda, please.”"},{"n":4,"p":"A","tag":"Quantifiers with uncountable nouns","tagT":"คำบอกปริมาณกับคำนามนับไม่ได้ (uncountable nouns)","h":"You cannot count grains one, two, three, so pick the quantity word made for an amount rather than a number.","hT":"เราไม่นับ <i>rice</i> เป็นหนึ่งเม็ด สองเม็ด สามเม็ด จึงต้องใช้คำที่บอกปริมาณ ไม่ใช่คำที่บอกจำนวน","e":"<i>Rice</i> is uncountable, so it takes <b>a little</b>. <i>A few</i> and <i>few</i> only go with countable plurals (<i>a few bags</i>), and <i>a little of</i> needs <i>the</i> or another determiner after it (<i>a little of the rice</i>).","eT":"<i>rice</i> เป็นคำนามนับไม่ได้ จึงใช้ <b>a little</b> ส่วน <i>a few</i> และ <i>few</i> ใช้กับคำนามนับได้พหูพจน์เท่านั้น เช่น <i>a few bags</i> และ <i>a little of</i> ต้องมี <i>the</i> หรือคำชี้เฉพาะตามหลัง เช่น <i>a little of the rice</i>","a":0,"o":["a little","a few","a little of","few"],"s":"Mum says there is only <span class='bl'>_____</span> rice left in the jar, so we should buy another bag today."},{"n":5,"p":"A","tag":"Superlative adjectives","tagT":"Superlative (การเปรียบเทียบขั้นสูงสุด)","h":"You are comparing one mountain with every other one in the country, not with just one other.","hT":"กำลังเทียบภูเขาลูกนี้กับภูเขาทั้งหมดในประเทศ ไม่ใช่เทียบกับอีกลูกเดียว","e":"Comparing one thing with all the others needs the <b>superlative</b>, and a short adjective takes <i>-est</i> with <i>the</i> in front. <i>The higher</i> compares only two things, <i>the most high</i> doubles up the marking, and <i>highest</i> cannot stand without <i>the</i>.","eT":"การเทียบสิ่งหนึ่งกับทั้งหมดต้องใช้ <b>superlative</b> และคำคุณศัพท์สั้นเติม <i>-est</i> พร้อมมี <i>the</i> นำหน้า ส่วน <i>the higher</i> ใช้เทียบของสองสิ่ง <i>the most high</i> คือใส่รูปเปรียบเทียบซ้อนกันสองชั้น และ <i>highest</i> ขาด <i>the</i> จึงใช้ไม่ได้","a":1,"o":["the higher","the highest","the most high","highest"],"s":"Doi Inthanon is <span class='bl'>_____</span> mountain in Thailand, and the air at the top feels surprisingly cold."},{"n":6,"p":"A","tag":"Adverbs of manner","tagT":"Adverb of manner (กริยาวิเศษณ์บอกลักษณะการกระทำ)","h":"The missing word tells us <i>how</i> Tul shut the door, so it describes the action, not a thing.","hT":"คำที่หายไปบอกว่าปิดประตู “อย่างไร” จึงขยายกริยา ไม่ได้ขยายคำนาม","e":"An adverb of manner describes the verb, and most are formed by adding <i>-ly</i> to the adjective. <i>Quiet</i> is the adjective (<i>a quiet door</i>), <i>more quiet</i> is a comparative adjective and <i>quietness</i> is a noun, so none of the three can describe <i>closed</i>.","eT":"adverb of manner ใช้ขยายกริยา และส่วนใหญ่สร้างจากคำคุณศัพท์ + <i>-ly</i> ส่วน <i>quiet</i> เป็นคำคุณศัพท์ เช่น <i>a quiet door</i> <i>more quiet</i> เป็นคำคุณศัพท์ขั้นกว่า และ <i>quietness</i> เป็นคำนาม ทั้งสามคำจึงมาขยาย <i>closed</i> ไม่ได้","a":3,"o":["quiet","quietness","more quiet","quietly"],"s":"Tul closed the door <span class='bl'>_____</span> so that the baby in the next room would not wake up."},{"n":7,"p":"A","tag":"Modals of obligation (must / have to / mustn’t / don’t have to)","tagT":"Modal บอกหน้าที่และข้อห้าม (must / have to / mustn’t / don’t have to)","h":"Decide whether a holiday takes a duty away or puts a ban in its place.","hT":"ลองคิดว่าวันหยุดทำให้หน้าที่หายไป หรือกลายเป็นข้อห้าม","e":"<b>Don’t have to</b> means there is no obligation, which is what a holiday gives you. <i>Mustn’t</i> and <i>can’t</i> would turn a lie-in into a rule against getting up early, and <i>didn’t have to</i> is past, but the sentence is about <i>tomorrow</i>.","eT":"<b>don’t have to</b> แปลว่าไม่จำเป็นต้องทำ ซึ่งตรงกับวันหยุดพอดี ถ้าใช้ <i>mustn’t</i> หรือ <i>can’t</i> จะกลายเป็นห้ามตื่นเช้า และ <i>didn’t have to</i> เป็นรูปอดีต แต่ประโยคนี้พูดถึง <i>tomorrow</i>","a":1,"o":["can’t","don’t have to","didn’t have to","mustn’t"],"s":"Tomorrow is a public holiday, so we <span class='bl'>_____</span> get up at half past five for once."},{"n":8,"p":"A","tag":"Present simple or present continuous?","tagT":"Present simple กับ present continuous (เรื่องที่ทำเป็นปกติเทียบกับช่วงนี้)","h":"The first half of the sentence gives his normal routine; the second half covers these few days only.","hT":"ครึ่งแรกของประโยคบอกกิจวัตรปกติ ส่วนครึ่งหลังพูดถึงแค่ช่วงสัปดาห์นี้เท่านั้น","e":"<i>Usually walks</i> is the routine, and <i>but this week</i> marks a change that will not last, which English shows with the <b>present continuous</b>. <i>Takes</i> would make the bus a second habit, while <i>took</i> and <i>was taking</i> both put the change in the past, which <i>this week</i> rules out.","eT":"<i>usually walks</i> คือกิจวัตรปกติ และ <i>but this week</i> บอกความเปลี่ยนแปลงที่เกิดแค่ช่วงนี้ ภาษาอังกฤษจึงใช้ <b>present continuous</b> ถ้าใช้ <i>takes</i> จะกลายเป็นว่าการขึ้นรถเมล์เป็นกิจวัตรอีกอย่างหนึ่ง ส่วน <i>took</i> กับ <i>was taking</i> ย้ายเรื่องไปอยู่ในอดีต ซึ่งขัดกับ <i>this week</i>","a":3,"o":["took","takes","was taking","is taking"],"s":"Krit usually walks to school, but this week he <span class='bl'>_____</span> the bus because of his broken toe."},{"n":9,"p":"A","tag":"Question words","tagT":"Question words (คำขึ้นต้นคำถาม)","h":"The reply gives a number of times each month – not a clock reading and not a length.","hT":"คำตอบบอกจำนวนครั้งต่อเดือน ไม่ได้บอกเวลาบนหน้าปัดและไม่ได้บอกความยาวนาน","e":"<i>Twice a month</i> is a frequency, and we ask about frequency with <b>how often</b>. <i>How long</i> asks for a duration, <i>how many</i> must be followed by a noun, and <i>what time</i> would be answered with something like <i>at seven o’clock</i>.","eT":"<i>twice a month</i> คือความถี่ และเราถามความถี่ด้วย <b>how often</b> ส่วน <i>how long</i> ถามระยะเวลา <i>how many</i> ต้องมีคำนามตามหลัง และ <i>what time</i> ต้องตอบเป็นเวลา เช่น <i>at seven o’clock</i>","a":2,"o":["How many","What time","How often","How long"],"s":"“<span class='bl'>_____</span> do you go to the temple with your grandmother?” “Twice a month, and we always take flowers with us.”"},{"n":10,"p":"A","tag":"Reflexive pronouns","tagT":"Reflexive pronouns (สรรพนามสะท้อนกลับ)","h":"The people doing the helping and the people being helped are the same people, so a <i>-self / -selves</i> word is needed.","hT":"คนที่ช่วยกับคนที่ถูกช่วยเป็นคนกลุ่มเดียวกัน จึงต้องใช้คำที่ลงท้ายด้วย -self หรือ -selves","e":"When the object is the same as the subject, English uses a <b>reflexive pronoun</b>, and <i>help ____</i> is the fixed way of inviting people to take food. <i>Us</i> would point at other people, <i>our</i> is a possessive, and <i>ourself</i> is not a standard form for a group.","eT":"เมื่อกรรมเป็นคนเดียวกับประธาน ภาษาอังกฤษใช้ <b>reflexive pronoun</b> และ <i>help ____</i> ก็เป็นสำนวนเชิญให้ตักอาหารเอง ถ้าใช้ <i>us</i> จะหมายถึงคนอื่น <i>our</i> เป็นคำแสดงความเป็นเจ้าของ และ <i>ourself</i> ไม่ใช่รูปมาตรฐานเมื่อพูดถึงคนหลายคน","a":0,"o":["ourselves","ourself","us","our"],"s":"Kanya’s aunt put a big bowl of mangoes on the table and told us to help <span class='bl'>_____</span>."},{"n":11,"p":"B","tag":"<i>for</i> vs <i>since</i> with the present perfect","tagT":"for กับ since ที่ใช้กับ present perfect","h":"One of these little words introduces how long something has lasted; the other introduces when it began.","hT":"คำหนึ่งใช้บอกว่านานเท่าไร อีกคำหนึ่งใช้บอกจุดที่เริ่มต้น ลองดูว่าข้อความนี้บอกอะไร","e":"<i>Since</i> must be followed by a point in time (<i>since 2019, since he was six</i>), while a stretch of time takes <b>for</b>. The other three parts are all correct: <i>has collected</i> is the right present perfect, <i>old stamps</i> is a countable plural, and <i>keeps them</i> agrees with its singular subject <i>he</i>.","eT":"<i>since</i> ต้องตามด้วยจุดเวลา เช่น <i>since 2019</i> หรือ <i>since he was six</i> ส่วนถ้าเป็นความยาวของช่วงเวลาต้องใช้ <b>for</b> อีกสามส่วนถูกหมดแล้ว <i>has collected</i> เป็น present perfect ที่ถูกต้อง <i>old stamps</i> เป็นคำนามนับได้พหูพจน์ และ <i>keeps them</i> สอดคล้องกับประธานเอกพจน์ <i>he</i>","a":2,"o":["has collected","old stamps","since five years","keeps them"],"s":"Nont <u class='u'>has collected</u><sup>A</sup> <u class='u'>old stamps</u><sup>B</sup> <u class='u'>since five years</u><sup>C</sup>, and he <u class='u'>keeps them</u><sup>D</sup> in a wooden box.","fix":"for five years"},{"n":12,"p":"B","tag":"Form after a modal verb","tagT":"รูปกริยาหลัง modal verb","h":"After this kind of helping verb the next verb stands bare, with no extra little word in front of it.","hT":"หลังกริยาช่วยกลุ่มนี้ กริยาตัวถัดไปเป็นรูปธรรมดา ไม่ต้องมีคำเล็ก ๆ นำหน้า","e":"<b>Must</b> is a modal verb, so it is followed by the bare infinitive – <i>must wear</i>, never <i>must to wear</i>. The <i>to</i> belongs to <i>have to</i> and <i>ought to</i>, which are not pure modals. The negative <i>mustn’t stand up</i> is correctly formed, and both <i>on this ride</i> and <i>until it stops</i> are natural British English.","eT":"<b>must</b> เป็น modal verb จึงตามด้วยกริยาช่องหนึ่งเปล่า ๆ คือ <i>must wear</i> ไม่ใช่ <i>must to wear</i> คำว่า <i>to</i> เป็นของ <i>have to</i> กับ <i>ought to</i> ซึ่งไม่ใช่ modal แท้ ๆ ส่วนรูปปฏิเสธ <i>mustn’t stand up</i> ถูกต้องแล้ว และทั้ง <i>on this ride</i> กับ <i>until it stops</i> ก็เป็นภาษาอังกฤษที่เจ้าของภาษาใช้จริง","a":0,"o":["You must to wear","on this ride","mustn’t stand up","until it stops"],"s":"<u class='u'>You must to wear</u><sup>A</sup> a seat belt <u class='u'>on this ride</u><sup>B</sup>, and you <u class='u'>mustn’t stand up</u><sup>C</sup> <u class='u'>until it stops</u><sup>D</sup>.","fix":"You must wear"},{"n":13,"p":"B","tag":"Adjective or adverb?","tagT":"เลือกคำคุณศัพท์หรือกริยาวิเศษณ์","h":"This part tells us how he rides, so it is describing the action and not the bicycle.","hT":"ส่วนนี้บอกว่าเขาขี่อย่างไร คือขยายกริยา ไม่ได้ขยายคำนามที่เป็นจักรยาน","e":"A word that describes <i>how</i> somebody does something must be an <b>adverb</b>, so <i>careful</i> has to become <i>carefully</i>. The rest is sound: <i>has just bought</i> is a normal present perfect with <i>just</i>, <i>a second-hand bicycle</i> is correctly hyphenated, and <i>rides it</i> matches the subject <i>he</i>.","eT":"คำที่บอกว่าใครทำสิ่งหนึ่ง “อย่างไร” ต้องเป็น <b>adverb</b> ดังนั้น <i>careful</i> ต้องเปลี่ยนเป็น <i>carefully</i> ส่วนที่เหลือถูกต้องแล้ว <i>has just bought</i> เป็น present perfect ที่ใช้กับ <i>just</i> ได้ปกติ <i>a second-hand bicycle</i> ใส่ขีดกลางถูก และ <i>rides it</i> ก็ตรงกับประธาน <i>he</i>","a":3,"o":["has just bought","a second-hand bicycle","rides it","very careful"],"s":"Tul <u class='u'>has just bought</u><sup>A</sup> <u class='u'>a second-hand bicycle</u><sup>B</sup>, and he <u class='u'>rides it</u><sup>C</sup> <u class='u'>very careful</u><sup>D</sup> along the canal path.","fix":"very carefully"},{"n":14,"p":"B","tag":"Uncountable nouns","tagT":"คำนามนับไม่ได้ (uncountable nouns)","h":"Some English nouns for knowledge and news have no plural form at all.","hT":"คำนามภาษาอังกฤษบางคำที่หมายถึงความรู้หรือข่าวสาร ไม่มีรูปพหูพจน์เลย","e":"<i>Information</i> is uncountable in English and never takes a plural <i>-s</i>; if you need to count it you say <i>pieces of information</i>. The other parts are fine: <i>a lot of</i> works with both countable and uncountable nouns, <i>about</i> is the right preposition after it, and <i>before we went in</i> keeps the phrasal verb whole.","eT":"<i>information</i> เป็นคำนามนับไม่ได้ จึงเติม <i>-s</i> ไม่ได้เลย ถ้าต้องการนับจะพูดว่า <i>pieces of information</i> ส่วนอื่นถูกต้องแล้ว <i>a lot of</i> ใช้ได้ทั้งกับคำนามนับได้และนับไม่ได้ <i>about</i> เป็นคำบุพบทที่ใช้ตามหลังพอดี และ <i>before we went in</i> ก็คงรูป phrasal verb ไว้ครบ","a":1,"o":["a lot of","informations","about the museum","before we went in"],"s":"Our teacher gave us <u class='u'>a lot of</u><sup>A</sup> <u class='u'>informations</u><sup>B</sup> <u class='u'>about the museum</u><sup>C</sup> <u class='u'>before we went in</u><sup>D</sup>.","fix":"information"},{"n":15,"p":"C","tag":"Adjectives describing people","tagT":"คำคุณศัพท์บรรยายลักษณะคน","h":"The examples are all about planning ahead and bringing the right kit.","hT":"ตัวอย่างในประโยคพูดถึงคนที่เตรียมของมาพร้อมเสมอ","e":"Somebody who plans and brings exactly what is needed is <b>organised</b>. <i>Polite</i> is about manners and <i>generous</i> about giving things away – neither is shown here – and <i>crowded</i> describes a place, not a person.","eT":"คนที่วางแผนและเตรียมของมาครบตามที่ต้องใช้ เรียกว่า <b>organised</b> ส่วน <i>polite</i> พูดถึงมารยาท และ <i>generous</i> พูดถึงการแบ่งปันให้คนอื่น ซึ่งประโยคนี้ไม่ได้บอกไว้ และ <i>crowded</i> ใช้บรรยายสถานที่ ไม่ใช่คน","a":3,"o":["crowded","polite","generous","organised"],"s":"Bee is extremely <span class='bl'>_____</span>: she always brings her own water bottle, a sun hat and a spare pencil."},{"n":16,"p":"C","tag":"Collocation: <i>make a mistake</i>","tagT":"คำที่ใช้คู่กัน (collocation): make a mistake","h":"English has one fixed partner verb for <i>a mistake</i>, and it is not the verb that means to carry out a task.","hT":"ภาษาอังกฤษมีกริยาคู่ประจำของคำว่า a mistake อยู่ตัวเดียว และไม่ใช่กริยาที่แปลว่าลงมือทำงาน","e":"The fixed collocation is <b>make a mistake</b>. Thai speakers often reach for <i>do</i> because both verbs translate as “ทำ”, but <i>do a mistake</i> is not English, and <i>took a mistake</i> and <i>got a mistake</i> are no better.","eT":"สำนวนที่ใช้คู่กันคือ <b>make a mistake</b> คนไทยมักเลือก <i>do</i> เพราะทั้งสองคำแปลว่า “ทำ” เหมือนกัน แต่ <i>do a mistake</i> ไม่มีในภาษาอังกฤษ ส่วน <i>took a mistake</i> กับ <i>got a mistake</i> ก็ไม่มีใช้เหมือนกัน","a":2,"o":["did","got","made","took"],"s":"Kanya <span class='bl'>_____</span> a careless mistake in the last question and lost two marks."},{"n":17,"p":"C","tag":"Phrasal verbs","tagT":"Phrasal verbs (กริยาวลี)","h":"The rest of the sentence shows that Fah stayed beside her brother the whole time and was not searching for him.","hT":"ส่วนที่เหลือของประโยคบอกว่าฟ้าอยู่กับน้องตลอดเวลา ไม่ได้ออกไปตามหาน้องที่หายไป","e":"<b>Look after</b> means to take care of somebody, and feeding a baby and keeping him happy is exactly that. <i>Look for</i> means to search for someone who is missing, but Fah is with her brother all morning; <i>look up</i> means to check something in a book or online, and <i>look out</i> is a warning.","eT":"<b>look after</b> แปลว่าดูแล ซึ่งตรงกับการป้อนน้องและคอยเล่นกับน้องให้อารมณ์ดี ส่วน <i>look for</i> แปลว่าออกค้นหาคนที่หายไป แต่ฟ้าอยู่กับน้องทั้งเช้า <i>look up</i> แปลว่าค้นข้อมูลในหนังสือหรือในอินเทอร์เน็ต และ <i>look out</i> ใช้เตือนให้ระวัง","a":0,"o":["looked after","looked up","looked out","looked for"],"s":"Fah <span class='bl'>_____</span> her baby brother all morning, feeding him and keeping him happy while their parents were at the market."},{"n":18,"p":"C","tag":"Word formation: noun to adjective","tagT":"การสร้างคำ (word formation): เปลี่ยนคำนามเป็นคำคุณศัพท์","h":"The gap follows <i>were</i> and sits beside <i>clear</i>, so it needs the same kind of word as <i>clear</i>.","hT":"ช่องว่างอยู่หลัง <i>were</i> และต่อจากคำว่า <i>clear</i> จึงต้องเป็นคำชนิดเดียวกับ <i>clear</i>","e":"<i>And</i> joins two words of the same class, and <i>clear</i> is an adjective, so we need the adjective <b>helpful</b>. <i>Help</i> and <i>helpfulness</i> are nouns and <i>helpfully</i> is an adverb, so none of them can sit after <i>were</i> here.","eT":"<i>and</i> เชื่อมคำชนิดเดียวกัน และ <i>clear</i> เป็นคำคุณศัพท์ จึงต้องใช้คำคุณศัพท์ <b>helpful</b> ส่วน <i>help</i> กับ <i>helpfulness</i> เป็นคำนาม และ <i>helpfully</i> เป็น adverb ทั้งสามคำจึงวางหลัง <i>were</i> ในประโยคนี้ไม่ได้","a":1,"o":["helpfully","helpful","help","helpfulness"],"s":"The instructions in the kit were clear and <span class='bl'>_____</span>, so even my eight-year-old cousin could build the model aeroplane."},{"n":19,"p":"D","tag":"Responding to an apology","tagT":"การตอบรับคำขอโทษ","h":"B is not angry; she wants her friend to stop feeling bad about a small accident.","hT":"B ไม่ได้โกรธ แต่อยากให้เพื่อนเลิกรู้สึกผิดกับเรื่องเล็ก ๆ นี้","e":"After an apology, English speakers play the problem down: <i>don’t worry</i>, <i>never mind</i>, <i>it’s all right</i>. <i>You’re welcome</i> answers <i>thank you</i>, not <i>sorry</i>, while <i>Yes, please do</i> accepts an offer and <i>Thank you very much</i> thanks somebody for a favour.","eT":"เมื่อมีคนขอโทษ เจ้าของภาษามักตอบในทางปลอบว่าไม่เป็นไร เช่น <i>don’t worry</i> <i>never mind</i> หรือ <i>it’s all right</i> ส่วน <i>you’re welcome</i> ใช้ตอบคำว่า <i>thank you</i> ไม่ใช่ตอบ <i>sorry</i> ขณะที่ <i>Yes, please do</i> ใช้ตอบรับเมื่อมีคนเสนอจะทำอะไรให้ และ <i>Thank you very much</i> ใช้ขอบคุณเมื่อมีคนช่วยเหลือ","a":0,"o":["Oh, don’t worry – it’ll dry.","Thank you very much.","You’re welcome.","Yes, please do."],"s":"<b>A:</b> I’m terribly sorry – I’ve spilled orange juice on your book.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":20,"p":"D","tag":"Replying to a request for directions","tagT":"การตอบเมื่อมีคนถามทาง","h":"B has been asked for help, so the reply has to agree and then say which way to go.","hT":"B ถูกถามทาง คำตอบจึงต้องรับก่อน แล้วบอกเส้นทางให้ชัดเจน","e":"A request that begins <i>Could you tell me…?</i> asks for help, so B agrees and then gives the directions. <i>Yes, it’s a very nice post office</i> only comments on the building, <i>No, thank you – I’ve already posted my letter</i> answers an offer, and <i>Yes, I went there last Tuesday</i> answers a question about the past – none of the three tells the stranger where to go.","eT":"คำขอที่ขึ้นต้นว่า <i>Could you tell me…?</i> คือการขอความช่วยเหลือ B จึงตอบรับแล้วบอกเส้นทางให้ ส่วน <i>Yes, it’s a very nice post office</i> เป็นแค่การชมตัวอาคาร <i>No, thank you – I’ve already posted my letter</i> เป็นคำตอบเวลามีคนเสนอจะช่วยทำให้ และ <i>Yes, I went there last Tuesday</i> เป็นคำตอบของคำถามเรื่องอดีต ทั้งสามตัวเลือกจึงไม่ได้บอกทางให้คนถามเลย","a":1,"o":["No, thank you – I’ve already posted my letter.","Of course. Go straight on and turn left at the hospital.","Yes, I went there last Tuesday.","Yes, it’s a very nice post office."],"s":"<b>A:</b> Excuse me, could you tell me the way to the post office?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":21,"p":"D","tag":"Replying to a suggestion with <i>Shall we…?</i>","tagT":"การตอบคำชวนที่ขึ้นต้นด้วย Shall we…?","h":"A has suggested staying put, so the natural reply agrees and adds a reason.","hT":"A ชวนให้รออยู่ที่นี่ก่อน คำตอบที่เป็นธรรมชาติคือเห็นด้วยแล้วบอกเหตุผล","e":"<i>Shall we…?</i> makes a suggestion, and the usual reply accepts or refuses it – <i>Good idea</i> does both jobs by agreeing and explaining why. <i>Yes, it stopped an hour ago</i> contradicts “It’s pouring”, <i>No, thanks, I’ve already had one</i> answers an offer of food or drink, and <i>Sorry, I don’t know where it is</i> answers a question about a place.","eT":"<i>Shall we…?</i> ใช้ชวนหรือเสนอ คำตอบปกติจึงเป็นการรับหรือปฏิเสธ คำว่า <i>Good idea</i> ทำหน้าที่ทั้งเห็นด้วยและบอกเหตุผล ส่วน <i>Yes, it stopped an hour ago</i> ขัดกับประโยค “It’s pouring” <i>No, thanks, I’ve already had one</i> เป็นคำตอบเวลามีคนยื่นของกินให้ และ <i>Sorry, I don’t know where it is</i> เป็นคำตอบของคำถามที่ถามหาสถานที่","a":3,"o":["No, thanks, I’ve already had one.","Sorry, I don’t know where it is.","Yes, it stopped an hour ago.","Good idea – I haven’t got an umbrella."],"s":"<b>A:</b> It’s pouring with rain. Shall we wait here until it stops?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":22,"p":"D","tag":"Turning down an invitation politely","tagT":"การปฏิเสธคำชวนอย่างสุภาพ","h":"B cannot come, so look for the reply that says no kindly and gives a reason.","hT":"B ไปไม่ได้ จึงต้องเลือกคำตอบที่ปฏิเสธอย่างนุ่มนวลและบอกเหตุผลด้วย","e":"A polite refusal in English usually has two halves: a friendly opening and an excuse. <i>Yes, I’m afraid I can’t</i> contradicts itself, <i>Never mind, it doesn’t matter</i> comforts somebody who is disappointed instead of answering an invitation, and <i>Thank you, the pool is very nice</i> only praises the pool without saying yes or no.","eT":"การปฏิเสธอย่างสุภาพในภาษาอังกฤษมักมีสองส่วน คือเปิดด้วยคำที่แสดงว่าอยากไป แล้วบอกเหตุผลที่ไปไม่ได้ ส่วน <i>Yes, I’m afraid I can’t</i> ขัดกันเองในประโยคเดียว <i>Never mind, it doesn’t matter</i> ใช้ปลอบคนที่กำลังเสียดาย ไม่ใช่ตอบคำชวน และ <i>Thank you, the pool is very nice</i> เป็นแค่คำชมสระว่ายน้ำ ไม่ได้ตอบว่าไปหรือไม่ไป","a":2,"o":["Never mind, it doesn’t matter.","Yes, I’m afraid I can’t.","I’d love to, but I’ve got a dentist’s appointment at four.","Thank you, the pool is very nice."],"s":"<b>A:</b> Hi, Pim. It’s Weera. Can you come to the pool at four this afternoon?<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":23,"p":"E","tag":"Preposition of time","tagT":"คำบุพบทบอกเวลา","h":"The gap is followed by a stretch of time, not the moment it started.","hT":"หลังช่องว่างเป็นช่วงเวลาที่กินระยะ ไม่ใช่จุดที่เริ่มต้น","e":"<i>Three days</i> is a length of time, and English marks a length with <b>for</b>. <i>Since</i> needs the point where something began (<i>since Monday</i>), <i>during</i> needs a period that has already been named (<i>during the festival</i>), and <i>within three days</i> would mean “before three days are up”, which is not what the villagers do.","eT":"<i>three days</i> เป็นความยาวของเวลา ภาษาอังกฤษจึงใช้ <b>for</b> ส่วน <i>since</i> ต้องตามด้วยจุดที่เริ่มต้น เช่น <i>since Monday</i> และ <i>during</i> ต้องตามด้วยช่วงเวลาที่เอ่ยถึงไว้แล้ว เช่น <i>during the festival</i> ขณะที่ <i>within three days</i> จะแปลว่า “ก่อนครบสามวัน” ซึ่งไม่ตรงกับเรื่องนี้","a":1,"o":["since","for","during","within"],"s":"","t":0},{"n":24,"p":"E","tag":"Linking word: contrast","tagT":"คำเชื่อมแสดงความขัดแย้ง","h":"The second idea goes against the weak points listed in the sentence before it.","hT":"ความคิดในประโยคหลังขัดกับข้อเสียที่บอกไว้ในประโยคก่อนหน้า","e":"The first sentence lists drawbacks and the next one gives a big advantage, so the text needs a contrast marker: <b>however</b>. <i>Therefore</i> would make the advantage a result of the drawbacks, and the other two add or illustrate rather than contrast.","eT":"ประโยคแรกบอกข้อเสีย ประโยคถัดมาบอกข้อดีที่สำคัญ จึงต้องใช้คำเชื่อมแสดงความขัดแย้งคือ <b>however</b> ถ้าใช้ <i>therefore</i> จะกลายเป็นว่าข้อดีนั้นเป็นผลมาจากข้อเสีย และอีกสองคำใช้เพิ่มเติมหรือยกตัวอย่าง ไม่ได้แสดงความขัดแย้ง","a":2,"o":["In addition","For example","However","Therefore"],"s":"","t":0},{"n":25,"p":"E","tag":"Vocabulary in context","tagT":"คำศัพท์ตามบริบท","h":"The bridge is taken down every year, yet the villagers are quite happy about it.","hT":"สะพานถูกรื้อทุกปี แต่ชาวบ้านก็ยังรู้สึกดีกับเรื่องนี้","e":"The next sentence shows that the villagers like rebuilding the bridge, so nobody <b>complains</b> – nobody says they are unhappy. The other three verbs do not fit the pattern <i>… about that</i> with this meaning.","eT":"ประโยคถัดไปบอกว่าชาวบ้านชอบการสร้างสะพานใหม่ จึงไม่มีใคร <b>complains</b> คือไม่มีใครบ่นหรือแสดงความไม่พอใจ ส่วนกริยาอีกสามตัวใช้กับโครงสร้าง <i>… about that</i> ในความหมายแบบนี้ไม่ได้","a":3,"o":["arrives","decides","answers","complains"],"s":"","t":0},{"n":26,"p":"E","tag":"Verb + gerund after <i>enjoy</i>","tagT":"กริยาที่ตามด้วย gerund หลังคำว่า enjoy","h":"<i>Enjoy</i> belongs to the same family as <i>finish</i> and <i>avoid</i>, and they all want the same form of the verb after them.","hT":"<i>enjoy</i> อยู่กลุ่มเดียวกับ <i>finish</i> กับ <i>avoid</i> ซึ่งต้องใช้รูปกริยาตามหลังแบบเดียวกัน","e":"<i>Enjoy</i> is always followed by the <b>-ing form</b>. <i>To build</i> is the pattern after verbs like <i>want</i>, and a bare <i>build</i> or a past form <i>built</i> cannot follow another main verb here.","eT":"<i>enjoy</i> ต้องตามด้วยกริยารูป <b>-ing</b> เสมอ ส่วน <i>to build</i> เป็นรูปที่ตามหลังกริยาอย่าง <i>want</i> และ <i>build</i> เปล่า ๆ หรือรูปอดีต <i>built</i> ก็มาต่อหลังกริยาหลักอีกตัวแบบนี้ไม่ได้","a":0,"o":["building","to build","built","build"],"s":"","t":0},{"n":27,"p":"F","tag":"Reading for detail","tagT":"การอ่านจับรายละเอียด","h":"Go to the price list and check the age limit written at the end of it.","hT":"ไปดูรายการราคา แล้วเช็กเงื่อนไขอายุที่เขียนไว้ท้ายบรรทัดนั้น","e":"The price list says a canal boat ride is “20 baht for children under twelve”, and a child of ten is under twelve. The figure 50 is the adult fare, while 30 and 15 are the prices of noodles and iced tea.","eT":"รายการราคาเขียนไว้ว่า “20 baht for children under twelve” และเด็กอายุสิบขวบก็อายุต่ำกว่าสิบสองปี ส่วนเลข 50 คือค่าโดยสารของผู้ใหญ่ และ 30 กับ 15 เป็นราคาก๋วยเตี๋ยวกับชาเย็น","a":3,"o":["15 baht","50 baht","30 baht","20 baht"],"s":"How much does a canal boat ride cost for a child of ten?","t":1},{"n":28,"p":"F","tag":"Vocabulary in context","tagT":"คำศัพท์ตามบริบท","h":"Look at the sentence just before it: what do the volunteers hand out free of charge?","hT":"อ่านประโยคก่อนหน้า แล้วดูว่าในงานนี้แจกอะไรให้ฟรีโดยไม่เก็บเงิน","e":"The sentence before names banana leaves and a candle, and the next sentence says they cost nothing, so <i>materials</i> must mean the stuff a boat is folded
