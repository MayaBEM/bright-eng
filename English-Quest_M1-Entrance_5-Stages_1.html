erything the trains have swallowed: ninety-four umbrellas, a cello in a hard case, a wedding dress still in its bag, and a tin trunk <b>__23__</b> owner has never been traced.","The clerk who looks after the room, Khun Prasit, keeps a system of his own. Anything with a name inside it is parcelled up and posted within the week. <b>__24__</b> a thousand suitcases, he claims he can tell a passenger’s trade from the handle alone, and the staff who used to tease him about it have stopped betting against him.","Fewer than half the items are ever claimed, and a few have sat on the top shelf longer than Khun Prasit has worked there; <b>__25__</b>, nothing is thrown away before a year is up. He says the hardest part of the job is not the clutter but the <b>__26__</b>: on a bad morning four people in a row will describe a bag that is simply not there."]},{"t":"The Ladder We Took Down","tT":"บันไดที่เราถอดลง","p":["For nine years our chess club kept a ladder on the wall of the reading room: thirty-two names on wooden tiles, the strongest at the top. Beat the player above you and the tiles changed places. I painted the board myself, and for a long time I was proud of it.","The ladder worked, in the sense that it did what it had been designed to do. Attendance was high and the games were fierce. What took me longer to notice was who had stopped coming. The beginners did not leave in a temper; they simply discovered other things to do on a Thursday. A tile near the bottom is a public statement, renewed every week, and few twelve-year-olds want to make it.","So last term we took the ladder down and put up a different board: one tile per member, and beside every name a space for whatever that player had learnt to do since September – an opening, an endgame, the habit of writing the moves down. There is no order to the names. I will admit that the new board looks untidy, and that one or two of our strongest players found it faintly ridiculous.","They may yet be proved right. Our best player is still our best player, and nothing on the wall says so. But eighteen beginners joined in October, and in March sixteen were still coming – a figure the old ladder never managed. I would rather run a club that is hard to rank than one that is easy to leave."]}],"items":[{"n":1,"p":"A","tag":"Inversion after a negative adverbial","tagT":"Inversion หลังคำบอกเวลาเชิงปฏิเสธ","h":"The sentence opens with a negative time expression, so the main clause cannot keep its ordinary word order.","hT":"ประโยคนี้ขึ้นต้นด้วยวลีบอกเวลาเชิงปฏิเสธ ประโยคหลักจึงเรียงคำแบบปกติไม่ได้ ต้องสลับตำแหน่งกริยาช่วยกับประธาน","e":"When a negative adverbial such as <i>Not until the bell rang</i> is placed at the front, the auxiliary moves in front of the subject: <i>did Arisa realise</i>. <i>Arisa realised</i> keeps ordinary statement order; <i>will Arisa realise</i> cannot stand beside the past tense <i>rang</i>; and <i>was Arisa realising</i> is inverted but forces a state verb into the continuous, which English does not do here.","eT":"เมื่อเอาวลีบอกเวลาเชิงปฏิเสธอย่าง <i>Not until the bell rang</i> มาขึ้นต้นประโยค ต้องทำ <b>inversion</b> คือย้ายกริยาช่วยมาวางหน้าประธาน จึงได้ <i>did Arisa realise</i> ถ้าตอบ <i>Arisa realised</i> คือเรียงคำแบบประโยคบอกเล่าธรรมดาซึ่งผิด <i>will Arisa realise</i> ก็ขัดกับ <i>rang</i> ที่เป็นอดีต และ <i>was Arisa realising</i> แม้จะสลับคำมาแล้ว แต่เอากริยาบอกสภาวะอย่าง <i>realise</i> ไปใส่รูป continuous ซึ่งภาษาอังกฤษไม่ใช้แบบนั้น","a":0,"o":["did Arisa realise","was Arisa realising","will Arisa realise","Arisa realised"],"s":"Not until the bell rang <span class='bl'>_____</span> that she had misread the final question."},{"n":2,"p":"A","tag":"Mixed conditional (past condition, present result)","tagT":"Mixed conditional (เงื่อนไขในอดีต ผลในปัจจุบัน)","h":"The missed test is over and done with, but the result being described belongs to the present.","hT":"การสอบที่พลาดไปจบลงแล้ว แต่ผลที่พูดถึงคือสถานะในปัจจุบัน ไม่ใช่ในอดีต สองส่วนของประโยคจึงอยู่ต่างเวลากัน","e":"The <i>if</i>-clause is past (<i>hadn’t missed</i>) but <i>now</i> makes the result present, so the mixed pattern <i>would</i> + <i>be</i> + <i>-ing</i> is needed. <i>Would have studied</i> would describe a finished past result, which clashes with <i>now</i>, and <i>will be studying</i> cannot follow an <i>if</i>-clause that is already unreal.","eT":"อนุประโยค <i>if</i> เป็นอดีต (<i>hadn’t missed</i>) แต่คำว่า <i>now</i> บอกว่าผลอยู่ในปัจจุบัน จึงต้องใช้ <b>mixed conditional</b> คือ <i>would</i> + <i>be</i> + <i>-ing</i> ถ้าตอบ <i>would have studied</i> จะหมายถึงผลที่จบไปแล้วในอดีต ซึ่งขัดกับคำว่า <i>now</i> และ <i>will be studying</i> ก็ตามหลังอนุประโยค <i>if</i> ที่เป็นเรื่องไม่จริงไม่ได้","a":0,"o":["would be studying","will be studying","had been studying","would have studied"],"s":"If Siri hadn’t missed the entrance test in March, she <span class='bl'>_____</span> at the science school now."},{"n":3,"p":"A","tag":"Participle clause (passive)","tagT":"Participle clause รูป passive","h":"Ask yourself who is doing the looking and what is being looked at – a bridge cannot look at anything.","hT":"ถามตัวเองว่าใครเป็นคนมอง และอะไรเป็นสิ่งที่ถูกมอง สะพานมองอะไรเองไม่ได้ ดังนั้นต้องเป็นรูปที่ถูกกระทำ","e":"The subject of the main clause is <i>the new footbridge</i>, and a bridge is looked at rather than looking, so the passive participle <i>Seen</i> is correct. <i>Seeing</i> and <i>Having seen</i> are active and would mean the bridge was doing the looking, and <i>To see</i> cannot introduce a clause of this kind at all.","eT":"ประธานของประโยคหลักคือ <i>the new footbridge</i> ซึ่งเป็นสิ่งที่ <b>ถูกมอง</b> ไม่ใช่ผู้มอง จึงต้องใช้ participle รูป passive คือ <i>Seen</i> ส่วน <i>Seeing</i> กับ <i>Having seen</i> เป็นรูป active ซึ่งจะกลายเป็นว่าสะพานเป็นคนมอง ซึ่งไม่ได้ความ และ <i>To see</i> ก็ขึ้นต้นอนุประโยคแบบนี้ไม่ได้เลย","a":1,"o":["To see","Seen","Seeing","Having seen"],"s":"<span class='bl'>_____</span> from the top of the hill, the new footbridge looks almost too thin to take anyone’s weight."},{"n":4,"p":"A","tag":"Modal perfect with a passive infinitive","tagT":"Modal perfect + passive infinitive (การคาดเดาอดีตในรูป passive)","h":"You are reasoning from the date to an almost certain conclusion about the past – and the letter did not write itself.","hT":"เรากำลังสรุปจากหลักฐาน (ปีที่ระบุบนจดหมาย) ว่าเรื่องนี้เกิดขึ้นในอดีตอย่างค่อนข้างแน่นอน และจดหมายเขียนตัวเองไม่ได้","e":"A confident deduction about the past takes <i>must</i> + <i>have</i> + past participle, and because the letter was written <i>by</i> somebody the infinitive must be passive. <i>Should have been written</i> would express an unfulfilled obligation rather than a deduction, and <i>must be written</i> points at a present requirement, not back to 1932.","eT":"การคาดเดาอดีตอย่างมั่นใจใช้ <i>must</i> + <i>have</i> + past participle และเพราะมีคำว่า <i>by</i> บอกผู้กระทำ infinitive จึงต้องเป็นรูป passive ด้วย ถ้าตอบ <i>should have been written</i> จะกลายเป็นความหมายว่า “ควรจะถูกเขียน แต่ไม่ได้เขียน” ซึ่งไม่ใช่การคาดเดา และ <i>must be written</i> ก็เป็นข้อบังคับในปัจจุบัน ไม่ได้ย้อนไปถึงปี 1932","a":2,"o":["must have written","should have been written","must have been written","must be written"],"s":"The letter is dated 1932, so it <span class='bl'>_____</span> by my great-grandmother rather than by my grandmother."},{"n":5,"p":"A","tag":"Cleft sentence: a clause used as the subject","tagT":"ประโยค cleft ที่ใช้อนุประโยคเป็นประธาน","h":"The opening clause is itself the subject of <i>was</i>, so it needs the pronoun that stands for “the thing that…”.","hT":"อนุประโยคข้างหน้าทำหน้าที่เป็นประธานของ <i>was</i> เอง จึงต้องขึ้นต้นด้วยคำสรรพนามที่แทนความหมายว่า “สิ่งที่…”","e":"In a cleft sentence the whole clause acts as the subject, and the pronoun that introduces it is <i>What</i>: <i>What Krit did next was to ring the coach</i>. <i>Which</i> and <i>That</i> can only follow a noun they refer back to, and there is no such noun here; <i>How</i> would ask about manner, which does not fit <i>did next</i>.","eT":"ในประโยค <b>cleft</b> อนุประโยคทั้งก้อนทำหน้าที่เป็นประธาน และคำที่ใช้ขึ้นต้นคือ <i>What</i> จึงได้ <i>What Krit did next was to ring the coach</i> ส่วน <i>Which</i> และ <i>That</i> ต้องมีคำนามอยู่ข้างหน้าให้อ้างถึง แต่ประโยคนี้ไม่มีคำนามนั้น และ <i>How</i> ใช้ถามถึงวิธี ซึ่งไม่เข้ากับ <i>did next</i>","a":2,"o":["That","Which","What","How"],"s":"<span class='bl'>_____</span> Krit did next was to ring the coach before anybody else heard the news."},{"n":6,"p":"A","tag":"The unreal past after <i>as though</i>","tagT":"Unreal past หลัง <i>as though</i>","h":"<i>As though</i> introduces a comparison that is not true, and after a past-tense main verb English steps the verb back one stage.","hT":"<i>As though</i> นำการเปรียบเทียบที่ไม่เป็นความจริง และเมื่อกริยาหลักเป็นอดีต ภาษาอังกฤษจะถอยรูปกริยาไปอีกขั้นหนึ่งเพื่อบอกว่าไม่จริง","e":"<i>As though</i> describes an impression rather than a fact, so the verb shifts back into the unreal past: <i>as though she had all the time in the world</i>. <i>Has</i> is a present form and sits badly in a sentence told in the past, and <i>would have</i> would point to something still to come rather than to how Fah looked as she walked out.","eT":"<i>As though</i> ใช้บอกความรู้สึกหรือภาพที่เห็น ไม่ใช่ความจริง กริยาจึงถอยไปเป็น <b>unreal past</b> ได้เป็น <i>as though she had all the time in the world</i> ส่วน <i>has</i> เป็นรูปปัจจุบัน จึงขัดกับการเล่าเรื่องในอดีตที่ <i>strolled</i> วางไว้ และ <i>would have</i> จะกลายเป็นเรื่องที่ยังไม่เกิด ไม่ใช่ภาพที่เห็นตอนที่ Fah เดินออกมา","a":3,"o":["has","is having","would have","had"],"s":"Fah strolled out of the examination hall as though she <span class='bl'>_____</span> all the time in the world."},{"n":7,"p":"A","tag":"Connectors of precaution and condition","tagT":"คำเชื่อมแสดงการกันไว้ก่อนและเงื่อนไข","h":"You cannot know yet whether the hall will be cold, so the jumper is being taken as a safeguard – not as a condition, and not as a purpose.","hT":"ยังไม่รู้ว่าห้องจะเปิดแอร์หรือไม่ จึงเอาเสื้อไปเตรียมพร้อมไว้ล่วงหน้า ไม่ใช่การวางเงื่อนไข และไม่ใช่จุดประสงค์","e":"<i>In case</i> introduces a precaution against a possibility, which is exactly why the jumper is being taken. <i>Unless</i> would reverse the logic, and <i>so that</i> would turn the cold hall into the purpose of taking the jumper.","eT":"<i>In case</i> ใช้บอกการเตรียมตัวเผื่อไว้สำหรับสิ่งที่อาจเกิดขึ้น ซึ่งตรงกับเหตุผลที่ต้องเอาเสื้อไป ถ้าตอบ <i>unless</i> ความหมายจะกลับกันทั้งหมด และถ้าตอบ <i>so that</i> จะกลายเป็นว่าเอาเสื้อไปเพื่อให้ห้องเปิดแอร์ ซึ่งไม่ได้ความ","a":1,"o":["provided that","in case","so that","unless"],"s":"Take a jumper with you <span class='bl'>_____</span> the hall turns out to be air-conditioned."},{"n":8,"p":"A","tag":"Verb patterns: <i>stop</i> + infinitive or <i>-ing</i>","tagT":"รูปแบบกริยา: <i>stop</i> + to + V กับ <i>stop</i> + V-ing","h":"Decide whether the gap tells you what Nont gave up doing, or why he broke off.","hT":"ลองคิดดูว่าช่องนี้บอกว่า Nont เลิกทำสิ่งที่กำลังทำอยู่ หรือบอกเหตุผลที่เขาหยุด","e":"<i>Stop</i> + <i>to</i> + infinitive gives the reason for stopping, while <i>stop</i> + <i>-ing</i> names the activity that is given up. Nont was running, so he cannot already have been tying his lace; he broke off in order to tie it. <i>Tying</i> would therefore describe something he was never doing, and <i>tie</i> and <i>to be tying</i> are not forms that can follow <i>stop</i> at all.","eT":"<i>stop</i> + to + V ใช้บอกเหตุผลที่หยุด ส่วน <i>stop</i> + V-ing ใช้บอกสิ่งที่เลิกทำ ตอนนั้น Nont กำลังวิ่งอยู่ จึงเป็นไปไม่ได้ที่เขาจะกำลังผูกเชือกรองเท้าอยู่ก่อนหน้านั้น เขาหยุดวิ่งเพื่อจะผูกเชือก ดังนั้นถ้าตอบ <i>tying</i> จะกลายเป็นสิ่งที่เขาไม่ได้ทำอยู่เลย ส่วน <i>tie</i> เฉย ๆ กับ <i>to be tying</i> ก็ไม่ใช่รูปที่ตามหลัง <i>stop</i> ได้เลย","a":0,"o":["to tie","tying","tie","to be tying"],"s":"Nont was running second when he stopped <span class='bl'>_____</span> his shoelace, and by the time he stood up he was fourth."},{"n":9,"p":"A","tag":"Formal register: conditional inversion","tagT":"ภาษาทางการ: การทำ inversion ในประโยคเงื่อนไข","h":"In formal writing an <i>if</i>-clause can drop the <i>if</i> and put the auxiliary first instead.","hT":"ในภาษาเขียนที่เป็นทางการ ประโยคเงื่อนไขสามารถตัดคำ <i>if</i> ออก แล้วยกกริยาช่วยขึ้นมาไว้หน้าประธานแทนได้","e":"<i>Should you require…</i> is the formal inversion of <i>If you require…</i>, and it suits a letter to a committee. <i>Were</i> would need <i>to require</i> after it (<i>Were you to require…</i>), while English does not build an inverted conditional with <i>did</i> or with <i>would</i> at all.","eT":"<i>Should you require…</i> คือรูป inversion ที่เป็นทางการของ <i>If you require…</i> ซึ่งเหมาะกับจดหมายที่เขียนถึงคณะกรรมการ ถ้าตอบ <i>Were</i> ต้องมี <i>to require</i> ตามหลัง คือ <i>Were you to require…</i> ส่วน <i>Did</i> กับ <i>Would</i> นั้น ภาษาอังกฤษไม่เอามาทำ inversion ในประโยคเงื่อนไขเลย","a":1,"o":["Did","Should","Were","Would"],"s":"Pim ended her letter to the scholarship committee: “<span class='bl'>_____</span> you require any further documents, I shall send them at once.”"},{"n":10,"p":"A","tag":"Fixed idiom with <i>character</i>","tagT":"สำนวนตายตัวที่ใช้กับคำว่า <i>character</i>","h":"This is a fixed idiom meaning “not the way that person normally behaves”.","hT":"นี่คือสำนวนตายตัว แปลว่า “ไม่ใช่นิสัยปกติของคนคนนั้น”","e":"English fixes this idea as <i>out of character</i>, and the second clause (<i>he normally volunteers</i>) confirms the meaning. <i>Off</i> belongs to other fixed phrases (<i>off duty</i>, <i>off form</i>) but not to this one, and <i>outside</i> and <i>away from</i> are ordinary prepositions that the idiom does not use.","eT":"ภาษาอังกฤษใช้สำนวนตายตัวว่า <i>out of character</i> และประโยคหลัง (<i>he normally volunteers</i>) ก็ยืนยันความหมายนี้ ส่วน <i>off</i> ไปคู่กับสำนวนอื่น เช่น <i>off duty</i> หรือ <i>off form</i> แต่ไม่ใช้กับสำนวนนี้ และ <i>outside</i> กับ <i>away from</i> ก็เป็นคำบุพบททั่วไปที่สำนวนนี้ไม่ใช้","a":3,"o":["off","outside","away from","out of"],"s":"Weera’s refusal to take the penalty was <span class='bl'>_____</span> character; he normally volunteers before anyone else."},{"n":11,"p":"B","tag":"Correlative pair beginning with <i>neither</i>","tagT":"คู่คำที่ขึ้นต้นด้วย <i>neither</i>","h":"<i>Neither</i> is the first half of a fixed pair, so the word joining the two items must be its partner, not the everyday alternative.","hT":"<i>Neither</i> เป็นครึ่งแรกของคู่คำที่ตายตัว คำที่ใช้เชื่อมสองสิ่งนั้นจึงต้องเป็นคู่ของมัน ไม่ใช่คำเชื่อมธรรมดาที่ใช้กันทั่วไป","e":"<i>Neither</i> must be completed by <i>nor</i>, giving <i>neither the coach fares nor the entrance fees</i>. The other three parts are correct: <i>covers</i> agrees with the singular <i>grant</i>, <i>which is why</i> comments on the whole previous clause, and <i>has to bring</i> agrees with <i>each pupil</i>.","eT":"<i>Neither</i> ต้องจับคู่กับ <i>nor</i> จึงได้ <i>neither the coach fares nor the entrance fees</i> ส่วนอีกสามส่วนถูกต้องแล้ว คือ <i>covers</i> สอดคล้องกับ <i>grant</i> ที่เป็นเอกพจน์ <i>which is why</i> ใช้ขยายใจความของอนุประโยคก่อนหน้าทั้งก้อน และ <i>has to bring</i> ก็สอดคล้องกับ <i>each pupil</i>","a":1,"o":["covers","or","which is why","has to bring"],"s":"The travel grant <u class='u'>covers</u><sup>A</sup> neither the coach fares <u class='u'>or</u><sup>B</sup> the entrance fees, <u class='u'>which is why</u><sup>C</sup> each pupil <u class='u'>has to bring</u><sup>D</sup> 200 baht on the day.","fix":"nor"},{"n":12,"p":"B","tag":"Perfect infinitive after <i>seem</i>","tagT":"Perfect infinitive หลัง <i>seem</i>","h":"<i>For weeks</i> stretches back from now, so the infinitive after <i>seems</i> must reach back in time too.","hT":"<i>For weeks</i> นับย้อนจากตอนนี้กลับไปในอดีต ดังนั้น infinitive ที่ตามหลัง <i>seems</i> ก็ต้องเป็นรูปที่ย้อนเวลาได้ด้วย","e":"The bicycle has been there over a stretch of time leading up to now, so <i>seems</i> takes the perfect infinitive <i>to have been</i>. The other three parts are correct: <i>leaning</i> is a reduced relative clause, <i>seems</i> agrees with <i>the bicycle</i>, and <i>can remember</i> is the natural modal here.","eT":"จักรยานคันนี้อยู่ที่นั่นต่อเนื่องมาจนถึงตอนนี้ ดังนั้น <i>seems</i> ต้องตามด้วย <b>perfect infinitive</b> คือ <i>to have been</i> ส่วนอีกสามส่วนถูกต้องแล้ว คือ <i>leaning</i> เป็นอนุประโยคขยายนามที่ย่อมาจาก <i>which is leaning</i> ส่วน <i>seems</i> ก็สอดคล้องกับ <i>the bicycle</i> และ <i>can remember</i> ก็เป็นกริยาช่วยที่ใช้ได้ตามปกติ","a":2,"o":["leaning","seems","to be","can remember"],"s":"The bicycle <u class='u'>leaning</u><sup>A</sup> against the gate <u class='u'>seems</u><sup>B</sup> <u class='u'>to be</u><sup>C</sup> there for weeks, and nobody in the village <u class='u'>can remember</u><sup>D</sup> who left it.","fix":"to have been"},{"n":13,"p":"B","tag":"Passive voice: a subject that is acted on","tagT":"Passive voice: เมื่อประธานเป็นผู้ถูกกระทำ","h":"Ask which of the four parts makes the building the doer of an action, when in fact the work was done to it.","hT":"ลองดูว่าส่วนไหนทำให้ตัวอาคารกลายเป็นผู้กระทำ ทั้งที่ความจริงอาคารเป็นสิ่งที่ถูกกระทำ","e":"A warehouse is put up by somebody, so the verb must be passive: <i>the building was put up in 1911</i>. The other three parts are correct: <i>still has</i> and <i>by the door</i> are ordinary present description, and <i>which puzzles</i> correctly comments on the whole situation just described.","eT":"โรงเก็บข้าวเป็นสิ่งที่ถูกสร้างขึ้นโดยคน กริยาจึงต้องเป็นรูป <b>passive</b> คือ <i>the building was put up in 1911</i> ส่วนอีกสามส่วนถูกต้องแล้ว คือ <i>still has</i> กับ <i>by the door</i> เป็นการบรรยายสภาพปัจจุบันตามปกติ และ <i>which puzzles</i> ก็ใช้ขยายใจความทั้งหมดที่กล่าวมาก่อนหน้าได้ถูกต้อง","a":3,"o":["still has","by the door","which puzzles","was putting up"],"s":"The arts centre <u class='u'>still has</u><sup>A</sup> iron hooks in the ceiling and a weighing machine <u class='u'>by the door</u><sup>B</sup>, <u class='u'>which puzzles</u><sup>C</sup> visitors until they learn that the building <u class='u'>was putting up</u><sup>D</sup> in 1911 as a rice warehouse.","fix":"was put up"},{"n":14,"p":"B","tag":"The fixed pattern <i>It is high time</i> + past","tagT":"โครงสร้างตายตัว <i>It is high time</i> + กริยาช่องสอง","h":"One of the four parts follows an expression that insists on a past form, even though the complaint is about right now.","hT":"มีส่วนหนึ่งที่ตามหลังสำนวนซึ่งบังคับให้ใช้กริยารูปอดีต แม้เรื่องที่ต่อว่าจะเป็นเรื่องของตอนนี้","e":"<i>It is high time</i> is followed by a past form even though the complaint is about right now, so <i>tells</i> must become <i>told</i>. The other three parts are correct: <i>although</i> introduces the contrast, <i>seems</i> agrees with <i>nobody</i>, and <i>to be the one</i> is the natural infinitive after <i>keen</i>.","eT":"<i>It is high time</i> ต้องตามด้วยกริยารูปอดีต แม้เรื่องที่ต่อว่าจะเป็นเรื่องของตอนนี้ ดังนั้น <i>tells</i> ต้องเปลี่ยนเป็น <i>told</i> ส่วนอีกสามส่วนถูกต้องแล้ว คือ <i>although</i> ใช้แสดงความขัดแย้ง <i>seems</i> สอดคล้องกับ <i>nobody</i> และ <i>to be the one</i> ก็เป็น infinitive ที่ตามหลัง <i>keen</i> ได้ตามปกติ","a":0,"o":["tells","although","seems","to be the one"],"s":"It is high time somebody <u class='u'>tells</u><sup>A</sup> the committee that the pavilion roof leaks, <u class='u'>although</u><sup>B</sup> nobody <u class='u'>seems</u><sup>C</sup> keen <u class='u'>to be the one</u><sup>D</sup> who does it.","fix":"told"},{"n":15,"p":"C","tag":"Precise adjective from context","tagT":"การเลือก adjective ให้ตรงกับบริบท","h":"The detail about the gorge tells you what sort of problem the path presents, and it is not simply a tiring walk.","hT":"รายละเอียดเรื่องเหวข้างทางบอกว่าทางเดินนี้มีปัญหาแบบไหน ซึ่งไม่ใช่แค่เดินแล้วเหนื่อย","e":"A path that has fallen away into a gorge is dangerous in a hidden way, which is exactly what <i>treacherous</i> means. <i>Exhausting</i>, <i>winding</i> and <i>overgrown</i> are all possible descriptions of a path, but none of them matches the evidence given after the dash.","eT":"ทางเดินที่พังหายลงไปในเหวคือทางที่อันตรายแบบไม่ทันระวัง ซึ่งตรงกับความหมายของ <i>treacherous</i> พอดี ส่วน <i>exhausting</i> <i>winding</i> และ <i>overgrown</i> ก็ใช้บรรยายทางเดินได้ทั้งนั้น แต่ไม่ตรงกับหลักฐานที่ให้ไว้หลังเครื่องหมายขีดกลาง","a":1,"o":["winding","treacherous","exhausting","overgrown"],"s":"The guide warned us that the path was <span class='bl'>_____</span> – in places it had fallen away into the gorge altogether."},{"n":16,"p":"C","tag":"Adverb–adjective collocation","tagT":"Adverb ที่ใช้คู่กับ adjective","h":"He plainly does know how his answer went down, and English pairs <i>aware</i> with one particular adverb when the knowledge is uncomfortable.","hT":"เขารู้ตัวดีอยู่แล้วว่าคำตอบของเขาเป็นอย่างไร และคำว่า <i>aware</i> มี adverb ตัวหนึ่งที่ภาษาอังกฤษมักใช้คู่กันเมื่อสิ่งที่รู้นั้นทำให้รู้สึกไม่สบายใจ","e":"<i>Painfully aware</i> is the standard collocation for knowing something uncomfortable, and the blush and the retreat show exactly that. <i>Hardly aware</i> is good English, but it would mean he barely noticed, which going red rules out; <i>strongly</i> and <i>heavily</i> are not among the adverbs English puts with <i>aware</i>.","eT":"<i>Painfully aware</i> เป็นคำที่ภาษาอังกฤษใช้คู่กันเมื่อรู้ตัวในเรื่องที่ทำให้รู้สึกแย่ ซึ่งตรงกับอาการหน้าแดงแล้วนั่งลงของ Tul ส่วน <i>hardly aware</i> เป็นภาษาอังกฤษที่ถูกต้อง แต่แปลว่า “แทบไม่รู้ตัว” ซึ่งขัดกับการที่เขาหน้าแดง และ <i>strongly</i> กับ <i>heavily</i> ก็ไม่ใช่ adverb ที่ภาษาอังกฤษเอามาคู่กับ <i>aware</i>","a":2,"o":["strongly","hardly","painfully","heavily"],"s":"Tul went red and sat down, <span class='bl'>_____</span> aware that his answer had not convinced anybody in the room."},{"n":17,"p":"C","tag":"Phrasal verb: choosing the particle","tagT":"Phrasal verb: การเลือก particle","h":"Which particle turns this verb into “stop resisting”?","hT":"ต้องเลือก particle ที่ทำให้กริยานี้มีความหมายว่า “ยอมแพ้ เลิกต่อต้าน”","e":"<i>Give in to</i> means to stop resisting pressure, which is what the head teacher refused to do. <i>Give up</i> means to abandon something, <i>give off</i> means to release a smell or heat, and <i>give away</i> means to hand something over or reveal a secret.","eT":"<i>Give in to</i> แปลว่ายอม เลิกต่อต้านแรงกดดัน ซึ่งเป็นสิ่งที่ครูใหญ่ปฏิเสธที่จะทำ ส่วน <i>give up</i> แปลว่าเลิกทำ <i>give off</i> แปลว่าส่งกลิ่นหรือความร้อนออกมา และ <i>give away</i> แปลว่ายกให้ไปหรือเผยความลับ ทั้งสามตัวจึงไม่เข้ากับประโยคนี้","a":0,"o":["give in","give off","give away","give up"],"s":"The head teacher refused to <span class='bl'>_____</span> to pressure from parents who wanted the trip cancelled."},{"n":18,"p":"C","tag":"Word formation: adjective from a verb","tagT":"การสร้างคำ: adjective จาก verb","h":"The gap follows <i>so</i> and describes the argument itself, so the word class matters as much as the meaning.","hT":"ช่องว่างอยู่หลังคำว่า <i>so</i> และทำหน้าที่ขยายตัว argument เอง ดังนั้นต้องดูชนิดของคำให้ถูกด้วย ไม่ใช่ดูแค่ความหมาย","e":"<i>So</i> + adjective is needed here, and the adjective describing an argument that convinces people is <i>persuasive</i>. <i>Persuasion</i> is a noun, <i>persuaded</i> would mean the argument had itself been talked into something, and <i>persuadable</i> is an adjective but means “easily convinced”, which an argument cannot be.","eT":"ตำแหน่งนี้ต้องเป็น <i>so</i> + adjective และ adjective ที่ใช้บรรยายข้อโต้แย้งที่ทำให้คนเชื่อได้คือ <i>persuasive</i> ส่วน <i>persuasion</i> เป็นคำนาม <i>persuaded</i> จะกลายเป็นว่าตัวข้อโต้แย้งเองถูกโน้มน้าว ซึ่งไม่ได้ความ และ <i>persuadable</i> เป็น adjective ก็จริง แต่แปลว่า “ถูกโน้มน้าวได้ง่าย” ซึ่งข้อโต้แย้งเป็นอย่างนั้นไม่ได้","a":3,"o":["persuasion","persuadable","persuaded","persuasive"],"s":"Bee’s closing argument was so <span class='bl'>_____</span> that even those who disagreed admitted she had a point."},{"n":19,"p":"D","tag":"Responding to an apology","tagT":"การตอบรับคำขอโทษ","h":"A has just apologised, so B should play the problem down and offer a way round it.","hT":"A เพิ่งขอโทษ ดังนั้น B ควรบอกว่าไม่เป็นไร แล้วเสนอทางออกให้","e":"<i>Not to worry</i> accepts the apology lightly and then solves the problem, which is what English speakers do here. The other three answer a different speech act altogether: an offer of help, a word of thanks, and a request for permission.","eT":"<i>Not to worry</i> เป็นการรับคำขอโทษแบบสบาย ๆ แล้วเสนอทางแก้ต่อ ซึ่งเป็นสิ่งที่เจ้าของภาษาพูดในสถานการณ์นี้ ส่วนอีกสามข้อเป็นการตอบคนละเรื่องกันเลย คือตอบคำเสนอความช่วยเหลือ ตอบคำขอบคุณ และปฏิเสธการขออนุญาต","a":2,"o":["I’d rather you didn’t, if you don’t mind.","You’re welcome – do ask again any time.","Not to worry – we can easily move our rehearsal to Sunday.","That’s very kind of you – I’ll let the others know."],"s":"<b>A:</b> I’m terribly sorry – I seem to have double-booked the hall for Saturday.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":20,"p":"D","tag":"Softening a disagreement","tagT":"การแสดงความไม่เห็นด้วยอย่างนุ่มนวล","h":"B is not convinced, but a polite speaker softens a disagreement instead of flatly contradicting.","hT":"B ยังไม่เห็นด้วย แต่คนที่พูดสุภาพจะใช้วิธีค้านแบบนุ่ม ๆ ไม่ค้านตรง ๆ","e":"The key concedes something (<i>I can see the appeal</i>) before hedging the objection, which is how a polite B1–B2 speaker disagrees. <i>I couldn’t agree more</i> means complete agreement, so it contradicts the complaint that follows it, and the remaining two replies belong to other situations altogether: accepting something offered, and comforting somebody after a mistake.","eT":"ข้อที่ถูกจะยอมรับบางส่วนก่อน (<i>I can see the appeal</i>) แล้วจึงค้านแบบเลี่ยง ๆ ซึ่งเป็นวิธีที่คนพูดภาษาอังกฤษระดับ B1–B2 ใช้แสดงความไม่เห็นด้วยอย่างสุภาพ ส่วน <i>I couldn’t agree more</i> แปลว่าเห็นด้วยอย่างยิ่ง จึงขัดกับข้อความต่อว่าที่ตามมาทันที และอีกสองข้อก็เป็นคำตอบของสถานการณ์อื่นไปเลย คือรับสิ่งที่เขายื่นให้ กับปลอบคนที่ทำอะไรผิดพลาด","a":3,"o":["Never mind – it could have happened to anybody.","I don’t mind if I do, thank you very much.","I couldn’t agree more – six is a dreadful time to start.","I can see the appeal, though I do wonder whether anyone would turn up that early."],"s":"<b>A:</b> So we’re all agreed – the fun run should start at six in the morning.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":21,"p":"D","tag":"Polite requests for information","tagT":"การขอข้อมูลอย่างสุภาพ","h":"B needs information, so the request must point outwards to the member of staff, not back at B.","hT":"B เป็นฝ่ายที่ต้องการข้อมูล ประโยคจึงต้องเป็นการขอให้อีกฝ่ายบอก ไม่ใช่ B เสนอตัวจะบอกเอง","e":"<i>Would you mind telling me…</i> is the standard polite request for information from a stranger behind a counter. The three distractors are all grammatical but push the information the wrong way – they offer to tell A, instead of asking A.","eT":"<i>Would you mind telling me…</i> เป็นรูปประโยคมาตรฐานที่ใช้ขอข้อมูลอย่างสุภาพจากเจ้าหน้าที่ที่ไม่รู้จักกัน ส่วนตัวเลือกอีกสามข้อถูกไวยากรณ์ แต่ส่งข้อมูลผิดทิศทาง คือกลายเป็น B เสนอจะบอก A แทนที่จะถาม A","a":1,"o":["Would you like me to tell you when the next one leaves?","In that case, would you mind telling me when the next one leaves?","I don’t mind telling you that the next one leaves at 5.40.","You wouldn’t rather I told you about the next one, would you?"],"s":"<b>A:</b> I’m afraid the 4.15 to Chiang Mai has been cancelled.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":22,"p":"D","tag":"Register: replying to a casual invitation","tagT":"ระดับภาษา: การตอบคำเชิญแบบไม่เป็นทางการ","h":"The invitation is casual and spoken; match its level and leave yourself a little room.","hT":"คำเชิญนี้เป็นภาษาพูดแบบสบาย ๆ ต้องตอบให้ระดับภาษาเท่ากัน และเผื่อทางให้ตัวเองไว้เล็กน้อย","e":"<i>Nothing special</i> and <i>Do come if you’re free</i> set a relaxed, spoken tone, and the key matches it while leaving the commitment loose. <i>I should be delighted to accept your kind invitation</i> is perfectly correct English, but it belongs to a written reply to a wedding or an official function, so it sounds comic here.","eT":"คำว่า <i>Nothing special</i> และ <i>Do come if you’re free</i> ทำให้น้ำเสียงของคำเชิญเป็นภาษาพูดแบบสบาย ๆ ข้อที่ถูกจึงตอบในระดับเดียวกันและเผื่อไว้ว่าอาจไปได้ไม่แน่ ส่วน <i>I should be delighted to accept your kind invitation</i> เป็นภาษาอังกฤษที่ถูกต้องทุกอย่าง แต่เป็นสำนวนในจดหมายตอบรับงานแต่งหรืองานพิธีการ พอมาใช้ตอบเพื่อนจึงฟังดูตลก","a":0,"o":["That sounds lovely – I’ll do my best to look in after work.","I should be delighted to accept your kind invitation.","Thank you, but I’d rather you hadn’t asked me.","Yes, please – could you put me down for two tickets?"],"s":"<b>A:</b> We’re having a few people round on Friday – nothing special. Do come if you’re free.<br/><b>B:</b> <span class='bl'>_____</span>"},{"n":23,"p":"E","tag":"Relative pronoun showing possession","tagT":"Relative pronoun ที่ใช้บอกความเป็นเจ้าของ","h":"The gap is followed straight away by a noun, and that noun belongs to the trunk, so the linking word must mark possession.","hT":"คำที่เติมในช่องนี้มีคำนามตามมาทันที และคำนามนั้นเป็นของกระเป๋าใบนั้น จึงต้องใช้คำเชื่อมที่บอกความเป็นเจ้าของ","e":"<i>Owner</i> belongs to the trunk, so the relative pronoun must be the possessive one: <i>a tin trunk whose owner has never been traced</i>. British English uses <i>whose</i> of things as well as of people. <i>Which</i> and <i>that</i> cannot be followed directly by a noun, and <i>of which</i> would work only in the other order – <i>the owner of which</i>.","eT":"คำว่า <i>owner</i> เป็นของกระเป๋าใบนั้น จึงต้องใช้ relative pronoun ที่บอกความเป็นเจ้าของ ได้เป็น <i>a tin trunk whose owner has never been traced</i> และภาษาอังกฤษแบบบริติชใช้ <i>whose</i> กับสิ่งของได้ ไม่ใช่เฉพาะกับคน ส่วน <i>which</i> กับ <i>that</i> วางไว้หน้าคำนามตรง ๆ ไม่ได้ และ <i>of which</i> ต้องสลับลำดับเป็น <i>the owner of which</i> จึงจะใช้ได้","a":3,"o":["that","which","of which","whose"],"s":"","t":0},{"n":24,"p":"E","tag":"Participle clause showing an earlier action","tagT":"Participle clause ที่บอกการกระทำที่เกิดก่อน","h":"The clause has no subject of its own, so it borrows the subject of the main clause – and the person named there did the work himself, before he could boast about it.","hT":"อนุประโยคนี้ไม่มีประธานของตัวเอง ต้องยืมประธานจากประโยคหลัก และคนคนนั้นเป็นผู้ลงมือทำเอง ไม่ใช่ผู้ถูกทำ ทั้งยังทำมาก่อนที่จะพูดอย่างนั้นได้","e":"The subject of the main clause is <i>he</i>, and he did the work himself before he could make any such claim, so the clause needs an active perfect participle. <i>Having been labelled</i> and <i>Labelled</i> are both passive and would make the clerk the thing that was labelled, and <i>To have labelled</i> cannot introduce a clause of this kind at all.","eT":"ประธานของประโยคหลักคือ <i>he</i> และเขาเป็นคนลงมือทำเองมาก่อนที่จะพูดอย่างนั้นได้ อนุประโยคนี้จึงต้องเป็น participle รูป perfect ที่เป็น active ส่วน <i>Having been labelled</i> กับ <i>Labelled</i> เป็นรูป passive ทั้งคู่ ซึ่งจะกลายเป็นว่าเจ้าหน้าที่คนนั้นถูกติดป้ายเสียเอง และ <i>To have labelled</i> ก็ขึ้นต้นอนุประโยคแบบนี้ไม่ได้เลย","a":0,"o":["Having labelled","To have labelled","Labelled","Having been labelled"],"s":"","t":0},{"n":25,"p":"E","tag":"Connector of concession","tagT":"คำเชื่อมแบบยอมรับก่อนแล้วค้าน","h":"Things nobody collects would normally be binned, yet the second half says they are kept anyway, so the two halves pull against each other.","hT":"ของที่ไม่มีใครมารับคืน ปกติก็น่าจะถูกทิ้งไป แต่ครึ่งหลังบอกว่ายังเก็บไว้อยู่ดี สองครึ่งของประโยคจึงขัดกันอยู่","e":"The first half says most of the room is never claimed; the second half says it is kept anyway, so the connector must concede the first point and then set something against it, which is what <i>all the same</i> does. <i>For that reason</i> would make the neglect the cause of the keeping, <i>in other words</i> would make the second half a restatement of the first, and <i>by comparison</i> needs two things being measured against each other.","eT":"ครึ่งแรกบอกว่าของส่วนใหญ่ในห้องไม่มีใครมารับคืน ครึ่งหลังบอกว่าก็ยังเก็บไว้อยู่ดี คำเชื่อมจึงต้องเป็นแบบที่ยอมรับข้อความแรกก่อน แล้วค้านด้วยข้อความที่สวนทางกัน ซึ่งตรงกับ <i>all the same</i> ถ้าตอบ <i>for that reason</i> จะกลายเป็นว่าการที่ไม่มีใครมารับเป็นเหตุให้ต้องเก็บไว้ <i>in other words</i> จะกลายเป็นการพูดซ้ำความเดิม และ <i>by comparison</i> ต้องมีสองสิ่งให้เทียบกัน ซึ่งประโยคนี้ไม่มี","a":2,"o":["by comparison","in other words","all the same","for that reason"],"s":"","t":0},{"n":26,"p":"E","tag":"Noun chosen from the whole text","tagT":"การเลือกคำนามโดยดูจากเนื้อเรื่องทั้งหมด","h":"The colon gives the example – four people who have come for a bag that is not there – so the gap names what the clerk has to meet in those people, not a cost and not a risk.","hT":"เครื่องหมาย colon ยกตัวอย่างไว้ให้แล้ว คือคนสี่คนที่มาถามหากระเป๋าซึ่งไม่ได้อยู่ที่นั่น ช่องนี้จึงต้องเป็นสิ่งที่เจ้าหน้าที่ต้องรับมือจากคนเหล่านั้น ไม่ใช่เรื่องค่าใช้จ่ายและไม่ใช่ความเสี่ยง","e":"The example after the colon is four people in a row who are told their bag is not there, so what the clerk finds hardest is their <i>disappointment</i>. <i>Paperwork</i> and <i>expense</i> are never mentioned, nothing in the room is dangerous, and the sentence has already ruled out the clutter.","eT":"ตัวอย่างที่ตามหลัง colon คือคนสี่คนติด ๆ กันที่ต้องได้ยินว่ากระเป๋าของตัวเองไม่ได้อยู่ที่นั่น สิ่งที่เจ้าหน้าที่บอกว่าหนักใจที่สุดจึงคือ <i>disappointment</i> คือความผิดหวังของคนเหล่านั้น ส่วน <i>paperwork</i> กับ <i>expense</i> เนื้อเรื่องไม่ได้พูดถึงเลย ในห้องนั้นก็ไม่มีอะไรอันตราย และตัวประโยคเองก็ตัดเรื่องของที่กองรวมกันออกไปแล้ว","a":1,"o":["paperwork","disappointment","danger","expense"],"s":"","t":0},{"n":27,"p":"F","tag":"Reading for detail","tagT":"การอ่านจับรายละเอียด","h":"Re-read the short sentence in the first paragraph about beating the player above you.","hT":"กลับไปอ่านประโยคสั้น ๆ ในย่อหน้าแรก ที่บอกว่าถ้าชนะคนที่อยู่เหนือคุณแล้วจะเกิดอะไรขึ้น","e":"The first paragraph says that if you beat the player above you, “the tiles changed places” – the two swapped. Nothing suggests a jump to the top, and every member already had a tile.","eT":"ย่อหน้าแรกบอกว่าถ้าชนะคนที่อยู่เหนือคุณ “the tiles changed places” คือป้ายสองอันสลับที่กัน ไม่มีข้อความใดบอกว่าได้ขึ้นไปอยู่บนสุดเลย และสมาชิกทุกคนก็มีป้ายของตัวเองอยู่แล้ว","a":1,"o":["The writer repainted both names on the board.","The two wooden tiles exchanged places.","The winner moved straight to the top of the ladder.","The winner was given a tile of his or her own."],"s":"On the old board, what happened when a member beat the player ranked immediately above them?","t":1},{"n":28,"p":"F","tag":"Vocabulary in context","tagT":"ความหมายของคำตามบริบท","h":"In this sentence the word sits beside <i>attendance was high</i> as a sign that the system worked, so it is not a criticism.","hT":"ในประโยคนี้คำดังกล่าวอยู่คู่กับ <i>attendance was high</i> ซึ่งเป็นข้อดีที่แสดงว่าระบบได้ผล จึงไม่ใช่คำติ","e":"<i>Fierce</i> here is listed with high attendance as proof that the ladder succeeded, so it means the games were keenly contested. The writer rules out the angry sense in the next sentence: the beginners “did not leave in a temper”.","eT":"คำว่า <i>fierce</i> ในที่นี้ถูกยกมาคู่กับการที่คนมาเล่นกันเยอะ เพื่อแสดงว่าระบบบันไดได้ผล จึงหมายถึงการแข่งที่สู้กันเต็มที่ และผู้เขียนก็ตัดความหมายเรื่องอารมณ์ร้ายออกไปในประโยคถัดมา เมื่อบอกว่าเด็กใหม่ “did not leave in a temper”","a":2,"o":["rushed","frightening","hard-fought","bad-tempered"],"s":"The word <i>fierce</i> in paragraph 2 is closest in meaning to…","t":1},{"n":29,"p":"F","tag":"Inference","tagT":"การตีความสิ่งที่ผู้เขียนบอกเป็นนัย","h":"Notice that the writer painted the board himself, and notice how long he says it took him to spot the problem.","hT":"สังเกตว่าผู้เขียนเป็นคนทาสีบอร์ดนั้นด้วยตัวเอง และสังเกตว่าเขาบอกว่าตัวเองใช้เวลานานแค่ไหนจึงเห็นปัญหา","e":"He made the board with his own hands and “for a long time I was proud of it”, which is fondness; and he says himself that noticing who had stopped coming “took me longer”. The text never mentions money or a vote, and it states that the ladder “did what it had been designed to do”, so he did understand it.","eT":"เขาทำบอร์ดนั้นด้วยมือตัวเอง และบอกว่า “for a long time I was proud of it” ซึ่งก็คือความผูกพัน และเขาเองก็ยอมรับว่าการสังเกตว่าใครหายไป “took me longer” ส่วนเรื่องเงินหรือการโหวตนั้นเนื้อเรื่องไม่ได้พูดถึงเลย และเนื้อเรื่องยังบอกว่าบันไดนั้น “did what it had been designed to do” แสดงว่าเขาเข้าใจระบบนี้ดี","a":0,"o":["He was attached to it, and slow to see the effect it was having on the beginners.","He disliked it from the start but was outvoted by the members.","He had never properly understood how it was meant to work.","He kept it only because it brought money into the club."],"s":"What does the writer imply about his own feelings towards the old ladder?","t":1},{"n":30,"p":"F","tag":"Attitude and purpose","tagT":"ท่าทีและจุดประสงค์ของผู้เขียน","h":"He admits his critics may be right, then gives a number and states a preference – weigh those two moves against each other.","hT":"เขายอมรับว่าคนที่ไม่เห็นด้วยอาจถูก แล้วยกตัวเลขขึ้นมาและบอกสิ่งที่เขาเลือก ให้ชั่งน้ำหนักสองอย่างนี้ด้วยกัน","e":"“They may yet be proved right” concedes the doubt, but the retention figure and the closing preference show he has made up his mind. He is therefore neither dismissive of his critics nor still undecided, and plainly not sorry the ladder went, since he says he would rather run the club as it is now.","eT":"ประโยค “They may yet be proved right” เป็นการยอมรับข้อสงสัย แต่ตัวเลขจำนวนเด็กใหม่ที่ยังอยู่และประโยคปิดท้ายที่บอกว่าเขาเลือกอะไร แสดงว่าเขาตัดสินใจแล้ว เขาจึงไม่ได้ปัดข้อค้านของคนอื่นทิ้ง ไม่ได้ลังเลอยู่ และไม่ได้เสียดายบันไดอันเก่าเลย เพราะเขาบอกเองว่าเขาเลือกจะบริหารชมรมแบบที่เป็นอยู่ตอนนี้","a":3,"o":["Still undecided about whether the new board should stay.","Certain that his critics have nothing useful to say.","Sorry that the old board was ever taken down.","Honest about the doubts, but convinced the change was worth making."],"s":"Which best describes the writer’s attitude in the final paragraph?","t":1}]}];</script>

var L="en";
function t(k,a,b){var s=(T[L][k]||k); if(a!=null)s=s.replace("%1",a); if(b!=null)s=s.replace("%2",b); return s;}
var $=function(s){return document.querySelector(s)};
function el(tag,c,h){var e=document.createElement(tag); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}

var G={xp:0, stars:[0,0,0,0,0], best:[null,null,null,null,null]};
var S=null;

/* ---------------- sound ---------------- */
var snd=true, actx=null;
function beep(f,d,type,vol){
  if(!snd) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,actx.currentTime);
    g.gain.linearRampToValueAtTime(vol||0.07, actx.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d+0.02);
  }catch(e){}
}
function sOk(){beep(660,.1,"triangle");setTimeout(function(){beep(990,.16,"triangle")},90)}
function sNo(){beep(220,.2,"sawtooth",.05)}
function sTap(){beep(520,.05,"sine",.04)}

/* ---------------- i18n paint ---------------- */
function paintStatic(){
  document.querySelectorAll("[data-t]").forEach(function(e){ e.textContent=t(e.dataset.t); });
  document.documentElement.lang = L==="th" ? "th" : "en";
}
$("#lang").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  L=b.dataset.l; sTap();
  $("#lang").querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x.dataset.l===L)});
  paintStatic(); renderMap();
  if(!$("#quiz").classList.contains("hidden")) draw();
  if(!$("#result").classList.contains("hidden")) finish(S.timeup,true);
});
$("#bSound").onclick=function(){ snd=!snd; this.textContent=snd?"🔊":"🔇"; if(snd) sTap(); };

/* ---------------- map ---------------- */
function renderMap(){
  var m=$("#map"); m.innerHTML="";
  PAPERS.forEach(function(p,i){
    var n=el("div","node"); n.style.setProperty("--c",AC[i]);
    var rail=el("div","rail");
    rail.appendChild(el("div","dot",String(p.n)));
    rail.appendChild(el("div","wire"));
    n.appendChild(rail);
    var c=el("div","card"); c.style.setProperty("--c",AC[i]);
    var top=el("div","top");
    top.appendChild(el("div","cef","CEFR "+p.cefr));
    var st=el("div","stars");
    for(var k=0;k<3;k++) st.appendChild(el("i",k<G.stars[i]?"on":"","✿"));
    top.appendChild(st);
    c.appendChild(top);
    c.appendChild(el("h2",null, L==="th"? p.nameT : p.name));
    c.appendChild(el("p",null, BLURB[L][i]));
    c.appendChild(el("div","best","30 "+t("questions")+" · "+p.parts.length+" "+t("parts")));
    c.appendChild(el("div","best", G.best[i]==null ? t("notyet") : t("best")+": "+G.best[i]+" / "+p.total));
    var row=el("div","row");
    var b1=el("button","btn go",t("quest")); b1.onclick=function(){start(i,"quest")};
    var b2=el("button","btn ghost",t("timed")+" · "+p.mins+" min"); b2.onclick=function(){start(i,"timed")};
    row.appendChild(b1); row.appendChild(b2); c.appendChild(row);
    n.appendChild(c); m.appendChild(n);
  });
  $("#tXp").textContent=G.xp;
  $("#tStars").textContent=G.stars.reduce(function(a,b){return a+b},0)+"/15";
  $("#cXp").textContent="🌱 "+G.xp;
}


/* ---------------- start ---------------- */
function start(i,mode){
  var p=PAPERS[i];
  S={i:i,p:p,mode:mode,idx:0,ans:p.items.map(function(){return null}),
     hint:p.items.map(function(){return false}),chk:p.items.map(function(){return false}),
     streak:0,bestStreak:0,gain:0,t0:Date.now(),left:p.mins*60,timer:null,fin:false,timeup:false};
  document.documentElement.style.setProperty("--acc",AC[i]);
  $("#home").classList.add("hidden"); $("#result").classList.add("hidden");
  $("#quiz").classList.remove("hidden"); $("#bQuit").classList.remove("hidden");
  $("#cStreak").classList.toggle("hidden", mode!=="quest");
  $("#cTime").classList.toggle("hidden", mode!=="timed");
  if(mode==="timed"){ tick(); S.timer=setInterval(tick,1000); }
  sTap(); draw(); window.scrollTo(0,0);
}
function tick(){
  if(S.left<=0){ clearInterval(S.timer); S.timer=null; S.timeup=true; finish(true); return; }
  S.left--;
  var m=Math.floor(S.left/60), s=S.left%60;
  var c=$("#cTime"); c.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  c.classList.toggle("warn", S.left<=300);
}

/* ---------------- draw ---------------- */
function draw(){
  var p=S.p, it=p.items[S.idx], pt=null;
  for(var i=0;i<p.parts.length;i++) if(p.parts[i].id===it.p) pt=p.parts[i];
  var pe=$("#part");
  pe.querySelector("b").textContent=(L==="th"?pt.tT:pt.t);
  pe.querySelector("span").textContent=pt.r;
  pe.querySelector(".ins").textContent=(L==="th"?pt.iT:pt.i);

  var th=$("#thost"); th.innerHTML="";
  if(it.t!=null){
    var tx=p.texts[it.t], panel=el("div","txt");
    panel.appendChild(el("h4",null,tx.t+(L==="th"&&tx.tT&&tx.tT!==tx.t?" <span style='color:var(--dim2);font-size:13px;font-weight:400'>· "+tx.tT+"</span>":"")));
    var bd=el("div","bd");
    tx.p.forEach(function(x){ bd.appendChild(el("p",null,x)); });
    panel.appendChild(bd);
    var f=el("button","btn ghost fold","▲");
    f.onclick=function(){ var c=panel.classList.toggle("min"); f.textContent=c?"▼":"▲"; };
    th.appendChild(panel); th.appendChild(f);
  }

  var card=$("#qcard"); card.innerHTML="";
  var qh=el("div","qh");
  qh.appendChild(el("div","qn",it.n+"."));
  qh.appendChild(el("div","st",it.s));
  card.appendChild(qh);

  var shown = S.mode==="quest" && S.chk[S.idx];
  var ops=el("div","ops");
  it.o.forEach(function(o,k){
    var b=el("button","op");
    b.appendChild(el("span","k",LET[k]));
    b.appendChild(el("span",null,o));
    if(S.ans[S.idx]===k) b.classList.add("sel");
    if(shown){
      b.disabled=true;
      if(k===it.a){ b.className="op ok"; b.appendChild(el("span","mk",t("correct"))); }
      else if(S.ans[S.idx]===k){ b.className="op no"; b.appendChild(el("span","mk",t("yourAns"))); }
    } else { b.onclick=function(){ sTap(); S.ans[S.idx]=k; draw(); }; }
    ops.appendChild(b);
  });
  card.appendChild(ops);

  if(S.hint[S.idx]){
    var hb=el("div","hint");
    hb.appendChild(el("b",null,t("hint")));
    hb.appendChild(el("span",null, L==="th"? it.hT : it.h));
    card.appendChild(hb);
  }
  if(shown){
    var ok=S.ans[S.idx]===it.a;
    var fb=el("div","fb "+(ok?"y":"n"));
    var lb=el("div","lb",(ok?"✓ ":"✕ ")+t(ok?"correct":"wrong"));
    if(ok && it.gain) lb.appendChild(el("span","xp","+"+it.gain+" XP"));
    fb.appendChild(lb);
    var body=(L==="th"? it.eT : it.e) + (it.fix? " <b>"+it.fix+"</b>" : "");
    fb.appendChild(el("div",null,body));
    fb.appendChild(el("div","sk",t("skill")+": "+(L==="th"? it.tagT : it.tag)));
    card.appendChild(fb);
  }

  drawActs(shown); drawGrid();
  $("#pBar").style.width=((S.idx+1)/p.items.length*100)+"%";
  $("#cStreak").textContent="☀️ "+S.streak;
  $("#cXp").textContent="🌱 "+(G.xp+S.gain);
}

function drawActs(shown){
  var a=$("#acts"); a.innerHTML="";
  var last=S.idx===S.p.items.length-1;
  if(S.idx>0){ var bk=el("button","btn ghost",t("back")); bk.onclick=function(){go(-1)}; a.appendChild(bk); }
  if(!S.hint[S.idx] && !shown){
    var h=el("button","btn ghost",t("hintCost"));
    h.onclick=function(){ S.hint[S.idx]=true; S.gain=Math.max(-G.xp, S.gain-5); sTap(); draw(); };
    a.appendChild(h);
  }
  if(S.mode==="quest"){
    if(!shown){
      var c=el("button","btn",t("check")); c.disabled=S.ans[S.idx]===null;
      c.onclick=function(){ check(); };
      a.appendChild(c);
    } else {
      var n=el("button","btn", last? t("report") : t("next"));
      n.onclick=function(){ last? finish(false) : go(1); };
      a.appendChild(n);
    }
  } else {
    var sk=el("button","btn ghost", S.ans[S.idx]===null? t("skip") : t("next"));
    sk.onclick=function(){ last? finish(false) : go(1); };
    a.appendChild(sk);
    if(last){ var f=el("button","btn",t("finish")); f.onclick=function(){finish(false)}; a.appendChild(f); }
  }
}
function check(){
  var it=S.p.items[S.idx], ok=S.ans[S.idx]===it.a;
  S.chk[S.idx]=true;
  if(ok){
    S.streak++; if(S.streak>S.bestStreak) S.bestStreak=S.streak;
    var bonus = S.streak>=5 ? 10 : S.streak>=3 ? 5 : 0;
    it.gain = 10 + bonus;
    S.gain += it.gain;
    sOk();
    if(S.streak>=3) burst(t("combo",S.streak));
  } else { S.streak=0; it.gain=0; sNo(); }
  draw();
}
function burst(msg){
  var b=$("#burst"); b.textContent=msg; b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
}
function drawGrid(){
  var g=$("#grid"); g.innerHTML="";
  S.p.items.forEach(function(it,i){
    var b=el("button",null,String(it.n));
    if(S.mode==="quest" && S.chk[i]) b.classList.add(S.ans[i]===it.a?"ok":"no");
    else if(S.ans[i]!==null) b.classList.add("done");
    if(i===S.idx) b.classList.add("cur");
    b.onclick=function(){ S.idx=i; sTap(); draw(); window.scrollTo(0,0); };
    g.appendChild(b);
  });
}
function go(d){ S.idx=Math.min(S.p.items.length-1,Math.max(0,S.idx+d)); draw(); window.scrollTo(0,0); }

/* ---------------- result ---------------- */
function finish(timeup, repaintOnly){
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  var p=S.p, right=0,wrong=0,skip=0, byPart={}, miss={};
  p.items.forEach(function(it,i){
    var a=S.ans[i], ok=a===it.a;
    if(a===null) skip++; else if(ok) right++; else wrong++;
    if(!byPart[it.p]) byPart[it.p]={n:0,r:0};
    byPart[it.p].n++; if(ok) byPart[it.p].r++;
    if(!ok){ var key=(L==="th"?it.tagT:it.tag); miss[key]=(miss[key]||0)+1; }
  });
  var pct=Math.round(right/p.items.length*100);
  var stars = pct>=80?3 : pct>=60?2 : pct>=40?1 : 0;
  var rank = pct>=80?t("r4") : pct>=60?t("r3") : pct>=40?t("r2") : t("r1");
  var secs = S.mode==="timed" ? (p.mins*60 - S.left) : Math.round((Date.now()-S.t0)/1000);

  if(!repaintOnly && !S.fin){
    S.fin=true;
    if(S.mode==="timed") S.gain += right*10;
    G.xp = Math.max(0, G.xp + S.gain);
    G.stars[S.i]=Math.max(G.stars[S.i],stars);
    if(G.best[S.i]==null || right>G.best[S.i]) G.best[S.i]=right;
    sWin();
  }

  var h=$("#result"); h.innerHTML="";
  var r=el("div","res");
  if(timeup) r.appendChild(el("div","kicker",t("timeup")));
  r.appendChild(el("div","big", right+"<small> / "+p.items.length+"</small>"));
  var bs=el("div","bigstars");
  for(var k=0;k<3;k++) bs.appendChild(el("i",k<stars?"on":"","✿"));
  r.appendChild(bs);
  r.appendChild(el("div","rank",rank+" · "+pct+"%"));
  h.appendChild(r);

  var f=el("div","facts");
  [[right,t("right")],[wrong,t("wrongN")],[skip,t("skipped")],[Math.round(secs/60)+" min",t("time")]]
    .forEach(function(x){ var d=el("div"); d.appendChild(el("div","v",String(x[0]))); d.appendChild(el("div","k",x[1])); f.appendChild(d); });
  h.appendChild(f);
  h.appendChild(el("div","revise","<b>🌱 "+t("earned")+": "+S.gain+" XP</b>"
    + (S.bestStreak>1? " &nbsp;·&nbsp; ☀️ "+S.bestStreak : "")));

  h.appendChild(el("h3","sec",t("byPart")));
  h.appendChild(el("p","note",t("byPartN")));
  p.parts.forEach(function(pt){
    var v=byPart[pt.id]; if(!v) return;
    var q=v.r/v.n, row=el("div","prow");
    row.appendChild(el("div","nm",(L==="th"?pt.tT:pt.t)));
    row.appendChild(el("div","sc",v.r+" / "+v.n));
    var m=el("div","mtr"), bar=el("i", q>=.75?"":(q>=.45?"m":"l"));
    bar.style.width=Math.round(q*100)+"%"; m.appendChild(bar); row.appendChild(m);
    h.appendChild(row);
  });

  var keys=Object.keys(miss).sort(function(a,b){return miss[b]-miss[a]||a.localeCompare(b)});
  var rv=el("div","revise");
  if(keys.length){
    rv.appendChild(el("b",null,"🎯 "+t("revise")));
    var ul=el("ul");
    keys.slice(0,12).forEach(function(x){
      ul.appendChild(el("li",null,x+(miss[x]>1?" <span style='color:var(--dim2)'>× "+miss[x]+"</span>":"")));
    });
    rv.appendChild(ul);
  } else {
    rv.appendChild(el("b",null,"🏆 "+t("nothing")));
    rv.appendChild(el("p",null,t("perfect")));
  }
  h.appendChild(rv);

  h.appendChild(el("h3","sec",t("all")));
  h.appendChild(el("p","note",t("allN")));
  p.items.forEach(function(it,i){
    var a=S.ans[i], ok=a===it.a, box=el("div","rev"), bt=el("button");
    bt.appendChild(el("span","dt "+(a===null?"sk":(ok?"ok":"no")), a===null?"–":(ok?"✓":"✕")));
    bt.appendChild(el("span",null,"<b>"+it.n+".</b> "+plain(it.s).slice(0,80)+(plain(it.s).length>80?"…":"")));
    var bd=el("div","bd");
    bd.appendChild(el("div","ln","<span class='kk'>"+t("corrAns")+"</span><br><b>"+LET[it.a]+".</b> "+it.o[it.a]+(it.fix?" → <b>"+it.fix+"</b>":"")));
    if(a!==null && !ok) bd.appendChild(el("div","ln","<span class='kk'>"+t("youChose")+"</span><br>"+LET[a]+". "+it.o[a]));
    bd.appendChild(el("div","ln","<span class='kk'>"+t("why")+"</span><br>"+(L==="th"? it.eT : it.e)));
    bd.appendChild(el("div","ln","<span class='kk'>"+t("skill")+"</span><br>"+(L==="th"? it.tagT : it.tag)));
    box.appendChild(bt); box.appendChild(bd);
    bt.onclick=function(){ box.classList.toggle("open"); };
    h.appendChild(box);
  });

  var act=el("div","acts");
  var ag=el("button","btn",t("again")); ag.onclick=function(){ start(S.i,S.mode); };
  var mp=el("button","btn ghost",t("map")); mp.onclick=goHome;
  act.appendChild(ag); act.appendChild(mp); h.appendChild(act);

  $("#quiz").classList.add("hidden"); $("#bQuit").classList.add("hidden");
  $("#cStreak").classList.add("hidden"); $("#cTime").classList.add("hidden");
  h.classList.remove("hidden");
  $("#pBar").style.width="100%";
  $("#cXp").textContent="🌱 "+G.xp;
  if(!repaintOnly) window.scrollTo(0,0);
}
function plain(h){ var d=document.createElement("div"); d.innerHTML=h; return d.textContent||""; }

function goHome(){
  if(S && S.timer){ clearInterval(S.timer); S.timer=null; }
  $("#quiz").classList.add("hidden"); $("#result").classList.add("hidden");
  $("#bQuit").classList.add("hidden"); $("#cStreak").classList.add("hidden"); $("#cTime").classList.add("hidden");
  $("#home").classList.remove("hidden");
  $("#pBar").style.width="0"; renderMap(); sTap(); window.scrollTo(0,0);
}
$("#bQuit").onclick=function(){ if(S && S.fin) return goHome(); if(confirm(t("leave"))) goHome(); };
document.addEventListener("keydown",function(e){
  if($("#quiz").classList.contains("hidden")) return;
  var i=LET.indexOf(e.key.toUpperCase());
  if(i>-1 && i<S.p.items[S.idx].o.length && !(S.mode==="quest"&&S.chk[S.idx])){ S.ans[S.idx]=i; sTap(); draw(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="Enter" && S.mode==="quest" && !S.chk[S.idx] && S.ans[S.idx]!==null) check();
});

paintStatic(); renderMap();
})();
</script>
</body>
</html>
