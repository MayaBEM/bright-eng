 ไม่ใช่ฝน`],3:[`"Dusty" describes dirt in the air, which an umbrella does not help with.`,`"dusty" บรรยายฝุ่นในอากาศ ซึ่งร่มไม่ได้ช่วยเรื่องนี้`]}},{id:`T11-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The film was so funny that we laughed all the way through. "Funny" is closest in meaning to ____.`,c:[`sad`,`strange`,`amusing`,`boring`],a:2,e:[`The audience laughed, so the film made people happy and entertained. "Amusing" means making you laugh or smile.`,`ผู้ชมหัวเราะตลอดเรื่อง แสดงว่าภาพยนตร์ทำให้ผู้คนเพลิดเพลิน คำว่า "amusing" แปลว่าทำให้ขบขันหรือยิ้มได้`],w:{0:[`"Sad" would make people cry, not laugh.`,`"sad" จะทำให้ผู้คนร้องไห้ ไม่ใช่หัวเราะ`],1:[`"Strange" means unusual, and something unusual is not always funny.`,`"strange" แปลว่าแปลก ซึ่งสิ่งที่แปลกไม่จำเป็นต้องตลกเสมอไป`],3:[`"Boring" is the opposite: it makes people lose interest.`,`"boring" มีความหมายตรงข้าม คือทำให้ผู้คนเบื่อหน่าย`]}},{id:`T11-Q12`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The first box was light and easy to lift, but the second one was very ____.`,c:[`soft`,`heavy`,`small`,`new`],a:1,e:[`"But" signals a contrast with "light and easy to lift", so the missing word must mean hard to lift. The opposite of light is "heavy".`,`คำว่า "but" แสดงความขัดแย้งกับ "light and easy to lift" คำที่หายไปจึงต้องหมายถึงยกยาก ซึ่งคำตรงข้ามของ light คือ "heavy"`],w:{0:[`"Soft" is the opposite of hard to touch, not of light in weight.`,`"soft" เป็นคำตรงข้ามกับความแข็งเมื่อสัมผัส ไม่ใช่ตรงข้ามกับน้ำหนักเบา`],2:[`"Small" describes size, and a small box can still be light.`,`"small" บอกขนาด กล่องเล็กก็ยังเบาได้`],3:[`"New" describes age and has nothing to do with lifting.`,`"new" บอกความใหม่ ซึ่งไม่เกี่ยวกับการยก`]}},{id:`T11-Q13`,s:`vocabulary`,k:`collocations`,q:`My mother ____ breakfast for the whole family every morning before school.`,c:[`does`,`takes`,`gives`,`makes`],a:3,e:[`English pairs "make" with food you prepare: make breakfast, make a cake, make a sandwich.`,`ภาษาอังกฤษใช้ "make" คู่กับอาหารที่เตรียมขึ้น เช่น make breakfast, make a cake, make a sandwich`],w:{0:[`"Do" pairs with homework and housework, not with meals.`,`"do" ใช้คู่กับ homework และงานบ้าน ไม่ใช้กับมื้ออาหาร`],1:[`"Take breakfast" is not natural English; we say "have breakfast" or "make breakfast".`,`รูป "take breakfast" ไม่เป็นธรรมชาติ เราพูดว่า "have breakfast" หรือ "make breakfast"`],2:[`"Give" means handing food to someone, not preparing it.`,`"give" หมายถึงยื่นอาหารให้ใคร ไม่ได้หมายถึงการเตรียมอาหาร`]}},{id:`T11-Q14`,s:`vocabulary`,k:`phrasal-verbs`,q:`Please ____ your shoes before you come into the house.`,c:[`put on`,`look after`,`take off`,`get on`],a:2,e:[`Shoes are removed at the door, and the phrasal verb for removing clothing or shoes is "take off".`,`เราถอดรองเท้าไว้ที่หน้าประตู และกริยาวลีที่ใช้กับการถอดเสื้อผ้าหรือรองเท้าคือ "take off"`],w:{0:[`"Put on" means to start wearing something — the opposite action.`,`"put on" แปลว่าสวมใส่ ซึ่งเป็นการกระทำตรงข้าม`],1:[`"Look after" means to take care of someone or something.`,`"look after" แปลว่าดูแลคนหรือสิ่งของ`],3:[`"Get on" means to board a bus, train or plane.`,`"get on" แปลว่าขึ้นรถ ขึ้นรถไฟ หรือขึ้นเครื่องบิน`]}},{id:`T11-Q15`,s:`conversation`,k:`conversation`,intro:`New student: Hello. What’s your name?
Kwan: ____`,q:`Choose the best reply for Kwan.`,c:[`I am eleven years old.`,`My name is Kwan. Nice to meet you.`,`Yes, my name is right here.`,`He is my good friend Kwan.`],a:1,e:[`"What’s your name?" asks for a name, so the reply gives it and adds a friendly greeting.`,`คำถาม "What’s your name?" ถามชื่อ คำตอบจึงต้องบอกชื่อและเติมคำทักทายอย่างเป็นมิตร`],w:{0:[`This answers "How old are you?", which was not asked.`,`ประโยคนี้ตอบคำถาม "How old are you?" ซึ่งไม่ได้ถูกถาม`],2:[`"Yes" cannot answer a question beginning with "What".`,`คำว่า "Yes" ใช้ตอบคำถามที่ขึ้นต้นด้วย "What" ไม่ได้`],3:[`This talks about a third person instead of introducing yourself.`,`ประโยคนี้พูดถึงบุคคลที่สาม แทนที่จะแนะนำตัวเอง`]}},{id:`T11-Q16`,s:`conversation`,k:`conversation`,intro:`Student: Excuse me, ____
Passer-by: It’s a quarter past three.`,q:`Choose the best line for the student.`,c:[`how old are you?`,`how far is it?`,`how much is it?`,`could you tell me the time?`],a:3,e:[`The reply gives a clock time, so the question must have asked for the time. "Could you tell me the time?" is the polite form.`,`คำตอบบอกเวลานาฬิกา แสดงว่าคำถามเป็นการถามเวลา ประโยค "Could you tell me the time?" เป็นรูปที่สุภาพ`],w:{0:[`A question about age would be answered with a number of years.`,`คำถามเรื่องอายุต้องตอบด้วยจำนวนปี`],1:[`"How far" asks about distance, so the answer would be in metres or minutes of walking.`,`"how far" ถามระยะทาง คำตอบจึงควรเป็นเมตรหรือเวลาเดิน`],2:[`"How much" asks a price, and the reply is not an amount of money.`,`"how much" ถามราคา แต่คำตอบไม่ใช่จำนวนเงิน`]}},{id:`T11-Q17`,s:`conversation`,k:`conversation`,intro:`Fai: May I borrow your rubber, please?
Oat: ____`,q:`Choose the best reply for Oat.`,c:[`Of course. Here you are.`,`Yes, I borrowed it yesterday.`,`No, it is a rubber.`,`Thank you very much.`],a:0,e:[`Fai is asking permission to borrow something. Agreeing and handing it over with "Here you are" is the natural reply.`,`ฟ้าขออนุญาตยืมของ คำตอบที่เป็นธรรมชาติคือตอบตกลงแล้วยื่นให้พร้อมพูดว่า "Here you are"`],w:{1:[`This says what Oat did yesterday and does not answer the request.`,`ประโยคนี้บอกว่าโอ๊ตทำอะไรเมื่อวาน และไม่ได้ตอบคำขอ`],2:[`This states what the object is, which Fai already knows.`,`ประโยคนี้บอกว่าสิ่งของนั้นคืออะไร ซึ่งฟ้ารู้อยู่แล้ว`],3:[`Fai should say thank you after receiving the rubber, not Oat.`,`ฟ้าต่างหากที่ควรกล่าวขอบคุณหลังได้รับยางลบ ไม่ใช่โอ๊ต`]}},{id:`T11-Q18`,s:`conversation`,k:`conversation`,intro:`Food seller: Would you like anything else?
Customer: ____`,q:`Choose the best reply for the customer, who has finished ordering.`,c:[`Yes, it was really delicious.`,`No, I would certainly like it.`,`No, thank you. That’s all.`,`Yes, I am very hungry now.`],a:2,e:[`To end an order politely you refuse more items and say that is everything. "No, thank you. That’s all." is the standard phrase.`,`การจบการสั่งอาหารอย่างสุภาพคือปฏิเสธของเพิ่มและบอกว่าเท่านี้พอ ประโยค "No, thank you. That’s all." เป็นวลีมาตรฐาน`],w:{0:[`This comments on food already eaten, but the order is still being taken.`,`ประโยคนี้พูดถึงอาหารที่กินไปแล้ว แต่ตอนนี้ยังอยู่ในขั้นตอนสั่งอาหาร`],1:[`"No" and "I would like it" contradict each other.`,`คำว่า "No" กับ "I would like it" ขัดแย้งกันเอง`],3:[`Saying you are hungry suggests you want more, not that you have finished.`,`การบอกว่าหิวสื่อว่าอยากได้เพิ่ม ไม่ใช่ว่าสั่งเสร็จแล้ว`]}},{id:`T11-Q19`,s:`reading`,k:`reading-detail`,p:`T11-P1`,q:`Where has Nut’s mother gone?`,c:[`To Aunt Malee’s house`,`To the market`,`To Nut’s school`,`To the hospital`],a:3,e:[`The first line of the note says, "I have gone to the hospital with Grandmother."`,`บรรทัดแรกของข้อความระบุว่า "I have gone to the hospital with Grandmother." คือไปโรงพยาบาล`],w:{0:[`Aunt Malee is the one who is coming to the house at six.`,`ป้ามาลีคือคนที่จะมาที่บ้านตอนหกโมง`],1:[`The market is not mentioned in the note.`,`ข้อความไม่ได้กล่าวถึงตลาด`],2:[`The school is not mentioned anywhere in the note.`,`ข้อความไม่ได้กล่าวถึงโรงเรียนเลย`]}},{id:`T11-Q20`,s:`reading`,k:`reading-detail`,p:`T11-P1`,q:`What must Nut do after heating his dinner?`,c:[`Wash the blue pot`,`Turn the gas off`,`Call his mother`,`Open the front door`],a:1,e:[`The note says, "do not forget to turn the gas off afterwards."`,`ข้อความระบุว่า "do not forget to turn the gas off afterwards." คืออย่าลืมปิดแก๊สหลังอุ่นเสร็จ`],w:{0:[`Washing the pot is never mentioned in the note.`,`ข้อความไม่ได้กล่าวถึงการล้างหม้อ`],2:[`Nut should only call his mother if he needs her.`,`นัทควรโทรหาแม่เฉพาะเมื่อมีเรื่องจำเป็นเท่านั้น`],3:[`The door is for Aunt Malee at six, not straight after dinner.`,`การเปิดประตูมีไว้สำหรับป้ามาลีตอนหกโมง ไม่ใช่ทันทีหลังอุ่นอาหาร`]}},{id:`T11-Q21`,s:`reading`,k:`reading-inference`,p:`T11-P1`,q:`Why should Nut not call the house phone?`,c:[`Because there is nobody at home to answer it`,`Because the house phone is broken`,`Because it costs too much money`,`Because Aunt Malee is using it`],a:0,e:[`The note explains it in the same sentence: "Do not call the house phone — nobody is at home."`,`ข้อความอธิบายไว้ในประโยคเดียวกันว่า "Do not call the house phone — nobody is at home." คือไม่มีใครอยู่บ้าน`],w:{1:[`Nothing in the note says the phone is broken.`,`ไม่มีข้อความใดระบุว่าโทรศัพท์บ้านเสีย`],2:[`Cost is never mentioned in the note.`,`ข้อความไม่ได้กล่าวถึงค่าใช้จ่ายเลย`],3:[`Aunt Malee is at her own home until six o’clock.`,`ป้ามาลีอยู่ที่บ้านของตนเองจนถึงหกโมง`]}},{id:`T11-Q22`,s:`reading`,k:`reading-detail`,p:`T11-P1`,q:`What time will Aunt Malee arrive?`,c:[`At four o’clock`,`At five o’clock`,`At six o’clock`,`At eight o’clock`],a:2,e:[`The note says, "Aunt Malee will come at six to help you with your homework."`,`ข้อความระบุว่า "Aunt Malee will come at six to help you with your homework." คือมาถึงตอนหกโมง`],w:{0:[`Four o’clock is Grandmother’s hospital appointment.`,`สี่โมงคือเวลานัดของคุณยายที่โรงพยาบาล`],1:[`Five o’clock is not mentioned in the note.`,`ข้อความไม่ได้กล่าวถึงเวลาห้าโมง`],3:[`Eight o’clock is when Mum expects to be home.`,`สองทุ่มคือเวลาที่แม่คาดว่าจะกลับถึงบ้าน`]}},{id:`T11-Q23`,s:`reading`,k:`reading-detail`,p:`T11-P2`,q:`What time does the street market open?`,c:[`At six o’clock`,`At five o’clock`,`At ten o’clock`,`On Saturday morning`],a:0,e:[`The passage says, "By six o’clock the street market is open."`,`บทอ่านระบุว่า "By six o’clock the street market is open." คือเปิดตอนหกโมง`],w:{1:[`At five o’clock the trucks arrive and the tents go up.`,`ตอนห้าโมง รถบรรทุกมาถึงและเริ่มกางเต็นท์`],2:[`Ten o’clock is when the stalls close.`,`สี่ทุ่มคือเวลาที่แผงร้านปิด`],3:[`Saturday morning is when the street is quiet again.`,`เช้าวันเสาร์คือเวลาที่ถนนกลับมาเงียบอีกครั้ง`]}},{id:`T11-Q24`,s:`reading`,k:`reading-inference`,p:`T11-P2`,q:`Why does the writer like Uncle Sri’s stall best?`,c:[`His ice cream is the cheapest in the market.`,`He is generous and remembers people’s names.`,`His stall is the biggest one in the street.`,`He sells toys as well as ice cream.`],a:1,e:[`The passage gives two reasons: he "always gives children an extra spoonful" and "he remembers everybody’s name".`,`บทอ่านให้เหตุผลสองข้อคือ เขา "always gives children an extra spoonful" และ "he remembers everybody’s name"`],w:{0:[`Prices are never mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงราคาเลย`],2:[`The size of his stall is not described anywhere.`,`ไม่มีการบรรยายขนาดแผงร้านของเขา`],3:[`Toys are sold at other stalls, not at Uncle Sri’s.`,`ของเล่นขายที่แผงอื่น ไม่ใช่ที่แผงของลุงศรี`]}},{id:`T11-Q25`,s:`reading`,k:`reading-detail`,p:`T11-P2`,q:`On Saturday morning, what shows that the market was there?`,c:[`The red and white tents`,`The small trucks by the wall`,`The rows of open stalls`,`A few flattened boxes by the wall`],a:3,e:[`The last sentence says only "a few flattened boxes by the wall show that the market was ever there".`,`ประโยคสุดท้ายระบุว่ามีเพียง "a few flattened boxes by the wall show that the market was ever there" คือกล่องกระดาษที่ถูกทับแบน`],w:{0:[`The tents are put up on Friday evening and taken down at night.`,`เต็นท์ถูกกางในเย็นวันศุกร์และเก็บลงตอนกลางคืน`],1:[`The trucks arrive at five on Friday; they do not stay.`,`รถบรรทุกมาถึงตอนห้าโมงวันศุกร์และไม่ได้จอดค้างไว้`],2:[`The stalls close at about ten o’clock at night.`,`แผงร้านปิดประมาณสี่ทุ่ม`]}}]},{id:`test-12`,number:12,title:`Practice Test 12`,subtitle:`Standard — Animals and Nature`,tier:`standard`,minutes:35,passages:[{id:`T12-P1`,kind:`Informational passage`,title:`Why the Hornbill Needs Old Trees`,body:[`The great hornbill is one of the largest birds in Thailand’s forests. It has a call that can be heard more than a kilometre away.`,`Hornbills do not build nests from sticks. Instead, the female finds a hole high up in a very old tree. She goes inside, and the male closes the entrance with mud until only a narrow slit is left. For about three months she stays inside with the eggs and the chick, and the male passes food to her through the slit.`,`This is why hornbills need old forests. A tree must grow for eighty years or more before it has a hole large enough. When old trees are cut down, hornbills have nowhere to nest, even if the young forest around them looks green and healthy.`,`Some villages in the south are now paid to protect hornbill nests instead of collecting the chicks to sell. The number of nests has risen every year since the project began.`]},{id:`T12-P2`,kind:`Notice`,title:`Rules for Visitors: Khao Sai Nature Park`,body:[`Welcome to Khao Sai Nature Park. Please help us keep this forest safe.`,`1. Stay on the marked paths. The blue path takes about one hour; the red path takes three hours and is steep in places.`,`2. Do not feed any animal. Human food makes wild animals ill and teaches them to follow people.`,`3. Take all your rubbish home with you. There are no bins inside the park.`,`4. The park gates open at 6 a.m. and close at 5 p.m. Visitors walking the red path must start before 1 p.m.`,`5. Dogs are not allowed, even on a lead.`],footer:[`In an emergency, call the ranger station on 088-555-0199.`]}],questions:[{id:`T12-Q01`,s:`grammar`,k:`tenses`,q:`While the elephants ____ in the river, the guide told us about their family groups.`,c:[`bathe`,`were bathing`,`have bathed`,`bathes`],a:1,e:[`The word "while" introduces a longer past action that was going on when something else happened, and that takes the past continuous: were bathing.`,`คำว่า "while" ใช้นำหน้าเหตุการณ์ในอดีตที่กำลังดำเนินอยู่ขณะที่มีอีกเหตุการณ์เกิดขึ้น จึงต้องใช้ past continuous คือ were bathing`],w:{0:[`"Bathe" is present simple and does not match the past verb "told".`,`"bathe" เป็น present simple ไม่สอดคล้องกับกริยาอดีต "told"`],2:[`"Have bathed" connects the past to now, but both events are finished.`,`"have bathed" เชื่อมอดีตกับปัจจุบัน แต่ทั้งสองเหตุการณ์จบไปแล้ว`],3:[`"Bathes" is singular, and "the elephants" is plural.`,`"bathes" เป็นรูปเอกพจน์ แต่ "the elephants" เป็นพหูพจน์`]}},{id:`T12-Q02`,s:`grammar`,k:`tenses`,q:`I ____ never seen a snake in the wild, only in photographs.`,c:[`am`,`was`,`did`,`have`],a:3,e:[`"Never" describes experience up to now, which is the present perfect. With "I" the helping verb is "have".`,`คำว่า "never" บอกประสบการณ์ตั้งแต่อดีตจนถึงปัจจุบัน ซึ่งใช้ present perfect และเมื่อประธานเป็น "I" กริยาช่วยคือ "have"`],w:{0:[`"Am seen" would be passive and would mean somebody sees me.`,`"am seen" เป็นรูป passive ซึ่งจะแปลว่ามีคนมองเห็นฉัน`],1:[`"Was" is past and would also create a passive meaning.`,`"was" เป็นรูปอดีตและก็ทำให้เกิดความหมายแบบ passive เช่นกัน`],2:[`"Did" must be followed by the base form "see", not "seen".`,`"did" ต้องตามด้วยรูปพื้นฐาน "see" ไม่ใช่ "seen"`]}},{id:`T12-Q03`,s:`grammar`,k:`agreement`,q:`Every one of these plants ____ water twice a week.`,c:[`needs`,`need`,`are needing`,`have needed`],a:0,e:[`The subject is "every one", which is singular even though "plants" follows. A singular subject takes the -s form: needs.`,`ประธานคือ "every one" ซึ่งเป็นเอกพจน์แม้จะมี "plants" ตามมา ประธานเอกพจน์จึงใช้กริยาเติม -s คือ needs`],w:{1:[`"Need" agrees with a plural subject, but "every one" is singular.`,`"need" ใช้กับประธานพหูพจน์ แต่ "every one" เป็นเอกพจน์`],2:[`"Need" is a state verb and is not normally used in the continuous form.`,`"need" เป็นกริยาแสดงสภาวะ จึงไม่ใช้ในรูป continuous ตามปกติ`],3:[`"Have needed" is plural and changes a routine into a period up to now.`,`"have needed" เป็นพหูพจน์และเปลี่ยนกิจวัตรให้กลายเป็นช่วงเวลาถึงปัจจุบัน`]}},{id:`T12-Q04`,s:`grammar`,k:`quantifiers`,q:`____ birds visit the lake in the dry season, so it looks completely empty.`,c:[`A few`,`Little`,`Few`,`A little`],a:2,e:[`"Few" with no article means hardly any, which explains why the lake looks empty. It is used with countable plural nouns such as "birds".`,`คำว่า "few" ที่ไม่มี article นำหน้าแปลว่าแทบไม่มีเลย จึงอธิบายได้ว่าทำไมทะเลสาบดูว่างเปล่า และใช้กับคำนามพหูพจน์นับได้อย่าง "birds"`],w:{0:[`"A few" means some, which would not make the lake look empty.`,`"a few" แปลว่ามีอยู่บ้าง ซึ่งจะไม่ทำให้ทะเลสาบดูว่างเปล่า`],1:[`"Little" is used with uncountable nouns, such as "little water".`,`"little" ใช้กับคำนามนับไม่ได้ เช่น "little water"`],3:[`"A little" is also for uncountable nouns and means a small amount.`,`"a little" ก็ใช้กับคำนามนับไม่ได้ และแปลว่ามีปริมาณเล็กน้อย`]}},{id:`T12-Q05`,s:`grammar`,k:`comparisons`,q:`The cheetah is the ____ land animal in the world.`,c:[`fastest`,`faster`,`more fast`,`fast`],a:0,e:[`"In the world" compares one animal with every other, so a superlative with "the" is needed: the fastest.`,`วลี "in the world" เปรียบเทียบสัตว์ชนิดหนึ่งกับสัตว์อื่นทั้งหมด จึงต้องใช้ขั้นสุดพร้อม "the" คือ the fastest`],w:{1:[`"Faster" compares two things and needs "than".`,`"faster" ใช้เปรียบเทียบสองสิ่งและต้องมี "than"`],2:[`Short adjectives never take "more"; the comparative is "faster".`,`คำคุณศัพท์พยางค์สั้นไม่ใช้ "more" รูปขั้นกว่าคือ "faster"`],3:[`A plain adjective cannot follow "the" in this comparison.`,`คำคุณศัพท์รูปปกติใช้ตามหลัง "the" ในการเปรียบเทียบนี้ไม่ได้`]}},{id:`T12-Q06`,s:`grammar`,k:`modals`,q:`Visitors ____ feed the monkeys. The rangers say human food makes them ill.`,c:[`need not`,`would not`,`could not`,`must not`],a:3,e:[`This is a rule that protects the animals, and "must not" is the modal used to forbid an action.`,`ข้อความนี้เป็นกฎเพื่อปกป้องสัตว์ กริยาช่วยที่ใช้ห้ามการกระทำคือ "must not"`],w:{0:[`"Need not" means it is not necessary, so feeding would still be allowed.`,`"need not" แปลว่าไม่จำเป็นต้องทำ ซึ่งยังหมายความว่าให้อาหารได้`],1:[`"Would not" describes unwillingness, not a park rule.`,`"would not" แสดงความไม่เต็มใจ ไม่ใช่กฎของอุทยาน`],2:[`"Could not" describes a lack of ability rather than a prohibition.`,`"could not" บอกการขาดความสามารถ ไม่ใช่ข้อห้าม`]}},{id:`T12-Q07`,s:`grammar`,k:`verb-patterns`,q:`The rangers decided ____ the injured bird to a shelter in the next province.`,c:[`taking`,`take`,`to take`,`taken`],a:2,e:[`"Decide" is always followed by "to + base verb": decide to take, decide to wait.`,`กริยา "decide" ต้องตามด้วย "to + กริยาพื้นฐาน" เสมอ เช่น decide to take, decide to wait`],w:{0:[`"Decide" is not followed by the -ing form.`,`หลัง "decide" ไม่ใช้รูป -ing`],1:[`The base form alone cannot follow "decide"; the word "to" is needed.`,`รูปพื้นฐานตามหลัง "decide" ลำพังไม่ได้ ต้องมีคำว่า "to"`],3:[`"Taken" is a past participle and cannot follow "decide".`,`"taken" เป็นกริยาช่องที่ 3 จึงตามหลัง "decide" ไม่ได้`]}},{id:`T12-Q08`,s:`grammar`,k:`conjunctions`,q:`Sea turtles swim back to the same beach ____ they were born there.`,c:[`although`,`because`,`but`,`so`],a:1,e:[`The second half of the sentence gives the reason for the first half, and "because" introduces a reason.`,`ประโยคส่วนหลังบอกเหตุผลของส่วนหน้า และคำว่า "because" ใช้ขึ้นต้นข้อความที่บอกเหตุผล`],w:{0:[`"Although" shows contrast, but being born there is not surprising.`,`"although" แสดงความขัดแย้ง แต่การเกิดที่นั่นไม่ใช่เรื่องที่ขัดกัน`],2:[`"But" also shows contrast and would make the sentence illogical.`,`"but" ก็แสดงความขัดแย้ง ซึ่งจะทำให้ประโยคไม่สมเหตุสมผล`],3:[`"So" introduces a result; here the second clause is the cause, not the result.`,`"so" ใช้บอกผลลัพธ์ แต่ในที่นี้อนุประโยคที่สองเป็นสาเหตุ ไม่ใช่ผล`]}},{id:`T12-Q09`,s:`grammar`,k:`questions`,q:`A: ____ do elephants eat every day?    B: About 150 kilograms of plants.`,c:[`How much`,`How many`,`How long`,`How often`],a:0,e:[`The answer gives a weight, which is an uncountable amount, so the question uses "How much".`,`คำตอบบอกน้ำหนักซึ่งเป็นปริมาณที่นับไม่ได้ คำถามจึงต้องใช้ "How much"`],w:{1:[`"How many" would need a countable answer such as "ten bananas".`,`"how many" ต้องได้คำตอบที่นับได้ เช่น "ten bananas"`],2:[`"How long" asks about time or length, not about an amount of food.`,`"how long" ถามระยะเวลาหรือความยาว ไม่ได้ถามปริมาณอาหาร`],3:[`"How often" asks about frequency, and the answer would be "twice a day".`,`"how often" ถามความถี่ คำตอบจะเป็น "twice a day"`]}},{id:`T12-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The forest was so ____ that we could not see the sky through the leaves.`,c:[`empty`,`narrow`,`shallow`,`thick`],a:3,e:[`If the leaves block the sky, the trees must grow very close together. "Thick" describes plants growing densely.`,`ถ้าใบไม้บังท้องฟ้าไว้ แสดงว่าต้นไม้ขึ้นชิดกันมาก คำว่า "thick" ใช้บรรยายพืชที่ขึ้นหนาแน่น`],w:{0:[`"Empty" means nothing is there, so the sky would be easy to see.`,`"empty" แปลว่าไม่มีอะไรอยู่เลย ซึ่งจะทำให้มองเห็นท้องฟ้าได้ง่าย`],1:[`"Narrow" describes width and is used for roads and paths.`,`"narrow" บอกความกว้าง มักใช้กับถนนและทางเดิน`],2:[`"Shallow" describes water that is not deep.`,`"shallow" ใช้บรรยายน้ำที่ไม่ลึก`]}},{id:`T12-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`Pandas are rare animals; only a few thousand are left in the world. "Rare" is closest in meaning to ____.`,c:[`uncommon`,`dangerous`,`friendly`,`enormous`],a:0,e:[`The second half explains the word: only a few thousand are left. "Uncommon" means not often found.`,`ประโยคส่วนหลังขยายความคำนั้นว่าเหลืออยู่เพียงไม่กี่พันตัว คำว่า "uncommon" แปลว่าพบได้ไม่บ่อย`],w:{1:[`"Dangerous" describes something that can hurt you, not how many there are.`,`"dangerous" บรรยายสิ่งที่เป็นอันตราย ไม่ได้บอกจำนวน`],2:[`"Friendly" describes behaviour, not numbers.`,`"friendly" บรรยายพฤติกรรม ไม่ได้บอกจำนวน`],3:[`"Enormous" describes size, and a rare animal can be small.`,`"enormous" บอกขนาด ซึ่งสัตว์ที่หายากอาจตัวเล็กก็ได้`]}},{id:`T12-Q12`,s:`vocabulary`,k:`collocations`,q:`The farmers in this valley ____ rice twice a year.`,c:[`make`,`do`,`grow`,`build`],a:2,e:[`English uses "grow" for plants and crops that a farmer raises from seed: grow rice, grow vegetables.`,`ภาษาอังกฤษใช้ "grow" กับพืชและพืชผลที่เกษตรกรเพาะปลูก เช่น grow rice, grow vegetables`],w:{0:[`"Make" is for things people manufacture, not living plants.`,`"make" ใช้กับสิ่งของที่ผลิตขึ้น ไม่ใช้กับพืชที่มีชีวิต`],1:[`"Do rice" is not used in English.`,`รูป "do rice" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Build" is used for houses, bridges and other structures.`,`"build" ใช้กับบ้าน สะพาน และสิ่งก่อสร้างอื่น ๆ`]}},{id:`T12-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`The baby elephant was too tired to ____ with the rest of the herd.`,c:[`keep on`,`keep up`,`keep off`,`keep back`],a:1,e:[`"Keep up with somebody" means to move as fast as they do so that you are not left behind.`,`"keep up with somebody" แปลว่าเคลื่อนที่ได้เร็วเท่ากับผู้อื่นเพื่อไม่ให้ถูกทิ้งไว้ข้างหลัง`],w:{0:[`"Keep on" means to continue doing something, and it is not used with "with".`,`"keep on" แปลว่าทำสิ่งใดต่อไป และไม่ใช้คู่กับ "with"`],2:[`"Keep off" means to stay away from something, as on a "Keep off the grass" sign.`,`"keep off" แปลว่าอย่าเข้าไป เช่นบนป้าย "Keep off the grass"`],3:[`"Keep back" means to stay at a distance behind something.`,`"keep back" แปลว่าถอยอยู่ห่าง ๆ ด้านหลัง`]}},{id:`T12-Q14`,s:`vocabulary`,k:`vocab-context`,q:`Many sea birds die because they ____ small pieces of floating plastic for food.`,c:[`mistake`,`forget`,`collect`,`remember`],a:0,e:[`The pattern "mistake A for B" means to think wrongly that A is B. The birds think the plastic is food and swallow it.`,`โครงสร้าง "mistake A for B" แปลว่าเข้าใจผิดคิดว่า A คือ B นกเข้าใจผิดว่าพลาสติกคืออาหารจึงกลืนเข้าไป`],w:{1:[`"Forget … for food" is not a possible English pattern.`,`โครงสร้าง "forget … for food" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Collect" means to gather things together, which would not kill the birds.`,`"collect" แปลว่าเก็บรวบรวม ซึ่งไม่ได้ทำให้นกตาย`],3:[`"Remember" is about memory and does not fit the pattern with "for".`,`"remember" เกี่ยวกับความทรงจำ และไม่เข้ากับโครงสร้างที่ใช้ "for"`]}},{id:`T12-Q15`,s:`conversation`,k:`conversation`,intro:`Visitor: What time is the elephant talk, please?
Park staff: ____`,q:`Choose the best reply for the park staff.`,c:[`It is a very interesting talk indeed.`,`Yes, there is a talk here today.`,`It starts at eleven and lasts half an hour.`,`The elephants are just over there.`],a:2,e:[`"What time…?" asks for a starting time, and adding how long it lasts is natural extra help.`,`คำถาม "What time…?" ถามเวลาเริ่ม และการบอกระยะเวลาเพิ่มเติมถือเป็นการช่วยเหลือที่เป็นธรรมชาติ`],w:{0:[`This gives an opinion about the talk instead of a time.`,`ประโยคนี้แสดงความเห็นเรื่องการบรรยาย ไม่ได้บอกเวลา`],1:[`"Yes" cannot answer a question beginning with "What time".`,`คำว่า "Yes" ใช้ตอบคำถามที่ขึ้นต้นด้วย "What time" ไม่ได้`],3:[`This gives a place, but the visitor asked about time.`,`ประโยคนี้บอกสถานที่ แต่ผู้มาเยือนถามเรื่องเวลา`]}},{id:`T12-Q16`,s:`conversation`,k:`conversation`,intro:`Neighbour: Careful! That dog doesn’t like strangers.
Boy: ____`,q:`Choose the best reply for the boy.`,c:[`Thanks for the warning. I’ll keep away from it.`,`Yes, I am certainly a stranger to it.`,`No, I don’t like dogs very much either.`,`Sorry, I did not see you standing there.`],a:0,e:[`The neighbour is warning him about danger, so the natural reply thanks them and says what he will do.`,`เพื่อนบ้านกำลังเตือนเรื่องอันตราย คำตอบที่เป็นธรรมชาติคือกล่าวขอบคุณและบอกว่าจะทำอย่างไรต่อ`],w:{1:[`This agrees with a small detail but ignores the warning itself.`,`ประโยคนี้เห็นด้วยกับรายละเอียดเล็กน้อย แต่มองข้ามคำเตือน`],2:[`This talks about his own feelings and does not respond to the danger.`,`ประโยคนี้พูดถึงความรู้สึกของตนเอง ไม่ได้ตอบรับเรื่องอันตราย`],3:[`An apology does not fit; the neighbour was being helpful, not complaining.`,`การขอโทษไม่เข้ากับสถานการณ์ เพราะเพื่อนบ้านกำลังช่วยเตือน ไม่ได้ต่อว่า`]}},{id:`T12-Q17`,s:`conversation`,k:`conversation`,intro:`Ao: It’s such a lovely day. I really don’t want to stay indoors.
Jane: ____`,q:`Choose the best reply for Jane.`,c:[`Yes, it certainly is a day.`,`No, I don’t think today is Tuesday.`,`It was lovely yesterday as well.`,`Shall we take our lunch to the park, then?`],a:3,e:[`Ao is hinting that she wants to go out, so the best reply picks up the hint and suggests an activity.`,`อ้อกำลังบอกเป็นนัยว่าอยากออกไปข้างนอก คำตอบที่ดีที่สุดจึงรับสัญญาณนั้นแล้วเสนอกิจกรรม`],w:{0:[`This states something obvious and offers nothing.`,`ประโยคนี้พูดสิ่งที่รู้กันอยู่แล้วและไม่ได้เสนออะไร`],1:[`This answers a question about the day that was never asked.`,`ประโยคนี้ตอบคำถามเรื่องวันซึ่งไม่มีใครถาม`],2:[`This is true but ignores Ao’s wish to go outside.`,`ประโยคนี้เป็นความจริงแต่มองข้ามความต้องการของอ้อที่อยากออกไปข้างนอก`]}},{id:`T12-Q18`,s:`conversation`,k:`conversation`,intro:`Nurse: ____
Patient: About three days now.`,q:`Choose the best line for the nurse.`,c:[`What is your full name, please?`,`How long have you had the cough?`,`Do you take any medicine at home?`,`Where exactly does it hurt most?`],a:1,e:[`"About three days" is a length of time, so the question must have asked how long the symptom has lasted.`,`คำตอบ "About three days" บอกระยะเวลา คำถามจึงต้องถามว่ามีอาการมานานเท่าใด`],w:{0:[`A name question would be answered with a name.`,`คำถามเรื่องชื่อต้องตอบด้วยชื่อ`],2:[`This is a yes/no question and would not be answered with a period of time.`,`ประโยคนี้เป็นคำถาม yes/no จึงไม่ตอบด้วยช่วงเวลา`],3:[`"Where" asks about a place on the body, not about days.`,`"where" ถามตำแหน่งบนร่างกาย ไม่ได้ถามจำนวนวัน`]}},{id:`T12-Q19`,s:`reading`,k:`reading-main-idea`,p:`T12-P1`,q:`What is this passage mainly trying to explain?`,c:[`How loud the call of a great hornbill can be`,`Why hornbills depend on very old trees`,`How villagers in the south catch hornbill chicks`,`Why the forests in the south look green`],a:1,e:[`The passage explains the nesting habit, states that only an eighty-year-old tree has a suitable hole, and warns what happens when old trees are cut down.`,`บทอ่านอธิบายพฤติกรรมการทำรัง ระบุว่าต้นไม้อายุ 80 ปีขึ้นไปเท่านั้นที่มีโพรงเหมาะสม และเตือนถึงผลเมื่อต้นไม้เก่าถูกตัด`],w:{0:[`The call is one detail in the opening line, not the topic.`,`เสียงร้องเป็นเพียงรายละเอียดในบรรทัดแรก ไม่ใช่หัวข้อ`],2:[`The villagers are now paid to protect nests instead of collecting chicks.`,`ปัจจุบันชาวบ้านได้รับค่าตอบแทนให้ปกป้องรัง แทนการเก็บลูกนกไปขาย`],3:[`Green young forest is mentioned only to show that it is not enough.`,`ป่าอ่อนที่เขียวขจีถูกกล่าวถึงเพียงเพื่อชี้ว่ายังไม่เพียงพอ`]}},{id:`T12-Q20`,s:`reading`,k:`reading-detail`,p:`T12-P1`,q:`Who brings food to the female while she is inside the tree?`,c:[`The chicks`,`The villagers`,`The male hornbill`,`Other female hornbills`],a:2,e:[`The second paragraph says, "the male passes food to her through the slit."`,`ย่อหน้าที่สองระบุว่า "the male passes food to her through the slit." คือนกตัวผู้ส่งอาหารผ่านช่องแคบ`],w:{0:[`The chick is inside the nest with her and cannot fetch food.`,`ลูกนกอยู่ในรังกับแม่นกและออกไปหาอาหารไม่ได้`],1:[`The villagers protect the nests but do not feed the birds.`,`ชาวบ้านคอยปกป้องรัง แต่ไม่ได้ให้อาหารนก`],3:[`Other hornbills are not mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงนกเงือกตัวอื่น`]}},{id:`T12-Q21`,s:`reading`,k:`reading-detail`,p:`T12-P1`,q:`How long must a tree grow before it can hold a hornbill nest?`,c:[`About three months`,`One whole year`,`Eighty days`,`Eighty years or more`],a:3,e:[`The third paragraph says, "A tree must grow for eighty years or more before it has a hole large enough."`,`ย่อหน้าที่สามระบุว่า "A tree must grow for eighty years or more before it has a hole large enough." คือ 80 ปีขึ้นไป`],w:{0:[`Three months is how long the female stays inside the nest.`,`สามเดือนคือระยะเวลาที่แม่นกอยู่ในรัง`],1:[`One year is not mentioned anywhere in the passage.`,`บทอ่านไม่ได้กล่าวถึงระยะเวลาหนึ่งปี`],2:[`The passage says eighty years, not eighty days.`,`บทอ่านระบุว่า 80 ปี ไม่ใช่ 80 วัน`]}},{id:`T12-Q22`,s:`reading`,k:`reading-inference`,p:`T12-P1`,q:`Why has the number of hornbill nests risen every year?`,c:[`Villagers are now paid to protect the nests.`,`Many more old trees have been planted.`,`The birds have learned to build nests from sticks.`,`Hornbills have moved into the young forest.`],a:0,e:[`The last paragraph links the two facts: villages are paid to protect nests, and "the number of nests has risen every year since the project began".`,`ย่อหน้าสุดท้ายเชื่อมสองข้อเท็จจริงไว้ว่า หมู่บ้านได้รับค่าตอบแทนให้ปกป้องรัง และ "the number of nests has risen every year since the project began"`],w:{1:[`Planting is never mentioned, and a new tree would take eighty years.`,`ไม่มีการกล่าวถึงการปลูกต้นไม้ อีกทั้งต้นใหม่ต้องใช้เวลาถึง 80 ปี`],2:[`The passage states clearly that hornbills do not build stick nests.`,`บทอ่านระบุชัดเจนว่านกเงือกไม่สร้างรังจากกิ่งไม้`],3:[`Young forest has no holes large enough for a nest.`,`ป่าอ่อนไม่มีโพรงที่ใหญ่พอสำหรับทำรัง`]}},{id:`T12-Q23`,s:`reading`,k:`reading-detail`,p:`T12-P2`,q:`How long does the red path take?`,c:[`About one hour`,`About two hours`,`About three hours`,`About five hours`],a:2,e:[`Rule 1 says, "the red path takes three hours and is steep in places."`,`กฎข้อ 1 ระบุว่า "the red path takes three hours and is steep in places." คือใช้เวลา 3 ชั่วโมง`],w:{0:[`One hour is the time for the blue path.`,`หนึ่งชั่วโมงคือเวลาของเส้นทางสีน้ำเงิน`],1:[`Two hours does not appear in the notice.`,`ไม่มีการกล่าวถึงสองชั่วโมงในประกาศ`],3:[`Five o’clock is the closing time, not a walking time.`,`ห้าโมงเย็นคือเวลาปิด ไม่ใช่ระยะเวลาเดิน`]}},{id:`T12-Q24`,s:`reading`,k:`reading-inference`,p:`T12-P2`,q:`Why must red-path walkers start before 1 p.m.?`,c:[`Because the park gates open at 6 a.m.`,`Because the path is steep in places`,`Because the rangers go home at one o’clock`,`Because the walk takes three hours and the park closes at 5 p.m.`],a:3,e:[`Rule 1 gives the length of the walk and rule 4 gives the closing time. Starting at 1 p.m. leaves three hours of walking and one hour to spare before 5 p.m.`,`กฎข้อ 1 บอกระยะเวลาเดิน และกฎข้อ 4 บอกเวลาปิด การเริ่มเดินเวลา 13:00 น. จะใช้เวลาเดิน 3 ชั่วโมงและยังเหลืออีก 1 ชั่วโมงก่อนปิดเวลา 17:00 น.`],w:{0:[`The opening time does not limit how late you may start.`,`เวลาเปิดไม่ได้เป็นตัวกำหนดว่าจะเริ่มเดินสายได้แค่ไหน`],1:[`The path being steep is a warning, not the reason for the deadline.`,`ความชันของเส้นทางเป็นคำเตือน ไม่ใช่เหตุผลของกำหนดเวลา`],2:[`The notice gives a ranger emergency number and no going-home time.`,`ประกาศให้เบอร์ฉุกเฉินของเจ้าหน้าที่ไว้ และไม่ได้ระบุเวลาเลิกงาน`]}},{id:`T12-Q25`,s:`reading`,k:`reading-detail`,p:`T12-P2`,q:`What must visitors do with their rubbish?`,c:[`Put it in the bins near the gate`,`Take it home with them`,`Leave it beside the marked path`,`Hand it to a ranger at the station`],a:1,e:[`Rule 3 says, "Take all your rubbish home with you. There are no bins inside the park."`,`กฎข้อ 3 ระบุว่า "Take all your rubbish home with you. There are no bins inside the park." คือนำขยะกลับบ้าน`],w:{0:[`The notice says there are no bins inside the park.`,`ประกาศระบุว่าภายในอุทยานไม่มีถังขยะ`],2:[`Leaving rubbish anywhere in the park is exactly what the rule forbids.`,`การทิ้งขยะไว้ที่ใดในอุทยานคือสิ่งที่กฎข้อนี้ห้ามไว้`],3:[`The ranger station number is only for emergencies.`,`เบอร์ของสถานีเจ้าหน้าที่มีไว้สำหรับกรณีฉุกเฉินเท่านั้น`]}}]},{id:`test-13`,number:13,title:`Practice Test 13`,subtitle:`Standard Plus — Money, Shopping and Plans`,tier:`standard-plus`,minutes:40,passages:[{id:`T13-P1`,kind:`Advertisement`,title:`Riverside Cycle Hire — Price List`,body:[`Hire a bicycle and explore the twelve-kilometre river path. All prices include a helmet and a lock.`,`Riders under 12 must be with an adult. A deposit of 500 baht is returned to you when you bring the bicycle back.`],table:{caption:`Hire charges`,headers:[`Bicycle`,`1 hour`,`Half day (4 hrs)`,`Full day (8 hrs)`],rows:[[`City bicycle`,`60 baht`,`180 baht`,`300 baht`],[`Mountain bicycle`,`80 baht`,`240 baht`,`400 baht`],[`Child bicycle`,`40 baht`,`120 baht`,`200 baht`],[`Tandem (2 riders)`,`120 baht`,`360 baht`,`600 baht`]]},footer:[`Open 7 a.m. – 7 p.m. daily. Late returns are charged one extra hour.`]},{id:`T13-P2`,kind:`Short story`,title:`The Jar on the Shelf`,body:[`Two years ago my brother Win put an empty glass jar on the shelf above his desk and wrote one word on it: GUITAR.`,`Every week he put in whatever was left of his pocket money. Sometimes it was fifty baht; once, after he had bought a birthday present for our mother, it was three baht. He never counted what was in the jar, because he said that counting made the waiting feel longer.`,`Last month the jar was full. We poured the coins onto the kitchen table and counted them together: 6,340 baht. The guitar he wanted cost 5,900.`,`With the extra money he bought a small stand and a book of songs. He has been practising every evening since. Our neighbours have not complained yet.`]}],questions:[{id:`T13-Q01`,s:`grammar`,k:`tenses`,q:`We ____ a new fridge next month. We have already chosen the model.`,c:[`buy`,`bought`,`will have bought`,`are going to buy`],a:3,e:[`The family has already decided and chosen, so this is a plan made before speaking. English uses "be going to" for a plan already decided.`,`ครอบครัวตัดสินใจและเลือกรุ่นไว้แล้ว จึงเป็นแผนที่วางไว้ก่อนพูด ภาษาอังกฤษใช้ "be going to" กับแผนที่ตัดสินใจไว้แล้ว`],w:{0:[`"Buy" is present simple and does not express a future plan here.`,`"buy" เป็น present simple ซึ่งไม่ได้แสดงแผนในอนาคตในประโยคนี้`],1:[`"Bought" is past, but the purchase has not happened yet.`,`"bought" เป็นรูปอดีต แต่ยังไม่ได้ซื้อจริง`],2:[`"Will have bought" means it will be finished by a future point, which the sentence does not say.`,`"will have bought" หมายถึงจะเสร็จสิ้นก่อนเวลาหนึ่งในอนาคต ซึ่งประโยคไม่ได้ระบุไว้`]}},{id:`T13-Q02`,s:`grammar`,k:`conditionals`,q:`If you ____ ten notebooks, the shop will give you a discount.`,c:[`will buy`,`buy`,`bought`,`are buying`],a:1,e:[`This is a first conditional about a real future possibility. The "if" clause takes the present simple and the main clause takes "will".`,`ประโยคนี้เป็นเงื่อนไขแบบที่ 1 ซึ่งพูดถึงความเป็นไปได้จริงในอนาคต อนุประโยค if ใช้ present simple ส่วนประโยคหลักใช้ "will"`],w:{0:[`"Will" is not used inside the "if" clause of a first conditional.`,`ไม่ใช้ "will" ในอนุประโยค if ของเงื่อนไขแบบที่ 1`],2:[`"Bought" is the past form and belongs in an imagined second conditional.`,`"bought" เป็นรูปอดีต ซึ่งใช้กับเงื่อนไขแบบที่ 2 ที่เป็นการสมมติ`],3:[`"Are buying" describes something happening at this moment.`,`"are buying" บรรยายสิ่งที่กำลังเกิดขึ้นในขณะนี้`]}},{id:`T13-Q03`,s:`grammar`,k:`passive`,q:`This shopping bag ____ from recycled plastic bottles.`,c:[`makes`,`is making`,`is made`,`has making`],a:2,e:[`The bag does not make anything; somebody makes it. The present passive is "is + past participle": is made.`,`ถุงไม่ได้เป็นผู้ผลิตสิ่งใด แต่มีคนผลิตมันขึ้นมา รูป passive ในปัจจุบันคือ "is + กริยาช่องที่ 3" คือ is made`],w:{0:[`"Makes" is active and turns the bag into the maker.`,`"makes" เป็นรูป active ซึ่งทำให้ถุงกลายเป็นผู้ผลิต`],1:[`"Is making" is active continuous and has the same problem.`,`"is making" เป็น active continuous ซึ่งมีปัญหาเดียวกัน`],3:[`"Has making" is not a possible verb form in English.`,`รูป "has making" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T13-Q04`,s:`grammar`,k:`tenses`,q:`I can’t come shopping with you. I ____ already spent all my pocket money.`,c:[`have`,`am`,`did`,`was`],a:0,e:[`The word "already" with a past action that affects now signals the present perfect, and the subject "I" takes "have".`,`คำว่า "already" ที่ใช้กับการกระทำในอดีตซึ่งส่งผลถึงปัจจุบันเป็นสัญญาณของ present perfect และประธาน "I" ใช้ "have"`],w:{1:[`"Am spent" would be passive and would mean somebody spent me.`,`"am spent" เป็นรูป passive ซึ่งจะแปลว่ามีคนใช้จ่ายตัวฉัน`],2:[`"Did" must be followed by the base form "spend", not "spent".`,`"did" ต้องตามด้วยรูปพื้นฐาน "spend" ไม่ใช่ "spent"`],3:[`"Was spent" is again passive and does not fit the meaning.`,`"was spent" ก็เป็นรูป passive เช่นกัน จึงไม่เข้ากับความหมาย`]}},{id:`T13-Q05`,s:`grammar`,k:`modals`,q:`You ____ keep the receipt, in case you need to change the size later.`,c:[`cannot`,`should`,`would`,`might not`],a:1,e:[`The speaker is recommending a sensible action, and "should" is the modal used to give advice.`,`ผู้พูดกำลังแนะนำสิ่งที่ควรทำ กริยาช่วยที่ใช้ให้คำแนะนำคือ "should"`],w:{0:[`"Cannot" forbids keeping the receipt, which is the opposite of the advice.`,`"cannot" เป็นการห้ามเก็บใบเสร็จ ซึ่งตรงข้ามกับคำแนะนำ`],2:[`"Would" is used in imagined situations or polite requests.`,`"would" ใช้กับสถานการณ์สมมติหรือการขอร้องอย่างสุภาพ`],3:[`"Might not" suggests possibility, not a recommendation.`,`"might not" แสดงความเป็นไปได้ ไม่ใช่คำแนะนำ`]}},{id:`T13-Q06`,s:`grammar`,k:`verb-patterns`,q:`My sister is saving up ____ a second-hand guitar.`,c:[`buying`,`for buy`,`to buy`,`buy`],a:2,e:[`To explain the purpose of an action, English uses "to + base verb": saving up to buy, running to catch the bus.`,`การบอกจุดประสงค์ของการกระทำ ภาษาอังกฤษใช้ "to + กริยาพื้นฐาน" เช่น saving up to buy, running to catch the bus`],w:{0:[`The -ing form does not express purpose after "saving up".`,`รูป -ing ไม่ได้ใช้บอกจุดประสงค์หลัง "saving up"`],1:[`"For" must be followed by a noun or an -ing form, never "for buy".`,`"for" ต้องตามด้วยคำนามหรือรูป -ing ไม่ใช่ "for buy"`],3:[`The bare base form cannot express purpose on its own.`,`กริยารูปพื้นฐานลำพังใช้บอกจุดประสงค์ไม่ได้`]}},{id:`T13-Q07`,s:`grammar`,k:`prepositions`,q:`I paid ____ the shoes by card because I had no cash with me.`,c:[`for`,`of`,`to`,`on`],a:0,e:[`The pattern is "pay for + the thing you buy": pay for the shoes, pay for lunch.`,`โครงสร้างคือ "pay for + สิ่งที่ซื้อ" เช่น pay for the shoes, pay for lunch`],w:{1:[`"Pay of" is not used in English.`,`รูป "pay of" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Pay to" is followed by a person, as in "pay the money to the cashier".`,`"pay to" ต้องตามด้วยบุคคล เช่น "pay the money to the cashier"`],3:[`"Pay on" is not a possible combination with a purchased item.`,`รูป "pay on" ใช้กับสิ่งที่ซื้อไม่ได้`]}},{id:`T13-Q08`,s:`grammar`,k:`quantifiers`,q:`The two shops are next to each other, but ____ of them sells batteries.`,c:[`none`,`either`,`both`,`neither`],a:3,e:[`"But" signals a disappointing result, and with exactly two shops the word for "not one and not the other" is "neither", which takes a singular verb.`,`คำว่า "but" บ่งบอกผลที่ผิดหวัง และเมื่อมีร้านเพียงสองร้าน คำที่แปลว่าไม่ใช่ทั้งคู่คือ "neither" ซึ่งใช้กับกริยาเอกพจน์`],w:{0:[`"None" is used for three or more things.`,`"none" ใช้กับสิ่งของตั้งแต่สามสิ่งขึ้นไป`],1:[`"Either" means one or the other, so batteries would be available.`,`"either" แปลว่าอย่างใดอย่างหนึ่ง ซึ่งจะหมายความว่ามีถ่านขาย`],2:[`"Both" is plural and needs "sell", and it would also mean batteries are available.`,`"both" เป็นพหูพจน์และต้องใช้ "sell" อีกทั้งยังหมายความว่ามีถ่านขายด้วย`]}},{id:`T13-Q09`,s:`grammar`,k:`relative-clauses`,q:`The little shop ____ sells second-hand books is closing next month.`,c:[`who`,`that`,`where`,`whose`],a:1,e:[`The relative pronoun stands for "the shop", a thing acting as the subject of "sells", so "that" (or "which") is correct.`,`คำสรรพนามเชื่อมความนี้แทน "the shop" ซึ่งเป็นสิ่งของและทำหน้าที่เป็นประธานของ "sells" จึงใช้ "that" (หรือ "which")`],w:{0:[`"Who" is used only for people.`,`"who" ใช้กับบุคคลเท่านั้น`],2:[`"Where" would need a complete clause after it, as in "where you buy books".`,`"where" ต้องตามด้วยอนุประโยคที่สมบูรณ์ เช่น "where you buy books"`],3:[`"Whose" shows possession and must be followed by a noun.`,`"whose" แสดงความเป็นเจ้าของและต้องมีคำนามตามหลัง`]}},{id:`T13-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The jacket was too ____ on my shoulders, so I asked for a smaller size.`,c:[`cheap`,`narrow`,`loose`,`short`],a:2,e:[`Asking for a smaller size means the jacket was bigger than needed. "Loose" describes clothes that are not tight enough.`,`การขอไซซ์เล็กลงแสดงว่าเสื้อใหญ่เกินไป คำว่า "loose" ใช้บรรยายเสื้อผ้าที่หลวมไม่กระชับ`],w:{0:[`"Cheap" describes price, and a smaller size would cost about the same.`,`"cheap" บอกราคา ซึ่งไซซ์เล็กลงก็ราคาใกล้เคียงกัน`],1:[`"Narrow" would mean too tight, so a smaller size would be worse.`,`"narrow" จะหมายถึงคับเกินไป ซึ่งไซซ์เล็กลงจะยิ่งแย่`],3:[`"Short" describes length, and a smaller size would be shorter still.`,`"short" บอกความสั้น ซึ่งไซซ์เล็กลงจะยิ่งสั้นกว่าเดิม`]}},{id:`T13-Q11`,s:`vocabulary`,k:`collocations`,q:`Don’t forget to ____ the bill before you leave the restaurant.`,c:[`make`,`pay`,`take`,`give`],a:1,e:[`"Pay the bill" is the fixed expression for handing over the money you owe at a restaurant.`,`"pay the bill" เป็นสำนวนตายตัวสำหรับการชำระเงินค่าอาหารที่ร้าน`],w:{0:[`"Make the bill" would mean writing it, which the restaurant does.`,`"make the bill" จะหมายถึงการออกใบเสร็จ ซึ่งเป็นหน้าที่ของร้าน`],2:[`"Take the bill" only means picking up the piece of paper.`,`"take the bill" หมายถึงหยิบใบเสร็จขึ้นมาเท่านั้น`],3:[`"Give the bill" is what the waiter does, not the customer.`,`"give the bill" เป็นสิ่งที่พนักงานทำ ไม่ใช่ลูกค้า`]}},{id:`T13-Q12`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The price of the second-hand phone was reasonable, so we bought it at once. "Reasonable" here means ____.`,c:[`fair`,`very high`,`strange`,`fixed`],a:0,e:[`They bought it immediately, which shows the price was acceptable and not too much. "Fair" means neither too high nor too low.`,`พวกเขาซื้อทันที แสดงว่าราคานั้นยอมรับได้และไม่แพงเกินไป คำว่า "fair" แปลว่าราคาสมเหตุสมผล ไม่สูงหรือต่ำเกินไป`],w:{1:[`A very high price would have made them think again, not buy at once.`,`ราคาที่สูงมากคงทำให้พวกเขาลังเล ไม่ใช่ซื้อทันที`],2:[`"Strange" describes something odd and cannot describe a price this way.`,`"strange" ใช้บรรยายสิ่งที่แปลกประหลาด จึงใช้กับราคาในลักษณะนี้ไม่ได้`],3:[`"Fixed" means the price cannot be changed, which is a different idea.`,`"fixed" แปลว่าราคาตายตัวต่อรองไม่ได้ ซึ่งเป็นคนละความหมาย`]}},{id:`T13-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`I saw a jacket I liked in the window, so I went into the shop to ____.`,c:[`try out it`,`try it out`,`try on it`,`try it on`],a:3,e:[`"Try on" means to put clothes on to see whether they fit. When the object is a pronoun such as "it", it must go between the two words: try it on.`,`"try on" แปลว่าลองสวมเสื้อผ้าเพื่อดูว่าพอดีหรือไม่ และเมื่อกรรมเป็นคำสรรพนามอย่าง "it" ต้องวางไว้ตรงกลาง คือ try it on`],w:{0:[`"Try out" is for testing a machine or an idea, not clothes.`,`"try out" ใช้ทดลองเครื่องมือหรือแนวคิด ไม่ใช้กับเสื้อผ้า`],1:[`The words are in the right order, but "try out" is the wrong phrasal verb for clothes.`,`ลำดับคำถูกต้อง แต่ "try out" เป็นกริยาวลีที่ไม่ใช้กับเสื้อผ้า`],2:[`A pronoun can never follow the particle. "Try on it" is incorrect.`,`คำสรรพนามจะวางหลังคำอนุภาคไม่ได้ รูป "try on it" จึงไม่ถูกต้อง`]}},{id:`T13-Q14`,s:`vocabulary`,k:`vocab-context`,q:`Because the shop was closing down for good, everything was sold at a big ____.`,c:[`addition`,`reduction`,`collection`,`decision`],a:1,e:[`A shop that is closing sells everything cheaply. "Reduction" means a lowering of the price.`,`ร้านที่กำลังจะปิดกิจการมักขายของถูกลง คำว่า "reduction" แปลว่าการลดราคา`],w:{0:[`"Addition" means something added, which would raise the price.`,`"addition" แปลว่าการเพิ่มเข้าไป ซึ่งจะทำให้ราคาสูงขึ้น`],2:[`"Collection" means a group of things gathered together.`,`"collection" แปลว่าชุดหรือกลุ่มของสิ่งที่รวบรวมไว้`],3:[`"Decision" is a choice somebody makes, not a change in price.`,`"decision" คือการตัดสินใจของคน ไม่ใช่การเปลี่ยนแปลงราคา`]}},{id:`T13-Q15`,s:`conversation`,k:`conversation`,intro:`Assistant: Would you like to try it on?
Customer: ____`,q:`Choose the best reply for the customer.`,c:[`Yes, please. Where is the fitting room?`,`No, I have already bought this one.`,`Yes, it is far too expensive for me.`,`No, I am the assistant in this shop.`],a:0,e:[`Accepting the offer and asking where to change is exactly what a shopper says next, so the conversation moves forward naturally.`,`การตอบรับข้อเสนอแล้วถามว่าห้องลองเสื้ออยู่ที่ไหน คือสิ่งที่ลูกค้าพูดต่อจริง ๆ ทำให้บทสนทนาดำเนินไปอย่างเป็นธรรมชาติ`],w:{1:[`If it were already bought, the assistant would not offer a fitting.`,`ถ้าซื้อไปแล้ว พนักงานคงไม่เสนอให้ลองสวม`],2:[`"Yes" and a complaint about price do not fit together in this reply.`,`การตอบ "Yes" พร้อมบ่นเรื่องราคาไม่เข้ากันในคำตอบนี้`],3:[`The customer is not the assistant, so this makes no sense.`,`ลูกค้าไม่ใช่พนักงาน ประโยคนี้จึงไม่สมเหตุสมผล`]}},{id:`T13-Q16`,s:`conversation`,k:`conversation`,intro:`Bee: Are you free on Saturday afternoon?
Ton: ____`,q:`Choose the best reply for Ton.`,c:[`Yes, Saturday is certainly a day.`,`No, Saturday is never free of charge.`,`I think so. What did you have in mind?`,`Yes, I was completely free last Saturday.`],a:2,e:[`"Are you free…?" usually comes before an invitation, so answering and then asking what the plan is keeps the conversation going.`,`คำถาม "Are you free…?" มักนำหน้าคำชวน การตอบแล้วถามกลับว่ามีแผนอะไรจึงทำให้บทสนทนาดำเนินต่อไปได้`],w:{0:[`This states the obvious and answers nothing.`,`ประโยคนี้พูดสิ่งที่รู้กันอยู่แล้วและไม่ได้ตอบคำถาม`],1:[`"Free" here means not busy, not "costing nothing".`,`คำว่า "free" ในที่นี้แปลว่าว่าง ไม่ได้แปลว่าไม่เสียค่าใช้จ่าย`],3:[`This answers about last Saturday, not the coming one.`,`ประโยคนี้ตอบเรื่องวันเสาร์ที่ผ่านมา ไม่ใช่วันเสาร์ที่จะถึง`]}},{id:`T13-Q17`,s:`conversation`,k:`conversation`,intro:`Customer: Excuse me, ____
Waiter: I’m so sorry. I’ll bring you another one right away.`,q:`Choose the best line for the customer.`,c:[`this soup is very hot indeed.`,`I think there has been a mistake — this soup is cold.`,`I would like to order some soup, please.`,`the soup was delicious, thank you very much.`],a:1,e:[`The waiter apologises and offers a replacement, so the customer must have politely pointed out a problem with the food.`,`พนักงานกล่าวขอโทษและเสนอเปลี่ยนจานใหม่ แสดงว่าลูกค้าได้แจ้งปัญหาเรื่องอาหารอย่างสุภาพ`],w:{0:[`Hot soup is normal and would not need an apology.`,`ซุปร้อนเป็นเรื่องปกติ จึงไม่ต้องมีการขอโทษ`],2:[`Ordering food would be answered by taking the order, not by apologising.`,`การสั่งอาหารจะได้รับการตอบด้วยการรับออร์เดอร์ ไม่ใช่การขอโทษ`],3:[`Praise would be answered with thanks, not with an apology.`,`คำชมจะได้รับการตอบด้วยคำขอบคุณ ไม่ใช่คำขอโทษ`]}},{id:`T13-Q18`,s:`conversation`,k:`conversation`,intro:`Bank clerk: ____
Customer: In twenty-baht notes, please.`,q:`Choose the best line for the bank clerk.`,c:[`How much would you like to save?`,`What is your account number, please?`,`Would you like a receipt with that?`,`How would you like the money?`],a:3,e:[`The customer answers with the kind of notes wanted, so the clerk must have asked in what form the money should be given.`,`ลูกค้าตอบว่าต้องการธนบัตรชนิดใด แสดงว่าพนักงานถามว่าจะรับเงินในรูปแบบใด`],w:{0:[`A question about an amount would be answered with a number of baht.`,`คำถามเรื่องจำนวนเงินต้องตอบด้วยจำนวนบาท`],1:[`An account number would be answered with digits.`,`คำถามเรื่องเลขบัญชีต้องตอบด้วยตัวเลข`],2:[`This is a yes/no question and would not be answered this way.`,`ประโยคนี้เป็นคำถาม yes/no จึงไม่ตอบด้วยประโยคแบบนี้`]}},{id:`T13-Q19`,s:`reading`,k:`reading-detail`,p:`T13-P1`,q:`How much does a mountain bicycle cost for half a day?`,c:[`180 baht`,`200 baht`,`240 baht`,`400 baht`],a:2,e:[`In the table, the mountain-bicycle row shows 240 baht in the "Half day (4 hrs)" column.`,`ในตาราง แถวจักรยานเสือภูเขาระบุ 240 บาท ในคอลัมน์ "Half day (4 hrs)"`],w:{0:[`180 baht is the half-day price for a city bicycle.`,`180 บาท คือราคาครึ่งวันของจักรยานในเมือง`],1:[`200 baht is the full-day price for a child bicycle.`,`200 บาท คือราคาเต็มวันของจักรยานเด็ก`],3:[`400 baht is the full-day price for a mountain bicycle.`,`400 บาท คือราคาเต็มวันของจักรยานเสือภูเขา`]}},{id:`T13-Q20`,s:`reading`,k:`reading-inference`,p:`T13-P1`,q:`A father hires a city bicycle and his ten-year-old son hires a child bicycle, both for one hour. How much do they pay?`,c:[`80 baht`,`90 baht`,`120 baht`,`100 baht`],a:3,e:[`One hour on a city bicycle is 60 baht and one hour on a child bicycle is 40 baht. 60 + 40 = 100 baht.`,`จักรยานในเมืองชั่วโมงละ 60 บาท และจักรยานเด็กชั่วโมงละ 40 บาท รวม 60 + 40 = 100 บาท`],w:{0:[`80 baht is the one-hour price of a single mountain bicycle.`,`80 บาท คือราคาหนึ่งชั่วโมงของจักรยานเสือภูเขาคันเดียว`],1:[`90 baht does not appear anywhere in the price list.`,`90 บาท ไม่ปรากฏในตารางราคาเลย`],2:[`120 baht is the one-hour price of a tandem for two riders.`,`120 บาท คือราคาหนึ่งชั่วโมงของจักรยานสองตอน`]}},{id:`T13-Q21`,s:`reading`,k:`reading-detail`,p:`T13-P1`,q:`What is included in the hire price?`,c:[`A helmet and a lock`,`A map and a water bottle`,`Breakfast at the hire shop`,`A guide for the river path`],a:0,e:[`The first line says, "All prices include a helmet and a lock."`,`บรรทัดแรกระบุว่า "All prices include a helmet and a lock." คือรวมหมวกกันน็อกและกุญแจล็อก`],w:{1:[`No map or water bottle is mentioned in the advertisement.`,`โฆษณาไม่ได้กล่าวถึงแผนที่หรือขวดน้ำ`],2:[`Food is not mentioned anywhere in the text.`,`ข้อความไม่ได้กล่าวถึงอาหารเลย`],3:[`Riders explore the path themselves; no guide is offered.`,`ผู้เช่าปั่นสำรวจเส้นทางเอง ไม่มีการเสนอไกด์`]}},{id:`T13-Q22`,s:`reading`,k:`reading-detail`,p:`T13-P1`,q:`What happens to the 500-baht deposit?`,c:[`The shop keeps it as part of the hire charge.`,`It is given back when the bicycle is returned.`,`It is added to the full-day price.`,`It pays for the helmet and the lock.`],a:1,e:[`The second paragraph says, "A deposit of 500 baht is returned to you when you bring the bicycle back."`,`ย่อหน้าที่สองระบุว่า "A deposit of 500 baht is returned to you when you bring the bicycle back." คือได้คืนเมื่อนำจักรยานมาคืน`],w:{0:[`A deposit is returned, so the shop does not keep it.`,`เงินมัดจำจะได้คืน ร้านจึงไม่ได้เก็บไว้`],2:[`The deposit is separate from the hire charges in the table.`,`เงินมัดจำแยกต่างหากจากค่าเช่าในตาราง`],3:[`The helmet and lock are already included free in every price.`,`หมวกกันน็อกและกุญแจรวมอยู่ในราคาทุกแบบอยู่แล้ว`]}},{id:`T13-Q23`,s:`reading`,k:`reading-detail`,p:`T13-P2`,q:`How much money was in the jar when it was finally counted?`,c:[`3 baht`,`50 baht`,`5,900 baht`,`6,340 baht`],a:3,e:[`The third paragraph says they counted the coins together and the total was 6,340 baht.`,`ย่อหน้าที่สามระบุว่าพวกเขานับเหรียญด้วยกันและได้ยอดรวม 6,340 บาท`],w:{0:[`Three baht was the smallest weekly amount Win put in.`,`3 บาท คือจำนวนน้อยที่สุดที่วินหยอดในหนึ่งสัปดาห์`],1:[`Fifty baht was a typical weekly amount, not the total.`,`50 บาท คือจำนวนที่หยอดต่อสัปดาห์โดยทั่วไป ไม่ใช่ยอดรวม`],2:[`5,900 baht was the price of the guitar.`,`5,900 บาท คือราคาของกีตาร์`]}},{id:`T13-Q24`,s:`reading`,k:`reading-inference`,p:`T13-P2`,q:`Why did Win never count the money in the jar?`,c:[`Counting made the waiting feel longer.`,`He could not count such large numbers.`,`The jar was too full to open safely.`,`His brother had already counted it for him.`],a:0,e:[`The passage gives his own reason: "he said that counting made the waiting feel longer."`,`บทอ่านให้เหตุผลจากปากของเขาเองว่า "he said that counting made the waiting feel longer."`],w:{1:[`He counted 6,340 baht with his brother, so he can count.`,`เขานับได้ 6,340 บาทร่วมกับพี่น้อง แสดงว่าเขานับเลขได้`],2:[`The jar was only full at the very end of the story.`,`ขวดโหลเต็มก็ต่อเมื่อถึงตอนท้ายของเรื่องเท่านั้น`],3:[`They counted the money together for the first time last month.`,`พวกเขาเพิ่งนับเงินด้วยกันเป็นครั้งแรกเมื่อเดือนที่แล้ว`]}},{id:`T13-Q25`,s:`reading`,k:`reading-inference`,p:`T13-P2`,q:`What does the last sentence suggest about Win’s playing?`,c:[`The neighbours have all moved away.`,`Win plays so quietly that nobody hears him.`,`Win is still a beginner and does not play well yet.`,`The neighbours have started to play the guitar too.`],a:2,e:[`Saying the neighbours have not complained "yet" is a joke: it hints that a beginner practising every evening may not sound very good.`,`การบอกว่าเพื่อนบ้าน "ยัง" ไม่ร้องเรียนเป็นการพูดเชิงอารมณ์ขัน สื่อว่ามือใหม่ที่ซ้อมทุกเย็นอาจยังเล่นได้ไม่ไพเราะนัก`],w:{0:[`Nothing in the story says the neighbours have left.`,`ไม่มีข้อความใดในเรื่องที่บอกว่าเพื่อนบ้านย้ายออกไป`],1:[`If he played silently there would be no reason to mention complaints.`,`ถ้าเขาเล่นเบามาก ก็ไม่มีเหตุผลที่จะกล่าวถึงการร้องเรียน`],3:[`The neighbours are only mentioned as listeners, not as players.`,`เพื่อนบ้านถูกกล่าวถึงในฐานะผู้ฟังเท่านั้น ไม่ใช่ผู้เล่น`]}}]},{id:`test-14`,number:14,title:`Practice Test 14`,subtitle:`Advanced — Work, Inventions and Ideas`,tier:`advanced`,minutes:40,passages:[{id:`T14-P1`,kind:`Informational passage`,title:`Built to Be Mended`,body:[`For most of the twentieth century, factories were proud of making products that lasted. A radio bought in 1955 came with a circuit diagram inside the lid, so that a local repairer could open it and find the fault.`,`By the 1990s the thinking had changed. Cases were glued instead of screwed, and spare parts were often not sold at all. A machine with one broken part simply became rubbish.`,`Recently the idea has begun to turn again. Several countries now give every product a "repair score" printed beside the price, and shops must sell spare parts for a fixed number of years. In one European country the score has to be shown on washing machines, phones and lawnmowers.`,`The change is not only about waste. Repair work cannot be done in a distant factory: it happens in the town where the owner lives. Every product that is mended instead of replaced keeps a small amount of money, and a skilled job, close to home.`]},{id:`T14-P2`,kind:`Email`,title:`Student helpers for the Science Fair`,meta:[[`To`,`All Grade 6 students`],[`From`,`Mr. Anuwat, Science Department`],[`Subject`,`Student helpers for the Science Fair`]],body:[`Dear students,`,`The Regional Science Fair will be held in our hall on Friday 5 September. Twenty-two schools will bring exhibits, and about six hundred visitors are expected.`,`We need eighteen student helpers. Helpers will guide visitors, hand out programmes and look after the drinking-water table. You will not be asked to carry or touch any exhibit.`,`Helpers must be available from 8 a.m. to 4 p.m. and will miss all their lessons that day. You must therefore ask your class teacher first and bring a signed note.`,`Sign the list on the science noticeboard by Wednesday 27 August. If more than eighteen students sign, places will be given to those who have not helped at a school event before.`],footer:[`Mr. Anuwat, Science Department`]}],questions:[{id:`T14-Q01`,s:`grammar`,k:`reported-speech`,intro:`Direct speech: "I will finish the drawings tomorrow," said the architect.`,q:`The architect said that she ____ the drawings the next day.`,c:[`would finish`,`will finish`,`has finished`,`finishes`],a:0,e:[`When the reporting verb is past ("said"), "will" moves back one step and becomes "would".`,`เมื่อกริยาที่ใช้เล่าเป็นรูปอดีต ("said") คำว่า "will" ต้องเลื่อนถอยหนึ่งขั้นกลายเป็น "would"`],w:{1:[`"Will" keeps the original tense, but after "said" the tense must shift back.`,`"will" คงกาลเดิมไว้ แต่หลัง "said" กาลต้องเลื่อนถอยไป`],2:[`"Has finished" says the work is already done, which changes the meaning.`,`"has finished" บอกว่างานเสร็จแล้ว ซึ่งเปลี่ยนความหมายของประโยค`],3:[`"Finishes" is present simple and does not report a future promise.`,`"finishes" เป็น present simple จึงไม่ได้เล่าคำสัญญาเกี่ยวกับอนาคต`]}},{id:`T14-Q02`,s:`grammar`,k:`passive`,q:`The old bridge ____ twice since the flood damaged it last year.`,c:[`repaired`,`is repairing`,`has been repaired`,`has repairing`],a:2,e:[`The bridge receives the action, so the passive is needed, and "since last year" calls for the present perfect: has been repaired.`,`สะพานเป็นผู้ถูกกระทำ จึงต้องใช้รูป passive และวลี "since last year" ต้องใช้ present perfect จึงเป็น has been repaired`],w:{0:[`"Repaired" alone is active and makes the bridge the repairer.`,`"repaired" ลำพังเป็นรูป active ซึ่งทำให้สะพานกลายเป็นผู้ซ่อม`],1:[`"Is repairing" is active continuous and has the same problem.`,`"is repairing" เป็น active continuous ซึ่งมีปัญหาเดียวกัน`],3:[`"Has repairing" is not a possible verb form.`,`รูป "has repairing" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T14-Q03`,s:`grammar`,k:`conditionals`,q:`If robots ____ all the boring jobs, people would have more time to create things.`,c:[`will do`,`did`,`have done`,`are doing`],a:1,e:[`The main clause uses "would have", so this is a second conditional about an imagined present. The "if" clause therefore takes the past form "did".`,`ประโยคหลักใช้ "would have" แสดงว่าเป็นเงื่อนไขแบบที่ 2 ซึ่งสมมติสถานการณ์ปัจจุบัน อนุประโยค if จึงใช้รูปอดีตคือ "did"`],w:{0:[`"Will" is never used inside the "if" clause of a conditional.`,`ไม่ใช้ "will" ในอนุประโยค if ของประโยคเงื่อนไข`],2:[`"Have done" is present perfect and does not pair with "would".`,`"have done" เป็น present perfect ซึ่งใช้คู่กับ "would" ไม่ได้`],3:[`"Are doing" describes a real situation happening now, not an imagined one.`,`"are doing" บรรยายสถานการณ์จริงที่เกิดขึ้นตอนนี้ ไม่ใช่การสมมติ`]}},{id:`T14-Q04`,s:`grammar`,k:`relative-clauses`,q:`The engineer ____ we met at the fair works for a solar power company.`,c:[`which`,`whose`,`what`,`whom`],a:3,e:[`The relative pronoun stands for "the engineer", a person acting as the object of "met", so the object form "whom" is correct.`,`คำสรรพนามเชื่อมความนี้แทน "the engineer" ซึ่งเป็นบุคคลและทำหน้าที่เป็นกรรมของ "met" จึงต้องใช้รูปกรรมคือ "whom"`],w:{0:[`"Which" is used for things and animals, not for people.`,`"which" ใช้กับสิ่งของและสัตว์ ไม่ใช้กับบุคคล`],1:[`"Whose" shows possession and must be followed by a noun.`,`"whose" แสดงความเป็นเจ้าของและต้องมีคำนามตามหลัง`],2:[`"What" is not used as a relative pronoun after a noun.`,`"what" ไม่ใช้เป็นคำสรรพนามเชื่อมความหลังคำนาม`]}},{id:`T14-Q05`,s:`grammar`,k:`tenses`,q:`My grandfather ____ work in a tin mine when he was a young man.`,c:[`is used to`,`uses to`,`used to`,`was used to`],a:2,e:[`"Used to + base verb" describes a past habit or state that is no longer true. It has only one form and never changes.`,`โครงสร้าง "used to + กริยาพื้นฐาน" ใช้บอกกิจวัตรหรือสภาพในอดีตที่ไม่เป็นจริงแล้ว โดยมีรูปเดียวไม่เปลี่ยนแปลง`],w:{0:[`"Is used to" means "is familiar with" and is followed by a noun or -ing form.`,`"is used to" แปลว่าคุ้นเคยกับ และต้องตามด้วยคำนามหรือรูป -ing`],1:[`"Uses to" is not used in English; the form is always "used to".`,`รูป "uses to" ไม่มีใช้ในภาษาอังกฤษ รูปที่ถูกต้องคือ "used to" เสมอ`],3:[`"Was used to" also means "was familiar with", not "did regularly".`,`"was used to" ก็แปลว่าเคยชินกับ ไม่ได้แปลว่าทำเป็นประจำในอดีต`]}},{id:`T14-Q06`,s:`grammar`,k:`verb-patterns`,q:`The manager suggested ____ the meeting until Monday morning.`,c:[`to postpone`,`postponing`,`postpone`,`postponed`],a:1,e:[`"Suggest" is always followed by the -ing form or by a "that" clause. It is never followed by "to + verb".`,`กริยา "suggest" ต้องตามด้วยรูป -ing หรืออนุประโยค that เท่านั้น และไม่ตามด้วย "to + กริยา"`],w:{0:[`"Suggest to postpone" is a very common mistake, but it is not correct English.`,`รูป "suggest to postpone" เป็นข้อผิดพลาดที่พบบ่อยมาก แต่ไม่ถูกหลักภาษา`],2:[`The bare base form can only follow "suggest" inside a "that" clause.`,`กริยารูปพื้นฐานตามหลัง "suggest" ได้เฉพาะในอนุประโยค that เท่านั้น`],3:[`"Postponed" is a past form and cannot follow "suggested" directly.`,`"postponed" เป็นรูปอดีต จึงตามหลัง "suggested" โดยตรงไม่ได้`]}},{id:`T14-Q07`,s:`grammar`,k:`agreement`,q:`Neither the workers nor the manager ____ satisfied with the new plan.`,c:[`are`,`were`,`have been`,`was`],a:3,e:[`With "neither … nor", the verb agrees with the subject closest to it. The nearest subject is "the manager", which is singular, so the verb is "was".`,`ในโครงสร้าง "neither … nor" กริยาต้องสอดคล้องกับประธานที่อยู่ใกล้ที่สุด ซึ่งคือ "the manager" ที่เป็นเอกพจน์ กริยาจึงเป็น "was"`],w:{0:[`"Are" agrees with "workers", but the verb follows the nearer subject.`,`"are" สอดคล้องกับ "workers" แต่กริยาต้องยึดตามประธานที่อยู่ใกล้กว่า`],1:[`"Were" is plural for the same reason and does not match "the manager".`,`"were" เป็นพหูพจน์ด้วยเหตุผลเดียวกัน จึงไม่สอดคล้องกับ "the manager"`],2:[`"Have been" is plural present perfect and does not fit either.`,`"have been" เป็น present perfect รูปพหูพจน์ จึงไม่เข้ากันเช่นกัน`]}},{id:`T14-Q08`,s:`grammar`,k:`prepositions`,q:`She is responsible ____ checking every machine before it leaves the factory.`,c:[`for`,`of`,`to`,`with`],a:0,e:[`The fixed pattern is "responsible for + noun or -ing form": responsible for the money, responsible for checking.`,`โครงสร้างตายตัวคือ "responsible for + คำนามหรือรูป -ing" เช่น responsible for the money, responsible for checking`],w:{1:[`"Responsible of" is not used in English.`,`รูป "responsible of" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Responsible to" is used for the person you report to, as in "responsible to the director".`,`"responsible to" ใช้กับบุคคลที่ต้องรายงาน เช่น "responsible to the director"`],3:[`"Responsible with" is not a natural combination.`,`รูป "responsible with" ไม่เป็นคำคู่ที่ใช้จริง`]}},{id:`T14-Q09`,s:`grammar`,k:`modals`,q:`The office lights are still on, so somebody ____ be working late tonight.`,c:[`need`,`should`,`must`,`ought`],a:2,e:[`The speaker draws a confident conclusion from what can be seen. "Must" expresses a strong logical deduction about the present.`,`ผู้พูดสรุปอย่างมั่นใจจากสิ่งที่มองเห็น กริยาช่วย "must" ใช้แสดงการคาดเดาอย่างมั่นใจเกี่ยวกับปัจจุบัน`],w:{0:[`"Need" is not used as a modal in a positive statement like this.`,`"need" ไม่ใช้เป็นกริยาช่วยในประโยคบอกเล่าลักษณะนี้`],1:[`"Should be working" would mean it is expected or advisable, not deduced.`,`"should be working" จะหมายถึงสิ่งที่ควรเป็นหรือคาดหวัง ไม่ใช่การสรุปจากหลักฐาน`],3:[`"Ought" must be followed by "to": ought to be working.`,`"ought" ต้องตามด้วย "to" เช่น ought to be working`]}},{id:`T14-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The first design failed, but the team did not give up. They kept ____ it until it finally worked.`,c:[`refusing`,`improving`,`wasting`,`copying`],a:1,e:[`The design went from failing to working, so the team must have made it better each time. "Improve" means to make something better.`,`แบบร่างเปลี่ยนจากล้มเหลวเป็นใช้งานได้ แสดงว่าทีมทำให้มันดีขึ้นทีละครั้ง คำว่า "improve" แปลว่าทำให้ดีขึ้น`],w:{0:[`"Refusing" means saying no and does not fit an object like a design.`,`"refusing" แปลว่าปฏิเสธ จึงไม่เข้ากับกรรมอย่างแบบร่าง`],2:[`"Wasting" means using something badly, which would not lead to success.`,`"wasting" แปลว่าใช้อย่างสิ้นเปลือง ซึ่งไม่นำไปสู่ความสำเร็จ`],3:[`"Copying" means making the same thing again, not making it better.`,`"copying" แปลว่าทำซ้ำเหมือนเดิม ไม่ได้ทำให้ดีขึ้น`]}},{id:`T14-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The instructions were unclear and the new workers looked puzzled. "Puzzled" is closest in meaning to ____.`,c:[`angry`,`exhausted`,`delighted`,`confused`],a:3,e:[`Unclear instructions make people unsure what to do. "Confused" means not able to understand something.`,`คำแนะนำที่ไม่ชัดเจนทำให้คนไม่แน่ใจว่าต้องทำอะไร คำว่า "confused" แปลว่าสับสนไม่เข้าใจ`],w:{0:[`"Angry" is a feeling of temper, and unclear instructions cause uncertainty first.`,`"angry" คืออารมณ์โกรธ แต่คำแนะนำที่ไม่ชัดเจนทำให้เกิดความไม่แน่ใจก่อน`],1:[`"Exhausted" means extremely tired, which is unrelated to understanding.`,`"exhausted" แปลว่าเหนื่อยล้ามาก ซึ่งไม่เกี่ยวกับความเข้าใจ`],2:[`"Delighted" means very pleased — the opposite of the situation described.`,`"delighted" แปลว่าดีใจมาก ซึ่งตรงข้ามกับสถานการณ์ที่บรรยาย`]}},{id:`T14-Q12`,s:`vocabulary`,k:`collocations`,q:`Each year the company will ____ a prize to the employee with the best new idea.`,c:[`make`,`do`,`award`,`take`],a:2,e:[`"Award a prize to somebody" is the standard formal collocation for officially giving a prize.`,`"award a prize to somebody" เป็นคำคู่มาตรฐานที่ใช้ในความหมายของการมอบรางวัลอย่างเป็นทางการ`],w:{0:[`"Make a prize" would mean building the trophy itself.`,`"make a prize" จะหมายถึงการประดิษฐ์ตัวถ้วยรางวัลขึ้นมา`],1:[`"Do a prize" is not used in English.`,`รูป "do a prize" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Take a prize" is what the winner does, not the company.`,`"take a prize" เป็นสิ่งที่ผู้ชนะทำ ไม่ใช่บริษัท`]}},{id:`T14-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`It took the inventor six years to ____ a design that really worked.`,c:[`come up with`,`come across`,`come round`,`come along`],a:0,e:[`"Come up with" means to think of an idea or a solution, which is exactly what six years of work produced.`,`"come up with" แปลว่าคิดค้นแนวคิดหรือทางแก้ปัญหาขึ้นมา ซึ่งตรงกับผลของการทำงานหกปี`],w:{1:[`"Come across" means to find something by chance, not after six years of effort.`,`"come across" แปลว่าบังเอิญพบ ไม่ใช่ผลจากความพยายามหกปี`],2:[`"Come round" means to visit somebody, or to regain consciousness.`,`"come round" แปลว่าแวะไปหาใคร หรือฟื้นคืนสติ`],3:[`"Come along" means to make progress, or to accompany somebody.`,`"come along" แปลว่ามีความคืบหน้า หรือไปเป็นเพื่อน`]}},{id:`T14-Q14`,s:`vocabulary`,k:`vocab-context`,q:`A good manager should be ____ enough to listen to ideas from everybody, not only from senior staff.`,c:[`strict`,`proud`,`open-minded`,`careless`],a:2,e:[`Listening to ideas from anyone means being willing to accept new or different thinking. "Open-minded" describes exactly that attitude.`,`การรับฟังความคิดจากทุกคนคือการเปิดใจรับแนวคิดใหม่หรือแนวคิดที่ต่างออกไป คำว่า "open-minded" ใช้บรรยายทัศนคติเช่นนี้พอดี`],w:{0:[`"Strict" means demanding that rules are obeyed, which is a different quality.`,`"strict" แปลว่าเข้มงวดให้ทำตามกฎ ซึ่งเป็นคุณสมบัติคนละอย่าง`],1:[`"Proud" people often refuse other people’s ideas.`,`คนที่ "proud" หรือหยิ่งในตนเองมักไม่ยอมรับความคิดของผู้อื่น`],3:[`"Careless" means not paying attention, which is never a good quality in a manager.`,`"careless" แปลว่าสะเพร่า ซึ่งไม่ใช่คุณสมบัติที่ดีของผู้จัดการ`]}},{id:`T14-Q15`,s:`conversation`,k:`conversation`,intro:`Interviewer: ____
Candidate: I worked at a printing shop for two years after school.`,q:`Choose the best line for the interviewer.`,c:[`How old are you exactly?`,`Where do you live at the moment?`,`Do you enjoy reading in your free time?`,`Could you tell me about your work experience?`],a:3,e:[`The candidate describes a previous job, so the question must have asked about work experience.`,`ผู้สมัครเล่าถึงงานที่เคยทำ แสดงว่าคำถามถามเกี่ยวกับประสบการณ์การทำงาน`],w:{0:[`A question about age would be answered with a number of years old.`,`คำถามเรื่องอายุต้องตอบด้วยจำนวนปี`],1:[`A question about where somebody lives would be answered with a place.`,`คำถามว่าอาศัยอยู่ที่ไหนต้องตอบด้วยสถานที่`],2:[`This is a yes/no question about a hobby, not about a job.`,`ประโยคนี้เป็นคำถาม yes/no เรื่องงานอดิเรก ไม่ใช่เรื่องงาน`]}},{id:`T14-Q16`,s:`conversation`,k:`conversation`,intro:`Team leader: We’ll go with option B, then.
New member: ____`,q:`Choose the best reply for the new member, who does not know what option B is.`,c:[`Sorry, could you explain what option B involves?`,`Yes, option B is certainly option B.`,`No, I do not like the letter B at all.`,`I will go to option B tomorrow morning.`],a:0,e:[`When you do not understand a decision, the polite move is to ask for an explanation before agreeing to it.`,`เมื่อไม่เข้าใจการตัดสินใจ วิธีที่สุภาพคือขอให้อธิบายก่อนที่จะตอบตกลง`],w:{1:[`This repeats the words and asks nothing.`,`ประโยคนี้เพียงพูดซ้ำและไม่ได้ถามอะไร`],2:[`This treats "option B" as a letter rather than a plan.`,`ประโยคนี้เข้าใจว่า "option B" เป็นตัวอักษร ไม่ใช่แผนงาน`],3:[`"Option B" is a choice, not a place you can go to.`,`"option B" คือตัวเลือก ไม่ใช่สถานที่ที่จะไปได้`]}},{id:`T14-Q17`,s:`conversation`,k:`conversation`,intro:`Manager: Could you stay late again this evening?
Staff member: ____`,q:`Choose the best reply for the staff member, who cannot stay tonight.`,c:[`No. I never stay late for anybody.`,`Yes, I stayed late yesterday evening.`,`I’m afraid I can’t tonight — my daughter is ill. Would tomorrow help?`,`You really should not ask me that question.`],a:2,e:[`A professional refusal gives a short reason and offers an alternative, so the manager still has a way forward.`,`การปฏิเสธอย่างมืออาชีพคือให้เหตุผลสั้น ๆ และเสนอทางเลือกอื่น เพื่อให้ผู้จัดการยังมีทางออก`],w:{0:[`A flat refusal with no reason sounds rude at work.`,`การปฏิเสธห้วน ๆ โดยไม่ให้เหตุผลฟังดูไม่สุภาพในที่ทำงาน`],1:[`This answers about yesterday and does not say yes or no about tonight.`,`ประโยคนี้ตอบเรื่องเมื่อวาน และไม่ได้ตอบรับหรือปฏิเสธเรื่องคืนนี้`],3:[`Telling the manager not to ask avoids the question entirely.`,`การบอกผู้จัดการว่าไม่ควรถามเป็นการเลี่ยงคำถามทั้งหมด`]}},{id:`T14-Q18`,s:`conversation`,k:`conversation`,intro:`Fon: What do you think of the new design?
Kit: ____`,q:`Choose the best reply for Kit.`,c:[`Yes, I do think about it sometimes.`,`It’s clever, though I’d make the buttons a little larger.`,`No, I do not have a design of my own.`,`A design is a design, after all.`],a:1,e:[`"What do you think of…?" asks for an opinion. A good answer gives a judgement and a specific suggestion.`,`คำถาม "What do you think of…?" ถามความคิดเห็น คำตอบที่ดีจึงต้องให้ความเห็นพร้อมข้อเสนอแนะที่เจาะจง`],w:{0:[`"Yes" cannot answer a "What…?" question, and this gives no opinion.`,`คำว่า "Yes" ใช้ตอบคำถาม "What…?" ไม่ได้ และยังไม่ได้ให้ความเห็นใด`],2:[`This talks about owning a design rather than judging this one.`,`ประโยคนี้พูดถึงการมีแบบของตนเอง ไม่ได้ประเมินแบบที่ถาม`],3:[`This avoids the question and gives no useful opinion.`,`ประโยคนี้เลี่ยงคำถามและไม่ได้ให้ความเห็นที่เป็นประโยชน์`]}},{id:`T14-Q19`,s:`reading`,k:`reading-main-idea`,p:`T14-P1`,q:`Which sentence best describes the whole passage?`,c:[`How radios were built in the year 1955`,`The return of the idea that products should be repairable`,`Why glue is better than screws in modern factories`,`How to repair a washing machine at home`],a:1,e:[`The passage traces one idea through time: products used to be repairable, then were not, and now countries are making them repairable again.`,`บทอ่านติดตามแนวคิดเดียวผ่านช่วงเวลา คือสินค้าเคยซ่อมได้ ต่อมาซ่อมไม่ได้ และตอนนี้หลายประเทศกำลังทำให้ซ่อมได้อีกครั้ง`],w:{0:[`The 1955 radio is one example used to open the argument.`,`วิทยุปี 1955 เป็นเพียงตัวอย่างที่ใช้เปิดประเด็น`],2:[`The passage says glue made repair harder, which is the opposite of "better".`,`บทอ่านระบุว่ากาวทำให้ซ่อมยากขึ้น ซึ่งตรงข้ามกับคำว่า "ดีกว่า"`],3:[`No repair instructions are given anywhere in the text.`,`ข้อความไม่ได้ให้วิธีซ่อมแต่อย่างใด`]}},{id:`T14-Q20`,s:`reading`,k:`reading-detail`,p:`T14-P1`,q:`What came inside the lid of a radio bought in 1955?`,c:[`A circuit diagram`,`A repair score`,`A spare part`,`A price label`],a:0,e:[`The first paragraph says the radio "came with a circuit diagram inside the lid".`,`ย่อหน้าแรกระบุว่าวิทยุ "came with a circuit diagram inside the lid" คือมีผังวงจรอยู่ในฝา`],w:{1:[`The repair score is a recent idea, printed beside the price.`,`คะแนนความสามารถในการซ่อมเป็นแนวคิดใหม่ พิมพ์ไว้ข้างราคา`],2:[`Spare parts are what shops must now sell, not what came in the lid.`,`อะไหล่คือสิ่งที่ร้านต้องขายในปัจจุบัน ไม่ใช่สิ่งที่อยู่ในฝา`],3:[`The price is mentioned only in the modern repair-score rule.`,`ราคาถูกกล่าวถึงเฉพาะในกฎเรื่องคะแนนซ่อมสมัยใหม่`]}},{id:`T14-Q21`,s:`reading`,k:`reading-detail`,p:`T14-P1`,q:`What must shops in some countries now do?`,c:[`Repair every product that they sell`,`Print the price inside the lid of each product`,`Stop using glue in their own factories`,`Sell spare parts for a fixed number of years`],a:3,e:[`The third paragraph says, "shops must sell spare parts for a fixed number of years."`,`ย่อหน้าที่สามระบุว่า "shops must sell spare parts for a fixed number of years." คือต้องขายอะไหล่ตามจำนวนปีที่กำหนด`],w:{0:[`The rule is about supplying parts, not about doing the repairs.`,`กฎนี้ว่าด้วยการจัดหาอะไหล่ ไม่ใช่การรับซ่อมเอง`],1:[`The repair score goes beside the price, not inside the lid.`,`คะแนนความสามารถในการซ่อมอยู่ข้างราคา ไม่ใช่ในฝา`],2:[`Glue is described as a past change; no rule about it is mentioned.`,`การใช้กาวถูกกล่าวถึงในฐานะความเปลี่ยนแปลงในอดีต และไม่มีการระบุกฎเกี่ยวกับเรื่องนี้`]}},{id:`T14-Q22`,s:`reading`,k:`reading-inference`,p:`T14-P1`,q:`According to the last paragraph, why does repair work help a town?`,c:[`Because repaired products cost more to buy`,`Because factories move into the town`,`Because the money and the skilled jobs stay nearby`,`Because rubbish is collected more often`],a:2,e:[`The last sentence says every mended product "keeps a small amount of money, and a skilled job, close to home".`,`ประโยคสุดท้ายระบุว่าสินค้าทุกชิ้นที่ซ่อม "keeps a small amount of money, and a skilled job, close to home" คือเงินและงานฝีมืออยู่ในพื้นที่`],w:{0:[`Price is not discussed in the last paragraph at all.`,`ย่อหน้าสุดท้ายไม่ได้กล่าวถึงราคาเลย`],1:[`The paragraph says repair cannot be done in a distant factory, not that factories move.`,`ย่อหน้านี้ระบุว่างานซ่อมทำในโรงงานไกล ๆ ไม่ได้ ไม่ได้บอกว่าโรงงานย้ายเข้ามา`],3:[`Waste is mentioned, but rubbish collection is never discussed.`,`มีการกล่าวถึงขยะ แต่ไม่ได้พูดถึงการเก็บขยะ`]}},{id:`T14-Q23`,s:`reading`,k:`reading-detail`,p:`T14-P2`,q:`What will the student helpers NOT be asked to do?`,c:[`Touch or carry any exhibit`,`Hand out programmes to visitors`,`Guide visitors around the hall`,`Look after the drinking-water table`],a:0,e:[`The email states it directly: "You will not be asked to carry or touch any exhibit."`,`อีเมลระบุไว้ตรงตัวว่า "You will not be asked to carry or touch any exhibit." คือไม่ต้องยกหรือแตะต้องชิ้นงาน`],w:{1:[`Handing out programmes is listed as one of the helpers’ jobs.`,`การแจกสูจิบัตรถูกระบุว่าเป็นหน้าที่หนึ่งของผู้ช่วย`],2:[`Guiding visitors is the first job on the list.`,`การนำชมผู้เข้าร่วมงานเป็นหน้าที่แรกในรายการ`],3:[`The water table is also listed as a helper’s job.`,`โต๊ะน้ำดื่มก็ถูกระบุว่าเป็นหน้าที่ของผู้ช่วยเช่นกัน`]}},{id:`T14-Q24`,s:`reading`,k:`reading-detail`,p:`T14-P2`,q:`What must a student bring before helping at the fair?`,c:[`A programme from the science office`,`Their own bottle of drinking water`,`An exhibit brought from home`,`A signed note from their class teacher`],a:3,e:[`Because helpers miss lessons, the email says, "You must therefore ask your class teacher first and bring a signed note."`,`เนื่องจากผู้ช่วยต้องขาดเรียน อีเมลจึงระบุว่า "You must therefore ask your class teacher first and bring a signed note." คือนำใบอนุญาตที่ครูเซ็นมาด้วย`],w:{0:[`Programmes are given out to visitors at the fair.`,`สูจิบัตรมีไว้แจกผู้เข้าชมงาน`],1:[`A drinking-water table is provided at the fair.`,`ในงานมีโต๊ะน้ำดื่มจัดเตรียมไว้ให้`],2:[`The exhibits are brought by the twenty-two schools.`,`ชิ้นงานนำมาโดยโรงเรียนทั้ง 22 แห่ง`]}},{id:`T14-Q25`,s:`reading`,k:`reading-inference`,p:`T14-P2`,q:`Twenty-five students sign the list. Which students will be given a place?`,c:[`The first eighteen students who signed`,`Those who have not helped at a school event before`,`The students with the best science marks`,`All twenty-five students who signed`],a:1,e:[`The last line covers exactly this case: "If more than eighteen students sign, places will be given to those who have not helped at a school event before."`,`บรรทัดสุดท้ายกล่าวถึงกรณีนี้โดยตรงว่า "If more than eighteen students sign, places will be given to those who have not helped at a school event before."`],w:{0:[`The email does not use the order of signing to decide.`,`อีเมลไม่ได้ใช้ลำดับการลงชื่อเป็นเกณฑ์ตัดสิน`],2:[`Science marks are never mentioned as a condition.`,`ไม่มีการกล่าวถึงคะแนนวิทยาศาสตร์ว่าเป็นเงื่อนไข`],3:[`Only eighteen helpers are needed.`,`ต้องการผู้ช่วยเพียง 18 คนเท่านั้น`]}}]},{id:`test-15`,number:15,title:`Practice Test 15`,subtitle:`Challenge — Full Entrance Paper III`,tier:`challenge`,minutes:45,passages:[{id:`T15-P1`,kind:`Informational passage`,title:`The Problem with "Best Before"`,body:[`Walk through any supermarket and you will see two different kinds of date printed on the packets. They do not mean the same thing, and confusing them costs households a surprising amount of money.`,`A "use by" date is about safety. Fresh fish, raw meat and some dairy products carry it. After that date the food may make you ill even if it looks and smells perfectly normal, so it should not be eaten.`,`A "best before" date is about quality. Biscuits, rice, tinned food and dried pasta carry it. After that date the food is usually still safe; it may simply be less crisp, less colourful or less tasty than the maker promises.`,`A study in one country found that households throw away about a fifth of the food they buy, and that a large part of it goes into the bin on the very day the "best before" date passes. Some supermarkets have now removed the
