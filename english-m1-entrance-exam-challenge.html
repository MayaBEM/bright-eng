useState)(()=>Hr());(0,v.useEffect)(()=>{try{window.localStorage.setItem(Br,JSON.stringify(t))}catch(e){}},[t]);let r=(0,v.useCallback)(e=>n(t=>({...t,explainLang:e})),[]),i=(0,v.useCallback)(()=>n(e=>({...e,sound:!e.sound})),[]),a=(0,v.useCallback)(()=>n(e=>({...e,timer:!e.timer})),[]),o=(0,v.useCallback)(()=>n(e=>({...e,reducedMotion:!e.reducedMotion})),[]),s=(0,v.useMemo)(()=>({...t,setExplainLang:r,toggleSound:i,toggleTimer:a,toggleReducedMotion:o}),[t,r,i,a,o]);return(0,F.jsx)(Ur.Provider,{value:s,children:e})}function Gr(){let e=(0,v.useContext)(Ur);if(!e)throw Error(`useSettings must be used within SettingsProvider`);return e}var Kr=[{id:`test-01`,number:1,title:`Practice Test 1`,subtitle:`Foundation — Everyday English`,tier:`foundation`,minutes:30,passages:[{id:`T01-P1`,kind:`Notice`,title:`Sports Day — Saturday 14 November`,body:[`Ban Suan School will hold its yearly Sports Day on Saturday 14 November at the school field.`,`The events begin at 8:00 a.m. and finish at 3:00 p.m. Students must arrive by 7:30 a.m. and wear their team colour: red, blue, yellow or green.`,`Please bring a water bottle, a hat and a small towel. The school shop will sell cold drinks and sandwiches near Gate 2.`,`Parents are welcome. There are seats under the big trees beside the running track.`,`If it rains on 14 November, Sports Day will move to Saturday 21 November.`],footer:[`Ask Mr. Chai in the sports office if you have any questions.`]},{id:`T01-P2`,kind:`Email`,title:`My new school`,meta:[[`To`,`Kanya`],[`From`,`Bee`],[`Subject`,`My new school`]],body:[`Hi Kanya,`,`How are you? I miss you and everyone at Sunshine School.`,`Last month my family moved to Chiang Mai because my mother got a new job. My new school is called Doi Kham School. It is much bigger than our old school. There are three computer rooms and a swimming pool!`,`At first I was worried because I did not know anybody here. On my second day a girl named Fon sat next to me in class. She showed me the canteen and the library. Now she is my best friend at Doi Kham.`,`Please write back and tell me about your class. Can you come and visit me in the school holiday?`],footer:[`Love,`,`Bee`]}],questions:[{id:`T01-Q01`,s:`grammar`,k:`tenses`,q:`Nok ____ to school by bus every morning.`,c:[`go`,`goes`,`going`,`is go`],a:1,e:[`The time phrase "every morning" shows a daily routine, so the present simple is correct. The subject "Nok" is one person (he/she), so the verb adds -s: goes.`,`วลีบอกเวลา "every morning" แสดงว่าเป็นกิจวัตรประจำวัน จึงใช้ present simple และเมื่อประธานเป็นเอกพจน์บุรุษที่ 3 (Nok) กริยาต้องเติม -s จึงเป็น goes`],w:{0:[`"Go" is used with I, you, we and they. Nok is one person, so the verb needs -s.`,`ใช้ "go" กับ I, you, we, they แต่ Nok เป็นคนคนเดียว กริยาจึงต้องเติม -s`],2:[`"Going" cannot be the main verb on its own. It needs a form of be in front of it, as in "is going".`,`"going" เป็นกริยาหลักตามลำพังไม่ได้ ต้องมี verb to be นำหน้า เช่น "is going"`],3:[`After "is" we use the -ing form, not the base form. "Is go" is never correct English.`,`หลัง "is" ต้องตามด้วยรูป -ing ไม่ใช่รูปพื้นฐาน รูป "is go" ไม่ถูกต้อง`]}},{id:`T01-Q02`,s:`grammar`,k:`tenses`,q:`Look! The baby ____ at the puppy.`,c:[`smiles`,`smile`,`is smiling`,`smiling`],a:2,e:[`The word "Look!" tells us the action is happening at this moment, so we use the present continuous: is + verb-ing. The subject "the baby" is singular, so we use "is smiling".`,`คำว่า "Look!" บอกว่าเหตุการณ์กำลังเกิดขึ้นตอนนี้ จึงใช้ present continuous คือ is + กริยาเติม -ing และเนื่องจาก "the baby" เป็นเอกพจน์ จึงใช้ "is smiling"`],w:{0:[`"Smiles" is the present simple, used for habits, not for something happening right now.`,`"smiles" เป็น present simple ใช้กับสิ่งที่ทำเป็นประจำ ไม่ใช่สิ่งที่กำลังเกิดขึ้นขณะนี้`],1:[`"Smile" does not agree with the singular subject "the baby", and it is not the continuous form.`,`"smile" ไม่สอดคล้องกับประธานเอกพจน์ "the baby" และไม่ใช่รูป continuous`],3:[`"Smiling" needs a helping verb. Without "is", the sentence has no complete verb.`,`"smiling" ต้องมีกริยาช่วย หากไม่มี "is" ประโยคจะไม่มีกริยาที่สมบูรณ์`]}},{id:`T01-Q03`,s:`grammar`,k:`tenses`,q:`We ____ our new science teacher last week.`,c:[`meet`,`meets`,`meeting`,`met`],a:3,e:[`"Last week" is a finished time in the past, so the past simple is needed. The past simple of the irregular verb "meet" is "met".`,`"last week" เป็นเวลาที่จบไปแล้วในอดีต จึงต้องใช้ past simple และกริยา "meet" เป็นกริยาอปกติ รูปอดีตคือ "met"`],w:{0:[`"Meet" is the present form. It does not match the past time expression "last week".`,`"meet" เป็นรูปปัจจุบัน ไม่สอดคล้องกับคำบอกเวลาในอดีต "last week"`],1:[`"Meets" is present simple with a singular subject, but the subject here is "we" and the time is past.`,`"meets" เป็น present simple ที่ใช้กับประธานเอกพจน์ แต่ประธานคือ "we" และเวลาเป็นอดีต`],2:[`"Meeting" cannot stand alone as the verb of the sentence.`,`"meeting" ใช้เป็นกริยาของประโยคตามลำพังไม่ได้`]}},{id:`T01-Q04`,s:`grammar`,k:`agreement`,q:`There ____ twelve students in the art club this term.`,c:[`are`,`is`,`be`,`was`],a:0,e:[`In a "There + be" sentence the verb agrees with the noun that follows. "Twelve students" is plural and the time is now, so we use "are".`,`ในโครงสร้าง "There + verb to be" กริยาต้องสอดคล้องกับคำนามที่ตามมา เมื่อ "twelve students" เป็นพหูพจน์และเป็นเหตุการณ์ปัจจุบัน จึงใช้ "are"`],w:{1:[`"Is" is singular. It cannot be used with the plural noun "twelve students".`,`"is" ใช้กับเอกพจน์ จึงใช้กับคำนามพหูพจน์ "twelve students" ไม่ได้`],2:[`"Be" is the base form. A main clause needs a finite verb such as "are".`,`"be" เป็นรูปพื้นฐาน ประโยคหลักต้องใช้กริยาที่ผันแล้ว เช่น "are"`],3:[`"Was" is both singular and past. The sentence is about this term, and the subject is plural.`,`"was" เป็นทั้งเอกพจน์และรูปอดีต แต่ประโยคนี้พูดถึงเทอมนี้และประธานเป็นพหูพจน์`]}},{id:`T01-Q05`,s:`grammar`,k:`articles`,q:`My father is ____ engineer. He works for a train company.`,c:[`a`,`the`,`this`,`an`],a:3,e:[`We use a/an before a singular job noun. "Engineer" begins with a vowel sound /e/, so the correct article is "an".`,`ใช้ a/an นำหน้าคำนามเอกพจน์ที่บอกอาชีพ และเนื่องจาก "engineer" ขึ้นต้นด้วยเสียงสระ /e/ จึงต้องใช้ "an"`],w:{0:[`"A" is used before a consonant sound. "Engineer" starts with a vowel sound, so "an" is required.`,`"a" ใช้หน้าคำที่ขึ้นต้นด้วยเสียงพยัญชนะ แต่ "engineer" ขึ้นต้นด้วยเสียงสระ จึงต้องใช้ "an"`],1:[`"The" points to one specific engineer both speakers know. Here we are simply naming his job.`,`"the" ใช้เจาะจงถึงวิศวกรคนที่ผู้พูดทั้งสองรู้จัก แต่ประโยคนี้เพียงบอกอาชีพเท่านั้น`],2:[`"This" points to something nearby. It does not fit a sentence that names a job.`,`"this" ใช้ชี้สิ่งที่อยู่ใกล้ ไม่เหมาะกับประโยคที่บอกอาชีพ`]}},{id:`T01-Q06`,s:`grammar`,k:`nouns`,q:`The dentist checked the children’s ____ very carefully.`,c:[`tooth`,`tooths`,`teeth`,`teeths`],a:2,e:[`More than one child means more than one tooth, so a plural is needed. "Tooth" is an irregular noun: its plural is "teeth", with no -s.`,`เมื่อมีเด็กหลายคนย่อมมีฟันหลายซี่ จึงต้องใช้รูปพหูพจน์ คำว่า "tooth" เป็นคำนามอปกติ รูปพหูพจน์คือ "teeth" โดยไม่เติม -s`],w:{0:[`"Tooth" is singular — only one tooth. The sentence is about several children.`,`"tooth" เป็นเอกพจน์ หมายถึงฟันเพียงซี่เดียว แต่ประโยคพูดถึงเด็กหลายคน`],1:[`Irregular nouns do not take -s. "Tooths" is not an English word.`,`คำนามอปกติไม่เติม -s คำว่า "tooths" ไม่มีในภาษาอังกฤษ`],3:[`"Teeth" is already plural, so adding -s is a double plural and is incorrect.`,`"teeth" เป็นพหูพจน์อยู่แล้ว การเติม -s ซ้ำจึงไม่ถูกต้อง`]}},{id:`T01-Q07`,s:`grammar`,k:`prepositions`,q:`The school library opens ____ eight o’clock every morning.`,c:[`in`,`on`,`at`,`for`],a:2,e:[`We use "at" with clock times: at eight o’clock, at 3:30, at noon.`,`ใช้ "at" กับเวลาที่บอกเป็นนาฬิกา เช่น at eight o’clock, at 3:30, at noon`],w:{0:[`"In" is used with months, years and parts of the day, such as "in the morning".`,`"in" ใช้กับเดือน ปี และช่วงของวัน เช่น "in the morning"`],1:[`"On" is used with days and dates, such as "on Monday" or "on 5 May".`,`"on" ใช้กับวันและวันที่ เช่น "on Monday" หรือ "on 5 May"`],3:[`"For" shows how long something lasts, not the point when it happens.`,`"for" ใช้บอกระยะเวลาที่ยาวนานเท่าใด ไม่ได้บอกจุดเวลาที่เกิดเหตุการณ์`]}},{id:`T01-Q08`,s:`grammar`,k:`comparisons`,q:`A motorcycle is ____ than a bicycle.`,c:[`faster`,`fast`,`fastest`,`more fast`],a:0,e:[`The word "than" signals a comparison between two things. Short adjectives form the comparative with -er, so "fast" becomes "faster".`,`คำว่า "than" เป็นสัญญาณของการเปรียบเทียบสิ่งสองสิ่ง คำคุณศัพท์พยางค์สั้นสร้างขั้นกว่าโดยเติม -er ดังนั้น "fast" จึงเป็น "faster"`],w:{1:[`"Fast" is the base adjective. It cannot be used with "than".`,`"fast" เป็นคำคุณศัพท์รูปปกติ ใช้คู่กับ "than" ไม่ได้`],2:[`"Fastest" is the superlative, used for three or more things and normally with "the".`,`"fastest" เป็นขั้นสุด ใช้เมื่อเปรียบเทียบตั้งแต่สามสิ่งขึ้นไป และมักใช้กับ "the"`],3:[`Short adjectives take -er, not "more". "More fast" is not standard English.`,`คำคุณศัพท์พยางค์สั้นต้องเติม -er ไม่ใช้ "more" คำว่า "more fast" ไม่ถูกหลักภาษา`]}},{id:`T01-Q09`,s:`grammar`,k:`modals`,q:`You ____ wear a helmet when you ride a motorcycle. It is the law.`,c:[`might`,`must`,`could`,`would`],a:1,e:[`"It is the law" shows a strong rule that cannot be broken, and "must" is the modal for a strong obligation.`,`ข้อความ "It is the law" แสดงกฎที่ต้องปฏิบัติอย่างเคร่งครัด กริยาช่วยที่ใช้บอกความจำเป็นอย่างยิ่งคือ "must"`],w:{0:[`"Might" shows possibility — perhaps yes, perhaps no. A law is not a possibility.`,`"might" แสดงความเป็นไปได้ว่าอาจจะใช่หรือไม่ใช่ แต่กฎหมายไม่ใช่เรื่องความเป็นไปได้`],2:[`"Could" suggests an option or a past ability, not a rule you have to follow.`,`"could" แสดงทางเลือกหรือความสามารถในอดีต ไม่ใช่กฎที่ต้องปฏิบัติตาม`],3:[`"Would" is used for polite requests or imagined situations, not for obligations.`,`"would" ใช้ในการขอร้องอย่างสุภาพหรือสถานการณ์สมมติ ไม่ได้ใช้บอกข้อบังคับ`]}},{id:`T01-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The soup was too hot, so Malee waited for it to ____ before she ate it.`,c:[`boil`,`burn`,`melt`,`cool`],a:3,e:[`If food is too hot to eat, you wait until it becomes less hot. "Cool" means to become colder, so it fits the situation exactly.`,`ถ้าอาหารร้อนเกินกว่าจะรับประทาน เราต้องรอให้ความร้อนลดลง คำว่า "cool" แปลว่าเย็นลง จึงเหมาะกับสถานการณ์นี้`],w:{0:[`"Boil" means to become very hot and bubble — the opposite of what Malee wants.`,`"boil" แปลว่าเดือด คือร้อนขึ้นจนเป็นฟอง ซึ่งตรงข้ามกับสิ่งที่มาลีต้องการ`],1:[`"Burn" means to be damaged by fire or heat. Soup that burns cannot be eaten.`,`"burn" แปลว่าไหม้เพราะไฟหรือความร้อน ซุปที่ไหม้ย่อมรับประทานไม่ได้`],2:[`"Melt" describes a solid turning into a liquid, like ice. Soup is already a liquid.`,`"melt" ใช้กับของแข็งที่ละลายเป็นของเหลว เช่น น้ำแข็ง แต่ซุปเป็นของเหลวอยู่แล้ว`]}},{id:`T01-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`Anong understood the questions, so she finished the test quickly. The word "quickly" is closest in meaning to ____.`,c:[`fast`,`slowly`,`carefully`,`late`],a:0,e:[`"Quickly" means in a short time or at high speed. "Fast" carries the same meaning, so it is the closest synonym.`,`"quickly" แปลว่าอย่างรวดเร็วหรือใช้เวลาน้อย คำว่า "fast" มีความหมายเดียวกัน จึงเป็นคำพ้องความหมายที่ใกล้เคียงที่สุด`],w:{1:[`"Slowly" is the opposite of "quickly", not a synonym.`,`"slowly" มีความหมายตรงข้ามกับ "quickly" ไม่ใช่คำพ้องความหมาย`],2:[`"Carefully" describes taking care, which is about how well, not how fast.`,`"carefully" หมายถึงทำอย่างระมัดระวัง ซึ่งบอกความประณีต ไม่ได้บอกความเร็ว`],3:[`"Late" means after the expected time. Anong finished early, not late.`,`"late" แปลว่าช้ากว่ากำหนด แต่อนงค์ทำเสร็จเร็ว ไม่ใช่ช้า`]}},{id:`T01-Q12`,s:`vocabulary`,k:`synonyms-antonyms`,q:`My little brother is very noisy in the morning, but my sister is always ____.`,c:[`busy`,`quiet`,`tired`,`angry`],a:1,e:[`The word "but" signals a contrast, so the missing word must be the opposite of "noisy". The opposite of noisy is "quiet".`,`คำว่า "but" แสดงความขัดแย้ง คำที่หายไปจึงต้องมีความหมายตรงข้ามกับ "noisy" ซึ่งคำตรงข้ามคือ "quiet"`],w:{0:[`"Busy" means having a lot to do. It is not the opposite of "noisy".`,`"busy" แปลว่ามีงานยุ่ง ไม่ได้เป็นคำตรงข้ามกับ "noisy"`],2:[`"Tired" describes needing rest. A tired person can still be noisy.`,`"tired" แปลว่าเหนื่อย คนที่เหนื่อยก็ยังส่งเสียงดังได้`],3:[`"Angry" is a feeling, not the opposite of making a lot of noise.`,`"angry" เป็นอารมณ์โกรธ ไม่ใช่คำตรงข้ามกับการส่งเสียงดัง`]}},{id:`T01-Q13`,s:`vocabulary`,k:`collocations`,q:`Every night before bed, Prim ____ her teeth for two minutes.`,c:[`washes`,`cleans up`,`makes`,`brushes`],a:3,e:[`English uses a fixed pairing here: we "brush" our teeth and our hair. "Brush" is the natural verb with "teeth".`,`ภาษาอังกฤษใช้คำคู่กันแบบตายตัวว่า brush one’s teeth และ brush one’s hair ดังนั้นกริยาที่ใช้กับ "teeth" คือ "brush"`],w:{0:[`We "wash" hands, faces and clothes, but not teeth.`,`เราใช้ "wash" กับมือ หน้า และเสื้อผ้า แต่ไม่ใช้กับฟัน`],1:[`"Clean up" means to tidy a place, such as a bedroom, not to care for teeth.`,`"clean up" แปลว่าเก็บกวาดสถานที่ให้เรียบร้อย เช่น ห้องนอน ไม่ได้ใช้กับการดูแลฟัน`],2:[`"Make" means to create something. You cannot "make" teeth you already have.`,`"make" แปลว่าสร้างหรือทำขึ้น จึงใช้กับฟันที่มีอยู่แล้วไม่ได้`]}},{id:`T01-Q14`,s:`vocabulary`,k:`phrasal-verbs`,q:`It is getting dark in here. Could you ____ the lights, please?`,c:[`turn down`,`take off`,`turn on`,`put off`],a:2,e:[`When a room is dark you want the lights to start working. The phrasal verb for starting a machine or a light is "turn on".`,`เมื่อห้องมืด เราต้องการให้ไฟเริ่มทำงาน กริยาวลีที่ใช้กับการเปิดเครื่องใช้ไฟฟ้าหรือไฟคือ "turn on"`],w:{0:[`"Turn down" means to make something quieter or lower, such as the volume.`,`"turn down" แปลว่าลดระดับให้เบาลงหรือน้อยลง เช่น ลดเสียง`],1:[`"Take off" is used for removing clothes, or for a plane leaving the ground.`,`"take off" ใช้กับการถอดเสื้อผ้า หรือเครื่องบินที่ทะยานขึ้นจากพื้น`],3:[`"Put off" means to delay something to a later time.`,`"put off" แปลว่าเลื่อนสิ่งใดสิ่งหนึ่งออกไปทำในภายหลัง`]}},{id:`T01-Q15`,s:`conversation`,k:`conversation`,intro:`Teacher: Good morning, Nid. How are you today?
Nid: ____`,q:`Choose the best reply for Nid.`,c:[`I am eleven years old.`,`It is Monday today.`,`Yes, I am.`,`I’m fine, thank you. And you?`],a:3,e:[`"How are you?" asks about health or feelings. The natural reply gives your condition and politely returns the question.`,`คำถาม "How are you?" ถามถึงสุขภาพหรือความรู้สึก คำตอบที่เป็นธรรมชาติคือบอกอาการของตนเองแล้วถามกลับอย่างสุภาพ`],w:{0:[`This answers "How old are you?", which was not asked.`,`ประโยคนี้ตอบคำถาม "How old are you?" ซึ่งไม่ได้ถูกถาม`],1:[`This answers a question about the day, not about how Nid feels.`,`ประโยคนี้ตอบคำถามเกี่ยวกับวัน ไม่ได้ตอบว่านิดรู้สึกอย่างไร`],2:[`"Yes, I am." answers a yes/no question. "How are you?" is a wh- question.`,`"Yes, I am." ใช้ตอบคำถาม yes/no แต่ "How are you?" เป็นคำถาม wh-`]}},{id:`T01-Q16`,s:`conversation`,k:`conversation`,intro:`Ploy: Excuse me, could you help me carry this box?
Art: ____`,q:`Choose the best reply for Art.`,c:[`Sure, no problem.`,`No, thank you.`,`You’re welcome.`,`Never mind, I’m fine.`],a:0,e:[`Ploy is asking for help. "Sure, no problem." is the natural way to agree to a request.`,`พลอยกำลังขอความช่วยเหลือ ประโยค "Sure, no problem." เป็นการตอบตกลงที่เป็นธรรมชาติที่สุด`],w:{1:[`"No, thank you." refuses an offer. Here Ploy is asking for help, not offering something.`,`"No, thank you." ใช้ปฏิเสธสิ่งที่มีผู้เสนอให้ แต่ในที่นี้พลอยเป็นฝ่ายขอความช่วยเหลือ`],2:[`"You’re welcome." is the reply to "Thank you", which has not been said yet.`,`"You’re welcome." ใช้ตอบเมื่อมีคนกล่าวขอบคุณ ซึ่งยังไม่ได้เกิดขึ้น`],3:[`"Never mind, I’m fine." refuses help for yourself. Art is the person being asked.`,`"Never mind, I’m fine." ใช้ปฏิเสธความช่วยเหลือที่มีผู้เสนอให้ตนเอง แต่อาร์ตคือคนที่ถูกขอ`]}},{id:`T01-Q17`,s:`conversation`,k:`conversation`,intro:`Shop assistant: ____
Customer: Yes, please. I’m looking for a school bag.`,q:`Choose the best line for the shop assistant.`,c:[`How much is it?`,`Can I help you?`,`Here you are.`,`Would you like a bag?`],a:1,e:[`The customer answers "Yes, please" and then says what she wants, so the assistant must have offered help. "Can I help you?" is the standard shop greeting.`,`ลูกค้าตอบว่า "Yes, please" แล้วบอกสิ่งที่ต้องการ แสดงว่าพนักงานได้เสนอความช่วยเหลือ ประโยค "Can I help you?" จึงเป็นคำทักทายมาตรฐานในร้านค้า`],w:{0:[`"How much is it?" is what a customer asks, and it cannot be answered with "Yes, please."`,`"How much is it?" เป็นคำถามของลูกค้า และตอบด้วย "Yes, please." ไม่ได้`],2:[`"Here you are." is said when handing something over, which has not happened yet.`,`"Here you are." ใช้ตอนยื่นของให้ ซึ่งยังไม่เกิดขึ้นในบทสนทนานี้`],3:[`A bag for carrying purchases comes at the end of the sale, not at the start.`,`การถามเรื่องถุงใส่ของเกิดขึ้นตอนจ่ายเงินเสร็จ ไม่ใช่ตอนเริ่มต้น`]}},{id:`T01-Q18`,s:`conversation`,k:`conversation`,intro:`Fah: Would you like to come to my house on Saturday?
June: ____ I have to visit my grandmother.`,q:`Choose the best reply for June.`,c:[`Yes, please.`,`That sounds terrible.`,`I’d love to, but I can’t.`,`No, I don’t.`],a:2,e:[`June gives a reason why she cannot come, so she is refusing. "I’d love to, but I can’t." is the polite way to decline an invitation.`,`จูนบอกเหตุผลว่าทำไมไปไม่ได้ แสดงว่าเธอกำลังปฏิเสธ ประโยค "I’d love to, but I can’t." เป็นการปฏิเสธคำเชิญอย่างสุภาพ`],w:{0:[`"Yes, please." accepts the invitation, which contradicts the reason that follows.`,`"Yes, please." เป็นการตอบรับคำเชิญ ซึ่งขัดแย้งกับเหตุผลที่ตามมา`],1:[`"That sounds terrible." is rude and criticises the invitation itself.`,`"That sounds terrible." ฟังดูหยาบคายและเป็นการตำหนิคำเชิญ`],3:[`"No, I don’t." does not match "Would you like…?", which is answered with "I’d love to" or "I’d rather not".`,`"No, I don’t." ไม่เข้ากับคำถาม "Would you like…?" ซึ่งควรตอบว่า "I’d love to" หรือ "I’d rather not"`]}},{id:`T01-Q19`,s:`reading`,k:`reading-detail`,p:`T01-P1`,q:`What time must students arrive at the school field?`,c:[`At 7:00 a.m.`,`At 8:00 a.m.`,`At 3:00 p.m.`,`At 7:30 a.m.`],a:3,e:[`The notice says, "Students must arrive by 7:30 a.m." The word "must" shows this is the required arrival time.`,`ประกาศระบุว่า "Students must arrive by 7:30 a.m." คำว่า "must" แสดงว่านี่คือเวลาที่นักเรียนต้องมาถึง`],w:{0:[`7:00 a.m. is not mentioned anywhere in the notice.`,`เวลา 7:00 น. ไม่ได้ถูกกล่าวถึงในประกาศ`],1:[`8:00 a.m. is when the events begin, not when students must arrive.`,`8:00 น. คือเวลาที่การแข่งขันเริ่ม ไม่ใช่เวลาที่นักเรียนต้องมาถึง`],2:[`3:00 p.m. is the finishing time of Sports Day.`,`15:00 น. คือเวลาที่กีฬาสีสิ้นสุด`]}},{id:`T01-Q20`,s:`reading`,k:`reading-detail`,p:`T01-P1`,q:`What are students asked to bring?`,c:[`A water bottle, a hat and a small towel`,`A chair, an umbrella and a small fan`,`Money for the school bus ticket`,`A notebook and a coloured pen`],a:0,e:[`The third paragraph states exactly: "Please bring a water bottle, a hat and a small towel."`,`ย่อหน้าที่สามระบุไว้ชัดเจนว่า "Please bring a water bottle, a hat and a small towel."`],w:{1:[`The notice mentions seats under the trees, so students do not need to bring chairs.`,`ประกาศระบุว่ามีที่นั่งใต้ต้นไม้ นักเรียนจึงไม่ต้องนำเก้าอี้มาเอง`],2:[`The notice says nothing about a bus or bus tickets.`,`ประกาศไม่ได้กล่าวถึงรถโรงเรียนหรือค่ารถแต่อย่างใด`],3:[`Notebooks and pens are for lessons; this notice is about a sports event.`,`สมุดและปากกาใช้ในการเรียน แต่ประกาศนี้เป็นเรื่องงานกีฬา`]}},{id:`T01-Q21`,s:`reading`,k:`reading-detail`,p:`T01-P1`,q:`Where can students buy something to drink?`,c:[`Under the big trees`,`At the sports office`,`At the school shop near Gate 2`,`Beside the running track`],a:2,e:[`The notice says, "The school shop will sell cold drinks and sandwiches near Gate 2."`,`ประกาศระบุว่า "The school shop will sell cold drinks and sandwiches near Gate 2." คือขายที่ร้านค้าโรงเรียนใกล้ประตู 2`],w:{0:[`The big trees are where the seats for parents are, not where drinks are sold.`,`ใต้ต้นไม้ใหญ่คือบริเวณที่นั่งสำหรับผู้ปกครอง ไม่ใช่จุดขายเครื่องดื่ม`],1:[`The sports office is where Mr. Chai answers questions.`,`ห้องกีฬาเป็นที่ที่ครูชัยคอยตอบคำถาม`],3:[`The running track is where the events take place.`,`ลู่วิ่งเป็นสถานที่จัดการแข่งขัน`]}},{id:`T01-Q22`,s:`reading`,k:`reading-inference`,p:`T01-P1`,q:`What will happen if it rains on 14 November?`,c:[`Sports Day will be cancelled for this year.`,`Sports Day will take place one week later.`,`Students will play inside the school hall.`,`Parents will have to stay at home.`],a:1,e:[`The last line says Sports Day will move to Saturday 21 November. That date is exactly seven days after 14 November, so the event happens one week later.`,`บรรทัดสุดท้ายระบุว่ากีฬาสีจะเลื่อนไปวันเสาร์ที่ 21 พฤศจิกายน ซึ่งห่างจากวันที่ 14 พฤศจิกายนพอดี 7 วัน จึงหมายถึงเลื่อนไปอีกหนึ่งสัปดาห์`],w:{0:[`The notice gives a new date, so the event is postponed rather than cancelled.`,`ประกาศระบุวันใหม่ไว้ แสดงว่างานถูกเลื่อน ไม่ได้ถูกยกเลิก`],2:[`The notice never mentions a school hall or moving indoors.`,`ประกาศไม่ได้กล่าวถึงหอประชุมหรือการย้ายเข้าไปจัดในอาคาร`],3:[`Parents are welcome; nothing in the notice asks them to stay away.`,`ประกาศต้อนรับผู้ปกครอง ไม่มีข้อความใดขอให้ผู้ปกครองอยู่บ้าน`]}},{id:`T01-Q23`,s:`reading`,k:`reading-main-idea`,p:`T01-P2`,q:`What is the main purpose of Bee’s email?`,c:[`To invite Kanya to join a sports club`,`To tell Kanya about her new school and her new life`,`To ask Kanya for help with her homework`,`To say sorry for missing a class at Sunshine School`],a:1,e:[`Most of the email describes the move to Chiang Mai, the new school and the new friend. Those details all support one purpose: telling Kanya about her new life.`,`เนื้อหาส่วนใหญ่ของอีเมลเล่าถึงการย้ายไปเชียงใหม่ โรงเรียนใหม่ และเพื่อนใหม่ รายละเอียดทั้งหมดสนับสนุนจุดประสงค์เดียวคือเล่าชีวิตใหม่ให้กัญญาฟัง`],w:{0:[`No club is mentioned. Bee invites Kanya to visit, but that is only one line at the end.`,`ไม่มีการกล่าวถึงชมรมใด ๆ บีชวนกัญญามาเยี่ยม แต่เป็นเพียงประโยคเดียวตอนท้าย`],2:[`Bee asks Kanya to write back, not to help with homework.`,`บีขอให้กัญญาเขียนตอบกลับ ไม่ได้ขอให้ช่วยทำการบ้าน`],3:[`Bee moved to a new city with her family; she does not apologise for anything.`,`บีย้ายไปอยู่เมืองใหม่กับครอบครัว และไม่ได้กล่าวขอโทษเรื่องใดเลย`]}},{id:`T01-Q24`,s:`reading`,k:`reading-reference`,p:`T01-P2`,q:`In the sentence "She showed me the canteen and the library", the word "She" refers to ____.`,c:[`Fon`,`Kanya`,`Bee’s mother`,`the class teacher`],a:0,e:[`The sentence just before it introduces "a girl named Fon" who sat next to Bee. A pronoun normally refers back to the nearest person mentioned, so "She" is Fon.`,`ประโยคก่อนหน้ากล่าวถึง "a girl named Fon" ที่มานั่งข้างบี โดยปกติคำสรรพนามจะอ้างถึงบุคคลที่กล่าวถึงล่าสุด ดังนั้น "She" จึงหมายถึงฝน`],w:{1:[`Kanya is the person receiving the email and is not at the new school.`,`กัญญาเป็นผู้รับอีเมลและไม่ได้อยู่ที่โรงเรียนใหม่`],2:[`Bee’s mother is mentioned as the reason for the move, not as a guide at school.`,`แม่ของบีถูกกล่าวถึงในฐานะเหตุผลของการย้าย ไม่ใช่ผู้พาชมโรงเรียน`],3:[`No teacher is mentioned anywhere in the email.`,`ในอีเมลไม่ได้กล่าวถึงครูคนใดเลย`]}},{id:`T01-Q25`,s:`reading`,k:`reading-inference`,p:`T01-P2`,q:`Why did Bee feel worried at first?`,c:[`Her new school did not have a swimming pool.`,`She did not like her new classroom at all.`,`Her mother could not find a job in Chiang Mai.`,`She did not know anybody there yet.`],a:3,e:[`Bee writes, "At first I was worried because I did not know anybody here." The word "because" points directly to the reason.`,`บีเขียนว่า "At first I was worried because I did not know anybody here." คำว่า "because" ชี้ถึงเหตุผลโดยตรง`],w:{0:[`The email says the new school does have a swimming pool.`,`อีเมลระบุว่าโรงเรียนใหม่มีสระว่ายน้ำ`],1:[`Bee never says she dislikes the classroom; she describes the school positively.`,`บีไม่ได้บอกว่าไม่ชอบห้องเรียน แต่กลับเล่าถึงโรงเรียนในแง่ดี`],2:[`The family moved exactly because her mother got a new job.`,`ครอบครัวย้ายมาเพราะแม่ของเธอได้งานใหม่`]}}]},{id:`test-02`,number:2,title:`Practice Test 2`,subtitle:`Foundation — School and Family`,tier:`foundation`,minutes:30,passages:[{id:`T02-P1`,kind:`School news report`,title:`Grade 6 Wins the Reading Challenge`,body:[`Last month every class at Wat Pho Sri School joined the Reading Challenge. Each student wrote down the title of every book they finished in October.`,`Grade 6 read 214 books altogether. Grade 5 came second with 187 books, and Grade 4 read 152 books.`,`The winning class received a box of new story books for their classroom library. Their teacher, Miss Kesinee, said she was very proud of them.`,`"The best part was not the prize," said Nut, a Grade 6 student. "The best part was that my friends and I started talking about books at lunchtime."`,`The school will hold the Reading Challenge again next October.`]},{id:`T02-P2`,kind:`Timetable`,title:`After-School Clubs — Term 2`,body:[`All clubs meet from 3:30 p.m. to 4:30 p.m. Students may join one club only. Please sign your name in the office before Friday.`],table:{caption:`Club timetable`,headers:[`Day`,`Club`,`Room`,`Teacher`],rows:[[`Monday`,`Chess Club`,`Room 12`,`Mr. Boon`],[`Tuesday`,`Art Club`,`Art Room`,`Miss Ploy`],[`Wednesday`,`Science Club`,`Lab 2`,`Mr. Somchai`],[`Thursday`,`Music Club`,`Music Room`,`Miss Ann`],[`Friday`,`Football Club`,`School Field`,`Mr. Chai`]]},footer:[`Clubs do not meet on school holidays.`]}],questions:[{id:`T02-Q01`,s:`grammar`,k:`tenses`,q:`Don’t worry. I ____ you at the station tomorrow morning.`,c:[`met`,`meet`,`will meet`,`am meet`],a:2,e:[`"Tomorrow morning" is a future time, and the speaker is promising to do something. We use "will + base verb" for a promise about the future.`,`"tomorrow morning" เป็นเวลาในอนาคต และผู้พูดกำลังให้สัญญา จึงใช้โครงสร้าง "will + กริยาช่องที่ 1" เพื่อบอกสิ่งที่จะทำในอนาคต`],w:{0:[`"Met" is the past simple. It cannot describe something that has not happened yet.`,`"met" เป็นรูปอดีต จึงใช้กับสิ่งที่ยังไม่เกิดขึ้นไม่ได้`],1:[`"Meet" alone is the present simple and does not show a future promise.`,`"meet" เพียงลำพังเป็น present simple และไม่ได้แสดงการให้สัญญาในอนาคต`],3:[`"Am meet" mixes two forms. After "am" we need "meeting", not the base verb.`,`"am meet" เป็นการผสมสองรูปเข้าด้วยกัน หลัง "am" ต้องเป็น "meeting" ไม่ใช่รูปพื้นฐาน`]}},{id:`T02-Q02`,s:`grammar`,k:`tenses`,q:`Ken ____ his lunchbox to school yesterday, so he had to buy food.`,c:[`did not bring`,`did not brought`,`not brought`,`does not bring`],a:0,e:[`In a past simple negative we use "did not" plus the base form of the verb. "Did" already carries the past meaning, so "bring" stays unchanged.`,`ในประโยคปฏิเสธของ past simple ใช้ "did not" ตามด้วยกริยารูปพื้นฐาน เพราะ "did" บอกความเป็นอดีตอยู่แล้ว กริยาหลักจึงไม่ต้องเปลี่ยนรูป`],w:{1:[`After "did not" the verb must stay in the base form: "bring", not "brought".`,`หลัง "did not" กริยาต้องอยู่ในรูปพื้นฐานคือ "bring" ไม่ใช่ "brought"`],2:[`A negative sentence needs a helping verb. "Not brought" has no "did".`,`ประโยคปฏิเสธต้องมีกริยาช่วย รูป "not brought" ขาดคำว่า "did"`],3:[`"Does not bring" is present simple and does not match "yesterday".`,`"does not bring" เป็น present simple ไม่สอดคล้องกับคำว่า "yesterday"`]}},{id:`T02-Q03`,s:`grammar`,k:`agreement`,q:`My sister and I ____ the dishes together after dinner.`,c:[`washes`,`is washing`,`has washed`,`wash`],a:3,e:[`"My sister and I" is a plural subject (= we), so the present simple verb takes no -s: wash.`,`"My sister and I" เป็นประธานพหูพจน์ (เท่ากับ we) กริยาใน present simple จึงไม่ต้องเติม -s ใช้ "wash"`],w:{0:[`"Washes" is for a singular subject such as "my sister" alone.`,`"washes" ใช้กับประธานเอกพจน์ เช่น "my sister" เพียงคนเดียว`],1:[`"Is" is singular, and the sentence describes a routine, not something happening now.`,`"is" เป็นเอกพจน์ อีกทั้งประโยคนี้บอกกิจวัตร ไม่ใช่สิ่งที่กำลังเกิดขึ้น`],2:[`"Has washed" is singular present perfect; the subject is plural and the meaning is a habit.`,`"has washed" เป็น present perfect รูปเอกพจน์ แต่ประธานเป็นพหูพจน์และความหมายเป็นกิจวัตร`]}},{id:`T02-Q04`,s:`grammar`,k:`pronouns`,q:`This blue umbrella is not mine. I think it is ____.`,c:[`she`,`hers`,`her`,`herself`],a:1,e:[`The blank stands alone after "is", with no noun after it, so we need a possessive pronoun. The possessive pronoun for "she" is "hers".`,`ช่องว่างอยู่หลัง "is" และไม่มีคำนามตามมา จึงต้องใช้สรรพนามแสดงความเป็นเจ้าของ ซึ่งของ "she" คือ "hers"`],w:{0:[`"She" is a subject pronoun and cannot show ownership.`,`"she" เป็นสรรพนามประธาน ใช้แสดงความเป็นเจ้าของไม่ได้`],2:[`"Her" must be followed by a noun, as in "her umbrella".`,`"her" ต้องมีคำนามตามหลัง เช่น "her umbrella"`],3:[`"Herself" is a reflexive pronoun, used when the subject and object are the same person.`,`"herself" เป็นสรรพนามสะท้อน ใช้เมื่อประธานและกรรมเป็นคนเดียวกัน`]}},{id:`T02-Q05`,s:`grammar`,k:`quantifiers`,q:`There isn’t ____ milk left in the bottle.`,c:[`much`,`many`,`a few`,`several`],a:0,e:[`"Milk" is an uncountable noun. In negative sentences we use "much" with uncountable nouns.`,`"milk" เป็นคำนามนับไม่ได้ ในประโยคปฏิเสธเราใช้ "much" กับคำนามนับไม่ได้`],w:{1:[`"Many" is used with countable plural nouns, such as "many bottles".`,`"many" ใช้กับคำนามนับได้พหูพจน์ เช่น "many bottles"`],2:[`"A few" is also for countable nouns, and it means a small positive amount.`,`"a few" ใช้กับคำนามนับได้เช่นกัน และมีความหมายว่ามีอยู่บ้าง`],3:[`"Several" means more than a few and is only used with countable nouns.`,`"several" แปลว่าหลายอย่าง และใช้กับคำนามนับได้เท่านั้น`]}},{id:`T02-Q06`,s:`grammar`,k:`adjectives-adverbs`,q:`Please speak ____. The baby is sleeping.`,c:[`quiet`,`more quiet`,`quietly`,`quietest`],a:2,e:[`The word describes how to do the action "speak", so an adverb is needed. The adverb of "quiet" is "quietly".`,`คำที่เติมขยายวิธีการของกริยา "speak" จึงต้องใช้คำวิเศษณ์ ซึ่งรูปคำวิเศษณ์ของ "quiet" คือ "quietly"`],w:{0:[`"Quiet" is an adjective. Adjectives describe nouns, not actions.`,`"quiet" เป็นคำคุณศัพท์ ใช้ขยายคำนาม ไม่ใช่ขยายกริยา`],1:[`"More quiet" is a comparative form, but nothing is being compared here.`,`"more quiet" เป็นรูปขั้นกว่า แต่ประโยคนี้ไม่ได้เปรียบเทียบสิ่งใด`],3:[`"Quietest" is a superlative adjective and does not fit after a verb like this.`,`"quietest" เป็นคำคุณศัพท์ขั้นสุด จึงวางหลังกริยาในลักษณะนี้ไม่ได้`]}},{id:`T02-Q07`,s:`grammar`,k:`prepositions`,q:`We usually go to the temple ____ Sunday morning.`,c:[`at`,`on`,`in`,`by`],a:1,e:[`When a part of the day is joined to a specific day, we use "on": on Sunday morning, on Monday evening.`,`เมื่อช่วงเวลาของวันถูกระบุคู่กับวันใดวันหนึ่ง เราใช้ "on" เช่น on Sunday morning, on Monday evening`],w:{0:[`"At" is for clock times and for "at night".`,`"at" ใช้กับเวลานาฬิกาและกับวลี "at night"`],2:[`"In the morning" is correct on its own, but not when a day is named.`,`"in the morning" ใช้ได้เมื่ออยู่ลำพัง แต่ใช้ไม่ได้เมื่อระบุวันไว้ด้วย`],3:[`"By" means "not later than", as in "by six o’clock".`,`"by" แปลว่าไม่เกินเวลาใด เช่น "by six o’clock"`]}},{id:`T02-Q08`,s:`grammar`,k:`articles`,q:`I saw ____ old man feeding the birds in the park.`,c:[`a`,`the`,`this`,`an`],a:3,e:[`The man is mentioned for the first time and "old" begins with a vowel sound, so the correct article is "an".`,`ชายคนนี้ถูกกล่าวถึงเป็นครั้งแรก และคำว่า "old" ขึ้นต้นด้วยเสียงสระ จึงต้องใช้ "an"`],w:{0:[`"A" only comes before a consonant sound, and "old" begins with a vowel sound.`,`"a" ใช้หน้าเสียงพยัญชนะเท่านั้น แต่ "old" ขึ้นต้นด้วยเสียงสระ`],1:[`"The" is used for something already known to both speakers.`,`"the" ใช้กับสิ่งที่ผู้พูดทั้งสองฝ่ายรู้จักอยู่แล้ว`],2:[`"This" points at something close by, which does not suit a first mention in a story.`,`"this" ใช้ชี้สิ่งที่อยู่ใกล้ จึงไม่เหมาะกับการกล่าวถึงครั้งแรกในเรื่องเล่า`]}},{id:`T02-Q09`,s:`grammar`,k:`questions`,q:`A: ____ does your brother go to bed?    B: At nine o’clock.`,c:[`What time`,`How many`,`How much`,`Where`],a:0,e:[`The answer "At nine o’clock" gives a time, so the question must ask about time. "What time" is the correct question phrase.`,`คำตอบ "At nine o’clock" บอกเวลา คำถามจึงต้องถามเรื่องเวลา วลีคำถามที่ถูกต้องคือ "What time"`],w:{1:[`"How many" asks about a number of countable things.`,`"how many" ใช้ถามจำนวนของสิ่งที่นับได้`],2:[`"How much" asks about price or an uncountable amount.`,`"how much" ใช้ถามราคาหรือปริมาณของสิ่งที่นับไม่ได้`],3:[`"Where" asks about a place, and the answer given is not a place.`,`"where" ใช้ถามสถานที่ แต่คำตอบที่ให้มาไม่ใช่สถานที่`]}},{id:`T02-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The bus was so ____ that Kamon could not find a seat and had to stand.`,c:[`empty`,`quiet`,`clean`,`crowded`],a:3,e:[`If there is no seat left and you must stand, the bus is full of people. "Crowded" means full of people.`,`ถ้าไม่มีที่นั่งเหลือและต้องยืน แสดงว่ารถประจำทางเต็มไปด้วยผู้คน คำว่า "crowded" แปลว่าแออัดไปด้วยผู้คน`],w:{0:[`"Empty" means there is nobody there, so there would be many free seats.`,`"empty" แปลว่าว่างเปล่าไม่มีคน ซึ่งจะต้องมีที่นั่งว่างมากมาย`],1:[`"Quiet" describes the noise level and says nothing about the number of seats.`,`"quiet" บอกถึงระดับเสียง ไม่ได้บอกจำนวนที่นั่ง`],2:[`"Clean" describes how tidy the bus is, not how many people are on it.`,`"clean" บอกความสะอาด ไม่ได้บอกว่ามีคนมากน้อยเพียงใด`]}},{id:`T02-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`Grandmother told us an interesting story about her childhood. The word "interesting" is closest in meaning to ____.`,c:[`boring`,`fascinating`,`difficult`,`short`],a:1,e:[`"Interesting" means it holds your attention. "Fascinating" carries the same idea more strongly, so it is the closest synonym.`,`"interesting" หมายถึงน่าสนใจจนดึงดูดความสนใจไว้ได้ คำว่า "fascinating" มีความหมายเดียวกันแต่เข้มข้นกว่า จึงใกล้เคียงที่สุด`],w:{0:[`"Boring" is the opposite of "interesting".`,`"boring" มีความหมายตรงข้ามกับ "interesting"`],2:[`"Difficult" means hard to do or understand, which is not the same as interesting.`,`"difficult" แปลว่ายาก ซึ่งไม่เหมือนกับน่าสนใจ`],3:[`"Short" describes length, not how enjoyable the story is.`,`"short" บอกความยาว ไม่ได้บอกว่าเรื่องนั้นน่าสนใจเพียงใด`]}},{id:`T02-Q12`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The first question on the paper was easy, but the last one was very ____.`,c:[`simple`,`clear`,`difficult`,`useful`],a:2,e:[`"But" signals a contrast with "easy", so the missing word must mean the opposite. The opposite of easy is "difficult".`,`คำว่า "but" แสดงความขัดแย้งกับคำว่า "easy" คำที่หายไปจึงต้องมีความหมายตรงข้าม นั่นคือ "difficult"`],w:{0:[`"Simple" means almost the same as "easy", so there would be no contrast.`,`"simple" มีความหมายใกล้เคียงกับ "easy" จึงไม่เกิดความขัดแย้ง`],1:[`"Clear" means easy to understand — again no contrast with "easy".`,`"clear" แปลว่าเข้าใจง่าย ซึ่งก็ยังไม่ขัดแย้งกับ "easy"`],3:[`"Useful" describes value, not how hard a question is.`,`"useful" บอกประโยชน์ ไม่ได้บอกความยากง่ายของคำถาม`]}},{id:`T02-Q13`,s:`vocabulary`,k:`collocations`,q:`Every Saturday my brother ____ his homework before he plays football.`,c:[`does`,`makes`,`takes`,`gives`],a:0,e:[`English pairs "do" with homework, housework and the washing-up. "Do your homework" is the fixed expression.`,`ภาษาอังกฤษใช้ "do" คู่กับ homework, housework และ washing-up สำนวนที่ใช้จริงคือ "do your homework"`],w:{1:[`"Make" is used for things you create, such as "make a cake" or "make a plan".`,`"make" ใช้กับสิ่งที่สร้างขึ้น เช่น "make a cake" หรือ "make a plan"`],2:[`"Take" pairs with tests and photos: "take a test", "take a photo".`,`"take" ใช้คู่กับข้อสอบและรูปถ่าย เช่น "take a test", "take a photo"`],3:[`"Give" needs a receiver, as in "give the teacher his homework".`,`"give" ต้องมีผู้รับ เช่น "give the teacher his homework"`]}},{id:`T02-Q14`,s:`vocabulary`,k:`phrasal-verbs`,q:`Our plane leaves at six in the morning, so we must ____ very early tomorrow.`,c:[`get on`,`get over`,`get up`,`get in`],a:2,e:[`To catch an early plane you must leave your bed early. "Get up" means to rise from bed.`,`การจะไปขึ้นเครื่องบินเที่ยวเช้าได้ ต้องลุกจากเตียงแต่เช้า คำว่า "get up" แปลว่าลุกจากที่นอน`],w:{0:[`"Get on" means to board a bus, train or plane, not to leave your bed.`,`"get on" แปลว่าขึ้นรถ ขึ้นรถไฟ หรือขึ้นเครื่องบิน ไม่ได้แปลว่าตื่นนอน`],1:[`"Get over" means to recover from an illness or a problem.`,`"get over" แปลว่าหายจากอาการป่วยหรือผ่านพ้นปัญหา`],3:[`"Get in" means to enter a car or to arrive.`,`"get in" แปลว่าเข้าไปในรถหรือเดินทางมาถึง`]}},{id:`T02-Q15`,s:`conversation`,k:`conversation`,intro:`Tan: I’m really sorry. I broke your ruler.
Mint: ____`,q:`Choose the best reply for Mint.`,c:[`Yes, you are.`,`That’s all right. Don’t worry about it.`,`You’re welcome.`,`No, thank you.`],a:1,e:[`Tan is apologising. The natural English reply accepts the apology and tells the other person not to worry.`,`ตันกำลังกล่าวขอโทษ คำตอบที่เป็นธรรมชาติในภาษาอังกฤษคือการยอมรับคำขอโทษและบอกให้อีกฝ่ายไม่ต้องกังวล`],w:{0:[`"Yes, you are." sounds like agreeing that Tan is a bad person. It is impolite.`,`"Yes, you are." ฟังเหมือนเห็นด้วยว่าตันเป็นคนไม่ดี จึงเป็นคำพูดที่ไม่สุภาพ`],2:[`"You’re welcome." is the reply to "Thank you", not to "I’m sorry".`,`"You’re welcome." ใช้ตอบคำว่า "Thank you" ไม่ได้ใช้ตอบคำขอโทษ`],3:[`"No, thank you." refuses an offer; no offer was made here.`,`"No, thank you." ใช้ปฏิเสธข้อเสนอ แต่ในที่นี้ไม่มีข้อเสนอใด`]}},{id:`T02-Q16`,s:`conversation`,k:`conversation`,intro:`Student: ____
Teacher: Yes, of course. Be back in five minutes.`,q:`Choose the best line for the student.`,c:[`Where is the toilet?`,`Do you want to go out?`,`I am going out now.`,`May I go to the toilet, please?`],a:3,e:[`The teacher answers "Yes, of course", which is a reply to a request for permission. "May I…, please?" is the polite way to ask.`,`ครูตอบว่า "Yes, of course" ซึ่งเป็นคำตอบของการขออนุญาต ประโยค "May I…, please?" จึงเป็นการขออนุญาตอย่างสุภาพ`],w:{0:[`This asks for a place, and the answer would be a direction, not "Yes, of course".`,`ประโยคนี้ถามถึงสถานที่ คำตอบจึงควรเป็นการบอกทาง ไม่ใช่ "Yes, of course"`],1:[`A student would not ask the teacher whether the teacher wants to leave.`,`นักเรียนคงไม่ถามครูว่าครูอยากออกไปข้างนอกหรือไม่`],2:[`This is a statement, not a request, and it sounds rude to a teacher.`,`ประโยคนี้เป็นการบอกกล่าว ไม่ใช่การขออนุญาต และฟังดูไม่สุภาพต่อครู`]}},{id:`T02-Q17`,s:`conversation`,k:`conversation`,intro:`Caller: Hello, may I speak to Nan, please?
Nan’s brother: ____`,q:`Choose the best reply for Nan’s brother.`,c:[`Just a moment, please. I’ll get her.`,`Yes, I am Nan speaking to you.`,`No, you may not.`,`She is my sister.`],a:0,e:[`On the telephone, when the caller asks for someone else in the house, the natural reply is to ask them to wait while you fetch that person.`,`ในการสนทนาทางโทรศัพท์ เมื่อผู้โทรขอพูดกับคนอื่นในบ้าน คำตอบที่เป็นธรรมชาติคือขอให้รอสักครู่แล้วไปตามคนนั้นมา`],w:{1:[`The brother is not Nan, so he cannot say he is Nan.`,`พี่ชายไม่ใช่แนน จึงพูดว่าตนเองคือแนนไม่ได้`],2:[`"No, you may not." is very rude and gives no reason.`,`"No, you may not." ฟังดูหยาบคายมากและไม่ได้ให้เหตุผลใด`],3:[`This is true but does not answer the caller’s request.`,`ประโยคนี้เป็นความจริง แต่ไม่ได้ตอบสิ่งที่ผู้โทรขอ`]}},{id:`T02-Q18`,s:`conversation`,k:`conversation`,intro:`Bow: Thank you for helping me with my science project.
Earn: ____`,q:`Choose the best reply for Earn.`,c:[`Never mind.`,`Yes, I did.`,`You’re welcome. I was happy to help.`,`Sorry about that.`],a:2,e:[`Bow is thanking Earn, so Earn should accept the thanks. "You’re welcome" is the standard reply, and the second sentence sounds warm and natural.`,`โบว์กำลังกล่าวขอบคุณ เอิร์นจึงควรตอบรับคำขอบคุณ ประโยค "You’re welcome" เป็นคำตอบมาตรฐาน และประโยคที่ตามมาทำให้ฟังดูเป็นมิตร`],w:{0:[`"Never mind." is used to comfort someone after a problem or a mistake.`,`"Never mind." ใช้ปลอบใจหลังเกิดปัญหาหรือความผิดพลาด`],1:[`"Yes, I did." confirms a fact but ignores the thanks.`,`"Yes, I did." เป็นการยืนยันข้อเท็จจริง แต่ไม่ได้ตอบรับคำขอบคุณ`],3:[`"Sorry about that." is an apology, and Earn has done nothing wrong.`,`"Sorry about that." เป็นคำขอโทษ แต่เอิร์นไม่ได้ทำอะไรผิด`]}},{id:`T02-Q19`,s:`reading`,k:`reading-main-idea`,p:`T02-P1`,q:`What is the news report mainly about?`,c:[`A class that read the most books in a school competition`,`A new library that opened at Wat Pho Sri School`,`A teacher who wrote a story book for her students`,`A lunchtime club that Grade 6 students started`],a:0,e:[`The report gives the competition, the numbers of books, the winning class and the prize. All of it supports one main idea: Grade 6 won the Reading Challenge.`,`บทความกล่าวถึงการแข่งขัน จำนวนหนังสือ ห้องที่ชนะ และรางวัล ทั้งหมดสนับสนุนใจความสำคัญเดียวคือ ป.6 ชนะการแข่งขันการอ่าน`],w:{1:[`The prize was books for the classroom library, but no new library opened.`,`รางวัลคือหนังสือสำหรับมุมหนังสือในห้องเรียน แต่ไม่ได้มีการเปิดห้องสมุดใหม่`],2:[`Miss Kesinee is the class teacher; she did not write a book.`,`ครูเกศินีเป็นครูประจำชั้น ไม่ได้เป็นผู้เขียนหนังสือ`],3:[`Talking about books at lunchtime is one detail Nut mentions, not the main idea.`,`การคุยเรื่องหนังสือตอนพักกลางวันเป็นเพียงรายละเอียดที่นัทกล่าวถึง ไม่ใช่ใจความสำคัญ`]}},{id:`T02-Q20`,s:`reading`,k:`reading-detail`,p:`T02-P1`,q:`How many books did Grade 5 read?`,c:[`214 books`,`152 books`,`187 books`,`The report does not say`],a:2,e:[`The second paragraph says, "Grade 5 came second with 187 books."`,`ย่อหน้าที่สองระบุว่า "Grade 5 came second with 187 books." คือ 187 เล่ม`],w:{0:[`214 is the number Grade 6 read — the winning class.`,`214 คือจำนวนที่ ป.6 อ่าน ซึ่งเป็นห้องที่ชนะ`],1:[`152 is the number Grade 4 read.`,`152 คือจำนวนที่ ป.4 อ่าน`],3:[`The number is given clearly in the second paragraph.`,`ตัวเลขนี้ระบุไว้ชัดเจนในย่อหน้าที่สอง`]}},{id:`T02-Q21`,s:`reading`,k:`reading-vocab`,p:`T02-P1`,q:`In the report, the word "altogether" is closest in meaning to ____.`,c:[`every month`,`by themselves`,`one by one`,`in total`],a:3,e:[`"Grade 6 read 214 books altogether" adds up every book the whole class read, so "altogether" means "in total".`,`ประโยค "Grade 6 read 214 books altogether" หมายถึงรวมหนังสือทุกเล่มที่ทั้งห้องอ่าน คำว่า "altogether" จึงแปลว่า "รวมทั้งหมด"`],w:{0:[`The books were counted in October only, not every month.`,`มีการนับหนังสือเฉพาะเดือนตุลาคมเท่านั้น ไม่ใช่ทุกเดือน`],1:[`"By themselves" means alone, but the number is the whole class added together.`,`"by themselves" แปลว่าโดยลำพัง แต่ตัวเลขนี้คือผลรวมของทั้งห้อง`],2:[`"One by one" describes an order of doing things, not a total.`,`"one by one" บอกลำดับการทำสิ่งต่าง ๆ ไม่ได้บอกผลรวม`]}},{id:`T02-Q22`,s:`reading`,k:`reading-inference`,p:`T02-P1`,q:`What did Nut like best about the Reading Challenge?`,c:[`Winning the box of new story books`,`Talking about books with his friends`,`Being praised by Miss Kesinee in class`,`Reading all 214 books by himself`],a:1,e:[`Nut says the best part was "not the prize" but that he and his friends started talking about books at lunchtime.`,`นัทบอกว่าส่วนที่ดีที่สุด "ไม่ใช่รางวัล" แต่คือการที่เขากับเพื่อน ๆ เริ่มคุยกันเรื่องหนังสือตอนพักกลางวัน`],w:{0:[`Nut says directly that the prize was not the best part.`,`นัทบอกอย่างชัดเจนว่ารางวัลไม่ใช่ส่วนที่ดีที่สุด`],2:[`Miss Kesinee said she was proud, but Nut does not mention that as his favourite part.`,`ครูเกศินีบอกว่าภูมิใจ แต่นัทไม่ได้กล่าวถึงเรื่องนี้ว่าเป็นสิ่งที่เขาชอบที่สุด`],3:[`The 214 books were read by the whole class, not by Nut alone.`,`หนังสือ 214 เล่มเป็นผลงานของทั้งห้อง ไม่ใช่ของนัทคนเดียว`]}},{id:`T02-Q23`,s:`reading`,k:`reading-detail`,p:`T02-P2`,q:`Which club meets in Lab 2?`,c:[`Chess Club`,`Art Club`,`Music Club`,`Science Club`],a:3,e:[`The Wednesday row of the timetable shows Science Club in Lab 2 with Mr. Somchai.`,`แถววันพุธในตารางระบุว่าชมรมวิทยาศาสตร์อยู่ที่ห้องแล็บ 2 กับครูสมชาย`],w:{0:[`Chess Club is in Room 12 on Monday.`,`ชมรมหมากรุกอยู่ห้อง 12 ในวันจันทร์`],1:[`Art Club is in the Art Room on Tuesday.`,`ชมรมศิลปะอยู่ที่ห้องศิลปะในวันอังคาร`],2:[`Music Club is in the Music Room on Thursday.`,`ชมรมดนตรีอยู่ที่ห้องดนตรีในวันพฤหัสบดี`]}},{id:`T02-Q24`,s:`reading`,k:`reading-detail`,p:`T02-P2`,q:`How long does each club meeting last?`,c:[`Half an hour`,`One hour`,`Two hours`,`The whole afternoon`],a:1,e:[`The clubs run from 3:30 p.m. to 4:30 p.m., and the time from 3:30 to 4:30 is exactly one hour.`,`ชมรมเริ่ม 15:30 น. และเลิก 16:30 น. ซึ่งห่างกันพอดี 1 ชั่วโมง`],w:{0:[`Half an hour would end at 4:00 p.m., but the clubs end at 4:30 p.m.`,`ครึ่งชั่วโมงจะเลิกเวลา 16:00 น. แต่ชมรมเลิก 16:30 น.`],2:[`Two hours would end at 5:30 p.m., which is not the time given.`,`สองชั่วโมงจะเลิกเวลา 17:30 น. ซึ่งไม่ตรงกับเวลาที่ระบุ`],3:[`The notice gives an exact hour, so it is not the whole afternoon.`,`ประกาศระบุเวลาไว้ชัดเจนหนึ่งชั่วโมง จึงไม่ใช่ตลอดทั้งบ่าย`]}},{id:`T02-Q25`,s:`reading`,k:`reading-inference`,p:`T02-P2`,q:`Mali wants to join the club that meets on the school field. Which afternoon should she keep free?`,c:[`Monday`,`Wednesday`,`Friday`,`Thursday`],a:2,e:[`The timetable shows the School Field is used by Football Club, and Football Club meets on Friday.`,`ตารางระบุว่าสนามโรงเรียนใช้โดยชมรมฟุตบอล และชมรมฟุตบอลพบกันในวันศุกร์`],w:{0:[`Monday is Chess Club, which meets in Room 12.`,`วันจันทร์เป็นชมรมหมากรุกซึ่งพบกันที่ห้อง 12`],1:[`Wednesday is Science Club in Lab 2.`,`วันพุธเป็นชมรมวิทยาศาสตร์ที่ห้องแล็บ 2`],3:[`Thursday is Music Club in the Music Room.`,`วันพฤหัสบดีเป็นชมรมดนตรีที่ห้องดนตรี`]}}]},{id:`test-03`,number:3,title:`Practice Test 3`,subtitle:`Standard — Health, Food and Free Time`,tier:`standard`,minutes:35,passages:[{id:`T03-P1`,kind:`Advertisement`,title:`Sunrise Swimming School — Learn to Swim This Summer`,body:[`Can your child swim? At Sunrise Swimming School we teach children aged 7 to 14 in small groups of six.`,`Beginner course: 10 lessons, Monday and Wednesday, 4:00 p.m. – 5:00 p.m., 1,500 baht.`,`Improver course: 10 lessons, Tuesday and Thursday, 4:00 p.m. – 5:00 p.m., 1,800 baht.`,`All our teachers hold a life-saving certificate. Swimming caps must be worn in the pool, and we lend caps free of charge to new students.`,`Book before 30 April and pay only half price for the first lesson.`],footer:[`Call 02-555-1234 or visit us at 88 Lotus Road, opposite the town library.`]},{id:`T03-P2`,kind:`Diary entry`,title:`Tuesday 12 July`,body:[`What a day! Our class went to the science museum this morning. I sat next to Ohm on the bus and we sang the whole way there.`,`My favourite room was the space room. There was a model of the moon that you could touch, and a screen that showed how heavy you would be on Mars. I would weigh only 13 kilograms there!`,`At lunch I opened my bag and found that I had picked up my little brother’s lunchbox by mistake. It was full of biscuits and nothing else. Ohm shared his rice with me, which was very kind.`,`On the way home our teacher told us to write one page about the trip. I have written three.`]}],questions:[{id:`T03-Q01`,s:`grammar`,k:`tenses`,q:`While Mother ____ dinner, the electricity suddenly went off.`,c:[`cooks`,`was cooking`,`has cooked`,`cook`],a:1,e:[`One longer action was in progress when a short action interrupted it. The long action takes the past continuous: was cooking.`,`มีเหตุการณ์หนึ่งกำลังดำเนินอยู่แล้วมีเหตุการณ์สั้น ๆ มาแทรก เหตุการณ์ที่ดำเนินอยู่จึงใช้ past continuous คือ was cooking`],w:{0:[`"Cooks" is present simple and does not match the past event "went off".`,`"cooks" เป็น present simple ไม่สอดคล้องกับเหตุการณ์ในอดีต "went off"`],2:[`"Has cooked" links the past to now; here both actions are finished past events.`,`"has cooked" เชื่อมอดีตกับปัจจุบัน แต่ในที่นี้ทั้งสองเหตุการณ์จบไปแล้วในอดีต`],3:[`"Cook" does not agree with the singular subject and is not a past form.`,`"cook" ไม่สอดคล้องกับประธานเอกพจน์ และไม่ใช่รูปอดีต`]}},{id:`T03-Q02`,s:`grammar`,k:`tenses`,q:`Pim ____ in Bangkok since she was five years old.`,c:[`lived`,`lives`,`is living`,`has lived`],a:3,e:[`We use the present perfect because the action started in the past and continues until now. The word "since" introduces the starting point.`,`ใช้ Present Perfect เพราะเริ่มอาศัยอยู่ในอดีตและยังคงอาศัยอยู่จนถึงปัจจุบัน โดย "since" ใช้บอกจุดเริ่มต้นของเวลา`],w:{0:[`"Lived" is the past simple. It describes a completed action, but this sentence shows that the action continues until now.`,`"lived" เป็น past simple ใช้กับเหตุการณ์ที่จบแล้ว แต่ประโยคนี้แสดงว่าการกระทำยังดำเนินต่อถึงปัจจุบัน`],1:[`"Lives" is present simple and cannot be used with "since", which needs a perfect tense.`,`"lives" เป็น present simple ใช้กับ "since" ไม่ได้ เพราะ "since" ต้องใช้กับ perfect tense`],2:[`"Is living" suggests a temporary situation right now and does not fit "since she was five".`,`"is living" สื่อถึงสถานการณ์ชั่วคราวในตอนนี้ จึงไม่เข้ากับ "since she was five"`]}},{id:`T03-Q03`,s:`grammar`,k:`agreement`,q:`Each of the students ____ a name card on the desk.`,c:[`has`,`have`,`are having`,`having`],a:0,e:[`The subject is "each", which is always singular even when a plural noun follows it. A singular subject takes "has".`,`ประธานคือ "each" ซึ่งถือเป็นเอกพจน์เสมอ แม้จะมีคำนามพหูพจน์ตามมา ประธานเอกพจน์จึงใช้ "has"`],w:{1:[`"Have" agrees with a plural subject, but "each" is singular.`,`"have" ใช้กับประธานพหูพจน์ แต่ "each" เป็นเอกพจน์`],2:[`"Are having" is plural and continuous; "have" for possession is not used in the continuous form.`,`"are having" เป็นพหูพจน์และเป็นรูป continuous ซึ่ง have ที่แปลว่ามีจะไม่ใช้ในรูป continuous`],3:[`"Having" cannot be the main verb of the sentence on its own.`,`"having" เป็นกริยาหลักของประโยคตามลำพังไม่ได้`]}},{id:`T03-Q04`,s:`grammar`,k:`pronouns`,q:`Nan and Fah are twins. ____ bedroom is right next to mine.`,c:[`They`,`Theirs`,`Their`,`Them`],a:2,e:[`A noun ("bedroom") follows the blank, so we need a possessive adjective. The possessive adjective for "they" is "their".`,`มีคำนาม ("bedroom") ตามหลังช่องว่าง จึงต้องใช้คำคุณศัพท์แสดงความเป็นเจ้าของ ซึ่งของ "they" คือ "their"`],w:{0:[`"They" is a subject pronoun and cannot describe who owns the bedroom.`,`"they" เป็นสรรพนามประธาน ใช้บอกความเป็นเจ้าของห้องนอนไม่ได้`],1:[`"Theirs" stands alone with no noun after it, as in "The bedroom is theirs."`,`"theirs" ใช้อยู่ลำพังโดยไม่มีคำนามตามหลัง เช่น "The bedroom is theirs."`],3:[`"Them" is an object pronoun, used after a verb or preposition.`,`"them" เป็นสรรพนามกรรม ใช้หลังกริยาหรือคำบุพบท`]}},{id:`T03-Q05`,s:`grammar`,k:`quantifiers`,q:`____ of the boys in my class can swim, but the rest cannot.`,c:[`Much`,`Every`,`Each`,`Some`],a:3,e:[`The phrase "but the rest cannot" shows that only part of the group can swim. "Some" names part of a countable group.`,`วลี "but the rest cannot" แสดงว่ามีเพียงบางส่วนของกลุ่มที่ว่ายน้ำได้ คำว่า "some" ใช้บอกบางส่วนของกลุ่มที่นับได้`],w:{0:[`"Much" is used with uncountable nouns, but "boys" is countable.`,`"much" ใช้กับคำนามนับไม่ได้ แต่ "boys" เป็นคำนามนับได้`],1:[`"Every" is not used in the pattern "____ of the…", and it would mean all of them.`,`"every" ใช้ในรูป "____ of the…" ไม่ได้ อีกทั้งความหมายจะกลายเป็นทุกคน`],2:[`"Each of the boys" means every single one, which contradicts "the rest cannot".`,`"each of the boys" หมายถึงทุกคน ซึ่งขัดแย้งกับ "the rest cannot"`]}},{id:`T03-Q06`,s:`grammar`,k:`comparisons`,q:`Of all the fruit on the table, the mangosteen is ____.`,c:[`the sweetest`,`sweeter`,`sweetest than`,`more sweet`],a:0,e:[`"Of all the fruit" compares one item with a whole group, so a superlative is needed, and English superlatives take "the": the sweetest.`,`วลี "of all the fruit" เป็นการเปรียบเทียบสิ่งหนึ่งกับทั้งกลุ่ม จึงต้องใช้ขั้นสุด และขั้นสุดในภาษาอังกฤษต้องมี "the" นำหน้า คือ the sweetest`],w:{1:[`"Sweeter" compares only two things and needs "than".`,`"sweeter" ใช้เปรียบเทียบเพียงสองสิ่ง และต้องมี "than" ตามมา`],2:[`A superlative never takes "than". We say "the sweetest of all".`,`ขั้นสุดจะไม่ใช้กับ "than" เราพูดว่า "the sweetest of all"`],3:[`Short adjectives form the superlative with -est, not with "more".`,`คำคุณศัพท์พยางค์สั้นสร้างขั้นสุดโดยเติม -est ไม่ใช้ "more"`]}},{id:`T03-Q07`,s:`grammar`,k:`modals`,q:`You look very pale and tired. You ____ see a doctor today.`,c:[`can`,`may`,`should`,`will`],a:2,e:[`The speaker is giving advice about the best thing to do. "Should" is the modal used for advice.`,`ผู้พูดกำลังให้คำแนะนำว่าอะไรเป็นสิ่งที่ควรทำ กริยาช่วยที่ใช้ให้คำแนะนำคือ "should"`],w:{0:[`"Can" shows ability or permission, not advice.`,`"can" แสดงความสามารถหรือการอนุญาต ไม่ใช่การให้คำแนะนำ`],1:[`"May" gives permission or shows possibility.`,`"may" ใช้ให้การอนุญาตหรือแสดงความเป็นไปได้`],3:[`"Will" states a future fact or a decision, not a recommendation.`,`"will" บอกข้อเท็จจริงหรือการตัดสินใจในอนาคต ไม่ใช่คำแนะนำ`]}},{id:`T03-Q08`,s:`grammar`,k:`verb-patterns`,q:`My father enjoys ____ in the garden on Sunday afternoons.`,c:[`to work`,`working`,`work`,`works`],a:1,e:[`Some verbs are always followed by the -ing form, and "enjoy" is one of them: enjoy working, enjoy reading.`,`กริยาบางคำต้องตามด้วยรูป -ing เสมอ และ "enjoy" เป็นหนึ่งในนั้น เช่น enjoy working, enjoy reading`],w:{0:[`"Enjoy" is never followed by "to + verb". We say "enjoy working".`,`หลัง "enjoy" ไม่ใช้ "to + กริยา" เราพูดว่า "enjoy working"`],2:[`The base form cannot follow "enjoy" directly.`,`กริยารูปพื้นฐานตามหลัง "enjoy" โดยตรงไม่ได้`],3:[`"Works" is a finite verb; a sentence cannot have two finite verbs joined this way.`,`"works" เป็นกริยาที่ผันแล้ว ประโยคเดียวจะมีกริยาผันสองตัวต่อกันแบบนี้ไม่ได้`]}},{id:`T03-Q09`,s:`grammar`,k:`prepositions`,q:`The cat is hiding ____ the sofa and the wall.`,c:[`among`,`beside`,`under`,`between`],a:3,e:[`The cat is in the space separating two named things, so "between" is correct: between A and B.`,`แมวอยู่ในช่องว่างระหว่างสิ่งของสองสิ่งที่ระบุไว้ จึงต้องใช้ "between" ในรูป between A and B`],w:{0:[`"Among" is used for three or more things or a group, as in "among the trees".`,`"among" ใช้กับสิ่งของตั้งแต่สามสิ่งขึ้นไปหรือกลุ่ม เช่น "among the trees"`],1:[`"Beside" means next to one thing only and does not take "and".`,`"beside" แปลว่าอยู่ข้าง ๆ สิ่งเดียว และไม่ใช้คู่กับ "and"`],2:[`"Under" means below something, which does not fit "the sofa and the wall".`,`"under" แปลว่าอยู่ใต้สิ่งใดสิ่งหนึ่ง จึงไม่เข้ากับ "the sofa and the wall"`]}},{id:`T03-Q10`,s:`vocabulary`,k:`vocab-context`,q:`Because of the heavy rain, the football match was ____ until next Saturday.`,c:[`postponed`,`finished`,`started`,`won`],a:0,e:[`The match will happen later than planned. "Postpone" means to move an event to a later time.`,`การแข่งขันจะเกิดขึ้นช้ากว่ากำหนดเดิม คำว่า "postpone" แปลว่าเลื่อนกิจกรรมออกไปเป็นเวลาภายหลัง`],w:{1:[`"Finished" means the match was completed, but it has not been played yet.`,`"finished" แปลว่าจบลงแล้ว แต่การแข่งขันนี้ยังไม่ได้เริ่มเล่นเลย`],2:[`"Started" cannot be followed by "until next Saturday" in this meaning.`,`"started" ใช้กับ "until next Saturday" ในความหมายนี้ไม่ได้`],3:[`"Won" needs a team as the winner and does not explain a change of date.`,`"won" ต้องมีทีมที่เป็นผู้ชนะ และไม่ได้อธิบายการเปลี่ยนวันแข่ง`]}},{id:`T03-Q11`,s:`vocabulary`,k:`collocations`,q:`Remember to ____ a photo of the whiteboard before you leave the classroom.`,c:[`do`,`make`,`take`,`give`],a:2,e:[`English pairs "take" with photos: take a photo, take a picture. The other verbs are not used this way.`,`ภาษาอังกฤษใช้ "take" คู่กับรูปถ่าย เช่น take a photo, take a picture ส่วนกริยาอื่นไม่ใช้ในรูปนี้`],w:{0:[`"Do" pairs with homework and housework, not with photos.`,`"do" ใช้คู่กับ homework และ housework ไม่ใช้กับรูปถ่าย`],1:[`"Make" is for creating things, such as "make a cake".`,`"make" ใช้กับการสร้างสิ่งของ เช่น "make a cake"`],3:[`"Give a photo" means to hand a photo to someone, not to use a camera.`,`"give a photo" หมายถึงยื่นรูปให้ใคร ไม่ได้หมายถึงการถ่ายรูป`]}},{id:`T03-Q12`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The instructions on the box were confusing, so nobody knew what to do. The opposite of "confusing" is ____.`,c:[`boring`,`clear`,`long`,`loud`],a:1,e:[`"Confusing" means hard to understand. The opposite is "clear", which means easy to understand.`,`"confusing" แปลว่าเข้าใจยาก คำตรงข้ามคือ "clear" ซึ่งแปลว่าเข้าใจง่าย`],w:{0:[`"Boring" means not interesting. Something boring can still be easy to understand.`,`"boring" แปลว่าน่าเบื่อ สิ่งที่น่าเบื่อก็ยังเข้าใจง่ายได้`],2:[`"Long" describes length, not how easy something is to understand.`,`"long" บอกความยาว ไม่ได้บอกว่าเข้าใจง่ายหรือยาก`],3:[`"Loud" describes sound and cannot describe written instructions.`,`"loud" บอกความดังของเสียง จึงใช้กับคำแนะนำที่เขียนไว้ไม่ได้`]}},{id:`T03-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`I don’t know what this word means. I will ____ in my dictionary.`,c:[`look after it`,`look at it`,`look for it`,`look it up`],a:3,e:[`"Look up" means to search for information in a dictionary, a book or online. With a pronoun the object goes in the middle: look it up.`,`"look up" แปลว่าค้นหาข้อมูลในพจนานุกรม หนังสือ หรืออินเทอร์เน็ต และเมื่อกรรมเป็นคำสรรพนามต้องวางไว้ตรงกลาง คือ look it up`],w:{0:[`"Look after" means to take care of someone or something.`,`"look after" แปลว่าดูแลคนหรือสิ่งของ`],1:[`"Look at" simply means to turn your eyes towards something.`,`"look at" แปลว่ามองไปที่สิ่งใดสิ่งหนึ่งเท่านั้น`],2:[`"Look for" means to search for a lost thing, not to find a meaning.`,`"look for" แปลว่าตามหาสิ่งที่หายไป ไม่ได้หมายถึงการค้นหาความหมาย`]}},{id:`T03-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The main road was ____ after the flood, so the bus had to take a different way.`,c:[`crowded`,`blocked`,`narrow`,`famous`],a:1,e:[`The bus could not use the road at all, so something was stopping traffic. "Blocked" means closed off so nothing can pass.`,`รถประจำทางใช้ถนนนี้ไม่ได้เลย แสดงว่ามีบางสิ่งขวางอยู่ คำว่า "blocked" แปลว่าถูกปิดกั้นจนผ่านไม่ได้`],w:{0:[`"Crowded" means full of people or traffic; a crowded road is slow but still usable.`,`"crowded" แปลว่าแออัด ถนนที่แออัดจะไปได้ช้าแต่ยังใช้ได้`],2:[`"Narrow" describes the width of a road and does not explain why the bus changed route.`,`"narrow" บอกความกว้างของถนน ไม่ได้อธิบายว่าทำไมรถต้องเปลี่ยนเส้นทาง`],3:[`"Famous" means well known, which has nothing to do with the flood.`,`"famous" แปลว่ามีชื่อเสียง ซึ่งไม่เกี่ยวกับน้ำท่วม`]}},{id:`T03-Q15`,s:`conversation`,k:`conversation`,intro:`Tourist: Excuse me, how do I get to the post office?
Student: ____`,q:`Choose the best reply for the student.`,c:[`It is a very old building indeed.`,`I go there almost every week.`,`Go straight on and turn left at the traffic lights.`,`You can buy stamps and envelopes there.`],a:2,e:[`"How do I get to…?" asks for directions, so the answer must tell the person which way to walk.`,`คำถาม "How do I get to…?" เป็นการถามทาง คำตอบจึงต้องบอกว่าให้เดินไปทางไหน`],w:{0:[`This describes the building instead of giving directions.`,`ประโยคนี้บรรยายลักษณะอาคาร ไม่ได้บอกทาง`],1:[`This talks about the speaker’s habit and does not help the tourist.`,`ประโยคนี้พูดถึงกิจวัตรของผู้พูด ไม่ได้ช่วยนักท่องเที่ยว`],3:[`This explains what you can do at the post office, not how to reach it.`,`ประโยคนี้บอกว่าทำอะไรได้ที่ไปรษณีย์ ไม่ได้บอกวิธีไปถึง`]}},{id:`T03-Q16`,s:`conversation`,k:`conversation`,intro:`Waiter: Are you ready to order?
Customer: ____`,q:`Choose the best reply for the customer.`,c:[`Yes. I’ll have the chicken rice, please.`,`Yes, the restaurant is very busy tonight.`,`Here is your change, thank you.`,`It was delicious, thank you very much.`],a:0,e:[`"Are you ready to order?" invites the customer to say what food they want, so the reply names a dish.`,`คำถาม "Are you ready to order?" เป็นการเชิญให้ลูกค้าบอกอาหารที่ต้องการ คำตอบจึงต้องระบุชื่ออาหาร`],w:{1:[`This comments on the restaurant instead of ordering food.`,`ประโยคนี้แสดงความเห็นเรื่องร้าน ไม่ได้สั่งอาหาร`],2:[`The waiter gives change, not the customer, and only after paying.`,`พนักงานเป็นฝ่ายทอนเงินให้ลูกค้า และเกิดขึ้นหลังจ่ายเงินแล้ว`],3:[`This is said after the meal, not before ordering it.`,`ประโยคนี้พูดหลังรับประทานอาหารเสร็จ ไม่ใช่ก่อนสั่งอาหาร`]}},{id:`T03-Q17`,s:`conversation`,k:`conversation`,intro:`Ice: I’m so bored. What shall we do this afternoon?
Gun: ____`,q:`Choose the best reply for Gun.`,c:[`I am bored too, thank you.`,`That is a very good idea of mine.`,`You must not be bored at all.`,`Why don’t we go for a bike ride?`],a:3,e:[`"What shall we do?" asks for a suggestion. "Why don’t we…?" is a natural way to suggest an activity.`,`คำถาม "What shall we do?" เป็นการขอคำแนะนำ วลี "Why don’t we…?" เป็นวิธีเสนอกิจกรรมที่เป็นธรรมชาติ`],w:{0:[`Saying "thank you" here makes no sense, and no suggestion is given.`,`การพูดว่า "thank you" ตรงนี้ไม่สมเหตุสมผล และยังไม่ได้เสนอกิจกรรมใด`],1:[`You cannot praise your own idea before you have said it.`,`จะชมความคิดของตัวเองก่อนที่จะพูดออกมายังไม่ได้`],2:[`Telling a friend they must not feel bored is not a suggestion and sounds unkind.`,`การบอกเพื่อนว่าห้ามเบื่อไม่ใช่การเสนอกิจกรรม และฟังดูไม่เป็นมิตร`]}},{id:`T03-Q18`,s:`conversation`,k:`conversation`,intro:`Doctor: ____
Patient: I’ve had a sore throat since Monday.`,q:`Choose the best line for the doctor.`,c:[`How old are you?`,`What seems to be the problem?`,`Where do you live?`,`How much do you weigh?`],a:1,e:[`The patient answers by describing a symptom, so the doctor must have asked what is wrong. "What seems to be the problem?" is the usual opening question.`,`ผู้ป่วยตอบด้วยการบอกอาการ แสดงว่าหมอถามว่ามีอาการอะไร ประโยค "What seems to be the problem?" จึงเป็นคำถามเปิดที่หมอใช้เป็นปกติ`],w:{0:[`"How old are you?" would be answered with a number of years.`,`คำถาม "How old are you?" ต้องตอบด้วยจำนวนปี`],2:[`"Where do you live?" asks about an address, not a symptom.`,`คำถาม "Where do you live?" ถามที่อยู่ ไม่ได้ถามอาการ`],3:[`"How much do you weigh?" is answered with a weight, not with a sore throat.`,`คำถาม "How much do you weigh?" ต้องตอบด้วยน้ำหนัก ไม่ใช่อาการเจ็บคอ`]}},{id:`T03-Q19`,s:`reading`,k:`reading-detail`,p:`T03-P1`,q:`How many students are there in one swimming group?`,c:[`Ten`,`Fourteen`,`Seven`,`Six`],a:3,e:[`The first line says the school teaches children "in small groups of six".`,`บรรทัดแรกระบุว่าโรงเรียนสอนเด็ก "in small groups of six" คือกลุ่มละ 6 คน`],w:{0:[`Ten is the number of lessons in a course, not the group size.`,`สิบคือจำนวนบทเรียนในหนึ่งคอร์ส ไม่ใช่จำนวนคนในกลุ่ม`],1:[`Fourteen is the oldest age the school accepts.`,`สิบสี่คืออายุมากที่สุดที่โรงเรียนรับ`],2:[`Seven is the youngest age the school accepts.`,`เจ็ดคืออายุน้อยที่สุดที่โรงเรียนรับ`]}},{id:`T03-Q20`,s:`reading`,k:`reading-detail`,p:`T03-P1`,q:`Which course has a lesson on Tuesday?`,c:[`The beginner course`,`The improver course`,`Both courses`,`Neither course`],a:1,e:[`The improver course runs on Tuesday and Thursday; the beginner course runs on Monday and Wednesday.`,`คอร์สระดับกลางเรียนวันอังคารและวันพฤหัสบดี ส่วนคอร์สเริ่มต้นเรียนวันจันทร์และวันพุธ`],w:{0:[`The beginner course meets on Monday and Wednesday.`,`คอร์สเริ่มต้นเรียนวันจันทร์และวันพุธ`],2:[`The two courses are on different days, so they never share Tuesday.`,`สองคอร์สเรียนคนละวัน จึงไม่มีคอร์สใดตรงกันในวันอังคาร`],3:[`One course clearly does meet on Tuesday.`,`มีคอร์สหนึ่งที่เรียนในวันอังคารอย่างชัดเจน`]}},{id:`T03-Q21`,s:`reading`,k:`reading-detail`,p:`T03-P1`,q:`What must every student wear in the pool?`,c:[`A swimming cap`,`A life jacket`,`A pair of goggles`,`A name badge`],a:0,e:[`The advertisement states, "Swimming caps must be worn in the pool," and adds that caps are lent free to new students.`,`โฆษณาระบุว่า "Swimming caps must be worn in the pool" และเสริมว่าให้ยืมหมวกฟรีสำหรับนักเรียนใหม่`],w:{1:[`Life jackets are never mentioned; the teachers hold life-saving certificates instead.`,`ไม่มีการกล่าวถึงเสื้อชูชีพ แต่กล่าวว่าครูมีใบรับรองการช่วยชีวิต`],2:[`Goggles are not mentioned anywhere in the advertisement.`,`ไม่มีการกล่าวถึงแว่นตาว่ายน้ำในโฆษณา`],3:[`No name badge is mentioned in the text.`,`ไม่มีการกล่าวถึงป้ายชื่อในข้อความ`]}},{id:`T03-Q22`,s:`reading`,k:`reading-inference`,p:`T03-P1`,q:`Why was this text written?`,c:[`To explain the rules of a swimming competition`,`To warn parents about the danger of deep water`,`To persuade parents to sign their children up for swimming lessons`,`To describe how the town library was built`],a:2,e:[`The text gives prices, times, a booking deadline and a discount — all features of an advertisement designed to attract customers.`,`ข้อความบอกราคา เวลาเรียน กำหนดจองล่วงหน้า และส่วนลด ซึ่งล้วนเป็นลักษณะของโฆษณาที่ต้องการดึงดูดลูกค้า`],w:{0:[`No competition is mentioned; these are courses for learning.`,`ไม่มีการกล่าวถึงการแข่งขัน ข้อความนี้เป็นคอร์สเรียน`],1:[`Safety is only mentioned once, and the aim is not to frighten parents.`,`เรื่องความปลอดภัยถูกกล่าวถึงเพียงครั้งเดียว และจุดประสงค์ไม่ใช่การทำให้ผู้ปกครองกลัว`],3:[`The library appears only as a landmark for finding the school.`,`ห้องสมุดถูกกล่าวถึงเพียงเพื่อบอกตำแหน่งของโรงเรียนเท่านั้น`]}},{id:`T03-Q23`,s:`reading`,k:`reading-detail`,p:`T03-P2`,q:`Where did the writer’s class go on Tuesday?`,c:[`To the science museum`,`To a space centre in another province`,`To the school library`,`To Ohm’s house`],a:0,e:[`The first line of the diary says, "Our class went to the science museum this morning."`,`บรรทัดแรกของไดอารีระบุว่า "Our class went to the science museum this morning."`],w:{1:[`The space room was inside the museum; the class did not travel to a space centre.`,`ห้องอวกาศอยู่ภายในพิพิธภัณฑ์ ชั้นเรียนไม่ได้เดินทางไปศูนย์อวกาศ`],2:[`The library is not mentioned in the diary entry.`,`ไม่มีการกล่าวถึงห้องสมุดในไดอารีนี้`],3:[`Ohm sat next to the writer on the bus, but they did not visit his house.`,`โอมนั่งข้างผู้เขียนบนรถ แต่ทั้งคู่ไม่ได้ไปบ้านของเขา`]}},{id:`T03-Q24`,s:`reading`,k:`reading-inference`,p:`T03-P2`,q:`Why did the writer have only biscuits for lunch?`,c:[`Her mother did not have time to cook.`,`She wanted to eat biscuits that day.`,`She picked up the wrong lunchbox.`,`The museum shop sold only biscuits.`],a:2,e:[`The diary says she "had picked up my little brother’s lunchbox by mistake", and that box held only biscuits.`,`ไดอารีระบุว่าเธอ "had picked up my little brother’s lunchbox by mistake" และในกล่องนั้นมีแต่ขนมปังกรอบ`],w:{0:[`The lunch was cooked — it was simply her brother’s lunch, not hers.`,`อาหารกลางวันถูกเตรียมไว้แล้ว เพียงแต่เป็นของน้องชาย ไม่ใช่ของเธอ`],1:[`Her surprise when she opened the bag shows she did not choose the biscuits.`,`ความประหลาดใจตอนเปิดกระเป๋าแสดงว่าเธอไม่ได้เลือกขนมปังกรอบเอง`],3:[`The museum shop is never mentioned in the diary.`,`ไม่มีการกล่าวถึงร้านค้าของพิพิธภัณฑ์ในไดอารี`]}},{id:`T03-Q25`,s:`reading`,k:`reading-reference`,p:`T03-P2`,q:`In the diary, the words "which was very kind" refer to ____.`,c:[`singing on the bus`,`Ohm sharing his rice`,`writing three pages`,`touching the model of the moon`],a:1,e:[`The phrase comes straight after "Ohm shared his rice with me", so it describes that action.`,`วลีนี้ตามหลังประโยค "Ohm shared his rice with me" ทันที จึงหมายถึงการกระทำนั้น`],w:{0:[`Singing happened on the bus in the morning, far earlier in the entry.`,`การร้องเพลงเกิดขึ้นบนรถตอนเช้า ซึ่งอยู่ก่อนหน้านั้นมาก`],2:[`Writing three pages is the writer’s own action at the end of the day.`,`การเขียนสามหน้าเป็นการกระทำของผู้เขียนเองในตอนท้ายของวัน`],3:[`Touching the moon model was part of the museum visit, not a kind act.`,`การได้สัมผัสแบบจำลองดวงจันทร์เป็นส่วนหนึ่งของการชมพิพิธภัณฑ์ ไม่ใช่การกระทำที่มีน้ำใจ`]}}]},{id:`test-04`,number:4,title:`Practice Test 4`,subtitle:`Standard — Around Town`,tier:`standard`,minutes:35,passages:[{id:`T04-P1`,kind:`Instructions`,title:`How to Borrow a Book with the Self-Service Machine`,body:[`1. Put your student card on the reader and wait until the green light comes on.`,`2. Place your books on the grey pad, one at a time. The screen will show the title of each book.`,`3. Check the list on the screen. If a title is missing, take that book off and put it on the pad again.`,`4. Touch the blue FINISH button. A paper slip will print with the date you must return the books.`,`5. Take your card, your books and your slip.`,`You may borrow four books for two weeks. If the red light comes on, ask the librarian at the desk for help.`]},{id:`T04-P2`,kind:`Short story`,title:`The Wallet on the Bench`,body:[`On his way home from school, Ton sat down on a bench in the park to tie his shoelace. Something brown was lying under the seat. It was a wallet.`,`Inside there were three hundred baht, a bus card and a photograph of a smiling old woman holding a small dog.`,`Ton looked around, but the park was quiet and there was nobody to ask. He knew that three hundred baht would buy the football boots he had wanted for months.`,`Then he looked again at the old woman in the photograph. He put the wallet into his bag and walked to the police station on the corner of Mahachai Road.`,`Two days later a letter arrived at his house. Inside was a thank-you card from a woman named Mrs. Prapai — and a photograph of her little dog.`]}],questions:[{id:`T04-Q01`,s:`grammar`,k:`tenses`,q:`Look at those dark clouds! It ____ rain very soon.`,c:[`is going to`,`was going to`,`has rained`,`rains`],a:0,e:[`We use "be going to" when we can see evidence now that something will happen. The dark clouds are the evidence.`,`ใช้ "be going to" เมื่อมีหลักฐานให้เห็นในขณะนี้ว่าบางสิ่งกำลังจะเกิดขึ้น เมฆดำที่เห็นคือหลักฐานนั้น`],w:{1:[`"Was going to" describes a past plan that did not happen.`,`"was going to" ใช้กับแผนในอดีตที่ไม่ได้เกิดขึ้นจริง`],2:[`"Has rained" says the rain has already fallen, but it has not started yet.`,`"has rained" บอกว่าฝนตกไปแล้ว แต่ฝนยังไม่เริ่มตกเลย`],3:[`"Rains" is present simple and describes a general habit, such as "It rains a lot in July".`,`"rains" เป็น present simple ใช้บอกสิ่งที่เกิดเป็นปกติ เช่น "It rains a lot in July"`]}},{id:`T04-Q02`,s:`grammar`,k:`articles`,q:`My uncle plays ____ guitar in a band every weekend.`,c:[`a`,`an`,`the`,`some`],a:2,e:[`When we talk about playing a musical instrument, English always uses "the": play the guitar, play the piano.`,`เมื่อพูดถึงการเล่นเครื่องดนตรี ภาษาอังกฤษใช้ "the" เสมอ เช่น play the guitar, play the piano`],w:{0:[`"A guitar" means one particular instrument he owns, not the skill of playing.`,`"a guitar" หมายถึงกีตาร์ตัวหนึ่งที่เขามี ไม่ได้หมายถึงทักษะการเล่นดนตรี`],1:[`"An" comes before a vowel sound, and "guitar" begins with a consonant sound.`,`"an" ใช้หน้าเสียงสระ แต่ "guitar" ขึ้นต้นด้วยเสียงพยัญชนะ`],3:[`"Some" is used with plural or uncountable nouns, not with one instrument.`,`"some" ใช้กับคำนามพหูพจน์หรือนับไม่ได้ ไม่ใช้กับเครื่องดนตรีชิ้นเดียว`]}},{id:`T04-Q03`,s:`grammar`,k:`nouns`,q:`Could you buy two ____ of bread on your way home?`,c:[`breads`,`loaves`,`loafs`,`bread`],a:1,e:[`"Bread" is uncountable, so we count it with a unit word. The plural of the unit word "loaf" is "loaves".`,`"bread" เป็นคำนามนับไม่ได้ จึงต้องนับด้วยคำบอกหน่วย และรูปพหูพจน์ของหน่วย "loaf" คือ "loaves"`],w:{0:[`Uncountable nouns do not take -s. "Breads" is not used in this meaning.`,`คำนามนับไม่ได้จะไม่เติม -s คำว่า "breads" ไม่ใช้ในความหมายนี้`],2:[`Nouns ending in -f usually change to -ves. The correct plural is "loaves".`,`คำนามที่ลงท้ายด้วย -f มักเปลี่ยนเป็น -ves รูปพหูพจน์ที่ถูกต้องคือ "loaves"`],3:[`"Two bread of bread" is not English; the blank needs a countable unit word.`,`รูป "two bread of bread" ไม่ถูกต้อง ช่องว่างต้องใช้คำบอกหน่วยที่นับได้`]}},{id:`T04-Q04`,s:`grammar`,k:`quantifiers`,q:`There were ____ people at the market that we could hardly walk.`,c:[`so much`,`too much`,`such many`,`so many`],a:3,e:[`The pattern "so + many + plural noun + that…" shows a large number and its result. "People" is a plural countable noun, so "so many" is correct.`,`โครงสร้าง "so + many + คำนามพหูพจน์ + that…" ใช้บอกจำนวนมากและผลที่ตามมา คำว่า "people" เป็นคำนามพหูพจน์นับได้ จึงใช้ "so many"`],w:{0:[`"So much" is used with uncountable nouns, such as "so much water".`,`"so much" ใช้กับคำนามนับไม่ได้ เช่น "so much water"`],1:[`"Too much" also needs an uncountable noun, and "too" means more than is wanted.`,`"too much" ต้องใช้กับคำนามนับไม่ได้เช่นกัน และ "too" หมายถึงมากเกินความต้องการ`],2:[`The correct pattern is "such a lot of people" or "so many people", never "such many".`,`โครงสร้างที่ถูกต้องคือ "such a lot of people" หรือ "so many people" ไม่ใช่ "such many"`]}},{id:`T04-Q05`,s:`grammar`,k:`adjectives-adverbs`,q:`The new shopping centre is ____ bigger than the old one.`,c:[`very`,`much`,`too`,`so`],a:1,e:[`Before a comparative adjective we use "much", "far" or "a lot" to make the comparison stronger: much bigger.`,`หน้าคำคุณศัพท์ขั้นกว่า เราใช้ "much", "far" หรือ "a lot" เพื่อเน้นการเปรียบเทียบ เช่น much bigger`],w:{0:[`"Very" goes before a normal adjective ("very big"), never before a comparative.`,`"very" วางหน้าคำคุณศัพท์ปกติ เช่น "very big" ไม่ใช้หน้าขั้นกว่า`],2:[`"Too" means more than you want and cannot come before a comparative.`,`"too" แปลว่ามากเกินไป และวางหน้าคำขั้นกว่าไม่ได้`],3:[`"So" is used with a normal adjective, as in "so big".`,`"so" ใช้กับคำคุณศัพท์ปกติ เช่น "so big"`]}},{id:`T04-Q06`,s:`grammar`,k:`comparisons`,q:`This bag is not as ____ as that one, but I like its colour more.`,c:[`expensive`,`more expensive`,`most expensive`,`expensiver`],a:0,e:[`In the pattern "as … as" the adjective always stays in its normal form, with no -er and no "more".`,`ในโครงสร้าง "as … as" คำคุณศัพท์ต้องอยู่ในรูปปกติเสมอ ไม่เติม -er และไม่ใช้ "more"`],w:{1:[`A comparative form is used with "than", not inside "as … as".`,`รูปขั้นกว่าใช้คู่กับ "than" ไม่ได้ใช้ในโครงสร้าง "as … as"`],2:[`A superlative needs "the" and compares one thing with a whole group.`,`ขั้นสุดต้องมี "the" นำหน้า และใช้เปรียบเทียบสิ่งหนึ่งกับทั้งกลุ่ม`],3:[`Long adjectives never take -er. The comparative is "more expensive".`,`คำคุณศัพท์พยางค์ยาวไม่เติม -er รูปขั้นกว่าคือ "more expensive"`]}},{id:`T04-Q07`,s:`grammar`,k:`conjunctions`,q:`We waited for the bus for a whole hour, ____ it never came.`,c:[`so`,`because`,`although`,`but`],a:3,e:[`The second half of the sentence is the opposite of what we expected after waiting, so we need a contrast word: "but".`,`ประโยคส่วนหลังตรงข้ามกับสิ่งที่คาดหวังหลังจากรอ จึงต้องใช้คำเชื่อมที่แสดงความขัดแย้งคือ "but"`],w:{0:[`"So" introduces a result, but the bus not coming is not a result of waiting.`,`"so" ใช้บอกผลลัพธ์ แต่การที่รถไม่มาไม่ใช่ผลของการรอ`],1:[`"Because" gives a reason. The bus did not fail to come because we waited.`,`"because" ใช้บอกเหตุผล รถไม่ได้ไม่มาเพราะเรารอ`],2:[`"Although" also shows contrast, but it must begin a clause: "Although we waited…".`,`"although" แสดงความขัดแย้งเช่นกัน แต่ต้องขึ้นต้นอนุประโยค เช่น "Although we waited…"`]}},{id:`T04-Q08`,s:`grammar`,k:`questions`,q:`You met Miss Wan at the school fair, ____?`,c:[`did you`,`do you`,`didn’t you`,`weren’t you`],a:2,e:[`A positive statement takes a negative tag, and the tag copies the tense of the main verb. "Met" is past simple, so the tag is "didn’t you".`,`ประโยคบอกเล่าจะตามด้วยส่วนท้ายที่เป็นปฏิเสธ และต้องใช้กาลเดียวกับกริยาหลัก คำว่า "met" เป็น past simple ส่วนท้ายจึงเป็น "didn’t you"`],w:{0:[`A positive statement does not take a positive tag in normal English.`,`ประโยคบอกเล่าจะไม่ตามด้วยส่วนท้ายที่เป็นบอกเล่าในภาษาอังกฤษทั่วไป`],1:[`"Do" is present tense and does not match the past verb "met".`,`"do" เป็นรูปปัจจุบัน ไม่สอดคล้องกับกริยาอดีต "met"`],3:[`"Weren’t you" would follow a sentence with the verb "be", not with "met".`,`"weren’t you" ใช้ตามประโยคที่มีกริยา be ไม่ใช่ประโยคที่ใช้ "met"`]}},{id:`T04-Q09`,s:`grammar`,k:`verb-patterns`,q:`Don’t forget ____ the door before you go out.`,c:[`locking`,`to lock`,`lock`,`locked`],a:1,e:[`"Forget to do something" means you must remember to do it. Here the speaker is reminding you about a future action, so "to lock" is correct.`,`สำนวน "forget to do something" หมายถึงลืมทำสิ่งที่ต้องทำ ในที่นี้ผู้พูดกำลังเตือนถึงสิ่งที่ต้องทำต่อไป จึงใช้ "to lock"`],w:{0:[`"Forget locking" would mean forgetting a memory of doing it in the past.`,`"forget locking" จะหมายถึงลืมความทรงจำว่าเคยทำสิ่งนั้นในอดีต`],2:[`The base form cannot follow "forget" directly.`,`กริยารูปพื้นฐานตามหลัง "forget" โดยตรงไม่ได้`],3:[`"Locked" is a past form and does not follow "forget" in this pattern.`,`"locked" เป็นรูปอดีต จึงตามหลัง "forget" ในโครงสร้างนี้ไม่ได้`]}},{id:`T04-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The shop assistant gave me a ____ because the shirt had a small hole in the sleeve.`,c:[`bill`,`receipt`,`discount`,`uniform`],a:2,e:[`A fault in the goods usually means you pay less than the normal price. A "discount" is a reduction in price.`,`สินค้าที่มีตำหนิมักทำให้จ่ายน้อยกว่าราคาปกติ คำว่า "discount" แปลว่าส่วนลดราคา`],w:{0:[`A "bill" is the paper telling you how much to pay; it is not a reward for a fault.`,`"bill" คือใบแจ้งยอดที่ต้องชำระ ไม่ใช่สิ่งชดเชยเมื่อสินค้ามีตำหนิ`],1:[`A "receipt" proves that you paid and is given for every purchase.`,`"receipt" คือใบเสร็จที่พิสูจน์ว่าจ่ายเงินแล้ว ซึ่งได้รับทุกครั้งที่ซื้อของ`],3:[`A "uniform" is clothing worn for school or work.`,`"uniform" คือเครื่องแบบที่สวมไปโรงเรียนหรือที่ทำงาน`]}},{id:`T04-Q11`,s:`vocabulary`,k:`collocations`,q:`Please ____ care of your little sister while I am at the market.`,c:[`do`,`get`,`have`,`take`],a:3,e:[`"Take care of" is a fixed expression meaning to look after someone. No other verb is used with "care of".`,`"take care of" เป็นสำนวนตายตัว แปลว่าดูแลใครสักคน โดยไม่ใช้กริยาอื่นคู่กับ "care of"`],w:{0:[`"Do care of" is not used in English.`,`รูป "do care of" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"Get care" is not a natural English phrase.`,`วลี "get care" ไม่เป็นธรรมชาติในภาษาอังกฤษ`],2:[`"Have care" is not used; we say "take care" or "be careful".`,`วลี "have care" ไม่มีใช้ เราพูดว่า "take care" หรือ "be careful"`]}},{id:`T04-Q12`,s:`vocabulary`,k:`phrasal-verbs`,q:`The price of vegetables has ____ since the flood destroyed the farms.`,c:[`gone up`,`gone off`,`gone out`,`gone away`],a:0,e:[`When farms are destroyed there is less food to sell, so prices become higher. "Go up" means to increase.`,`เมื่อไร่นาเสียหาย ผลผลิตที่ขายได้จะน้อยลง ราคาจึงสูงขึ้น คำว่า "go up" แปลว่าเพิ่มสูงขึ้น`],w:{1:[`"Go off" means food has become bad, or an alarm has sounded.`,`"go off" หมายถึงอาหารเสีย หรือนาฬิกาปลุกดังขึ้น`],2:[`"Go out" means to leave the house or for a light or fire to stop burning.`,`"go out" หมายถึงออกไปข้างนอก หรือไฟดับ`],3:[`"Go away" means to leave a place, which cannot describe a price.`,`"go away" หมายถึงจากไปจากสถานที่ จึงใช้กับราคาไม่ได้`]}},{id:`T04-Q13`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The street was almost empty at six in the morning. In this sentence, "empty" is the opposite of ____.`,c:[`narrow`,`crowded`,`clean`,`dark`],a:1,e:[`Here "empty" describes how few people were on the street. Its opposite is "crowded", meaning full of people.`,`ในที่นี้ "empty" บรรยายว่ามีคนอยู่บนถนนน้อยมาก คำตรงข้ามคือ "crowded" ซึ่งแปลว่าเต็มไปด้วยผู้คน`],w:{0:[`"Narrow" is about width, and a narrow street can still be empty.`,`"narrow" เกี่ยวกับความกว้าง ถนนแค
