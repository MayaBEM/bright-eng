date from fresh fruit and vegetables altogether, and ask shoppers to judge with their eyes and their nose instead.`,`Nobody is suggesting that dates should disappear from fish. The point is narrower: two labels that look alike are not the same instruction.`]},{id:`T15-P2`,kind:`Notice`,title:`Library Notice: Changes During the Examination Weeks`,body:[`From Monday 3 February to Friday 14 February the library will operate under examination rules.`,`Opening hours will be extended: 7 a.m. to 7 p.m. on weekdays, and 9 a.m. to 3 p.m. on Saturday. The library will be closed on Sundays as usual.`,`During these two weeks the group-study room on the first floor becomes a silent room. Students who wish to work together should use the covered area behind the canteen.`,`Borrowing is suspended from 3 February. Books already on loan need not be returned until Monday 17 February, and no late charge will be made for that period.`,`Year 6 students may reserve a desk for the whole day by writing their name on the sheet at the front desk before 8 a.m. Unclaimed desks are released at 9 a.m.`]}],questions:[{id:`T15-Q01`,s:`grammar`,k:`tenses`,q:`Look at the river! It ____ for three days without stopping.`,c:[`rains`,`is raining`,`has been raining`,`rained`],a:2,e:[`The rain started three days ago and is still going on, and the sentence stresses how long it has continued. That is the present perfect continuous.`,`ฝนเริ่มตกเมื่อสามวันก่อนและยังตกอยู่ อีกทั้งประโยคเน้นระยะเวลาที่ต่อเนื่อง จึงต้องใช้ present perfect continuous`],w:{0:[`"Rains" is present simple and describes a general habit, such as the climate.`,`"rains" เป็น present simple ใช้บอกสิ่งที่เกิดเป็นปกติ เช่น ลักษณะภูมิอากาศ`],1:[`"Is raining" describes this moment only, not the three-day period.`,`"is raining" บรรยายเฉพาะขณะนี้ ไม่ได้ครอบคลุมช่วงสามวัน`],3:[`"Rained" is past simple and would mean the rain has stopped.`,`"rained" เป็น past simple ซึ่งจะหมายความว่าฝนหยุดตกแล้ว`]}},{id:`T15-Q02`,s:`grammar`,k:`reported-speech`,intro:`Direct speech: "Have you taken any medicine this morning?" the nurse asked me.`,q:`The nurse asked me ____ any medicine that morning.`,c:[`whether I had taken`,`did I take`,`if I have taken`,`that I took`],a:0,e:[`A reported yes/no question uses "if" or "whether", keeps statement word order, and shifts the tense back: "have taken" becomes "had taken".`,`คำถาม yes/no ที่ถูกเล่าต่อใช้ "if" หรือ "whether" คงลำดับคำแบบประโยคบอกเล่า และเลื่อนกาลถอยไป จาก "have taken" เป็น "had taken"`],w:{1:[`"Did I take" keeps question word order, which reported speech does not use.`,`"did I take" ใช้ลำดับคำแบบคำถาม ซึ่งการเล่าคำพูดไม่ใช้`],2:[`The word order is right, but "have taken" must shift back after the past verb "asked".`,`ลำดับคำถูกต้อง แต่ "have taken" ต้องเลื่อนถอยไปหลังกริยาอดีต "asked"`],3:[`"That" introduces a reported statement, not a yes/no question.`,`"that" ใช้นำหน้าประโยคบอกเล่าที่ถูกเล่าต่อ ไม่ใช่คำถาม yes/no`]}},{id:`T15-Q03`,s:`grammar`,k:`conditionals`,q:`If the driver ____ more slowly, the accident might never have happened.`,c:[`drives`,`would drive`,`has driven`,`had driven`],a:3,e:[`"Might never have happened" refers to a past that cannot be changed, which is a third conditional. The "if" clause takes the past perfect: had driven.`,`วลี "might never have happened" กล่าวถึงอดีตที่เปลี่ยนแปลงไม่ได้ ซึ่งเป็นเงื่อนไขแบบที่ 3 อนุประโยค if จึงใช้ past perfect คือ had driven`],w:{0:[`"Drives" is present simple and belongs in a first conditional.`,`"drives" เป็น present simple ซึ่งใช้กับเงื่อนไขแบบที่ 1`],1:[`"Would" is never used inside the "if" clause.`,`ไม่ใช้ "would" ในอนุประโยค if`],2:[`"Has driven" is present perfect and does not match a finished past event.`,`"has driven" เป็น present perfect ซึ่งไม่เข้ากับเหตุการณ์ในอดีตที่จบไปแล้ว`]}},{id:`T15-Q04`,s:`grammar`,k:`relative-clauses`,q:`The letters, ____ were written in 1932, are now kept in the city museum.`,c:[`who`,`which`,`that`,`what`],a:1,e:[`The commas mark a non-defining clause adding extra information about a thing. Non-defining clauses use "which" for things and never "that".`,`เครื่องหมายจุลภาคบ่งบอกว่าเป็นอนุประโยคขยายที่ให้ข้อมูลเพิ่มเติมเกี่ยวกับสิ่งของ ซึ่งต้องใช้ "which" และไม่ใช้ "that"`],w:{0:[`"Who" is used only for people, and letters are things.`,`"who" ใช้กับบุคคลเท่านั้น แต่จดหมายเป็นสิ่งของ`],2:[`"That" cannot be used in a non-defining clause set off by commas.`,`"that" ใช้ในอนุประโยคขยายที่คั่นด้วยจุลภาคไม่ได้`],3:[`"What" is not a relative pronoun after a noun.`,`"what" ไม่ใช่คำสรรพนามเชื่อมความที่ใช้หลังคำนาม`]}},{id:`T15-Q05`,s:`grammar`,k:`quantifiers`,q:`There was ____ evidence against him, so the police let him go home.`,c:[`little`,`a little`,`few`,`a few`],a:0,e:[`"Evidence" is uncountable, and "little" without "a" means hardly any — which is why he was released.`,`"evidence" เป็นคำนามนับไม่ได้ และคำว่า "little" ที่ไม่มี "a" นำหน้าแปลว่าแทบไม่มีเลย จึงเป็นเหตุให้เขาถูกปล่อยตัว`],w:{1:[`"A little" means some, which would give the police a reason to hold him.`,`"a little" แปลว่ามีอยู่บ้าง ซึ่งจะเป็นเหตุให้ตำรวจควบคุมตัวเขาไว้`],2:[`"Few" is used with countable plural nouns, but "evidence" is uncountable.`,`"few" ใช้กับคำนามพหูพจน์ที่นับได้ แต่ "evidence" นับไม่ได้`],3:[`"A few" is also for countable nouns and means some.`,`"a few" ก็ใช้กับคำนามนับได้ และแปลว่ามีอยู่บ้าง`]}},{id:`T15-Q06`,s:`grammar`,k:`passive`,q:`This form ____ in black ink only.`,c:[`must fill`,`must filling`,`must be filled in`,`must be fill`],a:2,e:[`The form does not fill anything in; a person fills it in. After a modal the passive is "modal + be + past participle": must be filled in.`,`แบบฟอร์มไม่ได้เป็นผู้กรอก แต่มีคนกรอกมัน หลังกริยาช่วยรูป passive คือ "modal + be + กริยาช่องที่ 3" จึงเป็น must be filled in`],w:{0:[`"Must fill" is active and makes the form the writer.`,`"must fill" เป็นรูป active ซึ่งทำให้แบบฟอร์มกลายเป็นผู้กรอก`],1:[`A modal is never followed by an -ing form.`,`หลังกริยาช่วยจะไม่ตามด้วยรูป -ing`],3:[`After "be" we need the past participle "filled", not the base form.`,`หลัง "be" ต้องใช้กริยาช่องที่ 3 คือ "filled" ไม่ใช่รูปพื้นฐาน`]}},{id:`T15-Q07`,s:`grammar`,k:`verb-patterns`,q:`I don’t mind ____ early if it means we avoid the worst of the traffic.`,c:[`to leave`,`leaving`,`leave`,`left`],a:1,e:[`"Mind" is always followed by the -ing form: don’t mind waiting, don’t mind leaving.`,`กริยา "mind" ต้องตามด้วยรูป -ing เสมอ เช่น don’t mind waiting, don’t mind leaving`],w:{0:[`"Mind" is never followed by "to + verb".`,`หลัง "mind" ไม่ใช้ "to + กริยา"`],2:[`The bare base form cannot follow "mind".`,`กริยารูปพื้นฐานตามหลัง "mind" ไม่ได้`],3:[`"Left" is a past form and cannot follow "mind" in this pattern.`,`"left" เป็นรูปอดีต จึงตามหลัง "mind" ในโครงสร้างนี้ไม่ได้`]}},{id:`T15-Q08`,s:`grammar`,k:`comparisons`,q:`The second half of the film was far ____ than the first.`,c:[`exciting`,`excitinger`,`most exciting`,`more exciting`],a:3,e:[`"Than" signals a comparison, and long adjectives form the comparative with "more": more exciting.`,`คำว่า "than" เป็นสัญญาณของการเปรียบเทียบ และคำคุณศัพท์พยางค์ยาวสร้างขั้นกว่าด้วย "more" คือ more exciting`],w:{0:[`A plain adjective cannot be used with "than".`,`คำคุณศัพท์รูปปกติใช้คู่กับ "than" ไม่ได้`],1:[`Long adjectives never take -er, so "excitinger" is not a word.`,`คำคุณศัพท์พยางค์ยาวไม่เติม -er คำว่า "excitinger" จึงไม่มีในภาษาอังกฤษ`],2:[`A superlative compares one with a whole group and does not take "than".`,`ขั้นสุดใช้เปรียบเทียบสิ่งหนึ่งกับทั้งกลุ่ม และไม่ใช้กับ "than"`]}},{id:`T15-Q09`,s:`grammar`,k:`questions`,q:`Excuse me, could you tell me ____?`,c:[`where the ticket office is`,`where is the ticket office`,`where the ticket office`,`where is ticket office`],a:0,e:[`A question inside a longer sentence is an indirect question, and it keeps normal statement word order: subject before verb.`,`คำถามที่อยู่ภายในประโยคยาวเรียกว่าคำถามทางอ้อม ซึ่งต้องคงลำดับคำแบบประโยคบอกเล่า คือประธานมาก่อนกริยา`],w:{1:[`This keeps direct-question word order, which indirect questions do not use.`,`รูปนี้ใช้ลำดับคำแบบคำถามตรง ซึ่งคำถามทางอ้อมไม่ใช้`],2:[`This has no verb, so the clause is incomplete.`,`รูปนี้ไม่มีกริยา อนุประโยคจึงไม่สมบูรณ์`],3:[`This has both the wrong word order and a missing article.`,`รูปนี้ทั้งลำดับคำผิดและขาดคำนำหน้านาม`]}},{id:`T15-Q10`,s:`vocabulary`,k:`vocab-context`,q:`After the long climb, the water in our bottles was warm and ____, but we were too thirsty to care.`,c:[`unpleasant`,`refreshing`,`frozen`,`delicious`],a:0,e:[`"But we were too thirsty to care" shows the water was not nice to drink. "Unpleasant" means not enjoyable.`,`วลี "but we were too thirsty to care" แสดงว่าน้ำนั้นดื่มแล้วไม่อร่อย คำว่า "unpleasant" แปลว่าไม่น่าพึงพอใจ`],w:{1:[`"Refreshing" means cool and pleasant, which contradicts "warm" and the word "but".`,`"refreshing" แปลว่าเย็นชื่นใจ ซึ่งขัดแย้งกับคำว่า "warm" และคำเชื่อม "but"`],2:[`"Frozen" is the opposite of warm.`,`"frozen" มีความหมายตรงข้ามกับอุ่น`],3:[`"Delicious" is positive, so "but we were too thirsty to care" would make no sense.`,`"delicious" เป็นคำเชิงบวก ซึ่งจะทำให้ประโยค "but we were too thirsty to care" ไม่สมเหตุสมผล`]}},{id:`T15-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The witness gave an accurate description of the car. The opposite of "accurate" is ____.`,c:[`detailed`,`careful`,`honest`,`wrong`],a:3,e:[`"Accurate" means exactly correct, so its opposite describes information that does not match the facts. "Wrong" carries that meaning.`,`"accurate" แปลว่าถูกต้องแม่นยำ คำตรงข้ามจึงหมายถึงข้อมูลที่ไม่ตรงกับความจริง ซึ่งคือคำว่า "wrong"`],w:{0:[`"Detailed" is about how much information is given, not whether it is correct.`,`"detailed" บอกปริมาณรายละเอียด ไม่ได้บอกว่าถูกต้องหรือไม่`],1:[`"Careful" describes how somebody works, and a careful person is usually accurate.`,`"careful" บรรยายวิธีทำงาน และคนที่รอบคอบมักให้ข้อมูลที่แม่นยำ`],2:[`"Honest" is the opposite of lying; an honest person can still remember wrongly.`,`"honest" เป็นคำตรงข้ามกับการโกหก คนซื่อสัตย์ก็ยังจำผิดได้`]}},{id:`T15-Q12`,s:`vocabulary`,k:`collocations`,q:`He always ____ his promises, even when it costs him time and money.`,c:[`holds`,`keeps`,`makes`,`takes`],a:1,e:[`"Keep a promise" means to do what you said you would do. "Even when it costs him time" shows he carries the promise out.`,`"keep a promise" แปลว่าทำตามที่ได้ให้คำมั่นไว้ วลี "even when it costs him time" แสดงว่าเขาทำตามสัญญาจริง`],w:{0:[`"Hold a promise" is not used in English.`,`รูป "hold a promise" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Make a promise" means to say it, but the sentence is about doing it.`,`"make a promise" แปลว่าให้คำมั่น แต่ประโยคนี้พูดถึงการทำตามคำมั่น`],3:[`"Take a promise" is not a natural English collocation.`,`รูป "take a promise" ไม่เป็นคำคู่ที่ใช้จริงในภาษาอังกฤษ`]}},{id:`T15-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`The teacher asked us to ____ our essays by Friday afternoon.`,c:[`hand out`,`hand over`,`hand in`,`hand round`],a:2,e:[`"Hand in" means to give completed work to a teacher or an office by a deadline.`,`"hand in" แปลว่าส่งงานที่ทำเสร็จแล้วให้ครูหรือสำนักงานภายในกำหนดเวลา`],w:{0:[`"Hand out" means to give one copy to each person in a group.`,`"hand out" แปลว่าแจกให้แต่ละคนในกลุ่มคนละชุด`],1:[`"Hand over" means to give control of something to another person.`,`"hand over" แปลว่าส่งมอบอำนาจหรือการดูแลให้ผู้อื่น`],3:[`"Hand round" means to pass something from person to person, like a plate of food.`,`"hand round" แปลว่าส่งต่อกันไปทีละคน เช่น จานอาหาร`]}},{id:`T15-Q14`,s:`vocabulary`,k:`vocab-context`,q:`Because the mountain path was so ____, the guide told us to walk in single file.`,c:[`narrow`,`wide`,`flat`,`straight`],a:0,e:[`Walking in single file means one behind another, which is necessary when there is not enough room side by side. "Narrow" means not wide.`,`การเดินเรียงแถวเดี่ยวคือเดินต่อ ๆ กัน ซึ่งจำเป็นเมื่อทางไม่กว้างพอให้เดินเคียงกัน คำว่า "narrow" แปลว่าแคบ`],w:{1:[`"Wide" would allow people to walk side by side.`,`"wide" จะทำให้เดินเคียงข้างกันได้`],2:[`"Flat" describes the surface, not the width of the path.`,`"flat" บรรยายความราบของพื้น ไม่ได้บอกความกว้างของทาง`],3:[`"Straight" describes the shape of the path, not how much room there is.`,`"straight" บรรยายรูปทรงของทาง ไม่ได้บอกว่ามีพื้นที่มากน้อยเพียงใด`]}},{id:`T15-Q15`,s:`conversation`,k:`conversation`,intro:`Chairperson: You’re twenty minutes late, and the meeting has already started.
Member: ____`,q:`Choose the best reply for the member.`,c:[`That is really not my fault at all.`,`I’m very sorry. My train was cancelled.`,`Yes, the meeting has already started.`,`You should have waited for me to arrive.`],a:1,e:[`When you have kept people waiting, the professional reply apologises first and then gives a short, factual reason.`,`เมื่อทำให้ผู้อื่นต้องรอ คำตอบที่เป็นมืออาชีพคือกล่าวขอโทษก่อน แล้วจึงให้เหตุผลสั้น ๆ ตามความจริง`],w:{0:[`Refusing responsibility before apologising sounds defensive.`,`การปฏิเสธความรับผิดชอบก่อนขอโทษฟังดูเป็นการแก้ตัว`],2:[`This repeats what the chairperson said and offers nothing.`,`ประโยคนี้พูดซ้ำสิ่งที่ประธานพูดและไม่ได้เสนออะไร`],3:[`Blaming the others for starting on time is unreasonable.`,`การกล่าวโทษผู้อื่นที่เริ่มประชุมตรงเวลาเป็นเรื่องไม่สมเหตุสมผล`]}},{id:`T15-Q16`,s:`conversation`,k:`conversation`,intro:`Ploy: ____
Neighbour: Not at all. I’d be glad to.`,q:`Choose the best line for Ploy.`,c:[`You must help me carry this box.`,`Are you free or are you busy now?`,`Would you mind helping me carry this box?`,`Why don’t you carry this box for me?`],a:2,e:[`"Not at all" is the standard answer to "Would you mind…?", because agreeing to that question means saying it is no trouble.`,`"Not at all" เป็นคำตอบมาตรฐานของคำถาม "Would you mind…?" เพราะการตอบตกลงกับคำถามนี้คือการบอกว่าไม่เป็นการรบกวน`],w:{0:[`"You must" gives an order and would not receive such a warm reply.`,`"You must" เป็นการออกคำสั่ง ซึ่งคงไม่ได้รับคำตอบที่อบอุ่นเช่นนี้`],1:[`A question about being free would be answered "Yes, I am" or "No, I’m busy".`,`คำถามว่าว่างหรือไม่ต้องตอบว่า "Yes, I am" หรือ "No, I’m busy"`],3:[`"Why don’t you…?" is a suggestion, and "Not at all" does not answer it.`,`"Why don’t you…?" เป็นการเสนอแนะ ซึ่ง "Not at all" ไม่ใช่คำตอบที่เข้ากัน`]}},{id:`T15-Q17`,s:`conversation`,k:`conversation`,intro:`Teacher: Your presentation this morning was excellent.
Mai: ____`,q:`Choose the best reply for Mai.`,c:[`Thank you. I practised it a lot at home.`,`Yes, it certainly was excellent.`,`No, it was really quite terrible.`,`You are excellent as well, of course.`],a:0,e:[`The natural way to receive a compliment in English is to thank the person and add a short, modest remark.`,`วิธีรับคำชมที่เป็นธรรมชาติในภาษาอังกฤษคือกล่าวขอบคุณแล้วเสริมด้วยข้อความสั้น ๆ อย่างถ่อมตน`],w:{1:[`Agreeing so strongly with praise of yourself sounds boastful.`,`การเห็นด้วยกับคำชมตัวเองอย่างเต็มที่ฟังดูโอ้อวด`],2:[`Flatly denying the compliment rejects what the teacher said.`,`การปฏิเสธคำชมอย่างสิ้นเชิงเป็นการไม่ยอมรับสิ่งที่ครูพูด`],3:[`Returning the compliment automatically sounds insincere here.`,`การชมกลับทันทีในบริบทนี้ฟังดูไม่จริงใจ`]}},{id:`T15-Q18`,s:`conversation`,k:`conversation`,intro:`Passenger: I’ve missed the last bus. What can I do?
Station staff: ____`,q:`Choose the best reply for the station staff.`,c:[`The last bus has certainly gone.`,`You really should have come earlier.`,`That is very unfortunate indeed.`,`There’s a night train at 11:40, or I can call you a taxi.`],a:3,e:[`"What can I do?" asks for options, so the helpful reply offers real alternatives.`,`คำถาม "What can I do?" เป็นการขอทางเลือก คำตอบที่เป็นประโยชน์จึงต้องเสนอทางเลือกที่ทำได้จริง`],w:{0:[`This repeats the problem without offering a solution.`,`ประโยคนี้พูดซ้ำปัญหาโดยไม่ได้เสนอทางแก้`],1:[`Blaming the passenger does not answer the question.`,`การตำหนิผู้โดยสารไม่ได้ตอบคำถาม`],2:[`Sympathy alone still leaves the passenger with no plan.`,`การแสดงความเห็นใจเพียงอย่างเดียวยังไม่ได้ช่วยให้ผู้โดยสารมีทางออก`]}},{id:`T15-Q19`,s:`reading`,k:`reading-main-idea`,p:`T15-P1`,q:`What is the writer’s main point?`,c:[`Supermarkets should stop selling fresh fish.`,`All date labels should be removed from food.`,`Households should buy far more tinned food.`,`Two similar-looking date labels mean different things.`],a:3,e:[`The passage opens by saying the two dates "do not mean the same thing" and closes with "two labels that look alike are not the same instruction".`,`บทอ่านเปิดด้วยข้อความว่าวันที่ทั้งสองแบบ "do not mean the same thing" และปิดท้ายด้วย "two labels that look alike are not the same instruction"`],w:{0:[`The last paragraph says the opposite: dates on fish should stay.`,`ย่อหน้าสุดท้ายกล่าวตรงข้ามว่าวันที่บนปลาควรคงไว้`],1:[`Only fruit and vegetables in some shops have lost their date labels.`,`มีเพียงผักและผลไม้ในบางร้านเท่านั้นที่เลิกติดวันที่`],2:[`Tinned food is used as an example, not recommended for buying.`,`อาหารกระป๋องถูกยกเป็นตัวอย่าง ไม่ได้เป็นคำแนะนำให้ซื้อ`]}},{id:`T15-Q20`,s:`reading`,k:`reading-detail`,p:`T15-P1`,q:`Which of these foods carries a "use by" date?`,c:[`Dried pasta`,`Raw meat`,`Tinned food`,`Biscuits`],a:1,e:[`The second paragraph lists "fresh fish, raw meat and some dairy products" as the foods that carry a "use by" date.`,`ย่อหน้าที่สองระบุว่า "fresh fish, raw meat and some dairy products" คืออาหารที่ติดวันที่แบบ "use by"`],w:{0:[`Dried pasta is listed under "best before".`,`พาสตาแห้งถูกจัดอยู่ในกลุ่ม "best before"`],2:[`Tinned food is also listed under "best before".`,`อาหารกระป๋องก็อยู่ในกลุ่ม "best before" เช่นกัน`],3:[`Biscuits appear in the "best before" list as well.`,`ขนมปังกรอบก็อยู่ในรายการ "best before" เช่นกัน`]}},{id:`T15-Q21`,s:`reading`,k:`reading-detail`,p:`T15-P1`,q:`What does a "best before" date tell the shopper about?`,c:[`Safety`,`The price`,`Quality`,`The country of origin`],a:2,e:[`The third paragraph begins, "A ‘best before’ date is about quality," and explains that the food is usually still safe afterwards.`,`ย่อหน้าที่สามขึ้นต้นว่า "A ‘best before’ date is about quality" และอธิบายว่าหลังวันดังกล่าวอาหารมักยังปลอดภัย`],w:{0:[`Safety is what a "use by" date is about.`,`ความปลอดภัยเป็นเรื่องของวันที่แบบ "use by"`],1:[`Price is not connected to either date label.`,`ราคาไม่เกี่ยวข้องกับวันที่ทั้งสองแบบ`],3:[`The country of origin is never mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงประเทศแหล่งผลิตเลย`]}},{id:`T15-Q22`,s:`reading`,k:`reading-inference`,p:`T15-P1`,q:`Why have some supermarkets removed dates from fresh fruit and vegetables?`,c:[`So that shoppers judge the food themselves and waste less`,`Because fruit and vegetables never go bad`,`Because the labels were too expensive to print`,`Because customers had asked for lower prices`],a:0,e:[`The sentence follows the finding that food is binned on the very day the date passes, and it says shoppers are asked "to judge with their eyes and their nose instead".`,`ประโยคนี้ตามหลังผลการศึกษาที่ว่าอาหารถูกทิ้งในวันที่ครบกำหนดพอดี และระบุว่าให้ผู้ซื้อ "to judge with their eyes and their nose instead" คือใช้ตาและจมูกตัดสินเอง`],w:{1:[`The passage never claims that fruit and vegetables cannot spoil.`,`บทอ่านไม่ได้อ้างว่าผักและผลไม้ไม่มีวันเสีย`],2:[`Printing cost is not mentioned anywhere.`,`ไม่มีการกล่าวถึงต้นทุนการพิมพ์เลย`],3:[`Customer requests about price are not discussed in the text.`,`ข้อความไม่ได้กล่าวถึงการที่ลูกค้าเรียกร้องเรื่องราคา`]}},{id:`T15-Q23`,s:`reading`,k:`reading-detail`,p:`T15-P2`,q:`When is the library open on Saturday during the examination weeks?`,c:[`7 a.m. to 7 p.m.`,`It is closed all day.`,`9 a.m. to 3 p.m.`,`8 a.m. to 9 a.m.`],a:2,e:[`The notice says the extended hours are "7 a.m. to 7 p.m. on weekdays, and 9 a.m. to 3 p.m. on Saturday".`,`ประกาศระบุว่าเวลาเปิดที่ขยายคือ "7 a.m. to 7 p.m. on weekdays, and 9 a.m. to 3 p.m. on Saturday"`],w:{0:[`7 a.m. to 7 p.m. applies to weekdays only.`,`เวลา 7:00–19:00 น. ใช้กับวันธรรมดาเท่านั้น`],1:[`It is Sunday, not Saturday, when the library is closed.`,`วันที่ห้องสมุดปิดคือวันอาทิตย์ ไม่ใช่วันเสาร์`],3:[`8 a.m. and 9 a.m. are the desk-reservation times, not opening hours.`,`เวลา 8:00 และ 9:00 น. เกี่ยวกับการจองโต๊ะ ไม่ใช่เวลาเปิดทำการ`]}},{id:`T15-Q24`,s:`reading`,k:`reading-inference`,p:`T15-P2`,q:`Where should two students who want to discuss their work together go?`,c:[`The group-study room on the first floor`,`Any free desk inside the library`,`The front desk of the library`,`The covered area behind the canteen`],a:3,e:[`The group-study room has become a silent room for these two weeks, and the notice says students working together "should use the covered area behind the canteen".`,`ห้องติวกลุ่มถูกเปลี่ยนเป็นห้องเงียบในช่วงสองสัปดาห์นี้ และประกาศระบุว่านักเรียนที่ต้องการทำงานร่วมกัน "should use the covered area behind the canteen"`],w:{0:[`That room is exactly the one that has become silent.`,`ห้องนั้นคือห้องที่ถูกเปลี่ยนเป็นห้องเงียบพอดี`],1:[`The whole library is under examination rules during these weeks.`,`ทั้งห้องสมุดอยู่ภายใต้กฎช่วงสอบตลอดสองสัปดาห์นี้`],2:[`The front desk is where the reservation sheet is kept.`,`โต๊ะหน้าห้องสมุดเป็นที่วางใบจองโต๊ะ`]}},{id:`T15-Q25`,s:`reading`,k:`reading-inference`,p:`T15-P2`,q:`A Year 6 student writes her name on the sheet at 7:30 a.m. but does not arrive until 9:30 a.m. What has happened to her desk?`,c:[`It is still reserved for her for the whole day.`,`It has been released to another student.`,`It was never reserved because she wrote too early.`,`She must pay a late charge to use it.`],a:1,e:[`She reserved it correctly (before 8 a.m.), but the notice says "Unclaimed desks are released at 9 a.m." — and she arrived after nine.`,`เธอจองถูกต้องแล้ว (ก่อน 8:00 น.) แต่ประกาศระบุว่า "Unclaimed desks are released at 9 a.m." และเธอมาถึงหลังเก้าโมง`],w:{0:[`A reservation is only held until 9 a.m. if nobody claims it.`,`การจองจะถูกกันไว้ถึง 9:00 น. เท่านั้นหากยังไม่มีผู้มารับสิทธิ์`],2:[`Writing before 8 a.m. is exactly what the rule requires.`,`การเขียนชื่อก่อน 8:00 น. คือสิ่งที่กฎกำหนดไว้พอดี`],3:[`The only charge mentioned is a late charge for books, and it has been waived.`,`ค่าปรับเดียวที่กล่าวถึงคือค่าปรับหนังสือเกินกำหนด ซึ่งได้รับการยกเว้นไว้แล้ว`]}}]},{id:`test-16`,number:16,title:`Practice Test 16`,subtitle:`Challenge — Full Entrance Paper IV`,tier:`challenge`,minutes:45,passages:[{id:`T16-P1`,kind:`Short story`,title:`The Umbrella Man`,body:[`Every morning for eleven years, Mr. Charan stood at the corner of Soi 7 with a folding table and a box of tools. He mended umbrellas.`,`On wet days there was a queue. On dry days he sat and read, and children on their way home from school stopped to watch him work. He never charged them anything for showing them how a spring was fitted.`,`Last March the shopping centre opened at the end of the road, and a shop inside it began to sell new umbrellas for thirty-five baht each. Mr. Charan’s price for a repair was forty.`,`His table was gone by June. Some people said he had gone to live with his daughter in Nan; others said he had simply moved to a different corner.`,`In October a small sign appeared in the window of the shopping centre’s repair shop. It read: REPAIRS BY MR. CHARAN — ASK AT THE DESK. Two of the children who used to watch him now work there on Saturdays.`]},{id:`T16-P2`,kind:`Instructions`,title:`Instructions for Candidates — Entrance Examination, Saturday 8 March`,body:[`1. Doors open at 7:30 a.m. Candidates must be seated by 8:15 a.m. Anyone arriving after 8:30 a.m. will not be admitted.`,`2. Bring your identification card and your candidate number. Candidates without both will be sent to Room 1 to complete a replacement form, which takes about fifteen minutes.`,`3. Use a 2B pencil for the answer sheet and a pen for the writing section. Correction fluid is not permitted.`,`4. Mobile phones must be switched off and left in the tray at the front of the room. A phone that makes any sound during the examination will be collected and returned at the end of the day.`,`5. The examination lasts two hours. Candidates may not leave during the first hour or during the last ten minutes.`],footer:[`Results will be posted on the school website within fourteen days.`]}],questions:[{id:`T16-Q01`,s:`grammar`,k:`tenses`,q:`She was completely out of breath because she ____ all the way from the station.`,c:[`ran`,`had been running`,`has run`,`was run`],a:1,e:[`Being out of breath is the visible result of an activity that continued up to that past moment, which is the past perfect continuous.`,`อาการหอบเหนื่อยคือผลที่เห็นได้จากกิจกรรมที่ดำเนินต่อเนื่องมาจนถึงช่วงเวลานั้นในอดีต จึงต้องใช้ past perfect continuous`],w:{0:[`"Ran" states the fact but does not link the running to the state she was in.`,`"ran" บอกข้อเท็จจริงแต่ไม่ได้เชื่อมการวิ่งกับสภาพที่เธอเป็นอยู่`],2:[`"Has run" connects to now, but the whole sentence is in the past.`,`"has run" เชื่อมโยงกับปัจจุบัน แต่ทั้งประโยคอยู่ในอดีต`],3:[`"Was run" is passive and would mean somebody else ran her.`,`"was run" เป็นรูป passive ซึ่งจะแปลว่ามีคนอื่นวิ่งเธอ`]}},{id:`T16-Q02`,s:`grammar`,k:`passive`,q:`The old temple ____ by fire in 1912 and was rebuilt ten years later.`,c:[`destroyed`,`was destroying`,`was destroyed`,`has destroyed`],a:2,e:[`The temple received the action and "by fire" names the cause, so the past passive "was destroyed" is correct — and it matches the second verb, "was rebuilt".`,`วัดเป็นผู้ถูกกระทำ และวลี "by fire" บอกสาเหตุ จึงต้องใช้ passive รูปอดีตคือ "was destroyed" ซึ่งสอดคล้องกับกริยาตัวที่สอง "was rebuilt"`],w:{0:[`"Destroyed" alone is active and would make the temple the destroyer.`,`"destroyed" ลำพังเป็นรูป active ซึ่งจะทำให้วัดกลายเป็นผู้ทำลาย`],1:[`"Was destroying" is active continuous and has the same problem.`,`"was destroying" เป็น active continuous ซึ่งมีปัญหาเดียวกัน`],3:[`"Has destroyed" is active present perfect and does not fit the year 1912.`,`"has destroyed" เป็น present perfect รูป active และไม่เข้ากับปี ค.ศ. 1912`]}},{id:`T16-Q03`,s:`grammar`,k:`reported-speech`,intro:`Direct speech: "Please wait outside," the doctor told us.`,q:`The doctor told us ____ outside.`,c:[`to wait`,`waiting`,`that wait`,`wait`],a:0,e:[`A reported command uses "tell somebody + to + base verb": told us to wait, told him to sit down.`,`คำสั่งที่ถูกเล่าต่อใช้โครงสร้าง "tell somebody + to + กริยาพื้นฐาน" เช่น told us to wait, told him to sit down`],w:{1:[`The -ing form is not used to report a command.`,`ไม่ใช้รูป -ing ในการเล่าคำสั่ง`],2:[`"That" introduces a reported statement, and it would need a subject and a finite verb.`,`"that" ใช้นำหน้าประโยคบอกเล่าที่ถูกเล่าต่อ และต้องมีประธานกับกริยาที่ผันแล้ว`],3:[`The bare base form cannot follow "told us"; the word "to" is required.`,`กริยารูปพื้นฐานตามหลัง "told us" ไม่ได้ ต้องมีคำว่า "to"`]}},{id:`T16-Q04`,s:`grammar`,k:`conditionals`,q:`I wish I ____ how to swim. Then I could go with you tomorrow.`,c:[`know`,`will know`,`have known`,`knew`],a:3,e:[`"I wish" about a present situation you would like to be different is followed by the past form, even though the meaning is about now.`,`โครงสร้าง "I wish" ที่พูดถึงสถานการณ์ปัจจุบันซึ่งอยากให้ต่างออกไป ต้องตามด้วยกริยารูปอดีต แม้ความหมายจะเป็นปัจจุบัน`],w:{0:[`"Know" is the present form, but "wish" needs the past form here.`,`"know" เป็นรูปปัจจุบัน แต่ "wish" ในที่นี้ต้องใช้รูปอดีต`],1:[`"Will" is never used directly after "I wish" in this meaning.`,`ไม่ใช้ "will" ต่อจาก "I wish" โดยตรงในความหมายนี้`],2:[`"Have known" is present perfect and does not fit the "I wish" pattern.`,`"have known" เป็น present perfect ซึ่งไม่เข้ากับโครงสร้าง "I wish"`]}},{id:`T16-Q05`,s:`grammar`,k:`relative-clauses`,q:`The building ____ roof was damaged in the storm is being repaired this week.`,c:[`which`,`whose`,`that`,`where`],a:1,e:[`The roof belongs to the building, so a possessive relative pronoun is needed. "Whose" is used for things as well as people and is followed straight away by a noun.`,`หลังคาเป็นของอาคาร จึงต้องใช้คำสรรพนามเชื่อมความที่แสดงความเป็นเจ้าของ คำว่า "whose" ใช้ได้ทั้งกับสิ่งของและบุคคล และต้องตามด้วยคำนามทันที`],w:{0:[`"Which" cannot be followed directly by "roof" without a preposition.`,`"which" ตามด้วยคำว่า "roof" ทันทีโดยไม่มีคำบุพบทไม่ได้`],2:[`"That" is a subject or object pronoun and never shows possession.`,`"that" เป็นสรรพนามประธานหรือกรรม และไม่แสดงความเป็นเจ้าของ`],3:[`"Where" refers to a place in which something happens, not to ownership.`,`"where" ใช้แทนสถานที่ที่เกิดเหตุการณ์ ไม่ได้แสดงความเป็นเจ้าของ`]}},{id:`T16-Q06`,s:`grammar`,k:`modals`,q:`He ____ have seen us. He was facing the other way the whole time.`,c:[`must not`,`should not`,`would not`,`can’t`],a:3,e:[`The speaker is sure that something did not happen, based on evidence. "Can’t have + past participle" expresses a confident negative deduction about the past.`,`ผู้พูดมั่นใจจากหลักฐานว่าบางสิ่งไม่ได้เกิดขึ้น โครงสร้าง "can’t have + กริยาช่องที่ 3" ใช้แสดงการคาดเดาเชิงปฏิเสธอย่างมั่นใจเกี่ยวกับอดีต`],w:{0:[`"Must not have" is not used for deduction; "must have" is the positive form.`,`"must not have" ไม่ใช้ในการคาดเดา ส่วน "must have" คือรูปเชิงบวก`],1:[`"Should not have" criticises something that did happen.`,`"should not have" ใช้ตำหนิสิ่งที่ได้เกิดขึ้นไปแล้ว`],2:[`"Would not have" describes an imagined past that never happened.`,`"would not have" ใช้กับอดีตที่สมมติขึ้นและไม่ได้เกิดจริง`]}},{id:`T16-Q07`,s:`grammar`,k:`verb-patterns`,q:`We were made ____ the whole essay again because of the untidy handwriting.`,c:[`rewrite`,`rewriting`,`to rewrite`,`rewrote`],a:2,e:[`"Make somebody do" drops the "to" in the active, but the passive puts it back: we were made to rewrite.`,`โครงสร้าง "make somebody do" ตัดคำว่า "to" ออกในรูป active แต่รูป passive ต้องใส่กลับเข้ามา จึงเป็น we were made to rewrite`],w:{0:[`The bare base form is only used in the active: "made us rewrite".`,`กริยารูปพื้นฐานใช้เฉพาะในรูป active เช่น "made us rewrite"`],1:[`The -ing form does not follow "made" in either voice.`,`รูป -ing ไม่ตามหลัง "made" ไม่ว่าจะเป็น active หรือ passive`],3:[`"Rewrote" is a past form and cannot follow another verb here.`,`"rewrote" เป็นรูปอดีต จึงตามหลังกริยาอีกตัวในที่นี้ไม่ได้`]}},{id:`T16-Q08`,s:`grammar`,k:`agreement`,q:`Twenty minutes ____ not long enough to answer a question like this.`,c:[`is`,`are`,`were`,`have been`],a:0,e:[`A period of time is treated as one single amount, so a phrase such as "twenty minutes" takes a singular verb.`,`ช่วงเวลาถือเป็นปริมาณเดียว ดังนั้นวลีอย่าง "twenty minutes" จึงใช้กับกริยาเอกพจน์`],w:{1:[`"Are" follows the -s ending, but the phrase means one length of time.`,`"are" ถูกดึงดูดด้วย -s ท้ายคำ แต่วลีนี้หมายถึงช่วงเวลาเดียว`],2:[`"Were" is both plural and past; the sentence is about now.`,`"were" เป็นทั้งพหูพจน์และรูปอดีต แต่ประโยคนี้พูดถึงปัจจุบัน`],3:[`"Have been" is plural present perfect and does not fit this statement.`,`"have been" เป็น present perfect รูปพหูพจน์ จึงไม่เข้ากับประโยคนี้`]}},{id:`T16-Q09`,s:`grammar`,k:`prepositions`,q:`My younger sister is very keen ____ photography.`,c:[`in`,`on`,`of`,`with`],a:1,e:[`The fixed pattern is "keen on + noun or -ing form": keen on football, keen on swimming.`,`โครงสร้างตายตัวคือ "keen on + คำนามหรือรูป -ing" เช่น keen on football, keen on swimming`],w:{0:[`"Interested in" takes "in", but "keen" does not.`,`คำว่า "interested" ใช้กับ "in" แต่ "keen" ไม่ใช้`],2:[`"Keen of" is not used in English.`,`รูป "keen of" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Keen with" is not a possible combination.`,`รูป "keen with" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T16-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The road was blocked for hours, and by the time we arrived the ceremony was ____.`,c:[`starting`,`beginning`,`arriving`,`over`],a:3,e:[`"By the time we arrived" after a long delay means they were too late. "Over" means finished.`,`วลี "by the time we arrived" หลังจากล่าช้าเป็นเวลานานแสดงว่าพวกเขามาสายเกินไป คำว่า "over" แปลว่าจบลงแล้ว`],w:{0:[`"Starting" would mean they arrived exactly on time, which the delay rules out.`,`"starting" จะหมายความว่าพวกเขามาถึงพอดีเวลา ซึ่งขัดกับความล่าช้าที่เกิดขึ้น`],1:[`"Beginning" has the same problem as "starting".`,`"beginning" มีปัญหาเดียวกับ "starting"`],2:[`"Arriving" is used for people and vehicles, not for an event.`,`"arriving" ใช้กับคนและยานพาหนะ ไม่ใช้กับงานพิธี`]}},{id:`T16-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The coach praised the team for their persistence after four defeats. "Persistence" means ____.`,c:[`great speed`,`complete honesty`,`not giving up`,`careful planning`],a:2,e:[`The team kept going after losing four times, so the word describes continuing to try. "Persistence" means refusing to give up.`,`ทีมยังคงสู้ต่อหลังแพ้ถึงสี่ครั้ง คำนี้จึงหมายถึงการพยายามต่อไป คำว่า "persistence" แปลว่าความไม่ย่อท้อ`],w:{0:[`"Speed" is about how fast you move, not how long you keep trying.`,`"speed" เกี่ยวกับความเร็ว ไม่ได้บอกว่าพยายามต่อเนื่องนานเพียงใด`],1:[`"Honesty" is about telling the truth, which is a different quality.`,`"honesty" เกี่ยวกับการพูดความจริง ซึ่งเป็นคุณสมบัติคนละอย่าง`],3:[`"Planning" is about preparing beforehand, not about continuing after failure.`,`"planning" คือการวางแผนล่วงหน้า ไม่ใช่การสู้ต่อหลังความล้มเหลว`]}},{id:`T16-Q12`,s:`vocabulary`,k:`collocations`,q:`After six hours of talks, the two sides finally ____ an agreement.`,c:[`reached`,`arrived`,`got`,`held`],a:0,e:[`"Reach an agreement" is the standard collocation for two sides finally agreeing after discussion.`,`"reach an agreement" เป็นคำคู่มาตรฐานที่ใช้เมื่อสองฝ่ายตกลงกันได้ในที่สุดหลังการเจรจา`],w:{1:[`"Arrive" needs "at": you can arrive at an agreement, but not "arrive an agreement".`,`"arrive" ต้องมี "at" เช่น arrive at an agreement ไม่ใช่ "arrive an agreement"`],2:[`"Get an agreement" is not the natural phrase in this formal context.`,`"get an agreement" ไม่ใช่วลีที่เป็นธรรมชาติในบริบทที่เป็นทางการนี้`],3:[`"Hold an agreement" is not used in English.`,`รูป "hold an agreement" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T16-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`The smell of the old kitchen ____ memories of my grandmother’s house.`,c:[`brought about`,`brought back`,`brought up`,`brought down`],a:1,e:[`"Bring back memories" means to make somebody remember something from the past. It is the fixed phrase for this idea.`,`"bring back memories" แปลว่าทำให้นึกถึงเรื่องราวในอดีต ซึ่งเป็นวลีตายตัวที่ใช้กับความหมายนี้`],w:{0:[`"Bring about" means to cause something to happen, such as a change.`,`"bring about" แปลว่าทำให้บางสิ่งเกิดขึ้น เช่น การเปลี่ยนแปลง`],2:[`"Bring up" means to raise a child, or to mention a topic.`,`"bring up" แปลว่าเลี้ยงดูเด็ก หรือหยิบยกหัวข้อขึ้นมาพูด`],3:[`"Bring down" means to reduce something, such as a price.`,`"bring down" แปลว่าลดบางสิ่งลง เช่น ราคา`]}},{id:`T16-Q14`,s:`vocabulary`,k:`vocab-context`,q:`Although he had failed the test twice, his ____ never weakened, and on the third attempt he passed.`,c:[`patience`,`determination`,`politeness`,`imagination`],a:1,e:[`He kept trying until he succeeded, so the word describes a firm decision to reach a goal. "Determination" means exactly that.`,`เขาพยายามต่อไปจนสำเร็จ คำนี้จึงหมายถึงความตั้งใจแน่วแน่ที่จะไปให้ถึงเป้าหมาย ซึ่งตรงกับคำว่า "determination"`],w:{0:[`"Patience" is the ability to wait calmly, not the will to keep trying.`,`"patience" คือความสามารถในการรอคอยอย่างสงบ ไม่ใช่ความมุ่งมั่นที่จะพยายามต่อ`],2:[`"Politeness" is about good manners and is unrelated to passing a test.`,`"politeness" เกี่ยวกับมารยาทที่ดี ซึ่งไม่เกี่ยวกับการสอบผ่าน`],3:[`"Imagination" is the ability to form new ideas in the mind.`,`"imagination" คือความสามารถในการคิดจินตนาการสิ่งใหม่`]}},{id:`T16-Q15`,s:`conversation`,k:`conversation`,intro:`Gift: I’m so nervous about the entrance examination tomorrow.
Ploy: ____`,q:`Choose the best reply for Ploy.`,c:[`You’ll be fine — you’ve prepared really well.`,`Yes, you should certainly be nervous about it.`,`I am not nervous at all, personally speaking.`,`The examination is tomorrow, that is quite true.`],a:0,e:[`A friend expressing worry needs reassurance. The reply calms Gift and gives a real reason for confidence.`,`เมื่อเพื่อนแสดงความกังวล สิ่งที่ต้องการคือกำลังใจ คำตอบนี้ช่วยปลอบใจกิ๊ฟและให้เหตุผลที่ทำให้มั่นใจได้จริง`],w:{1:[`Agreeing that she should be nervous increases the worry.`,`การเห็นด้วยว่าเธอควรกังวลยิ่งทำให้ความกังวลเพิ่มขึ้น`],2:[`Talking about yourself ignores your friend’s feelings.`,`การพูดถึงตัวเองเป็นการมองข้ามความรู้สึกของเพื่อน`],3:[`Repeating a fact offers no comfort at all.`,`การพูดซ้ำข้อเท็จจริงไม่ได้ช่วยปลอบใจเลย`]}},{id:`T16-Q16`,s:`conversation`,k:`conversation`,intro:`Caller: Good morning. ____
Receptionist: Certainly. May I have your name, please?`,q:`Choose the best line for the caller.`,c:[`Is Dr. Kanya there or not?`,`I want to see Dr. Kanya right now.`,`Dr. Kanya is my own doctor, you know.`,`I’d like to make an appointment with Dr. Kanya, please.`],a:3,e:[`The receptionist says "Certainly" and asks for a name, which is what happens when somebody books an appointment. "I’d like to…" is the polite request form.`,`พนักงานต้อนรับตอบว่า "Certainly" แล้วขอชื่อ ซึ่งเป็นขั้นตอนของการนัดหมาย และวลี "I’d like to…" เป็นรูปการขออย่างสุภาพ`],w:{0:[`"Or not" makes the question sound impatient and rude.`,`การเติม "or not" ทำให้คำถามฟังดูใจร้อนและไม่สุภาพ`],1:[`Demanding to be seen immediately would not receive a calm "Certainly".`,`การเรียกร้องให้พบทันทีคงไม่ได้รับคำตอบที่ใจเย็นว่า "Certainly"`],2:[`This states a fact but does not ask for anything.`,`ประโยคนี้บอกข้อเท็จจริงแต่ไม่ได้ร้องขออะไร`]}},{id:`T16-Q17`,s:`conversation`,k:`conversation`,intro:`Bank: Could I borrow your bicycle this weekend?
Nim: ____`,q:`Choose the best reply for Nim, who cannot lend it this weekend.`,c:[`No. It is my bicycle, not yours.`,`I’m sorry, my cousin is using it. Would next weekend be all right?`,`Yes, but I am using it myself this weekend.`,`You really should buy a bicycle of your own.`],a:1,e:[`A friendly refusal gives a short reason and offers an alternative, so the friendship is not damaged.`,`การปฏิเสธอย่างเป็นมิตรคือให้เหตุผลสั้น ๆ และเสนอทางเลือกอื่น เพื่อไม่ให้กระทบมิตรภาพ`],w:{0:[`This is blunt and gives no reason at all.`,`ประโยคนี้ห้วนและไม่ได้ให้เหตุผลใด ๆ`],2:[`"Yes, but I am using it" contradicts itself.`,`"Yes, but I am using it" ขัดแย้งกันเอง`],3:[`Telling a friend to buy their own is unkind and does not answer the request.`,`การบอกให้เพื่อนไปซื้อเองเป็นการพูดที่ไม่มีน้ำใจและไม่ได้ตอบคำขอ`]}},{id:`T16-Q18`,s:`conversation`,k:`conversation`,intro:`Coach: So we’ll meet at the north gate at half past seven.
Runner: ____`,q:`Choose the best reply for the runner, who wants to be sure.`,c:[`Yes, I met you at the north gate before.`,`No, the north gate is really quite far away.`,`Let me check — the north gate, seven thirty. Is that right?`,`The north gate has been closed since Monday.`],a:2,e:[`Repeating the key details back and asking "Is that right?" is the standard way to confirm an arrangement in English.`,`การทวนรายละเอียดสำคัญกลับไปแล้วถามว่า "Is that right?" เป็นวิธีมาตรฐานในการยืนยันการนัดหมายในภาษาอังกฤษ`],w:{0:[`This talks about a past meeting and confirms nothing about tomorrow.`,`ประโยคนี้พูดถึงการพบกันในอดีต และไม่ได้ยืนยันเรื่องวันพรุ่งนี้`],1:[`Complaining about the distance does not check the arrangement.`,`การบ่นเรื่องระยะทางไม่ได้เป็นการตรวจสอบการนัดหมาย`],3:[`This raises a new problem rather than confirming what was said.`,`ประโยคนี้หยิบยกปัญหาใหม่ขึ้นมาแทนที่จะยืนยันสิ่งที่ตกลงกัน`]}},{id:`T16-Q19`,s:`reading`,k:`reading-detail`,p:`T16-P1`,q:`How long did Mr. Charan work at the corner of Soi 7?`,c:[`Eleven months`,`Since last March`,`Eleven years`,`Since October`],a:2,e:[`The opening line says, "Every morning for eleven years, Mr. Charan stood at the corner of Soi 7."`,`บรรทัดแรกระบุว่า "Every morning for eleven years, Mr. Charan stood at the corner of Soi 7." คือ 11 ปี`],w:{0:[`The passage says years, not months.`,`บทอ่านระบุว่าเป็นปี ไม่ใช่เดือน`],1:[`Last March is when the shopping centre opened.`,`เดือนมีนาคมที่ผ่านมาคือช่วงที่ห้างสรรพสินค้าเปิด`],3:[`October is when the sign appeared in the window.`,`เดือนตุลาคมคือช่วงที่ป้ายปรากฏบนหน้าต่างร้าน`]}},{id:`T16-Q20`,s:`reading`,k:`reading-inference`,p:`T16-P1`,q:`Why did people stop bringing their umbrellas to Mr. Charan?`,c:[`A new shop sold umbrellas for less than his repair price.`,`He had moved to Nan to live with his daughter.`,`His box of tools had been stolen from the table.`,`The children had stopped coming to watch him work.`],a:0,e:[`The passage puts two numbers side by side: a new umbrella cost thirty-five baht, while a repair cost forty. Buying a new one became cheaper than mending an old one.`,`บทอ่านวางตัวเลขสองจำนวนไว้เคียงกัน คือร่มใหม่ราคา 35 บาท ส่วนค่าซ่อม 40 บาท การซื้อใหม่จึงถูกกว่าการซ่อม`],w:{1:[`Moving to Nan is only a rumour told after his table had already gone.`,`เรื่องย้ายไปน่านเป็นเพียงคำเล่าลือหลังจากโต๊ะของเขาหายไปแล้ว`],2:[`No theft is mentioned anywhere in the story.`,`ในเรื่องไม่ได้กล่าวถึงการถูกขโมยเลย`],3:[`The children were watching, not paying customers.`,`เด็ก ๆ เป็นเพียงผู้มาดู ไม่ใช่ลูกค้าที่จ่ายเงิน`]}},{id:`T16-Q21`,s:`reading`,k:`reading-detail`,p:`T16-P1`,q:`What did Mr. Charan never charge the children for?`,c:[`Mending their own umbrellas`,`Selling them cheap new umbrellas`,`Reading stories to them on dry days`,`Showing them how a spring was fitted`],a:3,e:[`The second paragraph says, "He never charged them anything for showing them how a spring was fitted."`,`ย่อหน้าที่สองระบุว่า "He never charged them anything for showing them how a spring was fitted." คือสอนวิธีใส่สปริงให้ฟรี`],w:{0:[`The story does not say the children brought umbrellas of their own.`,`เรื่องไม่ได้ระบุว่าเด็ก ๆ นำร่มของตนเองมา`],1:[`Mr. Charan repaired umbrellas; the shopping centre shop sold them.`,`คุณจรัญรับซ่อมร่ม ส่วนร้านในห้างเป็นผู้ขาย`],2:[`He read on dry days, but the story does not say he read to the children.`,`เขาอ่านหนังสือในวันที่ฝนไม่ตก แต่เรื่องไม่ได้บอกว่าเขาอ่านให้เด็กฟัง`]}},{id:`T16-Q22`,s:`reading`,k:`reading-inference`,p:`T16-P1`,q:`What does the last paragraph suggest?`,c:[`Mr. Charan has left the district for good.`,`Mr. Charan is now working inside the shopping centre.`,`The repair shop has copied Mr. Charan’s name without asking.`,`The children have opened a repair shop of their own.`],a:1,e:[`The sign reads "REPAIRS BY MR. CHARAN — ASK AT THE DESK", and two of the children who used to watch him now work there. The trade and the man have moved indoors.`,`ป้ายเขียนว่า "REPAIRS BY MR. CHARAN — ASK AT THE DESK" และเด็กสองคนที่เคยมาดูเขาทำงานก็ทำงานที่นั่น ทั้งงานและตัวเขาจึงย้ายเข้าไปอยู่ในห้าง`],w:{0:[`The sign in October shows his work is back on the same road.`,`ป้ายในเดือนตุลาคมแสดงว่างานของเขากลับมาอยู่บนถนนสายเดิม`],2:[`The sign invites customers to ask at the desk, which points to a real arrangement.`,`ป้ายเชิญให้ลูกค้าไปสอบถามที่เคาน์เตอร์ ซึ่งบ่งบอกว่าเป็นข้อตกลงจริง`],3:[`The children work there on Saturdays; the shop is not theirs.`,`เด็ก ๆ ทำงานที่นั่นในวันเสาร์ ร้านไม่ใช่ของพวกเขา`]}},{id:`T16-Q23`,s:`reading`,k:`reading-detail`,p:`T16-P2`,q:`What is the latest time at which a candidate can be admitted?`,c:[`7:30 a.m.`,`8:00 a.m.`,`8:15 a.m.`,`8:30 a.m.`],a:3,e:[`Rule 1 says, "Anyone arriving after 8:30 a.m. will not be admitted," so 8:30 is the last possible time.`,`กฎข้อ 1 ระบุว่า "Anyone arriving after 8:30 a.m. will not be admitted." ดังนั้น 8:30 น. จึงเป็นเวลาสุดท้ายที่เข้าได้`],w:{0:[`7:30 a.m. is when the doors open, not the deadline.`,`7:30 น. คือเวลาเปิดประตู ไม่ใช่เวลาปิดรับ`],1:[`8:00 a.m. is not mentioned anywhere in the instructions.`,`เวลา 8:00 น. ไม่ได้ถูกกล่าวถึงในคำแนะนำเลย`],2:[`8:15 a.m. is when candidates must be seated, but late arrivals are still admitted until 8:30.`,`8:15 น. คือเวลาที่ผู้เข้าสอบต้องนั่งประจำที่ แต่ผู้มาสายยังเข้าได้จนถึง 8:30 น.`]}},{id:`T16-Q24`,s:`reading`,k:`reading-detail`,p:`T16-P2`,q:`Which of these is NOT permitted in the examination room?`,c:[`Correction fluid`,`A 2B pencil`,`A pen for the writing section`,`An identification card`],a:0,e:[`Rule 3 states plainly, "Correction fluid is not permitted."`,`กฎข้อ 3 ระบุไว้ชัดเจนว่า "Correction fluid is not permitted." คือห้ามใช้น้ำยาลบคำผิด`],w:{1:[`A 2B pencil is required for the answer sheet.`,`ดินสอ 2B เป็นสิ่งที่ต้องใช้กับกระดาษคำตอบ`],2:[`A pen is required for the writing section.`,`ปากกาเป็นสิ่งที่ต้องใช้ในส่วนการเขียน`],3:[`An identification card must be brought to the examination.`,`บัตรประจำตัวเป็นสิ่งที่ต้องนำมาในวันสอบ`]}},{id:`T16-Q25`,s:`reading`,k:`reading-inference`
