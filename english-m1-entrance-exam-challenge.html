ly. A short meeting for all host families will be held in the library on Tuesday 22 July at 6 p.m.`,`Please note that we cannot accept forms after 18 July, because the Japanese school must book travel insurance for each student well in advance.`],footer:[`Kind regards,`,`Miss Nutcha, Head of English`]},{id:`T08-P2`,kind:`Informational passage`,title:`Saying Hello Around the World`,body:[`A greeting seems like a small thing, yet it is one of the first ways we show respect. It is also one of the easiest ways to cause confusion when we travel.`,`In Thailand people press their palms together in a wai; in Japan they bow; in much of Europe and America they shake hands. In parts of France and Italy friends greet each other with a light kiss on both cheeks, while in Tibet people have traditionally greeted visitors by sticking out the tongue.`,`Distance matters too. Visitors from northern Europe often stand about an arm’s length apart when they talk. In many countries in South America and the Middle East people stand much closer, and stepping back can look unfriendly.`,`None of these customs is right or wrong. Travellers who watch carefully for a moment before they greet somebody usually manage very well.`]}],questions:[{id:`T08-Q01`,s:`grammar`,k:`reported-speech`,intro:`Direct speech: "Where did you leave your bags?" the guide asked us.`,q:`The guide asked us where ____.`,c:[`we had left our bags`,`had we left our bags`,`did we leave our bags`,`we did leave our bags`],a:0,e:[`A reported question keeps normal statement word order — subject before verb — and the past simple "did leave" moves back to the past perfect "had left".`,`คำถามที่ถูกเล่าต่อจะใช้ลำดับคำแบบประโยคบอกเล่า คือประธานมาก่อนกริยา และ past simple "did leave" ต้องเลื่อนถอยเป็น past perfect "had left"`],w:{1:[`Reported questions do not use question word order. "Had we" belongs in a direct question.`,`คำถามที่ถูกเล่าต่อจะไม่ใช้ลำดับคำแบบคำถาม รูป "had we" ใช้ในคำถามตรงเท่านั้น`],2:[`"Did" is not used in a reported question; the tense shifts instead.`,`ไม่ใช้ "did" ในคำถามที่ถูกเล่าต่อ แต่ต้องเปลี่ยนกาลของกริยาแทน`],3:[`"We did leave" keeps the auxiliary "did", which is dropped in reported speech.`,`"we did leave" ยังคงกริยาช่วย "did" ไว้ ซึ่งต้องตัดออกในการเล่าคำพูด`]}},{id:`T08-Q02`,s:`grammar`,k:`passive`,q:`All the tickets ____ before we even reached the counter.`,c:[`have sold`,`were selling`,`had been sold`,`sold`],a:2,e:[`The tickets received the action, so the passive is needed, and the selling finished before another past event, so the past perfect passive "had been sold" is correct.`,`ตั๋วเป็นผู้ถูกกระทำ จึงต้องใช้รูป passive และเนื่องจากการขายจบก่อนอีกเหตุการณ์ในอดีต จึงใช้ passive แบบ past perfect คือ "had been sold"`],w:{0:[`"Have sold" is active and would mean the tickets sold something.`,`"have sold" เป็นรูป active ซึ่งจะแปลว่าตั๋วเป็นผู้ขายสิ่งของ`],1:[`"Were selling" is active continuous and does not show the action was complete.`,`"were selling" เป็น active continuous และไม่ได้แสดงว่าการกระทำเสร็จสิ้นแล้ว`],3:[`"Sold" alone is active past and makes the tickets the seller.`,`"sold" ลำพังเป็นรูป active อดีต ซึ่งทำให้ตั๋วกลายเป็นผู้ขาย`]}},{id:`T08-Q03`,s:`grammar`,k:`conditionals`,q:`If we had a bigger hall, we ____ invite the whole town to the concert.`,c:[`will`,`can`,`must`,`could`],a:3,e:[`The "if" clause uses the past form "had", which marks an imagined present situation. In a second conditional the main clause uses "would" or "could".`,`อนุประโยค if ใช้รูปอดีต "had" ซึ่งบ่งบอกการสมมติในปัจจุบัน ประโยคหลักของเงื่อนไขแบบที่ 2 จึงใช้ "would" หรือ "could"`],w:{0:[`"Will" belongs in a first conditional, where the "if" clause is present simple.`,`"will" ใช้ในเงื่อนไขแบบที่ 1 ซึ่งอนุประโยค if เป็น present simple`],1:[`"Can" is the present form; the imagined situation needs the past form "could".`,`"can" เป็นรูปปัจจุบัน แต่การสมมติต้องใช้รูปอดีตคือ "could"`],2:[`"Must" states an obligation and does not fit an imagined result.`,`"must" บอกความจำเป็น จึงไม่เข้ากับผลลัพธ์ที่เป็นการสมมติ`]}},{id:`T08-Q04`,s:`grammar`,k:`relative-clauses`,q:`The village ____ my grandmother grew up has only one shop.`,c:[`which`,`where`,`that`,`who`],a:1,e:[`The clause tells us the place in which she grew up, so the relative adverb "where" is correct. Compare: the village where she grew up = the village in which she grew up.`,`อนุประโยคนี้บอกสถานที่ที่คุณยายเติบโตขึ้นมา จึงต้องใช้คำเชื่อมบอกสถานที่ "where" เทียบได้กับ the village in which she grew up`],w:{0:[`"Which" would need a preposition: "the village which my grandmother grew up in".`,`"which" ต้องมีคำบุพบทประกอบ เช่น "the village which my grandmother grew up in"`],2:[`"That" has the same problem — it needs "in" at the end of the clause.`,`"that" มีปัญหาเดียวกัน คือต้องมี "in" อยู่ท้ายอนุประโยค`],3:[`"Who" refers to people, but a village is a place.`,`"who" ใช้กับบุคคล แต่หมู่บ้านเป็นสถานที่`]}},{id:`T08-Q05`,s:`grammar`,k:`tenses`,q:`This time next week we ____ on a boat somewhere in Krabi.`,c:[`will sail`,`sail`,`will be sailing`,`are sailed`],a:2,e:[`"This time next week" points to an action that will be in progress at a particular future moment, which is the future continuous: will be sailing.`,`วลี "this time next week" ชี้ถึงเหตุการณ์ที่จะกำลังดำเนินอยู่ ณ เวลาหนึ่งในอนาคต จึงใช้ future continuous คือ will be sailing`],w:{0:[`"Will sail" states a simple future fact, not an action in progress at that moment.`,`"will sail" บอกข้อเท็จจริงในอนาคตแบบธรรมดา ไม่ได้บอกว่ากำลังดำเนินอยู่ในขณะนั้น`],1:[`"Sail" is present simple and is used for timetables, not for this meaning.`,`"sail" เป็น present simple ใช้กับตารางเวลา ไม่ใช้ในความหมายนี้`],3:[`"Are sailed" is passive, but the people are the ones doing the sailing.`,`"are sailed" เป็นรูป passive แต่ผู้คนเป็นฝ่ายแล่นเรือเอง`]}},{id:`T08-Q06`,s:`grammar`,k:`modals`,q:`The lights are off and the car has gone. They ____ have gone out for the evening.`,c:[`must`,`can`,`would`,`need`],a:0,e:[`The speaker is drawing a confident conclusion from evidence. "Must have + past participle" expresses a strong logical deduction about the past.`,`ผู้พูดกำลังสรุปอย่างมั่นใจจากหลักฐานที่เห็น โครงสร้าง "must have + กริยาช่องที่ 3" ใช้แสดงการคาดเดาอย่างมั่นใจเกี่ยวกับอดีต`],w:{1:[`"Can have gone" is not used for deduction in a positive statement.`,`รูป "can have gone" ไม่ใช้ในการคาดเดาในประโยคบอกเล่า`],2:[`"Would have gone" describes an imagined past that did not happen.`,`"would have gone" ใช้กับอดีตที่สมมติขึ้นและไม่ได้เกิดจริง`],3:[`"Need have" is used only in negatives, as in "You needn’t have worried."`,`"need have" ใช้เฉพาะในรูปปฏิเสธ เช่น "You needn’t have worried."`]}},{id:`T08-Q07`,s:`grammar`,k:`quantifiers`,q:`____ of the two answers is correct, because the question was printed wrongly.`,c:[`None`,`Neither`,`Both`,`Either`],a:1,e:[`"Neither" is the word used to say "not one and not the other" when there are exactly two things, and it takes a singular verb: neither … is.`,`คำว่า "neither" ใช้เมื่อมีสิ่งของสองสิ่งและหมายถึงไม่ใช่ทั้งคู่ และต้องใช้กับกริยาเอกพจน์ เช่น neither … is`],w:{0:[`"None" is used for three or more things, or for uncountable amounts.`,`"none" ใช้กับสิ่งของตั้งแต่สามสิ่งขึ้นไป หรือกับปริมาณที่นับไม่ได้`],2:[`"Both" means the two together and would need a plural verb, "are".`,`"both" หมายถึงทั้งสองอย่าง และต้องใช้กริยาพหูพจน์ "are"`],3:[`"Either" means one or the other, which contradicts "printed wrongly".`,`"either" แปลว่าอย่างใดอย่างหนึ่ง ซึ่งขัดแย้งกับข้อความว่าโจทย์พิมพ์ผิด`]}},{id:`T08-Q08`,s:`grammar`,k:`conjunctions`,q:`Take a jacket with you ____ it gets cold on the mountain in the evening.`,c:[`so that`,`although`,`unless`,`in case`],a:3,e:[`"In case" introduces a precaution against something that might happen. You take the jacket because cold weather is possible.`,`"in case" ใช้ขึ้นต้นข้อความที่บอกการเตรียมรับมือกับสิ่งที่อาจเกิดขึ้น คุณพกเสื้อแจ็กเก็ตไปเพราะอากาศอาจหนาว`],w:{0:[`"So that" gives a purpose, which would mean you want it to get cold.`,`"so that" บอกจุดประสงค์ ซึ่งจะแปลว่าคุณอยากให้อากาศหนาว`],1:[`"Although" shows contrast and does not explain why you take a jacket.`,`"although" แสดงความขัดแย้ง และไม่ได้อธิบายว่าทำไมต้องพกเสื้อแจ็กเก็ต`],2:[`"Unless" means "if not", which reverses the meaning of the sentence.`,`"unless" แปลว่า "ถ้าไม่" ซึ่งกลับความหมายของประโยค`]}},{id:`T08-Q09`,s:`grammar`,k:`pronouns`,q:`The students painted the whole mural ____, without any help from the art teacher.`,c:[`themself`,`theirselves`,`themselves`,`they`],a:2,e:[`The reflexive pronoun for a plural subject is "themselves", and here it emphasises that they did it alone.`,`คำสรรพนามสะท้อนของประธานพหูพจน์คือ "themselves" และในที่นี้ใช้เน้นว่าพวกเขาทำเองทั้งหมด`],w:{0:[`"Themself" is not used for a plural group in standard written English.`,`"themself" ไม่ใช้กับกลุ่มพหูพจน์ในภาษาอังกฤษเขียนมาตรฐาน`],1:[`"Theirselves" is not a word in standard English.`,`คำว่า "theirselves" ไม่มีในภาษาอังกฤษมาตรฐาน`],3:[`"They" is a subject pronoun and cannot be used for emphasis in this position.`,`"they" เป็นสรรพนามประธาน จึงใช้เน้นในตำแหน่งนี้ไม่ได้`]}},{id:`T08-Q10`,s:`vocabulary`,k:`vocab-context`,q:`Nobody in our group could read the sign, because it was written in a script that was completely ____ to us.`,c:[`familiar`,`unfamiliar`,`useful`,`popular`],a:1,e:[`If nobody could read it, the writing was something they did not know. "Unfamiliar" means not known to you.`,`ถ้าไม่มีใครอ่านออก แสดงว่าตัวอักษรนั้นเป็นสิ่งที่พวกเขาไม่รู้จัก คำว่า "unfamiliar" แปลว่าไม่คุ้นเคยหรือไม่รู้จัก`],w:{0:[`"Familiar" means well known, which would mean they could read it.`,`"familiar" แปลว่าคุ้นเคยดี ซึ่งจะหมายความว่าพวกเขาอ่านออก`],2:[`"Useful" describes value and does not explain why they could not read it.`,`"useful" บอกประโยชน์ ไม่ได้อธิบายว่าทำไมพวกเขาอ่านไม่ออก`],3:[`"Popular" means liked by many people, which is unrelated to reading a script.`,`"popular" แปลว่าเป็นที่นิยม ซึ่งไม่เกี่ยวกับการอ่านตัวอักษร`]}},{id:`T08-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`My uncle is a generous man who gives away half of everything he earns. The opposite of "generous" is ____.`,c:[`polite`,`friendly`,`honest`,`selfish`],a:3,e:[`"Generous" means willing to give to others. Its opposite is "selfish", which means thinking only of yourself.`,`"generous" แปลว่าเอื้อเฟื้อ ยินดีให้ผู้อื่น คำตรงข้ามคือ "selfish" ซึ่งแปลว่าเห็นแก่ตัว`],w:{0:[`"Polite" is about good manners, not about giving.`,`"polite" เกี่ยวกับมารยาทที่ดี ไม่เกี่ยวกับการให้`],1:[`"Friendly" describes being warm to others; an unfriendly person can still give money.`,`"friendly" หมายถึงเป็นมิตร คนที่ไม่เป็นมิตรก็ยังบริจาคเงินได้`],2:[`"Honest" is the opposite of dishonest, not of generous.`,`"honest" เป็นคำตรงข้ามกับไม่ซื่อสัตย์ ไม่ใช่ตรงข้ามกับเอื้อเฟื้อ`]}},{id:`T08-Q12`,s:`vocabulary`,k:`collocations`,q:`Please ____ attention to the safety demonstration before the boat leaves the pier.`,c:[`pay`,`give`,`make`,`put`],a:0,e:[`"Pay attention" is a fixed expression meaning to listen or watch carefully. No other verb replaces "pay" here.`,`"pay attention" เป็นสำนวนตายตัว แปลว่าตั้งใจฟังหรือตั้งใจดู โดยไม่ใช้กริยาอื่นแทน "pay"`],w:{1:[`"Give attention to" exists in formal writing, but "pay attention to" is the standard phrase here.`,`"give attention to" มีใช้ในภาษาเขียนที่เป็นทางการ แต่วลีมาตรฐานในบริบทนี้คือ "pay attention to"`],2:[`"Make attention" is not used in English.`,`รูป "make attention" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Put attention" is not a natural English collocation.`,`รูป "put attention" ไม่เป็นคำคู่ที่ใช้จริงในภาษาอังกฤษ`]}},{id:`T08-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`It took us a few days to ____ the local accent, but after a week we understood everything.`,c:[`get over`,`get through`,`get used to`,`get away with`],a:2,e:[`"Get used to" means to become familiar with something new until it no longer feels strange.`,`"get used to" แปลว่าค่อย ๆ คุ้นเคยกับสิ่งใหม่จนไม่รู้สึกแปลกอีกต่อไป`],w:{0:[`"Get over" means to recover from an illness or a disappointment.`,`"get over" แปลว่าหายจากอาการป่วยหรือความผิดหวัง`],1:[`"Get through" means to finish a task or to reach someone by phone.`,`"get through" แปลว่าทำงานให้เสร็จ หรือติดต่อทางโทรศัพท์ได้`],3:[`"Get away with" means to do something wrong without being punished.`,`"get away with" แปลว่าทำผิดแล้วรอดตัวไปได้โดยไม่ถูกลงโทษ`]}},{id:`T08-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The lantern festival ____ visitors from every province in the country.`,c:[`prevents`,`avoids`,`refuses`,`attracts`],a:3,e:[`A famous festival makes people want to come. "Attract" means to make people come to a place or become interested.`,`เทศกาลที่มีชื่อเสียงทำให้ผู้คนอยากมาชม คำว่า "attract" แปลว่าดึงดูดให้ผู้คนมาหรือสนใจ`],w:{0:[`"Prevents" means stops something from happening — the opposite meaning.`,`"prevents" แปลว่าขัดขวางไม่ให้เกิดขึ้น ซึ่งมีความหมายตรงข้าม`],1:[`"Avoids" means keeps away from something.`,`"avoids" แปลว่าหลีกเลี่ยงสิ่งใดสิ่งหนึ่ง`],2:[`"Refuses" means says no to something, which a festival cannot do to visitors it welcomes.`,`"refuses" แปลว่าปฏิเสธ ซึ่งเทศกาลที่ต้อนรับผู้มาเยือนย่อมไม่ทำเช่นนั้น`]}},{id:`T08-Q15`,s:`conversation`,k:`conversation`,intro:`Secretary: I’m afraid Mr. Prasit is in a meeting at the moment.
Caller: ____`,q:`Choose the best reply for the caller.`,c:[`Yes, he is a very busy man.`,`I will meet him in the meeting then.`,`Could I leave a message, please?`,`Please meet me inside the meeting.`],a:2,e:[`When the person you want is unavailable, the standard next step on the telephone is to ask to leave a message.`,`เมื่อคนที่ต้องการพูดด้วยไม่ว่าง ขั้นตอนถัดไปตามมาตรฐานของการสนทนาทางโทรศัพท์คือขอฝากข้อความ`],w:{0:[`This comments on Mr. Prasit but does not move the call forward.`,`ประโยคนี้แสดงความเห็นเรื่องคุณประสิทธิ์ แต่ไม่ได้ทำให้การสนทนาคืบหน้า`],1:[`A caller cannot join a meeting they were not invited to.`,`ผู้โทรเข้าไปร่วมประชุมที่ไม่ได้รับเชิญไม่ได้`],3:[`Asking the secretary to come into the meeting makes no sense.`,`การขอให้เลขานุการเข้าไปในห้องประชุมไม่สมเหตุสมผล`]}},{id:`T08-Q16`,s:`conversation`,k:`conversation`,intro:`Aim: I think our school should have lessons on Saturday mornings too.
View: ____`,q:`Choose the best reply for View, who does not agree.`,c:[`You are completely wrong about that.`,`Yes, Saturday is certainly a day.`,`I have lessons on Saturday already.`,`I see what you mean, but I’m not sure students would agree.`],a:3,e:[`Polite disagreement in English usually begins by acknowledging the other person’s point, then adds the objection with "but".`,`การไม่เห็นด้วยอย่างสุภาพในภาษาอังกฤษมักเริ่มด้วยการรับฟังความเห็นของอีกฝ่าย แล้วจึงเสนอข้อโต้แย้งด้วยคำว่า "but"`],w:{0:[`This is blunt and sounds rude in a friendly discussion.`,`ประโยคนี้ห้วนและฟังดูไม่สุภาพในการสนทนาแบบเป็นมิตร`],1:[`This states something obvious and gives no opinion.`,`ประโยคนี้บอกสิ่งที่รู้อยู่แล้วและไม่ได้แสดงความคิดเห็น`],2:[`This talks about View’s own timetable instead of the idea.`,`ประโยคนี้พูดถึงตารางเรียนของวิวเอง ไม่ได้ตอบเรื่องแนวคิดที่เสนอ`]}},{id:`T08-Q17`,s:`conversation`,k:`conversation`,intro:`Receptionist: ____
Guest: For three nights, please.`,q:`Choose the best line for the receptionist.`,c:[`How long would you like to stay?`,`How many people are there in your family?`,`What is your room number, please?`,`Would you like breakfast in your room?`],a:0,e:[`"For three nights" answers a question about a length of time, which is exactly what "How long would you like to stay?" asks.`,`คำตอบ "For three nights" ตอบคำถามเกี่ยวกับระยะเวลา ซึ่งตรงกับคำถาม "How long would you like to stay?"`],w:{1:[`A question about people would be answered with a number of people.`,`คำถามเรื่องจำนวนคนต้องตอบด้วยจำนวนคน`],2:[`A guest checking in does not have a room number yet.`,`แขกที่กำลังเช็กอินยังไม่มีหมายเลขห้อง`],3:[`This is a yes/no question and would not be answered with "For three nights".`,`ประโยคนี้เป็นคำถาม yes/no จึงไม่ได้ตอบด้วย "For three nights"`]}},{id:`T08-Q18`,s:`conversation`,k:`conversation`,intro:`Nice: Do you mind if I open the window?
Mew: ____`,q:`Choose the best reply for Mew, who is happy for the window to be opened.`,c:[`Yes, I mind. Please open it.`,`Not at all. Go ahead.`,`Yes, please open the door instead.`,`No, you must not open anything.`],a:1,e:[`"Do you mind…?" literally asks whether something troubles you, so agreeing means saying "no". "Not at all. Go ahead." is the natural way to give permission.`,`คำถาม "Do you mind…?" ถามว่ารบกวนหรือไม่ การตอบตกลงจึงต้องตอบว่า "ไม่" ประโยค "Not at all. Go ahead." เป็นการอนุญาตที่เป็นธรรมชาติ`],w:{0:[`"Yes, I mind" refuses, so it contradicts "Please open it".`,`"Yes, I mind" เป็นการปฏิเสธ จึงขัดแย้งกับ "Please open it"`],2:[`This changes the request to a door and does not answer the question.`,`ประโยคนี้เปลี่ยนเรื่องไปที่ประตูและไม่ได้ตอบคำถาม`],3:[`This refuses permission, which is not what Mew wants to say.`,`ประโยคนี้เป็นการไม่อนุญาต ซึ่งไม่ใช่สิ่งที่มิวต้องการจะพูด`]}},{id:`T08-Q19`,s:`reading`,k:`reading-main-idea`,p:`T08-P1`,q:`Why did Miss Nutcha write this email?`,c:[`To ask families to host a visiting student`,`To invite parents to travel to Japan in August`,`To explain a change to the school timetable`,`To apologise for cancelling a school trip`],a:0,e:[`The central request is in the third paragraph: "We are looking for 30 families who can host one student each," and the rest of the email explains how to volunteer.`,`คำขอหลักอยู่ในย่อหน้าที่สามว่า "We are looking for 30 families who can host one student each" และเนื้อหาที่เหลืออธิบายวิธีสมัคร`],w:{1:[`The Japanese students travel to Thailand; no Thai parents are travelling.`,`นักเรียนญี่ปุ่นเป็นฝ่ายเดินทางมาไทย ไม่ได้มีผู้ปกครองไทยเดินทางไป`],2:[`No change to the timetable is mentioned in the email.`,`อีเมลไม่ได้กล่าวถึงการเปลี่ยนตารางเรียน`],3:[`Nothing has been cancelled; a visit is being organised.`,`ไม่มีอะไรถูกยกเลิก แต่กำลังจัดการต้อนรับการมาเยือน`]}},{id:`T08-Q20`,s:`reading`,k:`reading-detail`,p:`T08-P1`,q:`What must a host family provide?`,c:[`Lunch every day and a school uniform`,`Travel insurance for the visiting student`,`Breakfast, dinner, a bed and a quiet place to study`,`Japanese lessons for the whole family`],a:2,e:[`The email lists exactly this: "Host families provide breakfast and dinner, a bed and a quiet place to study."`,`อีเมลระบุไว้ตรงตัวว่า "Host families provide breakfast and dinner, a bed and a quiet place to study."`],w:{0:[`Lunch is served at school, so families do not provide it.`,`อาหารกลางวันจัดที่โรงเรียน ครอบครัวจึงไม่ต้องเตรียม`],1:[`The Japanese school books the travel insurance.`,`โรงเรียนญี่ปุ่นเป็นผู้จัดทำประกันการเดินทาง`],3:[`The visitors are here to practise English; no Japanese lessons are mentioned.`,`ผู้มาเยือนมาเพื่อฝึกภาษาอังกฤษ และไม่มีการกล่าวถึงการสอนภาษาญี่ปุ่น`]}},{id:`T08-Q21`,s:`reading`,k:`reading-detail`,p:`T08-P1`,q:`When will the meeting for host families take place?`,c:[`On Friday 18 July`,`On Tuesday 22 July`,`From 12 to 19 August`,`On Monday 12 August`],a:1,e:[`The fourth paragraph says the meeting is "in the library on Tuesday 22 July at 6 p.m."`,`ย่อหน้าที่สี่ระบุว่าการประชุมจัด "in the library on Tuesday 22 July at 6 p.m." คือวันอังคารที่ 22 กรกฎาคม`],w:{0:[`18 July is the deadline for returning the form, not the meeting.`,`วันที่ 18 กรกฎาคมคือกำหนดส่งแบบฟอร์ม ไม่ใช่วันประชุม`],2:[`12–19 August is the week of the visit itself.`,`วันที่ 12–19 สิงหาคมคือสัปดาห์ที่คณะมาเยือน`],3:[`12 August is the first day of the visit.`,`วันที่ 12 สิงหาคมคือวันแรกของการมาเยือน`]}},{id:`T08-Q22`,s:`reading`,k:`reading-inference`,p:`T08-P1`,q:`Why can the school not accept forms after 18 July?`,c:[`The school office closes for the holidays after that date.`,`Only the first 30 families are allowed to apply.`,`The host families’ meeting will already have taken place.`,`The Japanese school must arrange insurance well in advance.`],a:3,e:[`The last line gives the reason directly: "because the Japanese school must book travel insurance for each student well in advance."`,`บรรทัดสุดท้ายให้เหตุผลไว้โดยตรงว่า "because the Japanese school must book travel insurance for each student well in advance"`],w:{0:[`No holiday closure is mentioned in the email.`,`อีเมลไม่ได้กล่าวถึงการปิดทำการช่วงวันหยุด`],1:[`Thirty families are needed, but that is not the reason for the date.`,`ต้องการครอบครัว 30 ครอบครัว แต่นั่นไม่ใช่เหตุผลของกำหนดวันที่`],2:[`The meeting is on 22 July, which is after the deadline, so it cannot be the reason.`,`การประชุมจัดวันที่ 22 กรกฎาคม ซึ่งอยู่หลังกำหนดส่ง จึงไม่ใช่เหตุผล`]}},{id:`T08-Q23`,s:`reading`,k:`reading-detail`,p:`T08-P2`,q:`In which place have people traditionally greeted visitors by sticking out the tongue?`,c:[`Japan`,`Tibet`,`Italy`,`Thailand`],a:1,e:[`The second paragraph says, "in Tibet people have traditionally greeted visitors by sticking out the tongue."`,`ย่อหน้าที่สองระบุว่า "in Tibet people have traditionally greeted visitors by sticking out the tongue" คือที่ทิเบต`],w:{0:[`In Japan people bow.`,`ที่ญี่ปุ่นผู้คนโค้งคำนับ`],2:[`In parts of Italy friends kiss each other on both cheeks.`,`ในบางพื้นที่ของอิตาลี เพื่อนจะทักทายด้วยการหอมแก้มทั้งสองข้าง`],3:[`In Thailand people press their palms together in a wai.`,`ที่ประเทศไทยผู้คนพนมมือไหว้`]}},{id:`T08-Q24`,s:`reading`,k:`reading-inference`,p:`T08-P2`,q:`According to the passage, why might stepping back look unfriendly?`,c:[`Because it is rude to move at all while talking`,`Because it shows that you are in a hurry to leave`,`Because you might step on somebody’s foot`,`Because in some countries people expect to stand close`],a:3,e:[`The third paragraph says that in South America and the Middle East people stand much closer, so moving away breaks the expected distance.`,`ย่อหน้าที่สามระบุว่าในอเมริกาใต้และตะวันออกกลางผู้คนยืนใกล้กันมากกว่า การถอยห่างจึงผิดจากระยะที่คาดหวังไว้`],w:{0:[`The passage never says that moving while talking is rude.`,`บทอ่านไม่ได้บอกว่าการขยับตัวขณะพูดคุยเป็นเรื่องเสียมารยาท`],1:[`Being in a hurry is not mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงความรีบร้อน`],2:[`Stepping on feet is not discussed anywhere in the text.`,`ข้อความไม่ได้กล่าวถึงการเหยียบเท้าผู้อื่นเลย`]}},{id:`T08-Q25`,s:`reading`,k:`reading-main-idea`,p:`T08-P2`,q:`What advice does the writer give to travellers?`,c:[`Watch other people for a moment before greeting them.`,`Always shake hands, wherever in the world you are.`,`Avoid greeting strangers when you are in another country.`,`Learn how to bow properly before you travel abroad.`],a:0,e:[`The final sentence says travellers "who watch carefully for a moment before they greet somebody usually manage very well".`,`ประโยคสุดท้ายระบุว่านักเดินทาง "who watch carefully for a moment before they greet somebody usually manage very well"`],w:{1:[`The passage says handshakes are only one custom among many.`,`บทอ่านระบุว่าการจับมือเป็นเพียงหนึ่งในธรรมเนียมหลาย ๆ แบบ`],2:[`The writer encourages greeting people, not avoiding them.`,`ผู้เขียนสนับสนุนให้ทักทายผู้คน ไม่ได้ให้หลีกเลี่ยง`],3:[`Bowing is given as one example, not as advice for every country.`,`การโค้งคำนับถูกยกเป็นตัวอย่างหนึ่ง ไม่ใช่คำแนะนำสำหรับทุกประเทศ`]}}]},{id:`test-09`,number:9,title:`Practice Test 9`,subtitle:`Challenge — Full Entrance Paper I`,tier:`challenge`,minutes:45,passages:[{id:`T09-P1`,kind:`Informational passage`,title:`The Library That Comes to You`,body:[`In many parts of the world, children who love reading live far from any library. Getting books to them has produced some remarkable solutions.`,`In Colombia, a teacher named Luis began carrying books into the hills on the backs of two donkeys. His travelling library now visits villages that no road reaches. In Norway, a boat carries several thousand books along the coast, stopping at small islands where fewer than a hundred people live. In parts of Kenya, camels do the same work across dry land, where a truck would simply sink into the sand.`,`These libraries share two features. The first is that they go to the reader instead of waiting for the reader to come to them. The second is that the person who brings the books usually stays for an hour or two, reads aloud to the youngest children and talks about the stories.`,`Librarians who run these services say the second feature matters more than the first. A book left in a village may never be opened. A book that arrives with somebody who loves it rarely stays closed for long.`]},{id:`T09-P2`,kind:`Advertisement`,title:`Bright Futures English Camp — October Holidays`,body:[`Four days of games, drama and speaking practice for students in Grades 4 to 6. All activities are led by teachers from our school together with two guest teachers from Singapore.`,`Places are limited to 20 students per group. Fees include lunch, snacks and all materials.`],table:{caption:`Camp groups`,headers:[`Group`,`Grades`,`Dates`,`Time`,`Fee`],rows:[[`Explorers`,`4 – 5`,`7 – 10 October`,`9:00 – 12:00`,`1,600 baht`],[`Navigators`,`5 – 6`,`7 – 10 October`,`13:00 – 16:00`,`1,600 baht`],[`Leaders`,`6 only`,`14 – 17 October`,`9:00 – 15:00`,`2,900 baht`]]},footer:[`Register at the school office before 30 September.`,`Brothers and sisters registering together receive a 10% discount on the total fee.`]}],questions:[{id:`T09-Q01`,s:`grammar`,k:`tenses`,q:`By next March, Ploy ____ at this school for six years.`,c:[`is studying`,`studies`,`has studied`,`will have studied`],a:3,e:[`"By next March" sets a point in the future, and the six years will be complete at that point. This needs the future perfect: will have studied.`,`วลี "by next March" กำหนดจุดเวลาในอนาคต และช่วงหกปีจะครบพอดี ณ เวลานั้น จึงต้องใช้ future perfect คือ will have studied`],w:{0:[`"Is studying" describes now, not a completed period ending in the future.`,`"is studying" บรรยายสิ่งที่เกิดขึ้นตอนนี้ ไม่ใช่ช่วงเวลาที่จะครบในอนาคต`],1:[`"Studies" is present simple and cannot express a period finishing next March.`,`"studies" เป็น present simple จึงบอกช่วงเวลาที่จะสิ้นสุดในเดือนมีนาคมหน้าไม่ได้`],2:[`"Has studied" measures up to now, but the sentence measures up to a future date.`,`"has studied" นับถึงปัจจุบัน แต่ประโยคนี้นับถึงวันในอนาคต`]}},{id:`T09-Q02`,s:`grammar`,k:`relative-clauses`,q:`The book ____ I borrowed from the library was missing three pages.`,c:[`that`,`who`,`whose`,`where`],a:0,e:[`The relative pronoun stands for "the book", a thing acting as the object of "borrowed". "That" (or "which") is used for things.`,`คำสรรพนามเชื่อมความนี้แทน "the book" ซึ่งเป็นสิ่งของและทำหน้าที่เป็นกรรมของ "borrowed" จึงใช้ "that" (หรือ "which") ซึ่งใช้กับสิ่งของ`],w:{1:[`"Who" refers to people, and a book is not a person.`,`"who" ใช้กับบุคคล แต่หนังสือไม่ใช่คน`],2:[`"Whose" shows possession and must be followed by a noun.`,`"whose" แสดงความเป็นเจ้าของและต้องมีคำนามตามหลัง`],3:[`"Where" refers to a place, but the clause is about what was borrowed.`,`"where" ใช้แทนสถานที่ แต่อนุประโยคนี้พูดถึงสิ่งที่ยืมมา`]}},{id:`T09-Q03`,s:`grammar`,k:`passive`,q:`The winning poster ____ by a student in Grade 5.`,c:[`designed`,`was designed`,`has designing`,`were designed`],a:1,e:[`The word "by" shows who performed the action, which marks a passive sentence. The subject "poster" is singular and past, so "was designed" is correct.`,`คำว่า "by" บอกว่าใครเป็นผู้กระทำ ซึ่งเป็นสัญญาณของประโยค passive และประธาน "poster" เป็นเอกพจน์ในอดีต จึงใช้ "was designed"`],w:{0:[`"Designed" alone would make the poster the designer.`,`"designed" ลำพังจะทำให้โปสเตอร์กลายเป็นผู้ออกแบบ`],2:[`"Has designing" is not a possible verb form in English.`,`รูป "has designing" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Were" is plural, but "the winning poster" is one poster.`,`"were" เป็นพหูพจน์ แต่ "the winning poster" มีเพียงชิ้นเดียว`]}},{id:`T09-Q04`,s:`grammar`,k:`conditionals`,q:`If we ____ half an hour earlier, we would not have missed the opening ceremony.`,c:[`leave`,`would leave`,`had left`,`have left`],a:2,e:[`The main clause uses "would not have missed", which marks a third conditional about a past that cannot be changed. The "if" clause then takes the past perfect: had left.`,`ประโยคหลักใช้ "would not have missed" ซึ่งบ่งบอกประโยคเงื่อนไขแบบที่ 3 คือการสมมติอดีตที่แก้ไขไม่ได้ อนุประโยค if จึงใช้ past perfect คือ had left`],w:{0:[`"Leave" is present simple and belongs in a first conditional with "will".`,`"leave" เป็น present simple ซึ่งใช้กับเงื่อนไขแบบที่ 1 คู่กับ "will"`],1:[`"Would" is never used inside the "if" clause of a conditional like this.`,`ไม่ใช้ "would" ในอนุประโยค if ของประโยคเงื่อนไขแบบนี้`],3:[`"Have left" is present perfect and does not match a past that has already been decided.`,`"have left" เป็น present perfect ซึ่งไม่เข้ากับอดีตที่จบไปแล้ว`]}},{id:`T09-Q05`,s:`grammar`,k:`reported-speech`,intro:`Direct speech: "Don’t touch the wires," the engineer warned us.`,q:`The engineer warned us ____ the wires.`,c:[`not to touch`,`to not touching`,`don’t touch`,`not touching`],a:0,e:[`A reported negative command uses "not + to + base verb": told us not to touch, warned us not to go.`,`คำสั่งปฏิเสธที่ถูกเล่าต่อใช้โครงสร้าง "not + to + กริยาพื้นฐาน" เช่น told us not to touch, warned us not to go`],w:{1:[`"To not touching" mixes two forms and is not correct English.`,`"to not touching" ผสมสองรูปเข้าด้วยกันและไม่ถูกหลักภาษา`],2:[`"Don’t touch" is the original direct command; reported speech drops "don’t".`,`"don’t touch" คือคำสั่งตรงรูปเดิม การเล่าคำพูดต้องตัด "don’t" ออก`],3:[`"Not touching" has no "to" and cannot follow "warned us".`,`"not touching" ไม่มี "to" จึงตามหลัง "warned us" ไม่ได้`]}},{id:`T09-Q06`,s:`grammar`,k:`quantifiers`,q:`There is hardly ____ sugar left in the jar, so we cannot make the cake today.`,c:[`some`,`a few`,`many`,`any`],a:3,e:[`"Hardly" carries a negative meaning ("almost not"), and negative sentences take "any". "Sugar" is uncountable, which also rules out the countable quantifiers.`,`คำว่า "hardly" มีความหมายเชิงปฏิเสธ (แทบจะไม่) และประโยคเชิงปฏิเสธใช้ "any" อีกทั้ง "sugar" เป็นคำนามนับไม่ได้ จึงตัดคำบอกปริมาณที่ใช้กับคำนามนับได้ออก`],w:{0:[`"Some" is used in positive sentences, but "hardly" makes this sentence negative.`,`"some" ใช้ในประโยคบอกเล่า แต่คำว่า "hardly" ทำให้ประโยคนี้เป็นเชิงปฏิเสธ`],1:[`"A few" is only used with countable plural nouns.`,`"a few" ใช้กับคำนามพหูพจน์ที่นับได้เท่านั้น`],2:[`"Many" is also for countable nouns, and sugar is uncountable.`,`"many" ใช้กับคำนามนับได้เช่นกัน แต่น้ำตาลเป็นคำนามนับไม่ได้`]}},{id:`T09-Q07`,s:`grammar`,k:`verb-patterns`,q:`I would rather ____ at home this evening than go out in the rain.`,c:[`staying`,`to stay`,`stay`,`stayed`],a:2,e:[`"Would rather" is always followed by the bare base form of the verb, with no "to": would rather stay, would rather wait.`,`โครงสร้าง "would rather" ต้องตามด้วยกริยารูปพื้นฐานโดยไม่มี "to" เสมอ เช่น would rather stay, would rather wait`],w:{0:[`The -ing form does not follow "would rather".`,`รูป -ing ไม่ตามหลัง "would rather"`],1:[`"To stay" follows "would like", not "would rather".`,`"to stay" ใช้ตาม "would like" ไม่ใช่ "would rather"`],3:[`The past form is used only in "would rather you stayed", which has a different subject.`,`รูปอดีตใช้เฉพาะในโครงสร้าง "would rather you stayed" ซึ่งมีประธานคนละตัว`]}},{id:`T09-Q08`,s:`grammar`,k:`prepositions`,q:`The decision depends ____ how many students sign up before Friday.`,c:[`of`,`on`,`from`,`to`],a:1,e:[`The verb "depend" is always followed by "on": it depends on the weather, it depends on you.`,`กริยา "depend" ต้องตามด้วย "on" เสมอ เช่น it depends on the weather, it depends on you`],w:{0:[`"Depend of" is a common mistake but is never used in English.`,`รูป "depend of" เป็นข้อผิดพลาดที่พบบ่อย แต่ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Depend from" is not used; "from" shows origin, not dependence.`,`รูป "depend from" ไม่มีใช้ คำว่า "from" บอกที่มา ไม่ได้บอกการขึ้นอยู่กับ`],3:[`"Depend to" is not a possible combination.`,`รูป "depend to" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T09-Q09`,s:`grammar`,k:`modals`,q:`You ____ have told me earlier — I could easily have helped you.`,c:[`should`,`must`,`can`,`will`],a:0,e:[`"Should have + past participle" is used to criticise or regret something that did not happen in the past.`,`โครงสร้าง "should have + กริยาช่องที่ 3" ใช้ตำหนิหรือแสดงความเสียดายต่อสิ่งที่ไม่ได้เกิดขึ้นในอดีต`],w:{1:[`"Must have told" would be a guess that you did tell, which contradicts the sentence.`,`"must have told" จะเป็นการเดาว่าคุณได้บอกแล้ว ซึ่งขัดแย้งกับประโยค`],2:[`"Can have" is not used in positive statements about the past.`,`รูป "can have" ไม่ใช้ในประโยคบอกเล่าที่กล่าวถึงอดีต`],3:[`"Will have told" points to the future, not to a past regret.`,`"will have told" ชี้ไปยังอนาคต ไม่ใช่ความเสียดายในอดีต`]}},{id:`T09-Q10`,s:`vocabulary`,k:`vocab-context`,q:`Although the plan seemed simple at first, it turned out to be far more ____ than any of us had expected.`,c:[`obvious`,`similar`,`ordinary`,`complicated`],a:3,e:[`"Although … simple at first" sets up a contrast, so the missing word must be the opposite of simple. "Complicated" means having many difficult parts.`,`วลี "although … simple at first" สร้างความขัดแย้ง คำที่หายไปจึงต้องตรงข้ามกับ simple คำว่า "complicated" แปลว่าซับซ้อนมีหลายส่วนที่ยุ่งยาก`],w:{0:[`"Obvious" means easy to see, which is close to simple rather than opposite.`,`"obvious" แปลว่าเห็นได้ชัด ซึ่งใกล้เคียงกับ simple ไม่ใช่ตรงข้าม`],1:[`"Similar" needs something to be similar to and creates no contrast.`,`"similar" ต้องมีสิ่งที่นำมาเทียบ และไม่ได้สร้างความขัดแย้ง`],2:[`"Ordinary" means normal, which again does not contrast with simple.`,`"ordinary" แปลว่าธรรมดา ซึ่งก็ไม่ได้ขัดแย้งกับ simple`]}},{id:`T09-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The head teacher was reluctant to change the uniform rules, and it took two years to persuade her. "Reluctant" means ____.`,c:[`eager`,`ready`,`unwilling`,`able`],a:2,e:[`It took two years to persuade her, which shows she did not want to make the change. "Reluctant" means unwilling.`,`ต้องใช้เวลาถึงสองปีในการโน้มน้าว แสดงว่าเธอไม่อยากเปลี่ยนกฎ คำว่า "reluctant" จึงแปลว่าไม่เต็มใจ`],w:{0:[`"Eager" means very keen — the opposite of what the sentence describes.`,`"eager" แปลว่ากระตือรือร้นอย่างยิ่ง ซึ่งตรงข้ามกับที่ประโยคบรรยาย`],1:[`"Ready" means prepared, so no persuasion would have been needed.`,`"ready" แปลว่าพร้อม ซึ่งจะทำให้ไม่ต้องโน้มน้าวเลย`],3:[`"Able" is about ability, not about willingness.`,`"able" เกี่ยวกับความสามารถ ไม่ใช่ความเต็มใจ`]}},{id:`T09-Q12`,s:`vocabulary`,k:`collocations`,q:`The two schools have decided to ____ an agreement to share their sports field.`,c:[`make`,`sign`,`do`,`put`],a:1,e:[`"Sign an agreement" is the standard collocation for two sides formally accepting a deal by writing their names on it.`,`"sign an agreement" เป็นคำคู่มาตรฐานที่ใช้เมื่อสองฝ่ายตกลงกันอย่างเป็นทางการโดยลงนามในเอกสาร`],w:{0:[`"Make an agreement" is possible in speech, but with a formal written document between schools "sign" is the expected verb.`,`"make an agreement" ใช้ในภาษาพูดได้ แต่กับเอกสารทางการระหว่างโรงเรียน กริยาที่ใช้คือ "sign"`],2:[`"Do an agreement" is not used in English.`,`รูป "do an agreement" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Put an agreement" is not a natural collocation.`,`รูป "put an agreement" ไม่เป็นคำคู่ที่ใช้จริง`]}},{id:`T09-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`We have ____ of paper for the printer. Could you buy some more on your way in?`,c:[`run out`,`run over`,`run into`,`run away`],a:0,e:[`"Run out of something" means to use all of it so that none is left, which is why more must be bought.`,`"run out of something" แปลว่าใช้จนหมดไม่เหลือเลย จึงต้องซื้อมาเพิ่ม`],w:{1:[`"Run over" means to hit something with a vehicle, or to go past a time limit.`,`"run over" แปลว่าขับรถชนทับ หรือใช้เวลาเกินกำหนด`],2:[`"Run into" means to meet someone unexpectedly.`,`"run into" แปลว่าบังเอิญพบใครโดยไม่ได้นัดหมาย`],3:[`"Run away" means to escape from a place.`,`"run away" แปลว่าหนีออกไปจากที่ใดที่หนึ่ง`]}},{id:`T09-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The judges praised the young pianist for her ____ performance — easily the finest of the evening.`,c:[`average`,`doubtful`,`outstanding`,`usual`],a:2,e:[`"Easily the finest of the evening" tells us the performance was much better than the rest. "Outstanding" means extremely good.`,`วลี "easily the finest of the evening" บอกว่าการแสดงนี้ดีกว่าที่เหลืออย่างชัดเจน คำว่า "outstanding" แปลว่ายอดเยี่ยมโดดเด่น`],w:{0:[`"Average" means ordinary, which contradicts "the finest of the evening".`,`"average" แปลว่าปานกลาง ซึ่งขัดแย้งกับ "the finest of the evening"`],1:[`"Doubtful" means uncertain and would not be praised by judges.`,`"doubtful" แปลว่าน่าสงสัยหรือไม่แน่ใจ ซึ่งกรรมการคงไม่ชื่นชม`],3:[`"Usual" means normal, and a normal performance would not be the finest.`,`"usual" แปลว่าธรรมดาทั่วไป การแสดงธรรมดาย่อมไม่ใช่การแสดงที่ดีที่สุด`]}},{id:`T09-Q15`,s:`conversation`,k:`conversation`,intro:`Student: Excuse me, Miss Orn. ____
Teacher: Of course. Come to my room at lunchtime.`,q:`Choose the best line for the student.`,c:[`Would it be possible to discuss my project with you?`,`I want to talk about my project right now.`,`You must help me with my project today.`,`Do you have a room at lunchtime, Miss?`],a:0,e:[`The teacher agrees and offers a time, so the student must have made a polite request. "Would it be possible to…?" is a formal, respectful way to ask.`,`ครูตอบตกลงและเสนอเวลาให้ แสดงว่านักเรียนได้ขอร้องอย่างสุภาพ วลี "Would it be possible to…?" เป็นการขออย่างเป็นทางการและให้ความเคารพ`],w:{1:[`Demanding to talk "right now" ignores the teacher’s time.`,`การเรียกร้องให้คุยทันทีเป็นการไม่เกรงใจเวลาของครู`],2:[`"You must help me" gives an order to a teacher, which is impolite.`,`"You must help me" เป็นการออกคำสั่งกับครู ซึ่งไม่สุภาพ`],3:[`This asks about a room rather than requesting a meeting.`,`ประโยคนี้ถามเรื่องห้อง ไม่ได้ขอนัดพบ`]}},{id:`T09-Q16`,s:`conversation`,k:`conversation`,intro:`Nan: I’m afraid my grandfather is in hospital.
Boat: ____`,q:`Choose the best reply for Boat.`,c:[`That is very good to hear.`,`Never mind about it at all.`,`Congratulations to him, then.`,`Oh, I’m so sorry. I hope he gets better soon.`],a:3,e:[`This is bad news about someone’s family. The natural reply expresses sympathy and good wishes.`,`นี่คือข่าวร้ายเกี่ยวกับคนในครอบครัว คำตอบที่เป็นธรรมชาติคือการแสดงความเห็นใจและอวยพรให้หายไว ๆ`],w:{0:[`Calling bad news "good to hear" is the opposite of sympathy.`,`การบอกว่าข่าวร้ายเป็นเรื่องน่ายินดีคือสิ่งตรงข้ามกับการแสดงความเห็นใจ`],1:[`"Never mind" treats serious news as unimportant.`,`"Never mind" ทำให้ข่าวร้ายแรงกลายเป็นเรื่องไม่สำคัญ`],2:[`"Congratulations" is for happy events such as passing an exam.`,`"Congratulations" ใช้กับเรื่องน่ายินดี เช่น การสอบผ่าน`]}},{id:`T09-Q17`,s:`conversation`,k:`conversation`,intro:`Customer: I bought these headphones yesterday, but the left one doesn’t work.
Assistant: ____`,q:`Choose the best reply for the assistant.`,c:[`That is really not our problem, sorry.`,`I’m sorry about that. Would you like a refund or a replacement?`,`You should have tested them here in the shop.`,`We only sell headphones on Mondays.`],a:1,e:[`A shop assistant handling a complaint apologises first and then offers the customer a choice of solutions.`,`พนักงานร้านที่รับเรื่องร้องเรียนจะกล่าวขอโทษก่อน แล้วจึงเสนอทางเลือกในการแก้ปัญหาให้ลูกค้า`],w:{0:[`Refusing responsibility for goods sold yesterday is poor service and unhelpful.`,`การปัดความรับผิดชอบต่อสินค้าที่เพิ่งขายไปเมื่อวานเป็นการบริการที่ไม่ดีและไม่ช่วยแก้ปัญหา`],2:[`Blaming the customer does not solve the problem.`,`การโทษลูกค้าไม่ได้ช่วยแก้ปัญหา`],3:[`This is irrelevant — the customer already bought the headphones.`,`ประโยคนี้ไม่เกี่ยวข้อง เพราะลูกค้าซื้อหูฟังไปแล้ว`]}},{id:`T09-Q18`,s:`conversation`,k:`conversation`,intro:`Visitor: Is the museum far from here?
Local: ____`,q:`Choose the best reply for the local.`,c:[`Yes, it is certainly a museum.`,`No, I have never actually been there.`,`It’s about ten minutes on foot — second turning on the right.`,`You really should visit the museum one day.`],a:2,e:[`"Is it far?" asks about distance. A helpful reply gives the distance or walking time and adds simple directions.`,`คำถาม "Is it far?" ถามถึงระยะทาง คำตอบที่เป็นประโยชน์คือบอกระยะทางหรือเวลาเดิน พร้อมบอกทางสั้น ๆ`],w:{0:[`This confirms what the museum is, not how far away it is.`,`ประโยคนี้ยืนยันว่าที่นั่นคือพิพิธภัณฑ์ ไม่ได้บอกว่าไกลแค่ไหน`],1:[`This is about the speaker’s own experience and gives no distance.`,`ประโยคนี้พูดถึงประสบการณ์ของผู้พูดเอง และไม่ได้บอกระยะทาง`],3:[`The visitor is already going; advice about visiting is not an answer.`,`ผู้มาเยือนกำลังจะไปอยู่แล้ว คำแนะนำให้ไปเที่ยวจึงไม่ใช่คำตอบ`]}},{id:`T09-Q19`,s:`reading`,k:`reading-main-idea`,p:`T09-P1`,q:`What is the main topic of the whole passage?`,c:[`Why children in remote villages do not enjoy reading`,`Different ways of bringing books to readers far from libraries`,`How donkeys and camels are trained to carry heavy loads`,`Why libraries in cities are better than travelling ones`],a:1,e:[`The passage opens with the problem of children living far from libraries, then gives three examples of travelling libraries and explains what makes them work.`,`บทอ่านเริ่มด้วยปัญหาที่เด็กอยู่ไกลจากห้องสมุด แล้วยกตัวอย่างห้องสมุดเคลื่อนที่สามแห่ง และอธิบายว่าอะไรทำให้ได้ผล`],w:{0:[`The first line says these are children "who love reading".`,`บรรทัดแรกระบุว่าเด็กเหล่านี้คือเด็ก "who love reading" คือรักการอ่าน`],2:[`The animals are examples of transport, not the subject of the passage.`,`สัตว์เหล่านี้เป็นเพียงตัวอย่างของการขนส่ง ไม่ใช่หัวข้อของบทอ่าน`],3:[`City libraries are never compared with travelling ones.`,`บทอ่านไม่ได้เปรียบเทียบห้องสมุดในเมืองกับห้องสมุดเคลื่อนที่เลย`]}},{id:`T09-Q20`,s:`reading`,k:`reading-detail`,p:`T09-P1`,q:`In Norway, how are the books carried?`,c:[`By boat`,`By donkey`,`By camel`,`By truck`],a:0,e:[`The second paragraph says, "In Norway, a boat carries several thousand books along the coast."`,`ย่อหน้าที่สองระบุว่า "In Norway, a boat carries several thousand books along the coast" คือขนส่งทางเรือ`],w:{1:[`Donkeys are used in Colombia.`,`ลาถูกใช้ในประเทศโคลอมเบีย`],2:[`Camels are used in parts of Kenya.`,`อูฐถูกใช้ในบางพื้นที่ของประเทศเคนยา`],3:[`A truck is mentioned only to say it would sink into the sand.`,`รถบรรทุกถูกกล่าวถึงเพียงเพื่อบอกว่าจะจมลงในทราย`]}},{id:`T09-Q21`,s:`reading`,k:`reading-detail`,p:`T09-P1`,q:`Why is a truck not used to carry books in parts of Kenya?`,c:[`Trucks are too expensive for the librarians to buy.`,`There are no drivers available in those areas.`,`Camels can carry many more books than a truck.`,`A truck would sink into the sand.`],a:3,e:[`The passage says camels do the work "across dry land, where a truck would simply sink into the sand".`,`บทอ่านระบุว่าอูฐทำหน้าที่นี้ "across dry land, where a truck would simply sink into the sand" คือรถบรรทุกจะจมทราย`],w:{0:[`Cost is never mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงค่าใช้จ่ายเลย`],1:[`Drivers are not mentioned anywhere in the text.`,`ข้อความไม่ได้กล่าวถึงคนขับรถ`],2:[`The passage does not compare how much each can carry.`,`บทอ่านไม่ได้เปรียบเทียบว่าพาหนะใดบรรทุกได้มากกว่ากัน`]}},{id:`T09-Q22`,s:`reading`,k:`reading-inference`,p:`T09-P1`,q:`According to the librarians, what matters most?`,c:[`Carrying as many books as possible on each trip`,`Visiting as many different villages as possible`,`The person who brings the books and shares them`,`Choosing the right animal for each country`],a:2,e:[`The librarians say "the second feature matters more than the first", and the second feature is the person who stays, reads aloud and talks about the stories.`,`บรรณารักษ์บอกว่า "the second feature matters more than the first" และลักษณะที่สองคือผู้ที่นำหนังสือมา อยู่ร่วม อ่านออกเสียง และพูดคุยเรื่องหนังสือ`],w:{0:[`The number of books is never given as the important factor.`,`จำนวนหนังสือไม่ได้ถูกระบุว่าเป็นปัจจัยสำคัญ`],1:[`Reaching villages is the first feature, which they say matters less.`,`การไปถึงหมู่บ้านคือลักษณะแรก ซึ่งพวกเขาบอกว่าสำคัญน้อยกว่า`],3:[`The animals differ by country, but the passage never calls that the key point.`,`สัตว์ที่ใช้ต่างกันไปตามประเทศ แต่บทอ่านไม่ได้บอกว่านั่นคือประเด็นสำคัญ`]}},{id:`T09-Q23`,s:`reading`,k:`reading-detail`,p:`T09-P2`,q:`Which group meets in the afternoon?`,c:[`Explorers`,`Leaders`,`All three groups`,`Navigators`],a:3,e:[`The table shows Navigators running from 13:00 to 16:00, which is the afternoon.`,`ตารางระบุว่ากลุ่ม Navigators เรียนเวลา 13:00–16:00 น. ซึ่งเป็นช่วงบ่าย`],w:{0:[`Explorers run from 9:00 to 12:00, in the morning.`,`กลุ่ม Explorers เรียนเวลา 9:00–12:00 น. ซึ่งเป็นช่วงเช้า`],1:[`Leaders run from 9:00 to 15:00, so they start in the morning and cover the whole day.`,`กลุ่ม Leaders เรียนเวลา 9:00–15:00 น. จึงเริ่มตอนเช้าและกินเวลาทั้งวัน`],2:[`Only one group meets purely in the afternoon.`,`มีเพียงกลุ่มเดียวที่เรียนเฉพาะช่วงบ่าย`]}},{id:`T09-Q24`,s:`reading`,k:`reading-inference`,p:`T09-P2`,q:`A Grade 6 student wants a camp that lasts the whole day. Which group should she choose?`,c:[`Explorers`,`Navigators`,`Leaders`,`Any of the three groups`],a:2,e:[`Leaders is the only group open to Grade 6 alone and the only one that runs from 9:00 to 15:00, a full day.`,`กลุ่ม Leaders เป็นกลุ่มเดียวที่เปิดรับเฉพาะ ป.6 และเป็นกลุ่มเดียวที่เรียนตั้งแต่ 9:00–15:00 น. ซึ่งเป็นเต็มวัน`],w:{0:[`Explorers is for Grades 4–5 and runs only in the morning.`,`กลุ่ม Explorers สำหรับ ป.4–5 และเรียนเฉพาะช่วงเช้า`],1:[`Navigators accepts Grade 6 but runs only in the afternoon.`,`กลุ่ม Navigators รับ ป.6 ได้ แต่เรียนเฉพาะช่วงบ่าย`],3:[`Two of the groups are half-day, so not any group will do.`,`สองกลุ่มเรียนเพียงครึ่งวัน จึงไม่ใช่ทุกกลุ่มที่ตอบโจทย์`]}},{id:`T09-Q25`,s:`reading`,k:`reading-inference`,p:`T09-P2`,q:`Two sisters in Grade 5 register together for the Explorers group. How much will they pay in total?`,c:[`3,200 baht`,`2,880 baht`,`1,440 baht`,`3,520 baht`],a:1,e:[`Two places cost 1,600 × 2 = 3,200 baht. Sisters registering together get 10% off the total, and 10% of 3,200 is 320, so they pay 3,200 − 320 = 2,880 baht.`,`ค่าสมัครสองที่นั่งคือ 1,600 × 2 = 3,200 บาท พี่น้องที่สมัครพร้อมกันได้ส่วนลด 10% ของยอดรวม ซึ่งเท่ากับ 320 บาท จึงจ่าย 3,200 − 320 = 2,880 บาท`],w:{0:[`3,200 baht is the price before the sisters’ discount is taken off.`,`3,200 บาท คือราคาก่อนหักส่วนลดสำหรับพี่น้อง`],2:[`1,440 baht is the discounted price for one student only.`,`1,440 บาท คือราคาหลังหักส่วนลดของนักเรียนเพียงคนเดียว`],3:[`3,520 baht adds 10% instead of taking it off.`,`3,520 บาท เกิดจากการบวก 10% แทนที่จะหักออก`]}}]},{id:`test-10`,number:10,title:`Practice Test 10`,subtitle:`Challenge — Full Entrance Paper II`,tier:`challenge`,minutes:45,passages:[{id:`T10-P1`,kind:`Short story`,title:`The Second Envelope`,body:[`When Ms. Wanida retired after thirty-one years at Ban Nong Kae School, her students gave her two envelopes. She was told to open the first one that evening, and the second one only when she felt she had made a mistake.`,`The first envelope held a photograph of the whole school standing in the shape of a heart on the football field. Ms. Wanida kept it on her kitchen wall.`,`For almost a year she did not touch the second envelope. Then, one wet Tuesday, she agreed to teach a single class at the school again — and found that she could not remember a single name. She came home certain that she had been foolish to return.`,`That night she opened the second envelope. Inside was a sheet of paper with one line written on it: "You taught us that a mistake is only a lesson we have not finished yet."`,`The next Tuesday she went back to the school, and this time she took a name list with her.`]},{id:`T10-P2`,kind:`Notice`,title:`School Council Election — Notice to All Students`,body:[`Voting for next year’s School Council will take place on Friday 28 November in the assembly hall.`,`Any student in Grades 4 to 6 may stand as a candidate. To do so, collect a nomination form from the council box outside Room 3, ask two students in your year to sign it, and return it to Mr. Kiat by Monday 17 November.`,`Candidates will give a two-minute speech at the assembly on Wednesday 26 November. Speeches that run longer than two minutes will be stopped.`,`Every student from Grade 1 to Grade 6 may vote, including the candidates themselves. Bring your student card to the hall — you will not be given a ballot paper without it.`,`The results will be read out at the end of the school day on 28 November and put on the noticeboard the following Monday.`]}],questions:[{id:`T10-Q01`,s:`grammar`,k:`tenses`,q:`We ____ that film last night, and it was even better than people said.`,c:[`have seen`,`had seen`,`saw`,`were seeing`],a:2,e:[`"Last night" is a finished time in the past, so the past simple is required. The past simple of "see" is "saw".`,`"last night" เป็นเวลาที่จบไปแล้วในอดีต จึงต้องใช้ past simple และรูปอดีตของ "see" คือ "saw"`],w:{0:[`The present perfect is never used with a finished time expression such as "last night".`,`ไม่ใช้ present perfect กับคำบอกเวลาที่จบแล้ว เช่น "last night"`],1:[`"Had seen" needs a second, later past event to come before.`,`"had seen" ต้องมีเหตุการณ์ในอดีตอีกเหตุการณ์หนึ่งที่เกิดขึ้นภายหลัง`],3:[`"Were seeing" is continuous, but watching a whole film is a completed action.`,`"were seeing" เป็นรูป continuous แต่การดูภาพยนตร์จนจบเป็นการกระทำที่เสร็จสิ้นแล้ว`]}},{id:`T10-Q02`,s:`grammar`,k:`agreement`,q:`Mathematics ____ my sister’s favourite subject at school.`,c:[`are`,`is`,`were`,`have been`],a:1,e:[`Subject names ending in -ics, such as mathematics, physics and economics, look plural but take a singular verb.`,`ชื่อวิชาที่ลงท้ายด้วย -ics เช่น mathematics, physics, economics ดูเหมือนพหูพจน์แต่ใช้กับกริยาเอกพจน์`],w:{0:[`The -s ending is misleading; "mathematics" is one subject, not several things.`,`ตัวอักษร -s ท้ายคำทำให้เข้าใจผิด คำว่า "mathematics" คือวิชาเดียว ไม่ใช่หลายสิ่ง`],2:[`"Were" is both plural and past; the sentence describes the present.`,`"were" เป็นทั้งพหูพจน์และรูปอดีต แต่ประโยคนี้กล่าวถึงปัจจุบัน`],3:[`"Have been" is plural present perfect and does not fit this simple statement.`,`"have been" เป็น present perfect รูปพหูพจน์ จึงไม่เข้ากับการบอกข้อเท็จจริงธรรมดานี้`]}},{id:`T10-Q03`,s:`grammar`,k:`nouns`,q:`The teacher gave us some useful ____ about the entrance examination.`,c:[`advice`,`advices`,`an advice`,`many advice`],a:0,e:[`"Advice" is an uncountable noun in English. It has no plural form and is used with "some", not with "a" or a number.`,`"advice" เป็นคำนามนับไม่ได้ในภาษาอังกฤษ จึงไม่มีรูปพหูพจน์ และใช้กับ "some" ไม่ใช้กับ "a" หรือจำนวน`],w:{1:[`Uncountable nouns do not take -s, so "advices" is incorrect.`,`คำนามนับไม่ได้ไม่เติม -s คำว่า "advices" จึงไม่ถูกต้อง`],2:[`"An" cannot be used with an uncountable noun. We say "a piece of advice".`,`ใช้ "an" กับคำนามนับไม่ได้ไม่ได้ เราพูดว่า "a piece of advice"`],3:[`"Many" is used with countable plurals; "much advice" would be the correct form.`,`"many" ใช้กับคำนามพหูพจน์ที่นับได้ รูปที่ถูกต้องคือ "much advice"`]}},{id:`T10-Q04`,s:`grammar`,k:`prepositions`,q:`She apologised ____ arriving twenty minutes late to the rehearsal.`,c:[`of`,`to`,`with`,`for`],a:3,e:[`The pattern is "apologise for + the thing you did" and "apologise to + the person". Here the blank is followed by the action, so "for" is correct.`,`โครงสร้างคือ "apologise for + สิ่งที่ทำผิด" และ "apologise to + บุคคล" ในที่นี้ตามด้วยการกระทำ จึงต้องใช้ "for"`],w:{0:[`"Apologise of" is not used in English.`,`รูป "apologise of" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"Apologise to" is followed by a person, as in "apologise to the teacher".`,`"apologise to" ต้องตามด้วยบุคคล เช่น "apologise to the teacher"`],2:[`"Apologise with" is not a possible combination.`,`รูป "apologise with" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T10-Q05`,s:`grammar`,k:`comparisons`,q:`The more you practise speaking, ____ you become.`,c:[`the confident`,`the more confident`,`more confident`,`the most confident`],a:1,e:[`This is the double comparative pattern: "the more …, the more …". Both halves need "the" plus a comparative form.`,`นี่คือโครงสร้างขั้นกว่าคู่ "the more …, the more …" ซึ่งทั้งสองส่วนต้องมี "the" นำหน้ารูปขั้นกว่า`],w:{0:[`"The confident" has no comparative form, so the pattern is incomplete.`,`"the confident" ไม่ได้อยู่ในรูปขั้นกว่า โครงสร้างจึงไม่สมบูรณ์`],2:[`The second half of this pattern always needs "the" in front of the comparative.`,`ส่วนที่สองของโครงสร้างนี้ต้องมี "the" นำหน้ารูปขั้นกว่าเสมอ`],3:[`A superlative compares one with a whole group and does not fit this pattern.`,`ขั้นสุดใช้เปรียบเทียบสิ่งหนึ่งกับทั้งกลุ่ม จึงไม่เข้ากับโครงสร้างนี้`]}},{id:`T10-Q06`,s:`grammar`,k:`passive`,q:`The examination results ____ on the school website tomorrow morning.`,c:[`will announce`,`are announcing`,`will be announced`,`have announced`],a:2,e:[`Results cannot announce themselves; the school announces them. A future passive uses "will be + past participle".`,`ผลสอบประกาศตัวเองไม่ได้ ทางโรงเรียนเป็นผู้ประกาศ รูป passive ในอนาคตใช้ "will be + กริยาช่องที่ 3"`],w:{0:[`"Will announce" is active and makes the results the announcer.`,`"will announce" เป็นรูป active ซึ่งทำให้ผลสอบกลายเป็นผู้ประกาศ`],1:[`"Are announcing" is active continuous and also makes the results the doer.`,`"are announcing" เป็น active continuous ซึ่งทำให้ผลสอบเป็นผู้กระทำเช่นกัน`],3:[`"Have announced" is active present perfect and does not fit "tomorrow morning".`,`"have announced" เป็น present perfect รูป active และไม่เข้ากับ "tomorrow morning"`]}},{id:`T10-Q07`,s:`grammar`,k:`relative-clauses`,q:`My cousin, ____ has just moved to Phuket, sent me a postcard yesterday.`,c:[`who`,`which`,`whose`,`what`],a:0,e:[`The commas mark a non-defining relative clause giving extra information about a person, and the relative pronoun for people as subject is "who".`,`เครื่องหมายจุลภาคบ่งบอกว่าเป็นอนุประโยคขยายที่ให้ข้อมูลเพิ่มเติมเกี่ยวกับบุคคล และคำสรรพนามที่ใช้แทนบุคคลในฐานะประธานคือ "who"`],w:{1:[`"Which" refers to things or animals, not to a cousin.`,`"which" ใช้แทนสิ่งของหรือสัตว์ ไม่ใช้กับญาติซึ่งเป็นบุคคล`],2:[`"Whose" shows possession and must be followed directly by a noun.`,`"whose" แสดงความเป็นเจ้าของและต้องตามด้วยคำนามทันที`],3:[`"What" is not used as a relative pronoun after a noun.`,`"what" ไม่ใช้เป็นคำสรรพนามเชื่อมความหลังคำนาม`]}},{id:`T10-Q08`,s:`grammar`,k:`conditionals`,q:`Unless you ____ right now, you will miss the last bus home.`,c:[`will leave`,`left`,`would leave`,`leave`],a:3,e:[`"Unless" means "if … not", and like "if" it is followed by the present simple when the main clause uses "will".`,`"unless" มีความหมายว่า "ถ้าไม่" และเช่นเดียวกับ "if" จะตามด้วย present simple เมื่อประโยคหลักใช้ "will"`],w:{0:[`"Will" is not used after "unless" in this pattern.`,`ไม่ใช้ "will" หลัง "unless" ในโครงสร้างนี้`],1:[`"Left" is a past form, but the sentence is about right now and the near future.`,`"left" เป็นรูปอดีต แต่ประโยคนี้กล่าวถึงตอนนี้และอนาคตอันใกล้`],2:[`"Would leave" belongs in an imagined situation, not in a real warning.`,`"would leave" ใช้กับสถานการณ์สมมติ ไม่ใช่คำเตือนที่เป็นเรื่องจริง`]}},{id:`T10-Q09`,s:`grammar`,k:`verb-patterns`,q:`The librarian let us ____ the reference books in the reading room.`,c:[`to use`,`use`,`using`,`used`],a:1,e:[`After "let somebody", English uses the bare base form with no "to": let us use, let him go.`,`หลังโครงสร้าง "let somebody" ภาษาอังกฤษใช้กริยารูปพื้นฐานโดยไม่มี "to" เช่น let us use, let him go`],w:{0:[`"To use" follows "allow us", but never "let us".`,`"to use" ใช้ตาม "allow us" แต่ไม่ใช้กับ "let us"`],2:[`The -ing form does not follow "let somebody".`,`รูป -ing ไม่ตามหลัง "let somebody"`],3:[`"Used" is a past form and cannot follow "let" in this pattern.`,`"used" เป็นรูปอดีต จึงตามหลัง "let" ในโครงสร้างนี้ไม่ได้`]}},{id:`T10-Q10`,s:`vocabulary`,k:`vocab-context`,q:`After three weeks of rain, the river burst its banks and ____ the whole village.`,c:[`flooded`,`watered`,`filled`,`poured`],a:0,e:[`When a river bursts its banks, water covers the land around it. "Flood" is the verb for water covering a place that is normally dry.`,`เมื่อน้ำในแม่น้ำล้นตลิ่ง น้ำจะท่วมพื้นที่โดยรอบ คำกริยา "flood" ใช้กับน้ำที่ท่วมพื้นที่ซึ่งปกติแห้ง`],w:{1:[`"Watered" means giving a small amount of water to plants.`,`"watered" หมายถึงรดน้ำต้นไม้ในปริมาณเล็กน้อย`],2:[`"Filled" needs a container; a village is not a container.`,`"filled" ต้องใช้กับภาชนะ แต่หมู่บ้านไม่ใช่ภาชนะ`],3:[`"Poured" describes liquid being tipped out, and it does not take a place as its object.`,`"poured" หมายถึงการเทของเหลว และไม่ใช้สถานที่เป็นกรรม`]}},{id:`T10-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The path up the hill was very steep and the climb was exhausting. "Exhausting" is closest in meaning to ____.`,c:[`exciting`,`frightening`,`interesting`,`very tiring`],a:3,e:[`A steep climb uses a great deal of energy. "Exhausting" describes something that makes you extremely tired.`,`การปีนทางชันต้องใช้พลังงานมาก คำว่า "exhausting" ใช้บรรยายสิ่งที่ทำให้เหนื่อยอย่างมาก`],w:{0:[`"Exciting" describes a strong pleasant feeling, not tiredness.`,`"exciting" บรรยายความรู้สึกตื่นเต้นในทางที่ดี ไม่ใช่ความเหนื่อย`],1:[`"Frightening" means causing fear, which a steep path may or may not do.`,`"frightening" แปลว่าน่ากลัว ซึ่งทางชันอาจน่ากลัวหรือไม่ก็ได้`],2:[`"Interesting" describes something that holds your attention.`,`"interesting" บรรยายสิ่งที่ดึงดูดความสนใจ`]}},{id:`T10-Q12`,s:`vocabulary`,k:`collocations`,q:`You will need to ____ a decision about the school trip before the end of the week.`,c:[`do`,`get`,`make`,`take`],a:2,e:[`"Make a decision" is the standard English collocation. "Make" is used for things you produce, including plans and decisions.`,`"make a decision" เป็นคำคู่มาตรฐานในภาษาอังกฤษ โดยใช้ "make" กับสิ่งที่สร้างขึ้น รวมถึงแผนงานและการตัดสินใจ`],w:{0:[`"Do a decision" is not used in English.`,`รูป "do a decision" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"Get a decision" would mean receiving one from someone else.`,`"get a decision" จะหมายถึงได้รับการตัดสินใจจากผู้อื่น`],3:[`"Take a decision" is used in some formal British writing, but "make a decision" is the standard form tested here.`,`"take a decision" มีใช้ในภาษาเขียนทางการแบบบริติชบ้าง แต่รูปมาตรฐานที่ข้อสอบวัดคือ "make a decision"`]}},{id:`T10-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`The meeting was ____ because half the committee were ill with flu.`,c:[`put on`,`called off`,`taken up`,`handed in`],a:1,e:[`"Call off" means to cancel an event that had been arranged. With half the committee ill, the meeting could not take place.`,`"call off" แปลว่ายกเลิกกิจกรรมที่นัดหมายไว้แล้ว เมื่อกรรมการครึ่งหนึ่งป่วย การประชุมจึงจัดไม่ได้`],w:{0:[`"Put on" means to organise or present an event, such as a show.`,`"put on" แปลว่าจัดหรือนำเสนอกิจกรรม เช่น การแสดง`],2:[`"Take up" means to start a new hobby or to occupy space or time.`,`"take up" แปลว่าเริ่มงานอดิเรกใหม่ หรือกินเนื้อที่หรือเวลา`],3:[`"Hand in" means to give work to a teacher or an office.`,`"hand in" แปลว่าส่งงานให้ครูหรือสำนักงาน`]}},{id:`T10-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The map was so ____ that we found the waterfall without asking anybody for help.`,c:[`confusing`,`expensive`,`ancient`,`accurate`],a:3,e:[`They found the place with no help, so the map showed everything correctly. "Accurate" means exactly right.`,`พวกเขาหาสถานที่พบโดยไม่ต้องถามใคร แสดงว่าแผนที่แสดงข้อมูลถูกต้อง คำว่า "accurate" แปลว่าแม่นยำถูกต้อง`],w:{0:[`"Confusing" would have made them lose the way, not find it easily.`,`"confusing" จะทำให้พวกเขาหลงทาง ไม่ใช่หาเจอได้ง่าย`],1:[`"Expensive" describes price and says nothing about how well a map works.`,`"expensive" บอกราคา ไม่ได้บอกว่าแผนที่ใช้งานได้ดีเพียงใด`],2:[`"Ancient" means very old; an old map is often less reliable.`,`"ancient" แปลว่าเก่าแก่มาก ซึ่งแผนที่เก่ามักเชื่อถือได้น้อยกว่า`]}},{id:`T10-Q15`,s:`conversation`,k:`conversation`,intro:`Ken: Let me pay for the coffee this time.
Aom: ____`,q:`Choose the best reply for Aom, who wants to pay herself.`,c:[`Yes, you certainly must pay.`,`No, I never drink coffee at all.`,`You are very welcome for the coffee.`,`That’s kind, but it’s my turn today.`],a:3,e:[`Aom wants to pay, so she thanks Ken for the offer and then gives a friendly reason for refusing it.`,`อ้อมต้องการจ่ายเอง จึงกล่าวขอบคุณสำหรับน้ำใจแล้วให้เหตุผลในการปฏิเสธอย่างเป็นมิตร`],w:{0:[`This accepts Ken’s offer, which is the opposite of what Aom wants.`,`ประโยคนี้เป็นการตอบรับข้อเสนอของเคน ซึ่งตรงข้ามกับสิ่งที่อ้อมต้องการ`],1:[`This changes the subject to her own habits and ignores the offer.`,`ประโยคนี้เปลี่ยนเรื่องไปที่นิสัยของตนเองและมองข้ามข้อเสนอ`],2:[`"You’re welcome" is a reply to thanks, and no thanks was given.`,`"You’re welcome" ใช้ตอบคำขอบคุณ ซึ่งยังไม่มีใครกล่าวขอบคุณ`]}},{id:`T10-Q16`,s:`conversation`,k:`conversation`,intro:`Passenger: Excuse me, I think I’ve left my bag on the train.
Station staff: ____`,q:`Choose the best reply for the station staff.`,c:[`The trains here are often very crowded.`,`You should be much more careful next time.`,`Please come with me to the lost property office.`,`I have not seen your bag anywhere today.`],a:2,e:[`A member of staff dealing with a lost item takes practical action and directs the passenger to where lost items are kept.`,`เจ้าหน้าที่ที่รับเรื่องของหายจะลงมือช่วยเหลือทันทีและพาผู้โดยสารไปยังจุดเก็บของหาย`],w:{0:[`This comments on the trains and does not help find the bag.`,`ประโยคนี้แสดงความเห็นเรื่องรถไฟ ไม่ได้ช่วยตามหากระเป๋า`],1:[`Blaming the passenger is unhelpful and unprofessional.`,`การตำหนิผู้โดยสารไม่ได้ช่วยแก้ปัญหาและไม่เป็นมืออาชีพ`],3:[`This closes the conversation without offering any next step.`,`ประโยคนี้ปิดบทสนทนาโดยไม่ได้เสนอขั้นตอนต่อไป`]}},{id:`T10-Q17`,s:`conversation`,k:`conversation`,intro:`Beam: Shall we meet at six or at seven?
Mint: ____`,q:`Choose the best reply for Mint.`,c:[`Seven would suit me better, if that’s all right.`,`Yes, we shall certainly meet.`,`I met him at six o’clock yesterday.`,`No, I don’t want to meet at all.`],a:0,e:[`Beam offers two times, so Mint must choose one. Adding "if that’s all right" keeps the reply polite.`,`บีมเสนอเวลามาสองตัวเลือก มิ้นต์จึงต้องเลือกหนึ่งเวลา และการเติม "if that’s all right" ทำให้คำตอบสุภาพยิ่งขึ้น`],w:{1:[`"Yes" cannot answer a question that offers a choice between two options.`,`คำว่า "Yes" ใช้ตอบคำถามที่ให้เลือกระหว่างสองตัวเลือกไม่ได้`],2:[`This talks about a past meeting with a different person.`,`ประโยคนี้พูดถึงการพบกันในอดีตกับคนอื่น`],3:[`A flat refusal ignores the choice offered and sounds unfriendly.`,`การปฏิเสธห้วน ๆ เป็นการมองข้ามตัวเลือกที่เสนอมาและฟังดูไม่เป็นมิตร`]}},{id:`T10-Q18`,s:`conversation`,k:`conversation`,intro:`Ping: I’m sorry for shouting at you yesterday.
Tul: ____`,q:`Choose the best reply for Tul, who accepts the apology.`,c:[`You should be very sorry indeed.`,`It’s all right. I know you were upset about the result.`,`Thank you for shouting at me.`,`Yes, please shout at me again tomorrow.`],a:1,e:[`Accepting an apology means saying it is all right, and adding an understanding reason makes the reply warm and natural.`,`การรับคำขอโทษคือการบอกว่าไม่เป็นไร และการเสริมเหตุผลที่แสดงความเข้าใจทำให้คำตอบอบอุ่นและเป็นธรรมชาติ`],w:{0:[`This keeps the blame going instead of accepting the apology.`,`ประโยคนี้ยังคงตำหนิต่อไปแทนที่จะรับคำขอโทษ`],2:[`Thanking someone for shouting makes no sense.`,`การขอบคุณที่มีคนตะโกนใส่ไม่สมเหตุสมผล`],3:[`Inviting more shouting is not a reasonable reply.`,`การชวนให้ตะโกนใส่อีกไม่ใช่คำตอบที่สมเหตุสมผล`]}},{id:`T10-Q19`,s:`reading`,k:`reading-detail`,p:`T10-P1`,q:`When were Ms. Wanida’s students’ instructions for opening the second envelope?`,c:[`On the evening of her retirement`,`After exactly one year had passed`,`When she felt she had made a mistake`,`Before she taught another class`],a:2,e:[`The first paragraph says she was told to open the second envelope "only when she felt she had made a mistake".`,`ย่อหน้าแรกระบุว่าเธอได้รับคำบอกให้เปิดซองที่สอง "only when she felt she had made a mistake" คือเมื่อรู้สึกว่าทำผิดพลาด`],w:{0:[`That evening was the time for the first envelope, not the second.`,`เย็นวันนั้นคือเวลาสำหรับเปิดซองแรก ไม่ใช่ซองที่สอง`],1:[`She waited almost a year, but no time limit was given by the students.`,`เธอรอเกือบหนึ่งปี แต่ลูกศิษย์ไม่ได้กำหนดเวลาไว้`],3:[`She opened it after teaching the class, not before.`,`เธอเปิดซองหลังจากสอนคาบนั้นแล้ว ไม่ใช่ก่อน`]}},{id:`T10-Q20`,s:`reading`,k:`reading-detail`,p:`T10-P1`,q:`What was inside the first envelope?`,c:[`A name list for her new class`,`A photograph of the whole school`,`A letter from the head teacher`,`A ticket for a long holiday`],a:1,e:[`The second paragraph says it "held a photograph of the whole school standing in the shape of a heart on the football field".`,`ย่อหน้าที่สองระบุว่าในซองมี "a photograph of the whole school standing in the shape of a heart on the football field"`],w:{0:[`She took a name list herself, at the very end of the story.`,`รายชื่อนักเรียนเป็นสิ่งที่เธอนำไปเองในตอนท้ายของเรื่อง`],2:[`No letter from the head teacher appears anywhere in the story.`,`ในเรื่องไม่ปรากฏจดหมายจากครูใหญ่เลย`],3:[`No holiday or ticket is mentioned.`,`ไม่มีการกล่าวถึงการพักร้อนหรือตั๋วเดินทาง`]}},{id:`T10-Q21`,s:`reading`,k:`reading-inference`,p:`T10-P1`,q:`Why did Ms. Wanida think she had been foolish to return?`,c:[`She could not remember any of the students’ names.`,`The weather was too wet for her to travel safely.`,`The school had forgotten about her retirement.`,`She had lost the second envelope somewhere.`],a:0,e:[`The third paragraph links the two ideas directly: she "could not remember a single name" and "came home certain that she had been foolish to return".`,`ย่อหน้าที่สามเชื่อมสองความคิดนี้ไว้โดยตรงว่าเธอ "could not remember a single name" และ "came home certain that she had been foolish to return"`],w:{1:[`The wet Tuesday sets the scene but is not given as the reason.`,`วันอังคารที่ฝนตกเป็นเพียงฉากของเรื่อง ไม่ได้ถูกระบุว่าเป็นเหตุผล`],2:[`The school welcomed her back to teach a class.`,`ทางโรงเรียนต้อนรับเธอกลับมาสอนหนึ่งคาบ`],3:[`She still had the envelope and opened it that night.`,`เธอยังมีซองอยู่และเปิดมันในคืนนั้น`]}},{id:`T10-Q22`,s:`reading`,k:`reading-inference`,p:`T10-P1`,q:`What does the last sentence show about Ms. Wanida?`,c:[`She decided never to teach again.`,`She was angry with her former students.`,`She had forgotten the message in the envelope.`,`She took the message to heart and prepared better.`],a:3,e:[`The message says a mistake is an unfinished lesson. She went back the next Tuesday — and this time brought the name list, which fixes the exact problem she had.`,`ข้อความในซองบอกว่าความผิดพลาดคือบทเรียนที่ยังไม่จบ เธอกลับไปอีกครั้งในวันอังคารถัดมาพร้อมรายชื่อนักเรียน ซึ่งแก้ปัญหาที่เธอเจอได้พอดี`],w:{0:[`She returned the very next Tuesday, so she did not give up teaching.`,`เธอกลับไปในวันอังคารถัดมาทันที จึงไม่ได้เลิกสอน`],1:[`Nothing in the story suggests anger towards the students.`,`ไม่มีตอนใดในเรื่องที่แสดงว่าเธอโกรธลูกศิษย์`],2:[`She acted on the message, which shows she remembered it clearly.`,`เธอทำตามข้อความนั้น แสดงว่าเธอจดจำได้เป็นอย่างดี`]}},{id:`T10-Q23`,s:`reading`,k:`reading-detail`,p:`T10-P2`,q:`Who may stand as a candidate in the election?`,c:[`Students in Grades 4 to 6`,`Students in Grades 1 to 6`,`Only students in Grade 6`,`Only members of last year’s council`],a:0,e:[`The notice says, "Any student in Grades 4 to 6 may stand as a candidate."`,`ประกาศระบุว่า "Any student in Grades 4 to 6 may stand as a candidate." คือ ป.4 ถึง ป.6`],w:{1:[`Grades 1 to 6 may vote, but not everyone may stand.`,`ป.1 ถึง ป.6 มีสิทธิ์ลงคะแนน แต่ไม่ใช่ทุกคนที่ลงสมัครได้`],2:[`Grade 6 is included, but so are Grades 4 and 5.`,`ป.6 ลงสมัครได้ แต่ ป.4 และ ป.5 ก็ลงสมัครได้เช่นกัน`],3:[`Last year’s council is never mentioned in the notice.`,`ประกาศไม่ได้กล่าวถึงคณะกรรมการชุดปีที่แล้วเลย`]}},{id:`T10-Q24`,s:`reading`,k:`reading-detail`,p:`T10-P2`,q:`What must a student bring to the hall in order to vote?`,c:[`A nomination form`,`Two signatures from their year`,`Their student card`,`A two-minute speech`],a:2,e:[`The notice warns, "Bring your student card to the hall — you will not be given a ballot paper without it."`,`ประกาศเตือนว่า "Bring your student card to the hall — you will not be given a ballot paper without it." คือต้องนำบัตรนักเรียนมา`],w:{0:[`The nomination form is for candidates and is returned to Mr. Kiat.`,`ใบสมัครใช้สำหรับผู้ลงสมัครและต้องส่งคืนให้ครูเกียรติ`],1:[`The two signatures are needed on a candidate’s form, not for voting.`,`ลายเซ็นสองคนต้องมีในใบสมัครของผู้ลงสมัคร ไม่ใช่สำหรับการลงคะแนน`],3:[`Only candidates give a speech, and it happens on 26 November.`,`เฉพาะผู้ลงสมัครเท่านั้นที่ต้องกล่าวสุนทรพจน์ และจัดในวันที่ 26 พฤศจิกายน`]}},{id:`T10-Q25`,s:`reading`,k:`reading-inference`,p:`T10-P2`,q:`What will happen to a candidate whose speech lasts three minutes?`,c:[`They will lose the election automatically.`,`They will be asked to speak again on 28 November.`,`They will be given extra time by Mr. Kiat.`,`They will be stopped before they finish.`],a:3,e:[`The notice states, "Speeches that run longer than two minutes will be stopped," and three minutes is longer than two.`,`ประกาศระบุว่า "Speeches that run longer than two minutes will be stopped" และสามนาทีย่อมยาวกว่าสองนาที`],w:{0:[`The notice never says a long speech causes a candidate to lose.`,`ประกาศไม่ได้ระบุว่าการพูดเกินเวลาจะทำให้แพ้การเลือกตั้ง`],1:[`28 November is voting day; speeches are on 26 November only.`,`วันที่ 28 พฤศจิกายนคือวันลงคะแนน ส่วนการกล่าวสุนทรพจน์มีเฉพาะวันที่ 26 พฤศจิกายน`],2:[`Mr. Kiat collects the nomination forms; no extra speaking time is offered.`,`ครูเกียรติเป็นผู้รับใบสมัคร และไม่มีการให้เวลาพูดเพิ่ม`]}}]},{id:`test-11`,number:11,title:`Practice Test 11`,subtitle:`Foundation — My Day and My Town`,tier:`foundation`,minutes:30,passages:[{id:`T11-P1`,kind:`Message`,title:`A Note on the Kitchen Table`,body:[`Nut,`,`I have gone to the hospital with Grandmother. She has an appointment at four o’clock.`,`Your dinner is in the blue pot on the stove. Please heat it for five minutes, and do not forget to turn the gas off afterwards.`,`Aunt Malee will come at six to help you with your homework. Please open the door for her.`,`If you need me, call my mobile. Do not call the house phone — nobody is at home.`],footer:[`See you at about eight.`,`Mum`]},{id:`T11-P2`,kind:`Informational passage`,title:`Our Street on Friday Evening`,body:[`Every Friday evening our quiet street changes. At five o’clock small trucks arrive, and men and women put up rows of red and white tents.`,`By six o’clock the street market is open. There are twenty or thirty stalls. Some sell hot food — noodles, grilled chicken and sweet roti. Others sell shirts, phone cases, toys and plants.`,`My favourite stall belongs to Uncle Sri, who sells coconut ice cream. He always gives children an extra spoonful, and he remembers everybody’s name.`,`At about ten o’clock the stalls close. The next morning the street is quiet again, and only a few flattened boxes by the wall show that the market was ever there.`]}],questions:[{id:`T11-Q01`,s:`grammar`,k:`tenses`,q:`My grandmother ____ coffee. She only drinks tea.`,c:[`not like`,`doesn’t likes`,`doesn’t like`,`don’t like`],a:2,e:[`This is a present simple negative with a third-person singular subject. We use "doesn’t" plus the base form, because "doesn’t" already carries the -s.`,`ประโยคนี้เป็น present simple ปฏิเสธที่มีประธานเอกพจน์บุรุษที่ 3 จึงใช้ "doesn’t" ตามด้วยกริยารูปพื้นฐาน เพราะ "doesn’t" มี -s อยู่แล้ว`],w:{0:[`A negative sentence needs a helping verb. "Not like" has no "does".`,`ประโยคปฏิเสธต้องมีกริยาช่วย รูป "not like" ขาดคำว่า "does"`],1:[`After "doesn’t" the verb never takes -s. Only one -s is used in the sentence.`,`หลัง "doesn’t" กริยาจะไม่เติม -s เพราะในประโยคใช้ -s เพียงครั้งเดียว`],3:[`"Don’t" is used with I, you, we and they, not with "my grandmother".`,`"don’t" ใช้กับ I, you, we, they ไม่ได้ใช้กับ "my grandmother"`]}},{id:`T11-Q02`,s:`grammar`,k:`tenses`,q:`Be quiet, please. The children ____ in the next room.`,c:[`are sleeping`,`sleeps`,`sleep`,`is sleeping`],a:0,e:[`"Be quiet" shows the action is happening right now, so we use the present continuous. "The children" is plural, so the helping verb is "are".`,`ประโยค "Be quiet" แสดงว่าเหตุการณ์กำลังเกิดขึ้นในขณะนี้ จึงใช้ present continuous และเนื่องจาก "the children" เป็นพหูพจน์ กริยาช่วยจึงเป็น "are"`],w:{1:[`"Sleeps" is singular present simple and does not fit a plural subject.`,`"sleeps" เป็น present simple รูปเอกพจน์ จึงไม่เข้ากับประธานพหูพจน์`],2:[`"Sleep" is present simple and describes a habit, not this moment.`,`"sleep" เป็น present simple ใช้บอกกิจวัตร ไม่ใช่สิ่งที่เกิดขึ้นขณะนี้`],3:[`"Is" is singular, but "the children" means more than one child.`,`"is" ใช้กับเอกพจน์ แต่ "the children" หมายถึงเด็กหลายคน`]}},{id:`T11-Q03`,s:`grammar`,k:`tenses`,q:`Dao ____ her bicycle to the market yesterday afternoon.`,c:[`ride`,`rides`,`riding`,`rode`],a:3,e:[`"Yesterday afternoon" is a finished past time, so the past simple is needed. "Ride" is irregular and its past form is "rode".`,`"yesterday afternoon" เป็นเวลาที่จบไปแล้วในอดีต จึงต้องใช้ past simple และกริยา "ride" เป็นกริยาอปกติ รูปอดีตคือ "rode"`],w:{0:[`"Ride" is the present base form and does not match a past time.`,`"ride" เป็นรูปพื้นฐานปัจจุบัน จึงไม่สอดคล้องกับเวลาในอดีต`],1:[`"Rides" is present simple for a habit, not for yesterday.`,`"rides" เป็น present simple ใช้กับกิจวัตร ไม่ใช้กับเมื่อวาน`],2:[`"Riding" cannot be the main verb of the sentence on its own.`,`"riding" เป็นกริยาหลักของประโยคตามลำพังไม่ได้`]}},{id:`T11-Q04`,s:`grammar`,k:`agreement`,q:`One of my classmates ____ from Chiang Rai.`,c:[`come`,`comes`,`are coming`,`have come`],a:1,e:[`The subject is "one", which is singular. The plural noun "classmates" only tells us which group, so the verb stays singular: comes.`,`ประธานของประโยคคือ "one" ซึ่งเป็นเอกพจน์ ส่วนคำนามพหูพจน์ "classmates" เพียงบอกว่ามาจากกลุ่มใด กริยาจึงคงรูปเอกพจน์คือ comes`],w:{0:[`"Come" agrees with a plural subject, but the subject here is "one".`,`"come" ใช้กับประธานพหูพจน์ แต่ประธานในที่นี้คือ "one"`],2:[`"Are" is plural, and where a person is from is a fact, not an action in progress.`,`"are" เป็นพหูพจน์ อีกทั้งการบอกภูมิลำเนาเป็นข้อเท็จจริง ไม่ใช่การกระทำที่กำลังดำเนินอยู่`],3:[`"Have come" is plural present perfect and changes the meaning to a recent arrival.`,`"have come" เป็น present perfect รูปพหูพจน์ และเปลี่ยนความหมายเป็นการเพิ่งเดินทางมาถึง`]}},{id:`T11-Q05`,s:`grammar`,k:`articles`,q:`We watched ____ film about elephants in class this morning.`,c:[`an`,`the`,`a`,`some`],a:2,e:[`The film is mentioned for the first time and "film" begins with a consonant sound, so the correct article is "a".`,`ภาพยนตร์เรื่องนี้ถูกกล่าวถึงเป็นครั้งแรก และคำว่า "film" ขึ้นต้นด้วยเสียงพยัญชนะ จึงต้องใช้ "a"`],w:{0:[`"An" is used before a vowel sound, and "film" starts with the sound /f/.`,`"an" ใช้หน้าเสียงสระ แต่ "film" ขึ้นต้นด้วยเสียง /f/`],1:[`"The" is used for something already known to both speakers.`,`"the" ใช้กับสิ่งที่ผู้พูดทั้งสองฝ่ายรู้จักอยู่แล้ว`],3:[`"Some" is used with plural or uncountable nouns, not with one film.`,`"some" ใช้กับคำนามพหูพจน์หรือนับไม่ได้ ไม่ใช้กับภาพยนตร์เรื่องเดียว`]}},{id:`T11-Q06`,s:`grammar`,k:`nouns`,q:`There are three ____ waiting outside the office.`,c:[`women`,`womans`,`womens`,`woman`],a:0,e:[`"Three" needs a plural noun. "Woman" is irregular: its plural is "women", with a vowel change and no -s.`,`คำว่า "three" ต้องตามด้วยคำนามพหูพจน์ และ "woman" เป็นคำนามอปกติ รูปพหูพจน์คือ "women" ซึ่งเปลี่ยนสระโดยไม่เติม -s`],w:{1:[`Irregular nouns do not take -s, so "womans" is not an English word.`,`คำนามอปกติไม่เติม -s คำว่า "womans" จึงไม่มีในภาษาอังกฤษ`],2:[`"Women" is already plural, so adding -s makes a double plural.`,`"women" เป็นพหูพจน์อยู่แล้ว การเติม -s จึงเป็นพหูพจน์ซ้ำซ้อน`],3:[`"Woman" is singular and cannot follow the number three.`,`"woman" เป็นเอกพจน์ จึงตามหลังเลขสามไม่ได้`]}},{id:`T11-Q07`,s:`grammar`,k:`prepositions`,q:`I can’t find my shoes. Oh, they are ____ the bed.`,c:[`on`,`under`,`between`,`among`],a:1,e:[`Shoes that cannot be seen are usually hidden below something. "Under" means in a lower position than something else.`,`รองเท้าที่มองไม่เห็นมักซ่อนอยู่ใต้สิ่งของ คำว่า "under" แปลว่าอยู่ในตำแหน่งที่ต่ำกว่าสิ่งนั้น`],w:{0:[`"On" means resting on top, where the shoes would be easy to see.`,`"on" แปลว่าวางอยู่ด้านบน ซึ่งจะทำให้มองเห็นรองเท้าได้ง่าย`],2:[`"Between" needs two things, as in "between the bed and the wall".`,`"between" ต้องมีสิ่งของสองสิ่ง เช่น "between the bed and the wall"`],3:[`"Among" is used for a group of three or more things.`,`"among" ใช้กับกลุ่มของสิ่งของตั้งแต่สามสิ่งขึ้นไป`]}},{id:`T11-Q08`,s:`grammar`,k:`adjectives-adverbs`,q:`Pim is ____ late for school. She gets up at five o’clock every day.`,c:[`always`,`usually`,`often`,`never`],a:3,e:[`Getting up at five means she has plenty of time, so she is not late at any time. "Never" means at no time at all.`,`การตื่นตอนตีห้าแสดงว่าเธอมีเวลาเหลือเฟือ จึงไม่เคยไปสาย คำว่า "never" แปลว่าไม่เคยเลย`],w:{0:[`"Always" means every time, which contradicts getting up so early.`,`"always" แปลว่าทุกครั้ง ซึ่งขัดแย้งกับการตื่นแต่เช้ามาก`],1:[`"Usually" means most of the time, which also contradicts the second sentence.`,`"usually" แปลว่าเกือบทุกครั้ง ซึ่งก็ขัดแย้งกับประโยคที่สอง`],2:[`"Often" means many times, so it does not fit either.`,`"often" แปลว่าบ่อยครั้ง จึงไม่เข้ากับประโยคนี้เช่นกัน`]}},{id:`T11-Q09`,s:`grammar`,k:`modals`,q:`My little brother is only four years old, but he ____ already read simple words.`,c:[`must`,`should`,`can`,`would`],a:2,e:[`The sentence is about what he is able to do, and "can" is the modal used for ability.`,`ประโยคนี้บอกสิ่งที่เขาทำได้ กริยาช่วยที่ใช้แสดงความสามารถคือ "can"`],w:{0:[`"Must" states an obligation, but nobody is forcing him to read.`,`"must" บอกความจำเป็น แต่ไม่มีใครบังคับให้เขาอ่าน`],1:[`"Should" gives advice about what is a good idea.`,`"should" ใช้แนะนำว่าอะไรเป็นสิ่งที่ควรทำ`],3:[`"Would" is used for polite requests or imagined situations.`,`"would" ใช้ในการขอร้องอย่างสุภาพหรือสถานการณ์สมมติ`]}},{id:`T11-Q10`,s:`vocabulary`,k:`vocab-context`,q:`Take your umbrella with you. It is very ____ outside this morning.`,c:[`wet`,`dry`,`sunny`,`dusty`],a:0,e:[`An umbrella keeps the rain off, so the weather must be rainy. "Wet" describes weather with a lot of rain.`,`ร่มใช้กันฝน แสดงว่าอากาศกำลังมีฝน คำว่า "wet" ใช้บรรยายสภาพอากาศที่มีฝนตกมาก`],w:{1:[`"Dry" means there is no rain, so no umbrella would be needed.`,`"dry" แปลว่าไม่มีฝน จึงไม่จำเป็นต้องใช้ร่ม`],2:[`"Sunny" describes bright sunshine rather than rain.`,`"sunny" บรรยายแดดจ้า
