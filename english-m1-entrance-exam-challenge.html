บก็ยังว่างเปล่าได้`],2:[`"Clean" is the opposite of dirty, not of empty.`,`"clean" เป็นคำตรงข้ามกับสกปรก ไม่ใช่กับว่างเปล่า`],3:[`"Dark" describes light, and a dark street can also be empty.`,`"dark" บอกเรื่องแสง ถนนที่มืดก็ว่างเปล่าได้เช่นกัน`]}},{id:`T04-Q14`,s:`vocabulary`,k:`vocab-context`,q:`You must be ____ when you cross this road, because the cars come round the corner very fast.`,c:[`careful`,`careless`,`cheerful`,`curious`],a:0,e:[`Fast traffic is dangerous, so you should pay close attention. "Careful" means giving attention so that you stay safe.`,`รถที่วิ่งเร็วเป็นอันตราย จึงต้องเพิ่มความระมัดระวัง คำว่า "careful" แปลว่าใส่ใจระมัดระวังเพื่อความปลอดภัย`],w:{1:[`"Careless" means not paying attention — exactly what would be dangerous here.`,`"careless" แปลว่าไม่ระมัดระวัง ซึ่งจะยิ่งเป็นอันตรายในสถานการณ์นี้`],2:[`"Cheerful" means happy and has nothing to do with road safety.`,`"cheerful" แปลว่าร่าเริง ไม่เกี่ยวกับความปลอดภัยบนถนน`],3:[`"Curious" means wanting to know about something.`,`"curious" แปลว่าอยากรู้อยากเห็น`]}},{id:`T04-Q15`,s:`conversation`,k:`conversation`,intro:`Customer: How much are these mangoes?
Seller: ____`,q:`Choose the best reply for the seller.`,c:[`They are very sweet indeed.`,`Yes, please take them all.`,`I bought them this morning.`,`Fifty baht a kilo.`],a:3,e:[`"How much…?" asks for a price, so the answer must be an amount of money.`,`คำถาม "How much…?" ถามราคา คำตอบจึงต้องเป็นจำนวนเงิน`],w:{0:[`This describes the taste, not the price.`,`ประโยคนี้บอกรสชาติ ไม่ได้บอกราคา`],1:[`"Yes" cannot answer a "How much" question.`,`คำว่า "Yes" ใช้ตอบคำถาม "How much" ไม่ได้`],2:[`This tells when the seller got the mangoes, not what they cost.`,`ประโยคนี้บอกว่าผู้ขายได้มะม่วงมาเมื่อใด ไม่ได้บอกราคา`]}},{id:`T04-Q16`,s:`conversation`,k:`conversation`,intro:`Pat: Could you pass me the salt, please?
Oil: ____`,q:`Choose the best reply for Oil.`,c:[`Yes, I could.`,`No, I can’t do that.`,`Here you are.`,`Thank you very much.`],a:2,e:[`"Could you…, please?" is a polite request. The natural reply is to do it and say "Here you are" as you hand the item over.`,`"Could you…, please?" เป็นการขอร้องอย่างสุภาพ คำตอบที่เป็นธรรมชาติคือทำให้แล้วพูดว่า "Here you are" ขณะยื่นของให้`],w:{0:[`"Yes, I could." answers as if the question were about ability, and it sounds cold.`,`"Yes, I could." ตอบราวกับคำถามเรื่องความสามารถ และฟังดูไม่เป็นมิตร`],1:[`A flat refusal with no reason is unfriendly at a family meal.`,`การปฏิเสธห้วน ๆ โดยไม่บอกเหตุผลฟังดูไม่เป็นมิตรในวงอาหาร`],3:[`Pat is the one who should say thank you, after receiving the salt.`,`แพทต่างหากที่ควรกล่าวขอบคุณหลังได้รับเกลือ`]}},{id:`T04-Q17`,s:`conversation`,k:`conversation`,intro:`Bas: Nid, this is my cousin, Tar.
Nid: ____`,q:`Choose the best reply for Nid.`,c:[`How do you do it?`,`Nice to meet you, Tar.`,`I am fine, thank you.`,`Goodbye, Tar.`],a:1,e:[`When someone introduces a new person, the standard English reply is "Nice to meet you" with the person’s name.`,`เมื่อมีคนแนะนำให้รู้จักบุคคลใหม่ คำตอบมาตรฐานในภาษาอังกฤษคือ "Nice to meet you" พร้อมเรียกชื่อผู้นั้น`],w:{0:[`"How do you do?" is a greeting, but "How do you do it?" asks about a method.`,`"How do you do?" เป็นคำทักทาย แต่ "How do you do it?" เป็นการถามวิธีทำ`],2:[`"I am fine, thank you." answers "How are you?", which was not asked.`,`"I am fine, thank you." ใช้ตอบคำถาม "How are you?" ซึ่งไม่ได้ถูกถาม`],3:[`Saying goodbye immediately after meeting someone is impolite.`,`การกล่าวลาทันทีที่เพิ่งพบกันถือว่าไม่สุภาพ`]}},{id:`T04-Q18`,s:`conversation`,k:`conversation`,intro:`Passenger: Excuse me, does this bus go to the railway station?
Driver: ____`,q:`Choose the best reply for the driver.`,c:[`Yes, it does. Four more stops.`,`Yes, I am the driver of this bus.`,`No, I don’t like the station.`,`It is thirty baht each.`],a:0,e:[`The question begins with "does", so it needs a yes/no answer about the bus. Adding how many stops remain is helpful and natural.`,`คำถามขึ้นต้นด้วย "does" จึงต้องตอบรับหรือปฏิเสธเกี่ยวกับรถคันนี้ และการบอกจำนวนป้ายที่เหลือเป็นข้อมูลที่เป็นประโยชน์และเป็นธรรมชาติ`],w:{1:[`This answers a different question about who the speaker is.`,`ประโยคนี้ตอบคำถามคนละเรื่องว่าผู้พูดคือใคร`],2:[`The question is about the route, not about the driver’s feelings.`,`คำถามนี้ถามเรื่องเส้นทาง ไม่ได้ถามความรู้สึกของคนขับ`],3:[`This gives the fare, which was not asked about.`,`ประโยคนี้บอกค่าโดยสาร ซึ่งไม่ได้ถูกถาม`]}},{id:`T04-Q19`,s:`reading`,k:`reading-detail`,p:`T04-P1`,q:`What must you do first at the self-service machine?`,c:[`Put the books on the grey pad`,`Put your student card on the reader`,`Touch the blue FINISH button`,`Take the paper slip from the machine`],a:1,e:[`Step 1 says to put your student card on the reader and wait for the green light.`,`ขั้นตอนที่ 1 ระบุให้วางบัตรนักเรียนบนเครื่องอ่านและรอจนไฟเขียวติด`],w:{0:[`Placing books on the pad is step 2, after the card.`,`การวางหนังสือบนแผ่นรองเป็นขั้นตอนที่ 2 ซึ่งอยู่หลังการใช้บัตร`],2:[`The FINISH button is step 4, near the end.`,`ปุ่ม FINISH เป็นขั้นตอนที่ 4 ซึ่งอยู่เกือบท้ายสุด`],3:[`The slip is printed after you touch FINISH.`,`ใบสลิปจะพิมพ์ออกมาหลังกดปุ่ม FINISH แล้ว`]}},{id:`T04-Q20`,s:`reading`,k:`reading-detail`,p:`T04-P1`,q:`What information is printed on the paper slip?`,c:[`The date you must return the books`,`The price of each book you borrowed`,`The name of the librarian on duty`,`The number on your student card`],a:0,e:[`Step 4 says the slip prints "with the date you must return the books".`,`ขั้นตอนที่ 4 ระบุว่าใบสลิปจะพิมพ์ "with the date you must return the books" คือวันที่ต้องคืนหนังสือ`],w:{1:[`Borrowing is free; no prices are mentioned anywhere.`,`การยืมไม่มีค่าใช้จ่าย และไม่มีการกล่าวถึงราคาใด ๆ`],2:[`The librarian is only mentioned as someone to ask for help.`,`บรรณารักษ์ถูกกล่าวถึงเพียงในฐานะผู้ที่ขอความช่วยเหลือได้`],3:[`The card is used at step 1, but its number is not printed on the slip.`,`บัตรถูกใช้ในขั้นตอนที่ 1 แต่หมายเลขบัตรไม่ได้พิมพ์ลงบนสลิป`]}},{id:`T04-Q21`,s:`reading`,k:`reading-inference`,p:`T04-P1`,q:`A book’s title does not appear on the screen. What should the student do?`,c:[`Ask the librarian at the desk immediately`,`Touch the FINISH button anyway`,`Put that book on the grey pad again`,`Take the card and leave the machine`],a:2,e:[`Step 3 covers exactly this problem: if a title is missing, take that book off and put it on the pad again.`,`ขั้นตอนที่ 3 กล่าวถึงปัญหานี้โดยตรง คือถ้าชื่อหนังสือหายไป ให้ยกหนังสือออกแล้ววางบนแผ่นรองใหม่`],w:{0:[`The librarian is for the red light, not for a missing title.`,`บรรณารักษ์มีไว้สำหรับกรณีไฟแดงติด ไม่ใช่กรณีชื่อหนังสือหายไป`],1:[`Finishing now would leave that book unrecorded.`,`การกดจบตอนนี้จะทำให้หนังสือเล่มนั้นไม่ถูกบันทึกการยืม`],3:[`Leaving means the book has not been borrowed properly.`,`การเดินจากไปเท่ากับหนังสือเล่มนั้นยังไม่ได้ยืมอย่างถูกต้อง`]}},{id:`T04-Q22`,s:`reading`,k:`reading-detail`,p:`T04-P1`,q:`How many books may one student borrow at a time?`,c:[`One`,`Two`,`Three`,`Four`],a:3,e:[`The last paragraph says, "You may borrow four books for two weeks."`,`ย่อหน้าสุดท้ายระบุว่า "You may borrow four books for two weeks." คือยืมได้ 4 เล่ม`],w:{0:[`"One at a time" refers to placing books on the pad, not the borrowing limit.`,`"one at a time" หมายถึงการวางหนังสือทีละเล่ม ไม่ใช่จำนวนที่ยืมได้`],1:[`Two is the number of weeks, not the number of books.`,`สองคือจำนวนสัปดาห์ ไม่ใช่จำนวนหนังสือ`],2:[`Three is not mentioned in the instructions.`,`ไม่มีการกล่าวถึงเลขสามในคำแนะนำนี้`]}},{id:`T04-Q23`,s:`reading`,k:`reading-detail`,p:`T04-P2`,q:`Where did Ton find the wallet?`,c:[`On a bus seat`,`At the police station`,`Under a bench in the park`,`Inside his own school bag`],a:2,e:[`The first paragraph says something brown was lying "under the seat" of the park bench where Ton sat down.`,`ย่อหน้าแรกระบุว่ามีของสีน้ำตาลวางอยู่ "under the seat" ของม้านั่งในสวนที่ต้นนั่งลง`],w:{0:[`There is a bus card inside the wallet, but Ton was not on a bus.`,`ในกระเป๋าสตางค์มีบัตรรถประจำทาง แต่ต้นไม่ได้อยู่บนรถ`],1:[`Ton took the wallet to the police station after finding it.`,`ต้นนำกระเป๋าสตางค์ไปที่สถานีตำรวจหลังจากเก็บได้`],3:[`He put the wallet into his bag later, after he had found it.`,`เขาเก็บกระเป๋าสตางค์ใส่กระเป๋าของตนภายหลังจากที่พบมัน`]}},{id:`T04-Q24`,s:`reading`,k:`reading-inference`,p:`T04-P2`,q:`Why did Ton think about the football boots?`,c:[`He had already bought a pair that week.`,`A friend had promised to lend him some.`,`He wanted to sell them at the market.`,`He had wanted a pair for a long time.`],a:3,e:[`The story says the money "would buy the football boots he had wanted for months", which shows a long-standing wish.`,`เรื่องระบุว่าเงินจำนวนนั้น "would buy the football boots he had wanted for months" แสดงถึงความอยากได้ที่มีมานาน`],w:{0:[`If he already owned them, the money would not be tempting.`,`ถ้าเขามีรองเท้าอยู่แล้ว เงินจำนวนนั้นก็คงไม่น่าดึงดูดใจ`],1:[`No friend is mentioned in the story.`,`ในเรื่องไม่ได้กล่าวถึงเพื่อนคนใด`],2:[`He wanted to buy boots, not to sell them.`,`เขาต้องการซื้อรองเท้า ไม่ใช่ขายรองเท้า`]}},{id:`T04-Q25`,s:`reading`,k:`reading-main-idea`,p:`T04-P2`,q:`What does the story mainly show about Ton?`,c:[`He is honest.`,`He is careless.`,`He is lazy.`,`He is unfriendly.`],a:0,e:[`Ton could have kept the money for something he badly wanted, but he took the wallet to the police instead. That choice shows honesty.`,`ต้นสามารถเก็บเงินไว้ซื้อของที่อยากได้มานาน แต่เขากลับนำกระเป๋าไปส่งตำรวจ การตัดสินใจนี้แสดงถึงความซื่อสัตย์`],w:{1:[`It was the owner who lost the wallet, not Ton.`,`คนที่ทำกระเป๋าหายคือเจ้าของ ไม่ใช่ต้น`],2:[`Ton walked all the way to the police station, which is not lazy.`,`ต้นเดินไปจนถึงสถานีตำรวจ ซึ่งไม่ใช่พฤติกรรมของคนขี้เกียจ`],3:[`Nothing in the story shows Ton being unkind to anyone.`,`ไม่มีตอนใดในเรื่องที่แสดงว่าต้นไม่เป็นมิตรกับใคร`]}}]},{id:`test-05`,number:5,title:`Practice Test 5`,subtitle:`Standard Plus — Travel and Technology`,tier:`standard-plus`,minutes:40,passages:[{id:`T05-P1`,kind:`Informational passage`,title:`What Happens to an Old Mobile Phone?`,body:[`Most families in Thailand change their mobile phone every two or three years. The old phone is often left in a drawer, but it does not simply disappear.`,`A mobile phone contains small amounts of gold, silver and copper. It also contains lead, which can harm the soil and the water if the phone is thrown away with ordinary rubbish.`,`For this reason many shops now accept old phones. Workers take the phones apart, separate the useful metals and send them to factories, where they are used to make new machines. One tonne of old phones can produce more gold than one tonne of rock from a gold mine.`,`The next time your family buys a new phone, do not leave the old one in a drawer. Take it to a shop that collects them. A phone that is recycled is worth far more than a phone that is forgotten.`]},{id:`T05-P2`,kind:`Announcement`,title:`Passenger Announcement — Platform 3`,body:[`Good afternoon, ladies and gentlemen. This is an announcement for passengers waiting for the 2:15 train to Hua Hin.`,`Because of repair work on the line near Nakhon Pathom, the train will leave from Platform 5 today instead of Platform 3, and it will depart twenty minutes late.`,`Passengers with seats in coaches A to D should walk to the far end of the platform. A member of staff in a red jacket will help you with your luggage.`,`We are sorry for the delay. Free drinking water is available at the information desk while you wait.`]}],questions:[{id:`T05-Q01`,s:`grammar`,k:`tenses`,q:`I can’t come out with you. I ____ finished my homework yet.`,c:[`did not`,`has not`,`am not`,`have not`],a:3,e:[`The word "yet" in a negative sentence goes with the present perfect. The subject "I" takes "have", so the answer is "have not".`,`คำว่า "yet" ในประโยคปฏิเสธใช้คู่กับ present perfect และประธาน "I" ใช้ "have" คำตอบจึงเป็น "have not"`],w:{0:[`"Did not" needs the base form "finish" and would not be used with "yet" in this pattern.`,`"did not" ต้องตามด้วยรูปพื้นฐาน "finish" และไม่ใช้กับ "yet" ในโครงสร้างนี้`],1:[`"Has not" is used with he, she or it, not with "I".`,`"has not" ใช้กับ he, she, it ไม่ใช้กับ "I"`],2:[`"Am not" is used with an adjective or an -ing form, not with a past participle like "finished" in this sense.`,`"am not" ใช้กับคำคุณศัพท์หรือรูป -ing ไม่ใช้กับกริยาช่องที่ 3 ในความหมายนี้`]}},{id:`T05-Q02`,s:`grammar`,k:`relative-clauses`,q:`The woman ____ lives next door teaches science at my school.`,c:[`which`,`who`,`whose`,`what`],a:1,e:[`The relative pronoun replaces "the woman", a person acting as the subject of the clause, so "who" is correct.`,`คำสรรพนามเชื่อมความนี้แทน "the woman" ซึ่งเป็นบุคคลและทำหน้าที่เป็นประธานของอนุประโยค จึงต้องใช้ "who"`],w:{0:[`"Which" is used for animals and things, not for people.`,`"which" ใช้กับสัตว์และสิ่งของ ไม่ใช้กับคน`],2:[`"Whose" shows possession and must be followed by a noun, as in "whose house".`,`"whose" ใช้แสดงความเป็นเจ้าของและต้องมีคำนามตามหลัง เช่น "whose house"`],3:[`"What" is never used as a relative pronoun after a noun in standard English.`,`"what" ไม่ใช้เป็นคำสรรพนามเชื่อมความหลังคำนามในภาษาอังกฤษมาตรฐาน`]}},{id:`T05-Q03`,s:`grammar`,k:`conditionals`,q:`If it ____ tomorrow, we will visit the floating market.`,c:[`will not rain`,`did not rain`,`does not rain`,`is not raining`],a:2,e:[`In a first conditional the "if" clause uses the present simple even though it talks about the future, and the main clause uses "will".`,`ในประโยคเงื่อนไขแบบที่ 1 อนุประโยค if ใช้ present simple แม้จะพูดถึงอนาคต ส่วนประโยคหลักใช้ "will"`],w:{0:[`"Will" is not used inside the "if" clause of a first conditional.`,`ไม่ใช้ "will" ในอนุประโยค if ของประโยคเงื่อนไขแบบที่ 1`],1:[`"Did not rain" is a past form and does not fit "tomorrow".`,`"did not rain" เป็นรูปอดีต จึงไม่เข้ากับคำว่า "tomorrow"`],3:[`"Is not raining" describes right now, not a future condition.`,`"is not raining" บรรยายสิ่งที่เกิดขึ้นขณะนี้ ไม่ใช่เงื่อนไขในอนาคต`]}},{id:`T05-Q04`,s:`grammar`,k:`modals`,q:`You ____ take photographs inside the museum. There is a clear sign at the door.`,c:[`must not`,`need not`,`would not`,`could not`],a:0,e:[`A sign at the door states a rule, and "must not" is the modal used to say that something is forbidden.`,`ป้ายที่ประตูคือกฎที่ประกาศไว้ และ "must not" คือกริยาช่วยที่ใช้บอกว่าสิ่งนั้นเป็นข้อห้าม`],w:{1:[`"Need not" means it is not necessary — you may still do it if you want.`,`"need not" แปลว่าไม่จำเป็นต้องทำ ซึ่งยังทำได้หากต้องการ`],2:[`"Would not" describes an unwillingness or an imagined situation.`,`"would not" ใช้บอกความไม่เต็มใจหรือสถานการณ์สมมติ`],3:[`"Could not" describes a lack of ability rather than a rule.`,`"could not" บอกการขาดความสามารถ ไม่ใช่การบอกกฎ`]}},{id:`T05-Q05`,s:`grammar`,k:`prepositions`,q:`Our train arrives ____ Chiang Mai at half past nine in the morning.`,c:[`to`,`on`,`in`,`at`],a:2,e:[`We use "arrive in" with a country, a city or a large area: arrive in Chiang Mai, arrive in Japan.`,`ใช้ "arrive in" กับประเทศ เมือง หรือพื้นที่ขนาดใหญ่ เช่น arrive in Chiang Mai, arrive in Japan`],w:{0:[`"Arrive to" is never used in English; the verb "arrive" is not followed by "to".`,`ภาษาอังกฤษไม่ใช้ "arrive to" เพราะกริยา "arrive" ไม่ตามด้วย "to"`],1:[`"On" is used for surfaces and for days, not for cities.`,`"on" ใช้กับพื้นผิวและวัน ไม่ใช้กับชื่อเมือง`],3:[`"Arrive at" is for small places such as a station, an airport or a hotel.`,`"arrive at" ใช้กับสถานที่เล็ก เช่น สถานี สนามบิน หรือโรงแรม`]}},{id:`T05-Q06`,s:`grammar`,k:`agreement`,q:`Neither of my brothers ____ how to drive a car.`,c:[`know`,`are knowing`,`have known`,`knows`],a:3,e:[`"Neither" is treated as singular in standard English, so the verb after it takes -s: knows.`,`คำว่า "neither" ถือเป็นเอกพจน์ในภาษาอังกฤษมาตรฐาน กริยาที่ตามมาจึงต้องเติม -s เป็น knows`],w:{0:[`"Know" agrees with a plural subject, but "neither" is singular.`,`"know" ใช้กับประธานพหูพจน์ แต่ "neither" เป็นเอกพจน์`],1:[`"Know" is a state verb and is not normally used in the continuous form.`,`"know" เป็นกริยาแสดงสภาวะ จึงไม่ใช้ในรูป continuous ตามปกติ`],2:[`"Have known" is plural present perfect and does not match this simple statement of fact.`,`"have known" เป็น present perfect รูปพหูพจน์ ไม่เข้ากับการบอกข้อเท็จจริงธรรมดานี้`]}},{id:`T05-Q07`,s:`grammar`,k:`verb-patterns`,q:`She promised ____ me a message as soon as she arrived at the hotel.`,c:[`to send`,`sending`,`send`,`sent`],a:0,e:[`Some verbs are always followed by "to + base verb", and "promise" is one of them: promise to send, promise to help.`,`กริยาบางคำต้องตามด้วย "to + กริยาพื้นฐาน" เสมอ และ "promise" เป็นหนึ่งในนั้น เช่น promise to send, promise to help`],w:{1:[`"Promise" is not followed by the -ing form.`,`หลัง "promise" ไม่ใช้รูป -ing`],2:[`The base form alone cannot follow "promise"; the word "to" is needed.`,`รูปพื้นฐานตามหลัง "promise" ลำพังไม่ได้ ต้องมีคำว่า "to"`],3:[`"Sent" is a past form and cannot follow another verb like this.`,`"sent" เป็นรูปอดีต จึงตามหลังกริยาอีกตัวในลักษณะนี้ไม่ได้`]}},{id:`T05-Q08`,s:`grammar`,k:`adjectives-adverbs`,q:`He speaks English so ____ that everyone in the room understands him.`,c:[`clear`,`clearly`,`clearer`,`more clear`],a:1,e:[`The word describes how he speaks, so an adverb is needed. The adverb formed from "clear" is "clearly".`,`คำนี้ขยายวิธีการพูดของเขา จึงต้องใช้คำวิเศษณ์ ซึ่งรูปคำวิเศษณ์ของ "clear" คือ "clearly"`],w:{0:[`"Clear" is an adjective and would describe a noun, not the action of speaking.`,`"clear" เป็นคำคุณศัพท์ ใช้ขยายคำนาม ไม่ใช่ขยายการพูด`],2:[`"Clearer" is a comparative and needs "than" or a comparison.`,`"clearer" เป็นขั้นกว่า ต้องมี "than" หรือการเปรียบเทียบประกอบ`],3:[`"More clear" is also comparative, and no comparison is being made here.`,`"more clear" ก็เป็นขั้นกว่าเช่นกัน แต่ประโยคนี้ไม่ได้เปรียบเทียบสิ่งใด`]}},{id:`T05-Q09`,s:`grammar`,k:`pronouns`,q:`Is there ____ in the computer room? The lights are still on.`,c:[`someone`,`no one`,`anyone`,`everyone`],a:2,e:[`In questions we normally use the "any-" form. "Anyone" is the correct indefinite pronoun after "Is there…?".`,`ในประโยคคำถามเราใช้รูป "any-" เป็นปกติ คำสรรพนามไม่ชี้เฉพาะที่ถูกต้องหลัง "Is there…?" คือ "anyone"`],w:{0:[`"Someone" is used in statements or when offering something, not in a genuine question like this.`,`"someone" ใช้ในประโยคบอกเล่าหรือการเสนอสิ่งของ ไม่ใช้ในคำถามแท้เช่นนี้`],1:[`"No one" already means nobody, so the question would answer itself.`,`"no one" มีความหมายว่าไม่มีใครอยู่แล้ว คำถามจึงตอบตัวเอง`],3:[`"Everyone" means all the people, which does not fit a question about whether anybody is there.`,`"everyone" หมายถึงทุกคน จึงไม่เข้ากับคำถามที่ถามว่ามีใครอยู่หรือไม่`]}},{id:`T05-Q10`,s:`vocabulary`,k:`vocab-context`,q:`Please keep your ticket with you. The guard may ask to ____ it during the journey.`,c:[`buy`,`check`,`print`,`lose`],a:1,e:[`A guard looks at a ticket to make sure it is valid. "Check" means to look at something to see whether it is correct.`,`พนักงานตรวจตั๋วจะดูตั๋วเพื่อให้แน่ใจว่าถูกต้อง คำว่า "check" แปลว่าตรวจสอบว่าถูกต้องหรือไม่`],w:{0:[`The passenger has already bought the ticket, so the guard would not buy it.`,`ผู้โดยสารซื้อตั๋วมาแล้ว พนักงานจึงไม่ได้มาซื้อตั๋ว`],2:[`"Print" means to produce the ticket on paper, which happens before the journey.`,`"print" หมายถึงพิมพ์ตั๋วออกมา ซึ่งเกิดขึ้นก่อนการเดินทาง`],3:[`"Lose" is something a passenger does by accident, not something a guard asks for.`,`"lose" คือสิ่งที่ผู้โดยสารทำโดยไม่ตั้งใจ ไม่ใช่สิ่งที่พนักงานร้องขอ`]}},{id:`T05-Q11`,s:`vocabulary`,k:`phrasal-verbs`,q:`Could you ____ the television, please? I am trying to study for my exam.`,c:[`turn off`,`turn up`,`put on`,`get up`],a:0,e:[`Someone who is studying wants the television to stop. "Turn off" means to stop a machine from working.`,`คนที่กำลังอ่านหนังสือย่อมอยากให้โทรทัศน์หยุดทำงาน คำว่า "turn off" แปลว่าปิดเครื่องใช้ไฟฟ้า`],w:{1:[`"Turn up" makes the sound louder, which is the opposite of what is wanted.`,`"turn up" คือเพิ่มเสียงให้ดังขึ้น ซึ่งตรงข้ามกับสิ่งที่ต้องการ`],2:[`"Put on" means to start a machine or to dress in clothes.`,`"put on" หมายถึงเปิดเครื่องหรือสวมใส่เสื้อผ้า`],3:[`"Get up" means to rise from bed or from a chair.`,`"get up" หมายถึงลุกจากที่นอนหรือลุกจากเก้าอี้`]}},{id:`T05-Q12`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The advertisement said the new tablet was "lightweight". This means the tablet is ____.`,c:[`very expensive`,`easy to break`,`difficult to carry`,`not heavy`],a:3,e:[`"Lightweight" is made from "light" (the opposite of heavy) and "weight", so it describes something that does not weigh much.`,`คำว่า "lightweight" มาจาก "light" (ตรงข้ามกับหนัก) รวมกับ "weight" จึงหมายถึงสิ่งที่มีน้ำหนักไม่มาก`],w:{0:[`Price is a different idea; a lightweight tablet can be cheap or expensive.`,`ราคาเป็นคนละเรื่อง แท็บเล็ตที่เบาอาจมีราคาถูกหรือแพงก็ได้`],1:[`"Easy to break" would be "fragile", which is not the same as light.`,`"easy to break" ตรงกับคำว่า fragile ซึ่งไม่เหมือนกับเบา`],2:[`Something light is easier to carry, not harder.`,`สิ่งที่เบาย่อมพกพาง่ายขึ้น ไม่ใช่ยากขึ้น`]}},{id:`T05-Q13`,s:`vocabulary`,k:`collocations`,q:`Remember to ____ your seat belt before the plane takes off.`,c:[`tie`,`close`,`fasten`,`lock`],a:2,e:[`English uses a fixed pairing for this: you "fasten" a seat belt. Airline announcements always use this verb.`,`ภาษาอังกฤษใช้คำคู่กันแบบตายตัวว่า "fasten" a seat belt ซึ่งเป็นคำที่ประกาศบนเครื่องบินใช้เสมอ`],w:{0:[`"Tie" is used for shoelaces and rope, not for a belt with a buckle.`,`"tie" ใช้กับเชือกผูกรองเท้าและเชือกทั่วไป ไม่ใช้กับเข็มขัดที่มีหัวล็อก`],1:[`"Close" is used for doors, windows and books.`,`"close" ใช้กับประตู หน้าต่าง และหนังสือ`],3:[`"Lock" is used for doors and boxes that need a key.`,`"lock" ใช้กับประตูหรือกล่องที่ต้องใช้กุญแจ`]}},{id:`T05-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The website would not load because the internet ____ in the hotel was very weak.`,c:[`machine`,`screen`,`password`,`signal`],a:3,e:[`A "signal" is the strength of the connection a device receives. A weak signal explains why a page will not load.`,`คำว่า "signal" หมายถึงความแรงของสัญญาณที่อุปกรณ์รับได้ สัญญาณอ่อนจึงอธิบายได้ว่าทำไมหน้าเว็บจึงไม่โหลด`],w:{0:[`"Machine" is too general and is not described as strong or weak.`,`"machine" มีความหมายกว้างเกินไป และไม่ใช้บรรยายว่าแรงหรืออ่อน`],1:[`"Screen" is the part you look at; a screen is not weak or strong.`,`"screen" คือส่วนที่ใช้มอง จอภาพไม่มีความแรงหรืออ่อน`],2:[`A password is either right or wrong, not weak in this sense of connection.`,`รหัสผ่านมีแต่ถูกหรือผิด ไม่ได้อ่อนแรงในความหมายของการเชื่อมต่อ`]}},{id:`T05-Q15`,s:`conversation`,k:`conversation`,intro:`Officer: How long are you going to stay in Japan?
Traveller: ____`,q:`Choose the best reply for the traveller.`,c:[`For about ten days.`,`Since last Monday.`,`By plane, of course.`,`Yes, I am going to Japan.`],a:0,e:[`"How long…?" asks about a length of time, and "for + a period" is the natural way to answer.`,`คำถาม "How long…?" ถามถึงระยะเวลา และการตอบด้วย "for + ช่วงเวลา" เป็นรูปแบบที่เป็นธรรมชาติ`],w:{1:[`"Since" marks a starting point in the past, but the stay has not begun yet.`,`"since" บอกจุดเริ่มต้นในอดีต แต่การพักครั้งนี้ยังไม่เริ่ม`],2:[`This answers "How are you travelling?", not "How long…?".`,`ประโยคนี้ตอบคำถาม "How are you travelling?" ไม่ใช่ "How long…?"`],3:[`"Yes" cannot answer a question beginning with "How long".`,`คำว่า "Yes" ใช้ตอบคำถามที่ขึ้นต้นด้วย "How long" ไม่ได้`]}},{id:`T05-Q16`,s:`conversation`,k:`conversation`,intro:`Mook: That box looks really heavy. ____
Teacher: Thank you, that’s very kind of you.`,q:`Choose the best line for Mook.`,c:[`Do you carry it?`,`Shall I carry it for you?`,`You should carry it yourself.`,`Have you carried it before?`],a:1,e:[`The teacher thanks Mook, so Mook must have offered help. "Shall I…?" is the standard way to offer to do something.`,`ครูกล่าวขอบคุณมุก แสดงว่ามุกได้เสนอความช่วยเหลือ ประโยค "Shall I…?" เป็นรูปมาตรฐานของการเสนอตัวช่วยทำสิ่งใด`],w:{0:[`"Do you carry it?" asks about a habit and is not an offer.`,`"Do you carry it?" เป็นการถามถึงสิ่งที่ทำเป็นประจำ ไม่ใช่การเสนอความช่วยเหลือ`],2:[`This tells the teacher to do the work and would not be thanked.`,`ประโยคนี้บอกให้ครูทำเอง จึงไม่ได้รับคำขอบคุณ`],3:[`This asks about the past and offers nothing.`,`ประโยคนี้ถามถึงอดีตและไม่ได้เสนอความช่วยเหลือใด`]}},{id:`T05-Q17`,s:`conversation`,k:`conversation`,intro:`Teacher: Ploy, your essay was due yesterday.
Ploy: ____`,q:`Choose the best reply for Ploy.`,c:[`You are quite right about that.`,`Never mind, teacher.`,`I’m sorry. May I hand it in tomorrow morning?`,`I did not really want to write it.`],a:2,e:[`Ploy is at fault, so she should apologise and then politely ask for extra time. That is the natural and respectful reply.`,`พลอยเป็นฝ่ายผิด จึงควรกล่าวขอโทษแล้วขอเวลาเพิ่มอย่างสุภาพ ซึ่งเป็นคำตอบที่เป็นธรรมชาติและให้ความเคารพ`],w:{0:[`Agreeing without apologising ignores the problem.`,`การเห็นด้วยโดยไม่ขอโทษเป็นการมองข้ามปัญหา`],1:[`"Never mind" tells the teacher not to worry, which is not Ploy’s place to say.`,`"Never mind" เป็นการบอกครูว่าไม่ต้องกังวล ซึ่งไม่ใช่สิ่งที่พลอยควรพูด`],3:[`This gives a rude reason and offers no solution.`,`ประโยคนี้ให้เหตุผลที่ไม่สุภาพและไม่ได้เสนอทางแก้`]}},{id:`T05-Q18`,s:`conversation`,k:`conversation`,intro:`Receptionist: Dr. Suda is free at four o’clock on Thursday. ____
Patient: Yes, that suits me very well.`,q:`Choose the best line for the receptionist.`,c:[`Are you feeling ill?`,`Where do you live now?`,`How much would you like?`,`Would that be convenient?`],a:3,e:[`The patient replies "that suits me", so the receptionist must have asked whether the offered time is suitable.`,`ผู้ป่วยตอบว่า "that suits me" แสดงว่าพนักงานต้อนรับได้ถามว่าเวลาที่เสนอมาสะดวกหรือไม่`],w:{0:[`This asks about health, and "that suits me" would not answer it.`,`ประโยคนี้ถามเรื่องสุขภาพ ซึ่ง "that suits me" ไม่ใช่คำตอบที่เข้ากัน`],1:[`An address question would be answered with a place.`,`คำถามเรื่องที่อยู่ต้องตอบด้วยสถานที่`],2:[`This asks about a quantity or an amount of money, not about a time.`,`ประโยคนี้ถามถึงจำนวนหรือจำนวนเงิน ไม่ได้ถามเรื่องเวลา`]}},{id:`T05-Q19`,s:`reading`,k:`reading-main-idea`,p:`T05-P1`,q:`What is the passage mainly about?`,c:[`How mobile phones are designed and built in factories`,`Why families in Thailand change their phones so often`,`Why old phones should be recycled instead of thrown away`,`How gold is taken out of rock at a gold mine`],a:2,e:[`The passage explains the harm of throwing phones away, what happens when they are collected, and ends by telling readers to take old phones to a shop. That is one argument for recycling.`,`บทอ่านอธิบายอันตรายของการทิ้งโทรศัพท์ สิ่งที่เกิดขึ้นเมื่อมีการรับซื้อคืน และจบด้วยการบอกให้นำโทรศัพท์เก่าไปที่ร้าน ทั้งหมดคือการโน้มน้าวให้รีไซเคิล`],w:{0:[`Factories are mentioned only as the place the recycled metals go.`,`โรงงานถูกกล่าวถึงเพียงในฐานะปลายทางของโลหะที่รีไซเคิลแล้ว`],1:[`How often families change phones is one detail in the first line, not the main point.`,`ความถี่ในการเปลี่ยนโทรศัพท์เป็นเพียงรายละเอียดในบรรทัดแรก ไม่ใช่ประเด็นหลัก`],3:[`The gold mine appears only in a comparison, not as the topic.`,`เหมืองทองปรากฏเพียงในการเปรียบเทียบ ไม่ใช่หัวข้อของบทอ่าน`]}},{id:`T05-Q20`,s:`reading`,k:`reading-detail`,p:`T05-P1`,q:`Which metal in a phone can harm the soil and the water?`,c:[`Gold`,`Silver`,`Copper`,`Lead`],a:3,e:[`The second paragraph says the phone "also contains lead, which can harm the soil and the water".`,`ย่อหน้าที่สองระบุว่าโทรศัพท์ "also contains lead, which can harm the soil and the water" คือสารตะกั่ว`],w:{0:[`Gold is listed as one of the useful metals that can be recovered.`,`ทองถูกระบุว่าเป็นโลหะมีค่าที่นำกลับมาใช้ใหม่ได้`],1:[`Silver is also listed as a useful metal, not a harmful one.`,`เงินก็ถูกระบุว่าเป็นโลหะที่มีประโยชน์ ไม่ใช่โลหะที่เป็นอันตราย`],2:[`Copper is one of the metals sent to factories for reuse.`,`ทองแดงเป็นหนึ่งในโลหะที่ส่งไปโรงงานเพื่อนำกลับมาใช้ใหม่`]}},{id:`T05-Q21`,s:`reading`,k:`reading-detail`,p:`T05-P1`,q:`According to the passage, one tonne of old phones ____.`,c:[`costs more money than one tonne of rock`,`contains more gold than one tonne of rock from a mine`,`weighs much more than one tonne of rock`,`is far harder to carry than one tonne of rock`],a:1,e:[`The third paragraph says one tonne of old phones "can produce more gold than one tonne of rock from a gold mine".`,`ย่อหน้าที่สามระบุว่าโทรศัพท์เก่าหนึ่งตัน "can produce more gold than one tonne of rock from a gold mine"`],w:{0:[`The passage compares the gold produced, not the price of the material.`,`บทอ่านเปรียบเทียบปริมาณทองที่ได้ ไม่ได้เปรียบเทียบราคาของวัตถุดิบ`],2:[`Both amounts are one tonne, so their weight is the same.`,`ทั้งสองอย่างมีน้ำหนักหนึ่งตันเท่ากัน`],3:[`Difficulty of carrying is never discussed in the passage.`,`บทอ่านไม่ได้กล่าวถึงความยากในการขนย้ายเลย`]}},{id:`T05-Q22`,s:`reading`,k:`reading-vocab`,p:`T05-P1`,q:`In the last paragraph, a phone that is "forgotten" is one that is ____.`,c:[`left in a drawer and never used again`,`sold second-hand to another family`,`broken into small pieces by workers`,`sent to a factory to make new machines`],a:0,e:[`The last paragraph contrasts recycling with leaving the old phone "in a drawer", so a forgotten phone is one nobody uses or collects.`,`ย่อหน้าสุดท้ายเปรียบเทียบการรีไซเคิลกับการเก็บโทรศัพท์เก่าไว้ "in a drawer" โทรศัพท์ที่ถูกลืมจึงหมายถึงเครื่องที่ไม่มีใครใช้หรือนำไปรีไซเคิล`],w:{1:[`Selling the phone is not mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงการขายต่อโทรศัพท์`],2:[`Taking phones apart is what happens to recycled phones, the opposite of forgotten ones.`,`การแยกชิ้นส่วนเกิดขึ้นกับโทรศัพท์ที่ถูกรีไซเคิล ซึ่งตรงข้ามกับเครื่องที่ถูกลืม`],3:[`Going to a factory is also part of recycling, not of being forgotten.`,`การถูกส่งไปโรงงานก็เป็นส่วนหนึ่งของการรีไซเคิล ไม่ใช่การถูกลืม`]}},{id:`T05-Q23`,s:`reading`,k:`reading-detail`,p:`T05-P2`,q:`Which platform will the Hua Hin train leave from today?`,c:[`Platform 2`,`Platform 5`,`Platform 3`,`Platform 4`],a:1,e:[`The announcement says the train "will leave from Platform 5 today instead of Platform 3".`,`ประกาศระบุว่ารถไฟ "will leave from Platform 5 today instead of Platform 3" คือออกจากชานชาลาที่ 5`],w:{0:[`Platform 2 is never mentioned.`,`ไม่มีการกล่าวถึงชานชาลาที่ 2 เลย`],2:[`Platform 3 is the usual platform, but not today’s.`,`ชานชาลาที่ 3 เป็นชานชาลาปกติ แต่ไม่ใช่ของวันนี้`],3:[`Platform 4 does not appear in the announcement.`,`ชานชาลาที่ 4 ไม่ปรากฏในประกาศ`]}},{id:`T05-Q24`,s:`reading`,k:`reading-detail`,p:`T05-P2`,q:`Why is the train late today?`,c:[`Repair work is being done on the line`,`The train driver has not arrived yet`,`There are too many passengers waiting`,`Heavy rain has flooded the track`],a:0,e:[`The reason is given directly: "Because of repair work on the line near Nakhon Pathom."`,`เหตุผลระบุไว้โดยตรงว่า "Because of repair work on the line near Nakhon Pathom" คือมีงานซ่อมทางรถไฟ`],w:{1:[`The driver is not mentioned in the announcement.`,`ประกาศไม่ได้กล่าวถึงพนักงานขับรถ`],2:[`Passenger numbers are not given as a reason for the delay.`,`ไม่ได้ระบุว่าจำนวนผู้โดยสารเป็นสาเหตุของความล่าช้า`],3:[`No rain or flood is mentioned.`,`ไม่มีการกล่าวถึงฝนหรือน้ำท่วม`]}},{id:`T05-Q25`,s:`reading`,k:`reading-inference`,p:`T05-P2`,q:`What time will the train probably leave today?`,c:[`At 2:15`,`At 2:20`,`At 2:30`,`At 2:35`],a:3,e:[`The train is the 2:15 service and it will depart twenty minutes late. 2:15 plus 20 minutes is 2:35.`,`รถไฟขบวนนี้คือเที่ยว 14:15 น. และจะออกช้ากว่ากำหนด 20 นาที เมื่อบวก 20 นาทีจึงได้เวลา 14:35 น.`],w:{0:[`2:15 is the scheduled time before the delay was announced.`,`14:15 น. คือเวลาตามกำหนดเดิมก่อนมีการประกาศความล่าช้า`],1:[`2:20 would be only five minutes late, not twenty.`,`14:20 น. จะช้าเพียง 5 นาที ไม่ใช่ 20 นาที`],2:[`2:30 would be fifteen minutes late.`,`14:30 น. จะช้า 15 นาที`]}}]},{id:`test-06`,number:6,title:`Practice Test 6`,subtitle:`Standard Plus — Environment and Community`,tier:`standard-plus`,minutes:40,passages:[{id:`T06-P1`,kind:`Notice`,title:`Green Team Clean-Up Day — Saturday 9 March`,body:[`The Green Team invites every student, parent and teacher to join our clean-up of Khlong Bang Sai.`,`Meet at the school gate at 7:30 a.m. We will walk to the canal together and start work at 8:00 a.m. The clean-up finishes at 11:00 a.m.`,`Wear long trousers, closed shoes and a hat. Gloves and rubbish bags will be given to you at the canal. Please do not bring glass bottles.`,`Write your name on the list outside the staff room by Thursday 7 March so that we know how many pairs of gloves to prepare.`,`Last year 84 volunteers collected 320 bags of rubbish. This year we hope to do even better.`]},{id:`T06-P2`,kind:`Informational passage`,title:`The Bees in the School Garden`,body:[`Two years ago the fruit trees in our school garden produced very few mangoes. Our science teacher, Mr. Anan, believed he knew why: there were almost no bees left in the garden.`,`Bees carry pollen from one flower to another. Without this journey, most fruit trees cannot produce fruit at all. Mr. Anan explained that bees were disappearing because people were cutting down wild plants and using strong chemicals on their farms.`,`The school decided to help. Students planted a long row of sunflowers and other flowers along the fence, and the gardeners stopped spraying chemicals anywhere near them.`,`Last year the same trees produced three times as much fruit as before. The bees had come back — and so had the mangoes.`]}],questions:[{id:`T06-Q01`,s:`grammar`,k:`passive`,q:`The classroom windows ____ every Friday afternoon.`,c:[`clean`,`are cleaning`,`are cleaned`,`have cleaning`],a:2,e:[`The windows do not clean anything; somebody cleans them. When the subject receives the action we use the passive: are + past participle.`,`หน้าต่างไม่ได้เป็นผู้ทำความสะอาด แต่มีคนมาทำความสะอาดมัน เมื่อประธานเป็นผู้ถูกกระทำจึงใช้รูป passive คือ are + กริยาช่องที่ 3`],w:{0:[`"Clean" makes the windows the doer of the action, which is impossible.`,`"clean" ทำให้หน้าต่างกลายเป็นผู้กระทำ ซึ่งเป็นไปไม่ได้`],1:[`"Are cleaning" is active continuous and again makes the windows the doer.`,`"are cleaning" เป็นรูป active continuous ซึ่งทำให้หน้าต่างเป็นผู้กระทำอีกเช่นกัน`],3:[`"Have cleaning" is not a possible verb form in English.`,`รูป "have cleaning" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`T06-Q02`,s:`grammar`,k:`conditionals`,q:`If you ____ ice in a warm room, it melts.`,c:[`leave`,`will leave`,`left`,`are leaving`],a:0,e:[`This sentence states a scientific fact that is always true, so both clauses use the present simple. This pattern is the zero conditional.`,`ประโยคนี้บอกข้อเท็จจริงทางวิทยาศาสตร์ที่เป็นจริงเสมอ ทั้งสองอนุประโยคจึงใช้ present simple ซึ่งเรียกว่าประโยคเงื่อนไขแบบที่ 0`],w:{1:[`"Will" is not used inside an "if" clause in this pattern.`,`ไม่ใช้ "will" ในอนุประโยค if ของโครงสร้างนี้`],2:[`"Left" is a past form, but the main clause "melts" is present.`,`"left" เป็นรูปอดีต แต่ประโยคหลัก "melts" เป็นปัจจุบัน`],3:[`"Are leaving" describes one moment now, not a general truth.`,`"are leaving" บรรยายเหตุการณ์ในขณะนี้ ไม่ใช่ความจริงทั่วไป`]}},{id:`T06-Q03`,s:`grammar`,k:`relative-clauses`,q:`This is the machine ____ turns old plastic bottles into thread.`,c:[`who`,`which`,`whose`,`where`],a:1,e:[`The relative pronoun stands for "the machine", a thing acting as the subject of the clause, so "which" is correct.`,`คำสรรพนามเชื่อมความนี้แทน "the machine" ซึ่งเป็นสิ่งของและทำหน้าที่เป็นประธานของอนุประโยค จึงใช้ "which"`],w:{0:[`"Who" is only used for people.`,`"who" ใช้กับบุคคลเท่านั้น`],2:[`"Whose" shows possession and needs a noun after it.`,`"whose" ใช้แสดงความเป็นเจ้าของและต้องมีคำนามตามหลัง`],3:[`"Where" refers to a place, and a machine is not a place.`,`"where" ใช้แทนสถานที่ แต่เครื่องจักรไม่ใช่สถานที่`]}},{id:`T06-Q04`,s:`grammar`,k:`tenses`,q:`The Green Team ____ this beach every month for three years.`,c:[`clean`,`is cleaning`,`cleaned`,`has cleaned`],a:3,e:[`"For three years" shows an action that began in the past and is still going on, which needs the present perfect. "The Green Team" is singular, so it takes "has".`,`วลี "for three years" แสดงการกระทำที่เริ่มในอดีตและยังดำเนินอยู่ จึงต้องใช้ present perfect และ "The Green Team" เป็นเอกพจน์จึงใช้ "has"`],w:{0:[`"Clean" is present simple and does not show the three-year period up to now.`,`"clean" เป็น present simple ไม่ได้แสดงช่วงเวลาสามปีจนถึงปัจจุบัน`],1:[`"Is cleaning" describes this moment, not a repeated action over years.`,`"is cleaning" บรรยายสิ่งที่เกิดขึ้นขณะนี้ ไม่ใช่การกระทำซ้ำตลอดหลายปี`],2:[`"Cleaned" is past simple and would suggest the team has stopped.`,`"cleaned" เป็น past simple ซึ่งสื่อว่าทีมเลิกทำไปแล้ว`]}},{id:`T06-Q05`,s:`grammar`,k:`quantifiers`,q:`Only ____ of the rubbish on the beach was glass; most of it was plastic.`,c:[`a little`,`a few`,`many`,`several`],a:0,e:[`"Rubbish" is an uncountable noun, and the verb "was" confirms it. "A little" is the quantifier used with uncountable nouns.`,`"rubbish" เป็นคำนามนับไม่ได้ และกริยา "was" ก็ยืนยันเช่นนั้น คำบอกปริมาณที่ใช้กับคำนามนับไม่ได้คือ "a little"`],w:{1:[`"A few" is used with countable plural nouns, such as "a few bottles".`,`"a few" ใช้กับคำนามพหูพจน์ที่นับได้ เช่น "a few bottles"`],2:[`"Many" is also for countable nouns and would need a plural verb.`,`"many" ใช้กับคำนามนับได้เช่นกัน และต้องใช้กับกริยาพหูพจน์`],3:[`"Several" means more than a few and is only used with countable nouns.`,`"several" แปลว่าหลายอย่าง และใช้กับคำนามนับได้เท่านั้น`]}},{id:`T06-Q06`,s:`grammar`,k:`conjunctions`,q:`____ the rain was very heavy, the volunteers kept working until eleven o’clock.`,c:[`Because`,`So`,`Although`,`Unless`],a:2,e:[`Heavy rain would normally stop people working, but the volunteers continued. "Although" introduces a clause that goes against expectation.`,`ฝนที่ตกหนักมักทำให้คนหยุดทำงาน แต่อาสาสมัครยังทำต่อ คำว่า "although" ใช้ขึ้นต้นอนุประโยคที่ขัดกับสิ่งที่คาดไว้`],w:{0:[`"Because" would mean the rain was the reason they kept working, which makes no sense.`,`"because" จะทำให้ฝนกลายเป็นเหตุผลที่พวกเขาทำงานต่อ ซึ่งไม่สมเหตุสมผล`],1:[`"So" introduces a result and cannot begin the first clause like this.`,`"so" ใช้บอกผลลัพธ์ และขึ้นต้นอนุประโยคแรกในลักษณะนี้ไม่ได้`],3:[`"Unless" means "if not", which does not fit a fact that really happened.`,`"unless" แปลว่า "ถ้าไม่" จึงไม่เข้ากับเหตุการณ์ที่เกิดขึ้นจริง`]}},{id:`T06-Q07`,s:`grammar`,k:`comparisons`,q:`Walking is one of the ____ ways to travel around a busy city.`,c:[`cheap`,`cheaper`,`more cheap`,`cheapest`],a:3,e:[`The phrase "one of the …" is always followed by a superlative and a plural noun: one of the cheapest ways.`,`วลี "one of the …" ต้องตามด้วยคำคุณศัพท์ขั้นสุดและคำนามพหูพจน์เสมอ เช่น one of the cheapest ways`],w:{0:[`A plain adjective does not work after "one of the".`,`คำคุณศัพท์รูปปกติใช้หลัง "one of the" ไม่ได้`],1:[`A comparative compares two things and needs "than".`,`ขั้นกว่าใช้เปรียบเทียบสองสิ่งและต้องมี "than"`],2:[`Short adjectives never take "more"; the comparative is "cheaper".`,`คำคุณศัพท์พยางค์สั้นไม่ใช้ "more" รูปขั้นกว่าคือ "cheaper"`]}},{id:`T06-Q08`,s:`grammar`,k:`modals`,q:`We ____ save a lot of water at home simply by turning off the tap while we brush our teeth.`,c:[`must not`,`can`,`should not`,`may not`],a:1,e:[`The sentence describes what is possible to achieve, so "can" is the right modal for possibility or ability.`,`ประโยคนี้บอกสิ่งที่ทำได้ จึงต้องใช้ "can" ซึ่งเป็นกริยาช่วยที่แสดงความเป็นไปได้หรือความสามารถ`],w:{0:[`"Must not" forbids something, but saving water is being encouraged.`,`"must not" ใช้ห้าม แต่ประโยคนี้กำลังส่งเสริมให้ประหยัดน้ำ`],2:[`"Should not" advises against an action, which is the opposite meaning.`,`"should not" แนะนำว่าไม่ควรทำ ซึ่งมีความหมายตรงข้าม`],3:[`"May not" refuses permission and does not fit an encouraging statement.`,`"may not" คือการไม่อนุญาต จึงไม่เข้ากับประโยคที่ชักชวน`]}},{id:`T06-Q09`,s:`grammar`,k:`questions`,q:`____ many trees were planted in the park on Saturday?`,c:[`How`,`What`,`Which`,`Where`],a:0,e:[`"How many" is the question phrase used to ask about the number of countable things such as trees.`,`วลีคำถาม "How many" ใช้ถามจำนวนของสิ่งที่นับได้ เช่น ต้นไม้`],w:{1:[`"What many" is not an English question phrase.`,`วลี "What many" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Which" asks you to choose from a known set, as in "Which tree?".`,`"which" ใช้ให้เลือกจากกลุ่มที่รู้จักอยู่แล้ว เช่น "Which tree?"`],3:[`"Where" asks about a place, and the answer here would be a number.`,`"where" ถามสถานที่ แต่คำตอบของประโยคนี้ต้องเป็นจำนวน`]}},{id:`T06-Q10`,s:`vocabulary`,k:`vocab-context`,q:`Plastic bags take hundreds of years to ____, so they stay in the ground for a very long time.`,c:[`grow`,`float`,`burn`,`break down`],a:3,e:[`The second half of the sentence says the bags stay in the ground for a long time, so the missing verb must mean "fall apart into tiny pieces". "Break down" carries that meaning.`,`ประโยคส่วนหลังบอกว่าถุงยังคงอยู่ในดินเป็นเวลานาน คำกริยาที่หายไปจึงต้องหมายถึงการย่อยสลายเป็นชิ้นเล็ก ๆ ซึ่งตรงกับ "break down"`],w:{0:[`"Grow" means to become bigger, which plastic does not do.`,`"grow" แปลว่าเติบโตใหญ่ขึ้น ซึ่งพลาสติกไม่ได้เป็นเช่นนั้น`],1:[`"Float" describes staying on top of water, not disappearing over time.`,`"float" หมายถึงลอยอยู่บนผิวน้ำ ไม่ได้หมายถึงการสลายไปตามเวลา`],2:[`"Burn" happens quickly with fire and does not take hundreds of years.`,`"burn" เกิดขึ้นอย่างรวดเร็วด้วยไฟ ไม่ได้ใช้เวลาหลายร้อยปี`]}},{id:`T06-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The canal near our village used to be filthy, but now it is clean. "Filthy" means very ____.`,c:[`deep`,`narrow`,`dirty`,`cold`],a:2,e:[`"But now it is clean" tells us the canal used to be the opposite of clean. "Filthy" is a strong word for very dirty.`,`ข้อความ "but now it is clean" บอกว่าคลองเคยเป็นตรงข้ามกับสะอาด คำว่า "filthy" เป็นคำที่แปลว่าสกปรกมาก`],w:{0:[`"Deep" describes depth and does not contrast with "clean".`,`"deep" บอกความลึก และไม่ได้ตรงข้ามกับ "clean"`],1:[`"Narrow" describes width and has no link with cleanliness.`,`"narrow" บอกความแคบ ไม่เกี่ยวกับความสะอาด`],3:[`"Cold" describes temperature, not how dirty the water is.`,`"cold" บอกอุณหภูมิ ไม่ได้บอกความสกปรกของน้ำ`]}},{id:`T06-Q12`,s:`vocabulary`,k:`collocations`,q:`Our school is holding a concert to ____ money for the animal shelter.`,c:[`make`,`raise`,`take`,`bring`],a:1,e:[`"Raise money" is the fixed expression for collecting money for a good cause, such as a charity or a shelter.`,`"raise money" เป็นสำนวนตายตัวที่ใช้กับการระดมทุนเพื่อการกุศล เช่น มูลนิธิหรือสถานสงเคราะห์สัตว์`],w:{0:[`"Make money" means to earn a profit for yourself.`,`"make money" แปลว่าหาเงินเป็นกำไรให้ตนเอง`],2:[`"Take money" suggests removing money from someone.`,`"take money" สื่อถึงการเอาเงินไปจากผู้อื่น`],3:[`"Bring money" simply means to carry money with you.`,`"bring money" หมายถึงพกเงินติดตัวมาเท่านั้น`]}},{id:`T06-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`The volunteers ____ litter along the canal all morning and filled forty bags.`,c:[`picked up`,`picked out`,`picked on`,`picked at`],a:0,e:[`"Pick up" means to lift something from the ground with your hand — exactly what the volunteers were doing.`,`"pick up" แปลว่าหยิบสิ่งของขึ้นจากพื้นด้วยมือ ซึ่งตรงกับสิ่งที่อาสาสมัครทำ`],w:{1:[`"Pick out" means to choose one thing from several.`,`"pick out" แปลว่าเลือกสิ่งหนึ่งออกมาจากหลายสิ่ง`],2:[`"Pick on" means to treat someone unkindly again and again.`,`"pick on" แปลว่ารังแกหรือกลั่นแกล้งใครซ้ำ ๆ`],3:[`"Pick at" means to eat only a very small amount of food.`,`"pick at" แปลว่ากินอาหารเพียงเล็กน้อยแบบเขี่ย ๆ`]}},{id:`T06-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The town council has ____ a new rule about burning rubbish in gardens.`,c:[`refused`,`introduced`,`forgotten`,`borrowed`],a:1,e:[`A council makes new rules and starts using them. "Introduce" means to bring something new into use.`,`สภาเทศบาลเป็นผู้ออกกฎใหม่และเริ่มบังคับใช้ คำว่า "introduce" แปลว่านำสิ่งใหม่มาเริ่มใช้`],w:{0:[`"Refused" means said no to something, so no new rule would exist.`,`"refused" แปลว่าปฏิเสธ ซึ่งจะทำให้ไม่มีกฎใหม่เกิดขึ้น`],2:[`"Forgotten" cannot be followed by "a new rule" in this meaning.`,`"forgotten" ใช้กับ "a new rule" ในความหมายนี้ไม่ได้`],3:[`"Borrowed" means taking something to give back later, which does not apply to rules a council makes.`,`"borrowed" แปลว่ายืมมาแล้วต้องคืน ซึ่งใช้กับกฎที่สภาออกเองไม่ได้`]}},{id:`T06-Q15`,s:`conversation`,k:`conversation`,intro:`Neighbour: Excuse me, do you know when the recycling truck comes?
Boy: ____`,q:`Choose the best reply for the boy.`,c:[`I have three bags of paper at home.`,`You really should recycle more often.`,`It is a very big green truck.`,`I think it comes on Wednesday mornings.`],a:3,e:[`The question asks "when", so the answer must give a time or a day. "On Wednesday mornings" answers it directly.`,`คำถามถามว่า "when" คำตอบจึงต้องบอกเวลาหรือวัน ประโยค "on Wednesday mornings" ตอบตรงคำถาม`],w:{0:[`This talks about the speaker’s own rubbish instead of answering.`,`ประโยคนี้พูดถึงขยะของตนเอง ไม่ได้ตอบคำถาม`],1:[`This gives unwanted advice and sounds rude to a neighbour.`,`ประโยคนี้ให้คำแนะนำที่ไม่มีใครขอ และฟังดูไม่สุภาพต่อเพื่อนบ้าน`],2:[`This describes the truck, not the time it arrives.`,`ประโยคนี้บรรยายลักษณะรถ ไม่ได้บอกเวลาที่รถมา`]}},{id:`T06-Q16`,s:`conversation`,k:`conversation`,intro:`Nat: Our classroom is always so untidy after lunch.
Bell: ____`,q:`Choose the best reply for Bell.`,c:[`How about making a cleaning rota?`,`That is really not my problem at all.`,`Yes, it is certainly a classroom.`,`I am not untidy, thank you very much.`],a:0,e:[`Nat has raised a problem, so a helpful reply offers a solution. "How about + -ing?" is a natural way to make a suggestion.`,`ณัฐยกปัญหาขึ้นมา คำตอบที่ดีจึงควรเสนอทางแก้ โครงสร้าง "How about + -ing?" เป็นวิธีเสนอแนะที่เป็นธรรมชาติ`],w:{1:[`This refuses to help and ends the conversation unkindly.`,`ประโยคนี้เป็นการปฏิเสธที่จะช่วยและปิดบทสนทนาอย่างไม่เป็นมิตร`],2:[`This states an obvious fact and ignores the problem.`,`ประโยคนี้บอกสิ่งที่เห็นได้ชัดอยู่แล้วและมองข้ามปัญหา`],3:[`Nat did not blame Bell, so defending yourself does not fit.`,`ณัฐไม่ได้กล่าวโทษเบล การแก้ตัวจึงไม่เข้ากับบทสนทนา`]}},{id:`T06-Q17`,s:`conversation`,k:`conversation`,intro:`Poom: I’m afraid I forgot to bring the poster for our presentation.
Jar: ____`,q:`Choose the best reply for Jar.`,c:[`That is very kind of you.`,`You are most welcome to it.`,`Don’t worry. We can use mine instead.`,`Thank you very much for the poster.`],a:2,e:[`Poom is apologising for a mistake that affects them both, so the best reply calms him and offers a solution.`,`ภูมิกำลังขอโทษสำหรับความผิดพลาดที่กระทบทั้งคู่ คำตอบที่ดีที่สุดจึงควรปลอบใจและเสนอทางแก้`],w:{0:[`Forgetting a poster is not a kind act, so this makes no sense.`,`การลืมโปสเตอร์ไม่ใช่การกระทำที่มีน้ำใจ ประโยคนี้จึงไม่สมเหตุสมผล`],1:[`"You are welcome to it" offers something, but Poom has nothing to offer.`,`"You are welcome to it" เป็นการเสนอสิ่งของ แต่ภูมิไม่มีอะไรจะเสนอ`],3:[`There is no poster to thank Poom for.`,`ไม่มีโปสเตอร์ให้ต้องขอบคุณภูมิ`]}},{id:`T06-Q18`,s:`conversation`,k:`conversation`,intro:`Fern: We’re planting trees in the park on Sunday. Would you like to join us?
Golf: ____`,q:`Choose the best reply for Golf.`,c:[`No, thank you. I’d love to come.`,`Yes, I’d love to. What time shall I be there?`,`Yes, you would certainly like to.`,`I am planting trees on Sunday too, sorry.`],a:1,e:[`Golf accepts the invitation and then asks a practical question about the time — a natural, complete reply.`,`กอล์ฟตอบรับคำเชิญแล้วถามรายละเอียดเรื่องเวลา ซึ่งเป็นคำตอบที่ครบถ้วนและเป็นธรรมชาติ`],w:{0:[`"No, thank you" and "I’d love to come" contradict each other.`,`"No, thank you" กับ "I’d love to come" ขัดแย้งกันเอง`],2:[`This tells Fern what she likes, which does not answer the invitation.`,`ประโยคนี้บอกว่าเฟิร์นชอบอะไร ซึ่งไม่ได้ตอบคำเชิญ`],3:[`Saying sorry while agreeing to do the same activity is confusing.`,`การกล่าวขอโทษทั้งที่จะไปทำกิจกรรมเดียวกันทำให้สับสน`]}},{id:`T06-Q19`,s:`reading`,k:`reading-detail`,p:`T06-P1`,q:`What time does the clean-up work at the canal begin?`,c:[`At 8:00 a.m.`,`At 7:30 a.m.`,`At 11:00 a.m.`,`At 7:00 a.m.`],a:0,e:[`The notice says the volunteers meet at the school gate at 7:30 a.m., walk to the canal, and "start work at 8:00 a.m."`,`ประกาศระบุว่าอาสาสมัครนัดพบที่ประตูโรงเรียนเวลา 7:30 น. แล้วเดินไปที่คลอง และ "start work at 8:00 a.m." คือเริ่มงาน 8:00 น.`],w:{1:[`7:30 a.m. is the meeting time at the school gate, before the walk.`,`7:30 น. คือเวลานัดพบที่ประตูโรงเรียนก่อนออกเดิน`],2:[`11:00 a.m. is when the clean-up finishes.`,`11:00 น. คือเวลาที่การเก็บขยะสิ้นสุด`],3:[`7:00 a.m. does not appear in the notice at all.`,`เวลา 7:00 น. ไม่ปรากฏในประกาศเลย`]}},{id:`T06-Q20`,s:`reading`,k:`reading-detail`,p:`T06-P1`,q:`What will the volunteers be given when they reach the canal?`,c:[`Hats and long trousers`,`Gloves and rubbish bags`,`Glass bottles and drinking water`,`Closed shoes and a name list`],a:1,e:[`The third paragraph says, "Gloves and rubbish bags will be given to you at the canal."`,`ย่อหน้าที่สามระบุว่า "Gloves and rubbish bags will be given to you at the canal." คือได้รับถุงมือและถุงขยะ`],w:{0:[`Hats and long trousers are things volunteers must wear themselves.`,`หมวกและกางเกงขายาวเป็นสิ่งที่อาสาสมัครต้องเตรียมมาเอง`],2:[`The notice tells volunteers not to bring glass bottles.`,`ประกาศบอกว่าไม่ให้นำขวดแก้วมา`],3:[`Closed shoes must be worn, and the list is signed at school beforehand.`,`รองเท้าหุ้มส้นต้องสวมมาเอง ส่วนรายชื่อให้ลงไว้ที่โรงเรียนล่วงหน้า`]}},{id:`T06-Q21`,s:`reading`,k:`reading-inference`,p:`T06-P1`,q:`Why must students write their name on the list before Thursday?`,c:[`To show that they are members of the Green Team`,`To receive a prize on the day of the clean-up`,`To be allowed to leave school early on Friday`,`So that the right number of gloves can be prepared`],a:3,e:[`The notice gives the reason in the same sentence: "so that we know how many pairs of gloves to prepare."`,`ประกาศให้เหตุผลไว้ในประโยคเดียวกันว่า "so that we know how many pairs of gloves to prepare" คือเพื่อเตรียมถุงมือให้พอ`],w:{0:[`The clean-up is open to every student, parent and teacher, not just members.`,`กิจกรรมนี้เปิดให้นักเรียน ผู้ปกครอง และครูทุกคน ไม่ใช่เฉพาะสมาชิก`],1:[`No prize is mentioned anywhere in the notice.`,`ไม่มีการกล่าวถึงรางวัลในประกาศเลย`],2:[`Leaving school early is not mentioned; the event is on a Saturday.`,`ไม่มีการกล่าวถึงการกลับบ้านก่อนเวลา และกิจกรรมจัดในวันเสาร์`]}},{id:`T06-Q22`,s:`reading`,k:`reading-inference`,p:`T06-P1`,q:`What does the notice suggest about this year’s clean-up?`,c:[`Fewer volunteers are expected than last year.`,`The canal is already completely clean.`,`The organisers hope to collect more than 320 bags.`,`The event will last for the whole day.`],a:2,e:[`The last line gives last year’s total of 320 bags and adds, "This year we hope to do even better," which means collecting more.`,`บรรทัดสุดท้ายบอกยอดของปีที่แล้วคือ 320 ถุง แล้วเสริมว่า "This year we hope to do even better" ซึ่งหมายถึงเก็บให้ได้มากกว่าเดิม`],w:{0:[`"Do even better" suggests hoping for more help, not less.`,`"do even better" สื่อถึงความหวังว่าจะมีคนช่วยมากขึ้น ไม่ใช่น้อยลง`],1:[`If the canal were clean, there would be no need for a clean-up day.`,`ถ้าคลองสะอาดแล้ว ก็ไม่จำเป็นต้องจัดวันเก็บขยะ`],3:[`The times given are 8:00 a.m. to 11:00 a.m., which is one morning.`,`เวลาที่ระบุคือ 8:00–11:00 น. ซึ่งเป็นเพียงช่วงเช้าเท่านั้น`]}},{id:`T06-Q23`,s:`reading`,k:`reading-detail`,p:`T06-P2`,q:`According to Mr. Anan, why did the fruit trees produce very few mangoes?`,c:[`The soil in the garden had become too dry.`,`The gardeners had cut off too many branches.`,`Students had picked all the flowers.`,`There were almost no bees left in the garden.`],a:3,e:[`The first paragraph states Mr. Anan’s explanation directly: "there were almost no bees left in the garden."`,`ย่อหน้าแรกระบุคำอธิบายของครูอนันต์ไว้ตรง ๆ ว่า "there were almost no bees left in the garden"`],w:{0:[`Dry soil is never mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงดินแห้งเลย`],1:[`Cutting branches is not given as a reason anywhere in the text.`,`ข้อความไม่ได้ระบุว่าการตัดกิ่งเป็นสาเหตุ`],2:[`Students planted flowers; they did not pick them.`,`นักเรียนเป็นผู้ปลูกดอกไม้ ไม่ได้เด็ดดอกไม้`]}},{id:`T06-Q24`,s:`reading`,k:`reading-detail`,p:`T06-P2`,q:`Why were the bees disappearing?`,c:[`Because the weather had become much hotter`,`Because there were too many flowers for them`,`Because wild plants were cut down and strong chemicals were used`,`Because birds in the garden were eating them`],a:2,e:[`The second paragraph gives two causes: "people were cutting down wild plants and using strong chemicals on their farms."`,`ย่อหน้าที่สองระบุสองสาเหตุคือ "people were cutting down wild plants and using strong chemicals on their farms"`],w:{0:[`The weather is not mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงสภาพอากาศ`],1:[`More flowers help bees — that is why the school planted sunflowers.`,`ดอกไม้ที่มากขึ้นช่วยผึ้ง ซึ่งเป็นเหตุผลที่โรงเรียนปลูกทานตะวัน`],3:[`Birds are never mentioned in the text.`,`ข้อความไม่ได้กล่าวถึงนกเลย`]}},{id:`T06-Q25`,s:`reading`,k:`reading-inference`,p:`T06-P2`,q:`What happened after the school planted the flowers and stopped spraying chemicals?`,c:[`The fruit trees stopped growing completely.`,`The trees produced three times as much fruit.`,`The gardeners decided to leave the school.`,`The bees flew away from the garden again.`],a:1,e:[`The last paragraph says the same trees "produced three times as much fruit as before" and that the bees had come back.`,`ย่อหน้าสุดท้ายระบุว่าต้นไม้เดิม "produced three times as much fruit as before" และผึ้งก็กลับมา`],w:{0:[`The trees grew better, not worse.`,`ต้นไม้ให้ผลดีขึ้น ไม่ใช่แย่ลง`],2:[`The gardeners stayed; they simply changed how they worked.`,`คนสวนยังอยู่ เพียงแต่เปลี่ยนวิธีทำงาน`],3:[`The bees returned — that is the point of the last line.`,`ผึ้งกลับมา ซึ่งเป็นใจความสำคัญของบรรทัดสุดท้าย`]}}]},{id:`test-07`,number:7,title:`Practice Test 7`,subtitle:`Advanced — Science, Sport and Study`,tier:`advanced`,minutes:40,passages:[{id:`T07-P1`,kind:`Informational passage`,title:`Why Athletes Need Sleep`,body:[`Most students know that training makes muscles stronger. Fewer know that muscles do not actually grow during the training itself. They grow afterwards, while the athlete is resting — and especially while the athlete is asleep.`,`During deep sleep the body releases a chemical called growth hormone. This chemical repairs the tiny tears that hard exercise makes in muscle fibres. A young athlete who trains hard but sleeps only five hours a night may find that their strength stops improving, no matter how many hours they spend in the gym.`,`Sleep affects the mind as well as the body. In one study, a group of basketball players who increased their sleep to ten hours a night for five weeks became faster at sprinting and more accurate at shooting than a group who kept their usual habits.`,`Coaches now treat sleep as a part of training. As one of them put it, the hardest work an athlete does may be the work done with the eyes closed.`]},{id:`T07-P2`,kind:`School news report`,title:`Inter-School Athletics: Two Records and One Surprise`,body:[`Bang Phlu School sent 26 athletes to the district athletics meeting last weekend and came home with nine medals.`,`Two school records fell. Pim, who is only in Grade 6, ran the 800 metres in 2 minutes 41 seconds, beating a record that had stood for eleven years. In the long jump, Wit reached 4.62 metres.`,`The biggest surprise came in the final event. Our relay team had never finished higher than fourth in this competition, but this year they crossed the line in second place.`,`Miss Duangjai, the athletics teacher, said the team’s success came from training together every morning before school since May. "Nine medals is wonderful," she said, "but I am prouder of the fact that not one of them missed a single practice."`]}],questions:[{id:`T07-Q01`,s:`grammar`,k:`reported-speech`,intro:`Direct speech: "I am waiting for my results," said Kai.`,q:`Kai said that he ____ for his results.`,c:[`is waiting`,`was waiting`,`has waited`,`will wait`],a:1,e:[`When the reporting verb is in the past ("said"), the tense of the original words moves one step back. The present continuous "am waiting" becomes the past continuous "was waiting".`,`เมื่อกริยาที่ใช้เล่าเป็นรูปอดีต ("said") กาลของคำพูดเดิมต้องเลื่อนถอยไปหนึ่งขั้น รูป present continuous "am waiting" จึงกลายเป็น past continuous "was waiting"`],w:{0:[`"Is waiting" keeps the original tense; after "said" the tense must move back.`,`"is waiting" คงกาลเดิมไว้ แต่หลัง "said" กาลต้องเลื่อนถอยไป`],2:[`"Has waited" is the present perfect and changes the meaning of the original sentence.`,`"has waited" เป็น present perfect ซึ่งเปลี่ยนความหมายของประโยคเดิม`],3:[`"Will wait" points to the future, but Kai was waiting at the moment he spoke.`,`"will wait" ชี้ไปยังอนาคต แต่ไก่กำลังรออยู่ในขณะที่พูด`]}},{id:`T07-Q02`,s:`grammar`,k:`passive`,q:`The new sports hall ____ two years ago with money from the parents’ association.`,c:[`built`,`was building`,`has built`,`was built`],a:3,e:[`A hall cannot build itself, so the sentence needs the passive. "Two years ago" is a finished past time, so the past passive "was built" is correct.`,`หอประชุมสร้างตัวเองไม่ได้ ประโยคจึงต้องใช้รูป passive และเนื่องจาก "two years ago" เป็นอดีตที่จบแล้ว จึงใช้ passive รูปอดีตคือ "was built"`],w:{0:[`"Built" alone makes the hall the builder, which is impossible.`,`"built" ลำพังทำให้หอประชุมกลายเป็นผู้สร้าง ซึ่งเป็นไปไม่ได้`],1:[`"Was building" is active continuous and again makes the hall the doer.`,`"was building" เป็นรูป active continuous ซึ่งทำให้หอประชุมเป็นผู้กระทำอีกเช่นกัน`],2:[`"Has built" is active present perfect and does not fit "two years ago".`,`"has built" เป็น present perfect รูป active และไม่เข้ากับ "two years ago"`]}},{id:`T07-Q03`,s:`grammar`,k:`conditionals`,q:`If I ____ a little taller, I would try for the basketball team.`,c:[`am`,`will be`,`were`,`have been`],a:2,e:[`The main clause uses "would", which marks a second conditional — an imagined situation that is not true now. In this pattern the "if" clause uses the past form, and "were" is used for every subject.`,`ประโยคหลักใช้ "would" ซึ่งบ่งบอกว่าเป็นประโยคเงื่อนไขแบบที่ 2 คือสมมติสิ่งที่ไม่เป็นจริงในปัจจุบัน อนุประโยค if จึงใช้รูปอดีต และใช้ "were" กับประธานทุกตัว`],w:{0:[`"Am" would make this a real present situation, but "would" shows it is imagined.`,`"am" จะทำให้เป็นสถานการณ์จริงในปัจจุบัน แต่คำว่า "would" บอกว่าเป็นการสมมติ`],1:[`"Will" is never used inside an "if" clause of this kind.`,`ไม่ใช้ "will" ในอนุประโยค if ของโครงสร้างแบบนี้`],3:[`"Have been" is the present perfect and does not form a conditional with "would".`,`"have been" เป็น present perfect และใช้สร้างประโยคเงื่อนไขกับ "would" ไม่ได้`]}},{id:`T07-Q04`,s:`grammar`,k:`relative-clauses`,q:`The scientist ____ discovery changed medicine was almost unknown during her lifetime.`,c:[`whose`,`who`,`which`,`that`],a:0,e:[`The discovery belongs to the scientist, so the relative pronoun must show possession. "Whose" is the possessive relative pronoun and is followed directly by a noun.`,`การค้นพบนี้เป็นของนักวิทยาศาสตร์ คำสรรพนามเชื่อมความจึงต้องแสดงความเป็นเจ้าของ ซึ่งคือ "whose" และต้องตามด้วยคำนามทันที`],w:{1:[`"Who" is a subject pronoun and cannot be followed straight away by "discovery".`,`"who" เป็นสรรพนามประธาน จึงตามด้วยคำว่า "discovery" ทันทีไม่ได้`],2:[`"Which" refers to things, and it does not show possession.`,`"which" ใช้แทนสิ่งของ และไม่ได้แสดงความเป็นเจ้าของ`],3:[`"That" can replace who or which, but never shows possession.`,`"that" ใช้แทน who หรือ which ได้ แต่ไม่ได้แสดงความเป็นเจ้าของ`]}},{id:`T07-Q05`,s:`grammar`,k:`tenses`,q:`By the time the bell rang, Nut ____ all twenty questions.`,c:[`answers`,`was answering`,`has answered`,`had answered`],a:3,e:[`Two past events are described, and one finished before the other. The earlier action takes the past perfect: had answered.`,`ประโยคกล่าวถึงเหตุการณ์ในอดีตสองเหตุการณ์ โดยเหตุการณ์หนึ่งจบก่อนอีกเหตุการณ์ เหตุการณ์ที่เกิดก่อนจึงใช้ past perfect คือ had answered`],w:{0:[`"Answers" is present simple and does not match the past event "rang".`,`"answers" เป็น present simple ไม่สอดคล้องกับเหตุการณ์อดีต "rang"`],1:[`"Was answering" would mean he was still working when the bell rang.`,`"was answering" จะหมายความว่าเขายังทำอยู่ตอนที่ระฆังดัง`],2:[`"Has answered" connects to now, but both events are finished past events.`,`"has answered" เชื่อมโยงกับปัจจุบัน แต่ทั้งสองเหตุการณ์จบไปแล้วในอดีต`]}},{id:`T07-Q06`,s:`grammar`,k:`verb-patterns`,q:`The coach made the players ____ ten extra laps after the match.`,c:[`to run`,`run`,`running`,`ran`],a:1,e:[`After "make somebody", English uses the bare base form with no "to": make him run, make her wait.`,`หลังโครงสร้าง "make somebody" ภาษาอังกฤษใช้กริยารูปพื้นฐานโดยไม่มี "to" เช่น make him run, make her wait`],w:{0:[`"To run" follows verbs like "ask" or "tell", but not "make".`,`"to run" ใช้ตามกริยาอย่าง "ask" หรือ "tell" แต่ไม่ใช้กับ "make"`],2:[`The -ing form does not follow "make somebody" in this meaning.`,`รูป -ing ไม่ตามหลัง "make somebody" ในความหมายนี้`],3:[`"Ran" is a past form and cannot follow another verb here.`,`"ran" เป็นรูปอดีต จึงตามหลังกริยาอีกตัวในที่นี้ไม่ได้`]}},{id:`T07-Q07`,s:`grammar`,k:`agreement`,q:`The number of students who play badminton ____ increasing every year.`,c:[`is`,`are`,`have`,`were`],a:0,e:[`The subject is "the number", which is singular. The plural words "students who play badminton" only describe it, so the verb stays singular: is.`,`ประธานของประโยคคือ "the number" ซึ่งเป็นเอกพจน์ ส่วนคำพหูพจน์ "students who play badminton" เป็นเพียงส่วนขยาย กริยาจึงคงรูปเอกพจน์คือ is`],w:{1:[`"Are" agrees with "students", but "students" is not the subject of the sentence.`,`"are" สอดคล้องกับ "students" แต่ "students" ไม่ใช่ประธานของประโยค`],2:[`"Have" is plural and would also need a past participle to follow.`,`"have" เป็นพหูพจน์ และยังต้องตามด้วยกริยาช่องที่ 3`],3:[`"Were" is past and plural; the sentence describes a present trend.`,`"were" เป็นอดีตและพหูพจน์ แต่ประโยคนี้บรรยายแนวโน้มในปัจจุบัน`]}},{id:`T07-Q08`,s:`grammar`,k:`prepositions`,q:`Our team is very good ____ passing the ball quickly under pressure.`,c:[`in`,`on`,`at`,`for`],a:2,e:[`The fixed pattern is "good at + noun or -ing form": good at maths, good at passing.`,`โครงสร้างตายตัวคือ "good at + คำนามหรือรูป -ing" เช่น good at maths, good at passing`],w:{0:[`"Good in" is not used to describe a skill.`,`รูป "good in" ไม่ใช้บอกความสามารถ`],1:[`"Good on" is not standard English in this meaning.`,`รูป "good on" ไม่ใช่ภาษาอังกฤษมาตรฐานในความหมายนี้`],3:[`"Good for" means beneficial, as in "Exercise is good for you".`,`"good for" แปลว่ามีประโยชน์ เช่น "Exercise is good for you"`]}},{id:`T07-Q09`,s:`grammar`,k:`adjectives-adverbs`,q:`She trained ____ for six months and finally won a gold medal.`,c:[`hardly`,`more hardly`,`harder`,`hard`],a:3,e:[`The adverb of "hard" is also "hard". It describes putting in a lot of effort, which is what the sentence means.`,`คำวิเศษณ์ของ "hard" คือ "hard" เช่นเดียวกัน ใช้บรรยายการทุ่มเทความพยายาม ซึ่งตรงกับความหมายของประโยค`],w:{0:[`"Hardly" means "almost not". "She trained hardly" would mean she barely trained.`,`"hardly" แปลว่าแทบจะไม่ ประโยค "She trained hardly" จะหมายความว่าเธอแทบไม่ได้ซ้อมเลย`],1:[`"More hardly" is not used in English.`,`รูป "more hardly" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Harder" is a comparative and would need something to compare with.`,`"harder" เป็นขั้นกว่า ต้องมีสิ่งที่นำมาเปรียบเทียบ`]}},{id:`T07-Q10`,s:`vocabulary`,k:`vocab-context`,q:`The result was ____: nobody had expected the youngest runner in the race to win.`,c:[`obvious`,`usual`,`surprising`,`careful`],a:2,e:[`The colon explains the word: nobody expected this to happen. Something nobody expects is "surprising".`,`เครื่องหมายทวิภาคขยายความคำนั้นว่าไม่มีใครคาดคิดว่าจะเกิดขึ้น สิ่งที่ไม่มีใครคาดคิดคือ "surprising"`],w:{0:[`"Obvious" means easy to see or predict — the opposite of unexpected.`,`"obvious" แปลว่าเห็นได้ชัดหรือคาดเดาได้ ซึ่งตรงข้ามกับสิ่งที่ไม่คาดคิด`],1:[`"Usual" means it happens often, but this result was unexpected.`,`"usual" แปลว่าเกิดขึ้นเป็นปกติ แต่ผลครั้งนี้ไม่มีใครคาดคิด`],3:[`"Careful" describes how a person acts and cannot describe a race result.`,`"careful" บรรยายการกระทำของคน ใช้บรรยายผลการแข่งขันไม่ได้`]}},{id:`T07-Q11`,s:`vocabulary`,k:`synonyms-antonyms`,q:`The instructions were extremely brief — only two lines long. "Brief" is closest in meaning to ____.`,c:[`short`,`clear`,`strict`,`strange`],a:0,e:[`The dash explains the word: only two lines. "Brief" means using few words or lasting a short time.`,`เครื่องหมายขีดขยายความว่ามีเพียงสองบรรทัด คำว่า "brief" หมายถึงสั้น ใช้คำน้อย หรือกินเวลาไม่นาน`],w:{1:[`"Clear" means easy to understand; short instructions can still be confusing.`,`"clear" แปลว่าเข้าใจง่าย คำแนะนำที่สั้นก็อาจสับสนได้`],2:[`"Strict" describes rules that must be obeyed exactly.`,`"strict" ใช้กับกฎที่ต้องปฏิบัติตามอย่างเคร่งครัด`],3:[`"Strange" means unusual, which the length does not tell us.`,`"strange" แปลว่าแปลกประหลาด ซึ่งความสั้นไม่ได้บอกเรื่องนี้`]}},{id:`T07-Q12`,s:`vocabulary`,k:`collocations`,q:`If you want to improve, you must ____ an effort in every training session.`,c:[`do`,`make`,`take`,`give`],a:1,e:[`"Make an effort" is a fixed expression meaning to try hard. No other verb is used with "an effort" in this way.`,`"make an effort" เป็นสำนวนตายตัว แปลว่าพยายามอย่างเต็มที่ โดยไม่ใช้กริยาอื่นคู่กับ "an effort" ในลักษณะนี้`],w:{0:[`"Do an effort" is not used in English.`,`รูป "do an effort" ไม่มีใช้ในภาษาอังกฤษ`],2:[`"Take an effort" is not a natural collocation.`,`รูป "take an effort" ไม่เป็นคำคู่ที่ใช้กันจริง`],3:[`"Give an effort" is not standard; we say "make an effort".`,`รูป "give an effort" ไม่ใช่ภาษามาตรฐาน เราพูดว่า "make an effort"`]}},{id:`T07-Q13`,s:`vocabulary`,k:`phrasal-verbs`,q:`Don’t ____ now! You have almost finished the race.`,c:[`give in`,`give out`,`give away`,`give up`],a:3,e:[`"Give up" means to stop trying to do something. The second sentence encourages the runner to keep going.`,`"give up" แปลว่าเลิกล้มความพยายาม ประโยคที่สองเป็นการให้กำลังใจให้นักวิ่งทำต่อไป`],w:{0:[`"Give in" means to stop resisting and accept what someone else wants.`,`"give in" แปลว่ายอมแพ้ต่อความต้องการของผู้อื่น`],1:[`"Give out" means to hand something to many people, or to stop working.`,`"give out" แปลว่าแจกจ่ายให้หลายคน หรืออุปกรณ์หยุดทำงาน`],2:[`"Give away" means to hand something over for free.`,`"give away" แปลว่ายกสิ่งของให้ไปฟรี ๆ`]}},{id:`T07-Q14`,s:`vocabulary`,k:`vocab-context`,q:`The scientists carried out an ____ to find out whether plants can grow without soil.`,c:[`experiment`,`excuse`,`example`,`exercise`],a:0,e:[`A scientific test designed to find out whether something is true is an "experiment", and it pairs with the verb "carry out".`,`การทดสอบทางวิทยาศาสตร์เพื่อค้นหาว่าสิ่งใดจริงหรือไม่เรียกว่า "experiment" และใช้คู่กับกริยา "carry out"`],w:{1:[`An "excuse" is a reason you give when you have done something wrong.`,`"excuse" คือข้ออ้างที่ยกมาเมื่อทำสิ่งผิดพลาด`],2:[`An "example" is one case used to explain an idea, not a test.`,`"example" คือตัวอย่างที่ยกมาอธิบายความคิด ไม่ใช่การทดลอง`],3:[`An "exercise" is a practice task or physical activity.`,`"exercise" คือแบบฝึกหัดหรือการออกกำลังกาย`]}},{id:`T07-Q15`,s:`conversation`,k:`conversation`,intro:`Ink: I can’t understand question 5 at all.
Punn: ____`,q:`Choose the best reply for Punn.`,c:[`You never understand anything, do you?`,`Shall I go through it with you at break?`,`Question 5 is on page nine of the book.`,`I understood it perfectly well, thank you.`],a:1,e:[`Ink is admitting a difficulty, so a supportive reply offers help. "Shall I…?" is the natural way to offer to do something.`,`อิ๊งค์กำลังบอกว่าไม่เข้าใจ คำตอบที่ดีจึงควรเสนอความช่วยเหลือ ประโยค "Shall I…?" เป็นวิธีเสนอตัวช่วยที่เป็นธรรมชาติ`],w:{0:[`This criticises Ink instead of helping and is unkind.`,`ประโยคนี้ตำหนิอิ๊งค์แทนที่จะช่วยเหลือ และฟังดูไม่มีน้ำใจ`],2:[`Ink knows where the question is; the problem is understanding it.`,`อิ๊งค์รู้อยู่แล้วว่าโจทย์อยู่ตรงไหน ปัญหาคือไม่เข้าใจเนื้อหา`],3:[`This boasts about the speaker and offers no help.`,`ประโยคนี้เป็นการอวดตนเองและไม่ได้เสนอความช่วยเหลือ`]}},{id:`T07-Q16`,s:`conversation`,k:`conversation`,intro:`Coach: How is your ankle today?
Player: ____`,q:`Choose the best reply for the player.`,c:[`I twisted it last Saturday.`,`It happened during the second half.`,`It still hurts a little when I run.`,`My ankle is on my left leg.`],a:2,e:[`"How is your ankle today?" asks about its condition now, so the reply must describe how it feels at present.`,`คำถาม "How is your ankle today?" ถามถึงอาการในปัจจุบัน คำตอบจึงต้องบอกว่าตอนนี้รู้สึกอย่างไร`],w:{0:[`This answers "When did you hurt it?", which was not the question.`,`ประโยคนี้ตอบคำถาม "When did you hurt it?" ซึ่งไม่ใช่สิ่งที่ถูกถาม`],1:[`This also explains when the injury happened, not how it is now.`,`ประโยคนี้ก็อธิบายว่าอาการบาดเจ็บเกิดขึ้นเมื่อใด ไม่ได้บอกอาการปัจจุบัน`],3:[`This describes where the ankle is, which the coach already knows.`,`ประโยคนี้บอกว่าข้อเท้าอยู่ตรงไหน ซึ่งโค้ชรู้อยู่แล้ว`]}},{id:`T07-Q17`,s:`conversation`,k:`conversation`,intro:`Bam: Would you like to come to the science fair on Friday?
June: ____ I have a dentist appointment. Could we go on Saturday instead?`,q:`Choose the best line for June.`,c:[`Yes, certainly, thank you very much.`,`I would rather not go anywhere at all.`,`That sounds absolutely terrible, sorry.`,`I’m afraid I can’t on Friday.`],a:3,e:[`June gives a reason and suggests another day, so she is refusing Friday politely. "I’m afraid I can’t" is the standard polite refusal.`,`จูนให้เหตุผลและเสนอวันอื่น แสดงว่าเธอปฏิเสธวันศุกร์อย่างสุภาพ ประโยค "I’m afraid I can’t" เป็นการปฏิเสธอย่างสุภาพตามมาตรฐาน`],w:{0:[`Accepting contradicts the appointment and the request to change the day.`,`การตอบรับขัดแย้งกับนัดหมอฟันและการขอเปลี่ยนวัน`],1:[`This refuses everything, yet June then suggests going on Saturday.`,`ประโยคนี้ปฏิเสธทั้งหมด แต่จูนกลับเสนอให้ไปวันเสาร์`],2:[`This insults the invitation, which does not match the friendly suggestion that follows.`,`ประโยคนี้เป็นการดูถูกคำเชิญ ซึ่งไม่เข้ากับข้อเสนอที่เป็นมิตรที่ตามมา`]}},{id:`T07-Q18`,s:`conversation`,k:`conversation`,intro:`Teacher: For homework, do page 42, exercises B and C.
Student: ____`,q:`Choose the best reply for the student, who did not hear clearly.`,c:[`Sorry, could you say that again, please?`,`Yes, I have already finished all of it.`,`No, I don’t have any homework today.`,`That is really not my book at all.`],a:0,e:[`When you miss what someone said, the polite way to ask for a repetition is "Sorry, could you say that again, please?"`,`เมื่อฟังไม่ทันสิ่งที่มีคนพูด วิธีขอให้พูดซ้ำอย่างสุภาพคือ "Sorry, could you say that again, please?"`],w:{1:[`The homework has only just been set, so it cannot be finished.`,`การบ้านเพิ่งถูกสั่ง จึงยังทำเสร็จไม่ได้`],2:[`The teacher has just given homework, so this contradicts what was said.`,`ครูเพิ่งสั่งการบ้าน ประโยคนี้จึงขัดแย้งกับสิ่งที่พูดไป`],3:[`This is about ownership of a book and does not ask for a repetition.`,`ประโยคนี้พูดถึงเจ้าของหนังสือ ไม่ได้ขอให้พูดซ้ำ`]}},{id:`T07-Q19`,s:`reading`,k:`reading-main-idea`,p:`T07-P1`,q:`What is the main idea of the passage?`,c:[`Basketball players sprint faster than other athletes.`,`Time in the gym matters more than time in bed.`,`Growth hormone is only released during hard exercise.`,`Sleep is an essential part of an athlete’s training.`],a:3,e:[`Every paragraph supports one claim: muscles grow during rest, sleep repairs them, sleep improves performance, and coaches now treat sleep as training.`,`ทุกย่อหน้าสนับสนุนข้อสรุปเดียวกันคือ กล้ามเนื้อเติบโตขณะพัก การนอนช่วยซ่อมแซม การนอนทำให้เล่นได้ดีขึ้น และโค้ชถือว่าการนอนเป็นส่วนหนึ่งของการฝึก`],w:{0:[`The basketball players are one example in a study, not the topic.`,`นักบาสเกตบอลเป็นเพียงตัวอย่างในงานวิจัย ไม่ใช่หัวข้อของบทอ่าน`],1:[`The passage argues the opposite: gym hours alone are not enough.`,`บทอ่านให้เหตุผลตรงกันข้ามว่าการอยู่ในยิมเพียงอย่างเดียวไม่เพียงพอ`],2:[`Growth hormone is released during deep sleep, not during exercise.`,`ฮอร์โมนการเจริญเติบโตหลั่งออกมาระหว่างการนอนหลับลึก ไม่ใช่ระหว่างออกกำลังกาย`]}},{id:`T07-Q20`,s:`reading`,k:`reading-detail`,p:`T07-P1`,q:`According to the passage, when do muscles actually grow?`,c:[`While the athlete is resting and asleep`,`While the athlete is training in the gym`,`Only during the first hour of exercise`,`Only after five weeks of hard training`],a:0,e:[`The first paragraph says muscles "grow afterwards, while the athlete is resting — and especially while the athlete is asleep."`,`ย่อหน้าแรกระบุว่ากล้ามเนื้อ "grow afterwards, while the athlete is resting — and especially while the athlete is asleep"`],w:{1:[`The passage states clearly that muscles do not grow during training itself.`,`บทอ่านระบุชัดเจนว่ากล้ามเนื้อไม่ได้เติบโตระหว่างการฝึกซ้อม`],2:[`No first hour of exercise is mentioned anywhere.`,`ไม่มีการกล่าวถึงชั่วโมงแรกของการออกกำลังกายเลย`],3:[`Five weeks refers to the length of the basketball study.`,`ห้าสัปดาห์คือระยะเวลาของงานวิจัยเรื่องนักบาสเกตบอล`]}},{id:`T07-Q21`,s:`reading`,k:`reading-detail`,p:`T07-P1`,q:`What happened to the basketball players in the study?`,c:[`They slept less and still became stronger.`,`They stopped training for five whole weeks.`,`They sprinted faster and shot more accurately.`,`They became too tired to finish their matches.`],a:2,e:[`The third paragraph says the players who slept ten hours a night "became faster at sprinting and more accurate at shooting".`,`ย่อหน้าที่สามระบุว่านักกีฬาที่นอนคืนละสิบชั่วโมง "became faster at sprinting and more accurate at shooting"`],w:{0:[`They increased their sleep; they did not sleep less.`,`พวกเขานอนมากขึ้น ไม่ได้นอนน้อยลง`],1:[`The study changed their sleep, not their training.`,`งานวิจัยเปลี่ยนแปลงเรื่องการนอน ไม่ใช่การฝึกซ้อม`],3:[`Their performance improved rather than getting worse.`,`ผลการเล่นของพวกเขาดีขึ้น ไม่ได้แย่ลง`]}},{id:`T07-Q22`,s:`reading`,k:`reading-inference`,p:`T07-P1`,q:`What does the coach mean by "the work done with the eyes closed"?`,c:[`Training without watching the ball`,`Sleeping`,`Closing your eyes to concentrate before a match`,`Resting quietly between two matches`],a:1,e:[`The whole passage argues that sleep does the repair work, so the coach is calling sleep itself a form of hard work.`,`ทั้งบทอ่านชี้ว่าการนอนคือช่วงที่ร่างกายซ่อมแซมตัวเอง โค้ชจึงเรียกการนอนว่าเป็นการทำงานหนักรูปแบบหนึ่ง`],w:{0:[`Nothing in the passage discusses training without looking.`,`บทอ่านไม่ได้กล่าวถึงการฝึกซ้อมโดยไม่มองเลย`],2:[`Concentration before a match is not mentioned in the text.`,`ข้อความไม่ได้กล่าวถึงการรวบรวมสมาธิก่อนแข่ง`],3:[`Resting between matches is not the same as the deep sleep the passage describes.`,`การพักระหว่างแมตช์ไม่เหมือนกับการนอนหลับลึกที่บทอ่านกล่าวถึง`]}},{id:`T07-Q23`,s:`reading`,k:`reading-detail`,p:`T07-P2`,q:`How long had the 800-metre record stood before Pim broke it?`,c:[`Two years`,`Nine years`,`Eleven years`,`Twenty-six years`],a:2,e:[`The second paragraph says Pim beat "a record that had stood for eleven years".`,`ย่อหน้าที่สองระบุว่าพิมทำลาย "a record that had stood for eleven years" คือสถิติที่ยืนยงมา 11 ปี`],w:{0:[`"2 minutes 41 seconds" is her time, not a number of years.`,`"2 นาที 41 วินาที" คือเวลาที่เธอทำได้ ไม่ใช่จำนวนปี`],1:[`Nine is the number of medals the school won.`,`เก้าคือจำนวนเหรียญที่โรงเรียนได้รับ`],3:[`Twenty-six is the number of athletes the school sent.`,`ยี่สิบหกคือจำนวนนักกีฬาที่โรงเรียนส่งไป`]}},{id:`T07-Q24`,s:`reading`,k:`reading-inference`,p:`T07-P2`,q:`What was Miss Duangjai most proud of?`,c:[`The nine medals the school brought home`,`The fact that nobody missed a single practice`,`Pim’s new record in the 800 metres`,`The relay team finishing in second place`],a:1,e:[`She says the medals are wonderful, "but I am prouder of the fact that not one of them missed a single practice". The word "prouder" marks her real answer.`,`เธอบอกว่าเหรียญรางวัลนั้นยอดเยี่ยม "but I am prouder of the fact that not one of them missed a single practice" คำว่า "prouder" ชี้ถึงสิ่งที่เธอภูมิใจที่สุดจริง ๆ`],w:{0:[`She calls the medals wonderful but says she is prouder of something else.`,`เธอบอกว่าเหรียญรางวัลยอดเยี่ยม แต่ระบุว่าภูมิใจสิ่งอื่นมากกว่า`],2:[`Pim’s record is reported by the writer, not chosen by Miss Duangjai.`,`สถิติของพิมเป็นสิ่งที่ผู้เขียนรายงาน ไม่ใช่สิ่งที่ครูดวงใจเลือก`],3:[`The relay result is called the biggest surprise, not her greatest pride.`,`ผลของทีมผลัดถูกเรียกว่าเป็นเรื่องน่าประหลาดใจที่สุด ไม่ใช่สิ่งที่เธอภูมิใจที่สุด`]}},{id:`T07-Q25`,s:`reading`,k:`reading-reference`,p:`T07-P2`,q:`In the last sentence, the word "them" refers to ____.`,c:[`the members of the team`,`the nine medals`,`the morning practices`,`the other schools`],a:0,e:[`You cannot miss a practice unless you are a person, so "not one of them" must refer to the athletes Miss Duangjai has been talking about.`,`สิ่งที่จะขาดซ้อมได้ต้องเป็นคน ดังนั้น "not one of them" จึงหมายถึงนักกีฬาที่ครูดวงใจกล่าวถึง`],w:{1:[`Medals cannot attend or miss a practice.`,`เหรียญรางวัลไม่สามารถมาซ้อมหรือขาดซ้อมได้`],2:[`The practices are the thing that was not missed, not the ones missing it.`,`การซ้อมคือสิ่งที่ไม่ถูกขาด ไม่ใช่ผู้ที่ขาดซ้อม`],3:[`Other schools are never mentioned as taking part in her team’s practices.`,`ไม่มีการกล่าวถึงโรงเรียนอื่นว่ามาร่วมซ้อมกับทีมของเธอ`]}}]},{id:`test-08`,number:8,title:`Practice Test 8`,subtitle:`Advanced — Culture and Communication`,tier:`advanced`,minutes:40,passages:[{id:`T08-P1`,kind:`Email`,title:`Exchange visit from Hikari School, Japan`,meta:[[`To`,`Parents of Grade 6 students`],[`From`,`Miss Nutcha, Head of English`],[`Subject`,`Exchange visit from Hikari School, Japan`]],body:[`Dear Parents,`,`From 12 to 19 August our school will welcome 30 students and 4 teachers from Hikari School in Osaka.`,`We are looking for 30 families who can host one student each for the week. Host families provide breakfast and dinner, a bed and a quiet place to study. Lunch is served at school. The visiting students speak some English but very little Thai, so this is an excellent chance for your child to practise.`,`If you would like to host a student, please complete the form at the school office by Friday 18 Ju
