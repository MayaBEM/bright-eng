Receptionist: ____`,q:`Choose the best reply for the receptionist.`,c:[`Certainly. May I have your room number, please?`,`You must check out at twelve o’clock.`,`I check you out right now.`,`Yes, you would like that.`],a:0,e:`เมื่อแขกแจ้งว่าต้องการเช็คเอาต์ พนักงานต้องตอบรับแล้วขอข้อมูลที่จำเป็น เช่น หมายเลขห้อง ซึ่งทำให้บทสนทนาเดินหน้าต่อได้`,m:`สำนวน I’d like to… เป็นการแจ้งความต้องการ ไม่ใช่คำถาม จึงไม่ควรตอบด้วย Yes / No เพียงอย่างเดียว`},{id:`arena-s06-q13`,s:`conversation`,k:`situational-english`,intro:`Teacher: You’ve missed two piano lessons this month.
Student: ____`,q:`Choose the best reply for the student.`,c:[`That is not true at all.`,`Yes, I have missed them.`,`I’m really sorry. I had extra maths classes on those two days.`,`Never mind. I may miss some more.`],a:2,e:`เมื่อครูทักเรื่องการขาดเรียน คำตอบที่เหมาะสมคือขอโทษแล้วอธิบายเหตุผลสั้น ๆ ซึ่งแสดงความรับผิดชอบ`,m:`การตอบเพียงว่า Yes, I have missed them. เป็นความจริงแต่ไม่ได้แสดงความรับผิดชอบ จึงไม่ใช่คำตอบที่ดีที่สุดในบทสนทนา`},{id:`arena-s06-q14`,s:`conversation`,k:`situational-english`,intro:`Nan: The meeting has been moved to Thursday at half past three.
Pim: ____`,q:`Pim did not hear clearly. Choose her best reply.`,c:[`Repeat that.`,`Sorry, would you mind saying that again?`,`What you say to me?`,`I don’t hear you. Speak!`],a:1,e:`การขอให้พูดซ้ำอย่างสุภาพใช้ Sorry, would you mind saying that again? หรือ Could you repeat that, please? ส่วนประโยคคำสั่งห้วน ๆ ถือว่าไม่สุภาพ`,m:`Would you mind + V-ing เป็นสำนวนขอร้องที่สุภาพมาก ให้จำรูป -ing หลัง mind`},{id:`arena-s06-q15`,s:`conversation`,k:`situational-english`,intro:`You see a woman carrying a heavy suitcase up the station steps.`,q:`What is the most natural thing to say?`,c:[`You must carry it by yourself.`,`Give me your suitcase now.`,`Do you want that I help you?`,`Excuse me — would you like me to help you with that?`],a:3,e:`การเสนอความช่วยเหลือกับคนแปลกหน้าควรเริ่มด้วย Excuse me แล้วใช้สำนวนสุภาพ Would you like me to…? ซึ่งเปิดโอกาสให้อีกฝ่ายปฏิเสธได้`,m:`รูป Do you want that I help you? เป็นการแปลตรงตัวจากภาษาแม่ ภาษาอังกฤษต้องใช้ want me to help you`},{id:`arena-s06-q16`,s:`cloze`,k:`cloze-linking`,p:`S06-C`,intro:`Blank (16)`,q:`____ the club is popular now, it almost closed two years ago, when only three students signed up.`,c:[`Because`,`However`,`Despite`,`Although`],a:3,e:`สองข้อความขัดแย้งกัน (ตอนนี้นิยม แต่เกือบปิดไปเมื่อสองปีก่อน) และช่องว่างตามด้วยประโยคเต็ม จึงต้องใช้ Although`,m:`Despite ต้องตามด้วยคำนาม ส่วน However ต้องมีเครื่องหมายวรรคตอนคั่นและไม่เชื่อมสองประโยคในรูปนี้`},{id:`arena-s06-q17`,s:`cloze`,k:`cloze-grammar`,p:`S06-C`,intro:`Blank (17)`,q:`Ms. Pranee suggested that each programme ____ a two-minute item in English.`,c:[`include`,`is including`,`includes`,`has included`],a:0,e:`หลัง suggest that ภาษาอังกฤษใช้กริยารูปพื้นฐานเสมอ ไม่ว่าประธานจะเป็นเอกพจน์หรือพหูพจน์ จึงใช้ include (เทียบเท่ากับ should include)`,m:`กลุ่มกริยาที่ใช้รูปนี้ได้แก่ suggest, recommend, insist, demand ตามด้วย that + ประธาน + กริยารูปพื้นฐาน`},{id:`arena-s06-q18`,s:`cloze`,k:`cloze-grammar`,p:`S06-C`,intro:`Blank (18)`,q:`Several of them have asked ____ they can join.`,c:[`that`,`what`,`whether`,`which`],a:2,e:`ประโยคนี้เป็นคำถามทางอ้อมแบบ yes / no จึงต้องใช้ whether (หรือ if) เชื่อม ส่วน that ใช้กับประโยคบอกเล่า`,m:`ask + whether / if ใช้เมื่อคำถามเดิมตอบว่าใช่หรือไม่ใช่ แต่ ask + what / where ใช้เมื่อคำถามเดิมมี wh-word`},{id:`arena-s06-q19`,s:`cloze`,k:`cloze-grammar`,p:`S06-C`,intro:`Blank (19)`,q:`If I ____ that lesson earlier, my first broadcast would have been far less embarrassing.`,c:[`learnt`,`had learnt`,`have learnt`,`would learn`],a:1,e:`ส่วนหลังของประโยคคือ would have been ซึ่งเป็นเงื่อนไขแบบที่ 3 (พูดถึงอดีตที่เปลี่ยนไม่ได้) อนุประโยค if จึงต้องใช้ Past Perfect คือ had learnt`,m:`จำคู่กันว่า If + had + V3, would have + V3 และห้ามใช้ would ในอนุประโยค if`},{id:`arena-s06-q20`,s:`reading`,k:`reading-main-idea`,p:`S06-R1`,q:`Which sentence best sums up the whole passage?`,c:[`Students in Thailand study harder than students elsewhere.`,`Screens are the only reason why children sleep badly.`,`Doctors should visit schools more often.`,`Sleep supports learning, and simple habits can protect it.`],a:3,e:`บทอ่านอธิบายว่าการนอนช่วยให้สมองจัดเก็บสิ่งที่เรียนมา แล้วปิดท้ายด้วยนิสัยสามข้อที่ช่วยให้นอนหลับดีขึ้น ใจความสำคัญจึงรวมทั้งสองส่วน`,m:`ย่อหน้าเรื่องแสงสีฟ้าเป็นเพียงรายละเอียดหนึ่ง ไม่ใช่ใจความสำคัญของทั้งบทความ`},{id:`arena-s06-q21`,s:`reading`,k:`reading-detail`,p:`S06-R1`,q:`According to the passage, what does the brain do while we sleep?`,c:[`It stops working completely.`,`It sorts what we have met and keeps the useful parts.`,`It produces a blue light of its own.`,`It repeats the day’s lessons out loud.`],a:1,e:`ย่อหน้าที่สองเขียนว่า the brain sorts through everything we have met during the day and keeps the most useful parts in the memory`,m:`blue light มาจากหน้าจอ ไม่ใช่จากสมอง ระวังตัวเลือกที่หยิบคำจากบทอ่านมาสลับหน้าที่`},{id:`arena-s06-q22`,s:`reading`,k:`reading-purpose`,p:`S06-R1`,q:`Why does the writer mention the student who studies until two in the morning?`,c:[`To show that more study time does not always mean better memory`,`To prove that students should never study at night`,`To explain that two o’clock is the best time to study`,`To argue that doctors do not understand students`],a:0,e:`ตัวอย่างนี้ถูกนำมาเทียบกับเพื่อนที่เลิกอ่านตอนสี่ทุ่มแล้วนอนเต็มอิ่ม ผู้เขียนจึงใช้เพื่อแสดงว่าเวลาอ่านที่มากกว่าไม่ได้แปลว่าจำได้ดีกว่า`,m:`คำถามว่า "ผู้เขียนยกตัวอย่างนี้ทำไม" ต้องดูว่าตัวอย่างนั้นสนับสนุนประเด็นใดในย่อหน้าเดียวกัน`},{id:`arena-s06-q23`,s:`reading`,k:`reading-detail`,p:`S06-R2`,q:`How much would a student pay to attend both camps?`,c:[`8,700 baht`,`8,000 baht`,`8,200 baht`,`7,700 baht`],a:2,e:`ราคารวมคือ 3,900 + 4,800 = 8,700 บาท แล้วหักส่วนลดสำหรับผู้จองสองค่ายอีก 500 บาท จึงเหลือ 8,200 บาท`,m:`ส่วนลดถูกซ่อนไว้ในบรรทัดล่างสุด ไม่ได้อยู่ในตาราง ให้อ่านข้อความประกอบทุกครั้ง`},{id:`arena-s06-q24`,s:`reading`,k:`reading-inference`,p:`S06-R2`,q:`Kan is twelve years old and wants to try photography. Which camp can he join?`,c:[`Pine Hill Camp only`,`Baan Rim Nam Camp only`,`Both camps`,`Neither camp`],a:0,e:`การถ่ายภาพมีเฉพาะที่ Pine Hill และค่ายนั้นรับอายุ 11–14 ปี กานอายุ 12 ปีจึงเข้าได้ ส่วน Baan Rim Nam แม้จะรับอายุ 9–12 ปี แต่ไม่มีกิจกรรมถ่ายภาพ`,m:`ข้อสอบแบบตารางเปรียบเทียบมักต้องใช้เงื่อนไขสองอย่างพร้อมกัน คืออายุและกิจกรรม`},{id:`arena-s06-q25`,s:`reading`,k:`reading-purpose`,p:`S06-R2`,q:`Why does the advertisement include the line "Places left"?`,c:[`To show which camp is cheaper`,`To explain how many teachers will go`,`To encourage students to book quickly`,`To tell students how many buses there are`],a:2,e:`การบอกจำนวนที่นั่งที่เหลือ (โดยเฉพาะ Pine Hill ที่เหลือเพียง 2 ที่) เป็นเทคนิคของโฆษณาที่กระตุ้นให้ผู้อ่านรีบตัดสินใจจอง`,m:`คำถามเรื่องจุดประสงค์ให้คิดว่า "ผู้เขียนอยากให้ผู้อ่านทำอะไรหลังอ่านบรรทัดนี้"`}]},{id:7,title:`EP Challenge`,level:`advanced`,minutes:38,focus:`Academic vocabulary, inversion and opinion texts.`,passages:[{id:`S07-C`,kind:`Cloze passage`,title:`The Water Project`,body:[`When our class began a project on water use, we assumed the answer would be simple: use less water. __(16)__, after three weeks of measuring, we discovered that the timing of the watering mattered almost as much as the amount.`,`Each group measured the soil in a small plot twice a day. Plots watered at noon lost far more water to the sun than __(17)__ watered at six in the morning. By the end of the month the early plots had used almost a fifth less water while producing the same number of leaves.`,`Our teacher encouraged us __(18)__ the results at the district science fair. Standing in front of the judges was frightening, but explaining a graph we had drawn ourselves made the numbers feel like ours. __(19)__ we won nothing that day, the project changed the way I look at the water running from a tap.`]},{id:`S07-R1`,kind:`Biography`,title:`The Motorcycle Library`,body:[`Kanya Prasert grew up in a small district of Nan province in the late 1960s. Her village had no library, and the nearest bookshop was two hours away by bus. She later said that the only book in her house had been a school atlas with three pages missing.`,`After training as a teacher, she returned to the same district in 1993. Within a year she had begun what her neighbours called "the motorcycle library". Every Saturday she loaded two metal boxes of books onto her motorcycle and rode between six villages, exchanging the books the children had finished for others they had not yet read.`,`The service was never officially funded. Teachers gave her their old textbooks, a rice merchant paid for the petrol, and a carpenter built shelves in a spare room behind the temple. By 2010 the collection had grown to more than nine thousand books, and the room behind the temple had become a proper library with two paid staff.`,`Kanya retired in 2019. When a journalist asked what she was most proud of, she did not mention the number of books. She answered that the children who had once waited for her motorcycle now brought their own children to the library on Saturday mornings.`]},{id:`S07-R2`,kind:`Article`,title:`Should the School Day Begin Later?`,body:[`Every few years somebody suggests that schools should begin an hour later. The argument is simple and, in my view, quite convincing.`,`Most secondary schools open their gates before half past seven. Students in large cities often leave home in the dark and spend an hour or more in traffic. A survey carried out at one Bangkok school last year found that 62 per cent of Grade 6 students slept fewer than eight hours on a school night.`,`Those who oppose a later start point out that parents must travel to work early, and that a later finish would cut into the time available for sport and extra classes. These are real difficulties, not excuses.`,`Yet other countries have found workable answers. Some schools open the library and the canteen early for students whose parents must drop them off before lessons begin. Others shorten the lunch break by fifteen minutes so that the day still ends at the usual hour. Neither solution is perfect, but both deserve a trial in at least one Thai school.`]}],questions:[{id:`arena-s07-q01`,s:`vocabulary`,k:`academic-vocab`,q:`The report began with a brief ____ of the experiment before the detailed results.`,c:[`conclusion`,`reference`,`solution`,`summary`],a:3,e:`สิ่งที่อยู่ "ก่อน" ผลการทดลองอย่างละเอียดคือบทสรุปย่อของงาน คำว่า summary แปลว่า บทสรุปย่อ ส่วน conclusion คือข้อสรุปที่ได้ตอนท้าย`,m:`summary (สรุปเนื้อหา) มักอยู่ต้นรายงาน ส่วน conclusion (ข้อสรุปจากผล) อยู่ท้ายรายงาน คำว่า before ในโจทย์เป็นเบาะแสสำคัญ`},{id:`arena-s07-q02`,s:`vocabulary`,k:`vocab-context`,q:`Although the museum guide spoke for a whole hour, her talk was never ____; every story ended with a surprise.`,c:[`tedious`,`complicated`,`formal`,`sincere`],a:0,e:`คำว่า Although แสดงความขัดแย้ง คือ พูดนานถึงหนึ่งชั่วโมงแต่ไม่ทำให้เบื่อ คำว่า tedious แปลว่า น่าเบื่อ ซึ่งเข้ากับโครงสร้างขัดแย้งนี้`,v:`tedious = น่าเบื่อ ยืดยาด, sincere = จริงใจ`},{id:`arena-s07-q03`,s:`vocabulary`,k:`phrasal-verbs`,q:`The organisers had to ____ the outdoor concert because of the storm warning.`,c:[`call for`,`call off`,`call on`,`call up`],a:1,e:`call off แปลว่า ยกเลิก ซึ่งตรงกับสถานการณ์ที่มีคำเตือนพายุ`,v:`call off = ยกเลิก, call for = เรียกร้อง/ต้องการ, call on = แวะเยี่ยม, call up = โทรหา`},{id:`arena-s07-q04`,s:`vocabulary`,k:`word-choice`,q:`The new timetable has had a positive ____ on attendance.`,c:[`affect`,`affection`,`effective`,`effect`],a:3,e:`ตำแหน่งหลัง a positive ต้องเป็นคำนาม คำนามที่แปลว่า "ผลกระทบ" คือ effect ส่วน affect เป็นคำกริยาที่แปลว่า ส่งผลต่อ`,m:`จำว่า affect = กริยา (ส่งผลต่อ), effect = คำนาม (ผลที่เกิดขึ้น) เช่น The rain affected the game. / The rain had an effect on the game.`},{id:`arena-s07-q05`,s:`grammar`,k:`relative-clauses`,q:`Mr Anan, ____ daughter won the science prize, will speak at Monday’s assembly.`,c:[`who`,`which`,`whose`,`whom`],a:2,e:`ช่องว่างแสดงความเป็นเจ้าของ คือ ลูกสาว "ของ" นายอนันต์ จึงต้องใช้ whose ซึ่งเป็นคำสรรพนามเชื่อมความแสดงความเป็นเจ้าของ`,m:`หลัง whose ต้องตามด้วยคำนามทันทีเสมอ ส่วน who / whom ตามด้วยกริยาหรือประธาน`},{id:`arena-s07-q06`,s:`grammar`,k:`verb-patterns`,q:`I clearly remember ____ the door before we left, so somebody else must have opened it.`,c:[`to lock`,`locking`,`lock`,`locked`],a:1,e:`remember + V-ing แปลว่า จำได้ว่าเคยทำสิ่งนั้นไปแล้ว ส่วน remember + to + verb แปลว่า จำได้ว่าต้องทำ (ยังไม่ได้ทำ) ในที่นี้เขาล็อกไปแล้วจึงใช้ locking`,m:`กลุ่มกริยาที่ความหมายเปลี่ยนตามรูปที่ตามมา ได้แก่ remember, forget, stop, try`},{id:`arena-s07-q07`,s:`grammar`,k:`modals`,q:`The classroom lights are still on. Someone ____ forgotten to switch them off.`,c:[`can have`,`should have`,`would have`,`must have`],a:3,e:`must have + V3 ใช้สรุปเหตุการณ์ในอดีตอย่างมั่นใจจากหลักฐานที่เห็นในปัจจุบัน (ไฟยังเปิดอยู่) จึงแปลว่า "คงจะลืมปิดแน่ ๆ"`,m:`should have + V3 แปลว่า "ควรจะทำแต่ไม่ได้ทำ" ซึ่งเป็นการตำหนิ ไม่ใช่การคาดเดา`},{id:`arena-s07-q08`,s:`grammar`,k:`sentence-structure`,q:`Rarely ____ such an enthusiastic audience at a school concert.`,c:[`have we seen`,`we have seen`,`did we saw`,`we saw`],a:0,e:`เมื่อขึ้นต้นประโยคด้วยคำปฏิเสธหรือกึ่งปฏิเสธ เช่น Rarely, Seldom, Never ต้องสลับกริยาช่วยมาไว้หน้าประธาน จึงได้ Rarely have we seen…`,m:`กลุ่มคำที่ทำให้เกิด inversion ได้แก่ Never, Rarely, Seldom, Hardly, Not only`},{id:`arena-s07-q09`,s:`grammar`,k:`passive-voice`,q:`The new sports hall ____ to be finished before December.`,c:[`expects`,`is expecting`,`is expected`,`has expected`],a:2,e:`หอประชุมกีฬาเป็นสิ่งที่ "ถูกคาดหวัง" ไม่ได้คาดหวังเอง จึงต้องใช้รูป passive คือ is expected to + verb`,m:`โครงสร้างรายงานข่าวที่พบบ่อยคือ is expected to / is believed to / is said to ตามด้วยกริยารูปพื้นฐาน`},{id:`arena-s07-q10`,s:`grammar`,k:`conditionals`,q:`____ you hand in the permission form today, you will not be able to join the trip.`,c:[`If`,`Although`,`Whether`,`Unless`],a:3,e:`Unless มีความหมายเท่ากับ if… not คือ "ถ้าไม่…" ประโยคนี้จึงแปลว่า ถ้าไม่ส่งใบอนุญาตวันนี้ จะไปทัศนศึกษาไม่ได้`,m:`ห้ามใช้ not ซ้ำหลัง unless เพราะ unless มีความหมายปฏิเสธอยู่ในตัวแล้ว`},{id:`arena-s07-q11`,s:`grammar`,k:`error-identification`,intro:`Every one of the exhibits were carefully labelled by the students who designed them.`,q:`Which underlined part of the sentence above is WRONG?`,c:[`Every one of the exhibits`,`were carefully labelled`,`by the students`,`who designed them`],a:1,e:`ประธานของประโยคคือ Every one ซึ่งเป็นเอกพจน์ แม้จะตามด้วย of the exhibits ที่เป็นพหูพจน์ กริยาจึงต้องเป็น was carefully labelled`,m:`วลี of + คำนามพหูพจน์ ไม่เปลี่ยนความเป็นเอกพจน์ของประธาน เช่น Each of the boys is…, One of my friends lives…`},{id:`arena-s07-q12`,s:`conversation`,k:`situational-english`,intro:`In a restaurant
Customer: Excuse me. We ordered the soup nearly half an hour ago.
Waiter: ____`,q:`Choose the best reply for the waiter.`,c:[`I’m very sorry about the delay. I’ll check with the kitchen straight away.`,`Yes, you ordered it half an hour ago.`,`You should have ordered something quicker.`,`Our soup always takes a long time.`],a:0,e:`เมื่อลูกค้าร้องเรียนเรื่องความล่าช้า พนักงานควรขอโทษก่อนแล้วเสนอการแก้ไขทันที ซึ่งเป็นมาตรฐานของภาษาบริการ`,m:`การอธิบายว่า "ซุปของเราใช้เวลานาน" เป็นการแก้ตัวโดยไม่แก้ปัญหา จึงไม่ใช่คำตอบที่ดีที่สุด`},{id:`arena-s07-q13`,s:`conversation`,k:`situational-english`,intro:`Ploy: Shall we meet at six, or would seven suit you better?
May: ____`,q:`Choose the best reply for May.`,c:[`Yes, we shall meet together.`,`Six or seven, I don’t mind you.`,`I will meet you at the time.`,`Seven would be better for me, if that’s all right.`],a:3,e:`คำถามให้เลือกระหว่างสองเวลา จึงต้องเลือกอย่างใดอย่างหนึ่งแล้วตอบอย่างสุภาพ เช่น Seven would be better for me, if that’s all right.`,m:`คำถามแบบ A or B ตอบว่า Yes หรือ No ไม่ได้ ต้องระบุตัวเลือก`},{id:`arena-s07-q14`,s:`conversation`,k:`situational-english`,intro:`Nat: I’m afraid I’ve damaged one of your library books.

Student: ____`,q:`Choose the best reply for the student.`,c:[`Because my parents told me to come here today.`,`I’d like to study science in English and take part in debating.`,`I want because English is a language.`,`My English is much better than my classmates’.`],a:1,e:`คำถามสัมภาษณ์ต้องการเหตุผลที่เป็นรูปธรรมและเกี่ยวกับตัวผู้เรียนเอง คำตอบที่ระบุเป้าหมายชัดเจน (เรียนวิทยาศาสตร์เป็นภาษาอังกฤษและร่วมชมรมโต้วาที) จึงดีที่สุด`,m:`การตอบว่า "พ่อแม่ให้มา" หรือการเปรียบเทียบตนเองเหนือเพื่อน ล้วนไม่ใช่คำตอบที่ดีในการสัมภาษณ์`},{id:`arena-s07-q16`,s:`cloze`,k:`cloze-linking`,p:`S07-C`,intro:`Blank (16)`,q:`____, after three weeks of measuring, we discovered that the timing of the watering mattered almost as much as the amount.`,c:[`However`,`Therefore`,`Moreover`,`Otherwise`],a:0,e:`ประโยคก่อนหน้าบอกว่าทีมคิดว่าคำตอบคงง่าย แต่สิ่งที่ค้นพบกลับต่างออกไป จึงต้องใช้คำเชื่อมแสดงความขัดแย้งคือ However`,m:`Therefore แสดงผลลัพธ์ ส่วน Moreover ใช้เพิ่มข้อมูลในทิศทางเดียวกัน ทั้งสองคำจึงขัดกับความหมายของย่อหน้านี้`},{id:`arena-s07-q17`,s:`cloze`,k:`cloze-reference`,p:`S07-C`,intro:`Blank (17)`,q:`Plots watered at noon lost far more water to the sun than ____ watered at six in the morning.`,c:[`that`,`those`,`them`,`ones`],a:1,e:`คำที่ถูกอ้างถึงคือ plots ซึ่งเป็นพหูพจน์ และทำหน้าที่แทนคำนามในการเปรียบเทียบ จึงใช้ those (= the plots)`,m:`ใช้ that แทนคำนามเอกพจน์ และ those แทนคำนามพหูพจน์ ในประโยคเปรียบเทียบเสมอ`},{id:`arena-s07-q18`,s:`cloze`,k:`cloze-grammar`,p:`S07-C`,intro:`Blank (18)`,q:`Our teacher encouraged us ____ the results at the district science fair.`,c:[`presenting`,`present`,`presented`,`to present`],a:3,e:`กริยา encourage ใช้โครงสร้าง encourage + กรรม + to + verb จึงได้ encouraged us to present`,m:`กลุ่มเดียวกันได้แก่ advise, allow, persuade, remind ซึ่งทั้งหมดตามด้วย to + verb`},{id:`arena-s07-q19`,s:`cloze`,k:`cloze-linking`,p:`S07-C`,intro:`Blank (19)`,q:`____ we won nothing that day, the project changed the way I look at the water running from a tap.`,c:[`Because`,`So that`,`Even though`,`In case`],a:2,e:`สองข้อความขัดแย้งกัน คือ ไม่ได้รางวัลเลย แต่โครงงานกลับเปลี่ยนมุมมองของผู้เขียน จึงใช้ Even though ที่แปลว่า แม้ว่า`},{id:`arena-s07-q20`,s:`reading`,k:`reading-detail`,p:`S07-R1`,q:`What did Kanya do every Saturday after 1994?`,c:[`She taught lessons in six village schools.`,`She carried books by motorcycle between villages.`,`She sold second-hand books in the nearest town.`,`She built shelves in the room behind the temple.`],a:1,e:`ย่อหน้าที่สองเขียนว่าทุกวันเสาร์เธอบรรทุกกล่องหนังสือสองใบไว้บนมอเตอร์ไซค์แล้วขี่ไปตามหกหมู่บ้านเพื่อสับเปลี่ยนหนังสือให้เด็ก ๆ`,m:`ช่างไม้เป็นผู้สร้างชั้นหนังสือ ไม่ใช่กัญญา ระวังตัวเลือกที่สลับผู้กระทำ`},{id:`arena-s07-q21`,s:`reading`,k:`reading-inference`,p:`S07-R1`,q:`What does paragraph 3 suggest about the motorcycle library?`,c:[`It received money from the government each year.`,`It was more successful than the district schools.`,`It depended on help from ordinary people.`,`It closed as soon as the temple room opened.`],a:2,e:`ย่อหน้าที่สามบอกว่าโครงการไม่เคยได้รับงบประมาณอย่างเป็นทางการ แต่ครูให้หนังสือเก่า พ่อค้าข้าวจ่ายค่าน้ำมัน และช่างไม้ทำชั้นวางให้ แสดงว่าอาศัยความช่วยเหลือจากคนธรรมดา`,m:`ประโยค never officially funded เป็นกุญแจสำคัญ ตัวเลือกเรื่องงบประมาณรัฐจึงขัดกับบทอ่านโดยตรง`},{id:`arena-s07-q22`,s:`reading`,k:`reading-purpose`,p:`S07-R1`,q:`Why does the writer include Kanya’s answer to the journalist?`,c:[`To show that she valued lasting change more than numbers`,`To explain exactly how many books the library owned`,`To prove that she disliked speaking to journalists`,`To suggest that she had forgotten the early years`],a:0,e:`ผู้เขียนเน้นว่าเธอ "ไม่ได้พูดถึงจำนวนหนังสือ" แต่พูดถึงเด็กรุ่นเก่าที่พาลูกของตนมาห้องสมุด ซึ่งแสดงว่าเธอให้ค่ากับการเปลี่ยนแปลงที่ยั่งยืนมากกว่าตัวเลข`,m:`ประโยคที่เริ่มด้วยการปฏิเสธ (she did not mention…) มักตามด้วยสิ่งที่ผู้เขียนต้องการเน้นจริง ๆ`},{id:`arena-s07-q23`,s:`reading`,k:`reading-fact-opinion`,p:`S07-R2`,q:`Which statement from the passage is a FACT rather than an opinion?`,c:[`The argument is simple and quite convincing.`,`Neither solution is perfect.`,`Both deserve a trial in at least one Thai school.`,`A survey found that 62 per cent of Grade 6 students slept fewer than eight hours.`],a:3,e:`ข้อเท็จจริงคือข้อความที่ตรวจสอบได้ ผลสำรวจที่ระบุตัวเลข 62 เปอร์เซ็นต์จึงเป็นข้อเท็จจริง ส่วนคำว่า convincing, perfect และ deserve ล้วนเป็นการประเมินค่าของผู้เขียน`,m:`ให้มองหาตัวเลข วันที่ หรือผลการสำรวจ เพราะเป็นสัญญาณของข้อเท็จจริง ส่วนคำแสดงการตัดสินคุณค่าเป็นสัญญาณของความคิดเห็น`},{id:`arena-s07-q24`,s:`reading`,k:`reading-inference`,p:`S07-R2`,q:`What is the writer’s attitude towards the arguments against a later start?`,c:[`They are genuine problems that deserve an answer.`,`They are excuses made by parents who are too busy.`,`They prove that the idea can never work.`,`They matter less than the time needed for extra classes.`],a:0,e:`ย่อหน้าที่สามจบด้วยประโยค These are real difficulties, not excuses. ซึ่งแสดงว่าผู้เขียนยอมรับว่าข้อคัดค้านเป็นปัญหาจริง แล้วจึงเสนอทางแก้ในย่อหน้าถัดไป`,m:`ผู้เขียนบอกตรง ๆ ว่า "ไม่ใช่ข้ออ้าง" ตัวเลือกที่ใช้คำว่า excuses จึงขัดกับบทอ่าน`},{id:`arena-s07-q25`,s:`reading`,k:`reading-conclusion`,p:`S07-R2`,q:`What does the writer conclude in the last paragraph?`,c:[`Thai schools should copy other countries exactly.`,`Every school should change its start time next year.`,`At least one school should test the idea first.`,`The survey results should not be trusted.`],a:2,e:`ประโยคสุดท้ายเขียนว่า both deserve a trial in at least one Thai school ซึ่งเป็นข้อเสนอให้ทดลองในโรงเรียนอย่างน้อยหนึ่งแห่งก่อน ไม่ใช่เปลี่ยนทั้งระบบทันที`,m:`คำว่า trial (การทดลอง) และ at least one เป็นตัวจำกัดขอบเขตของข้อสรุป อย่าขยายความเกินกว่าที่ผู้เขียนพูด`}]},{id:8,title:`Top School Challenge`,level:`advanced-plus`,minutes:38,focus:`Participle openings, mixed conditionals and applying written rules.`,passages:[{id:`S08-C`,kind:`Cloze passage`,title:`My Grandmother’s Loom`,body:[`Every December my grandmother sets up her wooden loom on the veranda. She has been weaving since she was fourteen, and her hands move so quickly that visitors often ask her to slow __(16)__ so that they can follow the pattern.`,`Last year she agreed to teach me. I had imagined that the hardest part would be the weaving itself; in fact it was the counting. A single mistake in the first row is repeated __(17)__ the whole cloth, and by the time you notice it, hours of work must be undone.`,`__(18)__ three months of evening lessons I finished a scarf that was, my grandmother said kindly, "almost straight". She keeps it in the cupboard beside her own first piece — a small square of blue cotton she made in 1961, which nobody __(19)__ allowed to touch.`]},{id:`S08-R1`,kind:`Environment article`,title:`The Chart Outside the Canteen`,body:[`Every day the kitchen of a large school produces a bin of peelings, shells and rice that nobody eats. In most schools this waste is collected with everything else and buried. Buried food waste rots without air and releases methane, a gas that traps heat far more effectively than carbon dioxide.`,`Three years ago the kitchen staff at a school in Nonthaburi began separating food waste into blue bins. Grade 5 students weigh the bins each morning and write the figures on a chart outside the canteen. In the first term the school threw away an average of 41 kilograms of food a day; last term the average was 26.`,`Part of the fall came from composting, but the largest change was less expected. Once the daily figure appeared on a public chart, students began taking smaller portions and finishing what they had taken. The kitchen also learned which dishes were regularly left uneaten and stopped cooking two of them.`,`The head of the kitchen is careful not to claim too much. "We have not solved anything," she says. "We have simply started measuring."`]},{id:`S08-R2`,kind:`Announcement`,title:`The Ruam Jai Music Scholarship`,body:[`The scholarship is open to students entering Grade 7 in the coming academic year.`,`Applicants must have studied one instrument for at least two years; provide a recording of two contrasting pieces lasting no more than eight minutes in total; attach a short letter of 150 to 200 words explaining what music has taught them; and be recommended by one teacher who is not a member of their family.`,`Recordings must be sent by 15 March. Applicants who reach the second round will be invited to play in person on 4 April. Those who cannot attend on that date should say so in their letter, and an alternative time will be arranged where possible.`,`The scholarship covers the cost of lessons for two years. It does not cover the cost of an instrument.`]}],questions:[{id:`arena-s08-q01`,s:`vocabulary`,k:`academic-vocab`,q:`Scientists must be able to ____ their results before the findings are published.`,c:[`verify`,`invent`,`imagine`,`announce`],a:0,e:`verify แปลว่า ตรวจสอบให้แน่ใจว่าถูกต้อง ซึ่งเป็นขั้นตอนที่ต้องทำก่อนเผยแพร่ผลงาน ส่วน announce คือการประกาศ ซึ่งเกิดขึ้นภายหลัง`,v:`verify = ตรวจสอบยืนยันความถูกต้อง, findings = ผลการค้นพบ`},{id:`arena-s08-q02`,s:`vocabulary`,k:`vocab-context`,q:`The instructions were deliberately ____, so that each team could interpret the task in its own way.`,c:[`strict`,`precise`,`vague`,`urgent`],a:2,e:`ผลที่ตามมาคือแต่ละทีมตีความโจทย์ได้ต่างกัน แสดงว่าคำสั่งจงใจไม่ระบุชัด คำว่า vague แปลว่า คลุมเครือ ซึ่งตรงข้ามกับ precise`,m:`คำว่า deliberately (โดยตั้งใจ) บอกว่าความคลุมเครือนี้เป็นความตั้งใจ ไม่ใช่ความผิดพลาด`,v:`vague = คลุมเครือ, precise = แม่นยำชัดเจน`},{id:`arena-s08-q03`,s:`vocabulary`,k:`collocations`,q:`Please ____ into account the weather forecast when you plan the outdoor rehearsal.`,c:[`bring`,`make`,`put`,`take`],a:3,e:`สำนวน take something into account แปลว่า นำสิ่งนั้นมาพิจารณาด้วย เป็นวลีตายตัวที่ใช้ take เท่านั้น`,m:`สำนวนใกล้เคียงคือ take something into consideration ซึ่งใช้ take เช่นกัน`},{id:`arena-s08-q04`,s:`vocabulary`,k:`synonyms`,q:`Rainfall was abundant that year. "Abundant" is closest in meaning to ____.`,c:[`scarce`,`plentiful`,`expensive`,`artificial`],a:1,e:`abundant แปลว่า มีอยู่มากมาย จึงมีความหมายเดียวกับ plentiful ส่วน scarce แปลว่า ขาดแคลน ซึ่งตรงข้ามกัน`,v:`abundant = อุดมสมบูรณ์, scarce = ขาดแคลน หายาก`},{id:`arena-s08-q05`,s:`grammar`,k:`sentence-structure`,q:`____ by the sudden noise, the birds rose from the rice field.`,c:[`Startling`,`To startle`,`They startled`,`Startled`],a:3,e:`นกเป็นฝ่าย "ถูกทำให้ตกใจ" จึงต้องใช้กริยาช่องที่ 3 ขึ้นต้นวลี (past participle phrase) ซึ่งมีความหมายเท่ากับ Because they were startled by the sudden noise`,m:`Startling (V-ing) แปลว่าเป็นฝ่ายทำให้ตกใจ ซึ่งกลับความหมาย ให้ถามว่าประธานเป็นผู้กระทำหรือผู้ถูกกระทำ`},{id:`arena-s08-q06`,s:`grammar`,k:`modals`,q:`You ____ have told me earlier; I could have changed the booking.`,c:[`must`,`can`,`should`,`would`],a:2,e:`should have + V3 ใช้ตำหนิสิ่งที่ควรทำในอดีตแต่ไม่ได้ทำ ประโยคนี้จึงแปลว่า "เธอควรจะบอกฉันเร็วกว่านี้"`,m:`must have + V3 = คงจะทำไปแล้วแน่ ๆ (คาดเดา) ส่วน should have + V3 = ควรทำแต่ไม่ได้ทำ (ตำหนิ)`},{id:`arena-s08-q07`,s:`grammar`,k:`relative-clauses`,q:`The candidates ____ for the scholarship must submit two references.`,c:[`applying`,`apply`,`which apply`,`are applying`],a:0,e:`นี่คืออนุประโยคขยายนามแบบลดรูป (reduced relative clause) ซึ่งย่อมาจาก who are applying จึงเหลือเพียง applying`,m:`which ใช้กับสิ่งของ ไม่ใช้กับ candidates ที่เป็นคน และประโยคนี้มีกริยาหลักอยู่แล้วคือ must submit`},{id:`arena-s08-q08`,s:`grammar`,k:`conditionals`,q:`If she had caught the earlier train, she ____ here by now.`,c:[`would have been`,`would be`,`will be`,`would been`],a:1,e:`นี่คือเงื่อนไขแบบผสม เหตุอยู่ในอดีต (had caught) แต่ผลอยู่ในปัจจุบัน (by now) จึงใช้ would + verb รูปพื้นฐานคือ would be`,m:`คำว่า by now / today / at this moment เป็นสัญญาณว่าผลอยู่ในปัจจุบัน จึงไม่ใช้ would have been`},{id:`arena-s08-q09`,s:`grammar`,k:`agreement`,q:`Mathematics ____ my sister’s favourite subject at school.`,c:[`are`,`were`,`have been`,`is`],a:3,e:`ชื่อวิชาที่ลงท้ายด้วย -ics เช่น Mathematics, Physics, Economics ถือเป็นคำนามเอกพจน์ จึงใช้กริยาเอกพจน์คือ is`,m:`อย่าเห็น -s ท้ายคำแล้วสรุปว่าเป็นพหูพจน์ คำเช่น news และ physics ก็เป็นเอกพจน์เช่นกัน`},{id:`arena-s08-q10`,s:`grammar`,k:`verb-patterns`,q:`The boy denied ____ the window, but nobody in the class believed him.`,c:[`breaking`,`to break`,`break`,`broken`],a:0,e:`กริยา deny ต้องตามด้วย V-ing เสมอ จึงได้ denied breaking the window`,m:`กลุ่มกริยาที่ตามด้วย -ing และนักเรียนมักใส่ to ผิด ได้แก่ deny, admit, avoid, suggest, consider`},{id:`arena-s08-q11`,s:`grammar`,k:`error-identification`,intro:`Although the museum opened only last year, it has already attract more visitors than the old gallery did in a decade.`,q:`Which underlined part of the sentence above is WRONG?`,c:[`Although the museum opened`,`only last year`,`it has already attract`,`than the old gallery did`],a:2,e:`หลัง has ต้องใช้กริยาช่องที่ 3 เสมอ จึงต้องแก้เป็น it has already attracted ส่วนส่วนอื่นของประโยคถูกต้องแล้ว`,m:`ในข้อสอบหาที่ผิด ให้ตรวจโครงสร้าง have / has / had + V3 เป็นอันดับแรก ๆ เสมอ`},{id:`arena-s08-q12`,s:`conversation`,k:`situational-english`,intro:`Planning a school project

Nok: ____`,q:`Choose the best reply for Nok, who agrees but has a condition.`,c:[`I am agree with you about that.`,`That works for me, as long as we finish before midday.`,`No. Saturday is a day of the week.`,`You should film the interview yourself.`],a:1,e:`การเห็นด้วยพร้อมเงื่อนไขเป็นสำนวนที่ใช้บ่อยในการทำงานกลุ่ม เช่น That works for me, as long as… ซึ่งทั้งตอบรับและระบุข้อจำกัดในประโยคเดียว`,m:`รูป I am agree ผิดไวยากรณ์ ต้องเขียนว่า I agree เพราะ agree เป็นคำกริยาอยู่แล้ว`},{id:`arena-s08-q13`,s:`conversation`,k:`situational-english`,intro:`On the telephone

Officer: Yes, of course. Could you tell me your student number?`,q:`Choose the best opening line for the student.`,c:[`Good morning. I’m calling to ask about the entrance examination results.`,`Hello. Give me the results now, please.`,`Hello. Are you the officer or not?`,`Good morning. I want you to tell me the results.`],a:0,e:`การโทรติดต่อหน่วยงานควรทักทายแล้วบอกจุดประสงค์อย่างชัดเจนและสุภาพ เช่น I’m calling to ask about… ซึ่งทำให้เจ้าหน้าที่ถามข้อมูลต่อได้`,m:`ประโยคที่ขึ้นต้นด้วย I want you to… ฟังดูเป็นการสั่ง ไม่เหมาะกับการติดต่อทางการ`},{id:`arena-s08-q14`,s:`conversation`,k:`situational-english`,intro:`Kan: My laptop stopped working the night before the presentation.
May: ____`,q:`Choose the best reply for May.`,c:[`That is entirely your own fault.`,`Laptops are always breaking, aren’t they?`,`You should buy a new laptop tomorrow morning.`,`Oh no! Would you like to borrow mine for the presentation?`],a:3,e:`เมื่อเพื่อนเล่าปัญหา คำตอบที่ดีที่สุดคือแสดงความเห็นใจแล้วเสนอความช่วยเหลือที่ทำได้จริง เช่น เสนอให้ยืมเครื่องของตน`,m:`การให้คำแนะนำที่ใช้ไม่ทัน (ซื้อเครื่องใหม่พรุ่งนี้) ไม่ช่วยแก้ปัญหาเฉพาะหน้า จึงไม่ใช่คำตอบที่ดีที่สุด`},{id:`arena-s08-q15`,s:`conversation`,k:`situational-english`,intro:`In a bookshop
Assistant: Would you like to try our membership card? It costs 200 baht a year.
Customer: ____`,q:`Choose the best reply for the customer, who does not want the card.`,c:[`No! I don’t want your card at all.`,`Yes, but I will not pay for it.`,`Thank you, but I don’t think I would use it enough.`,`I am not a member of anything, sorry.`],a:2,e:`การปฏิเสธข้อเสนออย่างสุภาพควรขอบคุณก่อนแล้วให้เหตุผลสั้น ๆ เช่น Thank you, but I don’t think I would use it enough.`,m:`การปฏิเสธแบบห้วน ๆ หรือขัดแย้งในตัวเอง (ตอบ Yes แล้วบอกว่าไม่จ่าย) ไม่ใช่ภาษาที่ใช้จริงในร้านค้า`},{id:`arena-s08-q16`,s:`cloze`,k:`cloze-vocabulary`,p:`S08-C`,intro:`Blank (16)`,q:`Visitors often ask her to slow ____ so that they can follow the pattern.`,c:[`off`,`up`,`down`,`over`],a:2,e:`กริยาวลี slow down แปลว่า ทำให้ช้าลง ซึ่งตรงกับเหตุผลว่าผู้ชมอยากดูลายผ้าให้ทัน`,m:`slow up มีใช้ในภาษาพูดบางถิ่นแต่ไม่ใช่รูปมาตรฐานในข้อสอบ ให้จำ slow down เป็นหลัก`},{id:`arena-s08-q17`,s:`cloze`,k:`cloze-grammar`,p:`S08-C`,intro:`Blank (17)`,q:`A single mistake in the first row is repeated ____ the whole cloth.`,c:[`among`,`along`,`between`,`throughout`],a:3,e:`throughout แปลว่า ตลอดทั่วทั้ง… ซึ่งสื่อว่าความผิดพลาดปรากฏซ้ำไปทั่วทั้งผืนผ้า ส่วน between ใช้กับสองสิ่งเท่านั้น`,v:`throughout = ตลอดทั่วทั้ง, among = ท่ามกลาง (ของหลายสิ่ง)`},{id:`arena-s08-q18`,s:`cloze`,k:`cloze-linking`,p:`S08-C`,intro:`Blank (18)`,q:`____ three months of evening lessons I finished a scarf that was, my grandmother said kindly, "almost straight".`,c:[`Until`,`After`,`Since`,`Because of`],a:1,e:`ผ้าพันคอเสร็จ "หลังจาก" เรียนมาสามเดือน จึงใช้ After ตามด้วยนามวลีบอกช่วงเวลา`,m:`Since ใช้กับจุดเริ่มต้นของเวลา ไม่ใช้กับช่วงเวลาที่มีความยาว เช่น three months`},{id:`arena-s08-q19`,s:`cloze`,k:`cloze-grammar`,p:`S08-C`,intro:`Blank (19)`,q:`…a small square of blue cotton she made in 1961, which nobody ____ allowed to touch.`,c:[`is`,`are`,`has`,`being`],a:0,e:`ประธานของอนุประโยคคือ nobody ซึ่งเป็นเอกพจน์ และโครงสร้างเป็น passive คือ be + allowed จึงต้องใช้ is`,m:`คำที่ลงท้ายด้วย -body และ -one เป็นเอกพจน์เสมอ เช่น nobody is, everyone has`},{id:`arena-s08-q20`,s:`reading`,k:`reading-cause-effect`,p:`S08-R1`,q:`According to the passage, why is buried food waste a problem?`,c:[`It takes up land that schools need for sport.`,`It rots without air and releases methane.`,`It attracts birds and insects to the canteen.`,`It is expensive for schools to collect.`],a:1,e:`ย่อหน้าแรกอธิบายว่าเศษอาหารที่ถูกฝังจะเน่าโดยไม่มีอากาศและปล่อยก๊าซมีเทน ซึ่งกักเก็บความร้อนได้มากกว่าคาร์บอนไดออกไซด์`,v:`methane = ก๊าซมีเทน, rot = เน่าเปื่อย`},{id:`arena-s08-q21`,s:`reading`,k:`reading-inference`,p:`S08-R1`,q:`What was the change that the school did NOT expect?`,c:[`The kitchen bought smaller bins.`,`Composting became much cheaper.`,`Grade 5 students learned to weigh accurately.`,`Students began taking and finishing smaller portions.`],a:3,e:`ย่อหน้าที่สามบอกว่าการเปลี่ยนแปลงที่คาดไม่ถึงที่สุดเกิดขึ้นเมื่อมีการติดตัวเลขไว้ในที่สาธารณะ แล้วนักเรียนเริ่มตักอาหารน้อยลงและกินให้หมด`,m:`การทำปุ๋ยหมัก (composting) ถูกระบุว่าเป็นเพียง "ส่วนหนึ่ง" ของการลดลง ไม่ใช่สิ่งที่คาดไม่ถึง`},{id:`arena-s08-q22`,s:`reading`,k:`reading-inference`,p:`S08-R1`,q:`What does the head of the kitchen mean by "We have simply started measuring"?`,c:[`She believes the project has failed.`,`She wants the students to weigh the bins more often.`,`She thinks the work has only just begun.`,`She does not trust the figures on the chart.`],a:2,e:`เธอพูดหลังประโยคว่า We have not solved anything ซึ่งเป็นการถ่อมตัวว่าโครงการเพิ่งเริ่มต้นเท่านั้น ยังไม่ถือว่าแก้ปัญหาได้แล้ว`,m:`คำว่า simply (เพียงแค่) เป็นสัญญาณของการลดน้ำหนักคำกล่าวอ้าง ไม่ใช่การบอกว่าล้มเหลว`},{id:`arena-s08-q23`,s:`reading`,k:`reading-detail`,p:`S08-R2`,q:`What must an applicant send together with the recording?`,c:[`A letter of 150 to 200 words and a teacher’s recommendation`,`A letter written by a member of the family`,`A video of a live performance at school`,`A list of eight pieces the applicant can play`],a:0,e:`ประกาศระบุว่าผู้สมัครต้องแนบจดหมายความยาว 150–200 คำ และต้องมีครูหนึ่งคนที่ไม่ใช่คนในครอบครัวเป็นผู้แนะนำ`,m:`เงื่อนไข "ครูที่ไม่ใช่คนในครอบครัว" เป็นรายละเอียดที่ตัวเลือกลวงจงใจสลับ ให้อ่านเงื่อนไขทุกข้อให้ครบ`},{id:`arena-s08-q24`,s:`reading`,k:`reading-inference`,p:`S08-R2`,q:`Nut has played the piano for three years. He sends one piece lasting nine minutes. Why would his application fail?`,c:[`He has not studied his instrument for long enough.`,`His recording breaks two of the rules.`,`He is too young to apply for the scholarship.`,`He needs recommendations from two teachers.`],a:1,e:`กติกากำหนดว่าต้องส่งสองบทเพลงที่มีลักษณะต่างกัน และรวมกันยาวไม่เกิน 8 นาที การส่งเพลงเดียวยาว 9 นาทีจึงผิดทั้งสองข้อ ส่วนการเล่นมาสามปีนั้นผ่านเกณฑ์แล้ว`,m:`ข้อสอบแบบตรวจตามเงื่อนไขต้องไล่เช็กทุกข้อ ไม่ใช่หยุดที่ข้อแรกที่ผ่าน`},{id:`arena-s08-q25`,s:`reading`,k:`reading-detail`,p:`S08-R2`,q:`What should an applicant do if she cannot attend on 4 April?`,c:[`Send a second recording before 15 March.`,`Ask a teacher to attend in her place.`,`Mention it in the letter sent with the application.`,`Wait to be contacted after the first round.`],a:2,e:`ย่อหน้าที่สามระบุว่า Those who cannot attend on that date should say so in their letter จึงต้องแจ้งไว้ในจดหมายที่ส่งพร้อมใบสมัคร`,m:`ประกาศบอกเงื่อนไขล่วงหน้า ไม่ใช่ให้รอการติดต่อภายหลัง ให้จับคำว่า should say so in their letter`}]},{id:9,title:`Gifted English Arena`,level:`very-advanced`,minutes:40,focus:`Emphatic structures, causatives and comparing two points of view.`,passages:[{id:`S09-C`,kind:`Cloze passage`,title:`What the Quiz Team Taught Me`,body:[`For most of my childhood I believed that a good memory was something you were born with, like brown eyes or long fingers. It was not __(16)__ I joined the school quiz team that I discovered how much of it is method.`,`Our coach began each session by asking us to close our books and write down everything we could recall from the previous week. The exercise was uncomfortable and my first lists were embarrassingly short. Yet the very act of struggling to remember, she explained, is __(17)__ strengthens the memory; rereading notes feels productive but changes little.`,`By the end of the season I had not become cleverer, __(18)__ I had learned to study in a different way. I now test myself before I revise, a habit __(19)__ has saved me more hours than any timetable ever did.`]},{id:`S09-R1`,kind:`Science article`,title:`The Cost of Switching`,body:[`Many students believe they can revise while a video plays in another window. Research suggests that the brain does not truly do two demanding things at once; instead it switches rapidly between them, and every switch costs a small amount of time and accuracy.`,`In one often-quoted experiment, volunteers sorted shapes first by colour and then by number. When the rule changed without warning, they needed several extra tenths of a second for each item. Those fractions seem trivial, yet across an hour of study they add up to a significant loss.`,`There is a second, less obvious cost. Work done while switching is remembered less well. Participants who studied with interruptions recalled about a fifth less of the material a week later, even when they had spent the same total time on the task.`,`None of this means that students must work in silence. Instrumental music appears to make little difference for most people, and short planned breaks improve concentration. The problem is not sound; it is the demand to follow two streams of language at the same time.`]},{id:`S09-R2`,kind:`Article`,title:`Letters to the Editor: Plastic in the Canteen`,body:[`From Pim, Grade 6/1: Our canteen still hands out a plastic straw with every drink and a plastic bag with every takeaway meal. I counted the straws used in one lunch break: two hundred and thirteen. If the school simply stopped offering straws unless a student asked for one, most of that waste would disappear overnight. Schools in the next district have done exactly this and have reported no complaints.`,`From Mr Sirichai, canteen manager: I welcome Pim’s interest and I agree that the number of straws is far too high. However, her letter does not mention cost. Paper straws are almost three times the price of plastic ones, and canteen prices are fixed by the school. Nor does she mention the hygiene rules, which require sealed containers for food carried out of the canteen. I would gladly stop handing out straws automatically — that costs nothing — but replacing every plastic item would mean either a higher price or a smaller portion.`]}],questions:[{id:`arena-s09-q01`,s:`vocabulary`,k:`academic-vocab`,q:`The witness’s account was ____ with the video evidence, which is why the officers accepted it.`,c:[`reluctant`,`consistent`,`apparent`,`sufficient`],a:1,e:`consistent with แปลว่า สอดคล้องกับ / ไม่ขัดแย้งกับ ซึ่งอธิบายว่าทำไมตำรวจจึงยอมรับคำให้การนั้น`,m:`คำนี้ต้องใช้คู่กับบุพบท with เสมอ คือ consistent with something`,v:`consistent = สอดคล้องต้องกัน, sufficient = เพียงพอ, apparent = เห็นได้ชัด`},{id:`arena-s09-q02`,s:`vocabulary`,k:`word-choice`,q:`The twins look so alike that even their teachers cannot ____ between them.`,c:[`distinguish`,`separate`,`recognise`,`compare`],a:0,e:`distinguish between A and B แปลว่า แยกแยะความแตกต่างระหว่างสองสิ่ง จึงเป็นคำเดียวในตัวเลือกที่ใช้กับ between ในความหมายนี้`,m:`separate between และ recognise between ไม่ใช่รูปที่ใช้ได้ ต้องจำว่าคำใดตามด้วย between`},{id:`arena-s09-q03`,s:`vocabulary`,k:`phrasal-verbs`,q:`Let’s ____ the details of the plan once more before the meeting begins.`,c:[`go through with`,`go after`,`go over`,`go off`],a:2,e:`go over แปลว่า ทบทวน / ตรวจดูอีกครั้ง ส่วน go through with แปลว่า ลงมือทำสิ่งที่วางแผนไว้จนจบ ซึ่งคนละความหมาย`,v:`go over = ทบทวน, go off = ดังขึ้น (นาฬิกาปลุก) หรือ เสีย (อาหาร), go after = ไล่ตาม`},{id:`arena-s09-q04`,s:`vocabulary`,k:`word-family`,q:`Given the evidence, the committee’s decision was widely regarded as ____.`,c:[`justify`,`justice`,`justly`,`justifiable`],a:3,e:`หลัง regarded as ต้องเป็นคำคุณศัพท์หรือคำนามที่บอกลักษณะ คำคุณศัพท์ที่แปลว่า "มีเหตุผลรองรับ" คือ justifiable`,m:`justify (v.) = แสดงเหตุผล, justice (n.) = ความยุติธรรม, justly (adv.) = อย่างยุติธรรม, justifiable (adj.) = ที่มีเหตุผลสมควร`},{id:`arena-s09-q05`,s:`grammar`,k:`sentence-structure`,q:`Only after the results were published ____ how close the contest had been.`,c:[`did we realise`,`we realised`,`we did realise`,`realised we`],a:0,e:`เมื่อขึ้นต้นประโยคด้วยวลี Only after / Only when / Only then ต้องสลับกริยาช่วยมาไว้หน้าประธานในประโยคหลัก จึงได้ did we realise`,m:`การสลับตำแหน่งเกิดใน "ประโยคหลัก" เท่านั้น ไม่ใช่ในอนุประโยคที่ตามหลัง Only after`},{id:`arena-s09-q06`,s:`grammar`,k:`verb-patterns`,q:`The principal insisted that every student ____ present at the final rehearsal.`,c:[`is`,`was`,`will be`,`be`],a:3,e:`หลัง insist that ภาษาอังกฤษใช้กริยารูปพื้นฐาน (subjunctive) เสมอ ไม่ว่าประธานจะเป็นอะไร จึงใช้ be ซึ่งเทียบเท่ากับ should be`,m:`กลุ่มเดียวกันได้แก่ insist, demand, suggest, recommend, request`},{id:`arena-s09-q07`,s:`grammar`,k:`conditionals`,q:`Had I known about the earlier deadline, I ____ the essay last week.`,c:[`would submit`,`would have submitted`,`will have submitted`,`had submitted`],a:1,e:`Had I known… เป็นรูปกลับของ If I had known… ซึ่งเป็นเงื่อนไขแบบที่ 3 ประโยคหลักจึงต้องใช้ would have + V3`,m:`เมื่อเห็น Had + ประธาน ขึ้นต้นประโยค ให้แปลงกลับเป็น If… had… ทันที แล้วเลือกโครงสร้างให้ตรงกัน`},{id:`arena-s09-q08`,s:`grammar`,k:`relative-clauses`,q:`The scientist ____ the prize was awarded declined to attend the ceremony.`,c:[`who`,`that`,`to whom`,`whose`],a:2,e:`ประโยคเดิมคือ The prize was awarded to the scientist เมื่อทำเป็นอนุประโยคขยายนามแบบทางการ ต้องย้ายบุพบทมาไว้หน้า whom จึงได้ to whom`,m:`หลังบุพบทต้องใช้ whom เสมอ ห้ามใช้ who หรือ that`},{id:`arena-s09-q09`,s:`grammar`,k:`passive-voice`,q:`We are having the science laboratory ____ during the school holiday.`,c:[`repainted`,`repaint`,`to repaint`,`repainting`],a:0,e:`โครงสร้าง have something done ใช้เมื่อเราจ้างหรือให้คนอื่นทำสิ่งนั้นให้ จึงต้องใช้กริยาช่องที่ 3 คือ repainted`,m:`เปรียบเทียบ have somebody do something (ให้ใครทำ) กับ have something done (ให้สิ่งนั้นถูกทำ) ซึ่งใช้ V3`},{id:`arena-s09-q10`,s:`grammar`,k:`agreement`,q:`Neither of the two proposals ____ the committee completely.`,c:[`satisfy`,`satisfies`,`have satisfied`,`are satisfying`],a:1,e:`Neither of + คำนามพหูพจน์ ถือเป็นประธานเอกพจน์ในภาษาเขียนที่เป็นทางการ กริยาจึงต้องเติม -s เป็น satisfies`,m:`คำที่อยู่หลัง of ไม่ใช่ประธานของประโยค ให้ดูคำหน้า of เสมอ`},{id:`arena-s09-q11`,s:`grammar`,k:`error-identification`,intro:`Despite the fact that she had practised for weeks, Malee felt nervously when she stepped onto the stage.`,q:`Which underlined part of the sentence above is WRONG?`,c:[`Despite the fact that`,`she had practised for weeks`,`Malee felt`,`nervously when she stepped`],a:3,e:`felt เป็นกริยาแสดงความรู้สึก (linking verb) จึงต้องตามด้วยคำคุณศัพท์ ไม่ใช่คำวิเศษณ์ ต้องแก้เป็น felt nervous`,m:`กริยากลุ่ม be, feel, look, seem, taste, sound ตามด้วยคำคุณศัพท์เสมอ เช่น It looks good. ไม่ใช่ It looks well.`},{id:`arena-s09-q12`,s:`conversation`,k:`situational-english`,intro:`In a class discussion
Teacher: So you are saying that the survey proves students prefer later lessons?
Student: ____`,q:`Choose the best reply for the student.`,c:[`Yes, exactly that is what I said before.`,`No, I did not say anything like that at all.`,`Not quite — it suggests a preference, but the sample was small.`,`You are wrong to ask me such a question.`],a:2,e:`เมื่อครูสรุปความคิดของเราเกินจริง การตอบที่ดีคือแก้ไขอย่างสุภาพด้วย Not quite… แล้วอธิบายขอบเขตที่แท้จริงของข้อมูล`,m:`ภาษาวิชาการหลีกเลี่ยงการพูดว่า "พิสูจน์ได้" เมื่อข้อมูลมีจำกัด ให้ใช้คำอย่าง suggests แทน proves`},{id:`arena-s09-q13`,s:`conversation`,k:`situational-english`,intro:`At a debate
Chairperson: Would the second speaker like to respond?
Speaker: ____`,q:`Choose the best reply for the speaker.`,c:[`Thank you. I’d like to challenge one point my opponent made about the cost.`,`Yes, I would like to respond it now.`,`I respond that my opponent is not telling the truth.`,`Thank you, but I don’t know what to say about this.`],a:0,e:`ในการโต้วาที ผู้พูดควรขอบคุณประธาน แล้วระบุประเด็นที่จะโต้แย้งอย่างเจาะจง ซึ่งเป็นภาษาที่สุภาพและตรงประเด็น`,m:`respond เป็นกริยาที่ต้องมี to เมื่อมีกรรม เช่น respond to it และการกล่าวหาคู่แข่งตรง ๆ ถือว่าผิดมารยาทการโต้วาที`},{id:`arena-s09-q14`,s:`conversation`,k:`situational-english`,intro:`Fon: I’m worried that my accent will make the judges mark me down.
Aum: ____`,q:`Choose the best reply for Aum.`,c:[`You should change your accent before Friday.`,`Honestly, judges listen for ideas and clarity far more than accent.`,`Yes, your accent is quite strong, isn’t it?`,`Don’t worry — nobody really listens to the speeches.`],a:1,e:`คำตอบที่ดีคือให้กำลังใจด้วยข้อมูลที่เป็นจริงและช่วยลดความกังวลอย่างมีเหตุผล ไม่ใช่การปฏิเสธความรู้สึกหรือดูถูกงาน`,m:`การปลอบว่า "ไม่มีใครฟังหรอก" อาจฟังดูใจดี แต่กลับลดคุณค่าของสิ่งที่อีกฝ่ายเตรียมมา`},{id:`arena-s09-q15`,s:`conversation`,k:`situational-english`,intro:`Teacher: Could you take charge of the poster competition as well?
Student: ____`,q:`Choose the best reply for the student, who is already very busy.`,c:[`No. I am far too busy for that.`,`I could, but I don’t really want to.`,`Yes, teacher. I will do everything you ask.`,`I’d like to help, but I’m already running the science fair. Could I take it on after that?`],a:3,e:`การปฏิเสธงานเพิ่มอย่างมืออาชีพคือแสดงความเต็มใจ อธิบายภาระที่มีอยู่ แล้วเสนอทางเลือกอื่น ซึ่งรักษาความสัมพันธ์และความรับผิดชอบไว้ทั้งคู่`,m:`การตอบรับทุกอย่างทั้งที่ทำไม่ไหวไม่ใช่คำตอบที่ดีที่สุด เพราะสุดท้ายงานจะเสียหาย`},{id:`arena-s09-q16`,s:`cloze`,k:`cloze-grammar`,p:`S09-C`,intro:`Blank (16)`,q:`It was not ____ I joined the school quiz team that I discovered how much of it is method.`,c:[`before`,`since`,`until`,`when`],a:2,e:`โครงสร้างเน้นย้ำ It was not until… that… แปลว่า "เพิ่งจะ… ก็ต่อเมื่อ…" คำที่ใช้คู่กับ not ในรูปนี้คือ until เท่านั้น`,m:`สังเกตคำว่า that ที่ตามมาในประโยค เป็นสัญญาณของโครงสร้างเน้นย้ำแบบ cleft sentence`},{id:`arena-s09-q17`,s:`cloze`,k:`cloze-grammar`,p:`S09-C`,intro:`Blank (17)`,q:`The very act of struggling to remember, she explained, is ____ strengthens the memory.`,c:[`that`,`what`,`which`,`it`],a:1,e:`ช่องว่างต้องการคำที่ทำหน้าที่เป็นทั้งประธานของ strengthens และเป็นส่วนเติมเต็มของ is คือ what ซึ่งมีความหมายว่า "สิ่งที่"`,m:`what = the thing that ใช้ได้โดยไม่ต้องมีคำนามนำหน้า ต่างจาก which ที่ต้องขยายคำนามที่กล่าวมาแล้ว`},{id:`arena-s09-q18`,s:`cloze`,k:`cloze-linking`,p:`S09-C`,intro:`Blank (18)`,q:`By the end of the season I had not become cleverer, ____ I had learned to study in a different way.`,c:[`but`,`so`,`because`,`or`],a:0,e:`ข้อความสองส่วนขัดแย้งกัน คือ ไม่ได้ฉลาดขึ้น แต่เปลี่ยนวิธีเรียน จึงใช้ but ซึ่งเป็นคู่ประจำของโครงสร้าง not… but…`},{id:`arena-s09-q19`,s:`cloze`,k:`cloze-grammar`,p:`S09-C`,intro:`Blank (19)`,q:`I now test myself before I revise, a habit ____ has saved me more hours than any timetable ever did.`,c:[`what`,`who`,`whose`,`that`],a:3,e:`คำที่ถูกขยายคือ a habit ซึ่งเป็นสิ่งของและทำหน้าที่ประธานของ has saved จึงใช้ that (หรือ which) ส่วน what ใช้ขยายคำนามที่มีอยู่แล้วไม่ได้`,m:`ถ้ามีคำนามอยู่ข้างหน้าแล้ว ห้ามใช้ what เด็ดขาด`},{id:`arena-s09-q20`,s:`reading`,k:`reading-detail`,p:`S09-R1`,q:`According to the passage, what does the brain actually do with two demanding tasks?`,c:[`It performs both of them faster than usual.`,`It stops one of them completely.`,`It switches between them, losing time and accuracy.`,`It stores both of them equally well.`],a:2,e:`ย่อหน้าแรกระบุว่าสมองไม่ได้ทำสองอย่างพร้อมกันจริง ๆ แต่สลับไปมาอย่างรวดเร็ว และการสลับแต่ละครั้งเสียทั้งเวลาและความแม่นยำ`,v:`switch = สลับไปมา, accuracy = ความแม่นยำ`},{id:`arena-s09-q21`,s:`reading`,k:`reading-purpose`,p:`S09-R1`,q:`Why does the writer mention "several extra tenths of a second"?`,c:[`To show that very small losses become large over time`,`To prove that the experiment was badly designed`,`To suggest that the volunteers worked too slowly`,`To explain why sorting shapes is difficult`],a:0,e:`ประโยคถัดมาบอกว่า Those fractions seem trivial, yet across an hour of study they add up to a significant loss ผู้เขียนจึงยกตัวเลขเล็ก ๆ มาเพื่อแสดงว่ารวมกันแล้วมาก`,m:`คำเชื่อม yet ในประโยคถัดไปคือกุญแจของคำถามนี้ ให้อ่านประโยคหลังตัวเลขเสมอ`},{id:`arena-s09-q22`,s:`reading`,k:`reading-conclusion`,p:`S09-R1`,q:`Based on the last paragraph, which activity would most probably harm revision?`,c:[`Listening to instrumental music`,`Taking a short planned break`,`Working in a completely quiet room`,`Listening to a podcast conversation`],a:3,e:`ย่อหน้าสุดท้ายสรุปว่า The problem is not sound; it is the demand to follow two streams of language at the same time พอดแคสต์เป็นภาษาพูด จึงเป็นสิ่งที่รบกวนการอ่านทบทวนมากที่สุด`,m:`ดนตรีบรรเลงไม่มีคำพูด จึงไม่เข้าข่ายปัญหาที่ผู้เขียนระบุ ต้องอ่านให้ถึงประโยคสุดท้ายจึงจะตอบถูก`},{id:`arena-s09-q23`,s:`reading`,k:`reading-detail`,p:`S09-R2`,q:`What change does Pim actually suggest in her letter?`,c:[`Replacing every plastic straw with a paper one`,`Giving out straws only when a student asks for one`,`Closing the takeaway service completely`,`Raising the price of every drink slightly`],a:1,e:`พิมเขียนว่า stopped offering straws unless a student asked for one คือให้หลอดเฉพาะเมื่อมีคนขอ ไม่ได้เสนอให้เปลี่ยนไปใช้หลอดกระดาษ`,m:`หลอดกระดาษถูกกล่าวถึงโดยผู้จัดการโรงอาหาร ไม่ใช่ข้อเสนอของพิม ระวังการสลับผู้พูดในบทอ่านสองเสียง`},{id:`arena-s09-q24`,s:`reading`,k:`reading-inference`,p:`S09-R2`,q:`Which part of Pim’s argument does Mr Sirichai accept?`,c:[`That the canteen should buy paper straws`,`That canteen prices should rise slightly`,`That straws should not be handed out automatically`,`That the hygiene rules should be changed`],a:2,e:`ผู้จัดการเขียนว่า I would gladly stop handing out straws automatically — that costs nothing ซึ่งเป็นการยอมรับข้อเสนอหลักของพิมโดยตรง`,m:`ในบทอ่านที่มีสองความเห็น ให้มองหาจุดที่ทั้งสองฝ่ายเห็นตรงกัน ไม่ใช่เฉพาะจุดที่ขัดแย้ง`},{id:`arena-s09-q25`,s:`reading`,k:`reading-purpose`,p:`S09-R2`,q:`Why does Mr Sirichai mention the hygiene rules?`,c:[`To show that Pim has never read the school rules`,`To explain why some plastic items cannot simply be removed`,`To argue that the canteen is cleaner than the classrooms`,`To suggest that the school should change those rules`],a:1,e:`เขายกกฎสุขอนามัยที่กำหนดให้ใช้ภาชนะปิดสนิทสำหรับอาหารนำกลับ เพื่ออธิบายว่าพลาสติกบางอย่างเลิกใช้ทันทีไม่ได้ ไม่ใช่การตำหนิพิม`,m:`ผู้เขียนใช้คำว่า Nor does she mention… เพื่อ "เพิ่มข้อมูลที่ขาดไป" ไม่ใช่เพื่อโจมตีอีกฝ่าย`}]},{id:10,title:`Ultimate Entrance Mock`,level:`final`,minutes:40,focus:`The complete paper — every section at entrance-day difficulty.`,passages:[{id:`S10-C`,kind:`Cloze passage`,title:`The Photograph on the Stairs`,body:[`There is a photograph on our stairs that visitors always stop to look at. It shows my mother, aged nineteen, standing beside a bicycle on a road that no longer exists. The village in the background was moved in 1994 __(16)__ a dam was built across the valley.`,`For years I assumed the picture had been taken on an ordinary afternoon. It was only last year, __(17)__ my aunt described the day, that I understood. My mother had cycled forty kilometres to collect her examination results, and the photograph was taken an hour after she learned that she had passed.`,`What strikes me now is how little the picture reveals. __(18)__ the smile, there is no sign of the distance, the heat or the years of study behind it. Perhaps that is true of most photographs: they record the moment __(19)__ not the effort that produced it.`]},{id:`S10-R1`,kind:`Article`,title:`The Room Above the Hardware Shop`,body:[`Every Tuesday evening about thirty people gather in a room above a hardware shop in Lampang to read aloud to one another. Some are retired teachers; the youngest member is eleven. They take turns reading a page of whatever book has been chosen for that month, and nobody may explain what a passage means until the whole chapter has been finished.`,`The group began by accident. In 2016 a bookseller closed her shop and offered the remaining stock to anyone who would collect it. Six customers arrived, and while they were sorting the boxes one of them began reading a page out loud. They agreed to meet again the following week.`,`The rule about explanations was added later, after an argument. A member had interrupted a chapter to announce that the writer was "clearly wrong". The group decided that judgement was arriving too early — that a book, like a person, deserves to be heard before it is assessed.`,`Members say the habit has changed the way they listen elsewhere. One of them, a nurse, told me that she now waits three seconds longer before answering a patient. That is a small thing. It is also, she says, the most useful thing the group has taught her.`]},{id:`S10-R2`,kind:`Notice`,title:`Entrance Examination — Instructions for Candidates`,body:[`Candidates must be seated by 8.20 a.m. The English paper begins at 8.30 a.m. and lasts one hour and forty minutes. Candidates arriving after 8.45 a.m. will not be admitted.`,`You may bring two pencils, an eraser and a clear bottle of water with the label removed. You may not bring correction fluid, a dictionary, a smart watch or any bag into the examination room. Bags may be left in room B1 from 7.45 a.m.`,`Answers must be marked on the answer sheet, never on the question paper. Questions 1 to 40 carry one mark each; questions 41 to 50 carry two marks each. There is no penalty for a wrong answer.`,`Candidates who finish early may not leave the room before 9.45 a.m. Raise your hand if you need a replacement answer sheet; the previous sheet will be collected and destroyed.`]}],questions:[{id:`arena-s10-q01`,s:`vocabulary`,k:`academic-vocab`,q:`The two studies reached almost identical conclusions, which ____ the researchers’ confidence in the method.`,c:[`reduced`,`replaced`,`reinforced`,`revised`],a:2,e:`เมื่อผลการศึกษาสองชิ้นตรงกัน ย่อมทำให้ความมั่นใจในวิธีการ "แข็งแรงขึ้น" คำว่า reinforce แปลว่า เสริมให้แข็งแรงขึ้น`,v:`reinforce = เสริมความแข็งแรง/ยืนยันให้หนักแน่นขึ้น, revise = แก้ไขปรับปรุง`},{id:`arena-s10-q02`,s:`vocabulary`,k:`vocab-context`,q:`Because the evidence was ____, the committee postponed its decision until the next meeting.`,c:[`overwhelming`,`inconclusive`,`straightforward`,`deliberate`],a:1,e:`การเลื่อนการตัดสินใจแสดงว่าหลักฐานยังสรุปไม่ได้ คำว่า inconclusive แปลว่า ยังไม่อาจสรุปได้ ส่วน overwhelming แปลว่าท่วมท้นชัดเจน ซึ่งจะทำให้ตัดสินใจได้ทันที`,m:`ให้ใช้ "ผล" ในประโยค (การเลื่อนประชุม) ตรวจสอบว่าคำตอบสมเหตุสมผลหรือไม่`,v:`inconclusive = ที่ยังสรุปไม่ได้, overwhelming = ท่วมท้น`},{id:`arena-s10-q03`,s:`vocabulary`,k:`collocations`,q:`The manager ____ full responsibility for the mistake and apologised to the customers.`,c:[`took`,`made`,`did`,`gave`],a:0,e:`สำนวน take responsibility for something แปลว่า รับผิดชอบต่อสิ่งนั้น เป็นคำคู่ตายตัวที่ใช้ take เท่านั้น`,m:`อย่าแปลตรงตัวจากภาษาไทยว่า "ให้ความรับผิดชอบ" แล้วเลือก give`},{id:`arena-s10-q04`,s:`vocabulary`,k:`phrasal-verbs`,q:`Sales of the printed magazine have ____ sharply since the website was launched.`,c:[`fallen out`,`fallen through`,`fallen behind`,`fallen off`],a:3,e:`fall off แปลว่า ลดลง (ใช้กับยอดขาย จำนวนผู้ชม หรือความสนใจ) ส่วน fall through แปลว่า แผนล้มเหลว และ fall out แปลว่า ทะเลาะกัน`,v:`fall off = ลดลง, fall through = (แผน) ล้มเหลว, fall behind = ตามหลัง/ล้าหลัง`},{id:`arena-s10-q05`,s:`grammar`,k:`sentence-structure`,q:`So ____ that the speaker had to wait a full minute before she could continue.`,c:[`loud the applause was`,`loud was the applause`,`was the applause loud`,`the applause was loud`],a:1,e:`เมื่อขึ้นต้นประโยคด้วย So + คำคุณศัพท์ ต้องสลับกริยา be มาไว้หน้าประธาน จึงได้ So loud was the applause that…`,m:`โครงสร้างนี้ต้องมี that ตามมาเสมอเพื่อบอกผลลัพธ์`},{id:`arena-s10-q06`,s:`grammar`,k:`verb-patterns`,q:`On the way home we stopped ____ some fruit for dinner.`,c:[`to buy`,`buying`,`buy`,`bought`],a:0,e:`stop + to + verb แปลว่า หยุดเพื่อจะทำสิ่งนั้น ส่วน stop + V-ing แปลว่า เลิกทำสิ่งนั้น ในที่นี้คือหยุดรถเพื่อซื้อผลไม้ จึงใช้ to buy`,m:`เปรียบเทียบ He stopped smoking. (เลิกสูบบุหรี่) กับ He stopped to smoke. (หยุดเพื่อสูบบุหรี่)`},{id:`arena-s10-q07`,s:`grammar`,k:`modals`,q:`You ____ have carried all those chairs; the caretaker had already brought some.`,c:[`mustn’t`,`shouldn’t`,`couldn’t`,`needn’t`],a:3,e:`needn’t have + V3 ใช้กับสิ่งที่ทำไปแล้วแต่จริง ๆ ไม่จำเป็นต้องทำ ซึ่งตรงกับสถานการณ์ที่ภารโรงขนเก้าอี้มาให้อยู่แล้ว`,m:`shouldn’t have + V3 ใช้ตำหนิสิ่งที่ไม่ควรทำเพราะเป็นความผิด แต่ในที่นี้ไม่ได้ผิด เพียงแต่เสียแรงเปล่า`},{id:`arena-s10-q08`,s:`grammar`,k:`question-forms`,q:`The teacher wanted to know ____.`,c:[`where had we put the equipment`,`where did we put the equipment`,`where we had put the equipment`,`where we did put the equipment`],a:2,e:`คำถามทางอ้อม (indirect question) ต้องเรียงคำแบบประโยคบอกเล่า คือ where + ประธาน + กริยา และไม่ใช้กริยาช่วย did จึงได้ where we had put the equipment`,m:`นักเรียนมักคงรูปคำถามเดิมไว้ ให้จำว่าเมื่อฝังคำถามไว้ในประโยคอื่น ต้องเปลี่ยนกลับเป็นการเรียงแบบบอกเล่าเสมอ`},{id:`arena-s10-q09`,s:`grammar`,k:`relative-clauses`,q:`____ in 1892, the wooden pavilion is the oldest building on the campus.`,c:[`Building`,`Built`,`Having build`,`It was built`],a:1,e:`ศาลาไม้เป็นสิ่งที่ "ถูกสร้าง" จึงใช้กริยาช่องที่ 3 ขึ้นต้นวลี ซึ่งย่อมาจาก Which was built in 1892`,m:`Building (V-ing) จะแปลว่าศาลาเป็นผู้สร้าง ซึ่งเป็นไปไม่ได้ ให้ถามเสมอว่าประธานเป็นผู้กระทำหรือผู้ถูกกระทำ`},{id:`arena-s10-q10`,s:`grammar`,k:`determiners`,q:`____ of the four routes is suitable for beginners; every one of them is steep.`,c:[`Neither`,`Either`,`Any`,`None`],a:3,e:`None ใช้ปฏิเสธเมื่อพูดถึงสิ่งของตั้งแต่สามสิ่งขึ้นไป ส่วน Neither ใช้ได้กับสองสิ่งเท่านั้น ในที่นี้มีสี่เส้นทางจึงต้องใช้ None`,m:`จำคู่กันว่า neither = ไม่ทั้งสอง (2 สิ่ง), none = ไม่มีสักอย่าง (3 สิ่งขึ้นไป)`},{id:`arena-s10-q11`,s:`grammar`,k:`error-identification`,intro:`The amount of students who applied this year was far greater than the school had expected.`,q:`Which underlined part of the sentence above is WRONG?`,c:[`The amount of students`,`who applied this year`,`was far greater`,`than the school had expected`],a:0,e:`students เป็นคำนามนับได้พหูพจน์ จึงต้องใช้ the number of students ไม่ใช่ the amount of students เพราะ amount ใช้กับคำนามนับไม่ได้`,m:`จำว่า the number of + นามนับได้พหูพจน์ / the amount of + นามนับไม่ได้ เช่น the amount of water`},{id:`arena-s10-q12`,s:`conversation`,k:`situational-english`,intro:`On the telephone

,c:[`Apart from`,`Instead of`,`Because of`,`As well as`],a:0,e:`Apart from แปลว่า นอกจาก… (แล้วไม่มีอย่างอื่นอีก) ซึ่งเข้ากับข้อความว่าในภาพไม่มีร่องรอยอื่นเหลืออยู่เลยนอกจากรอยยิ้ม`,m:`As well as แปลว่า "รวมทั้ง" ซึ่งจะขัดกับคำว่า no sign ในประโยคเดียวกัน`},{id:`arena-s10-q19`,s:`cloze`,k:`cloze-linking`,p:`S10-C`,intro:`Blank (19)`,q:`They record the moment ____ not the effort that produced it.`,c:[`and`,`but`,`or`,`so`],a:1,e:`โครงสร้าง A but not B ใช้แสดงความขัดแย้งระหว่างสิ่งที่ภาพบันทึกไว้ (ช่วงเวลา) กับสิ่งที่ภาพไม่ได้บันทึก (ความพยายาม)`,m:`เมื่อเห็นคำว่า not ตามหลังช่องว่างทันที ให้นึกถึงคู่ but not ก่อนเสมอ`},{id:`arena-s10-q20`,s:`reading`,k:`reading-detail`,p:`S10-R1`,q:`How did the reading group begin?`,c:[`People collected books from a shop that was closing.`,`A retired teacher organised classes above a shop.`,`A nurse invited her patients to read together.`,`A bookseller opened a new club room in 2016.`],a:0,e:`ย่อหน้าที่สองเล่าว่าเจ้าของร้านหนังสือปิดกิจการแล้วยกหนังสือที่เหลือให้ใครก็ตามที่มารับ ลูกค้าหกคนจึงมาช่วยกันคัดแยก แล้วเริ่มอ่านออกเสียงกันโดยบังเอิญ`,m:`คำว่า by accident ในประโยคแรกของย่อหน้าเป็นสัญญาณว่ากลุ่มนี้ไม่ได้ถูกจัดตั้งอย่างเป็นทางการ`},{id:`arena-s10-q21`,s:`reading`,k:`reading-cause-effect`,p:`S10-R1`,q:`Why was the rule about explanations introduced?`,c:[`Because some members read too slowly`,`Because the youngest member could not follow the story`,`Because judgements were being made too early`,`Because the chapters chosen were too long`],a:2,e:`ย่อหน้าที่สามอธิบายว่ากฎนี้เกิดขึ้นหลังการโต้เถียง เมื่อสมาชิกคนหนึ่งขัดจังหวะเพื่อบอกว่าผู้เขียน "ผิดชัด ๆ" กลุ่มจึงสรุปว่า judgement was arriving too early`,v:`assess = ประเมิน, judgement = การตัดสิน`},{id:`arena-s10-q22`,s:`reading`,k:`reading-title`,p:`S10-R1`,q:`Which is the best title for this passage?`,c:[`A Shop That Became a Library`,`Listening Before Judging`,`How to Choose a Book Each Month`,`The Youngest Reader in Lampang`],a:1,e:`ทั้งบทความเน้นกฎห้ามอธิบายก่อนจบบท เหตุผลเบื้องหลัง และผลที่ทำให้สมาชิกฟังผู้อื่นได้ดีขึ้น ชื่อเรื่องที่ครอบคลุมที่สุดจึงเป็น Listening Before Judging`,m:`ชื่อเรื่องที่ดีต้องครอบคลุมย่อหน้าสุดท้ายด้วย ไม่ใช่แค่ที่มาของกลุ่มในย่อหน้าที่สอง`},{id:`arena-s10-q23`,s:`reading`,k:`reading-detail`,p:`S10-R2`,q:`What is the total number of marks available on the paper?`,c:[`50`,`55`,`70`,`60`],a:3,e:`ข้อ 1–40 ข้อละ 1 คะแนน เท่ากับ 40 คะแนน และข้อ 41–50 จำนวน 10 ข้อ ข้อละ 2 คะแนน เท่ากับ 20 คะแนน รวมทั้งหมด 60 คะแนน`,m:`ต้องนับจำนวนข้อของช่วงหลังให้ถูก คือ 41 ถึง 50 มี 10 ข้อ ไม่ใช่ 9 ข้อ`},{id:`arena-s10-q24`,s:`reading`,k:`reading-inference`,p:`S10-R2`,q:`A candidate reaches the examination room at 8.40 a.m. What will happen?`,c:[`She will not be admitted to the room.`,`She must wait outside until 9.45 a.m.`,`She may enter and sit the paper.`,`She must keep her bag beside her desk.`],a:2,e:`ประกาศระบุว่าผู้ที่มาถึงหลัง 8.45 น. จะไม่ได้รับอนุญาตให้เข้าห้องสอบ ผู้ที่มาถึง 8.40 น. จึงยังเข้าสอบได้ แม้จะเลยเวลานั่งประจำที่ 8.20 น. แล้วก็ตาม`,m:`มีเวลาสองจุดในประกาศ คือเวลานั่งประจำที่และเวลาปิดรับ ให้แยกให้ชัดว่าเวลาใดคือเส้นตาย`},{id:`arena-s10-q25`,s:`reading`,k:`reading-inference`,p:`S10-R2`,q:`According to the instructions, what is the best thing to do with a question you cannot answer?`,c:[`Guess, because wrong answers are not penalised`,`Leave it blank so that no mark is lost`,`Write your working on the question paper`,`Raise your hand and ask for help with it`],a:0,e:`ประกาศระบุว่า There is no penalty for a wrong answer ดังนั้นการเดาจึงไม่มีความเสี่ยง แต่การเว้นว่างทำให้เสียโอกาสได้คะแนนไปเปล่า ๆ`,m:`การยกมือใช้เฉพาะกรณีขอกระดาษคำตอบใหม่ ไม่ใช่การถามเนื้อหาข้อสอบ`}]}];function Kr(e,t,n){var r,i,a;let o={};return Br.forEach((t,n)=>{o[t]=e.c[n]}),{id:e.id,setId:t.id,questionNumber:n+1,section:e.s,skill:e.k,difficulty:t.level,passageId:(r=e.p)==null?null:r,intro:e.intro,question:e.q,choices:o,choiceList:e.c,answerIndex:e.a,correctAnswer:Br[e.a],explanationTh:e.e,commonMistakeTh:(i=e.m)==null?null:i,vocabularyNoteTh:(
