. There was some money, a bus card and a photograph of a small girl with a white dog.`,`Nan wanted a new pencil case, and for a moment she looked at the money again. Then she looked at the photograph. Somebody was probably searching for this wallet at that very moment.`,`Nan took the wallet to the police station on Sukhon Road. The officer wrote her name in a big book and thanked her.`,`Two days later a woman came to Nan’s school with a box of cakes. She was the owner of the wallet, and the little girl in the photograph was her daughter.`]}],questions:[{id:`arena-s01-q01`,s:`vocabulary`,k:`vocab-context`,q:`My little brother is very ____. He asks a question about everything he sees.`,c:[`curious`,`careless`,`patient`,`silent`],a:0,e:`ประโยคที่สองบอกว่าน้องชาย "ถามคำถามเกี่ยวกับทุกสิ่งที่เห็น" ซึ่งเป็นลักษณะของคนที่อยากรู้อยากเห็น คำว่า curious แปลว่า อยากรู้อยากเห็น จึงตรงกับบริบทที่สุด`,m:`อย่าเลือกคำเพียงเพราะเป็นคำที่คุ้นตา ให้ใช้ประโยคขยาย (ประโยคที่สอง) เป็นเบาะแสเสมอ`,v:`curious = อยากรู้อยากเห็น, careless = สะเพร่า, patient = อดทน, silent = เงียบ`},{id:`arena-s01-q02`,s:`vocabulary`,k:`synonyms`,q:`The teacher said the homework was simple. Which word has the SAME meaning as "simple"?`,c:[`easy`,`long`,`useful`,`boring`],a:0,e:`simple ในประโยคนี้แปลว่า ง่าย จึงมีความหมายเหมือนกับ easy คำอื่นพูดถึงความยาว ประโยชน์ หรือความน่าเบื่อ ซึ่งเป็นคนละความหมาย`,v:`simple = ง่าย, ไม่ซับซ้อน; easy = ง่าย`},{id:`arena-s01-q03`,s:`vocabulary`,k:`antonyms`,q:`Which word is the OPPOSITE of "arrive"?`,c:[`travel`,`leave`,`wait`,`enter`],a:1,e:`arrive แปลว่า มาถึง คำที่มีความหมายตรงข้ามคือ leave ซึ่งแปลว่า ออกจาก / จากไป ส่วน enter แปลว่า เข้าไป ซึ่งใกล้เคียงกับ arrive มากกว่าจะตรงข้าม`,m:`นักเรียนไทยมักเลือก enter เพราะแปลว่า "เข้า" แต่คำตรงข้ามของ "มาถึง" คือ "ออกไป" ไม่ใช่ "เข้าไป"`},{id:`arena-s01-q04`,s:`vocabulary`,k:`collocations`,q:`Every morning I ____ my teeth before I go to school.`,c:[`wash`,`clean up`,`polish`,`brush`],a:3,e:`ภาษาอังกฤษใช้คำคู่กันว่า brush your teeth (แปรงฟัน) เป็นสำนวนที่เจ้าของภาษาใช้ประจำ แม้ wash และ clean จะแปลว่าทำความสะอาดได้ แต่ไม่ใช้กับ teeth`,m:`นักเรียนไทยมักแปลตรงตัวว่า "ล้างฟัน" จึงเลือก wash ให้จำเป็นคู่คำว่า brush + teeth`},{id:`arena-s01-q05`,s:`grammar`,k:`present-simple`,q:`My sister ____ her homework before dinner every evening.`,c:[`do`,`does`,`doing`,`did`],a:1,e:`วลี every evening บอกว่าเป็นกิจวัตร จึงใช้ Present Simple และประธาน My sister เป็นเอกพจน์บุรุษที่ 3 กริยาจึงต้องเติม -es เป็น does`,m:`นักเรียนมักลืมเติม -s / -es เมื่อประธานเป็น he, she, it หรือคำนามเอกพจน์`},{id:`arena-s01-q06`,s:`grammar`,k:`present-continuous`,q:`Be quiet, please. The baby ____ in the next room.`,c:[`is sleeping`,`sleeps`,`sleep`,`slept`],a:0,e:`ประโยค Be quiet, please. บอกว่าเหตุการณ์กำลังเกิดขึ้นในขณะนี้ จึงใช้ Present Continuous คือ is + V-ing และประธาน The baby เป็นเอกพจน์จึงใช้ is sleeping`,m:`sleeps เป็น Present Simple ใช้กับกิจวัตร ไม่ใช้กับสิ่งที่กำลังเกิดขึ้นตอนนี้`},{id:`arena-s01-q07`,s:`grammar`,k:`past-simple`,q:`We ____ to Hua Hin with my grandparents last weekend.`,c:[`go`,`gone`,`went`,`are going`],a:2,e:`last weekend เป็นคำบอกเวลาในอดีตที่จบไปแล้ว จึงต้องใช้ Past Simple กริยา go เป็นกริยาอปกติ รูปอดีตคือ went`,m:`gone เป็นช่องที่ 3 ใช้ตามลำพังไม่ได้ ต้องมี have / has นำหน้าเสมอ`},{id:`arena-s01-q08`,s:`grammar`,k:`prepositions`,q:`Our English test is ____ Monday morning.`,c:[`in`,`at`,`to`,`on`],a:3,e:`ใช้ on กับวันและวันที่ รวมถึงช่วงเวลาของวันใดวันหนึ่งโดยเฉพาะ เช่น on Monday morning ส่วน in the morning ใช้เมื่อไม่ระบุวัน`,m:`นักเรียนมักตอบ in เพราะเคยจำว่า in the morning แต่เมื่อมีชื่อวันนำหน้า ต้องเปลี่ยนเป็น on`},{id:`arena-s01-q09`,s:`grammar`,k:`quantifiers`,q:`There isn’t ____ milk in the fridge. Please buy some.`,c:[`many`,`a few`,`several`,`much`],a:3,e:`milk เป็นคำนามนับไม่ได้ จึงใช้ much ในประโยคปฏิเสธ ส่วน many, a few และ several ใช้กับคำนามนับได้พหูพจน์เท่านั้น`,m:`จำหลักง่าย ๆ ว่า many + นามนับได้ / much + นามนับไม่ได้`},{id:`arena-s01-q10`,s:`grammar`,k:`comparisons`,q:`An elephant is ____ than a horse.`,c:[`heavy`,`more heavy`,`heavier`,`the heaviest`],a:2,e:`คำว่า than บอกว่าเป็นการเปรียบเทียบขั้นกว่า คำคุณศัพท์สองพยางค์ที่ลงท้ายด้วย -y ให้เปลี่ยน y เป็น i แล้วเติม -er จึงได้ heavier`,m:`อย่าใช้ more กับคำคุณศัพท์สั้น ๆ เช่น more heavy เป็นรูปที่ผิด`},{id:`arena-s01-q11`,s:`grammar`,k:`articles`,q:`Ploy is carrying ____ orange umbrella and a small bag.`,c:[`an`,`a`,`the`,`some`],a:0,e:`ใช้ an นำหน้าคำที่ออกเสียงสระ (a, e, i, o, u) คำว่า orange ขึ้นต้นด้วยเสียงสระ /ɒ/ จึงต้องใช้ an`,m:`ให้ดูที่ "เสียง" ของคำถัดไป ไม่ใช่ตัวสะกด เช่น an hour (h ไม่ออกเสียง) แต่ a university (ออกเสียง yu)`},{id:`arena-s01-q12`,s:`conversation`,k:`situational-english`,intro:`Ann: Thank you for carrying my bag.
Bee: ____`,q:`Choose the best reply for Bee.`,c:[`You’re welcome.`,`Yes, please.`,`Never mind me.`,`I am fine, thank you.`],a:0,e:`เมื่อมีคนกล่าวขอบคุณ คำตอบที่เป็นธรรมชาติที่สุดคือ You’re welcome. (ด้วยความยินดี) ส่วน I am fine, thank you. ใช้ตอบคำถาม How are you? เท่านั้น`,m:`นักเรียนไทยมักตอบ I am fine, thank you. กับทุกสถานการณ์ ให้ดูว่าอีกฝ่ายพูดอะไรมาก่อน`},{id:`arena-s01-q13`,s:`conversation`,k:`situational-english`,intro:`In the classroom
Karn: Can I borrow your ruler, please?
Mint: ____`,q:`Choose the best reply for Mint.`,c:[`No, thank you.`,`Sure. Here you are.`,`Yes, I can.`,`I borrow it, please.`],a:1,e:`คำขอยืมของแบบสุภาพควรตอบด้วยการอนุญาตพร้อมส่งของให้ คือ Sure. Here you are. ส่วน Yes, I can. เป็นการตอบว่า "ฉันทำได้" ซึ่งไม่ตรงกับคำถามที่ถามว่า "ฉันขอยืมได้ไหม"`,m:`คำถาม Can I…? ถามถึงตัวผู้พูดเอง จึงตอบว่า Yes, you can. หรือใช้ประโยคธรรมชาติ เช่น Sure. / Of course.`},{id:`arena-s01-q14`,s:`conversation`,k:`situational-english`,intro:`At a bookshop
Customer: How much is this notebook?
Shop assistant: ____`,q:`Choose the best reply for the shop assistant.`,c:[`It is very nice.`,`There are ten.`,`It’s forty-five baht.`,`I like it very much.`],a:2,e:`คำถาม How much…? ถามราคา จึงต้องตอบด้วยจำนวนเงิน คือ It’s forty-five baht. ตัวเลือกอื่นตอบเรื่องความสวยงาม จำนวน หรือความชอบ ซึ่งไม่ตรงคำถาม`,m:`How much = ราคาเท่าไร / How many = จำนวนกี่ชิ้น อย่าสับสนกัน`},{id:`arena-s01-q15`,s:`conversation`,k:`situational-english`,intro:`A student arrives late.
Student: I’m sorry I’m late, Miss Ann.
Teacher: ____`,q:`Choose the best reply for the teacher.`,c:[`Yes, you are late.`,`You’re welcome to be late.`,`Never mind, I am late too.`,`That’s all right. Come in and sit down.`],a:3,e:`เมื่อมีคนขอโทษ คำตอบที่สุภาพและเป็นธรรมชาติคือการให้อภัยแล้วบอกให้ทำสิ่งต่อไป คือ That’s all right. Come in and sit down.`,m:`You’re welcome. ใช้ตอบคำขอบคุณ ไม่ใช้ตอบคำขอโทษ`},{id:`arena-s01-q16`,s:`cloze`,k:`cloze-linking`,p:`S01-C`,intro:`Blank (16)`,q:`He wanted to buy a new bicycle for me ____ my old one was too small.`,c:[`but`,`because`,`or`,`so`],a:1,e:`ข้อความหลังช่องว่างคือ "จักรยานคันเก่าเล็กเกินไป" ซึ่งเป็นเหตุผลของการซื้อคันใหม่ จึงต้องใช้คำเชื่อมแสดงเหตุผลคือ because`,m:`so ใช้นำหน้า "ผล" ไม่ใช่ "เหตุ" ถ้าจะใช้ so ต้องเขียนว่า My old bicycle was too small, so he bought a new one.`},{id:`arena-s01-q17`,s:`cloze`,k:`cloze-grammar`,p:`S01-C`,intro:`Blank (17)`,q:`I chose a blue one ____ a basket in front.`,c:[`with`,`of`,`for`,`by`],a:0,e:`ใช้ with เพื่อบอกว่าสิ่งของนั้น "มี" ส่วนประกอบอะไรอยู่ เช่น a bicycle with a basket = จักรยานที่มีตะกร้า`,m:`อย่าแปลตรงตัวจากภาษาไทยว่า "ของ" แล้วเลือก of เพราะ of ใช้แสดงความเป็นเจ้าของหรือส่วนหนึ่งของสิ่งใหญ่กว่า`},{id:`arena-s01-q18`,s:`cloze`,k:`cloze-linking`,p:`S01-C`,intro:`Blank (18)`,q:`My father asked the shop assistant to check the brakes ____ we left the shop.`,c:[`after`,`until`,`before`,`while`],a:2,e:`การตรวจเบรกต้องเกิดขึ้นก่อนที่จะออกจากร้าน จึงใช้ before ที่แปลว่า ก่อนที่ ถ้าใช้ after ความหมายจะกลับกันและไม่สมเหตุสมผล`},{id:`arena-s01-q19`,s:`cloze`,k:`cloze-vocabulary`,p:`S01-C`,intro:`Blank (19)`,q:`Now I ride my new bicycle to school every morning, and I always ____ a helmet.`,c:[`dress`,`put`,`carry`,`wear`],a:3,e:`ภาษาอังกฤษใช้ wear กับสิ่งที่สวมใส่บนร่างกาย เช่น wear a helmet / wear a hat ส่วน put ต้องมี on ต่อท้ายจึงจะถูก (put on a helmet)`,v:`wear = สวมใส่ (อยู่ในสภาพสวมอยู่), put on = สวมเข้าไป (ขณะกำลังใส่), carry = ถือ`},{id:`arena-s01-q20`,s:`reading`,k:`reading-purpose`,p:`S01-R1`,q:`What is the main purpose of this notice?`,c:[`To sell new books to parents.`,`To tell students about special library activities.`,`To ask students to join the school library.`,`To explain how to look after library books.`],a:1,e:`ประกาศนี้เล่ารายการกิจกรรมพิเศษของแต่ละวันในสัปดาห์ห้องสมุด ทั้ง Book Sale, Reading Race และ Story Time จุดประสงค์หลักจึงเป็นการแจ้งกิจกรรมพิเศษให้นักเรียนทราบ`,m:`มีคำว่า Book Sale อยู่ในเนื้อเรื่อง แต่การขายหนังสือเป็นเพียงกิจกรรมเดียว ไม่ใช่จุดประสงค์ของประกาศทั้งหมด`},{id:`arena-s01-q21`,s:`reading`,k:`reading-detail`,p:`S01-R1`,q:`How many books may a student borrow during Library Week?`,c:[`Two`,`Three`,`Four`,`Ten`],a:2,e:`ย่อหน้าสุดท้ายเขียนว่า students may borrow four books instead of two ดังนั้นจำนวนที่ยืมได้ในสัปดาห์ห้องสมุดคือ 4 เล่ม ส่วน 2 เล่มคือจำนวนปกติในสัปดาห์อื่น`,m:`ระวังตัวเลขที่ปรากฏในข้อความแต่ทำหน้าที่อื่น เช่น three books ในกิจกรรม Reading Race และ 10 baht ที่เป็นราคา`},{id:`arena-s01-q22`,s:`reading`,k:`reading-inference`,p:`S01-R1`,q:`Nut borrows a book on Monday 6 July. When must he return it?`,c:[`By Friday 10 July`,`On Wednesday 8 July`,`Before 7.30 a.m.`,`By Friday 17 July`],a:3,e:`ประกาศระบุว่า All books must be returned by Friday 17 July ซึ่งใช้กับหนังสือทุกเล่มที่ยืมในสัปดาห์นั้น หนังสือที่ยืมวันจันทร์ที่ 6 กรกฎาคมจึงต้องคืนภายในวันศุกร์ที่ 17 กรกฎาคม`,m:`วันที่ 10 กรกฎาคมเป็นวันสุดท้ายของ Library Week ไม่ใช่วันกำหนดคืนหนังสือ`},{id:`arena-s01-q23`,s:`reading`,k:`reading-detail`,p:`S01-R2`,q:`Where did Nan find the wallet?`,c:[`At the police station`,`In her school bag`,`On the ground near the bus stop`,`Inside a shop on Sukhon Road`],a:2,e:`ย่อหน้าแรกเขียนว่า she saw a brown wallet on the ground near the bus stop ส่วนสถานีตำรวจบนถนน Sukhon เป็นที่ที่เธอนำกระเป๋าไปส่ง ไม่ใช่ที่ที่เธอพบ`},{id:`arena-s01-q24`,s:`reading`,k:`reading-inference`,p:`S01-R2`,q:`Why did Nan decide NOT to keep the money?`,c:[`She already had a new pencil case.`,`She realised that somebody had lost the wallet.`,`A police officer was watching her.`,`There was not very much money inside.`],a:1,e:`เรื่องเล่าว่าเมื่อเธอมองรูปถ่าย เธอคิดว่า somebody was probably searching for this wallet ซึ่งแสดงว่าเธอนึกถึงเจ้าของที่กำลังตามหา จึงตัดสินใจไม่เก็บเงินไว้`,m:`ข้อความไม่ได้บอกว่ามีตำรวจเฝ้าดู หรือเงินมีน้อย อย่าเดาเหตุผลที่เรื่องไม่ได้กล่าวถึง`},{id:`arena-s01-q25`,s:`reading`,k:`reading-title`,p:`S01-R2`,q:`What is the best title for this story?`,c:[`A Day at the Police Station`,`How to Buy a Pencil Case`,`My Favourite Photograph`,`An Honest Student`],a:3,e:`ทั้งเรื่องเล่าถึงการที่แนนเก็บกระเป๋าเงินได้แล้วนำไปคืน ซึ่งแสดงความซื่อสัตย์ ชื่อเรื่องที่ครอบคลุมใจความสำคัญที่สุดจึงเป็น An Honest Student`,m:`ชื่อเรื่องที่ดีต้องครอบคลุมทั้งเรื่อง ไม่ใช่หยิบรายละเอียดเล็ก ๆ เช่น สถานีตำรวจหรือรูปถ่ายมาตั้งชื่อ`}]},{id:2,title:`Build Your Score`,level:`foundation-plus`,minutes:30,focus:`Future forms, phrasal verbs and short factual texts.`,passages:[{id:`S02-C`,kind:`Cloze passage`,title:`The School Garden`,body:[`Last term our class started a small garden behind the science building. Our teacher, Mr. Somchai, gave each group a box of seeds and __(16)__ us how to plant them.`,`At first nothing happened, __(17)__ after two weeks tiny green leaves appeared above the soil. We water the plants every morning __(18)__ we go to our first lesson.`,`Last week we picked our first tomatoes and gave __(19)__ to the school kitchen.`]},{id:`S02-R1`,kind:`Advertisement`,title:`Blue Wave Swimming Club`,body:[`Learn to swim this summer at Blue Wave Swimming Club!`,`Classes for beginners aged 7 to 12. Small groups of six students with one teacher.`,`Monday to Friday: 4.00 p.m. – 5.00 p.m. Saturday morning: 9.00 a.m. – 11.00 a.m.`,`Price: 1,500 baht for ten lessons. Students bring their own towel and swimming cap. Goggles can be borrowed at the pool.`,`The first lesson is free for new members.`],footer:[`Call 02-555-1234 or ask at the club office next to the car park.`]},{id:`S02-R2`,kind:`Diary entry`,title:`Friday 12 August`,body:[`Today was the most exciting day of the term. Our class went to the science museum in the city. The bus left school at eight o’clock and I sat next to Fon.`,`My favourite room was the space room. There was a model of the moon on the ceiling and a machine that showed how heavy you would be on other planets. On the moon I weighed only six kilograms!`,`At lunchtime it started to rain, so we ate our sandwiches inside the museum café instead of in the garden. Fon spilt orange juice on my shirt, but I wasn’t angry. She looked so worried that I laughed, and then she laughed too.`,`We got back to school at four o’clock. I was tired, but I have already asked my mother if we can go again in the holiday.`]}],questions:[{id:`arena-s02-q01`,s:`vocabulary`,k:`vocab-context`,q:`The road was very ____ this morning, so our bus arrived twenty minutes late.`,c:[`empty`,`busy`,`narrow`,`quiet`],a:1,e:`ผลที่ตามมาคือรถโรงเรียนมาสาย 20 นาที สาเหตุที่สมเหตุสมผลที่สุดคือถนนมีรถมาก คำว่า busy เมื่อใช้กับถนนแปลว่า มีรถหนาแน่น (รถติด)`,m:`empty และ quiet แปลว่าถนนโล่ง ซึ่งจะทำให้รถมาถึงเร็วขึ้น ไม่ใช่ช้าลง ให้ตรวจว่าคำตอบสอดคล้องกับ "ผล" ในประโยคหรือไม่`,v:`busy road = ถนนที่มีรถหนาแน่น, narrow = แคบ`},{id:`arena-s02-q02`,s:`vocabulary`,k:`phrasal-verbs`,q:`It is quite cold in this room. Please ____ your jacket.`,c:[`take off`,`look after`,`give up`,`put on`],a:3,e:`เมื่ออากาศหนาว เราต้องสวมเสื้อแจ็กเก็ต กริยาวลี put on แปลว่า สวมใส่เข้าไป ส่วน take off แปลว่า ถอดออก ซึ่งตรงข้ามกับบริบท`,v:`put on = สวมใส่, take off = ถอดออก, look after = ดูแล, give up = ยอมแพ้/เลิก`},{id:`arena-s02-q03`,s:`vocabulary`,k:`synonyms`,q:`Mali was delighted when she heard the news. "Delighted" means ____.`,c:[`very happy`,`very tired`,`very surprised`,`very sorry`],a:0,e:`delighted เป็นคำคุณศัพท์ที่แสดงความรู้สึกยินดีอย่างมาก จึงมีความหมายเท่ากับ very happy ส่วน surprised แปลว่าประหลาดใจ ซึ่งอาจเป็นได้ทั้งดีและไม่ดี`,v:`delighted = ดีใจมาก, surprised = ประหลาดใจ`},{id:`arena-s02-q04`,s:`vocabulary`,k:`antonyms`,q:`Which word is the OPPOSITE of "polite"?`,c:[`helpful`,`quiet`,`rude`,`honest`],a:2,e:`polite แปลว่า สุภาพ คำที่มีความหมายตรงข้ามคือ rude ซึ่งแปลว่า หยาบคาย ส่วน quiet แปลว่าเงียบ ไม่ใช่ความหมายตรงข้ามของสุภาพ`,m:`คำตรงข้ามต้องอยู่ในเรื่องเดียวกัน (มารยาท) ไม่ใช่เพียงคำที่ให้ความรู้สึกต่างกัน`},{id:`arena-s02-q05`,s:`grammar`,k:`future-forms`,q:`Look at those dark clouds! It ____ rain very soon.`,c:[`rains`,`rained`,`is going to`,`will be`],a:2,e:`เมื่อมีหลักฐานที่มองเห็นได้ในปัจจุบัน (เมฆดำ) แล้วทำนายสิ่งที่จะเกิดขึ้น ภาษาอังกฤษใช้ be going to + กริยาช่องที่ 1 จึงได้ It is going to rain.`,m:`will be rain ผิดโครงสร้าง เพราะหลัง will ต้องตามด้วยกริยารูปพื้นฐานคือ will rain`},{id:`arena-s02-q06`,s:`grammar`,k:`present-perfect`,q:`Ann has lived in Bangkok ____ 2019.`,c:[`since`,`for`,`from`,`in`],a:0,e:`ใช้ since กับ "จุดเริ่มต้นของเวลา" เช่น ปี ค.ศ. วัน หรือเหตุการณ์ ส่วน for ใช้กับ "ช่วงระยะเวลา" เช่น for three years`,m:`นักเรียนมักสับสน since กับ for จำว่า since 2019 (ตั้งแต่ปี 2019) แต่ for five years (เป็นเวลา 5 ปี)`},{id:`arena-s02-q07`,s:`grammar`,k:`countability`,q:`How ____ eggs do we need for this cake?`,c:[`much`,`little`,`a lot`,`many`],a:3,e:`eggs เป็นคำนามนับได้พหูพจน์ จึงใช้ How many ส่วน How much ใช้กับคำนามนับไม่ได้ เช่น How much sugar…?`,m:`ให้ดูที่ -s ท้ายคำนาม ถ้านับได้และเป็นพหูพจน์ ให้ใช้ many เสมอ`},{id:`arena-s02-q08`,s:`grammar`,k:`adjectives-adverbs`,q:`Nok studies hard, and she speaks English very ____.`,c:[`good`,`well`,`better`,`best`],a:1,e:`คำที่ขยายกริยา speaks ต้องเป็นคำวิเศษณ์ (adverb) คำวิเศษณ์ของ good คือ well จึงได้ speaks English very well`,m:`good เป็นคำคุณศัพท์ใช้ขยายคำนาม เช่น good English แต่เมื่อขยายกริยาต้องใช้ well`},{id:`arena-s02-q09`,s:`grammar`,k:`pronouns`,q:`This blue bag isn’t mine. Is it ____?`,c:[`yours`,`your`,`you`,`yourself`],a:0,e:`ตำแหน่งหลัง Is it ต้องการคำสรรพนามแสดงความเป็นเจ้าของแบบยืนตามลำพัง (possessive pronoun) คือ yours ส่วน your ต้องมีคำนามตามหลังเสมอ เช่น your bag`,m:`จำคู่กันว่า my–mine, your–yours, his–his, her–hers, our–ours, their–theirs`},{id:`arena-s02-q10`,s:`grammar`,k:`conjunctions`,q:`I wanted to play football after school, ____ it was raining heavily.`,c:[`and`,`so`,`but`,`because`],a:2,e:`สองข้อความนี้ขัดแย้งกัน (อยากเล่นฟุตบอล แต่ฝนตกหนัก) จึงต้องใช้คำเชื่อมที่แสดงความขัดแย้งคือ but`,m:`so ใช้นำหน้าผลลัพธ์ เช่น It was raining, so I stayed at home. ให้ตรวจว่าข้อความหลังคำเชื่อมเป็น "ผล" หรือ "ความขัดแย้ง"`},{id:`arena-s02-q11`,s:`grammar`,k:`question-forms`,q:`A: ____ does your brother go to school?    B: By bus.`,c:[`What`,`Where`,`Why`,`How`],a:3,e:`คำตอบ By bus. บอกวิธีการเดินทาง คำถามที่ถามวิธีการคือ How ส่วน Where ใช้ถามสถานที่ และ Why ใช้ถามเหตุผล`,m:`ให้ดูที่ "คำตอบ" ก่อนเสมอ แล้วย้อนกลับไปเลือกคำถามที่เข้าคู่กัน`},{id:`arena-s02-q12`,s:`conversation`,k:`situational-english`,intro:`At a restaurant
Waiter: Are you ready to order?
Customer: ____`,q:`Choose the best reply for the customer.`,c:[`I am ready, thank you.`,`Yes, I’d like the chicken rice, please.`,`No, I am not ready to eat.`,`Yes, I am ordering now.`],a:1,e:`พนักงานถามว่าพร้อมสั่งอาหารหรือยัง คำตอบที่เป็นธรรมชาติที่สุดคือการสั่งอาหารทันที เช่น Yes, I’d like the chicken rice, please. ซึ่งใช้ I’d like… เป็นสำนวนสุภาพในการสั่ง`,m:`ตัวเลือกอื่นถูกไวยากรณ์ แต่ไม่ทำให้บทสนทนาเดินหน้าต่อ ข้อสอบสนทนาวัดความเป็นธรรมชาติ ไม่ใช่แค่ไวยากรณ์`},{id:`arena-s02-q13`,s:`conversation`,k:`situational-english`,intro:`In the street
Tourist: Excuse me. How can I get to the post office?

Kate’s brother: ____`,q:`Choose the best reply for Kate’s brother.`,c:[`Just a moment, please. I’ll get her.`,`Yes, I am speaking now.`,`She is my sister.`,`Hello, who is that telephone?`],a:0,e:`เมื่อมีคนโทรมาขอสายอีกคน คำตอบมาตรฐานคือขอให้รอสักครู่แล้วไปตามคนนั้น เช่น Just a moment, please. I’ll get her.`,m:`สำนวนโทรศัพท์ที่ถูกต้องคือ Who’s calling, please? ไม่ใช่ Who is that telephone?`},{id:`arena-s02-q15`,s:`conversation`,k:`situational-english`,intro:`In the school office
Teacher: Shall I help you with those heavy boxes?
Student: ____`,q:`Choose the best reply for the student.`,c:[`No, I shall not.`,`Yes, you shall.`,`Yes, please. That’s very kind of you.`,`I am helping you, thank you.`],a:2,e:`Shall I…? เป็นการเสนอความช่วยเหลือ คำตอบที่สุภาพและเป็นธรรมชาติคือรับความช่วยเหลือพร้อมกล่าวขอบคุณ เช่น Yes, please. That’s very kind of you.`,m:`อย่าตอบคำถาม Shall I…? ด้วย Yes, you shall. เพราะไม่ใช่สำนวนที่เจ้าของภาษาใช้`},{id:`arena-s02-q16`,s:`cloze`,k:`cloze-grammar`,p:`S02-C`,intro:`Blank (16)`,q:`Mr. Somchai gave each group a box of seeds and ____ us how to plant them.`,c:[`showed`,`shows`,`showing`,`has shown`],a:0,e:`ประโยคนี้เล่าเหตุการณ์ในอดีต (Last term) และกริยาตัวแรกคือ gave ซึ่งเป็นรูปอดีต กริยาที่เชื่อมด้วย and จึงต้องเป็นรูปอดีตเช่นกันคือ showed`,m:`เมื่อมีกริยาสองตัวเชื่อมด้วย and ต้องใช้รูปกาลเดียวกัน (parallel structure)`},{id:`arena-s02-q17`,s:`cloze`,k:`cloze-linking`,p:`S02-C`,intro:`Blank (17)`,q:`At first nothing happened, ____ after two weeks tiny green leaves appeared above the soil.`,c:[`or`,`because`,`but`,`so`],a:2,e:`ข้อความสองส่วนขัดแย้งกัน คือ ตอนแรกไม่มีอะไรเกิดขึ้น แต่ต่อมามีใบงอกออกมา จึงใช้คำเชื่อมแสดงความขัดแย้งคือ but`},{id:`arena-s02-q18`,s:`cloze`,k:`cloze-linking`,p:`S02-C`,intro:`Blank (18)`,q:`We water the plants every morning ____ we go to our first lesson.`,c:[`after`,`before`,`until`,`while`],a:1,e:`การรดน้ำต้นไม้ตอนเช้าเกิดขึ้นก่อนเข้าเรียนคาบแรก จึงใช้ before ที่แปลว่า ก่อนที่จะ`,m:`while ใช้กับสองเหตุการณ์ที่เกิดพร้อมกัน ซึ่งไม่สมเหตุสมผลเพราะรดน้ำต้นไม้ขณะเรียนไม่ได้`},{id:`arena-s02-q19`,s:`cloze`,k:`cloze-reference`,p:`S02-C`,intro:`Blank (19)`,q:`Last week we picked our first tomatoes and gave ____ to the school kitchen.`,c:[`it`,`they`,`their`,`them`],a:3,e:`คำสรรพนามนี้แทนคำว่า tomatoes ซึ่งเป็นพหูพจน์ และอยู่ในตำแหน่งกรรมของกริยา gave จึงต้องใช้สรรพนามรูปกรรมพหูพจน์คือ them`,m:`they เป็นรูปประธาน ใช้เป็นกรรมไม่ได้ ส่วน their เป็นคำแสดงความเป็นเจ้าของ ต้องมีคำนามตามหลัง`},{id:`arena-s02-q20`,s:`reading`,k:`reading-detail`,p:`S02-R1`,q:`How long does one Saturday class last?`,c:[`One hour`,`Ninety minutes`,`Two hours`,`Ten hours`],a:2,e:`โฆษณาระบุว่าคลาสวันเสาร์คือ 9.00 a.m. – 11.00 a.m. ซึ่งกินเวลา 2 ชั่วโมง ส่วนคลาสวันจันทร์ถึงศุกร์คือ 4.00–5.00 p.m. ซึ่งยาว 1 ชั่วโมง`,m:`คำถามระบุ "วันเสาร์" ให้เลือกบรรทัดที่ตรงกับวันนั้น อย่าหยิบเวลาแรกที่เห็น`},{id:`arena-s02-q21`,s:`reading`,k:`reading-detail`,p:`S02-R1`,q:`What must students bring to a lesson?`,c:[`Goggles and a towel`,`A towel and a swimming cap`,`Only a swimming cap`,`A towel, goggles and a cap`],a:1,e:`โฆษณาเขียนว่า students bring their own towel and swimming cap และบอกว่า goggles can be borrowed at the pool แสดงว่าแว่นตาว่ายน้ำยืมได้ ไม่ต้องนำมาเอง`,m:`คำว่า goggles ปรากฏในเนื้อเรื่อง แต่เป็นสิ่งที่ "ยืมได้" ไม่ใช่สิ่งที่ต้องนำมา ระวังตัวเลือกที่ลอกคำจากบทอ่าน`},{id:`arena-s02-q22`,s:`reading`,k:`reading-purpose`,p:`S02-R1`,q:`Who is this advertisement mainly for?`,c:[`Adults who want to swim faster`,`Teachers who are looking for a job`,`Children who already swim very well`,`Children who are learning to swim`],a:3,e:`โฆษณาระบุว่า Classes for beginners aged 7 to 12 คือชั้นเรียนสำหรับผู้เริ่มต้นอายุ 7–12 ปี กลุ่มเป้าหมายจึงเป็นเด็กที่กำลังหัดว่ายน้ำ`,v:`beginner = ผู้เริ่มต้น`},{id:`arena-s02-q23`,s:`reading`,k:`reading-cause-effect`,p:`S02-R2`,q:`Why did the students eat inside the museum café?`,c:[`Because it began to rain`,`Because the garden was closed`,`Because they were late for the bus`,`Because the café food was free`],a:0,e:`ย่อหน้าที่สามเขียนว่า it started to rain, so we ate our sandwiches inside the museum café คำว่า so เชื่อมเหตุ (ฝนตก) กับผล (กินข้าวข้างใน)`,m:`มองหาคำเชื่อมแสดงเหตุผล เช่น so, because, that is why เพื่อระบุเหตุและผลได้เร็วขึ้น`},{id:`arena-s02-q24`,s:`reading`,k:`reading-inference`,p:`S02-R2`,q:`How did the writer feel when Fon spilt the juice?`,c:[`The writer was angry but said nothing.`,`The writer was not angry and found it funny.`,`The writer asked Fon to buy a new shirt.`,`The writer did not speak to Fon again.`],a:1,e:`ผู้เขียนบอกว่า I wasn’t angry และเล่าต่อว่า I laughed, and then she laughed too แสดงว่าไม่โกรธและยังรู้สึกขำด้วย`,m:`ข้อสอบแบบอนุมานต้องมีหลักฐานในบทอ่านเสมอ อย่าเลือกความรู้สึกที่เราคิดเองว่าน่าจะเป็น`},{id:`arena-s02-q25`,s:`reading`,k:`reading-conclusion`,p:`S02-R2`,q:`What does the last sentence of the diary show?`,c:[`The writer did not enjoy the trip.`,`The writer wants to change schools.`,`The writer would like to visit the museum again.`,`The writer’s mother works at the museum.`],a:2,e:`ประโยคสุดท้ายบอกว่าเธอถามแม่แล้วว่าจะไปอีกได้ไหมในช่วงปิดเทอม ซึ่งแสดงว่าเธออยากกลับไปพิพิธภัณฑ์อีกครั้ง`,m:`คำว่า tired ในประโยคเดียวกันอาจทำให้เข้าใจผิดว่าไม่สนุก แต่คำว่า but พลิกความหมายไปทางบวก`}]},{id:3,title:`Entrance Skills`,level:`intermediate`,minutes:32,focus:`Mixed tenses, relative clauses and evidence-based reading.`,passages:[{id:`S03-C`,kind:`Cloze passage`,title:`The Friday Night Market`,body:[`Every Friday evening a night market opens on the road beside our town hall. Stalls sell noodles, grilled chicken and fresh fruit, and the smell of the food __(16)__ along the whole street.`,`My mother usually buys mangoes there __(17)__ they are cheaper than in the supermarket. Last week I went with my friend Beam, who was looking for a present for his sister. He finally chose a small silver bracelet __(18)__ cost only ninety baht.`,`We stayed until nine o’clock, and by the time we left, most of the stall owners __(19)__ their lights off.`]},{id:`S03-R1`,kind:`Science article`,title:`Why Bees Matter`,body:[`Bees are small insects, but they do an important job for farmers all over the world. When a bee lands on a flower to drink nectar, a yellow dust called pollen sticks to its legs. The bee then carries this pollen to the next flower it visits. Without this movement of pollen, many plants cannot produce fruit or seeds.`,`About one third of the food we eat depends on insects like bees. Apples, mangoes, cucumbers and coffee all grow better when bees visit their flowers.`,`In recent years the number of bees in several countries has fallen. Scientists believe that chemicals used on farms, the loss of wild flowers and changes in the weather are the main reasons.`,`People can help in simple ways. Planting flowers that bloom at different times of the year gives bees food for more months, and leaving a shallow dish of water in the garden helps them on hot days.`]},{id:`S03-R2`,kind:`Timetable`,title:`School Bus — Route B`,body:[`Route B runs on every school day. Students should be waiting at their stop five minutes before the arrival time below.`,`On rainy days the bus may arrive up to ten minutes late. The afternoon bus leaves the school gate at 4.15 p.m. and calls at the same stops in the opposite order.`],table:{caption:`Morning journey`,headers:[`Stop`,`Arrival time`],rows:[[`Green Park`,`6.45 a.m.`],[`Sun Plaza`,`6.58 a.m.`],[`Wat Nong Bua`,`7.10 a.m.`],[`Ruam Jai Market`,`7.22 a.m.`],[`School gate`,`7.35 a.m.`]]},footer:[`Students who miss the bus should telephone the school office on 02-441-8899.`]}],questions:[{id:`arena-s03-q01`,s:`vocabulary`,k:`word-family`,q:`Somchai takes pictures for a newspaper. He works as a ____.`,c:[`photograph`,`photography`,`photographer`,`photographic`],a:2,e:`ตำแหน่งหลัง a ต้องการคำนามที่หมายถึง "คน" คำว่า photographer แปลว่า ช่างภาพ ส่วน photograph คือรูปถ่าย และ photography คือศิลปะการถ่ายภาพ`,m:`คำลงท้าย -er / -or มักหมายถึงคนที่ทำอาชีพนั้น เช่น teacher, actor, engineer`,v:`photograph = รูปถ่าย, photography = การถ่ายภาพ, photographer = ช่างภาพ, photographic = เกี่ยวกับการถ่ายภาพ`},{id:`arena-s03-q02`,s:`vocabulary`,k:`vocab-context`,q:`The instructions were so ____ that even my six-year-old brother could follow them.`,c:[`clear`,`strict`,`loud`,`wide`],a:0,e:`ผลที่ตามมาคือเด็กหกขวบยังทำตามได้ แสดงว่าคำสั่งนั้นเข้าใจง่าย คำว่า clear เมื่อใช้กับคำอธิบายแปลว่า ชัดเจน เข้าใจง่าย`,m:`so + adj + that… เป็นโครงสร้างบอกเหตุและผล ให้ใช้ข้อความหลัง that เป็นเบาะแสหาความหมายของคำคุณศัพท์`},{id:`arena-s03-q03`,s:`vocabulary`,k:`collocations`,q:`When you cross the road, you must ____ attention to the traffic.`,c:[`give`,`take`,`do`,`pay`],a:3,e:`ภาษาอังกฤษใช้คำคู่กันว่า pay attention (ให้ความสนใจ / ตั้งใจ) ไม่ใช้ give หรือ take กับคำว่า attention ในความหมายนี้`,m:`นักเรียนไทยมักแปลตรงตัวว่า "ให้ความสนใจ" แล้วเลือก give ให้จำเป็นวลีตายตัวว่า pay attention to…`},{id:`arena-s03-q04`,s:`vocabulary`,k:`academic-vocab`,q:`The students collected water samples for six months before they reached a clear ____.`,c:[`question`,`conclusion`,`problem`,`opinion`],a:1,e:`สิ่งที่ได้หลังจากเก็บข้อมูลมานานคือ "ข้อสรุป" คำว่า conclusion ใช้คู่กับ reach เสมอ คือ reach a conclusion`,v:`conclusion = ข้อสรุป, opinion = ความคิดเห็นส่วนตัว (ไม่จำเป็นต้องมาจากข้อมูล)`},{id:`arena-s03-q05`,s:`grammar`,k:`past-continuous`,q:`While we ____ dinner, the electricity suddenly went off.`,c:[`ate`,`have eaten`,`eat`,`were eating`],a:3,e:`โครงสร้าง While + Past Continuous, Past Simple ใช้เล่าเหตุการณ์สั้น ๆ (ไฟดับ) ที่เกิดขึ้นแทรกระหว่างเหตุการณ์ที่กำลังดำเนินอยู่ (กำลังกินข้าว) จึงใช้ were eating`,m:`จำคู่กันว่า While + กำลังทำอยู่ / When + เหตุการณ์ที่เกิดขึ้นทันที`},{id:`arena-s03-q06`,s:`grammar`,k:`past-simple`,q:`I ____ my uncle in Phuket last April.`,c:[`have visited`,`visited`,`have been visiting`,`visit`],a:1,e:`last April เป็นเวลาในอดีตที่ระบุชัดเจนและจบไปแล้ว จึงต้องใช้ Past Simple คือ visited ไม่ใช้ Present Perfect กับเวลาที่ระบุชัดในอดีต`,m:`ห้ามใช้ have + V3 คู่กับคำบอกเวลาอดีตที่ชัดเจน เช่น yesterday, last week, in 2020`},{id:`arena-s03-q07`,s:`grammar`,k:`relative-clauses`,q:`The girl ____ won the speech contest sits next to me in class.`,c:[`which`,`whom`,`who`,`she`],a:2,e:`คำที่ถูกขยายคือ The girl ซึ่งเป็นคน และทำหน้าที่เป็นประธานของกริยา won จึงใช้ who ส่วน whom ใช้เมื่อเป็นกรรม และ which ใช้กับสิ่งของ`,m:`อย่าใส่ she เพิ่มเข้าไป เพราะประโยคจะมีประธานซ้อนกันสองตัว`},{id:`arena-s03-q08`,s:`grammar`,k:`modals`,q:`You look really tired. You ____ go to bed early tonight.`,c:[`should`,`must not`,`can hardly`,`would rather`],a:0,e:`ประโยคนี้เป็นการให้คำแนะนำ จึงใช้ should ที่แปลว่า ควรจะ ส่วน must not แปลว่า ห้าม ซึ่งขัดกับบริบทที่หวังดี`,m:`should = แนะนำ, must = จำเป็นต้องทำ, must not = ห้ามทำ ความหมายต่างกันมาก`},{id:`arena-s03-q09`,s:`grammar`,k:`verb-patterns`,q:`My cousin enjoys ____ comics in his free time.`,c:[`to read`,`reading`,`read`,`reads`],a:1,e:`กริยา enjoy ต้องตามด้วย V-ing เสมอ จึงได้ enjoys reading กลุ่มกริยาที่ตามด้วย -ing ได้แก่ enjoy, finish, avoid, mind, practise`,m:`นักเรียนมักเติม to โดยอัตโนมัติ ให้จำกลุ่มคำที่ตามด้วย -ing แยกจากกลุ่มที่ตามด้วย to + verb เช่น want, decide, hope`},{id:`arena-s03-q10`,s:`grammar`,k:`passive-voice`,q:`This wooden bridge ____ by local villagers in 1998.`,c:[`built`,`was building`,`has built`,`was built`],a:3,e:`สะพานเป็นสิ่งที่ "ถูกสร้าง" ไม่ได้สร้างเอง และวลี by local villagers ยืนยันว่าเป็นประโยคกรรมวาจก เมื่อเป็นอดีต (in 1998) จึงใช้ was + V3 คือ was built`,m:`สัญญาณของ passive คือ by + ผู้กระทำ ให้มองหาคำว่า by ก่อนเลือกคำตอบ`},{id:`arena-s03-q11`,s:`grammar`,k:`quantifiers`,q:`We have very ____ time before the train leaves, so please hurry.`,c:[`little`,`few`,`a few`,`many`],a:0,e:`time ในความหมายนี้เป็นคำนามนับไม่ได้ จึงใช้ little และคำว่า very little แปลว่า น้อยมาก ซึ่งเข้ากับคำสั่งให้รีบ`,m:`few / a few ใช้กับนามนับได้พหูพจน์ ส่วน little / a little ใช้กับนามนับไม่ได้`},{id:`arena-s03-q12`,s:`conversation`,k:`situational-english`,intro:`At a clinic
Nurse: How long have you had this cough?
Patient: ____`,q:`Choose the best reply for the patient.`,c:[`I have a bad cough.`,`It is very painful, thank you.`,`For about three days.`,`Yes, I have had it.`],a:2,e:`คำถาม How long…? ถามระยะเวลา จึงต้องตอบด้วยช่วงเวลา เช่น For about three days. ตัวเลือกอื่นไม่ได้ตอบคำถามเรื่องเวลา`,m:`How long = นานเท่าไร ให้ตอบด้วย for + ระยะเวลา หรือ since + จุดเริ่มต้น`},{id:`arena-s03-q13`,s:`conversation`,k:`situational-english`,intro:`Ploy: Would you like to come to my birthday party on Saturday?
June: ____`,q:`Choose the best reply for June.`,c:[`I’d love to. Thank you for inviting me.`,`Yes, I like your birthday very much.`,`Of course. I will bring my homework.`,`Never mind. Perhaps next year.`],a:0,e:`คำเชิญที่ขึ้นต้นด้วย Would you like to…? ควรตอบรับด้วยสำนวนธรรมชาติว่า I’d love to. แล้วกล่าวขอบคุณสำหรับคำเชิญ`,m:`I like your birthday. ถูกไวยากรณ์แต่ไม่ตอบคำเชิญ ข้อสอบสนทนาให้ดูว่าคำตอบทำให้บทสนทนาเดินหน้าหรือไม่`},{id:`arena-s03-q14`,s:`conversation`,k:`situational-english`,intro:`Kan: I think the school library should open at the weekend.
Nut: ____`,q:`Choose the best reply for Nut, who agrees with Kan.`,c:[`I am thinking so too, isn’t it?`,`That is a true idea.`,`You are right, so I disagree.`,`So do I. It would really help students who study on Saturdays.`],a:3,e:`เมื่อเห็นด้วยกับประโยคบอกเล่าที่ขึ้นต้นด้วย I think… เราตอบว่า So do I. (ฉันก็คิดเช่นกัน) แล้วเสริมเหตุผลสั้น ๆ ทำให้บทสนทนาเป็นธรรมชาติ`,m:`สำนวนเห็นด้วยที่ถูกต้องคือ So do I. / I agree. ไม่ใช่ I am thinking so too.`},{id:`arena-s03-q15`,s:`conversation`,k:`situational-english`,intro:`Beam: I’m afraid I broke my arm during the football match.
Ann: ____`,q:`Choose the best reply for Ann.`,c:[`Congratulations!`,`Oh no! I’m sorry to hear that.`,`That’s very good news.`,`Never mind, it doesn’t matter.`],a:1,e:`เมื่อได้ยินข่าวร้าย สำนวนที่ใช้แสดงความเห็นใจคือ I’m sorry to hear that. ส่วน Never mind ใช้ปลอบเมื่อเรื่องนั้นเล็กน้อย ไม่เหมาะกับการบาดเจ็บ`,m:`I’m sorry to hear that. ไม่ได้แปลว่า "ฉันขอโทษ" แต่แปลว่า "เสียใจด้วยนะ"`},{id:`arena-s03-q16`,s:`cloze`,k:`cloze-grammar`,p:`S03-C`,intro:`Blank (16)`,q:`Stalls sell noodles, grilled chicken and fresh fruit, and the smell of the food ____ along the whole street.`,c:[`spread`,`spreads`,`spreading`,`have spread`],a:1,e:`ย่อหน้านี้เล่าสิ่งที่เกิดขึ้นเป็นประจำทุกวันศุกร์ จึงใช้ Present Simple ประธานคือ the smell (เอกพจน์) ไม่ใช่ food กริยาจึงต้องเติม -s เป็น spreads`,m:`ระวังคำนามที่อยู่ใกล้ช่องว่างที่สุด (food) เพราะประธานจริงคือคำหน้า of ซึ่งก็คือ the smell`},{id:`arena-s03-q17`,s:`cloze`,k:`cloze-linking`,p:`S03-C`,intro:`Blank (17)`,q:`My mother usually buys mangoes there ____ they are cheaper than in the supermarket.`,c:[`although`,`but`,`so`,`because`],a:3,e:`ข้อความหลังช่องว่างเป็นเหตุผลของการซื้อมะม่วงที่ตลาด จึงใช้คำเชื่อมแสดงเหตุผลคือ because ส่วน although แสดงความขัดแย้ง`},{id:`arena-s03-q18`,s:`cloze`,k:`cloze-grammar`,p:`S03-C`,intro:`Blank (18)`,q:`He finally chose a small silver bracelet ____ cost only ninety baht.`,c:[`who`,`what`,`which`,`whose`],a:2,e:`คำที่ถูกขยายคือ bracelet ซึ่งเป็นสิ่งของ และเป็นประธานของกริยา cost จึงใช้ which (หรือ that) ส่วน who ใช้กับคน`,m:`what ใช้เป็นคำเชื่อมขยายคำนามไม่ได้ ต้องเลือกระหว่าง who / which / that ตามชนิดของคำนาม`},{id:`arena-s03-q19`,s:`cloze`,k:`cloze-grammar`,p:`S03-C`,intro:`Blank (19)`,q:`We stayed until nine o’clock, and by the time we left, most of the stall owners ____ their lights off.`,c:[`had turned`,`turn`,`have turned`,`were turning`],a:0,e:`วลี by the time we left บอกเหตุการณ์ในอดีต และการปิดไฟเกิดขึ้น "ก่อน" เหตุการณ์นั้น จึงใช้ Past Perfect คือ had + V3 = had turned`,m:`สัญญาณของ Past Perfect คือมีสองเหตุการณ์ในอดีต และเราต้องบอกว่าเหตุการณ์ใดเกิดก่อน`},{id:`arena-s03-q20`,s:`reading`,k:`reading-main-idea`,p:`S03-R1`,q:`What is the main idea of the passage?`,c:[`Bees are dangerous insects that live near farms.`,`Bees drink nectar from many different flowers.`,`Farmers should use more chemicals on their crops.`,`Bees help plants produce food, so people should protect them.`],a:3,e:`บทอ่านอธิบายว่าผึ้งช่วยพืชผสมเกสรจนเกิดผลและเมล็ด จำนวนผึ้งกำลังลดลง และคนช่วยได้อย่างไร ใจความสำคัญจึงครอบคลุมทั้งบทบาทของผึ้งและการดูแลรักษา`,m:`ตัวเลือกที่ถูกต้องแต่เป็นเพียงรายละเอียดหนึ่งย่อหน้า (เช่น การดูดน้ำหวาน) ไม่ใช่ใจความสำคัญของทั้งเรื่อง`},{id:`arena-s03-q21`,s:`reading`,k:`reading-reference`,p:`S03-R1`,q:`In paragraph 1, the word "it" in "the next flower it visits" refers to ____.`,c:[`the bee`,`the pollen`,`the flower`,`the farmer`],a:0,e:`ประโยคเต็มคือ The bee then carries this pollen to the next flower it visits. ผู้ที่ "ไปเยือน" ดอกไม้ดอกถัดไปคือผึ้ง คำว่า it จึงแทน the bee`,m:`วิธีตรวจคำอ้างถึงคือลองแทนคำนามลงไปแล้วอ่านใหม่ เช่น "the next flower the flower visits" ซึ่งไม่สมเหตุสมผล`,v:`pollen = ละอองเกสร, nectar = น้ำหวานในดอกไม้`},{id:`arena-s03-q22`,s:`reading`,k:`reading-vocab`,p:`S03-R1`,q:`In paragraph 3, the word "fallen" is closest in meaning to ____.`,c:[`dropped from the sky`,`moved to another country`,`become smaller in number`,`stopped flying`],a:2,e:`ประโยคเต็มคือ the number of bees … has fallen เมื่อ fall ใช้กับ "จำนวน" จะแปลว่า ลดลง จึงตรงกับ become smaller in number`,m:`คำหลายความหมายต้องดูคำที่อยู่ข้างหน้า ในที่นี้คือ the number of ซึ่งบังคับความหมายว่า "ลดลง"`},{id:`arena-s03-q23`,s:`reading`,k:`reading-detail`,p:`S03-R2`,q:`A student catches the bus at Sun Plaza. What time should the student be waiting at the stop?`,c:[`6.58 a.m.`,`6.53 a.m.`,`7.03 a.m.`,`6.45 a.m.`],a:1,e:`ตารางระบุว่ารถถึง Sun Plaza เวลา 6.58 น. และข้อความบอกว่าให้รอที่ป้าย five minutes before the arrival time จึงต้องไปรอเวลา 6.53 น.`,m:`ข้อสอบตารางเวลามักซ่อนเงื่อนไขไว้ในข้อความข้างบน ไม่ใช่ในตาราง ให้อ่านทั้งสองส่วนเสมอ`},{id:`arena-s03-q24`,s:`reading`,k:`reading-inference`,p:`S03-R2`,q:`Nid gets on the bus at Wat Nong Bua. How long is her journey to the school gate?`,c:[`12 minutes`,`20 minutes`,`25 minutes`,`35 minutes`],a:2,e:`รถถึง Wat Nong Bua เวลา 7.10 น. และถึงโรงเรียนเวลา 7.35 น. ระยะเวลาเดินทางจึงเท่ากับ 25 นาที`,m:`ต้องคำนวณจากตาราง ไม่มีตัวเลข 25 เขียนไว้ตรง ๆ ในบทอ่าน`},{id:`arena-s03-q25`,s:`reading`,k:`reading-sequence`,p:`S03-R2`,q:`Which stop does the afternoon bus reach FIRST after it leaves the school gate?`,c:[`Green Park`,`Ruam Jai Market`,`Sun Plaza`,`Wat Nong Bua`],a:1,e:`ข้อความบอกว่ารถตอนบ่ายวิ่งผ่านป้ายเดิม in the opposite order คือย้อนลำดับ ป้ายสุดท้ายก่อนถึงโรงเรียนในตอนเช้าคือ Ruam Jai Market จึงกลายเป็นป้ายแรกในตอนบ่าย`,m:`คำว่า opposite order เปลี่ยนลำดับทั้งหมด อย่าตอบ Green Park เพียงเพราะเป็นชื่อแรกในตาราง`}]},{id:4,title:`Step Up Challenge`,level:`intermediate-plus`,minutes:32,focus:`Conditionals, error spotting and longer factual reading.`,passages:[{id:`S04-C`,kind:`Cloze passage`,title:`My Grandfather’s Bicycle Shop`,body:[`My grandfather has repaired bicycles in the same small shop for almost forty years. When I was younger I often sat on a wooden box and watched him work. He never seemed to hurry, __(16)__ he always finished before the customer came back.`,`Last year the shop became quiet because a large sports store opened nearby. My grandfather did not complain. Instead, he began teaching the neighbourhood children how to mend a puncture __(17)__ free. Now those children come after school, and many of __(18)__ parents bring their bicycles to him as well.`,`He says that a good repair is like a good habit: nobody __(19)__ it until it is missing.`]},{id:`S04-R1`,kind:`News report`,title:`Students Turn Old Bottles into School Benches`,body:[`Last month forty students from Wang Thong School collected more than two thousand plastic bottles from their village. The idea came from Pim, a Grade 6 student who had seen a programme about recycling on television.`,`The students washed the bottles, removed the labels and carried them to a small factory in the next district. There the plastic was melted and pressed into strong boards. Six weeks later the factory sent back enough boards to build eight benches, which now stand under the trees beside the football field.`,`"At first some people laughed at us," said Pim. "They told us the bottles were only rubbish. Now the same people ask when we will collect again."`,`The head teacher, Mrs Waree, says the school will repeat the project next term. She hopes other schools in the district will join, because one school alone cannot solve the problem of plastic waste.`]},{id:`S04-R2`,kind:`Email`,title:`Absence from the English speaking contest`,meta:[[`To`,`Miss Duangjai`],[`From`,`Kritsana, Grade 6/2`],[`Date`,`1 September`]],body:[`Dear Miss Duangjai,`,`I am writing to tell you that I will not be able to take part in the English speaking contest on Thursday 5 September. On Tuesday I fell during football practice and hurt my ankle. The doctor at Ban Phaeo Hospital told me to rest for ten days.`,`I am very disappointed, because I have practised my speech about school libraries every evening for three weeks. My mother has written a letter for the school office and I will bring it on Monday.`,`Could I possibly take part in the contest in November instead? If that is not possible, I would still like to help on the day by looking after the microphones.`,`Thank you for understanding.`],footer:[`Yours sincerely,`,`Kritsana`]}],questions:[{id:`arena-s04-q01`,s:`vocabulary`,k:`phrasal-verbs`,q:`The class meeting was ____ until next Friday because our teacher was ill.`,c:[`put away`,`put up`,`put down`,`put off`],a:3,e:`put off แปลว่า เลื่อนออกไป ซึ่งตรงกับคำว่า until next Friday ที่บอกว่ากิจกรรมถูกย้ายไปเวลาอื่น`,v:`put off = เลื่อน, put away = เก็บเข้าที่, put up = ติดตั้ง/กางขึ้น, put down = วางลง`},{id:`arena-s04-q02`,s:`vocabulary`,k:`word-choice`,q:`My father ____ me two hundred baht so that I could buy a dictionary.`,c:[`borrowed`,`lent`,`took`,`kept`],a:1,e:`lend แปลว่า ให้ยืม (ผู้ให้เป็นประธาน) ส่วน borrow แปลว่า ขอยืม (ผู้ยืมเป็นประธาน) ในประโยคนี้พ่อเป็นผู้ให้ยืม จึงใช้ lent`,m:`จำโครงสร้างว่า A lends something to B / B borrows something from A`},{id:`arena-s04-q03`,s:`vocabulary`,k:`vocab-context`,q:`The mountain path was so ____ that we had to walk in a single line.`,c:[`smooth`,`steep`,`narrow`,`dusty`],a:2,e:`การเดินเรียงแถวเดียวเกิดขึ้นเพราะทางแคบ ไม่ใช่เพราะทางชันหรือมีฝุ่น คำว่า narrow จึงเป็นคำที่อธิบายผลในประโยคได้ตรงที่สุด`,m:`ในข้อสอบแบบ so…that ให้ถามตัวเองว่า "ลักษณะใดทำให้เกิดผลนี้ได้จริง"`,v:`narrow = แคบ, steep = ชัน, smooth = เรียบ`},{id:`arena-s04-q04`,s:`vocabulary`,k:`synonyms`,q:`The judges were impressed by her enormous effort. "Enormous" is closest in meaning to ____.`,c:[`very great`,`very quick`,`very careful`,`very unusual`],a:0,e:`enormous แปลว่า ใหญ่มาก / มหาศาล เมื่อใช้กับ effort จึงหมายถึงความพยายามอย่างมาก ตรงกับ very great`,v:`enormous = มหาศาล, effort = ความพยายาม`},{id:`arena-s04-q05`,s:`grammar`,k:`present-perfect`,q:`Pim and I ____ each other since we were in Grade 1.`,c:[`have known`,`know`,`knew`,`are knowing`],a:0,e:`since บอกจุดเริ่มต้นของเหตุการณ์ที่เริ่มในอดีตและยังเป็นจริงจนถึงปัจจุบัน จึงใช้ Present Perfect คือ have + V3 = have known`,m:`know เป็นกริยาแสดงสภาวะ (state verb) จึงใช้รูป -ing ไม่ได้`},{id:`arena-s04-q06`,s:`grammar`,k:`conditionals`,q:`If it ____ tomorrow morning, the sports day will be moved to next week.`,c:[`will rain`,`rained`,`rains`,`is raining`],a:2,e:`ประโยคเงื่อนไขแบบที่ 1 ใช้โครงสร้าง If + Present Simple, will + verb เพื่อพูดถึงสิ่งที่เป็นไปได้ในอนาคต จึงใช้ rains ในอนุประโยค if`,m:`ห้ามใช้ will ในอนุประโยคที่ขึ้นต้นด้วย if แม้ความหมายจะเป็นอนาคตก็ตาม`},{id:`arena-s04-q07`,s:`grammar`,k:`agreement`,q:`Neither the teacher nor the students ____ ready for the rehearsal.`,c:[`is`,`are`,`was`,`has been`],a:1,e:`ในโครงสร้าง Neither… nor… กริยาต้องสอดคล้องกับประธานตัวที่อยู่ใกล้กริยาที่สุด ในที่นี้คือ the students ซึ่งเป็นพหูพจน์ จึงใช้ are`,m:`อย่าดูเฉพาะคำแรกหลัง Neither ให้ดูคำที่อยู่ติดกับกริยาเสมอ`},{id:`arena-s04-q08`,s:`grammar`,k:`prepositions`,q:`Our class is responsible ____ cleaning the science room this term.`,c:[`of`,`to`,`with`,`for`],a:3,e:`คำคุณศัพท์ responsible ใช้คู่กับบุพบท for เสมอ เช่น responsible for the project ไม่ใช้ responsible of`,m:`คำคุณศัพท์แต่ละคำมีบุพบทประจำตัว เช่น interested in, good at, afraid of, responsible for`},{id:`arena-s04-q09`,s:`grammar`,k:`comparisons`,q:`This year’s entrance paper was ____ difficult as last year’s.`,c:[`more`,`so`,`as`,`the most`],a:2,e:`โครงสร้างเปรียบเทียบว่าเท่ากันคือ as + adjective + as จึงต้องใช้ as difficult as`,m:`so… as ใช้ได้เฉพาะในประโยคปฏิเสธ เช่น not so difficult as แต่ในประโยคบอกเล่าต้องใช้ as… as`},{id:`arena-s04-q10`,s:`grammar`,k:`verb-patterns`,q:`The heavy rain made us ____ the picnic at the last minute.`,c:[`cancel`,`to cancel`,`cancelling`,`cancelled`],a:0,e:`กริยา make ในความหมาย "ทำให้ต้อง" ตามด้วยกรรมแล้วตามด้วยกริยารูปพื้นฐานที่ไม่มี to (bare infinitive) จึงได้ made us cancel`,m:`กลุ่มกริยาที่ตามด้วยรูปพื้นฐานคือ make, let, have (ในความหมายสั่งให้ทำ) แต่ allow และ ask ต้องใช้ to + verb`},{id:`arena-s04-q11`,s:`grammar`,k:`error-identification`,intro:`The teacher gave us a lot of homeworks yesterday, so we stayed at home all evening.`,q:`Which underlined part of the sentence above is WRONG?`,c:[`The teacher gave us`,`a lot of homeworks`,`so we stayed`,`at home all evening`],a:1,e:`homework เป็นคำนามนับไม่ได้ จึงเติม -s ไม่ได้ ต้องเขียนว่า a lot of homework ส่วนส่วนอื่นของประโยคถูกต้องทั้งหมด`,m:`คำนามนับไม่ได้ที่นักเรียนไทยมักเติม -s ได้แก่ homework, information, advice, furniture, luggage`},{id:`arena-s04-q12`,s:`conversation`,k:`situational-english`,intro:`At the airport
Passenger: Could you tell me where the check-in counter for flight TG 210 is?
Staff: ____`,q:`Choose the best reply for the staff member.`,c:[`I am going to Chiang Mai too.`,`You must check in at the counter.`,`Flight TG 210 is very popular today.`,`It’s at counter 12, just past the information desk.`],a:3,e:`ผู้โดยสารถามตำแหน่งของเคาน์เตอร์เช็คอิน คำตอบจึงต้องระบุสถานที่ให้ชัดเจน เช่น It’s at counter 12, just past the information desk.`,m:`คำถามอ้อม (Could you tell me where…?) ยังคงเป็นคำถามถามสถานที่ ต้องตอบด้วยตำแหน่ง ไม่ใช่ตอบว่า yes / no`},{id:`arena-s04-q13`,s:`conversation`,k:`situational-english`,intro:`Student: ____
Teacher: Yes, of course. Take your time.`,q:`Choose the best line for the student.`,c:[`Do you want me to go outside?`,`I go to the nurse now, teacher.`,`May I go to the nurse’s room for a moment, please?`,`Should you let me go outside?`],a:2,e:`คำตอบของครูคือ Yes, of course. ซึ่งเป็นการอนุญาต ประโยคของนักเรียนจึงต้องเป็นการ "ขออนุญาต" ที่สุภาพ คือ May I…, please?`,m:`การขออนุญาตที่สุภาพใช้ May I… / Could I… ส่วนการบอกเล่าว่า "ฉันจะไปตอนนี้" ไม่ใช่การขออนุญาต`},{id:`arena-s04-q14`,s:`conversation`,k:`situational-english`,intro:`Nat: I think homework should be banned completely.
Joy: ____`,q:`Choose the best reply for Joy, who politely disagrees.`,c:[`I see what you mean, but I think a little practice at home really helps us.`,`You are wrong and I am right about this.`,`No. Homework is banned already.`,`I don’t know what you are saying at all.`],a:0,e:`การไม่เห็นด้วยอย่างสุภาพในภาษาอังกฤษมักเริ่มด้วยการยอมรับความคิดอีกฝ่ายก่อน เช่น I see what you mean, but… แล้วจึงเสนอความเห็นของตน`,m:`การพูดตรง ๆ ว่า You are wrong. ถือว่าเสียมารยาทในบทสนทนาแบบข้อสอบเข้า ม.1`},{id:`arena-s04-q15`,s:`conversation`,k:`situational-english`,intro:`In a clothes shop
Customer: I bought this T-shirt yesterday, but there is a hole in the sleeve.
Assistant: ____`,q:`Choose the best reply for the assistant.`,c:[`That is not our problem, I am afraid.`,`I’m very sorry. Would you like to change it for another one?`,`You should be more careful with your clothes.`,`We sell hundreds of T-shirts every week.`],a:1,e:`เมื่อลูกค้าร้องเรียนเรื่องสินค้ามีตำหนิ พนักงานควรขอโทษแล้วเสนอทางแก้ เช่น เปลี่ยนสินค้าใหม่ ซึ่งเป็นการตอบที่สุภาพและช่วยแก้ปัญหา`,m:`ตัวเลือกที่โยนความผิดให้ลูกค้าไม่เหมาะกับบทบาทของพนักงานขาย แม้จะถูกไวยากรณ์`},{id:`arena-s04-q16`,s:`cloze`,k:`cloze-linking`,p:`S04-C`,intro:`Blank (16)`,q:`He never seemed to hurry, ____ he always finished before the customer came back.`,c:[`because`,`so`,`yet`,`or`],a:2,e:`สองข้อความนี้ดูขัดแย้งกัน คือ ไม่เคยรีบ แต่กลับเสร็จก่อนเวลาเสมอ จึงต้องใช้คำเชื่อมที่แสดงความขัดแย้ง yet ซึ่งมีความหมายเท่ากับ but`,v:`yet (คำเชื่อม) = แต่ทว่า, ใช้แบบเดียวกับ but ในภาษาเขียน`},{id:`arena-s04-q17`,s:`cloze`,k:`cloze-grammar`,p:`S04-C`,intro:`Blank (17)`,q:`He began teaching the neighbourhood children how to mend a puncture ____ free.`,c:[`for`,`at`,`in`,`by`],a:0,e:`สำนวนที่แปลว่า "โดยไม่คิดเงิน" คือ for free ซึ่งเป็นวลีตายตัว อีกสำนวนหนึ่งที่ใช้ได้คือ free of charge`,m:`at free และ in free ไม่มีใช้ในภาษาอังกฤษ ให้จำ for free เป็นวลีเดียว`},{id:`arena-s04-q18`,s:`cloze`,k:`cloze-reference`,p:`S04-C`,intro:`Blank (18)`,q:`Now those children come after school, and many of ____ parents bring their bicycles to him as well.`,c:[`there`,`they`,`theirs`,`their`],a:3,e:`ช่องว่างอยู่หน้าคำนาม parents จึงต้องใช้คำแสดงความเป็นเจ้าของคือ their ซึ่งอ้างถึง those children ในประโยคก่อนหน้า`,m:`their (ของพวกเขา) / there (ที่นั่น) / they’re (they are) ออกเสียงคล้ายกันแต่ใช้ต่างกันโดยสิ้นเชิง`},{id:`arena-s04-q19`,s:`cloze`,k:`cloze-grammar`,p:`S04-C`,intro:`Blank (19)`,q:`He says that a good repair is like a good habit: nobody ____ it until it is missing.`,c:[`notice`,`notices`,`noticing`,`have noticed`],a:1,e:`nobody ถือเป็นประธานเอกพจน์เสมอ และประโยคนี้กล่าวถึงความจริงทั่วไป จึงใช้ Present Simple ที่เติม -s คือ notices`,m:`คำที่ลงท้ายด้วย -body, -one, -thing เช่น nobody, everyone, something ล้วนเป็นเอกพจน์`},{id:`arena-s04-q20`,s:`reading`,k:`reading-detail`,p:`S04-R1`,q:`Where did the plastic bottles come from?`,c:[`The students’ own village`,`The school canteen`,`A factory in the next district`,`A television programme`],a:0,e:`ย่อหน้าแรกเขียนว่านักเรียนเก็บขวดพลาสติก from their village ส่วนโรงงานในอำเภอข้างเคียงคือที่ที่นำขวดไปหลอม ไม่ใช่แหล่งที่มาของขวด`,m:`ตัวเลือกลวงมักหยิบคำนามที่ปรากฏจริงในบทอ่านมาใช้ผิดหน้าที่ ให้ย้อนกลับไปหาประโยคต้นทางเสมอ`},{id:`arena-s04-q21`,s:`reading`,k:`reading-inference`,p:`S04-R1`,q:`What do Pim’s words in paragraph 3 show?`,c:[`The villagers still think the project is silly.`,`Pim would like to work in a factory one day.`,`The benches cost much more than the school expected.`,`People in the village changed their opinion of the project.`],a:3,e:`พิมเล่าว่าตอนแรกมีคนหัวเราะเยาะ แต่ตอนนี้ the same people ask when we will collect again ซึ่งแสดงว่าคนกลุ่มเดิมเปลี่ยนความคิดไปแล้ว`,m:`คำว่า At first… Now… เป็นสัญญาณของการเปลี่ยนแปลง ให้ใช้เป็นเบาะแสในคำถามแบบอนุมาน`},{id:`arena-s04-q22`,s:`reading`,k:`reading-cause-effect`,p:`S04-R1`,q:`Why does Mrs Waree hope other schools will join the project?`,c:[`Because her school cannot find any more bottles`,`Because the problem is too big for one school to solve`,`Because the factory needs more work to do`,`Because the new benches broke very quickly`],a:1,e:`ย่อหน้าสุดท้ายให้เหตุผลไว้ตรง ๆ ว่า one school alone cannot solve the problem of plastic waste จึงต้องอาศัยโรงเรียนอื่นช่วยกัน`},{id:`arena-s04-q23`,s:`reading`,k:`reading-detail`,p:`S04-R2`,q:`Why is Kritsana unable to take part in the contest?`,c:[`He has not finished writing his speech.`,`He must visit the hospital on Thursday.`,`He hurt his ankle and has been told to rest.`,`His mother has asked him to stay at home.`],a:2,e:`อีเมลระบุว่าเขาล้มตอนซ้อมฟุตบอลและ hurt my ankle โดยหมอสั่งให้พัก 10 วัน จึงเข้าแข่งขันวันที่ 5 กันยายนไม่ได้`,m:`จดหมายกล่าวถึงโรงพยาบาลและคุณแม่ แต่ทั้งสองอย่างไม่ใช่ "สาเหตุ" ที่เขาเข้าแข่งไม่ได้`},{id:`arena-s04-q24`,s:`reading`,k:`reading-purpose`,p:`S04-R2`,q:`What does Kritsana ask Miss Duangjai to allow?`,c:[`Choosing another student to replace him`,`Moving the whole contest to Monday`,`Sending a letter to his mother`,`Taking part in the November contest instead`],a:3,e:`ย่อหน้าที่สี่เขียนว่า Could I possibly take part in the contest in November instead? ซึ่งเป็นคำขอหลักของจดหมายฉบับนี้`,m:`Could I possibly…? เป็นสำนวนขออนุญาตอย่างสุภาพ ให้มองหาประโยคคำถามในจดหมายเมื่อโจทย์ถามว่า "ผู้เขียนขออะไร"`},{id:`arena-s04-q25`,s:`reading`,k:`reading-inference`,p:`S04-R2`,q:`What does Kritsana’s last request suggest about him?`,c:[`He does not really want to compete at all.`,`He is mainly worried about the microphones.`,`He still wants to be part of the event in some way.`,`He believes the contest will be cancelled.`],a:2,e:`แม้เข้าแข่งขันไม่ได้ เขายังเสนอตัวช่วยดูแลไมโครโฟนในวันงาน ซึ่งแสดงว่าเขายังอยากมีส่วนร่วมกับกิจกรรมอยู่`,m:`คำถามแบบ "แสดงว่าเขาเป็นคนอย่างไร" ต้องตีความจากการกระทำ ไม่ใช่จากคำที่เขาเขียนตรง ๆ`}]},{id:5,title:`Competitive English`,level:`competitive`,minutes:35,focus:`Inversion, second conditional and inference from longer texts.`,passages:[{id:`S05-C`,kind:`Cloze passage`,title:`The Forgotten Camera`,body:[`Last April my aunt gave me an old film camera that had belonged to my grandfather. It looked heavy and complicated, and for two months I did not touch __(16)__ at all.`,`Then our art teacher announced a photography competition, and I decided to try. Learning to use the camera was much harder __(17)__ I had expected. There was no screen, so I could not see my mistakes until the film was developed. Of my first thirty-six photographs, only four were __(18)__ keeping.`,`By the end of the term, however, I had learnt to think carefully before pressing the button, __(19)__ is a habit that has improved every photograph I have taken since.`]},{id:`S05-R1`,kind:`Environment article`,title:`The Turtles and the Plastic Bags`,body:[`Along the southern coast, volunteers walk the beaches at dawn during the nesting season. They are searching for the shallow holes in which sea turtles have buried their eggs during the night.`,`Sea turtles face many dangers, but one of the strangest is the plastic bag. Floating in the water, a bag looks very similar to a jellyfish, which is a favourite food of several turtle species. A turtle that swallows plastic may feel full and stop looking for real food.`,`Volunteers cannot remove every bag from the sea. Instead they move the eggs to protected areas of sand, record the number of eggs in each nest, and release the young turtles after dark, when fewer birds are hunting.`,`The work is slow. Out of a thousand young turtles, perhaps only one will live long enough to return to the same beach and lay eggs of its own. Yet the volunteers say that every nest they protect makes that one turtle more likely.`]},{id:`S05-R2`,kind:`Poster`,title:`Young Writers’ Competition`,body:[`Open to all students in Grades 5 and 6. Write a short story of no more than 500 words on the theme "A Door I Should Not Have Opened".`,`Rules: stories must be written in English and typed on one side of the paper. Write your name and class on a separate sheet, never on the story itself. Each student may send one story only.`,`Closing date: Friday 20 February, 4.00 p.m., at the English office.`,`Prizes: first prize 2,000 baht and a set of books; second and third prizes 1,000 baht each.`,`The three winning stories will be read at the March assembly and printed in the school magazine.`]}],questions:[{id:`arena-s05-q01`,s:`vocabulary`,k:`vocab-context`,q:`The evidence Ploy presented was so ____ that nobody in the room could argue against it.`,c:[`fragile`,`convincing`,`ordinary`,`temporary`],a:1,e:`ผลที่ตามมาคือไม่มีใครโต้แย้งได้ แสดงว่าหลักฐานนั้นน่าเชื่อถือมาก คำว่า convincing แปลว่า ที่ทำให้เชื่อได้`,v:`convincing = น่าเชื่อถือ, fragile = เปราะบาง, temporary = ชั่วคราว`},{id:`arena-s05-q02`,s:`vocabulary`,k:`collocations`,q:`After thinking about it all weekend, Nan finally ____ a decision to join the debating club.`,c:[`did`,`took`,`made`,`gave`],a:2,e:`ภาษาอังกฤษใช้ make a decision (ตัดสินใจ) เป็นคำคู่ตายตัว ส่วน take a decision ใช้ในภาษาอังกฤษแบบทางการของอังกฤษเท่านั้นและไม่ใช้ในข้อสอบระดับนี้`,m:`จำกลุ่มคำ make a decision / make a mistake / make progress แต่ do homework / do the washing`},{id:`arena-s05-q03`,s:`vocabulary`,k:`antonyms`,q:`Which word is the correct opposite of "patient"?`,c:[`unpatient`,`dispatient`,`nonpatient`,`impatient`],a:3,e:`คำที่ขึ้นต้นด้วยเสียง p มักใช้คำอุปสรรค im- เช่น impatient, impossible, impolite จึงได้ impatient`,m:`อย่าเดาว่าใช้ un- กับทุกคำ ให้จำกลุ่ม im- (impossible, impatient), il- (illegal), ir- (irregular)`},{id:`arena-s05-q04`,s:`vocabulary`,k:`phrasal-verbs`,q:`Every member of the team must ____ the rules, even the captain.`,c:[`stick to`,`join in`,`look up`,`put through`],a:0,e:`stick to แปลว่า ยึดถือ / ปฏิบัติตามอย่างเคร่งครัด จึงใช้กับ rules, plan หรือ promise ได้`,v:`stick to = ทำตามอย่างเคร่งครัด, join in = เข้าร่วม, look up = ค้นหา (ในพจนานุกรม)`},{id:`arena-s05-q05`,s:`grammar`,k:`modals`,q:`Ploy isn’t answering her phone and her bag is by the pool. She ____ be swimming.`,c:[`can`,`should`,`would`,`must`],a:3,e:`เมื่อมีหลักฐานชัดเจนแล้วสรุปว่าเรื่องนั้นเป็นจริงเกือบแน่นอน ภาษาอังกฤษใช้ must ในความหมาย "คงจะ / ต้องแน่ ๆ"`,m:`must ไม่ได้แปลว่า "ต้องทำ" เสมอไป เมื่อใช้คาดเดาจากหลักฐานจะแปลว่า "คงจะเป็นเช่นนั้นแน่"`},{id:`arena-s05-q06`,s:`grammar`,k:`passive-voice`,q:`All the concert tickets ____ before we reached the counter.`,c:[`had been sold`,`had sold`,`were selling`,`have sold`],a:0,e:`ตั๋วเป็นสิ่งที่ "ถูกขาย" จึงต้องเป็น passive และการขายหมดเกิดขึ้นก่อนอีกเหตุการณ์ในอดีต (before we reached) จึงใช้ Past Perfect Passive คือ had been + V3`,m:`had sold เป็น active แปลว่า "ตั๋วขายของ" ซึ่งไม่สมเหตุสมผล`},{id:`arena-s05-q07`,s:`grammar`,k:`sentence-structure`,q:`Not only ____ the competition, but she also broke the school record.`,c:[`Ploy won`,`did Ploy win`,`Ploy did win`,`won Ploy`],a:1,e:`เมื่อขึ้นต้นประโยคด้วย Not only ต้องสลับตำแหน่งกริยาช่วยมาไว้หน้าประธาน (inversion) จึงได้ Not only did Ploy win…`,m:`โครงสร้างนี้ใช้คู่กับ but… also เสมอ และหลัง did ต้องใช้กริยารูปพื้นฐาน (win ไม่ใช่ won)`},{id:`arena-s05-q08`,s:`grammar`,k:`relative-clauses`,q:`The village ____ my grandmother grew up has changed completely.`,c:[`which`,`that`,`where`,`who`],a:2,e:`คำที่ถูกขยายคือสถานที่ (The village) และอนุประโยคที่ตามมามีประธานและกริยาครบแล้ว จึงต้องใช้คำเชื่อมบอกสถานที่คือ where`,m:`ถ้าจะใช้ which ต้องมีบุพบทนำหน้า เช่น the village in which my grandmother grew up`},{id:`arena-s05-q09`,s:`grammar`,k:`conditionals`,q:`If I ____ you, I would apologise to the coach immediately.`,c:[`am`,`will be`,`have been`,`were`],a:3,e:`ประโยคเงื่อนไขแบบที่ 2 ใช้พูดถึงสิ่งที่ไม่เป็นจริงในปัจจุบัน โครงสร้างคือ If + past simple, would + verb และกับ verb to be นิยมใช้ were กับทุกประธาน`,m:`สำนวนให้คำแนะนำที่พบบ่อยคือ If I were you, I would… ให้จำเป็นวลีเดียว`},{id:`arena-s05-q10`,s:`grammar`,k:`verb-patterns`,q:`I don’t mind ____ late at school to finish the group project.`,c:[`to stay`,`staying`,`stay`,`stayed`],a:1,e:`กริยา mind ต้องตามด้วย V-ing เสมอ จึงได้ don’t mind staying กลุ่มเดียวกันได้แก่ enjoy, avoid, suggest, finish`,m:`ประโยค I don’t mind… แปลว่า "ไม่ถือสา / ไม่เป็นไร" ไม่ได้แปลว่าไม่ชอบ`},{id:`arena-s05-q11`,s:`grammar`,k:`determiners`,q:`____ of the two answers is correct, so we shall have to try again.`,c:[`Neither`,`None`,`Any`,`Both`],a:0,e:`Neither ใช้เมื่อพูดถึงสองสิ่งและปฏิเสธทั้งคู่ และถือเป็นเอกพจน์ จึงใช้กับกริยา is ส่วน None ใช้กับของตั้งแต่สามสิ่งขึ้นไป`,m:`Both of the two answers are… จะขัดกับข้อความที่บอกว่าต้องทำใหม่ เพราะแปลว่าถูกทั้งคู่`},{id:`arena-s05-q12`,s:`conversation`,k:`situational-english`,intro:`Ann: I always feel nervous before I speak in front of the class.
Beam: ____`,q:`Choose the best reply for Beam, who wants to give advice.`,c:[`Never mind. Nobody listens anyway.`,`I think you will always be nervous.`,`Why don’t you practise with a friend first? That really helped me.`,`You should not speak in front of the class again.`],a:2,e:`สำนวนให้คำแนะนำที่เป็นธรรมชาติคือ Why don’t you…? แล้วเสริมประสบการณ์ของตนเองเพื่อให้กำลังใจ`,m:`Never mind. ใช้ปลอบเรื่องเล็ก ๆ ที่ผ่านไปแล้ว ไม่ใช่ใช้ตอบเมื่ออีกฝ่ายขอคำแนะนำ`},{id:`arena-s05-q13`,s:`conversation`,k:`situational-english`,intro:`Student: ____
Librarian: Certainly. How many sheets do you need?`,q:`Choose the best line for the student.`,c:[`Give me some papers now.`,`I wonder if I could borrow a few sheets of paper.`,`Can you giving me some paper?`,`Do you have paper or not?`],a:1,e:`คำตอบของบรรณารักษ์คือ Certainly. ซึ่งตอบรับคำขอที่สุภาพ สำนวน I wonder if I could… เป็นการขอแบบสุภาพมากในภาษาอังกฤษ`,m:`ประโยคคำสั่งตรง ๆ เช่น Give me… ถือว่าไม่สุภาพเมื่อพูดกับครูหรือเจ้าหน้าที่`},{id:`arena-s05-q14`,s:`conversation`,k:`situational-english`,intro:`Mint: I’ve been chosen for the regional English camp!
Kan: ____`,q:`Choose the best reply for Kan.`,c:[`Really? I don’t believe you.`,`That’s a pity. Better luck next time.`,`Never mind. Camps are boring anyway.`,`That’s wonderful! Congratulations.`],a:3,e:`เมื่อเพื่อนเล่าข่าวดี สำนวนแสดงความยินดีที่เหมาะสมคือ That’s wonderful! Congratulations. ส่วน That’s a pity. ใช้กับข่าวร้ายเท่านั้น`},{id:`arena-s05-q15`,s:`conversation`,k:`situational-english`,intro:`Jun: We’re going to the cinema on Sunday. Would you like to join us?

stic bags dangerous for sea turtles?`,c:[`They cover the nests on the beach.`,`They make the sea water too warm.`,`They look like a food that turtles eat.`,`They are heavier than young turtles.`],a:2,e:`ย่อหน้าที่สองอธิบายว่าถุงพลาสติกที่ลอยน้ำ looks very similar to a jellyfish ซึ่งเป็นอาหารโปรดของเต่าบางชนิด เต่าจึงกลืนเข้าไปโดยเข้าใจผิด`,v:`jellyfish = แมงกะพรุน, swallow = กลืน`},{id:`arena-s05-q21`,s:`reading`,k:`reading-detail`,p:`S05-R1`,q:`Why do the volunteers release the young turtles after dark?`,c:[`Because the sand is cooler at night`,`Because the tourists have gone home`,`Because the sea is calmer at night`,`Because fewer birds are hunting then`],a:3,e:`ย่อหน้าที่สามระบุเหตุผลไว้ตรง ๆ ว่า release the young turtles after dark, when fewer birds are hunting`,m:`เหตุผลอื่นที่ฟังดูสมเหตุสมผล เช่น ทรายเย็นกว่า ไม่ได้เขียนไว้ในบทอ่าน จึงเลือกไม่ได้`},{id:`arena-s05-q22`,s:`reading`,k:`reading-inference`,p:`S05-R1`,q:`What does the last paragraph suggest about the volunteers?`,c:[`They keep working even though the results are very small.`,`They believe their work will be finished soon.`,`They think the government should pay them.`,`They want to move the turtles to another country.`],a:0,e:`ย่อหน้าสุดท้ายบอกว่าลูกเต่าหนึ่งพันตัวอาจรอดเพียงตัวเดียว แต่อาสาสมัครยังบอกว่าทุกรังที่ปกป้องช่วยเพิ่มโอกาสให้เต่าตัวนั้น แสดงถึงความมุ่งมั่นแม้ผลลัพธ์จะน้อย`,m:`คำว่า Yet ในประโยคสุดท้ายเป็นสัญญาณว่าผู้เขียนกำลังพลิกจากข้อเสียไปสู่ข้อดี`},{id:`arena-s05-q23`,s:`reading`,k:`reading-detail`,p:`S05-R2`,q:`What must a student NOT write on the story itself?`,c:[`The title of the story`,`Their name and class`,`The number of words`,`The theme of the competition`],a:1,e:`กติกาข้อสองระบุว่า Write your name and class on a separate sheet, never on the story itself จึงห้ามเขียนชื่อและชั้นเรียนลงบนตัวเรื่อง`,m:`คำว่า never ในกติกาเป็นคำสำคัญ ให้สังเกตคำห้ามทุกครั้งเมื่ออ่านประกาศหรือกติกา`},{id:`arena-s05-q24`,s:`reading`,k:`reading-inference`,p:`S05-R2`,q:`Ploy takes two of her stories to the English office on 19 February. What will probably happen?`,c:[`Both stories will be entered for a prize.`,`Both stories will be printed in the school magazine.`,`Only one of her stories can be accepted.`,`Her stories will be returned because she is too late.`],a:2,e:`กติกาเขียนว่า Each student may send one story only ดังนั้นแม้จะส่งก่อนกำหนด (20 กุมภาพันธ์) ก็รับได้เพียงเรื่องเดียว`,m:`วันที่ 19 กุมภาพันธ์ยังไม่เลยกำหนด จึงไม่ใช่เรื่องสาย แต่เป็นเรื่องจำนวนผลงานที่ส่งได้`},{id:`arena-s05-q25`,s:`reading`,k:`reading-detail`,p:`S05-R2`,q:`Which entry would follow ALL the rules of the competition?`,c:[`A 300-word story written in Thai and typed on one side`,`A 450-word story written in English and typed on one side of the paper`,`A 550-word story in English with the writer’s name at the top`,`A 500-word story in English written by hand on both sides`],a:1,e:`ผลงานที่ถูกกติคือต้องเป็นภาษาอังกฤษ ไม่เกิน 500 คำ พิมพ์บนกระดาษหน้าเดียว และไม่มีชื่อผู้เขียนบนตัวเรื่อง มีเพียงตัวเลือกที่มีความยาว 450 คำและพิมพ์หน้าเดียวเท่านั้นที่ครบทุกข้อ`,m:`ข้อสอบแบบ "ตรวจตามกติกา" ต้องไล่เช็กทีละเงื่อนไข ตัวเลือกลวงมักผิดเพียงข้อเดียว`}]},{id:6,title:`School Entrance Challenge`,level:`competitive-plus`,minutes:35,focus:`Reported requests, third conditional and comparing two texts.`,passages:[{id:`S06-C`,kind:`Cloze passage`,title:`The School Radio Club`,body:[`Our school radio club broadcasts for twenty minutes every lunchtime. Members take turns to choose the music, read the announcements and interview a teacher or a student. __(16)__ the club is popular now, it almost closed two years ago, when only three students signed up.`,`The change came when Ms. Pranee suggested that each programme __(17)__ a two-minute item in English. At first the members were nervous, but the audience grew week by week. Students who once walked straight past the club room now stop to listen, and several of them have asked __(18)__ they can join.`,`The club has taught me something I did not expect: speaking clearly matters more than speaking quickly. If I __(19)__ that lesson earlier, my first broadcast would have been far less embarrassing.`]},{id:`S06-R1`,kind:`Science article`,title:`The Hours That Do the Learning`,body:[`Most doctors say that children between ten and thirteen need nine to eleven hours of sleep each night. Many students get far less, especially during examination weeks.`,`Sleep is not simply a rest for the body. While we sleep, the brain sorts through everything we have met during the day and keeps the most useful parts in the memory. A student who studies until two in the morning may remember less than a classmate who closed the book at ten and then slept well.`,`Light plays a part too. Screens give out a blue light that tells the brain the day is not over, so watching videos in bed can make falling asleep harder even when the body is tired.`,`Doctors suggest three simple habits: keep the same bedtime every night, stop using screens thirty minutes before sleeping, and use the bed only for sleeping, never for homework.`]},{id:`S06-R2`,kind:`Advertisement`,title:`Two Holiday Camps — Choose Yours`,body:[`Baan Rim Nam Camp and Pine Hill Camp both open during the school holiday. Read the details below before you choose.`],table:{headers:[``,`Baan Rim Nam`,`Pine Hill`],rows:[[`Dates`,`16–20 April`,`21–26 April`],[`Ages`,`9–12`,`11–14`],[`Main activities`,`Kayaking, cooking, English drama`,`Hiking, photography, English debate`],[`Price`,`3,900 baht`,`4,800 baht`],[`Places left`,`8`,`2`]]},footer:[`Both prices include all meals and a bus from the school. Book at the school office before 5 April.`,`Students who book for both camps receive a discount of 500 baht.`]}],questions:[{id:`arena-s06-q01`,s:`vocabulary`,k:`word-family`,q:`The head teacher thanked the volunteers for their ____ during the long clean-up.`,c:[`patient`,`patiently`,`patience`,`impatient`],a:2,e:`หลังคำแสดงความเป็นเจ้าของ their ต้องเป็นคำนาม คำนามของ patient คือ patience ที่แปลว่า ความอดทน`,m:`patient (adj.) = อดทน, patience (n.) = ความอดทน, patiently (adv.) = อย่างอดทน ให้ดูตำแหน่งในประโยคก่อนเลือก`},{id:`arena-s06-q02`,s:`vocabulary`,k:`vocab-context`,q:`Because the worksheet instructions were ____, half the class handed in the wrong exercise.`,c:[`detailed`,`helpful`,`straightforward`,`misleading`],a:3,e:`ผลที่เกิดขึ้นคือนักเรียนครึ่งห้องทำผิดข้อ แสดงว่าคำสั่งทำให้เข้าใจผิด คำว่า misleading แปลว่า ชวนให้เข้าใจผิด`,v:`misleading = ชวนให้เข้าใจผิด, straightforward = ตรงไปตรงมา เข้าใจง่าย`},{id:`arena-s06-q03`,s:`vocabulary`,k:`collocations`,q:`Nid has ____ a great deal of progress in mathematics this term.`,c:[`made`,`done`,`taken`,`got`],a:0,e:`ภาษาอังกฤษใช้ make progress (มีความก้าวหน้า) เป็นคำคู่ตายตัว ไม่ใช้ do หรือ take กับคำว่า progress`,m:`จำคู่ที่พบบ่อย: make progress / make an effort / do an exercise / take an exam`},{id:`arena-s06-q04`,s:`vocabulary`,k:`synonyms`,q:`Beam was reluctant to speak first. "Reluctant" is closest in meaning to ____.`,c:[`eager`,`unwilling`,`careless`,`confident`],a:1,e:`reluctant แปลว่า ไม่ค่อยเต็มใจ ลังเลที่จะทำ จึงมีความหมายเดียวกับ unwilling ส่วน eager แปลว่ากระตือรือร้น ซึ่งตรงข้าม`,v:`reluctant = ไม่เต็มใจ, eager = กระตือรือร้น`},{id:`arena-s06-q05`,s:`grammar`,k:`present-perfect`,q:`It is the first time I ____ such a difficult puzzle.`,c:[`saw`,`have seen`,`see`,`am seeing`],a:1,e:`โครงสร้าง It is the first time… ต้องตามด้วย Present Perfect เสมอ จึงได้ It is the first time I have seen…`,m:`สำนวนกลุ่มนี้ได้แก่ It is the first / second / best time + have + V3`},{id:`arena-s06-q06`,s:`grammar`,k:`articles`,q:`____ Chao Phraya River flows through the middle of Bangkok.`,c:[`A`,`An`,`No article is needed`,`The`],a:3,e:`ชื่อแม่น้ำ ทะเล มหาสมุทรและกลุ่มเกาะ ต้องใช้ the นำหน้าเสมอ เช่น the Chao Phraya River, the Pacific Ocean`,m:`แต่ชื่อทะเลสาบและภูเขาลูกเดี่ยวไม่ใช้ the เช่น Lake Superior, Mount Fuji`},{id:`arena-s06-q07`,s:`grammar`,k:`verb-patterns`,q:`The coach asked us ____ late for training again.`,c:[`do not be`,`that we are not`,`not to be`,`to not being`],a:2,e:`โครงสร้าง ask + กรรม + to + verb เมื่อทำเป็นปฏิเสธให้วาง not ไว้หน้า to จึงได้ asked us not to be late`,m:`ตำแหน่งของ not สำคัญมาก รูปที่ถูกคือ not to do ไม่ใช่ to not doing`},{id:`arena-s06-q08`,s:`grammar`,k:`quantifiers`,q:`There were ____ people at the temple fair that we could hardly move.`,c:[`so many`,`such many`,`too much`,`so much`],a:0,e:`โครงสร้าง so + many + คำนามนับได้พหูพจน์ + that… ใช้บอกเหตุและผล จึงได้ so many people that we could hardly move`,m:`ถ้าจะใช้ such ต้องมีคำนามพร้อมคำคุณศัพท์ เช่น such a big crowd that… รูป such many ไม่มีใช้`},{id:`arena-s06-q09`,s:`grammar`,k:`passive-voice`,q:`Mobile phones ____ during the examination.`,c:[`must not use`,`must not be used`,`are not must use`,`do not be used`],a:1,e:`โทรศัพท์เป็นสิ่งที่ "ถูกใช้" จึงต้องเป็น passive และเมื่อมีกริยาช่วย must ให้ใช้โครงสร้าง modal + be + V3 คือ must not be used`,m:`หลังกริยาช่วยทุกตัวใน passive ต้องมี be เสมอ เช่น can be seen, should be finished`},{id:`arena-s06-q10`,s:`grammar`,k:`conjunctions`,q:`____ the heavy traffic, we still arrived before the ceremony began.`,c:[`Although`,`Because of`,`Despite`,`However`],a:2,e:`Despite เป็นบุพบทที่ตามด้วยคำนามหรือนามวลี (the heavy traffic) และแสดงความขัดแย้ง ส่วน Although ต้องตามด้วยประโยคที่มีประธานและกริยา`,m:`จำว่า Despite / In spite of + คำนาม แต่ Although / Even though + ประโยค`},{id:`arena-s06-q11`,s:`grammar`,k:`comparisons`,q:`The more you practise speaking, ____.`,c:[`the easy it becomes`,`easier it becomes`,`the more easy it becomes`,`the easier it becomes`],a:3,e:`โครงสร้าง The more…, the + คำคุณศัพท์ขั้นกว่า…, ใช้บอกว่าสองสิ่งเปลี่ยนไปพร้อมกัน คำว่า easy เป็นคำสั้นจึงใช้ easier และต้องมี the นำหน้า`,m:`ห้ามใช้ more กับคำคุณศัพท์ที่เติม -er ได้อยู่แล้ว เช่น more easy เป็นรูปที่ผิด`},{id:`arena-s06-q12`,s:`conversation`,k:`situational-english`,intro:`At a hotel
