<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Combinations Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept: a printed phonics workbook. Flat colour from the book's unit tabs,
   large lowercase letter-pairs, and every word printed with its letter
   combination coloured, the way phonics readers do it. */
:root{
  --page:#f4f2ec; --surface:#fff; --ink:#22252b; --muted:#5d605c; --line:#dcd8cc; --line2:#b4afa0;
  --ok:#1b7045; --ok-bg:#e4f1e9; --bad:#a43b25; --bad-bg:#f8e6df; --focus:#1f5fbf;
  --c:#22252b; --d:#22252b; --on:#fff; --t:rgba(34,37,43,.08);
}
*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:22px}
body{margin:0;background:var(--page);color:var(--ink);min-height:100vh;line-height:1.5;
  font-family:'Andika','IBM Plex Sans Thai',system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 3.5rem}
svg.ico{width:1.15em;height:1.15em;flex:none}
.pt{color:var(--d)}

/* masthead + preferences */
.mast{display:flex;justify-content:space-between;align-items:center;gap:.2rem 1.2rem;flex-wrap:wrap;padding:.3rem 0;border-bottom:1px solid var(--line)}
.wm{font-weight:700;font-size:.85rem;letter-spacing:.02em}
.prefs{display:flex;flex-wrap:wrap;gap:0 1.1rem;font-size:.78rem;color:var(--muted)}
.prefs label{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;cursor:pointer}
.prefs input{width:18px;height:18px;accent-color:var(--ink);margin:0}

/* buttons + links */
.btn{font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:.45rem 1.1rem;min-height:48px;cursor:pointer;transition:background .12s}
.btn:hover:not(:disabled){background:rgba(34,37,43,.07)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:.35rem;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* home: the contents page */
.h1{font-size:clamp(2.3rem,6.4vw,3.8rem);line-height:1.05;font-weight:700;letter-spacing:-.01em;margin:1.8rem 0 .5rem}
.lead{color:var(--muted);max-width:34rem}
.index{margin-top:1.8rem;border-top:2px solid var(--ink)}
.irow{display:grid;grid-template-columns:5rem 1fr auto;width:100%;min-height:5.4rem;padding:0;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.irow:hover{background:var(--surface)}
.itab{background:var(--c);color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.itab small{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:.2rem}
.itab b{font-size:2.1rem}
.imain{padding:.7rem 1rem;display:flex;flex-direction:column;justify-content:center;min-width:0}
.icombos{font-size:clamp(1.5rem,4.6vw,2.5rem);font-weight:700;color:var(--d);line-height:1.15;word-spacing:.28em}
.isub{font-size:.8rem;color:var(--muted)}
.iprog{display:flex;align-items:center;gap:.3rem;padding:0 1rem;font-size:.8rem;color:var(--muted);white-space:nowrap}
.mixbox{margin-top:2.6rem;border-top:2px solid var(--ink);padding-top:1rem;display:grid;gap:.7rem;justify-items:start}
.sh{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:.4rem}
.pk{position:relative}
.pk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pk span{display:inline-flex;align-items:center;justify-content:center;min-width:46px;min-height:46px;border:1.5px solid var(--line2);border-radius:8px;background:var(--surface);font-weight:700}
.pk input:checked+span{background:var(--c);border-color:var(--c);color:var(--on)}
.pk input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}

/* unit page */
.uband{background:var(--c);color:var(--on);margin-top:.9rem}
.uband .in{max-width:960px;margin:0 auto;padding:.5rem 16px 1.7rem}
.uband .link{color:inherit}
.ulabel{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:.6rem}
.ucombos{font-size:clamp(2.7rem,10vw,5.6rem);line-height:1.05;font-weight:700;word-spacing:.22em;margin-top:.1rem}
.utag{display:inline-block;margin-top:.5rem;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:4px;padding:0 .5rem}
.sec{margin:2.4rem 0 .7rem}
.glist{border-top:2px solid var(--ink)}
.grow{display:grid;grid-template-columns:2.2rem 1fr auto;gap:0 .8rem;align-items:center;width:100%;min-height:4.6rem;padding:.7rem .2rem;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.grow:hover:not(:disabled){background:var(--surface)}
.grow:disabled{opacity:.5;cursor:not-allowed}
.gnum{font-size:1.5rem;font-weight:700;color:var(--d)}
.gname{font-size:1.2rem;font-weight:700;line-height:1.25}
.gdesc{font-size:.84rem;color:var(--muted)}
.gstars{display:flex;gap:2px;align-items:center}
.gstars svg{width:20px;height:20px}
.wgroup{display:grid;grid-template-columns:8rem 1fr;gap:.3rem 1rem;padding:.8rem 0;border-top:1px solid var(--line)}
.wgroup:first-of-type{border-top:2px solid var(--ink)}
.wglabel{font-size:2rem;line-height:1.1;font-weight:700;color:var(--d)}
.wglabel small{display:block;font-size:.72rem;font-weight:400;color:var(--muted)}
.wl{display:flex;flex-wrap:wrap;gap:.45rem .55rem}
.wchip{display:flex;align-items:center;gap:.5rem;min-height:48px;padding:.25rem .8rem .25rem .35rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;line-height:1.2}
.wchip:hover{border-color:var(--ink)}
.wchip .pic{width:2.3rem;height:2.3rem;font-size:1.5rem;border-radius:6px}
.wchip .w{font-size:1.25rem;font-weight:700}
.wchip .th{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.srow{display:grid;grid-template-columns:1.4rem 1fr;gap:.2rem .7rem;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.7rem .1rem;cursor:pointer;align-items:start}
.srow:hover{background:var(--surface)}
.srow .ico{margin-top:.25rem;color:var(--muted)}
.stext{font-size:1.2rem;font-weight:700;line-height:1.35}
.srow .th{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.slist{border-top:2px solid var(--ink)}

/* pictures: emoji sit in a quiet tinted tile */
.pic{display:grid;place-items:center;background:var(--t);border-radius:10px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.pic:empty{display:none}

/* game screen */
.ghead{display:flex;align-items:center;flex-wrap:wrap;gap:0 1rem;padding:.2rem 0}
.gtitle{font-weight:700;flex:1;min-width:9rem}
.gmeta{display:flex;gap:1rem;font-size:.85rem;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:.2rem 0 .35rem}
.seg i{height:6px;border-radius:3px;background:var(--line)}
.seg i.done{background:var(--c)}
.seg i.miss{background:var(--bad)}
.seg i.now{background:var(--ink)}
.qn{font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.stage{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:1.2rem 1.1rem 1.4rem;text-align:center}
.ask{font-size:.95rem;color:var(--muted);margin-bottom:.8rem}
.wordrow{display:flex;justify-content:center;align-items:center;gap:.9rem;flex-wrap:wrap}
.wcard{display:inline-flex;align-items:center;gap:1rem;padding:.55rem 1.5rem .55rem .55rem;background:var(--page);border:1.5px solid var(--ink);border-radius:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:2}
.wcard .pic{width:4.4rem;height:4.4rem;font-size:2.8rem}
.wtxt{font-size:clamp(2.4rem,9vw,3.9rem);font-weight:700;line-height:1.05}
.wcard.drag{cursor:grabbing;z-index:10;box-shadow:0 14px 28px rgba(0,0,0,.2)}
.wcard.back{transition:transform .18s}
.thm{min-height:1.7rem;margin:.6rem 0 .2rem;font-size:1.05rem;color:var(--muted)}
.hintp{font-size:.8rem;color:var(--muted);margin:0 0 .9rem}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;max-width:780px;margin:0 auto}
.bk,.opt{position:relative;background:var(--surface);border:1.5px solid var(--line2);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .12s,background .12s}
.bk{min-height:86px;padding:.6rem .4rem}
.bk:hover:not(:disabled),.opt:hover:not(:disabled){border-color:var(--ink);background:var(--page)}
.bk.over{border-color:var(--ink);background:var(--t);border-width:3px}
.bk .bl{font-size:1.8rem;font-weight:700;line-height:1.1;color:var(--d)}
.bk .bs{font-size:.75rem;color:var(--muted)}
.kn{position:absolute;top:.2rem;left:.45rem;font-size:.66rem;color:var(--muted)}
.mark{position:absolute;top:.35rem;right:.4rem;display:flex}
.mark .ico{width:1.1rem;height:1.1rem}
.bk:disabled,.opt:disabled,.tile:disabled{cursor:default}
.bk.ok,.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.bk.ok .bl{color:var(--ok)}
.bk.bad,.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bk.bad .bl{color:var(--bad)}
.bk.dim,.opt.dim{opacity:.5}
.say{gap:.45rem}
.thplay{width:5rem;height:5rem;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center}
.thplay:hover{background:#000}
.thplay .ico{width:2.2rem;height:2.2rem}

/* fill / listen / sentence */
.stage>.pic{width:5.4rem;height:5.4rem;font-size:3.4rem;margin:0 auto .4rem}
.fillword{font-size:clamp(2.5rem,10vw,4.4rem);font-weight:700;letter-spacing:.03em;line-height:1.2;display:flex;justify-content:center;flex-wrap:wrap}
.blank{display:inline-block;min-width:1.7em;margin:0 .08em;border-bottom:.07em solid var(--ink);text-align:center;color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.6rem;max-width:640px;margin:.9rem auto 0}
.opts.words{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:720px}
.opt{min-height:76px;padding:.6rem .4rem;font-size:1.8rem;font-weight:700}
.opts.words .opt{font-size:1.4rem}
.reveal{min-height:5.6rem;margin:.5rem 0 .1rem;color:var(--muted)}
.reveal .pic{width:4rem;height:4rem;font-size:2.5rem;margin:0 auto .2rem}
.sent{font-size:clamp(1.55rem,5.6vw,2.4rem);font-weight:700;line-height:1.45;margin:.3rem 0 .4rem}
.sent.q{font-size:clamp(1.3rem,4.6vw,1.9rem)}
.tw{font:inherit;color:inherit;background:none;border:0;padding:0 .05em;margin:0;cursor:pointer;border-radius:4px}
.tw:hover{background:var(--t)}
.tw.now{background:#ffe27a}

/* hunt */
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;padding-bottom:1.5rem}
.tile{width:clamp(40px,11.5vw,84px);height:clamp(60px,16vw,100px);border:1.5px solid var(--line2);background:var(--surface);border-radius:10px;font-size:clamp(2rem,8vw,3.4rem);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.tile:hover:not(:disabled){border-color:var(--ink);background:var(--page)}
.tile.shake{animation:shake .3s}
.tile.silent{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);text-decoration:line-through;text-decoration-thickness:.06em}
.tile.silent::after{content:"silent";position:absolute;bottom:-1.5rem;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:400;text-decoration:none;white-space:nowrap}
.msg{min-height:1.5rem;font-size:.95rem;color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* word match */
.mstat{display:flex;justify-content:center;gap:1.6rem;margin-bottom:.9rem;font-size:.95rem;color:var(--muted)}
.mstat b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;max-width:620px;margin:0 auto}
.mc{display:block;width:100%;perspective:700px;background:none;border:0;padding:0;cursor:pointer;aspect-ratio:1/1.05;min-height:78px}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .3s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.mc .back-f{background:var(--c);color:var(--on);font-size:clamp(1.4rem,5vw,2rem);font-weight:700}
.mc .fr{transform:rotateY(180deg);background:var(--surface);border:1.5px solid var(--line2);flex-direction:column;font-weight:700;font-size:clamp(1rem,3.6vw,1.45rem);padding:.2rem;text-align:center;word-break:break-word;line-height:1.1}
.mc .fr .pic{font-size:clamp(1.9rem,8vw,3rem);background:none}
.mc.done .fr{background:var(--ok-bg);border-color:var(--ok)}

/* feedback */
#fb{margin-top:1rem}
.fb{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem 1rem;align-items:center;border-left:5px solid;border-radius:6px;padding:.9rem 1.1rem;animation:rise .18s}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.meh{background:#fbf0cf;border-color:#9a7400}
.fb>.ico{width:1.7rem;height:1.7rem}
.fb.ok>.ico,.fb.ok strong{color:var(--ok)}
.fb.bad>.ico,.fb.bad strong{color:var(--bad)}
.fb.meh>.ico,.fb.meh strong{color:#6e5200}
.fb strong{display:block;font-size:1.1rem;line-height:1.3}
.fb p{font-size:.95rem}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* story */
.stage>.scene{width:9.5rem;height:9.5rem;font-size:5.4rem;margin:.3rem auto .6rem;border-radius:14px}
.stitle{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:.4rem;margin-top:.9rem}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--c);border-color:var(--c)}
.snav{display:flex;justify-content:space-between;gap:.7rem;margin-top:1rem}

/* results */
.res{padding:1.6rem 0}
.rlabel{font-size:.85rem;color:var(--muted)}
.rscore{font-size:clamp(3.6rem,15vw,6.4rem);font-weight:700;line-height:1;color:var(--d);margin:.2rem 0}
.rstars{display:flex;gap:4px;margin:.5rem 0}
.rstars svg{width:30px;height:30px}
.rline{max-width:30rem}
.mrows{margin-top:1.4rem;border-top:2px solid var(--ink)}
.mrow{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.mrow .pic{width:2.6rem;height:2.6rem;font-size:1.7rem}
.mrow b{font-size:1.3rem}
.mrow>span{font-size:.85rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}

@media (max-width:640px){
  .irow{grid-template-columns:4rem 1fr}
  .iprog{display:none}
  .itab b{font-size:1.7rem}
  .wgroup{grid-template-columns:1fr}
  .stage{padding:1rem .7rem 1.2rem}
  .fb{grid-template-columns:auto 1fr}
  .fb .btn{grid-column:1/-1}
  .wcard{gap:.7rem;padding-right:1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:1rem">Please turn on JavaScript to play.</p></noscript>
<script>
/* ============ DATA ============
   word tuple: [word, Thai meaning, blank-spelling (or null), index of blank (optional)] */
const UNITS = [
 {n:1,c:'#8a5a86',on:'#fff',combos:'ar · ir ur · er or',ex:'car · bird · teacher',
  ask:'Which letters make the sound in this word?',pool:['ar','ir','ur','er','or'],
  groups:[
   {label:'ar',note:'ar says /ɑː/ (ah), as in car, farm, park and star.',words:[['car','รถยนต์','ar'],['farm','ฟาร์ม','ar'],['park','สวนสาธารณะ','ar'],['star','ดาว','ar']]},
   {label:'ir / ur',note:'ir and ur say the same sound, /ɜː/ (er), as in bird, girl, nurse and purple.',words:[['bird','นก','ir'],['girl','เด็กผู้หญิง','ir'],['nurse','พยาบาล','ur'],['purple','สีม่วง','ur']]},
   {label:'er / or',note:'At the end of a word, er and or say a soft /ə/, as in teacher, sister, doctor and tractor.',words:[['teacher','ครู','er'],['sister','พี่สาว / น้องสาว','er'],['doctor','หมอ','or'],['tractor','รถแทรกเตอร์','or']]}]},
 {n:2,c:'#e8792f',on:'#1f1a12',combos:'ou ow · oi oy · oo u',ex:'mouse · coin · book',
  ask:'Which letters make the sound in this word?',pool:['ou','ow','oi','oy','oo','u'],
  groups:[
   {label:'ou / ow',note:'ou and ow say /aʊ/ (ow!), as in mouse, house, cow and brown.',words:[['mouse','หนู','ou'],['house','บ้าน','ou'],['cow','วัว','ow'],['brown','สีน้ำตาล','ow']]},
   {label:'oi / oy',note:'oi and oy say /ɔɪ/, as in coin, soil, toy and boy. oy is usually at the end of a word.',words:[['coin','เหรียญ','oi'],['soil','ดิน','oi'],['toy','ของเล่น','oy'],['boy','เด็กผู้ชาย','oy']]},
   {label:'oo / u',note:'oo and u can say a short /ʊ/, as in book, foot, bush and pull.',words:[['book','หนังสือ','oo'],['foot','เท้า','oo'],['bush','พุ่มไม้','u'],['pull','ดึง','u']]}]},
 {n:3,c:'#e5b32f',on:'#1f1a12',combos:'au aw · all wa · or oar',ex:'sauce · ball · horse',
  ask:'Which spelling pattern does this word have?',pool:['au','aw','all','wa','or','oar'],
  groups:[
   {label:'au / aw',note:'au and aw both say /ɔː/, as in sauce, August, prawn and draw.',words:[['sauce','ซอส','au'],['August','เดือนสิงหาคม','au'],['prawn','กุ้ง','aw'],['draw','วาด','aw']]},
   {label:'all / wa',note:'all says /ɔːl/, as in ball and tall. wa often says /wɔː/, as in water and walk.',words:[['ball','ลูกบอล','all'],['tall','สูง','all'],['water','น้ำ','wa'],['walk','เดิน','wa']]},
   {label:'or / oar',note:'or and oar both say /ɔː/, as in horse, fork, roar and board.',words:[['horse','ม้า','or'],['fork','ส้อม','or'],['roar','คำราม','oar'],['board','กระดาน','oar']]}]},
 {n:4,c:'#3f8450',on:'#fff',combos:'are air · ea ear · ear eer',ex:'square · bread · deer',
  ask:'Which sound does this word have?',pool:['are','air','ea','ear','eer'],
  groups:[
   {label:'air',sub:'as in chair',note:'are, air and ear can all say /eə/, as in square, share, chair, hair, bear and pear.',words:[['square','สี่เหลี่ยมจัตุรัส','are'],['share','แบ่งปัน','are'],['chair','เก้าอี้','air'],['hair','ผม','air'],['bear','หมี','ear'],['pear','ลูกแพร์','ear']]},
   {label:'e',sub:'as in bread',note:'ea can say a short /e/, as in bread and head.',words:[['bread','ขนมปัง','ea'],['head','ศีรษะ','ea']]},
   {label:'eer',sub:'as in deer',note:'ear and eer can say /ɪə/, as in ear, clear, deer and cheer.',words:[['ear','หู',null],['clear','ใส / ชัดเจน','ear'],['deer','กวาง','eer'],['cheer','เชียร์','eer']]}]},
 {n:5,c:'#a5c34a',on:'#1f1a12',combos:'a e i o u',tag:'long vowels',ex:'baby · she · music',

let ac;
const FX={ok:[[660,0],[880,.09]],bad:[[250,0],[190,.12]],streak:[[880,0],[1175,.08],[1568,.16]],win:[[523,0],[659,.12],[784,.24]],flip:[[520,0]],match:[[784,0],[988,.09]]};
function fx(kind){
  if(!prefs.fx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime;
    FX[kind].forEach(([f,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=kind==='bad'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.1,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.24);
      o.connect(g);g.connect(ac.destination);o.start(t0+d);o.stop(t0+d+.26);
    });
  }catch(e){}
}

const starSvg=(on,color)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z" fill="${on?color:'none'}" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const stars=(n,color)=>[1,2,3].map(i=>starSvg(i<=n,color)).join('');

const GAMES={
  sort:{name:'Sound Sorter',desc:'Put each word in the right group. Tap a group or drag the word.'},
  listen:{name:'Listen & Pick',desc:'Hear the word, then pick the right spelling.'},
  fill:{name:'Missing Letters',desc:'Choose the letters that finish the word.'},
  match:{name:'Word Match',desc:'Flip the cards. Match each picture with its word.'},
  sent:{name:'Sentence Fill',desc:'Read the sentence. Pick the missing word.'},
  story:{name:'Story Time',desc:'Read a short story, then answer 2 questions.'},
  hunt:{name:'Silent Letter Hunt',desc:'Find the letter that makes no sound.'}
};
const gameList=ui=>['sort','listen','fill','match','sent','story',...(ui===6?['hunt']:[])];
const matchWords=u=>{const seen=new Set();return u.words.filter(w=>w.e&&!seen.has(w.e)&&seen.add(w.e))};
const gameCount=(u,k)=>k==='fill'?u.words.filter(w=>w.s).length+' words':k==='hunt'?u.words.filter(w=>HUNT[w.w]).length+' words':k==='listen'?Math.min(10,u.words.length)+' words':k==='match'?'6 pairs':k==='sent'?CLOZE[UNITS.indexOf(u)].length+' sentences':k==='story'?STORIES[UNITS.indexOf(u)].pages.length+' pages':u.words.length+' words';
const starOf=k=>progress[k]||0;
const unitStars=ui=>({e:gameList(ui).reduce((a,g)=>a+starOf(ui+':'+g),0),m:gameList(ui).length*3});
const th=wd=>prefs.thai?wd.th:'';
const pic=wd=>`<span class="pic" aria-hidden="true">${wd.e}</span>`;

/* the letter combination inside a word, coloured in the unit colour */
function blankInfo(wd){
  const at=wd.at!==undefined?wd.at:wd.w.toLowerCase().indexOf(wd.s);
  return {pre:wd.w.slice(0,at),mid:wd.w.slice(at,at+wd.s.length),post:wd.w.slice(at+wd.s.length)};
}
function hlRange(wd){
  if(wd.s){const b=blankInfo(wd);return [b.pre.length,b.pre.length+b.mid.length]}
  return HL_EXTRA[wd.w]||null;
}
function colored(wd,txt){
  txt=txt||wd.w;const r=hlRange(wd);
  return r?txt.slice(0,r[0])+`<span class="pt">${txt.slice(r[0],r[1])}</span>`+txt.slice(r[1]):txt;
}
const wordLookup=(ui,l)=>UNITS[ui].words.find(w=>w.w.toLowerCase()===l);
/* split a sentence into tappable words; unit words are printed with the combination coloured */
function wordsHtml(text,ui){
  return text.split(/([A-Za-z']+)/).map(t=>{
    if(!/^[A-Za-z']+$/.test(t))return t;
    const l=t.toLowerCase(),wd=wordLookup(ui,l)||(l.endsWith('s')?wordLookup(ui,l.slice(0,-1)):null);
    return `<button class="tw" data-w="${t}">${wd?colored(wd,t):t}</button>`;
  }).join('');
}
/* read a sentence aloud and mark each word as it is spoken (where the browser reports word boundaries) */
function readSentence(text,box,rate=.7){
  if(!hasSpeech)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;
    const spans=[...box.querySelectorAll('.tw')];let idx=0;
    const starts=spans.map(s=>{const p=text.indexOf(s.textContent,idx);idx=p+s.textContent.length;return p});
    u.onboundary=e=>{if(e.name&&e.name!=='word')return;let k=-1;starts.forEach((p,i)=>{if(e.charIndex>=p)k=i});spans.forEach((s,i)=>s.classList.toggle('now',i===k))};
    u.onend=()=>spans.forEach(s=>s.classList.remove('now'));
    speechSynthesis.speak(u);
  }catch(e){}
}
const bindWords=box=>box.querySelectorAll('.tw').forEach(b=>b.onclick=()=>say(b.dataset.w));

function mast(){
  const cb=(k,l)=>`<label><input type="checkbox" data-tg="${k}" ${prefs[k]?'checked':''}> ${l}</label>`;
  return `<div class="mast"><div class="wm">Bright EngMath</div><div class="prefs">${cb('thai','Thai hints')}${cb('sound','Auto sound')}${cb('fx','Sound effects')}${cb('big','Big text')}</div></div>`;
}
function bindPrefs(redraw){
  $$('[data-tg]').forEach(b=>b.onchange=()=>{prefs[b.dataset.tg]=b.checked;store.set('bem_lc_prefs',prefs);applyPrefs();redraw();});
}

/* ============ HOME ============ */

/* ============ SESSIONS ============ */
let S=null;
function fillQ(wd){
  const pool=UNITS[wd.u].pool.filter(x=>x!==wd.s);
  return {type:'fill',wd,opts:shuffle([wd.s,...shuffle(pool).slice(0,3)])};
}
function listenQ(wd){
  const others=shuffle(UNITS[wd.u].words.filter(x=>x.w!==wd.w)).slice(0,3).map(x=>x.w);
  return {type:'listen',wd,opts:shuffle([wd.w,...others])};
}
function clozeQ(ui,c){
  const [s,a,t,d]=c;
  return {type:'cloze',wd:UNITS[ui].words.find(x=>x.w===a),sentence:s,full:s.replace('___',a),thTxt:t,say:s.replace('___','blank'),opts:shuffle([a,...d])};
}
function quizQs(ui){
  const st=STORIES[ui];
  return st.quiz.map(([q,a,o,ev])=>({type:'quiz',wd:{u:ui,w:q,th:'',e:''},q,a,say:q,opts:shuffle(o),ev:st.pages[ev][1],evTh:st.pages[ev][2]}));
}
function newS(o){return Object.assign({i:0,score:0,missed:[],res:[],locked:false,streak:0,best:0,qs:[]},o)}
function startUnitGame(ui,kind){
  const u=UNITS[ui];
  if(kind==='match')return startMatch(ui);
  if(kind==='story')return startStory(ui);
  let qs;
  if(kind==='sent')qs=CLOZE[ui].map(c=>clozeQ(ui,c));
  else if(kind==='sort')qs=u.words.map(wd=>({type:'sort',wd}));
  else if(kind==='listen')qs=shuffle(u.words).slice(0,10).map(listenQ);
  else if(kind==='fill')qs=u.words.filter(w=>w.s).map(fillQ);
  else qs=u.words.filter(w=>HUNT[w.w]).map(wd=>({type:'hunt',wd}));
  begin(kind,qs,ui,`Unit ${u.n} · ${GAMES[kind].name}`,ui+':'+kind);
}
function startMix(){
  const pool=[];mixSel.forEach(ui=>UNITS[ui].words.forEach(w=>pool.push(w)));
  const qs=shuffle(pool).slice(0,12).map(w=>{
    const t=['sort'];if(w.s)t.push('fill','fill');if(HUNT[w.w])t.push('hunt');if(hasSpeech)t.push('listen');
    const ty=pick(t);
    return ty==='sort'?{type:'sort',wd:w}:ty==='fill'?fillQ(w):ty==='listen'?listenQ(w):{type:'hunt',wd:w};
  });
  begin('mix',qs,null,'Review Mix','mix');
}
function begin(kind,qs,ui,label,key){
  S=newS({kind,qs:shuffle(qs),ui,label,key});
  renderQ();
}
const leave=()=>S&&S.ui!==null?unitScreen(S.ui):home();
const streakTxt=()=>S.streak>=2?`${S.streak} in a row`:'';

function renderQ(){
  const q=S.qs[S.i],wd=q.wd,u=UNITS[wd.u],N=S.qs.length;
  S.locked=false;q.failed=false;
  const stages={sort:sortStage,fill:fillStage,listen:listenStage,hunt:huntStage,cloze:clozeStage,quiz:quizStage};
  const stage=stages[q.type](q,u),spoken=q.say||wd.w;
  const seg=S.qs.map((_,i)=>`<i class="${i<S.i?S.res[i]:i===S.i?'now':''}"></i>`).join('');
  app.innerHTML=`<div class="wrap" style="${uvars(u)}">
  <div class="ghead"><button class="link" id="back">${I.back} ${S.ui!==null?'Unit '+UNITS[S.ui].n:'Home'}</button>
    <div class="gtitle">${S.label}</div><div class="gmeta"><span id="streak">${streakTxt()}</span><span id="score">Score ${S.score}</span></div></div>
  <div class="seg" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${S.i}">${seg}</div>
  <div class="qn">Question ${S.i+1} of ${N}${S.kind==='mix'?' · Unit '+u.n:''}</div>
  <section class="stage">${stage}</section>
  <div id="fb" aria-live="polite"></div></div>`;
  $('#back').onclick=leave;
  const sayBtn=$('#say');if(sayBtn)sayBtn.onclick=()=>say(spoken,q.say?.75:.8);
  S.keys=null;
  ({sort:bindSort,fill:bindFill,listen:bindListen,hunt:bindHunt,cloze:bindCloze,quiz:bindQuiz})[q.type](q,u);
  if(prefs.sound||q.type==='listen')setTimeout(()=>say(spoken,q.say?.75:.8),250);
}
const sayButton=()=>hasSpeech?`<button class="btn say" id="say" aria-label="Listen">${I.spk}<span>Listen</span></button>`:'';

/* ---- feedback ---- */
function showFb(kind,title,note){
  const last=S.i+1===S.qs.length;
  const icon=kind==='ok'?I.check:kind==='bad'?I.cross:I.info;
  const run=kind==='ok'&&S.streak>=3?` · ${S.streak} in a row`:'';
  $('#fb').innerHTML=`<div class="fb ${kind}">${icon}<div><strong>${title}${run}</strong><p>${note}</p></div><button class="btn primary" id="next">${last?'See results':'Next'} ${I.next}</button></div>`;
  const n=$('#next');n.onclick=next;n.focus({preventScroll:true});
  n.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});
}
function settle(q,ok,quiet){
  S.locked=true;
  if(ok){S.score++;S.streak++;S.best=Math.max(S.best,S.streak);}
  else{S.streak=0;S.missed.push(q);}
  S.res[S.i]=ok?'done':'miss';
  $$('.seg i')[S.i].className=ok?'done':'miss';
  $('#score').textContent='Score '+S.score;$('#streak').textContent=streakTxt();
  if(!quiet)fx(ok?(S.streak>=3&&S.streak%3===0?'streak':'ok'):'bad');
}
function next(){
  S.i++;
  S.i>=S.qs.length?results():renderQ();
}
const fmt=(g,w)=>g.note.replace(/\{w\}/g,w);
const markOf=ok=>`<span class="mark" aria-hidden="true">${ok?I.check:I.cross}</span>`;
function markOpts(chosen,right,sel){
  $$(sel||'.opt').forEach(x=>{
    x.disabled=true;
    if(x.dataset.o===right){x.classList.add('ok');x.insertAdjacentHTML('beforeend',markOf(true))}
    else if(x.dataset.o===chosen){x.classList.add('bad');x.insertAdjacentHTML('beforeend',markOf(false))}
    else x.classList.add('dim');
  });
}
const optBtns=q=>`<div class="opts words">${q.opts.map((o,i)=>`<button class="opt" data-o="${o}"><span class="kn" aria-hidden="true">${i+1}</span>${o}</button>`).join('')}</div>`;

/* ---- sort ---- */
function sortStage(q,u){
  const wd=q.wd;
  return `<p class="ask">${u.ask}</p>
  <div class="wordrow"><div class="wcard" id="card" role="img" aria-label="${wd.w}">${pic(wd)}<span class="wtxt" id="wtxt">${wd.w}</span></div>${sayButton()}</div>
  <div class="thm">${th(wd)}</div>
  <p class="hintp">Tap a group, or drag the word into it.</p>
  <div class="buckets">${u.groups.map((g,i)=>`<button class="bk" data-b="${i}" data-o="${i}"><span class="kn" aria-hidden="true">${i+1}</span><span class="bl">${g.label}</span>${g.sub?`<span class="bs">${g.sub}</span>`:''}</button>`).join('')}</div>`;
}
function bindSort(q,u){
  const wd=q.wd;
  const choose=bi=>{
    if(S.locked)return;
    const ok=bi===wd.gi;
    markOpts(String(bi),String(wd.gi),'.bk');
    $('#wtxt').innerHTML=colored(wd);
    settle(q,ok);
    const g=u.groups[wd.gi];
    showFb(ok?'ok':'bad',ok?'Correct':`Not quite. “${wd.w}” goes with “${g.label}”`,fmt(g,wd.w));
  };
  $$('.bk').forEach(b=>b.onclick=()=>choose(+b.dataset.b));
  S.keys=n=>{if(n<=u.groups.length)choose(n-1)};
  /* drag the word card onto a group */
  const card=$('#card');let sx,sy,drag=false;
  const bucketAt=(x,y)=>{for(const el of document.elementsFromPoint(x,y)){const b=el.closest&&el.closest('.bk');if(b)return b}return null};
  card.addEventListener('pointerdown',e=>{if(S.locked)return;drag=true;sx=e.clientX;sy=e.clientY;card.setPointerCapture(e.pointerId);card.classList.add('drag');card.classList.remove('back')});
  card.addEventListener('pointermove',e=>{
    if(!drag)return;
    card.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.04)`;
    $$('.bk.over').forEach(b=>b.classList.remove('over'));
    const b=bucketAt(e.clientX,e.clientY);if(b)b.classList.add('over');
  });
  const stop=(e,drop)=>{
    if(!drag)return;drag=false;card.classList.remove('drag');
    const b=drop?bucketAt(e.clientX,e.clientY):null;
    $$('.bk.over').forEach(x=>x.classList.remove('over'));
    card.classList.add('back');card.style.transform='';
    if(b&&!b.disabled)choose(+b.dataset.b);
  };
  card.addEventListener('pointerup',e=>stop(e,true));
  card.addEventListener('pointercancel',e=>stop(e,false));
}

/* ---- fill ---- */
function fillStage(q,u){
  const wd=q.wd,b=blankInfo(wd);
  return `<p class="ask">${wd.s.length===1?'Which letter is missing?':'Which letters are missing?'}</p>
  ${pic(wd)}

  <div class="wordrow" style="margin-top:.6rem">${sayButton()}</div>
  <div class="thm">${th(wd)}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${o}"><span class="kn" aria-hidden="true">${i+1}</span>${o}</button>`).join('')}</div>`;

function bindFill(q,u){

  };

}

/* ---- listen & pick ---- */
function listenStage(q,u){

/* ---- sentence fill (cloze) and story quiz ---- */
function clozeStage(q,u){

  };
  $$('.opt').forEach(x=>x.onclick=()=>choose(x.dataset.o));

/* ============ STORY TIME ============ */
function startStory(ui){
  const u=UNITS[ui];
  S=newS({kind:'storyread',ui,label:`Unit ${u.n} · Story Time`,key:ui+':story',page:0});
  renderStory();
}
function renderStory(){
  const u=UNITS[S.ui],st=STORIES[S.ui],n=st.pages.length,p=st.pages[S.page],last=S.page===n-1;
  app.innerHTML=`<div class="wrap" style="${uvars(u)}">
  <div class="ghead"><button class="link" id="back">${I.back} Unit ${u.n}</button><div class="gtitle">Story Time</div><div class="gmeta"><span>Page ${S.page+1} of ${n}</span></div></div>
  <div class="seg" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.page+1}">${st.pages.map((_,i)=>`<i class="${i<S.page?'done':i===S.page?'now':''}"></i>`).join('')}</div>
  <div class="qn"></div>
  <section class="stage"><h2 class="stitle">${st.title}</h2>
    <div class="pic scene" aria-hidden="true">${p[0]}</div>
    <p class="sent" id="sent">${wordsHtml(p[1],S.ui)}</p>
    <div class="thm">${prefs.thai?p[2]:''}</div>
    <div class="wordrow"><button class="btn say" id="read">${I.spk}<span>Read to me</span></button></div>
    <p class="hintp" style="margin:.9rem 0 0">Tap any word to hear it. Coloured letters are this unit's letter combination.</p>
  </section>
  <div class="snav"><button class="btn" id="prev" ${S.page?'':'disabled'}>${I.back} Previous</button><button class="btn primary" id="nx">${last?'Story questions':'Next page'} ${I.next}</button></div></div>`;
  $('#back').onclick=leave;
  bindWords($('#sent'));
  const read=()=>readSentence(p[1],$('#sent'));
  $('#read').onclick=read;
  $('#prev').onclick=()=>{S.page--;renderStory()};
  $('#nx').onclick=()=>{
    if(!last){S.page++;renderStory();return}
    const {ui,label,key}=S;
    begin('story',quizQs(ui),ui,label,key);
  };
  if(prefs.sound)setTimeout(read,350);
}

/* ---- hunt ---- */
function huntStage(q,u){
  const wd=q.wd;
  return `<p class="ask">Tap the silent letter: the one you can't hear.</p>
  ${pic(wd)}
  <div class="wordrow" style="margin:.2rem 0 .8rem">${sayButton()}</div>
  <div class="tiles">${[...wd.w].map((c,i)=>`<button class="tile" data-i="${i}" aria-label="letter ${c}">${c}</button>`).join('')}</div>
  <div class="thm">${th(wd)}</div>
  <div class="msg" id="msg" aria-live="polite"></div>`;
}
function bindHunt(q,u){
  const wd=q.wd,[target,soft]=HUNT[wd.w];
  $$('.tile').forEach(t=>t.onclick=()=>{
    if(S.locked)return;
    const i=+t.dataset.i;
    if(target.includes(i)){
      $$('.tile').forEach((x,k)=>{x.disabled=true;if(target.includes(k))x.classList.add('silent')});
      const ok=!q.failed;
      settle(q,ok,!ok);
      if(!ok)fx('match');
      const g=u.groups[wd.gi];
      $('#msg').textContent='';
      showFb(ok?'ok':'meh',ok?'Correct':'You found it',`${ok?'':'No point this time, because the first try was a different letter. '}${fmt(g,wd.w)}`);
    }else if(soft.includes(i)){
      $('#msg').textContent=`That letter is silent too, but this unit is about the pattern in “${u.groups[wd.gi].label}”. Try another letter.`;
    }else{
      if(!q.failed)fx('bad');
      q.failed=true;
      $('#msg').textContent='Not that one. Listen again: which letter has no sound?';
      t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');
    }
  });
}

/* ============ WORD MATCH (flip cards) ============ */
function startMatch(ui){
  const u=UNITS[ui];
  const ws=shuffle(matchWords(u)).slice(0,6);
  const cards=shuffle(ws.flatMap(w=>[{w,k:'pic'},{w,k:'word'}]));
  S=newS({kind:'match',ui,label:`Unit ${u.n} · Word Match`,key:ui+':match',cards,open:[],moves:0,found:0,total:ws.length});
  renderMatch();
}
function renderMatch(){
  const u=UNITS[S.ui];
  app.innerHTML=`<div class="wrap" style="${uvars(u)}">
  <div class="ghead"><button class="link" id="back">${I.back} Unit ${u.n}</button><div class="gtitle">${S.label}</div></div>
  <div class="seg" role="progressbar" aria-valuemin="0" aria-valuemax="${S.total}" aria-valuenow="${S.found}">${Array.from({length:S.total},(_,i)=>`<i id="sg${i}" class="${i<S.found?'done':''}"></i>`).join('')}</div>
  <div class="qn">Find the pairs: a picture and its word.</div>
  <section class="stage"><div class="mstat"><span>Moves <b id="moves">${S.moves}</b></span><span>Pairs <b id="pairs">${S.found}/${S.total}</b></span></div>
  <div class="mgrid">${S.cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="Hidden card ${i+1}"><span class="in"><span class="f back-f" aria-hidden="true">${u.pool[0]}</span><span class="f fr" aria-hidden="true">${c.k==='pic'?`<span class="pic">${c.w.e}</span>`:c.w.w}</span></span></button>`).join('')}</div></section>
  <div id="fb" aria-live="polite"></div></div>`;
  $('#back').onclick=leave;
  $$('.mc').forEach(b=>b.onclick=()=>flip(+b.dataset.i));
}
function paintCard(i){
  const c=S&&S.cards&&S.cards[i],el=$(`.mc[data-i="${i}"]`);
  if(!c||!el)return;
  el.classList.toggle('up',!!c.up);el.classList.toggle('done',!!c.done);
  el.setAttribute('aria-label',c.up||c.done?(c.k==='pic'?`Picture of ${c.w.w}`:c.w.w):`Hidden card ${i+1}`);
}
function flip(i){
  if(S.locked)return;
  const c=S.cards[i];
  if(c.up||c.done)return;
  c.up=true;paintCard(i);fx('flip');
  if(c.k==='word'&&prefs.sound)say(c.w.w);
  S.open.push(i);
  if(S.open.length<2)return;
  S.moves++;$('#moves').textContent=S.moves;
  const [ia,ib]=S.open,a=S.cards[ia],b=S.cards[ib];
  if(a.w===b.w){
    a.done=b.done=true;a.up=b.up=false;S.found++;S.open=[];
    setTimeout(()=>{paintCard(ia);paintCard(ib);fx('match');},250);
    $('#pairs').textContent=`${S.found}/${S.total}`;$(`#sg${S.found-1}`).className='done';
    if(S.found===S.total){S.locked=true;setTimeout(results,1100)}
  }else{
    S.locked=true;
    setTimeout(()=>{a.up=b.up=false;paintCard(ia);paintCard(ib);S.open=[];S.locked=false},950);
  }
}

/* ============ RESULTS ============ */
function results(){
  const match=S.kind==='match',N=S.qs.length;
  let st,big,msg;
  if(match){st=S.moves<=9?3:S.moves<=13?2:1;big=`${S.moves} moves`;msg=st===3?'Very good memory. You found every pair quickly.':st===2?'Good matching. Try again to use fewer moves.':'You found every pair. Play again to use fewer moves.';}
  else{const pct=S.score/N;st=pct>=.9?3:pct>=.7?2:1;big=`${S.score} / ${N}`;msg=pct>=.9?'Very good. Almost everything was right.':pct>=.7?'Good work. A few to review below.':'A good start. Practise the missed ones again.';}
  if(!S.shown){
    S.shown=true;
    if(st>starOf(S.key)){progress[S.key]=st;store.set('bem_lc_progress',progress)}
    fx(st>=2?'win':'ok');
  }
  const missed=S.missed,{kind,ui,label,key}=S,old=S,u=ui!==null?UNITS[ui]:null,col=u?u.d:'#22252b';
  const rows=missed.map(q=>q.type==='quiz'?`<div class="mrow"><b style="font-size:1.05rem">${q.q}</b></div>`:`<div class="mrow">${pic(q.wd)}<b>${colored(q.wd)}</b>${prefs.thai?`<span>${q.wd.th}</span>`:''}</div>`).join('');
  app.innerHTML=`<div class="wrap" style="${uvars(u)}">${mast()}<section class="res">
    <div class="rlabel">${label}</div>
    <div class="rscore">${big}</div>
    <div class="rstars" role="img" aria-label="${st} of 3 stars">${stars(st,col)}</div>
    <p class="rline">${msg}${!match&&S.best>=3?` Longest run: ${S.best} correct in a row.`:''}</p>
    ${missed.length?`<h2 class="sh" style="margin-top:1.6rem">${missed[0].type==='quiz'?'Questions to try again':'Words to practise'}</h2><div class="mrows" style="margin-top:.4rem">${rows}</div>`:''}
    <div class="actions">
      ${missed.length?'<button class="btn primary" id="again-missed">Practise missed ones</button>':''}
      <button class="btn${missed.length?'':' primary'}" id="again">Play again</button>
      <button class="btn" id="exit">${ui!==null?'Back to Unit '+u.n:'Home'}</button>
    </div></section></div>`;
  bindPrefs(results);
  $('#exit').onclick=leave;
  $('#again').onclick=()=>kind==='mix'?startMix():startUnitGame(ui,kind);
  const am=$('#again-missed');
  if(am)am.onclick=()=>begin(kind,old.missed.map(q=>q.type==='fill'?fillQ(q.wd):q.type==='listen'?listenQ(q.wd):q),ui,label,key);
  window.scrollTo(0,0);
}

/* keyboard: 1–6 choose an answer */
document.addEventListener('keydown',e=>{
  if(S&&S.keys&&!S.locked&&/^[1-9]$/.test(e.key)&&!e.metaKey&&!e.ctrlKey)S.keys(+e.key);
});
home();
</script>
