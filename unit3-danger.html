ring a flood?`,options:[`They may be damaged`,`They always move to higher ground`,`They become paramedics`,`They turn into seawalls`],correctIndex:0,explanation:`The text explains that flood water can damage houses and the things inside them.`,explanationThai:`ข้อความอธิบายว่าน้ำท่วมสามารถทำความเสียหายให้บ้านเรือนและสิ่งของภายในได้`,hint1:`Think about what floodwater can do to a building.`,hint2:`The other options are not mentioned in the text.`,example:`Roads can also become unsafe during a flood.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about what floodwater can do to a building.`},{id:`l11-mq-08`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Cause & Effect Words`,difficulty:`challenge`,prompt:`Complete the sentence with the correct phrase.`,before:`The drainage system became full.`,after:`, water stayed on the streets for hours.`,answers:[`as a result`,`As a result`],explanation:`"As a result" shows what happened because the drainage system became full.`,explanationThai:`"As a result" แสดงสิ่งที่เกิดขึ้นเพราะระบบระบายน้ำเต็ม`,hint1:`This phrase has three words and means "because of this".`,hint2:`It starts a new sentence.`,example:`There was a storm. As a result, big waves hit the coast.`,points:14,feedbackCorrect:`Correct — "as a result" fits perfectly.`,feedbackIncorrect:`What three-word phrase means "because of this"?`},{id:`l11-mq-09`,type:`mcq`,skill:`flood-knowledge`,topic:`Identifying Causes`,difficulty:`medium`,prompt:`A news report says, 'Storm waves crashed over the town's sea barrier again this morning.' What most likely caused this flooding?`,options:[`Water going over a seawall`,`Rapid snowmelt`,`A full drainage system`,`Heavy rain inland`],correctIndex:0,explanation:`The report describes waves crashing over the sea barrier (seawall), so that is the cause of this flooding.`,explanationThai:`รายงานข่าวบรรยายคลื่นซัดข้ามแนวป้องกันชายฝั่ง สาเหตุคือน้ำข้ามกำแพงกันคลื่น`,hint1:`Look for the key phrase about the sea barrier.`,hint2:`This is not about snow or rivers.`,example:`Rapid snowmelt is a cause more connected to mountains and rivers.`,points:12,feedbackCorrect:`Correct!`,feedbackIncorrect:`Read the description again — what did the waves go over?`},{id:`l11-mq-10`,type:`true-false`,skill:`flood-knowledge`,topic:`Effects of Floods`,difficulty:`medium`,prompt:`True or false?`,statement:`Some dry habitats can benefit from the extra water during a flood.`,correctAnswer:!0,explanation:`This is true — while floods cause damage in many places, a dry habitat can sometimes benefit from the extra water it receives.`,explanationThai:`ข้อความนี้ถูกต้อง ถิ่นที่อยู่อาศัยที่แห้งบางแห่งอาจได้ประโยชน์จากน้ำที่เพิ่มขึ้น`,hint1:`Think about a place that is usually very dry.`,hint2:`Not every effect of a flood is bad everywhere.`,example:`A flooded road, however, becomes unsafe.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about a place that is usually very dry.`}]},summary:{keyTakeaways:[`Floods have six common causes: heavy rain, rapid snowmelt, rivers overflowing their banks, large coastal waves, water going over seawalls, and drainage systems becoming full.`,`Floods can happen slowly over many days, or quickly as a flash flood.`,`We use "because" and "as a result" to explain reasons and results; "so" and "this causes" link a cause directly to its effect; "when" links two things that happen close together in time.`,`Floods can make roads unsafe, damage houses, and cause animals to lose their habitats — but some dry habitats can benefit from the extra water.`],keyTakeawaysThai:[`น้ำท่วมมีสาเหตุทั่วไป 6 อย่าง: ฝนตกหนัก หิมะละลายเร็ว แม่น้ำล้นตลิ่ง คลื่นใหญ่ที่ชายฝั่ง น้ำข้ามกำแพงกันคลื่น และระบบระบายน้ำเต็ม`,`น้ำท่วมเกิดขึ้นได้ทั้งช้า ๆ หลายวัน หรือรวดเร็วแบบน้ำท่วมฉับพลัน`,`น้ำท่วมอาจทำให้ถนนไม่ปลอดภัย บ้านเสียหาย และสัตว์สูญเสียถิ่นที่อยู่อาศัย แต่บางถิ่นที่แห้งก็อาจได้ประโยชน์จากน้ำ`]}}},M=[{locId:`l1`,loc:`the mountain (snow)`,sentId:`s1`,sentence:`The snow is melting.`},{locId:`l2`,loc:`the river`,sentId:`s2`,sentence:`There is a lot of rain.`},{locId:`l3`,loc:`the riverbank`,sentId:`s3`,sentence:`The water is going over the riverbank.`},{locId:`l4`,loc:`the village`,sentId:`s4`,sentence:`There is a flood in the village.`},{locId:`l5`,loc:`the coast (big waves)`,sentId:`s5`,sentence:`Big waves are coming from the sea.`}],Hi={id:`l12-flood-sequence-picture`,number:12,title:`Picture Interpretation: Flood Sequence`,subtitle:`Read a flood scene and connect each location to what is happening there.`,skillCategory:`flood-knowledge`,estimatedMinutes:18,stages:{warmup:{promptEn:`Imagine a picture with a mountain, a river, a village, and the sea, all in one scene. What do you think connects them? Talk with a partner or write one sentence.`,promptThai:`ลองนึกภาพที่มีภูเขา แม่น้ำ หมู่บ้าน และทะเลอยู่ในภาพเดียวกัน คิดว่าอะไรเชื่อมสิ่งเหล่านี้เข้าด้วยกัน? พูดคุยกับเพื่อนหรือเขียนหนึ่งประโยค`,hook:`Water connects them all — it flows from the mountain, through the river and village, all the way to the sea.`},learn:{intro:`Picture a landscape: snow-capped mountains at the top, melting into a river that flows past a riverbank and through a village, then out to the sea where big waves are forming. After heavy rain, the river rises so high that the water goes over the riverbank, and the flooded land spreads out near the village until the streets themselves are underwater. Out at the coast, big waves are forming too, ready to crash onto the shore.`,introThai:`ลองนึกภาพทิวทัศน์ที่มีภูเขาหิมะอยู่ด้านบน หิมะละลายไหลลงสู่แม่น้ำที่ไหลผ่านริมฝั่งและหมู่บ้าน แล้วไหลออกสู่ทะเลที่มีคลื่นใหญ่กำลังก่อตัว หลังฝนตกหนัก แม่น้ำสูงขึ้นจนน้ำข้ามริมฝั่งและท่วมพื้นที่ใกล้หมู่บ้าน`,points:[{title:`Reading a flood picture`,body:`A flood picture usually shows water moving from a high place, like a mountain, down through a river, and out to the sea or across the land.`,bodyThai:`ภาพน้ำท่วมมักแสดงน้ำที่เคลื่อนจากที่สูง เช่น ภูเขา ลงสู่แม่น้ำ และออกสู่ทะเลหรือแผ่นดิน`},{title:`Matching sentences to locations`,body:`Each part of a flood picture — the mountain, the river, the riverbank, the village, and the coast — can be matched to a sentence describing what is happening there.`,bodyThai:`แต่ละส่วนของภาพน้ำท่วม เช่น ภูเขา แม่น้ำ ริมฝั่ง หมู่บ้าน และชายฝั่ง สามารถจับคู่กับประโยคที่อธิบายสิ่งที่เกิดขึ้นที่นั่นได้`},{title:`Reading the sequence`,body:`A flood picture often shows a sequence: one event causes the next, from melting snow all the way to a flooded village.`,bodyThai:`ภาพน้ำท่วมมักแสดงลำดับเหตุการณ์ที่เหตุการณ์หนึ่งนำไปสู่อีกเหตุการณ์หนึ่ง ตั้งแต่หิมะละลายจนถึงหมู่บ้านถูกน้ำท่วม`}]},examples:{items:[{text:`The snow is melting at the top of the mountain.`,noteThai:`หิมะกำลังละลายที่ยอดเขา`},{text:`The river carries the extra water down toward the village.`,noteThai:`แม่น้ำนำน้ำส่วนเกินไหลลงสู่หมู่บ้าน`},{text:`The water is going over the riverbank.`,noteThai:`น้ำกำลังข้ามริมฝั่งแม่น้ำ`},{text:`There is a flood in the village.`,noteThai:`เกิดน้ำท่วมในหมู่บ้าน`},{text:`Big waves are coming from the sea toward the coast.`,noteThai:`คลื่นใหญ่กำลังมาจากทะเลเข้าสู่ชายฝั่ง`}]},guided:{questions:[{id:`l12-g-01`,type:`match`,skill:`flood-knowledge`,topic:`Label the Picture`,difficulty:`easy`,prompt:`Look at the picture in your mind. Match each location to what is happening there.`,left:M.map(e=>({id:e.locId,label:e.loc})),right:M.map(e=>({id:e.sentId,label:e.sentence})),pairs:{l1:`s1`,l2:`s2`,l3:`s3`,l4:`s4`,l5:`s5`},explanation:`Each part of the picture shows something different happening: the snow melts at the mountain, rain falls near the river, water goes over the riverbank, the village floods, and big waves come from the sea at the coast.`,explanationThai:`แต่ละส่วนของภาพแสดงสิ่งที่เกิดขึ้นต่างกัน: หิมะละลายที่ภูเขา ฝนตกใกล้แม่น้ำ น้ำข้ามริมฝั่ง หมู่บ้านถูกน้ำท่วม และคลื่นใหญ่มาจากทะเลที่ชายฝั่ง`,hint1:`Start with the highest place in the picture — the mountain.`,hint2:`The coast is where you would see big waves.`,example:`the riverbank → "The water is going over the riverbank."`,points:16,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — picture each location again.`},{id:`l12-g-02`,type:`match`,skill:`flood-knowledge`,topic:`Sentences to Locations`,difficulty:`easy`,prompt:`Match each sentence to the location it describes.`,left:M.map(e=>({id:e.sentId,label:e.sentence})),right:M.map(e=>({id:e.locId,label:e.loc})),pairs:{s1:`l1`,s2:`l2`,s3:`l3`,s4:`l4`,s5:`l5`},explanation:`This time, match in the other direction: read each sentence first, then find the location it describes.`,explanationThai:`ครั้งนี้ให้จับคู่ในทิศทางตรงข้าม อ่านประโยคก่อนแล้วจึงหาสถานที่ที่ตรงกับประโยคนั้น`,hint1:`"Big waves are coming from the sea" happens at the coast.`,hint2:`"The snow is melting" happens at the mountain.`,example:`"There is a flood in the village." → the village`,points:16,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — read each sentence again.`},{id:`l12-g-03`,type:`sequence`,skill:`flood-knowledge`,topic:`Flood Sequence`,difficulty:`medium`,presentation:`events`,prompt:`Put these events from the picture in the correct order, from first to last.`,items:[{id:`e1`,label:`The snow on the mountain melts.`},{id:`e2`,label:`The river rises with extra water.`},{id:`e3`,label:`The water goes over the riverbank.`},{id:`e4`,label:`The village floods.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`First the snow melts, which sends extra water into the river. The river rises until it goes over the riverbank, and the water then floods the village.`,explanationThai:`ก่อนอื่นหิมะละลายทำให้มีน้ำเพิ่มเข้าสู่แม่น้ำ แม่น้ำจึงสูงขึ้นจนน้ำข้ามริมฝั่ง แล้วน้ำก็ท่วมหมู่บ้าน`,hint1:`Think about where the water starts, high on the mountain.`,hint2:`The village is the last place the water reaches in this sequence.`,example:`At the coast, a storm forms before big waves hit the seawall.`,points:16,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Think about where the water starts and where it ends up.`},{id:`l12-g-04`,type:`mcq`,skill:`flood-knowledge`,topic:`Explaining the Picture`,difficulty:`medium`,prompt:`Which sentence best explains what is happening at the riverbank?`,options:[`The water is going over the riverbank.`,`The snow is melting.`,`Big waves are coming from the sea.`,`There is a flood in the village.`],correctIndex:0,explanation:`The riverbank is where the rising river water spills over onto the land — this is shown by "The water is going over the riverbank."`,explanationThai:`ริมฝั่งแม่น้ำคือจุดที่น้ำในแม่น้ำที่สูงขึ้นล้นออกไปยังแผ่นดิน`,hint1:`Look at the location named in each sentence.`,hint2:`Only one sentence actually mentions the riverbank.`,example:`At the mountain, the correct sentence is "The snow is melting."`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the sentence that names the riverbank.`},{id:`l12-g-05`,type:`mcq`,skill:`flood-knowledge`,topic:`Staying Safe`,difficulty:`medium`,prompt:`Which location is safest during a flood?`,options:[`Higher ground, away from the river and the coast`,`The flooded village`,`The riverbank`,`The coast where the big waves are`],correctIndex:0,explanation:`Higher ground, away from rivers and the coast, is the safest place to be during a flood because floodwater cannot easily reach it.`,explanationThai:`ที่สูงซึ่งอยู่ห่างจากแม่น้ำและชายฝั่งเป็นสถานที่ปลอดภัยที่สุดในช่วงน้ำท่วม เพราะน้ำท่วมเข้าถึงได้ยาก`,hint1:`Think about which place floodwater cannot easily reach.`,hint2:`The other three places are all shown underwater or right next to the water in the picture.`,example:`The riverbank is one of the first places water covers during a flood.`,points:12,feedbackCorrect:`Correct — higher ground is the safest place.`,feedbackIncorrect:`Think about which place floodwater cannot easily reach.`},{id:`l12-g-06`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Diagram Description`,difficulty:`medium`,prompt:`Complete the description of the picture.`,before: ั่ง ข้ามกำแพงกันคลื่น แล้วไหลไปถึงถนนในหมู่บ้าน`,hint1:`Think about where the storm starts, far out at sea.`,hint2:`The seawall is the last barrier before the water reaches the village.`,example:`On the river side, the snow melts before the riverbank overflows.`,points:16,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Think about where the storm starts and where the water ends up.`},{id:`l12-i-04`,type:`mcq`,skill:`flood-knowledge`,topic:`Staying Safe`,difficulty:`medium`,prompt:`If you were standing in the village during a flood, where should you go?`,options:[`Higher ground, away from the water`,`The riverbank`,`The flooded land near the river`,`The coast where the big waves are`],correctIndex:0,explanation:`During a flood, the safest choice is to move to higher ground, away from the rising water.`,explanationThai:`ระหว่างน้ำท่วม ทางเลือกที่ปลอดภัยที่สุดคือย้ายไปยังที่สูงห่างจากน้ำที่กำลังสูงขึ้น`,hint1:`Think about which place is furthest from the rising water.`,hint2:`The other three places are shown underwater or right next to the water.`,example:`The riverbank is one of the first places covered by rising water.`,points:12,feedbackCorrect:`Correct — higher ground is the safest choice.`,feedbackIncorrect:`Think about which place is furthest from the rising water.`},{id:`l12-i-05`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Diagram Description`,difficulty:`medium`,prompt:`Complete the description of the picture.`,before:`The`,after:`is melting at the top of the mountain, and the water flows down into the river.`,answers:[`snow`],explanation:`The picture shows snow melting on the mountain, which sends water flowing down into the river.`,explanationThai:`ภาพแสดงหิมะที่ละลายบนภูเขา ซึ่งทำให้น้ำไหลลงสู่แม่น้ำ`,hint1:`This is the white, cold thing at the top of the mountain.`,hint2:`It starts with the letter S.`,example:`The riverbank is the land at the edge of the river.`,points:10,feedbackCorrect:`Correct — "snow" fits perfectly.`,feedbackIncorrect:`What white, cold thing is at the top of the mountain?`},{id:`l12-i-06`,type:`mcq`,skill:`flood-knowledge`,topic:`Explaining the Picture`,difficulty:`medium`,prompt:`Which sentence best explains what is happening in the village?`,options:[`There is a flood in the village.`,`The snow is melting.`,`Big waves are coming from the sea.`,`The water is going over the riverbank.`],correctIndex:0,explanation:`The village is shown covered in floodwater after it flows past the riverbank, so "There is a flood in the village" is correct.`,explanationThai:`หมู่บ้านในภาพถูกน้ำท่วมหลังจากน้ำไหลผ่านริมฝั่งแม่น้ำ`,hint1:`Look for the sentence that names the village directly.`,hint2:`This is the last event in the sequence, after the riverbank overflows.`,example:`At the riverbank, the correct sentence is "The water is going over the riverbank."`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the sentence that names the village.`},{id:`l12-i-07`,type:`match`,skill:`flood-knowledge`,topic:`Sentences to Locations`,difficulty:`medium`,prompt:`Match each sentence to the location it describes.`,left:[{id:`s1`,label:`There is a lot of rain.`},{id:`s2`,label:`The water is going over the riverbank.`},{id:`s3`,label:`There is a flood in the village.`},{id:`s4`,label:`Big waves are coming from the sea.`}],right:[{id:`l1`,label:`the river`},{id:`l2`,label:`the riverbank`},{id:`l3`,label:`the village`},{id:`l4`,label:`the coast (big waves)`}],pairs:{s1:`l1`,s2:`l2`,s3:`l3`,s4:`l4`},explanation:`Reading each sentence carefully tells you exactly which location it describes.`,explanationThai:`การอ่านแต่ละประโยคอย่างละเอียดจะบอกได้ว่าประโยคนั้นอธิบายสถานที่ใด`,hint1:`"Big waves" can only be at the coast.`,hint2:`A flood "in the village" describes the village itself.`,example:`"The snow is melting." → the mountain`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Read each sentence again and think about where it happens.`},{id:`l12-i-08`,type:`fill-blank`,skill:`flood-kn Big waves are coming from the sea.`,`The water is going over the riverbank.`],correctIndex:0,explanation:`The mountain is snow-capped, and the snow is melting, sending water down toward the river.`,explanationThai:`ภูเขามีหิมะปกคลุมและหิมะกำลังละลายส่งน้ำลงสู่แม่น้ำ`,hint1:`The mountain is described as "snow-capped".`,hint2:`This is the location at the very top of the picture.`,example:`At the coast, the correct sentence is "Big waves are coming from the sea."`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about what snow does when the weather warms up.`},{id:`l12-mq-02`,type:`mcq`,skill:`flood-knowledge`,topic:`Explaining the Picture`,difficulty:`medium`,prompt:`Which sentence best explains what is happening at the riverbank?`,options:[`The water is going over the riverbank.`,`The snow is melting.`,`There is a flood in the village.`,`Big waves are coming from the sea.`],correctIndex:0,explanation:`The riverbank is where the rising river spills over onto the land.`,explanationThai:`ริมฝั่งแม่น้ำคือจุดที่น้ำในแม่น้ำที่สูงขึ้นล้นออกไปยังแผ่นดิน`,hint1:`Only one sentence names the riverbank directly.`,hint2:`This event happens after the river rises, but before the village floods.`,example:`At the mountain, the correct sentence is "The snow is melting."`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the sentence that names the riverbank.`},{id:`l12-mq-03`,type:`match`,skill:`flood-knowledge`,topic:`Label the Picture`,difficulty:`medium`,prompt:`Match each location to what is happening there.`,left:[{id:`l1`,label:`the mountain (snow)`},{id:`l2`,label:`the riverbank`},{id:`l3`,label:`the village`},{id:`l4`,label:`the coast (big waves)`}],right:[{id:`s1`,label:`The snow is melting.`},{id:`s2`,label:`The water is going over the riverbank.`},{id:`s3`,label:`There is a flood in the village.`},{id:`s4`,label:`Big waves are coming from the sea.`}],pairs:{l1:`s1`,l2:`s2`,l3:`s3`,l4:`s4`},explanation:`Each location in the picture matches one sentence describing what is happening there, following the water from the mountain to the coast.`,explanationThai:`แต่ละสถานที่ในภาพตรงกับหนึ่งประโยคที่อธิบายสิ่งที่เกิดขึ้น ตามเส้นทางน้ำจากภูเขาไปจนถึงชายฝั่ง`,hint1:`Start with the highest place in the picture.`,hint2:`The coast is where you would see big waves.`,example:`the river → "There is a lot of rain."`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — picture each location again.`},{id:`l12-mq-04`,type:`sequence`,skill:`flood-knowledge`,topic:`Flood Sequence`,difficulty:`medium`,presentation:`events`,prompt:`Put these events from the picture in the correct order, from first to last.`,items:[{id:`e1`,label:`The snow on the mountain melts.`},{id:`e2`,label:`The river rises with extra water.`},{id:`e3`,label:`The water goes over the riverbank.`},{id:`e4`,label:`The village floods.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`First the snow melts, sending extra water into the river. The river rises until it goes over the riverbank, and the village floods last.`,explanationThai:`ก่อนอื่นหิมะละลายทำให้มีน้ำเพิ่มเข้าสู่แม่น้ำ แม่น้ำจึงสูงขึ้นจนน้ำข้ามริมฝั่ง แล้วหมู่บ้านก็ถูกน้ำท่วมเป็นลำดับสุดท้าย`,hint1:`Think about where the water starts, high on the mountain.`,hint2:`The village is the last place the water reaches.`,example:`At the coast, a storm forms before big waves hit the seawall.`,points:16,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Think about where the water starts and where it ends up.`},{id:`l12-mq-05`,type:`mcq`,skill:`flood-knowledge`,topic:`Staying Safe`,difficulty:`medium`,prompt:`Which location is safest during a flood?`,options:[`Higher ground, away from the river and the coast`,`The riverbank`,`The flooded village`,`The coast where the big waves are`],correctIndex:0,explanation:`Higher ground, away from rivers and the coast, is the safest place to be during a flood.`,explanationThai:`ที่สูงซึ่งอยู่ห่างจากแม่น้ำและชายฝั่งเป็นสถานที่ปลอดภัยที่สุดในช่วงน้ำท่วม`,hint1:`Think about which place floodwater cannot easily reach.`,hint2:`The other three places are shown underwater or right next to the water.`,example:`The riverbank is one of the first places water covers during a flood.`,points:12,feedbackCorrect:`Correct — higher ground is the safest place.`,feedbackIncorrect:`Think about which place floodwater cannot easily reach.`},{id:`l12-mq-06`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Diagram Description`,difficulty:`medium`,prompt:`Complete the description of the picture.`,before:`In the picture, the water goes over the`,after:`and then floods the village.`,answers:[`riverbank`],explanation:`The water rises in the river, goes over the riverbank, and then reaches and floods the village.`,explanationThai:`น้ำในแม่น้ำสูงขึ้น ข้ามริมฝั่ง แล้วไหลไปถึงและท่วมหมู่บ้าน`,hint1:`This word names the land at the edge of the river.`,hint2:`It is not "coast" — that is next to the sea, not the river.`,example:`Big waves go over the seawall at the coast.`,points:10,feedbackCorrect:`Correct — "riverbank" fits perfectly.`,feedbackIncorrect:`What is the land at the edge of a river called?`},{id:`l12-mq-07`,type:`mcq`,skill:`flood-knowledge`,topic:`Explaining the Picture`,difficulty:`challenge`,prompt:`Look at the whole picture. Why did the village flood?`,options:[`Because the river water went over the riverbank`,`Because a firefighter arrived`,`Because the sea moved closer`,`Because the sun came out`],correctIndex:0,explanation:`Following the picture from the mountain to the village: melting snow raised the river, and the river water went over the riverbank, flooding the village.`,explanationThai:`หากดูภาพตั้งแต่ภูเขาจนถึงหมู่บ้าน หิมะละลายทำให้แม่น้ำสูงขึ้น และน้ำในแม่น้ำข้ามริมฝั่งจนท่วมหมู่บ้าน`,hint1:`Think about the order of events, from the mountain down to the village.`,hint2:`The other options are not shown anywhere in the picture.`,example:`At the coast, a flood could happen because big waves go over a seawall instead.`,points:14,feedbackCorrect:`Correct — the river water going over the riverbank caused the flood.`,feedbackIncorrect:`Think about the order of events, from the mountain down to the village.`}]},summary:{keyTakeaways:[`A flood picture can be read as a sequence: water moves from a high place, like a mountain, down through a river, and out to the sea.`,`Each location in a flood picture — the mountain, the river, the riverbank, the village, and the coast — matches a specific sentence describing what is happening there.`,`Higher ground, away from rivers and the coast, is the safest place to be during a flood.`,`Reading a flood diagram means connecting each part of the picture to the event happening in that spot.`],keyTakeawaysThai:[`ภาพน้ำท่วมสามารถอ่านเป็นลำดับเหตุการณ์ได้: น้ำเคลื่อนจากที่สูงอย่างภูเขา ลงสู่แม่น้ำ และออกสู่ทะเล`,`แต่ละสถานที่ในภาพน้ำท่วมตรงกับประโยคเฉพาะที่อธิบายสิ่งที่เกิดขึ้นที่นั่น`,`ที่สูงซึ่งอยู่ห่างจากแม่น้ำและชายฝั่งเป็นสถานที่ปลอดภัยที่สุดในช่วงน้ำท่วม`]}}},Ui={id:`l13-integrated-review`,number:13,title:`Integrated Grammar and Vocabulary Review`,subtitle:`Mix vocabulary, grammar, and dialogue skills from Lessons 1-12 in one big review.`,skillCategory:`grammar`,estimatedMinutes:25,stages:{warmup:{promptEn:`Look at these four words: was, were, running, flood. In pairs, try to use two of them in one sentence about an emergency.`,promptThai:`ดูคำสี่คำนี้: was, were, running, flood ลองจับคู่กับเพื่อนและใช้สองคำนี้ในหนึ่งประโยคเกี่ยวกับเหตุฉุกเฉิน`,hook:`This lesson mixes everything you have learned so far — vocabulary, grammar, and dialogue — all in one place.`},learn:{intro:`This is a review lesson, so there is no new grammar to learn today. Instead, you will practise everything from Lessons 1 to 12 together: emergency and flood vocabulary, was/were, verb-ing spelling, past continuous, and emergency dialogues, all mixed into one set of questions.`,introThai:`บทเรียนนี้เป็นบทเรียนทบทวน จึงไม่มีไวยากรณ์ใหม่ให้เรียนวันนี้ แต่คุณจะได้ฝึกฝนทุกอย่างจากบทที่ 1 ถึง 12 รวมกัน ได้แก่ คำศัพท์ฉุกเฉินและน้ำท่วม was/were การสะกดกริยาเติม -ing อดีตต่อเนื่อง และบทสนทนาฉุกเฉิน โดยผสมกันในชุดคำถามเดียว`,points:[{title:`Was or were?`,body:`Use "was" with I/he/she/it, and "were" with you/we/they.`,bodyThai:`ใช้ "was" กับ I/he/she/it และใช้ "were" กับ you/we/they`},{title:`Past continuous shape`,body:`Past continuous = was/were + verb-ing, for an action that was in progress in the past.`,bodyThai:`อดีตต่อเนื่อง = was/were + กริยาเติม -ing สำหรับการกระทำที่กำลังดำเนินอยู่ในอดีต`},{title:`"When" + simple past`,body:`We often use "when" with the simple past to show a shorter action that interrupted a longer past continuous action.`,bodyThai:`เรามักใช้ "when" กับอดีตกาลธรรมดาเพื่อแสดงเหตุการณ์สั้นๆ ที่มาขัดจังหวะเหตุการณ์อดีตต่อเนื่องที่ยาวกว่า`}]},examples:{items:[{text:`The flood was rising quickly when the family left their house.`,noteThai:`น้ำท่วมกำลังสูงขึ้นอย่างรวดเร็วเมื่อครอบครัวออกจากบ้าน`},{text:`Were you watching TV when the storm started?`,noteThai:`คุณกำลังดูทีวีอยู่หรือเปล่าตอนที่พายุเริ่ม`},{text:`The paramedics weren't far away, so they arrived quickly.`,noteThai:`เจ้าหน้าที่พยาบาลฉุกเฉินอยู่ไม่ไกล พวกเขาจึงมาถึงอย่างรวดเร็ว`},{text:`"Emergency services, what's your emergency?" is how an operator usually answers the phone.`,noteThai:`"Emergency services, what's your emergency?" คือประโยคที่เจ้าหน้าที่รับสายมักพูดก่อน`}]},guided:{questions:[{id:`l13-g-01`,type:`mcq`,skill:`vocabulary`,topic:`Emergency Workers`,difficulty:`easy`,prompt:`Which word means 'a person whose job is to keep people safe and stop crime'?`,promptThai:`คำใดหมายถึง 'คนที่มีหน้าที่ดูแลความปลอดภัยของผู้คนและหยุดยั้งอาชญากรรม'?`,options:[`police officer`,`paramedic`,`firefighter`,`emergency operator`],correctIndex:0,explanation:`A police officer's job is to keep people safe and stop crime.`,explanationThai:`ตำรวจมีหน้าที่ดูแลความปลอดภัยของผู้คนและหยุดยั้งอาชญากรรม`,hint1:`This worker often drives a car with flashing blue and red lights.`,hint2:`This job is not about fires or medicine.`,example:`A firefighter's job is to put out fires.`,points:10,feedbackCorrect:`Correct — that is a police officer.`,feedbackIncorrect:`Think about who stops crime, not who fights fires.`},{id:`l13-g-02`,type:`true-false`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`easy`,prompt:`Read this: A flood happens when heavy rain covers streets and homes with water. Is this statement true or false: 'A flood happens when there is too little water.'`,promptThai:`อ่านข้อความนี้: น้ำท่วมเกิดขึ้นเมื่อฝนตกหนักปกคลุมถนนและบ้านเรือนด้วยน้ำ ข้อความนี้จริงหรือเท็จ: 'น้ำท่วมเกิดขึ้นเมื่อมีน้ำน้อยเกินไป'`,statement:`A flood happens when there is too little water.`,correctAnswer:!1,explanation:`A flood happens when there is too MUCH water covering land that is usually dry, not too little.`,explanationThai:`น้ำท่วมเกิดขึ้นเมื่อมีน้ำมากเกินไปปกคลุมพื้นที่ที่ปกติแห้ง ไม่ใช่น้ำน้อยเกินไป`,hint1:`Think about what covers the streets in a flood.`,hint2:`Too little water would not stop cars from driving.`,example:`Statement: "Emergency services means police, fire, and ambulance together." → True.`,points:10,feedbackCorrect:`Correct — a flood means too much water, not too little.`,feedbackIncorrect:`Read the statement again and think about what a flood really is.`},{id:`l13-g-03`,type:`fill-blank`,skill:`grammar`,topic:`Was / Were`,difficulty:`easy`,prompt:`Complete the sentence with was or were.`,promptThai:`เติมประโยคด้วย was หรือ were`,before:`It`,after:`raining heavily all night, so the river rose.`,answers:[`was`],explanation:`We use "was" with the subject "it" in the past simple.`,explanationThai:`เราใช้ "was" กับประธาน "it" ในอดีตกาล`,hint1:`The subject here is "it" — singular.`,hint2:`Use "were" only with you/we/they, not "it".`,example:`They were sleeping when the storm began.`,points:8,feedbackCorrect:`Correct — "it was" is right.`,feedbackIncorrect:`Which word goes with "it" — was or were?`},{id:`l13-g-04`,type:`error-correction`,skill:`grammar`,topic:`Wasn't / Weren't`,difficulty:`medium`,prompt:`This sentence has one wrong word. Find it and fix it.`,promptThai:`ประโยคนี้มีคำผิดหนึ่งคำ หาคำผิดแล้วแก้ไข`,sentence:`The children wasn't listening to the teacher.`,wrongWord:`wasn't`,correctWord:`weren't`,explanation:`"Children" is plural, so it needs "weren't", not "wasn't".`,explanationThai:`"children" เป็นพหูพจน์ จึงต้องใช้ "weren't" ไม่ใช่ "wasn't"`,hint1:`Count how many children there are.`,hint2:`Plural subjects use "weren't".`,example:`"He wasn't listening." → correct as is, because "he" is singular.`,points:12,feedbackCorrect:`Correct — "weren't" fits a plural subject.`,feedbackIncorrect:`Look at the subject — is it one child or many?`},{id:`l13-g-05`,type:`mcq`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`Which spelling is correct for the -ing form of 'stop'?`,promptThai:`การสะกดแบบใดถูกต้องสำหรับรูป -ing ของคำว่า 'stop'?`,options:[`stoping`,`stopping`,`stopeing`,`stoppeing`],correctIndex:1,explanation:`"Stop" ends in a single vowel + consonant, so we double the final consonant before adding -ing: stopping.`,explanationThai:`"stop" ลงท้ายด้วยสระตัวเดียว + พยัญชนะ จึงต้องเพิ่มพยัญชนะตัวสุดท้ายซ้ำก่อนเติม -ing: stopping`,hint1:`Count the letters at the end of "stop" — vowel then consonant.`,hint2:`We do not just add -ing here; one letter must be doubled.`,example:`"run" → "running" (double the n).`,points:10,feedbackCorrect:`Correct — "stopping" doubles the p.`,feedbackIncorrect:`Remember the doubling rule for short verbs like "stop".`},{id:`l13-g-06`,type:`word-order`,skill:`grammar`,topic:`Past Continuous Statements`,difficulty:`medium`,prompt:`Put the words in the correct order to make a past continuous sentence.`,promptThai:`เรียงคำให้ถูกต้องเพื่อสร้างประโยคอดีตต่อเนื่อง`,words:[`The`,`paramedic`,`was`,`checking`,`the`,`boy's`,`arm.`],correctOrder:[`The`,`paramedic`,`was`,`checking`,`the`,`boy's`,`arm.`],explanation:`Past continuous statements follow the order: subject + was/were + verb-ing + the rest of the sentence.`,explanationThai:`ประโยคอดีตต่อเนื่องเรียงลำดับดังนี้: ประธาน + was/were + กริยาเติม -ing + ส่วนที่เหลือของประโยค`,hint1:`The subject "The paramedic" comes first.`,hint2:`"was" comes right after the subject, before the -ing verb.`,example:`The firefighters were rescuing the family.`,points:14,feedbackCorrect:`Correct order — well done!`,feedbackIncorrect:`Check where "was" and the -ing verb belong.`},{id:`l13-g-07`,type:`mcq`,skill:`grammar`,topic:`Past Continuous Questions`,difficulty:`medium`,prompt:`Which is the correct question?`,promptThai:`ข้อใดเป็นคำถามที่ถูกต้อง?`,options:[`Was he running when the alarm rang?`,`He was running when the alarm rang?`,`Did he was running when the alarm rang?`,`Was he ran when the alarm rang?`],correctIndex:0,explanation:`Past continuous questions start with was/were before the subject, followed by the -ing verb: "Was he running...?"`,explanationThai:`คำถามอดีตต่อเนื่องขึ้นต้นด้วย was/were ก่อนประธาน ตามด้วยกริยาเติม -ing: "Was he running...?"`,hint1:`A question needs was/were BEFORE the subject.`,hint2:`The verb after "was/were + subject" must end in -ing.`,example:`Were they watching TV when the storm started?`,points:12,feedbackCorrect:`Correct — questions begin with was/were.`,feedbackIncorrect:`Look at the word order — where should "was" go?`},{id:`l13-g-08`,type:`true-false`,skill:`grammar`,topic:`Past Continuous Short Answers`,difficulty:`easy`,prompt:`Is this statement true or false: 'The short answer to "Were you sleeping?" can be "Yes, I was."'`,promptThai:`ข้อความนี้จริงหรือเท็จ: 'คำตอบสั้นของ "Were you sleeping?" อาจเป็น "Yes, I was."'`,statement:`The short answer to "Were you sleeping?" can be "Yes, I was."`,correctAnswer:!0,explanation:`Even though the question uses "were" with "you", the short answer about yourself uses "I was" or "I wasn't".`,explanationThai:`แม้คำถามใช้ "were" กับ "you" แต่คำตอบสั้นเกี่ยวกับตัวเองใช้ "I was" หรือ "I wasn't"`,hint1:`Think about who is answering the question — "I", not "you".`,hint2:`"I" always pairs with "was" in short answers.`,example:`"Was she cooking?" → "Yes, she was." / "No, she wasn't."`,points:10,feedbackCorrect:`Correct — "Yes, I was" is a real, correct short answer.`,feedbackIncorrect:`Think about which word pairs with "I" in short answers.`},{id:`l13-g-09`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous with When`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,promptThai:`เติมประโยคด้วยคำที่ถูกต้อง`,before:`She was walking home`,after:`it started to rain.`,answers:[`when`],explanation:`We use "when" to join a longer past continuous action with a shorter action that interrupted it.`,explanationThai:`เราใช้ "when" เพื่อเชื่อมเหตุการณ์อดีตต่อเนื่องที่ยาวกว่ากับเหตุการณ์สั้นๆ ที่มาขัดจังหวะ`,hint1:`This word means "at the time that."`,hint2:`It is not "while" or "then" — it is a three-letter word.`,example:`He was cooking dinner when the fire alarm rang.`,points:10,feedbackCorrect:`Correct — "when" joins the two events.`,feedbackIncorrect:`Which word means "at the time that"?`},{id:`l13-g-10`,type:`sequence`,skill:`dialogue`,topic:`Emergency Phone Calls`,difficulty:`medium`,presentation:`dialogue`,prompt:`Put the lines of this emergency phone call in the correct order.`,promptThai:`เรียงบทสนทนาโทรศัพท์แจ้งเหตุฉุกเฉินนี้ให้ถูกต้อง`,items:[{id:`d1`,label:`Emergency services, what's your emergency?`,speaker:`Operator`},{id:`d2`,label:`There's a fire at my neighbour's house!`,speaker:`Caller`},{id:`d3`,label:`What is the address?`,speaker:`Operator`},{id:`d4`,label:`15 Mill Road.`,speaker:`Caller`},{id:`d5`,label:`Help is on the way. Please stay outside and wait.`,speaker:`Operator`}],correctOrder:[`d1`,`d2`,`d3`,`d4`,`d5`],explanation:`The operator first asks about the emergency, the caller explains it, the operator asks for the address, the caller gives it, and finally the operator confirms help is coming.`,explanationThai:`เจ้าหน้าที่ถามเรื่องเหตุฉุกเฉินก่อน ผู้โทรอธิบาย เจ้าหน้าที่ถามที่อยู่ ผู้โทรบอกที่อยู่ และสุดท้ายเจ้าหน้าที่ยืนยันว่าจะส่งความช่วยเหลือ`,hint1:`The operator always speaks first to answer the call.`,hint2:`The address is asked for after the emergency is explained, not before.`,example:`Operator: "What is your emergency?" → Caller explains → Operator asks for address → Caller gives it.`,points:16,feedbackCorrect:`Great — that is the correct order of the call!`,feedbackIncorrect:`Think about what the operator needs to know first.`},{id:`l13-g-11`,type:`mcq`,skill:`flood-knowledge`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`Why did the road flood after the storm?`,promptThai:`ทำไมถนนถึงน้ำท่วมหลังพายุ?`,options:[`Because heavy rain fell and the river overflowed.`,`Because it was a sunny day.`,`Because the road was very wide.`,`Because no cars drove on it.`],correctIndex:0,explanation:`Heavy rain causes rivers to rise and overflow, which floods nearby roads.`,explanationThai:`ฝนที่ตกหนักทำให้ระดับน้ำในแม่น้ำสูงขึ้นและล้นตลิ่ง ซึ่งทำให้ถนนใกล้เคียงน้ำท่วม`,hint1:`Think about what happens to rivers after many days of rain.`,hint2:`Sunny weather and empty roads do not cause floods.`,example:`Blocked drains can also cause water to collect on roads.`,points:12,feedbackCorrect:`Correct — heavy rain and an overflowing river caused the flood.`,feedbackIncorrect:`Think about what kind of weather leads to a flood.`},{id:`l13-g-12`,type:`match`,skill:`vocabulary`,topic:`Equipment & Places`,difficulty:`medium`,prompt:`Match each word to its meaning.`,promptThai:`จับคู่คำศัพท์กับความหมาย`,left:[{id:`w1`,label:`fire extinguisher`,icon:`🧯`},{id:`w2`,label:`hospital`,icon:`🏥`},{id:`w3`,label:`emergency services`,icon:`🚨`},{id:`w4`,label:`flood`,icon:`🌊`}],right:[{id:`d1`,label:`equipment used to put out small fires`},{id:`d2`,label:`a place where doctors treat sick or hurt people`},{id:`d3`,label:`the police, fire, and ambulance teams together`},{id:`d4`,label:`too much water covering land that is usually dry`}],pairs:{w1:`d1`,w2:`d2`,w3:`d3`,w4:`d4`},explanation:`Each word matches its own meaning: a tool for small fires, a place for medical care, a team of helpers, and too much water.`,explanationThai:`แต่ละคำจับคู่กับความหมายของตนเอง`,hint1:`Which word describes a team, not a single person?`,hint2:`The word for "too much water" is the shortest one.`,example:`ambulance → a vehicle that takes sick or hurt people to hospital.`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A couple of pairs are wrong — read the meanings again.`}]},independent:{questions:[{id:`l13-i-01`,type:`mcq`,skill:`vocabulary`,topic:`Emergency Vehicles`,difficulty:`easy`,prompt:`Which vehicle carries medical equipment and takes people to hospital?`,promptThai:`ยานพาหนะใดที่บรรทุกอุปกรณ์การแพทย์และนำผู้คนไปโรงพยาบาล?`,options:[`ambulance`,`fire engine`,`police car`,`rescue boat`],correctIndex:0,explanation:`An ambulance carries medical equipment and takes sick or hurt people to hospital.`,explanationThai:`รถพยาบาลบรรทุกอุปกรณ์การแพทย์และนำผู้ป่วยหรือผู้บาดเจ็บไปโรงพยาบาล`,hint1:`A paramedic works inside this vehicle.`,hint2:`It is not the vehicle that fights fires or catches criminals.`,example:`A fire engine carries hoses and ladders.`,points:8,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about which vehicle a paramedic drives.`},{id:`l13-i-02`,type:`sort`,skill:`vocabulary`,topic:`Emergency Categories`,difficulty:`medium`,prompt:`Sort these words into the correct category.`,promptThai:`จัดหมวดหมู่คำเหล่านี้ให้ถูกต้อง`,categories:[{id:`emergency-events`,label:`Emergency Events`},{id:`emergency-workers`,label:`Emergency Workers`},{id:`emergency-vehicles`,label:`Emergency Vehicles`},{id:`emergency-equipment`,label:`Emergency Equipment`},{id:`emergency-places`,label:`Places & Services`}],items:[{id:`s1`,label:`accident`,categoryId:`emergency-events`},{id:`s2`,label:`rescue`,categoryId:`emergency-events`},{id:`s3`,label:`police officer`,categoryId:`emergency-workers`},{id:`s4`,label:`emergency operator`,categoryId:`emergency-workers`},{id:`s5`,label:`police car`,categoryId:`emergency-vehicles`},{id:`s6`,label:`fire engine`,categoryId:`emergency-vehicles`},{id:`s7`,label:`fire extinguisher`,categoryId:`emergency-equipment`},{id:`s8`,label:`hospital`,categoryId:`emergency-places`}],explanation:`Emergency words can describe events, the people who help, vehicles, equipment, or places.`,explanationThai:`คำศัพท์ฉุกเฉินแบ่งเป็นเหตุการณ์ บุคคล ยานพาหนะ อุปกรณ์ และสถานที่`,hint1:`Ask: is this something that happens, a person, a vehicle, a tool, or a building?`,hint2:`"Fire extinguisher" is the only equipment word here.`,example:`"flood" belongs in Emergency Events.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong category — check again.`},{id:`l13-i-03`,type:`match`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Match each flood word to its meaning.`,promptThai:`จับคู่คำศัพท์เกี่ยวกับน้ำท่วมกับความหมาย`,left:[{id:`f1`,label:`evacuate`},{id:`f2`,label:`flood warning`},{id:`f3`,label:`sandbags`},{id:`f4`,label:`overflow`}],right:[{id:`m1`,label:`to leave a dangerous place and go somewhere safe`},{id:`m2`,label:`a message that tells people a flood may happen soon`},{id:`m3`,label:`bags filled with sand used to stop flood water`},{id:`m4`,label:`when water rises over the edge of a river or drain`}],pairs:{f1:`m1`,f2:`m2`,f3:`m3`,f4:`m4`},explanation:`Each flood word has its own meaning: evacuate = leave, flood warning = a message, sandbags = a tool to block water, overflow = water rising over the edge.`,explanationThai:`คำศัพท์เกี่ยวกับน้ำท่วมแต่ละคำมีความหมายของตนเอง`,hint1:`Which word means people receive a message BEFORE the flood happens?`,hint2:`Which word describes something people DO, not something that happens?`,example:`flood → too much water covering land that is usually dry.`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A couple of pairs are wrong — read the meanings again.`},{id:`l13-i-04`,type:`fill-blank`,skill:`grammar`,topic:`Was / Were`,difficulty:`medium`,prompt:`Complete the sentence with was or were.`,promptThai:`เติมประโยคด้วย was หรือ were`,before:`They`,after:`sleeping when the flood started.`,answers:[`were`],explanation:`We use "were" with the plural subject "they".`,explanationThai:`เราใช้ "were" กับประธานพหูพจน์ "they"`,hint1:`The subject "they" means more than one person.`,hint2:`Use "was" only with I/he/she/it, not "they".`,example:`She was reading a book when the phone rang.`,points:8,feedbackCorrect:`Correct — "they were" is right.`,feedbackIncorrect:`Which word goes with "they" — was or were?`},{id:`l13-i-05`,type:`mcq`,skill:`grammar`,topic:`Wasn't / Weren't`,difficulty:`medium`,prompt:`Choose the correct word.`,promptThai:`เลือกคำที่ถูกต้อง`,options:[`The dog ___ barking when we arrived. (wasn't)`,`weren't`,`isn't`,`aren't`],correctIndex:0,explanation:`A single dog is singular, so it needs "wasn't", not "weren't".`,explanationThai:`สุนัขตัวเดียวเป็นเอกพจน์ จึงต้องใช้ "wasn't" ไม่ใช่ "weren't"`,hint1:`Count how many dogs there are — just one.`,hint2:`Singular subjects use "wasn't" in the past.`,example:`"The dogs weren't barking." → because "dogs" is plural.`,points:10,feedbackCorrect:`Correct — "wasn't" fits a singular subject.`,feedbackIncorrect:`Look at the subject — is it one dog or many?`},{id:`l13-i-06`,type:`error-correction`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`challenge`,prompt:`This sentence has one wrong word. Find it and fix it.`,promptThai:`ประโยคนี้มีคำผิดหนึ่งคำ หาคำผิดแล้วแก้ไข`,sentence:`The firefighter was runing to the house.`,wrongWord:`runing`,correctWord:`running`,explanation:`"Run" ends in a single vowel + consonant, so we double the "n" before adding -ing: running.`,explanationThai:`"run" ลงท้ายด้วยสระตัวเดียว + พยัญชนะ จึงต้องเพิ่ม "n" ซ้ำก่อนเติม -ing: running`,hint1:`Count the letters at the end of "run".`,hint2:`One letter must be doubled before -ing.`,example:`"swim" → "swimming" (double the m).`,points:12,feedbackCorrect:`Correct — "running" doubles the n.`,feedbackIncorrect:`Remember the doubling rule for short verbs like "run".`},{id:`l13-i-07`,type:`word-order`,skill:`grammar`,topic:`Past Continuous Statements`,difficulty:`challenge`,prompt:`Put the words in the correct order to make a past continuous negative sentence.`,promptThai:`เรียงคำให้ถูกต้องเพื่อสร้างประโยคปฏิเสธอดีตต่อเนื่อง`,words:[`The`,`children`,`were`,`not`,`sleeping`,`when`,`the`,`alarm`,`rang.`],correctOrder:[`The`,`children`,`were`,`not`,`sleeping`,`when`,`the`,`alarm`,`rang.`],explanation:`Negative past continuous sentences follow: subject + were/was + not + verb-ing + when + simple past clause.`,explanationThai:`ประโยคปฏิเสธอดีตต่อเนื่องเรียงลำดับ: ประธาน + were/was + not + กริยาเติม -ing + when + อนุประโยคอดีตธรรมดา`,hint1:`"not" comes right after "were".`,hint2:`The "when" clause uses the simple past verb "rang", not "ringing".`,example:`He was not watching TV when the phone rang.`,points:16,feedbackCorrect:`Correct order — well done!`,feedbackIncorrect:`Check where "were" and "not" belong.`},{id:`l13-i-08`,type:`mcq`,skill:`grammar`,topic:`Past Continuous Questions`,difficulty:`medium`,prompt:`Which question is correct?`,promptThai:`ข้อใดเป็นคำถามที่ถูกต้อง?`,options:[`Were they watching TV when the storm started?`,`Were they watch TV when the storm started?`,`Did they were watching TV when the storm started?`,`They were watching TV when the storm started?`],correctIndex:0,explanation:`Past continuous questions use were/was + subject + verb-ing. "Were they watching...?" is correct.`,explanationThai:`คำถามอดีตต่อเนื่องใช้ were/was + ประธาน + กริยาเติม -ing: "Were they watching...?" ถูกต้อง`,hint1:`The verb after the subject must end in -ing.`,hint2:`We never use "did" together with "was/were" in the same question.`,example:`Was he running when the alarm rang?`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look carefully at the verb form after "they".`},{id:`l13-i-09`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous Short Answers`,difficulty:`medium`,prompt:`Answer the question with a correct short answer: "Was the paramedic helping the boy?" — "No, he ___."`,promptThai:`ตอบคำถามด้วยคำตอบสั้นที่ถูกต้อง: "Was the paramedic helping the boy?" — "No, he ___."`,before:`No, he`,after:`.`,answers:[`wasn't`],explanation:`The negative short answer for "he" in the past continuous is "wasn't".`,explanationThai:`คำตอบสั้นเชิงปฏิเสธสำหรับ "he" ในอดีตต่อเนื่องคือ "wasn't"`,hint1:`This is a contraction of "was not".`,hint2:`"He" always pairs with "was" or "wasn't", not "were".`,example:`"Were they sleeping?" — "No, they weren't."`,points:10,feedbackCorrect:`Correct — "wasn't" is the right short answer.`,feedbackIncorrect:`Which contraction means "was not"?`},{id:`l13-i-10`,type:`mcq`,skill:`grammar`,topic:`Past Continuous with When`,difficulty:`challenge`,prompt:`Which sentence correctly uses past continuous with 'when'?`,promptThai:`ประโยคใดใช้อดีตต่อเนื่องกับ 'when' ได้อย่างถูกต้อง?`,options:[`She was walking home when it starts to rain.`,`She was walking home when it started to rain.`,`She walking home when it started to rain.`,`She were walking home when it started to rain.`],correctIndex:1,explanation:`The longer action ("walking home") uses past continuous, and the shorter action that interrupted it ("started to rain") uses simple past.`,explanationThai:`เหตุการณ์ที่ยาวกว่า ("walking home") ใช้อดีตต่อเนื่อง และเหตุการณ์สั้นๆ ที่มาขัดจังหวะ ("started to rain") ใช้อดีตธรรมดา`,hint1:`The "when" clause should use the simple past tense, not present or continuous.`,hint2:`"She" is singular, so it needs "was", not "were".`,example:`He was cooking dinner when the fire alarm rang.`,points:14,feedbackCorrect:`Correct — that sentence uses the right tenses.`,feedbackIncorrect:`Check both the verb after "when" and the word before "walking".`},{id:`l13-i-11`,type:`true-false`,skill:`dialogue`,topic:`Emergency Phone Calls`,difficulty:`medium`,prompt:`Is this statement true or false: 'In an emergency call, the operator usually asks for the address after the caller explains the problem.'`,promptThai:`ข้อความนี้จริงหรือเท็จ: 'ในสายโทรศัพท์แจ้งเหตุฉุกเฉิน เจ้าหน้าที่มักถามที่อยู่หลังจากผู้โทรอธิบายปัญหาแล้ว'`,statement:`In an emergency call, the operator usually asks for the address after the caller explains the problem.`,correctAnswer:!0,explanation:`A typical emergency call starts with the operator asking about the emergency, then asking for the address once the problem is known.`,explanationThai:`สายโทรศัพท์แจ้งเหตุฉุกเฉินโดยทั่วไปจะเริ่มด้วยเจ้าหน้าที่ถามเรื่องเหตุฉุกเฉินก่อน แล้วจึงถามที่อยู่หลังจากทราบปัญหาแล้ว`,hint1:`Think about which question the operator needs answered first.`,hint2:`The operator cannot send help to an address without knowing the emergency too.`,example:`Operator: "What's your emergency?" → Caller explains → Operator: "What is the address?"`,points:10,feedbackCorrect:`Correct — that is the usual order of an emergency call.`,feedbackIncorrect:`Think about which question usually comes first in the call.`},{id:`l13-i-12`,type:`sequence`,skill:`dialogue`,topic:`Emergency Phone Calls`,difficulty:`medium`,presentation:`dialogue`,prompt:`Put the lines of this emergency phone call in the correct order.`,promptThai:`เรียงบทสนทนาโทรศัพท์แจ้งเหตุฉุกเฉินนี้ให้ถูกต้อง`,items:[{id:`d1`,label:`Emergency services, what's your emergency?`,speaker:`Operator`},{id:`d2`,label:`The flood water is rising near our house!`,speaker:`Caller`},{id:`d3`,label:`Is everyone safe right now?`,speaker:`Operator`},{id:`d4`,label:`Yes, but the water is very high.`,speaker:`Caller`}],correctOrder:[`d1`,`d2`,`d3`,`d4`],explanation:`The operator answers first, the caller explains the emergency, the operator checks everyone is safe, and the caller replies.`,explanationThai:`เจ้าหน้าที่รับสายก่อน ผู้โทรอธิบายเหตุฉุกเฉิน เจ้าหน้าที่ถามว่าปลอดภัยหรือไม่ และผู้โทรตอบ`,hint1:`The operator always speaks first when answering a call.`,hint2:`Checking if people are safe comes after hearing what the emergency is.`,example:`Operator: "What's your emergency?" → Caller: "There's a fire!" → Operator: "Is anyone hurt?"`,points:16,feedbackCorrect:`Great — that is the correct order of the call!`,feedbackIncorrect:`Think about what the operator needs to know first.`},{id:`l13-i-13`,type:`mcq`,skill:`flood-knowledge`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`What can happen after many days of heavy rain?`,promptThai:`อะไรอาจเกิดขึ้นหลังฝนตกหนักติดต่อกันหลายวัน?`,options:[`A river can overflow and flood the streets.`,`The sky becomes clear and sunny.`,`Plants stop needing water.`,`Rivers dry up completely.`],correctIndex:0,explanation:`Many days of heavy rain can make a river rise so high that it overflows and floods nearby streets.`,explanationThai:`ฝนตกหนักติดต่อกันหลายวันอาจทำให้ระดับน้ำในแม่น้ำสูงขึ้นจนล้นตลิ่งและท่วมถนนใกล้เคียง`,hint1:`Think about what happens to water levels in rivers during heavy rain.`,hint2:`Rivers do not dry up because of rain.`,example:`Blocked drains can also cause water to collect on roads.`,points:12,feedbackCorrect:`Correct — heavy rain can cause a river to overflow.`,feedbackIncorrect:`Think about what heavy rain does to a river, not the sky.`},{id:`l13-i-14`,type:`true-false`,skill:`flood-knowledge`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`Is this statement true or false: 'Blocked drains can help stop flooding.'`,promptThai:`ข้อความนี้จริงหรือเท็จ: 'ท่อระบายน้ำที่อุดตันสามารถช่วยป้องกันน้ำท่วมได้'`,statement:`Blocked drains can help stop flooding.`,correctAnswer:!1,explanation:`Blocked drains stop rainwater from draining away, which makes flooding WORSE, not better.`,explanationThai:`ท่อระบายน้ำที่อุดตันทำให้น้ำฝนไม่สามารถระบายออกได้ ซึ่งทำให้น้ำท่วมแย่ลง ไม่ใช่ดีขึ้น`,hint1:`Think about what a drain is supposed to do with water.`,hint2:`A blocked pipe cannot let water pass through it.`,example:`Sandbags, not blocked drains, are used to help stop flood water.`,points:10,feedbackCorrect:`Correct — blocked drains make flooding worse.`,feedbackIncorrect:`Think about what a drain normally does, and what happens when it is blocked.`},{id:`l13-i-15`,type:`mcq`,skill:`vocabulary`,topic:`Emergency Places`,difficulty:`medium`,prompt:`Which word means 'the police, fire, and ambulance teams together'?`,promptThai:`คำใดหมายถึง 'ตำรวจ ดับเพลิง และรถพยาบาลรวมกัน'?`,options:[`emergency services`,`hospital`,`fire station`,`emergency operator`],correctIndex:0,explanation:`"Emergency services" refers to the police, fire, and ambulance teams together.`,explanationThai:`"emergency services" หมายถึงตำรวจ ดับเพลิง และรถพยาบาลรวมกัน`,hint1:`This phrase is two words, not one.`,hint2:`It is not a single building or a single person.`,example:`Emergency services arrived in five minutes.`,points:8,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about the phrase that means all three teams together.`},{id:`l13-i-16`,type:`sort`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`challenge`,prompt:`Sort these verbs by their -ing spelling rule.`,promptThai:`จัดหมวดหมู่กริยาเหล่านี้ตามกฎการสะกดรูป -ing`,categories:[{id:`add-ing`,label:`Just add -ing`},{id:`drop-e`,label:`Drop the e, add -ing`},{id:`double`,label:`Double the consonant, add -ing`}],items:[{id:`v1`,label:`help`,categoryId:`add-ing`},{id:`v2`,label:`watch`,categoryId:`add-ing`},{id:`v3`,label:`call`,categoryId:`add-ing`},{id:`v4`,label:`make`,categoryId:`drop-e`},{id:`v5`,label:`rescue`,categoryId:`drop-e`},{id:`v6`,label:`run`,categoryId:`double`},{id:`v7`,label:`swim`,categoryId:`double`},{id:`v8`,label:`stop`,categoryId:`double`}],explanation:`Most verbs just add -ing (help → helping). Verbs ending in a silent e drop the e (make → making). Short verbs ending in one vowel + one consonant double the consonant (run → running).`,explanationThai:`กริยาส่วนใหญ่เติม -ing ได้เลย (help → helping) กริยาที่ลงท้ายด้วย e ที่ไม่ออกเสียงให้ตัด e ออก (make → making) กริยาสั้นที่ลงท้ายด้วยสระตัวเดียว + พยัญชนะตัวเดียวให้เพิ่มพยัญชนะซ้ำ (run → running)`,hint1:`Look at the last letter of each verb — is it a silent e?`,hint2:`Short verbs like "run", "swim", and "stop" all double their last letter.`,example:`"watch" → "watching" (just add -ing).`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few verbs are in the wrong rule group — check the spellings again.`},{id:`l13-i-17`,type:`word-order`,skill:`grammar`,topic:`Past Continuous Questions`,difficulty:`challenge`,prompt:`Put the words in the correct order to make a past continuous question.`,promptThai:`เรียงคำให้ถูกต้องเพื่อสร้างคำถามอดีตต่อเนื่อง`,words:[`Were`,`the`,`firefighters`,`climbing`,`the`,`ladder?`],correctOrder:[`Were`,`the`,`firefighters`,`climbing`,`the`,`ladder?`],explanation:`Past continuous questions begin with was/were, followed by the subject and the -ing verb.`,explanationThai:`คำถามอดีตต่อเนื่องขึ้นต้นด้วย was/were ตามด้วยประธานและกริยาเติม -ing`,hint1:`"Were" must come first, before the subject.`,hint2:`The subject "the firefighters" comes right after "Were".`,example:`Was he running when the alarm rang?`,points:14,feedbackCorrect:`Correct order — well done!`,feedbackIncorrect:`Check that "Were" is at the very start.`},{id:`l13-i-18`,type:`error-correction`,skill:`grammar`,topic:`Was / Were`,difficulty:`medium`,prompt:`This sentence has one wrong word. Find it and fix it.`,promptThai:`ประโยคนี้มีคำผิดหนึ่งคำ หาคำผิดแล้วแก้ไข`,sentence:`We was watching the news when the phone rang.`,wrongWord:`was`,correctWord:`were`,explanation:`"We" is plural, so it needs "were", not "was".`,explanationThai:`"we" เป็นพหูพจน์ จึงต้องใช้ "were" ไม่ใช่ "was"`,hint1:`Count how many people "we" includes — more than one.`,hint2:`Plural subjects use "were" in the past.`,example:`"I was watching the news." → correct as is, because "I" is singular.`,points:12,feedbackCorrect:`Correct — "were" fits the plural subject "we".`,feedbackIncorrect:`Look at the subject — is it one person or more than one?`},{id:`l13-i-19`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Equipment`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,promptThai:`เติมประโยคด้วยคำที่ถูกต้อง`,before:`She grabbed the`,after:`to put out the small fire in the kitchen.`,answers:[`fire extinguisher`],explanation:`A fire extinguisher is equipment used to put out small fires, like a fire in the kitchen.`,explanationThai:`ถังดับเพลิงเป็นอุปกรณ์ที่ใช้ดับไฟขนาดเล็ก เช่น ไฟไหม้ในครัว`,hint1:`This equipment is red and you carry it in two hands.`,hint2:`It is not a vehicle — it is a tool.`,example:`He called the emergency operator for help.`,points:10,feedbackCorrect:`Correct — "fire extinguisher" fits perfectly.`,feedbackIncorrect:`What tool is used to stop a small fire?`},{id:`l13-i-20`,type:`mcq`,skill:`grammar`,topic:`Past Continuous with When`,difficulty:`challenge`,prompt:`Choose the sentence with the correct tenses.`,promptThai:`เลือกประโยคที่ใช้กาลถูกต้อง`,options:[`The family was sleeping when the flood water came into the house.`,`The family was sleeping when the flood water was coming into the house.`,`The family sleeps when the flood water came into the house.`,`The family was sleep when the flood water came into the house.`],correctIndex:0,explanation:`The longer action ("sleeping") uses past continuous, and the shorter, sudden action that interrupted it ("came") uses simple past.`,explanationThai:`เหตุการณ์ที่ยาวกว่า ("sleeping") ใช้อดีตต่อเนื่อง และเหตุการณ์สั้นๆ ที่เกิดขึ้นกะทันหันและมาขัดจังหวะ ("came") ใช้อดีตธรรมดา`,hint1:`The event that interrupts is usually a short, sudden action in the simple past.`,hint2:`After "was", we need the -ing form, like "sleeping", not "sleep".`,example:`She was walking home when it started to rain.`,points:14,feedbackCorrect:`Correct — that sentence uses the right tenses.`,feedbackIncorrect:`Check the verb form after "when" — should it be continuous or simple past?`},{id:`l13-i-21`,type:`sort`,skill:`flood-knowledge`,topic:`Cause and Effect`,difficulty:`challenge`,prompt:`Sort each sentence as a cause of a flood or an effect of a flood.`,promptThai:`จัดหมวดหมู่แต่ละประโยคว่าเป็นสาเหตุหรือผลของน้ำท่วม`,categories:[{id:`cause`,label:`Cause`},{id:`effect`,label:`Effect`}],items:[{id:`c1`,label:`Heavy rain fell for three days.`,categoryId:`cause`},{id:`c2`,label:`The drains were blocked with rubbish.`,categoryId:`cause`},{id:`c3`,label:`A dam broke near the village.`,categoryId:`cause`},{id:`e1`,label:`The road was covered with water.`,categoryId:`effect`},{id:`e2`,label:`Many houses were flooded.`,categoryId:`effect`},{id:`e3`,label:`People had to leave their homes.`,categoryId:`effect`}],explanation:`A cause is the reason a flood happens, like heavy rain or blocked drains. An effect is what happens because of the flood, like covered roads or people leaving their homes.`,explanationThai:`สาเหตุคือเหตุผลที่ทำให้เกิดน้ำท่วม เช่น ฝนตกหนักหรือท่อระบายน้ำอุดตัน ส่วนผลคือสิ่งที่เกิดขึ้นเพราะน้ำท่วม เช่น ถนนถูกน้ำท่วมหรือผู้คนต้องออกจากบ้าน`,hint1:`Ask: did this happen BEFORE the flood, or BECAUSE of the flood?`,hint2:`Rain and blocked drains happen first; flooded roads and homes happen after.`,example:`"A river overflowed" is a cause; "the street was under water" is an effect.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few sentences are in the wrong group — think about the order events happen in.`}]},miniQuiz:{questions:[{id:`l13-mq-01`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Which word means 'a message that tells people a flood may happen soon'?`,promptThai:`คำใดหมายถึง 'ข้อความที่แจ้งเตือนผู้คนว่าน้ำท่วมอาจเกิดขึ้นเร็วๆ นี้'?`,options:[`flood warning`,`flood water`,`rescue boat`,`sandbags`],correctIndex:0,explanation:`A "flood warning" is a message that tells people a flood may happen soon, so they can prepare.`,explanationThai:`"flood warning" คือข้อความที่แจ้งเตือนผู้คนว่าน้ำท่วมอาจเกิดขึ้นเร็วๆ นี้ เพื่อให้พวกเขาเตรียมตัว`,hint1:`This is sent to people BEFORE the flood arrives.`,hint2:`The other options are things, not messages.`,example:`Sandbags are used to help stop flood water.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Which option is a message, not a thing?`},{id:`l13-mq-02`,type:`true-false`,skill:`grammar`,topic:`Was / Were`,difficulty:`medium`,prompt:`Is this statement true or false: 'We use "were" with the subject "he".'`,promptThai:`ข้อความนี้จริงหรือเท็จ: 'เราใช้ "were" กับประธาน "he"'`,statement:`We use "were" with the subject "he".`,correctAnswer:!1,explanation:`We use "was" with "he" (and I/she/it), not "were". "Were" goes with you/we/they.`,explanationThai:`เราใช้ "was" กับ "he" (และ I/she/it) ไม่ใช่ "were" ส่วน "were" ใช้กับ you/we/they`,hint1:`Is "he" one person or more than one?`,hint2:`Singular subjects like "he" use "was".`,example:`Statement: "We use 'was' with 'it'." → True.`,points:10,feedbackCorrect:`Correct — "he" uses "was", not "were".`,feedbackIncorrect:`Think about whether "he" is singular or plural.`},{id:`l13-mq-03`,type:`fill-blank`,skill:`grammar`,topic:`Wasn't / Weren't`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,promptThai:`เติมประโยคด้วยคำที่ถูกต้อง`,before:`The children`,after:`listening, so the teacher repeated the instructions.`,answers:[`weren't`],explanation:`"Children" is plural, so it needs "weren't".`,explanationThai:`"children" เป็นพหูพจน์ จึงต้องใช้ "weren't"`,hint1:`Count how many children there are.`,hint2:`Plural subjects use "weren't" in the negative past.`,example:`He wasn't listening to the announcement.`,points:10,feedbackCorrect:`Correct — "weren't" fits a plural subject.`,feedbackIncorrect:`Look at the subject — is it one child or many?`},{id:`l13-mq-04`,type:`mcq`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`What is the correct -ing form of 'swim'?`,promptThai:`รูป -ing ที่ถูกต้องของคำว่า 'swim' คืออะไร?`,options:[`swiming`,`swimming`,`swimeing`,`swimmeing`],correctIndex:1,explanation:`"Swim" ends in a single vowel + consonant, so we double the final consonant: swimming.`,explanationThai:`"swim" ลงท้ายด้วยสระตัวเดียว + พยัญชนะ จึงต้องเพิ่มพยัญชนะตัวสุดท้ายซ้ำ: swimming`,hint1:`Look at the last two letters of "swim".`,hint2:`One letter must be doubled before -ing.`,example:`"stop" → "stopping" (double the p).`,points:10,feedbackCorrect:`Correct — "swimming" doubles the m.`,feedbackIncorrect:`Remember the doubling rule for short verbs like "swim".`},{id:`l13-mq-05`,type:`word-order`,skill:`grammar`,topic:`Past Continuous Statements`,difficulty:`medium`,prompt:`Put the words in the correct order to make a past continuous sentence.`,promptThai:`เรียงคำให้ถูกต้องเพื่อสร้างประโยคอดีตต่อเนื่อง`,words:[`The`,`police`,`officer`,`was`,`directing`,`traffic`,`after`,`the`,`accident.`],correctOrder:[`The`,`police`,`officer`,`was`,`directing`,`traffic`,`after`,`the`,`accident.`],explanation:`Past continuous statements follow: subject + was/were + verb-ing + the rest of the sentence.`,explanationThai:`ประโยคอดีตต่อเนื่องเรียงลำดับ: ประธาน + was/were + กริยาเติม -ing + ส่วนที่เหลือของประโยค`,hint1:`The subject "The police officer" comes first.`,hint2:`"was" comes right after the subject.`,example:`The paramedic was checking the boy's arm.`,points:14,feedbackCorrect:`Correct order — well done!`,feedbackIncorrect:`Check where "was" and the -ing verb belong.`},{id:`l13-mq-06`,type:`mcq`,skill:`grammar`,topic:`Past Continuous Questions`,difficulty:`medium`,prompt:`Which is the correct question form?`,promptThai:`ข้อใดเป็นรูปคำถามที่ถูกต้อง?`,options:[`Was the ambulance arriving quickly?`,`The ambulance was arriving quickly?`,`Did the ambulance was arriving quickly?`,`Was the ambulance arrive quickly?`],correctIndex:0,explanation:`Past continuous questions use was/were before the subject, followed by the -ing verb.`,explanationThai:`คำถามอดีตต่อเนื่องใช้ was/were ก่อนประธาน ตามด้วยกริยาเติม -ing`,hint1:`A question needs was/were at the very start.`,hint2:`The verb must end in -ing, not the base form.`,example:`Were they watching TV when the storm started?`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look at the word order and the verb ending.`},{id:`l13-mq-07`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous Short Answers`,difficulty:`medium`,prompt:`Answer the question with a correct short answer: "Were the firefighters climbing the ladder?" — "Yes, they ___."`,promptThai:`ตอบคำถามด้วยคำตอบสั้นที่ถูกต้อง: "Were the firefighters climbing the ladder?" — "Yes, they ___."`,before:`Yes, they`,after:`.`,answers:[`were`],explanation:`The positive short answer for "they" in the past continuous is "were".`,explanationThai:`คำตอบสั้นเชิงบวกสำหรับ "they" ในอดีตต่อเนื่องคือ "were"`,hint1:`"They" always pairs with "were", not "was".`,hint2:`This is the same word used in the question.`,example:`"Was he sleeping?" — "Yes, he was."`,points:10,feedbackCorrect:`Correct — "were" is the right short answer.`,feedbackIncorrect:`Which word pairs with "they" in short answers?`},{id:`l13-mq-08`,type:`mcq`,skill:`grammar`,topic:`Past Continuous with When`,difficulty:`challenge`,prompt:`Choose the correct sentence.`,promptThai:`เลือกประโยคที่ถูกต้อง`,options:[`He was cooking dinner when the fire alarm rang.`,`He was cooking dinner when the fire alarm rings.`,`He cooking dinner when the fire alarm rang.`,`He were cooking dinner when the fire alarm rang.`],correctIndex:0,explanation:`The longer action ("cooking") uses past continuous with "was", and the shorter action ("rang") uses simple past.`,explanationThai:`เหตุการณ์ที่ยาวกว่า ("cooking") ใช้อดีตต่อเนื่องกับ "was" และเหตุการณ์สั้นๆ ("rang") ใช้อดีตธรรมดา`,hint1:`The "when" clause needs the simple past, not the present.`,hint2:`"He" is singular, so it needs "was", not "were".`,example:`She was walking home when it started to rain.`,points:14,feedbackCorrect:`Correct — that sentence uses the right tenses.`,feedbackIncorrect:`Check both verbs — one should be past continuous, one simple past.`},{id:`l13-mq-09`,type:`sequence`,skill:`dialogue`,topic:`Emergency Phone Calls`,difficulty:`medium`,presentation:`dialogue`,prompt:`Put the lines of this emergency phone call in the correct order.`,promptThai:`เรียงบทสนทนาโทรศัพท์แจ้งเหตุฉุกเฉินนี้ให้ถูกต้อง`,items:[{id:`d1`,label:`Emergency services, what's your emergency?`,speaker:`Operator`},{id:`d2`,label:`There's been a car accident on Green Street.`,speaker:`Caller`},{id:`d3`,label:`Is anyone hurt?`,speaker:`Operator`},{id:`d4`,label:`Yes, one person can't get out of the car.`,speaker:`Caller`}],correctOrder:[`d1`,`d2`,`d3`,`d4`],explanation:`The operator answers first, the caller explains the emergency, the operator asks if anyone is hurt, and the caller replies.`,explanationThai:`เจ้าหน้าที่รับสายก่อน ผู้โทรอธิบายเหตุฉุกเฉิน เจ้าหน้าที่ถามว่ามีใครบาดเจ็บหรือไม่ และผู้โทรตอบ`,hint1:`The operator always speaks first.`,hint2:`Asking about injuries comes after hearing what happened.`,example:`Operator: "What's your emergency?" → Caller: "There's a fire!"`,points:16,feedbackCorrect:`Great — that is the correct order of the call!`,feedbackIncorrect:`Think about what the operator asks first.`},{id:`l13-mq-10`,type:`mcq`,skill:`flood-knowledge`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`What is one effect of a flood?`,promptThai:`ผลกระทบอย่างหนึ่งของน้ำท่วมคืออะไร?`,options:[`Roads and homes can be covered with water.`,`The weather becomes very dry.`,`Rivers disappear completely.`,`Plants grow faster with less water.`],correctIndex:0,explanation:`A flood covers land that is usually dry with water, so roads and homes can become covered with water.`,explanationThai:`น้ำท่วมทำให้พื้นที่ที่ปกติแห้งถูกปกคลุมด้วยน้ำ ดังนั้นถนนและบ้านเรือนอาจถูกน้ำท่วม`,hint1:`Think about what water does when it rises too high.`,hint2:`The other options describe dry weather, which is the opposite of a flood.`,example:`People may need to evacuate when a flood covers their street.`,points:12,feedbackCorrect:`Correct — floods cover roads and homes with water.`,feedbackIncorrect:`Think about what happens to the ground during a flood, not dry weather.`}]},summary:{keyTakeaways:[`This lesson mixed vocabulary, grammar, dialogue, and flood-knowledge questions from Lessons 1-12.`,`Your results are tracked by skill category — vocabulary, grammar, dialogue, and flood-knowledge — so you can see exactly which area needs more practice.`,`If most of your mistakes were in one category, go back to the matching lessons and try their mini-quizzes again.`,`Past continuous (was/were + verb-ing) is used for an action that was happening when something else occurred.`],keyTakeawaysThai:[`บทเรียนนี้ผสมคำถามด้านคำศัพท์ ไวยากรณ์ บทสนทนา และความรู้เรื่องน้ำท่วมจากบทที่ 1-12`,`ผลคะแนนของคุณถูกบันทึกแยกตามหมวดหมู่ทักษะ เพื่อให้คุณรู้ว่าควรทบทวนด้านใดเพิ่มเติม`,`หากทำผิดส่วนใหญ่ในหมวดหมู่ใดหมวดหมู่หนึ่ง ให้กลับไปทบทวนบทเรียนที่เกี่ยวข้องและลองทำแบบทดสอบย่อยอีกครั้ง`]}}},Wi={id:`l14-reading-writing-review`,number:14,title:`Reading and Writing Review`,subtitle:`Read original emergency and flood texts, then practise writing about them.`,skillCategory:`reading`,estimatedMinutes:28,stages:{warmup:{promptEn:`Think of one time you read or heard a weather warning — on TV, on the radio, or from a family member. What did it say?`,promptThai:`ลองนึกถึงครั้งหนึ่งที่คุณอ่านหรือได้ยินคำเตือนเรื่องสภาพอากาศ ไม่ว่าจะทางทีวี วิทยุ หรือจากคนในครอบครัว คำเตือนนั้นบอกว่าอะไร?`,hook:`Today you will read two short original texts and one dialogue about emergencies, then practise writing your own emergency sentences.`},learn:{intro:`This lesson combines reading and writing practice. First, read "The Somsri Family" — a short story about a flood rescue: "Last Saturday, heavy rain fell all morning near Mill Road. By noon, water covered the street outside the Somsri family's house. Mrs Somsri and her two children climbed onto the roof and waved for help. A rescue team arrived in a small boat and carefully helped the family climb down. Everyone was safe, but their kitchen was full of muddy water." Then read this flood information text: "A flood happens when a river or the sea rises and covers land that is usually dry. Heavy rain is one common cause, especially when it falls for many days without stopping. Blocked drains can also make flooding worse, because dirty water cannot flow away. When a flood happens, roads can close and people sometimes have to leave their homes until the water goes down." After reading, you will answer questions about both texts and a short emergency dialogue, and then write your own short passages using the writing tasks at the end of this lesson.`,introThai:`บทเรียนนี้รวมการฝึกอ่านและเขียนเข้าด้วยกัน อ่านเรื่องราวสั้นๆ เกี่ยวกับการช่วยเหลือจากน้ำท่วมและข้อความความรู้เรื่องน้ำท่วม จากนั้นตอบคำถามเกี่ยวกับทั้งสองข้อความและบทสนทนาฉุกเฉินสั้นๆ แล้วฝึกเขียนย่อหน้าสั้นๆ ของคุณเองในงานเขียนท้ายบทเรียนนี้`,points:[{title:`Reading for detail`,body:`Look for key facts — who, what, where, and when — when you read an emergency story or information text.`,bodyThai:`มองหาข้อเท็จจริงสำคัญ เช่น ใคร ทำอะไร ที่ไหน และเมื่อไหร่ เมื่ออ่านเรื่องราวหรือข้อความความรู้เกี่ยวกับเหตุฉุกเฉิน`},{title:`Writing clearly`,body:`Use time words like First, Next, Then, and Finally to put your sentences in a clear, logical order.`,bodyThai:`ใช้คำบอกลำดับเวลา เช่น First, Next, Then และ Finally เพื่อเรียงประโยคของคุณให้ชัดเจนและเป็นเหตุเป็นผล`}]},examples:{items:[{text:`Mrs Somsri and her two children climbed onto the roof and waved for help.`,noteThai:`นางสมศรีและลูกสองคนปีนขึ้นไปบนหลังคาและโบกมือขอความช่วยเหลือ`},{text:`A flood happens when a river or the sea rises and covers land that is usually dry.`,noteThai:`น้ำท่วมเกิดขึ้นเมื่อแม่น้ำหรือทะเลสูงขึ้นและปกคลุมพื้นที่ที่ปกติแห้ง`},{text:`"Is anyone in danger right now?" is a question an emergency operator often asks.`,noteThai:`"Is anyone in danger right now?" เป็นคำถามที่เจ้าหน้าที่รับแจ้งเหตุฉุกเฉินมักถาม`},{text:`First, the car stopped. Next, smoke appeared. Then, the firefighters arrived.`,noteThai:`ก่อนอื่นรถหยุด จากนั้นมีควันปรากฏขึ้น แล้วนักดับเพลิงก็มาถึง`}]},guided:{questions:[{id:`l14-g-01`,type:`mcq`,skill:`reading`,topic:`The Rescue Story`,difficulty:`easy`,prompt:`Read the story about the Somsri family. Where did the family wait for help?`,promptThai:`อ่านเรื่องราวของครอบครัวสมศรี ครอบครัวรอความช่วยเหลืออยู่ที่ไหน?`,options:[`On the roof`,`In the kitchen`,`On a bicycle`,`At school`],correctIndex:0,explanation:`The story says Mrs Somsri and her two children climbed onto the roof and waved for help.`,explanationThai:`เรื่องราวบอกว่านางสมศรีและลูกสองคนปีนขึ้นไปบนหลังคาและโบกมือขอความช่วยเหลือ`,hint1:`Think about the highest, driest place in a flooded house.`,hint2:`The kitchen was full of muddy water, so they could not stay there.`,example:`In the story, the rescue team arrived in a small boat.`,points:10,feedbackCorrect:`Correct — they waited on the roof.`,feedbackIncorrect:`Read the second sentence about the family again.`},{id:`l14-g-02`,type:`true-false`,skill:`reading`,topic:`The Rescue Story`,difficulty:`easy`,prompt:`Read the story about the Somsri family. Is this statement true or false: 'The rescue team arrived in a car.'`,promptThai:`อ่านเรื่องราวของครอบครัวสมศรี ข้อความนี้จริงหรือเท็จ: 'ทีมกู้ภัยมาถึงด้วยรถยนต์'`,statement:`The rescue team arrived in a car.`,correctAnswer:!1,explanation:`The story says the rescue team arrived in a small boat, not a car — a car cannot drive through flood water.`,explanationThai:`เรื่องราวบอกว่าทีมกู้ภัยมาถึงด้วยเรือลำเล็ก ไม่ใช่รถยนต์ เพราะรถไม่สามารถขับผ่านน้ำท่วมได้`,hint1:`Think about what kind of vehicle can move through deep water.`,hint2:`Cars cannot float on flood water.`,example:`Statement: "The family was safe." → True, because the story says everyone was safe.`,points:10,feedbackCorrect:`Correct — they used a boat, not a car.`,feedbackIncorrect:`Read the story again — what vehicle does it mention?`},{id:`l14-g-03`,type:`mcq`,skill:`reading`,topic:`The Rescue Story`,difficulty:`medium`,prompt:`Read the story about the Somsri family. What was full of muddy water at the end?`,promptThai:`อ่านเรื่องราวของครอบครัวสมศรี ที่ใดที่เต็มไปด้วยน้ำโคลนในตอนท้ายของเรื่อง?`,options:[`Their kitchen`,`Their roof`,`The rescue boat`,`Mill Road school`],correctIndex:0,explanation:`The last sentence says everyone was safe, but their kitchen was full of muddy water.`,explanationThai:`ประโยคสุดท้ายบอกว่าทุกคนปลอดภัย แต่ครัวของพวกเขาเต็มไปด้วยน้ำโคลน`,hint1:`This is a room inside the house, not on the roof.`,hint2:`Look at the very last sentence of the story.`,example:`The flood water covered the street outside their house too.`,points:10,feedbackCorrect:`Correct — their kitchen was full of muddy water.`,feedbackIncorrect:`Look at the last sentence of the story again.`},{id:`l14-g-04`,type:`mcq`,skill:`reading`,topic:`Flood Information`,difficulty:`medium`,prompt:`Read the flood information text. According to the text, what is one common cause of a flood?`,promptThai:`อ่านข้อความความรู้เรื่องน้ำท่วม ตามข้อความนี้ สาเหตุทั่วไปอย่างหนึ่งของน้ำท่วมคืออะไร?`,options:[`Heavy rain falling for many days`,`A very sunny week`,`Strong wind with no rain`,`Cold weather in winter`],correctIndex:0,explanation:`The text says heavy rain is one common cause of a flood, especially when it falls for many days without stopping.`,explanationThai:`ข้อความบอกว่าฝนตกหนักเป็นสาเหตุทั่วไปอย่างหนึ่งของน้ำท่วม โดยเฉพาะเมื่อตกติดต่อกันหลายวัน`,hint1:`Look at the second sentence of the text.`,hint2:`Sunny and cold weather are not mentioned as causes.`,example:`The text also says blocked drains can make flooding worse.`,points:10,feedbackCorrect:`Correct — heavy rain is a common cause.`,feedbackIncorrect:`Look again at the second sentence of the text.`},{id:`l14-g-05`,type:`true-false`,skill:`reading`,topic:`Flood Information`,difficulty:`medium`,prompt:`Read the flood information text. Is this statement true or false: 'Blocked drains can make flooding worse.'`,promptThai:`อ่านข้อความความรู้เรื่องน้ำท่วม ข้อความนี้จริงหรือเท็จ: 'ท่อระบายน้ำที่อุดตันสามารถทำให้น้ำท่วมแย่ลง'`,statement:`Blocked drains can make flooding worse.`,correctAnswer:!0,explanation:`The text directly says blocked drains can also make flooding worse, because dirty water cannot flow away.`,explanationThai:`ข้อความระบุโดยตรงว่าท่อระบายน้ำที่อุดตันสามารถทำให้น้ำท่วมแย่ลงได้ เพราะน้ำสกปรกไม่สามารถไหลออกไปได้`,hint1:`Look at the third sentence of the text.`,hint2:`This is stated directly, not something you need to guess.`,example:`Statement: "A flood happens when a river or the sea rises." → True.`,points:10,feedbackCorrect:`Correct — the text says this directly.`,feedbackIncorrect:`Read the third sentence of the text again.`},{id:`l14-g-06`,type:`mcq`,skill:`dialogue`,topic:`Emergency Dialogue`,difficulty:`medium`,prompt:`Read the dialogue below.

คุณเอง`,acceptedAnswers:[`boat`,`helped them climb down`,`rescue boat`],placeholder:`Type your answer here...`,explanation:`A rescue team arrived in a small boat and helped the family climb down safely from the roof.`,explanationThai:`ทีมกู้ภัยมาถึงด้วยเรือลำเล็กและช่วยครอบครัวปีนลงมาจากหลังคาอย่างปลอดภัย`,hint1:`Think about what vehicle they used.`,hint2:`Mention how the family got down from the roof.`,example:`Answer could include: "They came in a boat and helped the family climb down."`,points:12,feedbackCorrect:`Good answer — you described the rescue correctly.`,feedbackIncorrect:`Think about the vehicle and what happened after it arrived.`},{id:`l14-i-03`,type:`true-false`,skill:`reading`,topic:`The Rescue Story`,difficulty:`medium`,prompt:`Read the story about the Somsri family. Is this statement true or false: 'The water covered the street before noon.'`,promptThai:`อ่านเรื่องราวของครอบครัวสมศรี ข้อความนี้จริงหรือเท็จ: 'น้ำท่วมถนนก่อนเที่ยงวัน'`,statement:`The water covered the street before noon.`,correctAnswer:!1,explanation:`The story says "By noon, water covered the street" — this means the water covered the street AT noon, not before it.`,explanationThai:`เรื่องราวบอกว่า "By noon, water covered the street" ซึ่งหมายความว่าน้ำท่วมถนนตอนเที่ยงวัน ไม่ใช่ก่อนเที่ยง`,hint1:`"By noon" means "at or before noon", but here it marks the point it happened.`,hint2:`Compare this to when the rain started — in the morning.`,example:`Statement: "The rescue boat was small." → True.`,points:10,feedbackCorrect:`Correct — the water reached the street by noon, not earlier.`,feedbackIncorrect:`Look carefully at the phrase "By noon" in the story.`},{id:`l14-i-04`,type:`short-answer`,skill:`reading`,topic:`Flood Information`,difficulty:`medium`,prompt:`Read the flood information text again. In your own words, what can happen to roads and homes during a flood?`,promptThai:`อ่านข้อความความรู้เรื่องน้ำท่วมอีกครั้ง ถนนและบ้านเรือนอาจเกิดอะไรขึ้นในช่วงน้ำท่วม? ตอบด้วยคำพูดของคุณเอง`,acceptedAnswers:[`roads can close`,`people leave their homes`,`close`,`leave`],placeholder:`Type your answer here...`,explanation:`The text says roads can close and people sometimes have to leave their homes until the water goes down.`,explanationThai:`ข้อความระบุว่าถนนอาจถูกปิดและผู้คนบางครั้งต้องออกจากบ้านจนกว่าน้ำจะลดลง`,hint1:`Look at the last sentence of the text.`,hint2:`Think about two things that can happen — one to roads, one to people.`,example:`Answer could include: "Roads can close and people may have to leave their homes."`,points:12,feedbackCorrect:`Good answer — that matches the text.`,feedbackIncorrect:`Look at the last sentence of the flood information text again.`},{id:`l14-i-05`,type:`mcq`,skill:`reading`,topic:`Flood Information`,difficulty:`challenge`,prompt:`Read the flood information text again. Why can dirty water not flow away when drains are blocked?`,promptThai:`อ่านข้อความความรู้เรื่องน้ำท่วมอีกครั้ง ทำไมน้ำสกปรกจึงไหลออกไปไม่ได้เมื่อท่อระบายน้ำอุดตัน?`,options:[`Because the blockage stops the water from passing through.`,`Because drains only work at night.`,`Because dirty water is heavier than clean water.`,`Because rain stops when drains are blocked.`],correctIndex:0,explanation:`A blocked drain has something stuck inside it, so water cannot pass through and flow away.`,explanationThai:`ท่อระบายน้ำที่อุดตันมีสิ่งของติดอยู่ข้างใน ทำให้น้ำไม่สามารถไหลผ่านและระบายออกไปได้`,hint1:`Think about what "blocked" means for a pipe.`,hint2:`This has nothing to do with the time of day or the weight of water.`,example:`Sandbags can help stop flood water from entering a house.`,points:12,feedbackCorrect:`Correct — a blockage stops water from passing through.`,feedbackIncorrect:`Think about what a "blocked" drain actually means.`},{id:`l14-i-06`,type:`mcq`,skill:`dialogue`,topic:`Emergency Dialogue`,difficulty:`medium`,prompt:`Read the dialogue below.
