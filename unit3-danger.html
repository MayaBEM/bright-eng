ตราย บุคคลที่ช่วยเหลือ ยานพาหนะ อุปกรณ์ และสถานที่ที่เกี่ยวข้อง`,points:[{title:`Emergency events`,body:`Words like fire, flood, emergency, accident, and rescue describe what is happening.`,bodyThai:`ไฟไหม้ น้ำท่วม เหตุฉุกเฉิน อุบัติเหตุ และการช่วยเหลือ อธิบายสิ่งที่กำลังเกิดขึ้น`},{title:`Emergency workers`,body:`Police officers, firefighters, paramedics, and emergency operators are trained to help.`,bodyThai:`ตำรวจ นักดับเพลิง เจ้าหน้าที่พยาบาลฉุกเฉิน และเจ้าหน้าที่รับแจ้งเหตุ ได้รับการฝึกฝนมาช่วยเหลือ`},{title:`Emergency vehicles & equipment`,body:`Police cars, fire engines, and ambulances get help to the scene fast. Fire extinguishers help put out small fires.`,bodyThai:`รถตำรวจ รถดับเพลิง และรถพยาบาลนำความช่วยเหลือไปถึงที่เกิดเหตุอย่างรวดเร็ว`}],vocabulary:Ci},examples:{items:[{text:`There was a fire at the old house, so firefighters came in a fire engine.`,noteThai:`มีไฟไหม้ที่บ้านเก่า นักดับเพลิงจึงมาด้วยรถดับเพลิง`},{text:`A paramedic checked the man after the accident.`,noteThai:`เจ้าหน้าที่พยาบาลฉุกเฉินตรวจดูชายคนนั้นหลังเกิดอุบัติเหตุ`},{text:`The flood covered the road, so people moved to higher ground.`,noteThai:`น้ำท่วมปกคลุมถนน ผู้คนจึงย้ายไปยังที่สูง`},{text:`She called the emergency operator and asked for an ambulance.`,noteThai:`เธอโทรหาเจ้าหน้าที่รับแจ้งเหตุฉุกเฉินและขอรถพยาบาล`},{text:`The police officer used the police car to reach the scene quickly.`,noteThai:`ตำรวจใช้รถตำรวจไปถึงที่เกิดเหตุอย่างรวดเร็ว`}]},guided:{questions:[{id:`l1-g-01`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`easy`,prompt:`Which word means 'a person whose job is to put out fires and rescue people'?`,options:[`firefighter`,`paramedic`,`police officer`,`emergency operator`],correctIndex:0,explanation:`A firefighter's job is to put out fires and rescue people who are in danger.`,explanationThai:`นักดับเพลิงมีหน้าที่ดับไฟและช่วยเหลือผู้คนที่ตกอยู่ในอันตราย`,hint1:`Think about who drives the fire engine.`,hint2:`This job is not about medicine or crime.`,example:`A paramedic's job is to give medical help.`,points:10,feedbackCorrect:`Yes — firefighters put out fires and rescue people.`,feedbackIncorrect:`Not quite — look at the other jobs again.`},{id:`l1-g-02`,type:`match`,skill:`vocabulary`,topic:`Emergency Workers`,difficulty:`easy`,prompt:`Match each worker to their job.`,left:[{id:`w1`,label:`firefighter`,icon:`🧑‍🚒`},{id:`w2`,label:`paramedic`,icon:`⛑️`},{id:`w3`,label:`police officer`,icon:`👮`},{id:`w4`,label:`emergency operator`,icon:`☎️`}],right:[{id:`j1`,label:`puts out fires and rescues people`},{id:`j2`,label:`gives medical help to hurt people`},{id:`j3`,label:`keeps people safe and stops crime`},{id:`j4`,label:`answers your call and sends help`}],pairs:{w1:`j1`,w2:`j2`,w3:`j3`,w4:`j4`},explanation:`Each emergency worker has a different job: firefighters fight fires, paramedics give medical help, police officers keep us safe, and emergency operators answer our calls.`,explanationThai:`เจ้าหน้าที่ฉุกเฉินแต่ละคนมีหน้าที่ต่างกัน`,hint1:`Read each job description carefully before matching.`,hint2:`The word "medical" is a clue for one of the jobs.`,example:`A firefighter → puts out fires.`,points:15,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — check the job descriptions again.`},{id:`l1-g-03`,type:`match`,skill:`vocabulary`,topic:`Emergency Vehicles`,difficulty:`easy`,prompt:`Match each vehicle to the worker who drives it.`,left:[{id:`v1`,label:`fire engine`,icon:`🚒`},{id:`v2`,label:`ambulance`,icon:`🚑`},{id:`v3`,label:`police car`,icon:`🚓`}],right:[{id:`p1`,label:`firefighter`},{id:`p2`,label:`paramedic`},{id:`p3`,label:`police officer`}],pairs:{v1:`p1`,v2:`p2`,v3:`p3`},explanation:`Each emergency vehicle belongs to a different worker: firefighters drive fire engines, paramedics drive ambulances, and police officers drive police cars.`,explanationThai:`ยานพาหนะฉุกเฉินแต่ละคันมีเจ้าหน้าที่ประจำต่างกัน`,hint1:`The worker who fights fires drives the biggest, loudest truck.`,hint2:`Ambulances carry hurt or sick people — who works on an ambulance?`,example:`A police car → driven by a police officer.`,points:12,feedbackCorrect:`Great matching!`,feedbackIncorrect:`Not all pairs are correct — try again.`},{id:`l1-g-04`,type:`sort`,skill:`vocabulary`,topic:`Categories`,difficulty:`medium`,prompt:`Sort these words into the correct category.`,categories:wi,items:[{id:`i1`,label:`fire`,categoryId:`emergency-events`},{id:`i2`,label:`accident`,categoryId:`emergency-events`},{id:`i3`,label:`firefighter`,categoryId:`emergency-workers`},{id:`i4`,label:`paramedic`,categoryId:`emergency-workers`},{id:`i5`,label:`ambulance`,categoryId:`emergency-vehicles`},{id:`i6`,label:`police car`,categoryId:`emergency-vehicles`},{id:`i7`,label:`fire extinguisher`,categoryId:`emergency-equipment`},{id:`i8`,label:`hospital`,categoryId:`emergency-places`}],explanation:`Emergency words can describe events (fire, accident), the people who help (firefighter, paramedic), vehicles (ambulance, police car), equipment (fire extinguisher), or places (hospital).`,explanationThai:`คำศัพท์ฉุกเฉินแบ่งได้เป็นเหตุการณ์ บุคคล ยานพาหนะ อุปกรณ์ และสถานที่`,hint1:`Ask yourself: is this a thing that happens, a person, a vehicle, a tool, or a place?`,hint2:`"Fire extinguisher" is the only equipment word in this set.`,example:`"flood" belongs in Emergency Events.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong category — check again.`},{id:`l1-g-05`,type:`mcq`,skill:`vocabulary`,topic:`Odd One Out`,difficulty:`easy`,prompt:`Find the odd word out.`,options:[`ambulance`,`fire engine`,`hospital`,`police car`],correctIndex:2,explanation:`"Hospital" is a place, but ambulance, fire engine, and police car are all emergency vehicles.`,explanationThai:`"โรงพยาบาล" คือสถานที่ ส่วนอีกสามคำเป็นยานพาหนะฉุกเฉิน`,hint1:`Three of these words can drive down the street.`,hint2:`Which one is a building, not a vehicle?`,example:`In "fire, flood, hospital, accident" — hospital is the odd one out because it is a place, not an event.`,points:10,feedbackCorrect:`Correct — hospital is a place, not a vehicle.`,feedbackIncorrect:`Look again — three of these words move on wheels.`},{id:`l1-g-06`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`There was a big`,after:`at the old house. Everyone had to leave.`,answers:[`fire`],explanation:`"Fire" means hot flames that burn things — that fits this sentence about a house and people leaving.`,explanationThai:`"ไฟ" หมายถึงเปลวไฟที่ร้อนและเผาไหม้สิ่งของ`,hint1:`Think of hot flames that can burn a building.`,hint2:`It starts with the letter F.`,example:`There was a flood on Green Street after the heavy rain.`,points:10,feedbackCorrect:`Correct — "fire" fits perfectly.`,feedbackIncorrect:`Think about what makes people leave a burning house.`},{id:`l1-g-07`,type:`mcq`,skill:`vocabulary`,topic:`Picture ID`,difficulty:`easy`,prompt:`🚒 What is this called?`,options:[`fire engine`,`police car`,`ambulance`,`fire extinguisher`],correctIndex:0,explanation:`A fire engine is the big red truck that firefighters use to reach and put out fires.`,explanationThai:`รถดับเพลิงเป็นรถบรรทุกสีแดงขนาดใหญ่ที่นักดับเพลิงใช้ดับไฟ`,hint1:`This vehicle usually carries ladders and hoses.`,hint2:`It is not small enough to carry in your hand, unlike a fire extinguisher.`,example:`🚑 = ambulance.`,points:8,feedbackCorrect:`Yes, that is a fire engine!`,feedbackIncorrect:`Look at the emoji again — it is a big truck.`},{id:`l1-g-08`,type:`match`,skill:`vocabulary`,topic:`Words & Pictures`,difficulty:`easy`,prompt:`Match each word to its picture.`,left:[{id:`p1`,label:`fire`},{id:`p2`,label:`flood`},{id:`p3`,label:`hospital`},{id:`p4`,label:`ambulance`}],right:[{id:`e1`,label:`🔥`},{id:`e2`,label:`🌊`},{id:`e3`,label:`🏥`},{id:`e4`,label:`🚑`}],pairs:{p1:`e1`,p2:`e2`,p3:`e3`,p4:`e4`},explanation:`Each word matches one picture: fire = flames, flood = water, hospital = building with a medical cross, ambulance = the vehicle.`,explanationThai:`แต่ละคำจับคู่กับภาพหนึ่งภาพ`,hint1:`Fire looks like flames.`,hint2:`Flood is shown with a wave of water.`,example:`police car → 🚓`,points:12,feedbackCorrect:`All matched!`,feedbackIncorrect:`Check the pictures again.`}]},independent:{questions:[{id:`l1-i-01`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'a sudden, dangerous situation that needs help right away'?`,options:[`emergency`,`accident`,`rescue`,`hospital`],correctIndex:0,explanation:`An "emergency" is any sudden, dangerous situation — like a fire, flood, or accident — that needs help immediately.`,explanationThai:`"เหตุฉุกเฉิน" คือสถานการณ์อันตรายที่เกิดขึ้นกะทันหันและต้องการความช่วยเหลือทันที`,hint1:`This word is often shouted before people call for help.`,hint2:`It is NOT the name of a place.`,example:`A fire is one kind of emergency.`,points:10,feedbackCorrect:`Correct — that is what "emergency" means.`,feedbackIncorrect:`Think about the most general word for a dangerous situation.`},{id:`l1-i-02`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'a vehicle that takes sick or hurt people to hospital'?`,options:[`fire engine`,`police car`,`ambulance`,`fire extinguisher`],correctIndex:2,explanation:`An ambulance is a special vehicle with medical equipment inside that carries sick or hurt people to hospital.`,explanationThai:`รถพยาบาลเป็นยานพาหนะที่มีอุปกรณ์การแพทย์เพื่อนำผู้ป่วยหรือผู้บาดเจ็บไปโรงพยาบาล`,hint1:`This vehicle usually has a red cross or stripes on the side.`,hint2:`A paramedic works inside this vehicle.`,example:`A police car carries police officers.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about which vehicle a paramedic drives.`},{id:`l1-i-03`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`The`,after:`took the boy to hospital after the accident.`,answers:[`ambulance`],explanation:`An ambulance takes hurt or sick people to hospital.`,explanationThai:`รถพยาบาลนำผู้บาดเจ็บหรือป่วยไปโรงพยาบาล`,hint1:`It is a vehicle, not a person.`,hint2:`It starts with the letter A.`,example:`The fire engine put out the fire at the old house.`,points:10,feedbackCorrect:`Correct — "ambulance" fits perfectly.`,feedbackIncorrect:`Which vehicle takes people to hospital?`},{id:`l1-i-04`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`He used a`,after:`to stop the small fire in the kitchen.`,answers:[`fire extinguisher`],explanation:`A fire extinguisher is equipment used to put out small fires.`,explanationThai:`ถังดับเพลิงเป็นอุปกรณ์ที่ใช้ดับไฟขนาดเล็ก`,hint1:`This equipment is red and you carry it in two hands.`,hint2:`It is not a vehicle — it is a tool.`,example:`She called the emergency operator for help.`,points:12,feedbackCorrect:`Correct — "fire extinguisher" is right.`,feedbackIncorrect:`What tool is used to stop a small fire?`},{id:`l1-i-05`,type:`mcq`,skill:`vocabulary`,topic:`Odd One Out`,difficulty:`medium`,prompt:`Find the odd word out.`,options:[`firefighter`,`paramedic`,`police officer`,`fire engine`],correctIndex:3,explanation:`Firefighter, paramedic, and police officer are all people (emergency workers), but a fire engine is a vehicle.`,explanationThai:`นักดับเพลิง เจ้าหน้าที่พยาบาล และตำรวจ ล้วนเป็นบุคคล ส่วนรถดับเพลิงเป็นยานพาหนะ`,hint1:`Three of these words describe a job.`,hint2:`Which one is a machine, not a person?`,example:`In "fire, flood, accident, hospital" — hospital is the odd one out.`,points:10,feedbackCorrect:`Correct — a fire engine is a vehicle, not a worker.`,feedbackIncorrect:`Three of these are jobs people do — find the one that is not.`},{id:`l1-i-06`,type:`mcq`,skill:`vocabulary`,topic:`Odd One Out`,difficulty:`medium`,prompt:`Find the odd word out.`,options:[`fire`,`flood`,`accident`,`hospital`],correctIndex:3,explanation:`Fire, flood, and accident are all emergency events, but a hospital is a place.`,explanationThai:`ไฟไหม้ น้ำท่วม และอุบัติเหตุ ล้วนเป็นเหตุการณ์ฉุกเฉิน ส่วนโรงพยาบาลเป็นสถานที่`,hint1:`Three of these words describe something that happens.`,hint2:`Which one is a building?`,example:`"fire engine" is a vehicle, not an event.`,points:10,feedbackCorrect:`Correct — hospital is a place, not an event.`,feedbackIncorrect:`Which word names a building rather than something that happens?`},{id:`l1-i-07`,type:`match`,skill:`vocabulary`,topic:`Words & Pictures`,difficulty:`medium`,prompt:`Match each word to its picture.`,left:[{id:`p1`,label:`firefighter`},{id:`p2`,label:`police officer`},{id:`p3`,label:`paramedic`},{id:`p4`,label:`fire extinguisher`}],right:[{id:`e1`,label:`🧑‍🚒`},{id:`e2`,label:`👮`},{id:`e3`,label:`⛑️`},{id:`e4`,label:`🧯`}],pairs:{p1:`e1`,p2:`e2`,p3:`e3`,p4:`e4`},explanation:`Each emergency worker or item of equipment has its own picture.`,explanationThai:`เจ้าหน้าที่หรืออุปกรณ์ฉุกเฉินแต่ละอย่างมีภาพของตนเอง`,hint1:`The firefighter's helmet looks different from the police officer's hat.`,hint2:`The fire extinguisher is not a person.`,example:`ambulance → 🚑`,points:12,feedbackCorrect:`All matched!`,feedbackIncorrect:`A couple of pairs need fixing — look again.`},{id:`l1-i-08`,type:`sort`,skill:`vocabulary`,topic:`Categories`,difficulty:`challenge`,prompt:`Sort these words into the correct category.`,categories:wi,items:[{id:`i1`,label:`flood`,categoryId:`emergency-events`},{id:`i2`,label:`rescue`,categoryId:`emergency-events`},{id:`i3`,label:`emergency operator`,categoryId:`emergency-workers`},{id:`i4`,label:`police officer`,categoryId:`emergency-workers`},{id:`i5`,label:`fire engine`,categoryId:`emergency-vehicles`},{id:`i6`,label:`emergency services`,categoryId:`emergency-places`}],explanation:`"Rescue" describes an action taken during an emergency event; "emergency operator" and "police officer" are workers; "fire engine" is a vehicle; "emergency services" is the whole team, so it belongs with places & services.`,explanationThai:`คำศัพท์แต่ละคำจัดอยู่ในหมวดหมู่ตามความหมาย`,hint1:`Emergency services is the whole team of helpers, not a single job.`,hint2:`"Rescue" is something that happens during a dangerous event.`,example:`"hospital" belongs in Places & Services.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong bucket — check again.`},{id:`l1-i-09`,type:`mcq`,skill:`vocabulary`,topic:`Picture ID`,difficulty:`medium`,prompt:`🚨 What does this show?`,options:[`emergency`,`rescue`,`accident`,`hospital`],correctIndex:0,explanation:`The flashing light 🚨 is used to show an "emergency" — a dangerous situation happening right now.`,explanationThai:`ไฟกระพริบ 🚨 หมายถึงเหตุฉุกเฉิน`,hint1:`This symbol is often on top of police cars and ambulances.`,hint2:`It is the general word for a dangerous, urgent situation.`,example:`🏥 = hospital.`,points:8,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about what this flashing light warns people about.`},{id:`l1-i-10`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`easy`,prompt:`Which word means 'a place where doctors and nurses take care of sick or hurt people'?`,options:[`hospital`,`fire engine`,`emergency operator`,`accident`],correctIndex:0,explanation:`A hospital is the place where doctors and nurses treat sick or hurt people.`,explanationThai:`โรงพยาบาลเป็นสถานที่ที่แพทย์และพยาบาลดูแลผู้ป่วยหรือผู้บาดเจ็บ`,hint1:`This is a building, not a person or a vehicle.`,hint2:`An ambulance often takes people here.`,example:`A fire engine is used to put out fires, not to treat people.`,points:8,feedbackCorrect:`Correct — that is a hospital.`,feedbackIncorrect:`Think of the building where doctors work.`},{id:`l1-i-11`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`There was an`,after:`on Green Street — two cars crashed.`,answers:[`accident`],explanation:`An "accident" is something bad that happens by chance, like two cars crashing.`,explanationThai:`"อุบัติเหตุ" คือสิ่งที่เกิดขึ้นโดยไม่ตั้งใจ เช่น รถชนกัน`,hint1:`This word describes something that happens by chance, not on purpose.`,hint2:`It starts with the letter A.`,example:`There was a fire at the old house.`,points:10,feedbackCorrect:`Correct — "accident" fits perfectly.`,feedbackIncorrect:`What word describes two cars crashing unexpectedly?`},{id:`l1-i-12`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Who answers your call when you dial the emergency number?`,options:[`the emergency operator`,`the paramedic`,`the firefighter`,`the police officer`],correctIndex:0,explanation:`The emergency operator is the person who answers your call first and sends the right help.`,explanationThai:`เจ้าหน้าที่รับแจ้งเหตุฉุกเฉินเป็นผู้รับสายก่อนแล้วส่งความช่วยเหลือที่เหมาะสม`,hint1:`This person works with a telephone, not at the scene of the emergency.`,hint2:`They ask you questions like "What is your emergency?"`,example:`The paramedic helps once they arrive at the scene.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about who you actually speak to on the phone first.`}]},miniQuiz:{questions:[{id:`l1-mq-01`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'a person trained to give medical help in an emergency'?`,options:[`paramedic`,`police officer`,`emergency operator`,`firefighter`],correctIndex:0,explanation:`A paramedic gives medical help to sick or injured people during an emergency.`,explanationThai:`เจ้าหน้าที่พยาบาลฉุกเฉินให้การช่วยเหลือทางการแพทย์`,hint1:`This person often works inside an ambulance.`,hint2:`It is not the person who answers the phone.`,example:`A firefighter puts out fires.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about who works inside the ambulance.`},{id:`l1-mq-02`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'to save someone from a dangerous place'?`,options:[`rescue`,`accident`,`flood`,`hospital`],correctIndex:0,explanation:`"Rescue" means to save someone who is in danger.`,explanationThai:`"ช่วยเหลือ/กู้ภัย" หมายถึงการช่วยคนที่ตกอยู่ในอันตราย`,hint1:`This word can be a verb (an action).`,hint2:`It is the opposite of leaving someone in danger.`,example:`Firefighters rescued the family from the flood.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Which word describes saving someone?`},{id:`l1-mq-03`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`The`,after:`arrived in five minutes and helped everyone.`,answers:[`emergency services`],explanation:`"Emergency services" refers to the police, fire, and ambulance teams together.`,explanationThai:`"หน่วยบริการฉุกเฉิน" หมายถึงตำรวจ ดับเพลิง และรถพยาบาลรวมกัน`,hint1:`This is two words, not one.`,hint2:`It means the police, fire, and ambulance teams together.`,example:`The firefighter arrived first.`,points:12,feedbackCorrect:`Correct — "emergency services" is right.`,feedbackIncorrect:`What do we call the police, fire, and ambulance teams together?`},{id:`l1-mq-04`,type:`mcq`,skill:`vocabulary`,topic:`Odd One Out`,difficulty:`medium`,prompt:`Find the odd word out.`,options:[`police car`,`fire engine`,`ambulance`,`firefighter`],correctIndex:3,explanation:`Police car, fire engine, and ambulance are all vehicles, but a firefighter is a person.`,explanationThai:`รถตำรวจ รถดับเพลิง และรถพยาบาล ล้วนเป็นยานพาหนะ ส่วนนักดับเพลิงเป็นบุคคล`,hint1:`Three of these words can be driven.`,hint2:`Which one is a job, not a machine?`,example:`In "firefighter, paramedic, police officer, fire engine" — fire engine is the odd one out.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Which word names a person, not a vehicle?`},{id:`l1-mq-05`,type:`match`,skill:`vocabulary`,topic:`Words & Pictures`,difficulty:`medium`,prompt:`Match each word to its picture.`,left:[{id:`p1`,label:`fire`},{id:`p2`,label:`ambulance`},{id:`p3`,label:`hospital`},{id:`p4`,label:`fire extinguisher`}],right:[{id:`e1`,label:`🔥`},{id:`e2`,label:`🚑`},{id:`e3`,label:`🏥`},{id:`e4`,label:`🧯`}],pairs:{p1:`e1`,p2:`e2`,p3:`e3`,p4:`e4`},explanation:`Each word matches its picture based on what it looks like or represents.`,explanationThai:`แต่ละคำจับคู่กับภาพตามความหมาย`,hint1:`Fire looks like flames.`,hint2:`The fire extinguisher is the small red tool, not the truck.`,example:`flood → 🌊`,points:14,feedbackCorrect:`All matched!`,feedbackIncorrect:`Check the pictures again.`},{id:`l1-mq-06`,type:`mcq`,skill:`vocabulary`,topic:`Picture ID`,difficulty:`medium`,prompt:`🧯 What is this?`,options:[`fire extinguisher`,`fire engine`,`ambulance`,`police car`],correctIndex:0,explanation:`A fire extinguisher is a small piece of equipment used to put out small fires.`,explanationThai:`ถังดับเพลิงเป็นอุปกรณ์ขนาดเล็กที่ใช้ดับไฟ`,hint1:`You can carry this in your hands.`,hint2:`It is not a vehicle.`,example:`🚒 = fire engine.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`This is a small tool, not a big truck.`},{id:`l1-mq-07`,type:`sort`,skill:`vocabulary`,topic:`Categories`,difficulty:`challenge`,prompt:`Sort these words into the correct category.`,categories:wi,items:[{id:`i1`,label:`flood`,categoryId:`emergency-events`},{id:`i2`,label:`paramedic`,categoryId:`emergency-workers`},{id:`i3`,label:`police car`,categoryId:`emergency-vehicles`},{id:`i4`,label:`fire extinguisher`,categoryId:`emergency-equipment`},{id:`i5`,label:`hospital`,categoryId:`emergency-places`},{id:`i6`,label:`accident`,categoryId:`emergency-events`}],explanation:`Each word belongs to one category based on what kind of thing it is: event, worker, vehicle, equipment, or place.`,explanationThai:`แต่ละคำจัดอยู่ในหมวดหมู่ตามประเภทของคำ`,hint1:`Ask: is this something that happens, someone who helps, something that moves, a tool, or a building?`,hint2:`There is only one equipment word in this set.`,example:`"firefighter" belongs in Emergency Workers.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong bucket.`},{id:`l1-mq-08`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`The firefighters came to`,after:`the family from the flood.`,answers:[`rescue`],explanation:`"Rescue" means to save someone — the firefighters came to save the family.`,explanationThai:`"ช่วยเหลือ" หมายถึงการช่วยชีวิตใครสักคน`,hint1:`This is the action word for "save".`,hint2:`It is not a person or a vehicle.`,example:`Paramedics help injured people.`,points:12,feedbackCorrect:`Correct — "rescue" fits perfectly.`,feedbackIncorrect:`What action word means "to save"?`},{id:`l1-mq-09`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'too much water covering land that is usually dry'?`,options:[`flood`,`fire`,`accident`,`rescue`],correctIndex:0,explanation:`A "flood" happens when too much water covers land that is normally dry.`,explanationThai:`"น้ำท่วม" เกิดขึ้นเมื่อมีน้ำมากเกินไปปกคลุมพื้นที่ที่ปกติแห้ง`,hint1:`This emergency involves too much water.`,hint2:`It is not about flames.`,example:`A fire involves flames, not water.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about the emergency caused by too much water.`},{id:`l1-mq-10`,type:`match`,skill:`vocabulary`,topic:`Workers & Vehicles`,difficulty:`medium`,prompt:`Match each worker to the vehicle they drive.`,left:[{id:`p1`,label:`police officer`},{id:`p2`,label:`firefighter`},{id:`p3`,label:`paramedic`}],right:[{id:`v1`,label:`police car`},{id:`v2`,label:`fire engine`},{id:`v3`,label:`ambulance`}],pairs:{p1:`v1`,p2:`v2`,p3:`v3`},explanation:`Each emergency worker drives a specific vehicle that matches their job.`,explanationThai:`เจ้าหน้าที่ฉุกเฉินแต่ละคนขับยานพาหนะเฉพาะของตน`,hint1:`The vehicle name often gives a clue about the worker's job.`,hint2:`Ambulances carry medical equipment.`,example:`A police officer drives a police car.`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Check the pairs again.`}]},summary:{keyTakeaways:[`Emergency words fall into five groups: events, workers, vehicles, equipment, and places/services.`,`Firefighters, paramedics, police officers, and emergency operators each have a different job.`,`Fire engines, ambulances, and police cars are driven by different emergency workers.`,`A fire extinguisher is equipment used to stop small fires.`],keyTakeawaysThai:[`คำศัพท์ฉุกเฉินแบ่งเป็น 5 กลุ่ม: เหตุการณ์ บุคคล ยานพาหนะ อุปกรณ์ และสถานที่/บริการ`,`นักดับเพลิง เจ้าหน้าที่พยาบาลฉุกเฉิน ตำรวจ และเจ้าหน้าที่รับแจ้งเหตุ มีหน้าที่ต่างกัน`]}}},Ei={id:`l2-what-happened`,number:2,title:`What Happened?`,subtitle:`Learn to describe accidents and emergencies with simple, useful sentences.`,skillCategory:`vocabulary`,estimatedMinutes:18,stages:{warmup:{promptEn:`Imagine you see a boy riding his bicycle very fast. Suddenly, he falls off! What happened? How do you think he feels?`,promptThai:`ลองนึกภาพเด็กผู้ชายคนหนึ่งกำลังขี่จักรยานอย่างรวดเร็ว แล้วจู่ๆ เขาก็ล้ม! เกิดอะไรขึ้น? คุณคิดว่าเขารู้สึกอย่างไร?`,hook:`When something bad happens suddenly, we use special sentences to describe it — like 'He had an accident.'`},learn:{intro:`When accidents and emergencies happen, we use specific sentences to describe what happened, who was hurt, and who helped. Learning these sentences will help you explain and understand real emergency situations in English.`,introThai:`เมื่อเกิดอุบัติเหตุหรือเหตุฉุกเฉิน เราใช้ประโยคเฉพาะเพื่ออธิบายว่าเกิดอะไรขึ้น ใครได้รับบาดเจ็บ และใครช่วยเหลือ การเรียนรู้ประโยคเหล่านี้จะช่วยให้คุณอธิบายและเข้าใจสถานการณ์ฉุกเฉินจริงเป็นภาษาอังกฤษได้`,points:[{title:`Describing an event`,body:`Use 'had an accident' or 'There was a fire / flood' to say what suddenly happened.`,bodyThai:`ใช้ 'had an accident' (ประสบอุบัติเหตุ) หรือ 'There was a fire / flood' (เกิดไฟไหม้/น้ำท่วม) เพื่อบอกว่าเกิดอะไรขึ้นอย่างกะทันหัน`},{title:`Talking about injuries`,body:`Use 'hurt' with a body part, like 'She hurt her arm,' to say what part of the body was hurt.`,bodyThai:`ใช้ 'hurt' ร่วมกับส่วนของร่างกาย เช่น 'She hurt her arm' (แขนของเธอเจ็บ) เพื่อบอกว่าส่วนไหนของร่างกายได้รับบาดเจ็บ`},{title:`Getting help`,body:`Use 'called the emergency services' or 'took him to hospital' to describe how people got help.`,bodyThai:`ใช้ 'called the emergency services' (โทรแจ้งหน่วยบริการฉุกเฉิน) หรือ 'took him to hospital' (พาไปโรงพยาบาล) เพื่ออธิบายว่าผู้คนได้รับความช่วยเหลืออย่างไร`},{title:`Who helped`,body:`Use 'The firefighter helped...' or 'The paramedic checked...' to say which worker helped and how.`,bodyThai:`ใช้ 'The firefighter helped...' (นักดับเพลิงช่วยเหลือ...) หรือ 'The paramedic checked...' (เจ้าหน้าที่พยาบาลฉุกเฉินตรวจดู...) เพื่อบอกว่าเจ้าหน้าที่คนไหนช่วยเหลือและช่วยอย่างไร`}]},examples:{items:[{text:`Ben fell off his bicycle and hurt his knee.`,noteThai:`เบนล้มจากจักรยานและเข่าเจ็บ`},{text:`There was a fire in the car, so the firefighter came quickly to help.`,noteThai:`เกิดไฟไหม้ในรถ นักดับเพลิงจึงมาช่วยอย่างรวดเร็ว`},{text:`The road was flooded after the storm, so the cars could not pass.`,noteThai:`ถนนน้ำท่วมหลังพายุ รถจึงผ่านไม่ได้`},{text:`Nina slipped near the pool and had an accident.`,noteThai:`นีน่าลื่นใกล้สระว่ายน้ำและประสบอุบัติเหตุ`},{text:`The paramedic checked the injured boy and then took him to hospital.`,noteThai:`เจ้าหน้าที่พยาบาลฉุกเฉินตรวจดูเด็กชายที่บาดเจ็บแล้วพาเขาไปโรงพยาบาล`},{text:`They called the emergency services when they saw the smoke.`,noteThai:`พวกเขาโทรแจ้งหน่วยบริการฉุกเฉินเมื่อเห็นควันไฟ`}]},guided:{questions:[{id:`l2-g-01`,type:`match`,skill:`vocabulary`,topic:`Situations & Pictures`,difficulty:`easy`,prompt:`Match each situation to the correct picture.`,left:[{id:`s1`,label:`A boy fell near the swimming pool.`},{id:`s2`,label:`Two children fell off their bicycles.`},{id:`s3`,label:`A girl fell from a tree.`},{id:`s4`,label:`There was a fire in the car.`}],right:[{id:`p1`,label:`🏊`},{id:`p2`,label:`🚲`},{id:`p3`,label:`🌳`},{id:`p4`,label:`🔥`}],pairs:{s1:`p1`,s2:`p2`,s3:`p3`,s4:`p4`},explanation:`Each situation matches a picture that shows where or how the accident happened: pool, bicycles, tree, and fire.`,explanationThai:`แต่ละสถานการณ์จับคู่กับภาพที่แสดงว่าอุบัติเหตุเกิดขึ้นที่ไหนหรืออย่างไร เช่น สระว่ายน้ำ จักรยาน ต้นไม้ และไฟไหม้`,hint1:`Think about where each accident happened.`,hint2:`Two children on wheels means bicycles.`,example:`A flooded road → 🌊`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A couple of pairs are wrong — read each situation again.`},{id:`l2-g-02`,type:`mcq`,skill:`vocabulary`,topic:`Choose What Happened`,difficulty:`easy`,prompt:`Look at the scene: a boy is riding his bike very fast, then suddenly he is on the ground next to his bicycle. What happened?`,options:[`He had an accident.`,`He called the emergency services.`,`There was a flood.`,`He checked the injured person.`],correctIndex:0,explanation:`When someone suddenly falls or gets hurt in an unexpected event, we say 'He had an accident.'`,explanationThai:`เมื่อมีใครสักคนล้มหรือได้รับบาดเจ็บอย่างกะทันหันโดยไม่ได้ตั้งใจ เราพูดว่า "He had an accident." (เขาประสบอุบัติเหตุ)`,hint1:`Think about what we call something bad that happens by chance.`,hint2:`The boy is not helping anyone in this picture — something happened to him.`,example:`She fell near the pool. → She had an accident.`,points:10,feedbackCorrect:`Yes — falling off a bike like that is an accident.`,feedbackIncorrect:`Look again — this sentence should describe what happened to the boy.`},{id:`l2-g-03`,type:`true-false`,skill:`vocabulary`,topic:`True or False`,difficulty:`easy`,prompt:`Read the situation: Nina was climbing a tree. She slipped and fell. Now her arm hurts a lot. Is this statement true or false: 'Nina hurt her leg.'`,statement:`Nina hurt her leg.`,correctAnswer:!1,explanation:`The situation says Nina's arm hurts, not her leg, so this statement is false.`,explanationThai:`สถานการณ์บอกว่าแขนของนีน่าเจ็บ ไม่ใช่ขา ดังนั้นข้อความนี้จึงเป็นเท็จ`,hint1:`Look carefully at which body part is mentioned in the situation.`,hint2:`Arm and leg are different body parts — read again.`,example:`Situation: "Tom fell and his knee hurts." Statement: "Tom hurt his knee." → True.`,points:10,feedbackCorrect:`Correct — the situation says her arm, not her leg.`,feedbackIncorrect:`Read the situation again and check which body part is hurt.`},{id:`l2-g-04`,type:`fill-blank`,skill:`vocabulary`,topic:`Complete the Sentence`,difficulty:`easy`,prompt:`Complete the sentence with the correct word.`,before:`There was a big`,after:`in the car, so everyone got out quickly.`,answers:[`fire`],explanation:`"Fire" means hot flames — that fits this sentence about a car and people leaving quickly.`,explanationThai:`"ไฟ" หมายถึงเปลวไฟที่ร้อน ซึ่งเข้ากับประโยคเกี่ยวกับรถและการรีบออกมาจากรถ`,hint1:`Think of hot flames that can start inside a car engine.`,hint2:`It starts with the letter F.`,example:`The road was flooded, so cars could not pass.`,points:10,feedbackCorrect:`Correct — "fire" fits perfectly.`,feedbackIncorrect:`Think about what makes people leave a car quickly.`},{id:`l2-g-05`,type:`sequence`,skill:`vocabulary`,topic:`Put Events in Order`,difficulty:`medium`,presentation:`events`,prompt:`Put these events from Ben's bicycle accident in the correct order.`,items:[{id:`e1`,label:`Ben rides his bicycle fast down the hill.`},{id:`e2`,label:`Ben falls off his bicycle and hurts his arm.`},{id:`e3`,label:`A paramedic checks Ben's arm.`},{id:`e4`,label:`They take Ben to hospital.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`First Ben rides fast, then he falls and gets hurt, then a paramedic checks him, and finally they take him to hospital.`,explanationThai:`ก่อนอื่นเบนขี่จักรยานเร็ว จากนั้นเขาล้มและเจ็บ แล้วเจ้าหน้าที่พยาบาลฉุกเฉินตรวจดูเขา และสุดท้ายพาเขาไปโรงพยาบาล`,hint1:`What must happen before someone can be checked by a paramedic?`,hint2:`Going to hospital is usually the last step.`,example:`Rain falls → the road floods → cars stop → people call for help.`,points:16,feedbackCorrect:`Great — that is the correct order!`,feedbackIncorrect:`Think about which event must come first.`},{id:`l2-g-06`,type:`error-correction`,skill:`vocabulary`,topic:`Fix the Mistake`,difficulty:`medium`,prompt:`This sentence has one wrong word. Find it and fix it.`,sentence:`The firefighter checked the injured person's arm.`,wrongWord:`firefighter`,correctWord:`paramedic`,explanation:`A paramedic checks injured people and gives medical help. A firefighter puts out fires and rescues people.`,explanationThai:`เจ้าหน้าที่พยาบาลฉุกเฉินจะตรวจดูผู้บาดเจ็บและให้การช่วยเหลือทางการแพทย์ ส่วนนักดับเพลิงมีหน้าที่ดับไฟและช่วยเหลือผู้คน`,hint1:`Who checks an injured person, not a fire?`,hint2:`This worker often works inside an ambulance.`,example:`"The paramedic helped the driver." → correct as is.`,points:12,feedbackCorrect:`Correct — "paramedic" is the right word here.`,feedbackIncorrect:`Think about who checks injuries, not fires.`},{id:`l2-g-07`,type:`mcq`,skill:`vocabulary`,topic:`Choose What Happened`,difficulty:`medium`,prompt:`Look at the scene: dark clouds, heavy rain, and a car standing still in the middle of the road with its lights on. What happened?`,options:[`The car stopped in the heavy rain.`,`There was a fire in the car.`,`The driver hurt his arm.`,`They called the emergency services.`],correctIndex:0,explanation:`The scene shows heavy rain and a car that is not moving — this describes "The car stopped in the heavy rain."`,explanationThai:`ภาพแสดงฝนตกหนักและรถที่หยุดนิ่งอยู่กลางถนน จึงตรงกับประโยค "รถหยุดเพราะฝนตกหนัก"`,hint1:`Look at the weather in the scene, not an injury.`,hint2:`Nothing in the scene shows smoke or flames.`,example:`Dark clouds and a flooded street → There was a flood.`,points:10,feedbackCorrect:`Correct — heavy rain made the car stop.`,feedbackIncorrect:`Look again at the weather shown in the scene.`},{id:`l2-g-08`,type:`fill-blank`,skill:`vocabulary`,topic:`Complete the Sentence`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`The road was covered with water. There was a`,after:`on the way to school.`,answers:[`flood`],explanation:`"Flood" means too much water covering land that is usually dry — that matches "covered with water."`,explanationThai:`"น้ำท่วม" หมายถึงมีน้ำมากเกินไปปกคลุมพื้นที่ที่ปกติแห้ง ซึ่งตรงกับ "ปกคลุมด้วยน้ำ"`,hint1:`Think of the emergency caused by too much water.`,hint2:`It starts with the letter F.`,example:`There was a fire in the car.`,points:10,feedbackCorrect:`Correct — "flood" fits perfectly.`,feedbackIncorrect:`What word describes a road covered with water?`}]},independent:{questions:[{id:`l2-i-01`,type:`mcq`,skill:`vocabulary`,topic:`Choose What Happened`,difficulty:`medium`,prompt:`Look at the scene: smoke is coming from under a car's hood, and the driver is standing outside looking worried. What happened?`,options:[`There was a fire in the car.`,`The car stopped in the heavy rain.`,`She hurt her arm.`,`The road was flooded.`],correctIndex:0,explanation:`Smoke coming from a car usually means a fire has started — that matches "There was a fire in the car."`,explanationThai:`ควันที่ออกมาจากรถมักหมายถึงมีไฟไหม้เกิดขึ้น ตรงกับ "เกิดไฟไหม้ในรถ"`,hint1:`Smoke is a clue for one specific emergency.`,hint2:`There is no rain or water in this scene.`,example:`A wet road with cars stopped → The road was flooded.`,points:10,feedbackCorrect:`Correct — smoke means fire.`,feedbackIncorrect:`Think about what smoke usually means.`},{id:`l2-i-02`,type:`match`,skill:`vocabulary`,topic:`Situations & Pictures`,difficulty:`medium`,prompt:`Match each situation to the correct picture.`,left:[{id:`s1`,label:`The road was flooded after the storm.`},{id:`s2`,label:`A boy needed an ambulance after his accident.`},{id:`s3`,label:`A girl slipped near the swimming pool.`},{id:`s4`,label:`The car stopped because of the heavy rain.`}],right:[{id:`p1`,label:`🌊`},{id:`p2`,label:`🚑`},{id:`p3`,label:`🏊`},{id:`p4`,label:`🚗`}],pairs:{s1:`p1`,s2:`p2`,s3:`p3`,s4:`p4`},explanation:`Each situation matches a picture: flood = water wave, ambulance need = ambulance, pool accident = pool, car in rain = car.`,explanationThai:`แต่ละสถานการณ์จับคู่กับภาพ: น้ำท่วม = คลื่นน้ำ, ต้องการรถพยาบาล = รถพยาบาล, อุบัติเหตุที่สระ = สระว่ายน้ำ, รถในฝน = รถยนต์`,hint1:`Which picture shows a wave of water?`,hint2:`The pool picture is not the same as the flood picture.`,example:`A fire in the car → 🔥`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Check the pictures again — two of them look similar.`},{id:`l2-i-03`,type:`fill-blank`,skill:`vocabulary`,topic:`Complete the Sentence`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`Tom fell from the tree and`,after:`his leg.`,answers:[`hurt`],explanation:`We use "hurt" with a body part to say which part was injured, like "hurt his leg."`,explanationThai:`เราใช้คำว่า "hurt" ร่วมกับส่วนของร่างกาย เพื่อบอกว่าส่วนไหนได้รับบาดเจ็บ เช่น "hurt his leg" (ขาเจ็บ)`,hint1:`This word describes pain or injury.`,hint2:`It rhymes with "shirt".`,example:`She hurt her arm when she fell near the pool.`,points:10,feedbackCorrect:`Correct — "hurt" fits perfectly.`,feedbackIncorrect:`What word means "was injured"?`},{id:`l2-i-04`,type:`true-false`,skill:`vocabulary`,topic:`True or False`,difficulty:`medium`,prompt:`Read the situation: A car stopped in the middle of the road during heavy rain. The driver could not see well. Is this statement true or false: 'The weather was sunny and clear.'`,statement:`The weather was sunny and clear.`,correctAnswer:!1,explanation:`The situation describes heavy rain, which is the opposite of sunny and clear weather, so this statement is false.`,explanationThai:`สถานการณ์บรรยายว่าฝนตกหนัก ซึ่งตรงข้ามกับอากาศแจ่มใส ดังนั้นข้อความนี้จึงเป็นเท็จ`,hint1:`Look at what kind of weather is described.`,hint2:`Heavy rain and sunny weather cannot both be true.`,example:`Situation: "There was smoke in the car." Statement: "There was a fire." → True.`,points:10,feedbackCorrect:`Correct — the situation describes heavy rain, not sunshine.`,feedbackIncorrect:`Read the situation again and check the weather.`},{id:`l2-i-05`,type:`sequence`,skill:`vocabulary`,topic:`Put Events in Order`,difficulty:`medium`,presentation:`events`,prompt:`Put these events from the flooded road in the correct order.`,items:[{id:`e1`,label:`Heavy rain fell all night.`},{id:`e2`,label:`The road became flooded with water.`},{id:`e3`,label:`Cars could not drive through the water.`},{id:`e4`,label:`People called the emergency services for help.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`First it rains heavily, then the road floods, then cars get stuck, and finally people call for help.`,explanationThai:`ก่อนอื่นฝนตกหนัก จากนั้นถนนน้ำท่วม แล้วรถขับผ่านไม่ได้ และสุดท้ายผู้คนโทรขอความช่วยเหลือ`,hint1:`The weather event must come before the road floods.`,hint2:`Calling for help is usually the last step.`,example:`A boy climbs a tree → he falls → a paramedic checks him → they go to hospital.`,points:16,feedbackCorrect:`Great — that is the correct order!`,feedbackIncorrect:`Think about what must happen before the road can flood.`},{id:`l2-i-06`,type:`error-correction`,skill:`vocabulary`,topic:`Fix the Mistake`,difficulty:`medium`,prompt:`This sentence has one wrong word or phrase. Find it and fix it.`,sentence:`They called the paramedic when they saw the flood.`,wrongWord:`paramedic`,correctWord:`emergency services`,explanation:`When people see danger like a flood, they call the emergency services — the police, fire, and ambulance teams together — not just one paramedic.`,explanationThai:`เมื่อผู้คนเห็นอันตราย เช่น น้ำท่วม พวกเขาจะโทรแจ้งหน่วยบริการฉุกเฉิน ซึ่งรวมตำรวจ ดับเพลิง และรถพยาบาล ไม่ใช่แค่เจ้าหน้าที่พยาบาลฉุกเฉินคนเดียว`,hint1:`This phrase means the whole team of helpers, not one person.`,hint2:`It is two words, not one.`,example:`"The firefighter helped the driver." → correct as is.`,points:12,feedbackCorrect:`Correct — "emergency services" is the right phrase here.`,feedbackIncorrect:`Think about who you call first when you see danger.`},{id:`l2-i-07`,type:`mcq`,skill:`vocabulary`,topic:`Choose What Happened`,difficulty:`challenge`,prompt:`Look at the scene: two bicycles are lying on the ground, and two children are sitting nearby, one holding her knee. What happened?`,options:[`They fell off their bicycles.`,`There was a fire.`,`They took him to hospital.`,`The car stopped in the rain.`],correctIndex:0,explanation:`Two bicycles on the ground and children holding an injured knee show that they fell off their bicycles.`,explanationThai:`จักรยานสองคันล้มอยู่บนพื้นและเด็กจับเข่าที่เจ็บ แสดงว่าพวกเขาล้มจากจักรยาน`,hint1:`Look at what is lying on the ground next to the children.`,hint2:`There is no smoke, water, or car in this scene.`,example:`A fire truck and smoke → There was a fire.`,points:12,feedbackCorrect:`Correct — the bicycles on the ground are the clue.`,feedbackIncorrect:`Look again at what is lying next to the children.`},{id:`l2-i-08`,type:`fill-blank`,skill:`vocabulary`,topic:`Complete the Sentence`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`After the accident, the paramedic`,after:`the injured person carefully.`,answers:[`checked`],explanation:`A paramedic checks an injured person to see how badly they are hurt and what help they need.`,explanationThai:`เจ้าหน้าที่พยาบาลฉุกเฉินจะตรวจดูผู้บาดเจ็บเพื่อดูว่าเจ็บมากแค่ไหนและต้องการความช่วยเหลือแบบใด`,hint1:`This word means "looked at carefully to see if someone is hurt."`,hint2:`It is the past tense of "check".`,example:`The firefighter helped the driver get out of the car.`,points:10,feedbackCorrect:`Correct — "checked" fits perfectly.`,feedbackIncorrect:`What does a paramedic do to an injured person?`},{id:`l2-i-09`,type:`mcq`,skill:`vocabulary`,topic:`Getting Help`,difficulty:`medium`,prompt:`A boy fell from a tree and could not walk. What should his friends do first?`,options:[`Call the emergency services.`,`Ride their bicycles home.`,`Go swimming.`,`Wait until tomorrow.`],correctIndex:0,explanation:`When someone is badly hurt, the first thing to do is call the emergency services so trained helpers can come quickly.`,explanationThai:`เมื่อมีคนได้รับบาดเจ็บสาหัส สิ่งแรกที่ควรทำคือโทรแจ้งหน่วยบริการฉุกเฉิน เพื่อให้เจ้าหน้าที่ที่ได้รับการฝึกฝนมาช่วยเหลืออย่างรวดเร็ว`,hint1:`Think about who is trained to help in emergencies.`,hint2:`Waiting or doing something unrelated will not help the boy.`,example:`If there is a fire, call the emergency services right away.`,points:10,feedbackCorrect:`Correct — call the emergency services first.`,feedbackIncorrect:`Think about what gets trained help to the boy fastest.`}]},miniQuiz:{questions:[{id:`l2-mq-01`,type:`mcq`,skill:`vocabulary`,topic:`Choose What Happened`,difficulty:`medium`,prompt:`Look at the scene: a girl is standing at the edge of the pool, then she slips and falls into the water with a splash. What happened?`,options:[`She had an accident near the pool.`,`There was a fire.`,`The car stopped in the rain.`,`They took him to hospital.`],correctIndex:0,explanation:`Slipping and falling suddenly near the pool is an unexpected event — this is "an accident near the pool."`,explanationThai:`การลื่นและล้มลงอย่างกะทันหันใกล้สระเป็นเหตุการณ์ที่ไม่คาดคิด นี่คือ "อุบัติเหตุใกล้สระว่ายน้ำ"`,hint1:`This is something that happened by chance, not on purpose.`,hint2:`There is no smoke, rain, or car in this scene.`,example:`A boy fell off his bike. → He had an accident.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about what word describes something bad that happens by chance.`},{id:`l2-mq-02`,type:`true-false`,skill:`vocabulary`,topic:`True or False`,difficulty:`medium`,prompt:`Read the situation: A small fire started under the car's hood. The driver got out safely, and a firefighter came to help. Is this statement true or false: 'A paramedic put out the fire.'`,statement:`A paramedic put out the fire.`,correctAnswer:!1,explanation:`The situation says a firefighter came to help, and firefighters — not paramedics — put out fires.`,explanationThai:`สถานการณ์บอกว่านักดับเพลิงมาช่วย และนักดับเพลิงเป็นผู้ดับไฟ ไม่ใช่เจ้าหน้าที่พยาบาลฉุกเฉิน`,hint1:`Which worker is trained to put out fires?`,hint2:`A paramedic checks injuries, not flames.`,example:`Situation: "The road was flooded." Statement: "There was too much water." → True.`,points:10,feedbackCorrect:`Correct — a firefighter put out the fire, not a paramedic.`,feedbackIncorrect:`Read the situation again — who came to help?`},{id:`l2-mq-03`,type:`fill-blank`,skill:`vocabulary`,topic:`Complete the Sentence`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`Mali fell off her bicycle and`,after:`her knee.`,answers:[`hurt`],explanation:`We use "hurt" with a body part to describe an injury, like "hurt her knee."`,explanationThai:`เราใช้คำว่า "hurt" ร่วมกับส่วนของร่างกาย เพื่ออธิบายการบาดเจ็บ เช่น "hurt her knee" (เข่าเจ็บ)`,hint1:`This word describes pain or injury.`,hint2:`It is the same word used for "hurt his arm."`,example:`Tom hurt his leg when he fell from the tree.`,points:10,feedbackCorrect:`Correct — "hurt" fits perfectly.`,feedbackIncorrect:`What word means "was injured"?`},{id:`l2-mq-04`,type:`match`,skill:`vocabulary`,topic:`Situations & Pictures`,difficulty:`challenge`,prompt:`Match each situation to the correct picture.`,left:[{id:`s1`,label:`The children could not ride down the flooded road.`},{id:`s2`,label:`A boy climbed too high and fell from the tree.`},{id:`s3`,label:`The ambulance took the injured boy to hospital.`},{id:`s4`,label:`Smoke came from the car, so people got out fast.`}],right:[{id:`p1`,label:`🌊`},{id:`p2`,label:`🌳`},{id:`p3`,label:`🚑`},{id:`p4`,label:`🔥`}],pairs:{s1:`p1`,s2:`p2`,s3:`p3`,s4:`p4`},explanation:`Each situation matches a picture: flooded road = water wave, tree fall = tree, ambulance = ambulance, smoke = fire.`,explanationThai:`แต่ละสถานการณ์จับคู่กับภาพ: ถนนน้ำท่วม = คลื่นน้ำ, ตกจากต้นไม้ = ต้นไม้, รถพยาบาล = รถพยาบาล, ควันไฟ = ไฟ`,hint1:`Which picture shows tall branches?`,hint2:`Smoke is a clue for the fire picture.`,example:`Two fallen bicycles → 🚲`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A couple of pairs are wrong — read each situation again.`},{id:`l2-mq-05`,type:`sequence`,skill:`vocabulary`,topic:`Put Events in Order`,difficulty:`challenge`,presentation:`events`,prompt:`Put these events from the car fire in the correct order.`,items:[{id:`e1`,label:`Smoke came from under the car.`},{id:`e2`,label:`The driver stopped the car and got out.`},{id:`e3`,label:`Someone called the emergency services.`},{id:`e4`,label:`The firefighter put out the fire.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`First smoke appears, then the driver stops and gets out, then someone calls for help, and finally the firefighter puts out the fire.`,explanationThai:`ก่อนอื่นมีควันปรากฏขึ้น จากนั้นคนขับหยุดรถและออกมา แล้วมีคนโทรขอความช่วยเหลือ และสุดท้ายนักดับเพลิงดับไฟ`,hint1:`The driver must notice the smoke before doing anything else.`,hint2:`The firefighter can only put out the fire after arriving, which is after the call.`,example:`Heavy rain falls → the road floods → cars stop → people call for help.`,points:16,feedbackCorrect:`Great — that is the correct order!`,feedbackIncorrect:`Think about what the driver notices first.`},{id:`l2-mq-06`,type:`error-correction`,skill:`vocabulary`,topic:`Fix the Mistake`,difficulty:`medium`,prompt:`This sentence has one wrong word. Find it and fix it.`,sentence:`The firefighter checked the driver's arm at the hospital.`,wrongWord:`firefighter`,correctWord:`paramedic`,explanation:`A paramedic checks a person's injuries, especially at a hospital. A firefighter's job is to put out fires and rescue people.`,explanationThai:`เจ้าหน้าที่พยาบาลฉุกเฉินจะตรวจดูการบาดเจ็บของคน โดยเฉพาะที่โรงพยาบาล ส่วนนักดับเพลิงมีหน้าที่ดับไฟและช่วยเหลือผู้คน`,hint1:`Who checks arms and injuries, not flames?`,hint2:`This worker often wears a different uniform from a firefighter.`,example:`"The paramedic checked the injured person." → correct as is.`,points:12,feedbackCorrect:`Correct — "paramedic" is the right word here.`,feedbackIncorrect:`Think about who checks injuries at a hospital.`},{id:`l2-mq-07`,type:`mcq`,skill:`vocabulary`,topic:`Getting Help`,difficulty:`challenge`,prompt:`A group of friends is walking home when they see a car stopped in the middle of a flooded road. What is the best sentence to describe what happened?`,options:[`The road was flooded, so the car could not pass.`,`She hurt her arm.`,`They went swimming in the pool.`,`He climbed the tree.`],correctIndex:0,explanation:`A car stopped in a flooded road is best described by "The road was flooded, so the car could not pass."`,explanationThai:`รถที่หยุดอยู่บนถนนที่น้ำท่วมอธิบายได้ดีที่สุดว่า "ถนนน้ำท่วม รถจึงผ่านไม่ได้"`,hint1:`Focus on the road and the water, not an injury.`,hint2:`The other options do not match a flooded road.`,example:`Smoke from under the hood → There was a fire in the car.`,points:12,feedbackCorrect:`Correct — the flood stopped the car.`,feedbackIncorrect:`Think about what the water on the road caused.`},{id:`l2-mq-08`,type:`fill-blank`,skill:`vocabulary`,topic:`Complete the Sentence`,difficulty:`challenge`,prompt:`Complete the sentence with the correct word.`,before:`After the accident, they`,after:`him to hospital in an ambulance.`,answers:[`took`],explanation:`"Took ... to hospital" describes how people got help for someone who was badly hurt.`,explanationThai:`"took ... to hospital" (พาไปโรงพยาบาล) อธิบายว่าผู้คนช่วยเหลือคนที่บาดเจ็บสาหัสอย่างไร`,hint1:`This is the past tense of "take".`,hint2:`It describes moving someone from one place to another.`,example:`They called the emergency services when they saw the fire.`,points:12,feedbackCorrect:`Correct — "took" fits perfectly.`,feedbackIncorrect:`What is the past tense of "take"?`}]},summary:{keyTakeaways:[`Use 'had an accident' or 'There was a fire / flood' to describe what suddenly happened.`,`Use 'hurt' with a body part, like 'hurt her arm,' to describe an injury.`,`Use 'called the emergency services' or 'took him to hospital' to describe how people got help.`,`Firefighters put out fires and rescue people, while paramedics check and help injured people — use the right worker for the right job.`],keyTakeawaysThai:[`ใช้ 'had an accident' หรือ 'There was a fire / flood' เพื่ออธิบายว่าเกิดอะไรขึ้นอย่างกะทันหัน`,`ใช้ 'hurt' ร่วมกับส่วนของร่างกาย เช่น 'hurt her arm' เพื่ออธิบายการบาดเจ็บ`,`ใช้ 'called the emergency services' หรือ 'took him to hospital' เพื่ออธิบายว่าผู้คนได้รับความช่วยเหลืออย่างไร`,`นักดับเพลิงดับไฟและช่วยเหลือผู้คน ส่วนเจ้าหน้าที่พยาบาลฉุกเฉินตรวจดูและช่วยเหลือผู้บาดเจ็บ — ใช้เจ้าหน้าที่ให้ตรงกับหน้าที่`]}}},Di={id:`l3-past-continuous-affirmative`,number:3,title:`Past Continuous — Affirmative`,subtitle:`Learn how to use was and were with -ing verbs to talk about actions in progress in the past.`,skillCategory:`grammar`,estimatedMinutes:22,stages:{warmup:{promptEn:`Look at this picture in your mind: at exactly 5 o'clock yesterday, what were you doing? Were you eating dinner? Playing outside? Doing homework? Tell a partner one sentence.`,promptThai:`ลองนึกภาพ: เมื่อวานตอน 5 โมงเย็นพอดี คุณกำลังทำอะไรอยู่? กำลังกินข้าวเย็น? เล่นข้างนอก? ทำการบ้าน? บอกเพื่อนหนึ่งประโยค`,hook:`We use a special tense called the past continuous to talk about actions that were happening at a certain time in the past.`},learn:{intro:`The past continuous tense tells us about an action that was in progress at a certain time in the past. We make it with was or were and a verb ending in -ing.`,introThai:`Past continuous tense บอกเล่าการกระทำที่กำลังดำเนินอยู่ ณ เวลาหนึ่งในอดีต สร้างประโยคด้วย was หรือ were และกริยาเติม -ing`,points:[{title:`Form: subject + was/were + verb-ing`,body:`To make the past continuous, use was or were followed by the -ing form of the verb.`,bodyThai:`การสร้างประโยค past continuous ใช้ was หรือ were ตามด้วยกริยาเติม -ing`},{title:`Was or were?`,body:`Use was with I, he, she, and it. Use were with you, we, and they — just like with is/am and are.`,bodyThai:`ใช้ was กับ I, he, she, it และใช้ were กับ you, we, they`},{title:`Meaning: an action in progress`,body:`The past continuous describes an activity that was happening at a particular moment in the past — something already in progress at that time.`,bodyThai:`past continuous ใช้บอกกิจกรรมที่กำลังดำเนินอยู่ในช่วงเวลาหนึ่งของอดีต`},{title:`Spelling the -ing form`,body:`Most verbs just add -ing (play → playing). Verbs ending in e usually drop the e (ride → riding). Short verbs ending in one vowel + one consonant often double the consonant (run → running).`,bodyThai:`กริยาส่วนใหญ่เติม -ing ได้เลย บางคำต้องตัด e ออกก่อน และบางคำต้องเพิ่มพยัญชนะซ้ำก่อนเติม -ing`}],subjectForms:[{subject:`I`,form:`was`},{subject:`He`,form:`was`},{subject:`She`,form:`was`},{subject:`It`,form:`was`},{subject:`You`,form:`were`},{subject:`We`,form:`were`},{subject:`They`,form:`were`}],rules:[{title:`Rule 1: Add -ing`,examples:[`play → playing`,`climb → climbing`,`sing → singing`,`read → reading`]},{title:`Rule 2: Remove the final e, add -ing`,examples:[`ride → riding`,`take → taking`,`make → making`,`write → writing`]},{title:`Rule 3: Double the final consonant`,examples:[`run → running`,`swim → swimming`,`sit → sitting`,`get → getting`]}]},examples:{items:[{text:`I was playing football at five o'clock.`,noteThai:`ฉันกำลังเล่นฟุตบอลตอนห้าโมง`},{text:`She was reading a book.`,noteThai:`เธอกำลังอ่านหนังสือ`},{text:`We were riding our bikes.`,noteThai:`เรากำลังขี่จักรยาน`},{text:`They were running in a race.`,noteThai:`พวกเขากำลังวิ่งแข่ง`},{text:`He was climbing a tree.`,noteThai:`เขากำลังปีนต้นไม้`},{text:`The children were swimming.`,noteThai:`เด็กๆกำลังว่ายน้ำ`},{text:`You were writing a letter.`,noteThai:`คุณกำลังเขียนจดหมาย`},{text:`It was raining all morning.`,noteThai:`ฝนกำลังตกตลอดเช้า`}]},guided:{questions:[{id:`l3-g-01`,type:`mcq`,skill:`grammar`,topic:`Was/Were`,difficulty:`easy`,prompt:`I ___ playing football at five o'clock.`,promptThai:`ฉัน ___ กำลังเล่นฟุตบอลตอนห้าโมง`,options:[`was`,`were`],correctIndex:0,explanation:`We use was with the subject I.`,explanationThai:`เราใช้ was กับประธาน I`,hint1:`I is a singular subject.`,hint2:`Was goes with I, he, she, and it.`,example:`He was watching TV.`,points:8,feedbackCorrect:`Yes — I was is correct.`,feedbackIncorrect:`Remember: I always takes was, not were.`},{id:`l3-g-02`,type:`mcq`,skill:`grammar`,topic:`Was/Were`,difficulty:`easy`,prompt:`They ___ swimming in the lake.`,promptThai:`พวกเขา ___ กำลังว่ายน้ำในทะเลสาบ`,options:[`was`,`were`],correctIndex:1,explanation:`We use were with the subject they.`,explanationThai:`เราใช้ were กับประธาน they`,hint1:`They is a plural subject.`,hint2:`Were goes with you, we, and they.`,example:`We were riding our bikes.`,points:8,feedbackCorrect:`Correct — they were is right.`,feedbackIncorrect:`Plural subjects like they use were, not was.`},{id:`l3-g-03`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`easy`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`He was`,after:`the tree. (climb)`,answers:[`climbing`],explanation:`For most verbs, we just add -ing: climb → climbing.`,explanationThai:`กริยาส่วนใหญ่แค่เติม -ing: climb → climbing`,hint1:`This verb follows the simple rule — just add -ing.`,hint2:`Climb has no silent e and no double consonant needed.`,example:`play → playing`,points:8,feedbackCorrect:`Correct — climbing!`,feedbackIncorrect:`Just add -ing to climb.`},{id:`l3-g-04`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`easy`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`We were`,after:`our bikes in the park. (ride)`,answers:[`riding`],explanation:`Verbs ending in e usually drop the e before adding -ing: ride → riding.`,explanationThai:`กริยาที่ลงท้ายด้วย e ให้ตัด e ออกก่อนเติม -ing: ride → riding`,hint1:`Look carefully at the last letter of 'ride'.`,hint2:`Drop the silent e before adding -ing.`,example:`make → making`,points:9,feedbackCorrect:`Correct — riding!`,feedbackIncorrect:`Remember to drop the e in ride before adding -ing.`},{id:`l3-g-05`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous Sentences`,difficulty:`medium`,prompt:`Complete the sentence using was/were and the verb in brackets.`,promptThai:`เติมประโยคให้สมบูรณ์โดยใช้ was/were กับกริยาในวงเล็บ`,before:`The children`,after:`in the pool at six o'clock. (swim)`,answers:[`were swimming`],explanation:`Children is plural, so we use were, and swim doubles the m: were swimming.`,explanationThai:`children เป็นพหูพจน์ ใช้ were และ swim ต้องเพิ่ม m ซ้ำ: were swimming`,hint1:`Children takes were, not was.`,hint2:`Swim doubles its final consonant: swimming.`,example:`The dog was running in the park.`,points:11,feedbackCorrect:`Correct — were swimming!`,feedbackIncorrect:`Check the subject (were) and the spelling of swim + ing.`},{id:`l3-g-06`,type:`word-order`,skill:`grammar`,topic:`Word Order`,difficulty:`medium`,prompt:`Put the words in order to make a sentence.`,promptThai:`เรียงคำให้เป็นประโยคที่ถูกต้อง`,words:[`was`,`He`,`climbing`,`a`,`tree`],correctOrder:[`He`,`was`,`climbing`,`a`,`tree`],explanation:`The word order is: subject + was/were + verb-ing + the rest of the sentence.`,explanationThai:`ลำดับคำคือ: ประธาน + was/were + กริยาเติม -ing + ส่วนที่เหลือของประโยค`,hint1:`Start with the subject, He.`,hint2:`Was comes right after the subject.`,example:`She was reading a book.`,points:11,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Remember: subject first, then was/were, then the -ing verb.`},{id:`l3-g-07`,type:`match`,skill:`grammar`,topic:`Sentences & Pictures`,difficulty:`easy`,prompt:`Match each sentence to the correct picture.`,promptThai:`จับคู่ประโยคกับภาพที่ถูกต้อง`,left:[{id:`s1`,label:`She was reading a book.`},{id:`s2`,label:`They were riding their bikes.`},{id:`s3`,label:`He was swimming.`},{id:`s4`,label:`We were singing a song.`}],right:[{id:`e1`,label:`📖`},{id:`e2`,label:`🚲`},{id:`e3`,label:`🏊`},{id:`e4`,label:`🎤`}],pairs:{s1:`e1`,s2:`e2`,s3:`e3`,s4:`e4`},explanation:`Each sentence describes an action shown in one picture.`,explanationThai:`แต่ละประโยคอธิบายการกระทำที่ตรงกับภาพหนึ่งภาพ`,hint1:`Look for key verbs like reading, riding, swimming, and singing.`,hint2:`A microphone usually means singing.`,example:`He was cooking dinner. → 🍳`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A few pairs are wrong — read the sentences again.`},{id:`l3-g-08`,type:`error-correction`,skill:`grammar`,topic:`Error Correction`,difficulty:`medium`,prompt:`Find and correct the mistake in this sentence.`,promptThai:`หาและแก้ไขคำที่ผิดในประโยคนี้`,sentence:`She were watching TV at seven o'clock.`,wrongWord:`were`,correctWord:`was`,explanation:`She is singular, so it needs was, not were.`,explanationThai:`She เป็นเอกพจน์ ต้องใช้ was ไม่ใช่ were`,hint1:`Look at the subject of the sentence.`,hint2:`Singular subjects like she use was.`,example:`They was playing outside. → They were playing outside.`,points:12,feedbackCorrect:`Correct — was is right for she.`,feedbackIncorrect:`Check whether the subject needs was or were.`},{id:`l3-g-09`,type:`mcq`,skill:`grammar`,topic:`Describing a Scene`,difficulty:`medium`,prompt:`It is four o'clock. Ben has a football at his feet and he is running fast. What was Ben doing  e แล้วเติม -ing: writing`,hint1:`Look at the last letter of 'write'.`,hint2:`Drop the silent e before adding -ing.`,example:`take → taking`,points:10,feedbackCorrect:`Correct — writing!`,feedbackIncorrect:`Remember to drop the e in write.`},{id:`l3-i-06`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`She was`,after:`a cake in the kitchen. (make)`,answers:[`making`],explanation:`Make ends in e, so we drop the e and add -ing: making.`,explanationThai:`make ลงท้ายด้วย e จึงตัด e แล้วเติม -ing: making`,hint1:`Make follows the same rule as ride and write.`,hint2:`Drop the e before adding -ing.`,example:`ride → riding`,points:10,feedbackCorrect:`Correct — making!`,feedbackIncorrect:`Drop the e in make before adding -ing.`},{id:`l3-i-07`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`The cat was`,after:`on the wall. (sit)`,answers:[`sitting`],explanation:`Sit is a short verb, so we double the final consonant: sitting.`,explanationThai:`sit เป็นกริยาสั้น จึงเพิ่มพยัญชนะตัวท้ายซ้ำ: sitting`,hint1:`Sit has one vowel and one consonant at the end.`,hint2:`Double the t before adding -ing.`,example:`get → getting`,points:10,feedbackCorrect:`Correct — sitting!`,feedbackIncorrect:`Remember to double the t in sit.`},{id:`l3-i-08`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`We were`,after:`ready for school. (get)`,answers:[`getting`],explanation:`Get doubles its final consonant: getting.`,explanationThai:`get เพิ่มพยัญชนะตัวท้ายซ้ำ: getting`,hint1:`Get has one vowel and one consonant at the end, like sit and run.`,hint2:`Double the t before adding -ing.`,example:`run → running`,points:10,feedbackCorrect:`Correct — getting!`,feedbackIncorrect:`Double the final t in get.`},{id:`l3-i-09`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous Sentences`,difficulty:`medium`,prompt:`Complete the sentence using was/were and the verb in brackets.`,promptThai:`เติมประโยคให้สมบูรณ์โดยใช้ was/were กับกริยาในวงเล็บ`,before:`My dad`,after:`the car when it started to rain. (wash)`,answers:[`was washing`],explanation:`My dad is singular, so we use was, and wash just adds -ing: was washing.`,explanationThai:`my dad เป็นเอกพจน์ ใช้ was และ wash แค่เติม -ing: was washing`,hint1:`My dad is one person — use was.`,hint2:`Wash follows the simple rule: just add -ing.`,example:`My mum was cooking dinner.`,points:12,feedbackCorrect:`Correct — was washing!`,feedbackIncorrect:`Check the subject (was) and the verb form (washing).`},{id:`l3-i-10`,type:`word-order`,skill:`grammar`,topic:`Word Order`,difficulty:`medium`,prompt:`Put the words in order to make a sentence.`,promptThai:`เรียงคำให้เป็นประโยคที่ถูกต้อง`,words:[`dancing`,`was`,`She`,`at`,`the`,`party`],correctOrder:[`She`,`was`,`dancing`,`at`,`the`,`party`],explanation:`Subject + was + verb-ing + the rest of the sentence: She was dancing at the party.`,explanationThai:`ประธาน + was + กริยาเติม -ing + ส่วนที่เหลือ: She was dancing at the party`,hint1:`She is a singular subject, so look for was.`,hint2:`Was comes right after She.`,example:`He was singing in the choir.`,points:12,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Start with She, then was, then dancing.`},{id:`l3-i-11`,type:`word-order`,skill:`grammar`,topic:`Word Order`,difficulty:`challenge`,prompt:`Put the words in order to make a sentence.`,promptThai:`เรียงคำให้เป็นประโยคที่ถูกต้อง`,words:[`swimming`,`were`,`They`,`in`,`the`,`sea`],correctOrder:[`They`,`were`,`swimming`,`in`,`the`,`sea`],explanation:`They is plural, so it takes were: They were swimming in the sea.`,explanationThai:`they เป็นพหูพจน์ ใช้ were: They were swimming in the sea`,hint1:`They is a plural subject, so look for were.`,hint2:`Were comes right after They.`,example:`We were playing in the garden.`,points:13,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Start with They, then were, then swimming.`},{id:`l3-i-12`,type:`match`,skill:`grammar`,topic:`Sentences & Pictures`,difficulty:`medium`,prompt:`Match each sentence to the correct picture.`,promptThai:`จับคู่ประโยคกับภาพที่ถูกต้อง`,left:[{id:`s1`,label:`He was cooking dinner.`},{id:`s2`,label:`She was drawing a picture.`},{id:`s3`,label:`They were fishing by the river.`},{id:`s4`,label:`We were driving to the beach.`}],right:[{id:`e1`,label:`🍳`},{id:`e2`,label:`🎨`},{id:`e3`,label:`🎣`},{id:`e4`,label:`🚗`}],pairs:{s1:`e1`,s2:`e2`,s3:`e3`,s4:`e4`},explanation:`Each sentence matches a picture showing that action.`,explanationThai:`แต่ละประโยคตรงกับภาพที่แสดงการกระทำนั้น`,hint1:`A frying pan usually means cooking.`,hint2:`A fishing rod means fishing.`,example:`She was singing a song. → 🎤`,points:14,feedbackCorrect:`All matched!`,feedbackIncorrect:`Check the pictures again.`},{id:`l3-i-13`,type:`error-correction`,skill:`grammar`,topic:`Error Correction`,difficulty:`medium`,prompt:`Find and correct the mistake in this sentence.`,promptThai:`หาและแก้ไขคำที่ผิดในประโยคนี้`,sentence:`They was playing in the garden.`,wrongWord:`was`,correctWord:`were`,explanation:`They is plural, so it needs were, not was.`,explanationThai:`they เป็นพหูพจน์ ต้องใช้ were ไม่ใช่ was`,hint1:`Look at the subject — how many people?`,hint2:`Plural subjects use were.`,example:`He were sleeping. → He was sleeping.`,points:11,feedbackCorrect:`Correct — were is right for they.`,feedbackIncorrect:`They is plural — it needs were.`},{id:`l3-i-14`,type:`error-correction`,skill:`grammar`,topic:`Error Correction`,difficulty:`challenge`,prompt:`Find and correct the mistake in this sentence.`,promptThai:`หาและแก้ไขคำที่ผิดในประโยคนี้`,sentence:`I were reading my favourite book.`,wrongWord:`were`,correctWord:`was`,explanation:`I always takes was in the past continuous, never were.`,explanationThai:`I ใช้ was เสมอใน past continuous ไม่ใช่ were`,hint1:`I is a singular subject.`,hint2:`Was goes with I, not were.`,example:`We were watching a movie.`,points:13,feedbackCorrect:`Correct — was is right for I.`,feedbackIncorrect:`I always takes was, not were.`},{id:`l3-i-15`,type:`mcq`,skill:`grammar`,topic:`Describing a Scene`,difficulty:`challenge`,prompt:`At eight o'clock, Mira had a paintbrush in her hand and paint on the paper. What was Mira doing at eight o'clock?`,promptThai:`ตอนสองทุ่ม มิร่าถือพู่กันและมีสีอยู่บนกระดาษ มิร่ากำลังทำอะไรตอนสองทุ่ม?`,options:[`She was painting a picture.`,`She was cooking dinner.`,`She was reading a book.`,`She was riding a bike.`],correctIndex:0,explanation:`A paintbrush and paint on paper show that Mira was painting a picture.`,explanationThai:`พู่กันและสีบนกระดาษบอกว่ามิร่ากำลังวาดภาพ`,hint1:`Think about what a paintbrush and paper are used for.`,hint2:`None of the other actions match a paintbrush.`,example:`A boy with a fishing rod by the river → He was fishing.`,points:13,feedbackCorrect:`Correct — Mira was painting!`,feedbackIncorrect:`Look again at the clues: a paintbrush and paint.`},{id:`l3-i-16`,type:`mcq`,skill:`grammar`,topic:`Was/Were`,difficulty:`medium`,prompt:`It ___ raining hard when we left the house.`,promptThai:`ฝน ___ ตกหนักตอนที่เราออกจากบ้าน`,options:[`was`,`were`],correctIndex:0,explanation:`It is singular, so we use was.`,explanationThai:`it เป็นเอกพจน์ ใช้ was`,hint1:`It refers to the weather, which is singular.`,hint2:`Was goes with I, he, she, and it.`,example:`It was snowing all day.`,points:9,feedbackCorrect:`Correct!`,feedbackIncorrect:`It takes was, not were.`},{id:`l3-i-17`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`challenge`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`The boys were`,after:`in the river. (swim)`,answers:[`swimming`],explanation:`Swim doubles its final consonant before -ing: swimming.`,explanationThai:`swim เพิ่มพยัญชนะตัวท้ายซ้ำก่อนเติม -ing: swimming`,hint1:`Swim has one vowel and one consonant at the end.`,hint2:`Double the m before adding -ing.`,example:`run → running`,points:12,feedbackCorrect:`Correct — swimming!`,feedbackIncorrect:`Remember to double the m in swim.`}]},miniQuiz:{questions:[{id:`l3-mq-01`,type:`mcq`,skill:`grammar`,topic:`Was/Were`,difficulty:`easy`,prompt:`He ___ climbing a tree.`,promptThai:`เขา ___ กำลังปีนต้นไม้`,options:[`was`,`were`],correctIndex:0,explanation:`He is singular, so we use was.`,explanationThai:`he เป็นเอกพจน์ ใช้ was`,hint1:`He is one person.`,hint2:`Was goes with he, she, and it.`,example:`She was singing.`,points:8,feedbackCorrect:`Correct!`,feedbackIncorrect:`He takes was, not were.`},{id:`l3-mq-02`,type:`mcq`,skill:`grammar`,topic:`Was/Were`,difficulty:`medium`,prompt:`We ___ riding our bikes in the park.`,promptThai:`เรา ___ กำลังขี่จักรยานในสวนสาธารณะ`,options:[`was`,`were`],correctIndex:1,explanation:`We is plural, so we use were.`,explanationThai:`we เป็นพหูพจน์ ใช้ were`,hint1:`We refers to more than one person.`,hint2:`Were goes with you, we, and they.`,example:`They were playing football.`,points:9,feedbackCorrect:`Correct!`,feedbackIncorrect:`We takes were, not was.`},{id:`l3-mq-03`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`The girls were`,after:`in the garden. (play)`,answers:[`playing`],explanation:`Play just adds -ing: playing.`,explanationThai:`play แค่เติม -ing: playing`,hint1:`Play follows the simple rule.`,hint2:`Just add -ing — no letters change.`,example:`read → reading`,points:9,feedbackCorrect:`Correct — playing!`,feedbackIncorrect:`Just add -ing to play.`},{id:`l3-mq-04`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`medium`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`I was`,after:`a photo of the sunset. (take)`,answers:[`taking`],explanation:`Take ends in e, so we drop the e and add -ing: taking.`,explanationThai:`take ลงท้ายด้วย e จึงตัด e แล้วเติม -ing: taking`,hint1:`Take follows the same rule as ride and make.`,hint2:`Drop the e before adding -ing.`,example:`write → writing`,points:10,feedbackCorrect:`Correct — taking!`,feedbackIncorrect:`Drop the e in take before adding -ing.`},{id:`l3-mq-05`,type:`word-order`,skill:`grammar`,topic:`Word Order`,difficulty:`medium`,prompt:`Put the words in order to make a sentence.`,promptThai:`เรียงคำให้เป็นประโยคที่ถูกต้อง`,words:[`reading`,`was`,`She`,`a`,`book`],correctOrder:[`She`,`was`,`reading`,`a`,`book`],explanation:`Subject + was + verb-ing + the rest: She was reading a book.`,explanationThai:`ประธาน + was + กริยาเติม -ing: She was reading a book`,hint1:`She is singular, so look for was.`,hint2:`Was comes right after She.`,example:`He was writing a letter.`,points:11,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Start with She, then was, then reading.`},{id:`l3-mq-06`,type:`match`,skill:`grammar`,topic:`Sentences & Pictures`,difficulty:`medium`,prompt:`Match each sentence to the correct picture.`,promptThai:`จับคู่ประโยคกับภาพที่ถูกต้อง`,left:[{id:`s1`,label:`He was singing a song.`},{id:`s2`,label:`They were running in a race.`},{id:`s3`,label:`She was writing a letter.`},{id:`s4`,label:`We were swimming in the sea.`}],right:[{id:`e1`,label:`🎤`},{id:`e2`,label:`🏃`},{id:`e3`,label:`✉️`},{id:`e4`,label:`🏊`}],pairs:{s1:`e1`,s2:`e2`,s3:`e3`,s4:`e4`},explanation:`Each sentence matches a picture showing that action.`,explanationThai:`แต่ละประโยคตรงกับภาพที่แสดงการกระทำนั้น`,hint1:`A microphone usually means singing.`,hint2:`An envelope means writing a letter.`,example:`He was climbing a tree. → 🧗`,points:14,feedbackCorrect:`All matched!`,feedbackIncorrect:`Check the pictures again.`},{id:`l3-mq-07`,type:`error-correction`,skill:`grammar`,topic:`Error Correction`,difficulty:`medium`,prompt:`Find and correct the mistake in this sentence.`,promptThai:`หาและแก้ไขคำที่ผิดในประโยคนี้`,sentence:`She were sleeping on the sofa.`,wrongWord:`were`,correctWord:`was`,explanation:`She is singular, so it needs was, not were.`,explanationThai:`she เป็นเอกพจน์ ต้องใช้ was`,hint1:`Look at the subject.`,hint2:`Singular subjects use was.`,example:`They was eating lunch. → They were eating lunch.`,points:12,feedbackCorrect:`Correct — was is right for she.`,feedbackIncorrect:`She is singular — it needs was.`},{id:`l3-mq-08`,type:`mcq`,skill:`grammar`,topic:`Describing a Scene`,difficulty:`challenge`,prompt:`At six o'clock, Tom had a fishing rod and stood quietly by the river. What was Tom doing at six o'clock?`,promptThai:`ตอนหกโมง ทอมถือคันเบ็ดและยืนเงียบๆ ริมแม่น้ำ ทอมกำลังทำอะไรตอนหกโมง?`,options:[`He was fishing.`,`He was swimming.`,`He was reading.`,`He was cooking.`],correctIndex:0,explanation:`A fishing rod by the river shows that Tom was fishing.`,explanationThai:`คันเบ็ดริมแม่น้ำบอกว่าทอมกำลังตกปลา`,hint1:`Think about what a fishing rod is used for.`,hint2:`None of the other actions match a fishing rod.`,example:`A boy with a football, running → He was playing football.`,points:13,feedbackCorrect:`Correct — Tom was fishing!`,feedbackIncorrect:`Look again at the clue: a fishing rod.`},{id:`l3-mq-09`,type:`fill-blank`,skill:`grammar`,topic:`Verb-ing Spelling`,difficulty:`challenge`,prompt:`Write the correct -ing form of the verb in brackets.`,promptThai:`เติมรูป -ing ของกริยาในวงเล็บให้ถูกต้อง`,before:`The children were`,after:`under the tree. (sit)`,answers:[`sitting`],explanation:`Sit doubles its final consonant before -ing: sitting.`,explanationThai:`sit เพิ่มพยัญชนะตัวท้ายซ้ำก่อนเติม -ing: sitting`,hint1:`Sit has one vowel and one consonant at the end.`,hint2:`Double the t before adding -ing.`,example:`get → getting`,points:12,feedbackCorrect:`Correct — sitting!`,feedbackIncorrect:`Remember to double the t in sit.`},{id:`l3-mq-10`,type:`mcq`,skill:`grammar`,topic:`Was/Were`,difficulty:`medium`,prompt:`It ___ snowing all afternoon.`,promptThai:`หิมะ ___ ตกตลอดบ่าย`,options:[`was`,`were`],correctIndex:0,explanation:`It is singular, so we use was.`,explanationThai:`it เป็นเอกพจน์ ใช้ was`,hint1:`It refers to the weather.`,hint2:`Was goes with I, he, she, and it.`,example:`It was raining this morning.`,points:9,feedbackCorrect:`Correct!`,feedbackIncorrect:`It takes was, not were.`}]},summary:{keyTakeaways:[`Use was with I, he, she, and it. Use were with you, we, and they.`,`Past continuous = subject + was/were + verb-ing.`,`We use the past continuous to talk about an action that was happening at a certain time in the past.`,`Remember the spelling rules: add -ing, drop the final e and add -ing, or double the final consonant and add -ing.`],keyTakeawaysThai:[`ใช้ was กับ I, he, she, it และใช้ were กับ you, we, they`,`Past continuous = ประธาน + was/were + กริยาเติม -ing`,`เราใช้ past continuous พูดถึงเหตุการณ์ที่กำลังเกิดขึ้น ณ เวลาหนึ่งในอดีต`,`จำกฎการสะกดคำ: เติม -ing, ตัด e แล้วเติม -ing, หรือเพิ่มพยัญชนะตัวท้ายซ้ำแล้วเติม -ing`]}}},Oi={id:`l4-past-continuous-negatives-questions`,number:4,title:`Past Continuous — Negatives and Questions`,subtitle:`Learn how to make negative sentences and ask questions with the past continuous.`,skillCategory:`grammar`,estimatedMinutes:24,stages:{warmup:{promptEn:`Think about last night at eight o'clock. What were you NOT doing? Were you sleeping? Doing homework? Tell a partner one thing you weren't doing.`,promptThai:`นึกถึงเมื่อคืนตอนสองทุ่ม คุณไม่ได้กำลังทำอะไร? กำลังนอนหลับอยู่ไหม? ทำการบ้านไหม? บอกเพื่อนหนึ่งอย่างที่คุณไม่ได้ทำ`,hook:`We can use the past continuous to say what was NOT happening, and to ask questions about the past too.`},learn:{intro:`We can make the past continuous negative by adding not, and we can ask questions by changing the word order. This lesson teaches you how to talk about what was NOT happening, and how to ask and answer questions about the past.`,introThai:`เราสามารถทำประโยค past continuous ให้เป็นปฏิเสธโดยเติม not และตั้งคำถามโดยเปลี่ยนลำดับคำ บทเรียนนี้สอนวิธีพูดถึงสิ่งที่ไม่ได้เกิดขึ้น และวิธีถามตอบคำถามเกี่ยวกับอดีต`,points:[{title:`Negative form`,body:`To make the past continuous negative, put not after was/were: was not (wasn't) or were not (weren't).`,bodyThai:`เติม not หลัง was/were เพื่อทำประโยคปฏิเสธ: was not (wasn't) หรือ were not (weren't)`},{title:`Yes/No question word order`,body:`To ask a yes/no question, put was/were before the subject: Was + subject + verb-ing...?`,bodyThai:`คำถาม Yes/No ให้นำ was/were มาไว้หน้าประธาน: Was + ประธาน + กริยาเติม -ing...?`},{title:`Wh-question word order`,body:`For wh-questions, put the question word first, then was/were, then the subject: What + was/were + subject + verb-ing...?`,bodyThai:`คำถาม Wh ให้ขึ้นต้นด้วยคำคำถาม ตามด้วย was/were แล้วตามด้วยประธาน`},{title:`Short answers`,body:`Answer yes/no questions with was/were, not a full sentence: Yes, he was. / No, they weren't.`,bodyThai:`ตอบคำถาม Yes/No ด้วย was/were สั้นๆ ไม่ต้องพูดเต็มประโยค`}],rules:[{title:`Negative contractions`,examples:[`was not → wasn't`,`were not → weren't`]}]},examples:{items:[{text:`He wasn't watching TV.`,noteThai:`เขาไม่ได้กำลังดูทีวี`},{text:`She wasn't sleeping.`,noteThai:`เธอไม่ได้กำลังนอนหลับ`},{text:`They weren't playing outside.`,noteThai:`พวกเขาไม่ได้กำลังเล่นข้างนอก`},{text:`Was he swimming? Yes, he was.`,noteThai:`เขากำลังว่ายน้ำอยู่ไหม? ใช่ เขากำลังว่ายน้ำ`},{text:`Were they doing their homework? No, they weren't.`,noteThai:`พวกเขากำลังทำการบ้านอยู่ไหม? ไม่ พวกเขาไม่ได้กำลังทำ`},{text:`What was she doing? She was reading a book.`,noteThai:`เธอกำลังทำอะไรอยู่? เธอกำลังอ่านหนังสือ`},{text:`What were you doing yesterday afternoon? I was doing my homework.`,noteThai:`เมื่อบ่ายวานนี้คุณกำลังทำอะไรอยู่? ฉันกำลังทำการบ้าน`}]},guided:{questions:[{id:`l4-g-01`,type:`fill-blank`,skill:`grammar`,topic:`Negatives`,difficulty:`easy`,prompt:`Make the sentence negative. (He was watching TV.)`,promptThai:`เปลี่ยนประโยคให้เป็นปฏิเสธ (He was watching TV.)`,before:`He`,after:`TV.`,answers:[`wasn't watching`,`was not watching`],explanation:`To make the sentence negative, add not after was: wasn't watching.`,explanationThai:`เติม not หลัง was เพื่อทำประโยคปฏิเสธ: wasn't watching`,hint1:`Use the contraction wasn't.`,hint2:`Wasn't = was not.`,example:`She was sleeping. → She wasn't sleeping.`,points:10,feedbackCorrect:`Correct — wasn't watching!`,feedbackIncorrect:`Add not after was: wasn't watching.`},{id:`l4-g-02`,type:`fill-blank`,skill:`grammar`,topic:`Negatives`,difficulty:`easy`,prompt:`Make the sentence negative. (They were playing outside.)`,promptThai:`เปลี่ยนประโยคให้เป็นปฏิเสธ (They were playing outside.)`,before:`They`,after:`outside.`,answers:[`weren't playing`,`were not playing`],explanation:`For plural subjects, add not after were: weren't playing.`,explanationThai:`ประธานพหูพจน์เติม not หลัง were: weren't playing`,hint1:`Use the contraction weren't.`,hint2:`Weren't = were not.`,example:`We were doing homework. → We weren't doing homework.`,points:10,feedbackCorrect:`Correct — weren't playing!`,feedbackIncorrect:`Add not after were: weren't playing.`},{id:`l4-g-03`,type:`fill-blank`,skill:`grammar`,topic:`Questions`,difficulty:`medium`,prompt:`Turn this statement into a yes/no question. (She was reading.)`,promptThai:`เปลี่ยนประโยคบอกเล่าให้เป็นคำถาม Yes/No (She was reading.)`,before:``,after:`she reading?`,answers:[`Was`],explanation:`To make a yes/no question, move was/were to the front: Was she reading?`,explanationThai:`ย้าย was/were ไปไว้หน้าประโยคเพื่อสร้างคำถาม Yes/No: Was she reading?`,hint1:`She is singular, so use was.`,hint2:`Was comes before the subject in a question.`,example:`They were playing. → Were they playing?`,points:11,feedbackCorr
