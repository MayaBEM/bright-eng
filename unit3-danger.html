eedbackCorrect:`Correct — were!`,feedbackIncorrect:`Use were, since they is plural.`}]},miniQuiz:{questions:[{id:`l4-mq-01`,type:`fill-blank`,skill:`grammar`,topic:`Negatives`,difficulty:`medium`,prompt:`Make the sentence negative. (He was watching a movie.)`,promptThai:`เปลี่ยนประโยคให้เป็นปฏิเสธ (He was watching a movie.)`,before:`He`,after:`a movie.`,answers:[`wasn't watching`,`was not watching`],explanation:`Add not after was: wasn't watching.`,explanationThai:`เติม not หลัง was: wasn't watching`,hint1:`He is singular — use wasn't.`,hint2:`Wasn't = was not.`,example:`She was cooking. → She wasn't cooking.`,points:10,feedbackCorrect:`Correct — wasn't watching!`,feedbackIncorrect:`Add not after was.`},{id:`l4-mq-02`,type:`fill-blank`,skill:`grammar`,topic:`Negatives`,difficulty:`medium`,prompt:`Make the sentence negative. (We were talking loudly.)`,promptThai:`เปลี่ยนประโยคให้เป็นปฏิเสธ (We were talking loudly.)`,before:`We`,after:`loudly.`,answers:[`weren't talking`,`were not talking`],explanation:`We is plural, so add not after were: weren't talking.`,explanationThai:`we เป็นพหูพจน์ เติม not หลัง were: weren't talking`,hint1:`We takes were.`,hint2:`Weren't = were not.`,example:`They were laughing. → They weren't laughing.`,points:10,feedbackCorrect:`Correct — weren't talking!`,feedbackIncorrect:`Add not after were.`},{id:`l4-mq-03`,type:`mcq`,skill:`grammar`,topic:`Short Answers`,difficulty:`medium`,prompt:`Was he swimming? Choose the correct short answer.`,promptThai:`Was he swimming? เลือกคำตอบสั้นที่ถูกต้อง`,options:[`Yes, he was.`,`Yes, he were.`,`Yes, he is.`,`Yes, he does.`],correctIndex:0,explanation:`Short answers use was to match a singular subject.`,explanationThai:`คำตอบสั้นใช้ was ให้ตรงกับประธานเอกพจน์`,hint1:`He is singular.`,hint2:`Match the question's verb form: was.`,example:`Were they playing? → Yes, they were.`,points:9,feedbackCorrect:`Correct!`,feedbackIncorrect:`Use was, since he is singular.`},{id:`l4-mq-04`,type:`word-order`,skill:`grammar`,topic:`Word Order`,difficulty:`medium`,prompt:`Put the words in order to make a question.`,promptThai:`เรียงคำให้เป็นประโยคคำถามที่ถูกต้อง`,words:[`Was`,`she`,`reading`,`?`],correctOrder:[`Was`,`she`,`reading`,`?`],explanation:`Questions start with was/were, then the subject, then the verb-ing.`,explanationThai:`ประโยคคำถามขึ้นต้นด้วย was/were ตามด้วยประธาน แล้วกริยาเติม -ing`,hint1:`She is singular, so it needs Was.`,hint2:`The question mark goes at the end.`,example:`Were they playing?`,points:11,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Start with Was, then she, then reading.`},{id:`l4-mq-05`,type:`match`,skill:`grammar`,topic:`Questions & Answers`,difficulty:`medium`,prompt:`Match each question to its correct answer.`,promptThai:`จับคู่คำถามกับคำตอบที่ถูกต้อง`,left:[{id:`q1`,label:`Was he sleeping?`},{id:`q2`,label:`Were you crying?`},{id:`q3`,label:`Was the baby crying?`},{id:`q4`,label:`Were the boys fighting?`}],right:[{id:`a1`,label:`No, he wasn't.`},{id:`a2`,label:`No, I wasn't.`},{id:`a3`,label:`Yes, she was.`},{id:`a4`,label:`Yes, they were.`}],pairs:{q1:`a1`,q2:`a2`,q3:`a3`,q4:`a4`},explanation:`Each answer's subject and verb form must match the question.`,explanationThai:`ประธานและรูปกริยาของคำตอบต้องตรงกับคำถาม`,hint1:`Match singular subjects with was/wasn't.`,hint2:`Match plural subjects with were/weren't.`,example:`Was it raining? → Yes, it was.`,points:15,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Check the subject and verb of each pair.`},{id:`l4-mq-06`,type:`fill-blank`,skill:`grammar`,topic:`Conversations`,difficulty:`medium`,prompt:`Complete the conversation with the correct word.`,promptThai:`เติมบทสนทนาให้สมบูรณ์ด้วยคำที่ถูกต้อง`,before:`A: What was he doing at noon?

t she was doing.)`,promptThai:`เติมคำถาม Wh ให้สมบูรณ์ (ถามว่าเธอกำลังทำอะไร)`,before:`What`,after:`she doing?`,answers:[`was`],explanation:`She is singular, so the wh-question uses was.`,explanationThai:`she เป็นเอกพจน์ คำถาม Wh จึงใช้ was`,hint1:`She takes was.`,hint2:`Was goes right after the question word.`,example:`What were they doing? → They were building a sandcastle.`,points:12,feedbackCorrect:`Correct — was!`,feedbackIncorrect:`Use was, since she is singular.`},{id:`l4-mq-10`,type:`mcq`,skill:`grammar`,topic:`Negatives`,difficulty:`medium`,prompt:`Choose the correct negative sentence.`,promptThai:`เลือกประโยคปฏิเสธที่ถูกต้อง`,options:[`They weren't playing outside.`,`They wasn't playing outside.`,`They isn't playing outside.`,`They don't playing outside.`],correctIndex:0,explanation:`They is plural, so the correct negative form is weren't.`,explanationThai:`they เป็นพหูพจน์ รูปปฏิเสธที่ถูกต้องคือ weren't`,hint1:`Plural subjects use weren't.`,hint2:`Weren't = were not.`,example:`He wasn't sleeping.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`They needs weren't, not wasn't.`},{id:`l4-mq-11`,type:`word-order`,skill:`grammar`,topic:`Word Order`,difficulty:`challenge`,prompt:`Put the words in order to make a question.`,promptThai:`เรียงคำให้เป็นประโยคคำถามที่ถูกต้อง`,words:[`doing`,`was`,`What`,`he`,`?`],correctOrder:[`What`,`was`,`he`,`doing`,`?`],explanation:`Wh-questions start with the question word, then was/were, then the subject, then the verb-ing.`,explanationThai:`คำถาม Wh ขึ้นต้นด้วยคำคำถาม ตามด้วย was/were ประธาน แล้วกริยาเติม -ing`,hint1:`What comes first.`,hint2:`Was comes right after What.`,example:`What were they doing?`,points:13,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Start with What, then was, then he, then doing.`},{id:`l4-mq-12`,type:`error-correction`,skill:`grammar`,topic:`Error Correction`,difficulty:`challenge`,prompt:`Find and correct the mistake in this sentence.`,promptThai:`หาและแก้ไขคำที่ผิดในประโยคนี้`,sentence:`Was you doing your homework?`,wrongWord:`Was`,correctWord:`Were`,explanation:`You always takes were, even for one person, so the question needs Were, not Was.`,explanationThai:`you ใช้ were เสมอแม้จะพูดถึงคนเดียว คำถามจึงต้องใช้ Were`,hint1:`You always takes were.`,hint2:`This is different from I, which uses was.`,example:`Was he reading? → correct as is, because he is singular.`,points:13,feedbackCorrect:`Correct — Were is right for you.`,feedbackIncorrect:`You always needs Were, not Was.`}]},summary:{keyTakeaways:[`To make the past continuous negative, add not: wasn't or weren't.`,`To ask a yes/no question, put was/were before the subject: Was he swimming?`,`Short answers repeat was/were — they don't need the whole sentence: Yes, she was.`,`Wh-questions start with the question word, then was/were, then the subject: What were they doing?`],keyTakeawaysThai:[`ทำประโยคปฏิเสธโดยเติม not: wasn't หรือ weren't`,`ตั้งคำถาม Yes/No โดยนำ was/were ไว้หน้าประธาน: Was he swimming?`,`คำตอบสั้นใช้แค่ was/were ไม่ต้องพูดเต็มประโยค: Yes, she was.`,`คำถาม Wh ขึ้นต้นด้วยคำคำถาม ตามด้วย was/were แล้วตามด้วยประธาน: What were they doing?`]}}},ki={id:`l5-past-continuous-interrupted`,number:5,title:`Past Continuous with an Interrupting Event`,subtitle:`Learn how to describe one action interrupting another using the past continuous and past simple.`,skillCategory:`grammar`,estimatedMinutes:22,stages:{warmup:{promptEn:`Imagine you were doing something fun, and suddenly something surprising happened! What were you doing, and what happened? Tell a partner one sentence.`,promptThai:`ลองนึกภาพว่าคุณกำลังทำอะไรสนุกๆ อยู่ แล้วจู่ๆ ก็มีอะไรบางอย่างที่น่าประหลาดใจเกิดขึ้น! คุณกำลังทำอะไรอยู่ และเกิดอะไรขึ้น? บอกเพื่อนหนึ่งประโยค`,hook:`We can describe two actions happening close together — one going on, and one that suddenly interrupted it — using the past continuous and past simple joined by 'when'.`},learn:{intro:`Sometimes we want to talk about something that was happening, and then something else suddenly happened in the middle of it. We use the past continuous for the longer action and the past simple for the shorter one, joined by 'when'.`,introThai:`บางครั้งเราต้องการพูดถึงสิ่งที่กำลังเกิดขึ้น แล้วมีอีกเหตุการณ์หนึ่งเกิดขึ้นแทรกเข้ามาทันที เราใช้ past continuous กับเหตุการณ์ที่ยาวกว่า และ past simple กับเหตุการณ์ที่สั้นกว่า เชื่อมด้วยคำว่า 'when'`,points:[{title:`Two actions, one moment`,body:`Sometimes one thing was already happening when something else suddenly happened. We use two tenses together to show this.`,bodyThai:`บางครั้งมีเหตุการณ์หนึ่งกำลังเกิดขึ้นอยู่แล้ว แล้วมีอีกเหตุการณ์หนึ่งเกิดขึ้นแทรกเข้ามาทันที เราใช้สองกาลร่วมกันเพื่อแสดงสิ่งนี้`},{title:`The longer action: past continuous`,body:`The action that was already going on — the background action — uses was/were + verb-ing. Example: I was climbing a tree...`,bodyThai:`การกระทำที่กำลังดำเนินอยู่ก่อนแล้ว (การกระทำพื้นหลัง) ใช้ was/were + กริยาเติม -ing เช่น I was climbing a tree...`},{title:`The shorter action: past simple`,body:`The sudden, shorter action that interrupts uses the simple past tense. Example: ...when the phone rang.`,bodyThai:`การกระทำที่เกิดขึ้นทันทีและสั้นกว่าซึ่งเข้ามาแทรก ใช้ past simple เช่น ...when the phone rang`},{title:`Joining with "when"`,body:`We use "when" to connect the two parts: [longer background action] + when + [shorter interrupting event].`,bodyThai:`ใช้ "when" เชื่อมสองส่วนเข้าด้วยกัน: [การกระทำพื้นหลังที่ยาวกว่า] + when + [เหตุการณ์แทรกที่สั้นกว่า]`}]},examples:{items:[{text:`I was climbing a tree when the phone rang.`,noteThai:`ฉันกำลังปีนต้นไม้ตอนที่โทรศัพท์ดัง`},{text:`She was washing the dishes when she heard a noise.`,noteThai:`เธอกำลังล้างจานตอนที่ได้ยินเสียงดัง`},{text:`They were driving in the rain when they saw an accident.`,noteThai:`พวกเขากำลังขับรถท่ามกลางฝนตอนที่เห็นอุบัติเหตุ`},{text:`He was swimming when he saw something in the water.`,noteThai:`เขากำลังว่ายน้ำตอนที่เห็นบางอย่างในน้ำ`},{text:`We were walking home when it started to `when it started to rain.`},{id:`i3`,label:`when my sister called me.`},{id:`i4`,label:`when they saw an accident.`}],pairs:{b1:`i1`,b2:`i2`,b3:`i3`,b4:`i4`},explanation:`Each background action matches the interrupting event that happened during it.`,explanationThai:`การกระทำพื้นหลังแต่ละอย่างตรงกับเหตุการณ์แทรกที่เกิดขึ้นระหว่างนั้น`,hint1:`Think about which sudden event makes sense with each background action.`,hint2:`Being at home and doing homework — who might call you?`,example:`The children were playing outside when the storm began.`,points:15,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A few pairs don't make sense together — try again.`},{id:`l5-mq-04`,type:`mcq`,skill:`grammar`,topic:`Background Action`,difficulty:`medium`,prompt:`In the sentence 'He was swimming when he saw something in the water,' which part is the background action?`,promptThai:`ในประโยค 'He was swimming when he saw something in the water' ส่วนใดคือการกระทำพื้นหลัง?`,options:[`he was swimming`,`he saw something in the water`,`when`,`something`],correctIndex:0,explanation:`'He was swimming' is the longer action already happening — the background action.`,explanationThai:`'he was swimming' คือการกระทำที่ยาวกว่าและกำลังเกิดขึ้นอยู่แล้ว — การกระทำพื้นหลัง`,hint1:`The background action uses was/were + verb-ing.`,hint2:`It was already going on before the interruption.`,example:`In 'I was climbing a tree when the phone rang,' the background action is 'I was climbing a tree.'`,points:11,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the part with was/were + verb-ing.`},{id:`l5-mq-05`,type:`mcq`,skill:`grammar`,topic:`Interrupting Event`,difficulty:`medium`,prompt:`In the sentence 'We were walking home when it started to rain,' which part is the interrupting event?`,promptThai:`ในประโยค 'We were walking home when it started to rain' ส่วนใดคือเหตุการณ์ที่เข้ามาแทรก?`,options:[`it started to rain`,`we were walking home`,`when`,`home`],correctIndex:0,explanation:`'It started to rain' is the sudden event that interrupted the walking — the interrupting event.`,explanationThai:`'it started to rain' คือเหตุการณ์ที่เกิดขึ้นทันทีซึ่งเข้ามาแทรกการเดิน — เหตุการณ์แทรก`,hint1:`The interrupting event uses the simple past tense.`,hint2:`It happened suddenly, while the other action was going on.`,example:`In 'She was washing the dishes when she heard a noise,' the interrupting event is 'she heard a noise.'`,points:11,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the short, sudden action in the simple past.`},{id:`l5-mq-06`,type:`fill-blank`,skill:`grammar`,topic:`When Clauses`,difficulty:`challenge`,prompt:`Complete the sentence with 'when'.`,promptThai:`เติมประโยคด้วยคำว่า when`,before:`They were driving in the rain`,after:`they saw an accident.`,answers:[`when`],explanation:`'When' connects the background action (driving) with the interrupting event (saw an accident).`,explanationThai:`'when' เชื่อมการกระทำพื้นหลัง (driving) กับเหตุการณ์แทรก (saw an accident)`,hint1:`This word joins the two parts of the sentence.`,hint2:`It's the same word used throughout this lesson.`,example:`We were walking home when it started to rain.`,points:10,feedbackCorrect:`Correct — when!`,feedbackIncorrect:`Use 'when' to join the two actions.`},{id:`l5-mq-07`,type:`mcq`,skill:`grammar`,topic:`Choosing the Tense`,difficulty:`challenge`,prompt:`Choose the correct verb forms: The children ___ outside when the storm ___.`,promptThai:`เลือกรูปกริยาที่ถูกต้อง: The children ___ outside when the storm ___`,options:[`were playing / began`,`played / was beginning`,`were playing / was beginning`,`played / began`],correctIndex:0,explanation:`Playing is the ongoing background action; the storm beginning is the sudden interrupting event.`,explanationThai:`playing เป็นการกระทำพื้นหลังที่กำลังดำเนินอยู่ ส่วน storm beginning เป็นเหตุการณ์แทรก`,hint1:`Which action was going on for a while?`,hint2:`'Began' is a sudden, short action.`,example:`He was swimming when he saw something in the water.`,points:12,feedbackCorrect:`Correct — were playing / began!`,feedbackIncorrect:`Playing is the background action; the storm beginning is the sudden interrupt.`},{id:`l5-mq-08`,type:`mcq`,skill:`grammar`,topic:`Picture Sequences`,difficulty:`medium`,prompt:`🧗 (a boy climbing a tree) ... 📞 (a phone ringing). Which sentence matches this picture sequence?`,promptThai:`🧗 (เด็กชายกำลังปีนต้นไม้) ... 📞 (โทรศัพท์ดัง) ประโยคใดตรงกับลำดับภาพนี้?`,options:[`He was climbing a tree when the phone rang.`,`He climbed a tree when the phone was ringing.`,`He was climbing a tree when the phone was ringing.`,`He climbs a tree when the phone rings.`],correctIndex:0,explanation:`The climbing was the ongoing background action; the phone ringing was the sudden interrupting event.`,explanationThai:`การปีนต้นไม้เป็นการกระทำพื้นหลังที่กำลังดำเนินอยู่ ส่วนโทรศัพท์ดังเป็นเหตุการณ์แทรก`,hint1:`The first picture shows an action already in progress.`,hint2:`The second picture shows a sudden, short event.`,example:`🏊 swimming ... 🦈 seeing something → He was swimming when he saw something in the water.`,points:12,feedbackCorrect:`Correct!`,feedbackIncorrect:`The ongoing action needs was/were + verb-ing; the sudden event needs the simple past.`},{id:`l5-mq-09`,type:`mcq`,skill:`grammar`,topic:`Interrupting Event`,difficulty:`challenge`,prompt:`In the sentence 'I was doing my homework when my sister called me,' which part is the interrupting event?`,promptThai:`ในประโยค 'I was doing my homework when my sister called me' ส่วนใดคือเหตุการณ์ที่เข้ามาแทรก?`,options:[`my sister called me`,`I was doing my homework`,`when`,`homework`],correctIndex:0,explanation:`'My sister called me' is the short, sudden event that interrupted the homework — the interrupting event.`,explanationThai:`'my sister called me' คือเหตุการณ์ที่สั้นและเกิดขึ้นทันที ซึ่งเข้ามาแทรกการทำการบ้าน — เหตุการณ์แทรก`,hint1:`The interrupting event uses the simple past tense.`,hint2:`It happened suddenly, in the middle of the other action.`,example:`In 'He was swimming when he saw something in the water,' the interrupting event is 'he saw something in the water.'`,points:13,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the short, sudden action in the simple past.`},{id:`l5-mq-10`,type:`mcq`,skill:`grammar`,topic:`Background Action`,difficulty:`medium`,prompt:`In the sentence 'They were driving in the rain when they saw an accident,' which part is the background action?`,promptThai:`ในประโยค 'They were driving in the rain when they saw an accident' ส่วนใดคือการกระทำพื้นหลัง?`,options:[`they were driving in the rain`,`they saw an accident`,`when`,`an accident`],correctIndex:0,explanation:`'They were driving in the rain' is the longer action already happening — the background action.`,explanationThai:`'they were driving in the rain' คือการกระทำที่ยาวกว่าและกำลังเกิดขึ้นอยู่แล้ว — การกระทำพื้นหลัง`,hint1:`The background action uses was/were + verb-ing.`,hint2:`It was already going on before the interruption.`,example:`In 'We were walking home when it started to rain,' the background action is 'We were walking home.'`,points:11,feedbackCorrect:`Correct!`,feedbackIncorrect:`Look for the part with was/were + verb-ing.`}]},summary:{keyTakeaways:[`The longer action (already happening) uses the past continuous: was/were + verb-ing.`,`The shorter, sudden action (the interruption) uses the past simple.`,`We join the two actions with 'when'.`,`Example pattern: [background action] + when + [interrupting event].`],keyTakeawaysThai:[`การกระทำที่ยาวกว่า (ที่กำลังเกิดขึ้นอยู่แล้ว) ใช้ past continuous: was/were + กริยาเติม -ing`,`การกระทำที่สั้นกว่าและเกิดขึ้นทันที (เหตุการณ์แทรก) ใช้ past simple`,`เราเชื่อมสองการกระทำด้วยคำว่า 'when'`,`รูปแบบตัวอย่าง: [การกระทำพื้นหลัง] + when + [เหตุการณ์แทรก]`]}}},Ai={id:`l6-emergency-phone-calls`,number:6,title:`Emergency Phone Calls`,subtitle:`Learn how to make a clear, calm call to emergency services.`,skillCategory:`dialogue`,estimatedMinutes:20,stages:{warmup:{promptEn:`Imagine you see smoke coming from a neighbour's window. What is the very first thing you would say if you called for help?`,promptThai:`ลองจินตนาการว่าคุณเห็นควันออกมาจากหน้าต่างบ้านข้างๆ อะไรคือสิ่งแรกที่คุณจะพูดถ้าคุณโทรขอความช่วยเหลือ?`,hook:`You would probably say what is wrong first, like "There is a fire!" — that is the very first step of every emergency call.`},learn:{intro:`When you call for emergency help, following a clear structure helps the operator understand you quickly and send the right help fast. Every emergency call follows five simple steps.`,introThai:`เมื่อคุณโทรขอความช่วยเหลือในเหตุฉุกเฉิน การพูดตามลำดับที่ชัดเจนจะช่วยให้เจ้าหน้าที่เข้าใจคุณได้เร็วและส่งความช่วยเหลือที่ถูกต้อง การโทรแจ้งเหตุฉุกเฉินทุกครั้งมี 5 ขั้นตอนง่ายๆ`,points:[{title:`Step 1: State the emergency`,body:`Start by saying what is wrong, like "There is a fire" or "There has been an accident."`,bodyThai:`เริ่มต้นด้วยการบอกว่าเกิดอะไรขึ้น เช่น "มีไฟไหม้" หรือ "เกิดอุบัติเหตุ"`},{title:`Step 2: Give the location`,body:`Tell the operator exactly where you are, like a street name and house number: "We are in front of number 92."`,bodyThai:`บอกเจ้าหน้าที่ว่าคุณอยู่ที่ไหนอย่างชัดเจน เช่น "เราอยู่หน้าบ้านเลขที่ 92"`},{title:`Step 3: Say who needs help`,body:`Explain who is hurt or in danger and what kind of help you need: "A man is hurt. We need an ambulance."`,bodyThai:`อธิบายว่าใครได้รับบาดเจ็บหรืออยู่ในอันตราย และต้องการความช่วยเหลือแบบไหน`},{title:`Step 4: Answer the operator's questions`,body:`Listen carefully and answer questions clearly, like "Where are you?" or "Can you see the fire?"`,bodyThai:`ฟังให้ดีและตอบคำถามของเจ้าหน้าที่อย่างชัดเจน เช่น "คุณอยู่ที่ไหน?" หรือ "คุณเห็นไฟไหม้ไหม?"`},{title:`Step 5: Follow safety instructions`,body:`Do what the operator tells you to stay safe, like "Please stay on the phone" or "Please move to a safe place."`,bodyThai:`ทำตามคำแนะนำด้านความปลอดภัยของเจ้าหน้าที่ เช่น "กรุณาอย่าวางสาย" หรือ "กรุณาย้ายไปที่ปลอดภัย"`}]},examples:{items:[{text:`Emergency services. How can I help you?`,noteThai:`หน่วยฉุกเฉินค่ะ/ครับ มีอะไรให้ช่วยไหม?`},{text:`There is a fire.`,noteThai:`มีไฟไหม้`},{text:`There has been an accident. A man is hurt.`,noteThai:`เกิดอุบัติเหตุ มีผู้ชายได้รับบาดเจ็บ`},{text:`We are in front of number 92.`,noteThai:`เราอยู่หน้าบ้านเลขที่ 92`},{text:`Please stay on the phone. Help is on the way.`,noteThai:`กรุณาอย่าวางสาย ความช่วยเหลือกำลังไป`},{text:`You must not go near the fire. Please move to a safe place.`,noteThai:`คุณต้องไม่เข้าใกล้ไฟ กรุณาย้ายไปที่ปลอดภัย`}]},guided:{questions:[{id:`l6-g-01`,type:`sequence`,presentation:`dialogue`,skill:`dialogue`,topic:`Call Structure`,difficulty:`easy`,prompt:`Put this phone call in the correct order.`,promptThai:`เรียงบทสนทนาทางโทรศัพท์นี้ให้ถูกลำดับ`,items:[{id:`a1`,label:`Emergency services. How can I help you?`,speaker:`Operator`},{id:`a2`,label:`There is a fire at my house!`,speaker:`Caller`},{id:`a3`,label:`Where are you?`,speaker:`Operator`},{id:`a4`,label:`We are on Green Street, in front of number 92.`,speaker:`Caller`},{id:`a5`,label:`Please stay on the phone. Help is on the way.`,speaker:`Operator`},{id:`a6`,label:`Thank you. We are waiting outside.`,speaker:`Caller`}],correctOrder:[`a1`,`a2`,`a3`,`a4`,`a5`,`a6`],explanation:`A call always starts with the operator answering, then the caller says the emergency, gives the location, and the operator gives an instruction before the call ends.`,explanationThai:`การโทรแจ้งเหตุเริ่มจากเจ้าหน้าที่รับสาย จากนั้นผู้โทรบอกเหตุฉุกเฉิน บอกสถานที่ และเจ้าหน้าที่ให้คำแนะนำก่อนจบสาย`,hint1:`The operator always speaks first when they answer the phone.`,hint2:`The caller says what is wrong before they give the address.`,example:`Operator: "Emergency services. How can I help you?" always comes first.`,points:12,feedbackCorrect:`Perfect — that is the correct order for an emergency call!`,feedbackIncorrect:`Not quite — remember the operator answers first, then the caller explains.`},{id:`l6-g-02`,type:`mcq`,skill:`dialogue`,topic:`Giving Location`,difficulty:`easy`,prompt:`The operator asks, "Where are you?" What should the caller say?`,promptThai:`เจ้าหน้าที่ถามว่า "คุณอยู่ที่ไหน?" ผู้โทรควรพูดว่าอย่างไร?`,options:[`We are in front of number 92, Green Street.`,`It is very hot today.`,`The fire is big and orange.`,`Thank you, goodbye.`],correctIndex:0,explanation:`When the operator asks for your location, you must give a clear address, like a street name and house number.`,explanationThai:`เมื่อเจ้าหน้าที่ถามหาสถานที่ คุณต้องบอกที่อยู่ที่ชัดเจน เช่น ชื่อถนนและบ้านเลขที่`,hint1:`The operator needs an address, not a description of the weather.`,hint2:`Look for the answer with a street name and a number.`,example:`If asked "Where are you?", say "We are near the school on Green Street."`,points:10,feedbackCorrect:`Correct — that gives the operator a clear location!`,feedbackIncorrect:`Look again — the operator needs an address, not other information.`},{id:`l6-g-03`,type:`fill-blank`,skill:`dialogue`,topic:`Call Structure`,difficulty:`easy`,prompt:`Complete the caller's line with the correct word.`,promptThai:`เติมคำที่ถูกต้องในประโยคของผู้โทร`,before:`A man is hurt. We need an`,after:`.`,answers:[`ambulance`],explanation:`When someone is hurt, the caller must say who needs help and ask for an ambulance.`,explanationThai:`เมื่อมีคนได้รับบาดเจ็บ ผู้โทรต้องบอกว่าใครต้องการความช่วยเหลือและขอรถพยาบาล`,hint1:`This vehicle takes hurt people to the hospital.`,hint2:`It starts with the letter A.`,example:`Can you send a fire engine? — for a fire, not an injury.`,points:10,feedbackCorrect:`Correct — "ambulance" is exactly right.`,feedbackIncorrect:`Think about which vehicle helps a hurt person.`},{id:`l6-g-04`,type:`match`,skill:`dialogue`,topic:`Emergency Services`,difficulty:`medium`,prompt:`Match each emergency to the service that should help.`,promptThai:`จับคู่เหตุฉุกเฉินแต่ละอย่างกับหน่วยงานที่ควรช่วยเหลือ`,left:[{id:`e1`,label:`Flames coming from a kitchen`},{id:`e2`,label:`A woman cannot breathe`},{id:`e3`,label:`A car crash with two people hurt`},{id:`e4`,label:`Someone is stealing a bike`}],right:[{id:`s1`,label:`fire service`},{id:`s2`,label:`ambulance`},{id:`s3`,label:`police`}],pairs:{e1:`s1`,e2:`s2`,e3:`s2`,e4:`s3`},explanation:`Fires need the fire service, hurt or sick people need an ambulance, and crimes like stealing need the police. Some services can be needed by more than one type of emergency.`,explanationThai:`ไฟไหม้ต้องการหน่วยดับเพลิง ผู้บาดเจ็บหรือป่วยต้องการรถพยาบาล และอาชญากรรมเช่นการขโมยต้องการตำรวจ`,hint1:`A crash with people hurt needs the same service as someone who cannot breathe.`,hint2:`Only one of these needs the police.`,example:`Smoke coming from a house → fire service.`,points:15,feedbackCorrect:`All matched correctly — you know your emergency services!`,feedbackIncorrect:`A few pairs are wrong — think about what kind of help each emergency needs.`},{id:`l6-g-05`,type:`mcq`,skill:`dialogue`,topic:`Important Information`,difficulty:`easy`,prompt:`What should you tell the operator FIRST when you call for emergency help?`,promptThai:`คุณควรบอกอะไรกับเจ้าหน้าที่เป็นอันดับแรกเมื่อโทรขอความช่วยเหลือฉุกเฉิน?`,options:[`What the emergency is`,`Your favourite colour`,`What you ate for breakfast`,`The weather today`],correctIndex:0,explanation:`The first step of every emergency call is to say what is wrong, like "There is a fire" or "There has been an accident."`,explanationThai:`ขั้นตอนแรกของการโทรแจ้งเหตุฉุกเฉินคือบอกว่าเกิดอะไรขึ้น เช่น "มีไฟไหม้" หรือ "เกิดอุบัติเหตุ"`,hint1:`Think about the very first thing an operator needs to understand.`,hint2:`It is not small talk — it is the reason you are calling.`,example:`"There is a flood on Green Street" states the emergency clearly.`,points:10,feedbackCorrect:`Correct — always state the emergency first!`,feedbackIncorrect:`Think about the most important thing the operator needs to know right away.`},{id:`l6-g-06`,type:`sequence`,presentation:`dialogue`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`Put this phone call in the correct order.`,promptThai:`เรียงบทสนทนาทางโทรศัพท์นี้ให้ถูกลำดับ`,items:[{id:`b1`,label:`Emergency services. How can I help you?`,speaker:`Operator`},{id:`b2`,label:`There has been an accident. A man is hurt.`,speaker:`Caller`},{id:`b3`,label:`Where are you?`,speaker:`Operator`},{id:`b4`,label:`We are in front of number 92, Green Street.`,speaker:`Caller`},{id:`b5`,label:`Please stay on the phone. Help is on the way.`,speaker:`Operator`}],correctOrder:[`b1`,`b2`,`b3`,`b4`,`b5`],explanation:`This call follows the same pattern: the operator answers, the caller states the emergency and gives the location, then the operator gives an instruction.`,explanationThai:`บทสนทนานี้เป็นไปตามรูปแบบเดียวกัน คือเจ้าหน้าที่รับสาย ผู้โทรบอกเหตุฉุกเฉินและสถานที่ จากนั้นเจ้าหน้าที่ให้คำแนะนำ`,hint1:`The caller says who is hurt before giving the address.`,hint2:`The last line is always a safety instruction from the operator.`,example:`The operator's greeting is always the very first line.`,points:12,feedbackCorrect:`Great job — you ordered the whole call correctly!`,feedbackIncorrect:`Check the order again — start with the operator's greeting.`},{id:`l6-g-07`,type:`true-false`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`easy`,prompt:`Read the sentence. Is this a safe or unsafe thing to do during an emergency?`,promptThai:`อ่านประโยคนี้ นี่เป็นสิ่งที่ปลอดภัยหรือไม่ปลอดภัยที่จะทำในเหตุฉุกเฉิน?`,statement:`The caller ran back into the burning house to get her school bag.`,correctAnswer:!1,explanation:`You must not go near a fire, even to get your things. Going back into a burning house is very dangerous.`,explanationThai:`คุณต้องไม่เข้าใกล้ไฟ แม้จะไปเอาสิ่งของก็ตาม การกลับเข้าไปในบ้านที่กำลังไฟไหม้เป็นอันตรายมาก`,hint1:`Think about the rule "You must not go near the fire."`,hint2:`No object is worth going back into danger for.`,example:`Moving to a safe place away from the fire is a safe action.`,points:10,feedbackCorrect:`Correct — this is unsafe. Never go back into a fire for things!`,feedbackIncorrect:`Think again — is going near a fire ever a safe choice?`},{id:`l6-g-08`,type:`mcq`,skill:`dialogue`,topic:`Best Response`,difficulty:`medium`,prompt:`The operator asks, "Can you see the fire now?" What is the best reply?`,promptThai:`เจ้าหน้าที่ถามว่า "ตอนนี้คุณเห็นไฟไหม้ไหม?" คำตอบที่ดีที่สุดคืออะไร?`,options:[`Yes, I can see smoke and fire.`,`I like watching fire trucks.`,`My friend is not here today.`,`Goodbye, thank you.`],correctIndex:0,explanation:`The caller should answer the operator's question clearly and honestly with useful information about what they can see.`,explanationThai:`ผู้โทรควรตอบคำถามของเจ้าหน้าที่อย่างชัดเจนและตรงไปตรงมาด้วยข้อมูลที่เป็นประโยชน์`,hint1:`The reply should directly answer the yes/no question.`,hint2:`It should describe what the caller can actually see.`,example:`Answering "Where are you?" with the exact address is a clear reply.`,points:10,feedbackCorrect:`Correct — that directly and clearly answers the question!`,feedbackIncorrect:`Look again — which option actually answers what the operator asked?`},{id:`l6-g-09`,type:`fill-blank`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`medium`,prompt:`Complete the operator's instruction with the correct word.`,promptThai:`เติมคำที่ถูกต้องในคำแนะนำของเจ้าหน้าที่`,before:`Please stay on the`,after:`. Help is on the way.`,answers:[`phone`],explanation:`The operator asks the caller to stay on the phone so they can keep giving help and information until rescue arrives.`,explanationThai:`เจ้าหน้าที่ขอให้ผู้โทรอยู่สายต่อไปเพื่อให้ความช่วยเหลือและข้อมูลต่อไปจนกว่าความช่วยเหลือจะมาถึง`,hint1:`This is the object you are talking into right now.`,hint2:`It rhymes with "own" and "cone."`,example:`Please move to a safe place — another safety instruction.`,points:10,feedbackCorrect:`Correct — "phone" is exactly right.`,feedbackIncorrect:`Think about what you should stay on during the call.`}]},independent:{questions:[{id:`l6-i-01`,type:`sequence`,presentation:`dialogue`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`Put this phone call in the correct order.`,promptThai:`เรียงบทสนทนาทางโทรศัพท์นี้ให้ถูกลำดับ`,items:[{id:`c1`,label:`Emergency services. How can I help you?`,speaker:`Operator`},{id:`c2`,label:`There is a flood on Green Street!`,speaker:`Caller`},{id:`c3`,label:`Can you see the water now?`,speaker:`Operator`},{id:`c4`,label:`Yes, the water is very high.`,speaker:`Caller`},{id:`c5`,label:`You must not go near the flood water.`,speaker:`Operator`},{id:`c6`,label:`OK, we will stay away.`,speaker:`Caller`},{id:`c7`,label:`Please move to a safe place. Help is on the way.`,speaker:`Operator`}],correctOrder:[`c1`,`c2`,`c3`,`c4`,`c5`,`c6`,`c7`],explanation:`The call opens with the operator's greeting, then the caller states the flood, the operator asks a question, the caller answers, and the operator finishes with safety instructions.`,explanationThai:`บทสนทนาเริ่มด้วยคำทักทายของเจ้าหน้าที่ ผู้โทรบอกเหตุน้ำท่วม เจ้าหน้าที่ถามคำถาม ผู้โทรตอบ และเจ้าหน้าที่จบด้วยคำแนะนำด้านความปลอดภัย`,hint1:`A warning about danger always comes before the final safety instruction.`,hint2:`The caller confirms the danger before agreeing to move.`,example:`The caller always answers a question right after the operator asks it.`,points:14,feedbackCorrect:`Excellent — the whole flood call is in the right order!`,feedbackIncorrect:`Check again — remember the warning comes before the final instruction.`},{id:`l6-i-02`,type:`mcq`,skill:`dialogue`,topic:`Call Structure`,difficulty:`easy`,prompt:`The operator answers the phone: "Emergency services. How can I help you?" What should the caller say first?`,promptThai:`เจ้าหน้าที่รับสายว่า "หน่วยฉุกเฉินค่ะ มีอะไรให้ช่วยไหม?" ผู้โทรควรพูดอะไรก่อน?`,options:[`There is a fire!`,`Hello, how are you today?`,`Can I speak to my friend?`,`What time is it?`],correctIndex:0,explanation:`The caller's very first job is to say what the emergency is, not to make small talk.`,explanationThai:`สิ่งแรกที่ผู้โทรต้องทำคือบอกว่าเหตุฉุกเฉินคืออะไร ไม่ใช่การพูดคุยทั่วไป`,hint1:`This is not a friendly phone call — it is urgent.`,hint2:`The answer names an emergency.`,example:`"There has been an accident" also correctly states an emergency.`,points:10,feedbackCorrect:`Correct — state the emergency right away!`,feedbackIncorrect:`Remember, this call is urgent — the caller must say what is wrong.`},{id:`l6-i-03`,type:`fill-blank`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,promptThai:`เติมคำที่ถูกต้องในประโยค`,before:`There is a`,after:`on Green Street.`,answers:[`flood`],explanation:`"Flood" means too much water covering land that is usually dry, and it fits this sentence about Green Street.`,explanationThai:`"น้ำท่วม" หมายถึงน้ำจำนวนมากปกคลุมพื้นที่ที่ปกติแห้ง`,hint1:`Think of too much water on the ground.`,hint2:`It starts with the letter F.`,example:`There is a fire in the kitchen.`,points:10,feedbackCorrect:`Correct — "flood" fits perfectly.`,feedbackIncorrect:`Think about the emergency caused by too much water.`},{id:`l6-i-04`,type:`match`,skill:`dialogue`,topic:`Emergency Services`,difficulty:`medium`,prompt:`Match each emergency to the service that should help.`,promptThai:`จับคู่เหตุฉุกเฉินแต่ละอย่างกับหน่วยงานที่ควรช่วยเหลือ`,left:[{id:`f1`,label:`A man collapsed in the street`},{id:`f2`,label:`Loud smoke alarm and flames in the roof`},{id:`f3`,label:`A car has been stolen`},{id:`f4`,label:`A child is missing in the park`}],right:[{id:`t1`,label:`ambulance`},{id:`t2`,label:`fire service`},{id:`t3`,label:`police`}],pairs:{f1:`t1`,f2:`t2`,f3:`t3`,f4:`t3`},explanation:`A collapsed person needs an ambulance, flames and smoke need the fire service, and both stolen property and a missing child need the police.`,explanationThai:`คนที่ล้มลงต้องการรถพยาบาล เปลวไฟและควันต้องการหน่วยดับเพลิง ส่วนของถูกขโมยและเด็กหายต้องการตำรวจ`,hint1:`Two of these emergencies need the same service.`,hint2:`Flames and smoke always need the fire service.`,example:`Someone stealing a bike → police.`,points:15,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A couple of pairs are wrong — think about who handles crimes.`},{id:`l6-i-05`,type:`mcq`,skill:`dialogue`,topic:`Important Information`,difficulty:`medium`,prompt:`Which detail helps the operator send help to the RIGHT place?`,promptThai:`รายละเอียดใดช่วยให้เจ้าหน้าที่ส่งความช่วยเหลือไปยังสถานที่ที่ถูกต้อง?`,options:[`The street name and house number`,`Your favourite game`,`What you are wearing`,`The name of your pet`],correctIndex:0,explanation:`A clear street name and house number tells the operator exactly where to send help — that is why giving the location is one of the five steps.`,explanationThai:`ชื่อถนนและบ้านเลขที่ที่ชัดเจนช่วยให้เจ้าหน้าที่รู้ว่าจะส่งความช่วยเหลือไปที่ไหน`,hint1:`Think about the "give the location" step of the call.`,hint2:`It is not personal information — it is an address.`,example:`"We are in front of number 92" gives an exact location.`,points:10,feedbackCorrect:`Correct — location details get help to the right place fast!`,feedbackIncorrect:`Think about what tells the operator exactly where to go.`},{id:`l6-i-06`,type:`true-false`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`medium`,prompt:`Read the sentence. Is this a safe or unsafe thing to do during an emergency call?`,promptThai:`อ่านประโยคนี้ นี่เป็นสิ่งที่ปลอดภัยหรือไม่ปลอดภัยที่จะทำระหว่างการโทรแจ้งเหตุฉุกเฉิน?`,statement:`The caller stayed calm and answered all of the operator's questions.`,correctAnswer:!0,explanation:`Staying calm and answering questions clearly helps the operator send the right help quickly — this is exactly what a caller should do.`,explanationThai:`การอยู่นิ่งและตอบคำถามอย่างชัดเจนช่วยให้เจ้าหน้าที่ส่งความช่วยเหลือที่ถูกต้องได้อย่างรวดเร็ว`,hint1:`Think about what the "answer the operator's questions" step teaches.`,hint2:`Panicking and not answering would make the call harder, not easier.`,example:`Running back into a fire to get a toy is unsafe.`,points:10,feedbackCorrect:`Correct — staying calm and answering clearly is exactly right!`,feedbackIncorrect:`Think again — is answering the operator's questions helpful or harmful?`},{id:`l6-i-07`,type:`mcq`,skill:`dialogue`,topic:`Best Response`,difficulty:`medium`,prompt:`The caller says, "We need an ambulance." What should the operator ask next?`,promptThai:`ผู้โทรพูดว่า "เราต้องการรถพยาบาล" เจ้าหน้าที่ควรถามอะไรต่อไป?`,options:[`Where are you?`,`What is your favourite food?`,`Do you like ambulances?`,`What day is it today?`],correctIndex:0,explanation:`After learning what help is needed, the operator's next job is to find out the location so they can send the ambulance to the right place.`,explanationThai:`หลังจากรู้ว่าต้องการความช่วยเหลือแบบไหนแล้ว หน้าที่ต่อไปของเจ้าหน้าที่คือถามหาสถานที่`,hint1:`Think about which step comes right after "say who needs help."`,hint2:`The operator needs an address, not small talk.`,example:`After "There is a fire," the operator also asks "Where are you?"`,points:10,feedbackCorrect:`Correct — finding the location comes next!`,feedbackIncorrect:`Think about which question helps send the ambulance to the right place.`},{id:`l6-i-08`,type:`fill-blank`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`Complete the caller's question with the correct word.`,promptThai:`เติมคำที่ถูกต้องในคำถามของผู้โทร`,before:`Can you send a fire`,after:`?`,answers:[`engine`],explanation:`A "fire engine" is the big truck firefighters use, so the caller asks the operator to send one.`,explanationThai:`"รถดับเพลิง" คือรถบรรทุกขนาดใหญ่ที่นักดับเพลิงใช้ ผู้โทรจึงขอให้เจ้าหน้าที่ส่งรถคันนี้มา`,hint1:`This vehicle is used to put out fires.`,hint2:`It is two words: "fire" + this word.`,example:`We need an ambulance — for someone who is hurt.`,points:10,feedbackCorrect:`Correct — "engine" is exactly right.`,feedbackIncorrect:`Think about the vehicle firefighters drive to a fire.`},{id:`l6-i-09`,type:`sequence`,presentation:`dialogue`,skill:`dialogue`,topic:`Call Structure`,difficulty:`challenge`,prompt:`Put this phone call in the correct order.`,promptThai:`เรียงบทสนทนาทางโทรศัพท์นี้ให้ถูกลำดับ`,items:[{id:`d1`,label:`Emergency services. How can I help you?`,speaker:`Operator`},{id:`d2`,label:`There has been an accident. A boy fell off his bike.`,speaker:`Caller`},{id:`d3`,label:`Is he hurt badly?`,speaker:`Operator`},{id:`d4`,label:`Yes, his leg is hurt. We need an ambulance.`,speaker:`Caller`},{id:`d5`,label:`Please stay on the phone. Help is on the way.`,speaker:`Operator`}],correctOrder:[`d1`,`d2`,`d3`,`d4`,`d5`],explanation:`The caller states the accident, the operator checks how serious it is, the caller explains and asks for an ambulance, and the operator gives a final instruction.`,explanationThai:`ผู้โทรบอกเหตุอุบัติเหตุ เจ้าหน้าที่ตรวจสอบความรุนแรง ผู้โทรอธิบายและขอรถพยาบาล และเจ้าหน้าที่ให้คำแนะนำสุดท้าย`,hint1:`The operator's question about how badly he is hurt comes before the caller asks for an ambulance.`,hint2:`The safety instruction is always the last line.`,example:`The operator often asks a follow-up question like "Can you see the fire?"`,points:14,feedbackCorrect:`Excellent — every line is in the right place!`,feedbackIncorrect:`Look again — the operator's question comes before the caller asks for help.`},{id:`l6-i-10`,type:`mcq`,skill:`dialogue`,topic:`Best Response`,difficulty:`medium`,prompt:`The operator asks, "Can you see the house?" What is the best reply?`,promptThai:`เจ้าหน้าที่ถามว่า "คุณเห็นบ้านหลังนั้นไหม?" คำตอบที่ดีที่สุดคืออะไร?`,options:[`Yes, I can see it from here.`,`I do not like this street.`,`My phone battery is low.`,`See you later!`],correctIndex:0,explanation:`The caller should give a clear, direct answer to the operator's yes/no question.`,explanationThai:`ผู้โทรควรตอบคำถามแบบใช่/ไม่ใช่ของเจ้าหน้าที่อย่างตรงไปตรงมาและชัดเจน`,hint1:`The reply should directly answer whether they can see the house.`,hint2:`Look for the option that is actually about the house.`,example:`Answering "Can you see the fire?" with "Yes, I can see smoke" is a clear reply.`,points:10,feedbackCorrect:`Correct — that clearly answers the operator's question!`,feedbackIncorrect:`Which option actually answers whether the caller can see the house?`},{id:`l6-i-11`,type:`match`,skill:`dialogue`,topic:`Emergency Services`,difficulty:`challenge`,prompt:`Match each emergency to the service that should help.`,promptThai:`จับคู่เหตุฉุกเฉินแต่ละอย่างกับหน่วยงานที่ควรช่วยเหลือ`,left:[{id:`g1`,label:`Water covering the whole street`},{id:`g2`,label:`A woman fainted at the market`},{id:`g3`,label:`Two cars crashed on the highway`},{id:`g4`,label:`A shop window is broken and someone ran away`}],right:[{id:`h1`,label:`fire service`},{id:`h2`,label:`ambulance`},{id:`h3`,label:`police`}],pairs:{g1:`h1`,g2:`h2`,g3:`h2`,g4:`h3`},explanation:`The fire service often helps with flood rescue, fainting and crashes with injuries need an ambulance, and a broken window with someone running away needs the police.`,explanationThai:`หน่วยดับเพลิงมักช่วยกู้ภัยน้ำท่วม การเป็นลมและอุบัติเหตุที่มีผู้บาดเจ็บต้องการรถพยาบาล ส่วนกระจกแตกและมีคนหนีต้องการตำรวจ`,hint1:`Two of these emergencies need the same service as fainting.`,hint2:`The one about running away is a crime, not an injury.`,example:`Flames coming from a kitchen → fire service.`,points:16,feedbackCorrect:`All matched correctly — great thinking!`,feedbackIncorrect:`A few pairs are wrong — check which emergencies involve injuries.`},{id:`l6-i-12`,type:`true-false`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`medium`,prompt:`Read the sentence. Is this a safe or unsafe thing to do during an emergency call?`,promptThai:`อ่านประโยคนี้ นี่เป็นสิ่งที่ปลอดภัยหรือไม่ปลอดภัยที่จะทำระหว่างการโทรแจ้งเหตุฉุกเฉิน?`,statement:`The caller told the operator their exact address, in front of number 92.`,correctAnswer:!0,explanation:`Giving your exact address is a safe and correct thing to do — it helps the operator send help to the right place.`,explanationThai:`การบอกที่อยู่ที่ชัดเจนเป็นสิ่งที่ปลอดภัยและถูกต้อง ช่วยให้เจ้าหน้าที่ส่งความช่วยเหลือไปยังที่ถูกต้อง`,hint1:`Think about the "give the location" step.`,hint2:`Sharing your address with the emergency operator is always okay.`,example:`Running into a flooded street is unsafe.`,points:10,feedbackCorrect:`Correct — giving your address helps the operator find you!`,feedbackIncorrect:`Think again — is telling the operator your address a safe or unsafe thing to do?`},{id:`l6-i-13`,type:`fill-blank`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`medium`,prompt:`Complete the safety instruction with the correct word.`,promptThai:`เติมคำที่ถูกต้องในคำแนะนำด้านความปลอดภัย`,before:`During a fire, you must not go near the`,after:`.`,answers:[`fire`],explanation:`The operator warns the caller not to go near danger, like the fire itself, to stay safe.`,explanationThai:`เจ้าหน้าที่เตือนผู้โทรไม่ให้เข้าใกล้อันตราย เช่น ตัวไฟเอง เพื่อความปลอดภัย`,hint1:`This is the same danger mentioned at the start of the sentence.`,hint2:`It is hot and burns things.`,example:`You must not go near the flood water.`,points:10,feedbackCorrect:`Correct — "fire" is exactly right.`,feedbackIncorrect:`Reread the sentence — what danger is being described?`}]},miniQuiz:{questions:[{id:`l6-mq-01`,type:`sequence`,presentation:`dialogue`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`Put this phone call in the correct order.`,promptThai:`เรียงบทสนทนาทางโทรศัพท์นี้ให้ถูกลำดับ`,items:[{id:`k1`,label:`Emergency services. How can I help you?`,speaker:`Operator`},{id:`k2`,label:`There has been an accident. We need an ambulance.`,speaker:`Caller`},{id:`k3`,label:`Where are you?`,speaker:`Operator`},{id:`k4`,label:`We are near the school on Green Street.`,speaker:`Caller`},{id:`k5`,label:`Can you see the boy now?`,speaker:`Operator`},{id:`k6`,label:`Yes, he is hurt but he is talking to us.`,speaker:`Caller`}],correctOrder:[`k1`,`k2`,`k3`,`k4`,`k5`,`k6`],explanation:`This call follows the pattern: greeting, state the emergency, give the location, then answer the operator's follow-up question.`,explanationThai:`บทสนทนานี้เป็นไปตามรูปแบบ ทักทาย บอกเหตุฉุกเฉิน บอกสถานที่ และตอบคำถามต่อเนื่องของเจ้าหน้าที่`,hint1:`The caller gives the location right after asking for an ambulance.`,hint2:`The operator's follow-up question comes after the location is given.`,example:`The operator always answers the phone with the same greeting.`,points:14,feedbackCorrect:`Excellent ordering — the whole call makes sense!`,feedbackIncorrect:`Check again — the location comes before the follow-up question.`},{id:`l6-mq-02`,type:`mcq`,skill:`dialogue`,topic:`Best Response`,difficulty:`medium`,prompt:`The operator asks, "Where are you?" What is the best reply?`,promptThai:`เจ้าหน้าที่ถามว่า "คุณอยู่ที่ไหน?" คำตอบที่ดีที่สุดคืออะไร?`,options:[`We are in front of number 92, Green Street.`,`We are very worried.`,`We called five minutes ago.`,`We like this street.`],correctIndex:0,explanation:`The best reply gives a clear address so the operator can send help to the right place.`,explanationThai:`คำตอบที่ดีที่สุดคือการบอกที่อยู่ที่ชัดเจนเพื่อให้เจ้าหน้าที่ส่งความช่วยเหลือไปถูกที่`,hint1:`Look for the option with a street name and number.`,hint2:`Feelings do not help the operator find you.`,example:`"We are near the school on Green Street" is also a clear location.`,points:10,feedbackCorrect:`Correct — a clear address is the best answer!`,feedbackIncorrect:`Look again — which option is an actual address?`},{id:`l6-mq-03`,type:`fill-blank`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`Complete the caller's line with the correct word.`,promptThai:`เติมคำที่ถูกต้องในประโยคของผู้โทร`,before:`A man is hurt. We need an`,after:`.`,answers:[`ambulance`],explanation:`When someone is hurt, the caller says who needs help and asks for an ambulance.`,explanationThai:`เมื่อมีคนได้รับบาดเจ็บ ผู้โทรบอกว่าใครต้องการความช่วยเหลือและขอรถพยาบาล`,hint1:`This vehicle takes hurt people to the hospital.`,hint2:`It starts with the letter A.`,example:`Can you send a fire engine? — for a fire, not an injury.`,points:10,feedbackCorrect:`Correct — "ambulance" is exactly right.`,feedbackIncorrect:`Think about which vehicle helps a hurt person.`},{id:`l6-mq-04`,type:`match`,skill:`dialogue`,topic:`Emergency Services`,difficulty:`medium`,prompt:`Match each emergency to the service that should help.`,promptThai:`จับคู่เหตุฉุกเฉินแต่ละอย่างกับหน่วยงานที่ควรช่วยเหลือ`,left:[{id:`m1`,label:`Smoke coming from a house`},{id:`m2`,label:`A boy fell and is bleeding`},{id:`m3`,label:`A stranger is breaking into a shop`},{id:`m4`,label:`A car is on fire`}],right:[{id:`n1`,label:`fire service`},{id:`n2`,label:`ambulance`},{id:`n3`,label:`police`}],pairs:{m1:`n1`,m2:`n2`,m3:`n3`,m4:`n1`},explanation:`Smoke and fire need the fire service, bleeding needs an ambulance, and a break-in needs the police.`,explanationThai:`ควันและไฟไหม้ต้องการหน่วยดับเพลิง เลือดออกต้องการรถพยาบาล และการบุกรุกต้องการตำรวจ`,hint1:`Two of these emergencies need the fire service.`,hint2:`A break-in is a crime, not an injury or fire.`,example:`A man collapsed in the street → ambulance.`,points:15,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A couple of pairs are wrong — check which need the fire service.`},{id:`l6-mq-05`,type:`mcq`,skill:`dialogue`,topic:`Important Information`,difficulty:`medium`,prompt:`What is the most important detail to give the operator about your location?`,promptThai:`รายละเอียดใดสำคัญที่สุดที่ต้องบอกเจ้าหน้าที่เกี่ยวกับสถานที่ของคุณ?`,options:[`The street name and house number`,`How long you have lived there`,`The colour of your house`,`Your neighbour's name`],correctIndex:0,explanation:`A clear street name and house number is what lets the operator send help to the exact right place.`,explanationThai:`ชื่อถนนและบ้านเลขที่ที่ชัดเจนช่วยให้เจ้าหน้าที่ส่งความช่วยเหลือไปยังที่ที่ถูกต้อง`,hint1:`Think about the "give the location" step of the call.`,hint2:`It is the same information you would give for a delivery address.`,example:`"We are in front of number 92" is a clear location detail.`,points:10,feedbackCorrect:`Correct — the address is the key detail!`,feedbackIncorrect:`Think about what actually helps the operator find you.`},{id:`l6-mq-06`,type:`true-false`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`medium`,prompt:`Read the sentence. Is this a safe or unsafe thing to do during a flood?`,promptThai:`อ่านประโยคนี้ นี่เป็นสิ่งที่ปลอดภัยหรือไม่ปลอดภัยที่จะทำระหว่างน้ำท่วม?`,statement:`The caller ran across the flooded street to save time.`,correctAnswer:!1,explanation:`You must not go near flood water — it can be deeper and stronger than it looks. Running across it is very unsafe.`,explanationThai:`คุณต้องไม่เข้าใกล้น้ำท่วม เพราะอาจลึกและแรงกว่าที่เห็น การวิ่งข้ามน้ำท่วมเป็นอันตรายมาก`,hint1:`Think about the rule "You must not go near the flood."`,hint2:`Saving time is never worth the danger.`,example:`Moving to a safe place away from the water is a safe action.`,points:10,feedbackCorrect:`Correct — this is unsafe. Never go near flood water!`,feedbackIncorrect:`Think again — is going near flood water ever a safe choice?`},{id:`l6-mq-07`,type:`mcq`,skill:`dialogue`,topic:`Safety Instructions`,difficulty:`medium`,prompt:`The operator says, "You must not go near the fire." What should the caller do?`,promptThai:`เจ้าหน้าที่พูดว่า "คุณต้องไม่เข้าใกล้ไฟ" ผู้โทรควรทำอะไร?`,options:[`Move to a safe place.`,`Go closer to take a photo.`,`Hang up the phone.`,`Ask about the weather.`],correctIndex:0,explanation:`After a safety warning like "You must not go near the fire," the caller should follow it by moving to a safe place.`,explanationThai:`หลังจากได้รับคำเตือนด้านความปลอดภัย ผู้โทรควรทำตามโดยการย้ายไปที่ปลอดภัย`,hint1:`Think about the final step of an emergency call: follow safety instructions.`,hint2:`The safe choice moves away from danger, not toward it.`,example:`Staying on the phone is also part of following instructions.`,points:10,feedbackCorrect:`Correct — following the safety instruction keeps everyone safe!`,feedbackIncorrect:`Think about which choice moves away from danger.`},{id:`l6-mq-08`,type:`mcq`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`You call for help because you see smoke and flames in your kitchen. What should you say first?`,promptThai:`คุณโทรขอความช่วยเหลือเพราะเห็นควันและเปลวไฟในครัว คุณควรพูดอะไรก่อน?`,options:[`There is a fire in my kitchen!`,`What time do you close?`,`I am calling about my homework.`,`Can I have a fire engine toy?`],correctIndex:0,explanation:`The caller must state the emergency clearly and immediately — this is always the first step of the call.`,explanationThai:`ผู้โทรต้องบอกเหตุฉุกเฉินอย่างชัดเจนและทันที ซึ่งเป็นขั้นตอนแรกของการโทรเสมอ`,hint1:`This is the same first step used in every emergency call.`,hint2:`The answer names the exact danger the caller can see.`,example:`"There has been an accident" also correctly states an emergency.`,points:10,feedbackCorrect:`Correct — stating the emergency clearly is always step one!`,feedbackIncorrect:`Remember, the first step is always to say what the emergency is.`}]},summary:{keyTakeaways:[`Every emergency call follows five steps: say the emergency, give the location, say who needs help, answer questions, and follow safety instructions.`,`Always give your exact location, like the street name and house number, so help can find you fast.`,`Stay calm and answer the operator's questions clearly, and stay on the phone until they tell you it is okay.`,`Follow safety instructions, like staying away from fire or flood water, until help arrives.`],keyTakeawaysThai:[`การโทรแจ้งเหตุฉุกเฉินทุกครั้งมี 5 ขั้นตอน คือ บอกเหตุฉุกเฉิน บอกสถานที่ บอกว่าใครต้องการความช่วยเหลือ ตอบคำถาม และทำตามคำแนะนำด้านความปลอดภัย`,`บอกสถานที่ที่ชัดเจนเสมอ เช่น ชื่อถนนและบ้านเลขที่ เพื่อให้ความช่วยเหลือมาถึงเร็ว`,`อยู่ในความสงบและตอบคำถามของเจ้าหน้าที่อย่างชัดเจน และอย่าวางสายจนกว่าเจ้าหน้าที่จะบอกว่าวางสายได้`,`ทำตามคำแนะนำด้านความปลอดภัย เช่น อยู่ห่างจากไฟหรือน้ำท่วม จนกว่าความช่วยเหลือจะมาถึง`]}}},ji={id:`l7-rescue-on-mill-road`,number:7,title:`Reading: The Rescue on Mill Road`,subtitle:`Read a rainy-day rescue story and practice finding details, order, and meaning.`,skillCategory:`reading`,estimatedMinutes:25,stages:{warmup:{promptEn:`Look at the title "The Rescue on Mill Road" and this symbol: 🌧️. What do you think will happen in the story? Talk with a partner or write one sentence.`,promptThai:`ดูชื่อเรื่อง "The Rescue on Mill Road" และสัญลักษณ์นี้: 🌧️ คุณคิดว่าเรื่องราวจะเป็นอย่างไร พูดคุยกับเพื่อนหรือเขียนหนึ่งประโยค`,hook:`The title tells us someone will need to be rescued, and the rain symbol suggests the story happens during wet, dangerous weather.`},learn:{intro:`This lesson is a reading passage about an emergency on a rainy day. As you read "The Rescue on Mill Road," practice looking for details, following the order of events, and figuring out what tricky words and pronouns mean.`,introThai:`บทเรียนนี้เป็นเรื่องราวเกี่ยวกับเหตุฉุกเฉินในวันที่ฝนตก ขณะที่คุณอ่านเรื่อง "The Rescue on Mill Road" ให้ฝึกสังเกตรายละเอียด ลำดับเหตุการณ์ และความหมายของคำยากและคำสรรพนาม`,points:[{title:`Read for key details`,body:`Good readers notice who is in the story, what happens, where it happens, and when — these details help you answer comprehension questions.`,bodyThai:`นักอ่านที่ดีจะสังเกตว่าใครอยู่ในเรื่อง เกิดอะไรขึ้น เกิดที่ไหน และเมื่อไร รายละเอียดเหล่านี้ช่วยตอบคำถามเกี่ยวกับเรื่องราวได้`},{title:`Follow the sequence of events`,body:`Stories happen in a certain order. Look for clue words like first, then, next, and finally, and notice what happens before and after each event.`,bodyThai:`เรื่องราวเกิดขึ้นตามลำดับ ให้สังเกตคำสัญญาณ เช่น first, then, next, finally และสังเกตว่าอะไรเกิดขึ้นก่อนและหลัง`},{title:`Use word clues and pronouns`,body:`Words like she, he, and it usually point back to a person or thing mentioned earlier. Difficult words can often be understood from the sentences around them.`,bodyThai:`คำอย่าง she, he, it มักหมายถึงคนหรือสิ่งของที่กล่าวถึงก่อนหน้านี้ คำยากมักเข้าใจได้จากประโยครอบข้าง`}],story:{id:`story-mill-road`,title:`The Rescue on Mill Road`,introEn:`On a rainy afternoon, two children and their aunt spot a car in trouble near a flooded road — read on to see how staying calm helps them save the day.`,introThai:`ในบ่ายวันที่ฝนตกหนัก เด็กสองคนกับป้าของพวกเขาพบรถที่มีปัญหาอยู่ใกล้ถนนที่น้ำท่วม อ่านต่อเพื่อดูว่าการตั้งสติช่วยให้พวกเขาช่วยเหลือสถานการณ์นี้ได้อย่างไร`,wordCount:376,scenes:[{id:`scene-rainy-drive`,title:`A Rainy Drive`,icon:`🌧️`,text:`It was raining very hard on Saturday afternoon. Ploy and her brother Tan were driving home with their aunt, Malee. The rain fell so fast that the windows turned wet and grey. Soon they saw water covering part of Mill Road. A red car had stopped right next to the flood, and nobody was standing near it. "That car isn't moving," said Tan. "Something is wrong."`,vocabSupport:[{word:`flood`,meaningEn:`water covering land that is usually dry`,meaningThai:`น้ำท่วม`}],thaiNote:`ประโยค "That car isn't moving" หมายถึง รถคันนั้นไม่ขยับเลย`},{id:`scene-smoke`,title:`Smoke from the Engine`,icon:`💨`,text:`Aunt Malee stopped their car a safe distance away. Then Ploy saw thin grey smoke rising from the front of the red car. "Look! There's smoke coming from the engine!" she shouted. Her heart was beating fast, but she stayed calm and spoke clearly. "We need to get help right now," she said.`,vocabSupport:[{word:`engine`,meaningEn:`the part of a car that makes it move`,meaningThai:`เครื่องยนต์`}]},{id:`scene-call`,title:`Tan Calls for Help`,icon:`📞`,text:`Tan quickly took his aunt's phone and dialled the emergency number. He took a deep breath so that his voice would stay steady. An emergency operator answered. "Emergency services, what is your emergency?" asked the operator. "There's a car with smoke coming from it, near a flooded road!" Tan said clearly.`,vocabSupport:[{word:`dialled`,meaningEn:`pressed the numbers on a phone to make a call`,meaningThai:`กดหมายเลขโทรศัพท์`},{word:`emergency operator`,meaningEn:`the person who answers emergency calls and sends help`,meaningThai:`เจ้าหน้าที่รับแจ้งเหตุฉุกเฉิน`}],thaiNote:`ประโยค "Emergency services, what is your emergency?" เป็นคำถามที่เจ้าหน้าที่รับแจ้งเหตุฉุกเฉินมักถามก่อนเสมอ`},{id:`scene-location`,title:`Where Are We?`,icon:`📍`,text:`"Where exactly are you?" asked the operator. Tan thought carefully before he answered, remembering the street signs they had just passed. "We are on Mill Road, next to the old wooden bridge, near the market," he explained. The operator thanked him for the clear directions and said that help was on the way.`,vocabSupport:[{word:`directions`,meaningEn:`information that helps someone find a place`,meaningThai:`การบอกตำแหน่งหรือทิศทาง`}]},{id:`scene-extinguisher`,title:`The Fire Extinguisher`,icon:`🧯`,text:`While they waited, Aunt Malee took a fire extinguisher from her car. She stood a safe distance from the smoking car and pointed it carefully at the smoke. She did not go too close, because she knew that could be dangerous for everyone nearby.`,vocabSupport:[{word:`fire extinguisher`,meaningEn:`equipment used to put out small fires`,meaningThai:`ถังดับเพลิง`},{word:`dangerous`,meaningEn:`able to cause harm`,meaningThai:`อันตราย`}]},{id:`scene-rescue`,title:`Emergency Workers Arrive`,icon:`🚒`,text:`A few minutes later, a fire engine and an ambulance arrived with loud sirens. Firefighters helped a man climb safely out of the red car, while everyone else watched quietly from a distance. A paramedic checked him carefully and said that he was not badly hurt.`,vocabSupport:[{word:`sirens`,meaningEn:`loud warning sounds made by emergency vehicles`,meaningThai:`เสียงไซเรน`},{word:`paramedic`,meaningEn:`a person trained to give medical help in an emergency`,meaningThai:`เจ้าหน้าที่พยาบาลฉุกเฉิน`}]},{id:`scene-staying-calm`,title:`Staying Calm`,icon:`💛`,text:`The driver explained that his engine had stopped in the flood water and started to smoke. He thanked Ploy and Tan for noticing and calling for help so quickly. On the way home, Ploy said, "I was scared, but we stayed calm and knew what to do." "Calling for help was the most important thing," said Tan, and Aunt Malee smiled and agreed.`,vocabSupport:[{word:`noticing`,meaningEn:`seeing or realizing something`,meaningThai:`สังเกตเห็น`}],thaiNote:`ประโยค "we stayed calm and knew what to do" หมายถึง พวกเราตั้งสติและรู้ว่าต้องทำอะไร`}]}},examples:{items:[{text:`Ploy saw smoke coming from the car engine and told the others right away.`,noteThai:`พลอยเห็นควันออกมาจากเครื่องยนต์รถและบอกคนอื่นๆ ทันที`},{text:`Tan called the emergency operator and explained exactly where they were.`,noteThai:`ตันโทรหาเจ้าหน้าที่รับแจ้งเหตุฉุกเฉินและอธิบายตำแหน่งที่แน่นอน`},{text:`Aunt Malee used a fire extinguisher from a safe distance.`,noteThai:`ป้ามาลีใช้ถังดับเพลิงจากระยะที่ปลอดภัย`},{text:`The firefighters arrived quickly and helped the driver climb out safely.`,noteThai:`นักดับเพลิงมาถึงอย่างรวดเร็วและช่วยให้คนขับปีนออกมาอย่างปลอดภัย`}]},guided:{questions:[{id:`l7-g-01`,type:`mcq`,skill:`reading`,topic:`Comprehension`,difficulty:`easy`,prompt:`Who was driving the car home in the story?`,options:[`Aunt Malee`,`Ploy`,`Tan`,`The man in the red car`],correctIndex:0,explanation:`Aunt Malee was driving Ploy and Tan home when they saw the red car near the flood.`,explanationThai:`ป้ามาลีเป็นคนขับรถพาพลอยและตันกลับบ้าน ตอนที่พวกเขาเห็นรถสีแดงใกล้น้ำท่วม`,hint1:`Look at the very beginning of the story.`,hint2:`She is the aunt of Ploy and Tan.`,example:`In the story, Tan called the emergency operator.`,points:8,feedbackCorrect:`Correct — Aunt Malee was driving.`,feedbackIncorrect:`Look again at the start of the story to see  car`,`Because she was too tired to walk closer`],correctIndex:0,explanation:`The story explains that Aunt Malee did not go too close because she knew that could be dangerous.`,explanationThai:`เรื่องราวอธิบายว่าป้ามาลีไม่เข้าไปใกล้เกินไป เพราะเธอรู้ว่าอาจเป็นอันตราย`,hint1:`Think about what could happen if she stood right next to a smoking engine.`,hint2:`The word "dangerous" appears in this part of the story.`,example:`Tan called for help because the car had smoke coming from it.`,points:12,feedbackCorrect:`Correct — standing back kept her safe.`,feedbackIncorrect:`Re-read the part about the fire extinguisher and think about safety.`},{id:`l7-g-07`,type:`mcq`,skill:`reading`,topic:`Pronoun Reference`,difficulty:`medium`,prompt:`In the sentence "She stood a safe distance from the smoking car," who does "She" refer to?`,options:[`Aunt Malee`,`Ploy`,`Tan`,`The driver`],correctIndex:0,explanation:`This sentence comes right after Aunt Malee takes out the fire extinguisher, so "She" refers to Aunt Malee.`,explanationThai:`ประโยคนี้อยู่ถัดจากตอนที่ป้ามาลีหยิบถังดับเพลิงออกมา ดังนั้น "She" จึงหมายถึงป้ามาลี`,hint1:`Look at the sentence right before this one to see who is being talked about.`,hint2:`This person is holding the fire extinguisher.`,example:`In "Tan called the operator. He spoke clearly," "He" refers to Tan.`,points:12,feedbackCorrect:`Correct — "She" is Aunt Malee.`,feedbackIncorrect:`Check the sentence just before this one for a clue.`},{id:`l7-g-08`,type:`mcq`,skill:`reading`,topic:`Detail`,difficulty:`medium`,prompt:`What location did Tan give to the emergency operator?`,options:[`Mill Road, next to the old wooden bridge, near the market`,`School Road, next to the park`,`River Road, near the hospital`,`Market Street, next to the bus station`],correctIndex:0,explanation:`Tan told the operator they were on Mill Road, next to the old wooden bridge, near the market.`,explanationThai:`ตันบอกเจ้าหน้าที่ว่าพวกเขาอยู่ที่ถนนมิลล์ ใกล้สะพานไม้เก่า ใกล้ตลาด`,hint1:`Look at the part of the story where Tan explains where they are.`,hint2:`There are three clues: a road, a bridge, and a market.`,example:`"We are on Mill Road" is part of the answer.`,points:10,feedbackCorrect:`Correct — that is the exact location Tan gave.`,feedbackIncorrect:`Re-read the part where Tan answers "Where exactly are you?"`}]},independent:{questions:[{id:`l7-i-01`,type:`mcq`,skill:`reading`,topic:`Vocabulary in Context`,difficulty:`medium`,prompt:`In the story, what does the word "dialled" mean?`,options:[`Pressed the numbers on a phone to make a call`,`Painted a picture of the car`,`Drove the car very quickly`,`Opened the car window`],correctIndex:0,explanation:`"Dialled" means to press or turn the numbers on a phone to make a call, as Tan did to reach the emergency operator.`,explanationThai:`"Dialled" หมายถึงการกดหรือหมุนหมายเลขโทรศัพท์เพื่อโทรออก เหมือนที่ตันทำเพื่อติดต่อเจ้าหน้าที่ฉุกเฉิน`,hint1:`Tan did this with his aunt's phone.`,hint2:`It has nothing to do with painting or driving.`,example:`"She dialled her friend's number to say hello."`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about what you do with a phone to make a call.`},{id:`l7-i-02`,type:`mcq`,skill:`reading`,topic:`Main Idea`,difficulty:`medium`,prompt:`What is the main idea of this story?`,options:[`Two children and their aunt see a smoking car near a flood and calmly get help`,`A family goes on a picnic in the rain`,`Firefighters teach children how to drive a car`,`A red car wins a race on Mill Road`],correctIndex:0,explanation:`The whole story is about Ploy, Tan, and Aunt Malee noticing a car in trouble and calmly getting help for the driver.`,explanationThai:`เรื่องราวทั้งหมดเกี่ยวกับพลอย ตัน และป้ามาลี ที่สังเกตเห็นรถมีปัญหาและตั้งสติขอความช่วยเหลือให้คนขับ`,hint1:`Think about what happens from the beginning to the end of the story.`,hint2:`The story is not about a race or a picnic.`,example:`A story about a lost dog might have the main idea "a family works together to find their dog."`,points:12,feedbackCorrect:`Correct — that is the main idea.`,feedbackIncorrect:`Think about the whole story, not just one small part.`},{id:`l7-i-03`,type:`short-answer`,skill:`reading`,topic:`Short Answer`,difficulty:`medium`,prompt:`What did Tan do to get help for the man in the red car?`,acceptedAnswers:[`call`,`called`,`phone`,`phoned`,`dial`,`dialled`,`emergency operator`,`called the emergency operator`],placeholder:`Type your answer here...`,explanation:`Tan called the emergency operator on his aunt's phone and explained what was happening.`,explanationThai:`ตันโทรหาเจ้าหน้าที่รับแจ้งเหตุฉุกเฉินด้วยโทรศัพท์ของป้า และอธิบายสิ่งที่เกิดขึ้น`,hint1:`He used his aunt's phone.`,hint2:`This is the same action you would do to reach 191 or 199 in an emergency.`,example:`Aunt Malee used a fire extinguisher to deal with the smoke.`,points:12,feedbackCorrect:`Correct — Tan called the emergency operator.`,feedbackIncorrect:`Think about what Tan did with the phone.`},{id:`l7-i-04`,type:`true-false`,skill:`reading`,topic:`Detail`,difficulty:`medium`,prompt:`Read the statement and decide if it is true or false.`,statement:`Aunt Malee stood very close to the car when she used the fire extinguisher.`,correctAnswer:!1,explanation:`Aunt Malee stood a safe distance away from the car, not very close, because getting close could be dangerous.`,explanationThai:`ป้ามาลียืนอยู่ห่างจากรถในระยะที่ปลอดภัย ไม่ได้เข้าไปใกล้ เพราะอาจเป็นอันตราย`,hint1:`Think about the word "safe distance" in the story.`,hint2:`Getting close to smoke or fire is usually not a good idea.`,example:`"It was raining very hard." — True.`,points:10,feedbackCorrect:`Correct — she stayed a safe distance away.`,feedbackIncorrect:`Re-read the part about the fire extinguisher again.`},{id:`l7-i-05`,type:`mcq`,skill:`reading`,topic:`Who Said It?`,difficulty:`medium`,prompt:`Who said, "Where exactly are you?"`,options:[`The emergency operator`,`Tan`,`Ploy`,`Aunt Malee`],correctIndex:0,explanatio ium`,prompt:`Sort these words by how they spell the /aɪ/ sound.`,promptThai:`จัดหมวดหมู่คำเหล่านี้ตามวิธีสะกดเสียง /aɪ/`,categories:Ni,items:[{id:`i1`,label:`bike`,categoryId:`pat-i_e`},{id:`i2`,label:`five`,categoryId:`pat-i_e`},{id:`i3`,label:`drive`,categoryId:`pat-i_e`},{id:`i4`,label:`fine`,categoryId:`pat-i_e`},{id:`i5`,label:`light`,categoryId:`pat-igh`},{id:`i6`,label:`night`,categoryId:`pat-igh`},{id:`i7`,label:`Brighton`,categoryId:`pat-igh`},{id:`i8`,label:`child`,categoryId:`pat-i`},{id:`i9`,label:`climb`,categoryId:`pat-i`},{id:`i10`,label:`fire`,categoryId:`pat-ire`}],explanation:`The /aɪ/ sound can be spelled i_e (bike, five, drive, fine), igh (light, night, Brighton), i alone (child, climb), or ire (fire).`,explanationThai:`เสียง /aɪ/ สะกดได้หลายแบบ: i_e (bike, five, drive, fine), igh (light, night, Brighton), i เดี่ยว (child, climb) หรือ ire (fire)`,hint1:`Look at the letters right around where you hear the /aɪ/ sound in each word.`,hint2:`Words ending in a silent e after one consonant usually belong in the i_e group.`,example:`'Time' belongs in the i_e group, just like 'bike'.`,points:16,feedbackCorrect:`All sorted correctly! You know all four spelling patterns.`,feedbackIncorrect:`A few words are in the wrong group — check the letters again.`},{id:`l8-g-03`,type:`match`,skill:`phonics`,topic:`Picture Match`,difficulty:`easy`,prompt:`Match each word to its picture.`,promptThai:`จับคู่คำกับภาพ`,left:[{id:`w1`,label:`bike`},{id:`w2`,label:`fire`},{id:`w3`,label:`night`},{id:`w4`,label:`child`}],right:[{id:`e1`,label:`🚲`},{id:`e2`,label:`🔥`},{id:`e3`,label:`🌙`},{id:`e4`,label:`🧒`}],pairs:{w1:`e1`,w2:`e2`,w3:`e3`,w4:`e4`},explanation:`Each word matches its picture: bike is a bicycle, fire is flames, night is shown by the moon, and child is a young person.`,explanationThai:`แต่ละคำจับคู่กับภาพ: bike คือจักรยาน, fire คือไฟ, night แสดงด้วยพระจันทร์ และ child คือเด็ก`,hint1:`A bike has two wheels.`,hint2:`The moon comes out at night.`,example:`'fire' → 🔥`,points:12,feedbackCorrect:`All matched — great listening!`,feedbackIncorrect:`Check the pictures again.`},{id:`l8-g-04`,type:`mcq`,skill:`phonics`,topic:`Odd Sound Out`,difficulty:`medium`,prompt:`Find the odd sound out.`,promptThai:`หาคำที่มีเสียงแตกต่าง`,options:[`bike`,`five`,`night`,`bit`],correctIndex:3,explanation:`'Bike', 'five', and 'night' all have the /aɪ/ sound. 'Bit' has a short i sound instead.`,explanationThai:`'Bike' 'five' และ 'night' มีเสียง /aɪ/ แต่ 'bit' มีเสียงสระ i สั้น`,hint1:`Three of these words have the "long I" sound.`,hint2:`Say 'bit' out loud — does it sound like 'bite'?`,example:`In 'light, fire, five, sit' — 'sit' is the odd one out.`,points:10,feedbackCorrect:`Correct — 'bit' has a short i sound.`,feedbackIncorrect:`Listen again — three words share the same long sound.`},{id:`l8-g-05`,type:`fill-blank`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Complete the word to match the sentence.`,promptThai:`เติมคำให้ตรงกับประโยค`,before:`The word for a two-wheeled vehicle is b`,after:`ke.`,answers:[`i`],explanation:`The word is 'bike' — the letters i_e together make the /aɪ/ sound.`,explanationThai:`คำนี้คือ 'bike' ตัวอักษร i_e รวมกันออกเสียง /aɪ/`,hint1:`This is a vehicle you pedal with your feet.`,hint2:`It rhymes with 'like' and 'five'.`,example:`b___ke → bike`,points:10,feedbackCorrect:`Correct — 'bike' is right!`,feedbackIncorrect:`Think about a two-wheeled vehicle you ride.`},{id:`l8-g-06`,type:`mcq`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Which letters make the /aɪ/ sound in the word 'light'?`,promptThai:`ตัวอักษรใดในคำว่า 'light' ที่ออกเสียง /aɪ/?`,options:[`igh`,`i_e`,`l`,`ght`],correctIndex:0,explanation:`In 'light', the three letters 'igh' together make the /aɪ/ sound.`,explanationThai:`ในคำว่า 'light' ตัวอักษรสามตัว 'igh' รวมกันออกเสียง /aɪ/`,hint1:`Look at the middle of the word, not the first or last letter alone.`,hint2:`The same three letters appear in 'night' and 'Brighton'.`,example:`In 'night', the letters 'igh' make the /aɪ/ sound too.`,points:10,feedbackCorrect:`Correct — 'igh' makes the /aɪ/ sound!`,feedbackIncorrect:`Look at the three letters in the middle of the word.`},{id:`l8-g-07`,type:`mcq`,skill:`phonics`,topic:`Reading for Sounds`,difficulty:`medium`,prompt:`Read this paragraph:\n\n"${Mi}"\n\nHow many words in this paragraph have the /aɪ/ sound?`,promptThai:`อ่านย่อหน้านี้แล้วนับว่ามีกี่คำที่มีเสียง /aɪ/`,options:[`7`,`10`,`13`,`15`],correctIndex:1,explanation:`The paragraph has 10 words with the /aɪ/ sound: Mike, likes, ride, bike, night, bright, light, fire, five, and kind.`,explanationThai:`ย่อหน้านี้มีคำที่มีเสียง /aɪ/ ทั้งหมด 10 คำ: Mike, likes, ride, bike, night, bright, light, fire, five, kind`,hint1:`Read slowly and count every word with the "long I" sound as you go.`,hint2:`Some words share the same spelling pattern but are still counted separately.`,example:`In 'Five kind kids like to ride', there are 4 /aɪ/ words: five, kind, like, ride.`,points:14,feedbackCorrect:`Correct — there are 10 /aɪ/ words in the paragraph!`,feedbackIncorrect:`Try reading again slowly and counting each /aɪ/ word.`},{id:`l8-g-08`,type:`mcq`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Which spelling pattern is used in the word 'fire'?`,promptThai:`คำว่า 'fire' ใช้รูปแบบการสะกดแบบใด?`,options:[`ire`,`i_e`,`igh`,`i`],correctIndex:0,explanation:`'Fire' ends with the letters 'ire', which make the /aɪ/ sound.`,explanationThai:`คำว่า 'fire' ลงท้ายด้วยตัวอักษร 'ire' ซึ่งออกเสียง /aɪ/`,hint1:`Look at the last three letters of the word.`,hint2:`This same pattern appears in 'wire' and 'hire'.`,example:`'Wire' also uses the ire pattern.`,points:10,feedbackCorrect:`Correct — 'fire' uses the ire pattern!`,feedbackIncorrect:`Look closely at the last three letters.`}],Fi=[{id:`l8-i-01`,type:`mcq`,skill:`phonics`,topic:`Word Recognition`,difficulty:`easy`,prompt:`Which word has the /aɪ/ sound?`,promptThai:`คำไหนมีเสียง /aɪ/?`, `,w2:`e2`,w3:`e3`,w4:`e4`},explanation:`'Five' is the number 5, 'light' is shown by a bulb, 'drive' is shown by a car, and 'climb' is shown by a climber.`,explanationThai:`'Five' คือเลข 5, 'light' แสดงด้วยหลอดไฟ, 'drive' แสดงด้วยรถยนต์ และ 'climb' แสดงด้วยคนกำลังปีน`,hint1:`One picture is a number.`,hint2:`One picture shows someone going up, not driving.`,example:`'fire' → 🔥`,points:12,feedbackCorrect:`All matched — great work!`,feedbackIncorrect:`Check the pictures again.`},{id:`l8-i-04`,type:`mcq`,skill:`phonics`,topic:`Odd Sound Out`,difficulty:`medium`,prompt:`Find the odd sound out.`,promptThai:`หาคำที่มีเสียงแตกต่าง`,options:[`light`,`night`,`fire`,`sit`],correctIndex:3,explanation:`'Light', 'night', and 'fire' all have the /aɪ/ sound. 'Sit' has a short i sound.`,explanationThai:`'Light' 'night' และ 'fire' มีเสียง /aɪ/ แต่ 'sit' มีเสียงสระ i สั้น`,hint1:`Three words rhyme with 'kite' or 'wire'.`,hint2:`Which word sounds like 'sit', not 'site'?`,example:`In 'bike, five, night, bit' — 'bit' is the odd one out.`,points:10,feedbackCorrect:`Correct — 'sit' has a short i sound.`,feedbackIncorrect:`Listen again — three words share the /aɪ/ sound.`},{id:`l8-i-05`,type:`fill-blank`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Complete the word to match the sentence.`,promptThai:`เติมคำให้ตรงกับประโยค`,before:`It was very dark, so we turned on a br`,after:`t light.`,answers:[`igh`],explanation:`The word is 'bright' — the letters igh make the /aɪ/ sound.`,explanationThai:`คำนี้คือ 'bright' ตัวอักษร igh ออกเสียง /aɪ/`,hint1:`This word describes a strong light.`,hint2:`It rhymes with 'night' and 'light'.`,example:`br___t → bright`,points:10,feedbackCorrect:`Correct — 'bright' is right!`,feedbackIncorrect:`Think of a word that means 'full of light'.`},{id:`l8-i-06`,type:`mcq`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Which letters make the /aɪ/ sound in the word 'bike'?`,promptThai:`ตัวอักษรใดในคำว่า 'bike' ที่ออกเสียง /aɪ/?`,options:[`i_e`,`igh`,`b`,`ke`],correctIndex:0,explanation:`In 'bike', the silent e at the end makes the i say its name — this is the i_e pattern.`,explanationThai:`ในคำว่า 'bike' ตัว e ที่ไม่ออกเสียงท้ายคำทำให้ i ออกเสียงเป็นชื่อของมันเอง เรียกว่ารูปแบบ i_e`,hint1:`Notice the silent letter at the end of the word.`,hint2:`The same pattern appears in 'five' and 'drive'.`,example:`In 'fine', the i_e pattern also makes the /aɪ/ sound.`,points:10,feedbackCorrect:`Correct — 'bike' uses the i_e pattern!`,feedbackIncorrect:`Look at the vowel and the silent letter at the end.`},{id:`l8-i-07`,type:`short-answer`,skill:`phonics`,topic:`Reading for Sounds`,difficulty:`medium`,prompt:`Read this paragraph again:\n\n"${Mi}"\n\nWrite ONE word from the paragraph that has the /aɪ/ sound.`,promptThai:`เขียนคำหนึ่งคำจากย่อหน้าข้างต้นที่มีเสียง /aɪ/`,acceptedAnswers:[`mike`,`likes`,`ride`,`bike`,`night`,`bright`,`light`,`fire`,`five`,`kind`],placeholder:`Type a word...`,explanation:`Many words in the paragraph have the /aɪ/ sound, including Mike, likes, ride, bike, night, bright, light, fire, five, and kind.`,explanationThai:`หลายคำในย่อหน้ามีเสียง /aɪ/ เช่น Mike, likes, ride, bike, night, bright, light, fire, five, kind`,hint1:`Look for words that rhyme with 'kite'.`,hint2:`The word for a two-wheeled vehicle is one example.`,example:`'Fire' is one word from the paragraph with the /aɪ/ sound.`,points:12,feedbackCorrect:`Correct — that word does have the /aɪ/ sound!`,feedbackIncorrect:`Read the paragraph again and listen for the "long I" sound.`},{id:`l8-i-08`,type:`mcq`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Which spelling pattern is used in the word 'child'?`,promptThai:`คำว่า 'child' ใช้รูปแบบการสะกดแบบใด?`,options:[`i`,`igh`,`i_e`,`ire`],correctIndex:0,explanation:`'Child' uses a single letter i before two consonants (ld) to make the /aɪ/ sound.`,explanationThai:`คำว่า 'child' ใช้ตัวอักษร i เดี่ยวหน้าพยัญชนะสองตัว (ld) เพื่อออกเสียง /aɪ/`,hint1:`There is no silent e and no 'igh' in this word.`,hint2:`This same pattern appears in 'climb', 'mild', and 'wild'.`,example:`'Climb' also uses the i alone pattern.`,points:10,feedbackCorrect:`Correct — 'child' uses the i alone pattern!`,feedbackIncorrect:`Look closely — there's no silent e or 'igh' here.`}],Ii=[{id:`l8-mq-01`,type:`mcq`,skill:`phonics`,topic:`Word Recognition`,difficulty:`easy`,prompt:`Which word has the /aɪ/ sound?`,promptThai:`คำไหนมีเสียง /aɪ/?`,options:[`night`,`top`,`bag`,`sun`],correctIndex:0,explanation:`'Night' has the /aɪ/ sound spelled igh.`,explanationThai:`'Night' มีเสียง /aɪ/ สะกดแบบ igh`,hint1:`Say each word slowly.`,hint2:`This word rhymes with 'light' and 'bright'.`,example:`'Fire' also has the /aɪ/ sound.`,points:8,feedbackCorrect:`Yes — 'night' has the /aɪ/ sound!`,feedbackIncorrect:`Listen again for the "long I" sound.`},{id:`l8-mq-02`,type:`mcq`,skill:`phonics`,topic:`Odd Sound Out`,difficulty:`medium`,prompt:`Find the odd sound out.`,promptThai:`หาคำที่มีเสียงแตกต่าง`,options:[`child`,`climb`,`fine`,`chip`],correctIndex:3,explanation:`'Child', 'climb', and 'fine' all have the /aɪ/ sound. 'Chip' has a short i sound.`,explanationThai:`'Child' 'climb' และ 'fine' มีเสียง /aɪ/ แต่ 'chip' มีเสียงสระ i สั้น`,hint1:`Three of these words rhyme with 'mild' or 'wild'.`,hint2:`Say 'chip' out loud — does it sound like 'child'?`,example:`In 'light, night, fire, hit' — 'hit' is the odd one out.`,points:10,feedbackCorrect:`Correct — 'chip' has a short i sound.`,feedbackIncorrect:`Listen again — three words share the /aɪ/ sound.`},{id:`l8-mq-03`,type:`fill-blank`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Complete the word to match the sentence.`,promptThai:`เติมคำให้ตรงกับประโยค`,before:`Firefighters use water to put out a f`,after:`e.`,answers:[`ir`],explanation:`The word is 'fire' — the letters ire make the /aɪ/ sound.`,explanationThai:`คำนี้คือ 'fire' ตัวอักษร ire ออกเสียง /aɪ/`,hint1:`This word means hot flames that
