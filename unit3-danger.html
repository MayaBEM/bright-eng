hat the operator needs to know first, and what comes last.`},{id:`l14-i-08`,type:`sequence`,skill:`reading`,topic:`Emergency Picture Sequence`,difficulty:`medium`,presentation:`events`,prompt:`Imagine this picture story: a car has stopped by a flooded road, smoke is coming from the engine, and two firefighters are running toward it with a fire extinguisher. Put these four steps of the scene in the correct order.`,promptThai:`ลองนึกภาพเรื่องราวนี้: รถคันหนึ่งจอดอยู่ข้างถนนที่น้ำท่วม มีควันออกมาจากเครื่องยนต์ และนักดับเพลิงสองคนกำลังวิ่งเข้าไปพร้อมถังดับเพลิง เรียงลำดับสี่ขั้นตอนของเหตุการณ์นี้ให้ถูกต้อง`,items:[{id:`e1`,label:`The car stops on the flooded road.`},{id:`e2`,label:`Smoke starts coming from the engine.`},{id:`e3`,label:`Two firefighters run toward the car with a fire extinguisher.`},{id:`e4`,label:`The firefighters put out the smoking engine and help the driver.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`First the car stops in the flood water, then smoke appears, then the firefighters run over with equipment, and finally they put out the fire and help the driver.`,explanationThai:`ก่อนอื่นรถหยุดอยู่ในน้ำท่วม จากนั้นมีควันปรากฏขึ้น แล้วนักดับเพลิงวิ่งเข้าไปพร้อมอุปกรณ์ และสุดท้ายพวกเขาดับไฟและช่วยเหลือคนขับ`,hint1:`The car must stop before smoke can appear from the engine.`,hint2:`Helping the driver is the last step, after the fire is under control.`,example:`In another emergency: heavy rain falls → the road floods → cars stop → people call for help.`,points:16,feedbackCorrect:`Great — that is the correct order of the scene!`,feedbackIncorrect:`Think about what must happen before the firefighters can act.`},{id:`l14-i-09`,type:`mcq`,skill:`reading`,topic:`General Review`,difficulty:`medium`,prompt:`Which sentence best describes a flood, based on what you have read in this unit?`,promptThai:`ประโยคใดอธิบายน้ำท่วมได้ดีที่สุด จากสิ่งที่คุณได้อ่านในบทเรียนนี้?`,options:[`Too much water covers land that is usually dry.`,`A very sunny day with no clouds.`,`A small fire in a kitchen.`,`A car that will not start.`],correctIndex:0,explanation:`A flood is when too much water covers land that is usually dry, often caused by heavy rain.`,explanationThai:`น้ำท่วมคือเมื่อมีน้ำมากเกินไปปกคลุมพื้นที่ที่ปกติแห้ง ซึ่งมักเกิดจากฝนตกหนัก`,hint1:`Think about the flood information text you read.`,hint2:`The other options do not involve water at all.`,example:`A fire and a flood are two different kinds of emergencies.`,points:10,feedbackCorrect:`Correct — that is the best description of a flood.`,feedbackIncorrect:`Think back to the flood information text.`},{id:`l14-i-10`,type:`true-false`,skill:`reading`,topic:`General Review`,difficulty:`medium`,prompt:`Is this statement true or false: 'In the rescue story and the phone call dialogue, both emergencies were caused by flooding.'`,promptThai:`ข้อความนี้จริงหรือเท็จ: 'ทั้งในเรื่องราวการช่วยเหลือและบทสนทนาทางโทรศัพท์ เหตุฉุกเฉินทั้งสองเกิดจากน้ำท่วม'`,statement:`In the rescue story and the phone call dialogue, both emergencies were caused by flooding.`,correctAnswer:!0,explanation:`The Somsri family story is about a flood near Mill Road, and the phone call is about a flood near a school — both are flooding emergencies.`,explanationThai:`เรื่องราวของครอบครัวสมศรีเกี่ยวกับน้ำท่วมใกล้ถนนมิลล์ และบทสนทนาทางโทรศัพท์เกี่ยวกับน้ำท่วมใกล้โรงเรียน ทั้งสองเป็นเหตุฉุกเฉินจากน้ำท่วม`,hint1:`Think about what caused each emergency in the two texts.`,hint2:`Neither text mentions a fire.`,example:`The picture-sequence task, however, is about a car fire, not a flood.`,points:10,feedbackCorrect:`Correct — both texts describe flood emergencies.`,feedbackIncorrect:`Think about the cause of each emergency you read about.`},{id:`l14-i-11`,type:`short-answer`,skill:`reading`,topic:`The Rescue Story`,difficulty:`challenge`,prompt:`Read the story about the Somsri family once more. Why do you think the family climbed onto the roof instead of staying inside the house?`,promptThai:`อ่านเรื่องราวของครอบครัวสมศรีอีกครั้ง คุณคิดว่าทำไมครอบครัวจึงปีนขึ้นไปบนหลังคาแทนที่จะอยู่ในบ้าน?`,acceptedAnswers:[`safe`,`safety`,`water`,`flood`,`dry`,`help`],placeholder:`Type your answer here...`,explanation:`Water covered the street and filled the house, so the roof was the safest, driest place to wait for rescue and be seen by helpers.`,explanationThai:`น้ำท่วมถนนและเข้าไปในบ้าน หลังคาจึงเป็นที่ปลอดภัยและแห้งที่สุดในการรอความช่วยเหลือ และทำให้ผู้ช่วยเหลือมองเห็นพวกเขาได้`,hint1:`Think about which part of the house stays driest during a flood.`,hint2:`Think about how the rescue team could see and reach them.`,example:`This is a "why" question, so there is no single exact word — explain your idea.`,points:12,feedbackCorrect:`Good thinking — that is a sensible reason.`,feedbackIncorrect:`Think about safety, dryness, or being seen by rescuers.`}]},miniQuiz:{questions:[{id:`l14-mq-01`,type:`mcq`,skill:`reading`,topic:`The Rescue Story`,difficulty:`medium`,prompt:`Read the story about the Somsri family once more. What did the family do to get help?`,promptThai:`อ่านเรื่องราวของครอบครัวสมศรีอีกครั้ง ครอบครัวทำอะไรเพื่อขอความช่วยเหลือ?`,options:[`They waved for help from the roof.`,`They swam to school.`,`They called a taxi.`,`They stayed in the kitchen.`],correctIndex:0,explanation:`The story says they climbed onto the roof and waved for help.`,explanationThai:`เรื่องราวบอกว่าพวกเขาปีนขึ้นไปบนหลังคาและโบกมือขอความช่วยเหลือ`,hint1:`Think about a hand movement people make to get attention.`,hint2:`They were not in the kitchen — it was full of water.`,example:`The rescue team saw them and came in a boat.`,points:10,feedbackCorrect:`Correct — they waved for help.`,feedbackIncorrect:`Look at what the family did on the roof.`},{id:`l14-mq-02`,type:`true-false`,skill:`reading`,topic:`Flood Information`,difficulty:`medium`,prompt:`Is this statement true or false: 'Heavy rain is the only cause of a flood mentioned in the text.'`,promptThai:`ข้อความนี้จริงหรือเท็จ: 'ฝนตกหนักเป็นสาเหตุเดียวของน้ำท่วมที่กล่าวถึงในข้อความ'`,statement:`Heavy rain is the only cause of a flood mentioned in the text.`,correctAnswer:!1,explanation:`The text mentions two causes: heavy rain AND blocked drains, which can make flooding worse.`,explanationThai:`ข้อความกล่าวถึงสองสาเหตุ ได้แก่ ฝนตกหนักและท่อระบายน้ำที่อุดตัน ซึ่งทำให้น้ำท่วมแย่ลง`,hint1:`Look for the word "also" in the text.`,hint2:`There is more than one cause mentioned.`,example:`Statement: "Roads can close during a flood." → True.`,points:10,feedbackCorrect:`Correct — blocked drains are also mentioned as a cause.`,feedbackIncorrect:`Read the text again — is there a second cause mentioned?`},{id:`l14-mq-03`,type:`short-answer`,skill:`reading`,topic:`Flood Information`,difficulty:`medium`,prompt:`What can happen to roads during a flood, according to the text?`,promptThai:`ตามข้อความ ถนนอาจเกิดอะไรขึ้นในช่วงน้ำท่วม?`,acceptedAnswers:[`close`,`roads can close`,`road closes`],placeholder:`Type your answer here...`,explanation:`The text says "roads can close" during a flood.`,explanationThai:`ข้อความระบุว่า "roads can close" (ถนนอาจถูกปิด) ในช่วงน้ำท่วม`,hint1:`Look at the last sentence of the flood information text.`,hint2:`It is a short answer — just a few words.`,example:`The text also says people sometimes have to leave their homes.`,points:10,feedbackCorrect:`Correct — roads can close during a flood.`,feedbackIncorrect:`Look at the last sentence of the text again.`},{id:`l14-mq-04`,type:`mcq`,skill:`dialogue`,topic:`Emergency Dialogue`,difficulty:`medium`,prompt:`Read the school-flood dialogue once more. What does the operator tell the caller at the end of the call?`,promptThai:`อ่านบทสนทนาเรื่องน้ำท่วมโรงเรียนอีกครั้ง เจ้าหน้าที่บอกอะไรกับผู้โทรในตอนท้ายของสาย?`,options:[`Stay calm. Help is coming very soon.`,`Please call back tomorrow.`,`Go and check the second floor yourself.`,`The school is closed today.`],correctIndex:0,explanation:`The operator ends the call by saying, "Stay calm. Help is coming very soon."`,explanationThai:`เจ้าหน้าที่จบสายด้วยการพูดว่า "Stay calm. Help is coming very soon."`,hint1:`This is the operator's very last line in the dialogue.`,hint2:`It is meant to reassure the caller, not give them a task.`,example:`Earlier, the operator asked, "Is anyone in danger right now?"`,points:10,feedbackCorrect:`Correct — the operator reassures the caller.`,feedbackIncorrect:`Look at the operator's final line in the dialogue.`},{id:`l14-mq-05`,type:`sequence`,skill:`reading`,topic:`Emergency Picture Sequence`,difficulty:`medium`,presentation:`events`,prompt:`Imagine this picture story again: a car has stopped by a flooded road, smoke is coming from the engine, and two firefighters are running toward it with a fire extinguisher. Put the four steps in the correct order.`,promptThai:`ลองนึกภาพเรื่องราวนี้อีกครั้ง แล้วเรียงลำดับสี่ขั้นตอนให้ถูกต้อง`,items:[{id:`e1`,label:`The car stops on the flooded road.`},{id:`e2`,label:`Smoke starts coming from the engine.`},{id:`e3`,label:`Two firefighters run toward the car with a fire extinguisher.`},{id:`e4`,label:`The firefighters put out the smoking engine and help the driver.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`],explanation:`The car stops, then smoke appears, then the firefighters arrive with equipment, and finally they put out the fire and help the driver.`,explanationThai:`รถหยุด จากนั้นมีควันปรากฏขึ้น แล้วนักดับเพลิงมาถึงพร้อมอุปกรณ์ และสุดท้ายพวกเขาดับไฟและช่วยเหลือคนขับ`,hint1:`What must happen before the firefighters can start helping?`,hint2:`Helping the driver is always the last step.`,example:`Heavy rain falls → the road floods → cars stop → people call for help.`,points:16,feedbackCorrect:`Great — that is the correct order of the scene!`,feedbackIncorrect:`Think about the order smoke, firefighters, and help happen in.`},{id:`l14-mq-06`,type:`mcq`,skill:`reading`,topic:`General Review`,difficulty:`challenge`,prompt:`Based on everything you read in this lesson, what is the best first step when you notice a flood emergency?`,promptThai:`จากทุกสิ่งที่คุณได้อ่านในบทเรียนนี้ ขั้นตอนแรกที่ดีที่สุดเมื่อคุณสังเกตเห็นเหตุฉุกเฉินจากน้ำท่วมคืออะไร?`,options:[`Move to a safe, dry place and call the emergency services.`,`Keep walking through the flood water.`,`Wait quietly and do nothing.`,`Turn off your phone.`],correctIndex:0,explanation:`Both texts show that getting to safety and calling for help are the most important first steps in a flood emergency.`,explanationThai:`ทั้งสองข้อความแสดงให้เห็นว่าการไปยังที่ปลอดภัยและโทรขอความช่วยเหลือเป็นขั้นตอนแรกที่สำคัญที่สุดในเหตุฉุกเฉินจากน้ำท่วม`,hint1:`Think about what the Somsri family and the school caller both did.`,hint2:`Walking through flood water is dangerous, not helpful.`,example:`The Somsri family moved to the roof and waited for rescue.`,points:14,feedbackCorrect:`Correct — get to safety and call for help.`,feedbackIncorrect:`Think about what both examples in this lesson have in common.`}]},summary:{keyTakeaways:[`Reading for detail means noticing exactly who did what, where, and when in a story or information text.`,`The flood information text showed two causes of flooding: heavy rain and blocked drains.`,`Clear writing uses time words like First, Next, Then, Suddenly, and Finally to put events in order.`,`A good emergency description or safety rule explains not just what happened, but why it matters.`],keyTakeawaysThai:[`การอ่านอย่างละเอียดหมายถึงการสังเกตว่าใครทำอะไร ที่ไหน และเมื่อไหร่ในเรื่องราวหรือข้อความความรู้`,`ข้อความความรู้เรื่องน้ำท่วมแสดงสาเหตุสองอย่าง ได้แก่ ฝนตกหนักและท่อระบายน้ำอุดตัน`,`การเขียนที่ชัดเจนใช้คำบอกลำดับเวลา เช่น First, Next, Then, Suddenly และ Finally เพื่อเรียงเหตุการณ์`,`คำอธิบายเหตุฉุกเฉินหรือกฎความปลอดภัยที่ดีควรอธิบายทั้งสิ่งที่เกิดขึ้นและเหตุผลว่าทำไมจึงสำคัญ`]}},writing:[{id:`l14-w-01`,prompt:`Imagine this picture: a car has stopped by a flooded road, smoke is coming from the engine, and two firefighters are running toward it. Write 4-6 sentences describing what is happening in the picture.`,promptThai:`ลองนึกภาพนี้: รถคันหนึ่งจอดอยู่ข้างถนนที่น้ำท่วม มีควันออกมาจากเครื่องยนต์ และนักดับเพลิงสองคนกำลังวิ่งเข้าไป เขียน 4-6 ประโยคอธิบายสิ่งที่เกิดขึ้นในภาพ`,placeholder:`First, a car stopped on the flooded road...`,scaffold:[`First, ...`,`Next, ...`,`Then, ...`,`Suddenly, ...`,`Finally, ...`],modelAnswer:`First, a car stopped in the middle of a flooded road. Next, smoke started coming out from under the engine. Then, the driver got out and stood next to the car, looking worried. Suddenly, two firefighters came running toward the car with a fire extinguisher. Finally, the firefighters put out the smoke and helped the driver walk to safety.`,checklist:[`Did I write at least 4 sentences?`,`Did I use time words like First, Next, Then, Suddenly, or Finally?`,`Did I describe both the car problem and the firefighters helping?`,`Did I use a capital letter and a full stop for every sentence?`]},{id:`l14-w-02`,prompt:`It is 8pm on Saturday. Write 4-6 sentences about what different people were doing when the flood alarm suddenly rang. Use the past continuous (was/were + verb-ing) for at least three sentences.`,promptThai:`เวลา 20:00 น. วันเสาร์ เขียน 4-6 ประโยคเกี่ยวกับสิ่งที่ผู้คนต่างๆ กำลังทำเมื่อสัญญาณเตือนน้ำท่วมดังขึ้นอย่างกะทันหัน ใช้อดีตต่อเนื่อง (was/were + กริยาเติม -ing) อย่างน้อยสามประโยค`,placeholder:`When the flood alarm rang, I was...`,scaffold:[`I was ... when the alarm rang.`,`My mother was ...`,`My neighbours were ...`,`Outside, the dog was ...`],modelAnswer:`When the flood alarm rang, I was doing my homework at the kitchen table. My mother was cooking dinner in the kitchen. My little brother was watching cartoons on TV. Outside, our neighbours were carrying boxes out of their house. My father was listening to the radio for more news. Everyone stopped what they were doing and moved quickly to help each other.`,checklist:[`Did I use "was" or "were" with at least three different people?`,`Did I use a verb ending in -ing after was/were each time?`,`Did I mention the moment the alarm rang?`,`Did I use a capital letter and a full stop for every sentence?`]},{id:`l14-w-03`,prompt:`Complete this emergency phone message. Someone has already started it for you — finish it with 3-5 more sentences: "Hello, emergency services? My name is Somchai. There is a flood near my house on River Road. ..."`,promptThai:`เติมข้อความโทรศัพท์แจ้งเหตุฉุกเฉินนี้ให้สมบูรณ์ มีคนเริ่มเขียนไว้ให้แล้ว ให้คุณเขียนต่ออีก 3-5 ประโยค: "Hello, emergency services? My name is Somchai. There is a flood near my house on River Road. ..."`,placeholder:`The water is already...`,scaffold:[`The water is...`,`My family and I are...`,`We need...`,`Please send...`],modelAnswer:`Hello, emergency services? My name is Somchai. There is a flood near my house on River Road. The water is already up to the front door and it is still rising. My family and I are safe on the second floor, but we cannot leave the house. We need a rescue boat as soon as possible. Please send help quickly — there are three adults and two children here.`,checklist:[`Did I say how deep or serious the water is?`,`Did I say whether my family and I are safe right now?`,`Did I clearly ask for the kind of help I need?`,`Did I use complete sentences with capital letters and full stops?`]},{id:`l14-w-04`,prompt:`Explain one cause of a flood in 3-4 sentences. Use what you learned about floods in this unit.`,promptThai:`อธิบายสาเหตุหนึ่งของน้ำท่วมใน 3-4 ประโยค โดยใช้ความรู้ที่คุณได้เรียนในบทเรียนนี้`,placeholder:`One cause of a flood is...`,scaffold:[`One cause of a flood is...`,`This happens when...`,`For example,...`],modelAnswer:`One cause of a flood is heavy rain that falls for many days without stopping. This happens when a river cannot hold all the extra water, so it rises and flows over its banks. For example, if it rains every day for a week, the river near a town can overflow and cover the streets with water. This is why weather reports often warn people before very heavy rain arrives.`,checklist:[`Did I name one clear cause of a flood?`,`Did I explain why that cause leads to flooding?`,`Did I write at least 3 full sentences?`,`Did I use a capital letter and a full stop for every sentence?`]},{id:`l14-w-05`,prompt:`Write a short safety rule about what to do (or not do) near flood water or fire. Explain your rule in 3-4 sentences.`,promptThai:`เขียนกฎความปลอดภัยสั้นๆ เกี่ยวกับสิ่งที่ควรทำ (หรือไม่ควรทำ) เมื่ออยู่ใกล้น้ำท่วมหรือไฟไหม้ อธิบายกฎของคุณใน 3-4 ประโยค`,placeholder:`A good safety rule is...`,scaffold:[`A good safety rule is...`,`You should never...`,`This is important because...`],modelAnswer:`A good safety rule is: never walk or drive through flood water, even if it looks shallow. You should never do this because flood water can be much deeper and faster than it looks, and it can hide dangerous things like open drains. This is important because people can be swept away or hurt very quickly. Instead, always move to higher ground and wait for help.`,checklist:[`Did I write one clear safety rule?`,`Did I explain why the rule is important?`,`Did I write at least 3 full sentences?`,`Did I use a capital letter and a full stop for every sentence?`]}]},Gi=`Ben was riding his bike near Mill Road when he saw thick black smoke. An old house was on fire! Ben quickly called the emergency operator and gave the address. Two fire engines arrived in six minutes. The firefighters rescued an elderly man and his dog from the second floor. Everyone was safe, and the man thanked Ben for calling for help.`,Ki=`Mia and her family were camping near the coast when the sky turned dark grey. The radio announced a flood warning because of heavy rain upriver. Waves began to crash over the old seawall, and water rushed onto the campsite. Mia's dad quickly packed the car while her mom grabbed the flashlight. The family drove to higher ground just as the water reached their tent. Later, they watched the news and learned that the whole campsite was under water.`,qi=[{id:`pt-01`,type:`mcq`,skill:`vocabulary`,topic:`Emergency Workers`,difficulty:`easy`,prompt:`Which word means 'a person trained to give medical help in an emergency'?`,promptThai:`คำใดหมายถึง 'บุคคลที่ได้รับการฝึกฝนให้ช่วยเหลือทางการแพทย์ในเหตุฉุกเฉิน'?`,options:[`paramedic`,`firefighter`,`police officer`,`emergency operator`],correctIndex:0,explanation:`A paramedic is trained to give medical help to people who are hurt or sick during an emergency.`,explanationThai:`เจ้าหน้าที่พยาบาลฉุกเฉินได้รับการฝึกฝนให้ช่วยเหลือทางการแพทย์แก่ผู้บาดเจ็บหรือป่วยในเหตุฉุกเฉิน`,hint1:`This person often works inside an ambulance.`,hint2:`It is not the person who puts out fires.`,example:`A firefighter puts out fires and rescues people.`,points:10,feedbackCorrect:`Correct — a paramedic gives medical help.`,feedbackIncorrect:`Think about who works inside the ambulance.`},{id:`pt-02`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Which word means 'the land at the edge of a river'?`,promptThai:`คำใดหมายถึง 'พื้นดินริมแม่น้ำ'?`,options:[`riverbank`,`coast`,`seawall`,`tide`],correctIndex:0,explanation:`The riverbank is the land along the edge of a river. When rain is heavy, water can rise over the riverbank and cause a flood.`,explanationThai:`ตลิ่งคือพื้นดินที่อยู่ริมแม่น้ำ เมื่อฝนตกหนัก น้ำอาจล้นตลิ่งจนเกิดน้ำท่วม`,hint1:`This word is about a river, not the sea.`,hint2:`It is the ground next to the water, not the water itself.`,example:`The coast is the land next to the sea.`,points:10,feedbackCorrect:`Correct — that is the riverbank.`,feedbackIncorrect:`Think about the ground beside a river.`},{id:`pt-03`,type:`match`,skill:`vocabulary`,topic:`Emergency Workers & Vehicles`,difficulty:`easy`,prompt:`Match each emergency worker to the vehicle they drive.`,promptThai:`จับคู่เจ้าหน้าที่ฉุกเฉินแต่ละคนกับยานพาหนะที่ขับ`,left:[{id:`w1`,label:`firefighter`,icon:`🧑‍🚒`},{id:`w2`,label:`paramedic`,icon:`⛑️`},{id:`w3`,label:`police officer`,icon:`👮`}],right:[{id:`v1`,label:`fire engine`},{id:`v2`,label:`ambulance`},{id:`v3`,label:`police car`}],pairs:{w1:`v1`,w2:`v2`,w3:`v3`},explanation:`Each emergency worker drives a vehicle that matches their job: firefighters drive fire engines, paramedics drive ambulances, and police officers drive police cars.`,explanationThai:`เจ้าหน้าที่ฉุกเฉินแต่ละคนขับยานพาหนะที่ตรงกับหน้าที่ของตน`,hint1:`The worker who fights fires drives the biggest truck.`,hint2:`Ambulances carry sick or hurt people.`,example:`A police officer drives a police car.`,points:12,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — check the jobs again.`},{id:`pt-04`,type:`sort`,skill:`vocabulary`,topic:`Emergency Categories`,difficulty:`challenge`,prompt:`Sort these words into the correct category.`,promptThai:`จัดเรียงคำเหล่านี้ลงในหมวดหมู่ที่ถูกต้อง`,categories:[{id:`events`,label:`Events`},{id:`workers`,label:`Workers`},{id:`vehicles`,label:`Vehicles`},{id:`places`,label:`Places`}],items:[{id:`i1`,label:`flood`,categoryId:`events`},{id:`i2`,label:`accident`,categoryId:`events`},{id:`i3`,label:`paramedic`,categoryId:`workers`},{id:`i4`,label:`police officer`,categoryId:`workers`},{id:`i5`,label:`ambulance`,categoryId:`vehicles`},{id:`i6`,label:`fire engine`,categoryId:`vehicles`},{id:`i7`,label:`hospital`,categoryId:`places`}],explanation:`Emergency words can describe events (flood, accident), the people who help (paramedic, police officer), vehicles (ambulance, fire engine), or places (hospital).`,explanationThai:`คำศัพท์ฉุกเฉินแบ่งเป็นเหตุการณ์ บุคคล ยานพาหนะ และสถานที่`,hint1:`Ask: is this something that happens, a person, a vehicle, or a building?`,hint2:`Only one word in this set is a place.`,example:`'firefighter' belongs in Workers.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong category — check again.`},{id:`pt-05`,type:`fill-blank`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`After three days of heavy rain, the river rose over its`,after:`and water covered the fields.`,answers:[`riverbank`,`bank`],explanation:`'Riverbank' is the land at the edge of a river. When the river rises over its riverbank, a flood can happen.`,explanationThai:`'ตลิ่ง' คือพื้นดินริมแม่น้ำ เมื่อแม่น้ำสูงขึ้นล้นตลิ่ง อาจเกิดน้ำท่วมได้`,hint1:`Think of the ground right next to a river.`,hint2:`It starts with 'river'.`,example:`The seawall protects the coast from big waves.`,points:12,feedbackCorrect:`Correct — 'riverbank' fits perfectly.`,feedbackIncorrect:`What is the land beside a river called?`},{id:`pt-06`,type:`mcq`,skill:`vocabulary`,topic:`Odd One Out`,difficulty:`easy`,prompt:`Find the odd word out.`,options:[`flood`,`fire`,`accident`,`paramedic`],correctIndex:3,explanation:`Flood, fire, and accident are all emergency events, but a paramedic is a person, not an event.`,explanationThai:`น้ำท่วม ไฟไหม้ และอุบัติเหตุ ล้วนเป็นเหตุการณ์ฉุกเฉิน ส่วนเจ้าหน้าที่พยาบาลฉุกเฉินเป็นบุคคล`,hint1:`Three of these words describe something that happens.`,hint2:`Which one is a job, not an event?`,example:`In 'hospital, ambulance, police car, fire' — hospital is the odd one out because it is a place.`,points:10,feedbackCorrect:`Correct — paramedic is a person, not an event.`,feedbackIncorrect:`Three of these describe something dangerous happening — find the one that names a person.`},{id:`pt-07`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Which word means 'a strong wall built to stop the sea from flooding the land'?`,promptThai:`คำใดหมายถึง 'กำแพงที่แข็งแรงสร้างขึ้นเพื่อป้องกันไม่ให้น้ำทะเลท่วมแผ่นดิน'?`,options:[`seawall`,`riverbank`,`coast`,`tide`],correctIndex:0,explanation:`A seawall is a strong wall built along the coast to stop big waves and the sea from flooding the land.`,explanationThai:`กำแพงกันคลื่นเป็นกำแพงที่แข็งแรงสร้างตามแนวชายฝั่งเพื่อป้องกันคลื่นใหญ่และน้ำทะเลไม่ให้ท่วมแผ่นดิน`,hint1:`This word contains 'sea' and 'wall'.`,hint2:`It is not the natural edge of the land — people build it.`,example:`The riverbank is the natural edge of a river.`,points:10,feedbackCorrect:`Correct — that is a seawall.`,feedbackIncorrect:`Think of a word made from 'sea' + 'wall'.`},{id:`pt-08`,type:`fill-blank`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`Heavy snow in the mountains melted quickly and caused a`,after:`in the village below.`,answers:[`flood`],explanation:`When melted snow or heavy rain makes a river overflow, it causes a flood — too much water covering land that is usually dry.`,explanationThai:`เมื่อหิมะละลายหรือฝนตกหนักทำให้แม่น้ำล้น จะเกิดน้ำท่วม`,hint1:`This word means too much water covering dry land.`,hint2:`It starts with the letter F.`,example:`The coast was hit by strong waves during the storm.`,points:12,feedbackCorrect:`Correct — 'flood' fits perfectly.`,feedbackIncorrect:`What word describes too much water covering the ground?`},{id:`pt-09`,type:`match`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`challenge`,prompt:`Match each word to its meaning.`,left:[{id:`w1`,label:`coast`},{id:`w2`,label:`tide`},{id:`w3`,label:`seawall`},{id:`w4`,label:`riverbank`}],right:[{id:`m1`,label:`the land next to the sea`},{id:`m2`,label:`the rise and fall of the sea level`},{id:`m3`,label:`a wall that protects land from the sea`},{id:`m4`,label:`the land at the edge of a river`}],pairs:{w1:`m1`,w2:`m2`,w3:`m3`,w4:`m4`},explanation:`Coast is land by the sea, tide is the rise and fall of sea level, a seawall protects the coast, and a riverbank is the edge of a river.`,explanationThai:`ชายฝั่งคือแผ่นดินริมทะเล น้ำขึ้นน้ำลงคือระดับน้ำทะเลที่เปลี่ยนแปลง กำแพงกันคลื่นปกป้องชายฝั่ง และตลิ่งคือขอบแม่น้ำ`,hint1:`'Tide' is about the sea level changing, not a place.`,hint2:`'Seawall' contains the word 'wall' because people build it.`,example:`'flood' means too much water covering dry land.`,points:16,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — read each meaning again.`},{id:`pt-10`,type:`mcq`,skill:`vocabulary`,topic:`Synonyms`,difficulty:`easy`,prompt:`Which word means the same as 'to save someone from danger'?`,options:[`rescue`,`warn`,`evacuate`,`flood`],correctIndex:0,explanation:`'Rescue' means to save someone who is in danger, such as during a fire or a flood.`,explanationThai:`'ช่วยเหลือ/กู้ภัย' หมายถึงการช่วยคนที่ตกอยู่ในอันตราย เช่น ระหว่างไฟไหม้หรือน้ำท่วม`,hint1:`This word can be a verb (an action) or a noun.`,hint2:`It is not about giving a warning.`,example:`Firefighters rescued the family from the flood.`,points:8,feedbackCorrect:`Correct — 'rescue' means to save someone.`,feedbackIncorrect:`Think about the word for saving someone from danger.`},{id:`pt-11`,type:`mcq`,skill:`grammar`,topic:`Past Continuous — was/were`,difficulty:`easy`,prompt:`Choose the correct word: She ___ walking to school when it started to rain.`,options:[`was`,`were`,`is`,`did`],correctIndex:0,explanation:`We use 'was' with singular subjects like 'she' in the past continuous tense.`,explanationThai:`เราใช้ 'was' กับประธานเอกพจน์ เช่น 'she' ในรูป past continuous`,hint1:`'She' is one person (singular).`,hint2:`'Were' is used with plural subjects or 'you'.`,example:`He was reading a book when the phone rang.`,points:8,feedbackCorrect:`Correct — 'was' goes with 'she'.`,feedbackIncorrect:`Think about whether 'she' is singular or plural.`},{id:`pt-12`,type:`mcq`,skill:`grammar`,topic:`Past Continuous — was/were`,difficulty:`easy`,prompt:`Choose the correct word: They ___ playing in the park when the storm began.`,options:[`were`,`was`,`are`,`did`],correctIndex:0,explanation:`We use 'were' with plural subjects like 'they' in the past continuous tense.`,explanationThai:`เราใช้ 'were' กับประธานพหูพจน์ เช่น 'they' ในรูป past continuous`,hint1:`'They' means more than one person.`,hint2:`'Was' is used with 'I, he, she, it'.`,example:`We were watching TV when the lights went out.`,points:8,feedbackCorrect:`Correct — 'were' goes with 'they'.`,feedbackIncorrect:`Think about whether 'they' is singular or plural.`},{id:`pt-13`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous — Negative`,difficulty:`medium`,prompt:`Complete the sentence with the correct negative form (wasn't / weren't).`,before:`It`,after:`raining, so we didn't need an umbrella.`,answers:[`wasn't`,`was not`],explanation:`'It' is singular, so the negative past continuous form is 'wasn't' (was not).`,explanationThai:`'It' เป็นเอกพจน์ จึงใช้รูปปฏิเสธว่า 'wasn't' (was not)`,hint1:`'It' is singular, like 'he' or 'she'.`,hint2:`The short form combines 'was' and 'not'.`,example:`They weren't sleeping when the phone rang.`,points:12,feedbackCorrect:`Correct — 'wasn't' fits perfectly.`,feedbackIncorrect:`Is 'it' singular or plural? Choose 'wasn't' or 'weren't'.`},{id:`pt-14`,type:`mcq`,skill:`grammar`,topic:`-ing Spelling`,difficulty:`medium`,prompt:`Which is the correct -ing spelling of the verb 'swim'?`,options:[`swimming`,`swiming`,`swimeing`,`swimmming`],correctIndex:0,explanation:`For short verbs ending in one vowel + one consonant, like 'swim', we double the last letter before adding -ing: swim → swimming.`,explanationThai:`สำหรับคำกริยาสั้นที่ลงท้ายด้วยสระหนึ่งตัวและพยัญชนะหนึ่งตัว เช่น 'swim' เราจะเพิ่มตัวอักษรสุดท้ายซ้ำก่อนเติม -ing: swim → swimming`,hint1:`Count the letters before adding -ing: s-w-i-m.`,hint2:`The last letter needs to be doubled.`,example:`run → running, sit → sitting.`,points:10,feedbackCorrect:`Correct — 'swimming' has the doubled 'm'.`,feedbackIncorrect:`Remember to double the last letter of short verbs like 'swim'.`},{id:`pt-15`,type:`fill-blank`,skill:`grammar`,topic:`-ing Spelling`,difficulty:`medium`,prompt:`Complete the sentence with the correct -ing form of 'run'.`,before:`The dog was`,after:`across the field when it saw the ball.`,answers:[`running`],explanation:`'Run' is a short verb ending in one vowel + one consonant, so we double the 'n' before adding -ing: run → running.`,explanationThai:`'Run' เป็นคำกริยาสั้นที่ลงท้ายด้วยสระและพยัญชนะ จึงต้องเพิ่ม 'n' ซ้ำก่อนเติม -ing: run → running`,hint1:`Double the last letter before adding -ing.`,hint2:`The word has two 'n's.`,example:`sit → sitting.`,points:10,feedbackCorrect:`Correct — 'running' is the right spelling.`,feedbackIncorrect:`Remember: run → double the last letter + ing.`},{id:`pt-16`,type:`word-order`,skill:`grammar`,topic:`Past Continuous — Questions`,difficulty:`medium`,prompt:`Put the words in the correct order to make a question.`,words:[`What`,`were`,`you`,`doing`,`at`,`8`,`o'clock`,`?`],correctOrder:[`What`,`were`,`you`,`doing`,`at`,`8`,`o'clock`,`?`],explanation:`Past continuous wh-questions follow this order: question word + were/was + subject + verb-ing + rest of sentence.`,explanationThai:`คำถามรูป past continuous เรียงลำดับ: คำถาม + were/was + ประธาน + verb-ing + ส่วนที่เหลือ`,hint1:`The question word comes first.`,hint2:`'Were' comes right after the question word.`,example:`Where was she going when you saw her?`,points:14,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Check the position of the question word and 'were'.`},{id:`pt-17`,type:`error-correction`,skill:`grammar`,topic:`Past Continuous — Subject-Verb Agreement`,difficulty:`medium`,prompt:`Find and fix the mistake in this sentence.`,sentence:`She were watching TV when the phone rang.`,wrongWord:`were`,correctWord:`was`,explanation:`'She' is singular, so the correct form is 'was', not 'were'. The sentence should be: 'She was watching TV when the phone rang.'`,explanationThai:`'She' เป็นเอกพจน์ จึงต้องใช้ 'was' ไม่ใช่ 'were'`,hint1:`Check if the subject is singular or plural.`,hint2:`'She' always pairs with 'was' in the past continuous.`,example:`They were watching TV when the phone rang. (correct because 'they' is plural)`,points:12,feedbackCorrect:`Correct — 'was' is the right word for 'she'.`,feedbackIncorrect:`Look at the subject 'she' — is it singular or plural?`},{id:`pt-18`,type:`mcq`,skill:`grammar`,topic:`When/While-Clauses`,difficulty:`challenge`,prompt:`Choose the best ending: The fire started while the family ___`,options:[`were sleeping.`,`was sleep.`,`sleeping.`,`slept sleeping.`],correctIndex:0,explanation:`'While' introduces a longer background action in the past continuous. 'The family' takes 'were' because it refers to more than one person.`,explanationThai:`'While' ใช้แนะนำเหตุการณ์ที่กำลังดำเนินอยู่ในอดีต และ 'the family' ใช้ 'were' เพราะหมายถึงคนมากกว่าหนึ่งคน`,hint1:`'Family' as a group of people usually takes 'were' in this context.`,hint2:`The verb after 'while' needs the -ing form.`,example:`The lights went out while we were watching a movie.`,points:14,feedbackCorrect:`Correct — 'were sleeping' fits after 'while'.`,feedbackIncorrect:`Think about the verb form needed after 'while' + a group of people.`},{id:`pt-19`,type:`true-false`,skill:`grammar`,topic:`Past Continuous Rules`,difficulty:`easy`,prompt:`Read the rule and decide if it is true or false.`,statement:`We use 'was' with the subjects I, he, she, and it in the past continuous tense.`,correctAnswer:!0,explanation:`This is true. 'Was' is used with singular subjects: I, he, she, it. 'Were' is used with you, we, they.`,explanationThai:`ถูกต้อง 'Was' ใช้กับประธานเอกพจน์: I, he, she, it ส่วน 'were' ใช้กับ you, we, they`,hint1:`Think of the subjects that go with 'was' versus 'were'.`,hint2:`'I was' and 'she was' are both correct.`,example:`'We were' and 'they were' are both correct.`,points:8,feedbackCorrect:`Correct — that rule is true.`,feedbackIncorrect:`Check which subjects pair with 'was' in the past continuous.`},{id:`pt-20`,type:`mcq`,skill:`grammar`,topic:`Short Answers`,difficulty:`medium`,prompt:`Answer the question with the correct short answer: 'Were you sleeping at 10 pm?' 'Yes, I ___.'`,options:[`was`,`were`,`am`,`did`],correctIndex:0,explanation:`In short answers, we match the subject with the correct form of 'be'. 'I' takes 'was' in the past.`,explanationThai:`ในการตอบสั้นๆ เราต้องใช้รูปของ 'be' ให้ตรงกับประธาน 'I' ใช้ 'was' ในอดีต`,hint1:`The short answer repeats the same verb as the question, matched to the subject.`,hint2:`'I' always pairs with 'was', not 'were'.`,example:`'Were they playing football?' 'Yes, they were.'`,points:10,feedbackCorrect:`Correct — 'Yes, I was.'`,feedbackIncorrect:`Which form of 'be' matches 'I' in the past?`},{id:`pt-21`,type:`word-order`,skill:`grammar`,topic:`When-Clauses`,difficulty:`challenge`,prompt:`Put the words in the correct order to make a sentence.`,words:[`They`,`were`,`walking`,`home`,`when`,`the`,`rain`,`started`,`.`],correctOrder:[`They`,`were`,`walking`,`home`,`when`,`the`,`rain`,`started`,`.`],explanation:`The past continuous action (were walking) comes first, then 'when' introduces the shorter action that interrupted it (the rain started).`,explanationThai:`เหตุการณ์ที่กำลังดำเนินอยู่ (were walking) มาก่อน แล้วตามด้วย 'when' ที่แนะนำเหตุการณ์สั้นที่มาขัดจังหวะ (the rain started)`,hint1:`The longer, ongoing action comes before 'when'.`,hint2:`The short, sudden action comes after 'when', in simple past.`,example:`She was cooking dinner when the lights went out.`,points:14,feedbackCorrect:`Correct order!`,feedbackIncorrect:`Check which action comes before 'when' and which comes after.`},{id:`pt-22`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous — Questions`,difficulty:`medium`,prompt:`Complete the question with the correct word.`,before:``,after:`he watching TV when the fire started?`,answers:[`Was`],explanation:`'He' is singular, so the question begins with 'Was', not 'Were'.`,explanationThai:`'He' เป็นเอกพจน์ คำถามจึงเริ่มด้วย 'Was' ไม่ใช่ 'Were'`,hint1:`Check if 'he' is singular or plural.`,hint2:`It is the same word used with 'she' and 'it'.`,example:`Were they watching TV when the fire started?`,points:10,feedbackCorrect:`Correct — 'Was' fits perfectly.`,feedbackIncorrect:`Which word goes with 'he' — 'Was' or 'Were'?`},{id:`pt-23`,type:`mcq`,skill:`dialogue`,topic:`Emergency Phone Call`,difficulty:`easy`,prompt:`The emergency operator asks, 'What is your emergency?' What is the best response?`,options:[`There is a fire at my house on Green Street.`,`Hello, how are you?`,`I like fire engines.`,`Can I speak to my friend?`],correctIndex:0,explanation:`The best response gives clear information about the emergency and the location so help can be sent quickly.`,explanationThai:`คำตอบที่ดีที่สุดคือการให้ข้อมูลที่ชัดเจนเกี่ยวกับเหตุฉุกเฉินและสถานที่ เพื่อให้ความช่วยเหลือมาถึงได้อย่างรวดเร็ว`,hint1:`The operator needs to know what is happening and where.`,hint2:`This is not a normal conversation — be short and clear.`,example:`'What is your emergency?' 'There is a flood on Green Street.'`,points:10,feedbackCorrect:`Correct — that gives clear, useful information.`,feedbackIncorrect:`Think about what the operator needs to know first.`},{id:`pt-24`,type:`mcq`,skill:`dialogue`,topic:`Emergency Phone Call`,difficulty:`medium`,prompt:`Complete the missing line in the dialogue.
