`,label:`Brighton`,categoryId:`pat-igh`},{id:`i5`,label:`child`,categoryId:`pat-i`},{id:`i6`,label:`mild`,categoryId:`pat-i`},{id:`i7`,label:`fire`,categoryId:`pat-ire`},{id:`i8`,label:`hire`,categoryId:`pat-ire`}],explanation:`'Bike' and 'fine' use i_e. 'Night' and 'Brighton' use igh. 'Child' and 'mild' use i alone. 'Fire' and 'hire' use ire.`,explanationThai:`'Bike' และ 'fine' ใช้ i_e, 'night' และ 'Brighton' ใช้ igh, 'child' และ 'mild' ใช้ i เดี่ยว, 'fire' และ 'hire' ใช้ ire`,hint1:`'Brighton' contains the same three letters as 'night'.`,hint2:`'Mild' rhymes with 'child'.`,example:`'Wire' belongs in the ire group.`,points:16,feedbackCorrect:`All sorted correctly — you know all four patterns!`,feedbackIncorrect:`A few words are in the wrong group — check again.`},{id:`l8-mq-07`,type:`mcq`,skill:`phonics`,topic:`Reading for Sounds`,difficulty:`challenge`,prompt:`Read this paragraph again:\n\n"${Mi}"\n\nWhich word in the paragraph has the /aɪ/ sound?`,promptThai:`คำใดในย่อหน้ามีเสียง /aɪ/?`,options:[`bright`,`friends`,`picnic`,`barn`],correctIndex:0,explanation:`'Bright' has the /aɪ/ sound spelled igh. 'Friends', 'picnic', and 'barn' do not have this sound.`,explanationThai:`'Bright' มีเสียง /aɪ/ สะกดแบบ igh ส่วน 'friends' 'picnic' และ 'barn' ไม่มีเสียงนี้`,hint1:`This word describes a strong light.`,hint2:`It rhymes with 'night' and 'light'.`,example:`'Fire' is another /aɪ/ word from the paragraph.`,points:12,feedbackCorrect:`Correct — 'bright' has the /aɪ/ sound!`,feedbackIncorrect:`Read the paragraph again and listen carefully.`},{id:`l8-mq-08`,type:`mcq`,skill:`phonics`,topic:`Spelling Patterns`,difficulty:`medium`,prompt:`Which spelling pattern is used in the word 'Brighton'?`,promptThai:`คำว่า 'Brighton' ใช้รูปแบบการสะกดแบบใด?`,options:[`igh`,`i_e`,`i`,`ire`],correctIndex:0,explanation:`'Brighton' contains the letters 'igh', the same pattern as in 'light' and 'night'.`,explanationThai:`คำว่า 'Brighton' มีตัวอักษร 'igh' เหมือนกับใน 'light' และ 'night'`,hint1:`Look at the middle of the word.`,hint2:`This place name sounds like 'bright' + 'ton'.`,example:`'Right' also uses the igh pattern.`,points:10,feedbackCorrect:`Correct — 'Brighton' uses the igh pattern!`,feedbackIncorrect:`Look at the letters in the middle of the word.`}],Li={id:`l8-phonics-ai-sound`,number:8,title:`Phonics: The /aɪ/ Sound`,subtitle:`Learn 4 ways to spell the long I sound, like in "kite".`,skillCategory:`phonics`,estimatedMinutes:18,stages:{warmup:{promptEn:`Say these words out loud: bike, light, fire. What sound do they share?`,promptThai:`พูดคำเหล่านี้ออกเสียงดัง ๆ: bike, light, fire คำเหล่านี้มีเสียงอะไรที่เหมือนกัน?`,hook:`They all have the /aɪ/ sound — the "long I" sound, like in the word "kite"! But look closely — each word spells that same sound in a different way.`},learn:{intro:`The /aɪ/ sound is often called the "long I" sound — it says its own name, like in the word "kite". This sound can be spelled in four different ways. Once you learn to spot all four patterns, you can read and spell dozens of new words!`,introThai:`เสียง /aɪ/ มักเรียกว่าเสียง "long I" คือออกเสียงเหมือนชื่อของตัวอักษรเอง เช่นในคำว่า "kite" เสียงนี้สะกดได้ 4 แบบ เมื่อจับรูปแบบทั้งสี่ได้แล้ว จะช่วยให้อ่านและสะกดคำใหม่ได้อีกมากมาย`,points:[{title:`Pattern 1: i_e (the "magic e")`,body:`When a word ends in a vowel-consonant-e pattern, the e is silent and makes the i say its name /aɪ/, like in bike, five, drive, and fine.`,bodyThai:`เมื่อคำลงท้ายด้วยรูปแบบ สระ-พยัญชนะ-e ตัว e จะไม่ออกเสียง แต่ทำให้ i ออกเสียงเป็น /aɪ/ เช่น bike, five, drive, fine`},{title:`Pattern 2: igh`,body:`The three letters "igh" together make the /aɪ/ sound, like in light, night, and Brighton.`,bodyThai:`ตัวอักษรสามตัว "igh" รวมกันออกเสียง /aɪ/ เช่น light, night, Brighton`},{title:`Pattern 3: i (alone)`,body:`Sometimes a single letter i makes the /aɪ/ sound, especially before two consonants like "ld" or "mb", like in child and climb.`,bodyThai:`บางครั้งตัวอักษร i เพียงตัวเดียวก็ออกเสียง /aɪ/ ได้ โดยเฉพาะหน้าพยัญชนะสองตัวอย่าง "ld" หรือ "mb" เช่น child, climb`},{title:`Pattern 4: ire`,body:`The letters "ire" at the end of a word make the /aɪ/ sound, like in fire.`,bodyThai:`ตัวอักษร "ire" ที่ท้ายคำออกเสียง /aɪ/ เช่น fire`}]},examples:{items:[{text:Mi,noteThai:`ไมค์ชอบขี่จักรยานตอนกลางคืน เขาเปิดไฟสว่างเพื่อให้รถมองเห็นเขา นั่นคือไฟไหม้ใกล้โรงนาเก่าหรือเปล่า? ไม่ใช่หรอก แค่เพื่อนใจดีห้าคนกำลังปิกนิกกันอยู่`},{text:`Five kids like to ride their bikes at night.`,noteThai:`เด็กห้าคนชอบขี่จักรยานตอนกลางคืน`},{text:`The bright light shone near the wire fence.`,noteThai:`แสงไฟสว่างส่องใกล้รั้วลวด`},{text:`A kind child began to climb the tall hill.`,noteThai:`เด็กใจดีคนหนึ่งเริ่มปีนเขาสูง`}]},guided:{questions:Pi},independent:{questions:Fi},miniQuiz:{questions:Ii},summary:{keyTakeaways:[`The /aɪ/ sound (long I, like in "kite") can be spelled in 4 different ways: i_e, igh, i (alone), and ire.`,`i_e words like bike, five, drive, and fine use a silent "e" at the end to make the i say its name.`,`igh words like light, night, and Brighton use three letters together to make one sound.`,`Words like child, climb, and fire show that i (alone) and ire are two more ways to spell the same /aɪ/ sound.`],keyTakeawaysThai:[`เสียง /aɪ/ (long I เหมือนในคำว่า "kite") สะกดได้ 4 แบบ: i_e, igh, i เดี่ยว และ ire`,`คำแบบ i_e เช่น bike, five, drive, fine ใช้ตัว "e" ที่ไม่ออกเสียงท้ายคำเพื่อให้ i ออกเสียงเป็นชื่อของมันเอง`,`คำแบบ igh เช่น light, night, Brighton ใช้ตัวอักษรสามตัวรวมกันออกเสียงเดียว`,`คำอย่าง child, climb และ fire แสดงให้เห็นว่า i เดี่ยว และ ire ก็เป็นอีกสองวิธีสะกดเสียง /aɪ/ เช่นกัน`]}}},Ri={id:`l9-danger-on-the-coast`,number:9,title:`Reading: Danger on the Coast`,subtitle:`Read a story about noticing nature's warning signs and staying safe.`,skillCategory:`reading`,estimatedMinutes:28,stages:{warmup:{promptEn:`Look at these pictures from today's story: 🐕🦀🌊 What do you think might happen when a dog acts strangely and sea animals suddenly move away from the beach?`,promptThai:`ดูภาพจากเรื่องราววันนี้: 🐕🦀🌊 คุณคิดว่าจะเกิดอะไรขึ้นเมื่อสุนัขมีพฤติกรรมแปลกและสัตว์ทะเลพากันย้ายออกจากชายหาด?`,hook:`In the story, these strange behaviors were warning signs of a big wave — read on to find out how one family stayed safe.`},learn:{intro:`Good readers do more than just follow the story — they notice small clues, called warning signs, and think about why events happen in a certain order. This helps you understand a story deeply and predict what might happen next.`,introThai:`นักอ่านที่ดีไม่ได้แค่ติดตามเนื้อเรื่อง แต่ยังสังเกตเบาะแสเล็กๆ ที่เรียกว่าสัญญาณเตือน และคิดว่าทำไมเหตุการณ์จึงเกิดขึ้นตามลำดับนั้น`,points:[{title:`Reading between the lines`,body:`Authors do not always tell us directly how a character feels or why something happens. We can use character actions and descriptions to make a smart guess, called an inference.`,bodyThai:`ผู้เขียนไม่ได้บอกตรงๆ เสมอไปว่าตัวละครรู้สึกอย่างไร เราต้องใช้การกระทำและคำบรรยายมาช่วยเดา`},{title:`Spotting a story's warning signs`,body:`Warning signs are small clues that something dangerous might happen soon. Noticing them early helps readers predict what will happen next in the story.`,bodyThai:`สัญญาณเตือนคือเบาะแสเล็กๆ ที่บอกว่าอันตรายอาจกำลังจะเกิดขึ้น การสังเกตแต่เนิ่นๆ ช่วยให้ทำนายเรื่องราวต่อไปได้`},{title:`Cause and effect in stories`,body:`One event in a story often causes another event to happen. Understanding this order helps readers understand why characters make the choices they do.`,bodyThai:`เหตุการณ์หนึ่งในเรื่องมักเป็นสาเหตุให้เกิดอีกเหตุการณ์หนึ่ง การเข้าใจลำดับนี้ช่วยให้เข้าใจว่าทำไมตัวละครจึงตัดสินใจแบบนั้น`}],story:{id:`story-danger-on-the-coast`,title:`The Day the Sea Pulled Back`,introEn:`Read the story below about Nok, her family, and a very unusual day at the beach. As you read, watch for clues that show something dangerous might be coming.`,introThai:`อ่านเรื่องราวของนกและครอบครัวในวันที่แปลกประหลาดที่ชายหาด ขณะอ่าน ให้สังเกตสัญญาณที่บอกว่าอันตรายกำลังจะมาถึง`,wordCount:584,scenes:[{id:`scene-01`,title:`A Sunny Morning in Blue Bay`,icon:`🌅`,text:`Nok lived in a small fishing village called Blue Bay, right next to the wide blue sea. One sunny Saturday morning, she walked along the beach with her mother, her father, her little brother Ben, and her happy dog Milo. The waves were calm and gentle, and seagulls circled slowly in the clear sky. It felt like any other peaceful day in Blue Bay.`,vocabSupport:[{word:`fishing village`,meaningEn:`a small town where people catch fish for a living`,meaningThai:`หมู่บ้านชาวประมง`}],thaiNote:`นกอาศัยอยู่ในหมู่บ้านชาวประมงเล็กๆ ริมทะเล เช้าวันนั้นดูเหมือนจะเป็นวันปกติที่สงบสุข`},{id:`scene-02`,title:`Milo Acts Strange`,icon:`🐕`,text:`Suddenly, Milo stopped walking and would not move another step. He barked loudly at the water and pulled hard on his leash, trying to run back toward the hills. Nok had never seen her dog behave this way before, and it made her feel a little uneasy. "What's wrong with you, Milo?" she asked, but the dog just kept barking.`,vocabSupport:[{word:`uneasy`,meaningEn:`a little worried or nervous`,meaningThai:`รู้สึกไม่สบายใจเล็กน้อย`}],thaiNote:`มิโลเห่าและไม่ยอมเข้าใกล้น้ำ ทำให้นกรู้สึกแปลกใจและไม่สบายใจ`},{id:`scene-03`,title:`The Animals Move Away`,icon:`🦀`,text:`Then Nok noticed something even stranger happening around her. Dozens of crabs were scuttling quickly away from the shore, and hundreds of small birds rose from the sand and flew inland together. Even the ants on the beach were marching in long lines toward higher ground. Every animal on the beach, big and small, seemed to be hurrying away from something.`,vocabSupport:[{word:`scuttling`,meaningEn:`moving quickly with small, hurried steps`,meaningThai:`วิ่งกระเถิบอย่างรวดเร็ว`}],thaiNote:`ปูจำนวนมากวิ่งหนีจากชายฝั่ง นกบินเข้าฝั่ง และมดก็เดินขบวนขึ้นที่สูง สัตว์ทุกตัวดูเหมือนกำลังหนีบางสิ่ง`},{id:`scene-04`,title:`The Sea Pulls Back`,icon:`🌊`,text:`A few minutes later, the sea itself began to change. The water pulled back very far from the shore, farther than Nok had ever seen it go, leaving wide stretches of wet, empty sand. Silver fish flopped helplessly where the waves used to be, and a few surprised tourists walked out to look at them. Nok felt a strange, cold worry growing in her stomach.`,vocabSupport:[{word:`pulled back`,meaningEn:`moved away or retreated`,meaningThai:`ถอยห่างออกไป`}],thaiNote:`น้ำทะเลถอยห่างออกไปไกลผิดปกติ ปลาติดอยู่บนทราย ทำให้นกรู้สึกกังวลใจ`},{id:`scene-05`,title:`Grandfather Remembers`,icon:`👴`,text:`Nok's grandfather, who had fished in Blue Bay his whole life, looked at the empty sea and his face turned pale with worry. "When the sea pulls back this far, and every animal runs away at the same time, a huge wave could be coming soon," he said firmly. "We cannot wait to find out if I am right. We need to move to higher ground right now."`,vocabSupport:[{word:`turned pale`,meaningEn:`a person's face loses color because of fear or shock`,meaningThai:`หน้าซีดเพราะตกใจ`}],thaiNote:`คุณตาของนกสังเกตเห็นสัญญาณอันตรายและเตือนให้ครอบครัวรีบย้ายไปที่สูงทันที`},{id:`scene-06`,title:`Running to Higher Ground`,icon:`⛰️`,text:`Nok's father did not stop to ask any more questions. He scooped up Ben, grabbed Nok's hand, and the whole family hurried away from the beach toward the hill behind the village. As they ran, they shouted to their neighbors, "The sea is pulling back — go to higher ground now!" Several other families heard the warning and followed close behind them.`,vocabSupport:[{word:`hurried`,meaningEn:`moved quickly because there was little time`,meaningThai:`รีบเร่ง`}],thaiNote:`ครอบครัวของนกรีบวิ่งขึ้นเนินและตะโกนเตือนเพื่อนบ้านให้หนีตามไปด้วย`},{id:`scene-07`,title:`The Big Wave`,icon:`🌊💥`,text:`From the top of the hill, breathless and scared, Nok looked back down at the beach. A tall, dark wave was rushing toward the shore, moving much faster and much bigger than any wave she had ever seen before. It crashed over the sand, the paths, and the empty fishing boats, sweeping everything in its way with a roar.`,vocabSupport:[{word:`roar`,meaningEn:`a loud, deep sound`,meaningThai:`เสียงคำรามดัง`}],thaiNote:`คลื่นขนาดใหญ่สีเข้มซัดเข้าฝั่งอย่างรวดเร็วและรุนแรง กวาดทุกอย่างไปตามทาง`},{id:`scene-08`,title:`Safe on the Hill`,icon:`🙏`,text:`Nok held Milo close to her chest and watched the water rise far below the hill. Her family was safe, standing high above the wave, together with the neighbors who had listened to her grandfather's warning and run in time. Nok's heart was still pounding, but she also felt deeply thankful — thankful that they had all noticed the warning signs before it was too late.`,vocabSupport:[{word:`thankful`,meaningEn:`feeling grateful for something good`,meaningThai:`รู้สึกขอบคุณ`}],thaiNote:`ครอบครัวของนกปลอดภัยบนที่สูง และรู้สึกขอบคุณที่สังเกตสัญญาณเตือนได้ทันเวลา`},{id:`scene-09`,title:`A Lesson to Remember`,icon:`📖`,text:`Later that evening, Nok's grandfather sat beside her on the quiet hill and watched the sea grow calm again. "Nature often tries to warn us before danger comes," he told her gently. "Animals can feel changes that we cannot feel, and the sea can tell its own story if we know how to look. If we watch, listen, and act quickly, we can keep our families safe." Nok never forgot that day, or the important lesson it taught her.`,vocabSupport:[{word:`warning signs`,meaningEn:`clues that show something dangerous might happen`,meaningThai:`สัญญาณเตือนภัย`}],thaiNote:`คุณตาสอนนกว่าธรรมชาติมักส่งสัญญาณเตือนก่อนเกิดอันตรายเสมอ หากเราสังเกตและรีบทำตาม เราจะปลอดภัย`}]}},examples:{items:[{text:`The sky turned dark green, and the farmer knew a big storm was coming.`,noteThai:`ท้องฟ้าเปลี่ยนเป็นสีเขียวเข้ม และชาวนารู้ว่าพายุใหญ่กำลังจะมา`},{text:`When the birds suddenly stopped singing, the hikers decided to head back down the mountain.`,noteThai:`เมื่อนกหยุดร้องเพลงกะทันหัน นักเดินป่าจึงตัดสินใจกลับลงจากภูเขา`},{text:`"If the sea ever looks strange, always trust your eyes and move to safety," said the old sailor.`,noteThai:`"ถ้าทะเลดูแปลกไป ให้เชื่อสายตาของตัวเองและรีบไปที่ปลอดภัย" กะลาสีเรือเก่ากล่าว`},{text:`Before the storm arrived, some villagers noticed their pets acting nervous and restless.`,noteThai:`ก่อนพายุจะมาถึง ชาวบ้านบางคนสังเกตว่าสัตว์เลี้ยงของตนกระวนกระวายผิดปกติ`}]},guided:{questions:[{id:`l9-g-01`,type:`sequence`,presentation:`events`,skill:`reading`,topic:`Sequence`,difficulty:`easy`,prompt:`Put these events from the story in the correct order.`,items:[{id:`e1`,label:`Nok walks along the beach with her family and Milo.`},{id:`e2`,label:`Milo barks and refuses to go near the water.`},{id:`e3`,label:`Crabs, birds, and ants all move away from the shore.`},{id:`e4`,label:`The sea pulls back and leaves the sand empty.`},{id:`e5`,label:`Grandfather says a big wave might be coming.`},{id:`e6`,label:`The family runs to higher ground.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`,`e5`,`e6`],explanation:`The story moves step by step: first a normal walk, then Milo's strange behavior, then the animals leaving, the sea pulling back, grandfather's warning, and finally the family running to safety.`,explanationThai:`เรื่องราวดำเนินไปทีละขั้นตอน ตั้งแต่การเดินเล่นปกติ จนถึงการวิ่งหนีขึ้นที่สูง`,hint1:`Think about what happened first — before anyone noticed anything strange.`,hint2:`Grandfather's warning comes after the sea pulls back, but before the family runs.`,example:`In a story about a fire, the order might be: cooking starts → smoke appears → alarm rings → people leave the building.`,points:14,feedbackCorrect:`Great job — that is the correct order of events!`,feedbackIncorrect:`Not quite — try re-reading the story to check what happened first.`},{id:`l9-g-02`,type:`mcq`,skill:`reading`,topic:`Comprehension`,difficulty:`easy`,prompt:`Where does Nok live?`,options:[`In a small fishing village called Blue Bay, next to the sea`,`In a big, busy city`,`In a village high in the mountains`,`On a small island far from any coast`],correctIndex:0,explanation:`The story says Nok lived in a small fishing village called Blue Bay, right next to the wide blue sea.`,explanationThai:`เรื่องราวบอกว่านกอาศัยอยู่ในหมู่บ้านชาวประมงเล็กๆ ชื่อ Blue Bay ริมทะเล`,hint1:`Look at the very first sentence of the story.`,hint2:`The name of the village is mentioned early in the story.`,example:`If a story says "Tom lived on a quiet farm," the answer to "Where does Tom live?" is "on a quiet farm."`,points:8,feedbackCorrect:`Correct — Nok lives in Blue Bay, right next to the sea.`,feedbackIncorrect:`Look again at the opening lines of the story.`},{id:`l9-g-03`,type:`true-false`,skill:`reading`,topic:`Character Actions`,difficulty:`easy`,prompt:`Decide if this statement about the story is true or false.`,statement:`Milo happily swam in the water when the family arrived at the beach.`,correctAnswer:!1,explanation:`Milo did not swim happily — he stopped walking, barked loudly, and refused to go near the water at all.`,explanationThai:`มิโลไม่ได้ว่ายน้ำอย่างมีความสุข แต่กลับเห่าและไม่ยอมเข้าใกล้น้ำ`,hint1:`Re-read the scene titled "Milo Acts Strange."`,hint2:`The dog's behavior was the opposite of calm and happy.`,example:`If a story says a boy "refused to eat his lunch," then the statement "he happily ate his lunch" would be false.`,points:8,feedbackCorrect:`Correct — Milo refused to go near the water, he did not swim happily.`,feedbackIncorrect:`Think about how Milo actually behaved near the water.`},{id:`l9-g-04`,type:`match`,skill:`reading`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`Match each cause to its correct effect in the story.`,left:[{id:`c1`,label:`The sea pulled back very far`},{id:`c2`,label:`Milo barked and would not go near the water`},{id:`c3`,label:`Grandfather saw the warning signs`},{id:`c4`,label:`The family ran to higher ground`}],right:[{id:`e1`,label:`Fish were left flopping on the wet sand`},{id:`e2`,label:`Nok felt worried that something was wrong`},{id:`e3`,label:`He told the family to move immediately`},{id:`e4`,label:`The family stayed safe from the big wave`}],pairs:{c1:`e1`,c2:`e2`,c3:`e3`,c4:`e4`},explanation:`Each cause in the story leads directly to a result: the sea pulling back left fish stranded, Milo's barking worried Nok, grandfather's warning led to quick action, and running to the hill kept the family safe.`,explanationThai:`แต่ละเหตุการณ์ในเรื่องนำไปสู่ผลลัพธ์โดยตรง`,hint1:`Ask yourself: "What happened because of this?"`,hint2:`The last cause and effect pair explains why the family survived.`,example:`Cause: "It started to rain heavily." Effect: "The children went inside."`,points:16,feedbackCorrect:`All matched correctly — you understand the causes and effects well!`,feedbackIncorrect:`Some pairs are wrong — think about what happened right after each cause.`},{id:`l9-g-05`,type:`mcq`,skill:`reading`,topic:`Warning Signs`,difficulty:`medium`,prompt:`Which of these was NOT one of the warning signs in the story?`,options:[`Birds flying inland away from the shore`,`The sea pulling back far from the beach`,`Crabs and ants moving away from the shore`,`A bright rainbow appearing in the sky`],correctIndex:3,explanation:`The story describes birds, crabs, ants, and the sea itself all behaving strangely — a rainbow is never mentioned as a warning sign.`,explanationThai:`เรื่องราวกล่าวถึงนก ปู มด และทะเลที่มีพฤติกรรมแปลกไป แต่ไม่เคยพูดถึงรุ้งกินน้ำ`,hint1:`Three of these options are animal or sea behaviors described in the story.`,hint2:`Think about which option is not connected to danger at all.`,example:`In a fire story, warning signs might include smoke and a beeping alarm, but not a knock at the door.`,points:10,feedbackCorrect:`Correct — a rainbow was never part of the warning signs in this story.`,feedbackIncorrect:`Re-read the story and list the warning signs the animals and sea showed.`},{id:`l9-g-06`,type:`mcq`,skill:`reading`,topic:`Best Summary`,difficulty:`medium`,prompt:`Which sentence best summarizes the whole story?`,options:[`Nok and her family went to the beach and had a normal, relaxing day with no problems.`,`When animals behaved strangely and the sea pulled back, Nok's family recognized the warning signs, moved to higher ground, and stayed safe from a huge wave.`,`Nok's dog Milo got lost on the beach, and the family searched for him until they found him on a hill.`,`A big wave destroyed Blue Bay village, and nobody had any warning before it happened.`],correctIndex:1,explanation:`This summary captures the whole story: strange animal behavior and the sea pulling back were warning signs, and the family's quick action to move to higher ground kept them safe.`,explanationThai:`บทสรุปนี้ครอบคลุมเรื่องราวทั้งหมด ตั้งแต่สัญญาณเตือนจนถึงการที่ครอบครัวปลอดภัย`,hint1:`A good summary includes the problem, what the characters did, and how it ended.`,hint2:`Some options only describe one small part of the story or say something that did not happen.`,example:`For a story about a boy who studies hard and passes his test, a good summary is "A boy studies hard and succeeds," not just "A boy has a test."`,points:12,feedbackCorrect:`Correct — that sentence captures the whole story well.`,feedbackIncorrect:`Think about the beginning, middle, and end of the story together.`},{id:`l9-g-07`,type:`mcq`,skill:`reading`,topic:`Evidence`,difficulty:`medium`,prompt:`Which sentence from the story shows that the sea was behaving strangely?`,options:[`"The water pulled back very far from the shore, farther than Nok had ever seen it go."`,`"The waves were calm and gentle, and seagulls circled slowly in the clear sky."`,`"Nok held Milo close to her chest and watched the water rise far below the hill."`,`"Several other families heard the warning and followed close behind them."`],correctIndex:0,explanation:`This sentence directly describes the sea acting strangely — the water pulling back much farther than Nok had ever seen before.`,explanationThai:`ประโยคนี้บรรยายถึงทะเลที่มีพฤติกรรมแปลกไปโดยตรง คือน้ำถอยห่างออกไปไกลผิดปกติ`,hint1:`Look for the sentence that describes something unusual, not something calm and normal.`,hint2:`The correct sentence is about the sea moving away, not the family or the wave.`,example:`To find evidence that "the boy was scared," look for a sentence like "his hands were shaking."`,points:12,feedbackCorrect:`Correct — that sentence is the clearest evidence of the sea's strange behavior.`,feedbackIncorrect:`Look for the sentence describing the water pulling back, not the calm morning or the safe ending.`},{id:`l9-g-08`,type:`mcq`,skill:`reading`,topic:`Main Idea`,difficulty:`medium`,prompt:`What is the main idea of the story?`,options:[`Dogs should never be taken to the beach.`,`Paying attention to nature's warning signs can help keep people safe.`,`Fishing villages are dangerous places to live.`,`Grandparents always know everything about the sea.`],correctIndex:1,explanation:`The whole story is built around noticing warning signs from nature — the dog, the other animals, and the sea itself — and how paying attention to them kept the family safe.`,explanationThai:`ใจความสำคัญของเรื่องคือการสังเกตสัญญาณเตือนจากธรรมชาติช่วยให้ปลอดภัยได้`,hint1:`Think about what the story wants readers to learn, not just what happened.`,hint2:`The other options are too extreme or only describe a small detail.`,example:`The main idea of a story about a boy who studies and passes his exam might be "hard work leads to success," not just "there was a test."`,points:12,feedbackCorrect:`Correct — that is the main idea the story teaches.`,feedbackIncorrect:`Think about the bigger lesson the story is trying to teach, not just one small detail.`},{id:`l9-g-09`,type:`true-false`,skill:`reading`,topic:`Sequence`,difficulty:`easy`,prompt:`Decide if this statement about the story is true or false.`,statement:`The family moved to higher ground before the big wave reached the coast.`,correctAnswer:!0,explanation:`The family ran to the hill after grandfather's warning, and only after they reached safety did the big wave crash onto the shore.`,explanationThai:`ครอบครัววิ่งขึ้นเนินหลังจากคุณตาเตือน และหลังจากนั้นคลื่นใหญ่จึงซัดเข้าฝั่ง`,hint1:`Think about the order of the last few scenes in the story.`,hint2:`Nok watches the wave from the top of the hill, not from the beach.`,example:`If a story says "the students left the building, then the fire alarm rang," the statement "students left before the alarm" would be true.`,points:8,feedbackCorrect:`Correct — the family reached safety before the wave arrived.`,feedbackIncorrect:`Re-check the order of events near the end of the story.`},{id:`l9-g-10`,type:`mcq`,skill:`reading`,topic:`Inference`,difficulty:`challenge`,prompt:`Why did grandfather want the family to move immediately, even before they were sure a wave was really coming?`,options:[`Because it was getting dark and time to go home.`,`Because waiting to be certain could be too dangerous if a wave was really coming.`,`Because he wanted to see the view from the hill.`,`Because Milo wanted to run toward the hills.`],correctIndex:1,explanation:`Grandfather knew that if he waited to be completely sure, it might be too late to escape safely — so he chose to act quickly instead of taking a risk.`,explanationThai:`คุณตารู้ว่าหากรอจนแน่ใจ อาจสายเกินไปที่จะหนีอย่างปลอดภัย จึงเลือกที่จะรีบลงมือทำทันที`,hint1:`The story does not say it was getting dark.`,hint2:`Think about what could happen if the family waited too long to find out for sure.`,example:`A person who smells smoke leaves the building right away instead of waiting to see if there really is a fire — because waiting could be dangerous.`,points:14,feedbackCorrect:`Correct — acting quickly was safer than waiting to be certain.`,feedbackIncorrect:`Think about what could happen if the family had waited longer to be sure.`}]},independent:{questions:[{id:`l9-i-01`,type:`mcq`,skill:`reading`,topic:`Comprehension`,difficulty:`easy`,prompt:`What was the first strange thing Nok noticed?`,options:[`Milo barking and refusing to go near the water`,`The big wave crashing on the shore`,`Grandfather telling them to run`,`The fish flopping on the sand`],correctIndex:0,explanation:`Milo's strange behavior — barking and refusing to go near the water — was the very first unusual thing Nok noticed in the story.`,explanationThai:`พฤติกรรมแปลกของมิโลเป็นสิ่งแรกที่นกสังเกตเห็น`,hint1:`Think about the order the strange things happened in.`,hint2:`The dog's reaction comes before the animals and the sea change.`,example:`If a story lists smoke, then an alarm, then flames, the first strange thing is the smoke.`,points:8,feedbackCorrect:`Correct — Milo's barking was the first sign something was wrong.`,feedbackIncorrect:`Look again at the beginning of the story, right after the family arrives.`},{id:`l9-i-02`,type:`true-false`,skill:`reading`,topic:`Detail`,difficulty:`easy`,prompt:`Decide if this statement about the story is true or false.`,statement:`Crabs, birds, and ants all moved toward the sea instead of away from it.`,correctAnswer:!1,explanation:`The animals moved away from the sea, toward higher ground — not toward the water.`,explanationThai:`สัตว์ต่างๆ เคลื่อนที่ออกห่างจากทะเล ไม่ใช่เข้าหาทะเล`,hint1:`Think about the direction the animals were running.`,hint2:`The animals were trying to escape from the shore.`,example:`If a story says "the birds flew away from the storm," it would be false to say "the birds flew toward the storm."`,points:8,feedbackCorrect:`Correct — the animals moved away from the shore, not toward it.`,feedbackIncorrect:`Re-read the scene about the animals moving away.`},{id:`l9-i-03`,type:`match`,skill:`reading`,topic:`Warning Signs`,difficulty:`medium`,prompt:`Match each warning sign to what it shows.`,left:[{id:`s1`,label:`Milo refuses to go near the water and barks`},{id:`s2`,label:`Crabs, birds, and ants move inland together`},{id:`s3`,label:`The sea pulls back very far from the shore`}],right:[{id:`m1`,label:`An animal senses danger before people notice it`},{id:`m2`,label:`Many different animals leave t ง เช่น มิโลเห่า ปูวิ่งหนี นกบินเข้าฝั่ง และมดเดินขบวนขึ้นที่สูง`,hint1:`Think about Milo, or the crabs, birds, and ants.`,hint2:`Any one of the animal behaviors described in the story counts as an answer.`,example:`A warning sign before a storm might be "dark clouds forming in the sky."`,points:12,feedbackCorrect:`Correct — that is one of the warning signs from the story.`,feedbackIncorrect:`Think about how Milo or the other animals behaved before the wave.`},{id:`l9-i-09`,type:`short-answer`,skill:`reading`,topic:`Inference`,difficulty:`challenge`,prompt:`Why do you think it was important for the family to act quickly instead of waiting to see if a wave was really coming?`,acceptedAnswers:[`dangerous to wait`,`could be too late`,`safety first`,`wave could come fast`,`not enough time`,`better safe than sorry`,`stay safe`,`protect the family`],placeholder:`Write your answer in English...`,explanation:`Waiting to be completely sure could have been too dangerous — if the wave really was coming, there might not have been enough time to escape.`,explanationThai:`การรอจนแน่ใจอาจเป็นอันตรายเกินไป หากคลื่นมาจริง อาจไม่มีเวลาพอที่จะหนี`,hint1:`Think about what could happen if the family waited too long.`,hint2:`A good answer explains why speed matters when safety is at risk.`,example:`It is important to leave a building quickly when the fire alarm rings, because waiting to check could be dangerous.`,points:14,feedbackCorrect:`Great thinking — acting quickly kept the family safe.`,feedbackIncorrect:`Think about what might happen if they had waited too long to be sure.`},{id:`l9-i-10`,type:`short-answer`,skill:`reading`,topic:`Evidence`,difficulty:`challenge`,prompt:`Write the sentence from the story that shows the sea pulled back farther than Nok had ever seen.`,acceptedAnswers:[`water pulled back very far`,`pulled back very far from the shore`,`farther than nok had ever seen`,`the water pulled back very far from the shore`],placeholder:`Write your answer in English...`,expla k's village "Blue Bay," a small fishing village next to the sea.`,explanationThai:`หมู่บ้านของนกชื่อว่า Blue Bay ซึ่งเป็นหมู่บ้านชาวประมงเล็กๆ ริมทะเล`,hint1:`The village name appears in the very first scene.`,hint2:`It is also part of the story's setting, mentioned more than once.`,example:`If a story is set in "Green Hill Farm," the setting's name is "Green Hill Farm."`,points:8,feedbackCorrect:`Correct — Nok lives in Blue Bay.`,feedbackIncorrect:`Look back at the opening scene for the village name.`},{id:`l9-mq-02`,type:`true-false`,skill:`reading`,topic:`Sequence`,difficulty:`medium`,prompt:`Decide if this statement about the story is true or false.`,statement:`The sea pulled back before the animals ran away from the shore.`,correctAnswer:!1,explanation:`The animals — including Milo, the crabs, birds, and ants — moved away from the shore before the sea pulled back.`,explanationThai:`สัตว์ต่างๆ รวมถึงมิโล ปู นก และมด เคลื่อนที่ออกจากชายฝั่งก่อนที่ทะเลจะถอยห่างออกไป`,hint1:`Re-read the order of scenes carefully.`,hint2:`Milo and the other animals react before the sea itself changes.`,example:`If smoke appears before the fire alarm rings, then "the alarm rang before the smoke appeared" would be false.`,points:10,feedbackCorrect:`Correct — the animals ran away first, then the sea pulled back.`,feedbackIncorrect:`Check the order: which happened first, the animals leaving or the sea changing?`},{id:`l9-mq-03`,type:`mcq`,skill:`reading`,topic:`Warning Signs`,difficulty:`easy`,prompt:`Which animal was the FIRST to act strangely in the story?`,options:[`Milo the dog`,`the crabs`,`the birds`,`the ants`],correctIndex:0,explanation:`Milo the dog was the first to act strangely — he refused to walk and barked at the water before Nok noticed the crabs, birds, or ants.`,explanationThai:`มิโลเป็นสัตว์ตัวแรกที่มีพฤติกรรมแปลก ก่อนที่นกจะสังเกตเห็นปู นก และมด`,hint1:`Think about which scene comes right after the family arrives at the beach.`,hint2:`The other animals are noticed a little later in the story.`,example:`In a story where the wind picks up before the rain starts, the wind would be the first sign.`,points:8,feedbackCorrect:`Correct — Milo was the first animal to act strangely.`,feedbackIncorrect:`Look again at the order the animals are described in.`},{id:`l9-mq-04`,type:`match`,skill:`reading`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`Match each cause to its correct effect.`,left:[{id:`c1`,label:`Grandfather saw the empty sea`},{id:`c2`,label:`The family reached the hilltop`},{id:`c3`,label:`A big wave hit the shore`}],right:[{id:`e1`,label:`He warned everyone to move quickly`},{id:`e2`,label:`They were safe above the rising water`},{id:`e3`,label:`It swept over the beach and the boats`}],pairs:{c1:`e1`,c2:`e2`,c3:`e3`},explanation:`Each event in the story causes a clear result: seeing the empty sea led to a warning, reaching the hilltop led to safety, and the wave hitting the shore led to the beach being swept over.`,explanationThai:`แต่ละเหตุการณ์นำไปสู่ผลลัพธ์ที่ชัดเจน`,hint1:`Think about what grandfather did right after he saw the empty sea.`,hint2:`The wave's effect is about what happened to the beach, not the family.`,example:`Cause: "The bell rang." Effect: "The students went to class."`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A pair or two is wrong — think through each cause again.`},{id:`l9-mq-05`,type:`mcq`,skill:`reading`,topic:`Best Summary`,difficulty:`medium`,prompt:`Which sentence best tells what the story is about?`,options:[`A family enjoys a quiet day at the beach with no surprises at all.`,`A family notices nature's warning signs and escapes a dangerous wave safely.`,`A dog runs away from home and gets lost near the sea.`,`Fishermen catch many fish after the sea pulls back.`],correctIndex:1,explanation:`The story is mainly about the family noticing the warning signs from the animals and the sea, and using that knowledge to escape the wave safely.`,explanationThai:`เรื่องราวเน้นที่การสังเกตสัญญาณเตือนและการหนีคลื่นอย่างปลอดภัย`,hint1:`A good summary covers the whole story, not just one small part.`,hint2:`The correct option mentions both the warning signs and the safe outcome.`,example:`A summary of a story about students studying for and passing an exam should mention both the studying and the result.`,points:12,feedbackCorrect:`Correct — that captures the whole story well.`,feedbackIncorrect:`Think about the full story, not just one detail like the dog or the fish.`},{id:`l9-mq-06`,type:`mcq`,skill:`reading`,topic:`Evidence`,difficulty:`challenge`,prompt:`Which sentence shows that other people in the village also listened to the warning?`,options:[`"Several other families heard the warning and followed close behind them."`,`"The waves were calm and gentle, and seagulls circled slowly in the clear sky."`,`"Silver fish flopped helplessly where the waves used to be."`,`"He barked loudly at the water and pulled hard on his leash."`],correctIndex:0,explanation:`This sentence shows that the warning was not only for Nok's family — other families in the village also heard it and moved to safety too.`,explanationThai:`ประโยคนี้แสดงว่าคำเตือนไม่ได้มีผลแค่ครอบครัวของนก แต่ครอบครัวอื่นก็ได้ยินและหนีตามไปด้วย`,hint1:`Look for the sentence that mentions "other families."`,hint2:`The other sentences are about Milo, the calm morning, or the stranded fish.`,example:`Evidence that "the whole class followed the rule" could be "every student lined up quietly."`,points:14,feedbackCorrect:`Correct — that sentence shows the whole village responded to the warning.`,feedbackIncorrect:`Look for the sentence that mentions the neighbors, not Milo or the fish.`},{id:`l9-mq-07`,type:`short-answer`,skill:`reading`,topic:`Main Idea`,difficulty:`medium`,prompt:`In one sentence, what does grandfather mean when he says nature tries to warn us before danger comes?`,acceptedAnswers:[`animals sense danger`,`nature gives signs`,`warning signs`,`pay attention to nature`,`signs before danger`,`animals feel changes`],placeholder:`Write your answer in English...`,explanation:`Grandfather means that animals and the sea can sense danger before people do, and if we watch carefully, we can notice these clues in time to stay safe.`,explanationThai:`คุณตาหมายความว่าสัตว์และทะเลสามารถรับรู้อันตรายได้ก่อนคน หากเราสังเกตให้ดี เราจะเห็นสัญญาณเหล่านี้ทันเวลา`,hint1:`Re-read grandfather's words in the final scene of the story.`,hint2:`Think about animals and the sea "telling a story" before danger happens.`,example:`If a teacher says "listen carefully for instructions," she means students should pay close attention so they don't miss anything important.`,points:12,feedbackCorrect:`Well explained — that is exactly what grandfather meant.`,feedbackIncorrect:`Think again about grandfather's final words to Nok.`},{id:`l9-mq-08`,type:`short-answer`,skill:`reading`,topic:`Lesson Learned`,difficulty:`medium`,prompt:`Write one thing people should do when they notice unusual warning signs like these.`,acceptedAnswers:[`move to higher ground`,`stay calm`,`act quickly`,`tell others`,`warn people`,`leave the area`,`get to safety`,`go to higher ground`],placeholder:`Write your answer in English...`,explanation:`People should stay calm, act quickly, warn others nearby, and move to a safe place, just like Nok's family did in the story.`,explanationThai:`ผู้คนควรตั้งสติ รีบลงมือทำ เตือนคนรอบข้าง และย้ายไปยังที่ปลอดภัย เช่นเดียวกับครอบครัวของนกในเรื่อง`,hint1:`Think about exactly what Nok's family did once they were warned.`,hint2:`A good answer describes a safe, quick action.`,example:`When a fire alarm rings, people should stay calm and walk quickly to the nearest exit.`,points:12,feedbackCorrect:`Great advice — that is exactly what kept the family safe.`,feedbackIncorrect:`Think about the actions Nok's family took after the warning.`},{id:`l9-mq-09`,type:`true-false`,skill:`reading`,topic:`Detail`,difficulty:`easy`,prompt:`Decide if this statement about the story is true or false.`,statement:`Nok's grandfather had lived in Blue Bay his whole life.`,correctAnswer:!0,explanation:`The story says grandfather "had fished in Blue Bay his whole life," which is why he recognized the warning signs so quickly.`,explanationThai:`เรื่องราวกล่าวว่าคุณตา "หาปลาที่ Blue Bay มาตลอดชีวิต" จึงทำให้เขาสังเกตสัญญาณเตือนได้อย่างรวดเร็ว`,hint1:`Look at the scene titled "Grandfather Remembers."`,hint2:`His long experience in the village is why he understood the danger.`,example:`If a story says "the old sailor had sailed the sea for forty years," that statement would be true.`,points:8,feedbackCorrect:`Correct — grandfather's long experience helped him recognize the danger.`,feedbackIncorrect:`Re-read the scene about grandfather noticing the warning signs.`}]},summary:{keyTakeaways:[`Noticing unusual changes in nature — like animals moving away or the sea pulling back — can be an important warning sign.`,`Grandfather's experience and quick thinking helped the family recognize danger and act fast.`,`Moving to higher ground immediately, without waiting to be completely sure, kept the family safe.`,`Stories like this teach us to observe carefully, stay calm, and respond quickly to warning signs.`],keyTakeawaysThai:[`การสังเกตความเปลี่ยนแปลงผิดปกติของธรรมชาติ เช่น สัตว์ย้ายหนีหรือทะเลถอยห่าง อาจเป็นสัญญาณเตือนสำคัญ`,`ประสบการณ์และการตัดสินใจที่รวดเร็วของคุณตาช่วยให้ครอบครัวรู้ทันอันตราย`,`การรีบย้ายไปที่สูงทันทีโดยไม่รอให้แน่ใจ ช่วยให้ครอบครัวปลอดภัย`,`เรื่องราวเช่นนี้สอนให้เราสังเกตอย่างรอบคอบ ตั้งสติ และตอบสนองต่อสัญญาณเตือนอย่างรวดเร็ว`]}}},zi=[{id:`v-snow`,word:`snow`,partOfSpeech:`noun`,meaningEn:`soft white frozen water that falls from the sky in cold places`,meaningThai:`หิมะ`,example:`Melting snow can make the river rise.`,icon:`❄️`,category:`weather-and-change`},{id:`v-ice`,word:`ice`,partOfSpeech:`noun`,meaningEn:`water that has frozen and become hard`,meaningThai:`น้ำแข็ง`,example:`The ice on the mountain begins to melt in spring.`,icon:`🧊`,category:`weather-and-change`},{id:`v-riverbank`,word:`riverbank`,partOfSpeech:`noun`,meaningEn:`the land at the edge of a river`,meaningThai:`ริมฝั่งแม่น้ำ`,example:`Heavy rain made the water go over the riverbank.`,icon:`🌾`,category:`land-and-place`},{id:`v-land`,word:`land`,partOfSpeech:`noun`,meaningEn:`the solid, dry part of the Earth's surface, not water`,meaningThai:`พื้นดิน`,example:`The flood covered the land near the village.`,icon:`🗺️`,category:`land-and-place`},{id:`v-wave`,word:`wave`,partOfSpeech:`noun`,meaningEn:`a moving ridge of water on the surface of the sea`,meaningThai:`คลื่น`,example:`Big waves crashed against the coast.`,icon:`🌊`,category:`water-features`},{id:`v-melt`,word:`melt`,partOfSpeech:`verb`,meaningEn:`to change from solid ice or snow into liquid water`,meaningThai:`ละลาย`,example:`The snow began to melt when the weather got warmer.`,icon:`💧`,category:`weather-and-change`},{id:`v-flood-l10`,word:`flood`,partOfSpeech:`noun`,meaningEn:`too much water covering land that is usually dry`,meaningThai:`น้ำท่วม`,example:`Heavy rain caused a flood in the village.`,icon:`🌀`,category:`weather-and-change`},{id:`v-rain`,word:`rain`,partOfSpeech:`noun`,meaningEn:`water that falls from clouds in drops`,meaningThai:`ฝน`,example:`Heavy rain filled the river with water.`,icon:`🌧️`,category:`weather-and-change`},{id:`v-sea`,word:`sea`,partOfSpeech:`noun`,meaningEn:`a large area of salt water`,meaningThai:`ทะเล`,example:`Big waves formed out at sea.`,icon:`🌅`,category:`water-features`},{id:`v-river`,word:`river`,partOfSpeech:`noun`,meaningEn:`a long line of water that flows across the land to the sea`,meaningThai:`แม่น้ำ`,example:`River water rose quickly after the heavy rain.`,icon:`🏞️`,category:`water-features`},{id:`v-village`,word:`village`,partOfSpeech:`noun`,meaningEn:`a small group of houses in the countryside`,meaningThai:`หมู่บ้าน`,example:`The flood reached the small village by the river.`,icon:`🏘️`,category:`land-and-place`},{id:`v-coast`,word:`coast`,partOfSpeech:`noun`,meaningEn:`the land next to the sea`,meaningThai:`ชายฝั่ง`,example:`Big waves hit the coast during the storm.`,icon:`🏖️`,category:`water-features`},{id:`v-seawall`,word:`seawall`,partOfSpeech:`noun`,meaningEn:`a strong wall built to stop the sea from flooding the land`,meaningThai:`กำแพงกันคลื่น`,example:`The seawall could not stop the biggest waves.`,icon:`🧱`,category:`land-and-place`},{id:`v-habitat`,word:`habitat`,partOfSpeech:`noun`,meaningEn:`the natural home of a plant or animal`,meaningThai:`ถิ่นที่อยู่อาศัย`,example:`The flood changed the dry habitat into a wet habitat.`,icon:`🦋`,category:`land-and-place`},{id:`v-dry`,word:`dry`,partOfSpeech:`adjective`,meaningEn:`having no water; not wet`,meaningThai:`แห้ง`,example:`Before the flood, the land was dry.`,icon:`🏜️`,category:`condition`},{id:`v-wet`,word:`wet`,partOfSpeech:`adjective`,meaningEn:`covered in water or liquid; not dry`,meaningThai:`เปียก`,example:`After the flood, the fields were wet.`,icon:`💦`,category:`condition`},{id:`v-overflow`,word:`overflow`,partOfSpeech:`verb`,meaningEn:`to flow over the edge of something because it is too full`,meaningThai:`ล้น`,example:`The river began to overflow after days of heavy rain.`,icon:`🫗`,category:`weather-and-change`},{id:`v-higher-ground`,word:`higher ground`,partOfSpeech:`noun`,meaningEn:`land that is higher up and safer from floodwater`,meaningThai:`ที่สูง`,example:`The villagers moved to higher ground to stay safe.`,icon:`⛰️`,category:`land-and-place`}],Bi=[{id:`water-features`,label:`Water Features`},{id:`weather-and-change`,label:`Weather & Change`},{id:`land-and-place`,label:`Land & Place`},{id:`condition`,label:`Condition`}],Vi={id:`l10-flood-vocabulary`,number:10,title:`Flood Vocabulary`,subtitle:`Learn the key words for snow, rain, rivers, coasts, and floods.`,skillCategory:`vocabulary`,estimatedMinutes:20,stages:{warmup:{promptEn:`Look at these three symbols: ❄️ 🌧️ 🌊. What do they all have in common? Talk with a partner or write one sentence.`,promptThai:`ดูสัญลักษณ์สามอย่างนี้: ❄️ 🌧️ 🌊 มีอะไรที่เหมือนกัน? พูดคุยกับเพื่อนหรือเขียนหนึ่งประโยค`,hook:`They are all forms of water — and too much of any of them can cause a flood.`},learn:{intro:`Flood words describe water in different forms (snow, rain, waves), the places where floods happen (rivers, coasts, villages), how water changes (melting, overflowing), and the conditions land can be in (dry or wet). Learning these words will help you read and talk about floods in English.`,introThai:`คำศัพท์เรื่องน้ำท่วมอธิบายรูปแบบต่าง ๆ ของน้ำ สถานที่ที่เกิดน้ำท่วม การเปลี่ยนแปลงของน้ำ และสภาพของแผ่นดิน`,points:[{title:`Water features`,body:`Words like river, sea, wave, and coast describe where large amounts of water are found.`,bodyThai:`แม่น้ำ ทะเล คลื่น และชายฝั่ง อธิบายสถานที่ที่มีน้ำปริมาณมาก`},{title:`Weather and change`,body:`Snow, ice, rain, melt, overflow, and flood describe water in the weather and how it changes.`,bodyThai:`หิมะ น้ำแข็ง ฝน ละลาย ล้น และน้ำท่วม อธิบายน้ำในสภาพอากาศและการเปลี่ยนแปลงของมัน`},{title:`Land and place`,body:`Land, riverbank, village, seawall, habitat, and higher ground describe places connected to floods.`,bodyThai:`พื้นดิน ริมฝั่งแม่น้ำ หมู่บ้าน กำแพงกันคลื่น ถิ่นที่อยู่อาศัย และที่สูง อธิบายสถานที่ที่เกี่ยวข้องกับน้ำท่วม`},{title:`Condition words`,body:`"Dry" and "wet" describe whether land has water on it or not — a flood changes dry land into wet land.`,bodyThai:`"แห้ง" และ "เปียก" อธิบายว่าแผ่นดินมีน้ำหรือไม่ น้ำท่วมเปลี่ยนแผ่นดินแห้งให้กลายเป็นแผ่นดินเปียก`}],vocabulary:zi},examples:{items:[{text:`Heavy rain and melting snow can make river water rise very quickly.`,noteThai:`ฝนตกหนักและหิมะที่ละลายทำให้น้ำในแม่น้ำสูงขึ้นอย่างรวดเร็ว`},{text:`When the river started to go over the riverbank, water began to flood the land.`,noteThai:`เมื่อแม่น้ำเริ่มไหลข้ามริมฝั่ง น้ำก็เริ่มท่วมแผ่นดิน`},{text:`Big waves crashed over the seawall and reached the village near the coast.`,noteThai:`คลื่นใหญ่ซัดข้ามกำแพงกันคลื่นและไปถึงหมู่บ้านใกล้ชายฝั่ง`},{text:`The flood turned the dry habitat into a wet habitat for a few days.`,noteThai:`น้ำท่วมเปลี่ยนถิ่นที่อยู่อาศัยที่แห้งให้กลายเป็นเปียกอยู่หลายวัน`},{text:`When the water began to overflow, families moved to higher ground to stay safe.`,noteThai:`เมื่อน้ำเริ่มล้น ครอบครัวต่าง ๆ ย้ายไปยังที่สูงเพื่อความปลอดภัย`}]},guided:{questions:[{id:`l10-g-01`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`easy`,prompt:`Which word means 'the land at the edge of a river'?`,options:[`riverbank`,`coast`,`seawall`,`habitat`],correctIndex:0,explanation:`A "riverbank" is the land right next to a river, where the water usually stops.`,explanationThai:`"ริมฝั่งแม่น้ำ" คือพื้นดินที่อยู่ติดกับแม่น้ำ ซึ่งปกติน้ำจะหยุดอยู่แค่นั้น`,hint1:`Think about the edge of a river, not the sea.`,hint2:`This word contains the smaller word "bank".`,example:`A "coast" is the land next to the sea, not a river.`,points:10,feedbackCorrect:`Yes — a riverbank is the land at the edge of a river.`,feedbackIncorrect:`Not quite — look at the other land words again.`},{id:`l10-g-02`,type:`match`,skill:`vocabulary`,topic:`Words & Pictures`,difficulty:`easy`,prompt:`Match each word to its picture.`,left:[{id:`w1`,label:`snow`},{id:`w2`,label:`ice`},{id:`w3`,label:`rain`},{id:`w4`,label:`wave`}],right:[{id:`e1`,label:`❄️`},{id:`e2`,label:`🧊`},{id:`e3`,label:`🌧️`},{id:`e4`,label:`🌊`}],pairs:{w1:`e1`,w2:`e2`,w3:`e3`,w4:`e4`},explanation:`Snow, ice, rain, and waves are all forms or movements of water that can lead to floods.`,explanationThai:`หิมะ น้ำแข็ง ฝน และคลื่น ล้วนเป็นรูปแบบหรือการเคลื่อนไหวของน้ำที่อาจทำให้เกิดน้ำท่วม`,hint1:`Snow and ice both look white or clear.`,hint2:`A wave moves on the surface of the sea.`,example:`flood → 🌀`,points:12,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — look at each picture again.`},{id:`l10-g-03`,type:`match`,skill:`vocabulary`,topic:`Words & Pictures`,difficulty:`easy`,prompt:`Match each word to its picture.`,left:[{id:`p1`,label:`river`},{id:`p2`,label:`sea`},{id:`p3`,label:`coast`},{id:`p4`,label:`village`}],right:[{id:`e1`,label:`🏞️`},{id:`e2`,label:`🌅`},{id:`e3`,label:`🏖️`},{id:`e4`,label:`🏘️`}],pairs:{p1:`e1`,p2:`e2`,p3:`e3`,p4:`e4`},explanation:`A river flows across the land, the sea is a large area of salt water, the coast is the land next to the sea, and a village is a small group of houses.`,explanationThai:`แม่น้ำไหลผ่านแผ่นดิน ทะเลคือพื้นน้ำเค็มขนาดใหญ่ ชายฝั่งคือแผ่นดินติดทะเล และหมู่บ้านคือกลุ่มบ้านขนาดเล็ก`,hint1:`The coast and the sea are both near water, but the coast is land.`,hint2:`A village is made of houses, not water.`,example:`seawall → 🧱`,points:12,feedbackCorrect:`All matched!`,feedbackIncorrect:`Check the pictures again.`},{id:`l10-g-04`,type:`sort`,skill:`vocabulary`,topic:`Categories`,difficulty:`medium`,prompt:`Sort these words into the correct category.`,categories:Bi,items:[{id:`i1`,label:`river`,categoryId:`water-features`},{id:`i2`,label:`wave`,categoryId:`water-features`},{id:`i3`,label:`snow`,categoryId:`weather-and-change`},{id:`i4`,label:`rain`,categoryId:`weather-and-change`},{id:`i5`,label:`village`,categoryId:`land-and-place`},{id:`i6`,label:`riverbank`,categoryId:`land-and-place`},{id:`i7`,label:`dry`,categoryId:`condition`},{id:`i8`,label:`wet`,categoryId:`condition`}],explanation:`Flood words can describe water features (river, wave), weather and change (snow, rain), land and place (village, riverbank), or a condition (dry, wet).`,explanationThai:`คำศัพท์เรื่องน้ำท่วมแบ่งได้เป็นลักษณะแหล่งน้ำ สภาพอากาศและการเปลี่ยนแปลง แผ่นดินและสถานที่ และสภาพ`,hint1:`Ask: is this water, something that changes, a place, or how something feels?`,hint2:`"Dry" and "wet" are opposites that describe a condition.`,example:`"flood" belongs in Weather & Change.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong category — check again.`},{id:`l10-g-05`,type:`mcq`,skill:`vocabulary`, ,feedbackIncorrect:`Think about the event caused by too much water.`},{id:`l10-mq-02`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'the land at the edge of a river'?`,options:[`riverbank`,`seawall`,`coast`,`village`],correctIndex:0,explanation:`A "riverbank" is the land right next to a river.`,explanationThai:`"ริมฝั่งแม่น้ำ" คือพื้นดินที่อยู่ติดกับแม่น้ำ`,hint1:`This word is about a river, not the sea.`,hint2:`It contains the smaller word "bank".`,example:`A seawall is a wall built next to the sea.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about the edge of a river.`},{id:`l10-mq-03`,type:`fill-blank`,skill:`vocabulary`,topic:`Flood Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`Heavy`,after:`can fill a river very quickly.`,answers:[`rain`],explanation:`"Heavy rain" means a large amount of rain, which is a common cause of floods.`,explanationThai:`"ฝนตกหนัก" หมายถึงฝนปริมาณมาก ซึ่งเป็นสาเหตุทั่วไปของน้ำท่วม`,hint1:`Think about water falling from the clouds.`,hint2:`It starts with the letter R.`,example:`Melting snow can also fill a river with water.`,points:10,feedbackCorrect:`Correct — "rain" fits perfectly.`,feedbackIncorrect:`What falls from clouds and can fill a river?`},{id:`l10-mq-04`,type:`match`,skill:`vocabulary`,topic:`Words & Pictures`,difficulty:`medium`,prompt:`Match each word to its picture.`,left:[{id:`p1`,label:`snow`},{id:`p2`,label:`sea`},{id:`p3`,label:`village`},{id:`p4`,label:`dry`}],right:[{id:`e1`,label:`❄️`},{id:`e2`,label:`🌅`},{id:`e3`,label:`🏘️`},{id:`e4`,label:`🏜️`}],pairs:{p1:`e1`,p2:`e2`,p3:`e3`,p4:`e4`},explanation:`Each word matches its picture: snow is white and cold, sea is a large area of water, a village is a group of houses, and dry means no water.`,explanationThai:`แต่ละคำจับคู่กับภาพตามความหมาย`,hint1:`Snow is white and falls in cold places.`,hint2:`The desert picture shows no water at all.`,example:`wave → 🌊`,points:14,feedbackCorrect:`All matched!`,feedbackIncorrect:`Check the pictures again.`},{id:`l10-mq-05`,type:`mcq`,skill:`vocabulary`,topic:`Odd One Out`,difficulty:`medium`,prompt:`Find the odd word out.`,options:[`river`,`sea`,`coast`,`dry`],correctIndex:3,explanation:`River, sea, and coast are all connected to large amounts of water, but "dry" means having no water at all.`,explanationThai:`แม่น้ำ ทะเล และชายฝั่ง ล้วนเกี่ยวข้องกับน้ำ ส่วน "แห้ง" หมายถึงไม่มีน้ำเลย`,hint1:`Three of these are places with lots of water nearby.`,hint2:`Which word is a condition, not a place?`,example:`In "snow, ice, rain, village" — village is the odd one out.`,points:10,feedbackCorrect:`Correct — dry is a condition, not a water place.`,feedbackIncorrect:`Three of these are places near water — find the one that is not.`},{id:`l10-mq-06`,type:`sort`,skill:`vocabulary`,topic:`Categories`,difficulty:`challenge`,prompt:`Sort these words into the correct category.`,categories:Bi,items:[{id:`i1`,label:`wave`,categoryId:`water-features`},{id:`i2`,label:`ice`,categoryId:`weather-and-change`},{id:`i3`,label:`overflow`,categoryId:`weather-and-change`},{id:`i4`,label:`land`,categoryId:`land-and-place`},{id:`i5`,label:`habitat`,categoryId:`land-and-place`},{id:`i6`,label:`wet`,categoryId:`condition`}],explanation:`Each word belongs to one category based on what kind of thing it is: a water feature, weather and change, land and place, or a condition.`,explanationThai:`แต่ละคำจัดอยู่ในหมวดหมู่ตามประเภทของคำ`,hint1:`Ask: is this water, something that changes, a place, or how something feels?`,hint2:`"Overflow" is something that happens to water, like "ice" changing.`,example:`"river" belongs in Water Features.`,points:16,feedbackCorrect:`All sorted correctly!`,feedbackIncorrect:`A few words are in the wrong bucket.`},{id:`l10-mq-07`,type:`fill-blank`,skill:`vocabulary`,topic:`Flood Sentences`,difficulty:`challenge`,prompt:`Complete the sentence with the correct phrase.`,before:`During the flood, families moved to`,after:`where the water could not reach them.`,answers:[`higher ground`],explanation:`"Higher ground" is land that is higher up and safer from floodwater.`,explanationThai:`"ที่สูง" คือพื้นที่ที่สูงขึ้นและปลอดภัยจากน้ำท่วม`,hint1:`This phrase has two words.`,hint2:`It means land that is up high, away from the water.`,example:`The seawall could not stop the biggest waves.`,points:14,feedbackCorrect:`Correct — "higher ground" fits perfectly.`,feedbackIncorrect:`What two-word phrase means "safer, higher land"?`},{id:`l10-mq-08`,type:`mcq`,skill:`vocabulary`,topic:`Picture ID`,difficulty:`medium`,prompt:`🫗 What is happening in this picture?`,options:[`overflow`,`melt`,`dry`,`coast`],correctIndex:0,explanation:`"Overflow" means water flowing over the edge of something because it is too full.`,explanationThai:`"ล้น" หมายถึงน้ำไหลข้ามขอบของสิ่งใดสิ่งหนึ่งเพราะเต็มเกินไป`,hint1:`This is what a river does when it gets too full.`,hint2:`It is not about ice changing to water.`,example:`🧊 = ice.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about water spilling over an edge.`},{id:`l10-mq-09`,type:`mcq`,skill:`vocabulary`,topic:`Definitions`,difficulty:`medium`,prompt:`Which word means 'the natural home of a plant or animal'?`,options:[`habitat`,`coast`,`land`,`village`],correctIndex:0,explanation:`A "habitat" is the natural home where a plant or animal normally lives.`,explanationThai:`"ถิ่นที่อยู่อาศัย" คือบ้านตามธรรมชาติของพืชหรือสัตว์`,hint1:`This word is about nature, not people.`,hint2:`A flood can turn a dry one into a wet one.`,example:`A village is a home for people.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about where a plant or animal naturally lives.`},{id:`l10-mq-10`,type:`fill-blank`,skill:`vocabulary`,topic:`Flood Sentences`,difficulty:`challenge`,prompt:`Complete the sentence with the correct phrase.`,before:`In spring,`,after:`can make rivers rise and sometimes flood.`,answers:[`melting snow`],explanation:`"Melting snow" is snow that is changing into water — a common cause of floods near mountains.`,explanationThai:`"หิมะที่กำลังละลาย" เป็นสาเหตุทั่วไปของน้ำท่วมใกล้ภูเขา`,hint1:`This phrase describes snow changing because of warmer weather.`,hint2:`It has two words.`,example:`Heavy rain can also make river water rise quickly.`,points:14,feedbackCorrect:`Correct — "melting snow" fits perfectly.`,feedbackIncorrect:`What two-word phrase describes snow changing into water?`}]},summary:{keyTakeaways:[`Flood words fall into four groups: water features, weather and change, land and place, and conditions.`,`Heavy rain and melting snow are both common causes of rising river water.`,`When water goes over a riverbank or a seawall, it can flood the land nearby.`,`"Dry" and "wet" describe the condition of land or a habitat before and after a flood.`,`Moving to higher ground is one way people stay safe during a flood.`],keyTakeawaysThai:[`คำศัพท์เรื่องน้ำท่วมแบ่งเป็น 4 กลุ่ม: ลักษณะแหล่งน้ำ สภาพอากาศและการเปลี่ยนแปลง แผ่นดินและสถานที่ และสภาพ`,`ฝนตกหนักและหิมะละลายเป็นสาเหตุทั่วไปที่ทำให้น้ำในแม่น้ำสูงขึ้น`,`การย้ายไปยังที่สูงเป็นวิธีหนึ่งที่ผู้คนใช้เพื่อความปลอดภัยระหว่างน้ำท่วม`]}}},j={id:`l11-how-floods-happen`,number:11,title:`How Floods Happen`,subtitle:`Read about the causes and effects of floods, and learn cause-and-effect language.`,skillCategory:`flood-knowledge`,estimatedMinutes:22,stages:{warmup:{promptEn:`Think about a time it rained very heavily. What happened to the roads or the ground? Talk with a partner or write one sentence.`,promptThai:`นึกถึงตอนที่ฝนตกหนักมาก เกิดอะไรขึ้นกับถนนหรือพื้นดิน? พูดคุยกับเพื่อนหรือเขียนหนึ่งประโยค`,hook:`When there is more water than the ground can hold, that extra water has to go somewhere — and that is how a flood begins.`},learn:{intro:`Floods happen when there is more water than the land, a river, or the sea can hold. There are several reasons why a flood can start. Heavy rain can fall faster than the ground can soak it up. Snow on the mountains can melt quickly and send extra water rushing into rivers. A river can rise so high that it overflows its banks, and out at the coast, large waves can push seawater onto the land — sometimes right over a seawall. Even a town's drainage system can become full of water and stop working properly.

Some floods happen slowly, over many days, as a river rises a little more each day after heavy rain. Other floods happen quickly — these are sometimes called flash floods — when a huge amount of rain falls in just a few hours, or when a big storm pushes powerful waves onto the coast in a single afternoon.`,introThai:`น้ำท่วมเกิดขึ้นเมื่อมีน้ำมากกว่าที่แผ่นดิน แม่น้ำ หรือทะเลจะรับไหว มีสาเหตุหลายอย่างที่ทำให้น้ำท่วมเริ่มต้นขึ้น เช่น ฝนตกหนัก หิมะละลายเร็ว แม่น้ำล้นตลิ่ง คลื่นใหญ่ที่ชายฝั่ง หรือระบบระบายน้ำที่เต็ม น้ำท่วมบางครั้งเกิดขึ้นช้า ๆ หลายวัน แต่บางครั้งก็เกิดขึ้นอย่างรวดเร็วภายในไม่กี่ชั่วโมง`,points:[{title:`because`,body:`We use "because" to give the reason for something. Example: "The road flooded because heavy rain fell all night."`,bodyThai:`เราใช้ "because" เพื่อบอกเหตุผลของสิ่งที่เกิดขึ้น`},{title:`so`,body:`We use "so" to show the result of something. Example: "Heavy rain fell all night, so the road flooded."`,bodyThai:`เราใช้ "so" เพื่อแสดงผลลัพธ์ของสิ่งที่เกิดขึ้น`},{title:`when`,body:`We use "when" to show that one thing happens at the same time as, or right after, another. Example: "When heavy rain falls for many days, rivers can rise very high."`,bodyThai:`เราใช้ "when" เพื่อแสดงว่าสิ่งหนึ่งเกิดขึ้นพร้อมกับหรือหลังจากอีกสิ่งหนึ่ง`},{title:`as a result`,body:`We use "as a result" at the start of a new sentence to show what happened because of the sentence before it. Example: "There was a big storm. As a result, big waves went over the seawall."`,bodyThai:`เราใช้ "as a result" เพื่อแสดงสิ่งที่เกิดขึ้นเนื่องจากประโยคก่อนหน้า`},{title:`this causes`,body:`We use "this causes" to link an idea directly to its effect. Example: "The drains become full of water. This causes water to stay on the streets."`,bodyThai:`เราใช้ "this causes" เพื่อเชื่อมความคิดกับผลลัพธ์โดยตรง`}]},examples:{items:[{text:`When a flood happens, roads can become unsafe for cars and people to use.`,noteThai:`เมื่อน้ำท่วมเกิดขึ้น ถนนอาจไม่ปลอดภัยสำหรับรถและผู้คน`},{text:`Flood water can damage houses and the things inside them.`,noteThai:`น้ำท่วมสามารถทำความเสียหายให้บ้านเรือนและสิ่งของภายในได้`},{text:`Animals may lose their habitats when their home is covered in water.`,noteThai:`สัตว์อาจสูญเสียถิ่นที่อยู่อาศัยเมื่อบ้านของพวกมันถูกน้ำท่วม`},{text:`Plants can receive too much water during a flood, which can harm their roots.`,noteThai:`พืชอาจได้รับน้ำมากเกินไประหว่างน้ำท่วม ซึ่งอาจทำให้รากเสียหาย`},{text:`Some dry habitats, like a dry riverbed, can actually benefit from the extra water.`,noteThai:`ถิ่นที่อยู่อาศัยที่แห้งบางแห่ง เช่น ร่องน้ำแห้ง อาจได้ประโยชน์จากน้ำที่เพิ่มขึ้น`},{text:`During a serious flood, people may need to move to a safer or higher place.`,noteThai:`ระหว่างน้ำท่วมรุนแรง ผู้คนอาจต้องย้ายไปยังที่ปลอดภัยหรือที่สูงกว่า`}]},guided:{questions:[{id:`l11-g-01`,type:`mcq`,skill:`flood-knowledge`,topic:`Cause & Effect Words`,difficulty:`easy`,prompt:`There was a flood ___ heavy rain fell for three days.`,options:[`because`,`so`,`dry`,`wet`],correctIndex:0,explanation:`"Because" gives the reason for something. The flood happened for the reason that heavy rain fell for three days.`,explanationThai:`"Because" ใช้บอกเหตุผลของสิ่งที่เกิดขึ้น น้ำท่วมเกิดขึ้นเพราะฝนตกหนักสามวัน`,hint1:`This word answers the question "why?"`,hint2:`It is not "so", which shows a result, not a reason.`,example:`The river rose because the snow was melting quickly.`,points:10,feedbackCorrect:`Correct — "because" gives the reason.`,feedbackIncorrect:`Think about which word means "for this reason".`},{id:`l11-g-02`,type:`true-false`,skill:`flood-knowledge`,topic:`How Floods Happen`,difficulty:`easy`,prompt:`True or false?`,statement:`A flood can only happen quickly, never slowly.`,correctAnswer:!1,explanation:`This is false — some floods happen slowly over many days, as a river rises a little more each day. Others, called flash floods, happen very quickly.`,explanationThai:`ข้อความนี้ผิด น้ำท่วมบางครั้งเกิดขึ้นช้า ๆ หลายวัน แต่บางครั้งก็เกิดขึ้นเร็วมาก เรียกว่าน้ำท่วมฉับพลัน`,hint1:`Think about a river rising slowly after days of rain.`,hint2:`A "flash flood" is the name for a fast flood.`,example:`A river flood after a week of rain happens slowly.`,points:10,feedbackCorrect:`Correct — floods can happen slowly or quickly.`,feedbackIncorrect:`Think about a river that rises a little more each day.`},{id:`l11-g-03`,type:`match`,skill:`flood-knowledge`,topic:`Causes & Effects`,difficulty:`medium`,prompt:`Match each cause to its most likely effect.`,left:[{id:`c1`,label:`Heavy rain falls all night`},{id:`c2`,label:`Big waves hit the coast`},{id:`c3`,label:`A river overflows its banks`},{id:`c4`,label:`The drainage system becomes full`}],right:[{id:`e1`,label:`Roads become unsafe to drive on`},{id:`e2`,label:`Water reaches houses near the beach`},{id:`e3`,label:`Water covers the fields nearby`},{id:`e4`,label:`Water has nowhere to go and rises in the street`}],pairs:{c1:`e1`,c2:`e2`,c3:`e3`,c4:`e4`},explanation:`Each cause leads to a specific effect: heavy rain makes roads unsafe, coastal waves reach beach houses, an overflowing river covers nearby fields, and a full drainage system leaves water in the street.`,explanationThai:`แต่ละสาเหตุนำไปสู่ผลลัพธ์ที่แตกต่างกัน`,hint1:`Think about which effect happens closest to each cause.`,hint2:`Coastal waves affect the coast, not fields far inland.`,example:`Rapid snowmelt → the river rises quickly.`,points:16,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Some pairs are wrong — think about where each cause happens.`},{id:`l11-g-04`,type:`mcq`,skill:`flood-knowledge`,topic:`Reading Comprehension`,difficulty:`medium`,prompt:`Why do floods sometimes happen very quickly?`,options:[`A huge amount of rain falls in just a few hours, or powerful waves hit the coast suddenly`,`The weather is sunny for many weeks in a row`,`A seawall is painted a new colour`,`Animals move to a new habitat`],correctIndex:0,explanation:`Fast floods, called flash floods, happen when a huge amount of rain falls quickly, or when a storm sends powerful waves onto the coast in a short time.`,explanationThai:`น้ำท่วมฉับพลันเกิดขึ้นเมื่อฝนตกหนักมากในเวลาสั้น ๆ หรือเมื่อพายุส่งคลื่นแรงเข้าสู่ชายฝั่งอย่างรวดเร็ว`,hint1:`Think about a huge amount of water arriving in a short time.`,hint2:`Sunny weather does not cause a flood.`,example:`A slow flood happens when a river rises a little more each day.`,points:12,feedbackCorrect:`Correct — that is why some floods happen fast.`,feedbackIncorrect:`Think about a huge amount of water arriving very quickly.`},{id:`l11-g-05`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Cause & Effect Words`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`The river rose quickly`,after:`there was heavy rain for three days.`,answers:[`because`],explanation:`"Because" connects the effect (the river rose) to its reason (heavy rain fell for three days).`,explanationThai:`"Because" เชื่อมผลลัพธ์ (แม่น้ำสูงขึ้น) กับเหตุผล (ฝนตกหนักสามวัน)`,hint1:`This word answers the question "why?"`,hint2:`It is not "so" — "so" comes before a result, not a reason.`,example:`The road flooded because the drains were full.`,points:12,feedbackCorrect:`Correct — "because" fits perfectly.`,feedbackIncorrect:`Which word means "for this reason"?`},{id:`l11-g-06`,type:`mcq`,skill:`flood-knowledge`,topic:`Identifying Causes`,difficulty:`medium`,prompt:`A farmer says, 'The snow on the mountain has been melting fast all week, and now the river is very high.' What most likely caused this?`,options:[`Rapid snowmelt`,`Big coastal waves`,`A full drainage system`,`A seawall breaking`],correctIndex:0,explanation:`The farmer describes snow melting quickly and the river rising — this is caused by rapid snowmelt.`,explanationThai:`ชาวนาบรรยายว่าหิมะละลายเร็วและแม่น้ำสูงขึ้น สาเหตุคือหิมะละลายอย่างรวดเร็ว`,hint1:`Look for the key word about snow in the description.`,hint2:`It is not about the coast or drains — there is no mention of the sea or a town.`,example:`Heavy rain for many days can also make a river rise.`,points:12,feedbackCorrect:`Correct — rapid snowmelt caused this.`,feedbackIncorrect:`Read the description again — what is happening to the snow?`},{id:`l11-g-07`,type:`true-false`,skill:`flood-knowledge`,topic:`Effects of Floods`,difficulty:`medium`,prompt:`True or false?`,statement:`Some dry habitats can benefit from the extra water during a flood.`,correctAnswer:!0,explanation:`This is true — a dry habitat, like a dry riverbed, can sometimes benefit from extra water, even though a flood also causes damage elsewhere.`,explanationThai:`ข้อความนี้ถูกต้อง ถิ่นที่อยู่อาศัยที่แห้งบางแห่งอาจได้ประโยชน์จากน้ำที่เพิ่มขึ้นระหว่างน้ำท่วม`,hint1:`Think about a dry riverbed that rarely gets water.`,hint2:`Not every effect of a flood is bad for every habitat.`,example:`A flooded road, on the other hand, becomes unsafe.`,points:10,feedbackCorrect:`Correct — some dry habitats can benefit from extra water.`,feedbackIncorrect:`Think about a place that is usually very dry.`},{id:`l11-g-08`,type:`mcq`,skill:`flood-knowledge`,topic:`Reading Comprehension`,difficulty:`medium`,prompt:`According to the text, what can happen to animals during a flood?`,options:[`They may lose their habitats`,`They always move to the sea`,`They become paramedics`,`They build seawalls`],correctIndex:0,explanation:`The text explains that animals may lose their habitats when their home is covered in water.`,explanationThai:`ข้อความอธิบายว่าสัตว์อาจสูญเสียถิ่นที่อยู่อาศัยเมื่อบ้านของพวกมันถูกน้ำท่วม`,hint1:`Think about what happens to an animal's home when it is covered in water.`,hint2:`The other options are not mentioned in the text.`,example:`Plants can also receive too much water during a flood.`,points:10,feedbackCorrect:`Correct!`,feedbackIncorrect:`Think about what happens to an animal's home during a flood.`}]},independent:{questions:[{id:`l11-i-01`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Cause & Effect Words`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`The drainage system was full,`,after:`the water stayed on the road.`,answers:[`so`],explanation:`"So" introduces the result of something. The drains were full, so the water had nowhere to go.`,explanationThai:`"So" ใช้แสดงผลลัพธ์ของสิ่งที่เกิดขึ้น`,hint1:`This word introduces a result, not a reason.`,hint2:`It comes after the cause, before the effect.`,example:`It rained heavily, so the river rose quickly.`,points:12,feedbackCorrect:`Correct — "so" fits perfectly.`,feedbackIncorrect:`Which word shows the result of the drains being full?`},{id:`l11-i-02`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Cause & Effect Words`,difficulty:`challenge`,prompt:`Complete the sentence with the correct word.`,before:``,after:`heavy rain falls for many days, rivers can rise very high.`,answers:[`when`,`When`],explanation:`"When" shows that one thing (rivers rising) happens at the same time as, or right after, another (heavy rain falling).`,explanationThai:`"When" แสดงว่าสิ่งหนึ่งเกิดขึ้นพร้อมกับหรือหลังจากอีกสิ่งหนึ่ง`,hint1:`This word can start a sentence about time or condition.`,hint2:`It is not "because" — this sentence is about timing, not just reason.`,example:`When big waves hit the coast, water can go over a seawall.`,points:14,feedbackCorrect:`Correct — "when" fits perfectly.`,feedbackIncorrect:`Which word means "at the time that"?`},{id:`l11-i-03`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Cause & Effect Words`,difficulty:`challenge`,prompt:`Complete the sentence with the correct phrase.`,before:`There was a big storm at the coast.`,after:`, big waves went over the seawall.`,answers:[`as a result`,`As a result`],explanation:`"As a result" starts a new sentence to show what happened because of the sentence before it.`,explanationThai:`"As a result" ใช้เริ่มประโยคใหม่เพื่อแสดงสิ่งที่เกิดขึ้นเนื่องจากประโยคก่อนหน้า`,hint1:`This phrase has three words.`,hint2:`It means "because of this".`,example:`The river o
