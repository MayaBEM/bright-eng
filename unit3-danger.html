Caller: 12 Mill Road.`,options:[`What is your address?`,`What is your name?`,`What time is it?`,`Do you like fires?`],correctIndex:0,explanation:`After learning what the emergency is, the operator needs the address so they can send help to the right place.`,explanationThai:`หลังจากทราบว่าเกิดเหตุฉุกเฉินอะไร เจ้าหน้าที่ต้องการทราบที่อยู่เพื่อส่งความช่วยเหลือไปยังสถานที่ที่ถูกต้อง`,hint1:`The caller's answer is a street address.`,hint2:`This question always comes early in an emergency call.`,example:`'What is your emergency?' 'There is a flood.' 'What is your address?' '5 River Street.'`,points:12,feedbackCorrect:`Correct — the operator needs the address.`,feedbackIncorrect:`Look at the caller's answer — it is a street address. What question fits?`},{id:`pt-25`,type:`match`,skill:`dialogue`,topic:`Which Service to Call`,difficulty:`medium`,prompt:`Match each emergency to the service that should help.`,left:[{id:`e1`,label:`a house fire`,icon:`🔥`},{id:`e2`,label:`a car crash with injuries`,icon:`💥`},{id:`e3`,label:`someone stealing a bike`,icon:`🚲`}],right:[{id:`s1`,label:`fire service`},{id:`s2`,label:`ambulance service`},{id:`s3`,label:`police`}],pairs:{e1:`s1`,e2:`s2`,e3:`s3`},explanation:`Fires need the fire service, injuries need an ambulance, and crimes like theft need the police.`,explanationThai:`ไฟไหม้ต้องการหน่วยดับเพลิง การบาดเจ็บต้องการรถพยาบาล และอาชญากรรมอย่างการขโมยต้องการตำรวจ`,hint1:`Think about who is trained for each type of emergency.`,hint2:`A car crash needs medical help if people are hurt.`,example:`A flood might need the fire service to help with rescue.`,points:14,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`Check which service handles each emergency.`},{id:`pt-26`,type:`mcq`,skill:`dialogue`,topic:`Call Structure`,difficulty:`medium`,prompt:`What should you say FIRST when you call the emergency number?`,options:[`Tell them what is happening (the emergency).`,`Say goodbye.`,`Ask about the weather.`,`Talk about your day.`],correctIndex:0,explanation:`The first thing to say is what the emergency is, so the operator can send the right help immediately.`,explanationThai:`สิ่งแรกที่ควรพูดคือเหตุฉุกเฉินที่เกิดขึ้น เพื่อให้เจ้าหน้าที่ส่งความช่วยเหลือที่ถูกต้องได้ทันที`,hint1:`Think about what information is most urgent.`,hint2:`It is not small talk.`,example:`'There is a fire at my house!' is a good first sentence.`,points:10,feedbackCorrect:`Correct — say what the emergency is first.`,feedbackIncorrect:`What is the most important, urgent information to share first?`},{id:`pt-27`,type:`sequence`,skill:`dialogue`,topic:`Emergency Call Order`,difficulty:`challenge`,presentation:`dialogue`,prompt:`Put this short emergency call in the correct order.`,items:[{id:`d1`,label:`What is your emergency?`,speaker:`Operator`},{id:`d2`,label:`There is a fire at my house!`,speaker:`Caller`},{id:`d3`,label:`What is your address?`,speaker:`Operator`},{id:`d4`,label:`12 Mill Road.`,speaker:`Caller`},{id:`d5`,label:`Help is on the way. Stay outside and stay safe.`,speaker:`Operator`}],correctOrder:[`d1`,`d2`,`d3`,`d4`,`d5`],explanation:`An emergency call follows a clear order: the operator asks about the emergency, the caller explains, the operator asks for the address, the caller gives it, and the operator confirms help is coming.`,explanationThai:`การโทรแจ้งเหตุฉุกเฉินมีลำดับที่ชัดเจน: เจ้าหน้าที่ถามเหตุฉุกเฉิน ผู้โทรอธิบาย เจ้าหน้าที่ถามที่อยู่ ผู้โทรบอกที่อยู่ และเจ้าหน้าที่ยืนยันว่าความช่วยเหลือกำลังมา`,hint1:`The call always starts with 'What is your emergency?'`,hint2:`The address question comes after the caller explains the problem.`,example:`A call about a flood follows the same order: emergency, address, help is coming.`,points:16,feedbackCorrect:`Correct order — that is how a real emergency call works!`,feedbackIncorrect:`Think about which question comes first and which comes last.`},{id:`pt-28`,type:`mcq`,skill:`reading`,topic:`The Rescue on Mill Road — Comprehension`,difficulty:`easy`,prompt:`${Gi}\n\nWhy did Ben call the emergency operator?`,options:[`Because he saw smoke and a house on fire.`,`Because he was lost.`,`Because his bike was broken.`,`Because he was hungry.`],correctIndex:0,explanation:`Ben called the emergency operator because he saw thick black smoke and realized an old house was on fire.`,explanationThai:`เบนโทรหาเจ้าหน้าที่ฉุกเฉินเพราะเขาเห็นควันดำหนาทึบและรู้ว่าบ้านเก่ากำลังไฟไหม้`,hint1:`Look at the first two sentences of the story.`,hint2:`It is not about being lost or hungry.`,example:`In the story, Ben gave the address so help could arrive.`,points:10,feedbackCorrect:`Correct — Ben called because he saw the fire.`,feedbackIncorrect:`Re-read the beginning of the story — what did Ben see?`},{id:`pt-29`,type:`true-false`,skill:`reading`,topic:`The Rescue on Mill Road — Details`,difficulty:`medium`,prompt:`${Gi}\n\nRead the statement and decide if it is true or false.`,statement:`Three fire engines arrived at Mill Road.`,correctAnswer:!1,explanation:`The story says two fire engines arrived, not three.`,explanationThai:`เรื่องราวบอกว่ามีรถดับเพลิงมาสองคัน ไม่ใช่สามคัน`,hint1:`Look for the number of fire engines mentioned in the story.`,hint2:`Count carefully — it is a small number.`,example:`The story says the fire engines arrived in six minutes.`,points:10,feedbackCorrect:`Correct — it was two fire engines, so the statement is false.`,feedbackIncorrect:`Re-read the story and count the fire engines.`},{id:`pt-30`,type:`short-answer`,skill:`reading`,topic:`The Rescue on Mill Road — Details`,difficulty:`medium`,prompt:`${Gi}\n\nHow many minutes did it take for the fire engines to arrive?`,acceptedAnswers:[`six`,`6`,`six minutes`,`6 minutes`],placeholder:`Type a number of minutes...`,explanation:`The story says the two fire engines arrived in six minutes.`,explanationThai:`เรื่องราวบอกว่ารถดับเพลิงสองคันมาถึงภายในหกนาที`,hint1:`Look for the sentence about the fire engines arriving.`,hint2:`The number is written as a word in the story.`,example:`The story also says the man and his dog were on the second floor.`,points:12,feedbackCorrect:`Correct — six minutes!`,feedbackIncorrect:`Re-read the story and find the number of minutes.`},{id:`pt-31`,type:`sequence`,skill:`reading`,topic:`The Rescue on Mill Road — Order of Events`,difficulty:`challenge`,presentation:`events`,prompt:`${Gi}\n\nPut these events from the story in the correct order.`,items:[{id:`e1`,label:`Ben sees thick black smoke near Mill Road.`},{id:`e2`,label:`Ben calls the emergency operator and gives the address.`},{id:`e3`,label:`Two fire engines arrive.`},{id:`e4`,label:`Firefighters rescue the man and his dog.`},{id:`e5`,label:`The man thanks Ben for calling for help.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`,`e5`],explanation:`The events happen in this order: Ben sees the smoke, he calls for help, the fire engines arrive, the firefighters rescue the man and dog, and finally the man thanks Ben.`,explanationThai:`เหตุการณ์เกิดขึ้นตามลำดับนี้: เบนเห็นควัน เขาโทรขอความช่วยเหลือ รถดับเพลิงมาถึง นักดับเพลิงช่วยชายและสุนัข และสุดท้ายชายคนนั้นขอบคุณเบน`,hint1:`The story always tells events in the order they happened.`,hint2:`Calling for help happens before the fire engines arrive.`,example:`In 'Danger on the Coast', the family sees the warning before they drive away.`,points:16,feedbackCorrect:`Correct order — well done!`,feedbackIncorrect:`Re-read the story carefully and check the order again.`},{id:`pt-32`,type:`mcq`,skill:`reading`,topic:`Danger on the Coast — Comprehension`,difficulty:`easy`,prompt:`${Ki}\n\nWhy did the family leave the campsite?`,options:[`Because of a flood warning and rising water.`,`Because they were bored.`,`Because it was too sunny.`,`Because they ran out of food.`],correctIndex:0,explanation:`The family left because the radio announced a flood warning and waves began crashing over the seawall onto the campsite.`,explanationThai:`ครอบครัวออกจากที่พักเพราะวิทยุประกาศเตือนน้ำท่วมและคลื่นเริ่มซัดข้ามกำแพงกันคลื่นเข้ามาที่แคมป์`,hint1:`Look for the sentence about the radio announcement.`,hint2:`It is not about the weather being too sunny.`,example:`In the story, the family drove to higher ground to stay safe.`,points:10,feedbackCorrect:`Correct — they left because of the flood warning.`,feedbackIncorrect:`Re-read the middle of the story — what did the radio announce?`},{id:`pt-33`,type:`true-false`,skill:`reading`,topic:`Danger on the Coast — Details`,difficulty:`medium`,prompt:`${Ki}\n\nRead the statement and decide if it is true or false.`,statement:`The family stayed at the campsite all night.`,correctAnswer:!1,explanation:`The family did not stay — they packed the car and drove to higher ground before the water reached their tent.`,explanationThai:`ครอบครัวไม่ได้อยู่ต่อ พวกเขาเก็บของขึ้นรถและขับไปยังที่สูงก่อนที่น้ำจะมาถึงเต็นท์`,hint1:`Look for what the family did when the water got close.`,hint2:`They moved away, not stayed.`,example:`The story says they later watched the news about the flood.`,points:10,feedbackCorrect:`Correct — the statement is false, they left.`,feedbackIncorrect:`Re-read the story — did the family stay or leave?`},{id:`pt-34`,type:`short-answer`,skill:`reading`,topic:`Danger on the Coast — Details`,difficulty:`medium`,prompt:`${Ki}\n\nWhat did Mia's mom grab before they left?`,acceptedAnswers:[`flashlight`,`the flashlight`,`a flashlight`],placeholder:`Type what Mia's mom grabbed...`,explanation:`Mia's mom grabbed the flashlight while her dad packed the car.`,explanationThai:`แม่ของเมียหยิบไฟฉายในขณะที่พ่อเก็บของขึ้นรถ`,hint1:`Look for the sentence about Mia's mom.`,hint2:`It is something you use to see in the dark.`,example:`Mia's dad packed the car.`,points:12,feedbackCorrect:`Correct — the flashlight!`,feedbackIncorrect:`Re-read the story and find what Mia's mom grabbed.`},{id:`pt-35`,type:`sequence`,skill:`reading`,topic:`Danger on the Coast — Order of Events`,difficulty:`challenge`,presentation:`events`,prompt:`${Ki}\n\nPut these events from the story in the correct order.`,items:[{id:`e1`,label:`The sky turns dark grey while the family is camping.`},{id:`e2`,label:`The radio announces a flood warning.`},{id:`e3`,label:`Waves crash over the seawall onto the campsite.`},{id:`e4`,label:`Mia's dad packs the car and her mom grabs the flashlight.`},{id:`e5`,label:`The family drives to higher ground.`}],correctOrder:[`e1`,`e2`,`e3`,`e4`,`e5`],explanation:`The story happens in this order: the sky turns dark, the radio gives a flood warning, waves crash over the seawall, the parents get ready, and the family drives to safety.`,explanationThai:`เรื่องราวเกิดขึ้นตามลำดับนี้: ท้องฟ้ามืดครึ้ม วิทยุเตือนน้ำท่วม คลื่นซัดข้ามกำแพงกันคลื่น พ่อแม่เตรียมตัว และครอบครัวขับรถไปยังที่ปลอดภัย`,hint1:`The warning comes before the family packs up.`,hint2:`Driving to higher ground is the last event.`,example:`In 'The Rescue on Mill Road', calling for help comes before the fire engines arrive.`,points:16,feedbackCorrect:`Correct order — great reading!`,feedbackIncorrect:`Re-read the story carefully and check the order again.`},{id:`pt-36`,type:`mcq`,skill:`flood-knowledge`,topic:`Causes of Floods`,difficulty:`easy`,prompt:`What often causes a flood?`,options:[`Heavy rain or melting snow`,`A sunny day`,`A quiet street`,`A small fire`],correctIndex:0,explanation:`Floods often happen because of heavy rain or melting snow, which make rivers rise and overflow onto the land.`,explanationThai:`น้ำท่วมมักเกิดจากฝนตกหนักหรือหิมะละลาย ซึ่งทำให้แม่น้ำสูงขึ้นและล้นเข้าท่วมพื้นที่`,hint1:`Think about where extra water comes from.`,hint2:`It is not about sunshine.`,example:`Big waves and storms can also cause flooding near the coast.`,points:10,feedbackCorrect:`Correct — heavy rain or melting snow can cause floods.`,feedbackIncorrect:`Think about what brings extra water to rivers.`},{id:`pt-37`,type:`fill-blank`,skill:`flood-knowledge`,topic:`Cause and Effect`,difficulty:`medium`,prompt:`Complete the sentence with the correct linking word.`,before:`It rained for three days,`,after:`the river overflowed and flooded the village.`,answers:[`so`],explanation:`'So' connects a cause (three days of rain) with its effect (the river overflowed). We use 'so' to show a result.`,explanationThai:`'So' ใช้เชื่อมสาเหตุ (ฝนตกสามวัน) กับผล (แม่น้ำล้น) เราใช้ 'so' เพื่อแสดงผลลัพธ์`,hint1:`This word shows a result, not a reason.`,hint2:`It is a short, common linking word.`,example:`The river overflowed because it rained for three days.`,points:12,feedbackCorrect:`Correct — 'so' links the cause to its result.`,feedbackIncorrect:`Which linking word shows a result — 'so' or 'because'?`},{id:`pt-38`,type:`true-false`,skill:`flood-knowledge`,topic:`Flood Effects`,difficulty:`medium`,prompt:`Read the statement and decide if it is true or false.`,statement:`When a flood happens, people sometimes need to evacuate to higher ground to stay safe.`,correctAnswer:!0,explanation:`This is true. During a flood, people often need to evacuate — leave their homes — and move to higher ground where the water cannot reach them.`,explanationThai:`ถูกต้อง ในช่วงน้ำท่วม ผู้คนมักต้องอพยพออกจากบ้านไปยังที่สูงเพื่อความปลอดภัย`,hint1:`Think about what people do to stay safe from rising water.`,hint2:`Moving to higher ground keeps people away from the water.`,example:`The family in 'Danger on the Coast' drove to higher ground to stay safe.`,points:10,feedbackCorrect:`Correct — evacuating to higher ground keeps people safe.`,feedbackIncorrect:`Think about what people should do when water levels rise.`},{id:`pt-39`,type:`mcq`,skill:`phonics`,topic:`/aɪ/ Sound`,difficulty:`easy`,prompt:`Which word has the same /aɪ/ sound as in 'bike'?`,options:[`night`,`cat`,`dog`,`sun`],correctIndex:0,explanation:`'Night' has the /aɪ/ sound, spelled with 'igh'. It sounds like the 'i' in 'bike', even though the spelling is different.`,explanationThai:`'Night' มีเสียง /aɪ/ สะกดด้วย 'igh' ซึ่งออกเสียงเหมือน 'i' ใน 'bike' แม้การสะกดจะต่างกัน`,hint1:`Say each word out loud and listen for the long i sound.`,hint2:`The other words have short vowel sounds.`,example:`'light' and 'fire' also have the /aɪ/ sound.`,points:10,feedbackCorrect:`Correct — 'night' has the /aɪ/ sound.`,feedbackIncorrect:`Say each word aloud — which one sounds like 'bike'?`},{id:`pt-40`,type:`sort`,skill:`phonics`,topic:`/aɪ/ Spelling Patterns`,difficulty:`challenge`,prompt:`Sort these /aɪ/ words by their spelling pattern.`,categories:[{id:`i_e`,label:`i_e (like bike)`},{id:`igh`,label:`igh (like night)`}],items:[{id:`w1`,label:`five`,categoryId:`i_e`},{id:`w2`,label:`time`,categoryId:`i_e`},{id:`w3`,label:`light`,categoryId:`igh`},{id:`w4`,label:`high`,categoryId:`igh`},{id:`w5`,label:`fire`,categoryId:`i_e`}],explanation:`The /aɪ/ sound can be spelled different ways: 'i_e' as in 'five', 'time', and 'fire', or 'igh' as in 'light' and 'high'.`,explanationThai:`เสียง /aɪ/ สามารถสะกดได้หลายแบบ: 'i_e' เช่น 'five', 'time', 'fire' หรือ 'igh' เช่น 'light', 'high'`,hint1:`Look at the letters after the 'i' in each word.`,hint2:`Words with a silent 'e' at the end usually use the i_e pattern.`,example:`'child' also has the /aɪ/ sound, spelled with just 'i'.`,points:16,feedbackCorrect:`All sorted correctly — great phonics work!`,feedbackIncorrect:`Look at how each word is spelled and try again.`}],Ji=`Yesterday afternoon, ten-year-old Ploy was walking home from school when she smelled smoke. She looked up and saw dark smoke coming from a small shop on the corner. Ploy ran to a nearby phone box and called the emergency number. She told the operator the address and stayed calm. Two fire engines arrived five minutes later, and firefighters rushed inside with hoses. A firefighter named Somchai carried an old man safely out of the shop. Everyone was safe, and the shopkeeper thanked Ploy for her quick thinking.`,Yi=`Last month, heavy rain fell for three days near the small coastal town of Bluewater Bay. The river next to the town began to rise quickly, and water flowed over the riverbank. Local police used loudspeakers to warn people about the flood. Many families packed their bags and moved to the community hall on higher ground. By the next morning, water covered the main road and several shops. Rescue workers used small boats to check that no one was trapped inside their homes. Two days later, the flood water went down, and people slowly returned to clean their houses.`,Xi=[{id:`mt-01`,type:`mcq`,skill:`vocabulary`,topic:`Emergency Verbs`,difficulty:`easy`,prompt:`Which word means 'to leave a dangerous place and go somewhere safe'?`,options:[`evacuate`,`rescue`,`arrive`,`remain`],correctIndex:0,explanation:`'Evacuate' means to leave a dangerous place quickly and go somewhere safe, like leaving a flooded house for higher ground.`,explanationThai:`'Evacuate' หมายถึงการออกจากสถานที่อันตรายอย่างรวดเร็วไปยังที่ปลอดภัย เช่น ออกจากบ้านที่น้ำท่วมไปยังที่สูง`,hint1:`This word is often used as an instruction during a flood or fire.`,hint2:`It is the opposite of staying where you are.`,example:`'Rescue' means to save someone who is in danger.`,points:10,feedbackCorrect:`Correct! 'Evacuate' means to leave a dangerous place for safety.`,feedbackIncorrect:`Not quite — think about what people do to stay safe during a flood.`},{id:`mt-02`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Which word means 'an official message telling people that a flood may happen soon'?`,options:[`flood warning`,`weather forecast`,`rescue team`,`emergency call`],correctIndex:0,explanation:`A 'flood warning' is an official message that tells people a flood is likely, so they can prepare or leave the area.`,explanationThai:`'คำเตือนน้ำท่วม' คือข้อความแจ้งเตือนอย่างเป็นทางการว่าอาจเกิดน้ำท่วม เพื่อให้ผู้คนเตรียมตัวหรือย้ายออก`,hint1:`This is a message, not a group of people.`,hint2:`It usually comes before the flood happens, not after.`,example:`A weather forecast tells you if it will rain, but it is not always about danger.`,points:10,feedbackCorrect:`Yes — a flood warning tells people danger may be coming.`,feedbackIncorrect:`Think about which option is a warning message, not a team of people.`},{id:`mt-03`,type:`fill-blank`,skill:`vocabulary`,topic:`Emergency Sentences`,difficulty:`easy`,prompt:`Complete the sentence with the correct word.`,before:`When the fire alarm rang, the teacher told everyone to`,after:`the building calmly.`,answers:[`evacuate`,`leave`],explanation:`'Evacuate' (or 'leave') means to go out of a dangerous place — the correct action when a fire alarm rings.`,explanationThai:`'ออกจาก/อพยพ' หมายถึงการออกจากสถานที่อันตราย ซึ่งเป็นสิ่งที่ถูกต้องเมื่อสัญญาณเตือนไฟไหม้ดัง`,hint1:`Think about what you should do when an alarm warns of danger.`,hint2:`It starts with the letter E, or you could also say 'leave'.`,example:`The firefighters told everyone to evacuate the shop.`,points:10,feedbackCorrect:`Correct — that is exactly what people should do.`,feedbackIncorrect:`Think about the safe action to take when an alarm sounds.`},{id:`mt-04`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`medium`,prompt:`Which word means 'the land at the edge of a river'?`,options:[`riverbank`,`coastline`,`drain`,`high ground`],correctIndex:0,explanation:`The 'riverbank' is the land along the side of a river. When a river rises, water can flow over the riverbank.`,explanationThai:`'ริมฝั่งแม่น้ำ' คือพื้นดินข้างแม่น้ำ เมื่อน้ำในแม่น้ำสูงขึ้น น้ำอาจไหลข้ามริมฝั่งแม่น้ำ`,hint1:`This word is about a river, not the sea.`,hint2:`A drain is a pipe or channel, not a piece of land.`,example:`'Coastline' is the land along the edge of the sea.`,points:12,feedbackCorrect:`Correct — a riverbank is the land beside a river.`,feedbackIncorrect:`Think about which word describes land next to a river, not the sea or a pipe.`},{id:`mt-05`,type:`match`,skill:`vocabulary`,topic:`Flood Words & Meanings`,difficulty:`medium`,prompt:`Match each flood word to its meaning.`,left:[{id:`w1`,label:`sandbags`},{id:`w2`,label:`drain`},{id:`w3`,label:`high ground`},{id:`w4`,label:`flash flood`}],right:[{id:`m1`,label:`bags filled with sand, used to block flood water`},{id:`m2`,label:`a pipe or channel that carries water away`},{id:`m3`,label:`land that is higher than the area around it`},{id:`m4`,label:`a flood that happens very suddenly`}],pairs:{w1:`m1`,w2:`m2`,w3:`m3`,w4:`m4`},explanation:`Sandbags block water, a drain carries water away, high ground is safe from rising water, and a flash flood happens with little warning.`,explanationThai:`กระสอบทรายใช้กั้นน้ำ ท่อระบายน้ำระบายน้ำออกไป ที่สูงปลอดภัยจากน้ำท่วม และน้ำท่วมฉับพลันเกิดขึ้นอย่างรวดเร็ว`,hint1:`Think about which words describe things people use to stop water, and which describe types of land or events.`,hint2:`'Flash' often means 'sudden' in English.`,example:`'Riverbank' means the land beside a river.`,points:15,feedbackCorrect:`All matched correctly!`,feedbackIncorrect:`A few pairs are wrong — read each meaning again carefully.`},{id:`mt-06`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`challenge`,prompt:`Which sentence uses the word 'flash flood' correctly?`,options:[`A flash flood happened suddenly after just one hour of very heavy rain.`,`A flash flood is a type of vehicle that carries hurt people to hospital.`,`A flash flood is a person who checks the weather every day.`,`A flash flood is a warning sign found on the side of the road.`],correctIndex:0,explanation:`A flash flood is a flood that happens very quickly and with little warning, often after sudden, heavy rain.`,explanationThai:`น้ำท่วมฉับพลันคือน้ำท่วมที่เกิดขึ้นอย่างรวดเร็วและมีการเตือนล่วงหน้าน้อย มักเกิดหลังฝนตกหนักกะทันหัน`,hint1:`This is not a vehicle, a person, or a sign.`,hint2:`The key idea is speed — it happens fast.`,example:`A flood warning is a message that tells people a flood may happen.`,points:14,feedbackCorrect:`Correct — a flash flood happens quickly, often with little warning.`,feedbackIncorrect:`Three of the sentences describe the wrong kind of thing — look for the one about speed.`},{id:`mt-07`,type:`mcq`,skill:`vocabulary`,topic:`Emergency Equipment`,difficulty:`easy`,prompt:`Which word means 'equipment worn to help a person float in water'?`,options:[`life jacket`,`fire extinguisher`,`stretcher`,`sandbag`],correctIndex:0,explanation:`A life jacket is worn on the body and helps a person float, which is important during a flood or at sea.`,explanationThai:`เสื้อชูชีพสวมใส่บนร่างกายเพื่อช่วยให้ลอยน้ำได้ ซึ่งสำคัญมากเมื่อเกิดน้ำท่วมหรืออยู่ในทะเล`,hint1:`You wear this piece of equipment, like a vest.`,hint2:`It is not used to put out fires.`,example:`A fire extinguisher is used to stop small fires, not to help people float.`,points:8,feedbackCorrect:`Correct — a life jacket helps people float in water.`,feedbackIncorrect:`Think about which item you wear on your body near water.`},{id:`mt-08`,type:`fill-blank`,skill:`vocabulary`,topic:`Flood Sentences`,difficulty:`medium`,prompt:`Complete the sentence with the correct word.`,before:`People placed`,after:`in front of their doors to stop the flood water from coming inside.`,answers:[`sandbags`,`sand bags`],explanation:`Sandbags are placed to block flood water from entering houses and shops.`,explanationThai:`กระสอบทรายถูกนำมาวางเพื่อกั้นไม่ให้น้ำท่วมไหลเข้าบ้านหรือร้านค้า`,hint1:`This item is a bag filled with something heavy.`,hint2:`The word 'sand' is part of the answer.`,example:`The drain carried the rainwater away from the road.`,points:10,feedbackCorrect:`Correct — 'sandbags' is right.`,feedbackIncorrect:`Think about what people stack in front of doors during a flood.`},{id:`mt-09`,type:`true-false`,skill:`vocabulary`,topic:`Emergency Workers`,difficulty:`medium`,prompt:`Decide if the statement is true or false.`,statement:`A paramedic's main job is to put out fires.`,correctAnswer:!1,explanation:`A paramedic's main job is to give medical help to sick or hurt people, not to put out fires — that is a firefighter's job.`,explanationThai:`หน้าที่หลักของเจ้าหน้าที่พยาบาลฉุกเฉินคือการช่วยเหลือทางการแพทย์ ไม่ใช่การดับไฟ ซึ่งเป็นหน้าที่ของนักดับเพลิง`,hint1:`Think about who drives the ambulance and who drives the fire engine.`,hint2:`'Medic' is part of the word 'paramedic' — that is a clue about medicine.`,example:`A firefighter's main job is to put out fires and rescue people.`,points:10,feedbackCorrect:`Correct — that statement is false; a paramedic gives medical help.`,feedbackIncorrect:`Look again — think about which worker actually fights fires.`},{id:`mt-10`,type:`mcq`,skill:`vocabulary`,topic:`Flood Vocabulary`,difficulty:`challenge`,prompt:`Which word means 'a pipe or channel that carries rainwater away from streets and buildings'?`,options:[`drain`,`riverbank`,`sandbag`,`embankment`],correctIndex:0,explanation:`A 'drain' is a pipe or channel built to carry water away, so streets do not flood as easily.`,explanationThai:`'ท่อระบายน้ำ' คือท่อหรือช่องทางที่สร้างขึ้นเพื่อระบายน้ำออกไป ช่วยไม่ให้ถนนน้ำท่วมง่าย`,hint1:`This is something built under or beside streets.`,hint2:`It is not a piece of land, and it is not a bag.`,example:`A riverbank is the land beside a river.`,points:14,feedbackCorrect:`Correct — a drain carries water away.`,feedbackIncorrect:`Think about the object built to carry rainwater away from the street.`}],Zi=[{id:`mt-11`,type:`mcq`,skill:`grammar`,topic:`Past Continuous Affirmative`,difficulty:`easy`,prompt:`Choose the correct sentence. What was Nam doing when the phone rang?`,options:[`She was reading a book.`,`She were reading a book.`,`She is reading a book.`,`She reading a book.`],correctIndex:0,explanation:`With 'she' (singular), we use 'was' + verb-ing to form the past continuous: 'She was reading a book.'`,explanationThai:`กับประธานเอกพจน์อย่าง 'she' เราใช้ 'was' + verb-ing เช่น 'She was reading a book.'`,hint1:`'She' is one person, so it needs a singular form of 'be'.`,hint2:`The verb needs '-ing' as well as 'was'.`,example:`He was watching TV when the lights went out.`,points:8,feedbackCorrect:`Correct — 'was' matches the singular subject 'she'.`,feedbackIncorrect:`Look at the subject 'she' — which form of 'be' matches it?`},{id:`mt-12`,type:`mcq`,skill:`grammar`,topic:`Past Continuous Affirmative`,difficulty:`medium`,prompt:`Choose the correct sentence.`,options:[`They was playing football when the storm started.`,`They were playing football when the storm started.`,`They are playing football when the storm started.`,`They playing football when the storm started.`],correctIndex:1,explanation:`'They' is plural, so it takes 'were' + verb-ing: 'They were playing football...'`,explanationThai:`'They' เป็นพหูพจน์ ต้องใช้ 'were' + verb-ing เช่น 'They were playing football...'`,hint1:`'They' means more than one person.`,hint2:`Plural subjects use 'were', not 'was'.`,example:`We were walking home when it started to rain.`,points:10,feedbackCorrect:`Correct — plural subjects use 'were'.`,feedbackIncorrect:`'They' is plural — which form of 'be' goes with plural subjects?`},{id:`mt-13`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous Affirmative`,difficulty:`medium`,prompt:`Complete the sentence with the past continuous form of 'walk'.`,before:`I`,after:`to school when I saw the accident.`,answers:[`was walking`],explanation:`'I' takes 'was', and 'walk' becomes 'walking' — so the answer is 'was walking'.`,explanationThai:`'I' ใช้กับ 'was' และ 'walk' เปลี่ยนเป็น 'walking' คำตอบคือ 'was walking'`,hint1:`Think of 'was' + the '-ing' form of 'walk'.`,hint2:`The subject is 'I', which is singular.`,example:`He was cooking dinner when the smoke alarm rang.`,points:10,feedbackCorrect:`Correct — 'was walking' is right.`,feedbackIncorrect:`Remember: 'I' + 'was' + the '-ing' form of the verb.`},{id:`mt-14`,type:`fill-blank`,skill:`grammar`,topic:`Past Continuous Negative`,difficulty:`medium`,prompt:`Complete the sentence with the past continuous negative form of 'sleep' for 'they'.`,before:`They`,after:`when the phone rang — they were watching a movie.`,answers:[`weren't sleeping`,`were not sleeping`],explanation:`The negative past continuous for 'they' is 'weren't' (were not) + verb-ing: 'weren't sleeping'.`,explanationThai:`รูปปฏิเสธของ past continuous สำหรับ 'they' คือ 'weren't' (were not) + verb-ing: 'weren't sleeping'`,hint1:`Start with 'were not' or its short form.`,hint2:`Add '-ing' to 'sleep'.`,example:`She wasn't watching TV when the storm began — she was asleep.`,points:12,feedbackCorrect:`Correct — 'weren't sleeping' is right.`,feedbackIncorrect:`Remember the negative form: were + not + verb-ing.`},{id:`mt-15`,type:`error-correction`,skill:`grammar`,topic:`-ing Spelling`,difficulty:`medium`,prompt:`Find and correct the spelling mistake in this sentence.`,sentence:`She was runing to the bus stop when it started to rain.`,wrongWord:`runing`,correctWord:`running`,explanation:`'Run' ends in one vowel + one consonant, so we double the final consonant before adding '-ing': running.`,explanationThai:`'Run' ลงท้ายด้วยสระหนึ่งตัวและพยัญชนะหนึ่งตัว จึงต้องเพิ่มพยัญชนะตัวสุดท้ายซ้ำก่อนเติม -ing: running`,hint1:`Count the letters at the end of 'run' before adding '-ing'.`,hint2:`Compare it to 'stop' → 'stopping'.`,example:`'Swim' becomes 'swimming', not 'swiming'.`,points:12,feedbackCorrect:`Correct — 'running' has a doubled 'n'.`,feedbackIncorrect:`Look closely at the spelling of the '-ing' word — is a letter missing?`},{id:`mt-16`,type:`error-correction`,skill:`grammar`,topic:`Past Continuous Agreement`,difficulty:`medium`,prompt:`Find and correct the grammar mistake in this sentence.`,sentence:`The children was swimming in the river when the flood warning came.`,wrongWord:`was`,correctWord:`were`,explanation:`'The children' is a plural subject, so it needs 'were', not 'was'.`,explanationThai:`'The children' เป็นประธานพหูพจน์ ต้องใช้ 'were' ไม่ใช่ 'was'`,hint1:`'Children' is the plural form of 'child'.`,hint2:`Plural subjects need 'were'.`,example:`The boys were playing outside when the rain started.`,points:12,feedbackCorrect:`Correct — 'were' matches the plural subject.`,feedbackIncorrect:`Check the subject — is it singular or plural?`},{id:`mt-17`,type:`mcq`,skill:`grammar`,topic:`Yes/No Questions`,difficulty:`easy`,prompt:`Choose the correct question.`,options:[`Was he watching TV when the storm began?`,`Were he watching TV when the storm began?`,`Did he watching TV when the storm began?`,`Is he watching TV when the storm began?`],correctIndex:0,explanation:`'He' is singular, so the past continuous question begins with 'Was': 'Was he watching TV...?'`,explanationThai:`'He' เป็นเอกพจน์ คำถาม past continuous จึงเริ่มด้วย 'Was': 'Was he watching TV...?'`,hint1:`'He' is one person.`,hint2:`Singular subjects use 'Was' to start a question.`,example:`Were you sleeping when I called?`,points:8,feedbackCorrect:`Correct — 'Was' matches the singular subject 'he'.`,feedbackIncorrect:`Think about which form of 'be' matches 'he'.`},{id:`mt-18`,type:`mcq`,skill:`grammar`,topic:`Yes/No Questions`,difficulty:`medium`,prompt:`Choose the correct question.`,options:[`Was they playing outside when it started to rain?`,`Were they playing outside when it started to rain?`,`Did they playing outside when it started to rain?`,`Are they playing outside when it started to rain?`],correctIndex:1,explanation:`'They' is plural, so the question begins with 'Were': 'Were they playing outside...?'`,explanationThai:`'They' เป็นพหูพจน์ คำถามจึงเริ่มด้วย 'Were': 'Were they playing outside...?'`,hint1:`'They' means more than one person.`,hint2:`Plural subjects use 'Were' at the start of a question.`,example:`Was she reading when the lights went out?`,points:10,feedbackCorrect:`Correct — 'Were' goes with the plural subject 'they'.`,feedbackIncorrect:`Check the subject again — singular or plural?`},{id:`mt-19`,type:`fill-blank`,skill:`grammar`,topic:`Wh-Questions`,difficulty:`medium`,prompt:`Complete the question with the correct word.`,before:`What`,after:`you doing when the alarm rang?`,answers:[`were`],explanation:`The subject 'you' takes 'were' in past continuous questions: 'What were you doing...?'`,explanationThai:`ประธาน 'you' ใช้กับ 'were' ในประโยคคำถาม past continuous: 'What were you doing...?'`,hint1:`'You' always uses the plural form of 'be', even for one person.`,hint2:`It is not 'was'.`,example:`What was he doing when the fire started?`,points:10,feedbackCorrect:`Correct — 'were' is right.`,feedbackIncorrect:`Remember: 'you' always takes 'were', not 'was'.`},{id:`mt-20`,type:`mcq`,skill:`grammar`,topic:`Short Answers`,difficulty:`medium`,prompt:`Was she cooking dinner when the fire started? Choose the correct short answer.`,options:[`Yes, she was.`,`Yes, she is.`,`Yes, she does.`,`Yes, she did.`],correctIndex:0,explanation:`Short answers repeat the verb used in the question — since the question used 'Was', the answer is 'Yes, she was.'`,explanationThai:`คำตอบสั้นใช้กริยาตัวเดียวกับคำถาม เมื่อคำถามใช้ 'Was' คำตอบคือ 'Yes, she was.'`,hint1:`Look at the verb used at the start of the question.`,hint2:`Match the tense — do not switch to present or simple past.`,example:`Were they sleeping? Yes, they were.`,points:10,feedbackCorrect:`Correct — short answers match the question's verb.`,feedbackIncorrect:`Look at the question again — which form of 'be' did it use?`},{id:`mt-21`,type:`true-false`,skill:`grammar`,topic:`Past Continuous Forms`,difficulty:`easy`,prompt:`Decide if the statement is true or false.`,statement:`We use 'was' with the pronouns 'he', 'she', and 'it' in the past continuous tense.`,correctAnswer:!0,explanation:`'Was' is used with singular subjects like 'he', 'she', and 'it'. 'Were' is used with plural subjects and 'you'.`,explanationThai:`'Was' ใช้กับประธานเอกพจน์ เช่น 'he', 'she', 'it' ส่วน 'were' ใช้กับประธานพหูพจน์และ 'you'`,hint1:`Think about singular versus plural subjects.`,hint2:`'You' is an exception — it always uses 'were'.`,example:`It was raining heavily all afternoon.`,points:8,feedbackCorrect:`Correct — that statement is true.`,feedbackIncorrect:`Think again about which subjects use 'was' in the past continuous.`},{id:`mt-22`,type:`true-false`,skill:`grammar`,topic:`Past Continuous Agreement`,difficulty:`medium`,prompt:`Decide if the statement is true or false.`,statement:`The sentence 'They was watching a movie when the lights went out' is grammatically correct.`,correctAnswer:!1,explanation:`This sentence is incorrect because 'they' is plural and needs 'were', not 'was'. The correct sentence is 'They were watching a movie...'`,explanationThai:`ประโยคนี้ผิดเพราะ 'they' เป็นพหูพจน์ ต้องใช้ 'were' ไม่ใช่ 'was' ประโยคที่ถูกต้องคือ 'They were watching a movie...'`,hint1:`Check whether the subject and the form of 'be' agree.`,hint2:`'They' is always plural.`,example:`'He was watching a movie' is correct because 'he' is singular.`,points:10,feedbackCorrect:`Correct — that sentence has a grammar mistake.`,feedbackIncorrect:`Look closely at the subject 'they' and the verb form used with it.`},{id:`mt-23`,type:`mcq`,skill:`grammar`,topic:`-ing Spelling`,difficulty:`challenge`,prompt:`What is the correct '-ing' form of 'stop'?`,options:[`stoping`,`stopping`,`stopeing`,`stoppeing`],correctIndex:1,explanation:`'Stop' ends in a single vowel + single consonant, so we double the final consonant before adding '-ing': stopping.`,explanationThai:`'Stop' ลงท้ายด้วยสระตัวเดียวและพยัญชนะตัวเดียว จึงต้องเพิ่มพยัญชนะตัวสุดท้ายซ้ำก่อนเติม -ing: stopping`,hint1:`Compare this word to 'run' → 'running'.`,hint2:`Count the vowels and consonants at the end of 'stop'.`,example:`'Swim' becomes 'swimming' for the same spelling reason.`,points:14,feedbackCorrect:`Correct — 'stopping' has a doubled 'p'.`,feedbackIncorrect:`Think about the doubling rule for short words ending in one vowel and one consonant.`},{id:`mt-24`,type:`mcq`,skill:`grammar`,topic:`When-Clauses`,difficulty:`challenge`,prompt:`Choose the sentence that correctly combines past continuous and past simple.`,options:[`I was watching TV when the power went out.`,`I watched TV when the power was going out.`,`I am watching TV when the power went out.`,`I was watch TV when the power went out.`],correctIndex:0,explanation:`The longer background action uses past continuous ('was watching'), and the shorter interrupting action uses past simple ('went out').`,explanationThai:`การกระทำที่ต่อเนื่องยาวนานใช้ past continuous ('was watching') ส่วนการกระทำสั้นๆ ที่มาขัดจังหวะใช้ past simple ('went out')`,hint1:`The action already happening in the background should be the -ing action.`,hint2:`The sudden, short action should be in past simple, not continuous.`,example:`She was sleeping when the phone rang.`,points:16,feedbackCorrect:`Correct — this sentence uses both tenses correctly.`,feedbackIncorrect:`Think about which action was already happening, and which one interrupted it.`},{id:`mt-25`,type:`fill-blank`,skill:`grammar`,topic:`When-Clauses`,difficulty:`medium`,prompt:`Complete the sentence with the past continuous form of 'fall'.`,before:`The rain`,after:`heavily when we left the house.`,answers:[`was falling`],explanation:`'The rain' is singular, so it takes 'was' + verb-ing: 'was falling'.`,explanationThai:`'The rain' เป็นเอกพจน์ ใช้ 'was' + verb-ing: 'was falling'`,hint1:`The subject 'the rain' is treated as singular.`,hint2:`Add '-ing' to 'fall'.`,example:`The wind was blowing hard when we arrived.`,points:12,feedbackCorrect:`Correct — 'was falling' is right.`,feedbackIncorrect:`Remember: 'the rain' is singular, so use 'was' + verb-ing.`}],Qi=[{id:`mt-26`,type:`word-order`,skill:`grammar`,topic:`Sentence Building — Past Continuous`,difficulty:`easy`,prompt:`Put the words in the correct order to make a sentence.`,words:[`I`,`was`,`walking`,`home`,`when`,`it`,`started`,`to`,`rain`],correctOrder:[`I`,`was`,`walking`,`home`,`when`,`it`,`started`,`to`,`rain`],explanation:`The sentence is: 'I was walking home when it started to rain.' The background action (was walking) comes before the interrupting action (started).`,explanationThai:`ประโยคคือ 'I was walking home when it started to rain.' การกระทำที่กำลังดำเนินอยู่ (was walking) มาก่อนเหตุการณ์ที่ขัดจังหวะ (started)`,hint1:`Start with the subject 'I'.`,hint2:`The word 'when' introduces the second, shorter action.`,example:`She was reading a book when the phone rang.`,points:10,feedbackCorrect:`Correct — that is the right order!`,feedbackIncorrect:`Try again — remember the subject comes first, then 'was' + verb-ing.`},{id:`mt-27`,type:`word-order`,skill:`grammar`,topic:`Sentence Building — Past Continuous`,difficulty:`medium`,prompt:`Put the words in the correct order to make a sentence.`,words:[`She`,`was`,`cooking`,`dinner`,`when`,`the`,`smoke`,`alarm`,`rang`],correctOrder:[`She`,`was`,`cooking`,`dinner`,`when`,`the`,`smoke`,`alarm`,`rang`],explanation:`The sentence is: 'She was cooking dinner when the smoke alarm rang.'`,explanationThai:`ประโยคคือ 'She was cooking dinner when the smoke alarm rang.'`,hint1:`The subject 'She' comes first, followed by 'was' + verb-ing.`,hint2:`'The smoke alarm' is the thing that rang — it comes after 'when'.`,example:`He was driving to work when the accident happened.`,points:12,feedbackCorrect:`Correct — well done!`,feedbackIncorrect:`Look again at where 'when' should go in the sentence.`},{id:`mt-28`,type:`word-order`,skill:`grammar`,topic:`Sentence Building — Emergency Instructions`,difficulty:`medium`,prompt:`Put the words in the correct order to make a sentence.`,words:[`Call`,`emergency`,`services`,`if`,`you`,`see`,`a`,`fire`],correctOrder:[`Call`,`emergency`,`services`,`if`,`you`,`see`,`a`,`fire`],explanation:`The sentence is: 'Call emergency services if you see a fire.' This is an instruction, so it starts with the verb 'Call'.`,explanationThai:`ประโยคคือ 'Call emergency services if you see a fire.' เป็นประโยคคำสั่ง จึงเริ่มด้วยคำกริยา 'Call'`,hint1:`This is an instruction, so it begins with a command verb.`,hint2:`'If' introduces the condition — what you might see.`,example:`Stay calm if there is an emergency.`,points:12,feedbackCorrect:`Correct — that is the right order!`,feedbackIncorrect:`Remember, instructions usually start with the action word.`},{id:`mt-29`,type:`word-order`,skill:`grammar`,topic:`Sentence Building — Past Continuous Negative`,difficulty:`challenge`,prompt:`Put the words in the correct order to make a sentence.`,words:[`They`,`weren't`,`sleeping`,`when`,`the`,`flood`,`started`],correctOrder:[`They`,`weren't`,`sleeping`,`when`,`the`,`flood`,`started`],explanation:`The sentence is: 'They weren't sleeping when the flood started.'`,explanationThai:`ประโยคคือ 'They weren't sleeping when the flood started.'`,hint1:`The negative form 'weren't' comes right after the subject.`,hint2:`'The flood' is the subject of the second part of the sentence.`,example:`He wasn't watching TV when the lights went out.`,points:14,feedbackCorrect:`Correct — great work with the negative form!`,feedbackIncorrect:`Check where the negative word 'weren't' belongs in the sentence.`},{id:`mt-30`,type:`word-order`,skill:`grammar`,topic:`Sentence Building — Wh-Questions`,difficulty:`challenge`,prompt:`Put the words in the correct order to make a question.`,words:[`What`,`were`,`you`,`doing`,`when`,`the`,`storm`,`began`],correctOrder:[`What`,`were`,`you`,`doing`,`when`,`the`,`storm`,`began`],explanation:`The question is: 'What were you doing when the storm began?' Wh-questions start with the question word, then the verb 'be'.`,explanationThai:`ประโยคคำถามคือ 'What were you doing when the storm began?' คำถามที่ขึ้นต้นด้วย wh- จะตามด้วยกริยา be ก่อนประธาน`,hint1:`Question words like 'What' always come first.`,hint2:`After the question word, put 'were' before 'you'.`,example:`Where were they going when it started to rain?`,points:14,feedbackCorrect:`Correct — that is the right question order!`,feedbackIncorrect:`Remember: question word, then 'were', then the subject.`}],$i=[{id:`mt-31`,type:`mcq`,skill:`dialogue`,topic:`Emergency Call — Best Response`,difficulty:`easy`,prompt:`A caller says, "Help! There's a fire in my kitchen!" The operator asks, "What is your address?" What should the caller do next?`,options:[`Give the exact address clearly.`,`Hang up the phone immediately.`,`Say nothing and wait.`,`Ask the operator's name.`],correctIndex:0,explanation:`The caller should answer the operator's question clearly and give the exact address so help can be sent to the right place.`,explanationThai:`ผู้โทรควรตอบคำถามของเจ้าหน้าที่อย่างชัดเจนและบอกที่อยู่ที่ถูกต้อง เพื่อให้ความช่วยเหลือไปถึงสถานที่ที่ถูกต้อง`,hint1:`Think about why the operator is asking this question.`,hint2:`Hanging up would stop help from arriving.`,example:`If the operator asks 'What is your emergency?', the caller should describe what is happening.`,points:10,feedbackCorrect:`Correct — giving a clear address helps emergency services arrive quickly.`,feedbackIncorrect:`Think about what the operator needs to send help to the right place.`},{id:`mt-32`,type:`mcq`,skill:`dialogue`,topic:`Emergency Call — Missing Line`,difficulty:`medium`,prompt:`Read the phone call and choose the best missing line.
