<title>Police Sketch Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a police station desk. Pinned WANTED poster on the left, police report + sketch tools on the right; home screen is a case board. */
:root{
  --bg:#E8EDF0; --surface:#FFFFFF; --surface-2:#F2F5F7; --ink:#1C2730; --muted:#55646F; --line:#C8D2D8;
  --accent:#D9621B; --on-accent:#FFFFFF; --accent-soft:#FCE4D2; --accent-ink:#A44410;
  --ok:#21805E; --ok-soft:#D9F0E5; --bad:#B8392A; --bad-soft:#F8DFD8; --warn-soft:#FFF1C9; --warn:#9A6A00;
  --poster:#F0E0BC; --poster-edge:#CDB485; --poster-ink:#46301C; --stamp:#C0332B;
  --font-display:"Rye", Georgia, serif;
  --font-body:"Lexend", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232A; --surface-2:#222C34; --ink:#E5EBEE; --muted:#9BA9B3; --line:#34424C;
  --accent:#F0874A; --on-accent:#1B0F06; --accent-soft:#3B2617; --accent-ink:#F7A672;
  --ok:#5CC49E; --ok-soft:#163A2E; --bad:#F27D69; --bad-soft:#3E1D18; --warn-soft:#3A3014; --warn:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232A; --surface-2:#222C34; --ink:#E5EBEE; --muted:#9BA9B3; --line:#34424C;
  --accent:#F0874A; --on-accent:#1B0F06; --accent-soft:#3B2617; --accent-ink:#F7A672;
  --ok:#5CC49E; --ok-soft:#163A2E; --bad:#F27D69; --bad-soft:#3E1D18; --warn-soft:#3A3014; --warn:#F2C14E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.logo{background:#fff;border-radius:10px;padding:5px 9px;display:flex;border:1px solid var(--line)}
.logo img{height:40px;width:auto;display:block}
.brand{flex:1 1 200px;min-width:0;font-weight:700;font-size:1.15rem;line-height:1.2}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.hbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:600;min-height:40px}
.hbtn[aria-pressed="false"]{color:var(--muted)}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.label{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 18px;font-weight:600;min-height:46px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{font-size:1.15rem;padding:12px 26px;min-height:54px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* poster */
.poster{background:var(--poster);border:1px solid var(--poster-edge);border-radius:4px;padding:14px 14px 10px;
  box-shadow:0 1px 0 var(--poster-edge),0 12px 26px -14px rgba(40,25,10,.6);position:relative;color:var(--poster-ink)}
.poster::before,.poster::after{content:"";position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.poster::before{left:18px}.poster::after{right:18px}
.poster h2{font-family:var(--font-display);font-weight:400;text-align:center;margin:0;font-size:clamp(1.9rem,5vw,2.7rem);letter-spacing:.06em;line-height:1}
.poster .frame{position:relative;margin-top:8px}
.poster .face{display:block;width:100%;height:auto;aspect-ratio:300/320;max-width:100%;background:#E7D3A6;border:2px solid var(--poster-ink)}
.poster .cap{font-family:var(--font-display);text-align:center;font-size:1rem;letter-spacing:.08em;margin-top:6px}
.poster.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.stamp{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--font-display);font-size:clamp(2rem,6vw,3.2rem);
  color:var(--stamp);border:5px solid var(--stamp);border-radius:10px;padding:2px 16px;letter-spacing:.06em;background:rgba(240,224,188,.55);
  animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none;white-space:nowrap}
.stamp.grey{color:#5C5A55;border-color:#5C5A55}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}

/* home */
.hero{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:32px;align-items:center}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,6vw,4rem);line-height:1.02;margin:0 0 10px;letter-spacing:.01em}
.hero h1 span{color:var(--accent)}
.hero .lead{font-size:1.2rem;max-width:44ch;margin:0 0 14px}
.hero .bq{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.95rem}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.mode.main{border:2px solid var(--accent)}
.mode .num{font-family:var(--font-display);font-size:2.2rem;color:var(--accent);line-height:1;width:1.3em;text-align:center}
.mode h3{margin:0;font-size:1.25rem}
.mode p{margin:2px 0 0;color:var(--muted)}
.levels{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.lvl{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;text-align:left;min-height:46px;flex:1 1 170px}
.lvl b{display:block}
.lvl span{font-size:.85rem;color:var(--muted)}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.vocab{display:flex;flex-wrap:wrap;gap:8px}
.vchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;min-height:40px}
.vchip:hover{border-color:var(--accent)}
.meaning{margin:10px 0 0;font-size:1.1rem;min-height:1.6em}
.meaning b{color:var(--accent-ink)}
.tip{color:var(--muted);font-size:.95rem;margin:0}

/* game layout */
.work{display:grid;grid-template-columns:minmax(260px,390px) minmax(0,1fr);gap:24px;align-items:start}
.poster-col{position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .title{font-weight:700;font-size:1.1rem}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.stars{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.stars .s{color:#E2A10E}
.tag{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--line)}

/* report */
.report-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative}
.report-card .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.report{font-size:clamp(1.4rem,2.7vw,2rem);line-height:1.55;margin:0;font-weight:500}
.report .v{white-space:nowrap;color:var(--accent-ink);font-weight:800;border-bottom:3px solid var(--accent);padding:0 2px;border-radius:4px;transition:background .2s,color .2s}
.report .v.ok{background:var(--ok-soft);color:var(--ok);border-bottom-color:var(--ok)}
.report .v.ok::after{content:" ✓";font-size:.7em}
.report.hidden-text{filter:blur(9px);user-select:none}
.report.speaking{background:var(--accent-soft);border-radius:8px}
.empty{color:var(--muted);font-size:1.2rem;margin:0}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:1.05rem}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback.info{background:var(--surface-2)}
.feedback p{margin:0}
.feedback .t{font-weight:800;font-size:1.2rem}
.feedback.ok .t{color:var(--ok)} .feedback.no .t{color:var(--bad)}

/* word card */
.word{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--accent-soft);border-color:transparent}
.word .w{font-size:2rem;font-weight:800;line-height:1.1}
.word .m{font-size:1.05rem}
.word .ex{grid-column:1/-1;color:var(--muted);font-size:1rem;margin-top:4px}

/* controls */
.controls{display:flex;flex-direction:column;gap:14px}
.group{border-radius:10px;padding:6px 8px;margin:-6px -8px;transition:background .2s}
.group.warn{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
.group h3{margin:0 0 6px;font-size:.95rem;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.group h3 span{font-weight:400;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:46px;font-size:1.02rem;font-weight:500;transition:transform .1s}
.chip:hover{border-color:var(--muted)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"]::after{content:"✓";font-size:.85rem;color:var(--accent-ink)}
.chip[disabled]{opacity:.38;cursor:not-allowed}
.sw{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);flex:none}
.skin{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0}
.skin[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.actionbar{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:0 8px 20px -12px rgba(0,0,0,.45)}
.actionbar .hint{color:var(--muted);font-size:.9rem;flex:1 1 90px;min-width:0}
.actionbar .hint.no{color:var(--bad);font-weight:600}

/* then & now */
.tnwrap{display:flex;flex-direction:column;gap:16px}
.work.tn{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pair .poster h2{font-size:clamp(1.3rem,3.4vw,2rem)}
.options{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;font-size:clamp(1.05rem,1.8vw,1.3rem);min-height:56px;display:flex;gap:12px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-weight:800;color:var(--muted);width:1.4em;flex:none}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.lf{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:1rem}
.lf b{color:var(--accent-ink)}

/* done */
.done{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:28px;align-items:center}
.badge{aspect-ratio:1;max-width:260px;width:100%;margin:0 auto;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:8px double var(--on-accent);box-shadow:0 0 0 6px var(--accent);text-align:center;padding:20px;animation:badgein .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes badgein{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.badge .r{font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
.badge .st{font-size:1.7rem;margin-top:6px;letter-spacing:.05em}
.done h2{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,5vw,3rem);margin:0 0 6px}
.done .sc{font-size:1.3rem;font-weight:700;margin:0 0 8px}

footer{color:var(--muted);font-size:.85rem;text-align:center}

@media (max-width:760px){
  .hero,.done{grid-template-columns:minmax(0,1fr)}
  .hero .poster{max-width:240px;margin:0 auto}
  .mode{grid-template-columns:auto minmax(0,1fr)}
  .mode > .btn{grid-column:1/-1}
  .levels{grid-column:1/-1}
  .work,.work.tn{grid-template-columns:minmax(0,1fr)}
  .work:not(.tn) .poster-col{z-index:5;background:var(--bg);padding-block:8px 6px}
  .work:not(.tn) .poster{max-width:210px;margin:0 auto;padding:8px 8px 4px}
  .work:not(.tn) .poster h2{font-size:1.4rem}
  .work:not(.tn) .poster .cap{display:none}
  .tn .poster-col{position:static}
  .pair{gap:10px}
  .pair .poster{padding:10px 8px 6px}
  .report{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);}catch(e){}
}
const sfx={pop:()=>tone(660,.07,"triangle"),win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.22,"triangle",i*.1))},
  bad:()=>{tone(220,.18,"square",0,.06);tone(180,.25,"square",.15,.06)},stamp:()=>tone(90,.25,"sine",0,.3)};
function say(text,onend){

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.85;
    const vs=speechSynthesis.getVoices();const v=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;

/* ================= sentences ================= */
const cap=s=>s[0].toUpperCase()+s.slice(1);
function sentences(p){
  const P=cap(p.pro),q=p.pro,T=(f,w)=>({f,w}),S=[];
  if(p.length==="bald"){const s=[`${P} is `,T("length","bald")];if(p.eyes)s.push(` and ${q} has `,T("eyes",p.eyes)," eyes");s.push(".");S.push(s)}
  else{
    const h=[];if(p.length)h.push(T("length",p.length));if(p.type&&p.length)h.push(T("type",p.type));if(p.colour&&p.length)h.push(T("colour",p.colour));
    if(h.length){const s=[`${P} has `];h.forEach((x,i)=>{if(i)s.push(" ");s.push(x)});s.push(" hair");if(p.eyes)s.push(" and ",T("eyes",p.eyes)," eyes");s.push(".");S.push(s)}
    else if(p.eyes)S.push([`${P} has `,T("eyes",p.eyes)," eyes."]);
  }
  const ex=["moustache","beard","scar"].filter(k=>p[k]);
  if(ex.length){const s=[`${P} has `];ex.forEach((k,i)=>{if(i)s.push(i===ex.length-1?" and ":", ");s.push("a ",T(k,k))});s.push(".");S.push(s)}
  if(p.glasses)S.push([`${P} wears `,T("glasses","glasses"),"."]);
  return S;
}
const segHTML=(S,cls=()=>"")=>S.map(s=>s.map(x=>typeof x==="string"?x:`<span class="v ${cls(x.f)}" data-f="${x.f}">${x.w}</span>`).join("")).join(" ");
const segText=S=>S.map(s=>s.map(x=>typeof x==="string"?x:x.w).join("")).join(" ");

function featureOK(f,t,s){
  if(f==="length")return s.length===t.length;
  if(f==="type"||f==="colour")return s.length!=="bald"&&s[f]===t[f];
  if(f==="eyes")return s.eyes===t.eyes;
  return !!s[f]===!!t[f];
}

/* ================= face drawing ================= */
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=c=>Math.max(0,Math.min(255,Math.round(f<0?c*(1+f):c+(255-c)*f)));return"#"+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1)}
function seeded(i){const x=Math.sin(i*99.13)*43758.55;return x-Math.floor(x)}
function curls(pts,r,fill,stroke,dash=""){return pts.map(([x,y],i)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*(.85+seeded(i+x)*.3)).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash}/>`).join("")}
function arc(cx,cy,rx,ry,t0,t1,n){const a=[];for(let i=0;i<n;i++){const t=t0+(t1-t0)*i/(n-1);a.push([cx+rx*Math.cos(t),cy-ry*Math.sin(t)])}return a}
function column(x,y0,y1,step){const a=[];for(let y=y0;y<=y1;y+=step)a.push([x+(seeded(y)*6-3),y]);return a}

  const ec=p.eyes?EYES[p.eyes]:"#A3A3A3";

     +(curly&&p.length?curls(arc(150,190,58,-60,.25,Math.PI-.25,9),9,bc,bs):`<path d="M108 222 l4 10 M126 232 l3 10 M150 236 v10 M174 232 l-3 10 M192 222 l-4 10" stroke="${bs}" stroke-width="2" opacity=".55"/>`):"";

function exampleFor(key,val){
  if(key==="length"&&val==="bald")return"He is bald.";
  if(key==="eyes")return`He has ${val} eyes.`;
  if(["length","type","colour"].includes(key))return`He has ${val} hair.`;

}

    ${opts.skin?`<div class="group"><h3>Skin</h3><div class="chips">${SKINS.map((c,i)=>`<button class="skin" data-skin="${i}" aria-pressed="${s.skin===i}" style="background:${c}" aria-label="Skin tone ${i+1}"></button>`).join("")}</div></div>`:""}

function bindControls(root,s,onChange,onWord){
  root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{s[b.dataset.k]=b.dataset.v;sfx.pop();onChange();
    if(b.dataset.k!=="pro"){const w=b.dataset.k==="eyes"?b.dataset.v+" eyes":b.dataset.v;onWord&&onWord(w,exampleFor(b.dataset.k,b.dataset.v))}});
  root.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const k=b.dataset.b;s[k]=!s[k];sfx.pop();onChange();if(s[k])onWord&&onWord(k,exampleFor("b",k))});
  root.querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{s.skin=+b.dataset.skin;sfx.pop();onChange()});

/* ================= case files ================= */
let C=null;
function newCase(){const t=randomPerson();C={round:0,results:[],stars:[],target:t,sketch:BLANK(t.skin),tries:0,state:"play",warn:[],msg:null,reveal:false}}
function nextCase(){const t=randomPerson();Object.assign(C,{round:C.round+1,target:t,sketch:BLANK(t.skin),tries:0,state:"play",warn:[],msg:null,reveal:false})}
function caseCats(t){return["length",...(t.length!=="bald"?["type","colour"]:[]),"eyes",...BOOLS]}
const CAT_NAME={length:"hair length",type:"hair type",colour:"hair colour",eyes:"eye colour"};
function renderCase(){
  if(C.round>=ROUNDS)return renderDone("case");
  const t=C.target,s=C.sketch,S=sentences(t),total=C.stars.reduce((a,b)=>a+b,0);
  const easy=level==="easy",hard=level==="hard";
  const dots=Array.from({length:ROUNDS},(_,i)=>`<i class="${i<C.results.length?(C.results[i]?"ok":"no"):i===C.round?"cur":""}"></i>`).join("");
  const cls=f=>(easy||C.state!=="play")&&featureOK(f,t,s)?"ok":"";
  const hidden=hard&&!C.reveal&&C.state==="play";
  let fb="";
  if(C.state==="won"){const st=C.stars[C.stars.length-1];
    fb=`<div class="feedback ok"><p class="t">Caught! ${"★".repeat(st)}${"☆".repeat(3-st)}</p><p>${C.tries===1?"Perfect sketch on the first try!":`You caught the suspect in ${C.tries} tries.`}</p></div>`}
  else if(C.state==="lost"){
    fb=`<div class="feedback no"><p class="t">The suspect escaped!</p><p>Here is the right sketch. Read the report again and look at each word.</p></div>`}
  else if(C.msg){fb=`<div class="feedback no"><p class="t">Not yet!</p><p>${C.msg}</p></div>`}
  else fb=`<div class="feedback info"><p>${hard?"Press <b>Listen</b>, then build the face.":"Read the report. Choose the hair, eyes and face to match."} You have 3 tries.</p></div>`;
  const stamp=C.state==="won"?`<div class="stamp">CAUGHT!</div>`:C.state==="lost"?`<div class="stamp grey">ESCAPED</div>`:"";
  const shown=C.state==="lost"?t:s;
  view.innerHTML=`<div class="tnwrap">
    <div class="topbar"><span class="title">Case ${C.round+1} of ${ROUNDS}</span><span class="tag">${LEVELS[level].name}</span><span class="dots" aria-hidden="true">${dots}</span>
      <span class="stars"><span class="s">★</span> ${total} / ${ROUNDS*3}</span></div>
    <div class="work">
      <div class="poster-col">${posterHTML(shown,"WANTED",`Case file 5-0${C.round+1}`,stamp)}</div>
      <div class="panel">
        <div class="report-card">
          <div class="head"><p class="label" style="margin:0">Police report</p>
            <div class="row"><button class="btn" id="listenBtn">▶ Listen</button>${hard&&C.state==="play"?`<button class="btn" id="peekBtn">${C.reveal?"Hide the words":"Show the words"}</button>`:""}</div></div>
          <p class="report ${hidden?"hidden-text":""}" id="report">${segHTML(S,cls)}</p>
          ${fb}
        </div>
        <div class="card" id="ctrl">${controlsHTML(s,{skin:true,warn:C.warn})}</div>
        <div class="actionbar">
          ${C.state==="play"?`<span class="hint ${C.warn.length?"no":""}">${C.warn.length?"Check the yellow boxes. ":""}Tries left: <b>${3-C.tries}</b></span><button class="btn" id="clearBtn">Clear</button><button class="btn primary big" id="arrestBtn">🚨 Arrest!</button>`
            :`<span class="hint">${C.state==="won"?"Great detective work!":"You'll get the next one!"}</span><button class="btn primary big" id="nextBtn">${C.round+1<ROUNDS?"Next case →":"See my badge"}</button>`}
        </div>
      </div>
    </div></div>`;
  const rep=view.querySelector("#report");
  view.querySelector("#listenBtn").onclick=()=>{rep.classList.add("speaking");say(segText(S),()=>rep.classList.remove("speaking"))};
  const pk=view.querySelector("#peekBtn");if(pk)pk.onclick=()=>{C.reveal=!C.reveal;keepScroll(renderCase)};
  if(C.state==="play"){
    bindControls(view.querySelector("#ctrl"),s,()=>{C.warn=[];keepScroll(renderCase)},w=>say(w));
    view.querySelector("#clearBtn").onclick=()=>{C.sketch=BLANK(t.skin);C.warn=[];C.msg=null;keepScroll(renderCase)};
    view.querySelector("#arrestBtn").onclick=arrest;
  } else view.querySelectorAll("#ctrl button").forEach(b=>b.disabled=true);
  const nb=view.querySelector("#nextBtn");if(nb)nb.onclick=()=>{nextCase();renderCase();window.scrollTo({top:0,behavior:"smooth"})};
}
function arrest(){
  const t=C.target,s=C.sketch;
  const missing=["length","eyes"].filter(f=>!s[f]);
  if(s.length&&s.length!=="bald"){if(!s.type)missing.push("type");if(!s.colour)missing.push("colour")}
  if(missing.length){C.msg=`Finish the sketch first. Choose the ${missing.map(m=>CAT_NAME[m]).join(" and ")}.`;C.warn=missing;sfx.bad();keepScroll(renderCase);return}
  C.tries++;
  const wrong=caseCats(t).filter(c=>!featureOK(c,t,s));
  if(!wrong.length){
    const st=4-C.tries;C.stars.push(st);C.results.push(true);C.state="won";C.msg=null;C.warn=[];
    keepScroll(renderCase);sfx.stamp();setTimeout(sfx.win,150);say("Great job! You caught the suspect!");return;
  }
  sfx.bad();
  if(C.tries>=3){C.stars.push(0);C.results.push(false);C.state="lost";C.warn=[];keepScroll(renderCase);return}
  const names=[...new Set(wrong.map(c=>BOOLS.includes(c)?c:CAT_NAME[c]))];
  C.warn=[...new Set(wrong.map(c=>BOOLS.includes(c)?"face":c))];
  C.msg=`Wrong suspect. Check the <b>${names.join("</b>, <b>")}</b>. Read the report again.`;
  keepScroll(renderCase);
  const p=document.getElementById("poster");if(p){p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake")}
}

/* ================= studio ================= */
const studio=Object.assign(BLANK(),{length:"long",type:"curly",colour:"dark",eyes:"green",moustache:true,scar:true});
let lastWord={w:"curly",ex:"He has curly hair."};
function renderStudio(){
  const S=sentences(studio);
  view.innerHTML=`<div class="work">
    <div class="poster-col">${posterHTML(studio,"WANTED","Reward $500")}</div>
    <div class="panel">
      <div class="report-card"><div class="head"><p class="label" style="margin:0">Police report</p>
        <div class="row"><button class="btn primary" id="readBtn">▶ Read aloud</button></div></div>
        ${S.length?`<p class="report" id="report">${segHTML(S)}</p>`:`<p class="empty">Choose the hair, eyes and face. The sentences appear here.</p>`}
        <div class="row" style="margin-top:14px"><button class="btn" id="randBtn">↻ Random suspect</button><button class="btn" id="resetBtn">Clear face</button></div>
      </div>
      <div class="card word"><div><div class="w">${lastWord.w}</div><div class="m">${MEAN[lastWord.w]||""}</div></div>
        <button class="btn" id="wordSay">▶ Listen</button><div class="ex">${lastWord.ex}</div></div>
      <div class="card" id="ctrl">${controlsHTML(studio,{pronoun:true,skin:true})}</div>
    </div></div>`;
  bindControls(view.querySelector("#ctrl"),studio,()=>keepScroll(renderStudio),(w,ex)=>{lastWord={w,ex};say(w);keepScroll(renderStudio)});
  const rep=view.querySelector("#report");
  view.querySelector("#readBtn").onclick=()=>{if(!S.length)return;rep.classList.add("speaking");say(segText(S),()=>rep.classList.remove("speaking"))};
  view.querySelector("#randBtn").onclick=()=>{Object.assign(studio,randomPerson());sfx.pop();keepScroll(renderStudio)};
  view.querySelector("#resetBtn").onclick=()=>{Object.assign(studio,BLANK(studio.skin));keepScroll(renderStudio)};
  view.querySelector("#wordSay").onclick=()=>say(lastWord.w);
}

/* ================= then & now ================= */
let T=null;
function makeChange(){
  const before=randomPerson(); before.pro="he"; const after={...before};
  const kind=pick(["beard","moustache","glasses","colour","long","curly","bald"]); let right,rev;
  if(["beard","moustache","glasses"].includes(kind)){before[kind]=true;after[kind]=false;
    const verb=kind==="glasses"?"wear glasses":`have a ${kind}`;
    right=`He used to ${verb}, but now he doesn't.`; rev=`He didn't use to ${verb}, but now he does.`;}
  else{ if(before.length==="bald")before.length="short"; after.length=before.length;
    if(kind==="colour"){after.colour=pick(Object.keys(COLOURS).filter(c=>c!==before.colour));
      right=`He used to have ${before.colour} hair, but now it's ${after.colour}.`; rev=`He used to have ${after.colour} hair, but now it's ${before.colour}.`;}
    if(kind==="long"){before.length="long";after.length="short";right="He used to have long hair, but now it's short.";rev="He used to have short hair, but now it's long.";}
    if(kind==="curly"){before.type="curly";after.type="straight";right="He used to have curly hair, but now it's straight.";rev="He used to have straight hair, but now it's curly.";}
    if(kind==="bald"){after.length="bald";right="He used to have hair, but now he's bald.";rev="He used to be bald, but now he has hair.";}
  }
  const absent=["beard","moustache","glasses"].filter(k=>!before[k]&&!after[k]);
  let other;
  if(absent.length){const k=pick(absent);other=k==="glasses"?"He used to wear glasses, but now he doesn't.":`He used to have a ${k}, but now he doesn't.`;}
  else{const c=pick(Object.keys(COLOURS).filter(c=>c!==before.colour&&c!==after.colour));other=after.length==="bald"?`He used to have ${c} hair, but now he's bald.`:`He used to have ${c} hair, but now it's ${after.colour}.`;}
  return {before,after,right,opts:[right,rev,other].sort(()=>Math.random()-.5),picked:null};
}
function newThen(){T={round:0,results:[],q:makeChange()}}
function renderThen(){
  if(T.round>=ROUNDS)return renderDone("then");
  const q=T.q,score=T.results.filter(Boolean).length,answered=q.picked!==null;
  const dots=Array.from({length:ROUNDS},(_,i)=>`<i class="${i<T.results.length?(T.results[i]?"ok":"no"):i===T.round?"cur":""}"></i>`).join("");
  view.innerHTML=`<div class="tnwrap">
    <div class="topbar"><span class="title">Question ${T.round+1} of ${ROUNDS}</span><span class="dots" aria-hidden="true">${dots}</span><span class="stars">Score ${score} / ${ROUNDS}</span></div>
    <div class="work tn">
      <div class="pair">${posterHTML(q.before,"BEFORE")}${posterHTML(q.after,"NOW")}</div>
      <div class="panel">
        <div class="card"><p class="label">What changed? Choose the correct sentence.</p>
          <div class="options">${q.opts.map((o,i)=>{let c="";if(answered){if(o===q.right)c="ok";else if(o===q.picked)c="no"}
            return `<button class="opt ${c}" data-o="${i}" ${answered?"disabled":""}><span class="k">${"ABC"[i]}</span><span>${o}</span>${answered&&o===q.right?"<b style='margin-left:auto'>✓</b>":answered&&o===q.picked?"<b style='margin-left:auto'>✗</b>":""}</button>`}).join("")}</div>
          ${answered?`<div class="feedback ${q.picked===q.right?"ok":"no"}"><p class="t">${q.picked===q.right?"Correct!":"Look again at the two posters."}</p></div>
            <div class="row" style="margin-top:12px"><button class="btn" id="sayRight">▶ Listen</button><button class="btn primary big" id="nextQ">${T.round+1<ROUNDS?"Next →":"See my badge"}</button></div>`:""}
        </div>
        <div class="lf"><b>used to</b> + verb = something that was true in the past but is not true now.<br>
          e.g. My dad <b>used to have</b> long black hair. Now it's short and grey.</div>
      </div>
    </div></div>`;
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{q.picked=q.opts[+b.dataset.o];const ok=q.picked===q.right;T.results.push(ok);ok?sfx.win():sfx.bad();say(q.right);keepScroll(renderThen)});
  const sr=view.querySelector("#sayRight");if(sr)sr.onclick=()=>say(q.right);
  const nq=view.querySelector("#nextQ");if(nq)nq.onclick=()=>{T.round++;T.q=makeChange();renderThen();window.scrollTo({top:0,behavior:"smooth"})};
}

/* ================= done ================= */
function renderDone(which){
  let got,max,unit;
  if(which==="case"){got=C.stars.reduce((a,b)=>a+b,0);max=ROUNDS*3;unit="stars"}else{got=T.results.filter(Boolean).length;max=ROUNDS;unit="correct"}
  const pct=got/max;
  const rank=pct>=.85?"Super Detective":pct>=.55?"Detective":"Junior Detective";
  const msg=pct>=.85?"Amazing! You know your words for describing people.":pct>=.55?"Great work! Practise a few words in Sketch Studio and try again.":"Good start! Open Sketch Studio, listen to the words, then play again.";
  view.innerHTML=`<div class="card"><div class="done">
    <div class="badge"><div class="r">${rank}</div><div class="st">${which==="case"?`★ ${got}/${max}`:`${got}/${max}`}</div></div>
    <div><h2>Case closed!</h2><p class="sc">${got} / ${max} ${unit}${which==="case"?` (${LEVELS[level].name})`:""}</p><p style="margin:0 0 16px;max-width:48ch;font-size:1.1rem">${msg}</p>
      <div class="row"><button class="btn primary big" id="again">Play again</button>${which==="case"&&level!=="hard"?`<button class="btn" id="harder">Try ${level==="easy"?"Medium":"Hard"}</button>`:""}<button class="btn" id="toHome">Home</button></div></div>
  </div></div>`;
  sfx.win();
  view.querySelector("#again").onclick=()=>go(which);
  const h=view.querySelector("#harder");if(h)h.onclick=()=>{level=level==="easy"?"medium":"hard";go("case")};
  view.querySelector("#toHome").onclick=()=>go("home");
}

render();
</script>
