:root {
  --paper: #F6F1E7;
  --paper-2: #EFE8DA;
  --card: #FFFDF8;
  --ink: #1B1B1F;
  --ink-2: #3A3833;
  --muted: #5F5A50;
  --rule: #D8CEBB;
  --good: #1D7A45;
  --good-bg: #E3F2E8;
  --bad: #B8321D;
  --bad-bg: #FBE7E1;
  --line: #1B1B1F;
  --line-ink: #fff;
  --r: 10px;
  --display: 'Archivo Black', 'Arial Black', system-ui, sans-serif;
  --body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  font-size: 18px;
}
html.big { font-size: 22px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
:where(button) { font: inherit; color: inherit; cursor: pointer; }
:where(button):focus-visible, .station:focus-visible, .card3d:focus-visible { outline: 3px solid #E9A90E; outline-offset: 3px; }
mark { background: none; color: inherit; font-weight: 700; box-shadow: inset 0 -0.42em 0 color-mix(in srgb, var(--line) 26%, transparent); padding: 0 .08em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── top bar */
.topbar { background: var(--ink); color: var(--paper); }
.topbar-in { max-width: 1180px; margin: 0 auto; padding: .55rem 1rem; display: flex; align-items: center; gap: .75rem; }
.brand { display: flex; align-items: center; gap: .6rem; background: none; border: 0; padding: .2rem 0; color: inherit; }
.brand-mark { width: 2rem; height: 2rem; border-radius: 50%; border: 4px solid var(--paper); position: relative; flex: none; }
.brand-mark::after { content: ''; position: absolute; left: -7px; right: -7px; top: 50%; height: 6px; margin-top: -3px; background: #D7372B; }
.brand-name { white-space: nowrap; font-family: var(--display); font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; }
.brand-by { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #CFC6B4; margin-left: .2rem; }
.topbar .spacer { flex: 1; }
.tbtn { background: transparent; border: 2px solid #5B574E; color: var(--paper); border-radius: 999px; padding: .35rem .85rem; font-size: .8rem; font-weight: 600; min-height: 40px; }
.tbtn:hover { border-color: var(--paper); }
.tbtn[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }

main { max-width: 1180px; margin: 0 auto; padding: 1.4rem 1rem 2rem; }
.fade-in { animation: fadeUp .38s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ── buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 56px; padding: .7rem 1.4rem; border-radius: var(--r); border: 3px solid var(--ink); background: var(--card); font-weight: 700; font-size: 1rem; transition: transform .15s var(--ease), background .15s, box-shadow .15s; box-shadow: 0 4px 0 var(--ink); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.line { background: var(--line); color: var(--line-ink); }
.btn.ghost { box-shadow: none; border-color: var(--rule); background: transparent; }
.btn.ghost:hover { border-color: var(--ink); }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }

/* ── roundel (line badge) */
.roundel { display: inline-grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--line); color: var(--line-ink); font-family: var(--display); font-size: 1.15rem; flex: none; }
.roundel.sm { width: 1.7rem; height: 1.7rem; font-size: .85rem; }

/* ── home */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 2rem; align-items: end; padding: .6rem 0 1.6rem; border-bottom: 3px solid var(--ink); }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.title { font-family: var(--display); font-size: clamp(2.9rem, 8.4vw, 6.4rem); line-height: .86; letter-spacing: -.02em; margin: 0; text-transform: uppercase; }
.title span { display: block; }
.title .stripe { display: flex; gap: 6px; margin-top: .9rem; }
.title .stripe i { height: 10px; flex: 1; border-radius: 5px; }
.lede { font-size: 1.12rem; color: var(--ink-2); margin: 1rem 0 0; max-width: 34rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.chip { border: 2px solid var(--ink); border-radius: 999px; padding: .2rem .75rem; font-size: .82rem; font-weight: 700; }
.howline { background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); padding: 1rem 1.1rem; }
.howline h2 { font-family: var(--display); font-size: 1rem; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 .7rem; }
.howline ol { margin: 0; padding: 0; list-style: none; display: grid; gap: .55rem; }
.howline li { display: grid; grid-template-columns: 1.6rem 1fr; gap: .6rem; align-items: start; font-size: .95rem; }
.howline li b { display: block; }
.dot { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 4px solid var(--ink); background: var(--card); margin-top: .15rem; }
.dot.fill { background: var(--ink); }
.dot.term { border-radius: 5px; width: 1.4rem; }

.map-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 1.8rem 0 .9rem; }
.map-head h2 { font-family: var(--display); font-size: 1.5rem; text-transform: uppercase; margin: 0; }
.map-head p { margin: 0; color: var(--muted); font-size: .9rem; }
.network { display: grid; gap: 1rem; }
.mline { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1rem; align-items: center; background: var(--card); border: 2px solid var(--rule); border-radius: var(--r); padding: 1rem 1.1rem; }
.mline-id { display: flex; gap: .75rem; align-items: center; min-width: 0; }
.mline-id h3 { margin: 0; font-size: 1.08rem; line-height: 1.2; }
.mline-id small { display: block; color: var(--muted); font-size: .8rem; margin-top: .15rem; }
.pbar { height: 6px; background: var(--paper-2); border-radius: 3px; margin-top: .45rem; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--line); border-radius: 3px; transition: width .6s var(--ease); }
.track { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.track::before { content: ''; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 1.05rem; height: 10px; margin-top: -5px; background: var(--line); border-radius: 5px; }
.station { position: relative; display: flex; flex-direction: column; align-items: center; gap: .3rem; background: none; border: 0; padding: 0 .15rem .2rem; text-align: center; border-radius: 8px; min-width: 0; }
.st-dot { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 5px solid var(--ink); background: var(--card); display: grid; place-items: center; transition: transform .2s var(--ease), background .2s; position: relative; z-index: 1; }
.station.term .st-dot { border-radius: 9px; width: 2.6rem; }
.station:hover .st-dot { transform: scale(1.12); }
.station.done .st-dot { background: var(--ink); }
.station.done .st-dot svg { width: 1rem; height: 1rem; color: var(--paper); }
.st-name { font-size: .8rem; font-weight: 700; line-height: 1.15; }
.st-score { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.station.locked { opacity: .55; }
.station.locked .st-dot svg { width: .9rem; height: .9rem; }

.central { margin-top: 1.4rem; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.2rem; align-items: center; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 1.3rem 1.4rem; }
.central .interchange { display: flex; }
.central .interchange i { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 4px solid var(--ink); margin-left: -.55rem; }
.central .interchange i:first-child { margin-left: 0; }
.central h2 { font-family: var(--display); text-transform: uppercase; font-size: 1.35rem; margin: 0; }
.central p { margin: .2rem 0 0; color: #D9D1C1; font-size: .92rem; }
.central .btn { background: var(--paper); color: var(--ink); border-color: var(--paper); box-shadow: 0 4px 0 #8C8577; }

.foot { max-width: 1180px; margin: 0 auto; padding: 1.2rem 1rem 2rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem 1.5rem; color: var(--muted); font-size: .82rem; border-top: 2px solid var(--rule); }
.foot b { color: var(--ink); letter-spacing: .06em; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: inherit; }

/* ── platform sign (screen header) */
.sign { display: flex; align-items: center; gap: .9rem; background: var(--line); color: var(--line-ink); border-radius: var(--r); padding: .8rem 1rem; margin-bottom: 1.2rem; }
.sign .roundel { background: var(--line-ink); color: var(--line); }
.sign-t { min-width: 0; flex: 1; }
.sign-t small { display: block; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; opacity: .85; }
.sign-t h1 { margin: 0; font-family: var(--display); font-size: clamp(1.25rem, 3.4vw, 1.9rem); line-height: 1.05; text-transform: uppercase; }
.sign .back { background: transparent; border: 2px solid currentColor; color: inherit; border-radius: 999px; min-height: 44px; padding: .3rem .9rem; font-weight: 700; font-size: .85rem; white-space: nowrap; }
.sign .count { font-family: var(--display); font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* mini progress line used in practice / test */
.miniline { display: flex; align-items: center; margin: 0 0 1.1rem; }
.miniline i { flex: 1; height: 6px; background: var(--rule); }
.miniline i.on { background: var(--line); }
.miniline b { width: 1.05rem; height: 1.05rem; border-radius: 50%; border: 4px solid var(--rule); background: var(--card); flex: none; transition: border-color .3s, background .3s; }
.miniline b.on { border-color: var(--line); }
.miniline b.cur { border-color: var(--ink); transform: scale(1.25); }
.miniline b.ok { background: var(--line); border-color: var(--line); }
.miniline b.no { background: var(--card); border-color: var(--bad); }

/* ── lesson */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; max-width: 900px; margin: 0 auto; }
.card3d { perspective: 1600px; cursor: pointer; border-radius: 16px; }
.card3d .inner { display: grid; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.card3d.flipped .inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 1.6rem 1.8rem; min-height: 21rem; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.face::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: var(--line); }
.face.back-f { transform: rotateY(180deg); }
.face .lab { font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: .6rem 0 .4rem; }
.idiom-big { font-family: var(--display); font-size: clamp(2.1rem, 6.4vw, 3.9rem); line-height: 1; margin: .2rem 0 1.1rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
.literal { display: flex; gap: .7rem; align-items: flex-start; border-top: 2px dashed var(--rule); padding-top: .9rem; margin-top: auto; }
.literal .tag { flex: none; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; border: 2px solid var(--ink); border-radius: 6px; padding: .1rem .45rem; margin-top: .15rem; }
.literal p { margin: 0; font-size: 1.1rem; color: var(--ink-2); }
.hint { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .85rem; margin-top: .9rem; }
.hint svg { width: 1.1rem; height: 1.1rem; }
.meaning-big { font-size: clamp(1.45rem, 3.6vw, 2.15rem); font-weight: 800; line-height: 1.15; margin: .1rem 0 1rem; }
.example { background: var(--paper); border-left: 6px solid var(--line); padding: .8rem 1rem; font-size: 1.12rem; margin: 0 0 1rem; border-radius: 0 8px 8px 0; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .8rem; margin-top: auto; }
.vs div { border: 2px solid var(--rule); border-radius: 8px; padding: .6rem .8rem; font-size: .92rem; }
.vs b { display: block; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .15rem; }
.lesson-ctl { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
.listen { display: inline-flex; align-items: center; gap: .45rem; min-height: 48px; padding: .4rem 1rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); font-weight: 700; font-size: .9rem; }
.listen svg { width: 1.15rem; height: 1.15rem; }
.listen.on { background: var(--ink); color: var(--paper); }
.cardstrip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.cardstrip button { height: 2.6rem; border: 2px solid var(--rule); background: var(--card); border-radius: 6px; font-weight: 700; font-size: .85rem; padding: 0; transition: background .2s, border-color .2s; }
.cardstrip button.seen { border-color: var(--line); }
.cardstrip button.cur { background: var(--line); border-color: var(--line); color: var(--line-ink); }

/* ── question card */
.qwrap { max-width: 900px; margin: 0 auto; }
.qcard { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 1.5rem 1.6rem; }
.qtype { display: inline-block; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; background: var(--line); color: var(--line-ink); border-radius: 6px; padding: .15rem .55rem; margin-bottom: .8rem; }
.story { font-size: 1.15rem; line-height: 1.65; background: var(--paper); border-radius: 10px; padding: 1rem 1.15rem; margin: 0 0 1.1rem; }
.qtext { font-size: 1.28rem; font-weight: 800; line-height: 1.3; margin: 0 0 1rem; }
.opts { display: grid; gap: .7rem; }
.opt { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto; align-items: center; gap: .8rem; min-height: 62px; text-align: left; background: var(--card); border: 3px solid var(--rule); border-radius: 12px; padding: .55rem .9rem .55rem .6rem; font-size: 1.08rem; font-weight: 600; transition: border-color .15s, background .15s, transform .15s var(--ease); }
.opt:hover:not(:disabled) { border-color: var(--ink); transform: translateX(3px); }
.opt .key { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); font-family: var(--display); font-size: 1rem; }
.opt .mk { font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: .3rem; }
.opt .mk svg { width: 1.2rem; height: 1.2rem; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .key { background: var(--good); color: #fff; }
.opt.right .mk { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.wrong .mk { color: var(--bad); }
.opt.dim { opacity: .55; }
.opt.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.feedback { margin-top: 1rem; border-radius: 12px; padding: 1rem 1.15rem; border: 3px solid; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: .9rem; animation: fadeUp .3s var(--ease) both; }
.feedback.good { border-color: var(--good); background: var(--good-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback .ic { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.feedback.good .ic { background: var(--good); }
.feedback.bad .ic { background: var(--bad); }
.feedback .ic svg { width: 1.4rem; height: 1.4rem; }
.feedback h3 { margin: 0 0 .2rem; font-size: 1.12rem; }
.feedback p { margin: .15rem 0 0; }
.feedback .also { color: var(--ink-2); font-size: .95rem; }
.qnav { display: flex; justify-content: flex-end; gap: .8rem; margin-top: 1rem; flex-wrap: wrap; }

/* dialogue */
.chat { display: grid; gap: .7rem; margin: 0 0 1.2rem; }
.bubble { max-width: 82%; border: 3px solid var(--ink); border-radius: 16px 16px 16px 4px; padding: .7rem 1rem; background: var(--card); font-size: 1.12rem; }
.bubble .who { display: block; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.bubble.r { justify-self: end; border-radius: 16px 16px 4px 16px; background: var(--paper); }
.blank { display: inline-block; min-width: 7.5rem; border-bottom: 3px solid var(--ink); padding: 0 .3rem; text-align: center; font-weight: 800; }
.blank.filled { border-bottom-color: var(--line); background: color-mix(in srgb, var(--line) 16%, transparent); border-radius: 4px 4px 0 0; animation: fadeUp .3s var(--ease) both; }

/* match-up */
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 1rem; }
.match h3 { font-size: .76rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.mcol { display: grid; gap: .6rem; align-content: start; }
.mitem { min-height: 58px; text-align: left; background: var(--card); border: 3px solid var(--rule); border-radius: 12px; padding: .55rem .9rem; font-size: 1.02rem; font-weight: 600; display: flex; align-items: center; gap: .6rem; transition: border-color .15s, background .15s, transform .15s; }
.mitem.idm { font-weight: 800; }
.mitem:hover:not(:disabled) { border-color: var(--ink); }
.mitem.sel { border-color: var(--ink); background: var(--paper-2); transform: scale(1.02); }
.mitem.ok { border-color: var(--good); background: var(--good-bg); }
.mitem.miss { border-color: var(--bad); border-style: dashed; background: var(--card); }
.mitem.flash { animation: shake .35s; border-color: var(--bad); }
.mitem .pair { margin-left: auto; flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; font-size: .82rem; font-weight: 800; color: #fff; background: var(--good); }
.mitem.miss .pair { background: var(--bad); }
.mitem:disabled { cursor: default; }

/* result card */
.result { max-width: 900px; margin: 0 auto; background: var(--card); border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; }
.result-top { background: var(--line); color: var(--line-ink); padding: 1.4rem 1.6rem; display: flex; align-items: center; gap: 1.4rem; flex-wrap: wrap; }
.big-score { font-family: var(--display); font-size: clamp(3rem, 9vw, 5rem); line-height: .9; font-variant-numeric: tabular-nums; }
.big-score small { font-size: .4em; opacity: .85; }
.result-top h2 { margin: 0; font-family: var(--display); text-transform: uppercase; font-size: 1.5rem; }
.result-top p { margin: .2rem 0 0; opacity: .92; }
.result-body { padding: 1.3rem 1.6rem 1.5rem; display: grid; gap: 1.1rem; }
.best-note { font-weight: 700; }
.bars { display: grid; gap: .55rem; }
.barrow { display: grid; grid-template-columns: 2rem minmax(0, 12rem) minmax(0, 1fr) 3rem; gap: .7rem; align-items: center; font-size: .95rem; }
.barrow .bt { height: 14px; background: var(--paper-2); border-radius: 7px; overflow: hidden; }
.barrow .bt i { display: block; height: 100%; border-radius: 7px; background: var(--line); }
.barrow b { text-align: right; font-variant-numeric: tabular-nums; }
.review { border-top: 2px solid var(--rule); padding-top: 1rem; }
.review h3 { margin: 0 0 .6rem; font-size: 1.05rem; }
.review ol { margin: 0; padding-left: 1.3rem; display: grid; gap: .7rem; }
.review li { font-size: .95rem; }
.review .ans { display: block; margin-top: .2rem; }
.review .ans span { display: inline-block; margin-right: .8rem; }
.review .ans .no { color: var(--bad); text-decoration: line-through; }
.review .ans .yes { color: var(--good); font-weight: 700; }
.todo { display: flex; flex-wrap: wrap; gap: .6rem; }
.todo button { display: inline-flex; align-items: center; gap: .5rem; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); padding: .35rem .9rem .35rem .35rem; font-weight: 700; min-height: 46px; }

/* quest */
.qtrack { position: relative; margin: .4rem 2.5rem 1.6rem; height: 3.2rem; }
.qtrack .rail { position: absolute; left: 0; right: 0; top: 50%; height: 10px; margin-top: -5px; border-radius: 5px; background: var(--rule); }
.qtrack .rail i { display: block; height: 100%; background: var(--line); border-radius: 5px; transition: width .8s var(--ease); }
.qtrack .stop { position: absolute; top: 50%; width: 1.4rem; height: 1.4rem; margin: -.7rem 0 0 -.7rem; border-radius: 50%; border: 5px solid var(--rule); background: var(--card); transition: border-color .4s; }
.qtrack .stop.on { border-color: var(--line); }
.qtrack .stop.end { border-radius: 6px; width: 1.9rem; margin-left: -.95rem; }
.train { position: absolute; top: 50%; height: 2.2rem; width: 4.4rem; margin: -1.1rem 0 0 -2.2rem; border-radius: 12px 22px 22px 12px; background: var(--ink); border: 3px solid var(--line); transition: left .9s var(--ease); display: flex; align-items: center; gap: 4px; padding: 0 9px; z-index: 2; }
.train i { width: 10px; height: 10px; border-radius: 3px; background: var(--paper); }
.train i:last-child { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: #E9A90E; }
.log { display: grid; gap: .6rem; margin: 0 0 1rem; }
.log p { margin: 0; padding: .6rem .9rem; border-left: 5px solid var(--line); background: var(--card); border-radius: 0 8px 8px 0; color: var(--ink-2); font-size: 1rem; }
.quest-intro { font-size: 1.05rem; color: var(--ink-2); margin: 0 0 1rem; }

/* test */
.timer { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--display); font-size: 1.15rem; background: var(--line-ink); color: var(--line); border-radius: 999px; padding: .3rem .9rem; font-variant-numeric: tabular-nums; }
.timer svg { width: 1.1rem; height: 1.1rem; }
.timer.low { background: var(--bad); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .7; } }
.linetag { display: inline-flex; align-items: center; gap: .45rem; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: .6rem; }
.start-card { max-width: 900px; margin: 0 auto; background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 1.6rem; display: grid; gap: 1rem; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; }
.facts div { border: 2px solid var(--rule); border-radius: 10px; padding: .8rem; }
.facts b { display: block; font-family: var(--display); font-size: 1.8rem; line-height: 1; }
.facts span { font-size: .85rem; color: var(--muted); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(27, 27, 31, .55); display: grid; place-items: center; padding: 1rem; z-index: 50; animation: fadeIn .2s both; }
@keyframes fadeIn { from { opacity: 0; } }
.modal { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; max-width: 30rem; width: 100%; padding: 1.4rem; animation: fadeUp .3s var(--ease) both; }
.modal h2 { margin: 0 0 .5rem; font-family: var(--display); text-transform: uppercase; font-size: 1.3rem; }
.modal p { margin: 0 0 .8rem; }
.modal ul { margin: 0 0 1rem; padding-left: 1.2rem; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; }
  .mline { grid-template-columns: minmax(0, 1fr); }
  .central { grid-template-columns: minmax(0, 1fr); }
  .central .interchange { display: none; }
}
@media (max-width: 640px) {
  :root { font-size: 17px; }
  html.big { font-size: 19px; }
  main { padding: 1rem .75rem 1.6rem; }
  .brand-by { display: none; }
  .tbtn[data-act="big"] { display: none; }

    { id: 'T-t1', line: 'time', type: 'meaning', idiom: 'notime', text: 'Don’t worry about the long line. It moves fast, so we’ll be inside *in no time*.', opts: ['very soon', 'never', 'without a watch', 'late at night'], ex: 'The line moves fast, so they will get in very soon.' },

    { id: 'T-t6', line: 'time', type: 'meaning', idiom: 'shoestring', text: 'The students made their short film *on a shoestring budget*, using their phones and costumes from home.', opts: ['with very little money', 'with a lot of money from sponsors', 'about shoes and fashion', 'very quickly'], ex: 'Phones and home costumes cost almost nothing: very little money.' },

    { id: 'T-p2', line: 'people', type: 'gap', idiom: 'touch', text: 'Jun moved to Canada, but we video-chat every week. We always ___.', opts: ['keep in touch@touch', 'break the ice@ice', 'bury the hatchet@hatchet', 'give each other the cold shoulder@shoulder'], ex: 'Weekly video chats mean they stay in contact: keep in touch.' },

    { id: 'T-p8', line: 'people', type: 'meaning', idiom: 'eye', text: 'My parents don’t *see eye to eye* about pets. Dad wants a dog, but Mom wants no pets at all.', opts: ['agree', 'look at each other', 'shout loudly', 'live together'], ex: 'They want different things, so they don’t agree. “See eye to eye” means agree.' },

    { id: 'T-x1', line: 'success', type: 'meaning', idiom: 'easier', text: '“Just stop worrying about the test,” Mom said. Maya sighed. “That’s *easier said than done*.”', opts: ['it sounds simple but is hard to do', 'it is easy to say and easy to do', 'it is something nobody ever says', 'it is a rude thing to say'], ex: 'Telling yourself not to worry sounds simple, but it is hard to really do.' },

    { id: 'T-x7', line: 'success', type: 'situation', idiom: 'blessing', text: 'Which is an example of a blessing in disguise?', opts: ['Rain canceled our picnic, so Grandpa taught us chess indoors, and now it’s my favorite game.', 'We won a free picnic basket in a raffle.', 'It rained, and the whole day was boring.', 'I wore a mask and costume to the party.'], ex: 'The rain seemed bad at first, but it led to something good.' },

  // Free sample: Line 1 only. 8 questions = 3 story + 3 dialogue + 2 situation.
  const freebie = { line: 'school', story: 3, dialogue: 3, situation: 2 };

  window.IQ = { lines, idioms, conflicts, practice, quests, test, freebie };

<script>(function () {
  'use strict';
  const D = window.IQ;
  const FREE = !!window.IQ_FREE;
  const KEY = FREE ? 'bem-idiom-quest-free-v1' : 'bem-idiom-quest-v1';
  const TEST_N = 4;            // questions per line in the final test
  const TEST_SECONDS = 15 * 60;
  const MATCH_N = 5;
  const STATIONS = [
    { k: 'lesson', name: 'Lesson', long: 'Lesson cards' },
    { k: 'story', name: 'Story Clues', long: 'Story Clues', how: 'Read a short story and work out what the idiom means.' },
    { k: 'dialogue', name: 'Dialogue', long: 'Dialogue Gap', how: 'Choose the idiom that completes the conversation.' },
    { k: 'match', name: 'Match-Up', long: 'Match-Up', how: 'Tap an idiom, then tap its meaning.' },
    { k: 'situation', name: 'Right Situation', long: 'Right Situation', how: 'Find the situation or sentence where the idiom is used correctly.' },
    { k: 'quest', name: 'Quest', long: 'Line Quest', term: true },
  ];
  const lineById = Object.fromEntries(D.lines.map((l) => [l.id, l]));
  const idiomById = Object.fromEntries(D.idioms.map((i) => [i.id, i]));
  const conflictSet = new Set(D.conflicts.map(([a, b]) => [a, b].sort().join('|')));

  // ───────────────────────────────── storage (best scores only)
  const blank = () => ({ best: {}, seen: {}, big: false });
  let store = blank();
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.best) store = Object.assign(blank(), s); } catch (e) { /* storage blocked: play without saving */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } };
  function recordBest(key, s, t, extra) {
    const old = store.best[key];
    const better = !old || s / t > old.s / old.t || (s / t === old.s / old.t && extra && old.time && extra.time < old.time);
    if (better) { store.best[key] = Object.assign({ s, t }, extra || {}); save(); }
    return { isNew: better, prev: old };
  }

  // ───────────────────────────────── helpers
  const $app = document.getElementById('app');
  const $modal = document.getElementById('modal-root');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hl = (s) => esc(s).replace(/\*([^*]+)\*/g, '<mark>$1</mark>');
  const plain = (s) => String(s).replace(/\*/g, '');
  const markedPhrase = (s) => { const m = /\*([^*]+)\*/.exec(s); return m ? m[1] : ''; };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const parseOpt = (o, i) => { const at = o.lastIndexOf('@'); return at > 0 ? { text: o.slice(0, at), id: o.slice(at + 1), correct: i === 0 } : { text: o, id: null, correct: i === 0 }; };
  const prepOpts = (q) => shuffle(q.opts.map(parseOpt));
  const lineStyle = (l) => `--line:${l.color};--line-ink:${l.ink}`;
  function setLine(id) {
    const l = id ? lineById[id] : null;
    document.documentElement.style.setProperty('--line', l ? l.color : '#1B1B1F');
    document.documentElement.style.setProperty('--line-ink', l ? l.ink : '#FFFFFF');
  }
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const KEYS = 'ABCD';

  const I = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    arrowR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
    arrowL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',
    speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18.3 6.5a7.5 7.5 0 010 11"/></svg>',
    flip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0113.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 01-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4v4.5h4.5"/></svg>',
  };

  // ───────────────────────────────── speech (offline device voices)
  const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let voice = null;
  function pickVoice() {
    if (!canSpeak) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find((v) => v.lang === 'en-US' && /Samantha|Google US|Aria|Jenny|Allison|Ava/i.test(v.name)) || vs.find((v) => v.lang === 'en-US') || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, btn) {
    if (!canSpeak) return;
    speechSynthesis.cancel();
    document.querySelectorAll('.listen.on').forEach((b) => b.classList.remove('on'));
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang = 'en-US'; u.rate = 0.9; if (voice) u.voice = voice;
    if (btn) { btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
    speechSynthesis.speak(u);
  }

  // ───────────────────────────────── state + router
  let S = { mode: 'home' };
  let timerId = null;
  let lastTestIds = new Set();
  function go(mode, a, b) {
    if (timerId && mode !== 'test-run') { clearInterval(timerId); timerId = null; }
    if (canSpeak) speechSynthesis.cancel();
    closeModal();
    if (mode === 'home') S = { mode: 'home' };
    else if (mode === 'lesson') S = { mode, line: a, i: b || 0, flipped: false };
    else if (mode === 'practice') S = startPractice(a, b);
    else if (mode === 'quest') S = { mode, line: a, i: 0, first: [], tried: [], solved: false, done: false };
    else if (mode === 'test') S = { mode: 'test-start' };
    else if (mode === 'test-run') S = startTest();
    render();
    window.scrollTo(0, 0);
  }
  function render() {
    const m = S.mode;
    setLine(S.line || null);
    let html = '';
    if (m === 'home') html = viewHome();
    else if (m === 'lesson') html = viewLesson();
    else if (m === 'practice') html = S.done ? viewPracticeResult() : viewPractice();
    else if (m === 'quest') html = S.done ? viewQuestResult() : viewQuest();
    else if (m === 'test-start') html = viewTestStart();
    else if (m === 'test-run') html = S.done ? viewTestResult() : viewTestQ();
    $app.innerHTML = topbar() + `<main class="fade-in" id="main">${html}</main>` + footer();
    if (m === 'lesson') markSeenIfFlipped();
  }
  const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

  // ───────────────────────────────── chrome
  function topbar() {
    return `<header class="topbar"><div class="topbar-in">
      <button class="brand" data-act="home" aria-label="Idiom Quest home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Idiom Quest</span><span class="brand-by">Bright EngMath</span></button>
      <span class="spacer"></span>
      <button class="tbtn" data-act="big" aria-pressed="${store.big}">Big screen</button>
      ${S.mode !== 'home' ? '<button class="tbtn" data-act="home">Map</button>' : ''}
    </div></header>`;
  }
  function footer() {
    return `<footer class="foot"><span><b>© Bright EngMath</b> · Idiom Quest${FREE ? ' · Free sample' : ''} · Common English Idioms, Grades 5–8 / ESL B1</span>
      <span>Best scores are saved only on this device. <button class="linkbtn" data-act="reset">Reset progress</button></span></footer>`;
  }

  // ───────────────────────────────── progress model
  const lessonSeen = (line) => (store.seen[line] || []).length;
  function stationInfo(line, k) {
    if (k === 'lesson') { const n = lessonSeen(line); return { frac: n / 12, label: `${n}/12`, done: n >= 12 }; }
    const b = store.best[`${line}:${k}`];
    return b ? { frac: b.s / b.t, label: `${b.s}/${b.t}`, done: true } : { frac: 0, label: '—', done: false };
  }
  const linePct = (line) => Math.round((STATIONS.reduce((a, st) => a + stationInfo(line, st.k).frac, 0) / STATIONS.length) * 100);
  function isLocked(line, k) {
    if (!FREE) return false;
    if (k === 'test') return true;
    return !(line === D.freebie.line && ['lesson', 'story', 'dialogue', 'situation'].includes(k));
  }

  // ───────────────────────────────── home
  function viewHome() {
    const stripe = D.lines.map((l) => `<i style="background:${l.color}"></i>`).join('');
    const net = D.lines.map((l) => {
      const st = STATIONS.map((s) => {
        const inf = stationInfo(l.id, s.k); const lock = isLocked(l.id, s.k);
        const cls = ['station', s.term ? 'term' : '', inf.done ? 'done' : '', lock ? 'locked' : ''].join(' ');
        const inner = lock ? I.lock : inf.done ? I.check : '';
        return `<button class="${cls}" data-act="${lock ? 'locked' : 'station'}" data-line="${l.id}" data-k="${s.k}" aria-label="Line ${l.n} ${esc(l.name)}: ${s.long}${lock ? ' (full version)' : ', best ' + inf.label}">
          <span class="st-dot">${inner}</span><span class="st-name">${s.name}</span><span class="st-score">${lock ? 'Full version' : inf.label}</span></button>`;
      }).join('');
      const pct = linePct(l.id);
      return `<section class="mline" style="${lineStyle(l)}" aria-label="Line ${l.n}: ${esc(l.name)}">
        <div class="mline-id"><span class="roundel">${l.n}</span><div style="min-width:0;flex:1"><h3>${esc(l.name)}</h3><small>12 idioms · ${pct}% complete</small><div class="pbar"><i style="width:${pct}%"></i></div></div></div>

    }).join('');

    const freeNote = FREE ? `<div class="howline" style="margin-top:1.2rem;border-color:#D7372B"><h2>Free sample</h2><p style="margin:0">Try Line 1: all 12 lesson cards and 8 practice questions. The full Idiom Quest unlocks all 5 lines, 60 idioms, Match-Up boards, 5 story quests, and a timed final test with new questions every time.</p></div>` : '';
    return `
    <section class="hero">
      <div>
        <p class="eyebrow">Bright EngMath presents</p>
        <h1 class="title"><span>Idiom</span><span>Quest</span><span class="stripe" aria-hidden="true">${stripe}</span></h1>

          <li><span class="dot fill"></span><div><b>Central Station</b>A timed test that mixes all five lines.</div></li>
        </ol>
      </div>
    </section>
    ${freeNote}
    <div class="map-head"><h2>Route map</h2><p>Tap any stop. Completed stops turn solid and show your best score.</p></div>
    <div class="network">${net}</div>
    <section class="central">
      <span class="interchange" aria-hidden="true">${D.lines.map((l) => `<i style="background:${l.color}"></i>`).join('')}</span>
      <div><h2>Central Station · Final Test</h2><p>${TEST_N * 5} mixed questions · ${TEST_SECONDS / 60} minutes · new questions every try${tb ? ` · <b style="color:#fff">Best ${tb.s}/${tb.t}</b>` : ''}</p></div>
      <button class="btn" data-act="${FREE ? 'locked' : 'test'}" data-k="test">${FREE ? I.lock + ' Full version' : 'Take the test ' + I.arrowR}</button>
    </section>`;
  }

  // ───────────────────────────────── lesson
  const lineIdioms = (line) => D.idioms.filter((x) => x.line === line);
  function viewLesson() {
    const l = lineById[S.line]; const list = lineIdioms(S.line); const c = list[S.i];
    const seen = new Set(store.seen[S.line] || []);
    const strip = list.map((x, i) => `<button class="${i === S.i ? 'cur' : ''} ${seen.has(x.id) ? 'seen' : ''}" data-act="card" data-i="${i}" aria-label="Card ${i + 1}: ${esc(x.idiom)}${seen.has(x.id) ? ' (seen)' : ''}">${i + 1}</button>`).join('');
    const last = S.i === list.length - 1;
    return `
    ${sign(l, 'Lesson', `Card ${S.i + 1} / ${list.length}`)}
    <div class="lesson">
      <div class="card3d ${S.flipped ? 'flipped' : ''}" data-act="flip" role="button" tabindex="0" aria-label="${S.flipped ? 'Show the idiom side' : 'Flip to see the real meaning'}">
        <div class="inner">
          <div class="face front-f" aria-hidden="${S.flipped}">
            <p class="lab">Idiom ${S.i + 1}</p>
            <p class="idiom-big">${esc(c.idiom)}</p>
            <div class="literal"><span class="tag">Literally</span><p>${esc(c.literal)}</p></div>
            <p class="hint">${I.flip} Tap the card to see what it really means.</p>
          </div>
          <div class="face back-f" aria-hidden="${!S.flipped}">
            <p class="lab">${esc(c.idiom)} · real meaning</p>
            <p class="meaning-big">${esc(c.meaning[0].toUpperCase() + c.meaning.slice(1))}</p>
            <p class="example">${hl(c.example)}</p>
            <div class="vs"><div><b>The words say</b>${esc(c.literal)}</div><div><b>Why it means this</b>${esc(c.note)}</div></div>
          </div>
        </div>
      </div>
      <div class="lesson-ctl">
        <div class="btn-row">
          ${canSpeak ? `<button class="listen" data-act="say" data-what="idiom">${I.speaker} Idiom</button><button class="listen" data-act="say" data-what="example">${I.speaker} Example</button>` : ''}
          <button class="listen" data-act="flip">${I.flip} Flip</button>
        </div>
        <div class="btn-row">
          <button class="btn ghost" data-act="prev" ${S.i === 0 ? 'disabled style="opacity:.4"' : ''}>${I.arrowL} Back</button>
          ${last ? `<button class="btn line" data-act="station" data-line="${l.id}" data-k="story">Next stop: Story Clues ${I.arrowR}</button>` : `<button class="btn line" data-act="next">Next card ${I.arrowR}</button>`}
        </div>
      </div>
      <div class="cardstrip" aria-label="Cards">${strip}</div>
    </div>`;
  }
  function markSeenIfFlipped() {
    if (!S.flipped) return;
    const c = lineIdioms(S.line)[S.i];
    const arr = store.seen[S.line] || (store.seen[S.line] = []);
    if (!arr.includes(c.id)) { arr.push(c.id); save(); }
  }
  function sign(l, kicker, count, extra) {
    return `<div class="sign"><span class="roundel">${l.n}</span><div class="sign-t"><small>Line ${l.n} · ${esc(l.name)}</small><h1>${esc(kicker)}</h1></div>${extra || ''}${count ? `<span class="count">${count}</span>` : ''}<button class="back" data-act="home">${'← Map'}</button></div>`;
  }

  // ───────────────────────────────── practice
  function startPractice(line, kind) {
    const s = { mode: 'practice', line, kind, i: 0, answers: [], picked: null, done: false };
    if (kind === 'match') { s.board = buildBoard(line); s.left = shuffle(s.board); s.right = shuffle(s.board); s.sel = null; s.status = {}; s.misses = 0; s.msg = null; return s; }
    let items = D.practice[line][kind].slice();
    if (FREE) items = items.slice(0, D.freebie[kind] || items.length);
    s.items = items.map((q) => Object.assign({}, q, { _opts: prepOpts(q) }));
    return s;
  }
  function buildBoard(line) {
    const out = [];
    for (const x of shuffle(lineIdioms(line))) {
      if (out.every((y) => !conflictSet.has([x.id, y.id].sort().join('|')))) out.push(x);
      if (out.length === MATCH_N) break;
    }
    return out;
  }
  const stName = (k) => STATIONS.find((s) => s.k === k).long;
  function miniline(n, i, answers) {
    let h = '';
    for (let k = 0; k < n; k++) {
      if (k) h += `<i class="${k <= i ? 'on' : ''}"></i>`;
      const st = answers[k] === true ? 'ok' : answers[k] === false ? 'no' : k === i ? 'cur' : '';
      h += `<b class="${st}" title="Question ${k + 1}"></b>`;
    }
    return `<div class="miniline" aria-hidden="true">${h}</div>`;
  }
  function viewPractice() {
    const l = lineById[S.line];
    if (S.kind === 'match') return viewMatch(l);
    const q = S.items[S.i];
    return `${sign(l, stName(S.kind), `${S.i + 1} / ${S.items.length}`)}
    <div class="qwrap">${miniline(S.items.length, S.i, S.answers)}
      <div class="qcard">${qBody(q, S.kind, S.picked)}${optsHtml(q, S.picked)}${S.picked != null ? feedbackHtml(q, S.picked) : ''}</div>
      ${S.picked != null ? `<div class="qnav"><button class="btn line" data-act="pnext" autofocus>${S.i === S.items.length - 1 ? 'See my score' : 'Next question'} ${I.arrowR}</button></div>` : ''}
    </div>`;
  }
  function qBody(q, kind, picked) {
    const right = q._opts.find((o) => o.correct);
    const fill = (txt) => hl(txt).replace('___', picked != null ? `<span class="blank filled">${esc(right.text)}</span>` : '<span class="blank" aria-label="blank"> </span>');
    if (kind === 'story') return `<span class="qtype">Story Clues</span><p class="story">${hl(q.text)}</p><p class="qtext">${esc(q.q)}</p>`;
    if (kind === 'meaning') return `<span class="qtype">What does it mean?</span><p class="story">${hl(q.text)}</p><p class="qtext">What does “${esc(markedPhrase(q.text))}” mean here?</p>`;
    if (kind === 'dialogue') return `<span class="qtype">Dialogue Gap</span><div class="chat">${q.lines.map(([who, t], i) => `<p class="bubble ${i % 2 ? 'r' : ''}"><span class="who">${esc(who)}</span>${fill(t)}</p>`).join('')}</div><p class="qtext">Which idiom completes the conversation?</p>`;
    if (kind === 'gap') return `<span class="qtype">Fill the gap</span><p class="story">${fill(q.text)}</p><p class="qtext">Which idiom fits the gap?</p>`;
    if (kind === 'situation') return `<span class="qtype">Right Situation</span><p class="qtext">${esc(q.q || q.text)}</p>`;
    return '';
  }
  function optsHtml(q, picked) {
    return `<div class="opts" role="group" aria-label="Answer choices">${q._opts.map((o, i) => {
      let cls = 'opt', mk = '';
      if (picked != null) {
        if (o.correct) { cls += ' right'; mk = `<span class="mk">${I.check} Correct</span>`; }
        else if (i === picked) { cls += ' wrong'; mk = `<span class="mk">${I.x} Your answer</span>`; }
        else cls += ' dim';
      }
      return `<button class="${cls}" data-act="pick" data-i="${i}" ${picked != null ? 'disabled' : ''}><span class="key">${KEYS[i]}</span><span>${esc(o.text)}</span>${mk}</button>`;
    }).join('')}</div>`;
  }
  function feedbackHtml(q, picked) {
    const o = q._opts[picked]; const right = q._opts.find((x) => x.correct);
    let also = '';
    if (!o.correct && o.id && o.id !== q.idiom && idiomById[o.id]) also = `<p class="also">“${esc(idiomById[o.id].idiom)}” means ${esc(idiomById[o.id].meaning)}.</p>`;
    const head = o.correct ? 'Correct!' : `Not quite. The answer is “${esc(right.text)}”.`;
    return `<div class="feedback ${o.correct ? 'good' : 'bad'}" role="status"><span class="ic">${o.correct ? I.check : I.x}</span><div><h3>${head}</h3><p>${esc(q.ex)}</p>${also}</div></div>`;
  }
  function pick(i) {
    if (S.mode === 'practice' && S.picked == null) { S.picked = i; S.answers[S.i] = S.items[S.i]._opts[i].correct; rerender(); focusNext(); }
    else if (S.mode === 'test-run' && S.picked == null) { const q = S.items[S.i]; S.picked = i; S.answers[S.i] = { ok: q._opts[i].correct, chosen: q._opts[i].text }; rerender(); focusNext(); }
    else if (S.mode === 'quest' && !S.solved) questPick(i);
  }
  function focusNext() { const b = document.querySelector('[data-act="pnext"],[data-act="tnext"],[data-act="qnext"]'); if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
  function practiceNext() {
    if (S.i < S.items.length - 1) { S.i++; S.picked = null; render(); window.scrollTo(0, 0); }
    else finishPractice(S.answers.filter(Boolean).length, S.items.length);
  }
  function finishPractice(s, t) {
    S.done = true; S.score = s; S.total = t;
    S.rec = recordBest(`${S.line}:${S.kind}`, s, t);
    render(); window.scrollTo(0, 0);
  }
  function nextStation(line, k) {
    const idx = STATIONS.findIndex((s) => s.k === k);
    for (let j = idx + 1; j < STATIONS.length; j++) if (!isLocked(line, STATIONS[j].k)) return STATIONS[j];
    return null;
  }
  function viewPracticeResult() {
    const l = lineById[S.line]; const nx = nextStation(S.line, S.kind);
    const pct = Math.round((S.score / S.total) * 100);
    const msg = pct === 100 ? 'Perfect run.' : pct >= 70 ? 'Strong work.' : 'Good practice. Review the cards and ride again.';
    const best = store.best[`${S.line}:${S.kind}`];
    return `${sign(l, stName(S.kind) + ' · Done', '')}
    <div class="result"><div class="result-top"><div class="big-score">${S.score}<small>/${S.total}</small></div><div><h2>${msg}</h2><p>${S.rec.isNew ? 'New best score saved on this device.' : `Your best is still ${best.s}/${best.t}.`}</p></div></div>
      <div class="result-body"><div class="btn-row">
        <button class="btn" data-act="station" data-line="${l.id}" data-k="${S.kind}">${I.redo} Try again</button>
        ${nx ? `<button class="btn line" data-act="station" data-line="${l.id}" data-k="${nx.k}">Next stop: ${nx.long} ${I.arrowR}</button>` : ''}
        <button class="btn ghost" data-act="station" data-line="${l.id}" data-k="lesson">Review the cards</button>
        <button class="btn ghost" data-act="home">Route map</button>
      </div></div></div>`;
  }

  // match-up
  function viewMatch(l) {
    const done = Object.keys(S.status).length;
    const L = S.left.map((x) => { const st = S.status[x.id]; return `<button class="mitem idm ${st ? (st.ok ? 'ok' : 'miss') : ''} ${S.sel === x.id ? 'sel' : ''}" data-act="mleft" data-id="${x.id}" ${st ? 'disabled' : ''} aria-pressed="${S.sel === x.id}">${esc(x.idiom)}${st ? `<span class="pair">${st.n}</span>` : ''}</button>`; }).join('');
    const R = S.right.map((x) => { const st = S.status[x.id]; return `<button class="mitem ${st ? (st.ok ? 'ok' : 'miss') : ''} ${S.flash === x.id ? 'flash' : ''}" data-act="mright" data-id="${x.id}" ${st ? 'disabled' : ''}>${esc(x.short[0].toUpperCase() + x.short.slice(1))}${st ? `<span class="pair">${st.n}</span>` : ''}</button>`; }).join('');
    const answers = S.left.map((x) => S.status[x.id] ? S.status[x.id].ok : undefined);
    let fb = '';
    if (S.msg) fb = `<div class="feedback ${S.msg.ok ? 'good' : 'bad'}" role="status"><span class="ic">${S.msg.ok ? I.check : I.x}</span><div><h3>${S.msg.ok ? 'Correct match!' : 'Not a match.'}</h3><p>${S.msg.text}</p></div></div>`;
    return `${sign(l, 'Match-Up', `${done} / ${S.board.length}`)}
    <div class="qwrap">${miniline(S.board.length, done, answers)}
      <div class="qcard"><span class="qtype">Match-Up</span><p class="qtext">${S.sel ? 'Now tap the meaning that matches.' : 'Tap an idiom, then tap its meaning.'}</p>
        <div class="match"><div class="mcol"><h3>Idioms</h3>${L}</div><div class="mcol"><h3>Meanings</h3>${R}</div></div>${fb}</div>
      ${done === S.board.length ? `<div class="qnav"><button class="btn line" data-act="mfinish">See my score ${I.arrowR}</button></div>` : ''}
    </div>`;
  }
  function matchPick(side, id) {
    S.flash = null;
    if (side === 'L') { S.sel = S.sel === id ? null : id; S.msg = null; rerender(); return; }
    if (!S.sel) { S.msg = { ok: false, text: 'Tap an idiom on the left first, then its meaning.' }; S.flash = id; rerender(); return; }
    const n = Object.keys(S.status).length + 1;
    const a = idiomById[S.sel];
    if (id === S.sel) { S.status[id] = { ok: true, n }; S.msg = { ok: true, text: `“${esc(a.idiom)}” means ${esc(a.meaning)}.` }; }
    else {
      const b = idiomById[id];
      S.status[S.sel] = { ok: false, n }; S.flash = id;
      S.msg = { ok: false, text: `“${esc(a.idiom)}” means <b>${esc(a.short)}</b>. The correct pair is now marked with number ${n}. The meaning you tapped, “${esc(b.short)}”, belongs to a different idiom.` };
    }
    S.sel = null; rerender();
    if (S.flash) setTimeout(() => { const el = document.querySelector('.mitem.flash'); if (el) el.classList.remove('flash'); S.flash = null; }, 900);
    if (Object.keys(S.status).length === S.board.length) focusNext();
  }

  // ───────────────────────────────── quest
  function questOpts() { if (!S._opts || S._optsFor !== S.i) { S._opts = prepOpts(D.quests[S.line].steps[S.i]); S._optsFor = S.i; } return S._opts; }
  function viewQuest() {
    const l = lineById[S.line]; const Q = D.quests[S.line]; const steps = Q.steps; const step = steps[S.i];
    const opts = questOpts(); const right = opts.find((o) => o.correct);
    const pos = (k) => (k / (steps.length - 1)) * 100;
    const at = S.solved ? Math.min(S.i + 1, steps.length - 1) : S.i;
    const stops = steps.map((_, k) => `<span class="stop ${k <= at ? 'on' : ''} ${k === steps.length - 1 ? 'end' : ''}" style="left:${pos(k)}%"></span>`).join('');
    const log = steps.slice(0, S.i).map((s, k) => `<p>${hl(s.text.replace('___', '*' + parseOpt(s.opts[0], 0).text + '*'))}</p>`).join('');
    const fillTxt = hl(step.text).replace('___', S.solved ? `<span class="blank filled">${esc(right.text)}</span>` : '<span class="blank" aria-label="blank"> </span>');
    const optHtml = opts.map((o, i) => {
      const tried = S.tried.includes(i);
      let cls = 'opt', mk = '';
      if (S.solved && o.correct) { cls += ' right'; mk = `<span class="mk">${I.check} Correct</span>`; }
      else if (tried) { cls += ' wrong'; mk = `<span class="mk">${I.x} Try again</span>`; }
      else if (S.solved) cls += ' dim';
      return `<button class="${cls}" data-act="pick" data-i="${i}" ${S.solved || tried ? 'disabled' : ''}><span class="key">${KEYS[i]}</span><span>${esc(o.text)}</span>${mk}</button>`;
    }).join('');
    let fb = '';
    if (S.solved) fb = `<div class="feedback good" role="status"><span class="ic">${I.check}</span><div><h3>${S.tried.length ? 'That’s it. All aboard!' : 'Correct! All aboard!'}</h3><p>${esc(step.ex)}</p></div></div>`;
    else if (S.tried.length) { const o = opts[S.tried[S.tried.length - 1]]; const m = idiomById[o.id]; fb = `<div class="feedback bad" role="status"><span class="ic">${I.x}</span><div><h3>The doors won’t close yet.</h3><p>“${esc(m.idiom)}” means ${esc(m.meaning)}. That doesn’t fit here. Read the story again and try another idiom.</p></div></div>`; }
    return `${sign(l, 'Quest · ' + Q.title, `Stop ${S.i + 1} / ${steps.length}`)}
    <div class="qwrap">
      ${S.i === 0 && !S.tried.length && !S.solved ? `<p class="quest-intro">${esc(Q.intro)} You must choose the right idiom before the train can leave each stop.</p>` : ''}
      <div class="qtrack" aria-hidden="true"><div class="rail"><i style="width:${pos(at)}%"></i></div>${stops}<span class="train" style="left:${pos(at)}%"><i></i><i></i><i></i></span></div>
      ${log ? `<div class="log">${log}</div>` : ''}
      <div class="qcard"><span class="qtype">Stop ${S.i + 1}</span><p class="story">${fillTxt}</p><p class="qtext">Which idiom keeps the story moving?</p><div class="opts">${optHtml}</div>${fb}</div>
      ${S.solved ? `<div class="qnav"><button class="btn line" data-act="qnext">${S.i === steps.length - 1 ? 'Arrive at the terminus' : 'Ride to the next stop'} ${I.arrowR}</button></div>` : ''}
    </div>`;
  }
  function questPick(i) {
    const o = questOpts()[i];
    if (S.tried.includes(i)) return;
    if (o.correct) { S.solved = true; S.first[S.i] = S.tried.length === 0; rerender(); focusNext(); }
    else {
      S.tried.push(i); rerender();
      const b = document.querySelector(`.opt[data-i="${i}"]`); if (b) b.classList.add('shake');
    }
  }
  function questNext() {
    const n = D.quests[S.line].steps.length;
    if (S.i < n - 1) { S.i++; S.tried = []; S.solved = false; render(); const c = document.querySelector('.qcard'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    else { S.done = true; S.score = S.first.filter(Boolean).length; S.total = n; S.rec = recordBest(`${S.line}:quest`, S.score, n); render(); window.scrollTo(0, 0); }
  }
  function viewQuestResult() {
    const l = lineById[S.line]; const Q = D.quests[S.line];
    const nextLine = D.lines[D.lines.findIndex((x) => x.id === S.line) + 1];
    const best = store.best[`${S.line}:quest`];
    return `${sign(l, 'End of the line', '')}
    <div class="result"><div class="result-top"><div class="big-score">${S.score}<small>/${S.total}</small></div><div><h2>${esc(Q.outro)}</h2><p>Stops cleared on the first try. ${S.rec.isNew ? 'New best saved.' : `Best: ${best.s}/${best.t}.`}</p></div></div>
      <div class="result-body"><div class="log">${Q.steps.map((s) => `<p>${hl(s.text.replace('___', '*' + parseOpt(s.opts[0], 0).text + '*'))}</p>`).join('')}</div>
      <div class="btn-row">
        <button class="btn" data-act="station" data-line="${l.id}" data-k="quest">${I.redo} Ride again</button>
        ${nextLine && !isLocked(nextLine.id, 'lesson') ? `<button class="btn line" data-act="station" data-line="${nextLine.id}" data-k="lesson">Transfer to Line ${nextLine.n} ${I.arrowR}</button>` : !FREE ? `<button class="btn line" data-act="test">Central Station test ${I.arrowR}</button>` : ''}
        <button class="btn ghost" data-act="home">Route map</button>
      </div></div></div>`;
  }

  // ───────────────────────────────── test
  function viewTestStart() {
    const tb = store.best.test;
    return `<div class="sign"><span class="roundel" style="background:var(--paper);color:var(--ink)">C</span><div class="sign-t"><small>All five lines</small><h1>Central Station · Final Test</h1></div><button class="back" data-act="home">← Map</button></div>
    <div class="start-card">
      <div class="facts"><div><b>${TEST_N * 5}</b><span>questions, ${TEST_N} from every line</span></div><div><b>${TEST_SECONDS / 60}:00</b><span>minutes on the clock</span></div><div><b>${tb ? `${tb.s}/${tb.t}` : '—'}</b><span>your best score</span></div></div>
      <p style="margin:0">Each answer is checked right away with a short explanation. When you finish, you’ll see your score, the lines to review, and every question you missed. <b>Take it again</b> for a new set of questions.</p>
      <div class="btn-row"><button class="btn primary" data-act="tstart">Start the clock ${I.arrowR}</button><button class="btn ghost" data-act="home">Not yet</button></div>
    </div>`;
  }
  function startTest() {
    let items = [];
    D.lines.forEach((l) => {
      const pool = D.test.filter((q) => q.line === l.id);
      const fresh = shuffle(pool.filter((q) => !lastTestIds.has(q.id)));
      const used = shuffle(pool.filter((q) => lastTestIds.has(q.id)));
      items = items.concat(fresh.concat(used).slice(0, TEST_N));
    });
    items = shuffle(items).map((q) => Object.assign({}, q, { _opts: prepOpts(q) }));
    lastTestIds = new Set(items.map((q) => q.id));
    const s = { mode: 'test-run', items, i: 0, answers: [], picked: null, done: false, started: Date.now(), left: TEST_SECONDS };
    timerId = setInterval(tick, 1000);
    return s;
  }
  function tick() {
    if (S.mode !== 'test-run' || S.done) { clearInterval(timerId); timerId = null; return; }
    S.left = Math.max(0, TEST_SECONDS - Math.floor((Date.now() - S.started) / 1000));
    const t = document.querySelector('.timer'); if (t) { t.lastChild.textContent = fmtTime(S.left); t.classList.toggle('low', S.left <= 60); }
    if (S.left <= 0) finishTest(true);
  }
  function viewTestQ() {
    const q = S.items[S.i]; const l = lineById[q.line];
    const timer = `<span class="timer ${S.left <= 60 ? 'low' : ''}" role="timer" aria-label="Time left">${I.clock}<span>${fmtTime(S.left)}</span></span>`;
    return `<div class="sign" style="background:var(--ink);color:var(--paper)"><span class="roundel" style="background:var(--paper);color:var(--ink)">C</span><div class="sign-t"><small>Final Test · question ${S.i + 1} of ${S.items.length}</small><h1>Central Station</h1></div>${timer}</div>
    <div class="qwrap">${miniline(S.items.length, S.i, S.answers.map((a) => a && a.ok))}
      <div class="qcard" style="${lineStyle(l)}"><span class="linetag"><span class="roundel sm">${l.n}</span>${esc(l.name)}</span><br>${qBody(q, q.type, S.picked)}${optsHtml(q, S.picked)}${S.picked != null ? feedbackHtml(q, S.picked) : ''}</div>
      <div class="qnav">${S.picked != null ? `<button class="btn primary" data-act="tnext">${S.i === S.items.length - 1 ? 'Finish the test' : 'Next question'} ${I.arrowR}</button>` : '<button class="btn ghost" data-act="tquit">End test now</button>'}</div>
    </div>`;
  }
  function testNext() {
    if (S.i < S.items.length - 1) { S.i++; S.picked = null; render(); window.scrollTo(0, 0); }
    else finishTest(false);
  }
  function finishTest(timeout) {
    if (S.done) return;
    clearInterval(timerId); timerId = null;
    S.done = true; S.timeout = timeout;
    S.used = Math.min(TEST_SECONDS, Math.round((Date.now() - S.started) / 1000));
    S.score = S.answers.filter((a) => a && a.ok).length;
    S.rec = recordBest('test', S.score, S.items.length, { time: S.used });
    setLine(null); render(); window.scrollTo(0, 0);
  }
  function viewTestResult() {
    const per = D.lines.map((l) => { const qs = S.items.map((q, i) => [q, S.answers[i]]).filter(([q]) => q.line === l.id); return { l, s: qs.filter(([, a]) => a && a.ok).length, t: qs.length }; });
    const weak = per.filter((p) => p.s / p.t < 0.75);
    const missed = S.items.map((q, i) => [q, S.answers[i]]).filter(([, a]) => !a || !a.ok);
    const pct = Math.round((S.score / S.items.length) * 100);
    const best = store.best.test;
    const head = pct >= 90 ? 'Idiom expert!' : pct >= 75 ? 'Great ride.' : pct >= 50 ? 'Halfway there.' : 'Keep riding.';
    const qline = (q) => q.type === 'situation' ? q.text : q.type === 'meaning' ? `What does “${markedPhrase(q.text)}” mean? ${plain(q.text)}` : plain(q.text);
    return `<div class="result" style="--line:#1B1B1F;--line-ink:#F6F1E7">
      <div class="result-top"><div class="big-score">${S.score}<small>/${S.items.length}</small></div>
        <div><h2>${head}</h2><p>${S.timeout ? 'Time ran out. Unanswered questions count as missed. ' : ''}Time used: ${fmtTime(S.used)}. ${S.rec.isNew ? 'New best score saved.' : `Best: ${best.s}/${best.t}.`}</p></div></div>
      <div class="result-body">
        <div class="bars">${per.map((p) => `<div class="barrow" style="${lineStyle(p.l)}"><span class="roundel sm">${p.l.n}</span><span>${esc(p.l.name)}</span><span class="bt"><i style="width:${(p.s / p.t) * 100}%"></i></span><b>${p.s}/${p.t}</b></div>`).join('')}</div>
        <div><h3 style="margin:0 0 .5rem">${weak.length ? 'Lines to review' : 'Every line at 75% or better.'}</h3>
          ${weak.length ? `<div class="todo">${weak.map((p) => `<button style="${lineStyle(p.l)}" data-act="station" data-line="${p.l.id}" data-k="lesson"><span class="roundel sm">${p.l.n}</span>${esc(p.l.name)} lesson</button>`).join('')}</div>` : '<p style="margin:0">Try the test again for a new set of questions.</p>'}</div>
        <div class="btn-row"><button class="btn primary" data-act="tstart">${I.redo} New test (new questions)</button><button class="btn ghost" data-act="home">Route map</button></div>
        ${missed.length ? `<div class="review"><h3>Questions to look at again (${missed.length})</h3><ol>${missed.map(([q, a]) => { const r = q._opts.find((o) => o.correct); return `<li>${esc(qline(q))}<span class="ans">${a ? `<span class="no">${esc(a.chosen)}</span>` : '<span class="no">No answer</span>'}<span class="yes">${I.check.replace('<svg', '<svg style="width:1em;height:1em;vertical-align:-2px"')} ${esc(r.text)}</span></span></li>`; }).join('')}</ol></div>` : ''}
      </div></div>`;
  }

  // ───────────────────────────────── modal
  function modal(html) { $modal.innerHTML = `<div class="modal-bg" data-act="mclose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const b = $modal.querySelector('.modal .btn'); if (b) b.focus(); }
  function closeModal() { $modal.innerHTML = ''; }
  function lockedModal() {
    modal(`<h2>Full version stop</h2><p>This stop is part of the full <b>Idiom Quest</b>. The full version includes:</p>
      <ul><li>All 5 lines and 60 idioms with flip cards and audio</li><li>Story Clues, Dialogue, Match-Up and Right Situation for every line</li><li>5 story quests</li><li>A timed final test with new questions every try</li></ul>
      <p>Look for <b>Idiom Quest</b> in the Bright EngMath store on Teachers Pay Teachers.</p>
      <div class="btn-row"><button class="btn primary" data-act="mclose">Back to the free sample</button></div>`);
  }

  // ───────────────────────────────── events
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act;
    if (a === 'mclose') { if (e.target === t || t.classList.contains('btn')) closeModal(); return; }
    if (t.disabled) return;
    switch (a) {
      case 'home': go('home'); break;
      case 'big': store.big = !store.big; save(); document.documentElement.classList.toggle('big', store.big); rerender(); break;
      case 'reset':
        modal(`<h2>Reset progress?</h2><p>This clears every best score and lesson card on this device. Use it before a new student or class.</p><div class="btn-row"><button class="btn primary" data-act="doreset">Reset</button><button class="btn ghost" data-act="mclose">Cancel</button></div>`); break;
      case 'doreset': store = Object.assign(blank(), { big: store.big }); save(); closeModal(); go('home'); break;
      case 'locked': lockedModal(); break;
      case 'station': {
        const { line, k } = t.dataset;
        if (isLocked(line, k)) { lockedModal(); break; }
        if (k === 'lesson') go('lesson', line, 0); else if (k === 'quest') go('quest', line); else go('practice', line, k);
        break;
      }
      case 'flip': S.flipped = !S.flipped; document.querySelector('.card3d').classList.toggle('flipped', S.flipped); markSeenIfFlipped(); refreshStrip(); break;
      case 'card': S.i = +t.dataset.i; S.flipped = false; rerender(); break;
      case 'prev': if (S.i > 0) { S.i--; S.flipped = false; rerender(); } break;
      case 'next': S.i++; S.flipped = false; rerender(); break;
      case 'say': { const c = lineIdioms(S.line)[S.i]; speak(t.dataset.what === 'idiom' ? c.idiom : c.example, t); break; }
      case 'pick': pick(+t.dataset.i); break;
      case 'pnext': practiceNext(); break;
      case 'mleft': matchPick('L', t.dataset.id); break;
      case 'mright': matchPick('R', t.dataset.id); break;
      case 'mfinish': finishPractice(Object.values(S.status).filter((x) => x.ok).length, S.board.length); break;
      case 'qnext': questNext(); break;
      case 'test': if (FREE) lockedModal(); else go('test'); break;
      case 'tstart': go('test-run'); break;
      case 'tnext': testNext(); break;
      case 'tquit': modal(`<h2>End the test now?</h2><p>Questions you haven’t answered will count as missed.</p><div class="btn-row"><button class="btn primary" data-act="tend">End test</button><button class="btn ghost" data-act="mclose">Keep going</button></div>`); break;
      case 'tend': closeModal(); finishTest(false); break;
    }
  });
  function refreshStrip() {
    const seen = new Set(store.seen[S.line] || []);
    document.querySelectorAll('.cardstrip button').forEach((b, i) => b.classList.toggle('seen', seen.has(lineIdioms(S.line)[i].id)));
    const c = document.querySelector('.card3d'); if (c) c.setAttribute('aria-label', S.flipped ? 'Show the idiom side' : 'Flip to see the real meaning');
    document.querySelector('.front-f').setAttribute('aria-hidden', S.flipped); document.querySelector('.back-f').setAttribute('aria-hidden', !S.flipped);
  }
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($modal.innerHTML) { if (e.key === 'Escape') closeModal(); return; }
    const k = e.key;
    if (S.mode === 'lesson') {
      if (k === 'ArrowRight' && S.i < 11) { S.i++; S.flipped = false; rerender(); }
      else if (k === 'ArrowLeft' && S.i > 0) { S.i--; S.flipped = false; rerender(); }
      else if ((k === ' ' || k === 'Enter') && (e.target === document.body || e.target.classList.contains('card3d'))) { e.preventDefault(); document.querySelector('.card3d').click(); }
      return;
    }
    if (['practice', 'test-run', 'quest'].includes(S.mode) && !S.done && S.kind !== 'match') {
      const idx = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 }[k.toLowerCase()];
      if (idx != null) { const b = document.querySelector(`.opt[data-i="${idx}"]:not(:disabled)`); if (b) { e.preventDefault(); b.click(); } }
    }
  });

  document.documentElement.classList.toggle('big', !!store.big);
  window.__IQ = { get state() { return S; }, go, data: D, store: () => store, free: FREE, finishTest: () => finishTest(true) };
  render();
})();
</script>
</body>
</html>
