  questions: [
    { c:`g`, t:`Present Perfect`, q:`Look! Somebody ___ the window. There is broken glass everywhere.`,
      o:[`broke`,`has broken`,`was breaking`,`breaks`], a:1,
      e:`Present Perfect ใช้กับเหตุการณ์ที่ <b>ผลยังเห็นอยู่ในปัจจุบัน</b> — เศษกระจก “everywhere” ยังอยู่ตรงหน้า และไม่ได้ระบุเวลาในอดีต → <b>has broken</b><br>ถ้ามีเวลาชัดเจน เช่น yesterday จึงจะใช้ broke`,
      ee:`The Present Perfect is used when <b>the result can still be seen now</b> — the broken glass is still “everywhere” in front of us, and no past time is given → <b>has broken</b><br>Use broke only when there is a clear past time, e.g. yesterday` },
    { c:`g`, t:`Past Simple vs Past Continuous`, q:`The children were swimming in the sea when they ___ a shark.`,
      o:[`were seeing`,`see`,`have seen`,`saw`], a:3,
      e:`กำลังว่ายน้ำอยู่ (Past Continuous) แล้ว <b>เห็นฉลาม</b> แทรกขึ้นมา → เหตุการณ์ที่แทรกใช้ <b>Past Simple</b> → <b>saw</b><br>see เป็นกริยาที่ไม่นิยมใช้รูป -ing ในความหมาย “มองเห็น”`,
      ee:`The children were in the middle of swimming (Past Continuous) when <b>seeing the shark</b> interrupted them → the interrupting action uses the <b>Past Simple</b> → <b>saw</b><br>We don’t usually use see in the -ing form when it means “notice with your eyes”` },
    { c:`g`, t:`Passive Voice`, q:`A lot of trees ___ down every year to make paper.`,
      o:[`cut`,`are cut`,`are cutting`,`cutting`], a:1,
      e:`ต้นไม้ <b>ถูกตัด</b> → Passive · every year = Present Simple · trees เป็นพหูพจน์ → <b>are + V.3</b><br>cut เป็นกริยาที่ 3 ช่องเหมือนกัน (cut – cut – cut) → <b>are cut</b>`,
      ee:`Trees <b>are cut</b> by people → Passive · every year = Present Simple · trees is plural → <b>are + V.3</b><br>cut has the same form in all 3 columns (cut – cut – cut) → <b>are cut</b>` },
    { c:`g`, t:`Passive Voice`, q:`Many endangered animals ___ by this organisation since 1990.`,
      o:[`have protected`,`were protecting`,`have been protected`,`protect`], a:2,
      e:`สัตว์ <b>ถูกปกป้อง</b> (มี by this organisation) → Passive และมี <b>since 1990</b> → Present Perfect<br>รวมกันเป็น Present Perfect Passive: <b>have/has + been + V.3</b> → <b>have been protected</b>`,
      ee:`The animals <b>are protected</b> (there is “by this organisation”) → Passive, and <b>since 1990</b> → Present Perfect<br>Put them together → Present Perfect Passive: <b>have/has + been + V.3</b> → <b>have been protected</b>` },
    { c:`g`, t:`Relative Clauses`, q:`Bangkok, ___ is the capital of Thailand, has serious air pollution problems.`,
      o:[`that`,`which`,`who`,`what`], a:1,
      e:`ขยาย Bangkok (สถานที่/สิ่ง) ในประโยคที่มี <b>จุลภาคคั่น</b> (non-defining clause) → ใช้ <b>which</b><br>กฎสำคัญ: <b>ห้ามใช้ that หลังเครื่องหมายจุลภาค</b>`,
      ee:`The clause describes Bangkok (a place/thing) and is <b>separated by commas</b> (a non-defining clause) → use <b>which</b><br>Key rule: <b>never use that after a comma</b>` },
    { c:`g`, t:`Relative Clauses`, q:`We should help the animals ___ homes were destroyed by the forest fire.`,
      o:[`who`,`which`,`whose`,`that`], a:2,
      e:`หลังช่องว่างเป็นคำนาม <b>homes</b> ที่เป็น <b>ของ</b> สัตว์เหล่านั้น → ใช้ <b>whose + คำนาม</b><br>whose ใช้ได้ทั้งกับคน สัตว์ และสิ่งของ`,
      ee:`After the blank comes the noun <b>homes</b>, which <b>belong to</b> the animals → use <b>whose + noun</b><br>whose can be used for people, animals and things` },
    { c:`g`, t:`Conjunctions: ความขัดแย้ง`, q:`___ the bad weather, hundreds of people joined the beach clean-up.`,
      o:[`Although`,`In spite of`,`Because`,`Even though`], a:1,
      e:`อากาศแย่ <b>แต่</b> คนมาร่วมเยอะ → ขัดแย้ง ตัด Because<br>หลังช่องว่างเป็น <b>คำนามวลี</b> (the bad weather) ไม่ใช่ประโยค → <b>In spite of / Despite</b><br>Although / Even though ต้องตามด้วยประโยค เช่น Although the weather was bad`,
      ee:`The weather was bad <b>but</b> many people came → a contrast, so Because is out<br>After the blank is a <b>noun phrase</b> (the bad weather), not a clause → <b>In spite of / Despite</b><br>Although / Even though must be followed by a clause, e.g. Although the weather was bad` },
    { c:`g`, t:`Conjunctions: เหตุผล`, q:`Thousands of fish died ___ the oil spill.`,
      o:[`due to`,`although`,`so`,`however`], a:0,
      e:`น้ำมันรั่วเป็น <b>สาเหตุ</b> ที่ปลาตาย และตามด้วยคำนามวลี → <b>due to + คำนาม</b> (= because of)<br>ตัวลวง: <i>so</i> ใช้นำหน้า <b>ผลลัพธ์</b> ไม่ใช่สาเหตุ`,
      ee:`The oil spill is the <b>cause</b> of the fish dying, and it is followed by a noun phrase → <b>due to + noun</b> (= because of)<br>Trap: <i>so</i> introduces a <b>result</b>, not a cause` },
    { c:`g`, t:`Subject-Verb Agreement`, q:`Neither my parents nor my sister ___ plastic bags when they go shopping.`,
      o:[`use`,`uses`,`using`,`are use`], a:1,
      e:`Neither A nor B → กริยาผันตาม <b>B</b> (ตัวที่อยู่ใกล้กริยา)<br>B = <b>my sister</b> (เอกพจน์) → Present Simple เติม s → <b>uses</b>`,
      ee:`Neither A nor B → the verb agrees with <b>B</b> (the subject closest to the verb)<br>B = <b>my sister</b> (singular) → Present Simple + s → <b>uses</b>` },
    { c:`g`, t:`Comparison`, q:`In Chiang Mai, the air is usually ___ in March than in July because of forest fires.`,
      o:[`bad`,`worse`,`worst`,`more bad`], a:1,
      e:`มี <b>than</b> → ขั้นกว่า และ bad เปลี่ยนรูปพิเศษ: <b>bad → worse → worst</b><br>ไม่มีคำว่า “more bad”`,
      ee:`There is <b>than</b> → comparative form, and bad is irregular: <b>bad → worse → worst</b><br>“more bad” is not a correct form` },

    { c:`v`, t:`Synonyms`, q:`We must <u>reduce</u> the amount of plastic we use every day.<br>The word “reduce” is closest in meaning to ___.`,
      o:[`increase`,`recycle`,`decrease`,`collect`], a:2,
      e:`<b>reduce</b> = ลดลง = <b>decrease</b><br>ตัวลวง: increase (เพิ่ม) ตรงข้าม · recycle (นำกลับมาใช้ใหม่) อยู่ในกลุ่ม 3R เหมือนกันแต่ความหมายต่างกัน`,
      ee:`<b>reduce</b> = make smaller = <b>decrease</b><br>Traps: increase (make bigger) is the opposite · recycle (use again) is also one of the 3Rs, but it has a different meaning` },
    { c:`v`, t:`Antonyms`, q:`Clean water is becoming <u>scarce</u> in some parts of the world.<br>Which word is OPPOSITE in meaning to “scarce”?`,
      o:[`rare`,`limited`,`plentiful`,`dirty`], a:2,
      e:`<b>scarce</b> = ขาดแคลน หายาก → ตรงข้ามคือ <b>plentiful</b> = มีอยู่มากมาย<br>rare, limited มีความหมายใกล้เคียงกับ scarce ส่วน dirty ไม่เกี่ยวกับปริมาณ`,
      ee:`<b>scarce</b> = hard to find, not enough → the opposite is <b>plentiful</b> = more than enough<br>rare and limited have meanings similar to scarce, and dirty is not about amount` },
    { c:`v`, t:`Context Clues`, q:`The forest fire was <u>devastating</u>. It destroyed hundreds of homes and killed many animals.<br>“Devastating” means ___.`,
      o:[`causing great damage`,`very small`,`easy to control`,`beautiful to watch`], a:0,
      e:`ประโยคที่ตามมาบอกผลกระทบ: “<b>destroyed</b> hundreds of homes and <b>killed</b> many animals” → <b>devastating</b> = สร้างความเสียหายร้ายแรง`,
      ee:`The next sentence tells us the effects: “<b>destroyed</b> hundreds of homes and <b>killed</b> many animals” → <b>devastating</b> = causing very serious damage` },
    { c:`v`, t:`Idioms`, q:`Before the English speech contest, my friends smiled and said, “<u>Break a leg!</u>”<br>What did they mean?`,
      o:[`Be careful on the stairs.`,`Good luck!`,`You will fail.`,`Run away quickly.`], a:1,
      e:`<b>Break a leg!</b> = ขอให้โชคดี! ใช้อวยพรก่อนขึ้นแสดงหรือแข่งขัน<br>ห้ามแปลตามตัวอักษรว่า “ขาหัก” — นี่คือกับดักของสำนวน`,
      ee:`<b>Break a leg!</b> = Good luck! People say it before someone performs or competes<br>Don’t translate it word for word as “break your leg” — that’s the idiom trap` },
    { c:`v`, t:`Idioms`, q:`I have a big exam tomorrow, so I need to <u>hit the books</u> tonight.<br>“Hit the books” means ___.`,
      o:[`throw books away`,`study hard`,`buy new books`,`sleep early`], a:1,
      e:`<b>hit the books</b> = ตั้งใจอ่านหนังสืออย่างหนัก<br>บริบท “big exam tomorrow” ช่วยยืนยันความหมาย`,
      ee:`<b>hit the books</b> = study very hard<br>The context “big exam tomorrow” confirms the meaning` },
    { c:`v`, t:`Word Forms`, q:`We need to protect the ___ for future generations.`,
      o:[`environmental`,`environment`,`environmentally`,`environmentalist`], a:1,
      e:`หลัง <b>the</b> และเป็นกรรมของ protect → ต้องเป็นคำนาม → environment หรือ environmentalist<br>สิ่งที่ต้องปกป้องเพื่อคนรุ่นหลังคือ <b>สิ่งแวดล้อม (environment)</b> ไม่ใช่นักอนุรักษ์ (environmentalist)`,
      ee:`After <b>the</b>, and as the object of protect → we need a noun → environment or environmentalist<br>What we protect for future generations is <b>the environment</b>, not a person who protects nature (environmentalist)` },
    { c:`v`, t:`Word Forms`, q:`The ___ of electricity in Thailand increases every summer.`,
      o:[`consume`,`consumption`,`consumer`,`consuming`], a:1,
      e:`หลัง The ต้องเป็นคำนาม → consumption หรือ consumer<br>“การใช้/การบริโภค” ไฟฟ้าเพิ่มขึ้น → <b>consumption</b> (n. สิ่ง/การกระทำ)<br>consumer = ผู้บริโภค (คน) ไม่เข้ากับ “of electricity”`,
      ee:`After The we need a noun → consumption or consumer<br>The “use” of electricity increases → <b>consumption</b> (n. the act of using)<br>consumer = a person who uses or buys things, which doesn’t fit “of electricity”` },

    { c:`c`, t:`Asking for Help`, q:`You want to borrow a pen from a classmate you don’t know well. Which is the MOST polite?`,
      o:[`Give me your pen.`,`I want your pen now.`,`Could I possibly borrow your pen?`,`Pen, please.`], a:2,
      e:`<b>Could I possibly…?</b> เป็นรูปแบบการขออนุญาตที่สุภาพที่สุดในตัวเลือก (could + possibly เพิ่มความสุภาพ)<br>ข้ออื่นเป็นคำสั่งหรือห้วนเกินไป`,
      ee:`<b>Could I possibly…?</b> is the most polite way to ask for permission among the choices (could + possibly makes it extra polite)<br>The other choices are orders or too short and rude` },
    { c:`c`, t:`Responding to Offers`, q:`A: Can I help you carry those boxes?<br>B: ___ I can manage by myself.`,
      o:[`That’s very kind of you, but`,`Yes, of course.`,`Go away.`,`Here you are.`], a:0,
      e:`“I can manage by myself” = ฉันทำเองได้ → B <b>ปฏิเสธ</b> ความช่วยเหลือ<br>วิธีปฏิเสธอย่างสุภาพ: ขอบคุณก่อน แล้วค่อยปฏิเสธ → <b>That’s very kind of you, but…</b><br><i>Go away</i> หยาบคาย, <i>Yes, of course</i> ขัดกับประโยคที่ตามมา`,
      ee:`“I can manage by myself” = I can do it alone → B <b>refuses</b> the help<br>To refuse politely, say thank you first, then refuse → <b>That’s very kind of you, but…</b><br><i>Go away</i> is rude, and <i>Yes, of course</i> doesn’t match the next sentence` },
    { c:`c`, t:`Apologies & Excuses`, q:`Teacher: Why didn’t you hand in your homework, Ploy?<br>Ploy: ___`,
      o:[`It’s not my problem.`,`You’re welcome, teacher.`,`I’m sorry. I left it at home. Can I bring it tomorrow?`,`I don’t like homework.`], a:2,
      e:`คำตอบที่เหมาะสม = <b>ขอโทษ + บอกเหตุผล + เสนอทางแก้</b><br>“I’m sorry. I left it at home. Can I bring it tomorrow?” ครบทั้งสามส่วน`,
      ee:`A good answer = <b>say sorry + give a reason + offer a solution</b><br>“I’m sorry. I left it at home. Can I bring it tomorrow?” has all three parts` },
    { c:`c`, t:`Giving Directions`, q:`A: Is there a pharmacy near here?<br>B: Yes. Walk past the school, and it’s ___ your right.`,
      o:[`on`,`at`,`in`,`by`], a:0,
      e:`สำนวนบอกตำแหน่งข้าง: <b>on your right / on your left</b> = อยู่ทางขวา/ซ้ายมือของคุณ`,
      ee:`To say which side something is on: <b>on your right / on your left</b>` },
    { c:`c`, t:`Expressing Opinions`, q:`A: We should stop giving out plastic bags in supermarkets.<br>B: ___ It’s one of the best ways to reduce waste.`,
      o:[`I couldn’t agree more.`,`I’m not so sure about that.`,`I’m afraid I disagree.`,`That’s a terrible idea.`], a:0,
      e:`B ให้เหตุผลสนับสนุน (ช่วยลดขยะ) → <b>เห็นด้วย</b><br><b>I couldn’t agree more.</b> = เห็นด้วยอย่างยิ่ง (แปลตรงตัวว่า “ฉันเห็นด้วยมากกว่านี้ไม่ได้แล้ว”)<br>กับดัก: มีคำว่า couldn’t ทำให้หลายคนคิดว่าเป็นการปฏิเสธ`,
      ee:`B gives a reason to support the idea (it reduces waste) → B <b>agrees</b><br><b>I couldn’t agree more.</b> = I agree completely (literally, “it’s impossible for me to agree more”)<br>Trap: the word couldn’t makes many students think it is a disagreement` },

    { c:`r`, p:`A`, t:`Detail`, q:`Why are coral reefs called “the rainforests of the sea”?`,
      o:[`They are full of green plants.`,`They cover most of the ocean floor.`,`Many different animals live there.`,`They are found near rainforests.`], a:2,
      e:`ประโยคถัดไปอธิบายว่า “they are <b>home to about a quarter of all ocean animals</b>” → มีสิ่งมีชีวิตหลากหลายมากเหมือนป่าฝน<br>ตัวลวง: แนวปะการังครอบคลุมพื้นที่ <b>น้อยกว่า 1%</b> ไม่ใช่ส่วนใหญ่`,
      ee:`The next sentence explains that “they are <b>home to about a quarter of all ocean animals</b>” → many different living things, just like a rainforest<br>Trap: coral reefs cover <b>less than 1%</b> of the ocean floor, not most of it` },
    { c:`r`, p:`A`, t:`Pronoun Reference`, q:`In the sentence “<u>Without them</u>, the corals turn white,” the word “them” refers to ___.`,
      o:[`the corals`,`the algae`,`ocean animals`,`scientists`], a:1,
      e:`ประโยคก่อนหน้า: “the corals push <b>the algae</b> out” → เมื่อไม่มีสาหร่าย ปะการังจึงเป็นสีขาว<br>สอดคล้องกับย่อหน้าแรกที่บอกว่าสาหร่ายให้ “<b>their beautiful colours</b>”`,
      ee:`The sentence before says: “the corals push <b>the algae</b> out” → without the algae, the corals turn white<br>This matches the first paragraph, which says the algae give the corals “<b>their beautiful colours</b>”` },
    { c:`r`, p:`A`, t:`Main Idea`, q:`What is Passage A mainly about?`,
      o:[`How to choose good sunscreen`,`The history of rainforests`,`What coral bleaching is and why it happens`,`Different kinds of algae`], a:2,
      e:`ย่อหน้าแรกปูพื้นว่าปะการังคืออะไร ย่อหน้าที่สองอธิบาย <b>coral bleaching</b> สาเหตุ และวิธีป้องกัน → ใจความหลักคือ “ปะการังฟอกขาวคืออะไรและเกิดจากอะไร”<br>ครีมกันแดดเป็นเพียง <b>รายละเอียดย่อย</b>`,
      ee:`Paragraph 1 explains what corals are, and paragraph 2 explains <b>coral bleaching</b>, its cause and how to prevent it → the main idea is “what coral bleaching is and why it happens”<br>Sunscreen is only a <b>minor detail</b>` },
    { c:`r`, p:`A`, t:`Inference`, q:`What would most likely happen if ocean temperatures keep rising?`,
      o:[`Corals would get more colourful.`,`More corals would turn white and die.`,`Algae would grow faster inside corals.`,`Fish would move to rainforests.`], a:1,
      e:`บทความบอกว่าเมื่อทะเล <b>อุ่นเกินไป</b> ปะการังจะขับสาหร่ายออก → ขาว → ถ้าน้ำไม่เย็นลงก็อาจตาย<br>ถ้าอุณหภูมิสูงขึ้นเรื่อย ๆ จึงอนุมานได้ว่า <b>ปะการังจะฟอกขาวและตายมากขึ้น</b>`,
      ee:`The article says that when the sea gets <b>too warm</b>, corals push out the algae → they turn white → if the water doesn’t cool down, they may die<br>So if temperatures keep rising, we can infer that <b>more corals will bleach and die</b>` },
    { c:`r`, p:`B`, t:`Purpose`, q:`What is the main purpose of this notice?`,
      o:[`To sell beach hats and sunscreen`,`To invite people to help clean the beach`,`To tell people the beach is closed`,`To advertise a breakfast restaurant`], a:1,
      e:`หัวประกาศ “<b>Volunteers wanted!</b>” และ “Beach Clean-Up Day” → จุดประสงค์คือ <b>เชิญชวนอาสาสมัคร</b> มาช่วยเก็บขยะ<br>อาหารเช้าและหมวกเป็นเพียงรายละเอียด`,
      ee:`The headings “<b>Volunteers wanted!</b>” and “Beach Clean-Up Day” → the purpose is to <b>invite volunteers</b> to help collect rubbish<br>Breakfast and hats are only details` },
    { c:`r`, p:`B`, t:`Detail`, q:`What do volunteers NOT need to bring?`,
      o:[`A hat`,`Gloves`,`Sunscreen`,`A water bottle`], a:1,
      e:`ในหัวข้อ “<b>We provide</b>” (ผู้จัดเตรียมให้) มี <b>gloves</b> and rubbish bags → ไม่ต้องนำมาเอง<br>หมวก ขวดน้ำ ครีมกันแดด อยู่ในหัวข้อ “Please bring”`,
      ee:`Under “<b>We provide</b>” (things the organisers give you) are <b>gloves</b> and rubbish bags → you don’t need to bring them<br>A hat, a water bottle and sunscreen are under “Please bring”` },
    { c:`r`, p:`B`, t:`Detail`, q:`Where should volunteers meet?`,
      o:[`In Room 204`,`At a breakfast restaurant`,`In the car park next to the Sea Turtle Statue`,`In front of the school`], a:2,
      e:`ประกาศระบุ “<b>Meeting point</b>: the car park next to the Sea Turtle Statue”<br>กับดัก: <b>Room 204</b> คือสถานที่ <b>ลงทะเบียน</b> ไม่ใช่จุดนัดพบ`,
      ee:`The notice says “<b>Meeting point</b>: the car park next to the Sea Turtle Statue”<br>Trap: <b>Room 204</b> is where you <b>register</b>, not where you meet` },
    { c:`r`, p:`B`, t:`Inference`, q:`Which student will NOT be able to join the event?`,
      o:[`Fah, who registered on 1 November`,`Golf, who registered on 12 November`,`Ice, who registered on 9 November`,`Jay, who brought his own gloves`], a:1,
      e:`ต้องลงทะเบียน <b>before 10 November</b> (ก่อนวันที่ 10)<br>Golf ลงทะเบียนวันที่ <b>12</b> ซึ่งเลยกำหนด → เข้าร่วมไม่ได้<br>Jay นำถุงมือมาเองไม่ผิดกฎ เพียงแต่ไม่จำเป็น`,
      ee:`You must register <b>before 10 November</b><br>Golf registered on the <b>12th</b>, which is too late → he can’t join<br>Jay bringing his own gloves breaks no rule — it just isn’t necessary` }
  ]
});

</script>

      title: `More Than a Water Fight`,
      html: `<p>Songkran, the Thai New Year festival, is celebrated from 13 to 15 April. In December 2023, UNESCO added it to its list of the world’s Intangible Cultural Heritage. Today, many tourists think of Songkran as a giant water fight. However, the festival has much deeper meanings.</p>
<p>Traditionally, young people pour scented water over the hands of their elders to show respect and to ask for blessings. Families also visit temples and make merit together. Because many people travel back to their hometowns, Songkran is also a time for family reunions. Some older people worry that the true spirit of the festival is being forgotten. They hope that young people will remember its traditions while they enjoy the fun.</p>`

  questions: [
    { c:`g`, t:`Present Perfect`, q:`Somchai has been my best friend ___ ten years.`,
      o:[`since`,`for`,`ago`,`during`], a:1,
      e:`<b>for + ระยะเวลา</b> (ten years, two months)<br><b>since + จุดเริ่มต้น</b> (2015, last Monday)<br>ago ใช้กับ Past Simple เช่น ten years ago`,
      ee:`<b>for + a length of time</b> (ten years, two months)<br><b>since + a starting point</b> (2015, last Monday)<br>ago is used with the Past Simple, e.g. ten years ago` },
    { c:`g`, t:`Past Continuous`, q:`A: What ___ you doing at 8 p.m. last night?<br>B: I was reading a comic book.`,
      o:[`did`,`are`,`were`,`have`], a:2,
      e:`ถามถึงสิ่งที่ <b>กำลังทำอยู่ ณ เวลาหนึ่งในอดีต</b> (8 p.m. last night) → Past Continuous: <b>was/were + V-ing</b><br>ประธาน you → <b>were</b> และคำตอบของ B ก็ใช้ was reading ยืนยัน`,
      ee:`The question asks what someone <b>was in the middle of doing at a time in the past</b> (8 p.m. last night) → Past Continuous: <b>was/were + V-ing</b><br>The subject is you → <b>were</b>, and B’s answer “was reading” confirms it` },
    { c:`g`, t:`Comparison`, q:`Today is ___ day of the year. It’s 40 degrees outside!`,
      o:[`hotter`,`the hottest`,`the most hot`,`hottest`], a:1,
      e:`เปรียบเทียบกับ “ทุกวันในปี” → ขั้นสูงสุด ต้องมี <b>the</b> นำหน้าเสมอ<br>hot เป็นคำพยางค์เดียว สระเดี่ยว + ตัวสะกดเดี่ยว → ซ้ำตัวสะกด: hot → <b>hotter → hottest</b>`,
      ee:`Comparing with “every day of the year” → superlative, which always needs <b>the</b><br>hot has one syllable with one vowel + one final consonant → double the last letter: hot → <b>hotter → hottest</b>` },
    { c:`g`, t:`Passive Voice`, q:`Songkran ___ in April every year.`,
      o:[`celebrates`,`celebrated`,`is celebrating`,`is celebrated`], a:3,
      e:`เทศกาลสงกรานต์ <b>ถูกจัด/ถูกเฉลิมฉลอง</b> โดยผู้คน → Passive<br>every year = Present Simple → <b>is + V.3</b> → <b>is celebrated</b>`,
      ee:`Songkran <b>is celebrated</b> by people → Passive<br>every year = Present Simple → <b>is + V.3</b> → <b>is celebrated</b>` },
    { c:`g`, t:`Passive Voice`, q:`A: When ___ the Grand Palace built?<br>B: In 1782.`,
      o:[`did`,`was`,`is`,`has`], a:1,
      e:`พระบรมมหาราชวัง <b>ถูกสร้าง</b> → Passive ในอดีต (In 1782) → <b>was + V.3</b><br>รูปคำถาม: <b>When + was + ประธาน + V.3?</b><br>ตัวลวง: <i>did</i> ต้องตามด้วยกริยาช่อง 1 (When did they build…?)`,
      ee:`The Grand Palace <b>was built</b> → Passive in the past (In 1782) → <b>was + V.3</b><br>Question form: <b>When + was + subject + V.3?</b><br>Trap: <i>did</i> must be followed by the base verb (When did they build…?)` },
    { c:`g`, t:`Relative Clauses`, q:`This is the most delicious mango sticky rice ___ I have ever eaten.`,
      o:[`who`,`whom`,`that`,`whose`], a:2,
      e:`ขยายสิ่งของ (mango sticky rice) ที่มี <b>ขั้นสูงสุด</b> (the most delicious) นำหน้า → นิยมใช้ <b>that</b><br>หลัง superlative, all, everything, the first/only มักใช้ that`,
      ee:`The clause describes a thing (mango sticky rice) after a <b>superlative</b> (the most delicious) → we usually use <b>that</b><br>After superlatives, all, everything, the first/only, we usually use that` },
    { c:`g`, t:`Relative Clauses`, q:`The teacher to ___ I gave my homework was Ms. Suda.`,
      o:[`who`,`whom`,`which`,`that`], a:1,
      e:`เมื่อมี <b>บุพบท (to, with, for) อยู่หน้า</b> relative pronoun ที่หมายถึงคน ต้องใช้ <b>whom</b> เท่านั้น<br>ห้ามใช้ to who หรือ to that`,
      ee:`When a <b>preposition (to, with, for) comes before</b> a relative pronoun for a person, you must use <b>whom</b> only<br>Never say to who or to that` },
    { c:`g`, t:`Conjunctions: ความขัดแย้ง`, q:`___ Ploy is only eleven, she can speak three languages.`,
      o:[`Despite`,`In spite of`,`However`,`Even though`], a:3,
      e:`อายุแค่ 11 <b>แต่</b> พูดได้ 3 ภาษา → ขัดแย้ง และหลังช่องว่างเป็น <b>ประโยค</b> (Ploy is only eleven) → <b>Even though</b> / Although<br>Despite / In spite of ต้องตามด้วยคำนาม · However ใช้เชื่อมสองประโยคแยกกัน`,
      ee:`She is only 11 <b>but</b> speaks 3 languages → a contrast, and after the blank is a <b>clause</b> (Ploy is only eleven) → <b>Even though</b> / Although<br>Despite / In spite of must be followed by a noun · However links two separate sentences` },
    { c:`g`, t:`Conjunctions: เหตุผล`, q:`___ my teacher’s help, I passed the exam with a high score.`,
      o:[`Thanks to`,`Because`,`Therefore`,`Although`], a:0,
      e:`ความช่วยเหลือของครูเป็น <b>สาเหตุในทางดี</b> ที่ทำให้สอบผ่าน + ตามด้วยคำนามวลี → <b>Thanks to</b> (ขอบคุณ… / เพราะได้…)<br>Because ต้องตามด้วยประโยค · Therefore ใช้นำผลลัพธ์`,
      ee:`The teacher’s help is a <b>good cause</b> that led to passing the exam + it is followed by a noun phrase → <b>Thanks to</b> (because of someone’s help)<br>Because must be followed by a clause · Therefore introduces a result` },
    { c:`g`, t:`Subject-Verb Agreement`, q:`One of my friends ___ a YouTube channel about Thai cooking.`,
      o:[`have`,`has`,`are having`,`were having`], a:1,
      e:`โครงสร้าง <b>One of + คำนามพหูพจน์</b> → ประธานตัวจริงคือ <b>One</b> (เอกพจน์)<br>→ ใช้ <b>has</b> อย่าหลงผันตาม friends`,
      ee:`Pattern: <b>One of + plural noun</b> → the real subject is <b>One</b> (singular)<br>→ use <b>has</b>; don’t be tricked into matching friends` },

    { c:`v`, t:`Synonyms`, q:`The night market was extremely <u>crowded</u>. We could hardly walk.<br>The word “crowded” is closest in meaning to ___.`,
      o:[`empty`,`packed`,`quiet`,`cheap`], a:1,
      e:`<b>crowded</b> = แออัด คนเยอะ = <b>packed</b><br>เบาะแส: “We could hardly walk” (แทบเดินไม่ได้)`,
      ee:`<b>crowded</b> = full of people = <b>packed</b><br>Clue: “We could hardly walk”` },
    { c:`v`, t:`Antonyms`, q:`The museum guide was very <u>polite</u> to all the visitors.<br>Which word is OPPOSITE in meaning to “polite”?`,
      o:[`rude`,`kind`,`helpful`,`gentle`], a:0,
      e:`<b>polite</b> = สุภาพ → ตรงข้ามคือ <b>rude</b> = หยาบคาย<br>kind, helpful, gentle เป็นคำทางบวกเหมือน polite`,
      ee:`<b>polite</b> = having good manners → the opposite is <b>rude</b><br>kind, helpful and gentle are positive words like polite` },
    { c:`v`, t:`Context Clues`, q:`My grandmother is very <u>frugal</u>. She never wastes money and always looks for the lowest prices.<br>“Frugal” means ___.`,
      o:[`careful with money`,`very rich`,`fond of shopping`,`generous with money`], a:0,
      e:`เบาะแส: “<b>never wastes money</b>” และ “<b>looks for the lowest prices</b>” → <b>frugal</b> = มัธยัสถ์ ประหยัด`,
      ee:`Clues: “<b>never wastes money</b>” and “<b>looks for the lowest prices</b>” → <b>frugal</b> = careful with money, saving` },
    { c:`v`, t:`Idioms`, q:`My uncle lives in Canada, so we only see him <u>once in a blue moon</u>.<br>The idiom means ___.`,
      o:[`every month`,`at night`,`very rarely`,`on his birthday`], a:2,
      e:`<b>once in a blue moon</b> = นาน ๆ ครั้ง แทบไม่เคยเลย<br>บริบท: ลุงอยู่แคนาดา จึงเจอกันได้ยาก`,
      ee:`<b>once in a blue moon</b> = very rarely, almost never<br>Context: the uncle lives in Canada, so they rarely see him` },
    { c:`v`, t:`Idioms`, q:`We cancelled the picnic because it was <u>raining cats and dogs</u>.<br>What does this mean?`,
      o:[`It was raining very heavily.`,`Animals were running in the rain.`,`It was raining a little.`,`The weather was sunny.`], a:0,
      e:`<b>rain cats and dogs</b> = ฝนตกหนักมาก<br>บริบท: ต้องยกเลิกปิกนิก แสดงว่าฝนตกหนักจริง`,
      ee:`<b>rain cats and dogs</b> = rain very heavily<br>Context: they had to cancel the picnic, so the rain must have been really heavy` },
    { c:`v`, t:`Word Forms`, q:`Thai people are famous for their ___ towards visitors.`,
      o:[`friendly`,`friendliness`,`friend`,`friendlily`], a:1,
      e:`หลัง <b>their</b> ต้องเป็นคำนาม และความหมายคือ “ความเป็นมิตร” → <b>friendliness</b> (friendly + -ness)<br>กับดัก: <i>friendly</i> ลงท้าย -ly แต่เป็น <b>adjective</b> ไม่ใช่ adverb`,
      ee:`After <b>their</b> we need a noun, and the meaning is “being friendly” → <b>friendliness</b> (friendly + -ness)<br>Trap: <i>friendly</i> ends in -ly but it is an <b>adjective</b>, not an adverb` },
    { c:`v`, t:`Word Forms`, q:`Please speak ___. The baby is sleeping.`,
      o:[`quiet`,`quietness`,`quietly`,`quieten`], a:2,
      e:`ขยายกริยา <b>speak</b> ว่าพูดอย่างไร → ใช้ adverb → <b>quietly</b>`,
      ee:`It describes <b>how</b> to speak (the verb speak) → use an adverb → <b>quietly</b>` },

    { c:`c`, t:`Asking for Help`, q:`A: Would you mind ___ the music down? I’m trying to study.<br>B: Oh, sorry. Not at all.`,
      o:[`turn`,`to turn`,`turning`,`turned`], a:2,
      e:`<b>Would you mind + V-ing?</b> เสมอ → <b>turning</b><br>การตอบ “Not at all.” = ไม่รังเกียจ ยินดีทำให้`,
      ee:`Always use <b>Would you mind + V-ing?</b> → <b>turning</b><br>The reply “Not at all.” = I don’t mind, I’m happy to do it` },
    { c:`c`, t:`Responding to Offers`, q:`A: Would you like some more fried rice?<br>B: ___ I’m really full.`,
      o:[`Yes, I would.`,`No, thank you.`,`Here you are.`,`Help yourself.`], a:1,
      e:`“I’m really full” (อิ่มมาก) → <b>ปฏิเสธ</b> อย่างสุภาพ → <b>No, thank you.</b><br><i>Help yourself</i> คือคำที่ <b>เจ้าบ้าน</b> พูดเชิญให้ตักเอง`,
      ee:`“I’m really full” → a polite <b>refusal</b> → <b>No, thank you.</b><br><i>Help yourself</i> is what the <b>host</b> says to invite you to take food yourself` },
    { c:`c`, t:`Responding to Apologies`, q:`A: I’m so sorry I’m late. The traffic was terrible.<br>B: ___ The movie hasn’t started yet.`,
      o:[`Don’t worry about it.`,`You’re welcome.`,`Thank you so much.`,`Congratulations.`], a:0,
      e:`ตอบรับคำขอโทษอย่างเป็นมิตร → <b>Don’t worry about it.</b> (ไม่เป็นไร)<br>ประโยคต่อมา “The movie hasn’t started yet” ยืนยันว่าไม่ได้เสียหายอะไร`,
      ee:`A friendly reply to an apology → <b>Don’t worry about it.</b><br>The next sentence “The movie hasn’t started yet” shows that no harm was done` },
    { c:`c`, t:`Giving Directions`, q:`A: Excuse me, where is the nearest ATM?<br>B: It’s just ___ the convenience store, on the other side of the street.`,
      o:[`opposite`,`between`,`among`,`through`], a:0,
      e:`“on the other side of the street” (อีกฝั่งถนน) → <b>opposite</b> = ตรงข้าม<br>between ต้องมีสองสิ่ง (between A and B)`,
      ee:`“on the other side of the street” → <b>opposite</b> = across from<br>between needs two things (between A and B)` },
    { c:`c`, t:`Asking for Opinions`, q:`A: ___ about online learning?<br>B: I think it’s convenient, but I miss my friends.`,
      o:[`What do you think`,`How do you think`,`What are you think`,`Do you think`], a:0,
      e:`ถามความคิดเห็น: <b>What do you think about…?</b><br>กับดักยอดนิยมของคนไทย: “<i>How</i> do you think…?” แปลตรงตัวจาก “คิดอย่างไร” แต่ <b>ผิด</b> ในภาษาอังกฤษ<br>ใช้ How ได้กับ “How do you feel about…?”`,
      ee:`To ask for an opinion: <b>What do you think about…?</b><br>A very common trap for Thai learners: “<i>How</i> do you think…?” is a direct translation from Thai, but it is <b>wrong</b> in English<br>You can use How in “How do you feel about…?”` },

    { c:`r`, p:`A`, t:`Main Idea`, q:`What is the main point of Passage A?`,
      o:[`Songkran is the biggest water fight in the world.`,`Songkran has important traditions beyond water fights.`,`Tourists should not visit Thailand in April.`,`UNESCO organises Songkran every year.`], a:1,
      e:`ชื่อเรื่อง “More Than a Water Fight” และประโยค “the festival has <b>much deeper meanings</b>” → ใจความหลักคือสงกรานต์มีคุณค่าทางประเพณี <b>มากกว่าการเล่นน้ำ</b><br>ตัวลวง: UNESCO <b>ขึ้นทะเบียน</b> ไม่ได้เป็นผู้จัดงาน`,
      ee:`The title “More Than a Water Fight” and the sentence “the festival has <b>much deeper meanings</b>” → the main idea is that Songkran has traditional value <b>beyond water fights</b><br>Trap: UNESCO <b>listed</b> Songkran; it does not organise the festival` },
    { c:`r`, p:`A`, t:`Detail`, q:`Why do young people pour scented water over their elders’ hands?`,
      o:[`To clean their hands before eating`,`To show respect and ask for blessings`,`To start the water fight`,`To make the elders feel cool`], a:1,
      e:`บทความเขียนตรง ๆ: “…to <b>show respect</b> and to <b>ask for blessings</b>” (เพื่อแสดงความเคารพและขอพร)`,
      ee:`The article says it directly: “…to <b>show respect</b> and to <b>ask for blessings</b>”` },
    { c:`r`, p:`A`, t:`Pronoun Reference`, q:`In the sentence “<u>They</u> hope that young people will remember its traditions,” the word “They” refers to ___.`,
      o:[`tourists`,`young people`,`families`,`some older people`], a:3,
      e:`ประโยคก่อนหน้า: “<b>Some older people</b> worry that the true spirit … is being forgotten.” → They ในประโยคถัดมาคือกลุ่มเดิม<br>ไม่ใช่ young people เพราะ young people อยู่หลัง They ในประโยคเดียวกันในฐานะ <b>ผู้ที่ถูกหวัง</b>`,
      ee:`The sentence before says: “<b>Some older people</b> worry that the true spirit … is being forgotten.” → They in the next sentence is the same group<br>It isn’t young people, because young people come after They in the same sentence as <b>the people being hoped about</b>` },
    { c:`r`, p:`A`, t:`Inference`, q:`What can we infer about the days just before Songkran?`,
      o:[`Many people travel, so roads and buses are busy.`,`Temples are closed to visitors.`,`Most families stay at home in Bangkok.`,`Elders do not want to see young people.`], a:0,
      e:`บทความบอกว่า “many people <b>travel back to their hometowns</b>” → อนุมานได้ว่าก่อนสงกรานต์ <b>การเดินทางจะหนาแน่น</b><br>ข้อนี้ไม่ได้เขียนตรง ๆ แต่มีหลักฐานรองรับ = Inference`,
      ee:`The article says “many people <b>travel back to their hometowns</b>” → we can infer that before Songkran <b>travel is very busy</b><br>This isn’t written directly, but there is evidence for it = Inference` },
    { c:`r`, p:`B`, t:`Detail (Ad)`, q:`Who can join the Summer English Camp?`,
      o:[`A 9-year-old girl`,`A 12-year-old boy`,`A 16-year-old student`,`Parents of students`], a:1,
      e:`โฆษณาระบุ “For students aged <b>10 – 14</b>” → เด็กชายอายุ <b>12</b> ปีอยู่ในช่วงนี้`,
      ee:`The ad says “For students aged <b>10 – 14</b>” → a <b>12</b>-year-old boy fits this age range` },
    { c:`r`, p:`B`, t:`Calculation`, q:`Mint registers for the camp on 20 February. How much does she pay?`,
      o:[`6,500 baht`,`650 baht`,`5,850 baht`,`5,500 baht`], a:2,
      e:`20 กุมภาพันธ์ อยู่ <b>ก่อน 1 มีนาคม</b> → ได้ส่วนลด Early bird 10%<br>10% ของ 6,500 = 650 → 6,500 − 650 = <b>5,850 baht</b><br>กับดัก: 650 คือ <b>ส่วนลด</b> ไม่ใช่ราคาที่จ่าย`,
      ee:`20 February is <b>before 1 March</b> → she gets the 10% Early bird discount<br>10% of 6,500 = 650 → 6,500 − 650 = <b>5,850 baht</b><br>Trap: 650 is the <b>discount</b>, not the price she pays` },
    { c:`r`, p:`B`, t:`Detail (Ad)`, q:`Which activity is NOT mentioned in the advertisement?`,
      o:[`Drama`,`Debate`,`Cooking class`,`Beach games`], a:2,
      e:`กิจกรรมในโฆษณา: drama · debate · science experiments in English · beach games → <b>ไม่มี Cooking class</b><br>คำถามที่มี NOT ให้ตรวจทีละตัวเลือกว่าข้อไหนไม่ปรากฏในเนื้อเรื่อง`,
      ee:`Activities in the ad: drama · debate · science experiments in English · beach games → <b>no Cooking class</b><br>For NOT questions, check each choice one by one to see which one is not in the text` },
    { c:`r`, p:`B`, t:`Inference (Ad)`, q:`What can we infer from the advertisement?`,
      o:[`Students go home every evening.`,`Students will stay overnight at the resort.`,`The camp is free for early registrants.`,`Thai teachers teach all the classes.`], a:1,
      e:`“5 days · <b>4 nights</b>” → นักเรียน <b>พักค้างคืน</b> ที่รีสอร์ต<br>ข้ออื่นขัดกับโฆษณา: ส่วนลดเพียง 10% (ไม่ฟรี) และสอนโดยครูเจ้าของภาษา`,
      ee:`“5 days · <b>4 nights</b>” → students <b>stay overnight</b> at the resort<br>The other choices go against the ad: the discount is only 10% (not free), and the teachers are native English speakers` }
  ]
});

  questions: [
    { c:`g`, t:`Present Perfect vs Past Simple`, q:`I ___ my science report yesterday, but I ___ it to the teacher yet.`,
      o:[`finished / haven’t given`,`have finished / didn’t give`,`finished / didn’t give`,`have finished / haven’t given`], a:0,
      e:`ช่องแรกมี <b>yesterday</b> (เวลาในอดีตที่ชัดเจน) → Past Simple: <b>finished</b><br>ช่องที่สองมี <b>yet</b> (ยังไม่…) → Present Perfect ปฏิเสธ: <b>haven’t given</b><br>จำ: yesterday / last / ago → Past Simple · yet / already / ever / never → Present Perfect`,
      ee:`The first blank has <b>yesterday</b> (a clear time in the past) → Past Simple: <b>finished</b><br>The second blank has <b>yet</b> (not … yet) → negative Present Perfect: <b>haven’t given</b><br>Remember: yesterday / last / ago → Past Simple · yet / already / ever / never → Present Perfect` },
    { c:`g`, t:`Past Simple vs Past Continuous`, q:`When the earthquake ___, we ___ dinner.`,
      o:[`was happening / had`,`happened / were having`,`happens / are having`,`has happened / have had`], a:1,
      e:`แผ่นดินไหว = เหตุการณ์สั้นที่ <b>แทรกเข้ามา</b> → Past Simple (happened)<br>กินข้าวเย็น = เหตุการณ์ที่ <b>กำลังดำเนินอยู่</b> → Past Continuous (were having)`,
      ee:`The earthquake = a short action that <b>interrupts</b> → Past Simple (happened)<br>Having dinner = an action that was <b>in progress</b> → Past Continuous (were having)` },
    { c:`g`, t:`Passive Voice`, q:`“Someone stole my bicycle last night.”<br>Which sentence has the SAME meaning?`,
      o:[`My bicycle was stolen last night.`,`My bicycle stole last night.`,`My bicycle was stealing last night.`,`My bicycle has stolen last night.`], a:0,
      e:`เปลี่ยน Active → Passive: นำกรรม (my bicycle) ขึ้นเป็นประธาน + <b>be + V.3</b><br>stole เป็น Past Simple → <b>was stolen</b> (steal – stole – stolen)<br>ตัด “by someone” ได้เพราะไม่รู้ว่าเป็นใคร`,
      ee:`Active → Passive: move the object (my bicycle) to the subject position + <b>be + V.3</b><br>stole is Past Simple → <b>was stolen</b> (steal – stole – stolen)<br>We can drop “by someone” because we don’t know who did it.` },
    { c:`g`, t:`Passive Voice`, q:`The exam results ___ on the school website next Monday.`,
      o:[`will announce`,`will be announced`,`are announcing`,`announced`], a:1,
      e:`ผลสอบ <b>ถูกประกาศ</b> → Passive และมี <b>next Monday</b> → อนาคต<br>Future Passive: <b>will + be + V.3</b> → will be announced`,
      ee:`The results <b>are announced</b> by someone → Passive, and <b>next Monday</b> → future<br>Future Passive: <b>will + be + V.3</b> → will be announced` },
    { c:`g`, t:`Relative Clauses`, q:`Which sentence is grammatically CORRECT?`,
      o:[`The boy who he won the prize is my cousin.`,`The boy which won the prize is my cousin.`,`The boy who won the prize is my cousin.`,`The boy whose won the prize is my cousin.`], a:2,
      e:`<b>who</b> ทำหน้าที่เป็นประธานของ won แล้ว จึง <b>ห้ามมี he ซ้ำ</b> (who he won ผิด)<br>which ใช้กับสิ่งของ ไม่ใช้กับคน · whose ต้องตามด้วยคำนาม (whose won จึงผิด)`,
      ee:`<b>who</b> is already the subject of won, so we <b>can’t add he again</b> (who he won is wrong)<br>which is for things, not people · whose must be followed by a noun (so whose won is wrong)` },
    { c:`g`, t:`Relative Clauses`, q:`I have a friend ___ father works as a pilot for Thai Airways.`,
      o:[`who`,`whose`,`whom`,`which`], a:1,
      e:`father เป็นคำนามที่เป็น <b>ของ</b> a friend (พ่อ<b>ของ</b>เพื่อน) → <b>whose + คำนาม</b>`,
      ee:`father is a noun that <b>belongs to</b> a friend (the friend’s father) → <b>whose + noun</b>` },
    { c:`g`, t:`Conjunctions: ความขัดแย้ง`, q:`Despite ___ very hard, Beam didn’t pass the swimming test.`,
      o:[`he practised`,`practise`,`practising`,`practised`], a:2,
      e:`<b>Despite / In spite of + คำนาม หรือ V-ing</b> เท่านั้น → Despite <b>practising</b><br>ถ้าต้องการใช้ประโยค (he practised) ต้องเปลี่ยนเป็น Although he practised…`,
      ee:`<b>Despite / In spite of + noun or V-ing</b> only → Despite <b>practising</b><br>If you want a full clause (he practised), use Although he practised… instead.` },
    { c:`g`, t:`Conjunctions: ความหมายเดียวกัน`, q:`“Although the test was difficult, Ann got full marks.”<br>Which sentence has the SAME meaning?`,
      o:[`The test was difficult, so Ann got full marks.`,`In spite of the difficult test, Ann got full marks.`,`Because the test was difficult, Ann got full marks.`,`The test was easy; therefore, Ann got full marks.`], a:1,
      e:`ประโยคต้นฉบับแสดง <b>ความขัดแย้ง</b> (ยาก แต่ได้เต็ม) → In spite of + คำนาม (the difficult test) ให้ความหมายเดียวกัน<br>so / Because / therefore แสดง <b>เหตุ-ผล</b> ซึ่งทำให้ความหมายเปลี่ยน`,
      ee:`The original sentence shows <b>contrast</b> (difficult, but full marks) → In spite of + noun (the difficult test) keeps the same meaning<br>so / Because / therefore show <b>cause and result</b>, which changes the meaning.` },
    { c:`g`, t:`Subject-Verb Agreement`, q:`The number of students who bring smartphones to school ___ increasing every year.`,
      o:[`are`,`is`,`have`,`were`], a:1,
      e:`<b>The number of + N พหูพจน์</b> → ประธานคือ “จำนวน” (เอกพจน์) → <b>is</b><br>เปรียบเทียบ: <b>A number of</b> students <b>are</b>… (= นักเรียนจำนวนหนึ่ง → พหูพจน์)`,
      ee:`<b>The number of + plural noun</b> → the subject is “the number” (singular) → <b>is</b><br>Compare: <b>A number of</b> students <b>are</b>… (= some / many students → plural)` },
    { c:`g`, t:`Comparison`, q:`The more books you read, ___ your English becomes.`,
      o:[`the better`,`better`,`the best`,`more good`], a:0,
      e:`โครงสร้าง <b>The + ขั้นกว่า…, the + ขั้นกว่า…</b> = ยิ่ง…ยิ่ง…<br>The more books you read, <b>the better</b> your English becomes. = ยิ่งอ่านมาก ภาษาอังกฤษยิ่งดีขึ้น`,
      ee:`Structure: <b>The + comparative…, the + comparative…</b> = the more…, the more…<br>The more books you read, <b>the better</b> your English becomes. = Read more, and your English gets better.` },

    { c:`v`, t:`Synonyms`, q:`The teacher asked us to <u>observe</u> the plants carefully and write down any changes.<br>The word “observe” is closest in meaning to ___.`,
      o:[`water`,`watch`,`cut`,`ignore`], a:1,
      e:`<b>observe</b> = สังเกต เฝ้าดู = <b>watch</b> (carefully)<br>บริบท: “write down any changes” ต้องดูอย่างตั้งใจจึงจะเห็นความเปลี่ยนแปลง<br>ignore (เพิกเฉย) มีความหมายตรงข้าม`,
      ee:`<b>observe</b> = to look at carefully = <b>watch</b> (carefully)<br>Context: “write down any changes” – you must watch closely to see changes.<br>ignore (to pay no attention) is the opposite.` },
    { c:`v`, t:`Antonyms`, q:`The old wooden bridge is <u>fragile</u>, so heavy trucks are not allowed to use it.<br>Which word is OPPOSITE in meaning to “fragile”?`,
      o:[`weak`,`delicate`,`sturdy`,`broken`], a:2,
      e:`<b>fragile</b> = เปราะบาง แตกหักง่าย → ตรงข้ามคือ <b>sturdy</b> = แข็งแรง มั่นคง<br>weak, delicate มีความหมายใกล้เคียงกับ fragile`,
      ee:`<b>fragile</b> = easily broken → the opposite is <b>sturdy</b> = strong and solid<br>weak and delicate are similar in meaning to fragile.` },
    { c:`v`, t:`Context Clues`, q:`Unlike his talkative sister, Tony is quite <u>reticent</u>. He rarely shares his thoughts with others.<br>“Reticent” means ___.`,
      o:[`quiet and not saying much`,`funny and loud`,`angry and rude`,`clever and quick`], a:0,
      e:`เบาะแสสองชั้น: <b>Unlike</b> his <b>talkative</b> sister (ต่างจากพี่สาวที่ช่างพูด) + “<b>rarely shares his thoughts</b>” → <b>reticent</b> = เงียบ ไม่ค่อยพูด<br>คำว่า Unlike บอกให้รู้ว่าความหมายตรงข้ามกับ talkative`,
      ee:`Two clues: <b>Unlike</b> his <b>talkative</b> sister (different from his chatty sister) + “<b>rarely shares his thoughts</b>” → <b>reticent</b> = quiet, doesn’t say much<br>The word Unlike tells you the meaning is the opposite of talkative.` },
    { c:`v`, t:`Idioms in Context`, q:`Your best friend is about to sing on stage at the school concert. What should you say?`,
      o:[`“Break a leg!”`,`“You look under the weather!”`,`“Let’s call it a day!”`,`“It costs an arm and a leg!”`], a:0,
      e:`ก่อนขึ้นแสดง ใช้ <b>Break a leg!</b> = ขอให้โชคดี<br>under the weather = ไม่สบาย · call it a day = เลิกงาน · cost an arm and a leg = แพงมาก`,
      ee:`Before someone performs, say <b>Break a leg!</b> = Good luck!<br>under the weather = feeling ill · call it a day = stop working · cost an arm and a leg = very expensive` },
    { c:`v`, t:`Idioms in Context`, q:`I spent the whole day cleaning the house, and now I’m exhausted. I think I’ll ___.`,
      o:[`break a leg`,`call it a day`,`cost an arm and a leg`,`be a piece of cake`], a:1,
      e:`ทำงานทั้งวันจนเหนื่อย (exhausted) → อยากพัก → <b>call it a day</b> = พอแค่นี้ก่อนสำหรับวันนี้`,
      ee:`Working all day until exhausted → wants to rest → <b>call it a day</b> = stop for today` },
    { c:`v`, t:`Word Forms`, q:`Water ___ is very important during the dry season.`,
      o:[`conserve`,`conservation`,`conservative`,`conserved`], a:1,
      e:`ช่องว่างทำหน้าที่ <b>ประธาน</b> ของ is (ร่วมกับ Water) → ต้องเป็นคำนาม → <b>conservation</b> (การอนุรักษ์)<br>conserve (v.) · conservative (adj.) หัวโบราณ/อนุรักษ์นิยม`,
      ee:`The blank is part of the <b>subject</b> of is (together with Water) → it must be a noun → <b>conservation</b> (protecting / saving)<br>conserve (v.) · conservative (adj.) old-fashioned / traditional` },
    { c:`v`, t:`Word Forms`, q:`He answered all the questions ___, so he got full marks.`,
      o:[`correction`,`correct`,`correctness`,`correctly`], a:3,
      e:`ขยายกริยา <b>answered</b> → ต้องเป็น adverb → <b>correctly</b><br>correct (adj.) · correction / correctness (n.)`,
      ee:`It describes the verb <b>answered</b> → we need an adverb → <b>correctly</b><br>correct (adj.) · correction / correctness (n.)` },

    { c:`c`, t:`Responding to Requests`, q:`A: Could you possibly lend me your notes?<br>Which response is NOT appropriate?`,
      o:[`Sure. Here you are.`,`Of course. I’ll bring them tomorrow.`,`Sorry, I need them to study tonight.`,`Yes, I could possibly.`], a:3,
      e:`ตอบรับคำขอร้องด้วย <b>Sure / Of course</b> หรือปฏิเสธสุภาพด้วย <b>Sorry, …</b><br><b>“Yes, I could possibly.”</b> เป็นการตอบตามรูปประโยคแบบตรงตัว ซึ่งเจ้าของภาษาไม่ใช้ และฟังดูแปลก`,
      ee:`Accept a request with <b>Sure / Of course</b>, or refuse politely with <b>Sorry, …</b><br><b>“Yes, I could possibly.”</b> just copies the question word for word – native speakers don’t say this and it sounds strange.` },
    { c:`c`, t:`Responding to Offers`, q:`A: Would you like me to help you with your bags?<br>B: ___`,
      o:[`Yes, I like.`,`Yes, please. That’s very kind of you.`,`No, I wouldn’t like me.`,`I’d like you, thanks.`], a:1,
      e:`ตอบรับข้อเสนออย่างสุภาพ: <b>Yes, please. That’s very kind of you.</b><br>ข้ออื่นผิดไวยากรณ์ / ความหมายเพี้ยน เช่น “I’d like you” = ฉันชอบคุณ`,
      ee:`Politely accept an offer: <b>Yes, please. That’s very kind of you.</b><br>The other choices are ungrammatical or mean something odd, e.g. “I’d like you” = I like you.` },
    { c:`c`, t:`Responding to Apologies`, q:`A: I’m really sorry. I forgot to bring back your book.<br>B: ___`,
      o:[`You’re welcome.`,`Thank you very much.`,`Never mind. You can bring it tomorrow.`,`I’m sorry too.`], a:2,
      e:`ตอบรับคำขอโทษ: <b>Never mind.</b> (ไม่เป็นไร) + เสนอทางออกอย่างใจดี<br><i>You’re welcome</i> ใช้ตอบ Thank you เท่านั้น`,
      ee:`Reply to an apology: <b>Never mind.</b> (It’s OK) + kindly offer a solution<br><i>You’re welcome</i> is only used to answer Thank you.` },
    { c:`c`, t:`Asking for Directions`, q:`A: Excuse me. ___ the nearest bus stop?<br>B: Sure. It’s just around the corner.`,
      o:[`Could you tell me the way to`,`Can you show me where is`,`Do you know where is`,`Tell me where`], a:0,
      e:`ถามทางสุภาพ: <b>Could you tell me the way to + สถานที่?</b><br>กับดัก: ประโยคคำถามซ้อน (embedded question) ต้องเรียง <b>where + ประธาน + กริยา</b> เช่น Do you know where <b>the bus stop is</b>? ดังนั้น “where is the…” หลัง Do you know จึงผิด`,
      ee:`Polite way to ask for directions: <b>Could you tell me the way to + place?</b><br>Trap: in an embedded question the order is <b>where + subject + verb</b>, e.g. Do you know where <b>the bus stop is</b>? So “where is the…” after Do you know is wrong.` },
    { c:`c`, t:`Expressing Opinions`, q:`A: In my opinion, homework should be banned.<br>B: I see your point, ___ homework helps us practise what we learn.`,
      o:[`and I agree that`,`but I think`,`so`,`because`], a:1,
      e:`B ยอมรับมุมมองของ A ก่อน (I see your point) แล้ว <b>แย้ง</b> ว่าการบ้านมีประโยชน์ → ต้องใช้คำเชื่อมขัดแย้ง <b>but I think</b><br>เป็นวิธีไม่เห็นด้วยอย่างสุภาพที่ใช้บ่อยมาก`,
      ee:`B first accepts A’s view (I see your point), then <b>disagrees</b> and says homework is useful → we need a contrast connector: <b>but I think</b><br>This is a very common, polite way to disagree.` },

    { c:`r`, p:`A`, t:`Main Idea`, q:`Which is the best title for Passage A?`,
      o:[`How to Build Your Own Robot`,`Shy Students Hate English`,`An AI Robot Teacher: Benefits and Worries`,`Parents Ban Robots from Schools`], a:2,
      e:`ย่อหน้าแรกพูดถึง <b>ข้อดี</b> (เด็กขี้อายมั่นใจขึ้น) ย่อหน้าที่สองพูดถึง <b>ข้อกังวล</b> (เวลากับเครื่องจักร, ความเป็นส่วนตัว) → “Benefits and Worries” ครอบคลุมทั้งเรื่อง<br>ตัวลวง: ผู้ปกครอง <b>กังวล</b> แต่ไม่ได้ <b>สั่งห้าม</b>`,
      ee:`Paragraph 1 talks about the <b>benefits</b> (shy students feel more confident); paragraph 2 talks about the <b>worries</b> (time with machines, privacy) → “Benefits and Worries” covers the whole passage<br>Trap: the parents are <b>worried</b>, but they did not <b>ban</b> the robot.` },
    { c:`r`, p:`A`, t:`Pronoun Reference`, q:`In the sentence “…now feel more confident because <u>they</u> can practise without being afraid…,” the word “they” refers to ___.`,
      o:[`teachers`,`shy students`,`parents`,`friends`], a:1,
      e:`ผู้ที่ “feel more confident” และ “can practise” คือ <b>shy students</b> ที่อยู่ต้นประโยค<br>แทนคำลงไป: shy students can practise without being afraid… ✔`,
      ee:`The people who “feel more confident” and “can practise” are the <b>shy students</b> at the start of the sentence<br>Put it back in: shy students can practise without being afraid… ✔` },
    { c:`r`, p:`A`, t:`Detail`, q:`Why are some people concerned about privacy?`,
      o:[`The robot records students’ voices.`,`The robot takes photos of parents.`,`Students share passwords with Mika.`,`Teachers read students’ diaries.`], a:0,
      e:`บทความระบุ “concerned about privacy, <b>since the robot records students’ voices</b>” (since = because ในบริบทนี้)`,
      ee:`The passage says “concerned about privacy, <b>since the robot records students’ voices</b>” (since = because here)` },
    { c:`r`, p:`A`, t:`Inference`, q:`What is the school’s attitude towards using Mika in the future?`,
      o:[`It has decided to stop using Mika.`,`It will use Mika in every class next month.`,`It is careful and has not decided yet.`,`It does not care about parents’ opinions.`], a:2,
      e:`“will study the results carefully for one year <b>before deciding whether</b> to use Mika in other classes” → โรงเรียน <b>ระมัดระวัง และยังไม่ตัดสินใจ</b><br>Inference เรื่องทัศนคติ (attitude) ให้ดูคำที่แสดงท่าที เช่น carefully, before deciding`,
      ee:`“will study the results carefully for one year <b>before deciding whether</b> to use Mika in other classes” → the school is <b>careful and has not decided yet</b><br>For attitude questions, look for words that show feeling or approach, e.g. carefully, before deciding.` },
    { c:`r`, p:`B`, t:`Reading a Chart`, q:`How many students chose reading as their favourite activity?`,
      o:[`15 students`,`20 students`,`30 students`,`35 students`], a:2,
      e:`Reading = 15% ของนักเรียน 200 คน<br>15/100 × 200 = <b>30 students</b><br>กับดัก: 15 คือ <b>เปอร์เซ็นต์</b> ไม่ใช่จำนวนคน`,
      ee:`Reading = 15% of 200 students<br>15/100 × 200 = <b>30 students</b><br>Trap: 15 is a <b>percentage</b>, not the number of students.` },
    { c:`r`, p:`B`, t:`Reading a Chart`, q:`Which TWO activities together were chosen by exactly half of the students?`,
      o:[`Sports and Reading`,`Online games and Music`,`Sports and Online games`,`Reading and Music`], a:0,
      e:`ครึ่งหนึ่ง = 50%<br>Sports 35% + Reading 15% = <b>50%</b> ✔<br>Online games + Music = 42% · Sports + Online games = 65% · Reading + Music = 27%`,
      ee:`Half = 50%<br>Sports 35% + Reading 15% = <b>50%</b> ✔<br>Online games + Music = 42% · Sports + Online games = 65% · Reading + Music = 27%` },
    { c:`r`, p:`B`, t:`Fact Check`, q:`Which statement is TRUE according to the chart?`,
      o:[`More students like reading than online games.`,`Music is the least popular activity.`,`Sports is more popular than online games.`,`Half of the students like online games.`], a:2,
      e:`Sports 35% > Online games 30% ✔<br>ข้ออื่นผิด: Reading 15% น้อยกว่า Online games · กิจกรรมที่น้อยที่สุดคือ Others (8%) · Online games 30% ไม่ใช่ครึ่งหนึ่ง`,
      ee:`Sports 35% > Online games 30% ✔<br>The others are false: Reading 15% is less than Online games · the least popular is Others (8%) · Online games 30% is not half.` },
    { c:`r`, p:`B`, t:`Inference`, q:`If the school wants to start a new club that most students will enjoy, which club would be the best choice?`,
      o:[`A poetry club`,`A football or basketball club`,`A piano club`,`A cooking club`], a:1,
      e:`กราฟแสดงว่า <b>Sports</b> เป็นกิจกรรมยอดนิยมอันดับ 1 (35%) → ชมรมกีฬา เช่น ฟุตบอล/บาสเกตบอล น่าจะมีคนสนใจมากที่สุด<br>เป็นการนำข้อมูลไป <b>ประยุกต์ใช้</b> (Application/Inference)`,
      ee:`The chart shows <b>Sports</b> is the most popular activity (35%) → a sports club such as football/basketball would attract the most students<br>This means <b>applying</b> the data (Application/Inference).` }
  ]
});

</script>
<script>
// สรุปเนื้อหาก่อนสอบ — แสดงในหน้า "สรุปเนื้อหา"
window.NOTES = [
  { cat:`g`, id:`n-pp`, title:`Present Perfect`, titleEn:`Present Perfect`, html:`
<p><b>have / has + V.3</b> ใช้กับ 3 สถานการณ์หลัก</p>
<ol>
<li><b>ต่อเนื่องถึงปัจจุบัน</b> — I <b>have lived</b> here <b>since</b> 2019 / <b>for</b> five years.</li>
<li><b>ประสบการณ์</b> — <b>Have</b> you <b>ever been</b> to Japan? · I have <b>never</b> eaten sushi.</li>
<li><b>ผลยังอยู่ตอนนี้</b> — Someone <b>has broken</b> the window. (เศษแก้วยังอยู่)</li>
</ol>
<table class="mini"><tr><th>Present Perfect</th><th>Past Simple</th></tr>
<tr><td>since, for, ever, never, already, yet, just</td><td>yesterday, last …, … ago, in 2010</td></tr></table>
<p class="tip">since + จุดเวลา (since Monday) · for + ระยะเวลา (for two days) · been to = เคยไปแล้วกลับ · gone to = ไปแล้วยังไม่กลับ</p>`,
    htmlEn:`
<p><b>have / has + V.3</b> is used in 3 main situations</p>
<ol>
<li><b>Continuing up to now</b> — I <b>have lived</b> here <b>since</b> 2019 / <b>for</b> five years.</li>
<li><b>Experience</b> — <b>Have</b> you <b>ever been</b> to Japan? · I have <b>never</b> eaten sushi.</li>
<li><b>The result is still here now</b> — Someone <b>has broken</b> the window. (the broken glass is still there)</li>
</ol>
<table class="mini"><tr><th>Present Perfect</th><th>Past Simple</th></tr>
<tr><td>since, for, ever, never, already, yet, just</td><td>yesterday, last …, … ago, in 2010</td></tr></table>
<p class="tip">since + a point in time (since Monday) · for + a length of time (for two days) · been to = went and came back · gone to = went and hasn’t come back yet</p>` },

  { cat:`g`, id:`n-past`, title:`Past Simple vs Past Continuous`, titleEn:`Past Simple vs Past Continuous`, html:`
<p>เหตุการณ์ยาวที่ <b>กำลังเกิด</b> → was/were + V-ing · เหตุการณ์สั้นที่ <b>แทรกเข้ามา</b> → V.2</p>
<p class="ex">While I <b>was doing</b> my homework, the lights <b>went</b> out.<br>I <b>was watching</b> TV when Mum <b>called</b> me.</p>
<p class="tip">while + เหตุการณ์ที่ยาว (Past Continuous) · when + มักตามด้วยเหตุการณ์สั้น (Past Simple)</p>`,
    htmlEn:`
<p>A longer action that was <b>in progress</b> → was/were + V-ing · A short action that <b>interrupts</b> → V.2</p>
<p class="ex">While I <b>was doing</b> my homework, the lights <b>went</b> out.<br>I <b>was watching</b> TV when Mum <b>called</b> me.</p>
<p class="tip">while + the longer action (Past Continuous) · when + usually the short action (Past Simple)</p>` },

  { cat:`g`, id:`n-passive`, title:`Passive Voice`, titleEn:`Passive Voice`, html:`
<p>ประธาน <b>ถูกกระทำ</b> → <b>Subject + be + V.3 (+ by …)</b></p>
<table class="mini"><tr><th>Tense</th><th>รูป Passive</th><th>ตัวอย่าง</th></tr>
<tr><td>Present Simple</td><td>is / am / are + V.3</td><td>English <b>is spoken</b> here.</td></tr>
<tr><td>Past Simple</td><td>was / were + V.3</td><td>The bridge <b>was built</b> in 1990.</td></tr>
<tr><td>Present Perfect</td><td>has / have been + V.3</td><td>Animals <b>have been protected</b>.</td></tr>
<tr><td>Future / Modal</td><td>will / must / can + be + V.3</td><td>Phones <b>must be turned</b> off.</td></tr></table>
<p class="tip">ถามตัวเองว่า “ประธานทำเองได้ไหม?” ถ้าไม่ได้ (ตึก, ภาษา, อีเมล) → Passive</p>`,
    htmlEn:`
<p>The subject <b>receives the action</b> → <b>Subject + be + V.3 (+ by …)</b></p>
<table class="mini"><tr><th>Tense</th><th>Passive form</th><th>Example</th></tr>
<tr><td>Present Simple</td><td>is / am / are + V.3</td><td>English <b>is spoken</b> here.</td></tr>
<tr><td>Past Simple</td><td>was / were + V.3</td><td>The bridge <b>was built</b> in 1990.</td></tr>
<tr><td>Present Perfect</td><td>has / have been + V.3</td><td>Animals <b>have been protected</b>.</td></tr>
<tr><td>Future / Modal</td><td>will / must / can + be + V.3</td><td>Phones <b>must be turned</b> off.</td></tr></table>
<p class="tip">Ask yourself: “Can the subject do this by itself?” If not (a building, a language, an email) → Passive</p>` },

  { cat:`g`, id:`n-rel`, title:`Relative Clauses`, titleEn:`Relative Clauses`, html:`
<table class="mini"><tr><th>คำ</th><th>ใช้กับ</th><th>ตัวอย่าง</th></tr>
<tr><td><b>who</b></td><td>คน (ประธาน)</td><td>a scientist <b>who</b> won a prize</td></tr>
<tr><td><b>whom</b></td><td>คน (กรรม / หลังบุพบท)</td><td>the man <b>whom</b> we met · to <b>whom</b></td></tr>
<tr><td><b>whose</b></td><td>ความเป็นเจ้าของ + คำนาม</td><td>the girl <b>whose</b> bike was stolen</td></tr>
<tr><td><b>which</b></td><td>สัตว์ / สิ่งของ</td><td>the phone <b>which</b> I bought</td></tr>
<tr><td><b>that</b></td><td>คนหรือของ (ไม่ใช้หลัง ,)</td><td>the best food <b>that</b> I’ve eaten</td></tr></table>
<p class="tip">หลังเครื่องหมายจุลภาค ห้ามใช้ that · who ทำหน้าที่ประธานแล้ว ห้ามมี he/she ซ้ำ</p>`,
    htmlEn:`
<table class="mini"><tr><th>Word</th><th>Used for</th><th>Example</th></tr>
<tr><td><b>who</b></td><td>people (subject)</td><td>a scientist <b>who</b> won a prize</td></tr>
<tr><td><b>whom</b></td><td>people (object / after a preposition)</td><td>the man <b>whom</b> we met · to <b>whom</b></td></tr>
<tr><td><b>whose</b></td><td>possession + noun</td><td>the girl <b>whose</b> bike was stolen</td></tr>
<tr><td><b>which</b></td><td>animals / things</td><td>the phone <b>which</b> I bought</td></tr>
<tr><td><b>that</b></td><td>people or things (not after a comma)</td><td>the best food <b>that</b> I’ve eaten</td></tr></table>
<p class="tip">Never use that after a comma · who is already the subject, so don’t add he/she again</p>` },

  { cat:`g`, id:`n-conj`, title:`Conjunctions & Connectors`, titleEn:`Conjunctions & Connectors`, html:`
<table class="mini"><tr><th></th><th>+ ประโยค</th><th>+ คำนาม / V-ing</th><th>ขึ้นประโยคใหม่</th></tr>
<tr><td><b>ขัดแย้ง</b></td><td>Although, Even though</td><td>Despite, In spite of</td><td>However,</td></tr>
<tr><td><b>เหตุผล</b></td><td>Because, As, Since</td><td>Because of, Due to, Thanks to</td><td>—</td></tr>
<tr><td><b>ผลลัพธ์</b></td><td>so</td><td>—</td><td>Therefore, As a result,</td></tr></table>
<p class="ex"><b>Although</b> it rained, we played. = <b>Despite</b> the rain, we played.</p>
<p class="tip">ดู 2 อย่างเสมอ: (1) ความหมายขัดแย้งหรือเหตุผล (2) หลังช่องว่างเป็นประโยคหรือคำนาม</p>`,
    htmlEn:`
<table class="mini"><tr><th></th><th>+ clause</th><th>+ noun / V-ing</th><th>Starts a new sentence</th></tr>
<tr><td><b>Contrast</b></td><td>Although, Even though</td><td>Despite, In spite of</td><td>However,</td></tr>
<tr><td><b>Reason</b></td><td>Because, As, Since</td><td>Because of, Due to, Thanks to</td><td>—</td></tr>
<tr><td><b>Result</b></td><td>so</td><td>—</td><td>Therefore, As a result,</td></tr></table>
<p class="ex"><b>Although</b> it rained, we played. = <b>Despite</b> the rain, we played.</p>
<p class="tip">Always check 2 things: (1) is the meaning contrast or reason? (2) is a clause or a noun after the blank?</p>` },

  { cat:`g`, id:`n-sva`, title:`Subject-Verb Agreement`, titleEn:`Subject-Verb Agreement`, html:`
<ul>
<li>หาประธานตัวจริง ตัดส่วนขยายทิ้ง: The box <s>of chocolates</s> <b>is</b>…</li>
<li><b>One of</b> + N พหูพจน์ → เอกพจน์: One of my friends <b>has</b>…</li>
<li><b>Either A or B / Neither A nor B</b> → ผันตาม B: Neither my parents nor my sister <b>uses</b>…</li>
<li><b>Everyone, Someone, Nobody, Each</b> → เอกพจน์: Everyone <b>wants</b>…</li>
<li><b>The number of</b> → เอกพจน์ · <b>A number of</b> → พหูพจน์</li>
</ul>`,
    htmlEn:`
<ul>
<li>Find the real subject and ignore the extra words: The box <s>of chocolates</s> <b>is</b>…</li>
<li><b>One of</b> + plural noun → singular: One of my friends <b>has</b>…</li>
<li><b>Either A or B / Neither A nor B</b> → the verb follows B: Neither my parents nor my sister <b>uses</b>…</li>
<li><b>Everyone, Someone, Nobody, Each</b> → singular: Everyone <b>wants</b>…</li>
<li><b>The number of</b> → singular · <b>A number of</b> → plural</li>
</ul>` },

  { cat:`g`, id:`n-comp`, title:`Comparison`, titleEn:`Comparison`, html:`
<table class="mini"><tr><th>คำ</th><th>ขั้นกว่า</th><th>ขั้นสูงสุด</th></tr>
<tr><td>good / well</td><td>better</td><td>the best</td></tr>
<tr><td>bad</td><td>worse</td><td>the worst</td></tr>
<tr><td>many / much</td><td>more</td><td>the most</td></tr>
<tr><td>little</td><td>less</td><td>the least</td></tr>
<tr><td>hot / big</td><td>hotter / bigger</td><td>the hottest / the biggest</td></tr>
<tr><td>expensive</td><td>more expensive</td><td>the most expensive</td></tr></table>
<p class="ex">The more you read, <b>the better</b> you become. (ยิ่ง…ยิ่ง…)</p>`,
    htmlEn:`
<table class="mini"><tr><th>Word</th><th>Comparative</th><th>Superlative</th></tr>
<tr><td>good / well</td><td>better</td><td>the best</td></tr>
<tr><td>bad</td><td>worse</td><td>the worst</td></tr>
<tr><td>many / much</td><td>more</td><td>the most</td></tr>
<tr><td>little</td><td>less</td><td>the least</td></tr>
<tr><td>hot / big</td><td>hotter / bigger</td><td>the hottest / the biggest</td></tr>
<tr><td>expensive</td><td>more expensive</td><td>the most expensive</td></tr></table>
<p class="ex">The more you read, <b>the better</b> you become. (the more…, the more…)</p>` },

  { cat:`v`, id:`n-wf`, title:`Word Forms (การเปลี่ยนรูปคำ)`, titleEn:`Word Forms`, html:`
<table class="mini"><tr><th>ชนิดคำ</th><th>ปัจจัยที่พบบ่อย</th><th>ตัวอย่าง</th></tr>
<tr><td>Noun</td><td>-tion, -ment, -ness, -ity, -er/-or</td><td>invention, friendliness, creativity</td></tr>
<tr><td>Adjective</td><td>-ful, -ous, -ive, -al, -able</td><td>beautiful, dangerous, creative</td></tr>
<tr><td>Adverb</td><td>-ly</td><td>quietly, correctly</td></tr></table>
<p class="tip">ดูตำแหน่ง: หลัง the/my/their → Noun · หน้าคำนามหรือหลัง is → Adjective · ขยายกริยา → Adverb<br>ระวัง friendly, lovely เป็น adjective</p>`,
    htmlEn:`
<table class="mini"><tr><th>Part of speech</th><th>Common suffixes</th><th>Examples</th></tr>
<tr><td>Noun</td><td>-tion, -ment, -ness, -ity, -er/-or</td><td>invention, friendliness, creativity</td></tr>
<tr><td>Adjective</td><td>-ful, -ous, -ive, -al, -able</td><td>beautiful, dangerous, creative</td></tr>
<tr><td>Adverb</td><td>-ly</td><td>quietly, correctly</td></tr></table>
<p class="tip">Look at the position: after the/my/their → Noun · before a noun or after is → Adjective · describing a verb → Adverb<br>Careful: friendly and lovely are adjectives</p>` },

  { cat:`v`, id:`n-idiom`, title:`Idioms ที่ออกบ่อย`, titleEn:`Common Idioms`, html:`
<table class="mini">
<tr><td><b>Break a leg!</b></td><td>ขอให้โชคดี (ก่อนแสดง/แข่ง)</td></tr>
<tr><td><b>a piece of cake</b></td><td>ง่ายมาก</td></tr>
<tr><td><b>under the weather</b></td><td>ไม่สบาย</td></tr>
<tr><td><b>call it a day</b></td><td>พอแค่นี้ เลิกงาน</td></tr>
<tr><td><b>cost an arm and a leg</b></td><td>แพงมาก</td></tr>
<tr><td><b>hit the books</b></td><td>อ่านหนังสืออย่างหนัก</td></tr>
<tr><td><b>once in a blue moon</b></td><td>นาน ๆ ครั้ง</td></tr>
<tr><td><b>rain cats and dogs</b></td><td>ฝนตกหนักมาก</td></tr></table>
<p class="tip">สำนวนห้ามแปลตามตัวอักษร ให้ใช้บริบทรอบ ๆ ช่วยเดา</p>`,
    htmlEn:`
<table class="mini">
<tr><td><b>Break a leg!</b></td><td>Good luck! (before a show/competition)</td></tr>
<tr><td><b>a piece of cake</b></td><td>very easy</td></tr>
<tr><td><b>under the weather</b></td><td>feeling ill</td></tr>
<tr><td><b>call it a day</b></td><td>stop working for today</td></tr>
<tr><td><b>cost an arm and a leg</b></td><td>very expensive</td></tr>
<tr><td><b>hit the books</b></td><td>study very hard</td></tr>
<tr><td><b>once in a blue moon</b></td><td>very rarely</td></tr>
<tr><td><b>rain cats and dogs</b></td><td>rain very heavily</td></tr></table>
<p class="tip">Never translate idioms word for word – use the context around them to guess the meaning</p>` },

  { cat:`c`, id:`n-conv`, title:`ประโยคสนทนาที่ต้องรู้`, titleEn:`Must-Know Conversation Phrases`, html:`
<table class="mini">
<tr><th>สถานการณ์</th><th>พูด</th><th>ตอบ</th></tr>
<tr><td>ขอร้อง</td><td>Would you mind + <b>V-ing</b>?<br>Could you possibly + V.1?</td><td><b>Not at all.</b> (= ยินดี)<br>Sure. / Of course.</td></tr>
<tr><td>เสนอช่วย</td><td>Shall I …? / Would you like me to …?</td><td>Yes, please. That’s kind of you.<br>That’s kind of you, but …</td></tr>
<tr><td>ตอบรับ/ปฏิเสธคำชวน</td><td>Would you like to …?</td><td>I’d love to. / I’d love to, <b>but</b> …</td></tr>
<tr><td>ขอโทษ</td><td>I’m terribly sorry. + เหตุผล</td><td>That’s all right. / Never mind.</td></tr>
<tr><td>ความเห็น</td><td><b>What</b> do you think about …?</td><td>I completely agree. / I couldn’t agree more.<br>I’m afraid I disagree. / I see your point, but …</td></tr>
<tr><td>บอกทาง</td><td>Could you tell me the way to …?</td><td>turn left/right · on your left · opposite · between A and B · next to</td></tr></table>
<p class="tip">You’re welcome ใช้ตอบ Thank you เท่านั้น ไม่ใช้ตอบคำขอโทษ</p>`,
    htmlEn:`
<table class="mini">
<tr><th>Situation</th><th>Say</th><th>Reply</th></tr>
<tr><td>Making a request</td><td>Would you mind + <b>V-ing</b>?<br>Could you possibly + V.1?</td><td><b>Not at all.</b> (= I’m happy to)<br>Sure. / Of course.</td></tr>
<tr><td>Offering help</td><td>Shall I …? / Would you like me to …?</td><td>Yes, please. That’s kind of you.<br>That’s kind of you, but …</td></tr>
<tr><td>Accepting/declining an invitation</td><td>Would you like to …?</td><td>I’d love to. / I’d love to, <b>but</b> …</td></tr>
<tr><td>Apologising</td><td>I’m terribly sorry. + reason</td><td>That’s all right. / Never mind.</td></tr>
<tr><td>Opinions</td><td><b>What</b> do you think about …?</td><td>I completely agree. / I couldn’t agree more.<br>I’m afraid I disagree. / I see your point, but …</td></tr>
<tr><td>Giving directions</td><td>Could you tell me the way to …?</td><td>turn left/right · on your left · opposite · between A and B · next to</td></tr></table>
<p class="tip">You’re welcome is only used to answer Thank you – never to answer an apology</p>` },

  { cat:`r`, id:`n-read`, title:`กลยุทธ์การอ่าน 4 แบบคำถาม`, titleEn:`Reading Strategies for 4 Question Types`, html:`
<ol>
<li><b>Main Idea / Title</b> — คำตอบต้องครอบคลุม <b>ทุกย่อหน้า</b> ไม่แคบหรือกว้างเกินไป</li>
<li><b>Detail</b> — หา keyword จากคำถาม แล้วกลับไปอ่านประโยครอบ ๆ คำตอบ “อยู่ในเนื้อเรื่อง”</li>
<li><b>Inference</b> — ไม่ได้เขียนตรง ๆ แต่ต้องมี <b>หลักฐานรองรับ</b> ระวังตัวเลือกที่สุดโต่งเกินจริง</li>
<li><b>Pronoun Reference</b> — ย้อนดูคำนามข้างหน้า แล้ว <b>แทนค่าลงไป</b> อ่านดูว่าความหมายเข้ากันไหม</li>
</ol>
<p class="tip">ป้าย/โฆษณา/ตาราง: อ่านคำถามก่อน แล้วค่อยกวาดหาข้อมูล · ระวังกับดักตัวเลข (เปอร์เซ็นต์ ≠ จำนวนคน, ส่วนลด ≠ ราคาจ่าย)</p>`,
    htmlEn:`
<ol>
<li><b>Main Idea / Title</b> — the answer must cover <b>every paragraph</b>, not too narrow and not too broad</li>
<li><b>Detail</b> — find a keyword in the question, then go back and read the sentences around it. The answer is “in the text”</li>
<li><b>Inference</b> — not written directly, but there must be <b>evidence</b> for it. Watch out for extreme choices that go too far</li>
<li><b>Pronoun Reference</b> — look back at the nouns before it, then <b>put the noun in its place</b> and check if the meaning works</li>
</ol>
<p class="tip">Signs/ads/tables: read the question first, then scan for the information · Watch out for number traps (percentage ≠ number of people, discount ≠ price you pay)</p>` }
];

// กระจายตำแหน่งคำตอบให้สมดุล A–D แบบคงที่ (ทุกเครื่องเห็นลำดับเดียวกัน)
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
SETS.forEach(set => {
  const r = rng(set.id * 7919 + 17), n = set.questions.length, t = [];
  for (let i = 0; i < n; i++) t.push(i % 4);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  set.questions.forEach((q, i) => {
    const right = q.o[q.a], rest = q.o.filter((_, k) => k !== q.a);
    rest.splice(t[i], 0, right);
    q.o = rest; q.a = t[i]; q.n = i + 1;
  });
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const strip = s => s.replace(/<br>/g, ' ').replace(/<[^>]+>/g, '').replace(/___/g, '____');
const fmtTime = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// ---------- QUIZ ----------
function startQuiz(setId, mode, idxs) {
  const set = getSet(setId);
  S = { view: 'quiz', set: setId, mode, idxs: idxs || set.questions.map((_, i) => i), cur: 0, ans: {}, checked: {}, start: Date.now(), confirm: false };
  render(true);
}

function viewQuiz() {
  const t = T();
  const set = getSet(S.set), qi = S.idxs[S.cur], q = set.questions[qi];
  const pass = q.p ? set.passages[q.p] : null;
  const picked = S.ans[qi], checked = S.mode === 'practice' && S.checked[qi];
  const done = Object.keys(S.ans).length, n = S.idxs.length, last = S.cur === n - 1;
  const pct = S.mode === 'practice' ? (Object.keys(S.checked).length / n) * 100 : (done / n) * 100;
  const subset = n !== set.questions.length;

  const opts = q.o.map((o, k) => {
    let cls = 'opt', mark = '';
    if (checked) {
      if (k === q.a) { cls += ' ok'; mark = t.correctAns; }
      else if (k === picked) { cls += ' bad'; mark = t.youPicked; }
      else cls += ' dim';
    } else if (k === picked) cls += ' sel';
    return `<button class="${cls}" data-act="pick" data-k="${k}" ${checked ? 'disabled' : ''} aria-pressed="${k === picked}">
      <span class="key">${KEYS[k]}</span><span class="txt">${esc(o)}</span>${mark ? `<span class="mark">${mark}</span>` : ''}</button>`;
  }).join('');

  let fb = '';
  if (checked) {
    const ok = picked === q.a;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status">
      <div class="fb-head">${ok ? t.right : t.notYet(KEYS[q.a], esc(q.o[q.a]))}</div>
      <div class="fb-body">${expOf(q)}</div></div>`;
  }

  const prevBtn = `<button class="btn btn-ghost" data-act="prev" ${S.cur === 0 ? 'disabled' : ''}>${t.prev}</button><span class="grow"></span>`;
  const actions = S.mode === 'practice'
    ? prevBtn + (!checked
        ? `<button class="btn btn-dark" data-act="check" ${picked == null ? 'disabled' : ''}>${t.check}</button>`
        : (last ? `<button class="btn btn-primary" data-act="finish">${t.seeScore}</button>` : `<button class="btn btn-primary" data-act="next">${t.nextQ}</button>`))
    : prevBtn + (last ? `<button class="btn btn-primary" data-act="submit">${t.submit}</button>` : `<button class="btn btn-dark" data-act="next">${t.next}</button>`);

  const grid = S.idxs.map((ix, i) => {
    const qq = set.questions[ix];
    let c = '';
    if (S.mode === 'practice' && S.checked[ix]) c = S.ans[ix] === qq.a ? 'gok' : 'gbad';
    else if (S.ans[ix] != null) c = 'done';
    if (i === S.cur) c += ' cur';
    return `<button class="${c}" data-act="go" data-i="${i}" aria-label="${t.goQ(qq.n)}">${qq.n}</button>`;
  }).join('');

  const firstOfPass = pass && S.idxs.findIndex(ix => set.questions[ix].p === q.p) === S.cur;
  const passHtml = pass ? `<details class="passage" ${firstOfPass || window.innerWidth > 900 ? 'open' : ''}><summary data-fold="${t.tapFold}">${esc(passLabel(pass))}</summary>
    <div class="pbody"><h3>${esc(pass.title)}</h3>${pass.html}</div></details>` : '';

  return topbar('') + `
  <div class="qbar"><div class="wrap">
    <div class="title">${t.setN(set.id)} · ${esc(setTitle(set))}${subset ? t.wrongOnly : ''}<small>${t.ofN(S.cur + 1, n)}</small></div>
    <div class="right">
      <span class="badge">${S.mode === 'practice' ? t.mPractice : t.mExam}</span>
      ${S.mode === 'exam' ? `<span class="timer" id="timer" aria-label="${t.timeUsed}">⏱ ${fmtTime(Date.now() - S.start)}</span>
        <button class="btn btn-ghost btn-sm" data-act="submit">${t.submitN(done, n)}</button>` : ''}
    </div></div>
    <div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  </div>
  <main class="wrap">
    <div class="quiz ${pass ? 'split' : ''}" id="quiz">
      ${passHtml}
      <section class="qcard" aria-labelledby="qt">
        <div class="qhead"><span class="chip ${CAT[q.c].cls}">${catName(q.c)}</span><span class="topic">${esc(q.t)}</span></div>
        <p class="qnum">${q.n}.</p>
        <p class="qtext" id="qt">${blanks(q.q)}</p>
        <div class="opts" role="group" aria-label="${t.options}">${opts}</div>
        ${fb}
        <div class="actions">${actions}</div>
        <p class="hint">${t.hint(S.mode)}</p>
        <details class="grid-wrap" ${S.mode === 'exam' ? 'open' : ''}><summary>${t.allQs}</summary>
          <div class="qgrid">${grid}</div>
          <div class="legend">${S.mode === 'practice' ? t.lgPractice : t.lgExam}<span>${t.lgCur}</span></div>
        </details>
      </section>
    </div>
  </main>
  ${S.confirm ? confirmModal(n - done) : ''}`;
}

function confirmModal(left) {
  const t = T();
