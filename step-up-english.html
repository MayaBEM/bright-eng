<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Up English</title>
<meta name="description" content="แนวข้อสอบภาษาอังกฤษเข้า ม.1 ห้องเรียนพิเศษ EP / Gifted 5 ชุด 150 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3EA; --paper:#FFFDF8; --paper-2:#F3ECDF; --ink:#1D2939; --ink-2:#4B5565; --ink-3:#7A8494;
  --line:#E6DCCB; --line-2:#D6C9B3;
  --coral:#D9573A; --coral-ink:#B23F25; --coral-soft:#FBE4DB;
  --sage:#4E8461; --sage-ink:#2F6644; --sage-soft:#DFEDE3;
  --sky:#3874A6; --sky-ink:#255A86; --sky-soft:#DCE9F4;
  --butter:#E3AE3A; --butter-ink:#8A6110; --butter-soft:#FAEFD3;
  --navy:#1D2939; --on-navy:#FFF9EF;
  --shadow:0 1px 0 rgba(29,41,57,.04),0 8px 24px -12px rgba(29,41,57,.18);
  --r:14px; --r-sm:10px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181F; --paper:#1C222B; --paper-2:#232A35; --ink:#F1EBDF; --ink-2:#C2BAAC; --ink-3:#8F887C;
  --line:#2E3642; --line-2:#3C4553;
  --coral:#EE7A5C; --coral-ink:#F59A80; --coral-soft:#3A2420;
  --sage:#76B08A; --sage-ink:#93C7A4; --sage-soft:#1F3127;
  --sky:#6FA6D6; --sky-ink:#94BEE3; --sky-soft:#1C2D3E;
  --butter:#E9BE5C; --butter-ink:#F0CF84; --butter-soft:#342A15;
  --navy:#F1EBDF; --on-navy:#14181F;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#14181F; --paper:#1C222B; --paper-2:#232A35; --ink:#F1EBDF; --ink-2:#C2BAAC; --ink-3:#8F887C;
  --line:#2E3642; --line-2:#3C4553;
  --coral:#EE7A5C; --coral-ink:#F59A80; --coral-soft:#3A2420;
  --sage:#76B08A; --sage-ink:#93C7A4; --sage-soft:#1F3127;
  --sky:#6FA6D6; --sky-ink:#94BEE3; --sky-soft:#1C2D3E;
  --butter:#E9BE5C; --butter-ink:#F0CF84; --butter-soft:#342A15;
  --navy:#F1EBDF; --on-navy:#14181F;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;background:none;border:0;padding:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--serif);font-size:19px;line-height:1}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);line-height:1.2}
.brand b{display:block;font-family:var(--serif);font-size:19px;line-height:1.1;letter-spacing:-.01em}
.nav{margin-left:auto;display:flex;gap:4px}
.lang{display:flex;border:1.5px solid var(--line-2);border-radius:9px;overflow:hidden;flex-shrink:0}
.lang button{background:var(--paper);border:0;padding:5px 10px;font-size:13px;font-weight:700;color:var(--ink-3);min-height:34px}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.nav button{white-space:nowrap;background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--ink-2)}
.nav button:hover{background:var(--paper-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--paper-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:16px;text-decoration:none;transition:transform .12s ease,background .15s ease,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--coral);color:#fff}
.btn-primary:hover{background:var(--coral-ink)}
.btn-dark{background:var(--navy);color:var(--on-navy)}
.btn-ghost{background:var(--paper);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-sm{min-height:38px;padding:6px 14px;font-size:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.cg{background:var(--coral-soft);color:var(--coral-ink)}
.cv{background:var(--sage-soft);color:var(--sage-ink)}
.cc{background:var(--sky-soft);color:var(--sky-ink)}
.cr{background:var(--butter-soft);color:var(--butter-ink)}

/* HOME */
.hero{padding-top:56px;padding-bottom:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.kicker{font-weight:600;color:var(--coral-ink);font-size:15px;margin:0 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kicker span{background:var(--paper);border:1px solid var(--line);padding:2px 10px;border-radius:6px;color:var(--ink-2);font-weight:500}
.hero h1{font-size:clamp(32px,4.6vw,52px);line-height:1.18;margin:0 0 18px;letter-spacing:-.01em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--coral);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.18em;background:var(--butter);opacity:.45;z-index:-1;border-radius:3px}
.hero p.lead{font-size:18px;color:var(--ink-2);margin:0 0 26px;max-width:34em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.facts{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.facts div{line-height:1.25}
.facts b{display:block;font-family:var(--serif);font-size:34px;font-weight:700}
.facts span{font-size:14px;color:var(--ink-3)}

.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 28px 30px 52px;box-shadow:var(--shadow);transform:rotate(1.2deg);
  background-image:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);}
.sheet::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:var(--coral);opacity:.35}
.sheet .q-no{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink-3)}
.sheet .q-text{font-size:18px;margin:4px 0 14px}
.sheet .q-text u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 18px}
.sheet ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.sheet li{display:flex;gap:10px;align-items:center}
.sheet li i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:600}
.sheet li.circ i{border:2.5px solid var(--coral);color:var(--coral-ink);transform:rotate(-8deg) scale(1.12)}
.note{position:absolute;right:-14px;bottom:-34px;width:230px;background:var(--butter-soft);border:1px solid color-mix(in srgb,var(--butter) 50%,transparent);padding:12px 14px;border-radius:4px;transform:rotate(-3deg);font-size:14px;line-height:1.5;box-shadow:var(--shadow)}
.note b{color:var(--butter-ink)}
.stamp{position:absolute;top:-14px;right:22px;background:var(--sage);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px;transform:rotate(4deg);letter-spacing:.02em}

.section{padding-top:44px;padding-bottom:44px}
.section h2{font-size:28px;margin:0 0 6px;line-height:1.3}
.section .sub{color:var(--ink-2);margin:0 0 26px}

.blueprint{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.bp{padding:20px 20px 22px;border-right:1px solid var(--line)}
.bp:last-child{border-right:0}
.bp .n{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.bp .n small{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-3);margin-left:4px}
.bp h3{font-size:16px;margin:12px 0 2px}
.bp p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}
.bp .bar{height:6px;border-radius:3px;margin-top:14px}

.sets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.set-row{display:grid;grid-template-columns:76px 1fr auto;gap:20px;align-items:center;padding:22px 4px;border-bottom:1px solid var(--line)}
.set-no{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1;color:var(--ink-3)}
.set-row:hover .set-no{color:var(--coral)}
.set-info h3{margin:0;font-size:21px;line-height:1.35}
.set-info h3 span{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--ink-3);margin-left:8px}
.set-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-top:4px}
.dots{letter-spacing:2px;color:var(--coral)}
.dots s{color:var(--line-2);text-decoration:none}
.best{font-weight:600;color:var(--sage-ink)}
.set-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--ink-2);font-size:15px}

.foot{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--ink-3);font-size:13px;margin-top:20px}

/* QUIZ */
.qbar{background:var(--paper);border-bottom:1px solid var(--line)}
.qbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.qbar .title{font-weight:600;line-height:1.3}
.qbar .title small{display:block;color:var(--ink-3);font-weight:500;font-size:13px}
.qbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--ink-2)}
.progress{height:5px;background:var(--line);}
.progress i{display:block;height:100%;background:var(--coral);transition:width .3s ease}

.quiz{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding:28px 0 60px;max-width:780px;margin:0 auto}
.quiz.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:none}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);align-self:start;position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto}
.passage summary{list-style:none;cursor:default;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--butter-ink);background:var(--butter-soft);border-radius:var(--r) var(--r) 0 0}
.passage summary::-webkit-details-marker{display:none}
.passage .pbody{padding:18px 22px 22px}
.passage h3{font-family:var(--serif);font-size:23px;margin:0 0 10px;line-height:1.3}
.passage p{margin:0 0 12px;font-size:16.5px;line-height:1.75}
.passage .cap{font-size:14px;color:var(--ink-3)}

.sign{border:3px solid var(--ink);border-radius:8px;padding:16px;font-size:15.5px}
.sign-head{font-family:var(--serif);font-weight:700;font-size:22px;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px;letter-spacing:.04em}
.sign-row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.sign-rules{margin:10px 0 0;padding-left:20px}
.sign-rules li::marker{content:"⊘  ";color:var(--coral)}
.notice{background:var(--sage-soft);border-radius:8px;padding:18px;font-size:15.5px}
.notice-kicker{font-weight:700;color:var(--sage-ink);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.notice-head{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.2;margin:2px 0 8px}
.notice-meta{margin:0 0 12px !important}
.notice-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice-cols ul{margin:4px 0 0;padding-left:18px}
.notice-foot{margin:12px 0 0 !important;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--sage) 35%,transparent)}
.ad{border:2px dashed var(--coral);border-radius:10px;padding:18px;text-align:center;font-size:15.5px}
.ad-top{font-size:14px;color:var(--ink-2)}
.ad-head{font-family:var(--serif);font-weight:700;font-size:27px;color:var(--coral-ink);line-height:1.15;margin:4px 0}
.ad-sub{font-weight:600}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;text-align:left}
.ad-grid div{background:var(--paper-2);border-radius:8px;padding:10px 12px}
.ad-grid b,.ad-list b{display:block;font-size:13px;color:var(--ink-3)}
.ad-grid em{font-size:13.5px;color:var(--coral-ink)}
.ad-list{text-align:left;margin-bottom:10px}
.ad-foot{font-size:14px;color:var(--ink-2)}
table.data{width:100%;border-collapse:collapse;font-size:15.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:var(--paper-2);font-size:14px}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.bars .bar{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:15px}
.bars .bt{height:20px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--sky);border-radius:4px}
.bars .bv{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

.qcard{min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead .topic{font-size:14px;color:var(--ink-3)}
.qnum{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink-3);margin:0 0 2px}
.qtext{font-size:21px;line-height:1.6;margin:0 0 22px;font-weight:500}
.qtext u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--coral)}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid var(--ink);margin:0 4px;transform:translateY(-4px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-height:58px;font-size:17px;line-height:1.5;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.opt .key{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--bg)}
.opt.sel{border-color:var(--navy);background:var(--paper-2)}
.opt.sel .key{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.opt .mark{font-size:13px;font-weight:700;white-space:nowrap}
.opt.ok{border-color:var(--sage);background:var(--sage-soft)}
.opt.ok .key{background:var(--sage);border-color:var(--sage);color:#fff}
.opt.ok .mark{color:var(--sage-ink)}
.opt.bad{border-color:var(--coral);background:var(--coral-soft)}
.opt.bad .key{background:var(--coral);border-color:var(--coral);color:#fff}
.opt.bad .mark{color:var(--coral-ink)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.6}

.fb{margin-top:18px;border-radius:var(--r);padding:16px 20px;border-left:5px solid;background:var(--paper);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);animation:rise .25s ease}
.fb.ok{border-left-color:var(--sage)}
.fb.bad{border-left-color:var(--coral)}
.fb-head{font-weight:700;font-size:17px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.fb.ok .fb-head{color:var(--sage-ink)}
.fb.bad .fb-head{color:var(--coral-ink)}
.fb-body{font-size:16px;line-height:1.75;color:var(--ink)}
.fb-body i{color:var(--ink-2)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.actions .grow{flex:1}
.hint{font-size:13px;color:var(--ink-3);margin-top:12px}
.hint kbd{font-family:var(--sans);font-size:12px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}

.grid-wrap{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.grid-wrap summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--ink-2)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px}
.qgrid button{height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.qgrid button.done{background:var(--paper-2);border-color:var(--line-2)}
.qgrid button.gok{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-ink)}
.qgrid button.gbad{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}
.qgrid button.cur{outline:2.5px solid var(--navy);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:10px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,24,31,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease}
.modal{background:var(--paper);border-radius:var(--r);padding:26px;max-width:420px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
.modal h3{margin:0 0 8px;font-size:21px}
.modal p{margin:0 0 20px;color:var(--ink-2)}
.modal .actions{justify-content:flex-end;margin:0}
@keyframes fade{from{opacity:0}}

/* RESULT */
.result-top{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;padding:40px 0 30px}
.score-ring{--p:0;width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--ring,var(--sage)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.score-ring div{width:146px;height:146px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;line-height:1.1}
.score-ring b{font-family:var(--serif);font-size:48px;font-weight:700}
.score-ring span{font-size:14px;color:var(--ink-3)}
.result-top h1{font-size:clamp(26px,3.6vw,36px);margin:0 0 6px;line-height:1.3}
.result-top p{margin:0 0 18px;color:var(--ink-2);font-size:17px}
.catbars{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.catbar .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}
.catbar .row b{font-variant-numeric:tabular-nums}
.catbar .track{height:9px;background:var(--paper-2);border-radius:5px;overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:5px}
.advice{margin-top:16px;padding:14px 18px;background:var(--butter-soft);border-radius:var(--r-sm);font-size:15.5px}
.advice button{background:none;border:0;padding:0;color:var(--coral-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:6px;margin:32px 0 14px;flex-wrap:wrap;align-items:center}
.tabs h2{margin:0 auto 0 0;font-size:22px}
.tabs button{border:1.5px solid var(--line-2);background:var(--paper);padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:12px}
.rv summary{cursor:pointer;list-style:none;padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.rv summary::-webkit-details-marker{display:none}
.rv .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;margin-top:2px}
.rv .st.ok{background:var(--sage)}
.rv .st.bad{background:var(--coral)}
.rv .st.skip{background:var(--ink-3)}
.rv .rq{font-size:16px;line-height:1.55;min-width:0}
.rv .rq small{display:block;font-size:13px;color:var(--ink-3)}
.rv .chev{color:var(--ink-3);transition:transform .2s;margin-top:4px}
.rv[open] .chev{transform:rotate(90deg)}
.rv .rbody{padding:0 18px 18px 58px}
.rv .ans{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:15.5px}
.rv .ans .y{color:var(--coral-ink)}
.rv .ans .c{color:var(--sage-ink);font-weight:600}
.rv .exp{font-size:15.5px;line-height:1.75;background:var(--paper-2);border-radius:10px;padding:12px 16px}

/* NOTES */
.notes{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;padding:36px 0 60px}
.toc{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:15px}
.toc b{font-size:13px;color:var(--ink-3);margin:12px 0 4px;font-weight:600}
.toc b:first-child{margin-top:0}
.toc a{text-decoration:none;padding:5px 10px;border-radius:6px;color:var(--ink-2);border-left:3px solid transparent}
.toc a:hover{background:var(--paper-2);color:var(--ink)}
.note-sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;margin-bottom:18px;scroll-margin-top:84px}
.note-sec h2{margin:8px 0 12px;font-size:22px;line-height:1.3}
.note-sec p,.note-sec li{font-size:16px}
.note-sec ol,.note-sec ul{padding-left:22px;margin:8px 0}
.note-sec li{margin-bottom:4px}
.note-sec .ex{background:var(--paper-2);border-radius:8px;padding:10px 14px}
.note-sec .tip{background:var(--butter-soft);border-radius:8px;padding:10px 14px;font-size:15px}
.note-sec .tip::before{content:"เคล็ดลับ  ";font-weight:700;color:var(--butter-ink)}
html:lang(en) .note-sec .tip::before{content:"Tip  "}
table.mini{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0;display:block;overflow-x:auto}
table.mini th,table.mini td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.mini th{background:var(--paper-2);font-size:14px}

/* PRINT VIEW */
.print-view{max-width:820px;margin:0 auto;padding:30px 0 60px}
.print-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:26px}
.print-bar p{margin:0 auto 0 0;font-size:15px;color:var(--ink-2)}
.pv h1{font-size:26px;margin:0 0 2px}
.pv .pv-sub{color:var(--ink-3);margin:0 0 6px}
.pv .pv-name{border-bottom:1px solid var(--line-2);padding:14px 0 6px;margin-bottom:20px;color:var(--ink-2);font-size:15px}
.pv h2{font-size:18px;margin:26px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.pv-q{margin:0 0 14px;break-inside:avoid}
.pv-q .t{margin:0 0 4px}
.pv-q ol{list-style:none;padding:0 0 0 26px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.pv-pass{border:1px solid var(--line-2);border-radius:8px;padding:14px 18px;margin:8px 0 16px;break-inside:avoid}
.pv-pass h3{margin:0 0 6px;font-family:var(--serif)}
.pv-key{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 12px;font-variant-numeric:tabular-nums;margin-bottom:16px}
.pv-exp{font-size:14.5px;margin:0 0 10px;break-inside:avoid}
.page-break{break-before:page}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:40px;padding-top:36px}
  .sheet{margin:0 10px 30px}
  .note{position:relative;right:auto;bottom:auto;margin:18px 0 -10px auto}
  .quiz.split{grid-template-columns:minmax(0,1fr)}
  .passage{position:static;max-height:none}
  .passage summary{cursor:pointer}
  .passage summary::after{content:attr(data-fold);font-weight:500;color:var(--ink-3)}
  .notes{grid-template-columns:minmax(0,1fr)}
  .notes>*{min-width:0}
  .toc{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  .toc b{display:none}
  .toc a{border:1px solid var(--line);background:var(--paper);font-size:14px}
  .blueprint{grid-template-columns:1fr 1fr}
  .bp:nth-child(2){border-right:0}
  .bp:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:600px){
  body{font-size:16px}
  .nav button{padding:8px 8px;font-size:14px}
  .brand small{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .top .wrap{gap:6px}
  .nav button{padding:8px 6px}
  .brand-mark{display:none}
  .lang button{padding:4px 8px}
  .set-row{grid-template-columns:48px 1fr;gap:12px}
  .set-no{font-size:34px}
  .set-actions{grid-column:1 / -1;justify-content:stretch}
  .set-actions .btn{flex:1}
  .modes{grid-template-columns:1fr}
  .qtext{font-size:19px}
  .opt{grid-template-columns:32px 1fr;padding:12px 12px;font-size:16px}
  .opt .key{width:30px;height:30px}
  .opt .mark{grid-column:2}
  .result-top{grid-template-columns:1fr;justify-items:center;text-align:center;gap:20px}
  .catbars{grid-template-columns:1fr}
  .rv .rbody{padding-left:18px}
  .sheet{padding:24px 18px 24px 40px}
  .sheet::before{left:26px}
  .sheet ol{grid-template-columns:1fr}
  .sign-row{grid-template-columns:1fr;gap:0}
  .notice-cols,.ad-grid{grid-template-columns:1fr}
  .bars .bar{grid-template-columns:92px 1fr 40px}
  .pv-q ol{grid-template-columns:1fr}
  .pv-key{grid-template-columns:repeat(3,1fr)}
  .qbar .right{margin-left:0;width:100%;justify-content:space-between}
  .note-sec{padding:20px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media print{
  body{background:#fff;color:#000;font-size:12.5pt}
  .top,.print-bar,.foot{display:none !important}
  .print-view{padding:0;max-width:none}
  .pv-pass{border-color:#999}
}

      ee:`<b>since + a point in time</b> (since 2019) shows that something started in the past and is <b>still going on now</b>, so we use the Present Perfect: <b>has/have + V3</b>. “My family” is singular → <b>has lived</b><br>Trap: <i>lived</i> (Past Simple) means they lived there and it is finished, which doesn’t fit with since` },
    { c:`g`, t:`Past Simple vs Past Continuous`, q:`While Mali ___ her homework, the lights suddenly went out.`,
      o:[`did`,`was doing`,`has done`,`does`], a:1,
      e:`โครงสร้าง <b>While + Past Continuous, Past Simple</b> ใช้เมื่อเหตุการณ์หนึ่ง <b>กำลังเกิด</b> (ทำการบ้าน) แล้วมีอีกเหตุการณ์ <b>แทรกเข้ามา</b> (ไฟดับ)<br>เหตุการณ์ที่กำลังทำอยู่ → <b>was doing</b>`,
      ee:`The pattern <b>While + Past Continuous, Past Simple</b> is used when one action <b>was in progress</b> (doing homework) and another action <b>interrupted</b> it (the lights went out)<br>The action in progress → <b>was doing</b>` },

      ee:`English <b>is spoken</b> by people — a language can’t speak by itself, so the subject receives the action → Passive: <b>is/am/are + V3</b><br>It is a general fact, so use the Present Simple → <b>is spoken</b>` },
    { c:`g`, t:`Passive Voice`, q:`The new library in our school ___ last year.`,

      e:`ห้องสมุด <b>ถูกสร้าง</b> (สร้างตัวเองไม่ได้) → Passive และมี <b>last year</b> บอกอดีต → <b>was + V.3</b> = <b>was built</b><br>ตัวลวง: <i>has built</i> เป็น Active และใช้กับ last year ไม่ได้`,
      ee:`The library <b>was built</b> (it can’t build itself) → Passive, and <b>last year</b> shows the past → <b>was + V3</b> = <b>was built</b><br>Trap: <i>has built</i> is Active and can’t be used with last year` },
    { c:`g`, t:`Relative Clauses`, q:`The girl ___ bicycle was stolen reported it to the police.`,
      o:[`who`,`whom`,`which`,`whose`], a:3,
      e:`หลังช่องว่างเป็น <b>คำนาม</b> (bicycle) ที่เป็น <b>ของ</b> the girl → ใช้ <b>whose + คำนาม</b> แสดงความเป็นเจ้าของ<br>จำง่าย: whose = “ของ…” เช่น the girl whose bicycle = เด็กหญิงที่จักรยาน<b>ของเธอ</b>ถูกขโมย`,
      ee:`After the blank comes a <b>noun</b> (bicycle) that <b>belongs to</b> the girl → use <b>whose + noun</b> to show possession<br>Easy tip: whose = “belonging to …”, e.g. the girl whose bicycle was stolen = the girl, and <b>her</b> bicycle was stolen` },
    { c:`g`, t:`Relative Clauses`, q:`The smartphone ___ my father bought yesterday is very expensive.`,

      e:`คำนามที่ถูกขยายคือ <b>The smartphone</b> ซึ่งเป็น <b>สิ่งของ</b> → ใช้ <b>which</b> (หรือ that)<br>who / whom ใช้กับคน, whose ต้องตามด้วยคำนาม`,
      ee:`The noun being described is <b>The smartphone</b>, which is a <b>thing</b> → use <b>which</b> (or that)<br>who / whom are for people, and whose must be followed by a noun` },
    { c:`g`, t:`Conjunctions: ความขัดแย้ง`, q:`___ it was raining heavily, the students continued playing football.`,

      ee:`It rained heavily <b>but</b> they kept playing → the ideas contrast, so cross out Because / Therefore<br>After the blank comes a <b>clause</b> (it was raining) → use <b>Although + clause</b><br>Trap: <i>Despite</i> must be followed by a <b>noun / V-ing</b>, e.g. Despite the heavy rain` },
    { c:`g`, t:`Conjunctions: เหตุผล`, q:`The flight was delayed ___ the heavy storm.`,

      ee:`The storm is the <b>reason</b> the flight was late, and after the blank comes a <b>noun phrase</b> (the heavy storm) → <b>because of + noun</b><br>If you use <i>because</i>, it must be followed by a clause, e.g. because there was a heavy storm` },
    { c:`g`, t:`Subject-Verb Agreement`, q:`The box of chocolates on the shelves ___ a gift from my aunt.`,
      o:[`are`,`were`,`is`,`be`], a:2,
      e:`ประธานตัวจริงคือ <b>The box</b> (เอกพจน์) ส่วน <i>of chocolates on the shelves</i> เป็นแค่ส่วนขยาย อย่าหลงไปผันตาม chocolates หรือ shelves<br>ประธานเอกพจน์ + ปัจจุบัน → <b>is</b>`,
      ee:`The real subject is <b>The box</b> (singular). <i>of chocolates on the shelves</i> only describes it — don’t be tricked into matching the verb to chocolates or shelves<br>Singular subject + present → <b>is</b>` },
    { c:`g`, t:`Comparison`, q:`Of all the students in the class, Nida is the ___ at drawing.`,

      e:`<b>Of all the students</b> + <b>the</b> → เปรียบเทียบขั้นสูงสุด (Superlative)<br>good เปลี่ยนรูปพิเศษ: <b>good → better → best</b> ไม่มี “most good” หรือ “goodest”`,
      ee:`<b>Of all the students</b> + <b>the</b> → the highest degree (Superlative)<br>good has special forms: <b>good → better → best</b>. There is no “most good” or “goodest”` },

    { c:`v`, t:`Synonyms`, q:`The blue whale is an <u>enormous</u> animal. It can grow up to 30 metres long.<br>The word “enormous” is closest in meaning to ___.`,
      o:[`huge`,`tiny`,`fast`,`gentle`], a:0,
      e:`<b>enormous</b> = ใหญ่โตมาก ความหมายเดียวกับ <b>huge</b><br>บริบทช่วย: “can grow up to 30 metres long” บอกชัดว่าใหญ่มาก<br>ตัวลวง: <i>tiny</i> = เล็กมาก (ความหมายตรงข้าม)`,
      ee:`<b>enormous</b> = extremely big, the same meaning as <b>huge</b><br>Context helps: “can grow up to 30 metres long” clearly shows it is very big<br>Trap: <i>tiny</i> = very small (the opposite meaning)` },
    { c:`v`, t:`Antonyms`, q:`Tom is very <u>generous</u>. He always shares his snacks with his friends.<br>Which word is OPPOSITE in meaning to “generous”?`,

      e:`<b>generous</b> = ใจกว้าง ชอบแบ่งปัน → คำตรงข้ามคือ <b>selfish</b> = เห็นแก่ตัว<br>kind, honest, friendly เป็นคำความหมายบวกทั้งหมด จึงไม่ใช่คำตรงข้าม`,
      ee:`<b>generous</b> = kind and happy to share → the opposite is <b>selfish</b> = only thinking of yourself<br>kind, honest and friendly are all positive words, so they are not opposites` },
    { c:`v`, t:`Context Clues`, q:`The water in the old well was <u>contaminated</u>, so nobody could drink it safely.<br>“Contaminated” probably means ___.`,
      o:[`fresh and cold`,`dirty and unsafe`,`deep and dark`,`expensive`], a:1,
      e:`เบาะแสอยู่หลัง <b>so</b>: “nobody could drink it safely” (ไม่มีใครดื่มได้อย่างปลอดภัย) → น้ำต้อง <b>สกปรก/ปนเปื้อน</b><br><b>contaminated</b> = ปนเปื้อน`,
      ee:`The clue comes after <b>so</b>: “nobody could drink it safely” → the water must be <b>dirty/polluted</b><br><b>contaminated</b> = made dirty or unsafe` },
    { c:`v`, t:`Idioms`, q:`Don’t worry about the spelling test. It will be <u>a piece of cake</u> for you.<br>The underlined idiom means ___.`,
      o:[`very difficult`,`very boring`,`very easy`,`very delicious`], a:2,
      e:`<b>a piece of cake</b> = ง่ายมาก (ง่ายเหมือนกินขนมเค้กหนึ่งชิ้น)<br>บริบท “Don’t worry” ก็สนับสนุนว่าไม่ต้องกังวลเพราะง่าย`,
      ee:`<b>a piece of cake</b> = very easy (as easy as eating a piece of cake)<br>The context “Don’t worry” also shows there is nothing to worry about because it’s easy` },
    { c:`v`, t:`Idioms`, q:`I’m feeling a bit <u>under the weather</u> today, so I’ll stay at home.<br>What does the speaker mean?`,
      o:[`She is excited.`,`She is slightly ill.`,`She is very busy.`,`She doesn’t like rain.`], a:1,
      e:`<b>under the weather</b> = ไม่ค่อยสบาย ป่วยเล็กน้อย ไม่เกี่ยวกับสภาพอากาศจริง ๆ<br>ตัวลวง: <i>She doesn’t like rain</i> แปลตามตัวอักษร ซึ่งเป็นกับดักที่พบบ่อยของสำนวน`,
      ee:`<b>under the weather</b> = a little ill, not feeling well. It has nothing to do with the real weather<br>Trap: <i>She doesn’t like rain</i> takes the words literally — a very common trap with idioms` },
    { c:`v`, t:`Word Forms`, q:`Students need to use their ___ to design a new robot.`,

      e:`หลัง <b>their</b> (คำแสดงความเป็นเจ้าของ) ต้องเป็น <b>คำนาม</b><br>create (v.) → creative (adj.) → <b>creativity (n.)</b> → creatively (adv.)<br>จำ suffix คำนาม: -ity, -tion, -ness, -ment`,
      ee:`After <b>their</b> (a possessive word) we need a <b>noun</b><br>create (v.) → creative (adj.) → <b>creativity (n.)</b> → creatively (adv.)<br>Remember noun suffixes: -ity, -tion, -ness, -ment` },
    { c:`v`, t:`Word Forms`, q:`Listen! Pim is singing ___ on the stage.`,
      o:[`beauty`,`beautiful`,`beautify`,`beautifully`], a:3,
      e:`ช่องว่างขยาย <b>กริยา</b> (singing) ว่าร้องอย่างไร → ต้องใช้ <b>คำวิเศษณ์ (adverb)</b> ซึ่งมักลงท้าย -ly → <b>beautifully</b><br>ตัวลวง: <i>beautiful</i> เป็น adjective ใช้ขยายคำนาม เช่น a beautiful song`,
      ee:`The blank describes the <b>verb</b> (singing) — how she sings → we need an <b>adverb</b>, which often ends in -ly → <b>beautifully</b><br>Trap: <i>beautiful</i> is an adjective that describes nouns, e.g. a beautiful song` },

    { c:`c`, t:`Asking for Help`, q:`A: ___ the window? It’s really hot in here.<br>B: Not at all. I’ll do it now.`,
      o:[`Would you mind opening`,`Would you mind to open`,`You must open`,`Do you mind open`], a:0,
      e:`<b>Would you mind + V-ing?</b> เป็นการขอร้องที่สุภาพมาก (mind ตามด้วย V-ing เสมอ)<br>ข้อสังเกต: การตอบ <b>“Not at all.”</b> แปลว่า “ไม่รังเกียจเลย” = <b>ยินดีช่วย</b> ไม่ใช่การปฏิเสธ<br>ตัวลวง: <i>You must open</i> เป็นคำสั่ง ไม่สุภาพ`,
      ee:`<b>Would you mind + V-ing?</b> is a very polite request (mind is always followed by V-ing)<br>Note: the answer <b>“Not at all.”</b> means “I don’t mind at all” = <b>happy to help</b>, not a refusal<br>Trap: <i>You must open</i> is an order, not polite` },
    { c:`c`, t:`Responding to Offers`, q:`A: Would you like to come to my birthday party on Saturday?<br>B: ___ I have to visit my grandmother in Chanthaburi.`,
      o:[`Yes, I’d love to.`,`I’d love to, but`,`No, I don’t like parties with you.`,`Of course. Here you are.`], a:1,
      e:`B ให้เหตุผลว่าต้องไปเยี่ยมยาย = <b>ปฏิเสธ</b> คำเชิญ วิธีปฏิเสธอย่างสุภาพคือ <b>“I’d love to, but…”</b> (อยากไปนะ แต่…)<br>ตัวลวง: <i>Yes, I’d love to</i> ตอบรับ ซึ่งขัดกับเหตุผลที่ตามมา, <i>Here you are</i> ใช้ตอนยื่นของให้`,
      ee:`B gives a reason — she has to visit her grandmother = she is <b>refusing</b> the invitation. A polite way to refuse is <b>“I’d love to, but…”</b><br>Traps: <i>Yes, I’d love to</i> accepts, which doesn’t match the reason that follows; <i>Here you are</i> is used when handing something to someone` },
    { c:`c`, t:`Apologies & Excuses`, q:`Teacher: Ken, you’re twenty minutes late.<br>Ken: ___`,
      o:[`So what? It’s only twenty minutes.`,`I’m terribly sorry. The bus broke down.`,`Never mind.`,`You’re welcome.`], a:1,
      e:`เมื่อทำผิด (มาสาย) ควร <b>ขอโทษ + ให้เหตุผล</b> → “I’m terribly sorry. The bus broke down.”<br><i>Never mind</i> เป็นคำที่ <b>ผู้ถูกขอโทษ</b> ใช้ตอบ, <i>You’re welcome</i> ใช้ตอบคำขอบคุณ`,
      ee:`When you do something wrong (being late), you should <b>apologise + give a reason</b> → “I’m terribly sorry. The bus broke down.”<br><i>Never mind</i> is what the <b>person receiving the apology</b> says, and <i>You’re welcome</i> is a reply to thank you` },
    { c:`c`, t:`Giving Directions`, q:`A: Excuse me. How can I get to the post office?<br>B: Go straight ahead and ___ left at the traffic lights. It’s next to the bank.`,
      o:[`turn`,`walk`,`cross`,`stay`], a:0,
      e:`การบอกทางเลี้ยวใช้ <b>turn left / turn right</b> (เลี้ยวซ้าย/ขวา)<br>สำนวนบอกทางอื่น ๆ: go straight ahead (ตรงไป), next to (ติดกับ), opposite (ตรงข้าม), between A and B (ระหว่าง)`,
      ee:`To give directions for turning, use <b>turn left / turn right</b><br>Other direction phrases: go straight ahead, next to, opposite, between A and B` },
    { c:`c`, t:`Expressing Opinions`, q:`A: I think students should wear uniforms to school.<br>B: ___ Uniforms make everyone look equal.`,
      o:[`I’m afraid I disagree.`,`I completely agree.`,`That’s not true at all.`,`I don’t think so.`], a:1,
      e:`ประโยคที่ตามมา “Uniforms make everyone look equal” <b>สนับสนุน</b> ความเห็นของ A → B ต้อง <b>เห็นด้วย</b> → <b>I completely agree.</b><br>อีก 3 ตัวเลือกเป็นการไม่เห็นด้วยทั้งหมด (I’m afraid I disagree = ไม่เห็นด้วยอย่างสุภาพ)`,
      ee:`The next sentence “Uniforms make everyone look equal” <b>supports</b> A’s opinion → B must <b>agree</b> → <b>I completely agree.</b><br>The other 3 choices all disagree (I’m afraid I disagree = a polite way to disagree)` },

    { c:`r`, p:`A`, t:`Main Idea`, q:`What is the best title for Passage A?`,
      o:[`Turtles: The Best Pets for Children`,`How to Cook Jellyfish`,`Dangers to Sea Turtles and How People Help`,`The History of Thai Islands`], a:2,
      e:`ย่อหน้าแรกพูดถึง <b>อันตรายจากพลาสติก</b> ย่อหน้าที่สองพูดถึง <b>การสูญเสียชายหาดวางไข่</b> และ <b>อาสาสมัครที่ช่วยเหลือ</b> → ชื่อเรื่องที่ครอบคลุมทั้งหมดคือ “Dangers to Sea Turtles and How People Help”<br>เทคนิค: ชื่อเรื่องที่ดีต้องครอบคลุม <b>ทุกย่อหน้า</b> ไม่แคบหรือกว้างเกินไป`,
      ee:`Paragraph 1 is about the <b>danger of plastic</b>. Paragraph 2 is about <b>losing nesting beaches</b> and <b>volunteers who help</b> → the title that covers everything is “Dangers to Sea Turtles and How People Help”<br>Tip: a good title must cover <b>every paragraph</b> — not too narrow and not too broad` },
    { c:`r`, p:`A`, t:`Detail`, q:`According to the passage, why do sea turtles eat plastic bags?`,
      o:[`They like the taste of plastic.`,`Volunteers feed them plastic.`,`They think the bags are jellyfish.`,`There is no other food in the sea.`], a:2,
      e:`บทความเขียนตรง ๆ ว่า “Turtles often <b>mistake plastic bags for jellyfish</b>” (mistake A for B = เข้าใจผิดว่า A คือ B)<br>คำถามประเภท Detail คำตอบจะ <b>อยู่ในเนื้อเรื่อง</b> เสมอ ให้หา keyword จากคำถามแล้วกลับไปอ่านรอบ ๆ`,
      ee:`The passage says it directly: “Turtles often <b>mistake plastic bags for jellyfish</b>” (mistake A for B = wrongly think A is B)<br>For Detail questions, the answer is <b>always in the text</b>. Find the keyword from the question and read around it` },
    { c:`r`, p:`A`, t:`Pronoun Reference`, q:`In the sentence “When they eat <u>them</u>, the plastic blocks their stomachs,” the word “them” refers to ___.`,
      o:[`jellyfish`,`turtles`,`plastic bags`,`favourite foods`], a:2,
      e:`they = เต่า (ผู้กิน) ส่วน <b>them</b> = สิ่งที่ถูกกิน และประโยคต่อมาบอกว่า “<b>the plastic</b> blocks their stomachs” → สิ่งที่เต่ากินเข้าไปจนอุดตันคือ <b>plastic bags</b><br>เทคนิค: แทนคำตอบลงไปในประโยคแล้วอ่านดูว่าความหมายเข้ากันไหม`,
      ee:`they = the turtles (the ones eating), and <b>them</b> = the things being eaten. The next part says “<b>the plastic</b> blocks their stomachs” → what the turtles eat and get blocked by is <b>plastic bags</b><br>Tip: put your answer into the sentence and read it again to check the meaning makes sense` },
    { c:`r`, p:`A`, t:`Inference`, q:`What can we infer about building hotels on beaches?`,
      o:[`It can reduce the number of baby turtles.`,`It helps turtles find food more easily.`,`It is the main reason turtles eat plastic.`,`It makes turtles lay more eggs.`], a:0,
      e:`บทความบอกว่าเต่าตัวเมียกลับมาวางไข่ที่ <b>ชายหาดเดิม</b> และถ้ามีโรงแรม “the turtles have <b>nowhere to go</b>” → อนุมานได้ว่าเต่าวางไข่ไม่ได้ <b>ลูกเต่าจึงลดลง</b><br>Inference คือข้อสรุปที่ไม่ได้เขียนตรง ๆ แต่ <b>มีหลักฐานรองรับ</b> ในเนื้อเรื่อง`,
      ee:`The passage says female turtles return to the <b>same beach</b> to lay eggs, and if hotels are built there, “the turtles have <b>nowhere to go</b>” → we can infer they can’t lay eggs, so <b>there will be fewer baby turtles</b><br>An inference is a conclusion that is not written directly but is <b>supported by evidence</b> in the text` },
    { c:`r`, p:`B`, t:`Detail (Sign)`, q:`A 13-year-old student with an ID card visits Blue Bay Aquarium with her mother. How much do they pay in total?`,
      o:[`230 baht`,`250 baht`,`300 baht`,`180 baht`], a:1,
      e:`นักเรียนอายุ 13 ปี <b>ไม่ใช่</b> “Children (under 12)” แต่มีบัตรนักเรียน → <b>100 baht</b><br>แม่ = Adult → <b>150 baht</b><br>รวม 100 + 150 = <b>250 baht</b><br>กับดัก: 230 baht มาจากการคิดราคาเด็ก 80 + 150`,
      ee:`A 13-year-old student is <b>not</b> “Children (under 12)”, but she has a student ID card → <b>100 baht</b><br>Mother = Adult → <b>150 baht</b><br>Total 100 + 150 = <b>250 baht</b><br>Trap: 230 baht comes from using the child price 80 + 150` },
    { c:`r`, p:`B`, t:`Detail (Sign)`, q:`On which day is the aquarium closed?`,
      o:[`Sunday`,`Tuesday`,`Saturday`,`Monday`], a:3,
      e:`ป้ายเขียนว่า “Closed on <b>Mondays</b>” และเปิด Tuesday – Sunday`,
      ee:`The sign says “Closed on <b>Mondays</b>” and it is open Tuesday – Sunday` },
    { c:`r`, p:`B`, t:`Inference (Sign)`, q:`Why is flash photography probably not allowed at the aquarium?`,
      o:[`Flash cameras are too expensive.`,`The bright light may scare or harm the animals.`,`Visitors are not allowed to bring phones.`,`The aquarium sells its own photos.`], a:1,
      e:`ป้ายไม่ได้บอกเหตุผลตรง ๆ ต้อง <b>อนุมาน</b>: กฎข้ออื่น “do not tap on the glass” ก็มีเป้าหมายเพื่อ <b>ไม่รบกวนสัตว์</b> ดังนั้นการห้ามแฟลชน่าจะเพราะแสงจ้าทำให้สัตว์ตกใจหรือเป็นอันตราย<br>ตัวลวง: ป้ายไม่ได้ห้ามนำโทรศัพท์เข้า`,
      ee:`The sign doesn’t give the reason directly, so we must <b>infer</b>: another rule, “do not tap on the glass”, also aims to <b>not disturb the animals</b>. So flash is probably banned because bright light can scare or harm the animals<br>Trap: the sign does not ban bringing phones` },
    { c:`r`, p:`B`, t:`Detail (Sign)`, q:`Which of these is ALLOWED inside the aquarium?`,
      o:[`Eating a sandwich`,`Tapping on the glass`,`Taking photos without flash`,`Drinking juice`], a:2,
      e:`ป้ายห้ามเฉพาะ <b>flash photography</b> (ถ่ายรูปแบบใช้แฟลช) จึงถ่ายรูปแบบ <b>ไม่ใช้แฟลช</b> ได้<br>การกินแซนด์วิชและดื่มน้ำผลไม้ผิดกฎ “Food and drinks are not allowed inside”`,
      ee:`The sign only bans <b>flash photography</b>, so taking photos <b>without flash</b> is allowed<br>Eating a sandwich and drinking juice break the rule “Food and drinks are not allowed inside”` }
  ]
});

  passages: {

      title: `Phones, Blue Light and Sleep`,
      html: `<p>Many teenagers use their smartphones late at night. Scientists have found that this habit can be harmful. Phone screens give off blue light, which tells the brain that it is still daytime. As a result, the body produces less melatonin, a chemical that helps us feel sleepy.</p>
<p>Students who use their phones in bed often fall asleep later and wake up feeling tired. This can affect their grades at school. Experts suggest that teenagers should stop using screens at least one hour before bedtime. Some phones now have a “night mode” that reduces blue light. However, the best solution is simply to keep the phone outside the bedroom.</p>`

  questions: [
    { c:`g`, t:`Present Perfect`, q:`A: Have you ever ___ to Japan?<br>B: Yes, I went there with my family last summer.`,
      o:[`go`,`went`,`been`,`going`], a:2,
      e:`ถามถึง <b>ประสบการณ์</b> (Have you ever…?) ใช้ Present Perfect: have + V.3<br><b>have been to</b> = เคยไป (และกลับมาแล้ว)<br>เปรียบเทียบ: <i>has gone to</i> = ไปแล้วและ <b>ยังไม่กลับ</b>`,
      ee:`The question asks about <b>experience</b> (Have you ever…?), so use the Present Perfect: have + V3<br><b>have been to</b> = have visited (and come back)<br>Compare: <i>has gone to</i> = went there and <b>hasn’t come back yet</b>` },
    { c:`g`, t:`Past Simple vs Past Continuous`, q:`I ___ TV when my mother called me for dinner.`,
      o:[`watched`,`was watching`,`am watching`,`have watched`], a:1,
      e:`เหตุการณ์ที่ <b>กำลังทำอยู่</b> ในอดีต (ดูทีวี) ถูก <b>เหตุการณ์สั้น ๆ แทรก</b> (แม่เรียก) →<br><b>Past Continuous</b> (was watching) + <b>when</b> + <b>Past Simple</b> (called)`,
      ee:`An action that was <b>in progress</b> in the past (watching TV) was <b>interrupted by a short action</b> (Mum called) →<br><b>Past Continuous</b> (was watching) + <b>when</b> + <b>Past Simple</b> (called)` },
    { c:`g`, t:`Passive Voice`, q:`Millions of emails ___ around the world every day.`,
      o:[`send`,`are sending`,`are sent`,`sent`], a:2,
      e:`อีเมล <b>ถูกส่ง</b> (ส่งตัวเองไม่ได้) → Passive<br>every day = ความจริงทั่วไป → Present Simple Passive: <b>are + V.3</b> (emails เป็นพหูพจน์) → <b>are sent</b>`,
      ee:`Emails <b>are sent</b> (they can’t send themselves) → Passive<br>every day = a general fact → Present Simple Passive: <b>are + V3</b> (emails is plural) → <b>are sent</b>` },
    { c:`g`, t:`Passive Voice`, q:`Mobile phones must ___ off during the exam.`,
      o:[`turn`,`be turned`,`turned`,`be turning`], a:1,
      e:`โทรศัพท์ <b>ถูกปิด</b> โดยนักเรียน → Passive<br>หลัง modal (must, can, should, will) ใช้โครงสร้าง <b>modal + be + V.3</b> → must <b>be turned</b> off`,
      ee:`The phones <b>are turned off</b> by the students → Passive<br>After a modal (must, can, should, will) use <b>modal + be + V3</b> → must <b>be turned</b> off` },
    { c:`g`, t:`Relative Clauses`, q:`Marie Curie was a scientist ___ won two Nobel Prizes.`,
      o:[`who`,`which`,`whose`,`whom`], a:0,
      e:`ขยาย <b>a scientist</b> (คน) และช่องว่างทำหน้าที่ <b>ประธาน</b> ของกริยา won → ใช้ <b>who</b><br>whom ใช้เมื่อเป็น <b>กรรม</b> (ตามด้วยประธาน + กริยา เช่น whom we met)`,
      ee:`It describes <b>a scientist</b> (a person), and the blank is the <b>subject</b> of the verb won → use <b>who</b><br>whom is used when it is the <b>object</b> (followed by a subject + verb, e.g. whom we met)` },
    { c:`g`, t:`Relative Clauses`, q:`The man ___ we met at the science fair is a famous inventor.`,
      o:[`whose`,`which`,`whom`,`what`], a:2,
      e:`ขยาย <b>The man</b> (คน) และหลังช่องว่างมีประธาน <b>we</b> + กริยา <b>met</b> อยู่แล้ว → ช่องว่างทำหน้าที่ <b>กรรม</b> (we met <i>him</i>) → ใช้ <b>whom</b><br>ตัวลวง: <i>what</i> ใช้เป็น relative pronoun ขยายคำนามไม่ได้`,
      ee:`It describes <b>The man</b> (a person), and after the blank there is already a subject <b>we</b> + verb <b>met</b> → the blank is the <b>object</b> (we met <i>him</i>) → use <b>whom</b><br>Trap: <i>what</i> can’t be used as a relative pronoun to describe a noun` },
    { c:`g`, t:`Conjunctions: ความขัดแย้ง`, q:`The robot is very expensive. ___, many schools want to buy it.`,
      o:[`Therefore`,`However`,`Because`,`Although`], a:1,
      e:`แพงมาก <b>แต่</b> ยังอยากซื้อ → ขัดแย้ง ตัด Therefore, Because<br>ตำแหน่งคือ <b>ต้นประโยคใหม่ + เครื่องหมายจุลภาค</b> → <b>However,</b><br>ตัวลวง: <i>Although</i> ต้องเชื่อมสองประโยคในประโยคเดียว เช่น Although the robot is expensive, many schools…`,
      ee:`Very expensive <b>but</b> they still want to buy it → contrast, so cross out Therefore and Because<br>The position is <b>the start of a new sentence + a comma</b> → <b>However,</b><br>Trap: <i>Although</i> must join two clauses in one sentence, e.g. Although the robot is expensive, many schools…` },
    { c:`g`, t:`Conjunctions: ผลลัพธ์`, q:`Nok practised coding every day. ___, she won the national competition.`,
      o:[`However`,`Although`,`As a result`,`Despite`], a:2,
      e:`ฝึกทุกวัน → <b>ผลคือ</b> ชนะการแข่งขัน → ความสัมพันธ์แบบ <b>เหตุ → ผล</b><br><b>As a result,</b> / <b>Therefore,</b> ใช้ขึ้นต้นประโยคผลลัพธ์`,
      ee:`She practised every day → <b>as a result</b> she won → a <b>cause → effect</b> relationship<br><b>As a result,</b> / <b>Therefore,</b> are used to start the result sentence` },
    { c:`g`, t:`Subject-Verb Agreement`, q:`Either the students or the teacher ___ going to turn off the computers.`,
      o:[`is`,`are`,`were`,`be`], a:0,
      e:`กฎ <b>Either A or B / Neither A nor B</b>: กริยาผันตามประธาน <b>ตัวที่อยู่ใกล้กริยามากที่สุด</b> (B)<br>ตัวที่ใกล้คือ <b>the teacher</b> (เอกพจน์) → <b>is</b>`,
      ee:`Rule for <b>Either A or B / Neither A nor B</b>: the verb agrees with the subject <b>closest to the verb</b> (B)<br>The closest one is <b>the teacher</b> (singular) → <b>is</b>` },
    { c:`g`, t:`Comparison`, q:`My new phone works much ___ than my old one.`,
      o:[`good`,`well`,`better`,`best`], a:2,
      e:`มี <b>than</b> → ขั้นกว่า (Comparative) ตัด good, well, best<br>ทั้ง good และ well เปลี่ยนรูปเป็น <b>better → best</b> เหมือนกัน<br><b>much</b> วางหน้าขั้นกว่าเพื่อเน้นว่า “ดีกว่ามาก”`,
      ee:`There is <b>than</b> → Comparative, so cross out good, well and best<br>Both good and well change to <b>better → best</b><br><b>much</b> goes before a comparative to stress “a lot better”` },

    { c:`v`, t:`Synonyms`, q:`Smartphones have become <u>essential</u> in our daily lives.<br>The word “essential” is closest in meaning to ___.`,
      o:[`useless`,`necessary`,`expensive`,`modern`], a:1,
      e:`<b>essential</b> = จำเป็นอย่างยิ่ง = <b>necessary</b><br>ตัวลวง: useless (ไร้ประโยชน์) ตรงข้าม, modern (ทันสมัย) เกี่ยวกับโทรศัพท์แต่ความหมายไม่ตรง`,
      ee:`<b>essential</b> = really needed = <b>necessary</b><br>Traps: useless is the opposite; modern is about phones but doesn’t have the same meaning` },
    { c:`v`, t:`Antonyms`, q:`This change is only <u>temporary</u>. The app will go back to normal next week.<br>Which word is OPPOSITE in meaning to “temporary”?`,
      o:[`short`,`brief`,`permanent`,`quick`], a:2,
      e:`<b>temporary</b> = ชั่วคราว → ตรงข้ามคือ <b>permanent</b> = ถาวร<br>short, brief, quick มีความหมายใกล้กับ “ชั่วคราว/สั้น” จึงเป็นตัวลวง`,
      ee:`<b>temporary</b> = lasting only a short time → the opposite is <b>permanent</b> = lasting forever<br>short, brief and quick are close to “temporary/short”, so they are traps` },
    { c:`v`, t:`Context Clues`, q:`The inventor was very <u>persistent</u>. He failed 1,000 times, but he never stopped trying until his light bulb finally worked.<br>“Persistent” means ___.`,
      o:[`not giving up easily`,`very lucky`,`lazy and slow`,`easily angry`], a:0,
      e:`เบาะแส: “failed 1,000 times, but he <b>never stopped trying</b>” → <b>persistent</b> = มุ่งมั่น ไม่ยอมแพ้ง่าย ๆ`,
      ee:`Clue: “failed 1,000 times, but he <b>never stopped trying</b>” → <b>persistent</b> = determined, not giving up easily` },
    { c:`v`, t:`Idioms`, q:`I can’t buy the new tablet. It <u>costs an arm and a leg</u>.<br>The underlined idiom means ___.`,
      o:[`is dangerous to use`,`is very heavy`,`is broken`,`is very expensive`], a:3,
      e:`<b>cost an arm and a leg</b> = แพงมหาศาล (แพงจนต้องจ่ายด้วยแขนและขา)<br>บริบท “I can’t buy” ช่วยยืนยันว่าเป็นเรื่องราคา`,
      ee:`<b>cost an arm and a leg</b> = be extremely expensive (so expensive you’d pay with your arm and leg)<br>The context “I can’t buy” confirms it is about the price` },
    { c:`v`, t:`Idioms`, q:`We have worked on this project for eight hours. Let’s <u>call it a day</u>.<br>What does the speaker want to do?`,
      o:[`Phone a friend`,`Stop working for today`,`Start a new project`,`Work all night`], a:1,
      e:`<b>call it a day</b> = พอแค่นี้ก่อนสำหรับวันนี้ / เลิกงาน<br>บริบท “worked … for eight hours” แสดงว่าทำมานานและเหนื่อยแล้ว`,
      ee:`<b>call it a day</b> = stop working for today<br>The context “worked … for eight hours” shows they have worked a long time and are tired` },
    { c:`v`, t:`Word Forms`, q:`The ___ of the telephone changed the way people communicate.`,
      o:[`invent`,`inventor`,`invention`,`inventive`], a:2,
      e:`หลัง <b>The</b> ต้องเป็นคำนาม → เหลือ inventor กับ invention<br>สิ่งที่ <b>เปลี่ยนวิธีสื่อสาร</b> คือ “การประดิษฐ์” โทรศัพท์ → <b>invention</b><br>inventor = นักประดิษฐ์ (คน) ความหมายไม่เข้ากับ “of the telephone”`,
      ee:`After <b>The</b> we need a noun → only inventor and invention are left<br>What <b>changed the way people communicate</b> is “the invention” of the telephone → <b>invention</b><br>inventor = a person who invents, which doesn’t fit “of the telephone”` },
    { c:`v`, t:`Word Forms`, q:`It is ___ to use your phone while you are crossing the road.`,
      o:[`danger`,`dangerous`,`dangerously`,`endanger`], a:1,
      e:`โครงสร้าง <b>It is + adjective + to V.</b> → ต้องใช้คำคุณศัพท์ → <b>dangerous</b><br>danger (n.) อันตราย, dangerously (adv.), endanger (v.) ทำให้ตกอยู่ในอันตราย`,
      ee:`The pattern <b>It is + adjective + to V.</b> → we need an adjective → <b>dangerous</b><br>danger (n.), dangerously (adv.), endanger (v.) = put in danger` },

    { c:`c`, t:`Asking for Help`, q:`A: Could you possibly ___ me with my science project?<br>B: Of course. What do you need?`,
      o:[`help`,`to help`,`helping`,`helped`], a:0,
      e:`<b>Could you (possibly) + V.1?</b> เป็นการขอร้องอย่างสุภาพ หลัง modal could ใช้ <b>กริยาช่องที่ 1</b> ไม่เติม to หรือ -ing<br>คำว่า <b>possibly</b> ทำให้สุภาพยิ่งขึ้น`,
      ee:`<b>Could you (possibly) + V1?</b> is a polite request. After the modal could, use the <b>base form (V1)</b> — no to and no -ing<br>The word <b>possibly</b> makes it even more polite` },
    { c:`c`, t:`Making Offers`, q:`A: Your bag looks really heavy. ___<br>B: Thanks. That’s very kind of you.`,
      o:[`Can you carry it for me?`,`Do you carry it?`,`Shall I carry it for you?`,`Will you carry mine?`], a:2,
      e:`B ตอบขอบคุณว่า “very kind of you” → A ต้อง <b>เสนอความช่วยเหลือ</b><br><b>Shall I + V…?</b> = ให้ฉัน…ไหม (การเสนอตัวช่วย)<br>ตัวลวง: <i>Can you carry it for me?</i> เป็นการ <b>ขอ</b> ให้คนอื่นช่วย ไม่ใช่เสนอ`,
      ee:`B says thank you, “very kind of you” → A must be <b>offering help</b><br><b>Shall I + V…?</b> = Would you like me to…? (offering to help)<br>Trap: <i>Can you carry it for me?</i> is <b>asking</b> someone else for help, not offering` },
    { c:`c`, t:`Responding to Apologies`, q:`A: I’m sorry I broke your ruler.<br>B: ___`,
      o:[`You’re welcome.`,`That’s all right. Accidents happen.`,`Yes, please.`,`Congratulations!`], a:1,
      e:`การตอบรับคำขอโทษ: <b>That’s all right. / Never mind. / Don’t worry about it.</b><br><i>You’re welcome</i> ใช้ตอบ <b>Thank you</b> เท่านั้น ซึ่งเป็นความผิดที่พบบ่อย`,
      ee:`Replies to an apology: <b>That’s all right. / Never mind. / Don’t worry about it.</b><br><i>You’re welcome</i> is only a reply to <b>Thank you</b> — a very common mistake` },
    { c:`c`, t:`Giving Directions`, q:`A: Where is the museum?<br>B: It’s ___ the bank and the school. You can’t miss it.`,
      o:[`among`,`between`,`across`,`through`], a:1,
      e:`<b>between A and B</b> = อยู่ระหว่างสองสิ่ง (สังเกตคำว่า and)<br><b>among</b> ใช้กับ “ท่ามกลาง” สิ่งของ 3 สิ่งขึ้นไปที่ไม่ระบุชัด`,
      ee:`<b>between A and B</b> = in the middle of two things (notice the word and)<br><b>among</b> means “in a group of” 3 or more things that are not named one by one` },
    { c:`c`, t:`Expressing Opinions`, q:`A: Video games are a complete waste of time.<br>B: ___ Some games can help us think and solve problems.`,
      o:[`I’m afraid I disagree.`,`You’re absolutely right.`,`I couldn’t agree more.`,`That’s exactly what I think.`], a:0,
      e:`ประโยคต่อมาบอกข้อดีของเกม → B <b>ไม่เห็นด้วย</b> กับ A<br><b>I’m afraid I disagree.</b> = ไม่เห็นด้วยอย่างสุภาพ (I’m afraid… ทำให้ฟังนุ่มนวล)<br>อีก 3 ตัวเลือกล้วนแปลว่าเห็นด้วย (I couldn’t agree more = เห็นด้วยที่สุด)`,
      ee:`The next sentence gives a good point about games → B <b>disagrees</b> with A<br><b>I’m afraid I disagree.</b> = a polite way to disagree (I’m afraid… makes it sound softer)<br>The other 3 choices all mean agreeing (I couldn’t agree more = I totally agree)` },

    { c:`r`, p:`A`, t:`Main Idea`, q:`What is the main idea of Passage A?`,
      o:[`Night mode is the best phone feature.`,`Using phones at night can hurt teenagers’ sleep.`,`Teenagers should not have smartphones.`,`Melatonin is a dangerous chemical.`], a:1,
      e:`ทั้งบทความอธิบายว่า <b>การใช้โทรศัพท์ตอนกลางคืน</b> → แสงสีฟ้า → เมลาโทนินลด → <b>นอนหลับยากและง่วงตอนเช้า</b><br>ตัวลวง: <i>Teenagers should not have smartphones</i> กว้าง/สุดโต่งเกินกว่าที่บทความพูด, <i>Melatonin is dangerous</i> ผิด เพราะเมลาโทนินช่วยให้ง่วง`,
      ee:`The whole passage explains that <b>using phones at night</b> → blue light → less melatonin → <b>harder to fall asleep and tired in the morning</b><br>Traps: <i>Teenagers should not have smartphones</i> is too broad/extreme compared to the passage; <i>Melatonin is dangerous</i> is wrong because melatonin helps us feel sleepy` },
    { c:`r`, p:`A`, t:`Detail`, q:`According to the passage, what does melatonin do?`,
      o:[`It produces blue light.`,`It helps us feel sleepy.`,`It makes the brain think it is daytime.`,`It improves school grades.`], a:1,
      e:`บทความเขียนว่า “melatonin, <b>a chemical that helps us feel sleepy</b>” (ส่วนที่อยู่หลังจุลภาคเป็นการอธิบายคำ melatonin)<br>ตัวลวง: สิ่งที่หลอกสมองว่าเป็นกลางวันคือ <b>blue light</b> ไม่ใช่ melatonin`,
      ee:`The passage says “melatonin, <b>a chemical that helps us feel sleepy</b>” (the part after the comma explains the word melatonin)<br>Trap: the thing that tricks the brain into thinking it’s daytime is <b>blue light</b>, not melatonin` },
    { c:`r`, p:`A`, t:`Pronoun Reference`, q:`In the sentence “Phone screens give off blue light, <u>which</u> tells the brain that it is still daytime,” the word “which” refers to ___.`,
      o:[`phone screens`,`the brain`,`blue light`,`teenagers`], a:2,
      e:`which เป็น relative pronoun ที่ขยาย <b>คำนามที่อยู่ข้างหน้าติดกัน</b> คือ <b>blue light</b><br>ตรวจสอบ: “Blue light tells the brain that it is still daytime” → ความหมายถูกต้องตามเนื้อเรื่อง`,
      ee:`which is a relative pronoun that describes <b>the noun right before it</b>: <b>blue light</b><br>Check: “Blue light tells the brain that it is still daytime” → this matches the passage` },
    { c:`r`, p:`A`, t:`Inference`, q:`Which student will most likely sleep best?`,
      o:[`Arm, who plays games in bed until midnight`,`Bee, who uses night mode while chatting in bed`,`Cake, who leaves her phone in the living room at night`,`Dan, who watches videos for one hour in bed`], a:2,
      e:`บทความบอกว่า “the <b>best solution</b> is simply to <b>keep the phone outside the bedroom</b>” → Cake ทำตามวิธีที่ดีที่สุด<br>Bee ใช้ night mode ซึ่งช่วยได้บ้าง แต่บทความบอกว่ายังไม่ใช่วิธีที่ดีที่สุด`,
      ee:`The passage says “the <b>best solution</b> is simply to <b>keep the phone outside the bedroom</b>” → Cake follows the best solution<br>Bee uses night mode, which helps a little, but the passage says it is not the best solution` },
    { c:`r`, p:`B`, t:`Reading a Table`, q:`Which activity shows the BIGGEST increase from weekdays to weekends?`,
      o:[`Online games`,`Watching videos`,`Social media`,`Homework & study`], a:0,
      e:`คำนวณส่วนต่าง (Weekends − Weekdays):<br>Online games 4.0 − 2.5 = <b>1.5</b> · Videos 3.0 − 2.0 = 1.0 · Social media 2.5 − 1.5 = 1.0 · Homework 0.5 − 1.0 = <b>ลดลง</b> 0.5<br>→ <b>Online games</b> เพิ่มมากที่สุด`,
      ee:`Work out the difference (Weekends − Weekdays):<br>Online games 4.0 − 2.5 = <b>1.5</b> · Videos 3.0 − 2.0 = 1.0 · Social media 2.5 − 1.5 = 1.0 · Homework 0.5 − 1.0 = <b>down</b> 0.5<br>→ <b>Online games</b> increases the most` },
    { c:`r`, p:`B`, t:`Reading a Table`, q:`How many hours in total do the students spend on screens on a weekday?`,
      o:[`6.0 hours`,`7.0 hours`,`10.0 hours`,`8.5 hours`], a:1,
      e:`รวมคอลัมน์ Weekdays: 2.5 + 2.0 + 1.5 + 1.0 = <b>7.0 hours</b><br>กับดัก: 10.0 คือผลรวมของ Weekends`,
      ee:`Add up the Weekdays column: 2.5 + 2.0 + 1.5 + 1.0 = <b>7.0 hours</b><br>Trap: 10.0 is the total for Weekends` },
    { c:`r`, p:`B`, t:`Fact Check`, q:`Which statement is TRUE according to the table?`,
      o:[`Students study more at weekends than on weekdays.`,`Students spend the same time on social media every day.`,`Students spend less time on homework at weekends.`,`Watching videos is the most popular activity.`], a:2,
      e:`Homework & study: Weekdays 1.0 → Weekends <b>0.5</b> = <b>ลดลง</b> ✔<br>ข้ออื่นผิด: social media ไม่เท่ากัน (1.5 / 2.5), กิจกรรมที่ใช้เวลามากที่สุดคือ Online games ไม่ใช่ videos`,
      ee:`Homework & study: Weekdays 1.0 → Weekends <b>0.5</b> = <b>less</b> ✔<br>The others are wrong: social media is not the same (1.5 / 2.5), and the activity with the most time is Online games, not videos` },
    { c:`r`, p:`B`, t:`Inference`, q:`What conclusion can be drawn from the table?`,
      o:[`Most screen time is used for entertainment, not study.`,`Students do not have any homework at weekends.`,`Online games help students get better grades.`,`Grade 6 students do not use social media.`], a:0,
      e:`เกม + วิดีโอ + โซเชียลมีเดีย (ความบันเทิง) = 6.0 ชม. ในวันธรรมดา เทียบกับการเรียนเพียง 1.0 ชม. → ส่วนใหญ่ใช้เพื่อ <b>ความบันเทิง</b><br>ข้ออื่นสรุปเกินข้อมูล เช่น ตารางไม่ได้บอกว่าไม่มีการบ้านเลย หรือเกมช่วยเพิ่มเกรด`,
      ee:`Games + videos + social media (entertainment) = 6.0 hours on weekdays, compared with only 1.0 hour of study → most time is used for <b>entertainment</b><br>The other choices go beyond the data, e.g. the table doesn’t say there is no homework at all, or that games improve grades` }
  ]
});

      label: `Passage A · บทความสิ่งแวดล้อม`,
      labelEn: `Passage A · Environment Article`,
      title: `Why Are Corals Turning White?`,
      html: `<p>Coral reefs are sometimes called “the rainforests of the sea.” Although they cover less than one percent of the ocean floor, they are home to about a quarter of all ocean animals. Many people think corals are plants or rocks, but they are actually tiny animals. They live together with small algae, which give them food and their beautiful colours.</p>
<p>When the sea becomes too warm, the corals push the algae out. Without them, the corals turn white. This is called “coral bleaching.” If the water does not cool down soon, the corals may starve and die. In recent years, scientists have seen more and more bleaching around the world. To protect reefs, people can save energy to slow down global warming and choose sunscreen that is safe for corals.</p>`
    },
    B: {

      html: `<div class="notice">

<p class="notice-meta"><b>Sunrise Beach</b> · Saturday 15 November · 7:00 – 10:00 a.m.<br>Meeting point: the car park next to the Sea Turtle Statue</p>
