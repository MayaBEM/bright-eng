    <div class="actions"><button class="btn btn-ghost" data-act="cancel">${t.cfBack}</button><button class="btn btn-primary" data-act="finish">${t.submit}</button></div>
  </div></div>`;
}

// ---------- RESULT ----------
function finish() {
  const set = getSet(S.set);
  const res = S.idxs.map(ix => ({ ix, q: set.questions[ix], y: S.ans[ix] }));
  const score = res.filter(r => r.y === r.q.a).length;
  const full = S.idxs.length === set.questions.length;
  if (full) {
    const best = store.get('best', {});
    if (best[set.id] == null || score > best[set.id]) { best[set.id] = score; store.set('best', best); }
  }
  S = { view: 'result', set: set.id, mode: S.mode, res, score, time: Date.now() - S.start, full, filter: 'all' };
  render(true);
}

function viewResult() {
  const t = T();
  const set = getSet(S.set), n = S.res.length, pct = Math.round((S.score / n) * 100);
  const msg = t.msgs[pct >= 90 ? 0 : pct >= 75 ? 1 : pct >= 50 ? 2 : 3];
  const ring = pct >= 75 ? 'var(--sage)' : pct >= 50 ? 'var(--butter)' : 'var(--coral)';

  const cats = Object.keys(CAT).map(k => {
    const rs = S.res.filter(r => r.q.c === k);
    return { k, n: rs.length, ok: rs.filter(r => r.y === r.q.a).length };
  }).filter(c => c.n);
  const weak = cats.slice().sort((a, b) => a.ok / a.n - b.ok / b.n)[0];
  const wrong = S.res.filter(r => r.y !== r.q.a);
  const next = getSet(S.set + 1);

  const list = S.res.filter(r => S.filter === 'all' || r.y !== r.q.a).map(r => {
    const ok = r.y === r.q.a, skip = r.y == null;
    return `<details class="rv"><summary>
      <span class="st ${ok ? 'ok' : skip ? 'skip' : 'bad'}" aria-label="${ok ? t.stOk : skip ? t.stSkip : t.stBad}">${ok ? '✓' : skip ? '–' : '✗'}</span>
      <span class="rq"><small>${t.qN(r.q.n)} · ${catName(r.q.c)} · ${esc(r.q.t)}</small>${esc(strip(r.q.q))}</span>
      <span class="chev" aria-hidden="true">›</span></summary>
      <div class="rbody">
        ${r.q.p ? `<p class="hint" style="margin:0 0 8px">${t.ref} ${esc(passLabel(set.passages[r.q.p]))}: “${esc(set.passages[r.q.p].title)}”</p>` : ''}
        <div class="ans">
          ${!ok ? `<span class="y">${t.yours}: ${skip ? t.noAns : KEYS[r.y] + '. ' + esc(r.q.o[r.y])}</span>` : ''}
          <span class="c">${t.theAns}: ${KEYS[r.q.a]}. ${esc(r.q.o[r.q.a])}</span>
        </div>
        <div class="exp">${expOf(r.q)}</div>
      </div></details>`;
  }).join('') || `<p class="sub">${t.perfect}</p>`;

  return topbar('') + `<main class="wrap">
    <section class="result-top">
      <div class="score-ring" style="--p:${pct};--ring:${ring}"><div><span><b>${S.score}</b><br>${t.ofQ(n)}</span></div></div>
      <div>
        <p class="kicker" style="margin-bottom:6px">${t.setN(set.id)} · ${esc(setTitle(set))} · ${S.mode === 'practice' ? t.mPractice : t.mExam}${S.full ? '' : t.wrongTag}</p>
        <h1>${msg[0]} ${t.got(pct)}</h1>
        <p>${msg[1]}${S.mode === 'exam' ? t.used(fmtTime(S.time)) : ''}</p>
        <div class="ctas" style="display:flex;gap:10px;flex-wrap:wrap">
          ${wrong.length ? `<button class="btn btn-primary" data-act="retrywrong">${t.retryWrong(wrong.length)}</button>` : ''}
          <button class="btn btn-ghost" data-act="start" data-set="${set.id}" data-mode="${S.mode}">${t.redo}</button>
          ${next ? `<button class="btn btn-ghost" data-act="start" data-set="${next.id}" data-mode="${S.mode}">${t.goSet(next.id)}</button>` : `<button class="btn btn-ghost" data-act="home">${t.backHome}</button>`}
        </div>
      </div>
    </section>

    <div class="catbars">
      ${cats.map(c => `<div class="catbar"><div class="row"><span class="chip ${CAT[c.k].cls}">${catName(c.k)}</span><b>${c.ok}/${c.n}</b></div>
        <div class="track"><i style="width:${(c.ok / c.n) * 100}%;background:${CAT[c.k].color}"></i></div></div>`).join('')}
    </div>
    ${weak && weak.ok < weak.n ? `<div class="advice">${t.weak(catName(weak.k), weak.ok + '/' + weak.n)} — <button data-act="notes" data-anchor="${CAT[weak.k].note}">${t.openNote}</button></div>` : ''}

    <div class="tabs"><h2>${t.reviewH}</h2>
      <button data-act="filter" data-f="all" aria-pressed="${S.filter === 'all'}">${t.all(n)}</button>
      <button data-act="filter" data-f="wrong" aria-pressed="${S.filter === 'wrong'}">${t.wrong(wrong.length)}</button>
    </div>
    <div class="review">${list}</div>
    <div style="height:60px"></div>
  </main>`;
}

// ---------- NOTES ----------
function viewNotes() {
  const t = T();
  const nt = n => LANG === 'en' ? (n.titleEn || n.title) : n.title;
  const nh = n => LANG === 'en' ? (n.htmlEn || n.html) : n.html;
  const groups = Object.keys(CAT).map(k => ({ k, items: NOTES.filter(n => n.cat === k) })).filter(g => g.items.length);
  return topbar('notes') + `<main class="wrap"><div class="notes" data-tip="${t.tip}">
    <nav class="toc" aria-label="${t.toc}">
      ${groups.map(g => `<b>${catName(g.k)}</b>${g.items.map(n => `<a href="#${n.id}" data-act="jump" data-anchor="${n.id}">${esc(nt(n))}</a>`).join('')}`).join('')}
    </nav>
    <div>
      <h1 style="margin:0 0 6px;font-size:30px">${t.notesH}</h1>
      <p class="sub" style="color:var(--ink-2);margin:0 0 24px">${t.notesSub}</p>
      ${NOTES.map(n => `<section class="note-sec" id="${n.id}"><span class="chip ${CAT[n.cat].cls}">${catName(n.cat)}</span><h2>${esc(nt(n))}</h2>${nh(n)}</section>`).join('')}
      <div style="text-align:center;margin-top:26px"><button class="btn btn-primary" data-act="home">${t.toExam}</button></div>
    </div>
  </div></main>`;
}

// ---------- PRINT ----------
function viewPrint() {
  const t = T();
  const set = getSet(S.set);
  const qs = set.questions;
  const sec = { g: [], v: [], c: [], r: [] };
  qs.forEach(q => sec[q.c].push(q));
  const qHtml = q => `<div class="pv-q"><p class="t"><b>${q.n}.</b> ${blanks(q.q)}</p>
    <ol>${q.o.map((o, k) => `<li>${KEYS[k]}. ${esc(o)}</li>`).join('')}</ol></div>`;
  let reading = '';
  const seen = {};
  sec.r.forEach(q => {
    if (!seen[q.p]) {
      seen[q.p] = 1;
      const p = set.passages[q.p];
      const nums = sec.r.filter(x => x.p === q.p).map(x => x.n);
      reading += `<p><b>${t.pvRead(esc(passLabel(p)), nums[0], nums[nums.length - 1])}</b></p><div class="pv-pass"><h3>${esc(p.title)}</h3>${p.html}</div>`;
    }
    reading += qHtml(q);
  });
  return topbar('') + `<main class="wrap"><div class="print-view">
    <div class="print-bar"><p>${t.printBar}</p>
      <button class="btn btn-ghost btn-sm" data-act="home">${t.back}</button><button class="btn btn-primary btn-sm" data-act="doprint">${t.doPrint}</button></div>
    <article class="pv">
      <h1>${esc(BRAND.name)} · ${t.setN(set.id)}: ${esc(setTitle(set))}</h1>
      <p class="pv-sub">${LANG === 'th' ? esc(set.en) + ' · ' : ''}${t.pvSub(qs.length)}</p>
      <div class="pv-name">${t.pvName(qs.length)}</div>
      <p>${t.pvInstr}</p>
      <h2>Part 1 · Grammar &amp; Structure</h2>${sec.g.map(qHtml).join('')}
      <h2>Part 2 · Vocabulary &amp; Expressions</h2>${sec.v.map(qHtml).join('')}
      <h2>Part 3 · Situational Conversation</h2>${sec.c.map(qHtml).join('')}
      <h2>Part 4 · Reading Comprehension</h2>${reading}
      <div class="page-break"></div>
      <h2>${t.pvKey(set.id)}</h2>
      <div class="pv-key">${qs.map(q => `<span><b>${q.n}.</b> ${KEYS[q.a]}</span>`).join('')}</div>
      <h2>${t.pvExp}</h2>
      ${qs.map(q => `<div class="pv-exp"><b>${q.n}. ${KEYS[q.a]}. ${esc(q.o[q.a])}</b> — ${expOf(q)}</div>`).join('')}
    </article>
  </div></main>`;
}

// ---------- render & events ----------
function render(toTop) {
  clearInterval(tick);
  document.documentElement.lang = LANG;
  app.innerHTML = S.view === 'home' ? viewHome() : S.view === 'quiz' ? viewQuiz() : S.view === 'result' ? viewResult() : S.view === 'print' ? viewPrint() : viewNotes();
  if (S.view === 'quiz' && S.mode === 'exam') {
    tick = setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = '⏱ ' + fmtTime(Date.now() - S.start); }, 1000);
  }
  if (toTop) window.scrollTo(0, 0);
}

function moveTo(i) {
  if (i < 0 || i >= S.idxs.length) return;
  S.cur = i; render();
  const quiz = document.getElementById('quiz');
  if (quiz && quiz.getBoundingClientRect().top < 0) quiz.scrollIntoView({ block: 'start' });
}

function act(a, el) {
  if (a === 'home') { S = { view: 'home' }; render(true); }
  else if (a === 'lang') { LANG = el.dataset.l; store.set('lang', LANG); render(); }
  else if (a === 'notes') {
    S = { view: 'notes' }; render(true);
    const id = el && el.dataset.anchor;
    if (id) { const tg = document.getElementById(id); if (tg) tg.scrollIntoView({ block: 'start' }); }
  }
  else if (a === 'jump') { const tg = document.getElementById(el.dataset.anchor); if (tg) tg.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  else if (a === 'start') startQuiz(+el.dataset.set, el.dataset.mode);
  else if (a === 'print') { S = { view: 'print', set: +el.dataset.set }; render(true); }
  else if (a === 'doprint') window.print();
  else if (a === 'pick') {
    const qi = S.idxs[S.cur];
    if (S.mode === 'practice' && S.checked[qi]) return;
    S.ans[qi] = +el.dataset.k; render();
    const b = document.querySelector(`.opt[data-k="${el.dataset.k}"]`); if (b) b.focus({ preventScroll: true });
  }
  else if (a === 'check') {
    const qi = S.idxs[S.cur]; if (S.ans[qi] == null) return;
    S.checked[qi] = true; render();
    const fb = document.querySelector('.fb'); if (fb && fb.getBoundingClientRect().bottom > window.innerHeight) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const nb = document.querySelector('.actions [data-act="next"],.actions [data-act="finish"]'); if (nb) nb.focus({ preventScroll: true });
  }
  else if (a === 'next') moveTo(S.cur + 1);
  else if (a === 'prev') moveTo(S.cur - 1);
  else if (a === 'go') moveTo(+el.dataset.i);
  else if (a === 'submit') { S.confirm = true; render(); const f = document.querySelector('.modal [data-act="finish"]'); if (f) f.focus(); }
  else if (a === 'cancel') { S.confirm = false; render(); }
  else if (a === 'finish') finish();
  else if (a === 'filter') { S.filter = el.dataset.f; render(); }
  else if (a === 'retrywrong') startQuiz(S.set, 'practice', S.res.filter(r => r.y !== r.q.a).map(r => r.ix));
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.act === 'cancel' && el.classList.contains('scrim') && e.target !== el) return;
  if (el.tagName === 'A') e.preventDefault();
  act(el.dataset.act, el);
});

document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.confirm) { if (e.key === 'Escape') act('cancel'); return; }
  const k = e.key.toUpperCase(), idx = KEYS.indexOf(k), num = '1234'.indexOf(e.key);
  const qi = S.idxs[S.cur];
  if (e.key.length === 1 && (idx > -1 || num > -1)) {
    const i = idx > -1 ? idx : num;
    if (i < getSet(S.set).questions[qi].o.length) { e.preventDefault(); act('pick', { dataset: { k: String(i) } }); }
  } else if (e.key === 'Enter' && (!e.target.closest('button,summary') || e.target.classList.contains('opt'))) {
    e.preventDefault();
    if (S.mode === 'practice') {
      if (!S.checked[qi]) act('check');
      else if (S.cur === S.idxs.length - 1) act('finish'); else act('next');
    } else if (S.cur === S.idxs.length - 1) act('submit'); else act('next');
  } else if (e.key === 'ArrowRight') { if (S.mode === 'exam' || S.checked[qi]) act('next'); }
  else if (e.key === 'ArrowLeft') act('prev');
});

window.addEventListener('beforeunload', e => {
  if (S.view === 'quiz' && Object.keys(S.ans).length) { e.preventDefault(); e.returnValue = ''; }
});

render();
})();

</script>
