on this boat, grilled bananas on that one.`,`The sellers call to «3» other across the water, and the smell of coffee moves along the canal. «4» six thirty the first customers arrive — not tourists, but people from the houses along the water.`,`By nine o’clock everything has changed. The small boats have sold «5» they brought, and the big tourist boats are coming. The market is still beautiful, but it is «6» the same market.`]},passages:[{id:`P3-R1`,kind:`Review`,title:`Baan Rim Nam — a quiet find by the river`,body:[`We went to Baan Rim Nam on a Tuesday evening, and we were the only customers for the first twenty minutes. By eight o’clock every table was taken, which tells you something.`,`The menu is short — eleven dishes — and that is a good sign. The tom yum was the best I have eaten outside my grandmother’s kitchen, and the fried fish arrived whole, crisp and still hot.`,`There are two problems. The first is the wait: nothing arrives quickly here, so if you are hungry you should order rice as soon as you sit down. The second is the road. The last hundred metres are unpaved, and after heavy rain a car will struggle.`,`Prices are fair: three of us ate well for 640 baht. Take a friend who does not mind waiting, and go before the tour buses find it.`]},{id:`P3-R2`,kind:`News report`,title:`Students Build a Rain Garden`,body:[`Water used to stand in the school car park for two days after every storm. This term, thirty students from Grades 5 and 6 did something about it.`,`Working with a teacher and a local gardener, they dug a shallow bowl about the size of two classrooms at the lowest corner of the car park. They filled it with sand, then small stones, then soil, and planted grasses whose roots reach deep.`,`Rain now runs into the bowl instead of across the concrete, and the water sinks into the ground within four hours. The plants are watered for free, and mosquitoes have nowhere to breed, because nothing stands long enough.`,`The project cost 4,800 baht, almost all of it for plants. Two other schools in the district have already asked to visit.`,`"We thought we would be planting flowers," said Mai, one of the Grade 6 students. "Nobody told us we would be solving an engineering problem."`]}],questions:[{id:`P3-Q01`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`c«a»t`,`h«a»t`,`m«a»p`,`c«a»ke`],a:3,e:[`In "cat", "hat" and "map" the letter "a" says the short /æ/ sound. In "cake" the silent "e" at the end makes the "a" say its own name, the long /eɪ/ sound.`,`ในคำว่า cat, hat และ map ตัวอักษร a ออกเสียงสระสั้น /æ/ แต่ในคำว่า cake ตัว e ท้ายคำที่ไม่ออกเสียงทำให้ a ออกเสียงตามชื่อตัวอักษรเป็นเสียงยาว /eɪ/`],w:{0:[`"Cat" has the short /æ/ sound.`,`คำว่า cat ออกเสียงสระสั้น /æ/`],1:[`"Hat" has the short /æ/ sound.`,`คำว่า hat ออกเสียงสระสั้น /æ/`],2:[`"Map" has the short /æ/ sound.`,`คำว่า map ออกเสียงสระสั้น /æ/`]}},{id:`P3-Q02`,p:`pronunciation`,k:`ending-sounds`,q:`Which underlined "-ed" ending is pronounced differently from the others?`,c:[`need«ed»`,`play«ed»`,`call«ed»`,`clean«ed»`],a:0,e:[`After /d/ or /t/ the "-ed" ending adds a whole syllable, /ɪd/: need-ed. After other voiced sounds it is just a /d/ sound with no extra syllable.`,`หลังเสียง /d/ หรือ /t/ ส่วนท้าย -ed จะเพิ่มพยางค์เป็น /ɪd/ เช่น need-ed แต่หลังเสียงก้องอื่น ๆ จะออกเสียงเพียง /d/ โดยไม่เพิ่มพยางค์`],w:{1:[`"Played" ends in a vowel sound, so the "-ed" is just /d/.`,`คำว่า played ลงท้ายด้วยเสียงสระ ส่วน -ed จึงออกเสียงเพียง /d/`],2:[`"Called" ends in /l/, so the "-ed" is just /d/.`,`คำว่า called ลงท้ายด้วยเสียง /l/ ส่วน -ed จึงออกเสียงเพียง /d/`],3:[`"Cleaned" ends in /n/, so the "-ed" is just /d/.`,`คำว่า cleaned ลงท้ายด้วยเสียง /n/ ส่วน -ed จึงออกเสียงเพียง /d/`]}},{id:`P3-Q03`,p:`pronunciation`,k:`consonant-sounds`,q:`In which word is the underlined letter NOT pronounced?`,c:[`«k»ing`,`«k»itchen`,`«k»nife`,`«k»ite`],a:2,e:[`When "k" comes before "n" at the start of a word it is silent: knife, knee, know. In the other three words the "k" is pronounced.`,`เมื่อ k อยู่หน้า n ที่ต้นคำ ตัว k จะไม่ออกเสียง เช่น knife, knee, know ส่วนอีกสามคำออกเสียง k ตามปกติ`],w:{0:[`The "k" in "king" is pronounced.`,`ตัว k ในคำว่า king ออกเสียง`],1:[`The "k" in "kitchen" is pronounced.`,`ตัว k ในคำว่า kitchen ออกเสียง`],3:[`The "k" in "kite" is pronounced.`,`ตัว k ในคำว่า kite ออกเสียง`]}},{id:`P3-Q04`,p:`pronunciation`,k:`word-stress`,q:`Which word has the stress on a different syllable from the others?`,c:[`market`,`hotel`,`summer`,`picture`],a:1,e:[`"MAR-ket", "SUM-mer" and "PIC-ture" are stressed on the first syllable. "Ho-TEL" is stressed on the second.`,`คำว่า MAR-ket, SUM-mer และ PIC-ture ลงเสียงหนักที่พยางค์แรก ส่วน ho-TEL ลงเสียงหนักที่พยางค์ที่สอง`],w:{0:[`"Market" is stressed on the first syllable: MAR-ket.`,`คำว่า market ลงเสียงหนักพยางค์แรก เป็น MAR-ket`],2:[`"Summer" is stressed on the first syllable: SUM-mer.`,`คำว่า summer ลงเสียงหนักพยางค์แรก เป็น SUM-mer`],3:[`"Picture" is stressed on the first syllable: PIC-ture.`,`คำว่า picture ลงเสียงหนักพยางค์แรก เป็น PIC-ture`]}},{id:`P3-Q05`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`h«ear»d`,`n«ear»`,`h«ear»`,`cl«ear»`],a:0,e:[`In "near", "hear" and "clear" the letters "ear" say /ɪə/, like "ear" on its own. In "heard" they say /ɜː/, the same sound as in "bird".`,`ในคำว่า near, hear และ clear ตัวอักษร "ear" ออกเสียง /ɪə/ เหมือนคำว่า ear แต่ในคำว่า heard ออกเสียง /ɜː/ เหมือนเสียงในคำว่า bird`],w:{1:[`"Near" has the /ɪə/ sound.`,`คำว่า near ออกเสียง /ɪə/`],2:[`"Hear" has the /ɪə/ sound, even though it is spelled like "heard".`,`คำว่า hear ออกเสียง /ɪə/ แม้จะสะกดคล้ายกับ heard`],3:[`"Clear" has the /ɪə/ sound.`,`คำว่า clear ออกเสียง /ɪə/`]}},{id:`P3-Q06`,p:`conversation`,k:`situational-language`,intro:`Waiter: Are you ready to order?
Customer: ____`,q:`Choose the best reply for the customer.`,c:[`Yes, the restaurant is very busy tonight.`,`Yes, I’ll have the green curry, please.`,`Here is your change, thank you.`,`It was delicious, thank you very much.`],a:1,e:[`"Are you ready to order?" invites the customer to name a dish, so the reply must say what they want to eat.`,`คำถาม "Are you ready to order?" เป็นการเชิญให้ลูกค้าบอกชื่ออาหาร คำตอบจึงต้องระบุสิ่งที่ต้องการรับประทาน`],w:{0:[`This comments on the restaurant instead of ordering.`,`ประโยคนี้แสดงความเห็นเรื่องร้าน ไม่ได้สั่งอาหาร`],2:[`The waiter gives change, and only after the bill is paid.`,`พนักงานเป็นผู้ทอนเงิน และเกิดขึ้นหลังชำระเงินแล้ว`],3:[`This is said after the meal, not before ordering it.`,`ประโยคนี้พูดหลังรับประทานเสร็จ ไม่ใช่ก่อนสั่งอาหาร`]}},{id:`P3-Q07`,p:`conversation`,k:`situational-language`,intro:`Receptionist: ____
Guest: A double room for two nights, please.`,q:`Choose the best line for the receptionist.`,c:[`How much would you like to pay?`,`Where are you from, sir?`,`What kind of room would you like?`,`Is this your first visit to Thailand?`],a:2,e:[`The guest names a type of room and a length of stay, so the question must have asked what kind of room he wants.`,`แขกระบุประเภทห้องและจำนวนคืนที่พัก แสดงว่าคำถามถามว่าต้องการห้องแบบใด`],w:{0:[`A question about price would be answered with an amount of money.`,`คำถามเรื่องราคาต้องตอบด้วยจำนวนเงิน`],1:[`A question about where he is from would be answered with a country.`,`คำถามว่ามาจากไหนต้องตอบด้วยชื่อประเทศ`],3:[`This is a yes/no question and would not be answered with a room type.`,`ประโยคนี้เป็นคำถาม yes/no จึงไม่ตอบด้วยประเภทห้อง`]}},{id:`P3-Q08`,p:`conversation`,k:`situational-language`,intro:`Passenger: ____
Ticket clerk: That’s two hundred and forty baht.`,q:`Choose the best line for the passenger.`,c:[`How much is a return ticket to Ayutthaya?`,`When does the next train leave?`,`Which platform does it leave from?`,`Is the train running late today?`],a:0,e:[`The clerk answers with a price, so the passenger must have asked how much something costs.`,`พนักงานตอบด้วยราคา แสดงว่าผู้โดยสารถามว่าราคาเท่าใด`],w:{1:[`A question about departure time would be answered with a time.`,`คำถามเรื่องเวลารถออกต้องตอบด้วยเวลา`],2:[`A question about the platform would be answered with a platform number.`,`คำถามเรื่องชานชาลาต้องตอบด้วยหมายเลขชานชาลา`],3:[`This is a yes/no question and would not be answered with a price.`,`ประโยคนี้เป็นคำถาม yes/no จึงไม่ตอบด้วยราคา`]}},{id:`P3-Q09`,p:`conversation`,k:`conversation`,intro:`Aran: My number is 081-234-5678.
Pim: ____`,q:`Choose the best reply for Pim, who was writing it down and missed the end.`,c:[`Thank you very much for the number.`,`Yes, that is certainly your number.`,`I don’t really need your number.`,`Sorry, could you repeat the last four digits?`],a:3,e:[`When you miss part of what somebody said, you ask for just that part again. Naming exactly what you missed is clearer than asking for the whole number.`,`เมื่อฟังไม่ทันบางส่วน เราจะขอให้ทวนเฉพาะส่วนนั้น การระบุให้ชัดว่าพลาดตรงไหนชัดเจนกว่าการขอให้ทวนทั้งหมด`],w:{0:[`Thanking her ends the exchange without getting the missing digits.`,`การกล่าวขอบคุณเป็นการจบบทสนทนาโดยยังไม่ได้ตัวเลขที่ขาดไป`],1:[`This simply agrees and does not solve the problem.`,`ประโยคนี้เพียงเห็นด้วย และไม่ได้แก้ปัญหา`],2:[`Pim was writing the number down, so she does need it.`,`พิมกำลังจดเบอร์อยู่ แสดงว่าเธอต้องการเบอร์นั้น`]}},{id:`P3-Q10`,p:`conversation`,k:`situational-language`,intro:`Customer: Excuse me, this shirt has a hole in the sleeve.
Shop assistant: ____`,q:`Choose the best reply for the shop assistant.`,c:[`You should have looked at it before buying.`,`I’m very sorry. Would you like to exchange it?`,`Yes, it is a shirt with a hole in it.`,`We close at six o’clock this evening.`],a:1,e:[`A complaint about faulty goods is answered with an apology and an offer to put it right.`,`การร้องเรียนเรื่องสินค้ามีตำหนิต้องตอบด้วยคำขอโทษและข้อเสนอที่จะแก้ไขให้`],w:{0:[`Blaming the customer does not solve the problem.`,`การโทษลูกค้าไม่ได้ช่วยแก้ปัญหา`],2:[`Repeating the problem offers no solution.`,`การพูดซ้ำปัญหาไม่ได้เสนอทางแก้`],3:[`The closing time has nothing to do with the faulty shirt.`,`เวลาปิดร้านไม่เกี่ยวกับเสื้อที่มีตำหนิ`]}},{id:`P3-Q11`,p:`conversation`,k:`conversation`,intro:`Nan: Would you like to join us for dinner on Friday?
June: ____`,q:`Choose the best reply for June, who wants to go.`,c:[`No, thank you, I’d love to come.`,`Yes, you would certainly like to.`,`That’s very kind. What time shall I come?`,`Dinner is at my house on Friday.`],a:2,e:[`Accepting an invitation warmly and then asking a practical question is the natural, complete reply.`,`การตอบรับคำเชิญอย่างอบอุ่นแล้วถามรายละเอียดที่จำเป็นเป็นคำตอบที่ครบถ้วนและเป็นธรรมชาติ`],w:{0:[`"No, thank you" and "I'd love to come" contradict each other.`,`"No, thank you" กับ "I'd love to come" ขัดแย้งกันเอง`],1:[`This tells Nan what she would like, which does not answer the invitation.`,`ประโยคนี้บอกว่าแนนต้องการอะไร ซึ่งไม่ได้ตอบคำเชิญ`],3:[`Nan is the host; June cannot move the dinner to her own house.`,`แนนเป็นเจ้าภาพ จูนจะย้ายมื้อเย็นไปบ้านตัวเองไม่ได้`]}},{id:`P3-Q12`,p:`grammar`,k:`tenses`,q:`I ____ my homework when the electricity suddenly went off.`,c:[`was doing`,`did`,`do`,`have done`],a:0,e:[`A longer action was in progress when a short action interrupted it, so the long action takes the past continuous: was doing.`,`มีเหตุการณ์หนึ่งกำลังดำเนินอยู่แล้วมีเหตุการณ์สั้น ๆ มาแทรก เหตุการณ์ที่ดำเนินอยู่จึงใช้ past continuous คือ was doing`],w:{1:[`"Did" would suggest the homework was already finished before the power cut.`,`"did" จะสื่อว่าทำการบ้านเสร็จก่อนไฟดับ`],2:[`"Do" is present simple and does not match the past verb "went".`,`"do" เป็น present simple ไม่สอดคล้องกับกริยาอดีต "went"`],3:[`"Have done" links to now, but both events are finished past events.`,`"have done" เชื่อมโยงกับปัจจุบัน แต่ทั้งสองเหตุการณ์จบไปแล้วในอดีต`]}},{id:`P3-Q13`,p:`grammar`,k:`conditionals`,q:`If you ____ the next bus, you will be in Rayong by five o’clock.`,c:[`will catch`,`caught`,`would catch`,`catch`],a:3,e:[`This is a first conditional about a real future possibility: the "if" clause takes the present simple and the main clause takes "will".`,`ประโยคนี้เป็นเงื่อนไขแบบที่ 1 ซึ่งพูดถึงความเป็นไปได้จริงในอนาคต อนุประโยค if ใช้ present simple ส่วนประโยคหลักใช้ "will"`],w:{0:[`"Will" is not used inside the "if" clause of a first conditional.`,`ไม่ใช้ "will" ในอนุประโยค if ของเงื่อนไขแบบที่ 1`],1:[`"Caught" is the past form, used in a second conditional with "would".`,`"caught" เป็นรูปอดีต ใช้ในเงื่อนไขแบบที่ 2 คู่กับ "would"`],2:[`"Would" also belongs in the main clause of a second conditional, not the "if" clause.`,`"would" ใช้ในประโยคหลักของเงื่อนไขแบบที่ 2 ไม่ใช่ในอนุประโยค if`]}},{id:`P3-Q14`,p:`grammar`,k:`passive`,q:`This bridge ____ in 1998 and it still carries traffic today.`,c:[`built`,`was built`,`has built`,`is building`],a:1,e:[`A bridge does not build anything; people build it. With a finished past year, the past passive "was built" is correct.`,`สะพานไม่ได้เป็นผู้สร้างสิ่งใด แต่มีคนสร้างมันขึ้นมา และเมื่อระบุปีในอดีตที่จบแล้ว จึงต้องใช้ passive รูปอดีตคือ "was built"`],w:{0:[`"Built" alone is active and makes the bridge the builder.`,`"built" ลำพังเป็นรูป active ซึ่งทำให้สะพานกลายเป็นผู้สร้าง`],2:[`"Has built" is active present perfect and does not fit the year 1998.`,`"has built" เป็น present perfect รูป active และไม่เข้ากับปี ค.ศ. 1998`],3:[`"Is building" is active continuous and describes something happening now.`,`"is building" เป็น active continuous ซึ่งบรรยายสิ่งที่กำลังเกิดขึ้นตอนนี้`]}},{id:`P3-Q15`,p:`grammar`,k:`modals`,q:`You ____ be tired after such a long journey. Come in and sit down.`,c:[`can`,`should`,`must`,`need`],a:2,e:[`The speaker is drawing a confident conclusion from the long journey. "Must" expresses a strong logical deduction about the present.`,`ผู้พูดกำลังสรุปอย่างมั่นใจจากการเดินทางที่ยาวนาน กริยาช่วย "must" ใช้แสดงการคาดเดาอย่างมั่นใจเกี่ยวกับปัจจุบัน`],w:{0:[`"Can" shows ability or possibility, not a confident conclusion.`,`"can" แสดงความสามารถหรือความเป็นไปได้ ไม่ใช่การสรุปอย่างมั่นใจ`],1:[`"Should be tired" would mean it is expected of him, which is strange.`,`"should be tired" จะหมายความว่าเขาควรจะเหนื่อย ซึ่งฟังดูแปลก`],3:[`"Need" is not used as a modal in a positive statement like this.`,`"need" ไม่ใช้เป็นกริยาช่วยในประโยคบอกเล่าลักษณะนี้`]}},{id:`P3-Q16`,p:`grammar`,k:`articles`,q:`We stayed at ____ small hotel near the beach for three nights.`,c:[`a`,`an`,`the`,`some`],a:0,e:[`The hotel is mentioned for the first time and "small" begins with a consonant sound, so the correct article is "a".`,`โรงแรมถูกกล่าวถึงเป็นครั้งแรก และคำว่า "small" ขึ้นต้นด้วยเสียงพยัญชนะ จึงต้องใช้ "a"`],w:{1:[`"An" comes before a vowel sound, and "small" starts with /s/.`,`"an" ใช้หน้าเสียงสระ แต่ "small" ขึ้นต้นด้วยเสียง /s/`],2:[`"The" is used for a hotel both speakers already know about.`,`"the" ใช้กับโรงแรมที่ผู้พูดทั้งสองรู้จักอยู่แล้ว`],3:[`"Some" is used with plural or uncountable nouns, not with one hotel.`,`"some" ใช้กับคำนามพหูพจน์หรือนับไม่ได้ ไม่ใช้กับโรงแรมแห่งเดียว`]}},{id:`P3-Q17`,p:`grammar`,k:`nouns`,q:`I need to buy some ____ for the sandwiches before the shop closes.`,c:[`breads`,`a bread`,`many bread`,`bread`],a:3,e:[`"Bread" is an uncountable noun in English. It has no plural and takes no "a", so "some bread" is the correct form.`,`"bread" เป็นคำนามนับไม่ได้ในภาษาอังกฤษ จึงไม่มีรูปพหูพจน์และไม่ใช้ "a" รูปที่ถูกต้องคือ "some bread"`],w:{0:[`Uncountable nouns do not take -s, so "breads" is incorrect here.`,`คำนามนับไม่ได้ไม่เติม -s คำว่า "breads" จึงไม่ถูกต้องในที่นี้`],1:[`"A" cannot be used with an uncountable noun. We say "a loaf of bread".`,`ใช้ "a" กับคำนามนับไม่ได้ไม่ได้ เราพูดว่า "a loaf of bread"`],2:[`"Many" is for countable plurals; "much bread" would be the countable-free form.`,`"many" ใช้กับคำนามพหูพจน์ที่นับได้ ส่วนคำนามนับไม่ได้ต้องใช้ "much bread"`]}},{id:`P3-Q18`,p:`grammar`,k:`comparisons`,q:`The more you practise speaking, ____ you will become.`,c:[`the confident`,`confident`,`the more confident`,`more confident`],a:2,e:[`This is the double comparative pattern "the more …, the more …". Both halves need "the" in front of a comparative form.`,`นี่คือโครงสร้างขั้นกว่าคู่ "the more …, the more …" ซึ่งทั้งสองส่วนต้องมี "the" นำหน้ารูปขั้นกว่า`],w:{0:[`"The confident" is not a comparative, so the pattern is incomplete.`,`"the confident" ไม่ใช่รูปขั้นกว่า โครงสร้างจึงไม่สมบูรณ์`],1:[`A plain adjective cannot complete this pattern.`,`คำคุณศัพท์รูปปกติทำให้โครงสร้างนี้สมบูรณ์ไม่ได้`],3:[`The second half of the pattern always needs "the" before the comparative.`,`ส่วนที่สองของโครงสร้างนี้ต้องมี "the" นำหน้ารูปขั้นกว่าเสมอ`]}},{id:`P3-Q19`,p:`grammar`,k:`reported-speech`,intro:`Direct speech: "I am waiting for the bus," she said.`,q:`She said that she ____ for the bus.`,c:[`is waiting`,`was waiting`,`has waited`,`will wait`],a:1,e:[`When the reporting verb is past ("said"), the tense of the original words moves one step back: "am waiting" becomes "was waiting".`,`เมื่อกริยาที่ใช้เล่าเป็นรูปอดีต ("said") กาลของคำพูดเดิมต้องเลื่อนถอยไปหนึ่งขั้น จาก "am waiting" เป็น "was waiting"`],w:{0:[`"Is waiting" keeps the original tense; after "said" it must shift back.`,`"is waiting" คงกาลเดิมไว้ แต่หลัง "said" ต้องเลื่อนถอยไป`],2:[`"Has waited" changes the meaning to a completed period of waiting.`,`"has waited" เปลี่ยนความหมายเป็นช่วงเวลาการรอที่จบแล้ว`],3:[`"Will wait" points to the future, but she was waiting as she spoke.`,`"will wait" ชี้ไปยังอนาคต แต่เธอกำลังรออยู่ขณะที่พูด`]}},{id:`P3-Q20`,p:`error`,k:`articles`,sent:`We had «a» wonderful holiday «in» «the» Chiang Mai «last» April with our cousins.`,q:`Which underlined part is incorrect?`,c:[`a`,`in`,`the`,`last`],a:2,e:[`Names of cities take no article: in Chiang Mai, in Bangkok, in Tokyo. "The" is only used with a few country names such as "the Philippines".`,`ชื่อเมืองไม่ต้องมี article เช่น in Chiang Mai, in Bangkok, in Tokyo ส่วน "the" ใช้กับชื่อประเทศบางชื่อเท่านั้น เช่น "the Philippines"`],w:{0:[`"A wonderful holiday" is correct — a singular countable noun needs an article.`,`"a wonderful holiday" ถูกต้อง เพราะคำนามเอกพจน์นับได้ต้องมี article`],1:[`"In" is the correct preposition before the name of a city.`,`"in" เป็นคำบุพบทที่ถูกต้องเมื่อใช้หน้าชื่อเมือง`],3:[`"Last April" is a correct past time phrase.`,`"last April" เป็นวลีบอกเวลาในอดีตที่ถูกต้อง`]}},{id:`P3-Q21`,p:`error`,k:`quantifiers`,sent:`There «were» «much» people «at» the railway station «yesterday» evening.`,q:`Which underlined part is incorrect?`,c:[`were`,`much`,`at`,`yesterday`],a:1,e:[`"People" is a countable plural noun, so it takes "many", not "much". "Much" is only used with uncountable nouns such as "water" or "money".`,`"people" เป็นคำนามพหูพจน์ที่นับได้ จึงต้องใช้ "many" ไม่ใช่ "much" คำว่า "much" ใช้กับคำนามนับไม่ได้เท่านั้น เช่น water หรือ money`],w:{0:[`"Were" correctly agrees with the plural noun "people".`,`"were" สอดคล้องกับคำนามพหูพจน์ "people" ได้ถูกต้อง`],2:[`"At the railway station" is a correct preposition phrase.`,`"at the railway station" เป็นวลีบุพบทที่ถูกต้อง`],3:[`"Yesterday evening" is a correct past time phrase.`,`"yesterday evening" เป็นวลีบอกเวลาในอดีตที่ถูกต้อง`]}},{id:`P3-Q22`,p:`error`,k:`prepositions`,sent:`She is very good «at» maths «and» she always helps «me» «in» my homework.`,q:`Which underlined part is incorrect?`,c:[`at`,`and`,`me`,`in`],a:3,e:[`The pattern is "help somebody with something": helps me with my homework. "In" is not used after "help".`,`โครงสร้างที่ถูกต้องคือ "help somebody with something" เช่น helps me with my homework โดยไม่ใช้ "in" หลัง help`],w:{0:[`"Good at maths" is the correct fixed pattern.`,`"good at maths" เป็นโครงสร้างตายตัวที่ถูกต้อง`],1:[`"And" correctly joins the two clauses.`,`"and" เชื่อมสองอนุประโยคได้ถูกต้อง`],2:[`"Me" is the correct object pronoun after "helps".`,`"me" เป็นสรรพนามกรรมที่ถูกต้องเมื่อตามหลัง "helps"`]}},{id:`P3-Q23`,p:`error`,k:`modals`,sent:`«We must to leave» now, «or» we «will miss» the «last» train home.`,q:`Which underlined part is incorrect?`,c:[`We must to leave`,`or`,`will miss`,`last`],a:0,e:[`Modal verbs such as "must", "can" and "should" are followed by the bare base form, with no "to". The correct phrase is "We must leave".`,`กริยาช่วยอย่าง must, can, should ต้องตามด้วยกริยารูปพื้นฐานโดยไม่มี "to" วลีที่ถูกต้องคือ "We must leave"`],w:{1:[`"Or" correctly introduces the consequence of not leaving.`,`"or" ใช้นำหน้าผลที่จะตามมาหากไม่ออกเดินทางได้ถูกต้อง`],2:[`"Will miss" is the correct future form after "or".`,`"will miss" เป็นรูปอนาคตที่ถูกต้องหลัง "or"`],3:[`"The last train" is a correct noun phrase.`,`"the last train" เป็นนามวลีที่ถูกต้อง`]}},{id:`P3-Q24`,p:`error`,k:`conjunctions`,sent:`«Although» it «was» raining heavily, «but» we «went» to the night market anyway.`,q:`Which underlined part is incorrect?`,c:[`Although`,`was`,`but`,`went`],a:2,e:[`English uses only one conjunction to join two clauses. "Although" already shows the contrast, so "but" must be removed: "Although it was raining heavily, we went…".`,`ภาษาอังกฤษใช้คำเชื่อมเพียงคำเดียวในการเชื่อมสองอนุประโยค คำว่า "although" แสดงความขัดแย้งอยู่แล้ว จึงต้องตัด "but" ออก เป็น "Although it was raining heavily, we went…"`],w:{0:[`"Although" correctly introduces the contrast; it is "but" that is extra.`,`"although" ใช้แสดงความขัดแย้งได้ถูกต้อง ส่วนที่เกินมาคือ "but"`],1:[`"Was raining" is a correct past continuous.`,`"was raining" เป็นรูป past continuous ที่ถูกต้อง`],3:[`"Went" is the correct past simple of "go".`,`"went" เป็นรูป past simple ที่ถูกต้องของ "go"`]}},{id:`P3-Q25`,p:`error`,k:`word-order`,sent:`«Always I go» to school «by» bus «except» when it «rains» very hard.`,q:`Which underlined part is incorrect?`,c:[`Always I go`,`by`,`except`,`rains`],a:0,e:[`An adverb of frequency goes after the subject and before the main verb: "I always go to school by bus."`,`คำวิเศษณ์บอกความถี่ต้องวางหลังประธานและหน้ากริยาหลัก เป็น "I always go to school by bus"`],w:{1:[`"By bus" is the correct way to describe transport.`,`"by bus" เป็นรูปที่ถูกต้องในการบอกวิธีเดินทาง`],2:[`"Except when" correctly introduces the exception.`,`"except when" ใช้นำหน้าข้อยกเว้นได้ถูกต้อง`],3:[`"Rains" correctly agrees with the subject "it".`,`"rains" สอดคล้องกับประธาน "it" ได้ถูกต้อง`]}},{id:`P3-Q26`,p:`vocabulary`,k:`vocab-context`,q:`The restaurant was so ____ that we had to wait forty minutes for a table.`,c:[`empty`,`cheap`,`quiet`,`popular`],a:3,e:[`A long wait for a table means many people want to eat there. "Popular" means liked by a lot of people.`,`การต้องรอโต๊ะนานแสดงว่ามีคนจำนวนมากอยากมากินที่นั่น คำว่า "popular" แปลว่าเป็นที่นิยมของผู้คนมากมาย`],w:{0:[`"Empty" means nobody is there, so a table would be free at once.`,`"empty" แปลว่าไม่มีคน ซึ่งจะมีโต๊ะว่างทันที`],1:[`"Cheap" describes price, and a cheap restaurant is not always full.`,`"cheap" บอกราคา ร้านที่ถูกก็ไม่จำเป็นต้องเต็มเสมอไป`],2:[`"Quiet" suggests few customers, which would mean no waiting.`,`"quiet" สื่อว่ามีลูกค้าน้อย ซึ่งจะไม่ต้องรอ`]}},{id:`P3-Q27`,p:`vocabulary`,k:`synonyms-antonyms`,q:`The hotel room was tiny — just a bed and one small window. "Tiny" means very ____.`,c:[`small`,`clean`,`dark`,`cheap`],a:0,e:[`The dash explains the word: only a bed and one window fitted in. "Tiny" means extremely small.`,`เครื่องหมายขีดขยายความคำนั้นว่ามีเพียงเตียงกับหน้าต่างบานเดียว คำว่า "tiny" แปลว่าเล็กมาก`],w:{1:[`"Clean" describes tidiness, not size.`,`"clean" บอกความสะอาด ไม่ได้บอกขนาด`],2:[`"Dark" describes light, and the room does have a window.`,`"dark" บอกเรื่องแสง และห้องนี้ก็มีหน้าต่าง`],3:[`"Cheap" describes price, which the sentence does not mention.`,`"cheap" บอกราคา ซึ่งประโยคนี้ไม่ได้กล่าวถึง`]}},{id:`P3-Q28`,p:`vocabulary`,k:`collocations`,q:`Don’t forget to ____ a photo of the sunset from the top of the hill.`,c:[`do`,`take`,`make`,`give`],a:1,e:[`English pairs "take" with photos: take a photo, take a picture. The other verbs are not used this way.`,`ภาษาอังกฤษใช้ "take" คู่กับรูปถ่าย เช่น take a photo, take a picture ส่วนกริยาอื่นไม่ใช้ในรูปนี้`],w:{0:[`"Do" pairs with homework and housework, not with photos.`,`"do" ใช้คู่กับ homework และงานบ้าน ไม่ใช้กับรูปถ่าย`],2:[`"Make a photo" is not natural English.`,`รูป "make a photo" ไม่เป็นธรรมชาติในภาษาอังกฤษ`],3:[`"Give a photo" means handing one to somebody, not using a camera.`,`"give a photo" หมายถึงยื่นรูปให้ใคร ไม่ได้หมายถึงการถ่ายรูป`]}},{id:`P3-Q29`,p:`vocabulary`,k:`phrasal-verbs`,q:`We ____ of petrol about ten kilometres from the town.`,c:[`ran over`,`ran into`,`ran out`,`ran away`],a:2,e:[`"Run out of something" means to use all of it so that none is left — which is exactly what happens to petrol on a long drive.`,`"run out of something" แปลว่าใช้จนหมดไม่เหลือเลย ซึ่งตรงกับสถานการณ์น้ำมันหมดระหว่างทาง`],w:{0:[`"Run over" means to hit something with a vehicle.`,`"run over" แปลว่าขับรถชนทับ`],1:[`"Run into" means to meet somebody by chance.`,`"run into" แปลว่าบังเอิญพบใครโดยไม่ได้นัดหมาย`],3:[`"Run away" means to escape from a place.`,`"run away" แปลว่าหนีออกไปจากที่ใดที่หนึ่ง`]}},{id:`P3-Q30`,p:`vocabulary`,k:`word-formation`,q:`Thank you for your ____. The map you drew was exactly what we needed.`,c:[`helpful`,`helping`,`helpfully`,`help`],a:3,e:[`After "your" we need a noun, and the noun form of this word family is "help": thank you for your help.`,`หลังคำว่า "your" ต้องใช้คำนาม และคำนามของคำตระกูลนี้คือ "help" เป็น thank you for your help`],w:{0:[`"Helpful" is an adjective and cannot follow "your" on its own.`,`"helpful" เป็นคำคุณศัพท์ จึงตามหลัง "your" ตามลำพังไม่ได้`],1:[`"Helping" is a verb form; "your helping" is not natural here.`,`"helping" เป็นรูปกริยา วลี "your helping" ไม่เป็นธรรมชาติในที่นี้`],2:[`"Helpfully" is an adverb and describes how something is done.`,`"helpfully" เป็นคำวิเศษณ์ ใช้ขยายวิธีการกระทำ`]}},{id:`P3-Q31`,p:`ordering`,k:`word-order`,items:[`a new restaurant`,`opened`,`near the station`,`last month`],q:`Put the parts in the correct order to make a sentence.`,c:[`2-1-3-4`,`1-3-2-4`,`1-2-3-4`,`3-1-2-4`],a:2,e:[`The order is subject → verb → place → time: "A new restaurant (1) opened (2) near the station (3) last month (4)."`,`ลำดับคือ ประธาน → กริยา → สถานที่ → เวลา จึงได้ "A new restaurant (1) opened (2) near the station (3) last month (4)"`],w:{0:[`Starting with the verb leaves the sentence without a subject.`,`การขึ้นต้นด้วยกริยาทำให้ประโยคไม่มีประธาน`],1:[`This puts the place before the verb: "A new restaurant near the station opened…" changes the emphasis and leaves the order wrong.`,`รูปนี้วางสถานที่ไว้หน้ากริยา ทำให้ลำดับผิด`],3:[`Starting with "near the station" leaves the subject stranded in the middle.`,`การขึ้นต้นด้วย "near the station" ทำให้ประธานไปอยู่กลางประโยค`]}},{id:`P3-Q32`,p:`ordering`,k:`questions`,items:[`did you`,`where`,`your holiday`,`spend`],q:`Put the parts in the correct order to make a question.`,c:[`2-1-4-3`,`1-2-4-3`,`2-4-1-3`,`1-4-2-3`],a:0,e:[`A wh- question runs question word → auxiliary + subject → main verb → object: "Where (2) did you (1) spend (4) your holiday (3)?"`,`คำถาม wh- เรียงเป็น คำถาม → กริยาช่วย + ประธาน → กริยาหลัก → กรรม จึงได้ "Where (2) did you (1) spend (4) your holiday (3)?"`],w:{1:[`Starting with "did you" puts the auxiliary before the question word.`,`การขึ้นต้นด้วย "did you" ทำให้กริยาช่วยมาก่อนคำถาม`],2:[`"Where spend did you" separates the auxiliary from its subject.`,`รูป "Where spend did you" แยกกริยาช่วยออกจากประธาน`],3:[`This also begins with the auxiliary instead of the question word.`,`รูปนี้ก็ขึ้นต้นด้วยกริยาช่วยแทนที่จะเป็นคำถาม`]}},{id:`P3-Q33`,p:`ordering`,k:`text-cohesion`,items:[`Certainly. How many nights will that be?`,`Good evening. I have a reservation under the name Suwan.`,`Two nights. Is breakfast included?`,`Yes, it is served from seven to ten in the morning.`],q:`Put the lines in the correct order to make a conversation.`,c:[`1-2-3-4`,`2-3-1-4`,`1-3-2-4`,`2-1-3-4`],a:3,e:[`The guest speaks first (2), the receptionist confirms and asks (1), the guest answers and asks a new question (3), and the receptionist answers it (4).`,`แขกพูดก่อน (2) พนักงานยืนยันและถามกลับ (1) แขกตอบพร้อมถามคำถามใหม่ (3) แล้วพนักงานตอบคำถามนั้น (4)`],w:{0:[`"Certainly" cannot open a conversation — it answers something.`,`"Certainly" ขึ้นต้นบทสนทนาไม่ได้ เพราะเป็นการตอบรับสิ่งที่มีคนพูดมาก่อน`],1:[`"Two nights" cannot come before the question "How many nights?"`,`"Two nights" มาก่อนคำถาม "How many nights?" ไม่ได้`],2:[`This starts with "Certainly" and leaves the greeting in the middle.`,`รูปนี้ขึ้นต้นด้วย "Certainly" และทำให้คำทักทายไปอยู่กลางบทสนทนา`]}},{id:`P3-Q34`,p:`ordering`,k:`linking-words`,items:[`Therefore, take a hat and plenty of water.`,`The walk to the waterfall takes about two hours.`,`Most of the path has no shade at all.`,`It is not difficult, but it is very hot.`],q:`Put the sentences in the correct order to make a paragraph.`,c:[`2-3-4-1`,`2-4-3-1`,`4-2-3-1`,`2-1-4-3`],a:1,e:[`The topic sentence opens the paragraph (2), then the general comment about heat (4), then the detail that explains it (3), and "Therefore" draws the conclusion (1).`,`ประโยคนำเปิดย่อหน้า (2) ตามด้วยความเห็นรวมเรื่องความร้อน (4) แล้วจึงเป็นรายละเอียดที่อธิบายเหตุผล (3) และ "Therefore" สรุปปิดท้าย (1)`],w:{0:[`The detail about shade makes better sense after the general remark about heat.`,`รายละเอียดเรื่องร่มเงาจะสมเหตุสมผลกว่าหากอยู่หลังความเห็นรวมเรื่องความร้อน`],2:[`Opening with "It is not difficult" leaves "it" with nothing to refer to.`,`การขึ้นต้นด้วย "It is not difficult" ทำให้คำว่า "it" ไม่มีสิ่งที่อ้างถึง`],3:[`"Therefore" cannot come before the reasons it draws on.`,`"Therefore" มาก่อนเหตุผลที่ใช้สรุปไม่ได้`]}},{id:`P3-Q35`,p:`cloze`,k:`modals`,blank:1,q:`Choose the best answer for blank 1.`,c:[`should`,`will`,`can`,`may`],a:0,e:[`The writer is advising the reader what is worth doing, and "should" is the modal used to give advice.`,`ผู้เขียนกำลังแนะนำว่าอะไรควรทำ กริยาช่วยที่ใช้ให้คำแนะนำคือ "should"`],w:{1:[`"Will" states a future fact, not a recommendation.`,`"will" บอกข้อเท็จจริงในอนาคต ไม่ใช่คำแนะนำ`],2:[`"Can" shows that something is possible, but the sentence is advice.`,`"can" แสดงว่าทำได้ แต่ประโยคนี้เป็นคำแนะนำ`],3:[`"May" gives permission or shows possibility.`,`"may" ใช้ให้การอนุญาตหรือแสดงความเป็นไปได้`]}},{id:`P3-Q36`,p:`cloze`,k:`prepositions`,blank:2,q:`Choose the best answer for blank 2.`,c:[`in`,`at`,`of`,`by`],a:3,e:[`"One by one" is a fixed phrase meaning that things happen separately, one after another.`,`"one by one" เป็นวลีตายตัว แปลว่าเกิดขึ้นทีละอย่างต่อ ๆ กันไป`],w:{0:[`"One in one" is not an English phrase.`,`วลี "one in one" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"One at one" is not used; "at once" means something different.`,`วลี "one at one" ไม่มีใช้ ส่วน "at once" มีความหมายคนละอย่าง`],2:[`"One of one" means something different and does not fit here.`,`"one of one" มีความหมายคนละอย่างและไม่เข้ากับประโยคนี้`]}},{id:`P3-Q37`,p:`cloze`,k:`pronouns`,blank:3,q:`Choose the best answer for blank 3.`,c:[`the`,`each`,`some`,`any`],a:1,e:[`"Each other" is the fixed reciprocal pronoun: the sellers call to each other, meaning every seller calls to the others.`,`"each other" เป็นสรรพนามแสดงการกระทำต่อกันแบบตายตัว หมายถึงผู้ขายต่างเรียกหากันไปมา`],w:{0:[`"The other" points to one specific other person, not to everybody.`,`"the other" ชี้ไปที่อีกคนหนึ่งโดยเฉพาะ ไม่ใช่ทุกคน`],2:[`"Some other" would need a noun after it, as in "some other sellers".`,`"some other" ต้องมีคำนามตามหลัง เช่น "some other sellers"`],3:[`"Any other" also needs a noun and changes the meaning.`,`"any other" ก็ต้องมีคำนามตามหลังและเปลี่ยนความหมาย`]}},{id:`P3-Q38`,p:`cloze`,k:`prepositions`,blank:4,q:`Choose the best answer for blank 4.`,c:[`In`,`On`,`At`,`By`],a:2,e:[`We use "at" with clock times: at six thirty, at five o’clock, at midnight.`,`ใช้ "at" กับเวลาที่บอกเป็นนาฬิกา เช่น at six thirty, at five o’clock, at midnight`],w:{0:[`"In" is used with months, years and parts of the day.`,`"in" ใช้กับเดือน ปี และช่วงของวัน`],1:[`"On" is used with days and dates.`,`"on" ใช้กับวันและวันที่`],3:[`"By six thirty" would mean "not later than", which changes the meaning.`,`"by six thirty" จะแปลว่าไม่เกินเวลานั้น ซึ่งเปลี่ยนความหมาย`]}},{id:`P3-Q39`,p:`cloze`,k:`pronouns`,blank:5,q:`Choose the best answer for blank 5.`,c:[`everything`,`anything`,`nothing`,`something`],a:0,e:[`By nine o’clock the small boats are finished, so they have sold all the food they brought. "Everything" means all of it.`,`พอถึงเก้าโมง เรือเล็กก็ขายเสร็จแล้ว แสดงว่าขายของที่นำมาได้หมด คำว่า "everything" แปลว่าทั้งหมด`],w:{1:[`"Anything" is used in questions and negatives, not in this positive statement.`,`"anything" ใช้ในประโยคคำถามและปฏิเสธ ไม่ใช้ในประโยคบอกเล่านี้`],2:[`"Nothing" would mean they sold none of it, which contradicts the paragraph.`,`"nothing" จะหมายความว่าขายไม่ได้เลย ซึ่งขัดแย้งกับย่อหน้านี้`],3:[`"Something" means only a part, but the boats are finished for the day.`,`"something" หมายถึงเพียงบางส่วน แต่เรือเหล่านี้ขายเสร็จแล้วสำหรับวันนั้น`]}},{id:`P3-Q40`,p:`cloze`,k:`adjectives-adverbs`,blank:6,q:`Choose the best answer for blank 6.`,c:[`not`,`never`,`not any`,`no longer`],a:3,e:[`The market has changed from what it was earlier that morning. "No longer" means that something was true before but is not true now.`,`ตลาดเปลี่ยนไปจากตอนเช้าตรู่ คำว่า "no longer" แปลว่าเคยเป็นเช่นนั้นแต่ตอนนี้ไม่ใช่แล้ว`],w:{0:[`"Not the same market" is possible grammar but loses the sense of change over the morning.`,`"not the same market" ถูกหลักไวยากรณ์ แต่สูญเสียความหมายของการเปลี่ยนแปลงตลอดเช้า`],1:[`"Never" means at no time at all, but it was the same market at dawn.`,`"never" แปลว่าไม่เคยเลย แต่ตอนเช้าตรู่มันก็เป็นตลาดเดียวกัน`],2:[`"Not any the same market" is not grammatical English.`,`รูป "not any the same market" ไม่ถูกหลักภาษาอังกฤษ`]}},{id:`P3-Q41`,p:`reading`,k:`reading-detail`,pid:`P3-R1`,q:`How many dishes are on the menu?`,c:[`Three`,`Eleven`,`Twenty`,`The review does not say.`],a:1,e:[`The second paragraph says, "The menu is short — eleven dishes — and that is a good sign."`,`ย่อหน้าที่สองระบุว่า "The menu is short — eleven dishes — and that is a good sign." คือมี 11 รายการ`],w:{0:[`Three is the number of people who ate, not dishes.`,`สามคือจำนวนคนที่ไปกิน ไม่ใช่จำนวนเมนู`],2:[`Twenty is the number of minutes they sat alone.`,`ยี่สิบคือจำนวนนาทีที่พวกเขานั่งอยู่ลำพัง`],3:[`The number is given clearly between the dashes.`,`ตัวเลขนี้ระบุไว้ชัดเจนระหว่างเครื่องหมายขีด`]}},{id:`P3-Q42`,p:`reading`,k:`reading-inference`,pid:`P3-R1`,q:`Why does the writer suggest ordering rice as soon as you sit down?`,c:[`Because the rice is the best dish there`,`Because rice is very cheap at this restaurant`,`Because the food takes a long time to arrive`,`Because the rice often sells out early`],a:2,e:[`The advice follows directly from the first problem: "nothing arrives quickly here, so if you are hungry you should order rice as soon as you sit down."`,`คำแนะนำนี้ตามมาจากปัญหาข้อแรกโดยตรงว่า "nothing arrives quickly here, so if you are hungry you should order rice as soon as you sit down"`],w:{0:[`The tom yum and the fried fish are praised, not the rice.`,`ที่ได้รับคำชมคือต้มยำและปลาทอด ไม่ใช่ข้าว`],1:[`The review calls the prices fair overall but says nothing about rice being cheap.`,`รีวิวบอกว่าราคาโดยรวมสมเหตุสมผล แต่ไม่ได้บอกว่าข้าวถูก`],3:[`Running out of rice is never mentioned.`,`ไม่มีการกล่าวถึงเรื่องข้าวหมด`]}},{id:`P3-Q43`,p:`reading`,k:`reading-detail`,pid:`P3-R1`,q:`What problem does the road have?`,c:[`The last part of it is not paved.`,`It is closed after six o’clock.`,`It is very narrow and always busy.`,`There is nowhere to park a car.`],a:0,e:[`The third paragraph says, "The last hundred metres are unpaved, and after heavy rain a car will struggle."`,`ย่อหน้าที่สามระบุว่า "The last hundred metres are unpaved, and after heavy rain a car will struggle." คือร้อยเมตรสุดท้ายเป็นถนนที่ยังไม่ได้ลาดยาง`],w:{1:[`No closing time for the road is mentioned.`,`ไม่มีการกล่าวถึงเวลาปิดของถนน`],2:[`The width and the traffic are never discussed.`,`ไม่มีการกล่าวถึงความกว้างหรือความหนาแน่นของถนน`],3:[`Parking is not mentioned in the review.`,`รีวิวไม่ได้กล่าวถึงที่จอดรถ`]}},{id:`P3-Q44`,p:`reading`,k:`reading-inference`,pid:`P3-R1`,q:`What does the writer mean by "go before the tour buses find it"?`,c:[`The buses will block the narrow road.`,`The restaurant will close down soon.`,`The buses bring cheaper food to the area.`,`The restaurant is still quiet, and it will not stay that way.`],a:3,e:[`The review opens by noting how quiet the restaurant was and how it then filled up. The last line warns that its quietness is temporary once large groups discover it.`,`รีวิวเปิดด้วยการบอกว่าร้านเงียบแค่ไหนแล้วคนเต็มในเวลาต่อมา ประโยคสุดท้ายจึงเตือนว่าความเงียบสงบนี้จะอยู่ได้ไม่นานเมื่อกลุ่มทัวร์มาพบเข้า`],w:{0:[`The road problem is about the surface, not about buses blocking it.`,`ปัญหาของถนนคือสภาพพื้นผิว ไม่ใช่เรื่องรถบัสมาขวาง`],1:[`Nothing suggests the restaurant is in trouble — the tables filled up.`,`ไม่มีข้อความใดบอกว่าร้านมีปัญหา กลับกันคือโต๊ะเต็มหมด`],2:[`Tour buses bring customers, not food.`,`รถทัวร์นำลูกค้ามา ไม่ได้นำอาหารมา`]}},{id:`P3-Q45`,p:`reading`,k:`reading-vocab`,pid:`P3-R1`,q:`In the review, "Prices are fair" means the prices are ____.`,c:[`reasonable`,`very high`,`very low`,`fixed`],a:0,e:[`The sentence backs the word up with an example: three people ate well for 640 baht. "Fair" means neither too high nor too low.`,`ประโยคนี้ยกตัวอย่างประกอบไว้ว่าสามคนกินอิ่มในราคา 640 บาท คำว่า "fair" แปลว่าราคาสมเหตุสมผล ไม่แพงและไม่ถูกเกินไป`],w:{1:[`If the prices were very high, the writer would not recommend going.`,`ถ้าราคาแพงมาก ผู้เขียนคงไม่แนะนำให้ไป`],2:[`"Fair" does not mean cheap; it means the price matches what you get.`,`"fair" ไม่ได้แปลว่าถูก แต่แปลว่าราคาสมกับสิ่งที่ได้รับ`],3:[`"Fixed" means the price cannot be changed, which is a different idea.`,`"fixed" แปลว่าราคาตายตัวต่อรองไม่ได้ ซึ่งเป็นคนละความหมาย`]}},{id:`P3-Q46`,p:`reading`,k:`reading-detail`,pid:`P3-R2`,q:`What was the problem before the project started?`,c:[`The school car park was far too small.`,`There were too many mosquitoes inside the classrooms.`,`Water stood in the car park for two days after a storm.`,`The school had no garden of any kind.`],a:2,e:[`The opening line states the problem: "Water used to stand in the school car park for two days after every storm."`,`บรรทัดแรกระบุปัญหาไว้ว่า "Water used to stand in the school car park for two days after every storm."`],w:{0:[`The size of the car park is never mentioned as a problem.`,`ไม่มีการระบุว่าขนาดของลานจอดรถเป็นปัญหา`],1:[`Mosquitoes are mentioned as a benefit of the new garden, not the original problem.`,`ยุงถูกกล่าวถึงในฐานะผลดีของสวนใหม่ ไม่ใช่ปัญหาเดิม`],3:[`Having no garden is not given as the problem; standing water is.`,`การไม่มีสวนไม่ใช่ปัญหาที่ระบุไว้ ปัญหาคือน้ำท่วมขัง`]}},{id:`P3-Q47`,p:`reading`,k:`reading-detail`,pid:`P3-R2`,q:`How long does the water now take to sink into the ground?`,c:[`Two days`,`Within four hours`,`About one week`,`Twenty minutes`],a:1,e:[`The third paragraph says, "the water sinks into the ground within four hours."`,`ย่อหน้าที่สามระบุว่า "the water sinks into the ground within four hours." คือซึมลงดินภายในสี่ชั่วโมง`],w:{0:[`Two days is how long the water used to stand before the project.`,`สองวันคือระยะเวลาที่น้ำเคยท่วมขังก่อนทำโครงการ`],2:[`One week does not appear in the report.`,`ไม่มีการกล่าวถึงระยะเวลาหนึ่งสัปดาห์`],3:[`Twenty minutes is not mentioned anywhere.`,`ไม่มีการกล่าวถึงยี่สิบนาทีเลย`]}},{id:`P3-Q48`,p:`reading`,k:`reading-inference`,pid:`P3-R2`,q:`Why are there fewer mosquitoes now?`,c:[`The new plants keep mosquitoes away.`,`The gardener sprays the garden every week.`,`The students catch them in the evening.`,`Water no longer stands long enough for them to breed.`],a:3,e:[`The report gives the reason in the same sentence: "mosquitoes have nowhere to breed, because nothing stands long enough."`,`รายงานให้เหตุผลไว้ในประโยคเดียวกันว่า "mosquitoes have nowhere to breed, because nothing stands long enough" คือไม่มีน้ำขังนานพอให้วางไข่`],w:{0:[`The grasses were planted for their deep roots, not to repel insects.`,`หญ้าถูกปลูกเพราะรากหยั่งลึก ไม่ใช่เพื่อไล่แมลง`],1:[`Spraying is never mentioned in the report.`,`รายงานไม่ได้กล่าวถึงการฉีดพ่นยา`],2:[`Catching mosquitoes is not part of the project.`,`การจับยุงไม่ใช่ส่วนหนึ่งของโครงการ`]}},{id:`P3-Q49`,p:`reading`,k:`reading-detail`,pid:`P3-R2`,q:`What did most of the 4,800 baht pay for?`,c:[`Sand and small stones`,`The plants`,`The gardener’s time`,`Repairing the car park`],a:1,e:[`The fourth paragraph says, "The project cost 4,800 baht, almost all of it for plants."`,`ย่อหน้าที่สี่ระบุว่า "The project cost 4,800 baht, almost all of it for plants." คือเกือบทั้งหมดเป็นค่าต้นไม้`],w:{0:[`Sand and stones were used, but the report says the money went on plants.`,`มีการใช้ทรายและหิน แต่รายงานระบุว่าเงินส่วนใหญ่เป็นค่าต้นไม้`],2:[`The gardener worked with the students; no fee is mentioned.`,`คนสวนทำงานร่วมกับนักเรียน และไม่มีการกล่าวถึงค่าจ้าง`],3:[`The car park was not repaired; a rain garden was dug beside it.`,`ไม่ได้มีการซ่อมลานจอดรถ แต่ขุดสวนรับน้ำฝนไว้ข้าง ๆ`]}},{id:`P3-Q50`,p:`reading`,k:`reading-inference`,pid:`P3-R2`,q:`What does Mai’s comment at the end suggest?`,c:[`She did not enjoy taking part in the project.`,`She would have preferred to plant flowers.`,`The project failed to solve the flooding problem.`,`The project turned out to be more technical than she expected.`],a:3,e:[`She contrasts what she expected ("planting flowers") with what the work really involved ("solving an engineering problem"), which is a comment about the nature of the task.`,`เธอเปรียบเทียบสิ่งที่คาดไว้ ("planting flowers") กับสิ่งที่งานเป็นจริง ("solving an engineering problem") ซึ่งเป็นการพูดถึงลักษณะของงาน`],w:{0:[`Her tone is one of surprise, and nothing in the report suggests she disliked it.`,`น้ำเสียงของเธอคือความประหลาดใจ และไม่มีข้อความใดบอกว่าเธอไม่ชอบ`],1:[`She mentions flowers only as what she had wrongly expected.`,`เธอกล่าวถึงดอกไม้ในฐานะสิ่งที่เธอเข้าใจผิดว่าจะได้ทำเท่านั้น`],2:[`The report says the water now sinks away within four hours, so it worked.`,`รายงานระบุว่าตอนนี้น้ำซึมลงดินภายในสี่ชั่วโมง แสดงว่าได้ผล`]}}]},{id:`paper-4`,number:4,title:`Paper 4`,subtitle:`Competitive — Science, Sport and School Life`,tier:`competitive`,minutes:55,cloze:{id:`P4-CLOZE`,kind:`Informational passage`,title:`Why Your Phone Knows You Are Walking`,body:[`Inside almost every mobile phone there is a piece of silicon «1» smaller than a grain of rice. It is called an accelerometer, and its job is to notice movement.`,`The idea is simple. A very small weight sits on even smaller springs. When the phone moves, the weight lags behind for a fraction of a second and the springs bend. The phone measures how much they bend «2» works out which way it is moving, and how fast.`,`This is «3» your screen turns sideways when you turn the phone, and why a step counter can tell the difference between walking and sitting in a car.`,`The same chip is used in car airbags. If a car stops far more suddenly «4» it should, the accelerometer notices the change within a few thousandths of a second, «5» the signal that fires the bag.`,`A single idea, then, keeps a photograph upright and «6» lives.`]},passages:[{id:`P4-R1`,kind:`Informational passage`,title:`The Village That Moved Its School`,body:[`Ban Nong Pla sits on a bend in the river. For sixty years the school stood on the low bank, and for sixty years it flooded — some years to the ankles, some years to the windows.`,`In 2016 the villagers stopped repairing it. Instead they measured. Every household recorded how high the water reached each September, and after three years they had a map of the flood.`,`The map showed something nobody had expected. The safest ground was not the hill behind the village, which was hard for small children to reach, but a flat area only 200 metres away and just 1.4 metres higher.`,`The new school opened in 2021. It cost less than the repairs of the previous ten years had cost. In the two wet seasons since, the water has reached the edge of the football field and stopped.`,`The headteacher keeps the old flood map on the wall of her office. "People wanted to argue about where to build," she says. "The numbers ended the argument in an afternoon."`]},{id:`P4-R2`,kind:`Notice`,title:`Inter-School Science Competition: Entry Conditions`,body:[`Entries for the Regional Science Competition close on Friday 14 February.`,`Each school may send a maximum of three projects. A project may have one, two or three students, but no student may appear on more than one project.`,`Projects must be the students’ own work. A teacher may advise, but may not build, write or present any part of a project.`,`Every entry needs three things: a one-page summary, a photograph of the equipment, and a signed form from the head teacher. Entries missing any of these will be returned, and may be sent again before the closing date.`,`Judging takes place on 7 March. The three highest-scoring projects in each age group go forward to the national round in May. Projects that use live animals will not be accepted.`]}],questions:[{id:`P4-Q01`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`c«o»me`,`s«o»me`,`h«o»me`,`m«o»ther`],a:2,e:[`In "come", "some" and "mother" the letter "o" says the short /ʌ/ sound, like the "u" in "cup". In "home" it says the long /əʊ/ sound, its own name.`,`ในคำว่า come, some และ mother ตัวอักษร o ออกเสียงสระสั้น /ʌ/ เหมือน u ในคำว่า cup แต่ในคำว่า home ออกเสียงยาว /əʊ/ ตามชื่อตัวอักษร`],w:{0:[`"Come" has the short /ʌ/ sound despite the silent "e".`,`คำว่า come ออกเสียงสระสั้น /ʌ/ แม้จะมี e ที่ไม่ออกเสียงอยู่ท้ายคำ`],1:[`"Some" has the short /ʌ/ sound, the same as "come".`,`คำว่า some ออกเสียงสระสั้น /ʌ/ เหมือนกับ come`],3:[`"Mother" has the short /ʌ/ sound in its first syllable.`,`คำว่า mother ออกเสียงสระสั้น /ʌ/ ในพยางค์แรก`]}},{id:`P4-Q02`,p:`pronunciation`,k:`ending-sounds`,q:`Which underlined ending is pronounced differently from the others?`,c:[`watch«es»`,`lake«s»`,`bus«es»`,`box«es»`],a:1,e:[`After a hissing sound such as /tʃ/, /s/ or /ks/, the plural ending adds a whole syllable, /ɪz/: watch-es, bus-es, box-es. After /k/ it is just a short /s/.`,`หลังเสียงเสียดแทรก เช่น /tʃ/ /s/ /ks/ ส่วนท้ายพหูพจน์จะเพิ่มพยางค์เป็น /ɪz/ เช่น watch-es, bus-es, box-es แต่หลังเสียง /k/ จะออกเสียงเพียง /s/ สั้น ๆ`],w:{0:[`"Watches" ends in /tʃ/, so the ending is the extra syllable /ɪz/.`,`คำว่า watches ลงท้ายด้วย /tʃ/ ส่วนท้ายจึงเป็นพยางค์เพิ่ม /ɪz/`],2:[`"Buses" ends in /s/, so the ending is /ɪz/.`,`คำว่า buses ลงท้ายด้วย /s/ ส่วนท้ายจึงเป็น /ɪz/`],3:[`"Boxes" ends in /ks/, so the ending is /ɪz/.`,`คำว่า boxes ลงท้ายด้วย /ks/ ส่วนท้ายจึงเป็น /ɪz/`]}},{id:`P4-Q03`,p:`pronunciation`,k:`consonant-sounds`,q:`In which word is the underlined letter NOT pronounced?`,c:[`«b»utter`,`«b»ridge`,`«b»ottle`,`clim«b»`],a:3,e:[`A "b" after "m" at the end of a word is silent: climb, comb, thumb, lamb. At the start of a word the "b" is always pronounced.`,`ตัว b ที่อยู่หลัง m ท้ายคำจะไม่ออกเสียง เช่น climb, comb, thumb, lamb ส่วนตัว b ที่ต้นคำจะออกเสียงเสมอ`],w:{0:[`The "b" in "butter" is pronounced.`,`ตัว b ในคำว่า butter ออกเสียง`],1:[`The "b" in "bridge" is pronounced.`,`ตัว b ในคำว่า bridge ออกเสียง`],2:[`The "b" in "bottle" is pronounced.`,`ตัว b ในคำว่า bottle ออกเสียง`]}},{id:`P4-Q04`,p:`pronunciation`,k:`word-stress`,q:`Which word has the stress on a different syllable from the others?`,c:[`important`,`beautiful`,`difficult`,`interesting`],a:0,e:[`"BEAU-ti-ful", "DIF-fi-cult" and "IN-ter-est-ing" are all stressed on the first syllable. "Im-POR-tant" is stressed on the second.`,`คำว่า BEAU-ti-ful, DIF-fi-cult และ IN-ter-est-ing ลงเสียงหนักที่พยางค์แรกทั้งหมด ส่วน im-POR-tant ลงเสียงหนักที่พยางค์ที่สอง`],w:{1:[`"Beautiful" is stressed on the first syllable: BEAU-ti-ful.`,`คำว่า beautiful ลงเสียงหนักพยางค์แรก เป็น BEAU-ti-ful`],2:[`"Difficult" is stressed on the first syllable: DIF-fi-cult.`,`คำว่า difficult ลงเสียงหนักพยางค์แรก เป็น DIF-fi-cult`],3:[`"Interesting" is stressed on the first syllable: IN-ter-est-ing.`,`คำว่า interesting ลงเสียงหนักพยางค์แรก เป็น IN-ter-est-ing`]}},{id:`P4-Q05`,p:`pronunciation`,k:`consonant-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`«ch»air`,`«ch»eese`,`«ch»emistry`,`«ch»ildren`],a:2,e:[`In "chair", "cheese" and "children" the letters "ch" say /tʃ/. In words that came into English from Greek, such as "chemistry", "school" and "character", they say /k/.`,`ในคำว่า chair, cheese และ children ตัวอักษร "ch" ออกเสียง /tʃ/ แต่ในคำที่มาจากภาษากรีก เช่น chemistry, school และ character จะออกเสียง /k/`],w:{0:[`"Chair" has the /tʃ/ sound.`,`คำว่า chair ออกเสียง /tʃ/`],1:[`"Cheese" has the /tʃ/ sound.`,`คำว่า cheese ออกเสียง /tʃ/`],3:[`"Children" has the /tʃ/ sound.`,`คำว่า children ออกเสียง /tʃ/`]}},{id:`P4-Q06`,p:`conversation`,k:`conversation`,intro:`Fern: I think school exams should be abolished completely.
Ton: ____`,q:`Choose the best reply for Ton, who disagrees politely.`,c:[`I see your point, but how would teachers know what we have learned?`,`You are completely wrong about that.`,`Yes, exams are certainly exams.`,`I do not have an exam this week.`],a:0,e:[`Polite disagreement in English acknowledges the other view first, then raises the objection as a question or with "but".`,`การไม่เห็นด้วยอย่างสุภาพในภาษาอังกฤษคือรับฟังความเห็นอีกฝ่ายก่อน แล้วจึงยกข้อโต้แย้งขึ้นมาในรูปคำถามหรือใช้คำว่า "but"`],w:{1:[`This is blunt and gives no reason at all.`,`ประโยคนี้ห้วนและไม่ได้ให้เหตุผลใด ๆ`],2:[`This states the obvious and takes no position.`,`ประโยคนี้พูดสิ่งที่รู้อยู่แล้วและไม่ได้แสดงจุดยืน`],3:[`This talks about Ton's own timetable instead of the idea.`,`ประโยคนี้พูดถึงตารางสอบของต้นเอง ไม่ได้ตอบเรื่องแนวคิด`]}},{id:`P4-Q07`,p:`conversation`,k:`situational-language`,intro:`Student: ____
Teacher: Of course. Bring it to my office after lunch.`,q:`Choose the best line for the student.`,c:[`I need you to check my essay today.`,`You must check my essay for me.`,`Do you ever check students’ essays?`,`Would you mind having a look at my essay?`],a:3,e:[`The teacher agrees and arranges a time, which follows a polite request. "Would you mind…?" is the most respectful way to ask a favour.`,`ครูตอบตกลงและนัดเวลา ซึ่งเป็นการตอบคำขอที่สุภาพ วลี "Would you mind…?" เป็นการขอความช่วยเหลืออย่างให้เกียรติที่สุด`],w:{0:[`"I need you to" sounds like an instruction rather than a request.`,`"I need you to" ฟังเหมือนคำสั่งมากกว่าการขอร้อง`],1:[`"You must" gives an order to a teacher, which is impolite.`,`"You must" เป็นการออกคำสั่งกับครู ซึ่งไม่สุภาพ`],2:[`This asks about the teacher's habits and requests nothing.`,`ประโยคนี้ถามถึงสิ่งที่ครูทำเป็นปกติ และไม่ได้ร้องขอสิ่งใด`]}},{id:`P4-Q08`,p:`conversation`,k:`situational-language`,intro:`Bank: Did I pass the audition?
Music teacher: ____`,q:`Choose the best reply for the music teacher, who has to say no.`,c:[`No. You were really terrible.`,`I’m afraid not this time, but the judges liked your voice.`,`Yes, you did not pass it.`,`The audition was held yesterday.`],a:1,e:[`Bad news in English is softened with "I'm afraid…" and usually followed by something genuinely encouraging.`,`การบอกข่าวร้ายในภาษาอังกฤษจะใช้ "I'm afraid…" เพื่อลดความรุนแรง และมักตามด้วยข้อความให้กำลังใจที่เป็นจริง`],w:{0:[`This is unnecessarily harsh to a student.`,`ประโยคนี้รุนแรงกับนักเรียนเกินความจำเป็น`],2:[`"Yes" and "did not pass" contradict each other.`,`"Yes" กับ "did not pass" ขัดแย้งกันเอง`],3:[`This states when the audition was and avoids the question.`,`ประโยคนี้บอกว่าออดิชันจัดเมื่อใด เป็นการเลี่ยงคำถาม`]}},{id:`P4-Q09`,p:`conversation`,k:`conversation`,intro:`Ice: Can we meet at four on Tuesday to finish the poster?
Jin: ____`,q:`Choose the best reply for Jin, who is busy on Tuesday.`,c:[`Yes, Tuesday is certainly a day.`,`No.`,`I’m busy then. Would Wednesday at four work instead?`,`Four o’clock is quite late in the day.`],a:2,e:[`A useful refusal says no, gives a short reason, and offers an alternative so the plan can still go ahead.`,`การปฏิเสธที่เป็นประโยชน์คือบอกว่าไม่ได้ ให้เหตุผลสั้น ๆ และเสนอทางเลือกอื่น เพื่อให้แผนยังเดินหน้าต่อได้`],w:{0:[`This states the obvious and does not answer the request.`,`ประโยคนี้พูดสิ่งที่รู้อยู่แล้วและไม่ได้ตอบคำขอ`],1:[`A bare "No" leaves the poster unfinished and sounds unfriendly.`,`การตอบเพียง "No" ทำให้งานค้างและฟังดูไม่เป็นมิตร`],3:[`This comments on the time but never accepts or refuses.`,`ประโยคนี้แสดงความเห็นเรื่องเวลา แต่ไม่ได้ตอบรับหรือปฏิเสธ`]}},{id:`P4-Q10`,p:`conversation`,k:`situational-language`,intro:`Pharmacist: ____
Customer: Twice a day, after meals.`,q:`Choose the best line for the pharmacist.`,c:[`What is your full name, please?`,`Do you have a prescription with you?`,`How much would you like to pay?`,`Do you know how often to take these?`],a:3,e:[`The customer answers with a frequency, so the pharmacist must have checked whether the customer knows how often to take the medicine.`,`ลูกค้าตอบด้วยความถี่ในการกิน แสดงว่าเภสัชกรถามว่าลูกค้ารู้หรือไม่ว่าต้องกินยาบ่อยแค่ไหน`],w:{0:[`A name question would be answered with a name.`,`คำถามเรื่องชื่อต้องตอบด้วยชื่อ`],1:[`This is a yes/no question and would not be answered with a frequency.`,`ประโยคนี้เป็นคำถาม yes/no จึงไม่ตอบด้วยความถี่`],2:[`A question about money would be answered with an amount.`,`คำถามเรื่องเงินต้องตอบด้วยจำนวนเงิน`]}},{id:`P4-Q11`,p:`conversation`,k:`conversation`,intro:`Bow: I’m worried I’ll forget my lines on stage tonight.
Dew: ____`,q:`Choose the best reply for Dew.`,c:[`You probably will, knowing you.`,`You’ve rehearsed for weeks — you’ll be fine.`,`I never forget my own lines.`,`The stage is very big, isn’t it?`],a:1,e:[`A friend expressing nerves needs reassurance backed by a real reason. Naming the weeks of rehearsal gives Bow something solid to hold on to.`,`เพื่อนที่กำลังกังวลต้องการกำลังใจที่มีเหตุผลรองรับ การกล่าวถึงการซ้อมมาหลายสัปดาห์ทำให้โบว์มีสิ่งยึดเหนี่ยวที่เป็นจริง`],w:{0:[`This confirms the fear and makes the nerves worse.`,`ประโยคนี้ยืนยันความกลัวและทำให้ยิ่งกังวล`],2:[`Talking about yourself ignores your friend's worry.`,`การพูดถึงตัวเองเป็นการมองข้ามความกังวลของเพื่อน`],3:[`Changing the subject to the stage offers no comfort.`,`การเปลี่ยนเรื่องไปพูดถึงเวทีไม่ได้ช่วยปลอบใจ`]}},{id:`P4-Q12`,p:`grammar`,k:`tenses`,q:`By the time the ambulance arrived, the neighbours ____ him to hospital themselves.`,c:[`take`,`had taken`,`have taken`,`were taking`],a:1,e:[`Two past events are described and one finished before the other. The earlier action takes the past perfect: had taken.`,`ประโยคกล่าวถึงเหตุการณ์ในอดีตสองเหตุการณ์ โดยเหตุการณ์หนึ่งจบก่อนอีกเหตุการณ์ เหตุการณ์ที่เกิดก่อนจึงใช้ past perfect คือ had taken`],w:{0:[`"Take" is present simple and does not match the past verb "arrived".`,`"take" เป็น present simple ไม่สอดคล้องกับกริยาอดีต "arrived"`],2:[`"Have taken" connects to now, but both events are finished past events.`,`"have taken" เชื่อมโยงกับปัจจุบัน แต่ทั้งสองเหตุการณ์จบไปแล้วในอดีต`],3:[`"Were taking" would mean they were still on the way when the ambulance came.`,`"were taking" จะหมายความว่าพวกเขายังอยู่ระหว่างทางตอนรถพยาบาลมาถึง`]}},{id:`P4-Q13`,p:`grammar`,k:`conditionals`,q:`If I ____ you, I would apologise to her immediately.`,c:[`am`,`was`,`were`,`will be`],a:2,e:[`"If I were you" is a fixed second-conditional phrase for giving advice. In this pattern "were" is used with every subject, including "I".`,`"If I were you" เป็นวลีตายตัวของประโยคเงื่อนไขแบบที่ 2 ที่ใช้ให้คำแนะนำ โดยใช้ "were" กับประธานทุกตัวรวมถึง "I"`],w:{0:[`"Am" would make this a real present situation, but "would" shows it is imagined.`,`"am" จะทำให้เป็นสถานการณ์จริงในปัจจุบัน แต่คำว่า "would" บอกว่าเป็นการสมมติ`],1:[`"Was" is heard in casual speech, but the standard exam form is "were".`,`"was" ได้ยินในภาษาพูดทั่วไป แต่รูปมาตรฐานที่ข้อสอบใช้คือ "were"`],3:[`"Will" is never used inside an "if" clause of this kind.`,`ไม่ใช้ "will" ในอนุประโยค if ของโครงสร้างแบบนี้`]}},{id:`P4-Q14`,p:`grammar`,k:`relative-clauses`,q:`The scientist ____ discovery changed medicine died almost unknown.`,c:[`whose`,`who`,`which`,`that`],a:0,e:[`The discovery belongs to the scientist, so a possessive relative pronoun is needed. "Whose" is the only one, and it is followed directly by a noun.`,`การค้นพบนี้เป็นของนักวิทยาศาสตร์ จึงต้องใช้คำสรรพนามเชื่อมความที่แสดงความเป็นเจ้าของ ซึ่งมีเพียง "whose" และต้องตามด้วยคำนามทันที`],w:{1:[`"Who" is a subject pronoun and cannot be followed straight away by "discovery".`,`"who" เป็นสรรพนามประธาน จึงตามด้วยคำว่า "discovery" ทันทีไม่ได้`],2:[`"Which" refers to things and does not show possession.`,`"which" ใช้แทนสิ่งของ และไม่ได้แสดงความเป็นเจ้าของ`],3:[`"That" can replace who or which, but it never shows possession.`,`"that" ใช้แทน who หรือ which ได้ แต่ไม่แสดงความเป็นเจ้าของ`]}},{id:`P4-Q15`,p:`grammar`,k:`passive`,q:`The entry forms ____ in black ink only.`,c:[`must fill`,`must filling`,`must be fill`,`must be filled in`],a:3,e:[`The forms do not fill anything in; people fill them in. After a modal, the passive is "modal + be + past participle": must be filled in.`,`แบบฟอร์มไม่ได้เป็นผู้กรอก แต่มีคนกรอกมัน หลังกริยาช่วยรูป passive คือ "modal + be + กริยาช่องที่ 3" จึงเป็น must be filled in`],w:{0:[`"Must fill" is active and makes the forms the writer.`,`"must fill" เป็นรูป active ซึ่งทำให้แบบฟอร์มกลายเป็นผู้กรอก`],1:[`A modal is never followed by an -ing form.`,`หลังกริยาช่วยจะไม่ตามด้วยรูป -ing`],2:[`After "be" we need the past participle "filled", not the base form.`,`หลัง "be" ต้องใช้กริยาช่องที่ 3 คือ "filled" ไม่ใช่รูปพื้นฐาน`]}},{id:`P4-Q16`,p:`grammar`,k:`agreement`,q:`The number of accidents on this road ____ fallen sharply since the lights were installed.`,c:[`have`,`has`,`are`,`were`],a:1,e:[`The subject is "the number", which is singular. The plural words "accidents on this road" only describe it, so the verb stays singular: has.`,`ประธานของประโยคคือ "the number" ซึ่งเป็นเอกพจน์ ส่วนคำพหูพจน์ "accidents on this road" เป็นเพียงส่วนขยาย กริยาจึงคงรูปเอกพจน์คือ has`],w:{0:[`"Have" agrees with "accidents", but "accidents" is not the subject.`,`"have" สอดคล้องกับ "accidents" แต่ "accidents" ไม่ใช่ประธาน`],2:[`"Are" is plural and cannot be followed by "fallen" in this pattern.`,`"are" เป็นพหูพจน์ และตามด้วย "fallen" ในโครงสร้างนี้ไม่ได้`],3:[`"Were" is plural and past, and "since" calls for a perfect tense.`,`"were" เป็นพหูพจน์และรูปอดีต อีกทั้งคำว่า "since" ต้องใช้กับ perfect tense`]}},{id:`P4-Q17`,p:`grammar`,k:`verb-patterns`,q:`The coach made us ____ an extra twenty minutes after the match.`,c:[`to run`,`running`,`run`,`ran`],a:2,e:[`After "make somebody", English uses the bare base form with no "to": made us run, made him wait.`,`หลังโครงสร้าง "make somebody" ภาษาอังกฤษใช้กริยารูปพื้นฐานโดยไม่มี "to" เช่น made us run, made him wait`],w:{0:[`"To run" follows verbs like "ask" and "tell", but not "make".`,`"to run" ใช้ตามกริยาอย่าง ask และ tell แต่ไม่ใช้กับ make`],1:[`The -ing form does not follow "make somebody".`,`รูป -ing ไม่ตามหลัง "make somebody"`],3:[`"Ran" is a past form and cannot follow another verb here.`,`"ran" เป็นรูปอดีต จึงตามหลังกริยาอีกตัวในที่นี้ไม่ได้`]}},{id:`P4-Q18`,p:`grammar`,k:`reported-speech`,intro:`Direct speech: "Don’t touch the equipment," the teacher warned us.`,q:`The teacher warned us ____ the equipment.`,c:[`not touching`,`to not touch`,`don’t touch`,`not to touch`],a:3,e:[`A reported negative command uses "not + to + base verb": warned us not to touch, told them not to go.`,`คำสั่งปฏิเสธที่ถูกเล่าต่อใช้โครงสร้าง "not + to + กริยาพื้นฐาน" เช่น warned us not to touch, told them not to go`],w:{0:[`The -ing form is not used to report a command.`,`ไม่ใช้รูป -ing ในการเล่าคำสั่ง`],1:[`"To not touch" is not the standard order; "not" comes before "to".`,`รูป "to not touch" ไม่ใช่ลำดับมาตรฐาน คำว่า "not" ต้องมาก่อน "to"`],2:[`"Don't touch" is the original direct command, with its auxiliary still in place.`,`"don't touch" คือคำสั่งตรงรูปเดิมที่ยังมีกริยาช่วยอยู่`]}},{id:`P4-Q19`,p:`grammar`,k:`quantifiers`,q:`There is ____ evidence for that claim, so most scientists remain doubtful.`,c:[`little`,`a little`,`few`,`a few`],a:0,e:[`"Evidence" is uncountable, and "little" without "a" means hardly any — which is exactly why the scientists are doubtful.`,`"evidence" เป็นคำนามนับไม่ได้ และคำว่า "little" ที่ไม่มี "a" นำหน้าแปลว่าแทบไม่มีเลย ซึ่งเป็นเหตุผลที่นักวิทยาศาสตร์ยังสงสัย`],w:{1:[`"A little" means some, which would give them a reason to believe it.`,`"a little" แปลว่ามีอยู่บ้าง ซึ่งจะเป็นเหตุให้พวกเขาเชื่อ`],2:[`"Few" is used with countable plural nouns.`,`"few" ใช้กับคำนามพหูพจน์ที่นับได้`],3:[`"A few" is also for countable nouns and means some.`,`"a few" ก็ใช้กับคำนามนับได้ และแปลว่ามีอยู่บ้าง`]}},{id:`P4-Q20`,p:`error`,k:`verb-patterns`,sent:`«The teacher suggested to postpone» the test «until» «next» «Friday».`,q:`Which underlined part is incorrect?`,c:[`The teacher suggested to postpone`,`until`,`next`,`Friday`],a:0,e:[`"Suggest" is followed by the -ing form or by a "that" clause, never by "to + verb". The correct phrase is "suggested postponing".`,`กริยา "suggest" ต้องตามด้วยรูป -ing หรืออนุประโยค that ไม่ใช้ "to + กริยา" วลีที่ถูกต้องคือ "suggested postponing"`],w:{1:[`"Until" correctly marks the new point in time.`,`"until" ใช้บอกจุดเวลาใหม่ได้ถูกต้อง`],2:[`"Next Friday" is a correct future time phrase.`,`"next Friday" เป็นวลีบอกเวลาในอนาคตที่ถูกต้อง`],3:[`"Friday" is correctly capitalised and correctly placed.`,`"Friday" สะกดด้วยตัวพิมพ์ใหญ่และวางตำแหน่งถูกต้อง`]}},{id:`P4-Q21`,p:`error`,k:`comparisons`,sent:`This year’s results are «far» «better» «than» «last year one».`,q:`Which underlined part is incorrect?`,c:[`far`,`better`,`than`,`last year one`],a:3,e:[`The comparison is between this year's results and last year's, so the possessive form is needed: "last year's". You can also say "those of last year".`,`การเปรียบเทียบคือระหว่างผลของปีนี้กับของปีที่แล้ว จึงต้องใช้รูปแสดงความเป็นเจ้าของว่า "last year's" หรือจะใช้ "those of last year" ก็ได้`],w:{0:[`"Far" correctly strengthens a comparative: far better, far worse.`,`"far" ใช้เน้นคำขั้นกว่าได้ถูกต้อง เช่น far better, far worse`],1:[`"Better" is the correct comparative of "good".`,`"better" เป็นรูปขั้นกว่าที่ถูกต้องของ "good"`],2:[`"Than" correctly follows a comparative.`,`"than" ตามหลังคำขั้นกว่าได้ถูกต้อง`]}},{id:`P4-Q22`,p:`error`,k:`agreement`,sent:`The new library «was» opened «in» 2019 and «have been» used «by» thousands of students since then.`,q:`Which underlined part is incorrect?`,c:[`was`,`in`,`have been`,`by`],a:2,e:[`Both verbs share the singular subject "the new library", so the second one must be singular too: "has been used".`,`กริยาทั้งสองตัวใช้ประธานเดียวกันคือ "the new library" ซึ่งเป็นเอกพจน์ กริยาตัวที่สองจึงต้องเป็นเอกพจน์ด้วย คือ "has been used"`],w:{0:[`"Was opened" is a correct past passive for a singular subject.`,`"was opened" เป็น passive รูปอดีตที่ถูกต้องสำหรับประธานเอกพจน์`],1:[`"In 2019" is the correct preposition with a year.`,`"in 2019" ใช้คำบุพบทกับปีได้ถูกต้อง`],3:[`"By thousands of students" correctly names who does the action.`,`"by thousands of students" ระบุผู้กระทำได้ถูกต้อง`]}},{id:`P4-Q23`,p:`error`,k:`relative-clauses`,sent:`The book «which» I borrowed «it» from the library «was» «missing» three pages.`,q:`Which underlined part is incorrect?`,c:[`which`,`it`,`was`,`missing`],a:1,e:[`The relative pronoun "which" is already the object of "borrowed", so the extra "it" repeats the object. The sentence should read "The book which I borrowed from the library…".`,`คำสรรพนามเชื่อมความ "which" ทำหน้าที่เป็นกรรมของ "borrowed" อยู่แล้ว การเติม "it" จึงเป็นการใส่กรรมซ้ำ ประโยคที่ถูกต้องคือ "The book which I borrowed from the library…"`],w:{0:[`"Which" correctly introduces a clause about a thing.`,`"which" ใช้นำหน้าอนุประโยคที่ขยายสิ่งของได้ถูกต้อง`],2:[`"Was" correctly agrees with the singular subject "the book".`,`"was" สอดคล้องกับประธานเอกพจน์ "the book" ได้ถูกต้อง`],3:[`"Missing" is correct in the phrase "was missing three pages".`,`"missing" ถูกต้องในวลี "was missing three pages"`]}},{id:`P4-Q24`,p:`error`,k:`tenses`,sent:`«She has gone» to Japan last year, «so» she «knows» a lot «about» the country.`,q:`Which underlined part is incorrect?`,c:[`She has gone`,`so`,`knows`,`about`],a:0,e:[`The present perfect is never used with a finished time such as "last year", and "has gone" also means she is still away. The correct form is "She went to Japan last year".`,`ไม่ใช้ present perfect กับคำบอกเวลาที่จบแล้ว เช่น "last year" อีกทั้ง "has gone" ยังหมายความว่าเธอยังไม่กลับมา รูปที่ถูกต้องคือ "She went to Japan last year"`],w:{1:[`"So" correctly introduces the result of the visit.`,`"so" ใช้นำหน้าผลที่เกิดจากการไปเที่ยวได้ถูกต้อง`],2:[`"Knows" correctly agrees with the singular subject "she".`,`"knows" สอดคล้องกับประธานเอกพจน์ "she" ได้ถูกต้อง`],3:[`"Know about something" is the correct pattern.`,`โครงสร้าง "know about something" ถูกต้องแล้ว`]}},{id:`P4-Q25`,p:`error`,k:`passive`,sent:`The meeting «was postponed» «because of» the storm, «and» it «will hold» on Friday instead.`,q:`Which underlined part is incorrect?`,c:[`was postponed`,`because of`,`and`,`will hold`],a:3,e:[`A meeting does not hold anything; people hold it. The second verb must be passive too: "it will be held on Friday".`,`การประชุมไม่ได้เป็นผู้จัด แต่มีคนจัดมันขึ้น กริยาตัวที่สองจึงต้องเป็น passive ด้วย คือ "it will be held on Friday"`],w:{0:[`"Was postponed" is already a correct past passive.`,`"was postponed" เป็น passive รูปอดีตที่ถูกต้องอยู่แล้ว`],1:[`"Because of" is correctly followed by the noun "the storm".`,`"because of" ตามด้วยคำนาม "the storm" ได้ถูกต้อง`],2:[`"And" correctly joins the two clauses.`,`"and" เชื่อมสองอนุประโยคได้ถูกต้อง`]}},{id:`P4-Q26`,p:`vocabulary`,k:`vocab-context`,q:`The results were ____: the youngest team in the league beat the champions.`,c:[`predictable`,`ordinary`,`astonishing`,`routine`],a:2,e:[`The colon explains the word: the weakest team beat the strongest. Something nobody could have expected is "astonishing".`,`เครื่องหมายทวิภาคขยายความคำนั้นว่าทีมที่อ่อนที่สุดชนะแชมป์ สิ่งที่ไม่มีใครคาดคิดเรียกว่า "astonishing" คือน่าทึ่งอย่างยิ่ง`],w:{0:[`"Predictable" means everybody expected it — the opposite of the example.`,`"predictable" แปลว่าทุกคนคาดเดาได้ ซึ่งตรงข้ามกับตัวอย่างที่ยกมา`],1:[`"Ordinary" means normal, but this result was anything but normal.`,`"ordinary" แปลว่าธรรมดา แต่ผลครั้งนี้ไม่ธรรมดาเลย`],3:[`"Routine" means something that happens regularly.`,`"routine" แปลว่าสิ่งที่เกิดขึ้นเป็นประจำ`]}},{id:`P4-Q27`,p:`vocabulary`,k:`synonyms-antonyms`,q:`The instructions were ambiguous, and half the class did the wrong exercise. "Ambiguous" means ____.`,c:[`very detailed`,`unclear`,`strict`,`extremely short`],a:1,e:[`Half the class misunderstood, so the instructions could be read in more than one way. "Ambiguous" means open to more than one meaning, and so unclear.`,`นักเรียนครึ่งห้องเข้าใจผิด แสดงว่าคำแนะนำตีความได้มากกว่าหนึ่งแบบ คำว่า "ambiguous" แปลว่ากำกวม ตีความได้หลายทาง จึงไม่ชัดเจน`],w:{0:[`Detailed instructions would usually prevent the mistake, not cause it.`,`คำแนะนำที่ละเอียดมักช่วยป้องกันความผิดพลาด ไม่ใช่ก่อให้เกิด`],2:[`"Strict" describes rules that must be followed exactly.`,`"strict" ใช้กับกฎที่ต้องปฏิบัติตามอย่างเคร่งครัด`],3:[`Short instructions can still be perfectly clear.`,`คำแนะนำที่สั้นก็ยังชัดเจนได้`]}},{id:`P4-Q28`,p:`vocabulary`,k:`collocations`,q:`The researchers have not yet managed to ____ a conclusion about the cause.`,c:[`make`,`take`,`give`,`reach`],a:3,e:[`"Reach a conclusion" is the standard collocation for arriving at an answer after investigation.`,`"reach a conclusion" เป็นคำคู่มาตรฐานที่ใช้เมื่อได้ข้อสรุปหลังการศึกษาค้นคว้า`],w:{0:[`"Make a conclusion" is not standard English.`,`รูป "make a conclusion" ไม่ใช่ภาษาอังกฤษมาตรฐาน`],1:[`"Take a conclusion" is not used.`,`รูป "take a conclusion" ไม่มีใช้`],2:[`"Give a conclusion" would mean presenting one that has already been reached.`,`"give a conclusion" จะหมายถึงการนำเสนอข้อสรุปที่ได้มาแล้ว`]}},{id:`P4-Q29`,p:`vocabulary`,k:`phrasal-verbs`,q:`It took the team three years to ____ a design that actually worked.`,c:[`come up with`,`come across`,`come round`,`come along`],a:0,e:[`"Come up with" means to think of an idea or a solution, which is what three years of work produced.`,`"come up with" แปลว่าคิดค้นแนวคิดหรือทางแก้ปัญหาขึ้นมา ซึ่งตรงกับผลของการทำงานสามปี`],w:{1:[`"Come across" means to find something by chance, not after years of effort.`,`"come across" แปลว่าบังเอิญพบ ไม่ใช่ผลจากความพยายามหลายปี`],2:[`"Come round" means to visit somebody, or to regain consciousness.`,`"come round" แปลว่าแวะไปหาใคร หรือฟื้นคืนสติ`],3:[`"Come along" means to make progress, or to accompany somebody.`,`"come along" แปลว่ามีความคืบหน้า หรือไปเป็นเพื่อน`]}},{id:`P4-Q30`,p:`vocabulary`,k:`word-formation`,q:`Her ____ to finish the race on a broken ankle surprised everybody.`,c:[`determined`,`determinedly`,`determination`,`determine`],a:2,e:[`"Her" must be followed by a noun, and the noun of this word family is "determination".`,`หลังคำว่า "her" ต้องใช้คำนาม และคำนามของคำตระกูลนี้คือ "determination"`],w:{0:[`"Determined" is an adjective, as in "she was determined".`,`"determined" เป็นคำคุณศัพท์ เช่น "she was determined"`],1:[`"Determinedly" is an adverb and describes how an action is done.`,`"determinedly" เป็นคำวิเศษณ์ ใช้ขยายวิธีการกระทำ`],3:[`"Determine" is the verb and cannot follow "her" here.`,`"determine" เป็นคำกริยา จึงตามหลัง "her" ในที่นี้ไม่ได้`]}},{id:`P4-Q31`,p:`ordering`,k:`word-order`,items:[`have never seen`,`I`,`so clearly`,`the stars`],q:`Put the parts in the correct order to make a sentence.`,c:[`1-2-4-3`,`2-4-1-3`,`1-4-2-3`,`2-1-4-3`],a:3,e:[`The order is subject → verb → object → adverb phrase: "I (2) have never seen (1) the stars (4) so clearly (3)."`,`ลำดับคือ ประธาน → กริยา → กรรม → วลีขยาย จึงได้ "I (2) have never seen (1) the stars (4) so clearly (3)"`],w:{0:[`Starting with the verb leaves the sentence without a subject.`,`การขึ้นต้นด้วยกริยาทำให้ประโยคไม่มีประธาน`],1:[`This puts the object before the verb: "I the stars have never seen".`,`รูปนี้วางกรรมไว้หน้ากริยา เป็น "I the stars have never seen"`],2:[`This also begins with the verb phrase instead of the subject.`,`รูปนี้ก็ขึ้นต้นด้วยกริยาแทนที่จะเป็นประธาน`]}},{id:`P4-Q32`,p:`ordering`,k:`questions`,items:[`the results`,`be announced`,`when`,`will`],q:`Put the parts in the correct order to make a question.`,c:[`3-4-1-2`,`4-3-1-2`,`3-1-4-2`,`1-3-4-2`],a:0,e:[`A passive wh- question runs question word → auxiliary → subject → be + past participle: "When (3) will (4) the results (1) be announced (2)?"`,`คำถาม wh- รูป passive เรียงเป็น คำถาม → กริยาช่วย → ประธาน → be + กริยาช่องที่ 3 จึงได้ "When (3) will (4) the results (1) be announced (2)?"`],w:{1:[`Starting with "will" puts the auxiliary before the question word.`,`การขึ้นต้นด้วย "will" ทำให้กริยาช่วยมาก่อนคำถาม`],2:[`"When the results will be announced" is statement order, used inside a longer sentence.`,`รูป "When the results will be announced" เป็นลำดับแบบบอกเล่า ใช้เมื่ออยู่ในประโยคที่ยาวกว่า`],3:[`Starting with the subject leaves the question word in the middle.`,`การขึ้นต้นด้วยประธานทำให้คำถามไปอยู่กลางประโยค`]}},{id:`P4-Q33`,p:`ordering`,k:`text-cohesion`,items:[`I think so, but I would check the second calculation.`,`Could you look at my report before I hand it in?`,`Thank you. I’ll do that now.`,`Of course. … Yes, the method looks right to me.`],q:`Put the lines in the correct order to make a conversation.`,c:[`2-1-4-3`,`4-2-1-3`,`2-4-1-3`,`1-2-4-3`],a:2,e:[`The request comes first (2), then the agreement and first comment (4), then the fuller opinion with a suggestion (1), and finally the thanks (3).`,`คำขอมาก่อน (2) ตามด้วยการตอบตกลงและความเห็นแรก (4) จากนั้นเป็นความเห็นที่ละเอียดขึ้นพร้อมข้อเสนอแนะ (1) และปิดท้ายด้วยคำขอบคุณ (3)`],w:{0:[`"I think so" must answer something, so it cannot come before "Of course".`,`"I think so" ต้องตอบสิ่งใดสิ่งหนึ่ง จึงมาก่อน "Of course" ไม่ได้`],1:[`"Of course" cannot open the conversation before a request is made.`,`"Of course" ขึ้นต้นบทสนทนาก่อนที่จะมีคำขอไม่ได้`],3:[`Starting with "I think so" leaves the request in second place.`,`การขึ้นต้นด้วย "I think so" ทำให้คำขอไปอยู่ลำดับที่สอง`]}},{id:`P4-Q34`,p:`ordering`,k:`linking-words`,items:[`As a result, the whole experiment had to be repeated.`,`Somebody had left the window open overnight.`,`On Monday the class found their plants dead.`,`The cold air had killed every seedling.`],q:`Put the sentences in the correct order to make a paragraph.`,c:[`3-4-2-1`,`3-2-4-1`,`2-3-4-1`,`3-2-1-4`],a:1,e:[`The discovery opens the paragraph (3), then the cause (2), then what the cause did (4), and "As a result" closes it (1).`,`การค้นพบเปิดย่อหน้า (3) ตามด้วยสาเหตุ (2) แล้วจึงเป็นผลของสาเหตุนั้น (4) และ "As a result" ปิดท้าย (1)`],w:{0:[`"The cold air" can only be explained after we know the window was open.`,`"the cold air" จะอธิบายได้ก็ต่อเมื่อรู้ก่อนว่าหน้าต่างถูกเปิดทิ้งไว้`],2:[`Opening with the open window gives away the cause before the problem is stated.`,`การขึ้นต้นด้วยหน้าต่างที่เปิดทิ้งไว้เป็นการเฉลยสาเหตุก่อนจะบอกปัญหา`],3:[`"As a result" cannot come before the result it describes.`,`"As a result" มาก่อนผลที่มันกล่าวถึงไม่ได้`]}},{id:`P4-Q35`,p:`cloze`,k:`comparisons`,blank:1,q:`Choose the best answer for blank 1.`,c:[`very`,`much`,`so`,`too`],a:1,e:[`The word sits in front of the comparative "smaller", and comparatives are strengthened with "much", "far" or "a lot" — never with "very".`,`คำนี้อยู่หน้าคำขั้นกว่า "smaller" และคำขั้นกว่าจะเน้นด้วย "much" "far" หรือ "a lot" ไม่ใช้ "very"`],w:{0:[`"Very" goes before a plain adjective ("very small"), never before a comparative.`,`"very" วางหน้าคำคุณศัพท์รูปปกติ เช่น "very small" ไม่ใช้หน้าขั้นกว่า`],2:[`"So" also needs a plain adjective, as in "so small".`,`"so" ก็ต้องใช้กับคำคุณศัพท์รูปปกติ เช่น "so small"`],3:[`"Too" means more than is wanted and cannot come before a comparative.`,`"too" แปลว่ามากเกินไป และวางหน้าคำขั้นกว่าไม่ได้`]}},{id:`P4-Q36`,p:`cloze`,k:`conjunctions`,blank:2,q:`Choose the best answer for blank 2.`,c:[`but`,`or`,`and`,`so`],a:2,e:[`Measuring the bend and working out the direction are two steps of the same process, so a simple joining word is needed: "and".`,`การวัดการโค้งงอกับการคำนวณทิศทางเป็นสองขั้นตอนของกระบวนการเดียวกัน จึงต้องใช้คำเชื่อมธรรมดาคือ "and"`],w:{0:[`"But" shows contrast, but the two actions agree with each other.`,`"but" แสดงความขัดแย้ง แต่การกระทำทั้งสองสอดคล้องกัน`],1:[`"Or" offers a choice, and the phone does both things.`,`"or" ให้เลือกอย่างใดอย่างหนึ่ง แต่โทรศัพท์ทำทั้งสองอย่าง`],3:[`"So" would make the second action a result rather than the next step.`,`"so" จะทำให้การกระทำที่สองกลายเป็นผลลัพธ์ แทนที่จะเป็นขั้นตอนถัดไป`]}},{id:`P4-Q37`,p:`cloze`,k:`text-cohesion`,blank:3,q:`Choose the best answer for blank 3.`,c:[`why`,`because`,`how`,`what`],a:0,e:[`The paragraph before explains a cause, and this sentence names the effects it produces. "This is why…" is the phrase that links a cause to its results.`,`ย่อหน้าก่อนหน้าอธิบายสาเหตุ และประโยคนี้ระบุผลที่ตามมา วลี "This is why…" ใช้เชื่อมสาเหตุเข้ากับผลลัพธ์`],w:{1:[`"This is because" would introduce a cause, but the cause has already been given.`,`"This is because" ใช้นำหน้าสาเหตุ แต่สาเหตุถูกอธิบายไปแล้ว`],2:[`"This is how" would introduce a method, not a list of effects.`,`"This is how" ใช้นำหน้าวิธีการ ไม่ใช่ผลที่ตามมา`],3:[`"This is what" would need a noun clause naming a thing, not two reasons.`,`"This is what" ต้องตามด้วยอนุประโยคที่ระบุสิ่งของ ไม่ใช่เหตุผลสองข้อ`]}},{id:`P4-Q38`,p:`cloze`,k:`comparisons`,blank:4,q:`Choose the best answer for blank 4.`,c:[`as`,`that`,`then`,`than`],a:3,e:[`The comparative "more suddenly" must be followed by "than": more suddenly than it should.`,`คำขั้นกว่า "more suddenly" ต้องตามด้วย "than" เป็น more suddenly than it should`],w:{0:[`"As" is used in the "as … as" pattern, with no comparative.`,`"as" ใช้ในโครงสร้าง "as … as" ซึ่งไม่มีคำขั้นกว่า`],1:[`"That" is a very common spelling slip here, but it is not a comparison word.`,`"that" เป็นข้อผิดพลาดที่พบบ่อยในจุดนี้ แต่ไม่ใช่คำที่ใช้เปรียบเทียบ`],2:[`"Then" refers to time, not to comparison.`,`"then" บอกเรื่องเวลา ไม่ได้ใช้เปรียบเทียบ`]}},{id:`P4-Q39`,p:`cloze`,k:`verb-patterns`,blank:5,q:`Choose the best answer for blank 5.`,c:[`sent`,`sending`,`sends`,`to send`],a:1,e:[`The clause after the comma describes what the accelerometer does as a result, and English uses an -ing participle for that: "…notices the change…, sending the signal that fires the bag."`,`อนุประโยคหลังเครื่องหมายจุลภาคบอกผลที่เซนเซอร์ทำต่อ ภาษาอังกฤษใช้รูป -ing ในกรณีนี้ เป็น "…notices the change…, sending the signal that fires the bag."`],w:{0:[`"Sent" would need its own subject and a joining word.`,`"sent" ต้องมีประธานของตัวเองและคำเชื่อม`],2:[`"Sends" would need "and" before it to join the two verbs.`,`"sends" ต้องมี "and" นำหน้าเพื่อเชื่อมกริยาสองตัว`],3:[`"To send" would state a purpose, but the signal is a result, not an aim.`,`"to send" จะบอกจุดประสงค์ แต่สัญญาณนี้เป็นผลที่เกิดขึ้น ไม่ใช่เป้าหมาย`]}},{id:`P4-Q40`,p:`cloze`,k:`collocations`,blank:6,q:`Choose the best answer for blank 6.`,c:[`keeps`,`holds`,`saves`,`makes`],a:2,e:[`"Save lives" is the fixed expression for preventing deaths, and it contrasts neatly with "keeps a photograph upright" in the same sentence.`,`"save lives" เป็นสำนวนตายตัวที่แปลว่าช่วยชีวิตไม่ให้เสียชีวิต และขับให้เห็นความต่างกับ "keeps a photograph upright" ในประโยคเดียวกัน`],w:{0:[`"Keeps" is already used earlier in the sentence and does not mean rescuing.`,`"keeps" ถูกใช้ไปแล้วในประโยคเดียวกัน และไม่ได้แปลว่าช่วยชีวิต`],1:[`"Holds lives" is not an English expression.`,`วลี "holds lives" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Makes lives" needs an adjective after it, as in "makes lives easier".`,`"makes lives" ต้องมีคำคุณศัพท์ตามหลัง เช่น "makes lives easier"`]}},{id:`P4-Q41`,p:`reading`,k:`reading-detail`,pid:`P4-R1`,q:`For how long did the old school flood?`,c:[`Three years`,`Ten years`,`Sixty years`,`Since 2016`],a:2,e:[`The opening paragraph says, "for sixty years the school stood on the low bank, and for sixty years it flooded."`,`ย่อหน้าแรกระบุว่า "for sixty years the school stood on the low bank, and for sixty years it flooded" คือน้ำท่วมมาตลอด 60 ปี`],w:{0:[`Three years is how long the villagers measured the water.`,`สามปีคือระยะเวลาที่ชาวบ้านเก็บข้อมูลระดับน้ำ`],1:[`Ten years is the period of repairs the new school was cheaper than.`,`สิบปีคือช่วงเวลาของการซ่อมแซมที่นำมาเทียบราคากับโรงเรียนใหม่`],3:[`2016 is when they stopped repairing and started measuring.`,`ปี 2016 คือปีที่พวกเขาเลิกซ่อมและเริ่มวัดระดับน้ำ`]}},{id:`P4-Q42`,p:`reading`,k:`reading-detail`,pid:`P4-R1`,q:`What did the villagers do instead of repairing the school again?`,c:[`They measured how high the water reached each year.`,`They moved to another village nearby.`,`They built a high wall around the school.`,`They closed the school during the wet season.`],a:0,e:[`The second paragraph says, "Instead they measured. Every household recorded how high the water reached each September."`,`ย่อหน้าที่สองระบุว่า "Instead they measured. Every household recorded how high the water reached each September."`],w:{1:[`They moved the school 200 metres, not the village.`,`พวกเขาย้ายโรงเรียนไป 200 เมตร ไม่ได้ย้ายหมู่บ้าน`],2:[`No wall is mentioned anywhere in the passage.`,`บทอ่านไม่ได้กล่าวถึงกำแพงเลย`],3:[`Closing the s
