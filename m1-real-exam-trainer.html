e rules out.`,`"disputed" แปลว่ามีคนเห็นต่าง ซึ่งประโยคนี้ตัดความเป็นไปได้นั้นออกไป`],2:[`"Circumstantial" evidence is indirect, but a photograph and a receipt are direct.`,`หลักฐาน "circumstantial" เป็นหลักฐานแวดล้อม แต่ภาพถ่ายและใบเสร็จเป็นหลักฐานโดยตรง`]}},{id:`P6-Q27`,p:`vocabulary`,k:`synonyms-antonyms`,q:`Her explanation was concise, and the meeting finished early. "Concise" means ____.`,c:[`confusing`,`unnecessarily detailed`,`brief and clear`,`spoken very quietly`],a:2,e:[`The meeting finished early because she said what was needed and no more. "Concise" means short and clear at the same time.`,`การประชุมจบเร็วเพราะเธอพูดเท่าที่จำเป็นและไม่เกินนั้น คำว่า "concise" แปลว่าสั้นและชัดเจนไปพร้อมกัน`],w:{0:[`A confusing explanation would have made the meeting longer.`,`คำอธิบายที่สับสนจะทำให้การประชุมยาวขึ้น`],1:[`Extra detail is the opposite of being concise.`,`รายละเอียดที่เกินจำเป็นตรงข้ามกับความกระชับ`],3:[`"Concise" is about length, not about volume.`,`"concise" เกี่ยวกับความยาว ไม่ใช่ระดับเสียง`]}},{id:`P6-Q28`,p:`vocabulary`,k:`collocations`,q:`Nobody ____ the slightest attention to the warning sign at the gate.`,c:[`paid`,`gave`,`made`,`took`],a:0,e:[`Attention is always "paid" in English: pay attention, pay no attention, pay the slightest attention.`,`ในภาษาอังกฤษใช้คำว่า "pay" กับ attention เสมอ เช่น pay attention, pay no attention, pay the slightest attention`],w:{1:[`"Give attention" exists but not with "the slightest" in this pattern.`,`"give attention" มีใช้ แต่ไม่ใช้กับ "the slightest" ในโครงสร้างนี้`],2:[`"Make attention" is not English.`,`รูป "make attention" ไม่มีในภาษาอังกฤษ`],3:[`"Take attention" is not a natural collocation either.`,`รูป "take attention" ก็ไม่ใช่คำคู่ที่ใช้จริง`]}},{id:`P6-Q29`,p:`vocabulary`,k:`phrasal-verbs`,q:`The meeting was ____ until the head teacher returned from Chiang Mai.`,c:[`put down`,`put up`,`put through`,`put off`],a:3,e:[`"Put off" means to move an event to a later date, which is exactly what waiting for the head teacher requires.`,`"put off" แปลว่าเลื่อนกิจกรรมออกไปเป็นวันหลัง ซึ่งตรงกับการรอครูใหญ่กลับมาพอดี`],w:{0:[`"Put down" means to place something on a surface, or to criticise someone.`,`"put down" แปลว่าวางสิ่งของลง หรือพูดกดผู้อื่น`],1:[`"Put up" means to raise something, or to let somebody stay the night.`,`"put up" แปลว่ายกสิ่งของขึ้น หรือให้ที่พักค้างคืน`],2:[`"Put through" means to connect a telephone caller.`,`"put through" แปลว่าต่อสายโทรศัพท์ให้`]}},{id:`P6-Q30`,p:`vocabulary`,k:`word-formation`,q:`His argument was weakened by a single ____ statement near the end.`,c:[`mislead`,`misleading`,`misled`,`misleadingly`],a:1,e:[`The word sits in front of the noun "statement", so an adjective is needed, and the -ing form describes what the statement does to the reader.`,`คำนี้วางอยู่หน้าคำนาม "statement" จึงต้องเป็นคำคุณศัพท์ และรูป -ing ใช้บรรยายสิ่งที่ข้อความนั้นกระทำต่อผู้อ่าน`],w:{0:[`"Mislead" is a verb and cannot describe a noun.`,`"mislead" เป็นคำกริยา จึงขยายคำนามไม่ได้`],2:[`"Misled" would describe the person who was deceived, not the statement.`,`"misled" ใช้บรรยายคนที่ถูกทำให้เข้าใจผิด ไม่ใช่ตัวข้อความ`],3:[`"Misleadingly" is an adverb and cannot modify a noun.`,`"misleadingly" เป็นคำวิเศษณ์ จึงขยายคำนามไม่ได้`]}},{id:`P6-Q31`,p:`ordering`,k:`word-order`,items:[`is a question`,`how migrating birds find their way`,`have never fully answered`,`that scientists`],q:`Put the parts in the correct order to make a sentence.`,c:[`2-1-4-3`,`1-2-4-3`,`2-4-1-3`,`2-1-3-4`],a:0,e:[`The noun clause is the subject, then the verb, then the relative clause: "How migrating birds find their way (2) is a question (1) that scientists (4) have never fully answered (3)."`,`อนุประโยคนามทำหน้าที่เป็นประธาน ตามด้วยกริยา แล้วจึงเป็นอนุประโยคขยาย จึงได้ "How migrating birds find their way (2) is a question (1) that scientists (4) have never fully answered (3)."`],w:{1:[`Starting with "is a question" leaves the sentence without a subject.`,`การขึ้นต้นด้วย "is a question" ทำให้ประโยคไม่มีประธาน`],2:[`"That scientists" must follow the noun it describes, not the subject clause.`,`"that scientists" ต้องตามหลังคำนามที่มันขยาย ไม่ใช่ตามอนุประโยคประธาน`],3:[`This puts the relative clause before the word "that" that introduces it.`,`รูปนี้วางอนุประโยคขยายไว้หน้าคำว่า "that" ที่ใช้นำหน้ามัน`]}},{id:`P6-Q32`,p:`ordering`,k:`questions`,items:[`do you think`,`the committee`,`will announce`,`when`],q:`Put the parts in the correct order to make a question.`,c:[`1-4-2-3`,`4-2-3-1`,`4-1-2-3`,`1-2-4-3`],a:2,e:[`With "do you think" inside a question, the question word comes first and everything after it keeps statement order: "When (4) do you think (1) the committee (2) will announce (3) the results?"`,`เมื่อมี "do you think" แทรกอยู่ในคำถาม คำแสดงคำถามจะมาก่อน และส่วนที่เหลือคงลำดับแบบประโยคบอกเล่า จึงได้ "When (4) do you think (1) the committee (2) will announce (3) the results?"`],w:{0:[`Starting with "do you think" loses the question word from the front.`,`การขึ้นต้นด้วย "do you think" ทำให้คำแสดงคำถามหายไปจากต้นประโยค`],1:[`This leaves "do you think" stranded at the end.`,`รูปนี้ทำให้ "do you think" ค้างอยู่ท้ายประโยค`],3:[`"When" cannot sit in the middle of the clause.`,`"when" อยู่กลางอนุประโยคไม่ได้`]}},{id:`P6-Q33`,p:`ordering`,k:`text-cohesion`,items:[`Certainly. What time would suit you?`,`Good morning. I’d like to book a table for Friday evening.`,`Seven would be ideal, if you have anything then.`,`I’m afraid seven is full, but I could offer you eight.`],q:`Put the lines in the correct order to make a conversation.`,c:[`2-3-1-4`,`1-2-3-4`,`2-1-4-3`,`2-1-3-4`],a:3,e:[`The request opens the exchange (2), the restaurant asks for a time (1), the caller names one (3), and only then can the restaurant say it is full (4).`,`คำขอเปิดบทสนทนา (2) ร้านถามเวลา (1) ผู้โทรบอกเวลา (3) แล้วร้านจึงบอกได้ว่าเวลานั้นเต็ม (4)`],w:{0:[`"Seven would be ideal" answers a question that has not been asked yet.`,`"Seven would be ideal" ตอบคำถามที่ยังไม่ได้ถูกถาม`],1:[`"Certainly" cannot open a conversation before any request is made.`,`"Certainly" เปิดบทสนทนาก่อนที่จะมีคำขอไม่ได้`],2:[`The restaurant cannot say seven is full before seven is mentioned.`,`ร้านจะบอกว่าเวลาเจ็ดโมงเต็มก่อนที่จะมีการเอ่ยถึงเวลานั้นไม่ได้`]}},{id:`P6-Q34`,p:`ordering`,k:`linking-words`,items:[`Nevertheless, the results were published in full.`,`The first trial produced figures that nobody had expected.`,`Two of the three researchers wanted to repeat it before saying anything.`,`They feared that a single odd result would be quoted out of context.`],q:`Put the sentences in the correct order to make a paragraph.`,c:[`3-4-2-1`,`2-3-4-1`,`2-4-3-1`,`3-2-4-1`],a:1,e:[`The event comes first (2), then the reaction to it (3), then the reason for that reaction (4). "Nevertheless" must come last, because it contradicts everything before it.`,`เหตุการณ์มาก่อน (2) ตามด้วยปฏิกิริยาต่อเหตุการณ์นั้น (3) แล้วจึงเป็นเหตุผลของปฏิกิริยา (4) ส่วน "Nevertheless" ต้องอยู่ท้ายสุดเพราะขัดแย้งกับทุกอย่างที่มาก่อน`],w:{0:[`"Repeat it" needs the trial to be mentioned first.`,`"repeat it" ต้องมีการกล่าวถึงการทดลองมาก่อน`],2:[`"They feared" explains the wish to repeat, so it cannot come before it.`,`"They feared" อธิบายความต้องการทำซ้ำ จึงมาก่อนไม่ได้`],3:[`This also starts before the trial has been introduced.`,`รูปนี้ก็เริ่มก่อนที่จะมีการแนะนำการทดลอง`]}},{id:`P6-Q35`,p:`cloze`,k:`relative-clauses`,blank:1,q:`Choose the best answer for blank 1.`,c:[`who`,`that`,`which`,`what`],a:2,e:[`The clause adds information about the word "intoxicado" after a comma, so it is non-defining and refers to a thing. That requires "which".`,`อนุประโยคนี้เพิ่มข้อมูลเกี่ยวกับคำว่า "intoxicado" หลังเครื่องหมายจุลภาค จึงเป็นอนุประโยคขยายที่อ้างถึงสิ่งของ และต้องใช้ "which"`],w:{0:[`"Who" refers to people, but the subject here is a word.`,`"who" ใช้กับบุคคล แต่สิ่งที่กล่าวถึงในที่นี้คือคำคำหนึ่ง`],1:[`"That" cannot be used after a comma in a non-defining clause.`,`"that" ใช้หลังจุลภาคในอนุประโยคขยายไม่ได้`],3:[`"What" cannot follow a noun it refers back to.`,`"what" ตามหลังคำนามที่มันอ้างถึงไม่ได้`]}},{id:`P6-Q36`,p:`cloze`,k:`prepositions`,blank:2,q:`Choose the best answer for blank 2.`,c:[`for`,`of`,`with`,`from`],a:0,e:[`The condition a doctor treats takes "for": treated him for an overdose, treated for malaria. "Treat with" introduces the medicine, not the illness.`,`อาการที่แพทย์รักษาใช้บุพบท "for" เช่น treated him for an overdose, treated for malaria ส่วน "treat with" ใช้นำหน้ายาที่ใช้รักษา ไม่ใช่โรค`],w:{1:[`"Treat of" is an old phrase meaning to be about a subject.`,`"treat of" เป็นสำนวนเก่าที่แปลว่าว่าด้วยเรื่องใดเรื่องหนึ่ง`],2:[`"Treat with" would be followed by the medicine used.`,`หลัง "treat with" ต้องเป็นยาที่ใช้รักษา`],3:[`"Treat from" is not used in English.`,`รูป "treat from" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`P6-Q37`,p:`cloze`,k:`passive`,blank:3,q:`Choose the best answer for blank 3.`,c:[`found`,`has been found`,`was finding`,`was found`],a:3,e:[`The mistake did not find anything; it was discovered by somebody, so the verb must be passive, and the whole story is told in the past.`,`ความผิดพลาดไม่ได้เป็นผู้ค้นพบ แต่ถูกใครบางคนค้นพบ กริยาจึงต้องเป็นรูป passive และเรื่องทั้งหมดเล่าในรูปอดีต`],w:{0:[`"Found" alone is active and makes the mistake the finder.`,`"found" ลำพังเป็นรูป active และทำให้ความผิดพลาดกลายเป็นผู้ค้นพบ`],1:[`"Has been found" is present perfect and clashes with the past narrative.`,`"has been found" เป็น present perfect ซึ่งขัดกับการเล่าเรื่องในอดีต`],2:[`"Was finding" is active continuous and does not fit.`,`"was finding" เป็น active continuous จึงไม่เข้ากัน`]}},{id:`P6-Q38`,p:`cloze`,k:`quantifiers`,blank:4,q:`Choose the best answer for blank 4.`,c:[`almost`,`most`,`the most`,`mostly`],a:1,e:[`Before a plural noun with no "of the" after it, the quantifier is simply "most": most large hospitals, most people, most countries.`,`เมื่อวางหน้าคำนามพหูพจน์ที่ไม่มี "of the" ตามมา คำบอกปริมาณคือ "most" เฉย ๆ เช่น most large hospitals, most people, most countries`],w:{0:[`"Almost" modifies a quantifier, as in "almost all hospitals".`,`"almost" ใช้ขยายคำบอกปริมาณ เช่น "almost all hospitals"`],2:[`"The most" is the superlative form and needs something to compare.`,`"the most" เป็นรูปขั้นสุด จึงต้องมีสิ่งที่นำมาเปรียบเทียบ`],3:[`"Mostly" is an adverb meaning "mainly".`,`"mostly" เป็นคำวิเศษณ์ที่แปลว่าโดยส่วนใหญ่แล้ว`]}},{id:`P6-Q39`,p:`cloze`,k:`conjunctions`,blank:5,q:`Choose the best answer for blank 5.`,c:[`because`,`although`,`unless`,`whether`],a:0,e:[`The second half of the sentence explains why translators repeat the story, so the linker must introduce a reason.`,`ครึ่งหลังของประโยคอธิบายว่าทำไมนักแปลจึงเล่าเรื่องนี้ซ้ำ ๆ คำเชื่อมจึงต้องนำหน้าเหตุผล`],w:{1:[`"Although" would set up a contrast that the sentence does not contain.`,`"although" จะสร้างความขัดแย้งซึ่งไม่มีอยู่ในประโยคนี้`],2:[`"Unless" introduces a condition, not a reason.`,`"unless" ใช้นำหน้าเงื่อนไข ไม่ใช่เหตุผล`],3:[`"Whether" introduces an alternative or a doubt.`,`"whether" ใช้นำหน้าทางเลือกหรือความไม่แน่ใจ`]}},{id:`P6-Q40`,p:`cloze`,k:`articles`,blank:6,q:`Choose the best answer for blank 6.`,c:[`a`,`the`,`an`,`some`],a:2,e:[`The noun phrase is singular and countable, and the next word begins with a vowel sound, so the article must be "an ordinary word".`,`วลีนามนี้เป็นเอกพจน์และนับได้ และคำถัดไปขึ้นต้นด้วยเสียงสระ จึงต้องใช้ article เป็น "an ordinary word"`],w:{0:[`"A" is used before a consonant sound, not before "ordinary".`,`"a" ใช้หน้าเสียงพยัญชนะ ไม่ใช้หน้าคำว่า "ordinary"`],1:[`"The" would point to a word already identified.`,`"the" จะชี้ไปยังคำที่ระบุไว้แล้ว`],3:[`"Some" is used with plurals or uncountable nouns.`,`"some" ใช้กับคำนามพหูพจน์หรือคำนามนับไม่ได้`]}},{id:`P6-Q41`,p:`reading`,k:`reading-main-idea`,pid:`P6-R1`,q:`What is the passage mainly about?`,c:[`The history of sailing charts in the sixteenth century`,`Why Greenland is far smaller than most people believe`,`How the Gall–Peters projection came to be promoted`,`Why every flat map of the world must distort something`],a:3,e:[`The first paragraph states the claim and the last repeats it: no flat map can be honest, and each projection trades one kind of accuracy for another.`,`ย่อหน้าแรกระบุข้อสรุปและย่อหน้าสุดท้ายย้ำอีกครั้งว่าไม่มีแผนที่แบนใดซื่อตรงได้ และแต่ละแบบต่างแลกความแม่นยำอย่างหนึ่งกับอีกอย่างหนึ่ง`],w:{0:[`Sailing is mentioned once, to explain what Mercator was designed for.`,`เรื่องการเดินเรือถูกกล่าวถึงครั้งเดียวเพื่ออธิบายว่าแผนที่ Mercator ถูกออกแบบมาเพื่ออะไร`],1:[`Greenland is one example inside the larger argument.`,`กรีนแลนด์เป็นเพียงตัวอย่างหนึ่งภายในข้อโต้แย้งที่ใหญ่กว่า`],2:[`Gall–Peters appears in a single paragraph as the alternative.`,`แผนที่ Gall–Peters ปรากฏในย่อหน้าเดียวในฐานะทางเลือก`]}},{id:`P6-Q42`,p:`reading`,k:`reading-detail`,pid:`P6-R1`,q:`What does the Mercator projection keep accurate?`,c:[`The size of every country on the map`,`The angles, and therefore the courses sailors steer`,`The shapes of the continents near the poles`,`The distance between any two large cities`],a:1,e:[`Paragraph 2 says it "keeps every angle true", so a straight line on the chart is a straight course at sea.`,`ย่อหน้าที่สองระบุว่าแผนที่นี้ "keeps every angle true" ทำให้เส้นตรงบนแผนที่คือเส้นทางตรงในทะเล`],w:{0:[`Sizes are exactly what Mercator sacrifices near the poles.`,`ขนาดคือสิ่งที่แผนที่ Mercator ยอมเสียไปในบริเวณใกล้ขั้วโลก`],2:[`The passage says areas near the poles are stretched.`,`บทอ่านระบุว่าพื้นที่ใกล้ขั้วโลกถูกยืดออก`],3:[`Distance accuracy is never claimed for this projection.`,`บทอ่านไม่ได้อ้างว่าแผนที่แบบนี้ให้ระยะทางที่แม่นยำ`]}},{id:`P6-Q43`,p:`reading`,k:`reading-reference`,pid:`P6-R1`,q:`In paragraph 2, what does "this" refer to in "To do this it stretches the areas near the poles"?`,c:[`Being drawn in the year 1569`,`Stretching the areas near the poles`,`Keeping every angle on the map true`,`Placing the equator across the middle`],a:2,e:[`"This" points back to the purpose just described — keeping every angle true — and the stretching is the price paid for it.`,`คำว่า "this" ย้อนไปยังจุดประสงค์ที่เพิ่งกล่าวถึงคือการรักษามุมให้ถูกต้องทุกมุม ส่วนการยืดพื้นที่คือราคาที่ต้องจ่ายเพื่อสิ่งนั้น`],w:{0:[`The date is background information, not the purpose being served.`,`ปีที่วาดเป็นข้อมูลประกอบ ไม่ใช่จุดประสงค์ที่กำลังกล่าวถึง`],1:[`The stretching is the result of "this", so it cannot also be "this".`,`การยืดพื้นที่เป็นผลของ "this" จึงเป็น "this" เองไม่ได้`],3:[`The equator is mentioned only as a line to measure distance from.`,`เส้นศูนย์สูตรถูกกล่าวถึงเพียงในฐานะเส้นที่ใช้วัดระยะห่างเท่านั้น`]}},{id:`P6-Q44`,p:`reading`,k:`reading-vocab`,pid:`P6-R1`,q:`In paragraph 4, "distort" most nearly means ____.`,c:[`change from the true form`,`make very much larger`,`draw slowly and carefully`,`remove from the map`],a:0,e:[`The sentence contrasts correcting the areas with distorting the shapes, and the next line describes continents that look stretched. "Distort" means to pull out of true shape.`,`ประโยคนี้เปรียบเทียบการแก้ไขพื้นที่กับการบิดเบือนรูปร่าง และประโยคถัดมาบรรยายทวีปที่ดูถูกยืดออก คำว่า "distort" จึงแปลว่าทำให้ผิดไปจากรูปร่างจริง`],w:{1:[`Enlarging is only one way of distorting, and here shapes are stretched downwards.`,`การขยายเป็นเพียงวิธีหนึ่งของการบิดเบือน และในที่นี้รูปร่างถูกยืดลงด้านล่าง`],2:[`The word describes the result, not the care taken in drawing.`,`คำนี้บรรยายผลลัพธ์ ไม่ใช่ความประณีตในการวาด`],3:[`Nothing is removed; the continents are all still shown.`,`ไม่มีสิ่งใดถูกลบออก ทวีปทั้งหมดยังปรากฏอยู่`]}},{id:`P6-Q45`,p:`reading`,k:`reading-purpose`,pid:`P6-R1`,q:`Why does the writer mention the map on the classroom wall at the end?`,c:[`To argue that every school in the country ought to replace its wall maps immediately`,`To show that people accept a familiar map without asking what it was made for`,`To explain how young children learn the names of the world’s countries`,`To prove that the Mercator projection should never have been drawn at all`],a:1,e:[`The final sentence says the useful question is what each map was made for, "and that is a question almost nobody thinks to ask" of the classroom map. The example illustrates unquestioning acceptance.`,`ประโยคสุดท้ายระบุว่าคำถามที่มีประโยชน์คือแผนที่แต่ละแบบถูกทำขึ้นเพื่ออะไร "and that is a question almost nobody thinks to ask" ตัวอย่างนี้จึงแสดงถึงการยอมรับโดยไม่ตั้งคำถาม`],w:{0:[`The writer never recommends replacing any map.`,`ผู้เขียนไม่ได้เสนอให้เปลี่ยนแผนที่ใดเลย`],2:[`How children learn country names is not discussed.`,`บทอ่านไม่ได้กล่าวถึงวิธีที่เด็กเรียนรู้ชื่อประเทศ`],3:[`The passage explains what Mercator was useful for, rather than condemning it.`,`บทอ่านอธิบายว่าแผนที่ Mercator มีประโยชน์อย่างไร ไม่ได้ประณามแผนที่นั้น`]}},{id:`P6-Q46`,p:`reading`,k:`reading-detail`,pid:`P6-R2`,q:`How many pedestrian collisions happened on Station Road in the two years after the zone began?`,c:[`Forty-one`,`Six`,`Three hundred`,`Four`],a:3,e:[`Paragraph 2 gives forty-one collisions in the three years before, and four in the two years since.`,`ย่อหน้าที่สองระบุว่ามีอุบัติเหตุ 41 ครั้งในสามปีก่อนหน้า และ 4 ครั้งในสองปีนับจากนั้น`],w:{0:[`Forty-one is the figure from before the zone was introduced.`,`สี่สิบเอ็ดคือตัวเลขก่อนที่จะมีเขตจำกัดความเร็ว`],1:[`Six is the number of drivers the reporter interviewed.`,`หกคือจำนวนผู้ขับขี่ที่นักข่าวสัมภาษณ์`],2:[`Three hundred is the number of schoolchildren on the road at four o’clock.`,`สามร้อยคือจำนวนนักเรียนที่อยู่บนถนนตอนสี่โมงเย็น`]}},{id:`P6-Q47`,p:`reading`,k:`reading-detail`,pid:`P6-R2`,q:`What does the writer say about the reporter’s research?`,c:[`He spoke to six drivers and to nobody else.`,`He measured the journey time incorrectly.`,`He interviewed three hundred children at four o’clock.`,`He refused to walk the length of Station Road.`],a:0,e:[`Paragraph 3 opens, "Your reporter interviewed six drivers and nobody else," and goes on to say the children were never asked.`,`ย่อหน้าที่สามขึ้นต้นว่า "Your reporter interviewed six
