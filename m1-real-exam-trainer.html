Kim: ____`,q:`Choose the best reply for Kim.`,c:[`Yes, I finished it last night.`,`I am fine, thank you.`,`Good morning to you too.`,`Yes, I am a student here.`],a:0,e:[`The teacher asks a yes/no question about the reading, so the reply must answer that question — and adding when she finished it sounds natural.`,`ครูถามคำถาม yes/no เกี่ยวกับการอ่าน คำตอบจึงต้องตอบคำถามนั้น และการบอกเพิ่มว่าอ่านเสร็จเมื่อใดทำให้ฟังเป็นธรรมชาติ`],w:{1:[`This answers "How are you?", which was not the question asked.`,`ประโยคนี้ตอบคำถาม "How are you?" ซึ่งไม่ใช่สิ่งที่ถูกถาม`],2:[`The greeting has already been exchanged; the question still needs an answer.`,`ทักทายกันไปแล้ว คำถามยังคงต้องการคำตอบ`],3:[`Saying she is a student does not answer a question about the reading.`,`การบอกว่าตนเป็นนักเรียนไม่ได้ตอบคำถามเรื่องการอ่าน`]}},{id:`P1-Q07`,p:`conversation`,k:`situational-language`,intro:`Student: Excuse me, sir. ____
Teacher: Yes, but please be quick.`,q:`Choose the best line for the student.`,c:[`Where is the library, sir?`,`I am going to the library now.`,`The library is open at the moment.`,`May I go to the library for a moment?`],a:3,e:[`The teacher answers "Yes, but please be quick," which is how you reply to a request for permission. "May I…?" is the polite way to ask.`,`ครูตอบว่า "Yes, but please be quick." ซึ่งเป็นคำตอบของการขออนุญาต ประโยค "May I…?" จึงเป็นการขออนุญาตอย่างสุภาพ`],w:{0:[`A question about place would be answered with directions, not with "Yes".`,`คำถามเรื่องสถานที่ต้องตอบด้วยการบอกทาง ไม่ใช่ตอบว่า "Yes"`],1:[`This announces a decision instead of asking, and it sounds rude to a teacher.`,`ประโยคนี้เป็นการประกาศว่าจะไป ไม่ได้ขออนุญาต และฟังดูไม่สุภาพต่อครู`],2:[`This states a fact about the library and asks for nothing.`,`ประโยคนี้บอกข้อเท็จจริงเรื่องห้องสมุด และไม่ได้ร้องขอสิ่งใด`]}},{id:`P1-Q08`,p:`conversation`,k:`conversation`,intro:`Customer: How much is this notebook?
Shopkeeper: ____`,q:`Choose the best reply for the shopkeeper.`,c:[`It is a very nice notebook.`,`Twenty-five baht.`,`Yes, we have notebooks here.`,`I bought it yesterday morning.`],a:1,e:[`"How much…?" asks for a price, so the answer must be an amount of money.`,`คำถาม "How much…?" ถามราคา คำตอบจึงต้องเป็นจำนวนเงิน`],w:{0:[`This gives an opinion about the notebook, not its price.`,`ประโยคนี้แสดงความเห็นเรื่องสมุด ไม่ได้บอกราคา`],2:[`"Yes" cannot answer a question beginning with "How much".`,`คำว่า "Yes" ใช้ตอบคำถามที่ขึ้นต้นด้วย "How much" ไม่ได้`],3:[`The shopkeeper sells the notebook; this sounds like a customer speaking.`,`เจ้าของร้านเป็นผู้ขายสมุด ประโยคนี้ฟังเหมือนคำพูดของลูกค้า`]}},{id:`P1-Q09`,p:`conversation`,k:`situational-language`,intro:`Mali: You look tired. ____
Orn: Thanks, that would be great.`,q:`Choose the best line for Mali.`,c:[`Do you carry my bag?`,`You should carry my bag.`,`Shall I carry your bag?`,`Have you carried your bag?`],a:2,e:[`Orn thanks Mali, so Mali must have offered to help. "Shall I…?" is the standard way to offer to do something for someone.`,`อรกล่าวขอบคุณมะลิ แสดงว่ามะลิได้เสนอความช่วยเหลือ ประโยค "Shall I…?" เป็นรูปมาตรฐานของการเสนอตัวช่วยทำสิ่งใดให้ผู้อื่น`],w:{0:[`This asks about a habit and offers nothing, so "Thanks" would not fit.`,`ประโยคนี้ถามถึงสิ่งที่ทำเป็นประจำและไม่ได้เสนอความช่วยเหลือ คำว่า "Thanks" จึงไม่เข้ากัน`],1:[`This tells Orn to carry Mali's bag, which is the opposite of an offer.`,`ประโยคนี้สั่งให้อรถือกระเป๋าของมะลิ ซึ่งตรงข้ามกับการเสนอความช่วยเหลือ`],3:[`This asks about the past and would not be answered with "that would be great".`,`ประโยคนี้ถามถึงอดีต จึงไม่ได้รับคำตอบว่า "that would be great"`]}},{id:`P1-Q10`,p:`conversation`,k:`conversation`,intro:`Nat: I’m sorry I’m late. The bus broke down.
Teacher: ____`,q:`Choose the best reply for the teacher.`,c:[`That’s all right. Please sit down.`,`Yes, you are late again.`,`You’re welcome, Nat.`,`Thank you for being late.`],a:0,e:[`Nat apologises and gives a reason that was not his fault. Accepting the apology and moving the lesson on is the natural reply.`,`ณัฐกล่าวขอโทษพร้อมให้เหตุผลที่ไม่ใช่ความผิดของตน คำตอบที่เป็นธรรมชาติคือรับคำขอโทษแล้วให้เข้าเรียนต่อ`],w:{1:[`Repeating that he is late adds nothing and ignores the apology.`,`การย้ำว่าเขามาสายไม่ได้ช่วยอะไรและเป็นการมองข้ามคำขอโทษ`],2:[`"You're welcome" is the reply to "Thank you", not to "I'm sorry".`,`"You're welcome" ใช้ตอบคำว่า "Thank you" ไม่ได้ใช้ตอบคำขอโทษ`],3:[`Thanking somebody for being late makes no sense.`,`การขอบคุณที่มาสายไม่สมเหตุสมผล`]}},{id:`P1-Q11`,p:`conversation`,k:`situational-language`,intro:`Caller: Hello, is that Ben?
Ben’s sister: ____`,q:`Choose the best reply for Ben’s sister.`,c:[`Yes, I am his sister Ben.`,`No, it isn’t. I’ll get him for you.`,`Hello, who are you?`,`Yes, please speak now.`],a:1,e:[`On the telephone, when the caller asks for somebody else, you say who you are not and offer to fetch the person they want.`,`ในการสนทนาทางโทรศัพท์ เมื่อผู้โทรขอพูดกับคนอื่น เราจะบอกว่าไม่ใช่คนนั้นแล้วเสนอไปตามคนที่เขาต้องการ`],w:{0:[`She cannot be Ben and Ben's sister at the same time.`,`เธอเป็นทั้งเบนและน้องสาวของเบนพร้อมกันไม่ได้`],2:[`"Who are you?" sounds rude on the telephone. English uses "Who's calling, please?"`,`"Who are you?" ฟังดูไม่สุภาพทางโทรศัพท์ ภาษาอังกฤษใช้ว่า "Who's calling, please?"`],3:[`This does not say whether the caller has reached Ben.`,`ประโยคนี้ไม่ได้บอกว่าผู้โทรได้คุยกับเบนหรือไม่`]}},{id:`P1-Q12`,p:`grammar`,k:`tenses`,q:`My father ____ to work by motorcycle every day.`,c:[`go`,`going`,`is go`,`goes`],a:3,e:[`"Every day" shows a daily routine, so the present simple is correct. With the singular subject "my father" the verb adds -s: goes.`,`วลี "every day" แสดงกิจวัตรประจำวัน จึงใช้ present simple และเมื่อประธานเป็นเอกพจน์ "my father" กริยาต้องเติม -s เป็น goes`],w:{0:[`"Go" is used with I, you, we and they, not with "my father".`,`ใช้ "go" กับ I, you, we, they ไม่ใช้กับ "my father"`],1:[`"Going" cannot be the main verb on its own; it needs a form of be.`,`"going" เป็นกริยาหลักตามลำพังไม่ได้ ต้องมี verb to be นำหน้า`],2:[`After "is" we use the -ing form. "Is go" is never correct.`,`หลัง "is" ต้องใช้รูป -ing รูป "is go" ไม่ถูกต้อง`]}},{id:`P1-Q13`,p:`grammar`,k:`tenses`,q:`We ____ to the temple with our grandmother last Sunday.`,c:[`go`,`are going`,`went`,`have gone`],a:2,e:[`"Last Sunday" is a finished time in the past, so the past simple is needed. The past simple of "go" is "went".`,`"last Sunday" เป็นเวลาที่จบไปแล้วในอดีต จึงต้องใช้ past simple และรูปอดีตของ "go" คือ "went"`],w:{0:[`"Go" is the present form and does not match a past time expression.`,`"go" เป็นรูปปัจจุบัน ไม่สอดคล้องกับคำบอกเวลาในอดีต`],1:[`"Are going" describes now or a future plan, not last Sunday.`,`"are going" บรรยายสิ่งที่เกิดขึ้นตอนนี้หรือแผนในอนาคต ไม่ใช่วันอาทิตย์ที่ผ่านมา`],3:[`The present perfect is never used with a finished time such as "last Sunday".`,`ไม่ใช้ present perfect กับคำบอกเวลาที่จบแล้ว เช่น "last Sunday"`]}},{id:`P1-Q14`,p:`grammar`,k:`agreement`,q:`There ____ a lot of students in the hall this morning.`,c:[`are`,`is`,`was`,`be`],a:0,e:[`In a "There + be" sentence the verb agrees with the noun that follows. "A lot of students" is plural and the time is this morning, so we use "are".`,`ในโครงสร้าง "There + verb to be" กริยาต้องสอดคล้องกับคำนามที่ตามมา เมื่อ "a lot of students" เป็นพหูพจน์และเป็นเช้าวันนี้ จึงใช้ "are"`],w:{1:[`"Is" is singular and cannot be used with a plural noun.`,`"is" ใช้กับเอกพจน์ จึงใช้กับคำนามพหูพจน์ไม่ได้`],2:[`"Was" is both singular and past.`,`"was" เป็นทั้งเอกพจน์และรูปอดีต`],3:[`"Be" is the base form; a main clause needs a finite verb such as "are".`,`"be" เป็นรูปพื้นฐาน ประโยคหลักต้องใช้กริยาที่ผันแล้ว เช่น "are"`]}},{id:`P1-Q15`,p:`grammar`,k:`articles`,q:`Anna is ____ honest girl. Everyone in the class trusts her.`,c:[`a`,`an`,`the`,`some`],a:1,e:[`The "h" in "honest" is silent, so the word begins with a vowel sound and takes "an". It is the sound that decides, not the letter.`,`ตัว h ในคำว่า honest ไม่ออกเสียง คำจึงขึ้นต้นด้วยเสียงสระและต้องใช้ "an" โดยยึดเสียงเป็นเกณฑ์ ไม่ใช่ตัวอักษร`],w:{0:[`"A" is used before a consonant sound, but "honest" starts with a vowel sound.`,`"a" ใช้หน้าเสียงพยัญชนะ แต่ "honest" ขึ้นต้นด้วยเสียงสระ`],2:[`"The" points to one particular girl both speakers already know about.`,`"the" ใช้ชี้เฉพาะเด็กหญิงที่ผู้พูดทั้งสองรู้จักอยู่แล้ว`],3:[`"Some" is used with plural or uncountable nouns, not with one girl.`,`"some" ใช้กับคำนามพหูพจน์หรือนับไม่ได้ ไม่ใช้กับเด็กหญิงคนเดียว`]}},{id:`P1-Q16`,p:`grammar`,k:`prepositions`,q:`The examination starts ____ half past eight, so please arrive early.`,c:[`in`,`on`,`for`,`at`],a:3,e:[`We use "at" with clock times: at half past eight, at seven o’clock, at noon.`,`ใช้ "at" กับเวลาที่บอกเป็นนาฬิกา เช่น at half past eight, at seven o’clock, at noon`],w:{0:[`"In" is used with months, years and parts of the day, such as "in the morning".`,`"in" ใช้กับเดือน ปี และช่วงของวัน เช่น "in the morning"`],1:[`"On" is used with days and dates, such as "on Monday".`,`"on" ใช้กับวันและวันที่ เช่น "on Monday"`],2:[`"For" shows how long something lasts, not when it begins.`,`"for" บอกระยะเวลาที่นานเท่าใด ไม่ได้บอกเวลาที่เริ่ม`]}},{id:`P1-Q17`,p:`grammar`,k:`comparisons`,q:`Your school bag is ____ than mine. What have you got inside it?`,c:[`heavier`,`heavy`,`heaviest`,`more heavy`],a:0,e:[`"Than" signals a comparison between two things. Short adjectives ending in -y change the y to i and add -er: heavy → heavier.`,`คำว่า "than" เป็นสัญญาณของการเปรียบเทียบสองสิ่ง คำคุณศัพท์พยางค์สั้นที่ลงท้ายด้วย -y ต้องเปลี่ยน y เป็น i แล้วเติม -er เช่น heavy → heavier`],w:{1:[`The plain adjective cannot be used with "than".`,`คำคุณศัพท์รูปปกติใช้คู่กับ "than" ไม่ได้`],2:[`"Heaviest" is the superlative, used for three or more things and with "the".`,`"heaviest" เป็นขั้นสุด ใช้เมื่อเปรียบเทียบตั้งแต่สามสิ่งขึ้นไปและใช้กับ "the"`],3:[`Short adjectives take -er, not "more".`,`คำคุณศัพท์พยางค์สั้นเติม -er ไม่ใช้ "more"`]}},{id:`P1-Q18`,p:`grammar`,k:`modals`,q:`You ____ run beside the swimming pool. The floor is wet and dangerous.`,c:[`need not`,`would not`,`must not`,`could not`],a:2,e:[`The second sentence explains a danger, so this is a rule that forbids the action. "Must not" is the modal used for a prohibition.`,`ประโยคที่สองอธิบายอันตราย แสดงว่านี่คือกฎที่ห้ามกระทำ กริยาช่วยที่ใช้บอกข้อห้ามคือ "must not"`],w:{0:[`"Need not" means it is not necessary, so running would still be allowed.`,`"need not" แปลว่าไม่จำเป็นต้องทำ ซึ่งยังหมายความว่าวิ่งได้`],1:[`"Would not" describes unwillingness or an imagined situation, not a rule.`,`"would not" แสดงความไม่เต็มใจหรือสถานการณ์สมมติ ไม่ใช่กฎ`],3:[`"Could not" describes a lack of ability rather than a prohibition.`,`"could not" บอกการขาดความสามารถ ไม่ใช่ข้อห้าม`]}},{id:`P1-Q19`,p:`grammar`,k:`verb-patterns`,q:`My little sister enjoys ____ comic books before she goes to sleep.`,c:[`to read`,`reading`,`read`,`reads`],a:1,e:[`Some verbs are always followed by the -ing form, and "enjoy" is one of them: enjoy reading, enjoy swimming.`,`กริยาบางคำต้องตามด้วยรูป -ing เสมอ และ "enjoy" เป็นหนึ่งในนั้น เช่น enjoy reading, enjoy swimming`],w:{0:[`"Enjoy" is never followed by "to + verb".`,`หลัง "enjoy" ไม่ใช้ "to + กริยา"`],2:[`The base form cannot follow "enjoy" directly.`,`กริยารูปพื้นฐานตามหลัง "enjoy" โดยตรงไม่ได้`],3:[`"Reads" is a finite verb; two finite verbs cannot sit side by side like this.`,`"reads" เป็นกริยาที่ผันแล้ว กริยาที่ผันแล้วสองตัวจะวางติดกันแบบนี้ไม่ได้`]}},{id:`P1-Q20`,p:`error`,k:`agreement`,sent:`My brother «and» I «goes» to school «together» «every» morning.`,q:`Which underlined part is incorrect?`,c:[`and`,`goes`,`together`,`every`],a:1,e:[`"My brother and I" is a plural subject (= we), so the verb must not take -s. The correct form is "go".`,`"My brother and I" เป็นประธานพหูพจน์ (เท่ากับ we) กริยาจึงต้องไม่เติม -s รูปที่ถูกต้องคือ "go"`],w:{0:[`"And" correctly joins the two people who make up the subject.`,`"and" ใช้เชื่อมบุคคลสองคนที่รวมกันเป็นประธานได้ถูกต้องแล้ว`],2:[`"Together" is a correct adverb here and needs no change.`,`"together" เป็นคำวิเศษณ์ที่ใช้ถูกต้องในที่นี้ ไม่ต้องแก้ไข`],3:[`"Every morning" is a correct time phrase for a daily routine.`,`"every morning" เป็นวลีบอกเวลาที่ถูกต้องสำหรับกิจวัตรประจำวัน`]}},{id:`P1-Q21`,p:`error`,k:`nouns`,sent:`My mother bought «three loaf» of bread «and» «some» eggs at the market «yesterday».`,q:`Which underlined part is incorrect?`,c:[`three loaf`,`and`,`some`,`yesterday`],a:0,e:[`After the number three the unit word must be plural: three loaves of bread. "Loaf" changes its f to v before -es.`,`หลังเลขสามคำบอกหน่วยต้องเป็นพหูพจน์ คือ three loaves of bread โดยคำว่า loaf ต้องเปลี่ยน f เป็น v แล้วเติม -es`],w:{1:[`"And" correctly joins the two things she bought.`,`"and" ใช้เชื่อมสิ่งของสองอย่างที่เธอซื้อได้ถูกต้องแล้ว`],2:[`"Some eggs" is correct — "some" is used with countable plurals.`,`"some eggs" ถูกต้องแล้ว เพราะ "some" ใช้กับคำนามพหูพจน์นับได้`],3:[`"Yesterday" correctly matches the past verb "bought".`,`"yesterday" สอดคล้องกับกริยาอดีต "bought" อย่างถูกต้อง`]}},{id:`P1-Q22`,p:`error`,k:`prepositions`,sent:`We usually «go» «to» the beach «in» Saturday «morning» with our cousins.`,q:`Which underlined part is incorrect?`,c:[`go`,`to`,`in`,`morning`],a:2,e:[`When a part of the day is joined to a named day, English uses "on": on Saturday morning. "In" is only used with a part of the day on its own, as in "in the morning".`,`เมื่อช่วงเวลาของวันถูกระบุคู่กับชื่อวัน ภาษาอังกฤษใช้ "on" เช่น on Saturday morning ส่วน "in" ใช้กับช่วงของวันที่อยู่ลำพัง เช่น in the morning`],w:{0:[`"Go" is correct with the plural subject "we" in the present simple.`,`"go" ถูกต้องแล้วกับประธานพหูพจน์ "we" ใน present simple`],1:[`"Go to the beach" is the correct pattern.`,`โครงสร้าง "go to the beach" ถูกต้องแล้ว`],3:[`"Morning" is the correct noun here; only the preposition is wrong.`,`"morning" เป็นคำนามที่ถูกต้องในที่นี้ ส่วนที่ผิดคือคำบุพบทเท่านั้น`]}},{id:`P1-Q23`,p:`error`,k:`articles`,sent:`Ploy is «the» tallest girl «in» «our» class, and she plays «a» basketball very well.`,q:`Which underlined part is incorrect?`,c:[`the`,`in`,`our`,`a`],a:3,e:[`Sports take no article after "play": play basketball, play football. (Musical instruments are the opposite — they take "the".)`,`ชื่อกีฬาไม่ต้องมี article หลังคำว่า play เช่น play basketball, play football (ส่วนเครื่องดนตรีตรงกันข้าม คือต้องมี "the")`],w:{0:[`A superlative needs "the", so "the tallest" is correct.`,`คำคุณศัพท์ขั้นสุดต้องมี "the" ดังนั้น "the tallest" จึงถูกต้อง`],1:[`"In our class" is the correct phrase for the group being compared.`,`"in our class" เป็นวลีที่ถูกต้องสำหรับกลุ่มที่นำมาเปรียบเทียบ`],2:[`"Our" correctly shows whose class it is.`,`"our" แสดงความเป็นเจ้าของห้องเรียนได้ถูกต้อง`]}},{id:`P1-Q24`,p:`error`,k:`tenses`,sent:`Yesterday my father «took» us to the zoo, and we «see» many «different» animals «there».`,q:`Which underlined part is incorrect?`,c:[`took`,`see`,`different`,`there`],a:1,e:[`Both halves of the sentence describe yesterday, so both verbs must be past simple. "See" should be "saw".`,`ทั้งสองส่วนของประโยคพูดถึงเมื่อวาน กริยาทั้งสองตัวจึงต้องเป็น past simple คำว่า "see" ต้องเปลี่ยนเป็น "saw"`],w:{0:[`"Took" is the correct past simple of "take".`,`"took" เป็นรูป past simple ที่ถูกต้องของ "take"`],2:[`"Different" is a correct adjective before the plural noun "animals".`,`"different" เป็นคำคุณศัพท์ที่ถูกต้องเมื่อวางหน้าคำนามพหูพจน์ "animals"`],3:[`"There" correctly refers back to the zoo.`,`"there" อ้างถึงสวนสัตว์ได้ถูกต้อง`]}},{id:`P1-Q25`,p:`error`,k:`comparisons`,sent:`My new phone is «much» «better» «that» the old «one», but it was more expensive.`,q:`Which underlined part is incorrect?`,c:[`much`,`better`,`that`,`one`],a:2,e:[`A comparative is followed by "than", not "that". The sentence should read "much better than the old one".`,`คำคุณศัพท์ขั้นกว่าต้องตามด้วย "than" ไม่ใช่ "that" ประโยคที่ถูกต้องคือ "much better than the old one"`],w:{0:[`"Much" correctly strengthens a comparative: much better, much faster.`,`"much" ใช้เน้นคำขั้นกว่าได้ถูกต้อง เช่น much better, much faster`],1:[`"Better" is the correct comparative of "good".`,`"better" เป็นรูปขั้นกว่าที่ถูกต้องของ "good"`],3:[`"One" correctly stands for "phone" so the word is not repeated.`,`"one" ใช้แทนคำว่า phone ได้ถูกต้องเพื่อไม่ต้องพูดซ้ำ`]}},{id:`P1-Q26`,p:`vocabulary`,k:`vocab-context`,q:`The weather was so bad that the football match was ____ until next Saturday.`,c:[`finished`,`watched`,`started`,`postponed`],a:3,e:[`The match will now happen later than planned. "Postpone" means to move an event to a later time.`,`การแข่งขันจะเกิดขึ้นช้ากว่ากำหนดเดิม คำว่า "postpone" แปลว่าเลื่อนกิจกรรมออกไปเป็นเวลาภายหลัง`],w:{0:[`"Finished" means it was completed, but the match has not been played.`,`"finished" แปลว่าจบลงแล้ว แต่การแข่งขันนี้ยังไม่ได้เล่นเลย`],1:[`"Watched" needs people as the subject, not the match itself.`,`"watched" ต้องมีคนเป็นประธาน ไม่ใช่ตัวการแข่งขัน`],2:[`"Started until next Saturday" is not possible in English.`,`รูป "started until next Saturday" ใช้ไม่ได้ในภาษาอังกฤษ`]}},{id:`P1-Q27`,p:`vocabulary`,k:`synonyms-antonyms`,q:`The film was boring, but the book was very ____.`,c:[`long`,`easy`,`interesting`,`famous`],a:2,e:[`"But" signals a contrast with "boring", so the missing word must mean the opposite. The opposite of boring is "interesting".`,`คำว่า "but" แสดงความขัดแย้งกับคำว่า "boring" คำที่หายไปจึงต้องมีความหมายตรงข้าม ซึ่งคือ "interesting"`],w:{0:[`"Long" describes length, and a long book can still be boring.`,`"long" บอกความยาว หนังสือที่ยาวก็ยังน่าเบื่อได้`],1:[`"Easy" is the opposite of difficult, not of boring.`,`"easy" เป็นคำตรงข้ามกับยาก ไม่ใช่ตรงข้ามกับน่าเบื่อ`],3:[`"Famous" means well known; a famous book can still be boring.`,`"famous" แปลว่ามีชื่อเสียง หนังสือที่ดังก็ยังน่าเบื่อได้`]}},{id:`P1-Q28`,p:`vocabulary`,k:`collocations`,q:`Remember to ____ your homework before you watch television.`,c:[`do`,`make`,`take`,`give`],a:0,e:[`English pairs "do" with homework, housework and the washing-up. "Do your homework" is the fixed expression.`,`ภาษาอังกฤษใช้ "do" คู่กับ homework, housework และ washing-up สำนวนที่ใช้จริงคือ "do your homework"`],w:{1:[`"Make" is for things you create, such as "make a cake".`,`"make" ใช้กับสิ่งที่สร้างขึ้น เช่น "make a cake"`],2:[`"Take" pairs with tests and photos: "take a test", "take a photo".`,`"take" ใช้คู่กับข้อสอบและรูปถ่าย เช่น "take a test", "take a photo"`],3:[`"Give" needs a receiver, as in "give the teacher your homework".`,`"give" ต้องมีผู้รับ เช่น "give the teacher your homework"`]}},{id:`P1-Q29`,p:`vocabulary`,k:`phrasal-verbs`,q:`It is cold outside this morning. Please ____ your jacket before you leave.`,c:[`take off`,`put on`,`look after`,`turn off`],a:1,e:[`Cold weather means you need more clothing, and the phrasal verb for starting to wear something is "put on".`,`อากาศหนาวหมายความว่าต้องใส่เสื้อผ้าเพิ่ม กริยาวลีที่ใช้กับการเริ่มสวมใส่คือ "put on"`],w:{0:[`"Take off" means to remove clothing — the opposite of what is needed.`,`"take off" แปลว่าถอดเสื้อผ้า ซึ่งตรงข้ามกับสิ่งที่ควรทำ`],2:[`"Look after" means to take care of someone or something.`,`"look after" แปลว่าดูแลคนหรือสิ่งของ`],3:[`"Turn off" is used for machines and lights, not clothes.`,`"turn off" ใช้กับเครื่องใช้ไฟฟ้าและไฟ ไม่ใช้กับเสื้อผ้า`]}},{id:`P1-Q30`,p:`vocabulary`,k:`vocab-context`,q:`Nok could not answer the last question because it was too ____ for her.`,c:[`easy`,`short`,`quiet`,`difficult`],a:3,e:[`She could not answer it, so the question must have been beyond her. "Difficult" means hard to do or understand.`,`เธอตอบไม่ได้ แสดงว่าคำถามนั้นเกินความสามารถของเธอ คำว่า "difficult" แปลว่ายากเกินกว่าจะทำหรือเข้าใจได้`],w:{0:[`If it were easy she would have answered it.`,`ถ้าคำถามง่าย เธอก็คงตอบได้`],1:[`"Short" describes length; a short question can still be easy.`,`"short" บอกความสั้น คำถามที่สั้นก็อาจง่ายได้`],2:[`"Quiet" describes sound and cannot describe a written question.`,`"quiet" บอกเรื่องเสียง จึงใช้บรรยายคำถามที่เขียนไว้ไม่ได้`]}},{id:`P1-Q31`,p:`ordering`,k:`word-order`,items:[`every Saturday morning`,`my brother`,`plays football`,`with his friends`],q:`Put the parts in the correct order to make a sentence.`,c:[`2-3-4-1`,`1-2-3-4`,`2-4-3-1`,`3-2-1-4`],a:0,e:[`English sentences run subject → verb → object/phrase → time. "My brother (2) plays football (3) with his friends (4) every Saturday morning (1)."`,`ประโยคภาษาอังกฤษเรียงเป็น ประธาน → กริยา → ส่วนขยาย → เวลา จึงได้ "My brother (2) plays football (3) with his friends (4) every Saturday morning (1)"`],w:{1:[`Starting with the time phrase leaves "my brother plays football" after it in the wrong order.`,`การขึ้นต้นด้วยวลีบอกเวลาทำให้ส่วนที่เหลือเรียงผิดลำดับ`],2:[`"My brother with his friends plays football" puts the extra phrase before the verb.`,`รูป "My brother with his friends plays football" วางส่วนขยายไว้หน้ากริยา ซึ่งผิดตำแหน่ง`],3:[`Starting with "plays football" leaves the sentence without a subject.`,`การขึ้นต้นด้วย "plays football" ทำให้ประโยคไม่มีประธาน`]}},{id:`P1-Q32`,p:`ordering`,k:`questions`,items:[`you`,`when`,`do`,`finish your homework`],q:`Put the parts in the correct order to make a question.`,c:[`1-2-3-4`,`3-1-2-4`,`2-3-1-4`,`2-1-3-4`],a:2,e:[`A wh- question runs question word → auxiliary → subject → main verb: "When (2) do (3) you (1) finish your homework (4)?"`,`คำถาม wh- เรียงเป็น คำถาม → กริยาช่วย → ประธาน → กริยาหลัก จึงได้ "When (2) do (3) you (1) finish your homework (4)?"`],w:{0:[`"You when do…" puts the subject before the question word.`,`รูป "You when do…" วางประธานไว้หน้าคำถาม`],1:[`"Do you when…" separates the question word from the front of the sentence.`,`รูป "Do you when…" ทำให้คำถามไม่ได้อยู่ต้นประโยค`],3:[`"When you do finish…" uses statement order, not question order.`,`รูป "When you do finish…" ใช้ลำดับแบบประโยคบอกเล่า ไม่ใช่ลำดับคำถาม`]}},{id:`P1-Q33`,p:`ordering`,k:`text-cohesion`,items:[`Yes, please. A cheese sandwich.`,`Good morning. Can I help you?`,`Here you are. That will be fifty baht.`,`Good morning.`],q:`Put the lines in the correct order to make a conversation.`,c:[`1-2-3-4`,`4-2-1-3`,`2-4-1-3`,`4-1-2-3`],a:1,e:[`The customer greets first (4), the assistant greets back and offers help (2), the customer orders (1), and the assistant hands the food over and gives the price (3).`,`ลูกค้าทักทายก่อน (4) พนักงานทักทายตอบและเสนอความช่วยเหลือ (2) ลูกค้าสั่งอาหาร (1) แล้วพนักงานยื่นของให้พร้อมบอกราคา (3)`],w:{0:[`"Yes, please" cannot begin a conversation — it answers an offer that has not been made yet.`,`"Yes, please" ขึ้นต้นบทสนทนาไม่ได้ เพราะเป็นการตอบรับข้อเสนอที่ยังไม่เกิดขึ้น`],2:[`The assistant would not offer help before the customer has said anything.`,`พนักงานคงไม่เสนอความช่วยเหลือก่อนที่ลูกค้าจะพูดอะไรเลย`],3:[`Two greetings in a row leaves the order and the payment in the wrong places.`,`การทักทายสองครั้งติดกันทำให้การสั่งอาหารและการจ่ายเงินเรียงผิดที่`]}},{id:`P1-Q34`,p:`ordering`,k:`linking-words`,items:[`First, he washes his face and brushes his teeth.`,`Ton gets up at six o’clock every morning.`,`Finally, he walks to school with his sister.`,`Then he has breakfast with his family.`],q:`Put the sentences in the correct order to make a paragraph.`,c:[`1-2-4-3`,`2-4-1-3`,`1-4-2-3`,`2-1-4-3`],a:3,e:[`The linking words give the order away: the topic sentence comes first (2), then "First" (1), "Then" (4) and "Finally" (3).`,`คำเชื่อมบอกลำดับไว้ชัดเจน ประโยคนำมาก่อน (2) ตามด้วย "First" (1) "Then" (4) และ "Finally" (3)`],w:{0:[`A paragraph cannot open with "First" before we know who the paragraph is about.`,`ย่อหน้าจะขึ้นต้นด้วย "First" ก่อนบอกว่าพูดถึงใครไม่ได้`],1:[`"Then" cannot come before "First".`,`"Then" มาก่อน "First" ไม่ได้`],2:[`This also starts with "First" and puts the topic sentence in the middle.`,`รูปนี้ก็ขึ้นต้นด้วย "First" และวางประโยคนำไว้กลางย่อหน้า`]}},{id:`P1-Q35`,p:`cloze`,k:`prepositions`,blank:1,q:`Choose the best answer for blank 1.`,c:[`on`,`in`,`at`,`from`],a:2,e:[`English uses "at the back of" and "at the front of" for a position within a place: at the back of the school.`,`ภาษาอังกฤษใช้ "at the back of" และ "at the front of" เพื่อบอกตำแหน่งภายในสถานที่ เช่น at the back of the school`],w:{0:[`"On the back of" means on the surface of something, such as on the back of a chair.`,`"on the back of" หมายถึงบนพื้นผิวของสิ่งของ เช่น บนพนักเก้าอี้`],1:[`"In the back of" is used for the inside of a vehicle, as in "in the back of the car".`,`"in the back of" ใช้กับภายในยานพาหนะ เช่น "in the back of the car"`],3:[`"From" shows where something comes from, not where the garden is.`,`"from" บอกจุดเริ่มต้นที่มา ไม่ได้บอกว่าสวนอยู่ตรงไหน`]}},{id:`P1-Q36`,p:`cloze`,k:`tenses`,blank:2,q:`Choose the best answer for blank 2.`,c:[`grow`,`grew`,`grows`,`growing`],a:1,e:[`The whole paragraph is about last year, and the verb before it ("was hard and dry") is past. The past simple of "grow" is "grew".`,`ทั้งย่อหน้าพูดถึงปีที่แล้ว และกริยาก่อนหน้า ("was hard and dry") ก็เป็นรูปอดีต รูป past simple ของ "grow" คือ "grew"`],w:{0:[`"Grow" is the present form and clashes with "was hard and dry".`,`"grow" เป็นรูปปัจจุบัน ขัดกับ "was hard and dry"`],2:[`"Grows" is present simple with a singular subject, but the time is past.`,`"grows" เป็น present simple กับประธานเอกพจน์ แต่เวลาเป็นอดีต`],3:[`"Growing" cannot stand alone as the verb of the clause.`,`"growing" เป็นกริยาของอนุประโยคตามลำพังไม่ได้`]}},{id:`P1-Q37`,p:`cloze`,k:`quantifiers`,blank:3,q:`Choose the best answer for blank 3.`,c:[`much`,`a little`,`little`,`some`],a:3,e:[`"Herbs" is a countable plural noun in a positive sentence, so "some" is the natural quantifier: tomatoes, chillies and some herbs.`,`"herbs" เป็นคำนามพหูพจน์นับได้ในประโยคบอกเล่า จึงใช้ "some" ได้เป็นธรรมชาติที่สุด เป็น tomatoes, chillies and some herbs`],w:{0:[`"Much" is used with uncountable nouns, usually in questions and negatives.`,`"much" ใช้กับคำนามนับไม่ได้ และมักใช้ในประโยคคำถามหรือปฏิเสธ`],1:[`"A little" is also for uncountable nouns, such as "a little water".`,`"a little" ก็ใช้กับคำนามนับไม่ได้ เช่น "a little water"`],2:[`"Little" is for uncountable nouns and means hardly any.`,`"little" ใช้กับคำนามนับไม่ได้ และแปลว่าแทบไม่มีเลย`]}},{id:`P1-Q38`,p:`cloze`,k:`linking-words`,blank:4,q:`Choose the best answer for blank 4.`,c:[`After`,`Before`,`Until`,`While`],a:0,e:[`The tomatoes became ready at the end of a three-month period, so the time word must mean "at the end of". "After three months" is correct.`,`มะเขือเทศพร้อมเก็บเมื่อผ่านไปสามเดือน คำบอกเวลาจึงต้องหมายถึง "เมื่อครบกำหนด" ดังนั้น "After three months" จึงถูกต้อง`],w:{1:[`"Before three months" would mean they were ready earlier than that, which contradicts the story.`,`"Before three months" จะหมายความว่าพร้อมเก็บก่อนหน้านั้น ซึ่งขัดกับเนื้อเรื่อง`],2:[`"Until" needs a continuing action, as in "We waited until three months had passed".`,`"until" ต้องใช้กับการกระทำที่ดำเนินต่อเนื่อง เช่น "We waited until three months had passed"`],3:[`"While" introduces something happening at the same time, not a completed period.`,`"while" ใช้นำหน้าเหตุการณ์ที่เกิดขึ้นพร้อมกัน ไม่ใช่ช่วงเวลาที่ครบกำหนด`]}},{id:`P1-Q39`,p:`cloze`,k:`prepositions`,blank:5,q:`Choose the best answer for blank 5.`,c:[`for`,`with`,`of`,`about`],a:2,e:[`The fixed pattern is "proud of + the thing you are proud of": proud of them, proud of my school.`,`โครงสร้างตายตัวคือ "proud of + สิ่งที่ภูมิใจ" เช่น proud of them, proud of my school`],w:{0:[`"Proud for" is not used in English.`,`รูป "proud for" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"Proud with" is not a possible combination.`,`รูป "proud with" ไม่มีใช้ในภาษาอังกฤษ`],3:[`"Proud about" is not standard; the preposition is always "of".`,`รูป "proud about" ไม่ใช่ภาษามาตรฐาน คำบุพบทที่ใช้คือ "of" เสมอ`]}},{id:`P1-Q40`,p:`cloze`,k:`comparisons`,blank:6,q:`Choose the best answer for blank 6.`,c:[`best`,`better`,`good`,`well`],a:0,e:[`"The … they had ever tasted" compares the soup with every other soup, so a superlative is needed. The superlative of "good" is "best".`,`โครงสร้าง "the … they had ever tasted" เปรียบเทียบซุปนี้กับซุปอื่นทั้งหมด จึงต้องใช้ขั้นสุด และขั้นสุดของ "good" คือ "best"`],w:{1:[`"Better" is the comparative and needs "than", as in "better than the soup yesterday".`,`"better" เป็นขั้นกว่าและต้องมี "than" เช่น "better than the soup yesterday"`],2:[`The plain adjective cannot follow "the" in this pattern.`,`คำคุณศัพท์รูปปกติใช้ตามหลัง "the" ในโครงสร้างนี้ไม่ได้`],3:[`"Well" is an adverb and cannot describe the noun "soup".`,`"well" เป็นคำวิเศษณ์ จึงใช้ขยายคำนาม "soup" ไม่ได้`]}},{id:`P1-Q41`,p:`reading`,k:`reading-detail`,pid:`P1-R1`,q:`What time does the library close on Saturday?`,c:[`9:00 a.m.`,`12:00 noon`,`3:00 p.m.`,`It does not open on Saturday.`],a:1,e:[`The notice says, "Saturday: 9:00 a.m. – 12:00 noon," so 9:00 a.m. is the opening time and 12:00 noon is the closing time.`,`ประกาศระบุว่า "Saturday: 9:00 a.m. – 12:00 noon" ดังนั้น 9:00 น. คือเวลาเปิด และ 12:00 น. คือเวลาปิด`],w:{0:[`9:00 a.m. is when the library opens, not when it closes.`,`9:00 น. คือเวลาที่ห้องสมุดเปิด ไม่ใช่เวลาปิด`],2:[`3:00 p.m. is the Monday-to-Friday closing time.`,`15:00 น. คือเวลาปิดของวันจันทร์ถึงศุกร์`],3:[`Sunday is the closed day, not Saturday.`,`วันที่ปิดคือวันอาทิตย์ ไม่ใช่วันเสาร์`]}},{id:`P1-Q42`,p:`reading`,k:`reading-detail`,pid:`P1-R1`,q:`How many books may a student borrow at one time?`,c:[`One`,`Two`,`Five`,`Three`],a:3,e:[`The notice says, "You may borrow up to three books at a time."`,`ประกาศระบุว่า "You may borrow up to three books at a time." คือยืมได้ครั้งละไม่เกิน 3 เล่ม`],w:{0:[`One is not mentioned as a limit anywhere.`,`ไม่มีการระบุว่าจำกัดที่หนึ่งเล่ม`],1:[`Two is the number of computers at the front desk.`,`สองคือจำนวนคอมพิวเตอร์ที่โต๊ะหน้าห้องสมุด`],2:[`Five does not appear in the notice.`,`เลขห้าไม่ปรากฏในประกาศ`]}},{id:`P1-Q43`,p:`reading`,k:`reading-detail`,pid:`P1-R1`,q:`What is closed until 25 October?`,c:[`The computer room`,`The reading garden`,`The front desk`,`The whole library`],a:0,e:[`The notice says, "The computer room is closed for repairs until 25 October."`,`ประกาศระบุว่า "The computer room is closed for repairs until 25 October." คือห้องคอมพิวเตอร์ปิดซ่อม`],w:{1:[`The reading garden is mentioned only in the rule about food and drink.`,`สวนอ่านหนังสือถูกกล่าวถึงเฉพาะในกฎเรื่องอาหารและเครื่องดื่ม`],2:[`The front desk is open — that is where the two computers are.`,`โต๊ะหน้าห้องสมุดยังเปิดอยู่ เพราะเป็นที่ตั้งของคอมพิวเตอร์สองเครื่อง`],3:[`The library itself stays open during the holiday.`,`ตัวห้องสมุดยังเปิดทำการตลอดช่วงปิดเทอม`]}},{id:`P1-Q44`,p:`reading`,k:`reading-inference`,pid:`P1-R1`,q:`A student needs to use a computer on 20 October. What should she do?`,c:[`Wait until 25 October.`,`Work in the reading garden instead.`,`Use one of the two machines at the front desk.`,`Borrow three books instead.`],a:2,e:[`20 October falls inside the repair period, and the notice covers exactly that case: "Students who need a computer may use the two machines at the front desk."`,`วันที่ 20 ตุลาคมอยู่ในช่วงซ่อม และประกาศกล่าวถึงกรณีนี้ไว้ว่า "Students who need a computer may use the two machines at the front desk."`],w:{0:[`Waiting is unnecessary — an alternative is offered in the same paragraph.`,`ไม่จำเป็นต้องรอ เพราะมีทางเลือกระบุไว้ในย่อหน้าเดียวกัน`],1:[`The reading garden has no computers; it is only mentioned in the food rule.`,`สวนอ่านหนังสือไม่มีคอมพิวเตอร์ และถูกกล่าวถึงเฉพาะในกฎเรื่องอาหาร`],3:[`Borrowing books does not solve a need for a computer.`,`การยืมหนังสือไม่ได้แก้ปัญหาเรื่องการต้องใช้คอมพิวเตอร์`]}},{id:`P1-Q45`,p:`reading`,k:`reading-detail`,pid:`P1-R1`,q:`Where may students eat their snacks?`,c:[`In the reading garden`,`At the front desk`,`Anywhere inside the library`,`Nowhere in the library`],a:3,e:[`The last line says food and drink are "not allowed anywhere in the library, including the reading garden", so there is no place inside where snacks are permitted.`,`บรรทัดสุดท้ายระบุว่าห้ามนำอาหารและเครื่องดื่มเข้า "anywhere in the library, including the reading garden" จึงไม่มีจุดใดในห้องสมุดที่กินได้`],w:{0:[`The reading garden is named specifically as a place where food is not allowed.`,`สวนอ่านหนังสือถูกระบุชื่อไว้โดยเฉพาะว่าเป็นที่ห้ามนำอาหารเข้า`],1:[`The front desk is inside the library, so the same rule applies.`,`โต๊ะหน้าห้องสมุดอยู่ภายในห้องสมุด จึงอยู่ภายใต้กฎเดียวกัน`],2:[`This is the opposite of what the notice says.`,`ข้อนี้ตรงข้ามกับสิ่งที่ประกาศระบุไว้`]}},{id:`P1-Q46`,p:`reading`,k:`reading-detail`,pid:`P1-R2`,q:`Where did Bow find the kitten?`,c:[`At the temple gate`,`Under the stairs`,`Near the market`,`In the school garden`],a:1,e:[`The first paragraph says Bow heard a sound "under the stairs", looked, and found the kitten there.`,`ย่อหน้าแรกระบุว่าโบว์ได้ยินเสียง "under the stairs" แล้วมองดูและพบลูกแมวที่นั่น`],w:{0:[`The temple gate is where she put one of the "FOUND" pictures.`,`ประตูวัดเป็นที่ที่เธอนำรูป "FOUND" ไปติดไว้หนึ่งแผ่น`],2:[`The market wall is where she put five of the pictures.`,`กำแพงใกล้ตลาดเป็นที่ที่เธอติดรูปไว้ห้าแผ่น`],3:[`No school garden appears in this story.`,`ในเรื่องนี้ไม่มีสวนโรงเรียน`]}},{id:`P1-Q47`,p:`reading`,k:`reading-detail`,pid:`P1-R2`,q:`What did Bow do on Wednesday?`,c:[`She put up pictures of the kitten.`,`She gave the kitten some warm milk.`,`She took the kitten to the temple.`,`She met the little boy and his mother.`],a:0,e:[`The third paragraph begins "On Wednesday" and says she drew the kitten, wrote FOUND, and put up six copies.`,`ย่อหน้าที่สามขึ้นต้นด้วย "On Wednesday" และระบุว่าเธอวาดรูปลูกแมว เขียนคำว่า FOUND แล้วนำไปติดหกแผ่น`],w:{1:[`The milk was on Tuesday evening, when she first found the kitten.`,`การให้นมอุ่นเกิดขึ้นเย็นวันอังคาร ตอนที่เธอเพิ่งพบลูกแมว`],2:[`She took a picture to the temple gate, not the kitten itself.`,`เธอนำรูปไปติดที่ประตูวัด ไม่ได้นำลูกแมวไป`],3:[`The woman and the boy came on Thursday afternoon.`,`ผู้หญิงและเด็กชายมาในบ่ายวันพฤหัสบดี`]}},{id:`P1-Q48`,p:`reading`,k:`reading-reference`,pid:`P1-R2`,q:`In the last paragraph, "his face" is the face of ____.`,c:[`Bow’s mother`,`Bow`,`the little boy`,`the woman`],a:2,e:[`"His" is used for a male, and the only male in the scene is the little boy who had been crying and then stopped.`,`คำว่า "his" ใช้กับเพศชาย และผู้ชายคนเดียวในฉากนี้คือเด็กชายที่ร้องไห้แล้วหยุดร้อง`],w:{0:[`Bow’s mother is the person speaking, and "her" would be used for her.`,`แม่ของโบว์เป็นผู้พูด และถ้าหมายถึงเธอต้องใช้คำว่า "her"`],1:[`Bow is a girl, so "his" cannot refer to her.`,`โบว์เป็นเด็กผู้หญิง คำว่า "his" จึงหมายถึงเธอไม่ได้`],3:[`The woman is female, so "his" cannot refer to her either.`,`ผู้หญิงคนนั้นเป็นเพศหญิง คำว่า "his" จึงหมายถึงเธอไม่ได้เช่นกัน`]}},{id:`P1-Q49`,p:`reading`,k:`reading-inference`,pid:`P1-R2`,q:`Why did the boy stop crying?`,c:[`His mother gave him some warm milk.`,`Bow gave him one of her pictures.`,`He had simply grown tired of crying.`,`He saw his lost kitten again.`],a:3,e:[`The story puts the two events in one sentence: "When he saw the kitten he stopped crying at once," and the kitten then ran to him because it knew him.`,`เรื่องเล่าวางสองเหตุการณ์ไว้ในประโยคเดียวว่า "When he saw the kitten he stopped crying at once" และลูกแมวก็วิ่งเข้าหาเขาเพราะจำเขาได้`],w:{0:[`The milk was given by Bow to the kitten, not by the mother to the boy.`,`นมอุ่นเป็นสิ่งที่โบว์ให้ลูกแมว ไม่ใช่แม่ให้เด็กชาย`],1:[`The pictures were put up on walls to find the owner, not handed to the boy.`,`รูปถูกนำไปติดตามกำแพงเพื่อตามหาเจ้าของ ไม่ได้ยื่นให้เด็กชาย`],2:[`The story says he stopped "when he saw the kitten", which gives the real reason.`,`เรื่องระบุว่าเขาหยุดร้อง "when he saw the kitten" ซึ่งบอกเหตุผลที่แท้จริงไว้แล้ว`]}},{id:`P1-Q50`,p:`reading`,k:`reading-main-idea`,pid:`P1-R2`,q:`What is the best title for this story?`,c:[`Giving Back What You Found`,`How to Look After a Kitten`,`A Busy Week at the Market`,`The Boy Who Cried`],a:0,e:[`The whole story runs from finding the kitten to searching for its owner to handing it back, and it ends with Bow smiling about that choice. The title has to cover that arc.`,`ทั้งเรื่องดำเนินจากการพบลูกแมว การตามหาเจ้าของ ไปจนถึงการคืนให้เจ้าของ และจบด้วยรอยยิ้มของโบว์ต่อการตัดสินใจนั้น ชื่อเรื่องจึงต้องครอบคลุมเส้นเรื่องนี้`],w:{1:[`Caring for the kitten is only the second paragraph, not the whole story.`,`การดูแลลูกแมวเป็นเพียงย่อหน้าที่สอง ไม่ใช่ทั้งเรื่อง`],2:[`The market appears once, as a place to put up a picture.`,`ตลาดปรากฏเพียงครั้งเดียวในฐานะที่ติดรูป`],3:[`The boy appears only in the fourth paragraph and is not the main character.`,`เด็กชายปรากฏเฉพาะในย่อหน้าที่สี่ และไม่ใช่ตัวละครหลัก`]}}]},{id:`paper-2`,number:2,title:`Paper 2`,subtitle:`Standard — School, Home and Town`,tier:`standard`,minutes:50,cloze:{id:`P2-CLOZE`,kind:`Short story`,title:`Learning to Cook`,body:[`When I was ten, my grandmother decided «1» me how to cook. She said that everybody should be able to make at least three dishes well.`,`We started with fried rice. She showed me how to cut the vegetables «2» than I had ever cut them before, and she would not let me touch the pan until the knife work was perfect.`,`At first I was bored. «3», after a month I noticed something: my friends came to my house at the weekend, and they always asked «4» I was cooking.`,`Now I am thirteen and I can make eleven dishes. My grandmother still checks the vegetables, and she still «5» when they are not the same size. I do not mind. Her fried rice is «6» the best I have ever eaten.`]},passages:[{id:`P2-R1`,kind:`Poster`,title:`Photography Club: Weekend Workshop`,body:[`The Photography Club is running a weekend workshop for students in Grades 5 to 9. No camera is needed — a phone camera is fine.`,`Places are limited to 15 students per session. Sign up on the noticeboard outside Room 8.`],table:{caption:`Workshop sessions`,headers:[`Session`,`Day`,`Time`,`Topic`,`Room`],rows:[[`1`,`Saturday`,`9:00 – 10:30`,`Holding the camera steady`,`Room 8`],[`2`,`Saturday`,`11:00 – 12:30`,`Light and shadow`,`School garden`],[`3`,`Sunday`,`9:00 – 11:00`,`Photographing people`,`Room 8`],[`4`,`Sunday`,`13:00 – 15:00`,`Editing on a phone`,`Computer room`]]},footer:[`Session 4 is open only to students who have finished Session 3.`]},{id:`P2-R2`,kind:`Email`,title:`Thank you — and one small problem`,meta:[[`To`,`Mr. Somsak, Grade 6 Head Teacher`],[`From`,`Ratchanee Kaewmanee`],[`Subject`,`Thank you — and one small problem`]],body:[`Dear Mr. Somsak,`,`Thank you for organising the Grade 6 camp last weekend. My daughter Fai came home tired but very happy, and she has not stopped talking about the night walk.`,`I am writing about one small problem. When Fai unpacked her bag, she found a blue jacket that is not hers. The name inside it is "Paitoon". Her own jacket, which has her name on the label, is missing.`,`I have washed the blue jacket, and Fai will bring it to the school office on Monday morning. Could you ask the Grade 6 teachers whether any student is looking for a jacket?`,`Thank you again for all your work.`],footer:[`Yours sincerely,`,`Ratchanee Kaewmanee`]}],questions:[{id:`P2-Q01`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`h«ou»se`,`c«ou»sin`,`m«ou»se`,`cl«ou»d`],a:1,e:[`In "house", "mouse" and "cloud" the letters "ou" say the /aʊ/ sound, like "ow" in "now". In "cousin" they say the short /ʌ/ sound, like the "u" in "cup".`,`ในคำว่า house, mouse และ cloud ตัวอักษร "ou" ออกเสียง /aʊ/ เหมือน ow ในคำว่า now แต่ในคำว่า cousin ออกเสียงสระสั้น /ʌ/ เหมือน u ในคำว่า cup`],w:{0:[`"House" has the /aʊ/ sound, the same as "mouse" and "cloud".`,`คำว่า house ออกเสียง /aʊ/ เหมือนกับ mouse และ cloud`],2:[`"Mouse" has the /aʊ/ sound.`,`คำว่า mouse ออกเสียง /aʊ/`],3:[`"Cloud" has the /aʊ/ sound.`,`คำว่า cloud ออกเสียง /aʊ/`]}},{id:`P2-Q02`,p:`pronunciation`,k:`ending-sounds`,q:`Which underlined "-s" ending is pronounced differently from the others?`,c:[`book«s»`,`cup«s»`,`cat«s»`,`dog«s»`],a:3,e:[`After a voiceless sound such as /k/, /p/ or /t/, the plural "-s" is pronounced /s/. After a voiced sound such as /g/, it is pronounced /z/: dogz.`,`หลังเสียงไม่ก้อง เช่น /k/ /p/ /t/ ส่วนท้าย -s จะออกเสียง /s/ แต่หลังเสียงก้อง เช่น /g/ จะออกเสียง /z/ เป็น dogz`],w:{0:[`"Books" ends in /k/, so the "-s" is /s/.`,`คำว่า books ลงท้ายด้วย /k/ ส่วน -s จึงออกเสียง /s/`],1:[`"Cups" ends in /p/, so the "-s" is /s/.`,`คำว่า cups ลงท้ายด้วย /p/ ส่วน -s จึงออกเสียง /s/`],2:[`"Cats" ends in /t/, so the "-s" is /s/.`,`คำว่า cats ลงท้ายด้วย /t/ ส่วน -s จึงออกเสียง /s/`]}},{id:`P2-Q03`,p:`pronunciation`,k:`consonant-sounds`,q:`In which word is the underlined letter NOT pronounced?`,c:[`«w»rite`,`«w»ater`,`«w»indow`,`«w»inter`],a:0,e:[`When "w" comes before "r" at the start of a word it is silent: write, wrong, wrist. In the other three words the "w" is clearly pronounced.`,`เมื่อ w อยู่หน้า r ที่ต้นคำ ตัว w จะไม่ออกเสียง เช่น write, wrong, wrist ส่วนอีกสามคำออกเสียง w ชัดเจน`],w:{1:[`The "w" in "water" is pronounced.`,`ตัว w ในคำว่า water ออกเสียง`],2:[`The "w" in "window" is pronounced.`,`ตัว w ในคำว่า window ออกเสียง`],3:[`The "w" in "winter" is pronounced.`,`ตัว w ในคำว่า winter ออกเสียง`]}},{id:`P2-Q04`,p:`pronunciation`,k:`word-stress`,q:`Which word has the stress on a different syllable from the others?`,c:[`happy`,`doctor`,`about`,`table`],a:2,e:[`"HAP-py", "DOC-tor" and "TA-ble" are stressed on the first syllable. "A-BOUT" is stressed on the second.`,`คำว่า HAP-py, DOC-tor และ TA-ble ลงเสียงหนักที่พยางค์แรก ส่วน a-BOUT ลงเสียงหนักที่พยางค์ที่สอง`],w:{0:[`"Happy" is stressed on the first syllable: HAP-py.`,`คำว่า happy ลงเสียงหนักพยางค์แรก เป็น HAP-py`],1:[`"Doctor" is stressed on the first syllable: DOC-tor.`,`คำว่า doctor ลงเสียงหนักพยางค์แรก เป็น DOC-tor`],3:[`"Table" is stressed on the first syllable: TA-ble.`,`คำว่า table ลงเสียงหนักพยางค์แรก เป็น TA-ble`]}},{id:`P2-Q05`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`f«i»sh`,`ch«i»ld`,`s«i»t`,`m«i»lk`],a:1,e:[`In "fish", "sit" and "milk" the letter "i" says the short /ɪ/ sound. In "child" it says the long /aɪ/ sound, like the word "eye".`,`ในคำว่า fish, sit และ milk ตัวอักษร i ออกเสียงสระสั้น /ɪ/ แต่ในคำว่า child ออกเสียง /aɪ/ เหมือนคำว่า eye`],w:{0:[`"Fish" has the short /ɪ/ sound.`,`คำว่า fish ออกเสียงสระสั้น /ɪ/`],2:[`"Sit" has the short /ɪ/ sound.`,`คำว่า sit ออกเสียงสระสั้น /ɪ/`],3:[`"Milk" has the short /ɪ/ sound.`,`คำว่า milk ออกเสียงสระสั้น /ɪ/`]}},{id:`P2-Q06`,p:`conversation`,k:`situational-language`,intro:`Doctor: How long have you had this cough?
Patient: ____`,q:`Choose the best reply for the patient.`,c:[`It is quite a bad cough.`,`I take medicine every day.`,`Yes, I do have a cough.`,`For about a week now.`],a:3,e:[`"How long…?" asks about a length of time, and "for + a period" is the natural way to answer it.`,`คำถาม "How long…?" ถามถึงระยะเวลา และการตอบด้วย "for + ช่วงเวลา" เป็นรูปแบบที่เป็นธรรมชาติ`],w:{0:[`This describes the cough rather than saying how long it has lasted.`,`ประโยคนี้บรรยายอาการไอ ไม่ได้บอกว่าเป็นมานานเท่าใด`],1:[`This answers a question about treatment, which was not asked.`,`ประโยคนี้ตอบคำถามเรื่องการรักษา ซึ่งไม่ได้ถูกถาม`],2:[`"Yes" cannot answer a question beginning with "How long".`,`คำว่า "Yes" ใช้ตอบคำถามที่ขึ้นต้นด้วย "How long" ไม่ได้`]}},{id:`P2-Q07`,p:`conversation`,k:`situational-language`,intro:`Tourist: Excuse me, is the museum far from here?
Local: ____`,q:`Choose the best reply for the local.`,c:[`Yes, it is certainly a museum.`,`No, about five minutes on foot.`,`I have never been inside it.`,`You really should visit it.`],a:1,e:[`"Is it far?" is a yes/no question about distance, so the reply answers it and then gives the walking time.`,`คำถาม "Is it far?" เป็นคำถาม yes/no เรื่องระยะทาง คำตอบจึงตอบรับหรือปฏิเสธแล้วบอกเวลาเดิน`],w:{0:[`This confirms what the building is, not how far away it is.`,`ประโยคนี้ยืนยันว่าที่นั่นคืออะไร ไม่ได้บอกว่าไกลแค่ไหน`],2:[`This is about the speaker's own experience and gives no distance.`,`ประโยคนี้พูดถึงประสบการณ์ของผู้พูดเอง และไม่ได้บอกระยะทาง`],3:[`The tourist is already going; advice is not an answer to the question.`,`นักท่องเที่ยวกำลังจะไปอยู่แล้ว คำแนะนำจึงไม่ใช่คำตอบของคำถาม`]}},{id:`P2-Q08`,p:`conversation`,k:`conversation`,intro:`Ploy: We’re going bowling on Sunday. Do you want to come?
Karn: ____`,q:`Choose the best reply for Karn, who cannot go.`,c:[`Yes, I don’t think so.`,`That sounds absolutely terrible.`,`I’d love to, but I have to help my mother.`,`No, you want to come.`],a:2,e:[`A polite refusal thanks the inviter for the idea and then gives a short reason. "I'd love to, but…" is the standard phrase.`,`การปฏิเสธอย่างสุภาพคือแสดงว่าอยากไปแล้วให้เหตุผลสั้น ๆ ประโยค "I'd love to, but…" เป็นวลีมาตรฐาน`],w:{0:[`"Yes" and "I don't think so" contradict each other.`,`"Yes" กับ "I don't think so" ขัดแย้งกันเอง`],1:[`This insults the invitation and is unkind to a friend.`,`ประโยคนี้เป็นการดูถูกคำเชิญและไม่มีน้ำใจต่อเพื่อน`],3:[`This tells Ploy what she wants instead of replying to the invitation.`,`ประโยคนี้บอกว่าพลอยต้องการอะไร แทนที่จะตอบคำเชิญ`]}},{id:`P2-Q09`,p:`conversation`,k:`conversation`,intro:`Bas: This homework is much too hard for me.
Mint: ____`,q:`Choose the best reply for Mint.`,c:[`Shall we ask the teacher about it together tomorrow?`,`Yes, it is certainly homework.`,`You are simply not clever enough.`,`I finished mine already, sorry.`],a:0,e:[`Bas is admitting a difficulty, so a supportive reply offers a way forward. "Shall we…?" suggests doing something together.`,`บาสกำลังบอกว่าทำไม่ไหว คำตอบที่ดีจึงควรเสนอทางออก ประโยค "Shall we…?" เป็นการชวนทำสิ่งใดด้วยกัน`],w:{1:[`This states the obvious and offers nothing.`,`ประโยคนี้พูดสิ่งที่รู้อยู่แล้วและไม่ได้ช่วยอะไร`],2:[`This insults Bas instead of helping.`,`ประโยคนี้ดูถูกบาสแทนที่จะช่วยเหลือ`],3:[`Saying "sorry" while boasting about finishing is not a helpful reply.`,`การพูดว่า "sorry" พร้อมอวดว่าทำเสร็จแล้วไม่ใช่คำตอบที่ช่วยเหลือ`]}},{id:`P2-Q10`,p:`conversation`,k:`situational-language`,intro:`Neighbour: Here, let me help you with those boxes.
Som: ____`,q:`Choose the best reply for Som.`,c:[`No, you may not do that.`,`Yes, they are heavy boxes.`,`I am carrying the boxes now.`,`Thank you so much. That’s very kind.`],a:3,e:[`The neighbour offers help, so the natural reply accepts it and thanks them.`,`เพื่อนบ้านเสนอความช่วยเหลือ คำตอบที่เป็นธรรมชาติคือรับความช่วยเหลือและกล่าวขอบคุณ`],w:{0:[`A flat refusal with no thanks sounds rude to a neighbour offering help.`,`การปฏิเสธห้วน ๆ โดยไม่ขอบคุณฟังดูไม่สุภาพต่อเพื่อนบ้านที่มาช่วย`],1:[`This describes the boxes but never answers the offer.`,`ประโยคนี้บรรยายกล่อง แต่ไม่ได้ตอบรับข้อเสนอ`],2:[`This states what Som is doing and ignores the offer.`,`ประโยคนี้บอกว่าสมกำลังทำอะไร และมองข้ามข้อเสนอ`]}},{id:`P2-Q11`,p:`conversation`,k:`conversation`,intro:`Teacher: Everybody turn to page ninety-four.
Student (who did not hear): ____`,q:`Choose the best reply for the student.`,c:[`Yes, I have turned it already.`,`Page ninety-four is very long, sir.`,`Sorry, which page was that again?`,`No, I do not have a page.`],a:2,e:[`When you miss what somebody said, the polite move is to ask for the information again, not to guess.`,`เมื่อฟังไม่ทันสิ่งที่มีคนพูด วิธีที่สุภาพคือขอให้บอกซ้ำ ไม่ใช่เดาเอง`],w:{0:[`The student did not hear the page number, so he cannot have turned to it.`,`นักเรียนไม่ได้ยินเลขหน้า จึงเปิดไปหน้านั้นไม่ได้`],1:[`This comments on a page he has not found yet.`,`ประโยคนี้แสดงความเห็นเรื่องหน้าที่เขายังหาไม่เจอ`],3:[`"I do not have a page" makes no sense with a textbook.`,`ประโยค "I do not have a page" ไม่สมเหตุสมผลเมื่อพูดถึงหนังสือเรียน`]}},{id:`P2-Q12`,p:`grammar`,k:`tenses`,q:`Don’t disturb Dad. He ____ in the garden at the moment.`,c:[`works`,`work`,`is working`,`worked`],a:2,e:[`"At the moment" shows the action is happening right now, which calls for the present continuous: is + verb-ing.`,`วลี "at the moment" แสดงว่าเหตุการณ์กำลังเกิดขึ้นตอนนี้ จึงต้องใช้ present continuous คือ is + กริยาเติม -ing`],w:{0:[`"Works" is present simple and describes a habit or a job, not this moment.`,`"works" เป็น present simple ใช้บอกกิจวัตรหรืออาชีพ ไม่ใช่สิ่งที่เกิดขึ้นขณะนี้`],1:[`"Work" does not agree with the singular subject "he".`,`"work" ไม่สอดคล้องกับประธานเอกพจน์ "he"`],3:[`"Worked" is past, but the sentence is about now.`,`"worked" เป็นรูปอดีต แต่ประโยคนี้พูดถึงตอนนี้`]}},{id:`P2-Q13`,p:`grammar`,k:`agreement`,q:`Neither of the two answers ____ correct, so the teacher changed the question.`,c:[`is`,`are`,`were`,`have been`],a:0,e:[`"Neither" is treated as singular in standard English, even when a plural noun follows it, so the verb is "is".`,`คำว่า "neither" ถือเป็นเอกพจน์ในภาษาอังกฤษมาตรฐาน แม้จะมีคำนามพหูพจน์ตามมา กริยาจึงเป็น "is"`],w:{1:[`"Are" agrees with "answers", but "neither" is the real subject.`,`"are" สอดคล้องกับ "answers" แต่ประธานที่แท้จริงคือ "neither"`],2:[`"Were" is plural and past; the main verb "changed" describes one past moment, but the state is general.`,`"were" เป็นพหูพจน์และรูปอดีต แต่ประธานเป็นเอกพจน์`],3:[`"Have been" is plural present perfect and does not fit a singular subject.`,`"have been" เป็น present perfect รูปพหูพจน์ จึงไม่เข้ากับประธานเอกพจน์`]}},{id:`P2-Q14`,p:`grammar`,k:`pronouns`,q:`This umbrella isn’t mine. Is it ____?`,c:[`you`,`your`,`their`,`yours`],a:3,e:[`The blank stands alone at the end of the sentence with no noun after it, so a possessive pronoun is needed. The possessive pronoun for "you" is "yours".`,`ช่องว่างอยู่ท้ายประโยคโดยไม่มีคำนามตามมา จึงต้องใช้สรรพนามแสดงความเป็นเจ้าของ ซึ่งของ "you" คือ "yours"`],w:{0:[`"You" is a subject or object pronoun and cannot show ownership.`,`"you" เป็นสรรพนามประธานหรือกรรม ใช้แสดงความเป็นเจ้าของไม่ได้`],1:[`"Your" must be followed by a noun, as in "your umbrella".`,`"your" ต้องมีคำนามตามหลัง เช่น "your umbrella"`],2:[`"Their" also needs a noun, and it refers to other people, not the listener.`,`"their" ก็ต้องมีคำนามตามหลัง และหมายถึงคนอื่น ไม่ใช่ผู้ฟัง`]}},{id:`P2-Q15`,p:`grammar`,k:`quantifiers`,q:`How ____ sugar do you take in your coffee?`,c:[`many`,`much`,`few`,`some`],a:1,e:[`"Sugar" is an uncountable noun, and questions about the amount of an uncountable noun use "How much".`,`"sugar" เป็นคำนามนับไม่ได้ และการถามปริมาณของคำนามนับไม่ได้ต้องใช้ "How much"`],w:{0:[`"How many" is used with countable plural nouns, such as "how many spoons".`,`"how many" ใช้กับคำนามพหูพจน์ที่นับได้ เช่น "how many spoons"`],2:[`"Few" is a quantifier for countable nouns and is not used after "how".`,`"few" เป็นคำบอกปริมาณของคำนามนับได้ และไม่ใช้ตามหลัง "how"`],3:[`"How some" is not an English question phrase.`,`วลี "how some" ไม่มีใช้ในภาษาอังกฤษ`]}},{id:`P2-Q16`,p:`grammar`,k:`prepositions`,q:`My birthday is ____ the fifth of June, the same day as my cousin’s.`,c:[`in`,`at`,`on`,`by`],a:2,e:[`We use "on" with dates and days: on the fifth of June, on Monday, on 12 April.`,`ใช้ "on" กับวันที่และวัน เช่น on the fifth of June, on Monday, on 12 April`],w:{0:[`"In" is used with months and years on their own, as in "in June".`,`"in" ใช้กับเดือนและปีที่อยู่ลำพัง เช่น "in June"`],1:[`"At" is used with clock times and with "at night".`,`"at" ใช้กับเวลานาฬิกาและวลี "at night"`],3:[`"By" means "not later than", which changes the meaning completely.`,`"by" แปลว่าไม่เกินเวลาใด ซึ่งเปลี่ยนความหมายไปโดยสิ้นเชิง`]}},{id:`P2-Q17`,p:`grammar`,k:`tenses`,q:`I ____ my keys somewhere in the house. Now I can’t open the front door.`,c:[`lose`,`lost`,`was losing`,`have lost`],a:3,e:[`The losing happened in the past but the result matters now — she cannot open the door. That link between past and present is the present perfect.`,`การทำกุญแจหายเกิดขึ้นในอดีต แต่ผลกระทบอยู่ที่ปัจจุบันคือเปิดประตูไม่ได้ ความเชื่อมโยงระหว่างอดีตกับปัจจุบันนี้คือ present perfect`],w:{0:[`"Lose" is the present form and does not describe a completed action.`,`"lose" เป็นรูปปัจจุบัน ไม่ได้บรรยายการกระทำที่เกิดขึ้นแล้ว`],1:[`"Lost" is possible in speech, but the present perfect is the form that shows the result now, which the second sentence stresses.`,`"lost" ใช้ในภาษาพูดได้ แต่รูป present perfect คือรูปที่แสดงผลกระทบในปัจจุบันตามที่ประโยคที่สองเน้นไว้`],2:[`"Was losing" describes an action in progress, which does not suit a sudden event.`,`"was losing" บรรยายการกระทำที่กำลังดำเนินอยู่ ซึ่งไม่เหมาะกับเหตุการณ์ที่เกิดขึ้นทันที`]}},{id:`P2-Q18`,p:`grammar`,k:`relative-clauses`,q:`The girl ____ won the singing prize is my cousin.`,c:[`who`,`which`,`whose`,`whom`],a:0,e:[`The relative pronoun stands for "the girl", a person acting as the subject of "won", so "who" is correct.`,`คำสรรพนามเชื่อมความนี้แทน "the girl" ซึ่งเป็นบุคคลและทำหน้าที่เป็นประธานของ "won" จึงต้องใช้ "who"`],w:{1:[`"Which" is used for things and animals, not for people.`,`"which" ใช้กับสิ่งของและสัตว์ ไม่ใช้กับบุคคล`],2:[`"Whose" shows possession and must be followed by a noun.`,`"whose" แสดงความเป็นเจ้าของและต้องมีคำนามตามหลัง`],3:[`"Whom" is the object form; here the girl is the one doing the winning.`,`"whom" เป็นรูปกรรม แต่ในที่นี้เด็กหญิงเป็นผู้ชนะ จึงเป็นประธาน`]}},{id:`P2-Q19`,p:`grammar`,k:`verb-patterns`,q:`Because of the rain we decided ____ at home and watch a film.`,c:[`staying`,`to stay`,`stay`,`stayed`],a:1,e:[`"Decide" is always followed by "to + base verb": decide to stay, decide to go.`,`กริยา "decide" ต้องตามด้วย "to + กริยาพื้นฐาน" เสมอ เช่น decide to stay, decide to go`],w:{0:[`"Decide" is not followed by the -ing form.`,`หลัง "decide" ไม่ใช้รูป -ing`],2:[`The base form alone cannot follow "decided"; the word "to" is needed.`,`กริยารูปพื้นฐานตามหลัง "decided" ลำพังไม่ได้ ต้องมีคำว่า "to"`],3:[`"Stayed" is a past form and cannot follow another verb here.`,`"stayed" เป็นรูปอดีต จึงตามหลังกริยาอีกตัวในที่นี้ไม่ได้`]}},{id:`P2-Q20`,p:`error`,k:`prepositions`,sent:`The children «were» very tired «because» they «had been» walking «since three hours».`,q:`Which underlined part is incorrect?`,c:[`were`,`because`,`had been`,`since three hours`],a:3,e:[`"Since" marks a starting point (since three o'clock), while "for" marks a length of time. Three hours is a length, so it must be "for three hours".`,`"since" ใช้บอกจุดเริ่มต้น (เช่น since three o'clock) ส่วน "for" ใช้บอกระยะเวลา สามชั่วโมงเป็นระยะเวลา จึงต้องเป็น "for three hours"`],w:{0:[`"Were" correctly agrees with the plural subject "the children".`,`"were" สอดคล้องกับประธานพหูพจน์ "the children" ได้ถูกต้อง`],1:[`"Because" correctly introduces the reason for their tiredness.`,`"because" ใช้นำหน้าเหตุผลของความเหนื่อยได้ถูกต้อง`],2:[`"Had been walking" is a correct past perfect continuous for an action that had been going on.`,`"had been walking" เป็นรูป past perfect continuous ที่ถูกต้องสำหรับการกระทำที่ดำเนินมาก่อนหน้า`]}},{id:`P2-Q21`,p:`error`,k:`agreement`,sent:`One of my «best» «friends» «live» «near» the fresh market in town.`,q:`Which underlined part is incorrect?`,c:[`best`,`friends`,`live`,`near`],a:2,e:[`The subject is "one", which is singular, so the verb must be "lives". The plural "friends" only says which group the one person comes from.`,`ประธานของประโยคคือ "one" ซึ่งเป็นเอกพจน์ กริยาจึงต้องเป็น "lives" ส่วนคำพหูพจน์ "friends" เพียงบอกว่าคนนั้นมาจากกลุ่มใด`],w:{0:[`"Best" is a correct superlative adjective before "friends".`,`"best" เป็นคำคุณศัพท์ขั้นสุดที่ใช้หน้า "friends" ได้ถูกต้อง`],1:[`"Friends" must be plural after "one of my…".`,`หลัง "one of my…" คำนามต้องเป็นพหูพจน์ คือ "friends"`],3:[`"Near the market" is a correct preposition phrase.`,`"near the market" เป็นวลีบุพบทที่ถูกต้อง`]}},{id:`P2-Q22`,p:`error`,k:`comparisons`,sent:`She is «the» «most fastest» runner «in» «our school» this year.`,q:`Which underlined part is incorrect?`,c:[`the`,`most fastest`,`in`,`our school`],a:1,e:[`A superlative uses either -est or "most", never both. "Fast" is a short adjective, so the correct form is "fastest".`,`คำคุณศัพท์ขั้นสุดใช้ -est หรือ "most" อย่างใดอย่างหนึ่ง ไม่ใช้พร้อมกัน คำว่า "fast" เป็นพยางค์สั้น รูปที่ถูกต้องจึงเป็น "fastest"`],w:{0:[`A superlative needs "the", so "the" is correct here.`,`คำคุณศัพท์ขั้นสุดต้องมี "the" ดังนั้น "the" จึงถูกต้อง`],2:[`"In our school" correctly names the group being compared.`,`"in our school" ระบุกลุ่มที่นำมาเปรียบเทียบได้ถูกต้อง`],3:[`"Our school" is a correct noun phrase.`,`"our school" เป็นนามวลีที่ถูกต้อง`]}},{id:`P2-Q23`,p:`error`,k:`verb-patterns`,sent:`My father «enjoys to read» the newspaper «before» he «goes» to «work» every morning.`,q:`Which underlined part is incorrect?`,c:[`enjoys to read`,`before`,`goes`,`work`],a:0,e:[`"Enjoy" is always followed by the -ing form, never by "to + verb". The correct phrase is "enjoys reading".`,`กริยา "enjoy" ต้องตามด้วยรูป -ing เสมอ ไม่ใช้ "to + กริยา" วลีที่ถูกต้องคือ "enjoys reading"`],w:{1:[`"Before" correctly links the two actions in time.`,`"before" เชื่อมสองการกระทำตามลำดับเวลาได้ถูกต้อง`],2:[`"Goes" correctly agrees with the singular subject "he".`,`"goes" สอดคล้องกับประธานเอกพจน์ "he" ได้ถูกต้อง`],3:[`"Go to work" takes no article and is correct as written.`,`"go to work" ไม่ต้องมี article และเขียนถูกต้องแล้ว`]}},{id:`P2-Q24`,p:`error`,k:`tenses`,sent:`When I «arrived» at the station, the train «had» already «left», so I «am waiting» for the next one.`,q:`Which underlined part is incorrect?`,c:[`arrived`,`had`,`left`,`am waiting`],a:3,e:[`The whole sentence describes the past, so the last verb must be past too: "so I waited for the next one".`,`ทั้งประโยคเล่าเหตุการณ์ในอดีต กริยาตัวสุดท้ายจึงต้องเป็นอดีตด้วย คือ "so I waited for the next one"`],w:{0:[`"Arrived" is the correct past simple.`,`"arrived" เป็นรูป past simple ที่ถูกต้อง`],1:[`"Had" is correct: the train left before the speaker arrived.`,`"had" ถูกต้อง เพราะรถไฟออกไปก่อนที่ผู้พูดจะมาถึง`],2:[`"Left" is the correct past participle in "had already left".`,`"left" เป็นกริยาช่องที่ 3 ที่ถูกต้องในรูป "had already left"`]}},{id:`P2-Q25`,p:`error`,k:`pronouns`,sent:`«Last week» my sister and «me» «went» to the floating market «together».`,q:`Which underlined part is incorrect?`,c:[`Last week`,`me`,`went`,`together`],a:1,e:[`The two people are the subject of the sentence, so the subject pronoun "I" is needed: "my sister and I went". A quick test is to remove "my sister and" — you would say "I went", not "me went".`,`บุคคลทั้งสองเป็นประธานของประโยค จึงต้องใช้สรรพนามประธาน "I" เป็น "my sister and I went" วิธีตรวจง่าย ๆ คือตัด "my sister and" ออก จะเห็นว่าต้องพูดว่า "I went" ไม่ใช่ "me went"`],w:{0:[`"Last week" correctly matches the past verb "went".`,`"last week" สอดคล้องกับกริยาอดีต "went" ได้ถูกต้อง`],2:[`"Went" is the correct past simple of "go".`,`"went" เป็นรูป past simple ที่ถูกต้องของ "go"`],3:[`"Together" is a correct adverb at the end of the sentence.`,`"together" เป็นคำวิเศษณ์ที่วางท้ายประโยคได้ถูกต้อง`]}},{id:`P2-Q26`,p:`vocabulary`,k:`vocab-context`,q:`After the rain the road was very ____, so the driver went slowly and carefully.`,c:[`slippery`,`straight`,`wide`,`famous`],a:0,e:[`Wet roads make tyres slide, which is why the driver slowed down. "Slippery" describes a surface that is hard to grip.`,`ถนนเปียกทำให้ยางลื่นไถล จึงเป็นเหตุให้คนขับชะลอความเร็ว คำว่า "slippery" ใช้บรรยายพื้นผิวที่ลื่นจับยึดได้ยาก`],w:{1:[`"Straight" describes the shape of the road and is no reason to slow down.`,`"straight" บอกรูปทรงของถนน ซึ่งไม่ใช่เหตุผลให้ต้องชะลอ`],2:[`"Wide" roads are usually easier to drive on, not harder.`,`ถนนที่ "wide" หรือกว้างมักขับง่ายขึ้น ไม่ใช่ยากขึ้น`],3:[`"Famous" means well known and has nothing to do with the rain.`,`"famous" แปลว่ามีชื่อเสียง ซึ่งไม่เกี่ยวกับฝน`]}},{id:`P2-Q27`,p:`vocabulary`,k:`synonyms-antonyms`,q:`The instructions were simple, so everyone finished quickly. "Simple" is closest in meaning to ____.`,c:[`strange`,`strict`,`serious`,`easy`],a:3,e:[`Everyone finished quickly, which shows the instructions were not hard to follow. "Simple" and "easy" both mean not difficult.`,`ทุกคนทำเสร็จเร็ว แสดงว่าคำแนะนำไม่ยากที่จะปฏิบัติตาม คำว่า "simple" และ "easy" ต่างแปลว่าไม่ยาก`],w:{0:[`"Strange" means unusual, which would not help people finish quickly.`,`"strange" แปลว่าแปลกประหลาด ซึ่งไม่ได้ช่วยให้คนทำเสร็จเร็ว`],1:[`"Strict" describes rules that must be obeyed exactly.`,`"strict" ใช้กับกฎที่ต้องปฏิบัติตามอย่างเคร่งครัด`],2:[`"Serious" means important or not joking, not easy to do.`,`"serious" แปลว่าจริงจังหรือสำคัญ ไม่ได้แปลว่าทำง่าย`]}},{id:`P2-Q28`,p:`vocabulary`,k:`collocations`,q:`Could you ____ me a favour and post this letter on your way to work?`,c:[`make`,`give`,`do`,`take`],a:2,e:[`"Do somebody a favour" is a fixed expression meaning to help them with something. No other verb is used with "a favour" in this pattern.`,`"do somebody a favour" เป็นสำนวนตายตัว แปลว่าช่วยเหลือใครสักเรื่อง โดยไม่ใช้กริยาอื่นคู่กับ "a favour" ในรูปนี้`],w:{0:[`"Make a favour" is not used in English.`,`รูป "make a favour" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"Give a favour" is not a natural collocation.`,`รูป "give a favour" ไม่เป็นคำคู่ที่ใช้จริง`],3:[`"Take a favour" is not used; the verb is always "do".`,`รูป "take a favour" ไม่มีใช้ กริยาที่ใช้คือ "do" เสมอ`]}},{id:`P2-Q29`,p:`vocabulary`,k:`phrasal-verbs`,q:`We had to ____ the picnic because it started to rain heavily.`,c:[`call in`,`call off`,`call on`,`call up`],a:1,e:[`"Call off" means to cancel an event that had been arranged.`,`"call off" แปลว่ายกเลิกกิจกรรมที่นัดหมายไว้แล้ว`],w:{0:[`"Call in" means to ask somebody to come, such as calling in a doctor.`,`"call in" แปลว่าเรียกใครให้มา เช่น เรียกหมอมาตรวจ`],2:[`"Call on" means to visit somebody briefly.`,`"call on" แปลว่าแวะไปเยี่ยมใครสั้น ๆ`],3:[`"Call up" means to telephone somebody.`,`"call up" แปลว่าโทรศัพท์หาใครสักคน`]}},{id:`P2-Q30`,p:`vocabulary`,k:`word-formation`,q:`The teacher was very ____ and explained the same lesson three times.`,c:[`patience`,`patiently`,`impatient`,`patient`],a:3,e:[`After the verb "was" we need an adjective, and explaining the same lesson three times describes somebody who is willing to wait calmly. The adjective is "patient".`,`หลังกริยา "was" ต้องใช้คำคุณศัพท์ และการอธิบายบทเรียนเดิมซ้ำสามครั้งแสดงถึงคนที่ใจเย็นรอได้ คำคุณศัพท์ที่ตรงคือ "patient"`],w:{0:[`"Patience" is a noun. You can "have patience", but you cannot "be patience".`,`"patience" เป็นคำนาม เราพูดว่า "have patience" ได้ แต่พูดว่า "be patience" ไม่ได้`],1:[`"Patiently" is an adverb and describes a verb, not the teacher herself.`,`"patiently" เป็นคำวิเศษณ์ ใช้ขยายกริยา ไม่ได้ขยายตัวครู`],2:[`"Impatient" is the opposite and contradicts explaining the lesson three times.`,`"impatient" มีความหมายตรงข้าม และขัดกับการอธิบายบทเรียนซ้ำสามครั้ง`]}},{id:`P2-Q31`,p:`ordering`,k:`word-order`,items:[`to the dentist`,`my mother`,`next Friday`,`is taking me`],q:`Put the parts in the correct order to make a sentence.`,c:[`2-1-4-3`,`2-4-1-3`,`4-2-1-3`,`1-2-4-3`],a:1,e:[`The order is subject → verb → place → time: "My mother (2) is taking me (4) to the dentist (1) next Friday (3)."`,`ลำดับคือ ประธาน → กริยา → สถานที่ → เวลา จึงได้ "My mother (2) is taking me (4) to the dentist (1) next Friday (3)"`],w:{0:[`This puts the place before the verb: "My mother to the dentist is taking me."`,`รูปนี้วางสถานที่ไว้หน้ากริยา เป็น "My mother to the dentist is taking me"`],2:[`Starting with the place leaves the sentence without a proper opening.`,`การขึ้นต้นด้วยสถานที่ทำให้ประโยคเปิดไม่ถูกต้อง`],3:[`Starting with "to the dentist" leaves the sentence without a subject at the front.`,`การขึ้นต้นด้วย "to the dentist" ทำให้ประโยคไม่มีประธานอยู่ต้นประโยค`]}},{id:`P2-Q32`,p:`ordering`,k:`questions`,items:[`have you`,`how long`,`English`,`been studying`],q:`Put the parts in the correct order to make a question.`,c:[`1-2-4-3`,`2-4-1-3`,`1-4-2-3`,`2-1-4-3`],a:3,e:[`A wh- question runs question phrase → auxiliary + subject → verb → object: "How long (2) have you (1) been studying (4) English (3)?"`,`คำถาม wh- เรียงเป็น วลีคำถาม → กริยาช่วย + ประธาน → กริยา → กรรม จึงได้ "How long (2) have you (1) been studying (4) English (3)?"`],w:{0:[`Starting with "have you" puts the auxiliary before the question phrase.`,`การขึ้นต้นด้วย "have you" ทำให้กริยาช่วยมาก่อนวลีคำถาม`],1:[`"How long been studying have you" separates the auxiliary from its subject.`,`รูป "How long been studying have you" แยกกริยาช่วยออกจากประธาน`],2:[`This also begins with the auxiliary instead of the question phrase.`,`รูปนี้ก็ขึ้นต้นด้วยกริยาช่วยแทนที่จะเป็นวลีคำถาม`]}},{id:`P2-Q33`,p:`ordering`,k:`text-cohesion`,items:[`I have a headache and a sore throat.`,`Good morning. What seems to be the problem?`,`Take this medicine twice a day and rest.`,`Let me check your temperature. Hmm, it is a little high.`],q:`Put the lines in the correct order to make a conversation.`,c:[`2-1-4-3`,`1-2-4-3`,`2-4-1-3`,`1-4-2-3`],a:0,e:[`The doctor greets and asks (2), the patient describes the symptoms (1), the doctor examines and comments (4), and finally gives the treatment (3).`,`หมอทักทายและถามอาการ (2) ผู้ป่วยบอกอาการ (1) หมอตรวจและให้ความเห็น (4) แล้วจึงสั่งการรักษา (3)`],w:{1:[`The patient cannot describe symptoms before being asked.`,`ผู้ป่วยจะบอกอาการก่อนที่หมอจะถามไม่ได้`],2:[`The doctor cannot check a temperature before hearing what is wrong.`,`หมอจะวัดไข้ก่อนได้ยินว่าเป็นอะไรไม่ได้`],3:[`Starting with the symptoms leaves the greeting in the middle of the conversation.`,`การขึ้นต้นด้วยอาการทำให้คำทักทายไปอยู่กลางบทสนทนา`]}},{id:`P2-Q34`,p:`ordering`,k:`linking-words`,items:[`However, the shop was closed when we arrived.`,`Last Saturday we went to the new bookshop in town.`,`In the end we bought the books online instead.`,`We had planned the trip for two weeks.`],q:`Put the sentences in the correct order to make a paragraph.`,c:[`2-1-4-3`,`4-2-1-3`,`2-4-1-3`,`1-2-4-3`],a:2,e:[`The topic sentence comes first (2), then the background (4). "However" must follow the plan it contradicts (1), and "In the end" closes the paragraph (3).`,`ประโยคนำมาก่อน (2) ตามด้วยข้อมูลเบื้องหลัง (4) จากนั้น "However" ต้องตามหลังแผนที่มันขัดแย้ง (1) และ "In the end" ปิดท้ายย่อหน้า (3)`],w:{0:[`"However" cannot come before we know what the plan was.`,`"However" มาก่อนที่จะรู้ว่าแผนคืออะไรไม่ได้`],1:[`Starting with the background leaves the topic sentence in second place.`,`การขึ้นต้นด้วยข้อมูลเบื้องหลังทำให้ประโยคนำไปอยู่ลำดับที่สอง`],3:[`A paragraph cannot open with "However".`,`ย่อหน้าจะขึ้นต้นด้วย "However" ไม่ได้`]}},{id:`P2-Q35`,p:`cloze`,k:`verb-patterns`,blank:1,q:`Choose the best answer for blank 1.`,c:[`teaching`,`taught`,`to teach`,`teach`],a:2,e:[`"Decide" is always followed by "to + base verb": decided to teach me how to cook.`,`กริยา "decide" ต้องตามด้วย "to + กริยาพื้นฐาน" เสมอ จึงเป็น decided to teach me how to cook`],w:{0:[`"Decide" is never followed by the -ing form.`,`หลัง "decide" ไม่ใช้รูป -ing`],1:[`"Taught" is a past form and cannot follow "decided" directly.`,`"taught" เป็นรูปอดีต จึงตามหลัง "decided" โดยตรงไม่ได้`],3:[`The base form alone cannot follow "decided"; the word "to" is required.`,`กริยารูปพื้นฐานตามหลัง "decided" ลำพังไม่ได้ ต้องมีคำว่า "to"`]}},{id:`P2-Q36`,p:`cloze`,k:`adjectives-adverbs`,blank:2,q:`Choose the best answer for blank 2.`,c:[`more carefully`,`carefully`,`careful`,`most carefully`],a:0,e:[`The word "than" later in the sentence signals a comparison, and the word describes how she cut, so a comparative adverb is needed: more carefully than before.`,`คำว่า "than" ที่อยู่ถัดไปในประโยคเป็นสัญญาณของการเปรียบเทียบ และคำนี้ขยายวิธีการหั่น จึงต้องใช้คำวิเศษณ์ขั้นกว่า คือ more carefully than before`],w:{1:[`"Carefully" is the plain adverb and cannot be used with "than".`,`"carefully" เป็นคำวิเศษณ์รูปปกติ ใช้คู่กับ "than" ไม่ได้`],2:[`"Careful" is an adjective and cannot describe the action of cutting.`,`"careful" เป็นคำคุณศัพท์ จึงใช้ขยายการหั่นไม่ได้`],3:[`"Most carefully" is a superlative and does not take "than".`,`"most carefully" เป็นขั้นสุด และไม่ใช้กับ "than"`]}},{id:`P2-Q37`,p:`cloze`,k:`linking-words`,blank:3,q:`Choose the best answer for blank 3.`,c:[`Because`,`However`,`So`,`Although`],a:1,e:[`Being bored and then noticing something good are opposite ideas, so a contrast word is needed at the start of the new sentence. "However" does that job.`,`ความรู้สึกเบื่อกับการค้นพบสิ่งดี ๆ เป็นความคิดที่ตรงข้ามกัน จึงต้องใช้คำแสดงความขัดแย้งขึ้นต้นประโยคใหม่ ซึ่งคือ "However"`],w:{0:[`"Because" gives a reason, but being bored is not the reason her friends came.`,`"because" ใช้บอกเหตุผล แต่ความเบื่อไม่ใช่เหตุผลที่เพื่อน ๆ มาหา`],2:[`"So" introduces a result, and the friends coming is not a result of boredom.`,`"so" ใช้บอกผลลัพธ์ แต่การที่เพื่อนมาไม่ใช่ผลของความเบื่อ`],3:[`"Although" shows contrast but must join two clauses in one sentence, not open a new one like this.`,`"although" แสดงความขัดแย้งก็จริง แต่ต้องเชื่อมสองอนุประโยคในประโยคเดียว ไม่ได้ขึ้นต้นประโยคใหม่แบบนี้`]}},{id:`P2-Q38`,p:`cloze`,k:`questions`,blank:4,q:`Choose the best answer for blank 4.`,c:[`that`,`which`,`who`,`what`],a:3,e:[`The friends asked about the thing she was cooking, and the reported question needs a question word standing for that thing: they asked what I was cooking.`,`เพื่อน ๆ ถามถึงสิ่งที่เธอกำลังทำ คำถามที่ถูกเล่าต่อจึงต้องใช้คำถามที่แทนสิ่งนั้น เป็น they asked what I was cooking`],w:{0:[`"That" introduces a reported statement, not a reported question.`,`"that" ใช้นำหน้าประโยคบอกเล่าที่ถูกเล่าต่อ ไม่ใช่คำถาม`],1:[`"Which" would need a set of named options to choose from.`,`"which" ต้องมีตัวเลือกที่ระบุไว้ให้เลือก`],2:[`"Who" asks about a person, but they were asking about food.`,`"who" ใช้ถามถึงบุคคล แต่พวกเขาถามถึงอาหาร`]}},{id:`P2-Q39`,p:`cloze`,k:`vocab-context`,blank:5,q:`Choose the best answer for blank 5.`,c:[`forgets`,`loses`,`notices`,`ignores`],a:2,e:[`The sentence before says the grandmother still checks the vegetables, so she sees when they are uneven. "Notice" means to see or become aware of something.`,`ประโยคก่อนหน้าบอกว่าคุณยายยังคงตรวจผักอยู่ เธอจึงเห็นเมื่อผักหั่นไม่เท่ากัน คำว่า "notice" แปลว่าสังเกตเห็นหรือรู้สึกตัว`],w:{0:[`"Forgets" contradicts the fact that she still checks them.`,`"forgets" ขัดแย้งกับข้อเท็จจริงที่ว่าเธอยังคงตรวจอยู่`],1:[`"Loses" needs an object such as a key, and it does not fit here.`,`"loses" ต้องมีกรรมอย่างเช่นกุญแจ และไม่เข้ากับประโยคนี้`],3:[`"Ignores" means she pays no attention, which is the opposite of checking.`,`"ignores" แปลว่าไม่สนใจ ซึ่งตรงข้ามกับการตรวจตรา`]}},{id:`P2-Q40`,p:`cloze`,k:`adjectives-adverbs`,blank:6,q:`Choose the best answer for blank 6.`,c:[`yet`,`still`,`already`,`ever`],a:1,e:[`The writer can now cook eleven dishes, yet the grandmother's fried rice remains the best. "Still" means the situation has not changed.`,`ผู้เขียนทำอาหารได้ถึงสิบเอ็ดอย่างแล้ว แต่ข้าวผัดของคุณยายก็ยังคงอร่อยที่สุด คำว่า "still" แปลว่าสถานการณ์ยังไม่เปลี่ยนแปลง`],w:{0:[`"Yet" is used in questions and negatives, as in "not yet".`,`"yet" ใช้ในประโยคคำถามและปฏิเสธ เช่น "not yet"`],2:[`"Already" means sooner than expected, which does not fit here.`,`"already" แปลว่าเร็วกว่าที่คาด ซึ่งไม่เข้ากับประโยคนี้`],3:[`"Ever" is already used later in the sentence ("I have ever eaten").`,`"ever" ถูกใช้ไปแล้วในส่วนท้ายของประโยค ("I have ever eaten")`]}},{id:`P2-Q41`,p:`reading`,k:`reading-detail`,pid:`P2-R1`,q:`Which session takes place outside?`,c:[`Session 1`,`Session 3`,`Session 4`,`Session 2`],a:3,e:[`In the table, Session 2 is held in the school garden, which is the only outdoor location listed.`,`ในตาราง เซสชัน 2 จัดที่สวนโรงเรียน ซึ่งเป็นสถานที่กลางแจ้งเพียงแห่งเดียวที่ระบุไว้`],w:{0:[`Session 1 is in Room 8.`,`เซสชัน 1 จัดที่ห้อง 8`],1:[`Session 3 is also in Room 8.`,`เซสชัน 3 ก็จัดที่ห้อง 8 เช่นกัน`],2:[`Session 4 is in the computer room.`,`เซสชัน 4 จัดที่ห้องคอมพิวเตอร์`]}},{id:`P2-Q42`,p:`reading`,k:`reading-detail`,pid:`P2-R1`,q:`How many students may join one session?`,c:[`15`,`8`,`12`,`There is no limit.`],a:0,e:[`The poster says, "Places are limited to 15 students per session."`,`โปสเตอร์ระบุว่า "Places are limited to 15 students per session." คือรับเซสชันละ 15 คน`],w:{1:[`Eight is the room number, not a number of students.`,`เลขแปดคือหมายเลขห้อง ไม่ใช่จำนวนนักเรียน`],2:[`Twelve does not appear anywhere on the poster.`,`เลขสิบสองไม่ปรากฏในโปสเตอร์`],3:[`The poster clearly states a limit.`,`โปสเตอร์ระบุจำนวนจำกัดไว้ชัดเจน`]}},{id:`P2-Q43`,p:`reading`,k:`reading-detail`,pid:`P2-R1`,q:`Where does Session 4 take place?`,c:[`In the computer room`,`In Room 8`,`In the school garden`,`At the students’ homes`],a:0,e:[`The last row of the table shows Session 4, "Editing on a phone", in the computer room.`,`แถวสุดท้ายของตารางระบุว่าเซสชัน 4 เรื่อง "Editing on a phone" จัดที่ห้องคอมพิวเตอร์`],w:{1:[`Room 8 is used for Sessions 1 and 3.`,`ห้อง 8 ใช้สำหรับเซสชัน 1 และ 3`],2:[`The school garden is used for Session 2.`,`สวนโรงเรียนใช้สำหรับเซสชัน 2`],3:[`The workshop is held at school, not at home.`,`เวิร์กช็อปจัดที่โรงเรียน ไม่ใช่ที่บ้าน`]}},{id:`P2-Q44`,p:`reading`,k:`reading-inference`,pid:`P2-R1`,q:`Ann wants to join Session 4 on Sunday afternoon. Which session must she attend before it?`,c:[`Session 1`,`Session 2`,`Session 3`,`Any session on Saturday`],a:2,e:[`The footnote says, "Session 4 is open only to students who have finished Session 3."`,`หมายเหตุท้ายโปสเตอร์ระบุว่า "Session 4 is open only to students who have finished Session 3." คือต้องผ่านเซสชัน 3 ก่อน`],w:{0:[`Session 1 is not named as a condition for Session 4.`,`เซสชัน 1 ไม่ได้ถูกระบุเป็นเงื่อนไขของเซสชัน 4`],1:[`Session 2 is not named as a condition either.`,`เซสชัน 2 ก็ไม่ได้ถูกระบุเป็นเงื่อนไขเช่นกัน`],3:[`The condition names one particular session, not any Saturday session.`,`เงื่อนไขระบุเซสชันเดียวอย่างเจาะจง ไม่ใช่เซสชันใดก็ได้ในวันเสาร์`]}},{id:`P2-Q45`,p:`reading`,k:`reading-detail`,pid:`P2-R1`,q:`What does the poster say about cameras?`,c:[`Every student must bring a camera.`,`A phone camera is good enough.`,`The club lends a camera to each student.`,`Only Grade 9 students may bring cameras.`],a:1,e:[`The first line says, "No camera is needed — a phone camera is fine."`,`บรรทัดแรกระบุว่า "No camera is needed — a phone camera is fine." คือใช้กล้องมือถือก็เพียงพอ`],w:{0:[`The poster says the opposite: no camera is needed.`,`โปสเตอร์ระบุตรงกันข้ามว่าไม่จำเป็นต้องมีกล้อง`],2:[`Lending cameras is never mentioned.`,`ไม่มีการกล่าวถึงการให้ยืมกล้อง`],3:[`The workshop is open to Grades 5 to 9, with no special camera rule.`,`เวิร์กช็อปเปิดรับ ป.5 ถึง ม.3 และไม่มีกฎพิเศษเรื่องกล้อง`]}},{id:`P2-Q46`,p:`reading`,k:`reading-purpose`,pid:`P2-R2`,q:`Why did Mrs. Ratchanee write this email?`,c:[`To complain about how the camp was run`,`To ask the school for her money back`,`To apply for a place at next year’s camp`,`To report a jacket that was taken by mistake`],a:3,e:[`The thanks open and close the email, but the middle paragraphs explain the swapped jacket and ask the teachers to help find the owner. That request is the purpose.`,`คำขอบคุณอยู่ต้นและท้ายอีเมล แต่ย่อหน้ากลางอธิบายเรื่องเสื้อแจ็กเก็ตที่สลับกันและขอให้ครูช่วยตามหาเจ้าของ คำขอนี้คือจุดประสงค์ของอีเมล`],w:{0:[`She thanks Mr. Somsak twice and calls the problem "small".`,`เธอกล่าวขอบคุณคุณสมศักดิ์ถึงสองครั้ง และเรียกเรื่องนี้ว่า "small" คือเรื่องเล็กน้อย`],1:[`Money is never mentioned in the email.`,`อีเมลไม่ได้กล่าวถึงเรื่องเงินเลย`],2:[`The camp has already happened; she is not applying for anything.`,`ค่ายจบไปแล้ว เธอไม่ได้สมัครอะไร`]}},{id:`P2-Q47`,p:`reading`,k:`reading-detail`,pid:`P2-R2`,q:`What did Fai enjoy most at the camp?`,c:[`The night walk`,`The camp food`,`Swimming in the river`,`Meeting a boy called Paitoon`],a:0,e:[`The email says Fai "has not stopped talking about the night walk", which is the only activity singled out.`,`อีเมลระบุว่าฝ้าย "has not stopped talking about the night walk" ซึ่งเป็นกิจกรรมเดียวที่ถูกกล่าวถึงเป็นพิเศษ`],w:{1:[`Food is not mentioned anywhere in the email.`,`อีเมลไม่ได้กล่าวถึงอาหารเลย`],2:[`Swimming is not mentioned in the email.`,`อีเมลไม่ได้กล่าวถึงการว่ายน้ำ`],3:[`"Paitoon" is only a name written inside a jacket.`,`"Paitoon" เป็นเพียงชื่อที่เขียนอยู่ในเสื้อแจ็กเก็ต`]}},{id:`P2-Q48`,p:`reading`,k:`reading-detail`,pid:`P2-R2`,q:`Whose name is written inside the blue jacket?`,c:[`Fai’s`,`Mr. Somsak’s`,`Paitoon’s`,`Mrs. Ratchanee’s`],a:2,e:[`The third paragraph says, "The name inside it is 'Paitoon'." Fai's own name is on the label of the jacket that is missing.`,`ย่อหน้าที่สามระบุว่า "The name inside it is 'Paitoon'." ส่วนชื่อของฝ้ายอยู่บนป้ายของเสื้อตัวที่หายไป`],w:{0:[`Fai's name is on her own jacket, which is the one that is missing.`,`ชื่อของฝ้ายอยู่บนเสื้อของเธอเอง ซึ่งเป็นตัวที่หายไป`],1:[`Mr. Somsak is the teacher receiving the email.`,`คุณสมศักดิ์คือครูผู้รับอีเมล`],3:[`Mrs. Ratchanee is the mother writing the email.`,`คุณรัชนีคือคุณแม่ผู้เขียนอีเมล`]}},{id:`P2-Q49`,p:`reading`,k:`reading-inference`,pid:`P2-R2`,q:`What will happen on Monday morning?`,c:[`Mr. Somsak will visit Fai’s house.`,`Fai will take the blue jacket to the school office.`,`The Grade 6 teachers will run another camp.`,`Fai will buy herself a new jacket.`],a:1,e:[`The fourth paragraph says, "Fai will bring it to the school office on Monday morning."`,`ย่อหน้าที่สี่ระบุว่า "Fai will bring it to the school office on Monday morning."`],w:{0:[`The mother asks the teacher to ask around, not to visit.`,`คุณแม่ขอให้ครูช่วยสอบถาม ไม่ได้ขอให้มาเยี่ยมบ้าน`],2:[`Another camp is not mentioned in the email.`,`อีเมลไม่ได้กล่าวถึงการจัดค่ายอีกครั้ง`],3:[`Buying a new jacket is never suggested; she hopes to find the old one.`,`ไม่มีการเสนอให้ซื้อเสื้อใหม่ เธอหวังว่าจะได้เสื้อตัวเดิมคืน`]}},{id:`P2-Q50`,p:`reading`,k:`reading-vocab`,pid:`P2-R2`,q:`In the email, "unpacked her bag" means that Fai ____.`,c:[`took everything out of her bag`,`put everything into her bag`,`washed her bag carefully`,`lost her bag on the way home`],a:0,e:[`The prefix "un-" reverses the meaning of "pack", so "unpack" means to take things out of a bag. That is how she found the wrong jacket.`,`อุปสรรค "un-" ทำให้ความหมายของ "pack" กลับกัน คำว่า "unpack" จึงแปลว่าเอาของออกจากกระเป๋า ซึ่งเป็นวิธีที่เธอพบเสื้อผิดตัว`],w:{1:[`Putting things in is "pack", the opposite of "unpack".`,`การเก็บของใส่กระเป๋าคือ "pack" ซึ่งตรงข้ามกับ "unpack"`],2:[`Washing is mentioned, but it is the jacket that was washed, not the bag.`,`มีการกล่าวถึงการซัก แต่สิ่งที่ซักคือเสื้อแจ็กเก็ต ไม่ใช่กระเป๋า`],3:[`The bag came home with her — that is how the jacket was found.`,`กระเป๋ากลับบ้านมากับเธอ จึงเป็นเหตุให้พบเสื้อแจ็กเก็ต`]}}]},{id:`paper-3`,number:3,title:`Paper 3`,subtitle:`Standard — Travel, Food and Free Time`,tier:`standard`,minutes:50,cloze:{id:`P3-CLOZE`,kind:`Informational passage`,title:`The Floating Market at Dawn`,body:[`Most visitors reach the floating market at ten in the morning, when the sun is high and the boats are full of tourists. If you want to see the real market, you «1» arrive much earlier.`,`At five o’clock the canal is quiet and grey. Then, one «2» one, the boats appear. Each one carries a single kind of food: noodles
