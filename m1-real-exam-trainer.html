chool is never mentioned.`,`ไม่มีการกล่าวถึงการปิดโรงเรียน`]}},{id:`P4-Q43`,p:`reading`,k:`reading-detail`,pid:`P4-R1`,q:`Why was the hill behind the village NOT chosen?`,c:[`It flooded just as badly as the old site.`,`It was hard for small children to reach.`,`It belonged to another village.`,`It was too far from the river.`],a:1,e:[`The third paragraph describes the hill as "hard for small children to reach", which is why the flat area was chosen instead.`,`ย่อหน้าที่สามบรรยายเนินเขาว่า "hard for small children to reach" ซึ่งเป็นเหตุให้เลือกพื้นที่ราบแทน`],w:{0:[`The hill was higher ground; flooding was not the objection.`,`เนินเขาเป็นพื้นที่สูงกว่า ปัญหาจึงไม่ใช่เรื่องน้ำท่วม`],2:[`Ownership is never mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงเรื่องกรรมสิทธิ์`],3:[`Distance from the river is not given as the reason.`,`ไม่ได้ระบุว่าระยะห่างจากแม่น้ำเป็นเหตุผล`]}},{id:`P4-Q44`,p:`reading`,k:`reading-inference`,pid:`P4-R1`,q:`What does the headteacher mean by "The numbers ended the argument"?`,c:[`Nobody in the village could understand the numbers.`,`The village ran out of money for the project.`,`The argument had been about a mathematics lesson.`,`The measurements showed clearly which site was safest.`],a:3,e:[`She contrasts people wanting "to argue about where to build" with the three years of recorded flood heights, which settled the question by showing the evidence.`,`เธอเปรียบเทียบระหว่างคนที่อยาก "argue about where to build" กับข้อมูลระดับน้ำที่บันทึกไว้สามปี ซึ่งยุติข้อถกเถียงได้ด้วยหลักฐานที่ชัดเจน`],w:{0:[`If the numbers were not understood they could not have ended anything.`,`ถ้าไม่มีใครเข้าใจตัวเลข ตัวเลขก็ยุติอะไรไม่ได้`],1:[`The passage says the new school cost less than the repairs had.`,`บทอ่านระบุว่าโรงเรียนใหม่มีค่าใช้จ่ายน้อยกว่าค่าซ่อมเดิม`],2:[`The argument was about where to build, not about a lesson.`,`ข้อถกเถียงคือเรื่องจะสร้างที่ไหน ไม่ใช่เรื่องบทเรียน`]}},{id:`P4-Q45`,p:`reading`,k:`reading-inference`,pid:`P4-R1`,q:`What can we work out about the cost of the new school?`,c:[`It was more than the village could afford.`,`It was paid for entirely by the government.`,`It was less than ten years of repairs had cost.`,`The passage gives no information about it.`],a:2,e:[`The fourth paragraph says, "It cost less than the repairs of the previous ten years had cost."`,`ย่อหน้าที่สี่ระบุว่า "It cost less than the repairs of the previous ten years had cost." คือถูกกว่าค่าซ่อมสิบปีที่ผ่านมา`],w:{0:[`The school was built, so the village could afford it.`,`โรงเรียนสร้างเสร็จแล้ว แสดงว่าหมู่บ้านมีกำลังพอ`],1:[`Who paid is never stated in the passage.`,`บทอ่านไม่ได้ระบุว่าใครเป็นผู้จ่าย`],3:[`The comparison with repair costs is stated directly.`,`การเปรียบเทียบกับค่าซ่อมถูกระบุไว้โดยตรง`]}},{id:`P4-Q46`,p:`reading`,k:`reading-detail`,pid:`P4-R2`,q:`How many projects may one school send?`,c:[`One`,`Three`,`Seven`,`There is no limit.`],a:1,e:[`The second paragraph says, "Each school may send a maximum of three projects."`,`ย่อหน้าที่สองระบุว่า "Each school may send a maximum of three projects." คือส่งได้ไม่เกิน 3 โครงงาน`],w:{0:[`One is the smallest number of students a project may have.`,`หนึ่งคือจำนวนนักเรียนน้อยที่สุดที่โครงงานหนึ่งมีได้`],2:[`Seven is the date of judging, not a number of projects.`,`เจ็ดคือวันที่ตัดสิน ไม่ใช่จำนวนโครงงาน`],3:[`The notice states a clear maximum.`,`ประกาศระบุจำนวนสูงสุดไว้ชัดเจน`]}},{id:`P4-Q47`,p:`reading`,k:`reading-detail`,pid:`P4-R2`,q:`What is a teacher allowed to do?`,c:[`Give advice`,`Build the equipment`,`Write the summary`,`Present the project`],a:0,e:[`The third paragraph says, "A teacher may advise, but may not build, write or present any part of a project."`,`ย่อหน้าที่สามระบุว่า "A teacher may advise, but may not build, write or present any part of a project." คือให้คำแนะนำได้เท่านั้น`],w:{1:[`Building is on the list of things a teacher may not do.`,`การประกอบอุปกรณ์อยู่ในรายการสิ่งที่ครูทำไม่ได้`],2:[`Writing is also forbidden for teachers.`,`การเขียนก็เป็นสิ่งที่ห้ามครูทำเช่นกัน`],3:[`Presenting is the third thing a teacher may not do.`,`การนำเสนอเป็นข้อที่สามที่ห้ามครูทำ`]}},{id:`P4-Q48`,p:`reading`,k:`reading-inference`,pid:`P4-R2`,q:`An entry arrives with a summary and a photograph, but no signed form. What happens to it?`,c:[`It is judged along with the others.`,`It goes straight to the national round.`,`It is accepted if the teacher explains why.`,`It is returned, and may be sent again before 14 February.`],a:3,e:[`The signed form is one of the three required items, and the notice says, "Entries missing any of these will be returned, and may be sent again before the closing date," which is 14 February.`,`แบบฟอร์มที่ลงนามเป็นหนึ่งในสามสิ่งที่ต้องมี และประกาศระบุว่า "Entries missing any of these will be returned, and may be sent again before the closing date" ซึ่งคือวันที่ 14 กุมภาพันธ์`],w:{0:[`Incomplete entries are returned before judging.`,`ผลงานที่ส่งไม่ครบจะถูกส่งกลับก่อนถึงขั้นตัดสิน`],1:[`Only the three highest-scoring projects in each age group go to the national round.`,`มีเพียงสามโครงงานคะแนนสูงสุดในแต่ละช่วงอายุที่ได้ไปรอบประเทศ`],2:[`The notice gives no exception for a teacher's explanation.`,`ประกาศไม่ได้ให้ข้อยกเว้นสำหรับคำอธิบายของครู`]}},{id:`P4-Q49`,p:`reading`,k:`reading-detail`,pid:`P4-R2`,q:`When does judging take place?`,c:[`On 7 March`,`On 14 February`,`In May`,`The notice does not say.`],a:0,e:[`The last paragraph says, "Judging takes place on 7 March."`,`ย่อหน้าสุดท้ายระบุว่า "Judging takes place on 7 March." คือตัดสินวันที่ 7 มีนาคม`],w:{1:[`14 February is the closing date for entries.`,`วันที่ 14 กุมภาพันธ์คือวันปิดรับผลงาน`],2:[`May is when the national round is held.`,`เดือนพฤษภาคมคือช่วงที่จัดการแข่งขันรอบประเทศ`],3:[`The date is stated clearly in the last paragraph.`,`วันที่ระบุไว้ชัดเจนในย่อหน้าสุดท้าย`]}},{id:`P4-Q50`,p:`reading`,k:`reading-inference`,pid:`P4-R2`,q:`Nut wants to enter two projects of his own. Is this allowed?`,c:[`Yes, as long as both are entirely his own work.`,`No, because no student may appear on more than one project.`,`Yes, if his teacher signs two separate forms.`,`No, because a school may send only one project.`],a:1,e:[`The second paragraph sets a limit on students as well as on schools: "no student may appear on more than one project."`,`ย่อหน้าที่สองกำหนดข้อจำกัดทั้งกับนักเรียนและโรงเรียนว่า "no student may appear on more than one project" คือนักเรียนหนึ่งคนมีชื่อได้เพียงโครงงานเดียว`],w:{0:[`Own work is required, but the one-project rule applies as well.`,`ต้องเป็นผลงานของตนเองก็จริง แต่กฎหนึ่งคนหนึ่งโครงงานก็ยังบังคับใช้`],2:[`The signed form does not remove the limit on students.`,`แบบฟอร์มที่ลงนามไม่ได้ยกเลิกข้อจำกัดเรื่องนักเรียน`],3:[`A school may send three projects; it is the student limit that stops him.`,`โรงเรียนส่งได้สามโครงงาน สิ่งที่ห้ามเขาคือข้อจำกัดของนักเรียน`]}}]},{id:`paper-5`,number:5,title:`Paper 5`,subtitle:`Competitive — People, Places and Choices`,tier:`competitive`,minutes:55,cloze:{id:`P5-CLOZE`,kind:`Informational passage`,title:`The Man Who Counted Birds`,body:[`For twenty-two years, Mr. Sanan walked the same four kilometres of canal bank every Sunday morning and wrote down every bird he saw. Nobody asked him to do it. He simply «1» interested in birds.`,`His notebooks filled a shelf, then a cupboard. Friends teased him gently. What use, they asked, «2» a list of birds?`,`The answer arrived in 2019. A company applied to build a factory beside the canal, and the law required proof of «3» lived there. The official survey took four days and found twenty-nine species.`,`Mr. Sanan brought his notebooks. They showed eighty-one species across two decades, «4» eleven that appear only in the cool months, when the official survey had not been done.`,`The factory was built, «5» two hundred metres further from the water, and the stretch of bank where the rarest birds feed was left alone. Mr. Sanan still walks it every Sunday. He says the only thing that has changed is that «6» laughs at the notebooks now.`]},passages:[{id:`P5-R1`,kind:`Informational passage`,title:`Why Some Streets Feel Safer`,body:[`Two streets in the same town can have the same amount of traffic, the same number of shops, and completely different reputations. One is "the nice street"; the other is where people walk faster.`,`Researchers who study this rarely find a single cause. They find a list of small ones. Lighting matters, but so does what the lighting reveals: a well-lit empty wall helps less than a dim shopfront with somebody inside it.`,`Windows matter most of all. A street where ground-floor rooms face the pavement feels safer than one lined with shutters, because a person walking there is visible to somebody who would notice trouble. Researchers call this "eyes on the street".`,`Benches are the surprise. Where a town adds seating, people stop; and where people stop, other people stay longer. One study in a small European city found that adding twelve benches to a shopping street raised the number of evening pedestrians by almost a third within a year.`,`None of this is expensive. It is simply rarely anybody’s job.`]},{id:`P5-R2`,kind:`Diary entry`,title:`Saturday 14 October`,body:[`I have been dreading this week for a month, and now it is over and I feel almost nothing.`,`The interview was at ten. I got there at nine and sat in the car park reading my notes until my hands stopped shaking. Inside, there were eleven of us for six places. Two of them had been to the same primary school as me; I had not seen them for two years.`,`The first part was a written test — thirty minutes, twenty questions, mostly reading. I finished with four minutes left and checked question 14 three times. I still do not know whether I changed it to the right answer or away from it.`,`Then the interview itself. Three teachers. The one in the middle asked what I would do if I were given a class of thirty children and one book. I said I would ask the children what they wanted the book to be about, and then write the rest with them. She wrote something down. I have no idea whether that was good or bad.`,`Results in three weeks. Mum keeps asking how it went and I keep saying "fine", which is not a lie and is not an answer either.`]}],questions:[{id:`P5-Q01`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`sn«ow»`,`h«ow»`,`n«ow»`,`c«ow»`],a:0,e:[`In "how", "now" and "cow" the letters "ow" say /aʊ/. In "snow" they say the long /əʊ/ sound, like the "o" in "go".`,`ในคำว่า how, now และ cow ตัวอักษร "ow" ออกเสียง /aʊ/ แต่ในคำว่า snow ออกเสียงยาว /əʊ/ เหมือน o ในคำว่า go`],w:{1:[`"How" has the /aʊ/ sound.`,`คำว่า how ออกเสียง /aʊ/`],2:[`"Now" has the /aʊ/ sound.`,`คำว่า now ออกเสียง /aʊ/`],3:[`"Cow" has the /aʊ/ sound.`,`คำว่า cow ออกเสียง /aʊ/`]}},{id:`P5-Q02`,p:`pronunciation`,k:`ending-sounds`,q:`Which underlined "-ed" ending is pronounced differently from the others?`,c:[`stopp«ed»`,`laugh«ed»`,`decid«ed»`,`miss«ed»`],a:2,e:[`After /d/ or /t/ the "-ed" ending becomes a whole extra syllable, /ɪd/: de-cid-ed. After other voiceless sounds it is just a /t/.`,`หลังเสียง /d/ หรือ /t/ ส่วนท้าย -ed จะกลายเป็นพยางค์เพิ่ม /ɪd/ เช่น de-cid-ed แต่หลังเสียงไม่ก้องอื่น ๆ จะออกเสียงเพียง /t/`],w:{0:[`"Stopped" ends in /p/, so the "-ed" is /t/.`,`คำว่า stopped ลงท้ายด้วย /p/ ส่วน -ed จึงออกเสียง /t/`],1:[`"Laughed" ends in /f/, so the "-ed" is /t/.`,`คำว่า laughed ลงท้ายด้วยเสียง /f/ ส่วน -ed จึงออกเสียง /t/`],3:[`"Missed" ends in /s/, so the "-ed" is /t/.`,`คำว่า missed ลงท้ายด้วย /s/ ส่วน -ed จึงออกเสียง /t/`]}},{id:`P5-Q03`,p:`pronunciation`,k:`consonant-sounds`,q:`In which word is the underlined letter NOT pronounced?`,c:[`«g»arden`,`si«g»n`,`«g»oat`,`«g»ame`],a:1,e:[`A "g" before "n" is silent: sign, design, foreign. Interestingly it returns in "signal" and "signature", where the "g" starts a new syllable.`,`ตัว g ที่อยู่หน้า n จะไม่ออกเสียง เช่น sign, design, foreign แต่จะกลับมาออกเสียงในคำว่า signal และ signature ซึ่งตัว g ขึ้นต้นพยางค์ใหม่`],w:{0:[`The "g" in "garden" is pronounced.`,`ตัว g ในคำว่า garden ออกเสียง`],2:[`The "g" in "goat" is pronounced.`,`ตัว g ในคำว่า goat ออกเสียง`],3:[`The "g" in "game" is pronounced.`,`ตัว g ในคำว่า game ออกเสียง`]}},{id:`P5-Q04`,p:`pronunciation`,k:`word-stress`,q:`Which word has the stress on a different syllable from the others?`,c:[`comfortable`,`vegetable`,`dangerous`,`experience`],a:3,e:[`"COM-fort-a-ble", "VEG-e-ta-ble" and "DAN-ger-ous" are stressed on the first syllable. "Ex-PE-ri-ence" is stressed on the second.`,`คำว่า COM-fort-a-ble, VEG-e-ta-ble และ DAN-ger-ous ลงเสียงหนักที่พยางค์แรก ส่วน ex-PE-ri-ence ลงเสียงหนักที่พยางค์ที่สอง`],w:{0:[`"Comfortable" is stressed on the first syllable.`,`คำว่า comfortable ลงเสียงหนักที่พยางค์แรก`],1:[`"Vegetable" is stressed on the first syllable.`,`คำว่า vegetable ลงเสียงหนักที่พยางค์แรก`],2:[`"Dangerous" is stressed on the first syllable.`,`คำว่า dangerous ลงเสียงหนักที่พยางค์แรก`]}},{id:`P5-Q05`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`p«u»t`,`c«u»t`,`b«u»s`,`s«u»n`],a:0,e:[`In "cut", "bus" and "sun" the letter "u" says the /ʌ/ sound. In "put" it says /ʊ/, the rounded sound also heard in "book" and "full".`,`ในคำว่า cut, bus และ sun ตัวอักษร u ออกเสียง /ʌ/ แต่ในคำว่า put ออกเสียง /ʊ/ ซึ่งเป็นเสียงห่อปากเหมือนในคำว่า book และ full`],w:{1:[`"Cut" has the /ʌ/ sound.`,`คำว่า cut ออกเสียง /ʌ/`],2:[`"Bus" has the /ʌ/ sound.`,`คำว่า bus ออกเสียง /ʌ/`],3:[`"Sun" has the /ʌ/ sound.`,`คำว่า sun ออกเสียง /ʌ/`]}},{id:`P5-Q06`,p:`conversation`,k:`situational-language`,intro:`Team leader: You promised the report by Monday, and it’s Wednesday.
Nam: ____`,q:`Choose the best reply for Nam.`,c:[`I know that today is Wednesday.`,`That is really not my fault at all.`,`I’m sorry. I underestimated the data work — you’ll have it by five today.`,`You should have reminded me about it.`],a:2,e:[`A professional apology admits the problem, gives a brief honest reason, and — most importantly — commits to a new time.`,`การขอโทษอย่างมืออาชีพคือยอมรับปัญหา ให้เหตุผลสั้น ๆ ตามจริง และที่สำคัญที่สุดคือกำหนดเวลาส่งใหม่ให้ชัดเจน`],w:{0:[`Agreeing what day it is does not address the missed deadline.`,`การเห็นด้วยว่าวันนี้คือวันอะไรไม่ได้แก้ปัญหาเรื่องงานเลยกำหนด`],1:[`Refusing responsibility before offering a solution sounds defensive.`,`การปฏิเสธความรับผิดชอบก่อนเสนอทางแก้ฟังดูเป็นการแก้ตัว`],3:[`Blaming the team leader for not reminding him shifts the fault unfairly.`,`การโทษหัวหน้าทีมที่ไม่เตือนเป็นการโยนความผิดอย่างไม่เป็นธรรม`]}},{id:`P5-Q07`,p:`conversation`,k:`conversation`,intro:`Kit: Shall we hold the meeting at seven in the morning?
Or: ____`,q:`Choose the best reply for Or, who would prefer a later time.`,c:[`That’s a little early for me. Could we make it eight?`,`No, seven is certainly a time.`,`Yes, seven is far too early for me.`,`I will hold the meeting myself.`],a:0,e:[`A useful counter-offer softens the objection ("a little early") and then proposes a specific alternative, so the meeting can still be arranged.`,`การเสนอทางเลือกที่ดีคือลดน้ำหนักการปฏิเสธ ("a little early") แล้วเสนอเวลาใหม่ที่เจาะจง เพื่อให้นัดประชุมได้จริง`],w:{1:[`This states the obvious and offers nothing.`,`ประโยคนี้พูดสิ่งที่รู้อยู่แล้วและไม่ได้เสนออะไร`],2:[`"Yes" and "far too early" contradict each other.`,`"Yes" กับ "far too early" ขัดแย้งกันเอง`],3:[`Taking over the meeting does not answer a question about the time.`,`การรับจัดประชุมเองไม่ได้ตอบคำถามเรื่องเวลา`]}},{id:`P5-Q08`,p:`conversation`,k:`conversation`,intro:`Chair: We’ll go with the second option, then.
New member: ____`,q:`Choose the best reply for the new member, who cannot remember the second option.`,c:[`Yes, the second option it is.`,`No, I prefer option two instead.`,`The second option is the second one.`,`Sorry, could you remind me what the second option was?`],a:3,e:[`Agreeing to a decision you do not understand is the worst option in a meeting. Asking for a short reminder is normal and professional.`,`การตอบตกลงกับการตัดสินใจที่ตนเองไม่เข้าใจเป็นสิ่งที่แย่ที่สุดในการประชุม การขอให้ทบทวนสั้น ๆ เป็นเรื่องปกติและเป็นมืออาชีพ`],w:{0:[`This agrees without understanding what has been agreed to.`,`ประโยคนี้ตอบตกลงทั้งที่ยังไม่เข้าใจว่าตกลงเรื่องอะไร`],1:[`"Option two" and "the second option" are the same thing, so this makes no sense.`,`"option two" กับ "the second option" คือสิ่งเดียวกัน ประโยคนี้จึงไม่สมเหตุสมผล`],2:[`This repeats the words and asks nothing.`,`ประโยคนี้เพียงพูดซ้ำและไม่ได้ถามอะไร`]}},{id:`P5-Q09`,p:`conversation`,k:`situational-language`,intro:`Guest: ____
Receptionist: I’m so sorry. I’ll send someone up right away.`,q:`Choose the best line for the guest.`,c:[`The air conditioning is broken, and it is entirely your fault.`,`Excuse me, the air conditioning in my room isn’t working.`,`Is the air conditioning working in this hotel?`,`I would like to book a room, please.`],a:1,e:[`A polite complaint opens with "Excuse me" and simply states the problem. That is what produces an apology and immediate help.`,`การร้องเรียนอย่างสุภาพเริ่มด้วย "Excuse me" แล้วบอกปัญหาตรง ๆ ซึ่งเป็นสิ่งที่ทำให้ได้รับคำขอโทษและความช่วยเหลือทันที`],w:{0:[`Blaming the receptionist personally is aggressive and unnecessary.`,`การกล่าวโทษพนักงานเป็นการส่วนตัวเป็นการก้าวร้าวและไม่จำเป็น`],2:[`A general question would be answered "yes" or "no", not with an apology.`,`คำถามกว้าง ๆ จะได้คำตอบว่าใช่หรือไม่ใช่ ไม่ใช่คำขอโทษ`],3:[`The guest already has a room; this is a booking request.`,`แขกมีห้องพักอยู่แล้ว ประโยคนี้เป็นการขอจองห้อง`]}},{id:`P5-Q10`,p:`conversation`,k:`conversation`,intro:`Ploy: I got into the school I wanted!
Mike: ____`,q:`Choose the best reply for Mike.`,c:[`Yes, you certainly did.`,`That is a school, isn’t it?`,`Congratulations! You really deserved it.`,`I got in as well, of course.`],a:2,e:[`Good news deserves congratulation plus a short comment that recognises the effort behind it.`,`ข่าวดีควรได้รับการแสดงความยินดี พร้อมข้อความสั้น ๆ ที่ชื่นชมความพยายามเบื้องหลัง`],w:{0:[`This simply confirms the fact and shows no warmth.`,`ประโยคนี้เพียงยืนยันข้อเท็จจริงและไม่แสดงความยินดี`],1:[`This states the obvious and ignores the achievement.`,`ประโยคนี้พูดสิ่งที่เห็นได้ชัดและมองข้ามความสำเร็จ`],3:[`Turning the news to yourself takes the moment away from your friend.`,`การเปลี่ยนเรื่องมาที่ตัวเองเป็นการแย่งช่วงเวลาสำคัญของเพื่อน`]}},{id:`P5-Q11`,p:`conversation`,k:`situational-language`,intro:`Tourist: How do I get to the pier from here?
Local: ____`,q:`Choose the best reply for the local.`,c:[`Go straight to the traffic lights, turn right, and it’s at the end of that road.`,`The pier is very busy today, I think.`,`I usually take a taxi when I go there.`,`Yes, the pier is somewhere that way.`],a:0,e:[`"How do I get to…?" asks for directions, so the reply gives clear steps in the order the walker will take them.`,`คำถาม "How do I get to…?" เป็นการถามทาง คำตอบจึงต้องบอกขั้นตอนชัดเจนตามลำดับที่ผู้เดินจะทำจริง`],w:{1:[`This comments on the pier instead of saying how to reach it.`,`ประโยคนี้แสดงความเห็นเรื่องท่าเรือ ไม่ได้บอกวิธีไป`],2:[`This talks about the speaker's own habit and gives no route.`,`ประโยคนี้พูดถึงสิ่งที่ผู้พูดทำเป็นปกติ และไม่ได้บอกเส้นทาง`],3:[`"Somewhere that way" is too vague to follow.`,`"somewhere that way" คลุมเครือเกินกว่าจะเดินตามได้`]}},{id:`P5-Q12`,p:`grammar`,k:`tenses`,q:`My eyes really hurt. I ____ at this screen for four hours without a break.`,c:[`look`,`looked`,`am looking`,`have been looking`],a:3,e:[`The action started in the past, is still going on, and the sentence stresses how long it has lasted. That is the present perfect continuous.`,`การกระทำเริ่มในอดีต ยังดำเนินอยู่ และประโยคเน้นว่ากินเวลานานเท่าใด จึงต้องใช้ present perfect continuous`],w:{0:[`"Look" is present simple and describes a habit.`,`"look" เป็น present simple ใช้บอกกิจวัตร`],1:[`"Looked" is past simple and would mean the looking has stopped.`,`"looked" เป็น past simple ซึ่งจะหมายความว่าเลิกมองแล้ว`],2:[`"Am looking" describes this moment only, not the four-hour period.`,`"am looking" บรรยายเฉพาะขณะนี้ ไม่ครอบคลุมช่วงสี่ชั่วโมง`]}},{id:`P5-Q13`,p:`grammar`,k:`conditionals`,q:`If we ____ the earlier train, we would not have missed the opening ceremony.`,c:[`take`,`had taken`,`would take`,`have taken`],a:1,e:[`"Would not have missed" marks a third conditional about a past that cannot be changed, so the "if" clause takes the past perfect: had taken.`,`วลี "would not have missed" บ่งบอกประโยคเงื่อนไขแบบที่ 3 ซึ่งสมมติอดีตที่แก้ไขไม่ได้ อนุประโยค if จึงใช้ past perfect คือ had taken`],w:{0:[`"Take" is present simple and belongs in a first conditional.`,`"take" เป็น present simple ซึ่งใช้กับเงื่อนไขแบบที่ 1`],2:[`"Would" is never used inside the "if" clause.`,`ไม่ใช้ "would" ในอนุประโยค if`],3:[`"Have taken" is present perfect and does not match a finished past.`,`"have taken" เป็น present perfect ซึ่งไม่เข้ากับอดีตที่จบไปแล้ว`]}},{id:`P5-Q14`,p:`grammar`,k:`relative-clauses`,q:`The letters, ____ were found in an old wooden box, are now in the museum.`,c:[`who`,`that`,`which`,`what`],a:2,e:[`The commas mark a non-defining clause that adds extra information about a thing. Non-defining clauses use "which" for things and never "that".`,`เครื่องหมายจุลภาคบ่งบอกว่าเป็นอนุประโยคขยายที่ให้ข้อมูลเพิ่มเติมเกี่ยวกับสิ่งของ ซึ่งต้องใช้ "which" และไม่ใช้ "that"`],w:{0:[`"Who" is used only for people.`,`"who" ใช้กับบุคคลเท่านั้น`],1:[`"That" cannot be used in a clause set off by commas.`,`"that" ใช้ในอนุประโยคที่คั่นด้วยจุลภาคไม่ได้`],3:[`"What" is not a relative pronoun after a noun.`,`"what" ไม่ใช่คำสรรพนามเชื่อมความที่ใช้หลังคำนาม`]}},{id:`P5-Q15`,p:`grammar`,k:`passive`,q:`All the tickets ____ before we even reached the counter.`,c:[`had been sold`,`have sold`,`were selling`,`sold`],a:0,e:[`The tickets received the action, so the passive is needed, and the selling finished before another past event, so the past perfect passive is correct.`,`ตั๋วเป็นผู้ถูกกระทำ จึงต้องใช้รูป passive และการขายจบก่อนอีกเหตุการณ์ในอดีต จึงต้องใช้ passive แบบ past perfect`],w:{1:[`"Have sold" is active and would mean the tickets sold something.`,`"have sold" เป็นรูป active ซึ่งจะแปลว่าตั๋วเป็นผู้ขายสิ่งของ`],2:[`"Were selling" is active continuous and does not show a completed action.`,`"were selling" เป็น active continuous และไม่ได้แสดงว่าการกระทำเสร็จสิ้นแล้ว`],3:[`"Sold" alone is active past and makes the tickets the seller.`,`"sold" ลำพังเป็นรูป active อดีต ซึ่งทำให้ตั๋วกลายเป็นผู้ขาย`]}},{id:`P5-Q16`,p:`grammar`,k:`agreement`,q:`Twenty minutes ____ not long enough to answer a question like this properly.`,c:[`are`,`were`,`have been`,`is`],a:3,e:[`A period of time is treated as one single amount, so a phrase such as "twenty minutes" takes a singular verb.`,`ช่วงเวลาถือเป็นปริมาณเดียว ดังนั้นวลีอย่าง "twenty minutes" จึงใช้กับกริยาเอกพจน์`],w:{0:[`"Are" follows the -s ending, but the phrase means one length of time.`,`"are" ถูกดึงดูดด้วย -s ท้ายคำ แต่วลีนี้หมายถึงช่วงเวลาเดียว`],1:[`"Were" is plural and past; the sentence is about now.`,`"were" เป็นพหูพจน์และรูปอดีต แต่ประโยคนี้พูดถึงปัจจุบัน`],2:[`"Have been" is plural present perfect and does not fit.`,`"have been" เป็น present perfect รูปพหูพจน์ จึงไม่เข้ากัน`]}},{id:`P5-Q17`,p:`grammar`,k:`verb-patterns`,q:`I don’t mind ____ early if it means avoiding the worst of the traffic.`,c:[`to leave`,`leave`,`leaving`,`left`],a:2,e:[`"Mind" is always followed by the -ing form: don’t mind waiting, don’t mind leaving.`,`กริยา "mind" ต้องตามด้วยรูป -ing เสมอ เช่น don’t mind waiting, don’t mind leaving`],w:{0:[`"Mind" is never followed by "to + verb".`,`หลัง "mind" ไม่ใช้ "to + กริยา"`],1:[`The bare base form cannot follow "mind".`,`กริยารูปพื้นฐานตามหลัง "mind" ไม่ได้`],3:[`"Left" is a past form and cannot follow "mind" in this pattern.`,`"left" เป็นรูปอดีต จึงตามหลัง "mind" ในโครงสร้างนี้ไม่ได้`]}},{id:`P5-Q18`,p:`grammar`,k:`questions`,q:`Excuse me, could you tell me ____?`,c:[`where the office is`,`where is the office`,`where the office`,`where is office`],a:0,e:[`A question inside a longer sentence is an indirect question, and it keeps normal statement word order: subject before verb.`,`คำถามที่อยู่ภายในประโยคยาวเรียกว่าคำถามทางอ้อม ซึ่งต้องคงลำดับคำแบบประโยคบอกเล่า คือประธานมาก่อนกริยา`],w:{1:[`This keeps direct-question order, which indirect questions do not use.`,`รูปนี้ใช้ลำดับคำแบบคำถามตรง ซึ่งคำถามทางอ้อมไม่ใช้`],2:[`This has no verb, so the clause is incomplete.`,`รูปนี้ไม่มีกริยา อนุประโยคจึงไม่สมบูรณ์`],3:[`This has both the wrong word order and a missing article.`,`รูปนี้ทั้งลำดับคำผิดและขาดคำนำหน้านาม`]}},{id:`P5-Q19`,p:`grammar`,k:`modals`,q:`The lights are off and the car has gone. They ____ have left already.`,c:[`can`,`must`,`would`,`need`],a:1,e:[`The speaker draws a confident conclusion from visible evidence. "Must have + past participle" expresses a strong deduction about the past.`,`ผู้พูดสรุปอย่างมั่นใจจากหลักฐานที่เห็น โครงสร้าง "must have + กริยาช่องที่ 3" ใช้แสดงการคาดเดาอย่างมั่นใจเกี่ยวกับอดีต`],w:{0:[`"Can have left" is not used for deduction in a positive statement.`,`รูป "can have left" ไม่ใช้ในการคาดเดาในประโยคบอกเล่า`],2:[`"Would have left" describes an imagined past that did not happen.`,`"would have left" ใช้กับอดีตที่สมมติขึ้นและไม่ได้เกิดจริง`],3:[`"Need have" appears only in negatives, as in "You needn't have worried".`,`"need have" ใช้เฉพาะในรูปปฏิเสธ เช่น "You needn't have worried"`]}},{id:`P5-Q20`,p:`error`,k:`prepositions`,sent:`She has been «responsible» «of» the school library «since» «last year».`,q:`Which underlined part is incorrect?`,c:[`responsible`,`of`,`since`,`last year`],a:1,e:[`The fixed pattern is "responsible for": responsible for the library, responsible for checking. "Responsible to" is used only for the person you report to.`,`โครงสร้างตายตัวคือ "responsible for" เช่น responsible for the library, responsible for checking ส่วน "responsible to" ใช้กับบุคคลที่ต้องรายงานเท่านั้น`],w:{0:[`"Responsible" is the right adjective; only the preposition after it is wrong.`,`"responsible" เป็นคำคุณศัพท์ที่ถูกต้อง ส่วนที่ผิดคือคำบุพบทที่ตามมา`],2:[`"Since" correctly marks the starting point of the period.`,`"since" ใช้บอกจุดเริ่มต้นของช่วงเวลาได้ถูกต้อง`],3:[`"Last year" is a correct starting point after "since".`,`"last year" เป็นจุดเริ่มต้นที่ถูกต้องเมื่อใช้หลัง "since"`]}},{id:`P5-Q21`,p:`error`,k:`articles`,sent:`«Hardly» anybody «attended» the talk, «although» the speaker «was very famous person».`,q:`Which underlined part is incorrect?`,c:[`Hardly`,`attended`,`although`,`was very famous person`],a:3,e:[`A singular countable noun needs an article, so it must be "was a very famous person". Thai has no articles, which is why this is one of the most common errors on entrance papers.`,`คำนามเอกพจน์นับได้ต้องมี article จึงต้องเป็น "was a very famous person" ภาษาไทยไม่มี article จึงเป็นข้อผิดพลาดที่พบบ่อยที่สุดข้อหนึ่งในข้อสอบเข้า`],w:{0:[`"Hardly anybody" correctly means almost nobody.`,`"hardly anybody" แปลว่าแทบไม่มีใครเลย ซึ่งถูกต้อง`],1:[`"Attended" is the correct past simple.`,`"attended" เป็นรูป past simple ที่ถูกต้อง`],2:[`"Although" correctly introduces the contrast.`,`"although" ใช้นำหน้าความขัดแย้งได้ถูกต้อง`]}},{id:`P5-Q22`,p:`error`,k:`questions`,sent:`«I asked him where was the station», «but» he «did not» «know».`,q:`Which underlined part is incorrect?`,c:[`I asked him where was the station`,`but`,`did not`,`know`],a:0,e:[`A reported question keeps statement word order, so it must be "I asked him where the station was". The subject comes before the verb.`,`คำถามที่ถูกเล่าต่อต้องคงลำดับคำแบบประโยคบอกเล่า จึงต้องเป็น "I asked him where the station was" คือประธานมาก่อนกริยา`],w:{1:[`"But" correctly introduces the contrast.`,`"but" ใช้นำหน้าความขัดแย้งได้ถูกต้อง`],2:[`"Did not" is correct in a past simple negative.`,`"did not" ถูกต้องในประโยคปฏิเสธของ past simple`],3:[`"Know" correctly stays in the base form after "did not".`,`"know" คงรูปพื้นฐานหลัง "did not" ได้ถูกต้อง`]}},{id:`P5-Q23`,p:`error`,k:`quantifiers`,sent:`«This year» «the class» has «less students» «than» last year.`,q:`Which underlined part is incorrect?`,c:[`This year`,`the class`,`less students`,`than`],a:2,e:[`"Students" is a countable plural noun, so the comparative is "fewer students". "Less" is used with uncountable nouns such as "less water" or "less time".`,`"students" เป็นคำนามพหูพจน์ที่นับได้ รูปขั้นกว่าจึงต้องเป็น "fewer students" ส่วน "less" ใช้กับคำนามนับไม่ได้ เช่น less water หรือ less time`],w:{0:[`"This year" is a correct time phrase.`,`"this year" เป็นวลีบอกเวลาที่ถูกต้อง`],1:[`"The class" is a correct singular subject with "has".`,`"the class" เป็นประธานเอกพจน์ที่ใช้กับ "has" ได้ถูกต้อง`],3:[`"Than" correctly follows a comparative.`,`"than" ตามหลังคำขั้นกว่าได้ถูกต้อง`]}},{id:`P5-Q24`,p:`error`,k:`reported-speech`,sent:`«Yesterday» he «told to me» «that» he «had finished» the report.`,q:`Which underlined part is incorrect?`,c:[`Yesterday`,`told to me`,`that`,`had finished`],a:1,e:[`"Tell" takes a person directly, with no "to": told me. It is "say" that needs "to": said to me.`,`กริยา "tell" ตามด้วยบุคคลได้โดยตรงโดยไม่ต้องมี "to" เป็น told me ส่วนกริยาที่ต้องมี "to" คือ "say" เช่น said to me`],w:{0:[`"Yesterday" correctly matches the past verb.`,`"yesterday" สอดคล้องกับกริยาอดีตได้ถูกต้อง`],2:[`"That" correctly introduces the reported statement.`,`"that" ใช้นำหน้าประโยคบอกเล่าที่ถูกเล่าต่อได้ถูกต้อง`],3:[`"Had finished" is the correct backshift after a past reporting verb.`,`"had finished" เป็นการเลื่อนกาลถอยที่ถูกต้องหลังกริยาเล่าในรูปอดีต`]}},{id:`P5-Q25`,p:`error`,k:`adjectives-adverbs`,sent:`Half the audience «left» «before» the end «because» «the film was so bored».`,q:`Which underlined part is incorrect?`,c:[`left`,`before`,`because`,`the film was so bored`],a:3,e:[`An -ing adjective describes the thing that causes the feeling; an -ed adjective describes the person who feels it. The film was boring; the audience were bored.`,`คำคุณศัพท์รูป -ing ใช้บรรยายสิ่งที่ทำให้เกิดความรู้สึก ส่วนรูป -ed ใช้บรรยายคนที่รู้สึก ดังนั้นภาพยนตร์คือ boring และผู้ชมคือ bored`],w:{0:[`"Left" is the correct past simple of "leave".`,`"left" เป็นรูป past simple ที่ถูกต้องของ "leave"`],1:[`"Before the end" is a correct time phrase.`,`"before the end" เป็นวลีบอกเวลาที่ถูกต้อง`],2:[`"Because" correctly introduces the reason.`,`"because" ใช้นำหน้าเหตุผลได้ถูกต้อง`]}},{id:`P5-Q26`,p:`vocabulary`,k:`vocab-context`,q:`Although he had failed the test twice, his ____ never weakened, and the third time he passed.`,c:[`patience`,`politeness`,`determination`,`imagination`],a:2,e:[`He kept trying until he succeeded, so the word must describe a firm decision to reach a goal. "Determination" means exactly that.`,`เขาพยายามต่อไปจนสำเร็จ คำนี้จึงต้องหมายถึงความตั้งใจแน่วแน่ที่จะไปให้ถึงเป้าหมาย ซึ่งตรงกับคำว่า "determination"`],w:{0:[`"Patience" is the ability to wait calmly, not the will to keep trying.`,`"patience" คือความสามารถในการรอคอยอย่างสงบ ไม่ใช่ความมุ่งมั่นที่จะพยายามต่อ`],1:[`"Politeness" is about good manners and is unrelated to passing a test.`,`"politeness" เกี่ยวกับมารยาทที่ดี ซึ่งไม่เกี่ยวกับการสอบผ่าน`],3:[`"Imagination" is the ability to form new ideas in the mind.`,`"imagination" คือความสามารถในการคิดจินตนาการสิ่งใหม่`]}},{id:`P5-Q27`,p:`vocabulary`,k:`synonyms-antonyms`,q:`The witness was reluctant to speak, and it took an hour to persuade her. "Reluctant" means ____.`,c:[`unwilling`,`eager`,`ready`,`able`],a:0,e:[`It took an hour of persuading, which shows she did not want to speak. "Reluctant" means unwilling.`,`ต้องใช้เวลาโน้มน้าวถึงหนึ่งชั่วโมง แสดงว่าเธอไม่อยากพูด คำว่า "reluctant" แปลว่าไม่เต็มใจ`],w:{1:[`"Eager" means very keen — the opposite of what the sentence shows.`,`"eager" แปลว่ากระตือรือร้นอย่างยิ่ง ซึ่งตรงข้ามกับที่ประโยคบรรยาย`],2:[`"Ready" means prepared, so no persuasion would have been needed.`,`"ready" แปลว่าพร้อม ซึ่งจะทำให้ไม่ต้องโน้มน้าวเลย`],3:[`"Able" is about ability, not about willingness.`,`"able" เกี่ยวกับความสามารถ ไม่ใช่ความเต็มใจ`]}},{id:`P5-Q28`,p:`vocabulary`,k:`collocations`,q:`He always ____ his promises, even when keeping them costs him money.`,c:[`holds`,`makes`,`takes`,`keeps`],a:3,e:[`"Keep a promise" means to do what you said you would do. The words "even when keeping them costs him money" point to carrying the promise out, not to making it.`,`"keep a promise" แปลว่าทำตามที่ได้ให้คำมั่นไว้ วลี "even when keeping them costs him money" ชี้ถึงการทำตามสัญญา ไม่ใช่การให้สัญญา`],w:{0:[`"Hold a promise" is not used in English.`,`รูป "hold a promise" ไม่มีใช้ในภาษาอังกฤษ`],1:[`"Make a promise" means to say it, but this sentence is about doing it.`,`"make a promise" แปลว่าให้คำมั่น แต่ประโยคนี้พูดถึงการทำตามคำมั่น`],2:[`"Take a promise" is not a natural collocation.`,`รูป "take a promise" ไม่เป็นคำคู่ที่ใช้จริง`]}},{id:`P5-Q29`,p:`vocabulary`,k:`phrasal-verbs`,q:`It took us a few days to ____ the local accent, but after a week we understood everything.`,c:[`get over`,`get used to`,`get through`,`get away with`],a:1,e:[`"Get used to" means to become familiar with something new until it no longer feels strange.`,`"get used to" แปลว่าค่อย ๆ คุ้นเคยกับสิ่งใหม่จนไม่รู้สึกแปลกอีกต่อไป`],w:{0:[`"Get over" means to recover from an illness or a disappointment.`,`"get over" แปลว่าหายจากอาการป่วยหรือความผิดหวัง`],2:[`"Get through" means to finish a task or to reach somebody by phone.`,`"get through" แปลว่าทำงานให้เสร็จ หรือติดต่อทางโทรศัพท์ได้`],3:[`"Get away with" means to do something wrong without being punished.`,`"get away with" แปลว่าทำผิดแล้วรอดตัวไปได้`]}},{id:`P5-Q30`,p:`vocabulary`,k:`word-formation`,q:`Smoking is strictly ____ inside the building and in the car park.`,c:[`forbid`,`forbidding`,`forbidden`,`forbids`],a:2,e:[`After "is" in a passive sentence we need the past participle, and the past participle of "forbid" is the irregular form "forbidden".`,`หลัง "is" ในประโยค passive ต้องใช้กริยาช่องที่ 3 และกริยาช่องที่ 3 ของ "forbid" คือรูปอปกติ "forbidden"`],w:{0:[`"Forbid" is the base form and cannot follow "is" in a passive.`,`"forbid" เป็นรูปพื้นฐาน จึงตามหลัง "is" ในรูป passive ไม่ได้`],1:[`"Forbidding" is active continuous and would mean smoking forbids something.`,`"forbidding" เป็นรูป active continuous ซึ่งจะแปลว่าการสูบบุหรี่เป็นผู้ห้าม`],3:[`"Forbids" is a finite verb and cannot follow "is".`,`"forbids" เป็นกริยาที่ผันแล้ว จึงตามหลัง "is" ไม่ได้`]}},{id:`P5-Q31`,p:`ordering`,k:`word-order`,items:[`at the end of the street`,`a small bookshop`,`there used to be`,`ten years ago`],q:`Put the parts in the correct order to make a sentence.`,c:[`3-2-1-4`,`2-3-1-4`,`1-3-2-4`,`3-1-2-4`],a:0,e:[`"There used to be" opens the sentence, then the thing that existed, then the place, then the time: "There used to be (3) a small bookshop (2) at the end of the street (1) ten years ago (4)."`,`วลี "There used to be" ขึ้นต้นประโยค ตามด้วยสิ่งที่เคยมี สถานที่ และเวลา จึงได้ "There used to be (3) a small bookshop (2) at the end of the street (1) ten years ago (4)"`],w:{1:[`Starting with "a small bookshop" leaves "there used to be" stranded.`,`การขึ้นต้นด้วย "a small bookshop" ทำให้ "there used to be" ไม่มีที่วาง`],2:[`Starting with the place puts the opening phrase in the middle.`,`การขึ้นต้นด้วยสถานที่ทำให้วลีเปิดประโยคไปอยู่ตรงกลาง`],3:[`This puts the place before the thing that existed.`,`รูปนี้วางสถานที่ไว้หน้าสิ่งที่เคยมีอยู่`]}},{id:`P5-Q32`,p:`ordering`,k:`questions`,items:[`should I`,`how`,`this word`,`pronounce`],q:`Put the parts in the correct order to make a question.`,c:[`1-2-4-3`,`2-4-1-3`,`1-4-2-3`,`2-1-4-3`],a:3,e:[`A wh- question runs question word → modal + subject → main verb → object: "How (2) should I (1) pronounce (4) this word (3)?"`,`คำถาม wh- เรียงเป็น คำถาม → กริยาช่วย + ประธาน → กริยาหลัก → กรรม จึงได้ "How (2) should I (1) pronounce (4) this word (3)?"`],w:{0:[`Starting with "should I" puts the modal before the question word.`,`การขึ้นต้นด้วย "should I" ทำให้กริยาช่วยมาก่อนคำถาม`],1:[`"How pronounce should I" separates the modal from its subject.`,`รูป "How pronounce should I" แยกกริยาช่วยออกจากประธาน`],2:[`This also begins with the modal instead of the question word.`,`รูปนี้ก็ขึ้นต้นด้วยกริยาช่วยแทนที่จะเป็นคำถาม`]}},{id:`P5-Q33`,p:`ordering`,k:`text-cohesion`,items:[`Not at all. What seems to be the trouble?`,`Excuse me, do you mind if I ask you something?`,`It is on the second floor, next to the lift.`,`I am looking for the head teacher’s office.`],q:`Put the lines in the correct order to make a conversation.`,c:[`2-4-1-3`,`2-1-4-3`,`1-2-4-3`,`2-4-3-1`],a:1,e:[`The polite opening comes first (2), then the reply that invites the question (1), then the question itself (4), and finally the answer (3).`,`ประโยคเปิดอย่างสุภาพมาก่อน (2) ตามด้วยคำตอบที่เชิญให้ถาม (1) จากนั้นเป็นคำถามจริง (4) และปิดท้ายด้วยคำตอบ (3)`],w:{0:[`The question cannot come before the other person agrees to be asked.`,`คำถามจะมาก่อนที่อีกฝ่ายจะตอบตกลงให้ถามไม่ได้`],2:[`"Not at all" must answer "do you mind…?", so it cannot come first.`,`"Not at all" ต้องตอบคำถาม "do you mind…?" จึงมาเป็นลำดับแรกไม่ได้`],3:[`The answer about the second floor must come after the question, not before.`,`คำตอบเรื่องชั้นสองต้องมาหลังคำถาม ไม่ใช่มาก่อน`]}},{id:`P5-Q34`,p:`ordering`,k:`linking-words`,items:[`For this reason, the club now meets on Saturday mornings instead.`,`Only four members could come regularly.`,`The chess club used to meet after school on Thursdays.`,`Most students had other activities on that day.`],q:`Put the sentences in the correct order to make a paragraph.`,c:[`3-4-2-1`,`2-3-4-1`,`3-2-4-1`,`3-1-2-4`],a:2,e:[`The old arrangement opens the paragraph (3), then the problem (2), then its explanation (4), and "For this reason" draws the conclusion (1).`,`ข้อมูลเดิมเปิดย่อหน้า (3) ตามด้วยปัญหา (2) แล้วจึงเป็นคำอธิบายของปัญหา (4) และ "For this reason" สรุปปิดท้าย (1)`],w:{0:[`The explanation about other activities makes sense only after the problem is stated.`,`คำอธิบายเรื่องกิจกรรมอื่นจะสมเหตุสมผลก็ต่อเมื่อบอกปัญหาไปแล้ว`],1:[`"Only four members" needs the club to be introduced first.`,`"Only four members" ต้องมีการแนะนำชมรมมาก่อน`],3:[`"For this reason" cannot come before the reasons it draws on.`,`"For this reason" มาก่อนเหตุผลที่ใช้สรุปไม่ได้`]}},{id:`P5-Q35`,p:`cloze`,k:`tenses`,blank:1,q:`Choose the best answer for blank 1.`,c:[`is`,`has`,`were`,`was`],a:3,e:[`The paragraph describes the twenty-two years he spent walking, so the verb must be past. "Mr. Sanan" is singular, so it is "was".`,`ย่อหน้านี้เล่าถึงช่วง 22 ปีที่เขาเดินสำรวจ กริยาจึงต้องเป็นรูปอดีต และเมื่อ "Mr. Sanan" เป็นเอกพจน์ จึงใช้ "was"`],w:{0:[`"Is" is present and clashes with the past narrative around it.`,`"is" เป็นรูปปัจจุบัน ขัดกับการเล่าเรื่องในอดีตที่อยู่รอบ ๆ`],1:[`"Has interested" would change the meaning and needs a different structure.`,`"has interested" จะเปลี่ยนความหมายและต้องใช้โครงสร้างอื่น`],2:[`"Were" is plural, but the subject is one person.`,`"were" เป็นพหูพจน์ แต่ประธานคือคนคนเดียว`]}},{id:`P5-Q36`,p:`cloze`,k:`agreement`,blank:2,q:`Choose the best answer for blank 2.`,c:[`is`,`were`,`was`,`be`],a:2,e:[`The subject of the question is "a list", which is singular, and the surrounding narrative is in the past: "What use was a list of birds?"`,`ประธานของคำถามคือ "a list" ซึ่งเป็นเอกพจน์ และเรื่องที่เล่าอยู่ในรูปอดีต จึงเป็น "What use was a list of birds?"`],w:{0:[`"Is" is present, but the friends teased him in the past.`,`"is" เป็นรูปปัจจุบัน แต่เพื่อน ๆ ล้อเขาในอดีต`],1:[`"Were" is plural; the subject "a list" is singular even though "birds" follows.`,`"were" เป็นพหูพจน์ แต่ประธาน "a list" เป็นเอกพจน์แม้จะมี "birds" ตามมา`],3:[`"Be" is the base form and cannot be the verb of a finite clause.`,`"be" เป็นรูปพื้นฐาน จึงเป็นกริยาของอนุประโยคที่สมบูรณ์ไม่ได้`]}},{id:`P5-Q37`,p:`cloze`,k:`text-cohesion`,blank:3,q:`Choose the best answer for blank 3.`,c:[`what`,`which`,`that`,`who`],a:0,e:[`The law required proof of the creatures living there, without naming them. "What lived there" is a noun clause standing for that unknown group.`,`กฎหมายต้องการหลักฐานว่ามีสิ่งมีชีวิตใดอาศัยอยู่ที่นั่นโดยไม่ได้ระบุชื่อ วลี "what lived there" เป็นอนุประโยคนามที่แทนกลุ่มที่ยังไม่ระบุนั้น`],w:{1:[`"Which" needs a set of named options to choose from.`,`"which" ต้องมีตัวเลือกที่ระบุไว้ให้เลือก`],2:[`"That lived there" would need a noun in front of it.`,`"that lived there" ต้องมีคำนามอยู่ข้างหน้า`],3:[`"Who" refers to people, but the proof concerns birds and other wildlife.`,`"who" ใช้กับบุคคล แต่หลักฐานนี้เกี่ยวกับนกและสัตว์ป่า`]}},{id:`P5-Q38`,p:`cloze`,k:`verb-patterns`,blank:4,q:`Choose the best answer for blank 4.`,c:[`include`,`including`,`included`,`includes`],a:1,e:[`"Including" is a preposition-like form used to add examples to a total: eighty-one species, including eleven that appear only in the cool months.`,`คำว่า "including" ทำหน้าที่คล้ายคำบุพบท ใช้เพิ่มตัวอย่างเข้าไปในยอดรวม เช่น eighty-one species, including eleven that…`],w:{0:[`"Include" is a finite verb and would need its own subject.`,`"include" เป็นกริยาที่ผันแล้ว จึงต้องมีประธานของตัวเอง`],2:[`"Included" would have to come after the noun: "the eleven species included".`,`"included" ต้องวางไว้หลังคำนาม เช่น "the eleven species included"`],3:[`"Includes" is also finite and cannot simply follow a comma here.`,`"includes" ก็เป็นกริยาที่ผันแล้ว จึงตามหลังจุลภาคในที่นี้ไม่ได้`]}},{id:`P5-Q39`,p:`cloze`,k:`conjunctions`,blank:5,q:`Choose the best answer for blank 5.`,c:[`so`,`and`,`because`,`but`],a:3,e:[`The factory was built — which sounds like a defeat — yet it was moved away from the water. That contrast needs "but".`,`โรงงานถูกสร้างขึ้นจริง ซึ่งฟังดูเหมือนความพ่ายแพ้ แต่กลับถูกย้ายให้ห่างจากน้ำ ความขัดแย้งนี้ต้องใช้ "but"`],w:{0:[`"So" introduces a result, but moving the factory is not a result of building it.`,`"so" ใช้บอกผลลัพธ์ แต่การย้ายโรงงานไม่ใช่ผลของการสร้าง`],1:[`"And" would simply add the fact and lose the sense of a compromise won.`,`"and" เป็นการเพิ่มข้อมูลเฉย ๆ และทำให้ความหมายของการต่อรองที่ได้ผลหายไป`],2:[`"Because" would make the distance the reason the factory was built.`,`"because" จะทำให้ระยะห่างกลายเป็นเหตุผลที่สร้างโรงงาน`]}},{id:`P5-Q40`,p:`cloze`,k:`pronouns`,blank:6,q:`Choose the best answer for blank 6.`,c:[`nobody`,`anybody`,`somebody`,`everybody`],a:0,e:[`His friends used to tease him; now the notebooks have proved their worth, so the teasing has stopped completely. "Nobody laughs" says exactly that.`,`เพื่อน ๆ เคยล้อเขา แต่ตอนนี้สมุดบันทึกพิสูจน์คุณค่าแล้ว การล้อจึงหยุดลงโดยสิ้นเชิง วลี "nobody laughs" สื่อความหมายนี้พอดี`],w:{1:[`"Anybody laughs" is not used in a positive statement like this.`,`รูป "anybody laughs" ไม่ใช้ในประโยคบอกเล่าแบบนี้`],2:[`"Somebody laughs" would mean the teasing continues, which contradicts the point.`,`"somebody laughs" จะหมายความว่ายังมีคนล้ออยู่ ซึ่งขัดกับใจความ`],3:[`"Everybody laughs" reverses the meaning completely.`,`"everybody laughs" ทำให้ความหมายกลับตรงกันข้ามโดยสิ้นเชิง`]}},{id:`P5-Q41`,p:`reading`,k:`reading-main-idea`,pid:`P5-R1`,q:`What is the passage mainly about?`,c:[`Why street lighting has become so expensive`,`What makes a street feel safe to walk along`,`How researchers count pedestrians at night`,`Why towns should build more shops`],a:1,e:[`Every paragraph names one thing that changes how safe a street feels: lighting, windows, benches. That is the single thread through the whole text.`,`ทุกย่อหน้าระบุสิ่งหนึ่งที่ทำให้ถนนรู้สึกปลอดภัยต่างกัน ทั้งแสงไฟ หน้าต่าง และม้านั่ง ซึ่งเป็นแกนเดียวที่ร้อยทั้งบทอ่าน`],w:{0:[`The passage ends by saying none of this is expensive.`,`บทอ่านปิดท้ายว่าสิ่งเหล่านี้ไม่ได้มีราคาแพง`],2:[`Counting pedestrians appears once, inside one study.`,`การนับคนเดินเท้าปรากฏเพียงครั้งเดียวในงานวิจัยชิ้นหนึ่ง`],3:[`The number of shops is given as something the two streets already share.`,`จำนวนร้านค้าถูกยกมาเป็นสิ่งที่ถนนทั้งสองมีเท่ากันอยู่แล้ว`]}},{id:`P5-Q42`,p:`reading`,k:`reading-detail`,pid:`P5-R1`,q:`According to the passage, which factor matters most?`,c:[`Ground-floor windows facing the pavement`,`Bright lighting on empty walls`,`The number of shops in the street`,`The amount of traffic using the street`],a:0,e:[`The third paragraph begins, "Windows matter most of all," and explains that ground-floor rooms facing the pavement create "eyes on the street".`,`ย่อหน้าที่สามขึ้นต้นว่า "Windows matter most of all" และอธิบายว่าห้องชั้นล่างที่หันหน้าสู่ทางเท้าทำให้เกิด "eyes on the street"`],w:{1:[`The passage says a well-lit empty wall helps less than a dim shopfront with somebody inside.`,`บทอ่านระบุว่ากำแพงว่างที่สว่างช่วยได้น้อยกว่าหน้าร้านสลัว ๆ ที่มีคนอยู่ข้างใน`],2:[`The two streets have the same number of shops but different reputations.`,`ถนนทั้งสองมีร้านค้าเท่ากันแต่มีชื่อเสียงต่างกัน`],3:[`Traffic is also the same on both streets.`,`ปริมาณการจราจรของถนนทั้งสองก็เท่ากัน`]}},{id:`P5-Q43`,p:`reading`,k:`reading-detail`,pid:`P5-R1`,q:`What happened when twelve benches were added to a shopping street?`,c:[`The street became much quieter in the evening.`,`The shops began to stay open later.`,`Evening pedestrians rose by almost a third.`,`The lighting was improved at the same time.`],a:2,e:[`The fourth paragraph says the study found the benches "raised the number of evening pedestrians by almost a third within a year".`,`ย่อหน้าที่สี่ระบุว่างานวิจัยพบว่าม้านั่งเหล่านี้ "raised the number of evening pedestrians by almost a third within a year"`],w:{0:[`More people came, so the street became busier, not quieter.`,`มีคนมามากขึ้น ถนนจึงคึกคักขึ้น ไม่ใช่เงียบลง`],1:[`Shop opening hours are not mentioned in the study.`,`งานวิจัยไม่ได้กล่าวถึงเวลาเปิดปิดของร้านค้า`],3:[`Lighting is discussed in a different paragraph and not as part of this study.`,`เรื่องแสงไฟอยู่ในอีกย่อหน้าหนึ่งและไม่ใช่ส่วนหนึ่งของงานวิจัยนี้`]}},{id:`P5-Q44`,p:`reading`,k:`reading-vocab`,pid:`P5-R1`,q:`What does "eyes on the street" mean in this passage?`,c:[`Security cameras fixed to the buildings`,`Police officers patrolling regularly`,`Bright lights all along the pavement`,`People inside buildings who can see the pavement`],a:3,e:[`The phrase is defined in the sentence before it: a person walking is "visible to somebody who would notice trouble" through ground-floor windows.`,`วลีนี้ถูกอธิบายไว้ในประโยคก่อนหน้าว่าคนที่เดินอยู่ "visible to somebody who would notice trouble" ผ่านหน้าต่างชั้นล่าง`],w:{0:[`Cameras are never mentioned in the passage.`,`บทอ่านไม่ได้กล่าวถึงกล้องวงจรปิดเลย`],1:[`Police are not mentioned either.`,`บทอ่านก็ไม่ได้กล่าวถึงตำรวจ`],2:[`Lighting is a separate factor, and the passage says it matters less on its own.`,`แสงไฟเป็นปัจจัยแยกต่างหาก และบทอ่านระบุว่าลำพังแสงไฟมีผลน้อยกว่า`]}},{id:`P5-Q45`,p:`reading`,k:`reading-inference`,pid:`P5-R1`,q:`What does the last sentence suggest?`,c:[`These improvements are cheap, but nobody is responsible for making them.`,`The changes cost far more than most towns can afford.`,`Researchers disagree about what the findings mean.`,`Streets cannot really be made to feel safer.`],a:0,e:[`"None of this is expensive. It is simply rarely anybody's job." The first half removes cost as the obstacle; the second names the real one.`,`ประโยค "None of this is expensive. It is simply rarely anybody's job." ครึ่งแรกตัดเรื่องค่าใช้จ่ายออกจากการเป็นอุปสรรค ส่วนครึ่งหลังชี้อุปสรรคที่แท้จริง`],w:{1:[`The sentence says the opposite: none of it is expensive.`,`ประโยคนี้ระบุตรงกันข้ามว่าสิ่งเหล่านี้ไม่แพง`],2:[`No disagreement between researchers is mentioned.`,`ไม่มีการกล่าวถึงความเห็นที่ขัดแย้งกันระหว่างนักวิจัย`],3:[`The whole passage describes changes that did work.`,`ทั้งบทอ่านบรรยายถึงการเปลี่ยนแปลงที่ได้ผลจริง`]}},{id:`P5-Q46`,p:`reading`,k:`reading-detail`,pid:`P5-R2`,q:`How many places were available?`,c:[`Eleven`,`Thirty`,`Six`,`Three`],a:2,e:[`The second paragraph says, "there were eleven of us for six places."`,`ย่อหน้าที่สองระบุว่า "there were eleven of us for six places." คือมีที่นั่งหกที่`],w:{0:[`Eleven is the number of candidates, not places.`,`สิบเอ็ดคือจำนวนผู้เข้าสัมภาษณ์ ไม่ใช่จำนวนที่นั่ง`],1:[`Thirty is the length of the written test in minutes, and the size of the imaginary class.`,`สามสิบคือเวลาสอบข้อเขียนเป็นนาที และจำนวนเด็กในห้องเรียนสมมติ`],3:[`Three is the number of teachers at the interview.`,`สามคือจำนวนครูที่สัมภาษณ์`]}},{id:`P5-Q47`,p:`reading`,k:`reading-detail`,pid:`P5-R2`,q:`What did the writer do with the four minutes she had left?`,c:[`She left the examination room early.`,`She checked question 14 three times.`,`She wrote a new answer to question 20.`,`She spoke to one of the teachers.`],a:1,e:[`The third paragraph says, "I finished with four minutes left and checked question 14 three times."`,`ย่อหน้าที่สามระบุว่า "I finished with four minutes left and checked question 14 three times."`],w:{0:[`She stayed and used the time to check her work.`,`เธออยู่ต่อและใช้เวลาที่เหลือตรวจทานคำตอบ`],2:[`Question 20 is only the total number of questions.`,`เลข 20 เป็นเพียงจำนวนข้อทั้งหมด`],3:[`The interview with the teachers came after the written test.`,`การสัมภาษณ์กับครูเกิดขึ้นหลังสอบข้อเขียน`]}},{id:`P5-Q48`,p:`reading`,k:`reading-inference`,pid:`P5-R2`,q:`Why does the writer keep saying "fine" to her mother?`,c:[`The interview clearly went very well.`,`She does not want to speak to her mother at all.`,`She has already been told the result.`,`She genuinely does not know how it went.`],a:3,e:[`She says twice that she has "no idea" how her answers were received, and she calls "fine" something that "is not a lie and is not an answer either" — the word of somebody who cannot judge.`,`เธอบอกถึงสองครั้งว่าเธอ "no idea" ว่าคำตอบของตนเป็นอย่างไร และเรียกคำว่า "fine" ว่า "is not a lie and is not an answer either" ซึ่งเป็นคำพูดของคนที่ตัดสินไม่ได้`],w:{0:[`She writes that she cannot tell whether her answers were good or bad.`,`เธอเขียนว่าเธอบอกไม่ได้ว่าคำตอบของตนดีหรือไม่ดี`],1:[`Nothing suggests she is avoiding her mother; she answers every time.`,`ไม่มีข้อความใดบอกว่าเธอเลี่ยงแม่ เธอตอบทุกครั้งที่ถูกถาม`],2:[`The results are three weeks away.`,`ผลจะออกในอีกสามสัปดาห์`]}},{id:`P5-Q49`,p:`reading`,k:`reading-vocab`,pid:`P5-R2`,q:`In the first line, "dreading" means ____.`,c:[`looking forward to`,`forgetting about`,`fearing`,`preparing for`],a:2,e:[`She sat shaking in the car park beforehand, and the relief in "now it is over" confirms it. "Dread" means to fear something that is coming.`,`ก่อนหน้านั้นเธอนั่งตัวสั่นอยู่ในลานจอดรถ และความโล่งใจในวลี "now it is over" ก็ยืนยันเช่นนั้น คำว่า "dread" แปลว่ากลัวสิ่งที่กำลังจะมาถึง`],w:{0:[`"Looking forward to" means being happy about something coming.`,`"looking forward to" แปลว่ารู้สึกยินดีที่สิ่งนั้นกำลังจะมาถึง`],1:[`She had been thinking about it for a month, so she had not forgotten it.`,`เธอคิดถึงเรื่องนี้มาตลอดหนึ่งเดือน จึงไม่ได้ลืม`],3:[`She did prepare, but "dreading" describes the feeling, not the preparation.`,`เธอเตรียมตัวจริง แต่คำว่า "dreading" บรรยายความรู้สึก ไม่ใช่การเตรียมตัว`]}},{id:`P5-Q50`,p:`reading`,k:`reading-inference`,pid:`P5-R2`,q:`What does her answer about the one book suggest about her?`,c:[`She had not prepared for that question at all.`,`She thinks children should help decide what they learn.`,`She did not understand what the teacher was asking.`,`She believes one book is enough for any class.`],a:1,e:[`Faced with one book for thirty children, she would "ask the children what they wanted the book to be about" and write the rest with them — an answer built on including the class in the decision.`,`เมื่อมีหนังสือเล่มเดียวสำหรับเด็กสามสิบคน เธอจะ "ask the children what they wanted the book to be about" แล้วเขียนส่วนที่เหลือร่วมกัน ซึ่งเป็นคำตอบที่ตั้งอยู่บนการให้เด็กมีส่วนร่วมในการตัดสินใจ`],w:{0:[`Her answer is detailed and specific, not the answer of somebody caught out.`,`คำตอบของเธอมีรายละเอียดและเจาะจง ไม่ใช่คำตอบของคนที่ตั้งตัวไม่ทัน`],2:[`She answers the question directly, so she understood it.`,`เธอตอบคำถามได้ตรงประเด็น แสดงว่าเธอเข้าใจคำถาม`],3:[`She proposes writing more material, which shows one book is not enough.`,`เธอเสนอให้เขียนเนื้อหาเพิ่ม ซึ่งแสดงว่าหนังสือเล่มเดียวไม่เพียงพอ`]}}]},{id:`paper-6`,number:6,title:`Paper 6`,subtitle:`Elite — Evidence, Argument and Fine Print`,tier:`elite`,minutes:60,cloze:{id:`P6-CLOZE`,kind:`Informational passage`,title:`The Cost of a Missing Word`,body:[`In 1980 an eighteen-year-old was carried unconscious into a hospital in Florida. His family spoke only Spanish, and the word they used for his condition was "intoxicado", «1» in their dialect means poisoned — by food, or by something swallowed by mistake.`,`The staff heard a word that sounded like "intoxicated" and treated him «2» a drug overdose. Nobody on duty that evening was a trained interpreter.`,`He had in fact suffered a bleed in the brain. By the time the mistake «3», the delay had left him paralysed for the rest of his life.`,`The hospital settled the case for seventy-one million dollars. Since then «4» large hospitals in the United States have employed interpreters instead of relying on whoever happens to be standing nearby.`,`Translators like to tell this story, «5» it turns a question of care into a question of money, and budgets listen to money.`,`It carries a quieter lesson too. The error was not a rare term or a difficult sentence. It was «6» ordinary word that two languages had quietly agreed to disagree about.`]},passages:[{id:`P6-R1`,kind:`Informational passage`,title:`Why Maps Lie`,body:[`Every flat map of the world is wrong. This is not carelessness; it is mathematics. The Earth is a sphere, and no sphere can be flattened without stretching, tearing or squeezing something.`,`Mapmakers therefore choose what to sacrifice. The Mercator projection, drawn in 1569, keeps every angle true, which is exactly what a sailor needs: a straight line drawn on the chart is a straight course at sea. To do this it stretches the areas near the poles, and the further from the equator a country lies, the larger it appears.`,`The result is a map on which Greenland looks roughly the size of Africa. In reality Africa is about fourteen times larger. Generations of children have grown up with this picture on the classroom wall.`,`Other projections correct the areas and distort the shapes instead. The Gall–Peters projection, promoted from the 1970s as a fairer picture of the world, gives every country its true size but leaves the continents looking oddly stretched, as though they had been pulled downwards.`,`Neither map is honest, because no flat map can be. The useful question is not which projection is true, but what each one was made for — and that is a question almost nobody thinks to ask of the map on the classroom wall.`]},{id:`P6-R2`,kind:`Letter`,title:`Letter to the Editor`,body:[`Sir, — Your article on Tuesday described our town’s new twenty-kilometre-an-hour zone as "an inconvenience dressed up as safety". I should like to offer some figures.`,`In the three years before the zone there were forty-one collisions on Station Road involving a pedestrian. In the two years since, there have been four. Nobody has been killed.`,`Your reporter interviewed six drivers and nobody else. Had he walked the length of the road at four o’clock, he would have met some three hundred children leaving two schools, not one of whom was asked for an opinion.`,`I accept that the journey now takes rather longer. I have measured it myself: from the bridge to the market, the difference is ninety seconds.`,`Ninety seconds is the inconvenience. The rest of the article was about something else. — Yours, R. Thongchai, Station Road.`]}],questions:[{id:`P6-Q01`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`h«ea»t`,`br«ea»k`,`st«ea»l`,`l«ea»ve`],a:1,e:[`In "heat", "steal" and "leave" the letters "ea" say the long /iː/ sound. "Break" is one of the small group — with "great" and "steak" — where "ea" says /eɪ/.`,`ในคำว่า heat, steal และ leave ตัวอักษร "ea" ออกเสียงยาว /iː/ ส่วน break อยู่ในกลุ่มเล็ก ๆ ร่วมกับ great และ steak ที่ "ea" ออกเสียง /eɪ/`],w:{0:[`"Heat" has the long /iː/ sound.`,`คำว่า heat ออกเสียงยาว /iː/`],2:[`"Steal" has the long /iː/ sound.`,`คำว่า steal ออกเสียงยาว /iː/`],3:[`"Leave" has the long /iː/ sound.`,`คำว่า leave ออกเสียงยาว /iː/`]}},{id:`P6-Q02`,p:`pronunciation`,k:`consonant-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`«ch»emist`,`«ch»orus`,`«ch»aracter`,`«ch»allenge`],a:3,e:[`Words that came into English from Greek keep a hard /k/ for "ch": chemist, chorus, character, echo. "Challenge" came through French and keeps the ordinary /tʃ/.`,`คำที่รับมาจากภาษากรีกจะออกเสียง "ch" เป็น /k/ เช่น chemist, chorus, character, echo ส่วน challenge ผ่านมาทางภาษาฝรั่งเศสจึงออกเสียง /tʃ/ ตามปกติ`],w:{0:[`"Chemist" has the /k/ sound.`,`คำว่า chemist ออกเสียง /k/`],1:[`"Chorus" has the /k/ sound.`,`คำว่า chorus ออกเสียง /k/`],2:[`"Character" has the /k/ sound.`,`คำว่า character ออกเสียง /k/`]}},{id:`P6-Q03`,p:`pronunciation`,k:`ending-sounds`,q:`Which underlined ending is pronounced differently from the others?`,c:[`hous«es»`,`book«s»`,`cup«s»`,`lamp«s»`],a:0,e:[`After a hissing sound such as /s/ or /z/, the plural ending becomes an extra syllable /ɪz/: hous-es. After /k/ and /p/ it is simply /s/.`,`หลังเสียงเสียดแทรกอย่าง /s/ หรือ /z/ ส่วนท้ายพหูพจน์จะกลายเป็นพยางค์เพิ่ม /ɪz/ เช่น hous-es แต่หลัง /k/ และ /p/ จะออกเสียงเพียง /s/`],w:{1:[`"Books" ends in /k/, so the ending is /s/.`,`คำว่า books ลงท้ายด้วย /k/ ส่วนท้ายจึงออกเสียง /s/`],2:[`"Cups" ends in /p/, so the ending is /s/.`,`คำว่า cups ลงท้ายด้วย /p/ ส่วนท้ายจึงออกเสียง /s/`],3:[`"Lamps" also ends in /p/, so the ending is /s/.`,`คำว่า lamps ก็ลงท้ายด้วย /p/ ส่วนท้ายจึงออกเสียง /s/`]}},{id:`P6-Q04`,p:`pronunciation`,k:`word-stress`,q:`Which word has the stress on a different syllable from the others?`,c:[`economy`,`ability`,`economic`,`political`],a:2,e:[`The suffix -ic pulls the stress onto the syllable immediately before it: ec-o-NOM-ic. The other three are stressed on their second syllable: e-CON-o-my, a-BIL-i-ty, po-LIT-i-cal.`,`ปัจจัย -ic ดึงเสียงหนักมาไว้ที่พยางค์ก่อนหน้าเสมอ เช่น ec-o-NOM-ic ส่วนอีกสามคำลงเสียงหนักที่พยางค์ที่สอง คือ e-CON-o-my, a-BIL-i-ty และ po-LIT-i-cal`],w:{0:[`"Economy" is stressed on the second syllable.`,`คำว่า economy ลงเสียงหนักที่พยางค์ที่สอง`],1:[`"Ability" is stressed on the second syllable.`,`คำว่า ability ลงเสียงหนักที่พยางค์ที่สอง`],3:[`"Political" is stressed on the second syllable.`,`คำว่า political ลงเสียงหนักที่พยางค์ที่สอง`]}},{id:`P6-Q05`,p:`pronunciation`,k:`vowel-sounds`,q:`Which underlined part is pronounced differently from the others?`,c:[`fl«oo»d`,`bl«oo»d`,`c«ou»ntry`,`p«oo»l`],a:3,e:[`"Flood", "blood" and "country" all carry the short /ʌ/ sound despite their different spellings. Only "pool" keeps the long /uː/ that "oo" usually represents.`,`คำว่า flood, blood และ country ต่างออกเสียงสั้น /ʌ/ แม้จะสะกดต่างกัน มีเพียง pool เท่านั้นที่คงเสียงยาว /uː/ ซึ่งเป็นเสียงปกติของ "oo"`],w:{0:[`"Flood" has the /ʌ/ sound.`,`คำว่า flood ออกเสียง /ʌ/`],1:[`"Blood" has the /ʌ/ sound.`,`คำว่า blood ออกเสียง /ʌ/`],2:[`"Country" has the /ʌ/ sound.`,`คำว่า country ออกเสียง /ʌ/`]}},{id:`P6-Q06`,p:`conversation`,k:`situational-language`,intro:`Interviewer: Tell me about a time you failed at something.
Candidate: ____`,q:`Choose the best reply for the candidate.`,c:[`I have honestly never really failed at anything that mattered to me.`,`I ran a school fundraiser that raised almost nothing. I learned to plan the publicity first.`,`Failure is something that every single person in the world experiences at some point.`,`Could we talk about my strengths instead of my weaknesses?`],a:1,e:[`The question asks for one real example and what was learned from it. A short, specific answer with a lesson attached is exactly what the interviewer is testing for.`,`คำถามนี้ต้องการตัวอย่างจริงหนึ่งเรื่องพร้อมสิ่งที่ได้เรียนรู้ คำตอบที่สั้น เจาะจง และมีบทเรียนแนบมาด้วยคือสิ่งที่ผู้สัมภาษณ์ต้องการวัด`],w:{0:[`Claiming never to have failed avoids the question and sounds untrue.`,`การอ้างว่าไม่เคยล้มเหลวเลยเป็นการเลี่ยงคำถามและฟังดูไม่จริง`],2:[`This is a general comment about failure, not an example from the speaker.`,`ประโยคนี้เป็นความเห็นกว้าง ๆ เรื่องความล้มเหลว ไม่ใช่ตัวอย่างจากตัวผู้พูด`],3:[`Refusing the question is the one answer certain to count against a candidate.`,`การปฏิเสธไม่ตอบคำถามเป็นคำตอบเดียวที่ทำให้เสียคะแนนแน่นอน`]}},{id:`P6-Q07`,p:`conversation`,k:`conversation`,intro:`Ann: I’m not sure I follow your argument.
Ben: ____`,q:`Choose the best reply for Ben.`,c:[`Yes, it is quite an argument.`,`You should listen more carefully next time.`,`Sorry — let me put it another way.`,`I am not sure I follow it either.`],a:2,e:[`When a listener says they cannot follow you, the cooperative move is to take responsibility and rephrase, not to defend the wording you already used.`,`เมื่อผู้ฟังบอกว่าตามไม่ทัน สิ่งที่ควรทำคือรับผิดชอบและอธิบายใหม่ด้วยถ้อยคำอื่น ไม่ใช่ปกป้องถ้อยคำเดิมที่ใช้ไปแล้ว`],w:{0:[`This plays on the word "argument" and answers nothing.`,`ประโยคนี้เล่นคำกับคำว่า argument และไม่ได้ตอบอะไรเลย`],1:[`Blaming the listener makes the misunderstanding worse.`,`การโทษผู้ฟังยิ่งทำให้ความเข้าใจผิดแย่ลง`],3:[`Ben cannot fail to follow his own argument.`,`เบนจะตามความคิดของตัวเองไม่ทันไม่ได้`]}},{id:`P6-Q08`,p:`conversation`,k:`situational-language`,intro:`Shop assistant: I’m afraid we can’t refund it without a receipt.
Customer: ____`,q:`Choose the best reply for the customer.`,c:[`I understand. Would an exchange be possible instead?`,`That is a very unfair rule for a shop to have.`,`I have lost the receipt somewhere in my house.`,`Then I will simply keep it, I suppose.`],a:0,e:[`The refund is closed, so the useful reply accepts that and asks for the next best outcome. Naming a specific alternative is what keeps the conversation moving.`,`การขอคืนเงินเป็นไปไม่ได้แล้ว คำตอบที่มีประโยชน์จึงยอมรับข้อนั้นและขอทางเลือกที่ดีรองลงมา การเสนอทางเลือกที่เจาะจงคือสิ่งที่ทำให้บทสนทนาเดินต่อได้`],w:{1:[`Attacking the shop’s policy will not change the assistant’s answer.`,`การตำหนิกฎของร้านไม่ได้ทำให้คำตอบของพนักงานเปลี่ยนไป`],2:[`This explains the situation but asks for nothing.`,`ประโยคนี้อธิบายสถานการณ์แต่ไม่ได้ขออะไรเลย`],3:[`Giving up ends the conversation without trying an alternative.`,`การยอมแพ้เป็นการจบบทสนทนาโดยไม่ได้ลองทางเลือกอื่น`]}},{id:`P6-Q09`,p:`conversation`,k:`conversation`,intro:`Teacher: Would you mind swapping seats with Malee?
Student: ____`,q:`Choose the best reply for a student who is willing to move.`,c:[`Yes, I would be happy to.`,`Yes, of course I will.`,`No, I am afraid I will not.`,`Not at all — I’ll move now.`],a:3,e:[`"Would you mind…?" literally asks whether something would trouble you, so agreement is a negative: "Not at all" or "Of course not". Answering "Yes" means it would trouble you.`,`คำถาม "Would you mind…?" แปลตรงตัวว่าสิ่งนี้จะรบกวนคุณหรือไม่ การตอบตกลงจึงต้องเป็นรูปปฏิเสธ เช่น "Not at all" หรือ "Of course not" ส่วนการตอบ "Yes" แปลว่ารบกวน`],w:{0:[`"Yes" here means the swap would trouble the student — the opposite of willing.`,`"Yes" ในที่นี้แปลว่าการย้ายที่จะรบกวนนักเรียน ซึ่งตรงข้ามกับความเต็มใจ`],1:[`"Yes, of course I will" repeats the same mistake in a friendlier tone.`,`"Yes, of course I will" ผิดแบบเดียวกันเพียงแต่น้ำเสียงเป็นมิตรกว่า`],2:[`This is a clear refusal, which the student does not intend.`,`ประโยคนี้เป็นการปฏิเสธชัดเจน ซึ่งไม่ใช่สิ่งที่นักเรียนต้องการ`]}},{id:`P6-Q10`,p:`conversation`,k:`situational-language`,intro:`Nan: Your presentation ran nine minutes over.
Peter: ____`,q:`Choose the best reply for Peter.`,c:[`Nine minutes is not really very long at all.`,`Sorry — I’ll cut the case studies next time.`,`Nobody in the room seemed to mind, though.`,`The clock at the back of the hall was wrong.`],a:1,e:[`Feedback about time is best answered with an apology and a concrete change, because that is the only reply that prevents the same problem next time.`,`ข้อติชมเรื่องเวลาควรตอบด้วยคำขอโทษพร้อมการเปลี่ยนแปลงที่เป็นรูปธรรม เพราะเป็นคำตอบเดียวที่ป้องกันไม่ให้เกิดปัญหาเดิมซ้ำ`],w:{0:[`Minimising the problem dismisses the feedback.`,`การทำให้ปัญหาดูเล็กเป็นการปัดข้อติชมทิ้ง`],2:[`Other people’s patience does not answer the point about the schedule.`,`ความอดทนของคนอื่นไม่ได้ตอบประเด็นเรื่องกำหนดเวลา`],3:[`Blaming the clock is an excuse rather than a solution.`,`การโทษนาฬิกาเป็นข้อแก้ตัว ไม่ใช่ทางแก้`]}},{id:`P6-Q11`,p:`conversation`,k:`conversation`,intro:`Pim: Do you think you could look at my essay before Friday?
Joe: ____`,q:`Choose the best reply for Joe, who is busy until the weekend.`,c:[`Friday is tight, but Sunday would work if that helps.`,`Yes, I do think that I could possibly look at it at some point soon.`,`I read three essays last week already, you know.`,`Your essay is due on Friday, then.`],a:0,e:[`A helpful refusal names the problem with the request and offers a workable alternative in the same breath, so the other person leaves with an answer.`,`การปฏิเสธที่ดีคือบอกอุปสรรคของคำขอพร้อมเสนอทางเลือกที่ทำได้จริงในประโยคเดียวกัน เพื่อให้อีกฝ่ายได้คำตอบกลับไป`],w:{1:[`"At some point soon" is vague and does not commit to anything.`,`"at some point soon" คลุมเครือและไม่ได้ให้คำมั่นใด ๆ`],2:[`Counting past favours answers a different question.`,`การนับความช่วยเหลือที่เคยทำเป็นการตอบคนละคำถาม`],3:[`Repeating the deadline gives Pim no answer at all.`,`การพูดซ้ำเรื่องกำหนดส่งไม่ได้ให้คำตอบแก่พิมเลย`]}},{id:`P6-Q12`,p:`grammar`,k:`conditionals`,q:`If the committee ____ the proposal next week, building can start in January.`,c:[`would approve`,`approved`,`approves`,`had approved`],a:2,e:[`"Can start" shows a real, possible future, so this is a first conditional: present simple after "if", and the committee is singular, so "approves".`,`วลี "can start" แสดงอนาคตที่เป็นไปได้จริง จึงเป็นประโยคเงื่อนไขแบบที่ 1 คือใช้ present simple หลัง if และเมื่อ committee เป็นเอกพจน์จึงใช้ "approves"`],w:{0:[`"Would" is never used inside the "if" clause.`,`ไม่ใช้ "would" ในอนุประโยค if`],1:[`"Approved" would make this a second conditional about an unreal present.`,`"approved" จะทำให้เป็นเงื่อนไขแบบที่ 2 ซึ่งสมมติปัจจุบันที่ไม่เป็นจริง`],3:[`"Had approved" belongs to a third conditional about the past.`,`"had approved" ใช้กับเงื่อนไขแบบที่ 3 ซึ่งพูดถึงอดีต`]}},{id:`P6-Q13`,p:`grammar`,k:`relative-clauses`,q:`The scientist ____ work first suggested the idea died before it was accepted.`,c:[`which`,`whose`,`who`,`that`],a:1,e:[`The work belongs to the scientist, so the relative pronoun must show possession. "Whose" is the only one that can stand directly in front of a noun.`,`งานวิจัยนี้เป็นของนักวิทยาศาสตร์ คำสรรพนามเชื่อมความจึงต้องแสดงความเป็นเจ้าของ และมีเพียง "whose" เท่านั้นที่วางหน้าคำนามได้โดยตรง`],w:{0:[`"Which work" would refer to a choice between named pieces of work.`,`"which work" จะหมายถึงการเลือกระหว่างงานที่ระบุไว้`],2:[`"Who" would need its own verb: "the scientist who first suggested".`,`"who" ต้องมีกริยาของตัวเอง เช่น "the scientist who first suggested"`],3:[`"That work" cannot show that the work belongs to the scientist.`,`"that work" แสดงความเป็นเจ้าของงานของนักวิทยาศาสตร์ไม่ได้`]}},{id:`P6-Q14`,p:`grammar`,k:`modals`,q:`You ____ have carried all those boxes yourself — I was standing right beside you.`,c:[`must`,`can`,`should`,`needn’t`],a:3,e:[`"Needn't have + past participle" says that something was done but was unnecessary, which is exactly what the second half of the sentence explains.`,`โครงสร้าง "needn't have + กริยาช่องที่ 3" ใช้บอกว่าสิ่งนั้นทำไปแล้วแต่ไม่จำเป็นต้องทำ ซึ่งตรงกับคำอธิบายในครึ่งหลังของประโยคพอดี`],w:{0:[`"Must have carried" is a guess that he did carry them, not a comment on necessity.`,`"must have carried" เป็นการคาดเดาว่าเขายกจริง ไม่ใช่การพูดถึงความจำเป็น`],1:[`"Can have carried" is not used in a positive statement like this.`,`รูป "can have carried" ไม่ใช้ในประโยคบอกเล่าแบบนี้`],2:[`"Should have carried" would criticise him for not carrying them.`,`"should have carried" จะเป็นการตำหนิว่าเขาไม่ได้ยก`]}},{id:`P6-Q15`,p:`grammar`,k:`tenses`,q:`By the time the inspectors arrived, the company ____ the documents.`,c:[`had already destroyed`,`has already destroyed`,`already destroyed`,`was already destroying`],a:0,e:[`Two past events are compared: the destroying finished before the arriving. The earlier of two past actions takes the past perfect.`,`ประโยคนี้เปรียบเทียบเหตุการณ์ในอดีตสองเหตุการณ์ โดยการทำลายเอกสารจบก่อนการมาถึง เหตุการณ์ที่เกิดก่อนจึงต้องใช้ past perfect`],w:{1:[`"Has destroyed" is present perfect and cannot sit beside a past time marker.`,`"has destroyed" เป็น present perfect จึงอยู่คู่กับคำบอกเวลาอดีตไม่ได้`],2:[`Past simple would put both events at the same moment.`,`past simple จะทำให้ทั้งสองเหตุการณ์เกิดขึ้นพร้อมกัน`],3:[`"Was destroying" would mean the work was still unfinished as they walked in.`,`"was destroying" จะแปลว่างานยังไม่เสร็จตอนที่พวกเขาเดินเข้ามา`]}},{id:`P6-Q16`,p:`grammar`,k:`comparisons`,q:`This year’s paper was ____ than last year’s that the average mark fell by twelve points.`,c:[`much harder`,`far more harder`,`so much harder`,`harder`],a:2,e:[`The word "that" later in the sentence signals the "so … that" pattern showing a result, and before a comparative that pattern is written "so much harder … that".`,`คำว่า "that" ที่อยู่ถัดไปในประโยคบ่งบอกโครงสร้าง "so … that" ที่ใช้แสดงผลลัพธ์ และเมื่อวางหน้าคำขั้นกว่า จะเขียนว่า "so much harder … that"`],w:{0:[`"Much harder" is correct English but leaves "that" with nothing to attach to.`,`"much harder" ถูกหลักไวยากรณ์ แต่ทำให้ "that" ไม่มีที่เชื่อม`],1:[`"More" and "harder" cannot both mark the comparative.`,`ใช้ "more" คู่กับ "harder" เพื่อแสดงขั้นกว่าพร้อมกันไม่ได้`],3:[`"Harder … that" is incomplete; the result pattern needs "so".`,`"harder … that" ไม่สมบูรณ์ เพราะโครงสร้างแสดงผลลัพธ์ต้องมี "so"`]}},{id:`P6-Q17`,p:`grammar`,k:`passive`,q:`Nothing ____ about the missing files until the auditor asked.`,c:[`has said`,`was saying`,`had said`,`had been said`],a:3,e:[`"Nothing" cannot do the saying, so the verb must be passive, and the silence lasted up to a later past moment, which calls for the past perfect passive.`,`คำว่า "nothing" เป็นผู้พูดไม่ได้ กริยาจึงต้องเป็นรูป passive และความเงียบนั้นกินเวลาจนถึงอีกจุดหนึ่งในอดีต จึงต้องใช้ passive แบบ past perfect`],w:{0:[`"Has said" is active and present perfect, so it fails on both counts.`,`"has said" เป็นรูป active และ present perfect จึงผิดทั้งสองประการ`],1:[`"Was saying" is active continuous and makes "nothing" the speaker.`,`"was saying" เป็น active continuous และทำให้ "nothing" กลายเป็นผู้พูด`],2:[`"Had said" is active; it would need somebody to do the saying.`,`"had said" เป็นรูป active ซึ่งต้องมีผู้พูดเป็นประธาน`]}},{id:`P6-Q18`,p:`grammar`,k:`verb-patterns`,q:`We regret ____ you that your application has not been successful.`,c:[`telling`,`to inform`,`informing`,`to have informed`],a:1,e:[`"Regret to inform" announces bad news at the moment of speaking; "regret informing" would mean being sorry about something already said. Only "inform" also takes an object directly.`,`วลี "regret to inform" ใช้แจ้งข่าวร้ายในขณะที่พูด ส่วน "regret informing" หมายถึงเสียใจกับสิ่งที่พูดไปแล้ว และมีเพียง inform เท่านั้นที่ตามด้วยกรรมได้โดยตรง`],w:{0:[`"Regret telling" refers back to something already said.`,`"regret telling" ย้อนไปถึงสิ่งที่พูดไปแล้ว`],2:[`"Regret informing" also looks backwards, which contradicts this announcement.`,`"regret informing" ก็มองย้อนกลับไปในอดีต ซึ่งขัดกับการแจ้งข่าวครั้งนี้`],3:[`"To have informed" places the informing before the regret.`,`"to have informed" ทำให้การแจ้งเกิดขึ้นก่อนความเสียใจ`]}},{id:`P6-Q19`,p:`grammar`,k:`conjunctions`,q:`____ he had practised for months, he froze the moment he stepped on stage.`,c:[`Despite`,`However`,`Much as`,`In spite of`],a:2,e:[`What follows is a full clause with a subject and a verb, so the linker must be a conjunction. "Much as" is a formal way of saying "although".`,`ส่วนที่ตามมาเป็นอนุประโยคเต็มที่มีทั้งประธานและกริยา คำเชื่อมจึงต้องเป็นคำสันธาน และ "Much as" คือรูปทางการที่แปลว่า "แม้ว่า"`],w:{0:[`"Despite" must be followed by a noun or an -ing form.`,`หลัง "despite" ต้องเป็นคำนามหรือรูป -ing`],1:[`"However" joins two sentences and needs a full stop or semicolon before it.`,`"however" ใช้เชื่อมสองประโยคและต้องมีจุดหรืออัฒภาคอยู่ข้างหน้า`],3:[`"In spite of" also needs a noun, as in "in spite of months of practice".`,`"in spite of" ก็ต้องตามด้วยคำนาม เช่น "in spite of months of practice"`]}},{id:`P6-Q20`,p:`error`,k:`agreement`,sent:`«Neither of the two explanations were» «convincing», «so» the committee «asked for» more evidence.`,q:`Which underlined part is incorrect?`,c:[`Neither of the two explanations were`,`convincing`,`so`,`asked for`],a:0,e:[`"Neither" is the subject and is singular, so the verb must be "was". The plural noun in "of the two explanations" is inside a prepositional phrase and cannot control the verb.`,`คำว่า "neither" เป็นประธานและเป็นเอกพจน์ กริยาจึงต้องเป็น "was" ส่วนคำนามพหูพจน์ใน "of the two explanations" อยู่ในวลีบุพบทและควบคุมกริยาไม่ได้`],w:{1:[`"Convincing" is the correct -ing adjective for something that convinces.`,`"convincing" เป็นคำคุณศัพท์รูป -ing ที่ถูกต้องสำหรับสิ่งที่ทำให้เชื่อ`],2:[`"So" correctly introduces the result.`,`"so" ใช้นำหน้าผลลัพธ์ได้ถูกต้อง`],3:[`"Asked for" is the right phrase for requesting something.`,`"asked for" เป็นวลีที่ถูกต้องสำหรับการร้องขอสิ่งใดสิ่งหนึ่ง`]}},{id:`P6-Q21`,p:`error`,k:`prepositions`,sent:`She «has been» «interested» in archaeology «ever since» she «went in a museum trip» in Grade 4.`,q:`Which underlined part is incorrect?`,c:[`has been`,`interested`,`ever since`,`went in a museum trip`],a:3,e:[`Organised outings take "on": go on a trip, go on a tour, go on an excursion. "Go in" would describe entering a building.`,`การเดินทางที่จัดขึ้นใช้บุพบท "on" เช่น go on a trip, go on a tour, go on an excursion ส่วน "go in" หมายถึงการเดินเข้าไปในอาคาร`],w:{0:[`"Has been" is the right present perfect for a state that continues.`,`"has been" เป็น present perfect ที่ถูกต้องสำหรับสภาวะที่ดำเนินต่อเนื่อง`],1:[`"Interested" correctly describes the person who feels the interest.`,`"interested" ใช้บรรยายคนที่รู้สึกสนใจได้ถูกต้อง`],2:[`"Ever since" correctly marks the starting point of the period.`,`"ever since" ใช้บอกจุดเริ่มต้นของช่วงเวลาได้ถูกต้อง`]}},{id:`P6-Q22`,p:`error`,k:`nouns`,sent:`The teacher gave us «several» «advices» «about» «how to revise» for the examination.`,q:`Which underlined part is incorrect?`,c:[`several`,`advices`,`about`,`how to revise`],a:1,e:[`"Advice" is uncountable and has no plural form. To count it you use a partitive: several pieces of advice, a word of advice.`,`คำว่า "advice" เป็นคำนามนับไม่ได้และไม่มีรูปพหูพจน์ หากต้องการนับต้องใช้คำลักษณนาม เช่น several pieces of advice หรือ a word of advice`],w:{0:[`"Several" is correct once the noun is made countable with "pieces of".`,`"several" ถูกต้องเมื่อทำให้คำนามนับได้ด้วย "pieces of"`],2:[`"About" is the normal preposition after "advice".`,`"about" เป็นคำบุพบทปกติที่ใช้หลัง "advice"`],3:[`"How to revise" is a correct infinitive clause after "about".`,`"how to revise" เป็นอนุประโยค infinitive ที่ถูกต้องหลัง "about"`]}},{id:`P6-Q23`,p:`error`,k:`tenses`,sent:`«By the time we arrived, the ceremony already started», «which» «meant» we «missed» the first two speeches.`,q:`Which underlined part is incorrect?`,c:[`By the time we arrived, the ceremony already started`,`which`,`meant`,`missed`],a:0,e:[`"By the time" compares two past moments, so the earlier one needs the past perfect: "the ceremony had already started".`,`วลี "by the time" เปรียบเทียบสองช่วงเวลาในอดีต เหตุการณ์ที่เกิดก่อนจึงต้องใช้ past perfect คือ "the ceremony had already started"`],w:{1:[`"Which" correctly refers back to the whole situation just described.`,`"which" ใช้อ้างถึงสถานการณ์ทั้งหมดที่เพิ่งกล่าวไปได้ถูกต้อง`],2:[`"Meant" is the correct past simple of "mean".`,`"meant" เป็นรูป past simple ที่ถูกต้องของ "mean"`],3:[`"Missed" is correct past simple for what followed.`,`"missed" เป็น past simple ที่ถูกต้องสำหรับสิ่งที่เกิดตามมา`]}},{id:`P6-Q24`,p:`error`,k:`pronouns`,sent:`The twins are so alike «that even their mother» «sometimes» confuses «them with each others» «in photographs».`,q:`Which underlined part is incorrect?`,c:[`that even their mother`,`sometimes`,`them with each others`,`in photographs`],a:2,e:[`"Each other" is a fixed reciprocal pronoun and never takes an -s. The plural form exists only in the possessive: "each other's names".`,`วลี "each other" เป็นสรรพนามแสดงความสัมพันธ์ซึ่งกันและกันแบบตายตัวและไม่เติม -s รูปที่มี s มีเฉพาะรูปแสดงความเป็นเจ้าของ เช่น "each other's names"`],w:{0:[`"That even their mother" correctly completes the "so … that" pattern.`,`"that even their mother" ทำให้โครงสร้าง "so … that" สมบูรณ์ได้ถูกต้อง`],1:[`"Sometimes" is correctly placed before the main verb.`,`"sometimes" วางไว้หน้ากริยาหลักได้ถูกต้อง`],3:[`"In photographs" is a correct prepositional phrase.`,`"in photographs" เป็นวลีบุพบทที่ถูกต้อง`]}},{id:`P6-Q25`,p:`error`,k:`adjectives-adverbs`,sent:`The new machine works «far more efficiently», «but it is considerable more expensive» «than» «the old one».`,q:`Which underlined part is incorrect?`,c:[`far more efficiently`,`but it is considerable more expensive`,`than`,`the old one`],a:1,e:[`The word strengthens the comparative adjective "more expensive", so it must be an adverb: "considerably more expensive".`,`คำนี้ทำหน้าที่ขยายคำคุณศัพท์ขั้นกว่า "more expensive" จึงต้องเป็นคำวิเศษณ์ คือ "considerably more expensive"`],w:{0:[`"Far more efficiently" correctly uses an adverb to modify a verb.`,`"far more efficiently" ใช้คำวิเศษณ์ขยายกริยาได้ถูกต้อง`],2:[`"Than" correctly follows a comparative.`,`"than" ตามหลังคำขั้นกว่าได้ถูกต้อง`],3:[`"The old one" correctly stands for the older machine.`,`"the old one" ใช้แทนเครื่องเก่าได้ถูกต้อง`]}},{id:`P6-Q26`,p:`vocabulary`,k:`vocab-context`,q:`The evidence was ____: three witnesses, a photograph and a signed receipt all pointed the same way.`,c:[`ambiguous`,`disputed`,`circumstantial`,`overwhelming`],a:3,e:[`Three independent pieces of evidence agreeing leaves no room for doubt, and "overwhelming" describes evidence too strong to argue against.`,`หลักฐานอิสระสามชิ้นที่ชี้ไปทางเดียวกันทำให้ไม่มีที่ว่างสำหรับความสงสัย คำว่า "overwhelming" ใช้บรรยายหลักฐานที่หนักแน่นจนโต้แย้งไม่ได้`],w:{0:[`"Ambiguous" means open to more than one reading.`,`"ambiguous" แปลว่าตีความได้มากกว่าหนึ่งทาง`],1:[`"Disputed" means people disagree about it, which the sentenc
