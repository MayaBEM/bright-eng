:[{speaker:`A`,en:`I cannot finish this poster alone.`,th:`ทำโปสเตอร์นี้คนเดียวไม่ไหวเลย`},{speaker:`B`,en:`Let's work on it together. I can draw.`,th:`มาทำด้วยกันเถอะ เดี๋ยวเราวาดให้`},{speaker:`A`,en:`Perfect. I will write the text.`,th:`ดีเลย เดี๋ยวเราเขียนข้อความ`}],tip:{en:`"Let's" is short for "Let us" and is the friendliest way to suggest doing something.`,th:`"Let's" ย่อมาจาก "Let us" เป็นวิธีชวนทำอะไรบางอย่างที่เป็นมิตรที่สุด`},mistake:{en:`After "Let's" use the base verb: "Let's work", not "Let's working" or "Let's to work".`,th:`หลัง "Let's" ต้องตามด้วยกริยารูปธรรมดา เช่น "Let's work" ไม่ใช่ "Let's working" หรือ "Let's to work"`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`You and a classmate both find the project difficult. What do you suggest?`,th:`คุณกับเพื่อนต่างรู้สึกว่าโปรเจกต์นี้ยาก จะเสนออะไร`},options:[`Let's work on it together.`,`Let us to work it.`,`We should working together.`],correct:0,explain:{en:`Only the first option uses the correct pattern "Let's + base verb".`,th:`มีเพียงข้อแรกที่ใช้รูปแบบถูกต้อง คือ "Let's + กริยารูปธรรมดา"`}},dialogueGap:{lines:[{speaker:`A`,en:`The science report is due Friday and it is huge.`},{speaker:`B`,en:`____ You take part one, I will take part two.`}],blankIndex:1,options:[`Let's work on it together.`,`I left it at home.`,`Maybe next time.`],correct:0,explain:{en:`B divides the work between them, so B is suggesting teamwork.`,th:`B แบ่งงานกันทำ แสดงว่า B กำลังชวนทำงานด้วยกัน`}},speakPrompt:{en:`Invite a partner to do a school task with you and say which part you will do.`,th:`ชวนเพื่อนทำงานโรงเรียนด้วยกัน และบอกว่าคุณจะรับผิดชอบส่วนไหน`}},{id:`u2-6`,unit:2,text:`What page are we on?`,meaning:{en:`Which page is the class using right now?`,th:`ตอนนี้เราอยู่หน้าไหนแล้ว`},situation:{en:`You lost your place during a lesson.`,th:`ใช้ตอนตามบทเรียนไม่ทันว่าถึงหน้าไหนแล้ว`},ipa:`/ˌwʌt ˈpeɪdʒ ər wi ˈɑn/`,thaiRead:`วอท เพจ อาร์ วี ออน`,chunks:[`What page`,`are we on?`],stress:[`page`,`on`],pronTip:{en:`The voice falls on "on" at the end — it is a wh-question, not a yes/no question.`,th:`ลงเสียงต่ำที่ "on" ท้ายประโยค เพราะเป็นคำถาม wh- ไม่ใช่คำถามใช่หรือไม่`},example:{en:`Sorry, what page are we on?`,th:`ขอโทษนะ ตอนนี้อยู่หน้าไหนแล้ว`},dialogue:[{speaker:`A`,en:`Sorry, what page are we on?`,th:`ขอโทษค่ะ ตอนนี้อยู่หน้าไหนแล้วคะ`},{speaker:`B`,en:`Page forty-two, the blue box.`,th:`หน้าสี่สิบสอง ตรงกล่องสีฟ้าจ้ะ`},{speaker:`A`,en:`Got it, thank you.`,th:`ได้แล้วค่ะ ขอบคุณค่ะ`}],tip:{en:`Say "Sorry" first. It shows you are polite about interrupting the lesson.`,th:`ขึ้นต้นด้วย "Sorry" ก่อน จะแสดงความสุภาพเวลาขัดจังหวะบทเรียน`},mistake:{en:`English puts the preposition at the end here. "On what page are we?" is grammatical but sounds very formal and stiff.`,th:`ภาษาอังกฤษวางคำบุพบทไว้ท้ายประโยค ส่วน "On what page are we?" ถูกไวยากรณ์แต่ฟังดูเป็นทางการและแข็งมาก`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`You looked away and lost your place in the textbook. What do you ask?`,th:`คุณเผลอมองไปทางอื่นและตามในหนังสือไม่ทัน จะถามว่าอะไร`},options:[`What page are we on?`,`What page we are?`,`Which page you are?`],correct:0,explain:{en:`In questions, the verb comes before the subject: "are we". The other options keep statement word order.`,th:`ในประโยคคำถาม กริยาต้องมาก่อนประธาน คือ "are we" ส่วนตัวเลือกอื่นยังเรียงแบบประโยคบอกเล่า`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Page thirteen. We are on the second exercise.`}],blankIndex:0,options:[`What page are we on?`,`How much is this?`,`What time is it?`],correct:0,explain:{en:`B answers with a page number, so the question must be about the page.`,th:`B ตอบเป็นเลขหน้า คำถามจึงต้องเกี่ยวกับหน้าหนังสือ`}},speakPrompt:{en:`Politely interrupt a lesson to ask this question, starting with "Sorry".`,th:`ขัดจังหวะบทเรียนอย่างสุภาพเพื่อถามคำถามนี้ โดยขึ้นต้นด้วย "Sorry"`}},{id:`u2-7`,unit:2,text:`Do you have a minute?`,meaning:{en:`Do you have a short amount of time for me?`,th:`ขอเวลาสักครู่ได้ไหม`},situation:{en:`Before asking a teacher or friend a question.`,th:`ใช้ก่อนจะถามอะไรครูหรือเพื่อน`},ipa:`/du ju ˈhæv ə ˈmɪn.ɪt/`,thaiRead:`ดู ยู แฮฟ อะ มิ-นิท`,chunks:[`Do you have`,`a minute?`],stress:[`have`,`mi`],pronTip:{en:`"Minute" here is MIN-it (time), not my-NOOT (very small).`,th:`"Minute" ในที่นี้อ่านว่า มิ-นิท (นาที) ไม่ใช่ ไม-นิวท์ (เล็กมาก)`},example:{en:`Khru Ann, do you have a minute?`,th:`ครูแอนคะ ขอเวลาสักครู่ได้ไหมคะ`},dialogue:[{speaker:`A`,en:`Do you have a minute?`,th:`ขอเวลาสักครู่ได้ไหมคะ`},{speaker:`B`,en:`Sure, what is it?`,th:`ได้จ้ะ มีอะไรเหรอ`},{speaker:`A`,en:`I wanted to ask about the project deadline.`,th:`อยากถามเรื่องกำหนดส่งโปรเจกต์ค่ะ`}],tip:{en:`It shows respect for the other person's time, which makes them more willing to help.`,th:`ประโยคนี้แสดงว่าเราเกรงใจเวลาของอีกฝ่าย ทำให้เขายินดีช่วยมากขึ้น`},mistake:{en:`Do not say "Do you have time?" to a busy adult — it can sound like you want a long chat. "A minute" sounds short and easy.`,th:`อย่าพูดว่า "Do you have time?" กับผู้ใหญ่ที่ยุ่ง เพราะฟังเหมือนจะคุยยาว ส่วน "a minute" ฟังดูสั้นและไม่รบกวน`},formality:`Polite`,context:`School`,bestResponse:{prompt:{en:`Your teacher is packing up but you have one question. What do you say first?`,th:`ครูกำลังเก็บของ แต่คุณมีคำถามหนึ่งข้อ จะพูดอะไรก่อน`},options:[`Do you have a minute?`,`I need you now.`,`Stop, I have a question.`],correct:0,explain:{en:`The other two sound demanding. Asking for a minute lets the teacher say yes or "in a moment".`,th:`อีกสองข้อฟังดูเป็นการเรียกร้อง ส่วนการขอเวลาสักครู่เปิดโอกาสให้ครูตอบตกลงหรือขอเวลาสักครู่ได้`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Of course. Give me one second to finish this email.`}],blankIndex:0,options:[`Do you have a minute?`,`Have a good one!`,`Same here.`],correct:0,explain:{en:`B is checking their availability, which answers a request for a short amount of time.`,th:`B กำลังบอกว่าจะว่างเมื่อไร ซึ่งเป็นการตอบคำขอเวลาสั้น ๆ`}},speakPrompt:{en:`Ask for a minute of someone's time, then say what you want to ask about.`,th:`ขอเวลาอีกฝ่ายสักครู่ แล้วบอกว่าอยากถามเรื่องอะไร`}},{id:`u2-8`,unit:2,text:`How do you spell that?`,meaning:{en:`Please tell me the letters of that word.`,th:`สะกดยังไงเหรอ`},situation:{en:`Writing down a new word, name, or place.`,th:`ใช้ตอนจดคำใหม่ ชื่อคน หรือชื่อสถานที่`},ipa:`/ˌhaʊ də ju ˈspɛl ðæt/`,thaiRead:`ฮาว ดู ยู สเปล แดท`,chunks:[`How do you`,`spell that?`],stress:[`spell`],pronTip:{en:`Say "spell" clearly — the "sp" needs both sounds, not "sa-pell".`,th:`ออกเสียง "spell" ให้ชัด ต้องมีทั้งเสียง s และ p ติดกัน ไม่ใช่ "สะ-เปล"`},example:{en:`Your last name is Wongsawat? How do you spell that?`,th:`นามสกุลวงศ์สวัสดิ์ใช่ไหม สะกดยังไงเหรอ`},dialogue:[{speaker:`A`,en:`My name is Chanathip.`,th:`ผมชื่อชนาธิปครับ`},{speaker:`B`,en:`How do you spell that?`,th:`สะกดยังไงคะ`},{speaker:`A`,en:`C-H-A-N-A-T-H-I-P.`,th:`C-H-A-N-A-T-H-I-P ครับ`}],tip:{en:`Repeat the letters back to check: "So that is C-H-A-N...?" It prevents mistakes.`,th:`ทวนตัวสะกดกลับไปเพื่อเช็ก เช่น "So that is C-H-A-N...?" จะช่วยลดความผิดพลาด`},mistake:{en:`Do not say "How to spell that?" A question needs "do you": "How do you spell that?"`,th:`อย่าพูดว่า "How to spell that?" ประโยคคำถามต้องมี "do you" คือ "How do you spell that?"`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`Someone says a name you have never heard and you need to write it. What do you ask?`,th:`มีคนบอกชื่อที่คุณไม่เคยได้ยินและคุณต้องจด จะถามว่าอะไร`},options:[`How do you spell that?`,`How to spell that?`,`What is the spell?`],correct:0,explain:{en:`"What is the spell?" means a magic spell. The correct question form includes "do you".`,th:`"What is the spell?" หมายถึงคาถาเวทมนตร์ รูปคำถามที่ถูกต้องต้องมี "do you"`}},dialogueGap:{lines:[{speaker:`A`,en:`The road is called Sukhumvit.`},{speaker:`B`,en:`____`},{speaker:`A`,en:`S-U-K-H-U-M-V-I-T.`}],blankIndex:1,options:[`How do you spell that?`,`How much is that?`,`How far is that?`],correct:0,explain:{en:`A answers with letters, so B must have asked about spelling.`,th:`A ตอบเป็นตัวอักษร แสดงว่า B ถามเรื่องการสะกดคำ`}},speakPrompt:{en:`Ask how to spell a word, then spell your own name out loud, letter by letter.`,th:`ถามว่าคำหนึ่งสะกดยังไง แล้วสะกดชื่อของคุณเองออกเสียงทีละตัวอักษร`}},{id:`u2-9`,unit:2,text:`I'm almost done.`,meaning:{en:`I will finish very soon.`,th:`ใกล้เสร็จแล้ว`},situation:{en:`Telling someone you need just a little more time.`,th:`ใช้บอกว่าขอเวลาอีกนิดเดียวก็เสร็จ`},ipa:`/aɪm ˈɔl.moʊst ˈdʌn/`,thaiRead:`ไอม์ ออล-โมสท์ ดัน`,chunks:[`I'm almost`,`done.`],stress:[`al`,`done`],pronTip:{en:`"Done" rhymes with "sun", not "bone".`,th:`"Done" ออกเสียงคล้อง "sun" ไม่ใช่ "bone"`},example:{en:`Two more sentences and I'm almost done.`,th:`อีกสองประโยคก็ใกล้เสร็จแล้ว`},dialogue:[{speaker:`A`,en:`Are you ready to hand it in?`,th:`พร้อมส่งหรือยัง`},{speaker:`B`,en:`Almost done. Give me one minute.`,th:`ใกล้เสร็จแล้ว ขออีกหนึ่งนาที`},{speaker:`A`,en:`No rush. Take your time.`,th:`ไม่ต้องรีบ ค่อย ๆ ทำ`}],tip:{en:`Adding how much is left makes it stronger: "I am almost done — just the last question."`,th:`ถ้าบอกด้วยว่าเหลืออีกเท่าไรจะชัดขึ้น เช่น "I am almost done — just the last question."`},mistake:{en:`Say "I am almost done", not "I am almost finish". Use the adjective "done" or "finished".`,th:`พูดว่า "I am almost done" ไม่ใช่ "I am almost finish" ให้ใช้คำคุณศัพท์ "done" หรือ "finished"`},formality:`Casual`,context:`School`,bestResponse:{prompt:{en:`Your group asks if you have finished your part. You need one more minute. What do you say?`,th:`เพื่อนในกลุ่มถามว่าทำส่วนของคุณเสร็จหรือยัง คุณขอเวลาอีกหนึ่งนาที จะพูดว่าอะไร`},options:[`I'm almost done.`,`I am almost finish.`,`I almost do it.`],correct:0,explain:{en:`The natural pattern is "be + almost + done". The other two use the wrong verb form.`,th:`รูปแบบที่เป็นธรรมชาติคือ "be + almost + done" ส่วนอีกสองข้อใช้รูปกริยาผิด`}},dialogueGap:{lines:[{speaker:`A`,en:`We are leaving in five minutes!`},{speaker:`B`,en:`____ I just need to pack my bag.`}],blankIndex:1,options:[`I'm almost done.`,`I left it at home.`,`How do you spell that?`],correct:0,explain:{en:`B needs a little more time to finish packing, which matches "almost done".`,th:`B ขอเวลาอีกนิดเพื่อเก็บของให้เสร็จ ซึ่งตรงกับความหมาย "almost done"`}},speakPrompt:{en:`Tell a partner you are almost done, and say exactly what is left.`,th:`บอกเพื่อนว่าใกล้เสร็จแล้ว และบอกด้วยว่าเหลืออะไรอีก`}},{id:`u2-10`,unit:2,text:`Is this due tomorrow?`,meaning:{en:`Do we have to hand this in tomorrow?`,th:`อันนี้ส่งพรุ่งนี้ใช่ไหม`},situation:{en:`Checking a homework or project deadline.`,th:`ใช้เช็กกำหนดส่งการบ้านหรือโปรเจกต์`},ipa:`/ˌɪz ðɪs ˈdu təˈmɑr.oʊ/`,thaiRead:`อิส ดิส ดู ทู-มอ-โร`,chunks:[`Is this`,`due`,`tomorrow?`],stress:[`due`,`mor`],pronTip:{en:`"Due" sounds like "doo". Raise your voice at the end — it is a yes/no question.`,th:`"Due" ออกเสียงเหมือน "ดู" และให้ขึ้นเสียงสูงท้ายประโยค เพราะเป็นคำถามใช่หรือไม่`},example:{en:`Quick question — is this due tomorrow or Friday?`,th:`ขอถามหน่อย อันนี้ส่งพรุ่งนี้หรือวันศุกร์`},dialogue:[{speaker:`A`,en:`Is this due tomorrow?`,th:`อันนี้ส่งพรุ่งนี้ใช่ไหมคะ`},{speaker:`B`,en:`No, it is due on Friday.`,th:`ไม่จ้ะ ส่งวันศุกร์`},{speaker:`A`,en:`Great, I have more time then.`,th:`ดีเลย งั้นมีเวลาเพิ่มอีก`}],tip:{en:`"Due" is the normal school word for a deadline: "The essay is due Monday."`,th:`"Due" เป็นคำที่ใช้ในโรงเรียนเวลาพูดถึงกำหนดส่ง เช่น "The essay is due Monday."`},mistake:{en:`Do not say "Is this send tomorrow?" The adjective for a deadline is "due".`,th:`อย่าพูดว่า "Is this send tomorrow?" คำที่ใช้กับกำหนดส่งคือ "due"`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`You are not sure when the worksheet must be handed in. What do you ask?`,th:`คุณไม่แน่ใจว่าใบงานต้องส่งเมื่อไร จะถามว่าอะไร`},options:[`Is this due tomorrow?`,`Is this dues tomorrow?`,`Is this do tomorrow?`],correct:0,explain:{en:`"Due" is the correct spelling and word for a deadline; "do" is the verb and "dues" means fees.`,th:`"Due" คือคำที่ถูกต้องสำหรับกำหนดส่ง ส่วน "do" เป็นคำกริยา และ "dues" หมายถึงค่าสมาชิก`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Yes, hand it in at the start of first period.`}],blankIndex:0,options:[`Is this due tomorrow?`,`Do you have a minute?`,`What page are we on?`],correct:0,explain:{en:`B explains when to hand the work in, which answers a question about the deadline.`,th:`B บอกว่าต้องส่งเมื่อไร ซึ่งเป็นการตอบคำถามเรื่องกำหนดส่ง`}},speakPrompt:{en:`Ask about a real deadline you have this week, then say when you plan to finish it.`,th:`ถามเรื่องกำหนดส่งจริงของสัปดาห์นี้ แล้วบอกว่าคุณวางแผนจะทำเสร็จเมื่อไร`}}]},{id:3,title:`Friends & Social Situations`,titleTh:`เพื่อนและการเข้าสังคม`,accent:`#f2494b`,blurb:{en:`Make plans, invite people, agree or say no kindly, and cheer a friend up.`,th:`นัดเจอ ชวนเพื่อน ตอบตกลงหรือปฏิเสธอย่างนุ่มนวล และให้กำลังใจเพื่อน`},expressions:[{id:`u3-1`,unit:3,text:`Do you want to hang out?`,meaning:{en:`Would you like to spend free time together?`,th:`อยากไปเที่ยวเล่นด้วยกันไหม`},situation:{en:`Inviting a friend to do something relaxed, with no fixed plan.`,th:`ใช้ชวนเพื่อนไปทำอะไรสบาย ๆ โดยยังไม่มีแผนตายตัว`},ipa:`/du ju ˈwɑnt tə ˈhæŋ ˈaʊt/`,thaiRead:`ดู ยู วอน-ทู แฮง เอาท์`,chunks:[`Do you`,`want to`,`hang out?`],stress:[`want`,`hang`,`out`],pronTip:{en:`"Want to" is usually said as "WAN-na" in relaxed speech.`,th:`"Want to" ในภาษาพูดมักออกเสียงว่า "วอน-นะ"`},example:{en:`Do you want to hang out after school?`,th:`เลิกเรียนแล้วไปเที่ยวเล่นกันไหม`},dialogue:[{speaker:`A`,en:`Do you want to hang out on Saturday?`,th:`วันเสาร์ไปเที่ยวเล่นกันไหม`},{speaker:`B`,en:`Sure! What do you have in mind?`,th:`ได้เลย คิดจะไปไหนล่ะ`},{speaker:`A`,en:`Maybe the park, then bubble tea.`,th:`อาจจะไปสวนสาธารณะ แล้วไปกินชานมไข่มุก`}],tip:{en:`"Hang out" means free time with no schedule. For a specific plan, name the activity.`,th:`"Hang out" คือใช้เวลาว่างด้วยกันแบบไม่มีกำหนดการ ถ้ามีแผนชัดเจนให้บอกกิจกรรมไปเลย`},mistake:{en:`Do not say "hang out with together". Say "hang out" or "hang out with me".`,th:`อย่าพูดว่า "hang out with together" ให้ใช้ "hang out" หรือ "hang out with me"`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`You want to invite a close friend to spend Saturday together. What do you say?`,th:`คุณอยากชวนเพื่อนสนิทไปเที่ยวด้วยกันวันเสาร์ จะพูดว่าอะไร`},options:[`Do you want to hang out?`,`Do you want to hang me?`,`Will you hang out me?`],correct:0,explain:{en:`"Hang out" is the fixed phrase and needs no object here. The other options change the meaning completely.`,th:`"Hang out" เป็นสำนวนตายตัวและไม่ต้องมีกรรมตามหลัง ส่วนตัวเลือกอื่นทำให้ความหมายเปลี่ยนไปเลย`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Yeah! I am free after three.`}],blankIndex:0,options:[`Do you want to hang out?`,`Do you want to help me?`,`Are you all right?`],correct:0,explain:{en:`B talks about being free, which answers an invitation to spend time together.`,th:`B บอกว่าว่างตอนไหน ซึ่งเป็นการตอบคำชวนไปเที่ยวด้วยกัน`}},speakPrompt:{en:`Invite a friend to hang out and suggest one activity you both enjoy.`,th:`ชวนเพื่อนไปเที่ยวเล่น และเสนอหนึ่งกิจกรรมที่ทั้งคู่ชอบ`}},{id:`u3-2`,unit:3,text:`Are you free on Saturday?`,meaning:{en:`Do you have time on Saturday?`,th:`วันเสาร์ว่างไหม`},situation:{en:`Checking if someone has time before you invite them.`,th:`ใช้เช็กว่าอีกฝ่ายว่างไหมก่อนจะชวน`},ipa:`/ˌɑr ju ˈfri ɑn ˈsæt.ər.deɪ/`,thaiRead:`อาร์ ยู ฟรี ออน แซท-เทอร์-เด`,chunks:[`Are you free`,`on Saturday?`],stress:[`free`,`Sa`],pronTip:{en:`"Saturday" has three syllables with the stress first: SAT-ur-day.`,th:`"Saturday" มีสามพยางค์ ลงเสียงหนักพยางค์แรก คือ แซท-เทอร์-เด`},example:{en:`Are you free on Saturday morning?`,th:`เช้าวันเสาร์ว่างไหม`},dialogue:[{speaker:`A`,en:`Are you free on Saturday?`,th:`วันเสาร์ว่างไหม`},{speaker:`B`,en:`In the afternoon, yes. Why?`,th:`ตอนบ่ายว่างนะ ทำไมเหรอ`},{speaker:`A`,en:`There is a book fair near my house.`,th:`มีงานหนังสือใกล้บ้านเรา`}],tip:{en:`Asking first is polite — it gives your friend an easy way to say no without hurting anyone.`,th:`ถามก่อนถือว่าสุภาพ เพราะเปิดทางให้เพื่อนปฏิเสธได้ง่ายโดยไม่ทำให้ใครเสียใจ`},mistake:{en:`Use "on" with days: "on Saturday". Do not say "in Saturday" or "at Saturday".`,th:`ใช้ "on" กับวัน เช่น "on Saturday" ห้ามใช้ "in Saturday" หรือ "at Saturday"`},formality:`Neutral`,context:`Friends`,bestResponse:{prompt:{en:`Before inviting a friend somewhere, what should you ask first?`,th:`ก่อนจะชวนเพื่อนไปไหน ควรถามอะไรก่อน`},options:[`Are you free on Saturday?`,`Are you free in Saturday?`,`Do you free Saturday?`],correct:0,explain:{en:`Days take "on", and "free" is an adjective so it needs the verb "are".`,th:`วันในสัปดาห์ใช้กับ "on" และ "free" เป็นคำคุณศัพท์จึงต้องมีกริยา "are"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`I have football practice until noon, but after that I am free.`}],blankIndex:0,options:[`Are you free on Saturday?`,`Where are you now?`,`How was your weekend?`],correct:0,explain:{en:`B describes their schedule for one day, so A asked about being free that day.`,th:`B เล่าตารางของวันนั้น แสดงว่า A ถามว่าวันนั้นว่างไหม`}},speakPrompt:{en:`Ask a friend about two different days, then suggest a plan for the day they are free.`,th:`ถามเพื่อนเรื่องสองวันที่ต่างกัน แล้วเสนอแผนสำหรับวันที่เพื่อนว่าง`}},{id:`u3-3`,unit:3,text:`Sounds good to me.`,meaning:{en:`I like that idea and I agree.`,th:`ฟังดูดีนะ ตกลงเลย`},situation:{en:`Agreeing to a plan someone suggests.`,th:`ใช้ตอบตกลงกับแผนที่อีกฝ่ายเสนอ`},ipa:`/ˌsaʊndz ˈɡʊd tə mi/`,thaiRead:`ซาวนด์ส กุด ทู มี`,chunks:[`Sounds good`,`to me.`],stress:[`Sounds`,`good`],pronTip:{en:`Do not drop the "s" at the end of "Sounds" — it carries the grammar.`,th:`อย่าตัดเสียง "s" ท้ายคำ "Sounds" เพราะเป็นตัวบอกไวยากรณ์`},example:{en:`Pizza at six? Sounds good to me.`,th:`พิซซ่าตอนหกโมงเหรอ ฟังดูดีนะ`},dialogue:[{speaker:`A`,en:`How about meeting at the library at ten?`,th:`เจอกันที่ห้องสมุดสิบโมงดีไหม`},{speaker:`B`,en:`Sounds good to me. See you there.`,th:`ฟังดูดีนะ เจอกันที่นั่น`}],tip:{en:`Native speakers often shorten it to just "Sounds good!" in messages.`,th:`เจ้าของภาษามักย่อเหลือแค่ "Sounds good!" เวลาแชท`},mistake:{en:`Do not say "It sounds good for me". The natural preposition is "to me".`,th:`อย่าพูดว่า "It sounds good for me" คำบุพบทที่เป็นธรรมชาติคือ "to me"`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`A friend suggests meeting at 4 p.m. and the time works for you. What do you say?`,th:`เพื่อนเสนอให้เจอกันบ่ายสี่ และเวลานั้นคุณสะดวก จะพูดว่าอะไร`},options:[`Sounds good to me.`,`Sound good for me.`,`It is sound good.`],correct:0,explain:{en:`The verb needs "s" and the preposition is "to". The other two are not correct English.`,th:`คำกริยาต้องมี "s" และคำบุพบทคือ "to" ส่วนอีกสองข้อไม่ใช่ภาษาอังกฤษที่ถูกต้อง`}},dialogueGap:{lines:[{speaker:`A`,en:`Let us study first and get bubble tea after.`},{speaker:`B`,en:`____`}],blankIndex:1,options:[`Sounds good to me.`,`I don't get it.`,`Long time no see!`],correct:0,explain:{en:`A suggests a plan, so the natural reply is agreement.`,th:`A เสนอแผน คำตอบที่เป็นธรรมชาติจึงเป็นการตอบตกลง`}},speakPrompt:{en:`Agree to a plan and add one detail, like the time or the place.`,th:`ตอบตกลงกับแผนหนึ่งอย่าง แล้วเพิ่มรายละเอียด เช่น เวลาหรือสถานที่`}},{id:`u3-4`,unit:3,text:`I'd love to, but I can't.`,meaning:{en:`I really want to, but it is not possible for me.`,th:`อยากไปมากเลย แต่ไปไม่ได้`},situation:{en:`Saying no kindly to an invitation.`,th:`ใช้ปฏิเสธคำชวนอย่างนุ่มนวล`},ipa:`/aɪd ˈlʌv tu bət aɪ ˈkænt/`,thaiRead:`ไอด์ เลิฟ ทู บัท ไอ แคนท์`,chunks:[`I'd love to,`,`but I can't.`],stress:[`love`,`can't`],pronTip:{en:`"I'd" is short for "I would". Do not say the full form here — it sounds stiff.`,th:`"I'd" ย่อมาจาก "I would" ในที่นี้ไม่ควรพูดเต็ม เพราะฟังดูแข็ง`},example:{en:`I'd love to, but I can't — I have a family dinner.`,th:`อยากไปมากเลย แต่ไปไม่ได้ มีมื้อเย็นกับครอบครัว`},dialogue:[{speaker:`A`,en:`Do you want to come to the movies tonight?`,th:`คืนนี้ไปดูหนังกันไหม`},{speaker:`B`,en:`I'd love to, but I can't. I have to babysit my brother.`,th:`อยากไปมากเลย แต่ไปไม่ได้ ต้องดูแลน้องชาย`},{speaker:`A`,en:`No worries. Next time!`,th:`ไม่เป็นไร ไว้คราวหน้านะ`}],tip:{en:`Give a short reason after it. Saying only "I can't" can sound cold.`,th:`ควรบอกเหตุผลสั้น ๆ ต่อท้าย เพราะถ้าพูดแค่ "I can't" อาจฟังดูเย็นชา`},mistake:{en:`"I'd love to" already means "I would like to", so do not add another verb: not "I'd love to go to but I can't go."`,th:`"I'd love to" มีความหมายว่าอยากทำอยู่แล้ว จึงไม่ต้องเติมกริยาซ้ำ เช่น ไม่ต้องพูดว่า "I'd love to go to but I can't go."`},formality:`Polite`,context:`Friends`,bestResponse:{prompt:{en:`A friend invites you out but you have to help at home. What is the kindest reply?`,th:`เพื่อนชวนออกไปข้างนอก แต่คุณต้องช่วยงานที่บ้าน คำตอบที่นุ่มนวลที่สุดคืออะไร`},options:[`I'd love to, but I can't.`,`No. I am busy.`,`I do not want to.`],correct:0,explain:{en:`The first option shows you value the invitation before refusing. The others sound blunt or unfriendly.`,th:`ข้อแรกแสดงว่าเราเห็นค่าคำชวนก่อนจะปฏิเสธ ส่วนข้ออื่นฟังดูห้วนหรือไม่เป็นมิตร`}},dialogueGap:{lines:[{speaker:`A`,en:`Come to my birthday party on Sunday!`},{speaker:`B`,en:`____ We are visiting my grandparents that day.`}],blankIndex:1,options:[`I'd love to, but I can't.`,`Sounds good to me.`,`Count me in.`],correct:0,explain:{en:`B gives a reason for not coming, so the reply must be a polite refusal, not an acceptance.`,th:`B บอกเหตุผลที่ไปไม่ได้ คำตอบจึงต้องเป็นการปฏิเสธอย่างสุภาพ ไม่ใช่การตอบรับ`}},speakPrompt:{en:`Refuse an invitation politely and give one real reason.`,th:`ปฏิเสธคำชวนอย่างสุภาพ พร้อมบอกเหตุผลจริงหนึ่งข้อ`}},{id:`u3-5`,unit:3,text:`Maybe next time.`,meaning:{en:`Not now, but perhaps another day.`,th:`ไว้คราวหน้าแล้วกัน`},situation:{en:`Softly closing an invitation you cannot accept.`,th:`ใช้ปิดท้ายเวลาปฏิเสธคำชวนอย่างนุ่มนวล`},ipa:`/ˈmeɪ.bi ˈnɛkst taɪm/`,thaiRead:`เม-บี เน็กซ์ท ไทม์`,chunks:[`Maybe`,`next time.`],stress:[`May`,`next`],pronTip:{en:`Keep the "k" and "s" in "next" clear before "time".`,th:`ออกเสียง k และ s ในคำว่า "next" ให้ชัดก่อนคำว่า "time"`},example:{en:`I cannot make it today. Maybe next time!`,th:`วันนี้ไปไม่ได้ ไว้คราวหน้านะ`},dialogue:[{speaker:`A`,en:`We are going bowling. Want to come?`,th:`พวกเราจะไปโบว์ลิ่ง ไปด้วยกันไหม`},{speaker:`B`,en:`I have homework tonight. Maybe next time!`,th:`คืนนี้มีการบ้าน ไว้คราวหน้านะ`},{speaker:`A`,en:`For sure. I will let you know.`,th:`ได้เลย เดี๋ยวบอกอีกที`}],tip:{en:`Say it warmly. It tells your friend you still want to join another day.`,th:`พูดด้วยน้ำเสียงอบอุ่น เพื่อบอกเพื่อนว่ายังอยากไปด้วยในโอกาสหน้า`},mistake:{en:`Do not say "Maybe the next time" — the natural phrase has no "the".`,th:`อย่าพูดว่า "Maybe the next time" เพราะสำนวนที่ใช้จริงไม่มีคำว่า "the"`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`You just said you cannot join today. How do you keep the door open for another day?`,th:`คุณเพิ่งบอกว่าวันนี้ไปไม่ได้ จะพูดยังไงให้ยังมีโอกาสไปด้วยกันวันหลัง`},options:[`Maybe next time.`,`Never mind me.`,`Do not ask me again.`],correct:0,explain:{en:`Only the first keeps the friendship warm. The others sound like you do not want to be invited again.`,th:`มีเพียงข้อแรกที่รักษาความสัมพันธ์ไว้ ส่วนข้ออื่นฟังเหมือนไม่อยากให้ชวนอีก`}},dialogueGap:{lines:[{speaker:`A`,en:`Too bad you cannot come today.`},{speaker:`B`,en:`Yeah. ____ Have fun, everyone!`}],blankIndex:1,options:[`Maybe next time.`,`Same here.`,`How do you spell that?`],correct:0,explain:{en:`B cannot come today but wants to join another day, which is exactly this expression.`,th:`B ไปไม่ได้วันนี้แต่อยากไปในโอกาสหน้า ซึ่งตรงกับสำนวนนี้พอดี`}},speakPrompt:{en:`Turn down an invitation using two expressions together: "I'd love to, but I can't. Maybe next time."`,th:`ปฏิเสธคำชวนโดยใช้สองสำนวนต่อกัน คือ "I'd love to, but I can't. Maybe next time."`}},{id:`u3-6`,unit:3,text:`Count me in.`,meaning:{en:`Include me — I want to join.`,th:`นับฉันด้วยนะ / เอาด้วย`},situation:{en:`Happily accepting a plan or joining a group activity.`,th:`ใช้ตอบรับแผนหรือขอร่วมกิจกรรมกลุ่มอย่างเต็มใจ`},ipa:`/ˈkaʊnt mi ˈɪn/`,thaiRead:`เคานท์ มี อิน`,chunks:[`Count me`,`in.`],stress:[`Count`,`in`],pronTip:{en:`"Count me" links to "COUNT-mee", then push the final "in" a little.`,th:`"Count me" พูดติดกันเป็น "เคานท์-มี" แล้วเน้นคำว่า "in" ท้ายประโยคนิดหนึ่ง`},example:{en:`A beach trip? Count me in!`,th:`ไปทะเลเหรอ เอาด้วยสิ`},dialogue:[{speaker:`A`,en:`We are starting a study group on Thursdays.`,th:`พวกเรากำลังจะตั้งกลุ่มติวทุกวันพฤหัส`},{speaker:`B`,en:`Count me in. What time?`,th:`เอาด้วยสิ กี่โมงเหรอ`},{speaker:`A`,en:`Four o clock in room 12.`,th:`สี่โมงที่ห้อง 12`}],tip:{en:`It sounds energetic and positive — great for group plans with friends.`,th:`ฟังดูกระตือรือร้นและเป็นบวก เหมาะกับแผนกลุ่มกับเพื่อน ๆ`},mistake:{en:`The opposite is "Count me out" (I will not join). Do not mix them up.`,th:`คำตรงข้ามคือ "Count me out" (ไม่ร่วมด้วย) อย่าใช้สลับกัน`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friends are planning a weekend hike and you really want to join. What do you say?`,th:`เพื่อน ๆ กำลังวางแผนไปเดินป่าสุดสัปดาห์ และคุณอยากไปมาก จะพูดว่าอะไร`},options:[`Count me in.`,`Count me out.`,`Count on me later.`],correct:0,explain:{en:`"Count me out" means you will not join, and "Count on me" means "you can trust me" — a different meaning.`,th:`"Count me out" แปลว่าไม่ร่วมด้วย ส่วน "Count on me" แปลว่าไว้ใจฉันได้ ซึ่งคนละความหมาย`}},dialogueGap:{lines:[{speaker:`A`,en:`We need one more player for the team.`},{speaker:`B`,en:`____ I can play on Saturdays.`}],blankIndex:1,options:[`Count me in.`,`Count me out.`,`Maybe next time.`],correct:0,explain:{en:`B says when they can play, which shows they are joining, not refusing.`,th:`B บอกว่าเล่นได้วันไหน แสดงว่าตอบรับเข้าร่วม ไม่ใช่ปฏิเสธ`}},speakPrompt:{en:`Accept a group plan enthusiastically and ask one question about the details.`,th:`ตอบรับแผนกลุ่มอย่างกระตือรือร้น แล้วถามรายละเอียดหนึ่งคำถาม`}},{id:`u3-7`,unit:3,text:`I'm not so sure about that.`,meaning:{en:`I do not completely agree.`,th:`ไม่ค่อยแน่ใจเท่าไรนะ (ไม่ค่อยเห็นด้วย)`},situation:{en:`Disagreeing politely without starting an argument.`,th:`ใช้แสดงความไม่เห็นด้วยอย่างสุภาพโดยไม่ทำให้เกิดการเถียงกัน`},ipa:`/aɪm ˌnɑt soʊ ˈʃʊr əˈbaʊt ðæt/`,thaiRead:`ไอม์ นอท โซ ชัวร์ อะ-เบาท์ แดท`,chunks:[`I'm not`,`so sure`,`about that.`],stress:[`not`,`sure`],pronTip:{en:`Slow down on "not so sure" — that is where the meaning lives.`,th:`พูดช้าลงตรง "not so sure" เพราะเป็นจุดที่สื่อความหมายหลัก`},example:{en:`I'm not so sure about that. Let us check the rule again.`,th:`ไม่ค่อยแน่ใจเท่าไรนะ ลองเช็กกฎอีกทีดีกว่า`},dialogue:[{speaker:`A`,en:`The test is definitely on Monday.`,th:`สอบวันจันทร์แน่นอน`},{speaker:`B`,en:`I'm not so sure about that. The teacher said Tuesday.`,th:`ไม่ค่อยแน่ใจเท่าไรนะ ครูบอกว่าวันอังคาร`},{speaker:`A`,en:`Let us ask her tomorrow.`,th:`พรุ่งนี้ไปถามครูกันดีกว่า`}],tip:{en:`This is much softer than "You are wrong." Use it to disagree without hurting feelings.`,th:`ประโยคนี้นุ่มกว่า "You are wrong" มาก ใช้แสดงความไม่เห็นด้วยโดยไม่ทำให้อีกฝ่ายเสียความรู้สึก`},mistake:{en:`Avoid saying "You are wrong" to friends and teachers — it sounds harsh in English.`,th:`หลีกเลี่ยงการพูดว่า "You are wrong" กับเพื่อนหรือครู เพราะในภาษาอังกฤษฟังดูแรง`},formality:`Polite`,context:`General`,bestResponse:{prompt:{en:`A classmate states a fact you believe is incorrect. What is the polite way to disagree?`,th:`เพื่อนพูดข้อมูลที่คุณคิดว่าไม่ถูกต้อง จะแย้งอย่างสุภาพว่าอะไร`},options:[`I'm not so sure about that.`,`That is totally wrong.`,`You never know anything.`],correct:0,explain:{en:`The first softens the disagreement. The others attack the person instead of the idea.`,th:`ข้อแรกทำให้การแย้งนุ่มลง ส่วนข้ออื่นเป็นการโจมตีตัวบุคคลแทนที่จะพูดถึงเนื้อหา`}},dialogueGap:{lines:[{speaker:`A`,en:`Whales are the biggest fish in the ocean.`},{speaker:`B`,en:`____ I think whales are mammals.`}],blankIndex:1,options:[`I'm not so sure about that.`,`Sounds good to me.`,`Count me in.`],correct:0,explain:{en:`B corrects A gently, so a soft disagreement fits, not agreement.`,th:`B แย้ง A อย่างนุ่มนวล จึงต้องใช้ประโยคแสดงความไม่เห็นด้วยแบบสุภาพ ไม่ใช่การเห็นด้วย`}},speakPrompt:{en:`Disagree politely with one statement, then give your own idea in one sentence.`,th:`แย้งข้อความหนึ่งอย่างสุภาพ แล้วบอกความคิดของคุณหนึ่งประโยค`}},{id:`u3-8`,unit:3,text:`Don't worry about it.`,meaning:{en:`It is not a problem — please relax.`,th:`ไม่ต้องกังวลหรอก / ไม่เป็นไร`},situation:{en:`Someone apologises or feels bad about something small.`,th:`ใช้ตอนมีคนขอโทษหรือรู้สึกผิดกับเรื่องเล็กน้อย`},ipa:`/ˈdoʊnt ˈwɜr.i əˈbaʊt ɪt/`,thaiRead:`โดนท์ เวอ-รี อะ-เบาท์-ทิท`,chunks:[`Don't worry`,`about it.`],stress:[`Don't`,`wor`],pronTip:{en:`"About it" links to "uh-BOW-tit".`,th:`"About it" พูดติดกันเป็น "อะ-เบา-ทิท"`},example:{en:`You spilled a little water? Don't worry about it.`,th:`ทำน้ำหกนิดเดียวเองเหรอ ไม่ต้องกังวลหรอก`},dialogue:[{speaker:`A`,en:`I am so sorry I am late.`,th:`ขอโทษจริง ๆ ที่มาสาย`},{speaker:`B`,en:`Don't worry about it. We just started.`,th:`ไม่ต้องกังวลหรอก เราเพิ่งเริ่มเอง`}],tip:{en:`For a bigger mistake, add a solution too: "Don't worry about it — we can fix it together."`,th:`ถ้าเป็นความผิดพลาดใหญ่ ให้เสนอทางแก้ด้วย เช่น "Don't worry about it — we can fix it together."`},mistake:{en:`It answers an apology or a worry. Do not use it to reply to "Thank you" — say "No problem" instead.`,th:`ใช้ตอบคำขอโทษหรือความกังวล ไม่ใช้ตอบคำว่า "Thank you" ซึ่งควรตอบว่า "No problem" แทน`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`A classmate apologises for bumping your desk. What do you say?`,th:`เพื่อนขอโทษที่เดินชนโต๊ะคุณ จะพูดว่าอะไร`},options:[`Don't worry about it.`,`You should be careful!`,`Never do that again.`],correct:0,explain:{en:`It was a small accident, so a kind reply is best. The others sound angry.`,th:`เป็นอุบัติเหตุเล็กน้อย จึงควรตอบอย่างใจดี ส่วนข้ออื่นฟังดูโกรธ`}},dialogueGap:{lines:[{speaker:`A`,en:`Sorry, I forgot to bring your book back.`},{speaker:`B`,en:`____ Bring it whenever you can.`}],blankIndex:1,options:[`Don't worry about it.`,`I left it at home.`,`Are you free on Saturday?`],correct:0,explain:{en:`B is comforting A after an apology and offering a relaxed deadline.`,th:`B กำลังปลอบ A หลังจากที่ A ขอโทษ และบอกว่าไม่ต้องรีบคืน`}},speakPrompt:{en:`Reply to a friend's apology, then add one kind sentence.`,th:`ตอบคำขอโทษของเพื่อน แล้วเพิ่มประโยคปลอบใจอีกหนึ่งประโยค`}},{id:`u3-9`,unit:3,text:`Don't give up!`,meaning:{en:`Keep trying — do not stop now.`,th:`อย่ายอมแพ้นะ`},situation:{en:`Encouraging a friend who is finding something hard.`,th:`ใช้ให้กำลังใจเพื่อนที่กำลังเจอเรื่องยาก`},ipa:`/ˈdoʊnt ɡɪv ˈʌp/`,thaiRead:`โดนท์ กิฟ อัพ`,chunks:[`Don't`,`give up!`],stress:[`Don't`,`up`],pronTip:{en:`"Give up" links into "gi-VUP" with the stress on "up".`,th:`"Give up" พูดติดกันเป็น "กิ-วัพ" โดยลงเสียงหนักที่ "up"`},example:{en:`You're close to the answer. Don't give up!`,th:`ใกล้ได้คำตอบแล้ว อย่ายอมแพ้นะ`},dialogue:[{speaker:`A`,en:`I have tried this problem five times.`,th:`ข้อนี้ลองทำมาห้ารอบแล้ว`},{speaker:`B`,en:`Don't give up! Let us try a different way.`,th:`อย่ายอมแพ้นะ ลองวิธีอื่นกัน`},{speaker:`A`,en:`Okay, one more try.`,th:`โอเค ลองอีกรอบ`}],tip:{en:`Follow it with real help, not just words. Encouragement plus a plan works best.`,th:`หลังพูดให้กำลังใจ ควรช่วยจริง ๆ ด้วย เพราะกำลังใจบวกแผนช่วยได้มากที่สุด`},mistake:{en:`"Give up" means to stop trying. Do not confuse it with "give in", which means to finally agree.`,th:`"Give up" แปลว่าเลิกพยายาม อย่าสับสนกับ "give in" ที่แปลว่ายอมทำตามในที่สุด`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend wants to quit practising for the speech contest. What do you say?`,th:`เพื่อนอยากเลิกซ้อมสำหรับการแข่งพูด จะพูดว่าอะไร`},options:[`Don't give up!`,`Then just quit.`,`That is your problem.`],correct:0,explain:{en:`Only the first encourages your friend. The others push them to stop or reject them.`,th:`มีเพียงข้อแรกที่ให้กำลังใจเพื่อน ส่วนข้ออื่นเป็นการผลักให้เลิกหรือปฏิเสธเพื่อน`}},dialogueGap:{lines:[{speaker:`A`,en:`I keep losing every match.`},{speaker:`B`,en:`____ You have improved so much this month.`}],blankIndex:1,options:[`Don't give up!`,`Count me in.`,`Is this due tomorrow?`],correct:0,explain:{en:`B is encouraging A, so an expression of encouragement fits.`,th:`B กำลังให้กำลังใจ A จึงต้องใช้สำนวนให้กำลังใจ`}},speakPrompt:{en:`Encourage a friend who is struggling, and offer one specific way to help.`,th:`ให้กำลังใจเพื่อนที่กำลังลำบาก และเสนอวิธีช่วยที่ชัดเจนหนึ่งอย่าง`}},{id:`u3-10`,unit:3,text:`Let's keep in touch.`,meaning:{en:`Let us stay in contact with each other.`,th:`ติดต่อกันไว้นะ`},situation:{en:`Saying goodbye to someone you may not see often.`,th:`ใช้ตอนลาจากคนที่อาจไม่ได้เจอกันบ่อย`},ipa:`/lɛts ˌkip ɪn ˈtʌtʃ/`,thaiRead:`เล็ทส์ คีพ อิน ทัช`,chunks:[`Let's keep`,`in touch.`],stress:[`keep`,`touch`],pronTip:{en:`"In touch" links to "in-TUCH" with a clear "ch" at the end.`,th:`"In touch" พูดติดกันเป็น "อิน-ทัช" และออกเสียง ch ท้ายคำให้ชัด`},example:{en:`It was great seeing you. Let's keep in touch!`,th:`ดีใจที่ได้เจอนะ ติดต่อกันไว้ล่ะ`},dialogue:[{speaker:`A`,en:`I am moving to Chiang Mai next month.`,th:`เดือนหน้าเราจะย้ายไปเชียงใหม่`},{speaker:`B`,en:`Let's keep in touch. I will message you.`,th:`ติดต่อกันไว้นะ เดี๋ยวเราทักไปหา`},{speaker:`A`,en:`Please do!`,th:`ทักมาเลยนะ`}],tip:{en:`Make it real by adding how: "Let's keep in touch — I will message you on Sunday."`,th:`ทำให้เป็นจริงด้วยการบอกวิธี เช่น "Let's keep in touch — I will message you on Sunday."`},mistake:{en:`The phrase is "keep in touch", not "keep in contact with touch" or "keep touching".`,th:`สำนวนคือ "keep in touch" ไม่ใช่ "keep in contact with touch" หรือ "keep touching"`},formality:`Neutral`,context:`Online`,bestResponse:{prompt:{en:`A friend from camp is going home to another province. What do you say at the end?`,th:`เพื่อนจากค่ายกำลังจะกลับต่างจังหวัด จะพูดอะไรตอนลา`},options:[`Let's keep in touch.`,`Long time no see!`,`Do you have a minute?`],correct:0,explain:{en:`You are separating, so you plan future contact. The others are for meeting or interrupting.`,th:`กำลังจะแยกจากกัน จึงพูดถึงการติดต่อกันในอนาคต ส่วนข้ออื่นใช้ตอนเจอกันหรือตอนขอเวลา`}},dialogueGap:{lines:[{speaker:`A`,en:`Today is my last day at this school.`},{speaker:`B`,en:`____ Send me your new number.`}],blankIndex:1,options:[`Let's keep in touch.`,`Have a good one!`,`I don't get it.`],correct:0,explain:{en:`B asks for a phone number, which shows they want to stay in contact.`,th:`B ขอเบอร์โทร แสดงว่าอยากติดต่อกันต่อไป`}},speakPrompt:{en:`Say goodbye to someone moving away, and say exactly how you will stay in contact.`,th:`กล่าวลาคนที่กำลังจะย้ายไป และบอกให้ชัดว่าจะติดต่อกันด้วยวิธีไหน`}}]},{id:4,title:`Feelings & Reactions`,titleTh:`ความรู้สึกและการตอบรับ`,accent:`#ffd54a`,blurb:{en:`React like a real listener — show surprise, excitement, sympathy, and pride in one short line.`,th:`ตอบรับแบบผู้ฟังตัวจริง แสดงความประหลาดใจ ตื่นเต้น เห็นใจ และภูมิใจได้ในประโยคสั้น ๆ`},expressions:[{id:`u4-1`,unit:4,text:`No way!`,meaning:{en:`I am very surprised — I can hardly believe it.`,th:`ไม่จริงน่า / ไม่อยากเชื่อเลย`},situation:{en:`Reacting to surprising news from a friend.`,th:`ใช้ตอบรับข่าวที่น่าประหลาดใจจากเพื่อน`},ipa:`/ˌnoʊ ˈweɪ/`,thaiRead:`โน เว`,chunks:[`No`,`way!`],stress:[`way`],pronTip:{en:`Push your voice up high on "way" — the tone carries the surprise.`,th:`ขึ้นเสียงสูงที่คำว่า "way" เพราะน้ำเสียงคือตัวสื่อความประหลาดใจ`},example:{en:`You met the team captain? No way!`,th:`เจอกัปตันทีมด้วยเหรอ ไม่จริงน่า`},dialogue:[{speaker:`A`,en:`I got first place in the writing contest.`,th:`เราได้ที่หนึ่งการแข่งเขียนเรียงความ`},{speaker:`B`,en:`No way! That is amazing!`,th:`ไม่จริงน่า สุดยอดไปเลย`},{speaker:`A`,en:`I could not believe it either.`,th:`เราก็ไม่อยากเชื่อเหมือนกัน`}],mistake:{en:`"No way!" as a reaction means surprise. Said flatly as an answer, it means a firm refusal — so tone matters a lot.`,th:`"No way!" ถ้าใช้ตอบรับข่าวจะแปลว่าประหลาดใจ แต่ถ้าพูดเรียบ ๆ เป็นคำตอบจะแปลว่าปฏิเสธเด็ดขาด น้ำเสียงจึงสำคัญมาก`},tip:{en:`It is casual. With a teacher or stranger, "Really?" or "That is surprising!" is safer.`,th:`สำนวนนี้เป็นกันเอง ถ้าคุยกับครูหรือคนแปลกหน้า ใช้ "Really?" หรือ "That is surprising!" จะปลอดภัยกว่า`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your best friend says they are moving to Japan next month. What do you say?`,th:`เพื่อนสนิทบอกว่าเดือนหน้าจะย้ายไปญี่ปุ่น จะพูดว่าอะไร`},options:[`No way!`,`Never mind.`,`Not at all.`],correct:0,explain:{en:`"Never mind" cancels something and "Not at all" answers thanks. Only "No way!" shows surprise.`,th:`"Never mind" ใช้ยกเลิกเรื่องที่พูด ส่วน "Not at all" ใช้ตอบคำขอบคุณ มีเพียง "No way!" ที่แสดงความประหลาดใจ`}},dialogueGap:{lines:[{speaker:`A`,en:`My little brother finished the whole puzzle in ten minutes.`},{speaker:`B`,en:`____ He is only five!`}],blankIndex:1,options:[`No way!`,`Same here.`,`Maybe next time.`],correct:0,explain:{en:`B is amazed at something hard to believe, which is exactly this reaction.`,th:`B รู้สึกทึ่งกับเรื่องที่แทบไม่น่าเชื่อ ซึ่งตรงกับสำนวนนี้พอดี`}},speakPrompt:{en:`React to two pieces of surprising news, changing your tone each time.`,th:`ตอบรับข่าวน่าประหลาดใจสองข่าว โดยเปลี่ยนน้ำเสียงในแต่ละครั้ง`}},{id:`u4-2`,unit:4,text:`That's awesome!`,meaning:{en:`That is really great news.`,th:`เยี่ยมไปเลย / สุดยอด`},situation:{en:`Showing excitement about something good that happened.`,th:`ใช้แสดงความตื่นเต้นดีใจกับเรื่องดี ๆ ที่เกิดขึ้น`},ipa:`/ðæts ˈɔ.səm/`,thaiRead:`แดทส์ ออ-เซิม`,chunks:[`That's`,`awesome!`],stress:[`awe`],pronTip:{en:`"Awesome" has two syllables with stress first: AW-sum.`,th:`"Awesome" มีสองพยางค์ ลงเสียงหนักพยางค์แรก คือ ออ-เซิม`},example:{en:`You finished the whole book? That's awesome!`,th:`อ่านจบทั้งเล่มเลยเหรอ เยี่ยมไปเลย`},dialogue:[{speaker:`A`,en:`I finally learned to ride a bike.`,th:`ในที่สุดก็ขี่จักรยานเป็นแล้ว`},{speaker:`B`,en:`That's awesome! How long did it take?`,th:`เยี่ยมไปเลย ใช้เวลานานไหม`},{speaker:`A`,en:`About three weekends.`,th:`ประมาณสามสุดสัปดาห์`}],tip:{en:`Add a question after it. Reacting plus asking makes you sound like a great listener.`,th:`ถามต่อหลังจากพูดสำนวนนี้ การตอบรับพร้อมถามต่อจะทำให้เราดูเป็นผู้ฟังที่ดี`},mistake:{en:`Do not say "You are awesome" when you mean the news. Use "That's awesome" for the event.`,th:`อย่าพูดว่า "You are awesome" ถ้าหมายถึงเรื่องราว ให้ใช้ "That's awesome" กับเหตุการณ์`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend says their family adopted a puppy. What is an excited reaction?`,th:`เพื่อนบอกว่าครอบครัวรับลูกหมามาเลี้ยง จะตอบรับด้วยความตื่นเต้นว่าอะไร`},options:[`That's awesome!`,`That is too bad.`,`That is frustrating.`],correct:0,explain:{en:`The news is happy, so the reaction must be positive. The other two are for bad news.`,th:`เป็นข่าวดี การตอบรับจึงต้องเป็นบวก ส่วนอีกสองข้อใช้กับข่าวร้าย`}},dialogueGap:{lines:[{speaker:`A`,en:`Our team made it to the final!`},{speaker:`B`,en:`____ When is the match?`}],blankIndex:1,options:[`That's awesome!`,`That is too bad.`,`I'd love to, but I can't.`],correct:0,explain:{en:`Reaching the final is good news, so an excited reaction fits.`,th:`การเข้ารอบชิงเป็นข่าวดี จึงเหมาะกับการตอบรับแบบตื่นเต้นดีใจ`}},speakPrompt:{en:`React to good news and ask one follow-up question about it.`,th:`ตอบรับข่าวดีและถามต่ออีกหนึ่งคำถามเกี่ยวกับเรื่องนั้น`}},{id:`u4-3`,unit:4,text:`I can't wait!`,meaning:{en:`I am very excited about something in the future.`,th:`รอไม่ไหวแล้ว / ตื่นเต้นมาก`},situation:{en:`Talking about a trip, event, or plan you are looking forward to.`,th:`ใช้พูดถึงทริป งาน หรือแผนที่กำลังตั้งตารอ`},ipa:`/aɪ ˈkænt ˈweɪt/`,thaiRead:`ไอ แคนท์ เวท`,chunks:[`I can't`,`wait!`],stress:[`can't`,`wait`],pronTip:{en:`In American English "can't" has a short, sharp vowel — do not stretch it into "cahn't".`,th:`ในสำเนียงอเมริกัน "can't" ออกเสียงสระสั้นและคม อย่าลากเป็น "คานท์"`},example:{en:`We are going to the beach on Friday. I can't wait!`,th:`วันศุกร์เราจะไปทะเลกัน รอไม่ไหวแล้ว`},dialogue:[{speaker:`A`,en:`The school trip is next week.`,th:`ทัศนศึกษาสัปดาห์หน้าแล้วนะ`},{speaker:`B`,en:`I can't wait! I have already packed.`,th:`รอไม่ไหวแล้ว เก็บกระเป๋าเรียบร้อยแล้วด้วย`},{speaker:`A`,en:`Me too. It is going to be fun.`,th:`เหมือนกันเลย ต้องสนุกแน่`}],tip:{en:`To say what you are excited about, add "to" plus a verb: "I can't wait to see it."`,th:`ถ้าจะบอกว่าตื่นเต้นเรื่องอะไร ให้เติม "to" ตามด้วยกริยา เช่น "I can't wait to see it."`},mistake:{en:`It does not mean you have no time. It means you are excited.`,th:`สำนวนนี้ไม่ได้แปลว่าไม่มีเวลารอ แต่แปลว่าตื่นเต้นมาก`},formality:`Casual`,context:`General`,bestResponse:{prompt:{en:`Your favourite singer is coming to Bangkok next month. What do you say?`,th:`นักร้องที่คุณชอบจะมากรุงเทพฯ เดือนหน้า จะพูดว่าอะไร`},options:[`I can't wait!`,`I do not have time.`,`I am waiting for nothing.`],correct:0,explain:{en:`This expression shows excitement about the future, not a lack of time.`,th:`สำนวนนี้แสดงความตื่นเต้นกับสิ่งที่จะเกิดขึ้น ไม่ได้แปลว่าไม่มีเวลา`}},dialogueGap:{lines:[{speaker:`A`,en:`Only three days until the concert!`},{speaker:`B`,en:`____ I have listened to the album all week.`}],blankIndex:1,options:[`I can't wait!`,`That is too bad.`,`Never mind.`],correct:0,explain:{en:`B is clearly excited about the coming concert.`,th:`B ตื่นเต้นกับคอนเสิร์ตที่กำลังจะมาถึงอย่างชัดเจน`}},speakPrompt:{en:`Say one thing you are excited about this month, and why.`,th:`บอกหนึ่งเรื่องที่คุณตื่นเต้นในเดือนนี้ พร้อมเหตุผล`}},{id:`u4-4`,unit:4,text:`That's too bad.`,meaning:{en:`I am sorry that happened — that is disappointing.`,th:`น่าเสียดายจัง / แย่จังเลย`},situation:{en:`Reacting to small bad news, like a cancelled plan.`,th:`ใช้ตอบรับข่าวร้ายเล็ก ๆ เช่น แผนถูกยกเลิก`},ipa:`/ðæts ˈtu ˈbæd/`,thaiRead:`แดทส์ ทู แบด`,chunks:[`That's`,`too bad.`],stress:[`too`,`bad`],pronTip:{en:`Say it gently with a falling tone. A cheerful tone sounds sarcastic.`,th:`พูดด้วยน้ำเสียงนุ่มและลงเสียงต่ำ ถ้าพูดด้วยน้ำเสียงร่าเริงจะกลายเป็นประชด`},example:{en:`The match was cancelled? That's too bad.`,th:`การแข่งถูกยกเลิกเหรอ น่าเสียดายจัง`},dialogue:[{speaker:`A`,en:`The trip was cancelled because of the rain.`,th:`ทริปถูกยกเลิกเพราะฝนตก`},{speaker:`B`,en:`That's too bad. You were so excited.`,th:`น่าเสียดายจัง ตื่นเต้นตั้งนาน`},{speaker:`A`,en:`Yeah, but maybe next month.`,th:`ใช่ แต่อาจจะได้ไปเดือนหน้า`}],tip:{en:`Use it for small problems. For serious news, say "I'm really sorry to hear that."`,th:`ใช้กับเรื่องเล็ก ๆ ถ้าเป็นข่าวร้ายแรง ให้ใช้ "I'm really sorry to hear that."`},mistake:{en:`It does not mean the thing was "very bad quality". It expresses sympathy.`,th:`สำนวนนี้ไม่ได้แปลว่าคุณภาพแย่มาก แต่ใช้แสดงความเห็นใจ`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`A friend says their weekend plan was cancelled. What do you say?`,th:`เพื่อนบอกว่าแผนสุดสัปดาห์ถูกยกเลิก จะพูดว่าอะไร`},options:[`That's too bad.`,`That's awesome!`,`No way, that is great!`],correct:0,explain:{en:`The news is disappointing, so a sympathetic reaction is correct.`,th:`เป็นข่าวที่น่าผิดหวัง จึงต้องตอบรับด้วยความเห็นใจ`}},dialogueGap:{lines:[{speaker:`A`,en:`I lost my match in the first round.`},{speaker:`B`,en:`____ You played really well, though.`}],blankIndex:1,options:[`That's too bad.`,`That's awesome!`,`Count me in.`],correct:0,explain:{en:`Losing is disappointing news, so B shows sympathy before giving praise.`,th:`การแพ้เป็นข่าวที่น่าผิดหวัง B จึงแสดงความเห็นใจก่อนจะชม`}},speakPrompt:{en:`React with sympathy to a small piece of bad news, then say one encouraging sentence.`,th:`ตอบรับข่าวร้ายเล็ก ๆ ด้วยความเห็นใจ แล้วพูดให้กำลังใจอีกหนึ่งประโยค`}},{id:`u4-5`,unit:4,text:`I know how you feel.`,meaning:{en:`I understand your feelings because I have felt the same.`,th:`เข้าใจความรู้สึกเลย`},situation:{en:`Showing understanding when someone is upset or worried.`,th:`ใช้แสดงความเข้าใจเวลาอีกฝ่ายเสียใจหรือกังวล`},ipa:`/aɪ ˈnoʊ haʊ ju ˈfil/`,thaiRead:`ไอ โน ฮาว ยู ฟีล`,chunks:[`I know`,`how you feel.`],stress:[`know`,`feel`],pronTip:{en:`The "k" in "know" is silent — it sounds like "no".`,th:`ตัว k ในคำว่า "know" ไม่ออกเสียง อ่านเหมือนคำว่า "no"`},example:{en:`I know how you feel. My first speech was scary too.`,th:`เข้าใจความรู้สึกเลย ตอนพูดครั้งแรกเราก็กลัวเหมือนกัน`},dialogue:[{speaker:`A`,en:`I am so nervous about the exam.`,th:`ตื่นเต้นเรื่องสอบมากเลย`},{speaker:`B`,en:`I know how you feel. I was the same last year.`,th:`เข้าใจความรู้สึกเลย ปีที่แล้วเราก็เป็นแบบนี้`},{speaker:`A`,en:`How did you handle it?`,th:`แล้วรับมือยังไงเหรอ`}],tip:{en:`Only say it if it is true. If you have not had that experience, say "That sounds really hard."`,th:`ควรพูดเมื่อเป็นเรื่องจริงเท่านั้น ถ้าไม่เคยเจอแบบนั้น ให้ใช้ "That sounds really hard." แทน`},mistake:{en:`Do not say "I know your feeling". The natural phrase is "I know how you feel."`,th:`อย่าพูดว่า "I know your feeling" สำนวนที่ใช้จริงคือ "I know how you feel."`},formality:`Neutral`,context:`Friends`,bestResponse:{prompt:{en:`A classmate is nervous before a presentation you also found scary. What do you say?`,th:`เพื่อนตื่นเต้นก่อนนำเสนอ ซึ่งคุณเองก็เคยกลัวเหมือนกัน จะพูดว่าอะไร`},options:[`I know how you feel.`,`I know your feel.`,`I feel you know.`],correct:0,explain:{en:`The fixed pattern is "know how you feel". The others are not natural English.`,th:`รูปสำนวนตายตัวคือ "know how you feel" ส่วนข้ออื่นไม่ใช่ภาษาอังกฤษที่เป็นธรรมชาติ`}},dialogueGap:{lines:[{speaker:`A`,en:`Moving to a new school is really scary.`},{speaker:`B`,en:`____ I moved twice when I was your age.`}],blankIndex:1,options:[`I know how you feel.`,`No way!`,`Do you have a minute?`],correct:0,explain:{en:`B shares a similar past experience, which supports an expression of understanding.`,th:`B เล่าประสบการณ์คล้ายกันในอดีต จึงเหมาะกับสำนวนที่แสดงความเข้าใจ`}},speakPrompt:{en:`Comfort a friend who is nervous, and share one similar experience of your own.`,th:`ปลอบเพื่อนที่กำลังตื่นเต้น และเล่าประสบการณ์คล้ายกันของคุณหนึ่งเรื่อง`}},{id:`u4-6`,unit:4,text:`Are you serious?`,meaning:{en:`Is that really true? I am surprised.`,th:`จริงเหรอ / พูดจริงหรือเปล่า`},situation:{en:`Checking surprising news — good or bad.`,th:`ใช้เช็กข่าวที่น่าประหลาดใจ ทั้งข่าวดีและข่าวร้าย`},ipa:`/ˌɑr ju ˈsɪr.i.əs/`,thaiRead:`อาร์ ยู เซีย-รี-เอิส`,chunks:[`Are you`,`serious?`],stress:[`se`],pronTip:{en:`"Serious" has three syllables: SEER-ee-us.`,th:`"Serious" มีสามพยางค์ คือ เซีย-รี-เอิส`},example:{en:`They cancelled the exam? Are you serious?`,th:`ยกเลิกสอบเหรอ จริงเหรอเนี่ย`},dialogue:[{speaker:`A`,en:`School is closed tomorrow because of the storm.`,th:`พรุ่งนี้โรงเรียนปิดเพราะพายุ`},{speaker:`B`,en:`Are you serious? I have not heard that.`,th:`จริงเหรอ ยังไม่ได้ยินเลย`},{speaker:`A`,en:`Check the school app. It is official.`,th:`ลองเช็กแอปโรงเรียนสิ ประกาศแล้ว`}],tip:{en:`With a smile it shows excitement; with a flat tone it can sound like doubt. Watch your tone.`,th:`ถ้าพูดพร้อมรอยยิ้มจะสื่อความตื่นเต้น แต่ถ้าพูดเสียงเรียบอาจฟังเหมือนไม่เชื่อ ต้องระวังน้ำเสียง`},mistake:{en:`Do not use it to challenge a teacher or adult — it can sound like you are calling them a liar.`,th:`อย่าใช้กับครูหรือผู้ใหญ่ในเชิงตั้งคำถาม เพราะอาจฟังเหมือนหาว่าเขาโกหก`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend says they won a free trip. You are amazed. What do you say?`,th:`เพื่อนบอกว่าถูกรางวัลทริปฟรี คุณทึ่งมาก จะพูดว่าอะไร`},options:[`Are you serious?`,`Are you serious person?`,`Do you serious?`],correct:0,explain:{en:`"Serious" is an adjective here, so it follows "Are you". The other two are ungrammatical.`,th:`"Serious" ในที่นี้เป็นคำคุณศัพท์ จึงตามหลัง "Are you" ส่วนอีกสองข้อผิดไวยากรณ์`}},dialogueGap:{lines:[{speaker:`A`,en:`Our class got the highest score in the whole school.`},{speaker:`B`,en:`____ That is incredible!`}],blankIndex:1,options:[`Are you serious?`,`Never mind.`,`Take your time.`],correct:0,explain:{en:`B is checking surprising good news before celebrating it.`,th:`B กำลังเช็กข่าวดีที่น่าประหลาดใจก่อนจะดีใจ`}},speakPrompt:{en:`React to surprising news twice: once excited, once doubtful. Notice how tone changes meaning.`,th:`ตอบรับข่าวน่าประหลาดใจสองแบบ แบบตื่นเต้นและแบบไม่ค่อยเชื่อ สังเกตว่าน้ำเสียงเปลี่ยนความหมายอย่างไร`}},{id:`u4-7`,unit:4,text:`What a relief!`,meaning:{en:`I feel much better now that the worry is gone.`,th:`โล่งอกไปที`},situation:{en:`When something you were worried about turns out fine.`,th:`ใช้ตอนเรื่องที่กังวลกลับกลายเป็นเรื่องดี`},ipa:`/ˌwʌt ə rɪˈlif/`,thaiRead:`วอท-อะ ริ-ลีฟ`,chunks:[`What a`,`relief!`],stress:[`lief`],pronTip:{en:`"Relief" is stressed on the second syllable: ri-LEEF.`,th:`"Relief" ลงเสียงหนักพยางค์หลัง คือ ริ-ลีฟ`},example:{en:`I passed the test. What a relief!`,th:`สอบผ่านแล้ว โล่งอกไปที`},dialogue:[{speaker:`A`,en:`The doctor said it is just a small cold.`,th:`หมอบอกว่าเป็นแค่หวัดเล็กน้อย`},{speaker:`B`,en:`What a relief! I was worried.`,th:`โล่งอกไปที เมื่อกี้เป็นห่วงมาก`}],tip:{en:`Use the pattern "What a + noun!" for strong reactions: "What a surprise!", "What a day!"`,th:`ใช้รูปแบบ "What a + คำนาม!" เพื่อแสดงอารมณ์แรง ๆ เช่น "What a surprise!" หรือ "What a day!"`},mistake:{en:`Do not say "What relief!" — the "a" is needed with a singular noun.`,th:`อย่าพูดว่า "What relief!" ต้องมี "a" เพราะเป็นคำนามเอกพจน์`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`You thought you lost your phone, but it was in your bag. What do you say?`,th:`คุณคิดว่าทำโทรศัพท์หาย แต่จริง ๆ อยู่ในกระเป๋า จะพูดว่าอะไร`},options:[`What a relief!`,`What relief!`,`What a relieved!`],correct:0,explain:{en:`The pattern is "What a" plus a singular noun. "Relieved" is an adjective, so it does not fit here.`,th:`รูปแบบคือ "What a" ตามด้วยคำนามเอกพจน์ ส่วน "relieved" เป็นคำคุณศัพท์จึงใช้ในรูปนี้ไม่ได้`}},dialogueGap:{lines:[{speaker:`A`,en:`Good news — the deadline moved to next Friday.`},{speaker:`B`,en:`____ I thought I would never finish.`}],blankIndex:1,options:[`What a relief!`,`That is too bad.`,`I'm not so sure about that.`],correct:0,explain:{en:`The worry is gone because of extra time, so relief is the right reaction.`,th:`ความกังวลหายไปเพราะได้เวลาเพิ่ม การตอบรับที่ถูกจึงเป็นความโล่งใจ`}},speakPrompt:{en:`Describe one time you were worried and then relieved. End with this expression.`,th:`เล่าเหตุการณ์ที่คุณเคยกังวลแล้วโล่งใจ และจบด้วยสำนวนนี้`}},{id:`u4-8`,unit:4,text:`I'm so proud of you.`,meaning:{en:`I feel happy and pleased about what you achieved.`,th:`ภูมิใจในตัวเธอมากเลย`},situation:{en:`Praising a friend or family member for an achievement.`,th:`ใช้ชื่นชมเพื่อนหรือคนในครอบครัวที่ทำสำเร็จ`},ipa:`/aɪm ˈsoʊ ˈpraʊd əv ju/`,thaiRead:`ไอม์ โซ พราวด์ เอิฟ ยู`,chunks:[`I'm so`,`proud of you.`],stress:[`so`,`proud`],pronTip:{en:`"Proud of" links to "PROU-dov" — the d joins the next word.`,th:`"Proud of" พูดติดกันเป็น "พราว-เดิฟ" โดยเสียง d ไปเชื่อมกับคำถัดไป`},example:{en:`You practised every day. I'm so proud of you.`,th:`เธอซ้อมทุกวันเลย ภูมิใจในตัวเธอมาก`},dialogue:[{speaker:`A`,en:`I finally gave my speech in front of the class.`,th:`ในที่สุดก็ได้พูดหน้าชั้นแล้ว`},{speaker:`B`,en:`I'm so proud of you. That took courage.`,th:`ภูมิใจในตัวเธอมาก ต้องใช้ความกล้าเลยนะ`}],tip:{en:`Say what they did well after it. Specific praise means much more than general praise.`,th:`ควรบอกด้วยว่าเขาทำอะไรได้ดี เพราะคำชมที่เจาะจงมีความหมายมากกว่าคำชมกว้าง ๆ`},mistake:{en:`The preposition is "of", not "for": "proud of you", never "proud for you".`,th:`คำบุพบทที่ใช้คือ "of" ไม่ใช่ "for" ต้องพูดว่า "proud of you" ห้ามพูดว่า "proud for you"`},formality:`Neutral`,context:`Family`,bestResponse:{prompt:{en:`Your younger sister finished her first swimming race. What do you say?`,th:`น้องสาวเพิ่งว่ายน้ำแข่งจบเป็นครั้งแรก จะพูดว่าอะไร`},options:[`I'm so proud of you.`,`I am so proud for you.`,`I am so pride of you.`],correct:0,explain:{en:`"Proud" is the adjective and it takes "of". "Pride" is a noun and does not fit here.`,th:`"Proud" เป็นคำคุณศัพท์และใช้กับ "of" ส่วน "pride" เป็นคำนามจึงใช้ในรูปนี้ไม่ได้`}},dialogueGap:{lines:[{speaker:`A`,en:`I read my poem out loud at the assembly today.`},{speaker:`B`,en:`____ You were so brave.`}],blankIndex:1,options:[`I'm so proud of you.`,`That is too bad.`,`I don't get it.`],correct:0,explain:{en:`B praises a brave achievement, so an expression of pride fits.`,th:`B ชื่นชมความกล้าหาญที่ทำสำเร็จ จึงเหมาะกับสำนวนแสดงความภูมิใจ`}},speakPrompt:{en:`Praise someone for a real achievement and say exactly what impressed you.`,th:`ชื่นชมใครสักคนจากความสำเร็จจริง และบอกให้ชัดว่าคุณประทับใจตรงไหน`}},{id:`u4-9`,unit:4,text:`That's frustrating.`,meaning:{en:`That situation would annoy anyone.`,th:`น่าหงุดหงิดจริง ๆ`},situation:{en:`Understanding someone who is stuck or annoyed.`,th:`ใช้แสดงความเข้าใจคนที่กำลังติดขัดหรือหงุดหงิด`},ipa:`/ðæts ˈfrʌs.treɪ.tɪŋ/`,thaiRead:`แดทส์ ฟรัส-เทร-ทิง`,chunks:[`That's`,`frustrating.`],stress:[`frus`],pronTip:{en:`The stress is on the first syllable: FRUS-tray-ting.`,th:`ลงเสียงหนักพยางค์แรก คือ ฟรัส-เทร-ทิง`},example:{en:`The website crashed twice? That's frustrating.`,th:`เว็บล่มสองรอบเลยเหรอ น่าหงุดหงิดจริง ๆ`},dialogue:[{speaker:`A`,en:`I redid the whole page and it deleted itself.`,th:`ทำใหม่ทั้งหน้าแล้วมันหายไปเองเลย`},{speaker:`B`,en:`That's frustrating. Do you want help retyping it?`,th:`น่าหงุดหงิดจริง ๆ ให้ช่วยพิมพ์ใหม่ไหม`},{speaker:`A`,en:`Yes, please. Thank you.`,th:`ช่วยหน่อยได้ไหม ขอบคุณนะ`}],tip:{en:`Naming the feeling helps people calm down. It shows you are really listening.`,th:`การเรียกชื่อความรู้สึกช่วยให้อีกฝ่ายใจเย็นลง เพราะรู้สึกว่าเราตั้งใจฟังจริง ๆ`},mistake:{en:`Say "That is frustrating" about the situation and "I am frustrated" about yourself. Do not swap them.`,th:`ใช้ "That is frustrating" กับสถานการณ์ และ "I am frustrated" กับตัวเอง อย่าใช้สลับกัน`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`Your friend's computer deleted their homework again. What is a supportive reply?`,th:`คอมพิวเตอร์ของเพื่อนลบการบ้านอีกแล้ว จะตอบอย่างเห็นใจว่าอะไร`},options:[`That's frustrating.`,`That is your fault.`,`That is not important.`],correct:0,explain:{en:`The first shows understanding. The other two blame or dismiss your friend.`,th:`ข้อแรกแสดงความเข้าใจ ส่วนอีกสองข้อเป็นการโทษหรือไม่ให้ความสำคัญกับเพื่อน`}},dialogueGap:{lines:[{speaker:`A`,en:`I have waited for the bus for forty minutes.`},{speaker:`B`,en:`____ Do you want a ride with us?`}],blankIndex:1,options:[`That's frustrating.`,`That's awesome!`,`Count me in.`],correct:0,explain:{en:`Waiting a long time is annoying, so B names the feeling before offering help.`,th:`การรอนานเป็นเรื่องน่าหงุดหงิด B จึงเรียกชื่อความรู้สึกก่อนจะเสนอความช่วยเหลือ`}},speakPrompt:{en:`Respond to a frustrating situation with sympathy, then offer one form of help.`,th:`ตอบสถานการณ์ที่น่าหงุดหงิดด้วยความเห็นใจ แล้วเสนอความช่วยเหลือหนึ่งอย่าง`}},{id:`u4-10`,unit:4,text:`I'm really sorry to hear that.`,meaning:{en:`I feel sad about the bad news you told me.`,th:`เสียใจด้วยจริง ๆ นะ`},situation:{en:`Responding to serious bad news, like illness or loss.`,th:`ใช้ตอบข่าวร้ายที่จริงจัง เช่น เรื่องเจ็บป่วยหรือการสูญเสีย`},ipa:`/aɪm ˈrɪ.li ˈsɑr.i tə ˈhɪr ðæt/`,thaiRead:`ไอม์ รีล-ลี ซอ-รี ทู เฮียร์ แดท`,chunks:[`I'm really sorry`,`to hear that.`],stress:[`sor`,`hear`],pronTip:{en:`Slow down and lower your voice. Speed makes sympathy sound fake.`,th:`พูดช้าลงและลดเสียงลง เพราะถ้าพูดเร็วจะฟังเหมือนไม่จริงใจ`},example:{en:`I'm really sorry to hear that. Please tell me if I can help.`,th:`เสียใจด้วยจริง ๆ นะ ถ้ามีอะไรให้ช่วยบอกได้เลย`},dialogue:[{speaker:`A`,en:`My grandmother is in the hospital.`,th:`คุณยายเข้าโรงพยาบาล`},{speaker:`B`,en:`I'm really sorry to hear that. How is she doing?`,th:`เสียใจด้วยจริง ๆ นะ ตอนนี้ท่านเป็นยังไงบ้าง`},{speaker:`A`,en:`A bit better today, thank you.`,th:`วันนี้ดีขึ้นนิดหน่อย ขอบคุณนะ`}],tip:{en:`Here "sorry" means sympathy, not apology. You are not saying it is your fault.`,th:`คำว่า "sorry" ในที่นี้แปลว่าเสียใจด้วย ไม่ใช่คำขอโทษ ไม่ได้แปลว่าเป็นความผิดของเรา`},mistake:{en:`Do not say "That is too bad" for serious news like illness — it sounds too light.`,th:`อย่าใช้ "That is too bad" กับข่าวร้ายแรง เช่น เรื่องเจ็บป่วย เพราะฟังดูเบาเกินไป`},formality:`Polite`,context:`General`,bestResponse:{prompt:{en:`A classmate tells you their pet died last night. What do you say?`,th:`เพื่อนบอกว่าสัตว์เลี้ยงตายเมื่อคืน จะพูดว่าอะไร`},options:[`I'm really sorry to hear that.`,`No way!`,`That's too bad.`],correct:0,explain:{en:`This is serious news, so it needs the gentlest, most caring response.`,th:`นี่เป็นข่าวที่จริงจัง จึงต้องตอบด้วยประโยคที่นุ่มนวลและใส่ใจที่สุด`}},dialogueGap:{lines:[{speaker:`A`,en:`My dad has been sick all week.`},{speaker:`B`,en:`____ Let me know if I can help.`}],blankIndex:1,options:[`I'm really sorry to hear that.`,`I can't wait!`,`Count me in.`],correct:0,explain:{en:`Illness in the family is serious, so a caring, sympathetic reply is correct.`,th:`เรื่องคนในครอบครัวป่วยเป็นเรื่องจริงจัง จึงต้องตอบด้วยความห่วงใยและเห็นใจ`}},speakPrompt:{en:`Respond to serious bad news with sympathy, then offer help in one sentence.`,th:`ตอบข่าวร้ายที่จริงจังด้วยความเห็นใจ แล้วเสนอความช่วยเหลือหนึ่งประโยค`}}]},{id:5,title:`Shopping, Food & Services`,titleTh:`ช้อปปิ้ง อาหาร และบริการ`,accent:`#35a7f0`,blurb:{en:`Order, ask, and pay with confidence in shops, cafés, and restaurants.`,th:`สั่งอาหาร สอบถาม และจ่ายเงินได้อย่างมั่นใจในร้านค้า คาเฟ่ และร้านอาหาร`},expressions:[{id:`u5-1`,unit:5,text:`How much is this?`,meaning:{en:`What is the price of this item?`,th:`อันนี้ราคาเท่าไร`},situation:{en:`Asking about the price of one thing in a shop.`,th:`ใช้ถามราคาของหนึ่งชิ้นในร้าน`},ipa:`/ˌhaʊ ˈmʌtʃ ɪz ðɪs/`,thaiRead:`ฮาว มัช อิส ดิส`,chunks:[`How much`,`is this?`],stress:[`much`],pronTip:{en:`"Much is" links to "MUCH-iz".`,th:`"Much is" พูดติดกันเป็น "มัช-ชิส"`},example:{en:`Excuse me, how much is this hat?`,th:`ขอโทษค่ะ หมวกใบนี้ราคาเท่าไรคะ`},dialogue:[{speaker:`A`,en:`Excuse me, how much is this?`,th:`ขอโทษค่ะ อันนี้ราคาเท่าไรคะ`},{speaker:`B`,en:`That one is 250 baht.`,th:`อันนั้น 250 บาทค่ะ`},{speaker:`A`,en:`Thank you. I will think about it.`,th:`ขอบคุณค่ะ ขอคิดดูก่อน`}],tip:{en:`Start with "Excuse me" to get attention politely before you ask.`,th:`ขึ้นต้นด้วย "Excuse me" เพื่อเรียกความสนใจอย่างสุภาพก่อนจะถาม`},mistake:{en:`Use "How much" for price and "How many" for counting items.`,th:`ใช้ "How much" ถามราคา และใช้ "How many" ถามจำนวนสิ่งของ`},formality:`Neutral`,context:`Shopping`,bestResponse:{prompt:{en:`You are holding one T-shirt with no price tag. What do you ask?`,th:`คุณถือเสื้อยืดหนึ่งตัวที่ไม่มีป้ายราคา จะถามว่าอะไร`},options:[`How much is this?`,`How many is this?`,`How much are this?`],correct:0,explain:{en:`One item is singular, so we use "is". "How many" counts things instead of asking a price.`,th:`ของหนึ่งชิ้นเป็นเอกพจน์จึงใช้ "is" ส่วน "How many" ใช้นับจำนวน ไม่ใช่ถามราคา`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`It is 120 baht, or two for 200.`}],blankIndex:0,options:[`How much is this?`,`How do you spell that?`,`What page are we on?`],correct:0,explain:{en:`B answers with a price, so A asked about cost.`,th:`B ตอบเป็นราคา แสดงว่า A ถามเรื่องราคา`}},speakPrompt:{en:`Ask the price of two different things, starting politely with "Excuse me".`,th:`ถามราคาของสองอย่าง โดยขึ้นต้นอย่างสุภาพด้วย "Excuse me"`}},{id:`u5-2`,unit:5,text:`Do you have this in a bigger size?`,meaning:{en:`Is there a larger size of this item?`,th:`อันนี้มีไซซ์ใหญ่กว่านี้ไหม`},situation:{en:`Trying on clothes or shoes that do not fit.`,th:`ใช้ตอนลองเสื้อผ้าหรือรองเท้าแล้วไม่พอดี`},ipa:`/du ju ˈhæv ðɪs ɪn ə ˈbɪɡ.ər ˈsaɪz/`,thaiRead:`ดู ยู แฮฟ ดิส อิน อะ บิก-เกอร์ ไซซ์`,chunks:[`Do you have this`,`in a bigger`,`size?`],stress:[`have`,`big`,`size`],pronTip:{en:`"Bigger" doubles the g sound: BIG-ger. Do not say "big-er" too softly.`,th:`"Bigger" ออกเสียง g ชัดสองที คือ บิก-เกอร์ อย่าออกเสียงเบาเป็น "บิ-เกอร์"`},example:{en:`These shoes are tight. Do you have this in a bigger size?`,th:`รองเท้าคู่นี้คับไปหน่อย มีไซซ์ใหญ่กว่านี้ไหมคะ`},dialogue:[{speaker:`A`,en:`Do you have this in a bigger size?`,th:`อันนี้มีไซซ์ใหญ่กว่านี้ไหมคะ`},{speaker:`B`,en:`Let me check. What size do you need?`,th:`ขอเช็กก่อนนะคะ ต้องการไซซ์ไหนคะ`},{speaker:`A`,en:`Large, please.`,th:`ไซซ์ L ค่ะ`}],tip:{en:`Swap the last words for anything you need: "in a smaller size", "in blue", "in cotton".`,th:`เปลี่ยนคำท้ายประโยคตามที่ต้องการได้ เช่น "in a smaller size", "in blue", "in cotton"`},mistake:{en:`Do not say "more big". The comparative form of "big" is "bigger".`,th:`อย่าพูดว่า "more big" รูปเปรียบเทียบของ "big" คือ "bigger"`},formality:`Polite`,context:`Shopping`,bestResponse:{prompt:{en:`The shirt you tried is too small. What do you ask the shop assistant?`,th:`เสื้อที่ลองใส่คับเกินไป จะถามพนักงานว่าอะไร`},options:[`Do you have this in a bigger size?`,`Do you have this more big?`,`Have you this bigger?`],correct:0,explain:{en:`"Bigger" is the correct comparative, and questions with "have" need "Do you".`,th:`"Bigger" เป็นรูปเปรียบเทียบที่ถูกต้อง และคำถามที่ใช้ "have" ต้องขึ้นต้นด้วย "Do you"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`We have a large in the back. I will get it for you.`}],blankIndex:0,options:[`Do you have this in a bigger size?`,`Do you take cards?`,`Can I get this to go?`],correct:0,explain:{en:`B offers a large size, so the question was about sizes.`,th:`B เสนอไซซ์ L ให้ แสดงว่าคำถามเป็นเรื่องขนาด`}},speakPrompt:{en:`Ask for a different size, then ask for a different colour using the same pattern.`,th:`ขอไซซ์อื่น แล้วขอสีอื่นโดยใช้โครงสร้างประโยคเดิม`}},{id:`u5-3`,unit:5,text:`I'll take it.`,meaning:{en:`I have decided to buy this.`,th:`เอาอันนี้ค่ะ / ตกลงซื้อ`},situation:{en:`Telling the shop you want to buy the item.`,th:`ใช้บอกร้านว่าตัดสินใจซื้อชิ้นนี้`},ipa:`/aɪl ˈteɪk ɪt/`,thaiRead:`ไอล์ เทค-คิท`,chunks:[`I'll`,`take it.`],stress:[`take`],pronTip:{en:`"Take it" links to "TAY-kit".`,th:`"Take it" พูดติดกันเป็น "เท-คิท"`},example:{en:`It fits perfectly. I'll take it.`,th:`พอดีเลยค่ะ เอาอันนี้ค่ะ`},dialogue:[{speaker:`A`,en:`How does it fit?`,th:`ใส่แล้วเป็นยังไงคะ`},{speaker:`B`,en:`It's perfect. I'll take it.`,th:`พอดีเลยค่ะ เอาอันนี้ค่ะ`},{speaker:`A`,en:`Great. Please come to the counter.`,th:`ได้ค่ะ เชิญที่เคาน์เตอร์เลยค่ะ`}],tip:{en:`For more than one item, say "I'll take them" or "I'll take two, please."`,th:`ถ้าซื้อมากกว่าหนึ่งชิ้น ให้พูดว่า "I'll take them" หรือ "I'll take two, please."`},mistake:{en:`Do not say "I buy it" in a shop. "I'll take it" is what customers actually say.`,th:`อย่าพูดว่า "I buy it" ในร้าน เพราะลูกค้าจริง ๆ พูดว่า "I'll take it"`},formality:`Neutral`,context:`Shopping`,bestResponse:{prompt:{en:`You have decided to buy the bag you are holding. What do you say?`,th:`คุณตัดสินใจซื้อกระเป๋าที่ถืออยู่ จะพูดว่าอะไร`},options:[`I'll take it.`,`I take it now.`,`I am taking it home.`],correct:0,explain:{en:`"I'll take it" is the fixed shopping phrase for deciding to buy.`,th:`"I'll take it" เป็นสำนวนตายตัวที่ใช้ตอนตัดสินใจซื้อ`}},dialogueGap:{lines:[{speaker:`A`,en:`That is our last one in your size.`},{speaker:`B`,en:`____ Can I pay by card?`}],blankIndex:1,options:[`I'll take it.`,`I'm just looking, thanks.`,`Maybe next time.`],correct:0,explain:{en:`B immediately asks about paying, which shows the decision to buy.`,th:`B ถามเรื่องการจ่ายเงินทันที แสดงว่าตัดสินใจซื้อแล้ว`}},speakPrompt:{en:`Decide to buy something and add one question about payment or delivery.`,th:`ตัดสินใจซื้อของหนึ่งชิ้น และถามเพิ่มหนึ่งคำถามเรื่องการจ่ายเงินหรือการจัดส่ง`}},{id:`u5-4`,unit:5,text:`What do you recommend?`,meaning:{en:`Which one do you think is best?`,th:`แนะนำอะไรดีคะ`},situation:{en:`Asking staff for advice in a restaurant or shop.`,th:`ใช้ขอคำแนะนำจากพนักงานในร้านอาหารหรือร้านค้า`},ipa:`/ˌwʌt du ju ˌrɛ.kəˈmɛnd/`,thaiRead:`วอท ดู ยู เร-เคอะ-เมนด์`,chunks:[`What do you`,`recommend?`],stress:[`mend`],pronTip:{en:`"Recommend" has the stress at the end: reh-kuh-MEND, with one c and two m letters.`,th:`"Recommend" ลงเสียงหนักพยางค์ท้าย คือ เร-เคอะ-เมนด์ สะกดด้วย c ตัวเดียวและ m สองตัว`},example:{en:`It is my first time here. What do you recommend?`,th:`มาที่นี่ครั้งแรกค่ะ แนะนำอะไรดีคะ`},dialogue:[{speaker:`A`,en:`It is my first time here. What do you recommend?`,th:`มาที่นี่ครั้งแรกค่ะ แนะนำอะไรดีคะ`},{speaker:`B`,en:`The green curry is very popular.`,th:`แกงเขียวหวานได้รับความนิยมมากค่ะ`},{speaker:`A`,en:`Sounds great. I will try that.`,th:`ฟังดูดีเลย ขอลองอันนั้นค่ะ`}],tip:{en:`Add a detail to get better advice: "What do you recommend for someone who does not like spicy food?"`,th:`เพิ่มรายละเอียดเพื่อให้ได้คำแนะนำที่ตรงขึ้น เช่น "What do you recommend for someone who does not like spicy food?"`},mistake:{en:`Do not say "What do you suggest me?" In English, "suggest" and "recommend" are not followed directly by a person.`,th:`อย่าพูดว่า "What do you suggest me?" เพราะในภาษาอังกฤษ "suggest" และ "recommend" ไม่ตามด้วยคนโดยตรง`},formality:`Polite`,context:`Shopping`,bestResponse:{prompt:{en:`You cannot decide what to order at a new restaurant. What do you ask the server?`,th:`คุณเลือกไม่ถูกว่าจะสั่งอะไรที่ร้านใหม่ จะถามพนักงานว่าอะไร`},options:[`What do you recommend?`,`What do you recommend me?`,`What you recommend?`],correct:0,explain:{en:`"Recommend" is not followed directly by a person, and questions need "do you".`,th:`"Recommend" ไม่ตามด้วยคนโดยตรง และประโยคคำถามต้องมี "do you"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Most customers love the mango smoothie.`}],blankIndex:0,options:[`What do you recommend?`,`How much is this?`,`Do you take cards?`],correct:0,explain:{en:`B suggests a popular item, which answers a request for advice.`,th:`B แนะนำเมนูยอดนิยม ซึ่งเป็นการตอบคำขอคำแนะนำ`}},speakPrompt:{en:`Ask for a recommendation and add one detail about what you like.`,th:`ขอคำแนะนำหนึ่งอย่าง และเพิ่มรายละเอียดว่าคุณชอบแบบไหน`}},{id:`u5-5`,unit:5,text:`I'm just looking, thanks.`,meaning:{en:`I am not buying now — I am only browsing.`,th:`ขอดูก่อนค่ะ ขอบคุณ`},situation:{en:`A shop assistant offers help but you want to browse alone.`,th:`ใช้ตอนพนักงานเข้ามาถาม แต่เราอยากเดินดูเองก่อน`},ipa:`/aɪm ˈdʒʌst ˈlʊk.ɪŋ ˈθæŋks/`,thaiRead:`ไอม์ จัสท์ ลุค-คิง แธงคส์`,chunks:[`I'm just`,`looking,`,`thanks.`],stress:[`just`,`look`],pronTip:{en:`"Thanks" ends with the "th" sound plus "ks" — do not say "tanks".`,th:`"Thanks" ต้องมีเสียง th ตามด้วย ks อย่าออกเสียงเป็น "แทงคส์"`},example:{en:`I'm just looking, thanks. I will ask if I need help.`,th:`ขอดูก่อนค่ะ ขอบคุณ ถ้าต้องการอะไรจะเรียกนะคะ`},dialogue:[{speaker:`A`,en:`Can I help you find anything?`,th:`ให้ช่วยหาอะไรไหมคะ`},{speaker:`B`,en:`I'm just looking, thanks.`,th:`ขอดูก่อนค่ะ ขอบคุณ`},{speaker:`A`,en:`No problem. Let me know if you need anything.`,th:`ได้ค่ะ ถ้าต้องการอะไรบอกได้เลยนะคะ`}],tip:{en:`Adding "thanks" keeps it friendly. Without it, the sentence can sound cold.`,th:`การเติม "thanks" ทำให้ฟังเป็นมิตร ถ้าไม่มีอาจฟังดูเย็นชา`},mistake:{en:`Do not say "I only see." The verb for browsing in a shop is "looking".`,th:`อย่าพูดว่า "I only see" คำกริยาที่ใช้เวลาเดินดูของในร้านคือ "looking"`},formality:`Polite`,context:`Shopping`,bestResponse:{prompt:{en:`A shop assistant asks if you need help, but you want to browse. What do you say?`,th:`พนักงานถามว่าต้องการความช่วยเหลือไหม แต่คุณอยากเดินดูเอง จะพูดว่าอะไร`},options:[`I'm just looking, thanks.`,`No, go away.`,`I am only see.`],correct:0,explain:{en:`The first is polite and clear. "No, go away" is rude and the third is not correct English.`,th:`ข้อแรกสุภาพและชัดเจน ส่วน "No, go away" หยาบคาย และข้อสามไม่ถูกไวยากรณ์`}},dialogueGap:{lines:[{speaker:`A`,en:`Are you looking for something special today?`},{speaker:`B`,en:`____`}],blankIndex:1,options:[`I'm just looking, thanks.`,`I'll take it.`,`How much is this?`],correct:0,explain:{en:`The customer has not chosen anything yet, so browsing is the natural answer.`,th:`ลูกค้ายังไม่ได้เลือกอะไร คำตอบที่เป็นธรรมชาติจึงเป็นการบอกว่าขอดูก่อน`}},speakPrompt:{en:`Politely decline help in a shop, then add that you will ask if you need anything.`,th:`ปฏิเสธความช่วยเหลือในร้านอย่างสุภาพ แล้วบอกว่าถ้าต้องการอะไรจะเรียก`}},{id:`u5-6`,unit:5,text:`Can I get this to go?`,meaning:{en:`Can I take this food away instead of eating here?`,th:`ขอใส่กลับบ้านได้ไหมคะ`},situation:{en:`Ordering takeaway food or drinks.`,th:`ใช้ตอนสั่งอาหารหรือเครื่องดื่มกลับบ้าน`},ipa:`/kən aɪ ˈɡɛt ðɪs tə ˈɡoʊ/`,thaiRead:`เคิน ไอ เก็ท ดิส ทู โก`,chunks:[`Can I get this`,`to go?`],stress:[`get`,`go`],pronTip:{en:`Stress "go" strongly — it is the word that changes the meaning.`,th:`เน้นเสียงที่คำว่า "go" ให้ชัด เพราะเป็นคำที่เปลี่ยนความหมายทั้งประโยค`},example:{en:`Can I get this to go, please?`,th:`ขอใส่กลับบ้านได้ไหมคะ`},dialogue:[{speaker:`A`,en:`For here or to go?`,th:`ทานที่ร้านหรือใส่กลับคะ`},{speaker:`B`,en:`Can I get this to go, please?`,th:`ขอใส่กลับบ้านค่ะ`},{speaker:`A`,en:`Sure, one moment.`,th:`ได้ค่ะ รอสักครู่นะคะ`}],tip:{en:`"To go" is American English. In the UK you will hear "takeaway" instead.`,th:`"To go" เป็นภาษาอังกฤษแบบอเมริกัน ส่วนในอังกฤษจะใช้คำว่า "takeaway"`},mistake:{en:`Do not say "take back home" for restaurant food. The natural phrase is "to go".`,th:`อย่าพูดว่า "take back home" กับอาหารในร้าน สำนวนที่ใช้จริงคือ "to go"`},formality:`Neutral`,context:`Shopping`,bestResponse:{prompt:{en:`You ordered a drink but you are in a hurry and want to leave. What do you ask?`,th:`คุณสั่งเครื่องดื่มแล้วแต่กำลังรีบและอยากออกไป จะถามว่าอะไร`},options:[`Can I get this to go?`,`Can I get this for going?`,`Can I bring this out?`],correct:0,explain:{en:`"To go" is the fixed phrase for takeaway. The others are not used this way.`,th:`"To go" เป็นสำนวนตายตัวสำหรับสั่งกลับบ้าน ส่วนข้ออื่นไม่ได้ใช้ในความหมายนี้`}},dialogueGap:{lines:[{speaker:`A`,en:`Would you like a plate or a paper cup?`},{speaker:`B`,en:`A cup, please. ____`}],blankIndex:1,options:[`Can I get this to go?`,`What do you recommend?`,`Is this on sale?`],correct:0,explain:{en:`A paper cup means the drink is leaving the shop, which matches a takeaway request.`,th:`แก้วกระดาษหมายถึงจะเอาเครื่องดื่มออกจากร้าน ซึ่งตรงกับการขอใส่กลับบ้าน`}},speakPrompt:{en:`Order one drink and ask for it to go, using "please".`,th:`สั่งเครื่องดื่มหนึ่งแก้วและขอใส่กลับบ้าน โดยใช้คำว่า "please"`}},{id:`u5-7`,unit:5,text:`I'd like the noodles, please.`,meaning:{en:`A polite way to order what you want.`,th:`ขอสั่งก๋วยเตี๋ยวค่ะ — วิธีสั่งอาหารอย่างสุภาพ`},situation:{en:`Ordering food in a restaurant.`,th:`ใช้ตอนสั่งอาหารในร้านอาหาร`},ipa:`/aɪd ˈlaɪk ðə ˈnu.dəlz ˈpliz/`,thaiRead:`ไอด์ ไลค์ เดอะ นู-เดิลส์ พลีซ`,chunks:[`I'd like`,`the noodles,`,`please.`],stress:[`like`,`noo`],pronTip:{en:`"I'd like" is one smooth sound, not "I would like" said slowly.`,th:`"I'd like" พูดลื่น ๆ เป็นเสียงเดียว ไม่ใช่พูดช้า ๆ ว่า "I would like"`},example:{en:`I'd like the noodles, please. No chilli.`,th:`ขอก๋วยเตี๋ยวค่ะ ไม่ใส่พริกนะคะ`},dialogue:[{speaker:`A`,en:`Are you ready to order?`,th:`พร้อมสั่งหรือยังคะ`},{speaker:`B`,en:`I'd like the noodles, please.`,th:`ขอก๋วยเตี๋ยวค่ะ`},{speaker:`A`,en:`Anything to drink?`,th:`รับเครื่องดื่มด้วยไหมคะ`}],tip:{en:`Change the food to order anything: "I'd like the fried rice, please." It is a reusable frame.`,th:`เปลี่ยนชื่ออาหารเพื่อสั่งเมนูอื่นได้ เช่น "I'd like the fried rice, please." เป็นโครงประโยคที่ใช้ซ้ำได้`},mistake:{en:`Do not say "I want noodles." It is grammatically fine but sounds demanding to a server. "I'd like" is polite.`,th:`อย่าพูดว่า "I want noodles" แม้ไวยากรณ์ถูก แต่ฟังดูเรียกร้องสำหรับพนักงาน ให้ใช้ "I'd like" จะสุภาพกว่า`},formality:`Polite`,context:`Shopping`,bestResponse:{prompt:{en:`The server asks what you want. How do you
