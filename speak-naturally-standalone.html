in:{en:`"How do you do?" is very formal and old-fashioned, and "What is your condition?" is not natural English. "How's it going?" is the everyday choice.`,th:`"How do you do?" เป็นทางการมากและเชย ส่วน "What is your condition?" ไม่ใช่ภาษาอังกฤษที่ใช้จริง คำที่ใช้ทุกวันคือ "How's it going?"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Pretty good, thanks! How about you?`}],blankIndex:0,options:[`How's it going?`,`Where are you going?`,`How much is it?`],correct:0,explain:{en:`B answers with "Pretty good," so A must have asked how B is — not where B is going or how much something costs.`,th:`B ตอบว่า "Pretty good" แสดงว่า A ถามว่าเป็นยังไงบ้าง ไม่ใช่ถามว่าจะไปไหนหรือราคาเท่าไร`}},speakPrompt:{en:`Greet a classmate you have not seen since last week. Use "How's it going?" and add one more sentence.`,th:`ทักทายเพื่อนที่ไม่ได้เจอกันตั้งแต่สัปดาห์ที่แล้ว ใช้ "How's it going?" แล้วพูดต่ออีกหนึ่งประโยค`}},{id:`u1-2`,unit:1,text:`Long time no see!`,meaning:{en:`We have not met for a long time.`,th:`ไม่ได้เจอกันนานเลย`},situation:{en:`Meeting someone again after weeks or months apart.`,th:`ใช้ตอนเจอคนที่ไม่ได้เจอกันเป็นสัปดาห์หรือเป็นเดือน`},ipa:`/ˌlɔŋ taɪm noʊ ˈsi/`,thaiRead:`ลอง ไทม์ โน ซี`,chunks:[`Long time`,`no see!`],stress:[`Long`,`see`],pronTip:{en:`Stretch "Long" a little and jump up on "see".`,th:`ลากเสียง "Long" นิดหนึ่ง แล้วขึ้นเสียงสูงที่ "see"`},example:{en:`Ploy! Long time no see! You look great.`,th:`พลอย! ไม่ได้เจอกันนานเลย ดูดีจังเลยนะ`},dialogue:[{speaker:`A`,en:`Ploy! Long time no see!`,th:`พลอย! ไม่ได้เจอกันนานเลย`},{speaker:`B`,en:`I know! It has been almost a year.`,th:`นั่นสิ! เกือบปีแล้วมั้ง`},{speaker:`A`,en:`We should catch up soon.`,th:`ไว้เจอกันคุยกันหน่อยนะ`}],mistake:{en:`The grammar looks wrong, but this is a fixed expression. Never change it to "Long time not see" or "Long time no meet".`,th:`ไวยากรณ์ดูแปลก แต่นี่คือสำนวนตายตัว ห้ามเปลี่ยนเป็น "Long time not see" หรือ "Long time no meet"`},tip:{en:`Follow it with a question so the conversation keeps moving, like "How have you been?"`,th:`พูดต่อด้วยคำถาม เช่น "How have you been?" เพื่อให้บทสนทนาไปต่อได้`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`You meet a friend you have not seen since last summer. What do you say first?`,th:`คุณเจอเพื่อนที่ไม่ได้เจอกันตั้งแต่ปิดเทอมที่แล้ว จะพูดอะไรก่อน`},options:[`Long time no see!`,`Nice to meet you.`,`Do I know you?`],correct:0,explain:{en:`"Nice to meet you" is only for the first meeting, and "Do I know you?" sounds cold. "Long time no see!" fits an old friend.`,th:`"Nice to meet you" ใช้เฉพาะตอนเจอกันครั้งแรก ส่วน "Do I know you?" ฟังดูเย็นชา สำหรับเพื่อนเก่าให้ใช้ "Long time no see!"`}},dialogueGap:{lines:[{speaker:`A`,en:`Bank? Is that you? ____`},{speaker:`B`,en:`Yes! We last met in Grade 5.`}],blankIndex:0,options:[`Long time no see!`,`See you later!`,`Take your time.`],correct:0,explain:{en:`They are meeting again after years, so the greeting for a long gap fits. "See you later" is for leaving.`,th:`ทั้งคู่เพิ่งเจอกันอีกครั้งหลังผ่านไปหลายปี จึงใช้คำทักทายสำหรับการห่างหายไปนาน ส่วน "See you later" ใช้ตอนจะลาจาก`}},speakPrompt:{en:`Imagine meeting a cousin you have not seen for a year. Say the expression and one follow-up question.`,th:`ลองนึกว่าเจอญาติที่ไม่ได้เจอกันหนึ่งปี พูดสำนวนนี้แล้วถามต่ออีกหนึ่งคำถาม`}},{id:`u1-3`,unit:1,text:`What have you been up to?`,meaning:{en:`What have you been doing recently?`,th:`ช่วงนี้ทำอะไรอยู่บ้าง`},situation:{en:`Catching up with someone after some time apart.`,th:`ใช้ถามคนที่ไม่ได้เจอกันสักพักว่าช่วงนี้เป็นยังไง`},ipa:`/ˌwʌt həv ju bɪn ˈʌp tu/`,thaiRead:`วอท-เทิฟ-ยู-บิน อัพ ทู`,chunks:[`What have you been`,`up to?`],stress:[`What`,`up`],pronTip:{en:`The middle words are fast and quiet: "What-uv-you-bin UP to?"`,th:`คำตรงกลางพูดเร็วและเบา ฟังเหมือน "วอท-เทิฟ-ยู-บิน อัพ ทู"`},example:{en:`Hey! It's been a while. What have you been up to?`,th:`เฮ้ ไม่ได้เจอกันนานเลย ช่วงนี้ทำอะไรอยู่บ้าง`},dialogue:[{speaker:`A`,en:`What have you been up to?`,th:`ช่วงนี้ทำอะไรอยู่บ้าง`},{speaker:`B`,en:`Mostly studying. I have a big test next week.`,th:`ส่วนใหญ่ก็อ่านหนังสือ สัปดาห์หน้ามีสอบใหญ่`},{speaker:`A`,en:`Good luck! You have got this.`,th:`ขอให้โชคดีนะ เธอทำได้แน่นอน`}],mistake:{en:`Do not say "What are you do?" or "What you doing these days?" The fixed phrase is "What have you been up to?"`,th:`อย่าพูดว่า "What are you do?" หรือ "What you doing these days?" สำนวนที่ถูกคือ "What have you been up to?"`},tip:{en:`Answer with one activity, not your whole life story. One or two sentences is perfect.`,th:`ตอบด้วยกิจกรรมเดียวพอ ไม่ต้องเล่าทั้งชีวิต หนึ่งถึงสองประโยคกำลังดี`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend just said "Long time no see!" What is a natural next question?`,th:`เพื่อนเพิ่งพูดว่า "Long time no see!" คำถามต่อไปที่เป็นธรรมชาติคืออะไร`},options:[`What have you been up to?`,`What is your name again?`,`Why are you here?`],correct:0,explain:{en:`After greeting an old friend you ask about their recent life. Asking "Why are you here?" sounds suspicious.`,th:`หลังทักทายเพื่อนเก่า เรามักถามถึงชีวิตช่วงนี้ ส่วน "Why are you here?" ฟังดูเหมือนจับผิด`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`I joined the school band. We practise every Friday.`}],blankIndex:0,options:[`What have you been up to?`,`Where have you been?`,`How much do you practise?`],correct:0,explain:{en:`B talks about a new activity, which answers a question about recent life, not about a place.`,th:`B เล่าถึงกิจกรรมใหม่ ซึ่งเป็นการตอบคำถามเรื่องชีวิตช่วงนี้ ไม่ใช่คำถามเรื่องสถานที่`}},speakPrompt:{en:`Ask a friend this question, then answer it yourself with one true sentence about your week.`,th:`ถามเพื่อนด้วยประโยคนี้ แล้วลองตอบเองด้วยเรื่องจริงของสัปดาห์นี้หนึ่งประโยค`}},{id:`u1-4`,unit:1,text:`It's nice to finally meet you.`,meaning:{en:`I am happy to meet you in person at last.`,th:`ดีใจที่ได้เจอตัวจริงสักที`},situation:{en:`Meeting someone for the first time after hearing about them or chatting online.`,th:`ใช้ตอนเจอตัวจริงครั้งแรก หลังจากเคยได้ยินชื่อหรือคุยกันออนไลน์มาก่อน`},ipa:`/ɪts naɪs tə ˈfaɪ.nə.li ˈmit ju/`,thaiRead:`อิทส์ ไนซ์ ทู ไฟ-เนิล-ลี มีท ยู`,chunks:[`It's nice to`,`finally`,`meet you.`],stress:[`nice`,`fi`,`meet`],pronTip:{en:`"Finally" has three syllables: FI-nuh-lee. Do not drop the middle one.`,th:`"Finally" มีสามพยางค์ คือ ไฟ-เนิล-ลี อย่าตัดพยางค์กลางออก`},example:{en:`Mr. Chai told me about you. It's nice to finally meet you.`,th:`คุณชัยเล่าเรื่องคุณให้ฟัง ดีใจที่ได้เจอตัวจริงสักที`},dialogue:[{speaker:`A`,en:`You must be Mint. It's nice to finally meet you.`,th:`คุณคงเป็นมิ้นท์ใช่ไหม ดีใจที่ได้เจอตัวจริงสักที`},{speaker:`B`,en:`You too! I have heard a lot about your class.`,th:`เช่นกันค่ะ ได้ยินเรื่องคลาสของคุณมาเยอะเลย`}],mistake:{en:`Use "meet" only the first time. When you see the person again, say "Good to see you," not "Nice to meet you."`,th:`ใช้ "meet" เฉพาะครั้งแรกที่เจอกัน ถ้าเจอกันอีกให้พูดว่า "Good to see you" ไม่ใช่ "Nice to meet you"`},tip:{en:`Adding "finally" shows warmth — it means you were looking forward to meeting them.`,th:`การเติมคำว่า "finally" ทำให้ประโยคอบอุ่นขึ้น เพราะสื่อว่าเรารอที่จะได้เจอมานานแล้ว`},formality:`Polite`,context:`General`,bestResponse:{prompt:{en:`You meet your online study partner in person for the first time. What do you say?`,th:`คุณเจอเพื่อนที่เรียนออนไลน์ด้วยกันตัวจริงเป็นครั้งแรก จะพูดว่าอะไร`},options:[`It's nice to finally meet you.`,`Long time no see!`,`Good to see you again.`],correct:0,explain:{en:`This is the first face-to-face meeting, so "meet" is correct. The other two are for people you have met before.`,th:`นี่คือการเจอตัวจริงครั้งแรก จึงใช้ "meet" ส่วนอีกสองประโยคใช้กับคนที่เคยเจอกันมาแล้ว`}},dialogueGap:{lines:[{speaker:`A`,en:`Hi, I am Kate. We have emailed for months!`},{speaker:`B`,en:`____`}],blankIndex:1,options:[`It's nice to finally meet you.`,`Long time no see!`,`See you next time.`],correct:0,explain:{en:`They have written to each other but never met, so "finally meet" is exactly right.`,th:`ทั้งคู่เคยอีเมลกันแต่ไม่เคยเจอตัวจริง จึงเหมาะกับ "finally meet"`}},speakPrompt:{en:`Introduce yourself to a new teacher and use this expression politely.`,th:`แนะนำตัวกับครูคนใหม่ และใช้สำนวนนี้อย่างสุภาพ`}},{id:`u1-5`,unit:1,text:`How was your weekend?`,meaning:{en:`Tell me about your Saturday and Sunday.`,th:`สุดสัปดาห์ที่ผ่านมาเป็นยังไงบ้าง`},situation:{en:`Starting a Monday conversation at school or work.`,th:`ใช้เปิดบทสนทนาวันจันทร์ที่โรงเรียนหรือที่ทำงาน`},ipa:`/ˌhaʊ wəz jɔr ˈwik.ɛnd/`,thaiRead:`ฮาว เวิซ ยัวร์ วีค-เอ็นด์`,chunks:[`How was`,`your weekend?`],stress:[`How`,`week`],pronTip:{en:`"Was" is weak here — it sounds like "wuz", not "woz".`,th:`คำว่า "was" ออกเสียงเบา ฟังเหมือน "เวิซ" ไม่ใช่ "วอส"`},example:{en:`Morning! How was your weekend?`,th:`อรุณสวัสดิ์ สุดสัปดาห์ที่ผ่านมาเป็นยังไงบ้าง`},dialogue:[{speaker:`A`,en:`Morning, Ton. How was your weekend?`,th:`อรุณสวัสดิ์ต้น สุดสัปดาห์เป็นยังไงบ้าง`},{speaker:`B`,en:`Really fun. We went to my grandma's house.`,th:`สนุกมากเลย ไปบ้านคุณยายมา`},{speaker:`A`,en:`That sounds lovely.`,th:`ฟังดูดีจังเลย`}],tip:{en:`Answer with one detail, then ask the same question back. That is how small talk keeps going.`,th:`ตอบด้วยรายละเอียดหนึ่งอย่าง แล้วถามกลับด้วยคำถามเดิม เป็นวิธีทำให้บทสนทนาไหลลื่น`},mistake:{en:`Say "on the weekend" or "at the weekend", but never "in the weekend".`,th:`ใช้ "on the weekend" หรือ "at the weekend" ได้ แต่ห้ามใช้ "in the weekend"`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`It is Monday morning and you want to start a friendly chat. What do you ask?`,th:`เช้าวันจันทร์ คุณอยากเริ่มคุยกับเพื่อนแบบเป็นกันเอง จะถามว่าอะไร`},options:[`How was your weekend?`,`What is your weekend?`,`Did you weekend well?`],correct:0,explain:{en:`Only the first option is correct English. "Weekend" is a noun here, so we ask "How was...?"`,th:`มีเพียงข้อแรกที่เป็นภาษาอังกฤษที่ถูกต้อง เพราะ "weekend" เป็นคำนาม จึงถามว่า "How was...?"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`It was great! I went cycling with my dad on Sunday.`}],blankIndex:0,options:[`How was your weekend?`,`How is the weather?`,`What time is it?`],correct:0,explain:{en:`B describes Sunday activities, so the question must be about the weekend.`,th:`B เล่าเรื่องที่ทำวันอาทิตย์ คำถามจึงต้องเกี่ยวกับสุดสัปดาห์`}},speakPrompt:{en:`Ask the question, then answer about your real weekend in two sentences.`,th:`ถามคำถามนี้ แล้วเล่าสุดสัปดาห์จริงของคุณสองประโยค`}},{id:`u1-6`,unit:1,text:`Not much, you?`,meaning:{en:`Nothing special is happening with me — and you?`,th:`ก็ไม่มีอะไรมาก แล้วเธอล่ะ`},situation:{en:`Answering "What have you been up to?" or "What's up?"`,th:`ใช้ตอบคำถาม "What have you been up to?" หรือ "What's up?"`},ipa:`/ˌnɑt ˈmʌtʃ | ˈju/`,thaiRead:`นอท มัช, ยู`,chunks:[`Not much,`,`you?`],stress:[`much`,`you`],pronTip:{en:`Pause slightly at the comma, then raise your voice on "you?"`,th:`หยุดนิดหนึ่งตรงลูกน้ำ แล้วขึ้นเสียงสูงที่ "you?"`},example:{en:`Not much, you? Anything fun this week?`,th:`ก็ไม่มีอะไรมาก แล้วเธอล่ะ สัปดาห์นี้มีอะไรสนุก ๆ ไหม`},dialogue:[{speaker:`A`,en:`What's up?`,th:`เป็นไงบ้าง`},{speaker:`B`,en:`Not much, you?`,th:`ก็ไม่มีอะไรมาก แล้วเธอล่ะ`},{speaker:`A`,en:`Same here. Just waiting for lunch.`,th:`เหมือนกันเลย รอกินข้าวเที่ยงอยู่`}],mistake:{en:`Do not answer "No much" or "Nothing much thank you very much." Short and light is the natural style.`,th:`อย่าตอบว่า "No much" หรือ "Nothing much thank you very much" ให้ตอบสั้นและเบา ๆ จะเป็นธรรมชาติกว่า`},tip:{en:`Adding "you?" keeps the conversation alive. Without it, the chat can stop dead.`,th:`การเติม "you?" ช่วยให้บทสนทนาไปต่อ ถ้าไม่เติม บทสนทนาอาจหยุดกลางคัน`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`A friend asks "What have you been up to?" and you had a quiet week. What do you say?`,th:`เพื่อนถามว่า "What have you been up to?" และสัปดาห์นี้คุณไม่ได้ทำอะไรมาก จะตอบว่าอะไร`},options:[`Not much, you?`,`I am not much.`,`No, I have not.`],correct:0,explain:{en:`"I am not much" describes you as a person, which is not the meaning. "Not much, you?" answers the question and passes it back.`,th:`"I am not much" กลายเป็นการบรรยายตัวเอง ซึ่งไม่ใช่ความหมายที่ต้องการ ส่วน "Not much, you?" ตอบคำถามและถามกลับด้วย`}},dialogueGap:{lines:[{speaker:`A`,en:`Hey! What have you been up to?`},{speaker:`B`,en:`____`},{speaker:`A`,en:`I started a new drawing class.`}],blankIndex:1,options:[`Not much, you?`,`Not at all.`,`Never mind.`],correct:0,explain:{en:`A answers with their own news, so B must have asked "you?" at the end.`,th:`A เล่าเรื่องของตัวเองต่อ แสดงว่า B ถามกลับด้วยคำว่า "you?" ท้ายประโยค`}},speakPrompt:{en:`Record a two-line exchange: ask "What have you been up to?" then answer "Not much, you?"`,th:`อัดเสียงบทสนทนาสองบรรทัด ถามว่า "What have you been up to?" แล้วตอบว่า "Not much, you?"`}},{id:`u1-7`,unit:1,text:`Same here.`,meaning:{en:`That is true for me too.`,th:`เหมือนกันเลย / ฉันก็เป็นแบบนั้น`},situation:{en:`Agreeing that you feel or did the same thing.`,th:`ใช้บอกว่าเรารู้สึกหรือทำแบบเดียวกัน`},ipa:`/ˌseɪm ˈhɪr/`,thaiRead:`เซม เฮียร์`,chunks:[`Same`,`here.`],stress:[`Same`],pronTip:{en:`Keep it short and warm — two quick words, falling tone.`,th:`พูดสั้นและอบอุ่น สองคำเร็ว ๆ ลงเสียงต่ำ`},example:{en:`I am so tired today. — Same here.`,th:`วันนี้เหนื่อยมากเลย — เหมือนกันเลย`},dialogue:[{speaker:`A`,en:`I could not sleep last night.`,th:`เมื่อคืนนอนไม่หลับเลย`},{speaker:`B`,en:`Same here. The rain was so loud.`,th:`เหมือนกันเลย ฝนตกเสียงดังมาก`}],tip:{en:`Use "Same here" for statements. If someone says "Nice to meet you," reply "You too" instead.`,th:`ใช้ "Same here" กับประโยคบอกเล่า แต่ถ้ามีคนพูดว่า "Nice to meet you" ให้ตอบว่า "You too" แทน`},mistake:{en:`Do not say "Same here too" — that repeats the meaning twice.`,th:`อย่าพูดว่า "Same here too" เพราะความหมายซ้ำซ้อน`},formality:`Casual`,context:`General`,bestResponse:{prompt:{en:`Your friend says "I love rainy mornings." You feel the same. What do you say?`,th:`เพื่อนพูดว่า "I love rainy mornings." คุณรู้สึกเหมือนกัน จะพูดว่าอะไร`},options:[`Same here.`,`Me too much.`,`Same to you.`],correct:0,explain:{en:`"Same to you" is for returning a wish, like "Happy New Year." For sharing a feeling, use "Same here."`,th:`"Same to you" ใช้ตอบคำอวยพร เช่น "Happy New Year" แต่ถ้าจะบอกว่ารู้สึกเหมือนกัน ให้ใช้ "Same here"`}},dialogueGap:{lines:[{speaker:`A`,en:`I am really nervous about the presentation.`},{speaker:`B`,en:`____ Let us practise together.`}],blankIndex:1,options:[`Same here.`,`Same to you.`,`Here it is.`],correct:0,explain:{en:`B is sharing the same feeling before suggesting practice together.`,th:`B กำลังบอกว่ารู้สึกเหมือนกัน ก่อนจะชวนซ้อมด้วยกัน`}},speakPrompt:{en:`Say one sentence about how you feel today, then imagine a friend replying "Same here."`,th:`พูดหนึ่งประโยคว่าวันนี้รู้สึกยังไง แล้วลองนึกว่าเพื่อนตอบว่า "Same here."`}},{id:`u1-8`,unit:1,text:`Good to see you again.`,meaning:{en:`I am happy to see you — we have met before.`,th:`ดีใจที่ได้เจอกันอีก`},situation:{en:`Greeting someone you already know, at school, work, or a class.`,th:`ใช้ทักทายคนที่รู้จักกันอยู่แล้ว ที่โรงเรียน ที่ทำงาน หรือในคลาสเรียน`},ipa:`/ˌɡʊd tə ˈsi ju əˈɡɛn/`,thaiRead:`กุด ทู ซี ยู อะ-เกน`,chunks:[`Good to`,`see you`,`again.`],stress:[`Good`,`see`,`gain`],pronTip:{en:`"Good to" becomes "GOOD-tuh". "Again" is stressed on the second syllable: uh-GEN.`,th:`"Good to" พูดติดกันเป็น "กุด-ทุ" ส่วน "again" ลงเสียงหนักพยางค์หลัง คือ อะ-เกน`},example:{en:`Good to see you again, Khru Pim!`,th:`ดีใจที่ได้เจอครูพิมอีกครั้งครับ`},dialogue:[{speaker:`A`,en:`Good to see you again, Khru Pim.`,th:`ดีใจที่ได้เจอครูพิมอีกครั้งครับ`},{speaker:`B`,en:`You too, Nate. Ready for today's lesson?`,th:`เช่นกันจ้ะเนท พร้อมเรียนวันนี้หรือยัง`}],tip:{en:`This works with teachers and adults as well as friends, so it is a safe, polite choice.`,th:`ใช้ได้ทั้งกับครู ผู้ใหญ่ และเพื่อน จึงเป็นตัวเลือกที่สุภาพและปลอดภัย`},mistake:{en:`Use "see" for people you have met and "meet" for the first time. Mixing them confuses listeners.`,th:`ใช้ "see" กับคนที่เคยเจอกันแล้ว และใช้ "meet" กับการเจอครั้งแรก ถ้าสลับกันจะทำให้ผู้ฟังสับสน`},formality:`Polite`,context:`School`,bestResponse:{prompt:{en:`You return to your English class after the holiday and greet your teacher. What do you say?`,th:`คุณกลับมาเรียนคลาสภาษาอังกฤษหลังปิดเทอมและทักทายครู จะพูดว่าอะไร`},options:[`Good to see you again.`,`Long time no see, dude!`,`Nice to meet you.`],correct:0,explain:{en:`"Dude" is too casual for a teacher, and you have met before, so "meet" is wrong. The polite choice is "Good to see you again."`,th:`"Dude" เป็นกันเองเกินไปสำหรับครู และเคยเจอกันแล้วจึงใช้ "meet" ไม่ได้ ตัวเลือกที่สุภาพคือ "Good to see you again."`}},dialogueGap:{lines:[{speaker:`A`,en:`Welcome back to class, everyone.`},{speaker:`B`,en:`____`}],blankIndex:1,options:[`Good to see you again.`,`It slipped my mind.`,`How much is it?`],correct:0,explain:{en:`Returning students greet a teacher they already know, so this polite greeting fits.`,th:`นักเรียนที่กลับมาเรียนกำลังทักทายครูที่รู้จักกันอยู่แล้ว คำทักทายสุภาพนี้จึงเหมาะสม`}},speakPrompt:{en:`Greet your tutor at the start of a lesson using this expression and your tutor's name.`,th:`ทักทายติวเตอร์ตอนเริ่มบทเรียนด้วยสำนวนนี้พร้อมเรียกชื่อติวเตอร์`}},{id:`u1-9`,unit:1,text:`How have you been?`,meaning:{en:`How has your life been since we last met?`,th:`ช่วงที่ผ่านมาเป็นยังไงบ้าง`},situation:{en:`Asking about someone's life after a long gap.`,th:`ใช้ถามถึงชีวิตของอีกฝ่ายหลังไม่ได้เจอกันนาน`},ipa:`/ˌhaʊ həv ju ˈbɪn/`,thaiRead:`ฮาว-เอิฟ-ยู บิน`,chunks:[`How have you`,`been?`],stress:[`How`,`been`],pronTip:{en:`In American English "been" usually rhymes with "bin", not "bean".`,th:`ในภาษาอังกฤษแบบอเมริกัน "been" มักออกเสียงคล้าย "บิน" ไม่ใช่ "บีน"`},example:{en:`It has been ages! How have you been?`,th:`ไม่ได้เจอกันนานมาก ช่วงที่ผ่านมาเป็นยังไงบ้าง`},dialogue:[{speaker:`A`,en:`How have you been?`,th:`ช่วงที่ผ่านมาเป็นยังไงบ้าง`},{speaker:`B`,en:`Busy, but good. I moved to a new school.`,th:`ยุ่งนิดหน่อยแต่ก็ดีนะ ย้ายโรงเรียนใหม่มา`},{speaker:`A`,en:`Wow, how is it so far?`,th:`ว้าว เป็นยังไงบ้างล่ะ`}],mistake:{en:`"How are you?" asks about right now. "How have you been?" asks about the whole time since you last met.`,th:`"How are you?" ถามถึงตอนนี้ ส่วน "How have you been?" ถามถึงช่วงเวลาทั้งหมดตั้งแต่เจอกันครั้งล่าสุด`},tip:{en:`Great for someone you have not seen in months. Follow with "What have you been up to?"`,th:`เหมาะกับคนที่ไม่ได้เจอกันหลายเดือน แล้วถามต่อด้วย "What have you been up to?"`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`You meet your old neighbour after a year. What do you ask?`,th:`คุณเจอเพื่อนบ้านเก่าหลังผ่านไปหนึ่งปี จะถามว่าอะไร`},options:[`How have you been?`,`How are you been?`,`How you have been?`],correct:0,explain:{en:`The correct order is How + have + you + been. The other two mix up the word order.`,th:`ลำดับคำที่ถูกคือ How + have + you + been ส่วนอีกสองข้อเรียงคำผิด`}},dialogueGap:{lines:[{speaker:`A`,en:`Prim! I have not seen you since Grade 6.`},{speaker:`B`,en:`I know! ____`}],blankIndex:1,options:[`How have you been?`,`How much have you been?`,`How do you do it?`],correct:0,explain:{en:`After a long gap, this is the natural question about the other person's life.`,th:`หลังไม่ได้เจอกันนาน นี่คือคำถามที่เป็นธรรมชาติที่สุดเกี่ยวกับชีวิตของอีกฝ่าย`}},speakPrompt:{en:`Greet an old friend: use "Long time no see!" and "How have you been?" together.`,th:`ทักทายเพื่อนเก่า โดยใช้ "Long time no see!" คู่กับ "How have you been?"`}},{id:`u1-10`,unit:1,text:`Have a good one!`,meaning:{en:`Have a nice day — a friendly goodbye.`,th:`ขอให้เป็นวันที่ดีนะ — คำลาแบบเป็นมิตร`},situation:{en:`Ending a short, friendly conversation.`,th:`ใช้จบบทสนทนาสั้น ๆ แบบเป็นกันเอง`},ipa:`/ˌhæv ə ˈɡʊd wʌn/`,thaiRead:`แฮฟ-อะ กุด วัน`,chunks:[`Have a`,`good one!`],stress:[`good`],pronTip:{en:`"Have a" links into "HAV-uh", and "good one" sounds like "GOOD-wun".`,th:`"Have a" พูดติดกันเป็น "แฮฟ-อะ" และ "good one" ฟังเหมือน "กุด-วัน"`},example:{en:`See you tomorrow. Have a good one!`,th:`เจอกันพรุ่งนี้นะ ขอให้เป็นวันที่ดี`},dialogue:[{speaker:`A`,en:`Thanks for your help. See you Friday!`,th:`ขอบคุณที่ช่วยนะ เจอกันวันศุกร์`},{speaker:`B`,en:`No problem. Have a good one!`,th:`ไม่เป็นไร ขอให้เป็นวันที่ดีนะ`}],tip:{en:`Common with shop staff, classmates, and neighbours. In the evening, "Have a good night" fits better.`,th:`ใช้บ่อยกับพนักงานร้าน เพื่อนร่วมชั้น และเพื่อนบ้าน ถ้าเป็นตอนเย็นให้ใช้ "Have a good night" จะเหมาะกว่า`},mistake:{en:`It is a goodbye, not a greeting. Do not open a conversation with it.`,th:`ประโยคนี้ใช้ลาจาก ไม่ใช่คำทักทาย อย่าใช้เปิดบทสนทนา`},formality:`Casual`,context:`General`,bestResponse:{prompt:{en:`You are leaving a shop after paying. What is a friendly goodbye?`,th:`คุณกำลังจะออกจากร้านหลังจ่ายเงินแล้ว จะกล่าวลาแบบเป็นมิตรว่าอะไร`},options:[`Have a good one!`,`How is it going?`,`Long time no see!`],correct:0,explain:{en:`The other two are greetings, not goodbyes. "Have a good one!" closes the chat warmly.`,th:`อีกสองข้อเป็นคำทักทาย ไม่ใช่คำลา ส่วน "Have a good one!" ใช้จบบทสนทนาอย่างอบอุ่น`}},dialogueGap:{lines:[{speaker:`A`,en:`Here is your change. Thanks for coming in!`},{speaker:`B`,en:`Thank you! ____`}],blankIndex:1,options:[`Have a good one!`,`Nice to finally meet you.`,`What have you been up to?`],correct:0,explain:{en:`The conversation is ending, so a friendly goodbye is the natural choice.`,th:`บทสนทนากำลังจะจบ จึงเหมาะกับคำลาแบบเป็นมิตร`}},speakPrompt:{en:`End a short conversation with a shop assistant using this expression.`,th:`จบบทสนทนาสั้น ๆ กับพนักงานร้านด้วยสำนวนนี้`}}]},{id:2,title:`School & Everyday Life`,titleTh:`โรงเรียนและชีวิตประจำวัน`,accent:`#22c07d`,blurb:{en:`Ask for help, work with classmates, and handle small classroom moments without freezing.`,th:`ขอความช่วยเหลือ ทำงานกับเพื่อน และรับมือสถานการณ์เล็ก ๆ ในห้องเรียนได้โดยไม่ตื่นเต้น`},expressions:[{id:`u2-1`,unit:2,text:`Could you help me with this?`,meaning:{en:`A polite way to ask someone for help.`,th:`ช่วยดูตรงนี้ให้หน่อยได้ไหม — วิธีขอความช่วยเหลืออย่างสุภาพ`},situation:{en:`Asking a teacher, classmate, or parent for help with a task.`,th:`ใช้ขอความช่วยเหลือจากครู เพื่อน หรือผู้ปกครองเรื่องงานที่ทำอยู่`},ipa:`/kʊd ju ˈhɛlp mi wɪð ðɪs/`,thaiRead:`คุด-ยู เฮลพ์ มี วิธ ดิส`,chunks:[`Could you`,`help me`,`with this?`],stress:[`help`,`this`],pronTip:{en:`"Could you" often blends into "COULD-juh" in fast speech.`,th:`"Could you" เวลาพูดเร็วมักกลายเป็น "คุด-จู"`},example:{en:`Khru Mai, could you help me with this question?`,th:`ครูใหม่คะ ช่วยดูข้อนี้ให้หน่อยได้ไหมคะ`},dialogue:[{speaker:`A`,en:`Could you help me with this question?`,th:`ช่วยดูข้อนี้ให้หน่อยได้ไหม`},{speaker:`B`,en:`Sure. Which part is confusing?`,th:`ได้สิ ตรงไหนที่งงล่ะ`},{speaker:`A`,en:`The second step. I keep getting a different answer.`,th:`ขั้นที่สองครับ ผมได้คำตอบไม่ตรงสักที`}],mistake:{en:`Do not say "Please you help me." Start with "Could you" or "Can you" and put "please" at the end.`,th:`อย่าพูดว่า "Please you help me." ให้ขึ้นต้นด้วย "Could you" หรือ "Can you" แล้ววาง "please" ไว้ท้ายประโยค`},tip:{en:`"Could you" sounds softer than "Can you". Add the exact problem so the helper knows where to start.`,th:`"Could you" ฟังนุ่มกว่า "Can you" และควรบอกด้วยว่าติดตรงไหน คนช่วยจะได้เริ่มถูกจุด`},formality:`Polite`,context:`School`,bestResponse:{prompt:{en:`You are stuck on a maths problem and want your teacher's help. What do you say?`,th:`คุณติดโจทย์เลขและอยากให้ครูช่วย จะพูดว่าอะไร`},options:[`Could you help me with this?`,`You must help me now.`,`Help me this.`],correct:0,explain:{en:`"You must help me now" is an order, and "Help me this" is not correct English. The polite request is "Could you help me with this?"`,th:`"You must help me now" เป็นการสั่ง ส่วน "Help me this" ผิดไวยากรณ์ คำขอที่สุภาพคือ "Could you help me with this?"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Of course. Show me what you have tried so far.`}],blankIndex:0,options:[`Could you help me with this?`,`Could I help you with this?`,`Should you help me?`],correct:0,explain:{en:`B asks to see the learner's work, so the learner is the one asking for help.`,th:`B ขอดูงานของผู้เรียน แสดงว่าผู้เรียนเป็นฝ่ายขอความช่วยเหลือ`}},speakPrompt:{en:`Ask your teacher for help with one real homework question. Say what subject and which part.`,th:`ขอให้ครูช่วยเรื่องการบ้านจริงหนึ่งข้อ บอกด้วยว่าวิชาอะไรและติดตรงไหน`}},{id:`u2-2`,unit:2,text:`I don't get it.`,meaning:{en:`I do not understand.`,th:`ไม่เข้าใจเลย`},situation:{en:`Telling a friend or teacher that something is confusing.`,th:`ใช้บอกเพื่อนหรือครูว่าเรื่องนี้ยังงงอยู่`},ipa:`/aɪ ˈdoʊnt ˈɡɛt ɪt/`,thaiRead:`ไอ โดนท์ เก็ท-ทิท`,chunks:[`I don't`,`get it.`],stress:[`don't`,`get`],pronTip:{en:`"Get it" links together and sounds like "GEDD-it" in American English.`,th:`"Get it" พูดติดกัน ในสำเนียงอเมริกันฟังเหมือน "เก็ด-ดิท"`},example:{en:`Sorry, I don't get it. Can we go over it again?`,th:`ขอโทษนะ ยังไม่เข้าใจเลย ขอทบทวนอีกรอบได้ไหม`},dialogue:[{speaker:`A`,en:`So we divide both sides by four.`,th:`เราก็หารสองข้างด้วยสี่`},{speaker:`B`,en:`Hmm, I don't get it. Why four?`,th:`อืม ยังไม่เข้าใจ ทำไมต้องสี่`},{speaker:`A`,en:`Because four is next to the x. Look here.`,th:`เพราะสี่อยู่ติดกับ x ไง ดูตรงนี้สิ`}],mistake:{en:`Do not say "I don't get" without "it". The object is required.`,th:`อย่าพูดว่า "I don't get" เฉย ๆ ต้องมีคำว่า "it" ต่อท้ายเสมอ`},tip:{en:`This is casual and fine with friends and most teachers. In a formal meeting, say "I'm not sure I understand."`,th:`ประโยคนี้เป็นกันเอง ใช้กับเพื่อนและครูส่วนใหญ่ได้ แต่ถ้าเป็นการประชุมทางการ ให้ใช้ "I'm not sure I understand."`},formality:`Casual`,context:`School`,bestResponse:{prompt:{en:`Your friend explains a rule but it is still confusing. What do you say?`,th:`เพื่อนอธิบายกฎให้ฟังแล้วแต่ยังงงอยู่ จะพูดว่าอะไร`},options:[`I don't get it.`,`I am not get it.`,`I do not have it.`],correct:0,explain:{en:`"I do not have it" is about owning something. To say something is confusing, use "I don't get it."`,th:`"I do not have it" หมายถึงไม่มีของสิ่งนั้น ถ้าจะบอกว่าไม่เข้าใจ ให้ใช้ "I don't get it."`}},dialogueGap:{lines:[{speaker:`A`,en:`The answer is B because the graph goes down.`},{speaker:`B`,en:`____ Could you draw it for me?`}],blankIndex:1,options:[`I don't get it.`,`I got it, thanks.`,`I will take it.`],correct:0,explain:{en:`B asks for a drawing, which means B is still confused, not finished understanding.`,th:`B ขอให้วาดให้ดู แสดงว่ายังไม่เข้าใจ ไม่ใช่เข้าใจแล้ว`}},speakPrompt:{en:`Say this expression and then add one question about exactly what confuses you.`,th:`พูดสำนวนนี้ แล้วถามต่อหนึ่งคำถามว่าไม่เข้าใจตรงไหน`}},{id:`u2-3`,unit:2,text:`Can I borrow your eraser?`,meaning:{en:`May I use your eraser and give it back?`,th:`ขอยืมยางลบหน่อยได้ไหม`},situation:{en:`Asking a classmate to lend you something small.`,th:`ใช้ขอยืมของชิ้นเล็ก ๆ จากเพื่อนร่วมชั้น`},ipa:`/kən aɪ ˈbɑr.oʊ jɔr ɪˈreɪ.sər/`,thaiRead:`เคิน-ไอ บอ-โร ยัวร์ อิ-เร-เซอร์`,chunks:[`Can I`,`borrow`,`your eraser?`],stress:[`bo`,`ra`],pronTip:{en:`"Eraser" is stressed in the middle: ih-RAY-ser.`,th:`"Eraser" ลงเสียงหนักพยางค์กลาง คือ อิ-เร-เซอร์`},example:{en:`Can I borrow your eraser for a second?`,th:`ขอยืมยางลบแป๊บหนึ่งได้ไหม`},dialogue:[{speaker:`A`,en:`Can I borrow your eraser?`,th:`ขอยืมยางลบหน่อยได้ไหม`},{speaker:`B`,en:`Sure, here you go.`,th:`ได้สิ นี่จ้ะ`},{speaker:`A`,en:`Thanks! I will give it right back.`,th:`ขอบใจนะ เดี๋ยวคืนเลย`}],mistake:{en:`"Borrow" means to take; "lend" means to give. Say "Can I borrow it?" or "Can you lend it to me?" — never "Can you borrow me it?"`,th:`"Borrow" คือขอยืมมา ส่วน "lend" คือให้ยืมไป ให้พูดว่า "Can I borrow it?" หรือ "Can you lend it to me?" ห้ามพูดว่า "Can you borrow me it?"`},tip:{en:`Change the last word for anything small: your pen, your ruler, your charger.`,th:`เปลี่ยนคำท้ายประโยคเป็นของชิ้นเล็กอื่น ๆ ได้ เช่น your pen, your ruler, your charger`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`You need an eraser for one minute. What do you ask your classmate?`,th:`คุณอยากใช้ยางลบแป๊บหนึ่ง จะถามเพื่อนว่าอะไร`},options:[`Can I borrow your eraser?`,`Can you borrow my eraser?`,`Can I lend your eraser?`],correct:0,explain:{en:`You are the one taking, so you "borrow". Option B asks the friend to take yours, and option C mixes up "lend".`,th:`คุณเป็นฝ่ายขอยืม จึงใช้ "borrow" ส่วนข้อ B กลายเป็นให้เพื่อนยืมของคุณ และข้อ C ใช้ "lend" ผิด`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Here. Just pass it back when you finish.`}],blankIndex:0,options:[`Can I borrow your eraser?`,`Do you take cards?`,`What page are we on?`],correct:0,explain:{en:`B hands something over and asks for it back, so A asked to borrow an object.`,th:`B ยื่นของให้และขอคืนภายหลัง แสดงว่า A ขอยืมของ`}},speakPrompt:{en:`Ask to borrow three different things, changing only the last word each time.`,th:`ลองขอยืมของสามอย่าง โดยเปลี่ยนเฉพาะคำท้ายประโยค`}},{id:`u2-4`,unit:2,text:`I left it at home.`,meaning:{en:`I forgot the item and it is still at my house.`,th:`ลืมไว้ที่บ้าน`},situation:{en:`Explaining why you do not have your book, homework, or bag.`,th:`ใช้อธิบายว่าทำไมไม่ได้เอาหนังสือ การบ้าน หรือกระเป๋ามา`},ipa:`/aɪ ˈlɛft ɪt ət ˈhoʊm/`,thaiRead:`ไอ เลฟท์-ทิท เอิท โฮม`,chunks:[`I left it`,`at home.`],stress:[`left`,`home`],pronTip:{en:`"Left it" links to "LEF-tit". "At" is weak and quiet.`,th:`"Left it" พูดติดกันเป็น "เลฟ-ทิท" ส่วน "at" ออกเสียงเบา`},example:{en:`I am sorry — I left my worksheet at home.`,th:`ขอโทษครับ ผมลืมใบงานไว้ที่บ้าน`},dialogue:[{speaker:`A`,en:`Where is your reading book?`,th:`หนังสืออ่านของเธออยู่ไหน`},{speaker:`B`,en:`I left it at home. I am really sorry.`,th:`ลืมไว้ที่บ้านค่ะ ขอโทษจริง ๆ`},{speaker:`A`,en:`That is okay. Bring it tomorrow.`,th:`ไม่เป็นไร พรุ่งนี้เอามาแล้วกัน`}],mistake:{en:`Use "leave" with a place ("I left it at home") and "forget" without one ("I forgot my book"). "I
