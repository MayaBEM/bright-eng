[(0,j.jsx)(Kr,{size:16,"aria-hidden":`true`}),r+1>=Na.length?`Finish the challenge`:`Next scene`]})]})]})}var Fa=[{id:`sc-1`,title:`Meeting a new classmate`,titleTh:`ทำความรู้จักเพื่อนใหม่`,place:{en:`The school corridor, first day of term`,th:`ทางเดินในโรงเรียน วันแรกของเทอม`},learnerRole:{en:`You are a student in Grade 7.`,th:`คุณเป็นนักเรียนชั้น ม.1`},partnerRole:{en:`Fern, a student who just transferred here.`,th:`เฟิร์น นักเรียนที่เพิ่งย้ายมา`},goal:{en:`Greet Fern, start a friendly conversation, and offer help.`,th:`ทักทายเฟิร์น เริ่มบทสนทนาอย่างเป็นมิตร และเสนอความช่วยเหลือ`},targets:[`u1-4`,`u1-1`,`u2-1`,`u3-1`],turns:[{partner:`Hi… sorry, I am new here. Is this room 7B?`,partnerTh:`สวัสดี ขอโทษนะ ฉันเพิ่งย้ายมา ที่นี่ห้อง 7B ใช่ไหม`,goal:{en:`Say yes and introduce yourself warmly.`,th:`ตอบว่าใช่และแนะนำตัวอย่างเป็นมิตร`},options:[{text:`Yes, it is! I'm Nina. It's nice to finally meet you — we heard someone new was joining.`,quality:`best`,reply:`Oh, thank you! I am Fern. That is a relief.`,replyTh:`ขอบคุณนะ ฉันชื่อเฟิร์น โล่งอกไปที`,feedback:{en:`Perfect. You answered the question, gave your name, and made Fern feel expected.`,th:`เยี่ยมมาก คุณตอบคำถาม บอกชื่อ และทำให้เฟิร์นรู้สึกว่ามีคนรอต้อนรับ`}},{text:`Yes.`,quality:`weak`,reply:`Oh… okay. Thanks.`,replyTh:`อ๋อ... โอเค ขอบคุณ`,feedback:{en:`Correct but very short. A one-word answer ends the conversation instead of opening it.`,th:`ถูกต้องแต่สั้นมาก การตอบคำเดียวทำให้บทสนทนาจบลงแทนที่จะเริ่มต้น`}},{text:`Yes, this is 7B. Are you in this class?`,quality:`ok`,reply:`I think so. My schedule says 7B.`,replyTh:`น่าจะใช่ ตารางเรียนเขียนว่า 7B`,feedback:{en:`Friendly and useful. Adding your own name would make it even warmer.`,th:`เป็นมิตรและมีประโยชน์ ถ้าบอกชื่อตัวเองด้วยจะอบอุ่นยิ่งขึ้น`}}]},{partner:`Everyone already knows each other. It feels a bit scary.`,partnerTh:`ทุกคนรู้จักกันหมดแล้ว รู้สึกกลัวนิดหน่อย`,goal:{en:`Show understanding instead of only giving advice.`,th:`แสดงความเข้าใจ ไม่ใช่แค่ให้คำแนะนำ`},options:[{text:`I know how you feel. I moved schools in Grade 5 and my first week was the same.`,quality:`best`,reply:`Really? How did it go after that?`,replyTh:`จริงเหรอ แล้วหลังจากนั้นเป็นยังไง`,feedback:{en:`Excellent. Sharing a similar experience makes the other person feel normal, not alone.`,th:`ยอดเยี่ยม การเล่าประสบการณ์คล้ายกันทำให้อีกฝ่ายรู้สึกว่าไม่ได้แปลกและไม่ได้อยู่คนเดียว`}},{text:`Do not worry about it. It is easy.`,quality:`ok`,reply:`I hope so.`,replyTh:`ก็หวังว่าอย่างนั้นนะ`,feedback:{en:`Kind, but calling it "easy" can accidentally make the feeling sound small.`,th:`ใจดีนะ แต่การบอกว่า "ง่าย" อาจทำให้ความรู้สึกของอีกฝ่ายดูเป็นเรื่องเล็ก`}},{text:`Everyone feels that. You will be fine.`,quality:`weak`,reply:`Yeah… okay.`,replyTh:`อือ... โอเค`,feedback:{en:`This closes the topic quickly. Try naming the feeling before reassuring.`,th:`ประโยคนี้ปิดหัวข้อเร็วเกินไป ลองพูดถึงความรู้สึกก่อนจะปลอบใจ`}}]},{partner:`Where is the canteen? I could not find it this morning.`,partnerTh:`โรงอาหารอยู่ไหนเหรอ เช้านี้หาไม่เจอเลย`,goal:{en:`Offer to go together instead of only pointing.`,th:`เสนอไปด้วยกันแทนที่จะแค่ชี้ทาง`},options:[{text:`It is downstairs, near the library. Do you want to hang out at lunch? I can show you.`,quality:`best`,reply:`That would be great. Thank you so much!`,replyTh:`ดีเลย ขอบคุณมากนะ`,feedback:{en:`Great combination — directions plus an invitation. That is how friendships start.`,th:`ผสมผสานได้ดีมาก ทั้งบอกทางและชวนไปด้วยกัน นี่คือจุดเริ่มต้นของมิตรภาพ`}},{text:`Downstairs, near the library.`,quality:`ok`,reply:`Okay, I will look again. Thanks.`,replyTh:`โอเค เดี๋ยวไปหาใหม่ ขอบคุณนะ`,feedback:{en:`Clear and helpful, but it misses the chance to invite Fern along.`,th:`ชัดเจนและช่วยได้ แต่พลาดโอกาสที่จะชวนเฟิร์นไปด้วย`}},{text:`Just follow the crowd at lunchtime.`,quality:`weak`,reply:`Um, okay.`,replyTh:`อืม โอเค`,feedback:{en:`Vague and a little dismissive for someone who is already lost.`,th:`คลุมเครือและดูไม่ค่อยใส่ใจสำหรับคนที่หลงทางอยู่แล้ว`}}]}],finalChallenge:{en:`Record a 3-sentence introduction: greet a new classmate, say your name, and invite them to lunch.`,th:`อัดเสียงแนะนำตัวสามประโยค ทักทายเพื่อนใหม่ บอกชื่อตัวเอง และชวนไปกินข้าวเที่ยงด้วยกัน`}},{id:`sc-2`,title:`Asking a teacher for help`,titleTh:`ขอความช่วยเหลือจากครู`,place:{en:`The classroom, after the lesson`,th:`ห้องเรียน หลังเลิกคาบ`},learnerRole:{en:`You did not understand today’s maths topic.`,th:`คุณไม่เข้าใจเนื้อหาคณิตศาสตร์ของวันนี้`},partnerRole:{en:`Khru Anna, your maths teacher, who is packing up.`,th:`ครูแอนนา ครูคณิตศาสตร์ที่กำลังเก็บของ`},goal:{en:`Ask politely for help and explain exactly what confuses you.`,th:`ขอความช่วยเหลืออย่างสุภาพ และอธิบายให้ชัดว่าไม่เข้าใจตรงไหน`},targets:[`u2-7`,`u2-1`,`u2-2`,`u6-8`],turns:[{partner:`Yes? Did you need something?`,partnerTh:`มีอะไรหรือเปล่าจ๊ะ`,goal:{en:`Respect the teacher’s time before you ask.`,th:`แสดงความเกรงใจเวลาของครูก่อนจะถาม`},options:[{text:`Do you have a minute? I have one question about today’s lesson.`,quality:`best`,reply:`Of course. Let me put these down. What is your question?`,replyTh:`ได้จ้ะ ขอวางของก่อนนะ มีคำถามอะไรจ๊ะ`,feedback:{en:`Ideal. Asking for "a minute" shows respect and makes it easy to say yes.`,th:`สมบูรณ์แบบ การขอเวลา "สักครู่" แสดงความเกรงใจและทำให้ครูตอบตกลงได้ง่าย`}},{text:`I need help now.`,quality:`weak`,reply:`All right… give me a moment, please.`,replyTh:`ได้จ้ะ... ขอเวลาสักครู่นะ`,feedback:{en:`This sounds like a demand. Start with a question, not an order.`,th:`ฟังเหมือนการเรียกร้อง ควรเริ่มด้วยคำถาม ไม่ใช่คำสั่ง`}},{text:`Sorry to bother you, could I ask something?`,quality:`ok`,reply:`You are not bothering me. Go ahead.`,replyTh:`ไม่ได้รบกวนเลยจ้ะ ถามได้เลย`,feedback:{en:`Polite and safe. Naming how long you need is even clearer.`,th:`สุภาพและปลอดภัย แต่ถ้าบอกด้วยว่าใช้เวลาแค่ไหนจะชัดเจนกว่า`}}]},{partner:`Which part of the lesson was difficult?`,partnerTh:`ตรงไหนของบทเรียนที่ยากจ๊ะ`,goal:{en:`Name the exact step instead of saying "everything".`,th:`บอกขั้นตอนที่ติดให้ชัด แทนที่จะบอกว่า "ทั้งหมด"`},options:[{text:`I am stuck on this part — step three, where we divide both sides.`,quality:`best`,reply:`Ah, that step confuses a lot of people. Look here…`,replyTh:`อ๋อ ขั้นนั้นหลายคนงงเหมือนกัน ดูตรงนี้นะ`,feedback:{en:`Excellent. A specific problem gets a specific answer, and saves time for both of you.`,th:`เยี่ยมมาก การบอกปัญหาที่เจาะจงทำให้ได้คำตอบที่ตรงจุดและประหยัดเวลาทั้งสองฝ่าย`}},{text:`I do not get it.`,quality:`ok`,reply:`Okay — can you show me where you stopped?`,replyTh:`โอเค ลองชี้ให้ครูดูหน่อยว่าติดตรงไหน`,feedback:{en:`Honest and natural, but the teacher still has to guess where to start.`,th:`ตรงไปตรงมาและเป็นธรรมชาติ แต่ครูยังต้องเดาว่าจะเริ่มอธิบายตรงไหน`}},{text:`Everything. The whole lesson was too fast.`,quality:`weak`,reply:`Hmm. Then let us start from the very beginning tomorrow.`,replyTh:`อืม งั้นพรุ่งนี้เรามาเริ่มใหม่ตั้งแต่ต้นนะ`,feedback:{en:`"Everything" makes the problem sound bigger than it is. Point at one step first.`,th:`การบอกว่า "ทั้งหมด" ทำให้ปัญหาดูใหญ่เกินจริง ควรชี้ที่ขั้นตอนเดียวก่อน`}}]},{partner:`Does that make sense now?`,partnerTh:`ตอนนี้เข้าใจแล้วใช่ไหมจ๊ะ`,goal:{en:`Check your understanding honestly.`,th:`ตรวจสอบความเข้าใจของตัวเองอย่างตรงไปตรงมา`},options:[{text:`That makes sense. Could you show me how with one more example?`,quality:`best`,reply:`Sure. Let us try question four together.`,replyTh:`ได้เลย มาลองข้อสี่ด้วยกันนะ`,feedback:{en:`Great. You confirmed your understanding and asked for practice — that is how it sticks.`,th:`ดีมาก คุณยืนยันว่าเข้าใจแล้วและขอฝึกเพิ่ม ซึ่งเป็นวิธีที่ทำให้จำได้จริง`}},{text:`Yes, thank you.`,quality:`ok`,reply:`Good. Ask me again tomorrow if you need to.`,replyTh:`ดีจ้ะ พรุ่งนี้ถ้ายังไม่แน่ใจมาถามได้อีกนะ`,feedback:{en:`Polite, but if you are only half sure, one more example would help you more.`,th:`สุภาพดี แต่ถ้ายังไม่แน่ใจเต็มร้อย การขอตัวอย่างเพิ่มจะช่วยได้มากกว่า`}},{text:`Yes, yes. I understand everything.`,quality:`weak`,reply:`Wonderful. See you tomorrow then.`,replyTh:`ดีมากจ้ะ งั้นเจอกันพรุ่งนี้นะ`,feedback:{en:`Saying you understand when you do not means the same problem returns in the test.`,th:`การบอกว่าเข้าใจทั้งที่ยังไม่เข้าใจ จะทำให้ปัญหาเดิมกลับมาตอนสอบ`}}]}],finalChallenge:{en:`Record yourself asking a teacher for help: ask for a minute, name the exact step, and thank them.`,th:`อัดเสียงขอความช่วยเหลือจากครู โดยขอเวลาสักครู่ บอกขั้นตอนที่ติด และกล่าวขอบคุณ`}},{id:`sc-3`,title:`Inviting a friend to an activity`,titleTh:`ชวนเพื่อนไปทำกิจกรรม`,place:{en:`Message chat after school`,th:`แชทหลังเลิกเรียน`},learnerRole:{en:`You want company at the Saturday book fair.`,th:`คุณอยากชวนเพื่อนไปงานหนังสือวันเสาร์`},partnerRole:{en:`Beam, your classmate.`,th:`บีม เพื่อนร่วมชั้น`},goal:{en:`Check if Beam is free, invite them, and agree on a time.`,th:`เช็กว่าบีมว่างไหม ชวนไปด้วยกัน และตกลงเวลา`},targets:[`u3-2`,`u3-1`,`u3-3`,`u8-7`],turns:[{partner:`Hey! What is up?`,partnerTh:`เฮ้ มีอะไรเหรอ`,goal:{en:`Check availability before inviting.`,th:`เช็กว่าเขาว่างไหมก่อนจะชวน`},options:[{text:`Are you free on Saturday?`,quality:`best`,reply:`In the afternoon, yes. Why?`,replyTh:`ตอนบ่ายว่างนะ ทำไมเหรอ`,feedback:{en:`Perfect first move. It gives your friend an easy way to answer honestly.`,th:`เปิดได้ดีมาก เพราะเปิดโอกาสให้เพื่อนตอบตามจริงได้ง่าย`}},{text:`You have to come to the book fair on Saturday.`,quality:`weak`,reply:`Oh… I might have football practice though.`,replyTh:`เอ่อ... แต่เราอาจจะมีซ้อมบอลนะ`,feedback:{en:`"You have to" removes their choice. Invitations work better as questions.`,th:`คำว่า "You have to" ทำให้เพื่อนไม่มีทางเลือก คำชวนควรอยู่ในรูปคำถาม`}},{text:`There is a book fair on Saturday. Interested?`,quality:`ok`,reply:`Maybe! What time is it?`,replyTh:`ก็น่าสนใจนะ กี่โมงเหรอ`,feedback:{en:`Works well. Asking about their schedule first avoids an awkward no.`,th:`ใช้ได้ดี แต่ถ้าถามเรื่องเวลาว่างก่อนจะช่วยให้ไม่ต้องปฏิเสธแบบเก้อ ๆ`}}]},{partner:`What did you have in mind?`,partnerTh:`คิดจะทำอะไรเหรอ`,goal:{en:`Make a clear, easy invitation.`,th:`ชวนให้ชัดเจนและตอบรับง่าย`},options:[{text:`Do you want to hang out at the book fair? There is a comic section too.`,quality:`best`,reply:`Count me in! I love comics.`,replyTh:`เอาด้วยสิ ชอบการ์ตูนมากเลย`,feedback:{en:`Great — you invited them and gave one reason they would enjoy it.`,th:`ดีมาก คุณชวนพร้อมบอกเหตุผลหนึ่งอย่างที่เพื่อนน่าจะชอบ`}},{text:`Something at the book fair, I guess.`,quality:`weak`,reply:`Hmm. I am not sure yet.`,replyTh:`อืม ยังไม่แน่ใจเลย`,feedback:{en:`Too vague to accept. Give one concrete detail so it is easy to say yes.`,th:`คลุมเครือเกินกว่าจะตอบตกลง ควรให้รายละเอียดชัดเจนหนึ่งอย่างเพื่อให้ตอบรับได้ง่าย`}},{text:`The book fair. Want to come?`,quality:`ok`,reply:`Sure, sounds good to me.`,replyTh:`ได้สิ ฟังดูดีนะ`,feedback:{en:`Clear and friendly. One extra detail would make it even more tempting.`,th:`ชัดเจนและเป็นมิตร ถ้าเพิ่มรายละเอียดอีกนิดจะน่าสนใจยิ่งขึ้น`}}]},{partner:`What time should we meet — two or three?`,partnerTh:`เจอกันกี่โมงดี บ่ายสองหรือบ่ายสาม`,goal:{en:`Agree on a time without being unhelpful.`,th:`ตกลงเวลาโดยไม่โยนภาระให้อีกฝ่ายทั้งหมด`},options:[{text:`It is up to you — both work for me. Two is a bit quieter, though.`,quality:`best`,reply:`Let us do two then. See you at the gate!`,replyTh:`งั้นบ่ายสองนะ เจอกันที่ประตู`,feedback:{en:`Excellent. You gave them the choice but still helped them decide.`,th:`เยี่ยมมาก คุณให้เพื่อนเลือกแต่ก็ยังช่วยให้ตัดสินใจได้`}},{text:`Two. See you there.`,quality:`ok`,reply:`Okay, two it is.`,replyTh:`โอเค บ่ายสองนะ`,feedback:{en:`Decisive and clear, though a little abrupt for a friend.`,th:`เด็ดขาดและชัดเจน แต่อาจฟังห้วนไปนิดสำหรับเพื่อน`}},{text:`I do not care.`,quality:`weak`,reply:`Oh. Okay, I will pick then.`,replyTh:`อ๋อ โอเค งั้นเราเลือกเองนะ`,feedback:{en:`"I do not care" sounds uninterested. "It is up to you" is the friendly version.`,th:`"I do not care" ฟังเหมือนไม่สนใจ ควรใช้ "It is up to you" ซึ่งเป็นมิตรกว่า`}}]}],finalChallenge:{en:`Record a complete invitation: check the day, invite, give one detail, and agree on a time.`,th:`อัดเสียงคำชวนแบบครบ เช็กวันว่าง ชวน บอกรายละเอียดหนึ่งอย่าง และตกลงเวลา`}},{id:`sc-4`,title:`Ordering food at a café`,titleTh:`สั่งอาหารที่คาเฟ่`,place:{en:`A busy café at lunchtime`,th:`คาเฟ่ที่คนเยอะช่วงกลางวัน`},learnerRole:{en:`You are a customer visiting for the first time.`,th:`คุณเป็นลูกค้าที่มาครั้งแรก`},partnerRole:{en:`A friendly server.`,th:`พนักงานเสิร์ฟที่เป็นมิตร`},goal:{en:`Ask for a recommendation, order politely, and take it away.`,th:`ขอคำแนะนำ สั่งอาหารอย่างสุภาพ และสั่งกลับบ้าน`},targets:[`u5-4`,`u5-7`,`u5-6`,`u5-10`],turns:[{partner:`Hi! Are you ready to order?`,partnerTh:`สวัสดีค่ะ พร้อมสั่งหรือยังคะ`,goal:{en:`Ask for advice because you do not know the menu.`,th:`ขอคำแนะนำเพราะยังไม่รู้จักเมนู`},options:[{text:`It is my first time here. What do you recommend?`,quality:`best`,reply:`The chicken noodles are our most popular dish.`,replyTh:`ก๋วยเตี๋ยวไก่ขายดีที่สุดค่ะ`,feedback:{en:`Great. Saying it is your first visit makes the recommendation more useful.`,th:`ดีมาก การบอกว่ามาครั้งแรกช่วยให้คำแนะนำตรงกับเรามากขึ้น`}},{text:`What is good here?`,quality:`ok`,reply:`Most people like the noodles.`,replyTh:`ส่วนใหญ่ชอบก๋วยเตี๋ยวค่ะ`,feedback:{en:`Natural and fine. "What do you recommend?" sounds a little more polished.`,th:`เป็นธรรมชาติและใช้ได้ แต่ "What do you recommend?" ฟังดูเรียบร้อยกว่า`}},{text:`Give me something.`,quality:`weak`,reply:`Um… what kind of food do you like?`,replyTh:`เอ่อ... ชอบอาหารแบบไหนคะ`,feedback:{en:`Too vague and it sounds like an order rather than a request.`,th:`คลุมเครือเกินไปและฟังเหมือนคำสั่งมากกว่าคำขอ`}}]},{partner:`Would you like to try them?`,partnerTh:`อยากลองไหมคะ`,goal:{en:`Order politely using a complete sentence.`,th:`สั่งอาหารอย่างสุภาพด้วยประโยคเต็ม`},options:[{text:`Yes, I'd like the noodles, please. Not too spicy.`,quality:`best`,reply:`Of course. Mild spice, coming up.`,replyTh:`ได้ค่ะ เผ็ดน้อยนะคะ`,feedback:{en:`Perfect ordering. You were polite and added one clear preference.`,th:`สั่งได้สมบูรณ์แบบ ทั้งสุภาพและบอกความต้องการชัดเจนหนึ่งอย่าง`}},{text:`I want noodles.`,quality:`ok`,reply:`Sure, one noodles.`,replyTh:`ได้ค่ะ ก๋วยเตี๋ยวหนึ่งที่`,feedback:{en:`Understandable, but "I want" sounds blunt to a server. "I'd like… please" is smoother.`,th:`เข้าใจได้ แต่ "I want" ฟังห้วนสำหรับพนักงาน ควรใช้ "I'd like… please" จะนุ่มกว่า`}},{text:`Noodles.`,quality:`weak`,reply:`Okay… anything to drink?`,replyTh:`ค่ะ... รับเครื่องดื่มด้วยไหมคะ`,feedback:{en:`One word is not rude in every culture, but in English it can sound abrupt.`,th:`การพูดคำเดียวไม่ได้หยาบในทุกวัฒนธรรม แต่ในภาษาอังกฤษอาจฟังห้วน`}}]},{partner:`For here or to go?`,partnerTh:`ทานที่ร้านหรือใส่กลับคะ`,goal:{en:`Take the food away and check how you can pay.`,th:`สั่งกลับบ้านและเช็กวิธีจ่ายเงิน`},options:[{text:`Can I get this to go? And do you take cards?`,quality:`best`,reply:`Yes to both. Card machine is right here.`,replyTh:`ได้ทั้งสองอย่างค่ะ เครื่องรูดบัตรอยู่ตรงนี้ค่ะ`,feedback:{en:`Efficient and natural. Two short questions in one friendly turn.`,th:`กระชับและเป็นธรรมชาติ ถามสองคำถามสั้น ๆ ในทีเดียวอย่างเป็นมิตร`}},{text:`To go, please.`,quality:`ok`,reply:`Sure, one moment.`,replyTh:`ได้ค่ะ รอสักครู่นะคะ`,feedback:{en:`Short and correct. Ask about payment now if you have no cash.`,th:`สั้นและถูกต้อง ถ้าไม่มีเงินสดควรถามเรื่องการจ่ายเงินตอนนี้เลย`}},{text:`I take it back home.`,quality:`weak`,reply:`Sorry — did you mean takeaway?`,replyTh:`ขอโทษค่ะ หมายถึงใส่กลับใช่ไหมคะ`,feedback:{en:`A word-for-word translation. English uses the fixed phrase "to go".`,th:`เป็นการแปลตรงตัว ภาษาอังกฤษใช้สำนวนตายตัวว่า "to go"`}}]}],finalChallenge:{en:`Record a full café order: ask for a recommendation, order politely, and ask for it to go.`,th:`อัดเสียงสั่งอาหารที่คาเฟ่แบบครบ ขอคำแนะนำ สั่งอย่างสุภาพ และขอใส่กลับบ้าน`}},{id:`sc-5`,title:`Buying clothes`,titleTh:`ซื้อเสื้อผ้า`,place:{en:`A clothing shop in a mall`,th:`ร้านเสื้อผ้าในห้าง`},learnerRole:{en:`You are looking for a jacket.`,th:`คุณกำลังมองหาแจ็กเก็ต`},partnerRole:{en:`A shop assistant.`,th:`พนักงานขาย`},goal:{en:`Browse, ask for a size, check the price, and decide.`,th:`เดินดูของ ขอไซซ์ เช็กราคา และตัดสินใจ`},targets:[`u5-5`,`u5-2`,`u5-8`,`u5-3`],turns:[{partner:`Hello! Can I help you find anything?`,partnerTh:`สวัสดีค่ะ ให้ช่วยหาอะไรไหมคะ`,goal:{en:`Politely say you want to browse first.`,th:`บอกอย่างสุภาพว่าขอเดินดูก่อน`},options:[{text:`I'm just looking, thanks. I will ask if I need help.`,quality:`best`,reply:`No problem, take your time.`,replyTh:`ได้ค่ะ ตามสบายเลยนะคะ`,feedback:{en:`Polite and clear. The extra sentence keeps the door open.`,th:`สุภาพและชัดเจน ประโยคเสริมทำให้ยังขอความช่วยเหลือได้ทีหลัง`}},{text:`No.`,quality:`weak`,reply:`Oh… okay.`,replyTh:`อ๋อ... ได้ค่ะ`,feedback:{en:`A bare "No" sounds cold in English. Add "thanks" at minimum.`,th:`การตอบว่า "No" เฉย ๆ ฟังเย็นชาในภาษาอังกฤษ อย่างน้อยควรเติม "thanks"`}},{text:`I am looking for a jacket.`,quality:`ok`,reply:`Great — jackets are on the left wall.`,replyTh:`ได้ค่ะ แจ็กเก็ตอยู่ผนังด้านซ้ายค่ะ`,feedback:{en:`Direct and useful if you already know what you want.`,th:`ตรงประเด็นและมีประโยชน์ถ้ารู้อยู่แล้วว่าต้องการอะไร`}}]},{partner:`That jacket looks nice on you. How does it fit?`,partnerTh:`แจ็กเก็ตตัวนั้นใส่แล้วดูดีนะคะ ใส่แล้วเป็นยังไงบ้างคะ`,goal:{en:`Ask for a different size.`,th:`ขอไซซ์อื่น`},options:[{text:`It is a bit tight. Do you have this in a bigger size?`,quality:`best`,reply:`Let me check the stockroom. Large, right?`,replyTh:`ขอเช็กในสต็อกนะคะ ไซซ์ L ใช่ไหมคะ`,feedback:{en:`Perfect. You explained the problem and asked for the exact solution.`,th:`สมบูรณ์แบบ คุณอธิบายปัญหาและขอสิ่งที่ต้องการอย่างชัดเจน`}},{text:`Do you have more big?`,quality:`weak`,reply:`Sorry, do you mean a larger size?`,replyTh:`ขอโทษค่ะ หมายถึงไซซ์ใหญ่ขึ้นใช่ไหมคะ`,feedback:{en:`The comparative of "big" is "bigger", not "more big".`,th:`รูปเปรียบเทียบของ "big" คือ "bigger" ไม่ใช่ "more big"`}},{text:`It is tight.`,quality:`ok`,reply:`Would you like to try a larger one?`,replyTh:`ลองไซซ์ใหญ่ขึ้นไหมคะ`,feedback:{en:`The assistant guessed correctly, but asking directly is faster.`,th:`พนักงานเดาถูก แต่ถ้าถามตรง ๆ จะเร็วกว่า`}}]},{partner:`Here is the large. It suits you!`,partnerTh:`นี่ไซซ์ L ค่ะ เข้ากับคุณมากเลย`,goal:{en:`Check the price, then decide.`,th:`เช็กราคาแล้วตัดสินใจ`},options:[{text:`Is this on sale? … Great, I will take it.`,quality:`best`,reply:`Yes, 20% off this week. I will ring it up.`,replyTh:`ใช่ค่ะ สัปดาห์นี้ลด 20% เดี๋ยวคิดเงินให้นะคะ`,feedback:{en:`Smart shopping — check the discount before you commit, then decide clearly.`,th:`ช้อปอย่างฉลาด เช็กส่วนลดก่อนแล้วค่อยตัดสินใจอย่างชัดเจน`}},{text:`How much is this?`,quality:`ok`,reply:`It is 1,200 baht, or 960 with the sale.`,replyTh:`ราคา 1,200 บาทค่ะ ลดแล้วเหลือ 960 ค่ะ`,feedback:{en:`Good question. Now say clearly whether you will take it.`,th:`ถามได้ดี ต่อไปควรบอกให้ชัดว่าจะซื้อหรือไม่`}},{text:`Maybe. I do not know.`,quality:`weak`,reply:`Take your time. I will be at the counter.`,replyTh:`ตามสบายค่ะ เดี๋ยวรออยู่ที่เคาน์เตอร์นะคะ`,feedback:{en:`It is fine to hesitate, but "Let me think about it" is the clear, polite version.`,th:`ลังเลได้ไม่ผิด แต่ "Let me think about it" เป็นวิธีพูดที่ชัดเจนและสุภาพกว่า`}}]}],finalChallenge:{en:`Record a shopping conversation: browse politely, ask for a size, check the price, and buy it.`,th:`อัดเสียงบทสนทนาซื้อของ เดินดูอย่างสุภาพ ขอไซซ์ เช็กราคา และตัดสินใจซื้อ`}},{id:`sc-6`,title:`Asking for directions`,titleTh:`ถามทาง`,place:{en:`A street near the BTS station`,th:`ถนนใกล้สถานีรถไฟฟ้า`},learnerRole:{en:`You cannot find the public library.`,th:`คุณหาห้องสมุดประชาชนไม่เจอ`},partnerRole:{en:`A helpful stranger waiting at a crossing.`,th:`คนแปลกหน้าใจดีที่ยืนรอข้ามถนน`},goal:{en:`Ask politely, understand the answer, and check you got it right.`,th:`ถามอย่างสุภาพ เข้าใจคำตอบ และทวนให้แน่ใจ`},targets:[`u6-1`,`u6-2`,`u6-4`,`u1-10`],turns:[{partner:`Yes? Did you say something?`,partnerTh:`คะ พูดอะไรหรือเปล่าคะ`,goal:{en:`Open politely before asking a stranger.`,th:`เปิดบทสนทนาอย่างสุภาพก่อนถามคนแปลกหน้า`},options:[{text:`Excuse me, could you help me? I am looking for the public library.`,quality:`best`,reply:`Sure! It is about five minutes that way.`,replyTh:`ได้ค่ะ เดินไปทางนั้นประมาณห้านาทีค่ะ`,feedback:{en:`Ideal opening — polite, clear, and easy for a stranger to answer.`,th:`เปิดได้ดีที่สุด ทั้งสุภาพ ชัดเจน และคนแปลกหน้าตอบได้ง่าย`}},{text:`Where is the library?`,quality:`ok`,reply:`Down that road, past the market.`,replyTh:`ไปตามถนนนั้น เลยตลาดไปค่ะ`,feedback:{en:`Understandable, but starting with "Excuse me" is much friendlier.`,th:`เข้าใจได้ แต่ถ้าขึ้นต้นด้วย "Excuse me" จะเป็นมิตรกว่ามาก`}},{text:`Library. Where?`,quality:`weak`,reply:`Erm… the one on Sathorn Road?`,replyTh:`เอ่อ... ที่อยู่ถนนสาทรใช่ไหมคะ`,feedback:{en:`Too short to be clear. Full questions get better answers.`,th:`สั้นเกินไปจนไม่ชัดเจน การถามเป็นประโยคเต็มจะได้คำตอบที่ดีกว่า`}}]},{partner:`Goleftatthelightsthenrightafterthebankandit is on your left.`,partnerTh:`เลี้ยวซ้ายตรงไฟแดงแล้วเลี้ยวขวาหลังธนาคาร แล้วมันจะอยู่ทางซ้ายมือ`,goal:{en:`Slow the speaker down instead of pretending to understand.`,th:`ขอให้พูดช้าลงแทนที่จะแกล้งทำเป็นเข้าใจ`},options:[{text:`Sorry, could you speak a little slower, please?`,quality:`best`,reply:`Of course! Left at the lights… then right after the bank.`,replyTh:`ได้ค่ะ เลี้ยวซ้ายตรงไฟแดง... แล้วเลี้ยวขวาหลังธนาคารค่ะ`,feedback:{en:`Exactly right. Asking for slower speech is normal and polite.`,th:`ถูกต้องเลย การขอให้พูดช้าลงเป็นเรื่องปกติและสุภาพ`}},{text:`Sorry, I didn't catch that.`,quality:`ok`,reply:`No problem — left at the lights, then right.`,replyTh:`ไม่เป็นไรค่ะ เลี้ยวซ้ายตรงไฟแดง แล้วเลี้ยวขวาค่ะ`,feedback:{en:`Good, natural choice. It gets a repeat, though maybe at the same speed.`,th:`เป็นตัวเลือกที่ดีและเป็นธรรมชาติ จะได้ฟังซ้ำ แต่อาจยังเร็วเท่าเดิม`}},{text:`Yes, thank you.`,quality:`weak`,reply:`You are welcome! Good luck.`,replyTh:`ยินดีค่ะ โชคดีนะคะ`,feedback:{en:`You still do not know the way. Pretending to understand costs you time later.`,th:`คุณยังไม่รู้ทางอยู่ดี การแกล้งทำเป็นเข้าใจจะทำให้เสียเวลาทีหลัง`}}]},{partner:`Does that make sense?`,partnerTh:`เข้าใจไหมคะ`,goal:{en:`Repeat the directions back and thank them.`,th:`ทวนเส้นทางกลับไปและกล่าวขอบคุณ`},options:[{text:`So, left at the lights and right after the bank. Thank you so much — have a good one!`,quality:`best`,reply:`That is it. You are welcome!`,replyTh:`ถูกต้องเลยค่ะ ยินดีค่ะ`,feedback:{en:`Excellent. Repeating back is the best way to be sure, and the goodbye is warm.`,th:`เยี่ยมมาก การทวนกลับเป็นวิธียืนยันความเข้าใจที่ดีที่สุด และคำลาก็อบอุ่น`}},{text:`Yes, thanks!`,quality:`ok`,reply:`Great, good luck!`,replyTh:`ดีค่ะ โชคดีนะคะ`,feedback:{en:`Polite, but repeating the directions would confirm you really understood.`,th:`สุภาพดี แต่ถ้าทวนเส้นทางกลับไปจะยืนยันได้ว่าเข้าใจจริง`}},{text:`No.`,quality:`weak`,reply:`Oh… would you like me to write it down?`,replyTh:`อ๋อ... ให้เขียนให้ไหมคะ`,feedback:{en:`Honest, but say what part you missed so the person can help you faster.`,th:`ตรงไปตรงมาดี แต่ควรบอกว่าไม่เข้าใจตรงไหน อีกฝ่ายจะช่วยได้เร็วขึ้น`}}]}],finalChallenge:{en:`Record yourself asking for directions and repeating them back in your own words.`,th:`อัดเสียงถามทางและทวนเส้นทางกลับด้วยคำพูดของคุณเอง`}},{id:`sc-7`,title:`Making weekend plans`,titleTh:`วางแผนสุดสัปดาห์`,place:{en:`The school bus on Friday afternoon`,th:`รถโรงเรียนบ่ายวันศุกร์`},learnerRole:{en:`You want to plan Saturday with two friends.`,th:`คุณอยากวางแผนวันเสาร์กับเพื่อนสองคน`},partnerRole:{en:`Ploy, who has a different idea.`,th:`พลอย ที่มีไอเดียคนละอย่าง`},goal:{en:`Suggest a plan, listen to another idea, and agree together.`,th:`เสนอแผน รับฟังไอเดียอื่น และตกลงร่วมกัน`},targets:[`u7-5`,`u7-6`,`u7-10`,`u3-3`],turns:[{partner:`So what should we do tomorrow?`,partnerTh:`พรุ่งนี้จะทำอะไรกันดี`,goal:{en:`Suggest something without deciding for everyone.`,th:`เสนอไอเดียโดยไม่ตัดสินใจแทนทุกคน`},options:[{text:`Why don't we start with the market and then go to the park?`,quality:`best`,reply:`Ooh, I like that. But the market is crowded in the morning.`,replyTh:`ชอบนะ แต่ตลาดตอนเช้าคนเยอะมากเลย`,feedback:{en:`Great suggestion form. It invites others to agree or adjust.`,th:`เป็นรูปแบบการเสนอที่ดี เพราะเปิดให้คนอื่นเห็นด้วยหรือปรับได้`}},{text:`We are going to the market. I already decided.`,quality:`weak`,reply:`Oh… okay, I guess.`,replyTh:`อ๋อ... ก็ได้มั้ง`,feedback:{en:`Deciding alone can upset friends. Suggestions keep everyone included.`,th:`การตัดสินใจคนเดียวอาจทำให้เพื่อนไม่พอใจ การเสนอทำให้ทุกคนมีส่วนร่วม`}},{text:`I do not mind. Anything is fine.`,quality:`ok`,reply:`Hmm, then I will think of something.`,replyTh:`อืม งั้นเดี๋ยวเราคิดให้`,feedback:{en:`Flexible is nice, but with no idea at all the planning stalls.`,th:`ยืดหยุ่นก็ดี แต่ถ้าไม่มีไอเดียเลย การวางแผนจะไปต่อไม่ได้`}}]},{partner:`What if we go in the afternoon instead? It is cooler then.`,partnerTh:`ถ้าไปตอนบ่ายแทนล่ะ อากาศเย็นกว่า`,goal:{en:`Recognise a good idea from someone else.`,th:`ยอมรับไอเดียที่ดีของคนอื่น`},options:[{text:`That's a good point. Afternoon works better then.`,quality:`best`,reply:`Great, so two o clock at the gate?`,replyTh:`เยี่ยม งั้นบ่ายสองที่ประตูนะ`,feedback:{en:`Excellent. Accepting a better idea makes group plans work.`,th:`เยี่ยมมาก การยอมรับไอเดียที่ดีกว่าทำให้แผนกลุ่มไปต่อได้`}},{text:`No, morning is better.`,quality:`weak`,reply:`Okay… but it will be really hot.`,replyTh:`ก็ได้... แต่มันจะร้อนมากนะ`,feedback:{en:`Refusing without a reason ignores a fair point. At least explain why.`,th:`การปฏิเสธโดยไม่มีเหตุผลเป็นการมองข้ามประเด็นที่ดี อย่างน้อยควรอธิบายว่าทำไม`}},{text:`Sure, whatever you want.`,quality:`ok`,reply:`Are you sure? I do not want to force you.`,replyTh:`แน่ใจเหรอ ไม่อยากบังคับนะ`,feedback:{en:`Agreeing is fine, but "whatever you want" can sound like you do not care.`,th:`เห็นด้วยได้ แต่ "whatever you want" อาจฟังเหมือนไม่สนใจ`}}]},{partner:`Oh no — it says rain all afternoon tomorrow.`,partnerTh:`แย่แล้ว พยากรณ์บอกว่าพรุ่งนี้บ่ายฝนตกทั้งบ่ายเลย`,goal:{en:`Offer a workable alternative.`,th:`เสนอทางเลือกที่ทำได้จริง`},options:[{text:`How about this instead? We could go to the library café — it is indoors.`,quality:`best`,reply:`Perfect. Sounds good to me!`,replyTh:`เยี่ยม ฟังดูดีเลย`,feedback:{en:`Excellent problem solving — a new plan with a reason attached.`,th:`แก้ปัญหาได้เยี่ยม เสนอแผนใหม่พร้อมเหตุผล`}},{text:`Then let us cancel.`,quality:`weak`,reply:`Aw, really? I was looking forward to it.`,replyTh:`เหรอ ตั้งตารอตั้งนาน`,feedback:{en:`Cancelling is the fastest option, but rain does not have to end the plan.`,th:`การยกเลิกเป็นทางออกที่เร็วที่สุด แต่ฝนตกไม่จำเป็นต้องทำให้แผนล้มเสมอไป`}},{text:`We can bring umbrellas.`,quality:`ok`,reply:`True, but the park will be muddy.`,replyTh:`จริง แต่สวนคงเป็นโคลนหมด`,feedback:{en:`Practical thinking. An indoor backup would solve it completely.`,th:`คิดได้เป็นรูปธรรมดี แต่ถ้ามีแผนสำรองในร่มจะแก้ปัญหาได้ทั้งหมด`}}]}],finalChallenge:{en:`Record a plan for next weekend: suggest, accept a friend’s point, and offer a backup for rain.`,th:`อัดเสียงวางแผนสุดสัปดาห์หน้า เสนอแผน ยอมรับประเด็นของเพื่อน และเสนอแผนสำรองเผื่อฝนตก`}},{id:`sc-8`,title:`Apologising for being late`,titleTh:`ขอโทษที่มาสาย`,place:{en:`The library, 20 minutes after the meeting time`,th:`ห้องสมุด หลังเวลานัด 20 นาที`},learnerRole:{en:`You are late for a group project meeting.`,th:`คุณมาสายสำหรับนัดประชุมงานกลุ่ม`},partnerRole:{en:`Gun, your project partner, who has been waiting.`,th:`กัน เพื่อนร่วมโปรเจกต์ที่รออยู่`},goal:{en:`Apologise, explain honestly, and get the work moving.`,th:`ขอโทษ อธิบายตามจริง และเริ่มงานต่อ`},targets:[`u6-9`,`u8-10`,`u3-8`,`u2-5`],turns:[{partner:`There you are! I have been waiting since four.`,partnerTh:`มาแล้วเหรอ รอตั้งแต่สี่โมงเลยนะ`,goal:{en:`Apologise before you explain.`,th:`ขอโทษก่อนแล้วค่อยอธิบาย`},options:[{text:`I am really sorry. Let me explain what happened — my bus broke down.`,quality:`best`,reply:`Oh no, that is bad luck. Are you okay?`,replyTh:`แย่จัง โชคร้ายนะ ไม่เป็นไรใช่ไหม`,feedback:{en:`Perfect order: apology first, reason second. That never sounds like an excuse.`,th:`เรียงลำดับได้ดี ขอโทษก่อนแล้วค่อยบอกเหตุผล จะไม่ฟังเหมือนหาข้ออ้าง`}},{text:`The bus broke down. It was not my fault.`,quality:`weak`,reply:`Okay, but I still waited twenty minutes.`,replyTh:`โอเค แต่เราก็รอตั้งยี่สิบนาทีนะ`,feedback:{en:`Defending yourself before apologising makes the other person feel ignored.`,th:`การแก้ตัวก่อนขอโทษทำให้อีกฝ่ายรู้สึกว่าถูกมองข้าม`}},{text:`Sorry I am late.`,quality:`ok`,reply:`It is okay. What happened?`,replyTh:`ไม่เป็นไร เกิดอะไรขึ้นเหรอ`,feedback:{en:`A clean apology. Adding the reason shows you are being open.`,th:`ขอโทษได้ตรงไปตรงมา ถ้าบอกเหตุผลด้วยจะแสดงถึงความจริงใจ`}}]},{partner:`Why did you not message me?`,partnerTh:`ทำไมไม่ทักบอกกันล่ะ`,goal:{en:`Take responsibility without over-explaining.`,th:`ยอมรับผิดโดยไม่ต้องอธิบายยืดยาว`},options:[{text:`You are right — it slipped my mind while I was running. I will message next time.`,quality:`best`,reply:`Thanks. That is all I wanted to hear.`,replyTh:`ขอบใจนะ แค่อยากได้ยินแค่นี้แหละ`,feedback:{en:`Excellent. You admitted it and promised a fix — short and honest.`,th:`เยี่ยมมาก คุณยอมรับและบอกวิธีแก้ สั้นและจริงใจ`}},{text:`My phone was at two percent and then it died and then I could not find a charger and…`,quality:`ok`,reply:`Okay, okay. Let us just start.`,replyTh:`โอเค ๆ เริ่มงานกันเถอะ`,feedback:{en:`A long explanation can start to sound like an excuse. Keep it short.`,th:`คำอธิบายที่ยาวเกินไปอาจเริ่มฟังเหมือนข้ออ้าง ควรพูดสั้น ๆ`}},{text:`You could have messaged me too.`,quality:`weak`,reply:`I did. Twice.`,replyTh:`ทักไปแล้ว สองครั้ง`,feedback:{en:`Turning it back on your friend makes the problem bigger, not smaller.`,th:`การย้อนกลับไปโทษเพื่อนทำให้ปัญหาใหญ่ขึ้น ไม่ใช่เล็กลง`}}]},{partner:`Anyway, we still have an hour. Where should we start?`,partnerTh:`เอาเถอะ ยังเหลืออีกชั่วโมง เริ่มจากตรงไหนดี`,goal:{en:`Move the work forward as a team.`,th:`เดินหน้างานต่อในฐานะทีม`},options:[{text:`Let's work on it together — I will do the slides while you write the notes.`,quality:`best`,reply:`Deal. That will save time.`,replyTh:`ตกลง แบบนี้จะประหยัดเวลา`,feedback:{en:`Great recovery. Taking a share of the work rebuilds trust fast.`,th:`กู้สถานการณ์ได้ดีมาก การรับผิดชอบงานส่วนหนึ่งช่วยสร้างความไว้ใจกลับมาเร็ว`}},{text:`You decide. I am tired.`,quality:`weak`,reply:`Seriously? I have been waiting for you.`,replyTh:`เอาจริงเหรอ เรารอเธอมาตั้งนาน`,feedback:{en:`After being late, this puts all the effort on your partner.`,th:`หลังจากมาสาย การพูดแบบนี้เป็นการโยนภาระทั้งหมดให้เพื่อน`}},{text:`Let us start with the easy part.`,quality:`ok`,reply:`Sure. The pictures first, then.`,replyTh:`ได้ เริ่มจากรูปก่อนแล้วกัน`,feedback:{en:`A sensible plan. Offering to take a specific task would be even better.`,th:`เป็นแผนที่สมเหตุสมผล แต่ถ้าเสนอรับงานที่ชัดเจนจะดียิ่งขึ้น`}}]}],finalChallenge:{en:`Record a three-part apology: say sorry, explain briefly, and offer how you will make it up.`,th:`อัดเสียงคำขอโทษสามส่วน กล่าวขอโทษ อธิบายสั้น ๆ และบอกว่าจะแก้ไขอย่างไร`}},{id:`sc-9`,title:`Asking someone to repeat`,titleTh:`ขอให้พูดซ้ำ`,place:{en:`A noisy school announcement in the hall`,th:`หอประชุมที่กำลังประกาศเสียงดัง`},learnerRole:{en:`You missed the details of tomorrow’s schedule.`,th:`คุณฟังรายละเอียดตารางพรุ่งนี้ไม่ทัน`},partnerRole:{en:`Nut, a classmate standing next to you.`,th:`นัท เพื่อนที่ยืนอยู่ข้าง ๆ`},goal:{en:`Get the missing information without pretending to understand.`,th:`ขอข้อมูลที่พลาดไปโดยไม่แกล้งทำเป็นเข้าใจ`},targets:[`u6-2`,`u6-1`,`u2-8`,`u8-3`],turns:[{partner:`Did you hear that? We meet at the north gate.`,partnerTh:`ได้ยินไหม เขาบอกให้ไปเจอกันที่ประตูเหนือ`,goal:{en:`Admit you missed it.`,th:`ยอมรับว่าฟังไม่ทัน`},options:[{text:`Sorry, I didn't catch that. Which gate?`,quality:`best`,reply:`The north gate — the one by the basketball court.`,replyTh:`ประตูเหนือ อันที่อยู่ข้างสนามบาสน่ะ`,feedback:{en:`Perfect. You admitted it and asked one focused question.`,th:`สมบูรณ์แบบ ทั้งยอมรับว่าฟังไม่ทันและถามเจาะจงหนึ่งคำถาม`}},{text:`Yes, I heard.`,quality:`weak`,reply:`Great, see you there!`,replyTh:`ดี เจอกันที่นั่นนะ`,feedback:{en:`Now you will go to the wrong gate. Pretending never saves time.`,th:`แบบนี้คุณจะไปผิดประตู การแกล้งทำเป็นเข้าใจไม่เคยช่วยประหยัดเวลา`}},{text:`What?`,quality:`ok`,reply:`The north gate.`,replyTh:`ประตูเหนือ`,feedback:{en:`It works with friends, but a single "What?" can sound sharp to others.`,th:`ใช้กับเพื่อนได้ แต่การพูดว่า "What?" คำเดียวอาจฟังห้วนสำหรับคนอื่น`}}]},{partner:`And bring your permission slip to Khru Wanwisa.`,partnerTh:`แล้วก็เอาใบอนุญาตไปให้ครูวรรณวิสาด้วย`,goal:{en:`Check the name you are not sure about.`,th:`เช็กชื่อที่คุณไม่แน่ใจ`},options:[{text:`How do you spell that? I want to write it down correctly.`,quality:`best`,reply:`W-A-N-W-I-S-A. She teaches Grade 8.`,replyTh:`W-A-N-W-I-S-A ครูสอน ม.2 น่ะ`,feedback:{en:`Great habit. Spelling a name out loud prevents mistakes later.`,th:`เป็นนิสัยที่ดี การให้สะกดชื่อช่วยป้องกันความผิดพลาดภายหลัง`}},{text:`Okay, got it.`,quality:`weak`,reply:`Cool.`,replyTh:`เยี่ยม`,feedback:{en:`If you are not sure of the name, "got it" only delays the problem.`,th:`ถ้ายังไม่แน่ใจชื่อ การบอกว่า "got it" เป็นแค่การเลื่อนปัญหาออกไป`}},{text:`Could you say that again, please?`,quality:`ok`,reply:`Khru Wanwisa. The Grade 8 teacher.`,replyTh:`ครูวรรณวิสา ครูชั้น ม.2 น่ะ`,feedback:{en:`Good. Asking for the spelling would make it certain.`,th:`ดีแล้ว แต่ถ้าขอให้สะกดจะแน่ใจกว่า`}}]},{partner:`So — north gate, 7:30, with the slip. Clear?`,partnerTh:`สรุปนะ ประตูเหนือ เจ็ดโมงครึ่ง พร้อมใบอนุญาต ชัดเจนไหม`,goal:{en:`Confirm that you now understand.`,th:`ยืนยันว่าตอนนี้เข้าใจแล้ว`},options:[{text:`That makes sense. North gate at 7:30 with the slip. Thanks!`,quality:`best`,reply:`Exactly. See you tomorrow!`,replyTh:`ถูกต้อง เจอกันพรุ่งนี้`,feedback:{en:`Excellent. Repeating the key facts proves you really got them.`,th:`เยี่ยมมาก การทวนข้อมูลสำคัญพิสูจน์ว่าคุณเข้าใจจริง`}},{text:`Yes, clear.`,quality:`ok`,reply:`Great.`,replyTh:`ดีเลย`,feedback:{en:`Fine, but repeating the details is a stronger check.`,th:`ใช้ได้ แต่การทวนรายละเอียดเป็นการตรวจสอบที่ดีกว่า`}},{text:`I think so.`,quality:`weak`,reply:`You think so? Let me write it down for you.`,replyTh:`คิดว่านะ งั้นเดี๋ยวเขียนให้`,feedback:{en:`If you are unsure, say which part. Guessing leads to missed meetings.`,th:`ถ้าไม่แน่ใจ ควรบอกว่าตรงไหน การเดาอาจทำให้พลาดนัด`}}]}],finalChallenge:{en:`Record yourself asking for a repeat, asking for a spelling, and repeating the details back.`,th:`อัดเสียงขอให้พูดซ้ำ ขอให้สะกดคำ และทวนรายละเอียดกลับไป`}},{id:`sc-10`,title:`Sharing an opinion in class`,titleTh:`แสดงความคิดเห็นในห้องเรียน`,place:{en:`English class discussion`,th:`คาบภาษาอังกฤษ ช่วงอภิปราย`},learnerRole:{en:`You disagree with a classmate’s idea.`,th:`คุณไม่เห็นด้วยกับความคิดของเพื่อน`},partnerRole:{en:`Ohm, who thinks homework should be banned.`,th:`โอม ที่คิดว่าควรยกเลิกการบ้าน`},goal:{en:`Disagree politely and support your view with a reason.`,th:`แย้งอย่างสุภาพและสนับสนุนความเห็นด้วยเหตุผล`},targets:[`u3-7`,`u7-2`,`u7-6`,`u7-1`],turns:[{partner:`I think homework is useless. We should ban it completely.`,partnerTh:`เราว่าการบ้านไม่มีประโยชน์ ควรยกเลิกไปเลย`,goal:{en:`Disagree without attacking the person.`,th:`แย้งโดยไม่โจมตีตัวบุคคล`},options:[{text:`I'm not so sure about that. Some homework helps me remember the lesson.`,quality:`best`,reply:`Hmm, maybe short homework is different.`,replyTh:`อืม การบ้านสั้น ๆ อาจจะต่างออกไปนะ`,feedback:{en:`Excellent. You softened the disagreement and gave a real reason.`,th:`เยี่ยมมาก คุณแย้งอย่างนุ่มนวลและให้เหตุผลจริง`}},{text:`That is completely wrong.`,quality:`weak`,reply:`Wow. Okay then.`,replyTh:`โห โอเค`,feedback:{en:`Too harsh for a classroom. It ends discussion instead of continuing it.`,th:`แรงเกินไปสำหรับห้องเรียน เป็นการปิดการอภิปรายแทนที่จะสานต่อ`}},{text:`Really? Why do you think so?`,quality:`ok`,reply:`Because we already study for six hours.`,replyTh:`ก็เพราะเราเรียนกันตั้งหกชั่วโมงแล้ว`,feedback:{en:`A good question, though it does not yet show your own view.`,th:`เป็นคำถามที่ดี แต่ยังไม่ได้แสดงความเห็นของคุณเอง`}}]},{partner:`But we already study six hours a day. That is enough.`,partnerTh:`แต่เราเรียนวันละหกชั่วโมงแล้วนะ น่าจะพอ`,goal:{en:`Acknowledge the good part of their argument.`,th:`ยอมรับส่วนที่ดีในเหตุผลของอีกฝ่าย`},options:[{text:`That's a good point. In my opinion, it is worth trying shorter homework instead of none.`,quality:`best`,reply:`Actually, that could work. Twenty minutes maybe?`,replyTh:`จริงด้วย น่าจะเวิร์กนะ สักยี่สิบนาทีไหม`,feedback:{en:`Outstanding. Agreeing partly and then offering a middle idea is real discussion skill.`,th:`ยอดเยี่ยม การเห็นด้วยบางส่วนแล้วเสนอทางสายกลางคือทักษะการอภิปรายที่แท้จริง`}},{text:`No, six hours is not enough.`,quality:`weak`,reply:`You just want more work?`,replyTh:`เธออยากได้งานเพิ่มเหรอ`,feedback:{en:`Flat contradiction. Recognise their point first, then add yours.`,th:`เป็นการเถียงตรง ๆ ควรยอมรับประเด็นของเขาก่อนแล้วค่อยเสริมของเรา`}},{text:`Maybe. I am not sure.`,quality:`ok`,reply:`So you agree with me?`,replyTh:`แสดงว่าเห็นด้วยกับเราใช่ไหม`,feedback:{en:`Honest, but in a discussion you need to state a position eventually.`,th:`ตรงไปตรงมา แต่ในการอภิปรายสุดท้ายก็ต้องแสดงจุดยืน`}}]},{partner:`Okay — twenty minutes of homework, but no weekend homework. Deal?`,partnerTh:`โอเค การบ้านยี่สิบนาที แต่ไม่มีการบ้านวันหยุด ตกลงไหม`,goal:{en:`Close the discussion agreeably.`,th:`ปิดการอภิปรายอย่างลงตัว`},options:[{text:`I think so too. Let us present that idea to the class.`,quality:`best`,reply:`Great, I will write it on the board.`,replyTh:`เยี่ยม เดี๋ยวเขียนขึ้นกระดานให้`,feedback:{en:`Perfect ending — you agreed and moved to action.`,th:`จบได้สมบูรณ์แบบ ทั้งเห็นด้วยและนำไปสู่การลงมือทำ`}},{text:`Fine, whatever.`,quality:`weak`,reply:`You do not sound happy about it.`,replyTh:`ฟังดูไม่ค่อยเต็มใจนะ`,feedback:{en:`"Whatever" sounds like you gave up rather than agreed.`,th:`"Whatever" ฟังเหมือนยอมแพ้มากกว่าจะเห็นด้วย`}},{text:`Sounds good to me.`,quality:`ok`,reply:`Cool. Let us tell the teacher.`,replyTh:`เยี่ยม ไปบอกครูกัน`,feedback:{en:`A clean agreement — natural and friendly.`,th:`เป็นการตอบตกลงที่ชัดเจน เป็นธรรมชาติและเป็นมิตร`}}]}],finalChallenge:{en:`Record a 30-second opinion: state your view, give one reason, and accept one opposing point.`,th:`อัดเสียงแสดงความคิดเห็น 30 วินาที บอกจุดยืน ให้เหตุผลหนึ่งข้อ และยอมรับประเด็นของอีกฝ่ายหนึ่งข้อ`}}],Ia=[{id:`sc-11`,title:`Encouraging a nervous friend`,titleTh:`ให้กำลังใจเพื่อนที่ตื่นเต้น`,place:{en:`Backstage before the speech contest`,th:`หลังเวทีก่อนแข่งพูด`},learnerRole:{en:`You are supporting your friend.`,th:`คุณเป็นคนให้กำลังใจเพื่อน`},partnerRole:{en:`Mook, who speaks in five minutes.`,th:`มุก ที่จะขึ้นพูดในอีกห้านาที`},goal:{en:`Calm your friend, show belief, and give one practical tip.`,th:`ทำให้เพื่อนใจเย็นลง แสดงความเชื่อมั่น และให้คำแนะนำที่ใช้ได้จริงหนึ่งอย่าง`},targets:[`u4-5`,`u8-9`,`u8-2`,`u3-9`],turns:[{partner:`My hands are shaking. I think I am going to forget everything.`,partnerTh:`มือสั่นไปหมด รู้สึกว่าจะลืมทุกอย่างเลย`,goal:{en:`Show understanding before advice.`,th:`แสดงความเข้าใจก่อนจะให้คำแนะนำ`},options:[{text:`I know how you feel. My hands shook before my first speech too.`,quality:`best`,reply:`Really? You looked so calm up there.`,replyTh:`จริงเหรอ ตอนนั้นดูใจเย็นมากเลยนะ`,feedback:{en:`Perfect. Understanding first makes your advice land much better.`,th:`เยี่ยม การแสดงความเข้าใจก่อนทำให้คำแนะนำของคุณได้ผลมากขึ้น`}},{text:`Just relax. It is not a big deal.`,quality:`weak`,reply:`It is a big deal to me.`,replyTh:`สำหรับเรามันเรื่องใหญ่นะ`,feedback:{en:`Telling someone to relax rarely works, and it makes their feeling sound small.`,th:`การบอกให้ใจเย็นมักไม่ได้ผล และทำให้ความรู้สึกของเขาดูเป็นเรื่องเล็ก`}},{text:`That is normal before a speech.`,quality:`ok`,reply:`I guess so.`,replyTh:`ก็คงงั้นแหละ`,feedback:{en:`True and kind. A personal example would connect even more.`,th:`จริงและใจดี แต่ถ้าเล่าประสบการณ์ตัวเองด้วยจะเชื่อมใจกันมากกว่า`}}]},{partner:`What if I go blank in the middle?`,partnerTh:`ถ้าพูดไปแล้วนึกอะไรไม่ออกกลางคันล่ะ`,goal:{en:`Give one small, usable tip.`,th:`ให้คำแนะนำเล็ก ๆ ที่ใช้ได้จริงหนึ่งอย่าง`},options:[{text:`If that happens, pause and look at your first card. Hang in there — it passes fast.`,quality:`best`,reply:`Okay. Pause and look at the card. I can do that.`,replyTh:`โอเค หยุดแล้วดูการ์ดใบแรก เราทำได้`,feedback:{en:`Excellent — a concrete plan plus encouragement is the strongest combination.`,th:`ยอดเยี่ยม แผนที่ทำได้จริงบวกกำลังใจคือส่วนผสมที่ทรงพลังที่สุด`}},{text:`That will not happen.`,quality:`weak`,reply:`But what if it does?`,replyTh:`แต่ถ้ามันเกิดขึ้นล่ะ`,feedback:{en:`You cannot promise that. A backup plan calms people more than a promise.`,th:`เราสัญญาแบบนั้นไม่ได้ แผนสำรองช่วยให้ใจเย็นได้มากกว่าคำสัญญา`}},{text:`Just remember your notes.`,quality:`ok`,reply:`I will try.`,replyTh:`จะพยายามนะ`,feedback:{en:`Reasonable, but a specific action is easier to follow under pressure.`,th:`พอใช้ได้ แต่การบอกวิธีที่ชัดเจนจะทำตามง่ายกว่าเวลาตื่นเต้น`}}]},{partner:`They are calling my name. Okay… here I go.`,partnerTh:`เขาเรียกชื่อเราแล้ว เอาล่ะ ไปแล้วนะ`,goal:{en:`Send them off with confidence.`,th:`ส่งเพื่อนขึ้นเวทีด้วยความมั่นใจ`},options:[{text:`You've got this. You practised this speech all week.`,quality:`best`,reply:`Thank you. That really helps.`,replyTh:`ขอบคุณนะ ช่วยได้เยอะเลย`,feedback:{en:`Perfect timing. Confidence plus evidence is far stronger than "good luck".`,th:`จังหวะดีมาก ความมั่นใจบวกหลักฐานหนักแน่นกว่าคำว่า "โชคดี"`}},{text:`Good luck. Do not mess up.`,quality:`weak`,reply:`Thanks… I think.`,replyTh:`ขอบใจนะ... มั้ง`,feedback:{en:`The second half plants exactly the fear you were trying to remove.`,th:`ประโยคหลังไปปลูกความกลัวที่เรากำลังพยายามเอาออกพอดี`}},{text:`Do not give up!`,quality:`ok`,reply:`I will not!`,replyTh:`ไม่ยอมแพ้แน่นอน`,feedback:{en:`Encouraging, though it fits a long struggle better than a single moment.`,th:`ให้กำลังใจได้ดี แต่เหมาะกับเรื่องที่ต้องสู้ยาว ๆ มากกว่าช่วงเวลาสั้น ๆ`}}]}],finalChallenge:{en:`Record 20 seconds of encouragement for a nervous friend, with one concrete tip.`,th:`อัดเสียงให้กำลังใจเพื่อนที่ตื่นเต้น 20 วินาที พร้อมคำแนะนำที่ทำได้จริงหนึ่งข้อ`}},{id:`sc-12`,title:`Talking about a difficult assignment`,titleTh:`คุยเรื่องงานที่ยาก`,place:{en:`The classroom, project week`,th:`ห้องเรียน ช่วงสัปดาห์ทำโปรเจกต์`},learnerRole:{en:`Your group project feels too big.`,th:`โปรเจกต์กลุ่มของคุณดูใหญ่เกินไป`},partnerRole:{en:`Fah, your project partner.`,th:`ฟ้า เพื่อนร่วมโปรเจกต์`},goal:{en:`Admit the difficulty, break it down, and share the work.`,th:`ยอมรับว่างานยาก แบ่งงานเป็นส่วนย่อย และแบ่งกันทำ`},targets:[`u6-8`,`u7-5`,`u2-5`,`u8-2`],turns:[{partner:`Have you started the research part yet?`,partnerTh:`เริ่มทำส่วนหาข้อมูลหรือยัง`,goal:{en:`Be honest about where you are.`,th:`บอกตามตรงว่าตอนนี้ทำถึงไหน`},options:[{text:`I started, but I am stuck on this part — finding good sources.`,quality:`best`,reply:`Oh, I can help with that. I found three yesterday.`,replyTh:`อ๋อ เรื่องนั้นเราช่วยได้ เมื่อวานเจอมาสามแหล่ง`,feedback:{en:`Great. Naming the exact blocker turns a problem into a task someone can help with.`,th:`ดีมาก การบอกจุดที่ติดชัด ๆ เปลี่ยนปัญหาให้เป็นงานที่คนอื่นช่วยได้`}},{text:`Not yet. It is too hard.`,quality:`ok`,reply:`Yeah, it is a lot. Where do we even start?`,replyTh:`ใช่ งานเยอะมาก จะเริ่มตรงไหนดี`,feedback:{en:`Honest, but "too hard" gives your partner nothing to work with.`,th:`ตรงไปตรงมา แต่คำว่า "ยากเกินไป" ไม่ได้ให้ข้อมูลที่เพื่อนจะช่วยได้`}},{text:`Yes, almost finished.`,quality:`weak`,reply:`Great! Send it to me tonight then.`,replyTh:`เยี่ยม งั้นคืนนี้ส่งมาให้ด้วยนะ`,feedback:{en:`Saying work is done when it is not creates a much bigger problem later.`,th:`การบอกว่าทำเสร็จทั้งที่ยังไม่เสร็จจะสร้างปัญหาใหญ่กว่าเดิมทีหลัง`}}]},{partner:`The whole thing is due in four days. I am panicking.`,partnerTh:`ทั้งหมดต้องส่งในสี่วัน เริ่มแพนิกแล้ว`,goal:{en:`Break the work into a first step.`,th:`แบ่งงานออกเป็นก้าวแรกที่ทำได้`},options:[{text:`Why don't we start with the easy part? The pictures take twenty minutes.`,quality:`best`,reply:`That actually sounds doable. Let us do that now.`,replyTh:`ฟังดูทำได้จริงนะ เริ่มเลยดีกว่า`,feedback:{en:`Excellent. A small first step is the best cure for panic.`,th:`เยี่ยมมาก ก้าวแรกเล็ก ๆ คือยาที่ดีที่สุดสำหรับความตื่นตระหนก`}},{text:`Do not worry, four days is plenty.`,quality:`ok`,reply:`Is it? We have not written anything.`,replyTh:`เหรอ เรายังไม่ได้เขียนอะไรเลยนะ`,feedback:{en:`Reassuring, but without a plan the worry comes straight back.`,th:`ปลอบใจได้ แต่ถ้าไม่มีแผน ความกังวลก็จะกลับมาทันที`}},{text:`I know. We are going to fail.`,quality:`weak`,reply:`That is not helping.`,replyTh:`พูดแบบนี้ไม่ช่วยเลยนะ`,feedback:{en:`Sharing panic doubles it. Offer a first step instead.`,th:`การตื่นตระหนกไปด้วยกันยิ่งทำให้แย่ ควรเสนอก้าวแรกแทน`}}]},{partner:`Who does what, then?`,partnerTh:`แล้วใครทำอะไรบ้าง`,goal:{en:`Divide the work clearly.`,th:`แบ่งงานให้ชัดเจน`},options:[{text:`Let's work on it together — I will take the slides, you take the writing. Deal?`,quality:`best`,reply:`Deal. Send me your slides on Wednesday.`,replyTh:`ตกลง วันพุธส่งสไลด์มาให้ด้วยนะ`,feedback:{en:`Perfect. Clear roles and a clear check-in point.`,th:`สมบูรณ์แบบ ทั้งบทบาทชัดเจนและมีจุดนัดเช็กงาน`}},{text:`You choose. I will do the rest.`,quality:`ok`,reply:`Okay… I will take the writing then.`,replyTh:`โอเค งั้นเราเขียนแล้วกัน`,feedback:{en:`Flexible, but leaving all the choosing to your partner is extra work for them.`,th:`ยืดหยุ่นดี แต่การให้เพื่อนตัดสินใจทั้งหมดคือภาระเพิ่มของเขา`}},{text:`I will do everything.`,quality:`weak`,reply:`That is not fair to you. It is a group project.`,replyTh:`แบบนั้นไม่แฟร์กับเธอนะ นี่มันงานกลุ่ม`,feedback:{en:`Generous, but group work means sharing. You will burn out.`,th:`ใจดีมาก แต่งานกลุ่มคือการแบ่งกันทำ ไม่งั้นคุณจะหมดแรง`}}]}],finalChallenge:{en:`Record how you would split a big project: name your part, your partner’s part, and a check-in day.`,th:`อัดเสียงอธิบายวิธีแบ่งงานใหญ่ บอกส่วนของคุณ ส่วนของเพื่อน และวันนัดเช็กงาน`}},{id:`sc-13`,title:`Returning an incorrect order`,titleTh:`แจ้งเรื่องออร์เดอร์ผิด`,place:{en:`A noodle restaurant`,th:`ร้านก๋วยเตี๋ยว`},learnerRole:{en:`You received the wrong dish.`,th:`คุณได้อาหารผิดจาน`},partnerRole:{en:`A polite server.`,th:`พนักงานเสิร์ฟที่สุภาพ`},goal:{en:`Report the problem politely and get it fixed.`,th:`แจ้งปัญหาอย่างสุภาพและให้เขาแก้ไข`},targets:[`u6-6`,`u5-7`,`u3-8`,`u5-9`],turns:[{partner:`Here you are — one spicy pork noodle soup!`,partnerTh:`นี่ค่ะ ก๋วยเตี๋ยวหมูต้มยำหนึ่งชาม`,goal:{en:`Point out the mistake without blaming.`,th:`ชี้ให้เห็นข้อผิดพลาดโดยไม่ตำหนิ`},options:[{text:`Excuse me, I think there's been a mistake. I ordered the chicken noodles.`,quality:`best`,reply:`Oh, I am so sorry! Let me check the order slip.`,replyTh:`ขอโทษจริง ๆ ค่ะ ขอเช็กใบออร์เดอร์ก่อนนะคะ`,feedback:{en:`Perfect. Polite, clear, and it names what you actually ordered.`,th:`สมบูรณ์แบบ ทั้งสุภาพ ชัดเจน และบอกด้วยว่าสั่งอะไรไว้`}},{text:`This is wrong. You made a mistake.`,quality:`weak`,reply:`I… let me check, ma’am.`,replyTh:`เอ่อ... ขอเช็กก่อนนะคะ`,feedback:{en:`Blaming the person makes it tense. Point at the problem instead.`,th:`การตำหนิตัวบุคคลทำให้บรรยากาศตึงเครียด ควรพูดถึงตัวปัญหาแทน`}},{text:`Um, I did not order this.`,quality:`ok`,reply:`Sorry! What did you order?`,replyTh:`ขอโทษค่ะ สั่งอะไรไว้คะ`,feedback:{en:`Clear enough, though saying what you did order saves a step.`,th:`ชัดเจนพอใช้ แต่ถ้าบอกด้วยว่าสั่งอะไรจะประหยัดไปหนึ่งขั้น`}}]},{partner:`You are right, I brought table six’s order. Sorry about that!`,partnerTh:`ถูกต้องค่ะ หนูเอาของโต๊ะหกมาให้ ขอโทษจริง ๆ ค่ะ`,goal:{en:`Accept the apology graciously.`,th:`รับคำขอโทษอย่างมีน้ำใจ`},options:[{text:`Don't worry about it. These things happen.`,quality:`best`,reply:`Thank you for understanding. Your dish will be five minutes.`,replyTh:`ขอบคุณที่เข้าใจค่ะ อาหารของคุณอีกห้านาทีนะคะ`,feedback:{en:`Kind and natural. Being gracious usually gets you faster, friendlier service.`,th:`ใจดีและเป็นธรรมชาติ การมีน้ำใจมักทำให้ได้รับบริการที่เร็วและเป็นมิตรกว่า`}},{text:`It is fine, but please hurry.`,quality:`ok`,reply:`Of course, right away.`,replyTh:`ได้ค่ะ เดี๋ยวรีบเลยค่ะ`,feedback:{en:`Reasonable if you are in a rush, though it adds a little pressure.`,th:`สมเหตุสมผลถ้ากำลังรีบ แต่ก็เพิ่มความกดดันนิดหน่อย`}},{text:`This always happens here.`,quality:`weak`,reply:`I… am sorry to hear that.`,replyTh:`เอ่อ... ขอโทษด้วยค่ะ`,feedback:{en:`A general complaint does not fix today’s problem and sounds unkind.`,th:`การบ่นแบบเหมารวมไม่ได้แก้ปัญหาวันนี้ และฟังดูไม่มีน้ำใจ`}}]},{partner:`Here is the correct dish. Anything else?`,partnerTh:`นี่จานที่ถูกต้องค่ะ รับอะไรเพิ่มไหมคะ`,goal:{en:`Finish the meal politely.`,th:`ปิดมื้ออาหารอย่างสุภาพ`},options:[{text:`This looks great, thank you. Could I get the check, please?`,quality:`best`,reply:`Of course. I will bring it right over.`,replyTh:`ได้ค่ะ เดี๋ยวเอามาให้นะคะ`,feedback:{en:`Excellent. A compliment plus a polite request closes the visit well.`,th:`เยี่ยมมาก คำชมบวกคำขออย่างสุภาพช่วยปิดท้ายได้ดี`}},{text:`No.`,quality:`weak`,reply:`Okay… enjoy your meal.`,replyTh:`ค่ะ... ทานให้อร่อยนะคะ`,feedback:{en:`A bare "No" sounds cold. "No, thank you" is the minimum.`,th:`การตอบว่า "No" เฉย ๆ ฟังเย็นชา อย่างน้อยควรพูดว่า "No, thank you"`}},{text:`No, thank you.`,quality:`ok`,reply:`Enjoy your meal!`,replyTh:`ทานให้อร่อยนะคะ`,feedback:{en:`Polite and complete. You can add the check request when you are ready.`,th:`สุภาพและครบถ้วน ค่อยขอเช็กบิลตอนพร้อมก็ได้`}}]}],finalChallenge:{en:`Record how you would report a wrong order politely and ask for the correct one.`,th:`อัดเสียงแจ้งเรื่องอาหารผิดจานอย่างสุภาพ และขอจานที่ถูกต้อง`}},{id:`sc-14`,title:`Choosing between two options`,titleTh:`เลือกระหว่างสองตัวเลือก`,place:{en:`The club sign-up table`,th:`โต๊ะรับสมัครชมรม`},learnerRole:{en:`You can only join one club.`,th:`คุณเลือกเข้าชมรมได้แค่ชมรมเดียว`},partnerRole:{en:`Pin, a club leader helping you decide.`,th:`ปิ่น หัวหน้าชมรมที่ช่วยคุณตัดสินใจ`},goal:{en:`Weigh both options out loud and commit to one.`,th:`ชั่งน้ำหนักทั้งสองตัวเลือกออกมาเป็นคำพูด แล้วเลือกหนึ่งอย่าง`},targets:[`u7-8`,`u7-9`,`u7-3`,`u7-4`],turns:[{partner:`So, drama club or photography club?`,partnerTh:`เอาไงดี ชมรมการแสดงหรือชมรมถ่ายภาพ`,goal:{en:`Say honestly that you have not decided.`,th:`บอกตามตรงว่ายังตัดสินใจไม่ได้`},options:[{text:`I'm not sure yet. I like both for different reasons.`,quality:`best`,reply:`That is fair. What do you like about each one?`,replyTh:`ก็จริงนะ ชอบอะไรในแต่ละชมรมเหรอ`,feedback:{en:`Honest and open — it invites the other person to help you think.`,th:`ตรงไปตรงมาและเปิดกว้าง ทำให้อีกฝ่ายช่วยคิดได้`}},{text:`I do not know.`,quality:`ok`,reply:`Okay… take your time.`,replyTh:`โอเค... ค่อย ๆ คิดนะ`,feedback:{en:`True but closed. Adding why makes the conversation continue.`,th:`จริงแต่ปิดบทสนทนา ถ้าบอกเหตุผลด้วยจะคุยต่อได้`}},{text:`Whichever is easier.`,quality:`weak`,reply:`Hmm, that is not really how clubs work.`,replyTh:`อืม ชมรมมันไม่ได้ดูกันแบบนั้นนะ`,feedback:{en:`Choosing only by difficulty ignores what you actually enjoy.`,th:`การเลือกจากความง่ายอย่างเดียวเป็นการมองข้ามสิ่งที่เราชอบจริง ๆ`}}]},{partner:`Drama meets twice a week. Photography meets on Saturdays. Which suits you?`,partnerTh:`ชมรมการแสดงเจอกันสัปดาห์ละสองครั้ง ถ่ายภาพเจอวันเสาร์ อันไหนเหมาะกับเธอ`,goal:{en:`Explain that your answer has conditions.`,th:`อธิบายว่าคำตอบขึ้นอยู่กับเงื่อนไข`},options:[{text:`It depends. If I have tutoring on Saturdays, drama works better.`,quality:`best`,reply:`Good thinking. Check your tutoring schedule first.`,replyTh:`คิดดีนะ ไปเช็กตารางติวก่อนสิ`,feedback:{en:`Excellent. "It depends on…" turns a hard choice into a checkable question.`,th:`เยี่ยมมาก "It depends on…" เปลี่ยนการเลือกที่ยากให้เป็นคำถามที่ตรวจสอบได้`}},{text:`It depends.`,quality:`ok`,reply:`Depends on what?`,replyTh:`ขึ้นอยู่กับอะไรเหรอ`,feedback:{en:`Correct idiom, but without the factor it sounds like avoiding the question.`,th:`ใช้สำนวนถูก แต่ถ้าไม่บอกปัจจัยจะฟังเหมือนเลี่ยงตอบ`}},{text:`Both are fine.`,quality:`weak`,reply:`You still have to pick one, though.`,replyTh:`แต่ก็ต้องเลือกอันเดียวอยู่ดีนะ`,feedback:{en:`Avoiding a choice does not remove it. Say what would decide it.`,th:`การเลี่ยงเลือกไม่ได้ทำให้ไม่ต้องเลือก ควรบอกว่าอะไรจะเป็นตัวตัดสิน`}}]},{partner:`Sign-up closes in ten minutes!`,partnerTh:`ปิดรับสมัครในอีกสิบนาทีแล้วนะ`,goal:{en:`Make a clear final decision.`,th:`ตัดสินใจขั้นสุดท้ายให้ชัดเจน`},options:[{text:`Okay, I've changed my mind — I will join photography. Saturdays are free for me.`,quality:`best`,reply:`Great choice! Write your name here.`,replyTh:`เลือกได้ดีเลย เขียนชื่อตรงนี้นะ`,feedback:{en:`Perfect. You explained the change and committed with a reason.`,th:`สมบูรณ์แบบ คุณอธิบายการเปลี่ยนใจและตัดสินใจพร้อมเหตุผล`}},{text:`Let me think about it.`,quality:`weak`,reply:`There is no time left, though.`,replyTh:`แต่ไม่มีเวลาแล้วนะ`,feedback:{en:`A good phrase, but wrong moment — the deadline is now.`,th:`เป็นประโยคที่ดี แต่ผิดจังหวะ เพราะกำหนดเวลาคือตอนนี้`}},{text:`Photography, please.`,quality:`ok`,reply:`Done! Welcome to the club.`,replyTh:`เรียบร้อย ยินดีต้อนรับสู่ชมรม`,feedback:{en:`Clear and decisive. A short reason would make it sound more confident.`,th:`ชัดเจนและเด็ดขาด ถ้าบอกเหตุผลสั้น ๆ จะฟังมั่นใจยิ่งขึ้น`}}]}],finalChallenge:{en:`Record a 20-second decision: name two options, say what it depends on, and choose one.`,th:`อัดเสียงการตัดสินใจ 20 วินาที บอกสองตัวเลือก บอกว่าขึ้นอยู่กับอะไร แล้วเลือกหนึ่งอย่าง`}},{id:`sc-15`,title:`Ending a conversation politely`,titleTh:`จบบทสนทนาอย่างสุภาพ`,place:{en:`Outside the school gate, 5 minutes before your bus`,th:`หน้าประตูโรงเรียน ก่อนรถออกห้านาที`},learnerRole:{en:`You must leave but do not want to be rude.`,th:`คุณต้องไปแล้วแต่ไม่อยากเสียมารยาท`},partnerRole:{en:`Aunt Nid, a family friend who loves to chat.`,th:`ป้านิด เพื่อนของครอบครัวที่ชอบคุยยาว`},goal:{en:`Leave warmly without cutting the person off.`,th:`ลาจากอย่างอบอุ่นโดยไม่ตัดบทอีกฝ่าย`},targets:[`u1-10`,`u3-10`,`u8-10`,`u1-8`],turns:[{partner:`…and that is how your mother and I met. Anyway, how is school?`,partnerTh:`...แล้วป้ากับแม่หนูก็รู้จักกันแบบนั้นแหละ ว่าแต่ที่โรงเรียนเป็นไงบ้าง`,goal:{en:`Answer briefly and signal your time limit.`,th:`ตอบสั้น ๆ และบอกใบ้ว่ามีเวลาจำกัด`},options:[{text:`School is good, thank you! I only have a few minutes before my bus, though.`,quality:`best`,reply:`Oh, of course. I will not keep you long.`,replyTh:`อ๋อ ได้จ้ะ ป้าไม่รั้งนาน`,feedback:{en:`Perfect. Answering first and then mentioning the time is warm and honest.`,th:`เยี่ยมมาก ตอบคำถามก่อนแล้วค่อยบอกเรื่องเวลา ทั้งอบอุ่นและตรงไปตรงมา`}},{text:`Fine. I have to go now.`,quality:`weak`,reply:`Oh… all right then.`,replyTh:`อ๋อ... ก็ได้จ้ะ`,feedback:{en:`It is abrupt. One friendly sentence before leaving makes a big difference.`,th:`ห้วนไปหน่อย ถ้าเติมประโยคเป็นมิตรก่อนลาจะต่างกันมาก`}},{text:`It is good. We have exams next week.`,quality:`ok`,reply:`Exams! Tell me all about them.`,replyTh:`สอบเหรอ เล่าให้ป้าฟังหน่อยสิ`,feedback:{en:`Friendly, but it opens a new topic when you need to leave.`,th:`เป็นมิตรดี แต่เป็นการเปิดหัวข้อใหม่ทั้งที่ต้องรีบไป`}}]},{partner:`Before you go — tell your mother I said hello!`,partnerTh:`ก่อนไป ฝากทักทายคุณแม่ด้วยนะ`,goal:{en:`Agree warmly and start closing.`,th:`ตอบรับอย่างอบอุ่นและเริ่มปิดบทสนทนา`},options:[{text:`I will, definitely. It was good to see you again!`,quality:`best`,reply:`You too, dear. Take care.`,replyTh:`เช่นกันจ้ะ ดูแลตัวเองนะ`,feedback:{en:`Excellent. Confirming the message and adding a warm line closes it naturally.`,th:`เยี่ยมมาก การยืนยันว่าจะฝากทักและเติมประโยคอบอุ่นช่วยปิดบทสนทนาอย่างเป็นธรรมชาติ`}},{text:`Okay bye.`,quality:`weak`,reply:`Oh. Bye then.`,replyTh:`อ๋อ งั้นบายจ้ะ`,feedback:{en:`Too quick. Even one extra sentence keeps the warmth.`,th:`เร็วเกินไป แค่เพิ่มอีกหนึ่งประโยคก็ยังรักษาความอบอุ่นไว้ได้`}},{text:`Sure, I will tell her.`,quality:`ok`,reply:`Thank you, dear.`,replyTh:`ขอบใจจ้ะ`,feedback:{en:`Polite. Adding a goodbye line finishes it more completely.`,th:`สุภาพดี ถ้าเติมคำลาจะสมบูรณ์กว่า`}}]},{partner:`Say hello to your brother too. Off you go!`,partnerTh:`ฝากทักน้องชายด้วยนะ ไปได้แล้วจ้ะ`,goal:{en:`Leave with a friendly goodbye.`,th:`ลาจากด้วยคำลาที่เป็นมิตร`},options:[{text:`I will! Let's keep in touch. Have a good one!`,quality:`best`,reply:`You too! Run, you will miss the bus!`,replyTh:`เช่นกันจ้ะ รีบไปเถอะ เดี๋ยวตกรถ`,feedback:{en:`Perfect closing — friendly, complete, and quick.`,th:`ปิดได้สมบูรณ์แบบ ทั้งเป็นมิตร ครบถ้วน และรวดเร็ว`}},{text:`Bye!`,quality:`ok`,reply:`Bye, dear!`,replyTh:`บายจ้ะ`,feedback:{en:`Fine and clear, though a warmer goodbye suits a family friend.`,th:`ใช้ได้และชัดเจน แต่คำลาที่อบอุ่นกว่าจะเหมาะกับเพื่อนของครอบครัวมากกว่า`}},{text:`I am late, I am going.`,quality:`weak`,reply:`Oh… all right.`,replyTh:`อ๋อ... ได้จ้ะ`,feedback:{en:`Announcing you are late without a goodbye leaves a cold impression.`,th:`การบอกว่าสายโดยไม่กล่าวลาทำให้ทิ้งความรู้สึกเย็นชาไว้`}}]}],finalChallenge:{en:`Record a polite exit: answer one question, mention your time, and say goodbye warmly.`,th:`อัดเสียงการลาจากอย่างสุภาพ ตอบคำถามหนึ่งข้อ บอกเรื่องเวลา และกล่าวลาอย่างอบอุ่น`}},{id:`sc-16`,title:`Meeting an old friend again`,titleTh:`เจอเพื่อนเก่าอีกครั้ง`,place:{en:`A shopping mall, two years later`,th:`ห้างสรรพสินค้า สองปีต่อมา`},learnerRole:{en:`You recognise a friend from primary school.`,th:`คุณจำเพื่อนสมัยประถมได้`},partnerRole:{en:`Tar, who moved away in Grade 6.`,th:`ต้าร์ ที่ย้ายไปตอน ป.6`},goal:{en:`Reconnect, catch up, and plan to stay in touch.`,th:`ทักทายกันใหม่ อัปเดตชีวิต และนัดติดต่อกันต่อ`},targets:[`u1-2`,`u1-9`,`u1-3`,`u3-10`],turns:[{partner:`Wait… is that you?`,partnerTh:`เดี๋ยวนะ... นั่นเธอเหรอ`,goal:{en:`Greet an old friend with energy.`,th:`ทักทายเพื่อนเก่าอย่างมีชีวิตชีวา`},options:[{text:`Tar! Long time no see!`,quality:`best`,reply:`I cannot believe it! It has been two years!`,replyTh:`ไม่อยากเชื่อเลย สองปีแล้วนะ`,feedback:{en:`Perfect. This is exactly the phrase for meeting again after a long gap.`,th:`สมบูรณ์แบบ นี่คือประโยคที่ใช้ตอนเจอกันอีกครั้งหลังห่างหายไปนาน`}},{text:`Nice to meet you.`,quality:`weak`,reply:`Meet? We were in the same class for three years!`,replyTh:`เจอครั้งแรกเหรอ เราเรียนห้องเดียวกันตั้งสามปีนะ`,feedback:{en:`"Meet" is only for a first meeting. With old friends, use "see".`,th:`"Meet" ใช้เฉพาะการเจอครั้งแรก ถ้าเป็นเพื่อนเก่าให้ใช้ "see"`}},{text:`Hey, Tar. How are you?`,quality:`ok`,reply:`I am good! Wow, you have grown.`,replyTh:`สบายดี โห สูงขึ้นเยอะเลย`,feedback:{en:`Friendly and safe, though it does not show the surprise of meeting again.`,th:`เป็นมิตรและปลอดภัย แต่ยังไม่ได้แสดงความประหลาดใจที่ได้เจอกันอีก`}}]},{partner:`I moved to Khon Kaen, remember? What about you?`,partnerTh:`เราย้ายไปขอนแก่นไง จำได้ไหม แล้วเธอล่ะ`,goal:{en:`Ask about their life since then.`,th:`ถามถึงชีวิตของเขาตั้งแต่ตอนนั้น`},options:[{text:`Still at the same school! How have you been? What have you been up to?`,quality:`best`,reply:`Busy! I joined a basketball team there.`,replyTh:`ยุ่งมาก ที่นั่นเราเข้าทีมบาสด้วย`,feedback:{en:`Great. You answered and asked back — that is what keeps catching up going.`,th:`ดีมาก ทั้งตอบและถามกลับ ซึ่งเป็นสิ่งที่ทำให้การอัปเดตชีวิตดำเนินต่อไป`}},{text:`Same as before.`,quality:`weak`,reply:`Oh. Okay.`,replyTh:`อ๋อ โอเค`,feedback:{en:`A dead end. Two years is a lot to share — give one detail at least.`,th:`บทสนทนาตัน สองปีมีเรื่องเล่าเยอะ อย่างน้อยควรบอกรายละเอียดหนึ่งอย่าง`}},{text:`I am still here. How is Khon Kaen?`,quality:`ok`,reply:`It is nice! Quieter than Bangkok.`,replyTh:`ดีนะ เงียบกว่ากรุงเทพ`,feedback:{en:`Good — a follow-up question keeps the conversation alive.`,th:`ดี การถามต่อช่วยให้บทสนทนาไปต่อได้`}}]},{partner:`My bus is in five minutes. This was so nice!`,partnerTh:`รถเราจะออกในห้านาที ดีใจที่ได้เจอนะ`,goal:{en:`Make the reconnection real, not just polite.`,th:`ทำให้การกลับมาเจอกันเป็นจริง ไม่ใช่แค่พูดตามมารยาท`},options:[{text:`Let's keep in touch — send me your number and I will message you tonight.`,quality:`best`,reply:`Yes! Here, add me now.`,replyTh:`เอาสิ นี่ แอดเลย`,feedback:{en:`Excellent. Adding a specific action turns a polite phrase into a real plan.`,th:`เยี่ยมมาก การเติมสิ่งที่จะทำจริงเปลี่ยนคำพูดตามมารยาทให้เป็นแผนจริง`}},{text:`Yeah, see you around.`,quality:`weak`,reply:`Sure… bye!`,replyTh:`อือ... บาย`,feedback:{en:`"See you around" usually means you will not meet again.`,th:`"See you around" ส่วนใหญ่แปลว่าคงไม่ได้เจอกันอีก`}},{text:`Let's keep in touch!`,quality:`ok`,reply:`Definitely!`,replyTh:`แน่นอน`,feedback:{en:`Warm, but without a number or an app it often does not happen.`,th:`อบอุ่นดี แต่ถ้าไม่มีเบอร์หรือแอปติดต่อ ส่วนใหญ่ก็ไม่ได้ติดต่อกันจริง`}}]}],finalChallenge:{en:`Record a reunion: greet an old friend, ask two catch-up questions, and arrange to stay in touch.`,th:`อัดเสียงการเจอเพื่อนเก่า ทักทาย ถามอัปเดตชีวิตสองคำถาม และนัดติดต่อกันต่อ`}},{id:`sc-17`,title:`Joining a new club`,titleTh:`สมัครเข้าชมรมใหม่`,place:{en:`The music room at lunchtime`,th:`ห้องดนตรีช่วงพักกลางวัน`},learnerRole:{en:`You want to join the band but you are a beginner.`,th:`คุณอยากเข้าวงดนตรีแต่ยังเป็นมือใหม่`},partnerRole:{en:`Ken, the band captain.`,th:`เคน หัวหน้าวง`},goal:{en:`Introduce yourself, be honest about your level, and join.`,th:`แนะนำตัว บอกระดับความสามารถตามจริง และเข้าร่วม`},targets:[`u1-4`,`u3-6`,`u8-8`,`u2-2`],turns:[{partner:`Hi! Are you here for the band?`,partnerTh:`สวัสดี มาสมัครวงดนตรีเหรอ`,goal:{en:`Introduce yourself politely.`,th:`แนะนำตัวอย่างสุภาพ`},options:[{text:`Yes, I am. I'm Pao — it's nice to finally meet you. I have heard about the band all year.`,quality:`best`,reply:`Welcome, Pao! What do you play?`,replyTh:`ยินดีต้อนรับเปา เล่นเครื่องอะไรเหรอ`,feedback:{en:`Great opening — name, warmth, and a reason you are interested.`,th:`เปิดตัวได้ดี ทั้งบอกชื่อ ความอบอุ่น และเหตุผลที่สนใจ`}},{text:`Yes.`,quality:`weak`,reply:`Okay… and you are?`,replyTh:`โอเค... แล้วเธอชื่ออะไรนะ`,feedback:{en:`You made the captain do all the work. Give your name unprompted.`,th:`คุณปล่อยให้หัวหน้าวงถามเองทั้งหมด ควรบอกชื่อโดยไม่ต้องรอให้ถาม`}},{text:`Yes, I want to join.`,quality:`ok`,reply:`Great. What is your name?`,replyTh:`เยี่ยม ชื่ออะไรเหรอ`,feedback:{en:`Clear and direct. Adding your name makes it feel friendlier.`,th:`ชัดเจนและตรงประเด็น ถ้าบอกชื่อด้วยจะเป็นมิตรกว่า`}}]},{partner:`Everyone here has played for at least two years. How long have you played?`,partnerTh:`ทุกคนที่นี่เล่นมาอย่างน้อยสองปี เธอเล่นมานานแค่ไหน`,goal:{en:`Be honest without giving up.`,th:`บอกตามตรงโดยไม่ถอย`},options:[{text:`Only three months — but better late than never. I practise every day.`,quality:`best`,reply:`Ha! Good attitude. We can work with that.`,replyTh:`ฮ่า ทัศนคติดีนะ แบบนี้ฝึกกันได้`,feedback:{en:`Excellent. Honesty plus effort is far more convincing than exaggeration.`,th:`เยี่ยมมาก ความจริงใจบวกความพยายามน่าเชื่อถือกว่าการพูดเกินจริงมาก`}},{text:`Oh… then I should not join.`,quality:`weak`,reply:`Wait, I did not say that!`,replyTh:`เดี๋ยว เรายังไม่ได้พูดแบบนั้นนะ`,feedback:{en:`You rejected yourself before anyone else did. Let them decide.`,th:`คุณตัดสิทธิ์ตัวเองก่อนที่ใครจะปฏิเสธ ควรให้เขาเป็นคนตัดสิน`}},{text:`A few months. Is that a problem?`,quality:`ok`,reply:`Not necessarily. Are you willing to practise?`,replyTh:`ก็ไม่เชิงนะ พร้อมจะซ้อมไหมล่ะ`,feedback:{en:`Honest and fine. Showing your commitment straight away is stronger.`,th:`ตรงไปตรงมาและใช้ได้ แต่ถ้าแสดงความตั้งใจไปเลยจะหนักแน่นกว่า`}}]},{partner:`We rehearse Tuesdays and Thursdays after school. Still interested?`,partnerTh:`เราซ้อมวันอังคารกับวันพฤหัสหลังเลิกเรียน ยังสนใจอยู่ไหม`,goal:{en:`Commit clearly.`,th:`ตอบรับอย่างชัดเจน`},options:[{text:`Count me in. I am free both days.`,quality:`best`,reply:`Awesome. See you Tuesday at four!`,replyTh:`เยี่ยม เจอกันวันอังคารสี่โมง`,feedback:{en:`Perfect. Enthusiastic and it confirms you can actually attend.`,th:`สมบูรณ์แบบ ทั้งกระตือรือร้นและยืนยันว่ามาได้จริง`}},{text:`Maybe. I will see.`,quality:`weak`,reply:`Let me know when you decide, I guess.`,replyTh:`ตัดสินใจแล้วบอกด้วยแล้วกัน`,feedback:{en:`After all that, hesitation makes you sound unreliable.`,th:`หลังจากคุยมาทั้งหมด การลังเลทำให้ดูเหมือนพึ่งพาไม่ได้`}},{text:`Yes, I am interested.`,quality:`ok`,reply:`Great, I will add you to the group chat.`,replyTh:`เยี่ยม เดี๋ยวแอดเข้ากลุ่มแชทให้`,feedback:{en:`Clear yes. Confirming both days removes any doubt.`,th:`ตอบรับชัดเจน ถ้ายืนยันว่าว่างทั้งสองวันจะไม่มีข้อสงสัยเลย`}}]}],finalChallenge:{en:`Record a club sign-up: introduce yourself, describe your level honestly, and accept the schedule.`,th:`อัดเสียงการสมัครชมรม แนะนำตัว บอกระดับความสามารถตามจริง และตอบรับตารางซ้อม`}},{id:`sc-18`,title:`Asking about a discount at the market`,titleTh:`ถามเรื่องส่วนลดที่ตลาด`,place:{en:`A weekend market stall`,th:`แผงขายของในตลาดนัดสุดสัปดาห์`},learnerRole:{en:`You want two shirts but you have a small budget.`,th:`คุณอยากได้เสื้อสองตัวแต่งบจำกัด`},partnerRole:{en:`A market vendor.`,th:`พ่อค้าแม่ค้าในตลาด`},goal:{en:`Ask the price, check for a deal, and decide politely.`,th:`ถามราคา เช็กโปรโมชัน และตัดสินใจอย่างสุภาพ`},targets:[`u5-1`,`u5-8`,`u5-3`,`u5-10`],turns:[{partner:`Hello! Nice shirts, right? Take a look.`,partnerTh:`สวัสดีค่ะ เสื้อสวยใช่ไหมคะ ลองดูได้เลยค่ะ`,goal:{en:`Ask the price clearly.`,th:`ถามราคาให้ชัดเจน`},options:[{text:`They are nice! How much is this one?`,quality:`best`,reply:`That one is 250 baht.`,replyTh:`ตัวนั้น 250 บาทค่ะ`,feedback:{en:`Friendly and clear — a compliment plus a direct question works well.`,th:`เป็นมิตรและชัดเจน คำชมบวกคำถามตรง ๆ ใช้ได้ผลดี`}},{text:`How many is this?`,quality:`weak`,reply:`How many? There are lots of sizes…`,replyTh:`กี่ตัวเหรอคะ มีหลายไซซ์เลยนะคะ`,feedback:{en:`"How many" counts things. For price, always use "How much".`,th:`"How many" ใช้นับจำนวน ถ้าถามราคาต้องใช้ "How much"`}},{text:`Price?`,quality:`ok`,reply:`250 baht.`,replyTh:`250 บาทค่ะ`,feedback:{en:`Understandable, but a full question sounds much friendlier.`,th:`เข้าใจได้ แต่การถามเป็นประโยคเต็มจะฟังเป็นมิตรกว่ามาก`}}]},{partner:`Do you want just one?`,partnerTh:`เอาตัวเดียวเหรอคะ`,goal:{en:`Ask whether buying two is cheaper.`,th:`ถามว่าถ้าซื้อสองตัวถูกกว่าไหม`},options:[{text:`Is this on sale if I take two?`,quality:`best`,reply:`Two for 450. That is 50 baht off.`,replyTh:`สองตัว 450 ค่ะ ลดไป 50 บาท`,feedback:{en:`Smart. Asking about a deal is normal and polite at a market.`,th:`ฉลาดมาก การถามเรื่องโปรโมชันเป็นเรื่องปกติและสุภาพในตลาด`}},{text:`Give me cheaper.`,quality:`weak`,reply:`Er… this is already a good price.`,replyTh:`เอ่อ... ราคานี้ก็ดีแล้วนะคะ`,feedback:{en:`This sounds like a demand. Ask a question instead.`,th:`ฟังเหมือนเรียกร้อง ควรถามเป็นคำถามแทน`}},{text:`Two, please. Is there a discount?`,quality:`ok`,reply:`Yes, 450 for two.`,replyTh:`ได้ค่ะ สองตัว 450 ค่ะ`,feedback:{en:`Works well. Ask about the deal before committing for a stronger position.`,th:`ใช้ได้ดี แต่ถ้าถามเรื่องส่วนลดก่อนตกลงซื้อจะได้เปรียบกว่า`}}]},{partner:`So, two for 450?`,partnerTh:`สรุปเอาสองตัว 450 นะคะ`,goal:{en:`Confirm and check the payment method.`,th:`ยืนยันและเช็กวิธีชำระเงิน`},options:[{text:`I'll take them. Do you take cards?`,quality:`best`,reply:`Cash or QR only, but the ATM is right there.`,replyTh:`รับเงินสดกับคิวอาร์ค่ะ แต่ตู้เอทีเอ็มอยู่ตรงนั้นเลย`,feedback:{en:`Excellent. Confirming and checking payment in one turn is efficient.`,th:`เยี่ยมมาก ยืนยันและเช็กวิธีจ่ายในทีเดียว กระชับดี`}},{text:`I'll take it.`,quality:`ok`,reply:`Just one, then?`,replyTh:`เอาตัวเดียวใช่ไหมคะ`,feedback:{en:`For two items, say "I'll take them" so the number is clear.`,th:`ถ้าซื้อสองตัวควรพูดว่า "I'll take them" เพื่อให้จำนวนชัดเจน`}},{text:`Wait, let me think again.`,quality:`weak`,reply:`Sure… but the deal ends today.`,replyTh:`ได้ค่ะ... แต่โปรหมดวันนี้นะคะ`,feedback:{en:`Hesitation is fine, but you already agreed on the deal.`,th:`ลังเลได้ แต่คุณตกลงเรื่องราคาไปแล้ว`}}]}],finalChallenge:{en:`Record a market conversation: ask the price, ask about a deal, and confirm your purchase.`,th:`อัดเสียงบทสนทนาในตลาด ถามราคา ถามโปรโมชัน และยืนยันการซื้อ`}},{id:`sc-19`,title:`Reporting a problem with a device`,titleTh:`แจ้งปัญหาอุปกรณ์`,place:{en:`The school computer room`,th:`ห้องคอมพิวเตอร์ของโรงเรียน`},learnerRole:{en:`Your assigned computer will not print.`,th:`คอมพิวเตอร์ที่คุณใช้สั่งพิมพ์ไม่ได้`},partnerRole:{en:`Khru Ohm, who manages the room.`,th:`ครูโอม ผู้ดูแลห้อง`},goal:{en:`Describe the problem clearly and say what you already tried.`,th:`อธิบายปัญหาให้ชัดและบอกว่าลองทำอะไรไปแล้ว`},targets:[`u6-7`,`u6-9`,`u6-10`,`u2-1`],turns:[{partner:`You look stuck. What is going on?`,partnerTh:`ดูเหมือนติดปัญหานะ เป็นอะไรเหรอ`,goal:{en:`State the problem simply.`,th:`บอกปัญหาอย่างเรียบง่าย`},options:[{text:`The printer isn't working. I sent the file twice and nothing happened.`,quality:`best`,reply:`Okay, that helps. Which printer — the one by the window?`,replyTh:`โอเค แบบนี้ช่วยได้ เครื่องไหนล่ะ ตัวที่อยู่ริมหน้าต่างเหรอ`,feedback:{en:`Perfect. The problem plus what you tried is exactly what a helper needs.`,th:`สมบูรณ์แบบ ทั้งบอกปัญหาและสิ่งที่ลองทำแล้ว ตรงกับสิ่งที่คนช่วยต้องการ`}},{text:`The computer is broken.`,quality:`weak`,reply:`Broken how? Does it turn on?`,replyTh:`เสียยังไงเหรอ เปิดติดไหม`,feedback:{en:`"Broken" is too general. Say which part does not work.`,th:`คำว่า "broken" กว้างเกินไป ควรบอกว่าส่วนไหนที่ใช้ไม่ได้`}},{text:`It will not print.`,quality:`ok`,reply:`Did you try sending it again?`,replyTh:`ลองสั่งพิมพ์ใหม่หรือยัง`,feedback:{en:`Clear. Mentioning what you already tried saves a round of questions.`,th:`ชัดเจนดี ถ้าบอกด้วยว่าลองอะไรไปแล้วจะประหยัดคำถามไปหนึ่งรอบ`}}]},{partner:`Did you change any settings before this?`,partnerTh:`ก่อนหน้านี้ไปเปลี่ยนการตั้งค่าอะไรหรือเปล่า`,goal:{en:`Explain honestly what happened.`,th:`อธิบายตามจริงว่าเกิดอะไรขึ้น`},options:[{text:`Let me explain what happened — I clicked a different printer name by mistake.`,quality:`best`,reply:`Ah, that is it. Your file went to the staff room printer.`,replyTh:`อ๋อ นั่นแหละ ไฟล์ไปออกที่เครื่องห้องพักครู`,feedback:{en:`Excellent. Honesty about your own mistake solved it in one step.`,th:`เยี่ยมมาก การยอมรับความผิดพลาดของตัวเองทำให้แก้ปัญหาได้ในขั้นตอนเดียว`}},{text:`No, I did not touch anything.`,quality:`weak`,reply:`Hmm. Then this will take a while to find.`,replyTh:`อืม งั้นคงต้องหาสาเหตุกันนาน`,feedback:{en:`Hiding a small mistake makes the problem much harder to solve.`,th:`การปิดบังความผิดพลาดเล็ก ๆ ทำให้ปัญหาแก้ยากขึ้นมาก`}},{text:`I do not remember exactly.`,quality:`ok`,reply:`Okay, let us check the print queue together.`,replyTh:`โอเค งั้นมาดูคิวงานพิมพ์ด้วยกัน`,feedback:{en:`Honest. If you do remember one action, say it — it usually helps.`,th:`ตรงไปตรงมาดี ถ้าพอจำสิ่งที่ทำได้หนึ่งอย่างควรบอก มักช่วยได้`}}]},{partner:`Next time just change the printer here in this menu.`,partnerTh:`คราวหน้าก็เปลี่ยนเครื่องพิมพ์ตรงเมนูนี้ได้เลยนะ`,goal:{en:`Make sure you can do it yourself next time.`,th:`ทำให้แน่ใจว่าคราวหน้าคุณทำเองได้`},options:[{text:`Could you show me how? I want to fix it myself next time.`,quality:`best`,reply:`Sure. Click here, then choose Room 2. Try it now.`,replyTh:`ได้เลย กดตรงนี้ แล้วเลือก Room 2 ลองทำเลย`,feedback:{en:`Excellent. Asking to be shown means you will not need help again.`,th:`เยี่ยมมาก การขอให้ทำให้ดูทำให้คราวหน้าคุณไม่ต้องขอความช่วยเหลืออีก`}},{text:`Okay, thanks.`,quality:`ok`,reply:`No problem.`,replyTh:`ไม่เป็นไร`,feedback:{en:`Polite. But if you did not see the steps, the same thing may happen again.`,th:`สุภาพดี แต่ถ้ายังไม่เห็นขั้นตอน ปัญหาเดิมอาจเกิดขึ้นอีก`}},{text:`It is too complicated.`,quality:`weak`,reply:`It is really just two clicks, though.`,replyTh:`จริง ๆ แค่สองคลิกเองนะ`,feedback:{en:`Giving up before trying closes the door on an easy skill.`,th:`การยอมแพ้ก่อนลองทำเป็นการปิดโอกาสเรียนรู้ทักษะง่าย ๆ`}}]}],finalChallenge:{en:`Record a problem report: say what is not working, what you tried, and ask to be shown the fix.`,th:`อัดเสียงแจ้งปัญหา บอกว่าอะไรใช้ไม่ได้ ลองทำอะไรไปแล้ว และขอให้สอนวิธีแก้`}},{id:`sc-20`,title:`Saying goodbye to someone moving away`,titleTh:`กล่าวลาคนที่กำลังจะย้ายไป`,place:{en:`The classroom on the last day of term`,th:`ห้องเรียนในวันสุดท้ายของเทอม`},learnerRole:{en:`Your close friend is moving to another province.`,th:`เพื่อนสนิทของคุณกำลังจะย้ายไปต่างจังหวัด`},partnerRole:{en:`Ice, who leaves on Sunday.`,th:`ไอซ์ ที่จะย้ายวันอาทิตย์`},goal:{en:`Show your feelings honestly and plan to keep the friendship.`,th:`แสดงความรู้สึกอย่างจริงใจและวางแผนรักษามิตรภาพ`},targets:[`u4-4`,`u4-8`,`u3-10`,`u8-2`],turns:[{partner:`This is my last day. It feels so weird.`,partnerTh:`วันนี้วันสุดท้ายแล้ว รู้สึกแปลก ๆ จัง`,goal:{en:`Share your real feeling.`,th:`บอกความรู้สึกจริงของคุณ`},options:[{text:`That's too bad — I am really going to miss you.`,quality:`best`,reply:`I will miss you too. You were my first friend here.`,replyTh:`เราก็จะคิดถึงเธอ เธอเป็นเพื่อนคนแรกของเราที่นี่เลย`,feedback:{en:`Honest and warm. Naming the feeling is what makes a goodbye real.`,th:`จริงใจและอบอุ่น การบอกความรู้สึกออกมาคือสิ่งที่ทำให้การลาจากมีความหมาย`}},{text:`It is fine, you will make new friends.`,quality:`weak`,reply:`Yeah… I guess.`,replyTh:`อือ... ก็คงงั้น`,feedback:{en:`Skipping the feeling to fix it too fast can feel dismissive.`,th:`การข้ามความรู้สึกไปแก้ปัญหาเร็วเกินไปอาจทำให้อีกฝ่ายรู้สึกถูกมองข้าม`}},{text:`I know. Two years went fast.`,quality:`ok`,reply:`Really fast.`,replyTh:`เร็วมากจริง ๆ`,feedback:{en:`Gentle and true, though it does not yet say how you feel.`,th:`นุ่มนวลและเป็นจริง แต่ยังไม่ได้บอกความรู้สึกของคุณ`}}]},{partner:`I am nervous about starting again at a new school.`,partnerTh:`กังวลเรื่องต้องเริ่มใหม่ที่โรงเรียนใหม่`,goal:{en:`Encourage with a reason.`,th:`ให้กำลังใจพร้อมเหตุผล`},options:[{text:`Hang in there. I'm so proud of you — you handled the move so calmly.`,quality:`best`,reply:`Thank you. That means a lot right now.`,replyTh:`ขอบคุณนะ ตอนนี้มันมีความหมายมากเลย`,feedback:{en:`Excellent. Encouragement plus specific praise is the strongest support.`,th:`เยี่ยมมาก กำลังใจบวกคำชมที่เจาะจงคือการสนับสนุนที่ทรงพลังที่สุด`}},{text:`Do not be nervous.`,quality:`weak`,reply:`I cannot really control that.`,replyTh:`มันก็ห้ามไม่ได้นี่`,feedback:{en:`Telling someone not to feel something rarely helps.`,th:`การบอกให้อีกฝ่ายอย่ารู้สึกแบบนั้นมักไม่ช่วยอะไร`}},{text:`I know how you feel. I was new here once too.`,quality:`ok`,reply:`Right, you were! How long did it take?`,replyTh:`จริงด้วย เธอก็เคยเป็นเด็กใหม่ แล้วใช้เวลานานไหม`,feedback:{en:`A good connection. Adding encouragement would finish it strongly.`,th:`เชื่อมโยงได้ดี ถ้าเติมกำลังใจด้วยจะจบได้หนักแน่นกว่า`}}]},{partner:`Well… I guess this is goodbye.`,partnerTh:`เอาล่ะ... คงต้องลากันแล้วสินะ`,goal:{en:`Keep the friendship alive.`,th:`รักษามิตรภาพให้ยังคงอยู่`},options:[{text:`It is not goodbye. Let's keep in touch — video call every Sunday?`,quality:`best`,reply:`Every Sunday. I will hold you to that!`,replyTh:`ทุกวันอาทิตย์นะ จำไว้เลย`,feedback:{en:`Perfect. A specific plan turns a sad goodbye into a real promise.`,th:`สมบูรณ์แบบ แผนที่ชัดเจนเปลี่ยนการลาที่เศร้าให้เป็นคำสัญญาจริง`}},{text:`Bye. Take care.`,quality:`ok`,reply:`You too. Bye.`,replyTh:`เธอด้วยนะ บาย`,feedback:{en:`Kind, but for a close friend a plan to stay connected means more.`,th:`ใจดีดี แต่สำหรับเพื่อนสนิท การมีแผนติดต่อกันมีความหมายมากกว่า`}},{text:`Yeah. See you around.`,quality:`weak`,reply:`I am moving 400 kilometres away…`,replyTh:`เราจะย้ายไปไกลตั้ง 400 กิโลนะ`,feedback:{en:`"See you around" does not fit when someone is moving far away.`,th:`"See you around" ไม่เหมาะกับตอนที่อีกฝ่ายกำลังย้ายไปไกล`}}]}],finalChallenge:{en:`Record a goodbye: say how you feel, give one specific compliment, and make a plan to stay in touch.`,th:`อัดเสียงคำลา บอกความรู้สึก ชมอย่างเจาะจงหนึ่งอย่าง และวางแผนติดต่อกันต่อ`}}],La=[...Fa,...Ia];function Ra(e){return La.find(t=>t.id===e)}function za(){let{progress:e}=Dr(),t=e.scenariosDone.length;return(0,j.jsxs)(j.Fragment,{children:[(0,j.jsx)(`h1`,{children:`Conversation Studio`}),(0,j.jsx)(`p`,{className:`sn-muted`,children:`Twenty real-life conversations. Every reply you choose changes what the other person says next.`}),(0,j.jsx)(I,{children:`บทสนทนาจริง 20 สถานการณ์ คำตอบที่คุณเลือกจะเปลี่ยนสิ่งที่อีกฝ่ายพูดต่อไป`}),(0,j.jsxs)(`div`,{className:`sn-card sn-mt`,children:[(0,j.jsxs)(`div`,{className:`sn-spread`,children:[(0,j.jsxs)(`div`,{children:[(0,j.jsxs)(`p`,{style:{fontWeight:700},children:[t,` of `,La.length,` scenarios completed`]}),(0,j.jsx)(`p`,{className:`sn-muted`,children:`Choose any scenario — they do not need to be done in order.`})]}),(0,j.jsxs)(`span`,{className:`sn-pill sn-pill-mastered`,children:[Math.round(t/La.length*100),`%`]})]}),(0,j.jsx)(`div`,{className:`sn-bar`,style:{marginLeft:0},children:(0,j.jsx)(`span`,{style:{width:`${t/La.length*100}%`}})})]}),(0,j.jsx)(`section`,{className:`sn-section`,children:(0,j.jsx)(`div`,{className:`sn-list`,children:La.map((t,n)=>{let r=e.scenariosDone.includes(t.id);return(0,j.jsxs)(A,{to:`/conversation/${t.id}`,className:`sn-item`,children:[(0,j.jsx)(`span`,{className:`sn-tile-icon`,style:{background:`var(--sn-mint-soft)`,color:`var(--sn-mint)`},children:(0,j.jsx)(di,{size:18,"aria-hidden":`true`})}),(0,j.jsxs)(`div`,{cla
