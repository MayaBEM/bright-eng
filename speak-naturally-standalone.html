`},formality:`Neutral`,context:`Shopping`,bestResponse:{prompt:{en:`You see a red discount sign near a jacket and want to check. What do you ask?`,th:`คุณเห็นป้ายลดราคาสีแดงใกล้แจ็กเก็ตและอยากเช็ก จะถามว่าอะไร`},options:[`Is this on sale?`,`Is this for sale?`,`Is this sale?`],correct:0,explain:{en:`"For sale" only asks if it can be bought. To ask about a discount, use "on sale".`,th:`"For sale" แค่ถามว่าขายไหม ถ้าจะถามเรื่องส่วนลดต้องใช้ "on sale"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Yes, it is half price until Sunday.`}],blankIndex:0,options:[`Is this on sale?`,`Can I get this to go?`,`Do you have this in a bigger size?`],correct:0,explain:{en:`B answers with a discount and an end date, so the question was about a sale.`,th:`B ตอบเรื่องส่วนลดและวันสิ้นสุด แสดงว่าคำถามเป็นเรื่องการลดราคา`}},speakPrompt:{en:`Ask if an item is discounted, then ask how much it costs after the discount.`,th:`ถามว่าสินค้าลดราคาไหม แล้วถามต่อว่าหลังลดราคาแล้วเท่าไร`}},{id:`u5-9`,unit:5,text:`Could I get the check, please?`,meaning:{en:`Please bring the bill so I can pay.`,th:`ขอเช็กบิลด้วยค่ะ`},situation:{en:`Finishing a meal in a restaurant.`,th:`ใช้ตอนกินอาหารเสร็จในร้านอาหาร`},ipa:`/kʊd aɪ ˈɡɛt ðə ˈtʃɛk ˈpliz/`,thaiRead:`คุด ไอ เก็ท เดอะ เช็ค พลีซ`,chunks:[`Could I get`,`the check,`,`please?`],stress:[`get`,`check`],pronTip:{en:`"Check" starts with the "ch" sound, like "chair".`,th:`"Check" ขึ้นต้นด้วยเสียง ch เหมือนคำว่า "chair"`},example:{en:`That was delicious. Could I get the check, please?`,th:`อร่อยมากเลยค่ะ ขอเช็กบิลด้วยค่ะ`},dialogue:[{speaker:`A`,en:`Could I get the check, please?`,th:`ขอเช็กบิลด้วยค่ะ`},{speaker:`B`,en:`Of course. Will that be together or separate?`,th:`ได้ค่ะ รวมบิลหรือแยกบิลคะ`},{speaker:`A`,en:`Together, please.`,th:`รวมบิลค่ะ`}],tip:{en:`Americans say "check"; British speakers say "bill". Both are understood in Thailand.`,th:`คนอเมริกันใช้คำว่า "check" ส่วนคนอังกฤษใช้ "bill" ทั้งสองคำเข้าใจได้ในไทย`},mistake:{en:`Do not say "Give me the check." Starting with "Could I" makes the request polite.`,th:`อย่าพูดว่า "Give me the check" การขึ้นต้นด้วย "Could I" ทำให้คำขอสุภาพขึ้น`},formality:`Polite`,context:`Shopping`,bestResponse:{prompt:{en:`You have finished eating and want to pay. What do you say to the server?`,th:`คุณกินเสร็จแล้วและอยากจ่ายเงิน จะพูดกับพนักงานว่าอะไร`},options:[`Could I get the check, please?`,`Give me the check.`,`I want pay now.`],correct:0,explain:{en:`Only the first is a polite request. The second is an order and the third is ungrammatical.`,th:`มีเพียงข้อแรกที่เป็นคำขอสุภาพ ข้อสองเป็นการสั่ง และข้อสามผิดไวยากรณ์`}},dialogueGap:{lines:[{speaker:`A`,en:`Did you enjoy your meal?`},{speaker:`B`,en:`It was great, thank you. ____`}],blankIndex:1,options:[`Could I get the check, please?`,`What do you recommend?`,`Is this on sale?`],correct:0,explain:{en:`The meal is finished, so the next step is asking for the bill, not ordering.`,th:`ทานเสร็จแล้ว ขั้นต่อไปคือขอบิล ไม่ใช่การสั่งอาหาร`}},speakPrompt:{en:`End a meal politely: compliment the food, then ask for the check.`,th:`จบมื้ออาหารอย่างสุภาพ ชมอาหารก่อน แล้วขอเช็กบิล`}},{id:`u5-10`,unit:5,text:`Do you take cards?`,meaning:{en:`Can I pay with a credit or debit card?`,th:`รับบัตรไหมคะ`},situation:{en:`Checking payment methods before you pay.`,th:`ใช้เช็กวิธีการชำระเงินก่อนจ่าย`},ipa:`/du ju ˈteɪk ˈkɑrdz/`,thaiRead:`ดู ยู เทค คาร์ดส์`,chunks:[`Do you take`,`cards?`],stress:[`take`,`cards`],pronTip:{en:`Do not drop the "s" in "cards" — it shows you mean cards in general.`,th:`อย่าตัดเสียง s ในคำว่า "cards" เพราะเป็นการบอกว่าหมายถึงบัตรโดยทั่วไป`},example:{en:`Do you take cards, or is it cash only?`,th:`รับบัตรไหมคะ หรือรับแต่เงินสด`},dialogue:[{speaker:`A`,en:`Do you take cards?`,th:`รับบัตรไหมคะ`},{speaker:`B`,en:`Yes, card or QR code.`,th:`รับค่ะ ทั้งบัตรและคิวอาร์โค้ด`},{speaker:`A`,en:`Great, I will use my card.`,th:`ดีค่ะ ขอจ่ายด้วยบัตรนะคะ`}],tip:{en:`Small shops and markets often take cash only, so it is smart to ask first.`,th:`ร้านเล็ก ๆ และตลาดมักรับแต่เงินสด จึงควรถามก่อนเสมอ`},mistake:{en:`Do not say "Do you receive card?" The verb for accepting payment is "take" or "accept".`,th:`อย่าพูดว่า "Do you receive card?" คำกริยาที่ใช้กับการรับชำระเงินคือ "take" หรือ "accept"`},formality:`Neutral`,context:`Shopping`,bestResponse:{prompt:{en:`You have no cash and want to check before ordering. What do you ask?`,th:`คุณไม่มีเงินสดและอยากเช็กก่อนสั่ง จะถามว่าอะไร`},options:[`Do you take cards?`,`Do you receive card?`,`Can I card you?`],correct:0,explain:{en:`Shops "take" or "accept" cards. The other two are not natural English.`,th:`ร้านค้าใช้คำว่า "take" หรือ "accept" กับบัตร ส่วนอีกสองข้อไม่ใช่ภาษาอังกฤษที่เป็นธรรมชาติ`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Sorry, we are cash only. There is an ATM next door.`}],blankIndex:0,options:[`Do you take cards?`,`Is this on sale?`,`Can I get this to go?`],correct:0,explain:{en:`B answers about cash and an ATM, so the question was about payment methods.`,th:`B ตอบเรื่องเงินสดและตู้เอทีเอ็ม แสดงว่าคำถามเป็นเรื่องวิธีชำระเงิน`}},speakPrompt:{en:`Ask about payment, then say which method you will use.`,th:`ถามเรื่องวิธีชำระเงิน แล้วบอกว่าคุณจะจ่ายด้วยวิธีไหน`}}]},{id:6,title:`Problems & Asking for Help`,titleTh:`ปัญหาและการขอความช่วยเหลือ`,accent:`#ff7a3d`,blurb:{en:`When you miss something or get stuck, these lines keep the conversation going instead of stopping it.`,th:`เมื่อฟังไม่ทันหรือติดปัญหา ประโยคเหล่านี้จะช่วยให้บทสนทนาไปต่อได้แทนที่จะหยุดชะงัก`},expressions:[{id:`u6-1`,unit:6,text:`Could you say that again, please?`,meaning:{en:`Please repeat what you just said.`,th:`ช่วยพูดอีกครั้งได้ไหมคะ`},situation:{en:`You did not hear or understand something.`,th:`ใช้ตอนฟังไม่ทันหรือไม่เข้าใจสิ่งที่อีกฝ่ายพูด`},ipa:`/kʊd ju ˈseɪ ðæt əˈɡɛn ˈpliz/`,thaiRead:`คุด ยู เซ แดท อะ-เกน พลีซ`,chunks:[`Could you`,`say that again,`,`please?`],stress:[`say`,`gain`],pronTip:{en:`Keep your voice friendly and rising. A flat tone can sound impatient.`,th:`ใช้น้ำเสียงเป็นมิตรและขึ้นสูงท้ายประโยค ถ้าเสียงเรียบอาจฟังเหมือนหงุดหงิด`},example:{en:`Sorry, could you say that again, please?`,th:`ขอโทษค่ะ ช่วยพูดอีกครั้งได้ไหมคะ`},dialogue:[{speaker:`A`,en:`Meet me at the north gate at 3:15.`,th:`เจอกันที่ประตูเหนือตอนบ่ายสามสิบห้า`},{speaker:`B`,en:`Sorry, could you say that again, please?`,th:`ขอโทษค่ะ ช่วยพูดอีกครั้งได้ไหมคะ`},{speaker:`A`,en:`The north gate, at 3:15.`,th:`ประตูเหนือ ตอนบ่ายสามสิบห้า`}],mistake:{en:`Do not say "Repeat!" alone — it sounds like an order. Add "Could you" and "please".`,th:`อย่าพูดว่า "Repeat!" คำเดียว เพราะฟังเหมือนคำสั่ง ให้เติม "Could you" และ "please"`},tip:{en:`This is always safe and polite — with teachers, staff, or strangers.`,th:`ประโยคนี้ปลอดภัยและสุภาพเสมอ ใช้ได้ทั้งกับครู พนักงาน และคนแปลกหน้า`},formality:`Polite`,context:`General`,bestResponse:{prompt:{en:`A shop assistant spoke too quietly and you missed it. What do you say?`,th:`พนักงานพูดเบาไปและคุณฟังไม่ทัน จะพูดว่าอะไร`},options:[`Could you say that again, please?`,`Repeat!`,`What? Speak up.`],correct:0,explain:{en:`The other two sound rude. A polite request starts with "Could you" and ends with "please".`,th:`อีกสองข้อฟังดูหยาบ คำขอที่สุภาพต้องขึ้นต้นด้วย "Could you" และลงท้ายด้วย "please"`}},dialogueGap:{lines:[{speaker:`A`,en:`The code is B-4-7-2.`},{speaker:`B`,en:`____`},{speaker:`A`,en:`Sure — B, four, seven, two.`}],blankIndex:1,options:[`Could you say that again, please?`,`Have a good one!`,`I'll take it.`],correct:0,explain:{en:`A repeats the code slowly, so B must have asked for a repetition.`,th:`A ทวนรหัสช้า ๆ อีกครั้ง แสดงว่า B ขอให้พูดซ้ำ`}},speakPrompt:{en:`Ask someone politely to repeat a phone number, then repeat it back to check.`,th:`ขอให้อีกฝ่ายพูดเบอร์โทรซ้ำอย่างสุภาพ แล้วทวนกลับเพื่อเช็กความถูกต้อง`}},{id:`u6-2`,unit:6,text:`Sorry, I didn't catch that.`,meaning:{en:`I did not hear what you said clearly.`,th:`ขอโทษค่ะ ฟังไม่ทัน`},situation:{en:`The room was noisy or the person spoke quickly.`,th:`ใช้ตอนที่เสียงรอบข้างดังหรืออีกฝ่ายพูดเร็ว`},ipa:`/ˈsɑr.i aɪ ˈdɪdnt ˈkætʃ ðæt/`,thaiRead:`ซอ-รี ไอ ดิดนท์ แคช แดท`,chunks:[`Sorry,`,`I didn't catch`,`that.`],stress:[`Sor`,`catch`],pronTip:{en:`"Didn't catch" is fast: "DIDN-catch". The t almost disappears.`,th:`"Didn't catch" พูดเร็วเป็น "ดิดน์-แคช" เสียง t แทบหายไป`},example:{en:`Sorry, I didn't catch that. What was the room number?`,th:`ขอโทษค่ะ ฟังไม่ทัน ห้องเบอร์อะไรนะคะ`},dialogue:[{speaker:`A`,en:`We are meeting in room 304.`,th:`เราจะเจอกันที่ห้อง 304`},{speaker:`B`,en:`Sorry, I didn't catch that.`,th:`ขอโทษค่ะ ฟังไม่ทัน`},{speaker:`A`,en:`Room three-oh-four.`,th:`ห้องสาม-ศูนย์-สี่`}],tip:{en:`It blames the noise, not the speaker — a very natural, friendly way to ask again.`,th:`ประโยคนี้โทษเสียงรบกวน ไม่ใช่โทษผู้พูด จึงเป็นวิธีขอให้พูดซ้ำที่เป็นธรรมชาติและเป็นมิตร`},mistake:{en:`"Catch" here means "hear clearly", not "grab with your hands".`,th:`คำว่า "catch" ในที่นี้แปลว่าฟังทัน ไม่ได้แปลว่าจับด้วยมือ`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`A bus is passing and you miss what your friend said. What do you say?`,th:`รถเมล์วิ่งผ่านและคุณฟังที่เพื่อนพูดไม่ทัน จะพูดว่าอะไร`},options:[`Sorry, I didn't catch that.`,`Sorry, I did not catch it with my hand.`,`Sorry, I am not catching.`],correct:0,explain:{en:`The fixed phrase is "I didn't catch that", meaning you did not hear it clearly.`,th:`สำนวนตายตัวคือ "I didn't catch that" ซึ่งแปลว่าฟังไม่ชัด`}},dialogueGap:{lines:[{speaker:`A`,en:`My name is Siriwat Thongchai.`},{speaker:`B`,en:`____ Could you spell your last name?`}],blankIndex:1,options:[`Sorry, I didn't catch that.`,`Sounds good to me.`,`Count me in.`],correct:0,explain:{en:`B asks for spelling because the name was not clear, which matches this expression.`,th:`B ขอให้สะกดเพราะฟังชื่อไม่ชัด ซึ่งตรงกับสำนวนนี้`}},speakPrompt:{en:`Say this expression and then ask one specific question about the part you missed.`,th:`พูดสำนวนนี้ แล้วถามเจาะจงหนึ่งคำถามเกี่ยวกับส่วนที่ฟังไม่ทัน`}},{id:`u6-3`,unit:6,text:`What do you mean exactly?`,meaning:{en:`Please explain your idea more clearly.`,th:`หมายความว่ายังไงกันแน่คะ`},situation:{en:`You heard the words but the meaning is unclear.`,th:`ใช้ตอนได้ยินคำพูดแล้วแต่ยังไม่เข้าใจความหมาย`},ipa:`/ˌwʌt du ju ˈmin ɪɡˈzækt.li/`,thaiRead:`วอท ดู ยู มีน อิก-แซค-ลี`,chunks:[`What do you mean`,`exactly?`],stress:[`mean`,`xact`],pronTip:{en:`"Exactly" is often said as "ig-ZACT-lee" with a quiet t.`,th:`"Exactly" มักออกเสียงว่า "อิก-แซค-ลี" โดยเสียง t เบามาก`},example:{en:`What do you mean exactly? Can you give an example?`,th:`หมายความว่ายังไงกันแน่คะ ยกตัวอย่างได้ไหมคะ`},dialogue:[{speaker:`A`,en:`Just make the ending stronger.`,th:`ทำตอนจบให้หนักแน่นขึ้นหน่อย`},{speaker:`B`,en:`What do you mean exactly?`,th:`หมายความว่ายังไงกันแน่คะ`},{speaker:`A`,en:`Add one sentence that repeats your main idea.`,th:`เพิ่มหนึ่งประโยคที่ย้ำใจความสำคัญ`}],tip:{en:`Asking for an example is the fastest way to understand: "Could you give me an example?"`,th:`การขอตัวอย่างคือวิธีที่เข้าใจได้เร็วที่สุด เช่น "Could you give me an example?"`},mistake:{en:`Do not say "What you mean?" — questions need "do you".`,th:`อย่าพูดว่า "What you mean?" ประโยคคำถามต้องมี "do you"`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`Your teacher's instruction is vague and you want details. What do you ask?`,th:`คำสั่งของครูกว้างเกินไปและคุณอยากได้รายละเอียด จะถามว่าอะไร`},options:[`What do you mean exactly?`,`What you mean?`,`What is your meaning?`],correct:0,explain:{en:`Questions need the helper "do", and "What is your meaning?" sounds unnatural in conversation.`,th:`ประโยคคำถามต้องมีกริยาช่วย "do" ส่วน "What is your meaning?" ฟังไม่เป็นธรรมชาติในบทสนทนา`}},dialogueGap:{lines:[{speaker:`A`,en:`Your answer is close, but not complete.`},{speaker:`B`,en:`____`},{speaker:`A`,en:`You need to show the units as well.`}],blankIndex:1,options:[`What do you mean exactly?`,`Same here.`,`Have a good one!`],correct:0,explain:{en:`A then gives a u say?`,th:`คุณถือหนังสือเยอะเกินไปและเพื่อนเดินผ่านมา จะพูดว่าอะไร`},options:[`Can you give me a hand?`,`Can you give me your hand?`,`Can you hand me?`],correct:0,explain:{en:`"Give me your hand" means physically hold hands. The idiom for help uses "a hand".`,th:`"Give me your hand" แปลว่าให้ยื่นมือมาจับ ส่วนสำนวนที่แปลว่าช่วยเหลือใช้ "a hand"`}},dialogueGap:{lines:[{speaker:`A`,en:`____`},{speaker:`B`,en:`Of course. Let me take the heavy one.`}],blankIndex:0,options:[`Can you give me a hand?`,`Is this on sale?`,`I'm just looking, thanks.`],correct:0,explain:{en:`B offers to carry the heavy item, so A asked for help.`,th:`B เสนอช่วยยกของหนัก แสดงว่า A ขอความช่วยเหลือ`}},speakPrompt:{en:`Ask a friend for help with a real task and say exactly what you need.`,th:`ขอให้เพื่อนช่วยงานจริงหนึ่งอย่าง และบอกให้ชัดว่าต้องการอะไร`}},{id:`u6-6`,unit:6,text:`I think there's been a mistake.`,meaning:{en:`Something seems wrong and I would like to check it.`,th:`คิดว่าน่าจะมีอะไรผิดพลาดค่ะ`},situation:{en:`A wrong order, a wrong bill, or a wrong grade.`,th:`ใช้ตอนได้ของผิด บิลผิด หรือคะแนนผิด`},ipa:`/aɪ ˈθɪŋk ðɛrz bɪn ə mɪˈsteɪk/`,thaiRead:`ไอ ธิงค์ แดร์ซ บิน อะ มิส-เทค`,chunks:[`I think`,`there's been`,`a mistake.`],stress:[`think`,`take`],pronTip:{en:`"Mistake" is stressed on the second syllable: mis-TAKE.`,th:`"Mistake" ลงเสียงหนักพยางค์หลัง คือ มิส-เทค`},example:{en:`Excuse me, I think there's been a mistake with my order.`,th:`ขอโทษค่ะ คิดว่าออร์เดอร์น่าจะผิดค่ะ`},dialogue:[{speaker:`A`,en:`Excuse me, I think there's been a mistake. I ordered the soup.`,th:`ขอโทษค่ะ คิดว่าน่าจะผิดนะคะ หนูสั่งซุปค่ะ`},{speaker:`B`,en:`I am so sorry. I will fix it right away.`,th:`ขอโทษจริง ๆ ค่ะ เดี๋ยวแก้ให้ทันทีนะคะ`},{speaker:`A`,en:`Thank you.`,th:`ขอบคุณค่ะ`}],tip:{en:`Starting with "I think" makes it soft. You point at the problem, not at the person.`,th:`การขึ้นต้นด้วย "I think" ทำให้ประโยคนุ่มลง เพราะพูดถึงปัญหา ไม่ใช่ตำหนิคน`},mistake:{en:`Avoid "You are wrong" or "You made a mistake" ไปบอกที่ห้องธุรการ`}],tip:{en:`Add what you already tried. It saves time: "It's not working — I restarted it twice."`,th:`บอกด้วยว่าลองทำอะไรไปแล้ว จะช่วยประหยัดเวลา เช่น "It's not working — I restarted it twice."`},mistake:{en:`For a machine, use "not working", not "broken down" for small problems and not "It does not work well" when it does nothing at all.`,th:`ถ้าเป็นเครื่องใช้ ให้ใช้ "not working" ไม่ใช้ "broken down" กับปัญหาเล็ก ๆ และอย่าใช้ "It does not work well" ถ้ามันไม่ทำงานเลย`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`The classroom projector will not turn on. What do you tell your teacher?`,th:`โปรเจกเตอร์ในห้องเรียนเปิดไม่ติด จะบอกครูว่าอะไร`},options:[`It's not working.`,`It is not work.`,`It has no working.`],correct:0,explain:{en:`The correct form is "is not working" — the present continuous of "work".`,th:`รูปที่ถูกต้องคือ "is not working" ซึ่งเป็นรูป present continuous ของ "work"`}},dialogueGap:{lines:[{speaker:`A`,en:`Did you scan the QR code?`},{speaker:`B`,en:`I tried three times. ____`}],blankIndex:1,options:[`It's not working.`,`Sounds good to me.`,`I'd love to, but I can't.`],correct:0,explain:{en:`B tried and failed, so the natural report is that the thing does not function.`,th:`B ลองแล้วไม่สำเร็จ จึงต้องบอกว่าสิ่งนั้นใช้งานไม่ได้`}},speakPrompt:{en:`Report a device problem and say what you already tried.`,th:`แจ้งปัญหาอุปกรณ์ และบอกว่าคุณลองทำอะไรไปแล้วบ้าง`}},{id:`u6-8`,unit:6,text:`I'm stuck on this part.`,meaning:{en:`I cannot continue at this point.`,th:`ติดตรงส่วนนี้ ไปต่อไม่ได้`},situation:{en:`Asking for help with a specific step of a task.`,th:`ใช้ขอความช่วยเหลือเรื่องขั้นตอนใดขั้นตอนหนึ่งของงาน`},ipa:`/aɪm ˈstʌk ɑn ðɪs ˈpɑrt/`,thaiRead:`ไอม์ สตัค ออน ดิส พาร์ท`,chunks:[`I'm stuck`,`on this part.`],stress:[`stuck`,`part`],pronTip:{en:`Say the "st" cluster together — "stuck", not "sa-tuck".`,th:`ออกเสียง st ติดกัน คือ "สตัค" ไม่ใช่ "สะ-ตัค"`},example:{en:`I'm stuck on this part. Could you look at step three?` d/`,thaiRead:`เล็ท มี อิก-สเปลน วอท แฮพ-เพินด์`,chunks:[`Let me explain`,`what happened.`],stress:[`plain`,`hap`],pronTip:{en:`"Happened" has two syllables: HAP-pend. Do not add an extra "ed" sound.`,th:`"Happened" มีสองพยางค์ คือ แฮพ-เพินด์ ไม่ต้องออกเสียง ed เพิ่ม`},example:{en:`Let me explain what happened — the bus broke down.`,th:`ขออธิบายว่าเกิดอะไรขึ้นนะคะ รถเมล์เสียค่ะ`},dialogue:[{speaker:`A`,en:`You are twenty minutes late.`,th:`เธอมาสายยี่สิบนาทีนะ`},{speaker:`B`,en:`I am sorry. Let me explain what happened.`,th:`ขอโทษค่ะ ขออธิบายว่าเกิดอะไรขึ้นนะคะ`},{speaker:`A`,en:`Go ahead.`,th:`ว่ามาเลย`}],tip:{en:`Apologise first, then explain. Explaining without apologising can sound like an excuse.`,th:`ขอโทษก่อนแล้วค่อยอธิบาย เพราะถ้าอธิบายโดยไม่ขอโทษ อาจฟังเหมือนหาข้ออ้าง`},mistake:{en:`After "Let me", use the base verb: "Let me explain", not "Let me to explain".`,th:`หลัง "Let me" ต้องตามด้วยกริยารูปธรรมดา คือ "Let me explain" ไม่ใช่ "Let me to explain"`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`You missed a deadline for a real reason. What do you say after apologising?`,th:`คุณส่งงานไม่ทันด้วยเหตุผลจริง ๆ หลังขอโทษแล้วจะพูดว่าอะไร`},options:[`Let me explain what happened.`,`Let me to explain what happened.`,`Let me explaining what happened.`],correct:0,explain:{en:`"Let me" is always followed by the base form of the verb.`,th:`"Let me" ต้องตามด้วยกริยารูปธรรมดาเสมอ`}},dialogueGap:{lines:[{speaker:`A`,en:`Why is the report only half finished?`},{speaker:`B`,en:`I am sorry. ____`}],blankIndex:1,options:[`Let me explain what happened.`,`Have a good one!`,`Count me in.`],correct:0,explain:{en:`B apologises and then needs to give the reason, which is exactly this expression.`,th:`B ขอโทษแล้วต้องอธิบายเหตุผลต่อ ซึ่งตรงกับสำนวนนี้`}},speakPrompt:{en:`Apologise for being late, then explain the reason in two sentences.`,th:`ขอโทษที่มาสาย แล้วอธิบายเหตุผลสองประโยค`}},{id:`u6-10`,unit:6,text:`Could you show me how?`,meaning:{en:`Please demonstrate it for me.`,th:`ช่วยทำให้ดูหน่อยได้ไหมคะ`},situation:{en:`You understand the words but need to see the steps.`,th:`ใช้ตอนเข้าใจคำอธิบายแล้วแต่อยากเห็นวิธีทำจริง`},ipa:`/kʊd ju ˈʃoʊ mi ˈhaʊ/`,thaiRead:`คุด ยู โช มี ฮาว`,chunks:[`Could you`,`show me how?`],stress:[`show`,`how`],pronTip:{en:`"Show me" links to "SHOW-mee", and "how" gets the final rise.`,th:`"Show me" พูดติดกันเป็น "โช-มี" และขึ้นเสียงสูงที่คำว่า "how"`},example:{en:`I read the instructions, but could you show me how?`,th:`อ่านคำแนะนำแล้ว แต่ช่วยทำให้ดูหน่อยได้ไหมคะ`},dialogue:[{speaker:`A`,en:`Just drag the file into the folder.`,th:`แค่ลากไฟล์ไปใส่ในโฟลเดอร์`},{speaker:`B`,en:`Could you show me how?`,th:`ช่วยทำให้ดูหน่อยได้ไหมคะ`},{speaker:`A`,en:`Sure, watch my screen.`,th:`ได้สิ ดูหน้าจอเรานะ`}],tip:{en:`Seeing beats hearing for practical tasks. Asking to be shown is smart, not weak.`,th:`สำหรับงานที่ต้องลงมือทำ การได้เห็นดีกว่าการฟัง การขอให้ทำให้ดูจึงเป็นเรื่องฉลาด ไม่ใช่เรื่องอ่อนแอ`},mistake:{en:`Do not say "Could you show me how to?" without a verb. Either stop at "how" or add a verb: "how to do it".`,th:`อย่าพูดว่า "Could you show me how to?" โดยไม่มีคำกริยา ให้จบที่ "how" หรือเติมกริยา เช่น "how to do it"`},formality:`Polite`,context:`General`,bestResponse:{prompt:{en:`A friend explained an app but you still cannot do it. What do you ask?`,th:`เพื่อนอธิบายวิธีใช้แอปแล้วแต่คุณยังทำไม่ได้ จะถามว่าอะไร`},options:[`Could you show me how?`,`Could you show me how to?`,`Could you show how me?`],correct:0,explain:{en:`The sentence ends naturally at "how". The other options are incomplete or wrongly ordered.`,th:`ประโยคจบที่คำว่า "how" ได้อย่างเป็นธรรมชาติ ส่วนข้ออื่นไม่สมบูรณ์หรือเรียงคำผิด`}},dialogueGap:{lines:[{speaker:`A`,en:`You just fold it twice and tuck the corner in.`},{speaker:`B`,en:`____`},{speaker:`A`,en:`Watch — like this.`}],blankIndex:1,options:[`Could you show me how?`,`Do you take cards?`,`Maybe next time.`],correct:0,explain:{en:`A then demonstrates, which is the answer to a request for a demonstration.`,th:`A ลงมือทำให้ดู ซึ่งเป็นการตอบคำขอให้สาธิตวิธีทำ`}},speakPrompt:{en:`Ask someone to show you how to do one real task, and say which step you need.`,th:`ขอให้ใครสักคนทำให้ดูหนึ่งอย่าง และบอกว่าคุณต้องการดูขั้นตอนไหน`}}]},{id:7,title:`Opinions & Decisions`,titleTh:`ความคิดเห็นและการตัดสินใจ`,accent:`#12b5a5`,blurb:{en:`Share what you think, weigh a choice, change your mind, and suggest a better plan.`,th:`บอกความคิดเห็น ชั่งใจเลือก เปลี่ยนใจ และเสนอแผนที่ดีกว่า`},expressions:[{id:`u7-1`,unit:7,text:`I think so too.`,meaning:{en:`I agree with your opinion.`,th:`เราก็คิดแบบนั้นเหมือนกัน`},situation:{en:`Agreeing with an idea someone just shared.`,th:`ใช้เห็นด้วยกับความคิดที่อีกฝ่ายเพิ่งพูด`},ipa:`/aɪ ˈθɪŋk soʊ ˈtu/`,thaiRead:`ไอ ธิงค์ โซ ทู`,chunks:[`I think so`,`too.`],stress:[`think`,`too`],pronTip:{en:`"Think" needs the "th" sound — put your tongue lightly between your teeth.`,th:`"Think" ต้องออกเสียง th โดยแตะปลายลิ้นเบา ๆ ระหว่างฟัน`},example:{en:`The blue design looks better. — I think so too.`,th:`แบบสีฟ้าดูดีกว่านะ — เราก็คิดแบบนั้นเหมือนกัน`},dialogue:[{speaker:`A`,en:`I think the second title is clearer.`,th:`เราว่าชื่อเรื่องอันที่สองชัดกว่านะ`},{speaker:`B`,en:`I think so too. It is shorter as well.`,th:`เราก็คิดแบบนั้นเหมือนกัน แถมสั้นกว่าด้วย`}],tip:{en:`Add a reason after it. Agreeing plus explaining makes you sound thoughtful.`,th:`ควรบอกเหตุผลต่อท้าย เพราะการเห็นด้วยพร้อมอธิบายจะทำให้ดูเป็นคนคิดรอบคอบ`},mistake:{en:`To agree with a negative sentence, use "Me neither" or "I don't think so either", not "I think so too".`,th:`ถ้าจะเห็นด้วยกับประโยคปฏิเสธ ให้ใช้ "Me neither" หรือ "I don't think so either" ไม่ใช่ "I think so too"`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`A classmate says the second plan is better and you agree. What do you say?`,th:`เพื่อนบอกว่าแผนที่สองดีกว่าและคุณเห็นด้วย จะพูดว่าอะไร`},options:[`I think so too.`,`I think too so.`,`I am thinking so too.`],correct:0,explain:{en:`The fixed order is "I think so too". The others change the word order or tense unnecessarily.`,th:`ลำดับคำที่ถูกคือ "I think so too" ส่วนข้ออื่นสลับคำหรือเปลี่ยนรูปกริยาโดยไม่จำเป็น`}},dialogueGap:{lines:[{speaker:`A`,en:`Starting the project early would be safer.`},{speaker:`B`,en:`____ We would have time to check it twice.`}],blankIndex:1,options:[`I think so too.`,`I'm not so sure about that.`,`What do you mean exactly?`],correct:0,explain:{en:`B adds a supporting reason, which shows agreement rather than doubt.`,th:`B เสริมเหตุผลสนับสนุน แสดงว่าเห็นด้วย ไม่ใช่สงสัย`}},speakPrompt:{en:`Agree with one opinion and add your own reason in the same turn.`,th:`เห็นด้วยกับความคิดเห็นหนึ่งข้อ และเสริมเหตุผลของคุณเองในคราวเดียว`}},{id:`u7-2`,unit:7,text:`In my opinion, it is worth trying.`,meaning:{en:`A clear way to introduce what you personally think.`,th:`ในความคิดของฉัน มันน่าลองนะ — วิธีเปิดประโยคแสดงความคิดเห็น`},situation:{en:`Giving your view in a discussion or a class debate.`,th:`ใช้แสดงความคิดเห็นในการอภิปรายหรือการโต้วาทีในห้องเรียน`},ipa:`/ɪn maɪ əˈpɪn.jən ɪt ɪz ˈwɜrθ ˈtraɪ.ɪŋ/`,thaiRead:`อิน มาย โอ-พิน-เยิน อิท อิส เวิร์ธ ทราย-อิง`,chunks:[`In my opinion,`,`it is worth`,`trying.`],stress:[`pin`,`worth`],pronTip:{en:`"Opinion" is stressed in the middle: uh-PIN-yun.`,th:`"Opinion" ลงเสียงหนักพยางค์กลาง คือ โอ-พิน-เยิน`},example:{en:`In my opinion, morning practice works better.`,th:`ในความคิดของฉัน ซ้อมตอนเช้าได้ผลดีกว่า`},dialogue:[{speaker:`A`,en:`Should we change the topic of our project?`,th:`เราควรเปลี่ยนหัวข้อโปรเจกต์ไหม`},{speaker:`B`,en:`In my opinion, it is worth trying. The new one has more data.`,th:`ในความคิดของเรา น่าลองนะ เพราะหัวข้อใหม่มีข้อมูลมากกว่า`},{speaker:`A`,en:`Good point. Let us ask the teacher.`,th:`จริงด้วย ไปถามครูกันดีกว่า`}],tip:{en:`Use it once, not in every sentence. Repeating it makes your speech sound heavy.`,th:`ใช้ครั้งเดียวพอ ไม่ต้องใส่ทุกประโยค เพราะถ้าใช้ซ้ำจะทำให้ฟังดูหนักและเยิ่นเย้อ`},mistake:{en:`Do not say "In my opinion, I think..." — that says the same thing twice. Choose one.`,th:`อย่าพูดว่า "In my opinion, I think..." เพราะความหมายซ้ำกัน ให้เลือกใช้อย่างใดอย่างหนึ่ง`},formality:`Polite`,context:`School`,bestResponse:{prompt:{en:`You want to introduce your view in a class discussion. Which sentence is best?`,th:`คุณอยากเปิดประโยคแสดงความคิดเห็นในการอภิปราย ประโยคไหนดีที่สุด`},options:[`In my opinion, it is worth trying.`,`In my opinion, I think it is worth trying.`,`On my opinion, it is worth trying.`],correct:0,explain:{en:`Option B repeats the idea, and the correct preposition is "in", not "on".`,th:`ข้อ B พูดซ้ำความหมายเดิม และคำบุพบทที่ถูกต้องคือ "in" ไม่ใช่ "on"`}},dialogueGap:{lines:[{speaker:`A`,en:`Do you think we should record the interview?`},{speaker:`B`,en:`____ We can listen again later.`}],blankIndex:1,options:[`In my opinion, it is worth trying.`,`I left it at home.`,`How much is this?`],correct:0,explain:{en:`B gives an opinion with a reason, which matches this expression.`,th:`B แสดงความคิดเห็นพร้อมเหตุผล ซึ่งตรงกับสำนวนนี้`}},speakPrompt:{en:`Give your opinion about one school rule and support it with one reason.`,th:`แสดงความคิดเห็นเกี่ยวกับกฎของโรงเรียนหนึ่งข้อ พร้อมเหตุผลหนึ่งข้อ`}},{id:`u7-3`,unit:7,text:`Let me think about it.`,meaning:{en:`I need time before I decide.`,th:`ขอคิดดูก่อนนะ`},situation:{en:`You are not ready to answer or decide right now.`,th:`ใช้ตอนยังไม่พร้อมตอบหรือตัดสินใจทันที`},ipa:`/ˈlɛt mi ˈθɪŋk əˈbaʊt ɪt/`,thaiRead:`เล็ท มี ธิงค์ อะ-เบาท์-ทิท`,chunks:[`Let me think`,`about it.`],stress:[`think`],pronTip:{en:`"Think about it" flows together: THINK-uh-BOU-tit.`,th:`"Think about it" พูดต่อเนื่องกันเป็น "ธิงค์-อะ-เบา-ทิท"`},example:{en:`That is a big decision. Let me think about it.`,th:`เป็นการตัดสินใจครั้งใหญ่ ขอคิดดูก่อนนะ`},dialogue:[{speaker:`A`,en:`Do you want to join the debate club?`,th:`อยากเข้าชมรมโต้วาทีไหม`},{speaker:`B`,en:`Let me think about it. Can I tell you tomorrow?`,th:`ขอคิดดูก่อนนะ พรุ่งนี้บอกได้ไหม`},{speaker:`A`,en:`Sure, no rush.`,th:`ได้สิ ไม่ต้องรีบ`}],tip:{en:`Give a time so it does not sound like a soft "no": "Let me think about it — I will tell you tonight."`,th:`ควรบอกกำหนดเวลาด้วย จะได้ไม่ฟังเหมือนปฏิเสธอ้อม ๆ เช่น "Let me think about it — I will tell you tonight."`},mistake:{en:`Do not say "Let me think about" without "it". The phrase needs an object.`,th:`อย่าพูดว่า "Let me think about" โดยไม่มี "it" เพราะสำนวนนี้ต้องมีกรรม`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`Someone invites you to a club but you are unsure. What do you say?`,th:`มีคนชวนคุณเข้าชมรมแต่คุณยังไม่แน่ใจ จะพูดว่าอะไร`},options:[`Let me think about it.`,`Let me think about.`,`Let me to think it.`],correct:0,explain:{en:`"Think about" needs an object, and "Let me" is followed by the base verb.`,th:`"Think about" ต้องมีกรรมตามหลัง และหลัง "Let me" ต้องเป็นกริยารูปธรรมดา`}},dialogueGap:{lines:[{speaker:`A`,en:`Would you like to be the group leader?`},{speaker:`B`,en:`____ I will answer by Friday.`}],blankIndex:1,options:[`Let me think about it.`,`Count me in.`,`I'd love to, but I can't.`],correct:0,explain:{en:`B promises an answer later, which means they have not decided yet.`,th:`B บอกว่าจะตอบทีหลัง แสดงว่ายังไม่ได้ตัดสินใจ`}},speakPrompt:{en:`Ask for time to decide about a real choice, and say when you will answer.`,th:`ขอเวลาตัดสินใจเรื่องจริงหนึ่งเรื่อง และบอกว่าจะตอบเมื่อไร`}},{id:`u7-4`,unit:7,text:`I've changed my mind.`,meaning:{en:`I decided something different from before.`,th:`เปลี่ยนใจแล้ว`},situation:{en:`Telling someone your decision is now different.`,th:`ใช้บอกว่าการตัดสินใจของเราเปลี่ยนไปจากเดิม`},ipa:`/aɪv ˈtʃeɪndʒd maɪ ˈmaɪnd/`,thaiRead:`ไอฟ์ เชนจ์ด มาย ไมนด์`,chunks:[`I've changed`,`my mind.`],stress:[`changed`,`mind`],pronTip:{en:`"Changed" ends with a "d" sound, not "ed" as a separate syllable.`,th:`"Changed" ลงท้ายด้วยเสียง d ไม่ใช่ออกเสียง ed แยกเป็นอีกพยางค์`},example:{en:`I've changed my mind. I want to try the swimming club instead.`,th:`เปลี่ยนใจแล้ว อยากลองชม t we`,`start with`,`the easy part?`],stress:[`don't`,`start`,`ea`],pronTip:{en:`It looks like a question but sounds like a suggestion — keep the tone light.`,th:`ดูเหมือนคำถามแต่จริง ๆ คือข้อเสนอ ให้ใช้น้ำเสียงเบา ๆ สบาย ๆ`},example:{en:`Why don't we start with the easy part and build up?`,th:`เริ่มจากส่วนง่าย ๆ ก่อนแล้วค่อยไปต่อดีไหม`},dialogue:[{speaker:`A`,en:`This assignment feels huge.`,th:`งานนี้ดูใหญ่มากเลย`},{speaker:`B`,en:`Why don't we start with the easy part?`,th:`เริ่มจากส่วนง่าย ๆ ก่อนดีไหม`},{speaker:`A`,en:`Good idea. The pictures first, then the writing.`,th:`ไอเดียดี ทำรูปก่อนแล้วค่อยเขียน`}],tip:{en:`"Why don't we...?" is softer than "We should...". It invites the other person to agree.`,th:`"Why don't we...?" นุ่มกว่า "We should..." เพราะเปิดโอกาสให้อีกฝ่ายเห็นด้วย`},mistake:{en:`Do not answer it as a real question about reasons. It is a suggestion, so reply "Good idea" or "Let us do that".`,th:`อย่าตอบเหมือนเป็นคำถามถามเหตุผลจริง ๆ เพราะเป็นข้อเสนอ ให้ตอบว่า "Good idea" หรือ "Let us do that"`},formality:`Casual`,context:`School`,bestResponse:{prompt:{en:`Your group is overwhelmed. You want to suggest an easy first step. What do you say?`,th:`กลุ่มของคุณรู้สึกท่วมท้น คุณอยากเสนอให้เริ่มจากขั้นง่าย ๆ จะพูดว่าอะไร`},options:[`Why don't we start with the easy part?`,`Why we do not start easy part?`,`Why not we starting easy?`],correct:0,explain:{en:`The pattern is "Why don't we + base verb". The other two break that pattern.`,th:`รูปแบบคือ "Why don't we + กริยารูปธรรมดา" ส่วนอีกสองข้อผิดรูปแบบนี้`}},dialogueGap:{lines:[{speaker:`A`,en:`I do not know where to begin.`},{speaker:`B`,en:`____`},{speaker:`A`,en:`Okay, that feels easier already.`}],blankIndex:1,options:[`Why don't we start with the easy part?`,`I don't get it.`,`Are you serious?`],correct:0,explain:{en:`A feels better after B speaks, so B offered a helpful suggestion.`,th:`A รู้สึกดีขึ้นหลังจาก B พูด แสดงว่า B เสนอทางออกที่ช่วยได้`}},speakPrompt:{en:`Suggest a first step for a group task using this pattern.`,th:`เสนอขั้นตอนแรกของงานกลุ่มโดยใช้โครงประโยคนี้`}},{id:`u7-6`,unit:7,text:`That's a good point.`,meaning:{en:`What you said is a useful and valid idea.`,th:`เป็นประเด็นที่ดีนะ`},situation:{en:`Recognising someone's idea in a discussion.`,th:`ใช้ยอมรับความคิดของอีกฝ่ายในการอภิปราย`},ipa:`/ðæts ə ˈɡʊd ˈpɔɪnt/`,thaiRead:`แดทส์ อะ กุด พอยนท์`,chunks:[`That's a`,`good point.`],stress:[`good`,`point`],pronTip:{en:`"Point" ends with a clear "nt" — do not drop the t.`,th:`"Point" ลงท้ายด้วยเสียง nt ที่ชัดเจน อย่าตัดเสียง t`},example:{en:`That's a good point. I had not thought about the cost.`,th:`เป็นประเด็นที่ดีนะ เราไม่ได้คิดเรื่องค่าใช้จ่ายเลย`},dialogue:[{speaker:`A`,en:`If we film outside, the wind will affect the sound.`,th:`ถ้าถ่ายข้างนอก ลมจะมีผลกับเสียงนะ`},{speaker:`B`,en:`That's a good point. Let us film in the classroom.`,th:`เป็นประเด็นที่ดี งั้นถ่ายในห้องเรียนดีกว่า`}],tip:{en:`It works even when you disagree overall: "That's a good point, but I still think..."`,th:`ใช้ได้แม้จะไม่เห็นด้วยโดยรวม เช่น "That's a good point, but I still think..."`},mistake:{en:`Do not say "That is a good point of view" unless you mean their whole perspective. For one idea, "good point" is enough.`,th:`อย่าพูดว่า "That is a good point of view" ถ้าไม่ได้หมายถึงมุมมองทั้งหมด ถ้าเป็นความคิดเดียวใช้ "good point" ก็พอ`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`A classmate raises a problem you had not considered. What do you say?`,th:`เพื่อนยกปัญหาที่คุณยังไม่ได้คิดถึง จะพูดว่าอะไร`},options:[`That's a good point.`,`That is a good pointing.`,`That is well point.`],correct:0,explain:{en:`"Point" is a noun here and needs "a". The other options are not correct English.`,th:`"Point" ในที่นี้เป็นคำนามจึงต้องมี "a" ส่วนตัวเลือกอื่นไม่ถูกไวยากรณ์`}},dialogueGap:{lines:[{speaker:`A`,en:`If we meet at eight, some people cannot come by bus.`},{speaker:`B`,en:`____ Let us make it nine instead.`}],blankIndex:1,options:[`That's a good point.`,`That's too bad.`,`I'm just looking, thanks.`],correct:0,explain:{en:`B accepts A's reasoning and changes the plan because of it.`,th:`B ยอมรับเหตุผลของ A และเปลี่ยนแผนตามนั้น`}},speakPrompt:{en:`Accept someone's point, then say how it changes your plan.`,th:`ยอมรับประเด็นของอีกฝ่าย แล้วบอกว่ามันทำให้แผนของคุณเปลี่ยนไปอย่างไร`}},{id:`u7-7`,unit:7,text:`I'd rather stay home tonight.`,meaning:{en:`I prefer that choice over the other one.`,th:`คืนนี้ขออยู่บ้านดีกว่า`},situation:{en:`Saying which option you prefer.`,th:`ใช้บอกว่าเราชอบตัวเลือกไหนมากกว่า`},ipa:`/aɪd ˈræð.ər ˈsteɪ ˈhoʊm təˈnaɪt/`,thaiRead:`ไอด์ แรท-เธอร์ สเต โฮม ทู-ไนท์`,chunks:[`I'd rather`,`stay home`,`tonight.`],stress:[`rath`,`stay`],pronTip:{en:`"Rather" uses the soft "th" as in "the": RA-ther.`,th:`"Rather" ใช้เสียง th แบบก้อง เหมือนในคำว่า "the" คือ แรท-เธอร์`},example:{en:`I'd rather stay home tonight. I am really tired.`,th:`คืนนี้ขออยู่บ้านดีกว่า เหนื่อยมากเลย`},dialogue:[{speaker:`A`,en:`Do you want to go out or order in?`,th:`อยากออกไปข้างนอกหรือสั่งมากินที่บ้าน`},{speaker:`B`,en:`I'd rather stay home tonight.`,th:`คืนนี้ขออยู่บ้านดีกว่า`},{speaker:`A`,en:`Fine by me. Pizza then?`,th:`ได้เลย งั้นพิซซ่าไหม`}],tip:{en:`Use "I'd rather A than B" to compare directly: "I'd rather walk than wait."`,th:`ใช้ "I'd rather A than B" เพื่อเปรียบเทียบโดยตรง เช่น "I'd rather walk than wait."`},mistake:{en:`After "I'd rather" use the base verb with no "to": "I'd rather stay", not "I'd rather to stay".`,th:`หลัง "I'd rather" ต้องใช้กริยารูปธรรมดาโดยไม่มี "to" คือ "I'd rather stay" ไม่ใช่ "I'd rather to stay"`},formality:`Neutral`,context:`Family`,bestResponse:{prompt:{en:`Your family asks if you want to go out, but you prefer home. What do you say?`,th:`ที่บ้านถามว่าอยากออกไปข้างนอกไหม แต่คุณอยากอยู่บ้านมากกว่า จะพูดว่าอะไร`},options:[`I'd rather stay home tonight.`,`I'd rather to stay home tonight.`,`I rather staying home tonight.`],correct:0,explain:{en:`"Would rather" is followed by the base verb with no "to".`,th:`"Would rather" ต้องตามด้วยกริยารูปธรรมดาโดยไม่มี "to"`}},dialogueGap:{lines:[{speaker:`A`,en:`Cinema or a walk in the park?`},{speaker:`B`,en:`____ It has been a long week.`}],blankIndex:1,options:[`I'd rather stay home tonight.`,`Count me in.`,`How much is this?`],correct:0,explain:{en:`B gives a tiredness reason, which supports preferring to stay in.`,th:`B ให้เหตุผลว่าเหนื่อย ซึ่งสนับสนุนการเลือกอยู่บ้าน`}},speakPrompt:{en:`Compare two weekend options and say which one you prefer and why.`,th:`เปรียบเทียบสองตัวเลือกของสุดสัปดาห์ และบอกว่าคุณชอบอันไหนมากกว่าเพราะอะไร`}},{id:`u7-8`,unit:7,text:`I'm not sure yet.`,meaning:{en:`I have not decided at this moment.`,th:`ยังไม่แน่ใจเลย`},situation:{en:`Being honest that your decision is still open.`,th:`ใช้บอกตามตรงว่ายังตัดสินใจไม่ได้`},ipa:`/aɪm ˌnɑt ˈʃʊr ˈjɛt/`,thaiRead:`ไอม์ นอท ชัวร์ เยท`,chunks:[`I'm not sure`,`yet.`],stress:[`sure`,`yet`],pronTip:{en:`"Yet" at the end is short and clear — do not swallow the t.`,th:`คำว่า "yet" ท้ายประโยคออกเสียงสั้นและชัด อย่ากลืนเสียง t`},example:{en:`I'm not sure yet. I want to see both options first.`,th:`ยังไม่แน่ใจเลย อยากดูทั้งสองตัวเลือกก่อน`},dialogue:[{speaker:`A`,en:`Which university do you want?`,th:`อยากเข้ามหาวิทยาลัยไหน`},{speaker:`B`,en:`I'm not sure yet. I am still reading about them.`,th:`ยังไม่แน่ใจเลย กำลังหาข้อมูลอยู่`},{speaker:`A`,en:`That is fine. You have time.`,th:`ไม่เป็นไร ยังมีเวลา`}],tip:{en:`The word "yet" shows the door is still open. Without it, it sounds more final.`,th:`คำว่า "yet" บอกว่ายังมีโอกาสเปลี่ยน ถ้าไม่มีจะฟังเหมือนตัดสินใจแล้ว`},mistake:{en:`Do not say "I am not sure already". "Yet" is the word for something that has not happened.`,th:`อย่าพูดว่า "I am not sure already" คำที่ใช้กับสิ่งที่ยังไม่เกิดขึ้นคือ "yet"`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`A friend asks which club you will join, but you have not decided. What do you say?`,th:`เพื่อนถามว่าคุณจะเข้าชมรมไหน แต่ยังตัดสินใจไม่ได้ จะพูดว่าอะไร`},options:[`I'm not sure yet.`,`I am not sure already.`,`I am not yet sure it.`],correct:0,explain:{en:`"Yet" goes at the end for things that have not happened. "Already" is for things that have.`,th:`"Yet" วางท้ายประโยคสำหรับสิ่งที่ยังไม่เกิด ส่วน "already" ใช้กับสิ่งที่เกิดขึ้นแล้ว`}},dialogueGap:{lines:[{speaker:`A`,en:`Have you picked your topic?`},{speaker:`B`,en:`____ I am choosing between two.`}],blankIndex:1,options:[`I'm not sure yet.`,`I've changed my mind.`,`That is a good point.`],correct:0,explain:{en:`B is still choosing, so the decision is not final yet.`,th:`B ยังเลือกอยู่ แสดงว่ายังตัดสินใจไม่เสร็จ`}},speakPrompt:{en:`Say you have not decided something, and name the two options you are weighing.`,th:`บอกว่าคุณยังตัดสินใจไม่ได้ และบอกสองตัวเลือกที่กำลังชั่งใจอยู่`}},{id:`u7-9`,unit:7,text:`It depends.`,meaning:{en:`The answer changes depending on the situation.`,th:`ก็แล้วแต่ / ขึ้นอยู่กับสถานการณ์`},situation:{en:`A question has no single answer.`,th:`ใช้ตอนคำถามไม่มีคำตอบเดียวตายตัว`},ipa:`/ɪt dɪˈpɛndz/`,thaiRead:`อิท ดิ-เพนดส์`,chunks:[`It`,`depends.`],stress:[`pends`],pronTip:{en:`Stress the second syllable: di-PENDS, and keep the final s.`,th:`ลงเสียงหนักพยางค์หลัง คือ ดิ-เพนดส์ และอย่าลืมเสียง s ท้ายคำ`},example:{en:`Do you walk to school? — It depends on the weather.`,th:`เดินไปโรงเรียนไหม — ก็แล้วแต่อากาศ`},dialogue:[{speaker:`A`,en:`Do you study at night?`,th:`อ่านหนังสือตอนกลางคืนไหม`},{speaker:`B`,en:`It depends. If I have a test, yes.`,th:`ก็แล้วแต่ ถ้ามีสอบก็อ่าน`},{speaker:`A`,en:`That makes sense.`,th:`ก็สมเหตุสมผลดี`}],tip:{en:`Always add "on + the factor". A bare "It depends" can sound like you are avoiding the question.`,th:`ควรเติม "on + ปัจจัย" เสมอ เพราะถ้าพูดแค่ "It depends" อาจฟังเหมือนเลี่ยงตอบคำถาม`},mistake:{en:`The preposition is "on": "It depends on the weather", never "It depends of" or "It depends to".`,th:`คำบุพบทที่ใช้คือ "on" เช่น "It depends on the weather" ห้ามใช้ "depends of" หรือ "depends to"`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`Someone asks if you prefer summer or winter, and your answer changes by situation. What do you say?`,th:`มีคนถามว่าชอบหน้าร้อนหรือหน้าหนาว และคำตอบขึ้นอยู่กับสถานการณ์ จะพูดว่าอะไร`},options:[`It depends.`,`It is depend.`,`It depends of.`],correct:0,explain:{en:`"Depends" is the verb and needs no "is". If you continue, the preposition is "on".`,th:`"Depends" เป็นคำกริยาจึงไม่ต้องมี "is" และถ้าจะพูดต่อ ต้องใช้คำบุพบท "on"`}},dialogueGap:{lines:[{speaker:`A`,en:`Do you take the bus or walk?`},{speaker:`B`,en:`____ If it is raining, I take the bus.`}],blankIndex:1,options:[`It depends.`,`Count me in.`,`I'm really sorry to hear that.`],correct:0,explain:{en:`B gives a condition, which is exactly what this expression introduces.`,th:`B บอกเงื่อนไข ซึ่งเป็นสิ่งที่สำนวนนี้ใช้เกริ่นนำพอดี`}},speakPrompt:{en:`Answer a question with "It depends" and then explain the factor in one sentence.`,th:`ตอบคำถามด้วย "It depends" แล้วอธิบายปัจจัยหนึ่งประโยค`}},{id:`u7-10`,unit:7,text:`How about this instead?`,meaning:{en:`Here is a different idea — what do you think?`,th:`ลองแบบนี้แทนดีไหม`},situation:{en:`Offering an alternative when the first plan will not work.`,th:`ใช้เสนอทางเลือกอื่นเมื่อแผนแรกใช้ไม่ได้`},ipa:`/ˌhaʊ əˈbaʊt ðɪs ɪnˈstɛd/`,thaiRead:`ฮาว อะ-เบาท์ ดิส อิน-สเตด`,chunks:[`How about`,`this instead?`],stress:[`bout`,`stead`],pronTip:{en:`"Instead" is stressed on the second syllable: in-STED.`,th:`"Instead" ลงเสียงหนักพยางค์หลัง คือ อิน-สเตด`},example:{en:`The park is closed. How about the library instead?`,th:`สวนปิด ไปห้องสมุดแทนดีไหม`},dialogue:[{speaker:`A`,en:`The cafe is full.`,th:`ร้านกาแฟเต็มแล้ว`},{speaker:`B`,en:`How about this instead? We could sit in the park.`,th:`ลองแบบนี้แทนดีไหม ไปนั่งที่สวนกัน`},{speaker:`A`,en:`Even better. Let us go.`,th:`ดียิ่งกว่าอีก ไปกันเลย`}],tip:{en:`Give the new idea immediately after. A suggestion with no detail is hard to answer.`,th:`ควรบอกไอเดียใหม่ต่อทันที เพราะข้อเสนอที่ไม่มีรายละเอียดจะตอบยาก`},mistake:{en:`After "How about", use a noun or an -ing verb: "How about going?", not "How about go?"`,th:`หลัง "How about" ต้องตามด้วยคำนามหรือกริยาเติม -ing เช่น "How about going?" ไม่ใช่ "How about go?"`},formality:`Casual`,context:`General`,bestResponse:{prompt:{en:`Your first plan failed and you have a backup idea. How do you introduce it?`,th:`แผนแรกล้มเหลวและคุณมีแผนสำรอง จะเกริ่นนำว่าอะไร`},options:[`How about this instead?`,`How about go instead?`,`What about to this?`],correct:0,explain:{en:`"How about" takes a noun or -ing form. "This" works; "go" and "to this" do not.`,th:`"How about" ตามด้วยคำนามหรือกริยาเติม -ing คำว่า "this" ใช้ได้ ส่วน "go" และ "to this" ใช้ไม่ได้`}},dialogueGap:{lines:[{speaker:`A`,en:`The bus does not run on Sundays.`},{speaker:`B`,en:`____ My mum could drive us.`}],blankIndex:1,options:[`How about this instead?`,`I'm not sure yet.`,`It depends.`],correct:0,explain:{en:`B immediately offers an alternative plan, which this expression introduces.`,th:`B เสนอแผนสำรองทันที ซึ่งเป็นสิ่งที่สำนวนนี้ใช้เกริ่นนำ`}},speakPrompt:{en:`Suggest an alternative when a plan fails, and give the full new idea.`,th:`เสนอทางเลือกอื่นเมื่อแผนล้มเหลว พร้อมบอกไอเดียใหม่ให้ครบ`}}]},{id:8,title:`Common Idioms in Conversation`,titleTh:`สำนวนที่ใช้บ่อยในบทสนทนา`,accent:`#c04ce6`,blurb:{en:`Ten idioms native speakers really use — safe for school, friendly, and easy to say.`,th:`สิบสำนวนที่เจ้าของภาษาใช้จริง เหมาะกับโรงเรียน เป็นมิตร และพูดง่าย`},expressions:[{id:`u8-1`,unit:8,text:`It's a piece of cake.`,meaning:{en:`It is very easy.`,th:`ง่ายมาก / ง่ายเหมือนปอกกล้วย`},situation:{en:`Saying a task is much easier than it looks.`,th:`ใช้บอกว่างานนั้นง่ายกว่าที่คิดมาก`},ipa:`/ɪts ə ˈpis əv ˈkeɪk/`,thaiRead:`อิทส์ อะ พีซ เอิฟ เคค`,chunks:[`It's a`,`piece of`,`cake.`],stress:[`piece`,`cake`],pronTip:{en:`"Piece of" links to "PIE-suv".`,th:`"Piece of" พูดติดกันเป็น "พี-เซิฟ"`},example:{en:`Do not worry about the quiz. It's a piece of cake.`,th:`ไม่ต้องกังวลเรื่องควิซหรอก ง่ายมาก`},dialogue:[{speaker:`A`,en:`Is the new game hard?`,th:`เกมใหม่ยากไหม`},{speaker:`B`,en:`No, it's a piece of cake. You will finish level one fast.`,th:`ไม่ ง่ายมาก เดี๋ยวก็ผ่านด่านหนึ่งเร็ว ๆ นี้แหละ`},{speaker:`A`,en:`Good, I will try it tonight.`,th:`ดีเลย คืนนี้จะลองเล่น`}],mistake:{en:`It has nothing to do with real cake. Do not say "It is a cake piece" or translate it word for word.`,th:`สำนวนนี้ไม่เกี่ยวกับเค้กจริง ๆ อย่าพูดว่า "It is a cake piece" และอย่าแปลตรงตัว`},tip:{en:`Use it about your own task or to encourage someone. Saying it about someone else's hard work can sound rude.`,th:`ใช้กับงานของตัวเองหรือใช้ให้กำลังใจคนอื่น แต่ถ้าใช้กับงานที่คนอื่นทำอย่างยากลำบากอาจฟังดูไม่สุภาพ`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend is scared of a very easy homework sheet. What do you say?`,th:`เพื่อนกลัวใบงานที่จริง ๆ แล้วง่ายมาก จะพูดว่าอะไร`},options:[`It's a piece of cake.`,`It is a cake piece.`,`It is like eating cake hardly.`],correct:0,explain:{en:`The idiom has a fixed form: "a piece of cake". Changing the words breaks the meaning.`,th:`สำนวนนี้มีรูปตายตัวคือ "a piece of cake" ถ้าเปลี่ยนคำความหมายจะเสียไป`}},dialogueGap:{lines:[{speaker:`A`,en:`How was the driving test?`},{speaker:`B`,en:`____ I passed on the first try.`}],blankIndex:1,options:[`It's a piece of cake.`,`It slipped my mind.`,`Let's call it a day.`],correct:0,explain:{en:`Passing on the first try shows it was easy, which matches this idiom.`,th:`การสอบผ่านตั้งแต่ครั้งแรกแสดงว่าง่าย ซึ่งตรงกับสำนวนนี้`}},speakPrompt:{en:`Describe one thing that is easy for you, and use this idiom.`,th:`เล่าสิ่งที่คุณทำได้ง่ายหนึ่งอย่าง โดยใช้สำนวนนี้`}},{id:`u8-2`,unit:8,text:`Hang in there.`,meaning:{en:`Stay strong — the hard time will pass.`,th:`อดทนไว้นะ / สู้ ๆ`},situation:{en:`Encouraging someone going through something difficult.`,th:`ใช้ให้กำลังใจคนที่กำลังเจอเรื่องยาก`},ipa:`/ˈhæŋ ɪn ˈðɛr/`,thaiRead:`แฮง อิน แดร์`,chunks:[`Hang in`,`there.`],stress:[`Hang`,`there`],pronTip:{en:`"Hang in" links to "HANG-in", then stress "there".`,th:`"Hang in" พูดติดกันเป็น "แฮง-อิน" แล้วเน้นคำว่า "there"`},example:{en:`Only two more weeks of exams. Hang in there!`,th:`อีกแค่สองสัปดาห์ก็สอบเสร็จ อดทนไว้นะ`},dialogue:[{speaker:`A`,en:`This month has been so hard.`,th:`เดือนนี้หนักมากเลย`},{speaker:`B`,en:`Hang in there. You are almost through it.`,th:`อดทนไว้นะ ใกล้จะผ่านไปแล้ว`},{speaker:`A`,en:`Thanks. I needed that.`,th:`ขอบใจนะ กำลังต้องการคำนี้เลย`}],mistake:{en:`It is not about hanging an object. Do not say "Hang on there" for encouragement — "Hang on" means "wait".`,th:`สำนวนนี้ไม่เกี่ยวกับการแขวนของ และอย่าใช้ "Hang on there" เพื่อให้กำลังใจ เพราะ "Hang on" แปลว่ารอสักครู่`},tip:{en:`Best for a hard situation that will end soon, like exams or a tough week.`,th:`เหมาะกับสถานการณ์ยาก ๆ ที่กำลังจะจบลง เช่น ช่วงสอบหรือสัปดาห์ที่หนัก`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend is tired during exam week. What do you say?`,th:`เพื่อนเหนื่อยมากในสัปดาห์สอบ จะพูดว่าอะไร`},options:[`Hang in there.`,`Hang on there.`,`Hang it there.`],correct:0,explain:{en:`"Hang on" means "wait a moment". The encouragement idiom is "Hang in there."`,th:`"Hang on" แปลว่ารอสักครู่ ส่วนสำนวนให้กำลังใจคือ "Hang in there."`}},dialogueGap:{lines:[{speaker:`A`,en:`I have three tests left and I am exhausted.`},{speaker:`B`,en:`____ You are doing really well.`}],blankIndex:1,options:[`Hang in there.`,`It's a piece of cake.`,`I'm on my way.`],correct:0,explain:{en:`A is struggling but close to the end, so encouragement fits best.`,th:`A กำลังเหนื่อยแต่ใกล้จบแล้ว จึงเหมาะกับการให้กำลังใจมากที่สุด`}},speakPrompt:{en:`Encourage someone in a hard week, using this idiom plus one specific compliment.`,th:`ให้กำลังใจคนที่กำลังเจอสัปดาห์หนัก ๆ โดยใช้สำนวนนี้พร้อมคำชมที่เจาะจงหนึ่งอย่าง`}},{id:`u8-3`,unit:8,text:`That makes sense.`,meaning:{en:`Now I understand — that is logical.`,th:`เข้าใจแล้ว / ฟังดูสมเหตุสมผล`},situation:{en:`After someone explains something clearly.`,th:`ใช้หลังจากที่อีกฝ่ายอธิบายจนเข้าใจ`},ipa:`/ðæt ˈmeɪks ˈsɛns/`,thaiRead:`แดท เมคส์ เซนส์`,chunks:[`That makes`,`sense.`],stress:[`makes`,`sense`],pronTip:{en:`Keep both s sounds: "makes sense" has an s at the end of each word.`,th:`ออกเสียง s ให้ครบทั้งสองคำ เพราะ "makes sense" มีเสียง s ท้ายทั้งคู่`},example:{en:`Oh, that makes sense. Thanks for explaining.`,th:`อ๋อ เข้าใจแล้ว ขอบคุณที่อธิบายนะ`},dialogue:[{speaker:`A`,en:`We start with the smallest number so the pattern is clear.`,th:`เราเริ่มจากเลขน้อยสุดเพื่อให้เห็นแพตเทิร์นชัด`},{speaker:`B`,en:`That makes sense. I will redo my table.`,th:`เข้าใจแล้ว เดี๋ยวทำตารางใหม่`}],mistake:{en:`Say "That makes sense" about an idea. "You make sense" sounds strange in English.`,th:`ใช้ "That makes sense" กับความคิดหรือคำอธิบาย ส่วน "You make sense" ฟังแปลกในภาษาอังกฤษ`},tip:{en:`It is a great way to show you were listening and now understand.`,th:`เป็นวิธีที่ดีในการแสดงว่าเราตั้งใจฟังและเข้าใจแล้ว`},formality:`Neutral`,context:`School`,bestResponse:{prompt:{en:`Your teacher explains a rule and now you understand. What do you say?`,th:`ครูอธิบายกฎจนคุณเข้าใจแล้ว จะพูดว่าอะไร`},options:[`That makes sense.`,`You make sense.`,`That is make sense.`],correct:0,explain:{en:`The idiom describes the idea, not the person, and the verb form is "makes".`,th:`สำนวนนี้ใช้กับความคิด ไม่ใช่กับตัวคน และรูปกริยาที่ถูกคือ "makes"`}},dialogueGap:{lines:[{speaker:`A`,en:`We use "an" before a vowel sound, not a vowel letter.`},{speaker:`B`,en:`____ That is why we say "an hour".`}],blankIndex:1,options:[`That makes sense.`,`No way!`,`Let's call it a day.`],correct:0,explain:{en:`B applies the new rule correctly, showing understanding.`,th:`B นำกฎใหม่ไปใช้ได้ถูกต้อง แสดงว่าเข้าใจแล้ว`}},speakPrompt:{en:`React to an explanation with this idiom, then say what you understood.`,th:`ตอบรับคำอธิบายด้วยสำนวนนี้ แล้วบอกว่าคุณเข้าใจอะไร`}},{id:`u8-4`,unit:8,text:`I'm all ears.`,meaning:{en:`I am listening carefully — please tell me.`,th:`ฟังอยู่ เล่ามาเลย / ตั้งใจฟังเต็มที่`},situation:{en:`Telling someone you are ready to hear their story.`,th:`ใช้บอกว่าเราพร้อมฟังเรื่องของอีกฝ่าย`},ipa:`/aɪm ˈɔl ˈɪrz/`,thaiRead:`ไอม์ ออล เอียร์ส`,chunks:[`I'm all`,`ears.`],stress:[`all`,`ears`],pronTip:{en:`Do not drop the "s" — "ears" is plural in this idiom.`,th:`อย่าตัดเสียง s เพราะ "ears" ในสำนวนนี้เป็นพหูพจน์`},example:{en:`You have news? I'm all ears.`,th:`มีข่าวเหรอ เล่ามาเลย ฟังอยู่`},dialogue:[{speaker:`A`,en:`Can I tell you something about the project?`,th:`ขอเล่าเรื่องโปรเจกต์หน่อยได้ไหม`},{speaker:`B`,en:`Of course, I'm all ears.`,th:`ได้เลย เล่ามาเลย ฟังอยู่`},{speaker:`A`,en:`I think we should change the design.`,th:`เราว่าเราควรเปลี่ยนดีไซน์`}],mistake:{en:`It is not literal. Do not say "I have all ears" or "My ears are all".`,th:`สำนวนนี้ไม่ได้แปลตรงตัว อย่าพูดว่า "I have all ears" หรือ "My ears are all"`},tip:{en:`It is warm and friendly. In a formal meeting, "Please go ahead" is a better fit.`,th:`สำนวนนี้อบอุ่นและเป็นมิตร ถ้าเป็นการประชุมทางการ ใช้ "Please go ahead" จะเหมาะกว่า`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`A friend says they have something important to tell you. What do you say?`,th:`เพื่อนบอกว่ามีเรื่องสำคัญจะเล่าให้ฟัง จะพูดว่าอะไร`},options:[`I'm all ears.`,`I have all ears.`,`My ears are ready.`],correct:0,explain:{en:`The fixed idiom is "I'm all ears". The other forms are not used by native speakers.`,th:`สำนวนตายตัวคือ "I'm all ears" ส่วนรูปอื่นเจ้าของภาษาไม่ใช้`}},dialogueGap:{lines:[{speaker:`A`,en:`You will not believe what happened at practice.`},{speaker:`B`,en:`____`},{speaker:`A`,en:`Our coach announced a new team captain!`}],blankIndex:1,options:[`I'm all ears.`,`It's up to you.`,`Better late than never.`],correct:0,explain:{en:`A continues the story after B speaks, so B invited them to tell it.`,th:`A เล่าเรื่องต่อหลังจาก B พูด แสดงว่า B ชวนให้เล่า`}},speakPrompt:{en:`Invite a friend to share their news using this idiom, then ask one question.`,th:`ชวนเพื่อนเล่าข่าวด้วยสำนวนนี้ แล้วถามต่อหนึ่งคำถาม`}},{id:`u8-5`,unit:8,text:`It slipped my mind.`,meaning:{en:`I forgot about it.`,th:`ลืมสนิทเลย / นึกไม่ออกตอนนั้น`},situation:{en:`Apologising for forgetting something small.`,th:`ใช้ขอโทษที่ลืมเรื่องเล็ก ๆ`},ipa:`/ɪt ˈslɪpt maɪ ˈmaɪnd/`,thaiRead:`อิท สลิพท์ มาย ไมนด์`,chunks:[`It slipped`,`my mind.`],stress:[`slipped`,`mind`],pronTip:{en:`"Slipped" ends with a "t" sound, not "ed".`,th:`"Slipped" ลงท้ายด้วยเสียง t ไม่ใช่เสียง ed`},example:{en:`I'm sorry, it slipped my mind. I will bring it tomorrow.`,th:`ขอโทษนะ ลืมสนิทเลย พรุ่งนี้จะเอามาให้`},dialogue:[{speaker:`A`,en:`Did you email the form?`,th:`ส่งอีเมลแบบฟอร์มหรือยัง`},{speaker:`B`,en:`Oh no, it slipped my mind. I will do it now.`,th:`ตายจริง ลืมสนิทเลย เดี๋ยวทำเลย`},{speaker:`A`,en:`No problem, there is still time.`,th:`ไม่เป็นไร ยังทันอยู่`}],mistake:{en:`The idiom is "slipped my mind", not "slipped from my head" or "slipped my brain".`,th:`สำนวนคือ "slipped my mind" ไม่ใช่ "slipped from my head" หรือ "slipped my brain"`},tip:{en:`It sounds softer than "I forgot" and works well with a quick apology.`,th:`ฟังนุ่มกว่า "I forgot" และเข้ากันดีกับการขอโทษสั้น ๆ`},formality:`Neutral`,context:`General`,bestResponse:{prompt:{en:`You completely forgot to reply to a message. What do you say?`,th:`คุณลืมตอบข้อความสนิทเลย จะพูดว่าอะไร`},options:[`It slipped my mind.`,`It slipped my head.`,`My mind is slipping.`],correct:0,explain:{en:`The idiom uses "mind" and the past tense "slipped". The others change the fixed wording.`,th:`สำนวนนี้ใช้คำว่า "mind" และรูปอดีต "slipped" ส่วนข้ออื่นเปลี่ยนคำในสำนวนตายตัว`}},dialogueGap:{lines:[{speaker:`A`,en:`You were supposed to bring the charger.`},{speaker:`B`,en:`____ I am really sorry.`}],blankIndex:1,options:[`It slipped my mind.`,`I'm all ears.`,`That makes sense.`],correct:0,explain:{en:`B apologises for forgetting, which is exactly what this idiom explains.`,th:`B ขอโทษที่ลืม ซึ่งตรงกับความหมายของสำนวนนี้`}},speakPrompt:{en:`Apologise for forgetting something, using this idiom and offering a fix.`,th:`ขอโทษที่ลืมเรื่องหนึ่ง โดยใช้สำนวนนี้พร้อมเสนอทางแก้`}},{id:`u8-6`,unit:8,text:`Let's call it a day.`,meaning:{en:`Let us stop working now and finish for today.`,th:`วันนี้พอแค่นี้ก่อนเถอะ`},situation:{en:`Ending a study session, practice, or work.`,th:`ใช้ตอนจบการติว การซ้อม หรือการทำงาน`},ipa:`/lɛts ˈkɔl ɪt ə ˈdeɪ/`,thaiRead:`เล็ทส์ คอล-อิท อะ เด`,chunks:[`Let's call it`,`a day.`],stress:[`call`,`day`],pronTip:{en:`"Call it" links to "CALL-it".`,th:`"Call it" พูดติดกันเป็น "คอล-ลิท"`},example:{en:`We have done four pages. Let's call it a day.`,th:`ทำไปสี่หน้าแล้ว วันนี้พอแค่นี้ก่อนเถอะ`},dialogue:[{speaker:`A`,en:`We have been studying for three hours.`,th:`เราอ่านหนังสือมาสามชั่วโมงแล้ว`},{speaker:`B`,en:`Let's call it a day. We can finish tomorrow.`,th:`วันนี้พอแค่นี้ก่อนเถอะ พรุ่งนี้ค่อยทำต่อ`},{speaker:`A`,en:`Agreed. Same time tomorrow?`,th:`เห็นด้วย พรุ่งนี้เวลาเดิมไหม`}],mistake:{en:`It means stop for today, not quit forever. Do not use it to mean giving up.`,th:`สำนวนนี้แปลว่าหยุดแค่วันนี้ ไม่ได้แปลว่าเลิกถาวร อย่าใช้ในความหมายว่ายอมแพ้`},tip:{en:`Common at the end of study sessions and practice. Add when you will continue.`,th:`ใช้บ่อยตอนจบการติวหรือการซ้อม ควรบอกด้วยว่าจะทำต่อเมื่อไร`},formality:`Casual`,context:`General`,bestResponse:{prompt:{en:`You and your partner are tired after a long study session. What do you suggest?`,th:`คุณกับเพื่อนเหนื่อยหลังติวมานาน จะเสนอว่าอะไร`},options:[`Let's call it a day.`,`Let's call a day.`,`Let's call it day.`],correct:0,explain:{en:`The idiom needs both "it" and "a": "call it a day".`,th:`สำนวนนี้ต้องมีทั้ง "it" และ "a" คือ "call it a day"`}},dialogueGap:{lines:[{speaker:`A`,en:`It is almost nine and we finished the last exercise.`},{speaker:`B`,en:`____ See you tomorrow.`}],blankIndex:1,options:[`Let's call it a day.`,`I'm all ears.`,`Hang in there.`],correct:0,explain:{en:`The work is finished and it is late, so stopping for today is the natural suggestion.`,th:`งานเสร็จแล้วและดึกแล้ว การเสนอให้หยุดแค่วันนี้จึงเป็นธรรมชาติที่สุด`}},speakPrompt:{en:`End a study session with this idiom and say when you will continue.`,th:`จบการติวด้วยสำนวนนี้ และบอกว่าจะทำต่อเมื่อไร`}},{id:`u8-7`,unit:8,text:`It's up to you.`,meaning:{en:`You can decide — I am happy either way.`,th:`แล้วแต่เธอเลย`},situation:{en:`Letting the other person choose.`,th:`ใช้ตอนให้อีกฝ่ายเป็นคนเลือก`},ipa:`/ɪts ˈʌp tə ju/`,thaiRead:`อิทส์ อัพ ทู ยู`,chunks:[`It's up`,`to you.`],stress:[`up`,`you`],pronTip:{en:`"Up to" links to "UP-tuh" with a quiet "to".`,th:`"Up to" พูดติดกันเป็น "อัพ-เทอะ" โดยเสียง "to" เบามาก`},example:{en:`Pizza or noodles? It's up to you.`,th:`พิซซ่าหรือก๋วยเตี๋ยว แล้วแต่เธอเลย`},dialogue:[{speaker:`A`,en:`Should we meet at four or five?`,th:`เจอกันสี่โมงหรือห้าโมงดี`},{speaker:`B`,en:`It's up to you. Both work for me.`,th:`แล้วแต่เธอเลย เราสะดวกทั้งสองเวลา`},{speaker:`A`,en:`Let us say four then.`,th:`งั้นสี่โมงนะ`}],mistake:{en:`Do not say "It is up to your". The idiom ends with the pronoun "you".`,th:`อย่าพูดว่า "It is up to your" เพราะสำนวนนี้ลงท้ายด้วยสรรพนาม "you"`},tip:{en:`Add "Both work for me" so it sounds helpful rather than uninterested.`,th:`เติม "Both work for me" ด้วย จะฟังเหมือนช่วยตัดสินใจ ไม่ใช่ไม่สนใจ`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend asks which film to watch and you are happy with either. What do you say?`,th:`เพื่อนถามว่าจะดูหนังเรื่องไหน และคุณโอเคทั้งสองเรื่อง จะพูดว่าอะไร`},options:[`It's up to you.`,`It is up to your.`,`It is on you to decide it.`],correct:0,explain:{en:`The idiom ends with "you". "Your" needs a noun after it, so it is wrong here.`,th:`สำนวนนี้ลงท้ายด้วย "you" ส่วน "your" ต้องมีคำนามตามหลัง จึงใช้ตรงนี้ไม่ได้`}},dialogueGap:{lines:[{speaker:`A`,en:`Do you want to sit inside or outside?`},{speaker:`B`,en:`____ I like both.`}],blankIndex:1,options:[`It's up to you.`,`It slipped my mind.`,`I'm on my way.`],correct:0,exp [{speaker:`A`,en:`I know I am two weeks behind, but I started the course today.`},{speaker:`B`,en:`____ You will catch up quickly.`}],blankIndex:1,options:[`Better late than never.`,`It's a piece of cake.`,`I'm all ears.`],correct:0,explain:{en:`A started late but did start, which is exactly what this idiom celebrates.`,th:`A เริ่มช้าแต่ก็ได้เริ่มแล้ว ซึ่งตรงกับสิ่งที่สำนวนนี้ชื่นชม`}},speakPrompt:{en:`Encourage someone who started something late, using this idiom.`,th:`ให้กำลังใจคนที่เริ่มต้นช้าโดยใช้สำนวนนี้`}},{id:`u8-9`,unit:8,text:`You've got this.`,meaning:{en:`I believe you can do it.`,th:`เธอทำได้แน่นอน`},situation:{en:`Encouraging someone right before a challenge.`,th:`ใช้ให้กำลังใจก่อนที่อีกฝ่ายจะเจอความท้าทาย`},ipa:`/juv ˈɡɑt ðɪs/`,thaiRead:`ยูฟ์ กอท ดิส`,chunks:[`You've`,`got this.`],stress:[`got`],pronTip:{en:`"You've" is short — one quick sound, not "you have".`,th:`"You've" ออกเสียงสั้นเป็นเสียงเดียว ไม่ใช่พูดเต็มว่า "you have"`},example:{en:`Take a deep breath. You've got this!`,th:`หายใจลึก ๆ เธอทำได้แน่นอน`},dialogue:[{speaker:`A`,en:`I am on stage in five minutes.`,th:`อีกห้านาทีต้องขึ้นเวทีแล้ว`},{speaker:`B`,en:`You've got this. You practised all week.`,th:`เธอทำได้แน่นอน ซ้อมมาทั้งสัปดาห์แล้วนี่`},{speaker:`A`,en:`Thank you. Here I go!`,th:`ขอบคุณนะ ไปแล้วนะ`}],mistake:{en:`It is not about owning an object. "You've got this" means "you can do this".`,th:`สำนวนนี้ไม่ได้แปลว่ามีของสิ่งนั้น "You've got this" แปลว่าเธอทำได้`},tip:{en:`Say it just before the moment — right before a test, a race, or a speech.`,th:`พูดตอนใกล้จะเริ่มจริง ๆ เช่น ก่อนสอบ ก่อนแข่ง หรือก่อนขึ้นพูด`},formality:`Casual`,context:`Friends`,bestResponse:{prompt:{en:`Your friend is nervous one minute before their speech. What do you say?`,th:`เพื่อนตื่นเต้นก่อนขึ้นพูดหนึ่งนาที จะพูดว่าอะไร`},options:[`You've got this.`,`You have got it here.`,`You get this one.`],correct:0,explain:{en:`The fixed encouragement idiom is "You've got this". The others are not idiomatic.`,th:`สำนวนให
