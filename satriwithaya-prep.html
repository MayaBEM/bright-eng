exactly once, so the leaf area = 308 − 196 = 112 cm² (the square's area, 14² = 196, is subtracted once).`,th:`พื้นที่หนึ่งในสี่วงกลมแต่ละอัน = \\frac{1}{4} × π × 14² = \\frac{1}{4} × 22/7 × 196 = 154 ตารางเซนติเมตร สองอันรวมกัน = 308 ตารางเซนติเมตร ซึ่งนับพื้นที่สี่เหลี่ยมซ้ำไปหนึ่งครั้งพอดี ดังนั้นพื้นที่ใบไม้ = 308 − 196 = 112 ตารางเซนติเมตร (ลบพื้นที่สี่เหลี่ยม 14² = 196 ออกหนึ่งครั้ง)`},distractorNotes:{A:{en:`This adds the two quarter-circle areas (154 + 154 = 308) but forgets to subtract the square's area to remove the double-counted region.`,th:`นำพื้นที่หนึ่งในสี่วงกลมสองอันมาบวกกัน (154 + 154 = 308) แต่ลืมลบพื้นที่สี่เหลี่ยมที่ถูกนับซ้ำออก`},B:{en:`This only calculates the area of ONE quarter circle (154 cm²) and forgets the shape is formed from two overlapping arcs.`,th:`คำนวณพื้นที่หนึ่งในสี่วงกลมเพียงอันเดียว (154 ตารางเซนติเมตร) และลืมว่ารูปทรงนี้เกิดจากส่วนโค้งสองอันซ้อนทับกัน`},D:{en:`This subtracts one quarter-circle area from the square (196 − 154 = 42), which describes a different shape, not the overlapping leaf region.`,th:`นำพื้นที่หนึ่งในสี่วงกลมไปลบออกจากสี่เหลี่ยม (196 − 154 = 42) ซึ่งเป็นรูปทรงคนละแบบ ไม่ใช่บริเวณใบไม้ที่ซ้อนทับกัน`}},hints:[{en:`The leaf shape is where two quarter circles, drawn from opposite corners, overlap each other.`,th:`รูปใบไม้คือบริเวณที่ส่วนโค้งหนึ่งในสี่วงกลมสองอันจากมุมตรงข้ามซ้อนทับกัน`},{en:`Find the area of one quarter circle first, then think about what happens when you add two of them together over the square.`,th:`หาพื้นที่หนึ่งในสี่วงกลมอันเดียวก่อน แล้วคิดว่าจะเกิดอะไรขึ้นเมื่อนำสองอันมารวมกันบนสี่เหลี่ยม`},{en:`Leaf area = (2 × quarter-circle area) − square area = 308 − 196.`,th:`พื้นที่ใบไม้ = (2 × พื้นที่หนึ่งในสี่วงกลม) − พื้นที่สี่เหลี่ยม = 308 − 196`}],visual:{kind:`leafShape`,width:90,height:90,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A square with two quarter-circle arcs drawn from the top-left and bottom-right corners, overlapping to form a shaded leaf shape in the middle.`,th:`สี่เหลี่ยมจัตุรัสที่มีส่วนโค้งหนึ่งในสี่วงกลมสองเส้นลากจากมุมบนซ้ายและมุมล่างขวา ซ้อนทับกันเกิดเป็นรูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:115},{id:`C-15`,testId:`stw-mock-c`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a fraction remaining`,th:`เศษส่วนของเศษส่วนที่เหลือ`},difficulty:F(15),prompt:{en:`A barrel holds 72 liters of lemonade for the sports-day refreshment stand. In the morning, \\frac{3}{8} of the lemonade was used. In the afternoon, \\frac{1}{3} of the REMAINING lemonade was used. How many liters of lemonade are left at the end of the day?`,th:`ถังน้ำมะนาวบรรจุ 72 ลิตร สำหรับซุ้มเครื่องดื่มในวันกีฬาสี ช่วงเช้าใช้น้ำมะนาวไป \\frac{3}{8} ของทั้งหมด ช่วงบ่ายใช้น้ำมะนาวที่ "เหลืออยู่" ไปอีก \\frac{1}{3} เมื่อสิ้นวัน น้ำมะนาวจะเหลืออยู่กี่ลิตร`},options:[{id:`A`,label:{en:`30 liters`,th:`30 ลิตร`}},{id:`B`,label:{en:`45 liters`,th:`45 ลิตร`}},{id:`C`,label:{en:`21 liters`,th:`21 ลิตร`}},{id:`D`,label:{en:`15 liters`,th:`15 ลิตร`}}],correctOptionId:`A`,explanation:{en:`Morning use = \\frac{3}{8} × 72 = 27 liters, leaving 72 − 27 = 45 liters. Afternoon use = \\frac{1}{3} × 45 = 15 liters, leaving 45 − 15 = 30 liters.`,th:`ใช้ไปตอนเช้า = \\frac{3}{8} × 72 = 27 ลิตร เหลือ 72 − 27 = 45 ลิตร ใช้ไปตอนบ่าย = \\frac{1}{3} × 45 = 15 ลิตร เหลือ 45 − 15 = 30 ลิตร`},distractorNotes:{B:{en:`This stops after finding the morning remainder (45 liters) and forgets that more was used in the afternoon.`,th:`หยุดคำนวณหลังจากหาปริมาณที่เหลือตอนเช้า (45 ลิตร) และลืมว่ามีการใช้เพิ่มอีกตอนบ่าย`},C:{en:`This incorrectly applies \\frac{1}{3} to the ORIGINAL 72 liters instead of the remaining 45 liters, computing 72 − 27 − 24 = 21.`,th:`ใช้ \\frac{1}{3} กับปริมาณเดิม 72 ลิตร แทนที่จะใช้กับ 45 ลิตรที่เหลือ ทำให้คำนวณเป็น 72 − 27 − 24 = 21 ซึ่งผิด`},D:{en:`This reports the amount of lemonade USED in the afternoon (15 liters) instead of the amount left over.`,th:`ตอบปริมาณน้ำมะนาวที่ "ใช้ไป" ตอนบ่าย (15 ลิตร) แทนที่จะเป็นปริมาณที่เหลืออยู่`}},hints:[{en:`Work out the morning's usage and remainder first, one step at a time.`,th:`คำนวณปริมาณที่ใช้และที่เหลือของตอนเช้าก่อนทีละขั้นตอน`},{en:`The afternoon fraction applies to what remains AFTER the morning, not to the original 72 liters.`,th:`เศษส่วนของตอนบ่ายใช้กับปริมาณที่เหลือ "หลังจากตอนเช้า" ไม่ใช่กับ 72 ลิตรเดิม`},{en:`After the morning, 45 liters remain. Find one-third of 45, then subtract it from 45.`,th:`หลังตอนเช้าเหลือ 45 ลิตร หาหนึ่งในสามของ 45 แล้วนำไปลบออกจาก 45`}],visual:null,estimatedSeconds:105},{id:`C-16`,testId:`stw-mock-c`,number:16,skill:`Algebra & Patterns`,topic:{en:`Cut-corner area equation`,th:`สมการพื้นที่มุมที่ถูกตัด`},difficulty:F(16),prompt:{en:`A square sheet of paper with side length 15 cm has one corner cut off along a straight cut, removing a right-triangle piece whose two equal legs are each x cm long, as shown. The remaining five-sided shape has an area of 207 cm². Find x.`,th:`กระดาษสี่เหลี่ยมจัตุรัสด้านยาว 15 เซนติเมตร ถูกตัดมุมหนึ่งออกด้วยเส้นตัดตรง ทำให้ได้ชิ้นสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากสองด้านยาวเท่ากันคือ x เซนติเมตร ดังภาพ รูปห้าเหลี่ยมที่เหลือมีพื้นที่ 207 ตารางเซนติเมตร จงหาค่า x`},options:[{id:`A`,label:{en:`18`,th:`18`}},{id:`B`,label:{en:`9`,th:`9`}},{id:`C`,label:{en:`36`,th:`36`}},{id:`D`,label:{en:`6`,th:`6`}}],correctOptionId:`D`,explanation:{en:`The square's area is 15² = 225 cm². The removed triangle has area x²÷2. So 225 − x²÷2 = 207, giving x²÷2 = 18, so x² = 36. Taking the square root, x = 6 cm.`,th:`พื้นที่สี่เหลี่ยมจัตุรัส = 15² = 225 ตารางเซนติเมตร สามเหลี่ยมที่ถูกตัดออกมีพื้นที่ x²÷2 ดังนั้น 225 − x²÷2 = 207 จะได้ x²÷2 = 18 ดังนั้น x² = 36 ถอดรากที่สอง ได้ x = 6 เซนติเมตร`},distractorNotes:{A:{en:`This mistakes the area difference itself (225 − 207 = 18) for the value of x, skipping the triangle-area relationship entirely.`,th:`เข้าใจผิดว่าผลต่างของพื้นที่ (225 − 207 = 18) คือค่า x โดยตรง โดยไม่ได้ใช้ความสัมพันธ์ของพื้นที่สามเหลี่ยม`},B:{en:`This divides the area difference by 2 an extra, unnecessary time (18 ÷ 2 = 9) instead of correctly doubling it to find x².`,th:`นำผลต่างของพื้นที่ไปหารด้วย 2 เพิ่มอีกครั้งโดยไม่จำเป็น (18 ÷ 2 = 9) แทนที่จะคูณสองอย่างถูกต้องเพื่อหา x²`},C:{en:`This correctly finds x² = 36 but forgets the final step of taking the square root to find x.`,th:`หา x² = 36 ได้ถูกต้อง แต่ลืมขั้นตอนสุดท้ายคือการถอดรากที่สองเพื่อหา x`}},hints:[{en:`Start by finding the area of the whole square before any cut is made.`,th:`เริ่มจากหาพื้นที่ของสี่เหลี่ยมจัตุรัสทั้งหมดก่อนที่จะถูกตัด`},{en:`The removed triangle has two equal legs of length x, so its area is x times x, divided by 2.`,th:`สามเหลี่ยมที่ถูกตัดออกมีด้านประกอบมุมฉากเท่ากันสองด้านยาว x ดังนั้นพื้นที่คือ x คูณ x หารด้วย 2`},{en:`Set up: 225 − (x² ÷ 2) = 207. Solve for x², then remember to take the square root at the end.`,th:`ตั้งสมการ: 225 − (x² ÷ 2) = 207 แก้หา x² แล้วอย่าลืมถอดรากที่สองในขั้นตอนสุดท้าย`}],visual:{kind:`geometryFigure`,width:160,height:160,polygons:[{points:[[0,0],[96,0],[160,64],[160,160],[0,160]],fill:`shaded`}],segments:[{x1:96,y1:0,x2:160,y2:0,style:`dashed`},{x1:160,y1:0,x2:160,y2:64,style:`dashed`}],labels:[{x:128,y:-10,text:`x`},{x:176,y:32,text:`x`}],alt:{en:`A square with its top-right corner cut off by a diagonal line, forming a pentagon. Both legs of the cut-off triangle are labeled x, one along the top edge and one along the right edge, clearly separated from each other.`,th:`สี่เหลี่ยมจัตุรัสที่ถูกตัดมุมบนขวาออกด้วยเส้นทแยง เกิดเป็นรูปห้าเหลี่ยม ด้านประกอบมุมฉากทั้งสองของสามเหลี่ยมที่ถูกตัดออกกำกับด้วย x หนึ่งด้านอยู่ตามขอบบนและอีกด้านอยู่ตามขอบขวา แยกจากกันอย่างชัดเจน`}},estimatedSeconds:135},{id:`C-17`,testId:`stw-mock-c`,number:17,skill:`Graphs & Data`,topic:{en:`Reading a grouped bar chart`,th:`การอ่านกราฟแท่งแบบกลุ่ม`},difficulty:F(17),prompt:{en:`The bar chart shows the points scored by the Red Team and Blue Team in four sports-day events. Which of the following statements is INCORRECT?`,th:`กราฟแท่งแสดงคะแนนที่ทีมแดงและทีมน้ำเงินทำได้ในกิจกรรมกีฬาสีสี่ประเภท ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Tug of War has the largest point difference between the two teams.`,th:`ชักเย่อเป็นกิจกรรมที่มีผลต่างคะแนนระหว่างสองทีมมากที่สุด`}},{id:`B`,label:{en:`Blue Team scored higher than Red Team in exactly two events (High Jump and Swimming).`,th:`ทีมน้ำเงินทำคะแนนได้มากกว่าทีมแดงในสองกิจกรรมพอดี (กระโดดสูงและว่ายน้ำ)`}},{id:`C`,label:{en:`The single highest score recorded in any event was 40 points, by the Red Team in Tug of War.`,th:`คะแนนสูงสุดเดี่ยวที่ทำได้ในกิจกรรมใด ๆ คือ 40 คะแนน โดยทีมแดงในการชักเย่อ`}},{id:`D`,label:{en:`Blue Team's total score across all four events (127) is higher than Red Team's total (123).`,th:`คะแนนรวมทั้งสี่กิจกรรมของทีมน้ำเงิน (127) มากกว่าคะแนนรวมของทีมแดง (123)`}}],correctOptionId:`A`,explanation:{en:`The point differences are: Relay 5, High Jump 6, Tug of War 15, Swimming 18. The LARGEST difference is actually in Swimming (18), not Tug of War (15), so statement A is incorrect. The other three statements all check out against the chart.`,th:`ผลต่างคะแนนของแต่ละกิจกรรมคือ วิ่งผลัด 5, กระโดดสูง 6, ชักเย่อ 15, ว่ายน้ำ 18 ผลต่างที่มากที่สุดจริง ๆ คือกิจกรรมว่ายน้ำ (18) ไม่ใช่ชักเย่อ (15) ดังนั้นข้อความ A จึงไม่ถูกต้อง ส่วนอีกสามข้อความตรงกับข้อมูลในกราฟทุกประการ`},distractorNotes:{B:{en:`This statement is actually true: Blue scored higher in High Jump (34 vs 28) and Swimming (38 vs 20) — exactly two events — so it should not be chosen as the incorrect one.`,th:`ข้อความนี้เป็นจริง ทีมน้ำเงินทำคะแนนได้มากกว่าในกระโดดสูง (34 ต่อ 28) และว่ายน้ำ (38 ต่อ 20) ซึ่งเป็นสองกิจกรรมพอดี จึงไม่ควรเลือกข้อนี้เป็นคำตอบ`},C:{en:`This statement is actually true: scanning every bar, the tallest single bar is 40 points, scored by Red Team in Tug of War.`,th:`ข้อความนี้เป็นจริง เมื่อตรวจดูแท่งทั้งหมด แท่งที่สูงที่สุดคือ 40 คะแนน ของทีมแดงในการชักเย่อ`},D:{en:`This statement is actually true: adding up all four events gives Red 35+28+40+20=123 and Blue 30+34+25+38=127, so Blue's total is indeed higher.`,th:`ข้อความนี้เป็นจริง เมื่อรวมคะแนนทั้งสี่กิจกรรม ทีมแดงได้ 35+28+40+20=123 และทีมน้ำเงินได้ 30+34+25+38=127 ดังนั้นทีมน้ำเงินมีคะแนนรวมมากกว่าจริง`}},hints:[{en:`Check each statement against the chart one at a time — three are true and one is false.`,th:`ตรวจสอบแต่ละข้อความกับกราฟทีละข้อ สามข้อเป็นจริงและหนึ่งข้อเป็นเท็จ`},{en:`For the statement about "largest difference", calculate the gap between the two teams in every single event.`,th:`สำหรับข้อความเรื่อง "ผลต่างมากที่สุด" ให้คำนวณช่องว่างระหว่างสองทีมในทุกกิจกรรม`},{en:`Compare all four gaps: 5, 6, 15, and 18. The event with the biggest gap is Swimming, not Tug of War.`,th:`เปรียบเทียบผลต่างทั้งสี่ค่า: 5, 6, 15 และ 18 กิจกรรมที่มีผลต่างมากที่สุดคือว่ายน้ำ ไม่ใช่ชักเย่อ`}],visual:{kind:`barChart`,categories:[`Relay`,`High Jump`,`Tug of War`,`Swimming`],series:[{name:{en:`Red Team`,th:`ทีมแดง`},color:`coral`,values:[35,28,40,20]},{name:{en:`Blue Team`,th:`ทีมน้ำเงิน`},color:`teal`,values:[30,34,25,38]}],yStep:10,yMax:40,alt:{en:`Grouped bar chart of Red Team versus Blue Team scores across four events: Relay (35, 30), High Jump (28, 34), Tug of War (40, 25), and Swimming (20, 38).`,th:`กราฟแท่งแบบกลุ่มแสดงคะแนนทีมแดงเทียบกับทีมน้ำเงินในสี่กิจกรรม: วิ่งผลัด (35, 30), กระโดดสูง (28, 34), ชักเย่อ (40, 25) และว่ายน้ำ (20, 38)`}},estimatedSeconds:150},{id:`C-18`,testId:`stw-mock-c`,number:18,skill:`Graphs & Data`,topic:{en:`Pie chart proportions`,th:`สัดส่วนแผนภูมิวงกลม`},difficulty:F(18),prompt:{en:`In a survey of students' favourite sports-day activity, the results are shown in the pie chart by degrees. 40 students chose Relay Race (120°). How many students chose Cheerdance (90°)?`,th:`จากการสำรวจกิจกรรมกีฬาสีที่นักเรียนชื่นชอบ ผลสำรวจแสดงเป็นแผนภูมิวงกลมโดยระบุมุมองศา มีนักเรียน 40 คนเลือกวิ่งผลัด (120°) มีนักเรียนกี่คนที่เลือกเชียร์ลีดเดอร์ (90°)`},options:[{id:`A`,label:{en:`10 students`,th:`10 คน`}},{id:`B`,label:{en:`30 students`,th:`30 คน`}},{id:`C`,label:{en:`25 students`,th:`25 คน`}},{id:`D`,label:{en:`270 students`,th:`270 คน`}}],correctOptionId:`B`,explanation:{en:`Since 120° corresponds to 40 students, each degree represents 40 ÷ 120 = \\frac{1}{3} of a student. Cheerdance's 90° therefore represents 90 × \\frac{1}{3} = 30 students.`,th:`เนื่องจาก 120° แทนนักเรียน 40 คน แต่ละองศาแทนนักเรียน 40 ÷ 120 = \\frac{1}{3} คน ดังนั้น 90° ของเชียร์ลีดเดอร์จึงแทนนักเรียน 90 × \\frac{1}{3} = 30 คน`},distractorNotes:{A:{en:`This uses the full 360° circle as the reference instead of Relay's actual 120°, computing 40 × 90 ÷ 360 = 10.`,th:`ใช้วงกลมเต็ม 360° เป็นตัวอ้างอิงแทนที่จะใช้ 120° ของวิ่งผลัด ทำให้คำนวณเป็น 40 × 90 ÷ 360 = 10`},C:{en:`This mistakenly reads the degree value from a neighboring 75° slice (Music or Tug of War) instead of Cheerdance's 90° slice.`,th:`อ่านค่ามุมผิดจากส่วนข้างเคียงที่ 75° (ดนตรีหรือชักเย่อ) แทนที่จะเป็นส่วนเชียร์ลีดเดอร์ที่ 90°`},D:{en:`This sets up the proportion upside down, multiplying 90 × (120 ÷ 40) = 270 instead of dividing correctly.`,th:`ตั้งสัดส่วนกลับด้าน โดยคูณ 90 × (120 ÷ 40) = 270 แทนที่จะหารให้ถูกทิศทาง`}},hints:[{en:`Find out how many students each single degree of the pie chart represents.`,th:`หาว่าแต่ละองศาของแผนภูมิวงกลมแทนนักเรียนกี่คน`},{en:`Use the given slice (120° = 40 students) to find the students-per-degree rate.`,th:`ใช้ส่วนที่โจทย์ให้มา (120° = นักเรียน 40 คน) เพื่อหาอัตรานักเรียนต่อองศา`},{en:`Multiply that rate by 90 to find how many students chose Cheerdance.`,th:`นำอัตรานั้นไปคูณกับ 90 เพื่อหาจำนวนนักเรียนที่เลือกเชียร์ลีดเดอร์`}],visual:{kind:`pieChart`,slices:[{label:`Relay`,degrees:120,color:`coral`},{label:`Music`,degrees:75,color:`sage`},{label:`Tug of War`,degrees:75,color:`teal`},{label:`Cheer`,degrees:90,color:`gold`}],alt:{en:`A pie chart of favourite sports-day activities: Relay 120 degrees, Music 75 degrees, Tug of War 75 degrees, and Cheerdance 90 degrees.`,th:`แผนภูมิวงกลมแสดงกิจกรรมกีฬาสีที่ชื่นชอบ: วิ่งผลัด 120 องศา, ดนตรี 75 องศา, ชักเย่อ 75 องศา และเชียร์ลีดเดอร์ 90 องศา`}},estimatedSeconds:140},{id:`C-19`,testId:`stw-mock-c`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Intended vs actual profit`,th:`กำไรที่ตั้งใจกับกำไรจริง`},difficulty:F(19),prompt:{en:`A shop bought sports-day medals at a cost of 80 baht each, hoping to mark them up for a 35% profit. However, during a clearance sale, the shop actually sold the medals for only 15% more than the cost price. Find the shop's ACTUAL profit per medal.`,th:`ร้านค้าซื้อเหรียญรางวัลกีฬาสีมาต้นทุนเหรียญละ 80 บาท โดยตั้งใจจะตั้งราคาขายเพื่อให้ได้กำไร 35% แต่ในการลดราคาล้างสต๊อก ร้านขายเหรียญได้จริงในราคาที่สูงกว่าต้นทุนเพียง 15% เท่านั้น จงหากำไรที่ร้านได้จริงต่อเหรียญหนึ่งอัน`},options:[{id:`A`,label:{en:`28 baht`,th:`28 บาท`}},{id:`B`,label:{en:`92 baht`,th:`92 บาท`}},{id:`C`,label:{en:`12 baht`,th:`12 บาท`}},{id:`D`,label:{en:`16 baht`,th:`16 บาท`}}],correctOptionId:`C`,explanation:{en:`The actual selling price = 80 + 15% of 80 = 80 + 12 = 92 baht. Actual profit = 92 − 80 = 12 baht. (The 35% figure was only the shop's original plan, not what actually happened.)`,th:`ราคาขายจริง = 80 + 15% ของ 80 = 80 + 12 = 92 บาท กำไรจริง = 92 − 80 = 12 บาท (ตัวเลข 35% เป็นเพียงแผนเดิมของร้าน ไม่ใช่สิ่งที่เกิดขึ้นจริง)`},distractorNotes:{A:{en:`This uses the intended 35% markup (80 × 0.35 = 28) instead of the actual 15% that the medals were really sold for.`,th:`ใช้อัตรากำไรที่ตั้งใจไว้ 35% (80 × 0.35 = 28) แทนที่จะใช้ 15% ที่ขายได้จริง`},B:{en:`This correctly finds the actual selling price (92 baht) but reports it as the profit instead of subtracting the cost price first.`,th:`หาราคาขายจริงได้ถูกต้อง (92 บาท) แต่ตอบเป็นกำไรโดยไม่ได้ลบต้นทุนออกก่อน`},D:{en:`This uses the DIFFERENCE between the intended and actual percentages (35% − 15% = 20%) applied to the cost, giving 80 × 0.20 = 16, which does not represent actual profit.`,th:`ใช้ผลต่างระหว่างเปอร์เซ็นต์ที่ตั้งใจกับที่ได้จริง (35% − 15% = 20%) คูณกับต้นทุน ได้ 80 × 0.20 = 16 ซึ่งไม่ใช่กำไรที่แท้จริง`}},hints:[{en:`The 35% figure describes what the shop hoped for, not what actually happened.`,th:`ตัวเลข 35% เป็นสิ่งที่ร้านตั้งใจไว้ ไม่ใช่สิ่งที่เกิดขึ้นจริง`},{en:`Use the ACTUAL 15% markup on the 80-baht cost to find the real selling price.`,th:`ใช้ส่วนเพิ่ม 15% ที่เกิดขึ้นจริงกับต้นทุน 80 บาท เพื่อหาราคาขายจริง`},{en:`Actual selling price = 80 + (15% of 80). Then subtract the 80-baht cost to find the actual profit.`,th:`ราคาขายจริง = 80 + (15% ของ 80) จากนั้นลบต้นทุน 80 บาทออกเพื่อหากำไรจริง`}],visual:null,estimatedSeconds:130},{id:`C-20`,testId:`stw-mock-c`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Three-way percentage relationships`,th:`ความสัมพันธ์ร้อยละสามฝ่าย`},difficulty:F(20),prompt:{en:`Anna, Bo, and Cara together raised 560 baht selling sports-day tickets. Bo raised 20% more than Anna, and Cara raised 50% of what Bo raised. How much did Anna raise?`,th:`แอนนา โบ และคาร่า ร่วมกันขายบัตรกิจกรรมกีฬาสีได้เงินรวม 560 บาท โบขายได้เงินมากกว่าแอนนา 20% และคาร่าขายได้เงินเป็น 50% ของที่โบขายได้ แอนนาขายได้เงินเท่าใด`},options:[{id:`A`,label:{en:`120 baht`,th:`120 บาท`}},{id:`B`,label:{en:`240 baht`,th:`240 บาท`}},{id:`C`,label:{en:`360 baht`,th:`360 บาท`}},{id:`D`,label:{en:`200 baht`,th:`200 บาท`}}],correctOptionId:`D`,explanation:{en:`Let Anna's amount be A. Bo = 1.2A. Cara = 0.5 × 1.2A = 0.6A. Total = A + 1.2A + 0.6A = 2.8A = 560, so A = 200 baht. (Check: Bo = 240, Cara = 120, and 200+240+120 = 560.)`,th:`ให้เงินของแอนนาเป็น A โบ = 1.2A คาร่า = 0.5 × 1.2A = 0.6A รวม = A + 1.2A + 0.6A = 2.8A = 560 ดังนั้น A = 200 บาท (ตรวจสอบ: โบ = 240, คาร่า = 120 และ 200+240+120 = 560)`},distractorNotes:{A:{en:`This reports Cara's amount (120 baht) instead of Anna's.`,th:`ตอบเงินของคาร่า (120 บาท) แทนที่จะเป็นของแอนนา`},B:{en:`This reports Bo's amount (240 baht) instead of Anna's.`,th:`ตอบเงินของโบ (240 บาท) แทนที่จะเป็นของแอนนา`},C:{en:`This reports the combined amount raised by Bo and Cara together (240 + 120 = 360 baht), confusing it with Anna's individual amount.`,th:`ตอบยอดรวมของโบและคาร่ารวมกัน (240 + 120 = 360 บาท) โดยสับสนกับเงินของแอนนาคนเดียว`}},hints:[{en:`Let A stand for the amount Anna raised, and write Bo and Cara's amounts in terms of A.`,th:`ให้ A แทนเงินที่แอนนาขายได้ แล้วเขียนเงินของโบและคาร่าในรูปของ A`},{en:`Bo = 1.2A (20% more than Anna). Cara = half of Bo, so Cara = 0.6A.`,th:`โบ = 1.2A (มากกว่าแอนนา 20%) คาร่า = ครึ่งหนึ่งของโบ ดังนั้นคาร่า = 0.6A`},{en:`Add all three in terms of A: A + 1.2A + 0.6A = 2.8A = 560. Solve for A.`,th:`บวกทั้งสามคนในรูปของ A: A + 1.2A + 0.6A = 2.8A = 560 แก้หาค่า A`}],visual:null,estimatedSeconds:150}]},{id:`stw-mock-d`,title:{en:`Mock Test D`,th:`ข้อสอบชุด D`},subtitle:{en:`Science Fair & Garden Club Paper`,th:`ชุดวิทยาศาสตร์และชมรมสวน`},recommendedMinutes:40,questions:[{id:`D-01`,testId:`stw-mock-d`,number:1,skill:`Number & Operations`,topic:{en:`Smallest Number with a Divisibility Rule`,th:`จำนวนที่น้อยที่สุดตามเงื่อนไขการหารลงตัว`},difficulty:F(1),prompt:{en:`For the school science fair, entry certificates are numbered using each of the digits 2, 3, 5, 6, and 8 exactly once. Fah wants the certificate number to be the smallest possible 5-digit number that is also a multiple of 5. What number should she use?`,th:`สำหรับใบประกาศงานวิทยาศาสตร์ประจำโรงเรียน หมายเลขใบประกาศใช้ตัวเลข 2, 3, 5, 6 และ 8 แต่ละตัวเพียงครั้งเดียว ฟ้าต้องการให้หมายเลขใบประกาศเป็นจำนวน 5 หลักที่น้อยที่สุด และเป็นจำนวนที่หารด้วย 5 ลงตัวด้วย เธอควรใช้หมายเลขใด`},options:[{id:`A`,label:{en:`23,568`,th:`23,568`}},{id:`B`,label:{en:`25,368`,th:`25,368`}},{id:`C`,label:{en:`23,685`,th:`23,685`}},{id:`D`,label:{en:`86,532`,th:`86,532`}}],correctOptionId:`C`,explanation:{en:`A number is a multiple of 5 only if its last digit is 0 or 5. Since 0 is not in the set, the last digit must be 5. To make the number as small as possible, arrange the remaining digits 2, 3, 6, 8 from smallest to largest in front: 2368, giving 23,685.`,th:`จำนวนที่หารด้วย 5 ลงตัวต้องมีหลักหน่วยเป็น 0 หรือ 5 เท่านั้น เนื่องจากไม่มี 0 อยู่ในชุดตัวเลข หลักหน่วยจึงต้องเป็น 5 เพื่อให้จำนวนน้อยที่สุด ให้เรียงตัวเลขที่เหลือ 2, 3, 6, 8 จากน้อยไปมากไว้ข้างหน้า คือ 2368 จึงได้ 23,685`},distractorNotes:{A:{en:`This is the smallest arrangement of all five digits sorted ascending (2,3,5,6,8), but it ends in 8, which does not satisfy the "multiple of 5" condition.`,th:`ข้อนี้เป็นการเรียงตัวเลขทั้งห้าตัวจากน้อยไปมาก (2, 3, 5, 6, 8) แต่ลงท้ายด้วย 8 ซึ่งไม่ตรงกับเงื่อนไข "หารด้วย 5 ลงตัว"`},B:{en:`This places 5 in the second position instead of last, so the number does not end in a digit that makes it a multiple of 5.`,th:`ข้อนี้วางเลข 5 ไว้ในหลักที่สองแทนที่จะเป็นหลักสุดท้าย ทำให้จำนวนนี้ไม่ได้หารด้วย 5 ลงตัว`},D:{en:`This sorts the digits from largest to smallest (86,532), building the largest possible number instead of the smallest, and it also fails the divisibility rule.`,th:`ข้อนี้เรียงตัวเลขจากมากไปน้อย (86,532) ซึ่งเป็นการสร้างจำนวนที่มากที่สุดแทนที่จะเป็นน้อยที่สุด และยังไม่ผ่านเงื่อนไขการหารด้วย 5 ลงตัวด้วย`}},hints:[{en:`Think about which digit must go in the ones place for the number to be a multiple of 5.`,th:`ลองคิดว่าหลักหน่วยต้องเป็นเลขอะไร จำนวนนี้ถึงจะหารด้วย 5 ลงตัว`},{en:`A number is divisible by 5 only if it ends in 0 or 5 — check which of those digits is actually in the set.`,th:`จำนวนที่หารด้วย 5 ลงตัวต้องลงท้ายด้วย 0 หรือ 5 เท่านั้น ลองตรวจดูว่าตัวเลขชุดนี้มีตัวไหนบ้าง`},{en:`Since only 5 can be the last digit, place it there, then arrange the remaining four digits from smallest to largest in front of it.`,th:`เนื่องจากมีเพียง 5 เท่านั้นที่เป็นหลักหน่วยได้ ให้วางไว้ท้ายสุด แล้วเรียงตัวเลขที่เหลืออีกสี่ตัวจากน้อยไปมากไว้ข้างหน้า`}],visual:null,estimatedSeconds:55},{id:`D-02`,testId:`stw-mock-d`,number:2,skill:`Word Problems & Logic`,topic:{en:`Pricing Puzzle with Two Scenarios`,th:`โจทย์ปัญหาราคาสองสถานการณ์`},difficulty:F(2),prompt:{en:`Ing has just enough money to buy seed packets from the garden club stall at 12 baht each, with 24 baht left over. If the seed packets cost 18 baht each instead, she could buy exactly 6 fewer packets and would have no money left over. How much money does Ing have?`,th:`อิงมีเงินพอซื้อซองเมล็ดพันธุ์จากซุ้มชมรมสวนราคาซองละ 12 บาท ได้จำนวนหนึ่ง และเหลือเงิน 24 บาท แต่ถ้าซองเมล็ดพันธุ์ราคาซองละ 18 บาท เธอจะซื้อได้น้อยกว่าเดิม 6 ซองพอดี และใช้เงินหมดพอดีไม่มีเหลือ อิงมีเงินทั้งหมดเท่าไร`},options:[{id:`A`,label:{en:`288 baht`,th:`288 บาท`}},{id:`B`,label:{en:`216 baht`,th:`216 บาท`}},{id:`C`,label:{en:`264 baht`,th:`264 บาท`}},{id:`D`,label:{en:`312 baht`,th:`312 บาท`}}],correctOptionId:`A`,explanation:{en:`Let n be the number of packets Ing can buy at 12 baht each. Her money = 12n + 24. At 18 baht each she buys (n − 6) packets with nothing left, so her money = 18(n − 6). Setting these equal: 12n + 24 = 18n − 108, so 6n = 132 and n = 22. Her money = 12(22) + 24 = 288 baht (check: 18 × 16 = 288).`,th:`ให้ n เป็นจำนวนซองที่อิงซื้อได้เมื่อราคาซองละ 12 บาท เงินของอิง = 12n + 24 เมื่อราคาซองละ 18 บาท เธอซื้อได้ (n − 6) ซองพอดีไม่มีเหลือ เงินของเธอ = 18(n − 6) ให้สองสมการเท่ากัน: 12n + 24 = 18n − 108 จะได้ 6n = 132 ดังนั้น n = 22 เงินของอิง = 12(22) + 24 = 288 บาท (ตรวจสอบ: 18 × 16 = 288 บาท)`},distractorNotes:{B:{en:`This solves 12n = 18(n−6) without adding the 24 baht left over, getting n = 18, then reports only 12 × 18 = 216, ignoring the leftover money.`,th:`ข้อนี้แก้สมการ 12n = 18(n−6) โดยลืมบวกเงิน 24 บาทที่เหลือ ได้ n = 18 แล้วตอบเพียง 12 × 18 = 216 โดยไม่รวมเงินที่เหลือ`},C:{en:`This finds the correct number of packets (n = 22) but reports only 12 × 22 = 264, forgetting to add the 24 baht that was left over.`,th:`ข้อนี้หาจำนวนซองได้ถูกต้อง (n = 22) แต่คำนวณเพียง 12 × 22 = 264 โดยลืมบวกเงิน 24 บาทที่เหลืออยู่เข้าไปด้วย`},D:{en:`This takes the correct answer (288) and mistakenly adds the 24 baht leftover a second time.`,th:`ข้อนี้นำคำตอบที่ถูกต้อง (288) มาบวกเงินที่เหลือ 24 บาทซ้ำเป็นครั้งที่สองโดยไม่ตั้งใจ`}},hints:[{en:`Try using a letter to stand for the number of packets in the first situation.`,th:`ลองตั้งตัวแปรแทนจำนวนซองในสถานการณ์แรกดูสิ`},{en:`Write Ing's total money as an expression in both situations, then set the two expressions equal to each other.`,th:`เขียนเงินทั้งหมดของอิงเป็นสมการจากทั้งสองสถานการณ์ แล้วให้สมการทั้งสองมีค่าเท่ากัน`},{en:`If n is the number of packets at 12 baht, her money is 12n+24. At 18 baht she buys (n−6) packets exactly, so her money is 18(n−6). Solve for n, then find the money.`,th:`ถ้า n คือจำนวนซองตอนราคา 12 บาท เงินของเธอคือ 12n+24 ส่วนตอนราคา 18 บาท เธอซื้อได้ (n−6) ซองพอดี เงินของเธอคือ 18(n−6) แก้สมการหาค่า n แล้วจึงคำนวณเงินทั้งหมด`}],visual:null,estimatedSeconds:70},{id:`D-03`,testId:`stw-mock-d`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Unlike Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:F(3),prompt:{en:`Seven raised beds in the garden club plot are filled with soil to the following fractions of their capacity: \\frac{7}{8}, \\frac{5}{6}, \\frac{4}{5}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{9}. Which fraction shows the 5th largest amount filled?`,th:`แปลงยกพื้นทั้งเจ็ดแปลงของชมรมสวนถูกเติมดินเป็นเศษส่วนของความจุดังนี้ \\frac{7}{8}, \\frac{5}{6}, \\frac{4}{5}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{9} เศษส่วนใดแสดงปริมาณที่เติมมากเป็นอันดับที่ 5`},options:[{id:`A`,label:{en:`\\frac{4}{5}`,th:`\\frac{4}{5}`}},{id:`B`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`C`,label:{en:`\\frac{3}{4}`,th:`\\frac{3}{4}`}},{id:`D`,label:{en:`\\frac{7}{10}`,th:`\\frac{7}{10}`}}],correctOptionId:`D`,explanation:{en:`Convert all seven fractions to a common denominator of 360: \\frac{7}{8}=\\frac{315}{360}, \\frac{5}{6}=\\frac{300}{360}, \\frac{4}{5}=\\frac{288}{360}, \\frac{3}{4}=\\frac{270}{360}, \\frac{7}{10}=\\frac{252}{360}, \\frac{2}{3}=\\frac{240}{360}, \\frac{5}{9}=\\frac{200}{360}. Ranking from largest: \\frac{7}{8}, \\frac{5}{6}, \\frac{4}{5}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{9}. The 5th largest is \\frac{7}{10}.`,th:`แปลงเศษส่วนทั้งเจ็ดให้มีตัวส่วนร่วมเป็น 360 จะได้ \\frac{7}{8}=\\frac{315}{360}, \\frac{5}{6}=\\frac{300}{360}, \\frac{4}{5}=\\frac{288}{360}, \\frac{3}{4}=\\frac{270}{360}, \\frac{7}{10}=\\frac{252}{360}, \\frac{2}{3}=\\frac{240}{360}, \\frac{5}{9}=\\frac{200}{360} เรียงจากมากไปน้อยได้ \\frac{7}{8}, \\frac{5}{6}, \\frac{4}{5}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{9} ดังนั้นอันดับที่ 5 คือ \\frac{7}{10}`},distractorNotes:{A:{en:`\\frac{4}{5} is actually the 3rd largest, not the 5th — this comes from being two positions off in the ranking.`,th:`\\frac{4}{5} ที่จริงมีค่ามากเป็นอันดับ 3 ไม่ใช่อันดับ 5 ข้อนี้เกิดจากการนับลำดับผิดไปสองตำแหน่ง`},B:{en:`\\frac{2}{3} is the 6th largest, one rank below the correct answer — a likely mix-up between the 5th and 6th positions.`,th:`\\frac{2}{3} มีค่ามากเป็นอันดับ 6 ซึ่งต่ำกว่าคำตอบที่ถูกต้องหนึ่งอันดับ อาจเกิดจากการสับสนระหว่างอันดับ 5 กับอันดับ 6`},C:{en:`\\frac{3}{4} is the 4th largest, one rank above the correct answer.`,th:`\\frac{3}{4} มีค่ามากเป็นอันดับ 4 ซึ่งสูงกว่าคำตอบที่ถูกต้องหนึ่งอันดับ`}},hints:[{en:`You can't compare these fractions just by looking at them — they need a common denominator first.`,th:`ไม่สามารถเทียบเศษส่วนเหล่านี้ได้จากการมองเฉยๆ ต้องแปลงให้มีตัวส่วนร่วมก่อน`},{en:`Find a common denominator for all seven fractions (a number that 8, 6, 5, 4, 10, 3, and 9 all divide into).`,th:`หาตัวส่วนร่วมของเศษส่วนทั้งเจ็ด (จำนวนที่ 8, 6, 5, 4, 10, 3 และ 9 หารลงตัวทุกตัว)`},{en:`Convert each fraction to a denominator of 360, then rank them from largest to smallest and count to the 5th one.`,th:`แปลงเศษส่วนแต่ละตัวให้มีตัวส่วนเป็น 360 แล้วเรียงจากมากไปน้อย จากนั้นนับไปถึงอันดับที่ 5`}],visual:null,estimatedSeconds:65},{id:`D-04`,testId:`stw-mock-d`,number:4,skill:`Number & Operations`,topic:{en:`Nested Expressions with Fractions and Brackets`,th:`นิพจน์ซ้อนที่มีเศษส่วนและวงเล็บ`},difficulty:F(4),prompt:{en:`Fah is checking two calibration values for the science fair pH sensor. Let A = (\\frac{3}{5} + \\frac{1}{10}) × 5 - \\frac{1}{2} and B = (6 - 4\\frac{1}{2}) ÷ \\frac{1}{4}. What is 2 × (A ÷ B)?`,th:`ฟ้ากำลังตรวจค่าปรับเทียบสองค่าของเครื่องวัดค่า pH สำหรับงานวิทยาศาสตร์ กำหนดให้ A = (\\frac{3}{5} + \\frac{1}{10}) × 5 - \\frac{1}{2} และ B = (6 - 4\\frac{1}{2}) ÷ \\frac{1}{4} จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`\\frac{1}{2}`,th:`\\frac{1}{2}`}},{id:`B`,label:{en:`1`,th:`1`}},{id:`C`,label:{en:`\\frac{3}{4}`,th:`\\frac{3}{4}`}},{id:`D`,label:{en:`4`,th:`4`}}],correctOptionId:`B`,explanation:{en:`A = (\\frac{3}{5}+\\frac{1}{10}) × 5 - \\frac{1}{2} = \\frac{7}{10} × 5 - \\frac{1}{2} = \\frac{7}{2} - \\frac{1}{2} = 3. B = (6 - 4\\frac{1}{2}) ÷ \\frac{1}{4} = 1\\frac{1}{2} × 4 = 6. So 2 × (A ÷ B) = 2 × \\frac{3}{6} = 1.`,th:`A = (\\frac{3}{5}+\\frac{1}{10}) × 5 - \\frac{1}{2} = \\frac{7}{10} × 5 - \\frac{1}{2} = \\frac{7}{2} - \\frac{1}{2} = 3 และ B = (6 - 4\\frac{1}{2}) ÷ \\frac{1}{4} = 1\\frac{1}{2} × 4 = 6 ดังนั้น 2 × (A ÷ B) = 2 × \\frac{3}{6} = 1`},distractorNotes:{A:{en:`Correctly finds A ÷ B = \\frac{3}{6} = \\frac{1}{2} but forgets to multiply the final result by 2.`,th:`หาค่า A ÷ B = \\frac{3}{6} = \\frac{1}{2} ได้ถูกต้อง แต่ลืมคูณผลลัพธ์ด้วย 2 ในขั้นสุดท้าย`},C:{en:`Miscalculates B by treating "6 − 4\\frac{1}{2}" as simply 6 − 4 = 2 (ignoring the extra half), giving B = 8 instead of 6, so 2 × (3÷8) = \\frac{3}{4}.`,th:`คำนวณ B ผิดพลาด โดยคิดว่า "6 − 4\\frac{1}{2}" เท่ากับ 6 − 4 = 2 เฉยๆ (ลืมครึ่งที่เหลือ) ทำให้ได้ B = 8 แทนที่จะเป็น 6 จึงได้ 2 × (3÷8) = \\frac{3}{4}`},D:{en:`Swaps which value is divided by which, computing 2 × (B ÷ A) = 2 × (6÷3) = 4 instead of 2 × (A ÷ B).`,th:`สลับลำดับการหารผิด โดยคำนวณ 2 × (B ÷ A) = 2 × (6÷3) = 4 แทนที่จะเป็น 2 × (A ÷ B)`}},hints:[{en:`Work out the value of A first, then B, before combining them.`,th:`หาค่าของ A ก่อน จากนั้นหาค่าของ B แล้วจึงนำมารวมกัน`},{en:`Follow the order of operations carefully inside each bracket — do the addition or subtraction inside the parentheses first.`,th:`ทำตามลำดับการดำเนินการอย่างระมัดระวังในแต่ละวงเล็บ โดยบวกลบภายในวงเล็บก่อน`},{en:`A equals 3 and B equals 6. Divide A by B first to get a fraction, then multiply that fraction by 2.`,th:`A มีค่าเท่ากับ 3 และ B มีค่าเท่ากับ 6 ให้นำ A หารด้วย B ก่อนเพื่อให้ได้เศษส่วน แล้วจึงนำเศษส่วนนั้นไปคูณด้วย 2`}],visual:null,estimatedSeconds:75},{id:`D-05`,testId:`stw-mock-d`,number:5,skill:`Number & Operations`,topic:{en:`LCM and GCF from a Division Clue`,th:`ค.ร.น. และ ห.ร.ม. จากเงื่อนไขการหาร`},difficulty:F(5),prompt:{en:`During seed inventory, the garden club counted seeds in two labeled trays. The two counts add up to 45. When the larger count is divided by the smaller count, the quotient is 3 and the remainder is 5. Find the LCM of the two counts.`,th:`ระหว่างการนับสต๊อกเมล็ดพันธุ์ ชมรมสวนนับเมล็ดในถาดที่ติดฉลากไว้สองถาด ผลรวมของสองจำนวนนี้เท่ากับ 45 เมื่อนำจำนวนที่มากกว่าไปหารด้วยจำนวนที่น้อยกว่า จะได้ผลหาร 3 เศษ 5 จงหา ค.ร.น. ของจำนวนทั้งสอง`},options:[{id:`A`,label:{en:`5`,th:`5`}},{id:`B`,label:{en:`350`,th:`350`}},{id:`C`,label:{en:`70`,th:`70`}},{id:`D`,label:{en:`35`,th:`35`}}],correctOptionId:`C`,explanation:{en:`Let the smaller count be x. The larger count is 3x + 5. Since x + (3x+5) = 45, 4x = 40, so x = 10 and the larger count is 35. The GCF of 10 and 35 is 5, so the LCM = (10 × 35) ÷ 5 = 70.`,th:`ให้จำนวนที่น้อยกว่าคือ x จำนวนที่มากกว่าคือ 3x + 5 เนื่องจาก x + (3x+5) = 45 จะได้ 4x = 40 ดังนั้น x = 10 และจำนวนที่มากกว่าคือ 35 ห.ร.ม. ของ 10 และ 35 คือ 5 ดังนั้น ค.ร.น. = (10 × 35) ÷ 5 = 70`},distractorNotes:{A:{en:`Gives the GCF (greatest common factor) of the two counts instead of the LCM that was asked for.`,th:`ตอบเป็น ห.ร.ม. (ตัวหารร่วมมาก) ของจำนวนทั้งสอง แทนที่จะเป็น ค.ร.น. ตามที่โจทย์ถาม`},B:{en:`Multiplies the two counts together (10 × 35 = 350) but forgets to divide by their GCF to get the true LCM.`,th:`นำจำนวนทั้งสองมาคูณกันตรงๆ (10 × 35 = 350) แต่ลืมนำไปหารด้วย ห.ร.ม. เพื่อให้ได้ ค.ร.น. ที่ถูกต้อง`},D:{en:`Simply reports the larger of the two counts (35), misreading what the question is asking for.`,th:`ตอบเพียงจำนวนที่มากกว่าของทั้งสอง (35) ซึ่งเป็นการอ่านโจทย์ผิดพลาดว่าต้องการอะไร`}},hints:[{en:`Turn "divided by the smaller gives quotient 3, remainder 5" into an equation for the larger count.`,th:`เปลี่ยนประโยค "หารด้วยจำนวนที่น้อยกว่าได้ผลหาร 3 เศษ 5" ให้เป็นสมการของจำนวนที่มากกว่า`},{en:`If the smaller count is x, the larger count is 3x + 5. Use the sum 45 to solve for x.`,th:`ถ้าจำนวนที่น้อยกว่าคือ x จำนวนที่มากกว่าจะเป็น 3x + 5 ใช้ผลบวก 45 ในการหาค่า x`},{en:`Once you find both counts (10 and 35), find their GCF, then use LCM × GCF = product of the two counts to find the LCM.`,th:`เมื่อหาจำนวนทั้งสองได้แล้ว (10 และ 35) ให้หา ห.ร.ม. ก่อน แล้วใช้ความสัมพันธ์ ค.ร.น. × ห.ร.ม. = ผลคูณของจำนวนทั้งสอง เพื่อหา ค.ร.น.`}],visual:null,estimatedSeconds:70},{id:`D-06`,testId:`stw-mock-d`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Cross-Shaped Pattern`,th:`แบบรูปกากบาทที่ขยายขึ้น`},difficulty:F(6),prompt:{en:`The garden club is expanding a cross-shaped flower bed by adding tiles one arm-length at a time. Figure 1 (arm length 1) uses 5 tiles: 1 center tile plus 1 tile extending in each of the four directions. Figure 2 (arm length 2) uses 9 tiles. Figure 3 uses 13 tiles. Figure 4, shown below (arm length 4), uses 17 tiles. If the pattern continues in the same way, how many tiles will Figure 15 use?`,th:`ชมรมสวนกำลังขยายแปลงดอกไม้รูปกากบาทโดยเพิ่มกระเบื้องทีละหนึ่งช่วงแขน รูปที่ 1 (แขนยาว 1 ช่อง) ใช้กระเบื้อง 5 แผ่น คือ 1 แผ่นตรงกลางบวกกับ 1 แผ่นในแต่ละทิศทางทั้งสี่ทิศ รูปที่ 2 (แขนยาว 2 ช่อง) ใช้ 9 แผ่น รูปที่ 3 ใช้ 13 แผ่น และรูปที่ 4 ที่แสดงไว้ (แขนยาว 4 ช่อง) ใช้ 17 แผ่น ถ้าแบบรูปนี้ดำเนินต่อไปในลักษณะเดียวกัน รูปที่ 15 จะใช้กระเบื้องกี่แผ่น`},options:[{id:`A`,label:{en:`61`,th:`61`}},{id:`B`,label:{en:`57`,th:`57`}},{id:`C`,label:{en:`60`,th:`60`}},{id:`D`,label:{en:`65`,th:`65`}}],correctOptionId:`A`,explanation:{en:`Each figure has 1 center tile plus 4 arms of length n, giving the formula 4n + 1 tiles (Figure 1: 4(1)+1=5, Figure 2: 4(2)+1=9, Figure 4: 4(4)+1=17, matching the picture). For Figure 15: 4(15) + 1 = 61.`,th:`แต่ละรูปมี 1 แผ่นตรงกลางบวกกับ 4 แขนที่มีความยาว n ช่อง ได้สูตร 4n + 1 แผ่น (รูปที่ 1: 4(1)+1=5, รูปที่ 2: 4(2)+1=9, รูปที่ 4: 4(4)+1=17 ตรงกับภาพ) สำหรับรูปที่ 15: 4(15) + 1 = 61`},distractorNotes:{B:{en:`This is an off-by-one error: it calculates the tile count for Figure 14 (4×14+1=57) instead of Figure 15.`,th:`เป็นความผิดพลาดเลื่อนอันดับไปหนึ่ง คำนวณจำนวนกระเบื้องของรูปที่ 14 (4×14+1=57) แทนที่จะเป็นรูปที่ 15`},C:{en:`This forgets to add the center tile in the formula, computing only 4 × 15 = 60 instead of 4(15) + 1.`,th:`ลืมบวกแผ่นตรงกลางในสูตร คำนวณเพียง 4 × 15 = 60 แทนที่จะเป็น 4(15) + 1`},D:{en:`This is an off-by-one error in the other direction: it calculates the tile count for Figure 16 (4×16+1=65) instead of Figure 15.`,th:`เป็นความผิดพลาดเลื่อนอันดับไปอีกทิศทางหนึ่ง คำนวณจำนวนกระเบื้องของรูปที่ 16 (4×16+1=65) แทนที่จะเป็นรูปที่ 15`}},hints:[{en:`Count how many tiles are added to go from one figure to the next.`,th:`นับดูว่ากระเบื้องเพิ่มขึ้นกี่แผ่นเมื่อเลื่อนจากรูปหนึ่งไปอีกรูปหนึ่ง`},{en:`Each figure has exactly one center tile plus four equal arms — write the total as an expression using the arm length n.`,th:`แต่ละรูปมีแผ่นตรงกลางเพียงหนึ่งแผ่นบวกกับสี่แขนที่ยาวเท่ากัน ลองเขียนจำนวนรวมเป็นนิพจน์โดยใช้ความยาวแขน n`},{en:`Use the formula 4n + 1 with n = 15 to find the tile count for Figure 15.`,th:`ใช้สูตร 4n + 1 โดยแทน n = 15 เพื่อหาจำนวนกระเบื้องของรูปที่ 15`}],visual:{kind:`gridPattern`,gridSize:9,cells:[{row:4,col:4},{row:0,col:4},{row:1,col:4},{row:2,col:4},{row:3,col:4},{row:5,col:4},{row:6,col:4},{row:7,col:4},{row:8,col:4},{row:4,col:0},{row:4,col:1},{row:4,col:2},{row:4,col:3},{row:4,col:5},{row:4,col:6},{row:4,col:7},{row:4,col:8}],alt:{en:`A cross-shaped pattern of shaded tiles: Figure 4 with 17 shaded cells forming a plus sign, one center tile and four arms of length 4 extending up, down, left, and right.`,th:`แบบรูปกากบาทของแผ่นกระเบื้องที่แรเงา: รูปที่ 4 มี 17 ช่องแรเงาเรียงเป็นรูปกากบาท มีแผ่นตรงกลางหนึ่งแผ่นและแขนสี่ด้านยาวด้านละ 4 ช่อง ยื่นขึ้น ลง ซ้าย และขวา`}},estimatedSeconds:85},{id:`D-07`,testId:`stw-mock-d`,number:7,skill:`Word Problems & Logic`,topic:{en:`Meeting on a Circular Track`,th:`การพบกันบนลู่วิ่งวงกลม`},difficulty:F(7),prompt:{en:`For the robotics display at the science fair, two toy robots start from the same point on a circular track and move in opposite directions. Robot A moves at 85 cm/s and Robot B moves at 115 cm/s. They meet for the first time after 4 seconds. What is the length of the track?`,th:`สำหรับการสาธิตหุ่นยนต์ในงานวิทยาศาสตร์ หุ่นยนต์ของเล่นสองตัวออกตัวจากจุดเดียวกันบนลู่วิ่งวงกลม แล้ววิ่งสวนทางกัน หุ่นยนต์ A วิ่งด้วยความเร็ว 85 เซนติเมตร/วินาที และหุ่นยนต์ B วิ่งด้วยความเร็ว 115 เซนติเมตร/วินาที ทั้งสองพบกันครั้งแรกหลังจากผ่านไป 4 วินาที ลู่วิ่งวงกลมนี้ยาวเท่าใด`},options:[{id:`A`,label:{en:`340 cm`,th:`340 เซนติเมตร`}},{id:`B`,label:{en:`460 cm`,th:`460 เซนติเมตร`}},{id:`C`,label:{en:`120 cm`,th:`120 เซนติเมตร`}},{id:`D`,label:{en:`800 cm`,th:`800 เซนติเมตร`}}],correctOptionId:`D`,explanation:{en:`Since the robots move in opposite directions from the same point, the distance between them grows at the combined speed of 85 + 115 = 200 cm/s. They meet once this combined distance equals the full track length, so the track length = 200 × 4 = 800 cm.`,th:`เนื่องจากหุ่นยนต์ทั้งสองออกจากจุดเดียวกันและวิ่งสวนทางกัน ระยะห่างระหว่างทั้งสองจะเพิ่มขึ้นด้วยความเร็วรวม 85 + 115 = 200 เซนติเมตร/วินาที ทั้งสองจะพบกันเมื่อระยะห่างนี้เท่ากับความยาวลู่วิ่งเต็มรอบพอดี ดังนั้นความยาวลู่วิ่ง = 200 × 4 = 800 เซนติเมตร`},distractorNotes:{A:{en:`This reports only Robot A's distance traveled (85 × 4 = 340 cm) as if that alone were the track length.`,th:`ข้อนี้ตอบเพียงระยะทางที่หุ่นยนต์ A วิ่งได้ (85 × 4 = 340 เซนติเมตร) ราวกับว่านั่นคือความยาวลู่วิ่งทั้งหมด`},B:{en:`This reports only Robot B's distance traveled (115 × 4 = 460 cm) as if that alone were the track length.`,th:`ข้อนี้ตอบเพียงระยะทางที่หุ่นยนต์ B วิ่งได้ (115 × 4 = 460 เซนติเมตร) ราวกับว่านั่นคือความยาวลู่วิ่งทั้งหมด`},C:{en:`This subtracts the two speeds (115 − 85 = 30) as if the robots were moving in the same direction and one were catching up, giving 30 × 4 = 120 cm instead of adding the speeds.`,th:`ข้อนี้นำความเร็วทั้งสองมาลบกัน (115 − 85 = 30) ราวกับว่าหุ่นยนต์วิ่งไปทิศทางเดียวกันและตัวหนึ่งไล่ตามอีกตัว ได้ 30 × 4 = 120 เซนติเมตร แทนที่จะบวกความเร็วเข้าด้วยกัน`}},hints:[{en:`Think about how fast the gap between the two robots grows when they move toward opposite directions from the same start.`,th:`ลองคิดว่าระยะห่างระหว่างหุ่นยนต์ทั้งสองเพิ่มขึ้นเร็วแค่ไหน เมื่อวิ่งสวนทางกันจากจุดเริ่มต้นเดียวกัน`},{en:`Since they move in opposite directions, add the two speeds to get their combined (relative) speed.`,th:`เนื่องจากทั้งสองวิ่งสวนทางกัน ให้บวกความเร็วทั้งสองเข้าด้วยกันเพื่อหาความเร็วรวม (ความเร็วสัมพัทธ์)`},{en:`When they meet for the first time, the combined distance they have covered together equals one full lap. Multiply the combined speed by the time.`,th:`เมื่อพบกันครั้งแรก ระยะทางรวมที่ทั้งสองวิ่งได้จะเท่ากับความยาวลู่วิ่งหนึ่งรอบพอดี ให้นำความเร็วรวมคูณด้วยเวลา`}],visual:null,estimatedSeconds:90},{id:`D-08`,testId:`stw-mock-d`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing a Prize Fund by Ratio`,th:`การแบ่งเงินรางวัลตามอัตราส่วน`},difficulty:F(8),prompt:{en:`The science fair prize fund of 840 baht is shared between the Chemistry team and the Biology team in the ratio 7:5. The Biology team then spends \\frac{2}{5} of its share on new plant samples. How much money does the Biology team have left?`,th:`กองทุนรางวัลงานวิทยาศาสตร์ 840 บาท แบ่งให้ทีมเคมีและทีมชีววิทยาในอัตราส่วน 7:5 หลังจากนั้นทีมชีววิทยานำเงิน \\frac{2}{5} ของส่วนแบ่งไปซื้อตัวอย่างพืชใหม่ ทีมชีววิทยาจะเหลือเงินเท่าใด`},options:[{id:`A`,label:{en:`490 baht`,th:`490 บาท`}},{id:`B`,label:{en:`210 baht`,th:`210 บาท`}},{id:`C`,label:{en:`140 baht`,th:`140 บาท`}},{id:`D`,label:{en:`294 baht`,th:`294 บาท`}}],correctOptionId:`B`,explanation:{en:`The ratio 7:5 has 12 parts total, so each part = 840 ÷ 12 = 70 baht. The Biology team's share = 5 × 70 = 350 baht. Spending \\frac{2}{5} of it leaves \\frac{3}{5} remaining: \\frac{3}{5} × 350 = 210 baht.`,th:`อัตราส่วน 7:5 มีทั้งหมด 12 ส่วน ดังนั้นแต่ละส่วน = 840 ÷ 12 = 70 บาท ส่วนแบ่งของทีมชีววิทยา = 5 × 70 = 350 บาท เมื่อใช้ไป \\frac{2}{5} จะเหลือ \\frac{3}{5}: \\frac{3}{5} × 350 = 210 บาท`},distractorNotes:{A:{en:`This is the Chemistry team's share (7 × 70 = 490 baht), not the money left in the Biology team's share.`,th:`นี่คือส่วนแบ่งของทีมเคมี (7 × 70 = 490 บาท) ไม่ใช่เงินที่เหลือของทีมชีววิทยา`},C:{en:`This calculates how much the Biology team SPENT (\\frac{2}{5} × 350 = 140 baht) instead of how much is left over.`,th:`คำนวณเงินที่ทีมชีววิทยา "ใช้ไป" (\\frac{2}{5} × 350 = 140 บาท) แทนที่จะเป็นเงินที่เหลือ`},D:{en:`This inverts the ratio, treating Biology as getting \\frac{7}{12} of the total (840 × \\frac{7}{12} = 490) then spending \\frac{2}{5} of that... but instead mistakenly keeps \\frac{3}{5} of the swapped 490 share, giving 294.`,th:`สลับอัตราส่วนผิด โดยคิดว่าทีมชีววิทยาได้ \\frac{7}{12} ของทั้งหมด (840 × \\frac{7}{12} = 490) แล้วคงเหลือ \\frac{3}{5} ของส่วนแบ่งที่สลับผิดนี้ ได้ 294 บาท`}},hints:[{en:`Find the value of one part of the ratio first.`,th:`หาค่าของหนึ่งส่วนในอัตราส่วนก่อน`},{en:`Biology gets 5 parts out of 12 total parts. Find their full share before thinking about spending.`,th:`ทีมชีววิทยาได้ 5 ส่วนจากทั้งหมด 12 ส่วน หาส่วนแบ่งเต็มของทีมชีววิทยาก่อนคิดเรื่องการใช้จ่าย`},{en:`If two-fifths of the share is spent, three-fifths remains — multiply the Biology share by three-fifths.`,th:`ถ้าใช้ไปสองในห้าของส่วนแบ่งทีมชีววิทยา จะเหลือสามในห้า ให้นำส่วนแบ่งของทีมชีววิทยาคูณด้วยสามในห้า`}],visual:null,estimatedSeconds:85},{id:`D-09`,testId:`stw-mock-d`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel Lines and a Triangle`,th:`เส้นขนานกับรูปสามเหลี่ยม`},difficulty:F(9),prompt:{en:`In the greenhouse frame diagram, brace l₁ is parallel to brace l₂. Triangle ABC is formed by a diagonal support with vertex A on l₁, and vertices B and C on l₂. The marked angle between l₁ and AB is 48°, and angle BCA = 82°. Find the size of angle x = angle BAC.`,th:`จากภาพโครงเรือนกระจก คาน l₁ ขนานกับคาน l₂ รูปสามเหลี่ยม ABC เกิดจากคานทแยงมุมที่มีจุดยอด A อยู่บนคาน l₁ และจุดยอด B กับ C อยู่บนคาน l₂ มุมที่กำกับไว้ระหว่างคาน l₁ กับ AB มีขนาด 48° และมุม BCA = 82° จงหาขนาดของมุม x ซึ่งคือมุม BAC`},options:[{id:`A`,label:{en:`48°`,th:`48°`}},{id:`B`,label:{en:`82°`,th:`82°`}},{id:`C`,label:{en:`50°`,th:`50°`}},{id:`D`,label:{en:`130°`,th:`130°`}}],correctOptionId:`C`,explanation:{en:`Since l₁ is parallel to l₂, the marked 48° angle and angle ABC are corresponding angles, so angle ABC = 48°. In triangle ABC, the angles sum to 180°, so angle BAC = 180° − 48° − 82° = 50°.`,th:`เนื่องจาก l₁ ขนานกับ l₂ มุม 48° ที่กำกับไว้กับมุม ABC เป็นมุมภายในบทเดียวกัน (corresponding angles) ดังนั้นมุม ABC = 48° ในรูปสามเหลี่ยม ABC ผลรวมมุมภายในเท่ากับ 180° ดังนั้นมุม BAC = 180° − 48° − 82° = 50°`},distractorNotes:{A:{en:`This just copies the given 48° angle directly as the answer, without using the triangle angle sum to find angle BAC.`,th:`คัดลอกมุม 48° ที่โจทย์ให้มาเป็นคำตอบตรงๆ โดยไม่ได้ใช้ผลรวมมุมภายในสามเหลี่ยมหามุม BAC`},B:{en:`This just copies the given 82° angle directly, without using it inside the triangle angle sum.`,th:`คัดลอกมุม 82° ที่โจทย์ให้มาเป็นคำตอบตรงๆ โดยไม่ได้นำไปใช้ในผลรวมมุมภายในสามเหลี่ยม`},D:{en:`This adds the two given angles (48° + 82° = 130°) instead of subtracting their sum from 180°.`,th:`นำมุมสองมุมที่โจทย์ให้มาบวกกัน (48° + 82° = 130°) แทนที่จะนำผลรวมไปลบออกจาก 180°`}},hints:[{en:`The two parallel lines mean some angles around point A and point B are equal.`,th:`เส้นขนานสองเส้นทำให้มุมบางมุมรอบจุด A และจุด B มีขนาดเท่ากัน`},{en:`Use the fact that l₁ ∥ l₂ to find angle ABC first, using corresponding angles.`,th:`ใช้ข้อเท็จจริงที่ว่า l₁ ขนานกับ l₂ เพื่อหามุม ABC ก่อน โดยใช้มุมภายในบทเดียวกัน`},{en:`Once you know angle ABC = 48° and angle BCA = 82°, subtract their sum from 180° to get angle BAC.`,th:`เมื่อรู้ว่ามุม ABC = 48° และมุม BCA = 82° แล้ว ให้นำผลรวมไปลบออกจาก 180° เพื่อหามุม BAC`}],visual:{kind:`geometryFigure`,width:320,height:200,segments:[{x1:20,y1:30,x2:300,y2:30,ticks:1},{x1:20,y1:170,x2:300,y2:170,ticks:1},{x1:105,y1:30,x2:30,y2:170},{x1:105,y1:30,x2:168,y2:170}],points:[{x:105,y:30,label:`A`,labelOffset:[0,-12]},{x:30,y:170,label:`B`,labelOffset:[-14,16]},{x:168,y:170,label:`C`,labelOffset:[10,16]}],angleMarks:[{x:105,y:30,fromDeg:294,toDeg:360,radius:16,label:`48°`},{x:168,y:170,fromDeg:98,toDeg:180,radius:16,label:`82°`},{x:105,y:30,fromDeg:227,toDeg:294,radius:26,label:`x`,color:`var(--navy)`}],alt:{en:`Two parallel horizontal braces l1 and l2 with a triangle ABC; A is on l1, B and C are on l2. A 48° angle is marked between l1 and side AB, an 82° angle is marked at C, and angle x is marked at A between sides AB and AC.`,th:`คานขนานแนวนอนสองคาน l1 และ l2 พร้อมรูปสามเหลี่ยม ABC จุด A อยู่บน l1 จุด B และ C อยู่บน l2 มีมุม 48° กำกับระหว่าง l1 กับด้าน AB มุม 82° กำกับที่จุด C และมุม x กำกับที่จุด A ระหว่างด้าน AB กับ AC`}},estimatedSeconds:95},{id:`D-10`,testId:`stw-mock-d`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Equal-Volume Cylinders`,th:`ทรงกระบอกที่มีปริมาตรเท่ากัน`},difficulty:F(10),prompt:{en:`For the hydroponics display at the science fair, two cylindrical nutrient tanks hold equal volumes of solution. Tank A has a base radius of 3 cm and liquid height 20 cm. Tank B has a base radius of 6 cm. Find the height of the liquid in Tank B.`,th:`สำหรับนิทรรศการไฮโดรโปนิกส์ในงานวิทยาศาสตร์ ถังสารละลายธาตุอาหารทรงกระบอกสองถังบรรจุสารละลายปริมาตรเท่ากัน ถัง A มีรัศมีฐาน 3 เซนติเมตร และความสูงของสารละลาย 20 เซนติเมตร ถัง B มีรัศมีฐาน 6 เซนติเมตร ความสูงของสารละลายในถัง B เป็นเท่าใด`},options:[{id:`A`,label:{en:`5 cm`,th:`5 เซนติเมตร`}},{id:`B`,label:{en:`10 cm`,th:`10 เซนติเมตร`}},{id:`C`,label:{en:`20 cm`,th:`20 เซนติเมตร`}},{id:`D`,label:{en:`80 cm`,th:`80 เซนติเมตร`}}],correctOptionId:`A`,explanation:{en:`Volume = π × r² × h stays constant. For Tank A: r² × h = 3² × 20 = 180. For Tank B: 6² × h = 180, so 36 × h = 180, giving h = 5 cm.`,th:`ปริมาตร = π × r² × h มีค่าคงที่ สำหรับถัง A: r² × h = 3² × 20 = 180 สำหรับถัง B: 6² × h = 180 ดังนั้น 36 × h = 180 จะได้ h = 5 เซนติเมตร`},distractorNotes:{B:{en:`This uses a straight (linear) ratio of radii instead of squaring them: 20 × (3÷6) = 10.`,th:`ใช้อัตราส่วนของรัศมีแบบเชิงเส้นตรงๆ โดยไม่ยกกำลังสอง: 20 × (3÷6) = 10`},C:{en:`This assumes the height stays the same even though the base radius changed, which ignores how volume depends on radius squared.`,th:`สมมติว่าความสูงเท่าเดิมทั้งที่รัศมีฐานเปลี่ยนไป ซึ่งละเลยความสัมพันธ์ที่ปริมาตรขึ้นกับรัศมียกกำลังสอง`},D:{en:`This inverts the squared-radius ratio, computing 20 × (6÷3)² = 80 instead of dividing correctly.`,th:`สลับอัตราส่วนรัศมียกกำลังสองกลับด้าน คำนวณเป็น 20 × (6÷3)² = 80 แทนที่จะหารให้ถูกทิศทาง`}},hints:[{en:`The volume formula for a cylinder is π × radius² × height.`,th:`สูตรปริมาตรทรงกระบอกคือ π × รัศมี² × ความสูง`},{en:`Since both tanks hold equal volume, radius² × height must be equal for both — the π cancels out.`,th:`เนื่องจากถังทั้งสองมีปริมาตรเท่ากัน รัศมี² × ความสูง ของทั้งสองถังต้องเท่ากัน โดย π จะตัดกันไป`},{en:`Compute 3² × 20 for Tank A, then divide that by 6² to find Tank B's height.`,th:`คำนวณ 3² × 20 ของถัง A แล้วนำไปหารด้วย 6² เพื่อหาความสูงของถัง B`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:6,height:20,label:`Tank A`},{baseSide:12,height:5,heightLabel:`h`,label:`Tank B`}],alt:{en:`Two cylindrical nutrient tanks. Tank A has a narrower base and a taller liquid column. Tank B has a wider base and a height labeled h that must be found.`,th:`ถังสารละลายธาตุอาหารทรงกระบอกสองถัง ถัง A มีฐานแคบกว่าและมีระดับสารละลายสูงกว่า ถัง B มีฐานกว้างกว่าและมีความสูงกำกับด้วยตัวอักษร h ที่ต้องหาคำตอบ`}},estimatedSeconds:90},{id:`D-11`,testId:`stw-mock-d`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area of a Cut Rectangle`,th:`พื้นที่รูปประกอบจากสี่เหลี่ยมที่ถูกตัดมุม`},difficulty:F(11),prompt:{en:`A rectangular acrylic sheet for a science fair poster stand measures 22 cm by 16 cm. Two triangular corners are cut off to round the stand's shape, as shown: one with legs 7 cm and 4 cm, and another with legs 5 cm and 6 cm. Find the area of the remaining shaded stand.`,th:`แผ่นอะคริลิกรูปสี่เหลี่ยมผืนผ้าสำหรับขาตั้งป้ายนิทรรศการวิทยาศาสตร์มีขนาด 22 เซนติเมตร คูณ 16 เซนติเมตร มีการตัดมุมสามเหลี่ยมออกสองมุมเพื่อลบเหลี่ยมของขาตั้งดังภาพ มุมหนึ่งมีด้านประกอบมุมฉากยาว 7 และ 4 เซนติเมตร อีกมุมหนึ่งยาว 5 และ 6 เซนติเมตร จงหาพื้นที่ของขาตั้งส่วนที่แรเงาที่เหลืออยู่`},options:[{id:`A`,label:{en:`338 cm²`,th:`338 ตารางเซนติเมตร`}},{id:`B`,label:{en:`337 cm²`,th:`337 ตารางเซนติเมตร`}},{id:`C`,label:{en:`381 cm²`,th:`381 ตารางเซนติเมตร`}},{id:`D`,label:{en:`323 cm²`,th:`323 ตารางเซนติเมตร`}}],correctOptionId:`D`,explanation:{en:`The rectangle's area = 22 × 16 = 352 cm². The first triangle removed has area (7 × 4) ÷ 2 = 14 cm². The second has area (5 × 6) ÷ 2 = 15 cm². Shaded area = 352 − 14 − 15 = 323 cm².`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 22 × 16 = 352 ตารางเซนติเมตร สามเหลี่ยมแรกที่ตัดออกมีพื้นที่ (7 × 4) ÷ 2 = 14 ตารางเซนติเมตร สามเหลี่ยมที่สองมีพื้นที่ (5 × 6) ÷ 2 = 15 ตารางเซนติเมตร พื้นที่ส่วนที่แรเงา = 352 − 14 − 15 = 323 ตารางเซนติเมตร`},distractorNotes:{A:{en:`This only subtracts the 7×4 triangle (352 − 14 = 338) and forgets to also subtract the 5×6 triangle.`,th:`ลบออกเฉพาะสามเหลี่ยม 7×4 (352 − 14 = 338) และลืมลบสามเหลี่ยม 5×6 ออกด้วย`},B:{en:`This only subtracts the 5×6 triangle (352 − 15 = 337) and forgets to also subtract the 7×4 triangle.`,th:`ลบออกเฉพาะสามเหลี่ยม 5×6 (352 − 15 = 337) และลืมลบสามเหลี่ยม 7×4 ออกด้วย`},C:{en:`This adds the two triangle areas to the rectangle instead of subtracting them (352 + 14 + 15 = 381).`,th:`นำพื้นที่สามเหลี่ยมทั้งสองไปบวกกับพื้นที่สี่เหลี่ยมแทนที่จะลบออก (352 + 14 + 15 = 381)`}},hints:[{en:`Start by finding the full area of the original rectangle.`,th:`เริ่มจากหาพื้นที่ทั้งหมดของสี่เหลี่ยมผืนผ้าเดิมก่อน`},{en:`Each cut-off corner is a right triangle — its area is (leg × leg) ÷ 2.`,th:`มุมที่ถูกตัดออกแต่ละมุมเป็นรูปสามเหลี่ยมมุมฉาก พื้นที่คือ (ด้าน × ด้าน) ÷ 2`},{en:`Subtract BOTH triangle areas from the rectangle's area: 352 − 14 − 15.`,th:`ลบพื้นที่สามเหลี่ยมทั้งสองมุมออกจากพื้นที่สี่เหลี่ยม: 352 − 14 − 15`}],visual:{kind:`geometryFigure`,width:176,height:128,showGrid:!0,gridStep:8,polygons:[{points:[[56,0],[176,0],[176,80],[136,128],[0,128],[0,32]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:56,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:32,style:`dashed`},{x1:176,y1:128,x2:136,y2:128,style:`dashed`},{x1:176,y1:128,x2:176,y2:80,style:`dashed`}],labels:[{x:28,y:-10,text:`7`},{x:-12,y:18,text:`4`},{x:156,y:140,text:`5`},{x:190,y:104,text:`6`}],alt:{en:`A hexagonal poster-stand shape formed by cutting two triangular corners off a rectangle. The top-left corner is cut with legs 7 and 4; the bottom-right corner is cut with legs 5 and 6.`,th:`รูปหกเหลี่ยมของขาตั้งป้ายที่เกิดจากการตัดมุมสามเหลี่ยมออกสองมุมจากสี่เหลี่ยมผืนผ้า มุมบนซ้ายตัดด้วยด้าน 7 และ 4 มุมล่างขวาตัดด้วยด้าน 5 และ 6`}},estimatedSeconds:120},{id:`D-12`,testId:`stw-mock-d`,number:12,skill:`Geometry & Angles`,topic:{en:`Zigzag Angles Between Parallel Lines`,th:`มุมหักเหระหว่างเส้นขนาน`},difficulty:F(12),prompt:{en:`In the greenhouse roof frame, support beams l₁ and l₂ are parallel. A diagonal brace bends at point E between them, connecting to point A on l₁ and point D on l₂. The angle between l₁ and EA is (3x + 5)°, the angle between l₂ and ED is (2x + 15)°, and the bend angle AED is 120°. Find angle ADE, which equals (2x + 15)°.`,th:`ในโครงหลังคาโรงเรือน คาน l₁ และ l₂ ขนานกัน ค้ำยันทแยงมุมหักที่จุด E ระหว่างคานทั้งสอง เชื่อมกับจุด A บนคาน l₁ และจุด D บนคาน l₂ มุมระหว่างคาน l₁ กับ EA คือ (3x + 5)° มุมระหว่างคาน l₂ กับ ED คือ (2x + 15)° และมุม AED ที่จุดหักมีขนาด 120° จงหามุม ADE ซึ่งมีค่าเท่ากับ (2x + 15)°`},options:[{id:`A`,label:{en:`20°`,th:`20°`}},{id:`B`,label:{en:`55°`,th:`55°`}},{id:`C`,label:{en:`65°`,th:`65°`}},{id:`D`,label:{en:`35°`,th:`35°`}}],correctOptionId:`B`,explanation:{en:`Drawing a line through E parallel to l₁ and l₂ splits angle AED into two alternate angles equal to (3x+5)° and (2x+15)°. So (3x+5) + (2x+15) = 120, giving 5x + 20 = 120, so x = 20. Angle ADE = 2(20) + 15 = 55°.`,th:`ลากเส้นผ่านจุด E ขนานกับ l₁ และ l₂ จะแบ่งมุม AED ออกเป็นมุมแทรกที่เท่ากับ (3x+5)° และ (2x+15)° ดังนั้น (3x+5) + (2x+15) = 120 จะได้ 5x + 20 = 120 ดังนั้น x = 20 มุม ADE = 2(20) + 15 = 55°`},distractorNotes:{A:{en:`This reports the value of x (20) instead of substituting it into the expression (2x + 15)° to find angle ADE.`,th:`ตอบค่า x (20) โดยตรง แทนที่จะแทนค่ากลับในนิพจน์ (2x + 15)° เพื่อหามุม ADE`},C:{en:`This computes angle at A instead of angle ADE: (3x+5) at x=20 gives 65°, which is the wrong vertex.`,th:`คำนวณมุมที่จุด A แทนมุม ADE: (3x+5) เมื่อ x=20 ได้ 65° ซึ่งเป็นจุดยอดที่ผิด`},D:{en:`This wrongly sets the two expressions equal to each other (3x+5 = 2x+15) instead of summing them to 120, getting x = 10 and then 2(10)+15 = 35.`,th:`ตั้งสมการผิดโดยให้สองนิพจน์เท่ากัน (3x+5 = 2x+15) แทนที่จะบวกกันให้เท่ากับ 120 ได้ x = 10 แล้วคำนวณ 2(10)+15 = 35`}},hints:[{en:`Imagine a third line through E, drawn parallel to both l₁ and l₂.`,th:`ลองจินตนาการเส้นที่สามผ่านจุด E ที่ลากขนานกับทั้ง l₁ และ l₂`},{en:`That imaginary line splits the bend angle at E into two parts that equal the two given expressions.`,th:`เส้นสมมตินั้นจะแบ่งมุมหักที่จุด E ออกเป็นสองส่วนที่มีค่าเท่ากับสองนิพจน์ที่โจทย์ให้มา`},{en:`Set (3x+5) + (2x+15) = 120, solve for x, then substitute x back into (2x+15) to answer the question.`,th:`ตั้งสมการ (3x+5) + (2x+15) = 120 แก้หา x แล้วแทนค่า x กลับในนิพจน์ (2x+15) เพื่อตอบคำถาม`}],visual:{kind:`geometryFigure`,width:320,height:200,segments:[{x1:20,y1:30,x2:300,y2:30,ticks:1},{x1:20,y1:170,x2:300,y2:170,ticks:1},{x1:105,y1:30,x2:148,y2:125},{x1:148,y1:125,x2:120,y2:170}],points:[{x:105,y:30,label:`A`,labelOffset:[-6,-12]},{x:148,y:125,label:`E`,labelOffset:[14,-2]},{x:120,y:170,label:`D`,labelOffset:[-4,18]}],angleMarks:[{x:105,y:30,fromDeg:294,toDeg:360,radius:16,label:`(3x+5)°`},{x:120,y:170,fromDeg:0,toDeg:58,radius:16,label:`(2x+15)°`},{x:148,y:125,fromDeg:114,toDeg:238,radius:22,label:`120°`,color:`var(--navy)`}],alt:{en:`Two parallel horizontal roof beams l1 and l2 with a bent brace from point A on l1, through point E between the beams, to point D on l2. Angles are marked (3x+5) degrees at A, (2x+15) degrees at D, and 120 degrees at the bend E.`,th:`คานหลังคาขนานแนวนอนสองคาน l1 และ l2 พร้อมค้ำยันหักจากจุด A บน l1 ผ่านจุด E ระหว่างคานทั้งสอง ไปยังจุด D บน l2 มีมุมกำกับ (3x+5) องศาที่จุด A, (2x+15) องศาที่จุด D และ 120 องศาที่จุดหัก E`}},estimatedSeconds:130},{id:`D-13`,testId:`stw-mock-d`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Ring Area and Radius Ratio`,th:`พื้นที่วงแหวนกับอัตราส่วนรัศมี`},difficulty:F(13),prompt:{en:`A circular flower bed in the garden club plot has an inner planting circle and an outer mulch ring around it, sharing the same center. The area of the shaded mulch ring is exactly 8 times the area of the inner planting circle. Find the ratio of the outer radius to the inner radius.`,th:`แปลงดอกไม้ทรงกลมของชมรมสวนมีวงกลมปลูกด้านในและวงแหวนคลุมดินด้านนอกที่มีจุดศูนย์กลางร่วมกัน พื้นที่ของวงแหวนคลุมดินที่แรเงามีค่าเป็น 8 เท่าของพื้นที่วงกลมปลูกด้านใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`8:1`,th:`8:1`}},{id:`B`,label:{en:`9:1`,th:`9:1`}},{id:`C`,label:{en:`3:1`,th:`3:1`}},{id:`D`,label:{en:`1:3`,th:`1:3`}}],correctOptionId:`C`,explanation:{en:`Let r = inner radius and R = outer radius. Ring area = πR² − πr² = 8 × πr², so R² − r² = 8r², meaning R² = 9r². Taking the square root, R = 3r, so R:r = 3:1.`,th:`ให้ r = รัศมีวงใน และ R = รัศมีวงนอก พื้นที่วงแหวน = πR² − πr² = 8 × πr² ดังนั้น R² − r² = 8r² หมายความว่า R² = 9r² ถอดรากที่สองได้ R = 3r ดังนั้น R:r = 3:1`},distractorNotes:{A:{en:`This wrongly treats "8 times the area" as meaning the radius itself is 8 times as large, giving R:r = 8:1.`,th:`เข้าใจผิดว่า "พื้นที่เป็น 8 เท่า" หมายถึงรัศมีเองเป็น 8 เท่า จึงตอบ R:r = 8:1`},B:{en:`This correctly finds R²÷r² = 9 but forgets to take the square root, reporting 9:1 as if it were the radius ratio directly.`,th:`หา R²÷r² = 9 ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบ 9:1 ราวกับเป็นอัตราส่วนรัศมีโดยตรง`},D:{en:`This finds the correct relationship R = 3r but then states the ratio backwards as r:R instead of R:r.`,th:`หาความสัมพันธ์ R = 3r ได้ถูกต้อง แต่เขียนอัตราส่วนสลับด้านเป็น r:R แทนที่จะเป็น R:r`}},hints:[{en:`The ring area is the outer circle's area minus the inner circle's area.`,th:`พื้นที่วงแหวนคือพื้นที่วงกลมวงนอกลบด้วยพื้นที่วงกลมวงใน`},{en:`Write the equation πR² − πr² = 8πr² and simplify to relate R² and r².`,th:`เขียนสมการ πR² − πr² = 8πr² แล้วจัดรูปเพื่อหาความสัมพันธ์ระหว่าง R² และ r²`},{en:`You should reach R² = 9r². Take the square root of both sides to find R:r.`,th:`ควรได้สมการ R² = 9r² ถอดรากที่สองทั้งสองข้างเพื่อหา R:r`}],visual:{kind:`concentricCircles`,outerRadius:3,innerRadius:1,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles forming a flower bed with a shaded mulch ring between the outer circle (radius R) and the inner planting circle (radius r).`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกันเป็นแปลงดอกไม้ มีวงแหวนคลุมดินแรเงาอยู่ระหว่างวงกลมวงนอก (รัศมี R) กับวงกลมปลูกด้านใน (รัศมี r)`}},estimatedSeconds:110},{id:`D-14`,testId:`stw-mock-d`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Leaf-Shaped Area from Overlapping Arcs`,th:`พื้นที่รูปใบไม้จากส่วนโค้งซ้อนทับ`},difficulty:F(14),prompt:{en:`A leaf-shaped flower bed is planned inside a square garden plot with side length 28 m. Two quarter-circle arcs, each with radius equal to the side of the square, are drawn from opposite corners, and the leaf shape is the shaded region where the two arcs overlap. Find the area of the leaf-shaped flower bed. (Use π = 22/7.)`,th:`แปลงดอกไม้รูปใบไม้ถูกวางแผนไว้ภายในแปลงสวนรูปสี่เหลี่ยมจัตุรัสที่มีความยาวด้าน 28 เมตร มีการลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้น แต่ละเส้นมีรัศมีเท่ากับความยาวด้านของสี่เหลี่ยม จากมุมตรงข้ามกัน และรูปใบไม้คือบริเวณที่แรเงาซึ่งส่วนโค้งทั้งสองซ้อนทับกัน จงหาพื้นที่ของแปลงดอกไม้รูปใบไม้ (กำหนดให้ π = 22/7)`},options:[{id:`A`,label:{en:`448 m²`,th:`448 ตารางเมตร`}},{id:`B`,label:{en:`1,232 m²`,th:`1,232 ตารางเมตร`}},{id:`C`,label:{en:`616 m²`,th:`616 ตารางเมตร`}},{id:`D`,label:{en:`168 m²`,th:`168 ตารางเมตร`}}],correctOptionId:`A`,explanation:{en:`Each quarter circle has area = \\frac{1}{4} × π × 28² = \\frac{1}{4} × 22/7 × 784 = 616 m². Two quarter circles together = 1,232 m². This double-counts the square exactly once, so the leaf area = 1,232 − 784 = 448 m² (the square's area, 28² = 784, is subtracted once).`,th:`พื้นที่หนึ่งในสี่วงกลมแต่ละอัน = \\frac{1}{4} × π × 28² = \\frac{1}{4} × 22/7 × 784 = 616 ตารางเมตร สองอันรวมกัน = 1,232 ตารางเมตร ซึ่งนับพื้นที่สี่เหลี่ยมซ้ำไปหนึ่งครั้งพอดี ดังนั้นพื้นที่ใบไม้ = 1,232 − 784 = 448 ตารางเมตร (ลบพื้นที่สี่เหลี่ยม 28² = 784 ออกหนึ่งครั้ง)`},distractorNotes:{B:{en:`This adds the two quarter-circle areas (616 + 616 = 1,232) but forgets to subtract the square's area to remove the double-counted region.`,th:`นำพื้นที่หนึ่งในสี่วงกลมสองอันมาบวกกัน (616 + 616 = 1,232) แต่ลืมลบพื้นที่สี่เหลี่ยมที่ถูกนับซ้ำออก`},C:{en:`This only calculates the area of ONE quarter circle (616 m²) and forgets the shape is formed from two overlapping arcs.`,th:`คำนวณพื้นที่หนึ่งในสี่วงกลมเพียงอันเดียว (616 ตารางเมตร) และลืมว่ารูปทรงนี้เกิดจากส่วนโค้งสองอันซ้อนทับกัน`},D:{en:`This subtracts one quarter-circle area from the square (784 − 616 = 168), which describes a different shape, not the overlapping leaf region.`,th:`นำพื้นที่หนึ่งในสี่วงกลมไปลบออกจากสี่เหลี่ยม (784 − 616 = 168) ซึ่งเป็นรูปทรงคนละแบบ ไม่ใช่บริเวณใบไม้ที่ซ้อนทับกัน`}},hints:[{en:`The leaf shape is where two quarter circles, drawn from opposite corners, overlap each other.`,th:`รูปใบไม้คือบริเวณที่ส่วนโค้งหนึ่งในสี่วงกลมสองอันจากมุมตรงข้ามซ้อนทับกัน`},{en:`Find the area of one quarter circle first, then think about what happens when you add two of them together over the square.`,th:`หาพื้นที่หนึ่งในสี่วงกลมอันเดียวก่อน แล้วคิดว่าจะเกิดอะไรขึ้นเมื่อนำสองอันมารวมกันบนสี่เหลี่ยม`},{en:`Leaf area = (2 × quarter-circle area) − square area = 1,232 − 784.`,th:`พื้นที่ใบไม้ = (2 × พื้นที่หนึ่งในสี่วงกลม) − พื้นที่สี่เหลี่ยม = 1,232 − 784`}],visual:{kind:`leafShape`,width:90,height:90,corners:`topLeft-bottomRight`,sideLabel:`28 m`,alt:{en:`A square garden plot with two quarter-circle arcs drawn from the top-left and bottom-right corners, overlapping to form a shaded leaf-shaped flower bed in the middle.`,th:`แปลงสวนรูปสี่เหลี่ยมจัตุรัสที่มีส่วนโค้งหนึ่งในสี่วงกลมสองเส้นลากจากมุมบนซ้ายและมุมล่างขวา ซ้อนทับกันเกิดเป็นแปลงดอกไม้รูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:120},{id:`D-15`,testId:`stw-mock-d`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Remainder`,th:`เศษส่วนของส่วนที่เหลือ`},difficulty:F(15),prompt:{en:`A container holds 96 mL of solution for a chemistry demonstration. In Round 1, \\frac{5}{12} of the solution was used. In Round 2, \\frac{3}{8} of the REMAINING solution was used. What is the difference between the amounts of solution used in Round 1 and Round 2?`,th:`ภาชนะบรรจุสารละลาย 96 มิลลิลิตรสำหรับสาธิตการทดลองเคมี รอบที่ 1 ใช้สารละลายไป \\frac{5}{12} ของทั้งหมด รอบที่ 2 ใช้สารละลายที่ "เหลืออยู่" ไปอีก \\frac{3}{8} ผลต่างระหว่างปริมาณสารละลายที่ใช้ในรอบที่ 1 และรอบที่ 2 เป็นเท่าใด`},options:[{id:`A`,label:{en:`35 mL`,th:`35 มิลลิลิตร`}},{id:`B`,label:{en:`4 mL`,th:`4 มิลลิลิตร`}},{id:`C`,label:{en:`61 mL`,th:`61 มิลลิลิตร`}},{id:`D`,label:{en:`19 mL`,th:`19 มิลลิลิตร`}}],correctOptionId:`D`,explanation:{en:`Round 1 use = \\frac{5}{12} × 96 = 40 mL, leaving 96 − 40 = 56 mL. Round 2 use = \\frac{3}{8} × 56 = 21 mL. The difference between the two amounts used = 40 − 21 = 19 mL.`,th:`ปริมาณที่ใช้ในรอบที่ 1 = \\frac{5}{12} × 96 = 40 มิลลิลิตร เหลือ 96 − 40 = 56 มิลลิลิตร ปริมาณที่ใช้ในรอบที่ 2 = \\frac{3}{8} × 56 = 21 มิลลิลิตร ผลต่างระหว่างปริมาณที่ใช้ทั้งสองรอบ = 40 − 21 = 19 มิลลิลิตร`},distractorNotes:{A:{en:`This reports the solution left over AFTER both rounds (56 − 21 = 35 mL), confusing "leftover" with "difference between the two amounts used".`,th:`ข้อนี้ตอบปริมาณสารละลายที่เหลืออยู่ "หลังจากทั้งสองรอบ" (56 − 21 = 35 มิลลิลิตร) โดยสับสนระหว่าง "ปริมาณที่เหลือ" กับ "ผลต่างของปริมาณที่ใช้ทั้งสองรอบ"`},B:{en:`This incorrectly applies \\frac{3}{8} to the ORIGINAL 96 mL instead of the remaining 56 mL, getting a Round 2 use of 36 mL, then computes 40 − 36 = 4.`,th:`ใช้ \\frac{3}{8} กับปริมาณเดิม 96 มิลลิลิตร แทนที่จะใช้กับ 56 มิลลิลิตรที่เหลือ ทำให้ได้ปริมาณรอบที่ 2 เป็น 36 มิลลิลิตร แล้วคำนวณ 40 − 36 = 4 ซึ่งผิด`},C:{en:`This adds the two amounts used instead of finding the difference between them (40 + 21 = 61).`,th:`นำปริมาณที่ใช้ทั้งสองรอบมาบวกกันแทนที่จะหาผลต่างระหว่างกัน (40 + 21 = 61)`}},hints:[{en:`Work out the amount used and the amount remaining after Round 1 first, one step at a time.`,th:`คำนวณปริมาณที่ใช้และปริมาณที่เหลือของรอบที่ 1 ก่อนทีละขั้นตอน`},{en:`The Round 2 fraction applies to what remains AFTER Round 1, not to the original 96 mL.`,th:`เศษส่วนของรอบที่ 2 ใช้กับปริมาณที่เหลือ "หลังจากรอบที่ 1" ไม่ใช่กับ 96 มิลลิลิตรเดิม`},{en:`Find how much was used in each round separately, then subtract the smaller amount from the larger amount.`,th:`หาปริมาณที่ใช้ในแต่ละรอบแยกกันก่อน แล้วนำปริมาณที่น้อยกว่าไปลบออกจากปริมาณที่มากกว่า`}],visual:null,estimatedSeconds:115},{id:`D-16`,testId:`stw-mock-d`,number:16,skill:`Algebra & Patterns`,topic:{en:`Cut-Corner Area Equation`,th:`สมการพื้นที่มุมที่ถูกตัด`},difficulty:F(16),prompt:{en:`A square sheet of poster board for the science fair display has side length 18 cm. One corner is cut off along a straight cut, removing a right-triangle piece whose two equal legs are each x cm long, as shown. The remaining five-sided shape has an area of 252 cm². Find x.`,th:`แผ่นป้ายนิทรรศการรูปสี่เหลี่ยมจัตุรัสสำหรับงานวิทยาศาสตร์มีความยาวด้าน 18 เซนติเมตร มุมหนึ่งถูกตัดออกด้วยเส้นตัดตรง ทำให้ได้ชิ้นสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากสองด้านยาวเท่ากันคือ x เซนติเมตร ดังภาพ รูปห้าเหลี่ยมที่เหลือมีพื้นที่ 252 ตารางเซนติเมตร จงหาค่า x`},options:[{id:`A`,label:{en:`72`,th:`72`}},{id:`B`,label:{en:`12`,th:`12`}},{id:`C`,label:{en:`144`,th:`144`}},{id:`D`,label:{en:`36`,th:`36`}}],correctOptionId:`B`,explanation:{en:`The square's area is 18² = 324 cm². The removed triangle has area x²÷2. So 324 − x²÷2 = 252, giving x²÷2 = 72, so x² = 144. Taking the square root, x = 12 cm.`,th:`พื้นที่สี่เหลี่ยมจัตุรัส = 18² = 324 ตารางเซนติเมตร สามเหลี่ยมที่ถูกตัดออกมีพื้นที่ x²÷2 ดังนั้น 324 − x²÷2 = 252 จะได้ x²÷2 = 72 ดังนั้น x² = 144 ถอดรากที่สอง ได้ x = 12 เซนติเมตร`},distractorNotes:{A:{en:`This mistakes the area difference itself (324 − 252 = 72) for the value of x, skipping the triangle-area relationship entirely.`,th:`เข้าใจผิดว่าผลต่างของพื้นที่ (324 − 252 = 72) คือค่า x โดยตรง โดยไม่ได้ใช้ความสัมพันธ์ของพื้นที่สามเหลี่ยม`},C:{en:`This correctly finds x² = 144 but forgets the final step of taking the square root to find x.`,th:`หา x² = 144 ได้ถูกต้อง แต่ลืมขั้นตอนสุดท้ายคือการถอดรากที่สองเพื่อหา x`},D:{en:`This divides the area difference by 2 an extra, unnecessary time (72 ÷ 2 = 36) instead of correctly doubling it to find x².`,th:`นำผลต่างของพื้นที่ไปหารด้วย 2 เพิ่มอีกครั้งโดยไม่จำเป็น (72 ÷ 2 = 36) แทนที่จะคูณสองอย่างถูกต้องเพื่อหา x²`}},hints:[{en:`Start by finding the area of the whole square before any cut is made.`,th:`เริ่มจากหาพื้นที่ของสี่เหลี่ยมจัตุรัสทั้งหมดก่อนที่จะถูกตัด`},{en:`The removed triangle has two equal legs of length x, so its area is x times x, divided by 2.`,th:`สามเหลี่ยมที่ถูกตัดออกมีด้านประกอบมุมฉากเท่ากันสองด้านยาว x ดังนั้นพื้นที่คือ x คูณ x หารด้วย 2`},{en:`Set up: 324 − (x² ÷ 2) = 252. Solve for x², then remember to take the square root at the end.`,th:`ตั้งสมการ: 324 − (x² ÷ 2) = 252 แก้หา x² แล้วอย่าลืมถอดรากที่สองในขั้นตอนสุดท้าย`}],visual:{kind:`geometryFigure`,width:160,height:160,polygons:[{points:[[0,0],[53,0],[160,107],[160,160],[0,160]],fill:`shaded`}],segments:[{x1:53,y1:0,x2:160,y2:0,style:`dashed`},{x1:160,y1:0,x2:160,y2:107,style:`dashed`}],labels:[{x:106,y:-10,text:`x`},{x:176,y:53,text:`x`}],alt:{en:`A square with its top-right corner cut off by a diagonal line, forming a pentagon. Both legs of the cut-off triangle are labeled x, one along the top edge and one along the right edge, clearly separated from each other.`,th:`สี่เหลี่ยมจัตุรัสที่ถูกตัดมุมบนขวาออกด้วยเส้นทแยง เกิดเป็นรูปห้าเหลี่ยม ด้านประกอบมุมฉากทั้งสองของสามเหลี่ยมที่ถูกตัดออกกำกับด้วย x หนึ่งด้านอยู่ตามขอบบนและอีกด้านอยู่ตามขอบขวา แยกจากกันอย่างชัดเจน`}},estimatedSeconds:135},{id:`D-17`,testId:`stw-mock-d`,number:17,skill:`Graphs & Data`,topic:{en:`Reading a Grouped Bar Chart`,th:`การอ่านกราฟแท่งแบบกลุ่ม`},difficulty:F(17),prompt:{en:`The bar chart shows the number of seedlings that sprouted in Garden Bed A and Garden Bed B over four weeks. Which of the following statements is INCORRECT?`,th:`กราฟแท่งแสดงจำนวนต้นกล้าที่งอกในแปลงปลูก A และแปลงปลูก B ตลอดสี่สัปดาห์ ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Garden Bed A had more sprouted seedlings than Garden Bed B in exactly one week (Week 2).`,th:`แปลง A มีต้นกล้างอกมากกว่าแปลง B ในสัปดาห์เดียวพอดี (สัปดาห์ที่ 2)`}},{id:`B`,label:{en:`The single highest number of seedlings sprouted in any week was 34, by Garden Bed B in Week 3.`,th:`จำนวนต้นกล้าที่งอกสูงสุดเดี่ยวในสัปดาห์ใดๆ คือ 34 ต้น โดยแปลง B ในสัปดาห์ที่ 3`}},{id:`C`,label:{en:`Week 3 has the largest gap in seedling counts between the two beds.`,th:`สัปดาห์ที่ 3 เป็นสัปดาห์ที่มีผลต่างจำนวนต้นกล้าระหว่างสองแปลงมากที่สุด`}},{id:`D`,label:{en:`Garden Bed B's total seedlings across all four weeks (108) is higher than Garden Bed A's total (95).`,th:`จำนวนต้นกล้ารวมทั้งสี่สัปดาห์ของแปลง B (108 ต้น) มากกว่าจำนวนรวมของแปลง A (95 ต้น)`}}],correctOptionId:`C`,explanation:{en:`The weekly gaps between the two beds are: Week 1: 6, Week 2: 5, Week 3: 4, Week 4: 8. The LARGEST gap is actually in Week 4 (8), not Week 3 (4), so statement C is incorrect. The other three statements all check out against the chart.`,th:`ผลต่างจำนวนต้นกล้าของแต่ละสัปดาห์คือ สัปดาห์ที่ 1: 6, สัปดาห์ที่ 2: 5, สัปดาห์ที่ 3: 4, สัปดาห์ที่ 4: 8 ผลต่างที่มากที่สุดจริงๆ คือสัปดาห์ที่ 4 (8) ไม่ใช่สัปดาห์ที่ 3 (4) ดังนั้นข้อความ C จึงไม่ถูกต้อง ส่วนอีกสามข้อความตรงกับข้อมูลในกราฟทุกประการ`},distractorNotes:{A:{en:`This statement is actually true: comparing every week, Bed A only exceeds Bed B in Week 2 (25 vs 20) — exactly one week — so it should not be chosen as the incorrect one.`,th:`ข้อความนี้เป็นจริง เมื่อเทียบทุกสัปดาห์ แปลง A มากกว่าแปลง B เฉพาะสัปดาห์ที่ 2 เท่านั้น (25 ต่อ 20) ซึ่งเป็นสัปดาห์เดียวพอดี จึงไม่ควรเลือกข้อนี้เป็นคำตอบ`},B:{en:`This statement is actually true: scanning every bar, the tallest single bar is 34 seedlings, from Garden Bed B in Week 3.`,th:`ข้อความนี้เป็นจริง เมื่อตรวจดูแท่งทั้งหมด แท่งที่สูงที่สุดคือ 34 ต้น ของแปลง B ในสัปดาห์ที่ 3`},D:{en:`This statement is actually true: adding up all four weeks gives Bed A 18+25+30+22=95 and Bed B 24+20+34+30=108, so Bed B's total is indeed higher.`,th:`ข้อความนี้เป็นจริง เมื่อรวมจำนวนทั้งสี่สัปดาห์ แปลง A ได้ 18+25+30+22=95 และแปลง B ได้ 24+20+34+30=108 ดังนั้นแปลง B มีจำนวนรวมมากกว่าจริง`}},hints:[{en:`Check each statement against the chart one at a time — three are true and one is false.`,th:`ตรวจสอบแต่ละข้อความกับกราฟทีละข้อ สามข้อเป็นจริงและหนึ่งข้อเป็นเท็จ`},{en:`For the statement about the "largest gap", calculate the difference between the two beds in every single week.`,th:`สำหรับข้อความเรื่อง "ผลต่างมากที่สุด" ให้คำนวณผลต่างระหว่างสองแปลงในทุกสัปดาห์`},{en:`Compare all four gaps: 6, 5, 4, and 8. The week with the biggest gap is Week 4, not Week 3.`,th:`เปรียบเทียบผลต่างทั้งสี่ค่า: 6, 5, 4 และ 8 สัปดาห์ที่มีผลต่างมากที่สุดคือสัปดาห์ที่ 4 ไม่ใช่สัปดาห์ที่ 3`}],visual:{kind:`barChart`,categories:[`Week 1`,`Week 2`,`Week 3`,`Week 4`],series:[{name:{en:`Garden Bed A`,th:`แปลง A`},color:`sage`,values:[18,25,30,22]},{name:{en:`Garden Bed B`,th:`แปลง B`},color:`coral`,values:[24,20,34,30]}],yStep:10,yMax:40,alt:{en:`Grouped bar chart of Garden Bed A versus Garden Bed B seedling counts across four weeks: Week 1 (18, 24), Week 2 (25, 20), Week 3 (30, 34), and Week 4 (22, 30).`,th:`กราฟแท่งแบบกลุ่มแสดงจำนวนต้นกล้าของแปลง A เทียบกับแปลง B ในสี่สัปดาห์: สัปดาห์ที่ 1 (18, 24), สัปดาห์ที่ 2 (25, 20), สัปดาห์ที่ 3 (30, 34) และสัปดาห์ที่ 4 (22, 30)`}},estimatedSeconds:150},{id:`D-18`,testId:`stw-mock-d`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Chart Proportions`,th:`สัดส่วนแผนภูมิวงกลม`},difficulty:F(18),prompt:{en:`In a survey of students' favourite science fair category, the results are shown in the pie chart by degrees. 54 students chose Chemistry (108°). How many students chose Robotics (60°)?`,th:`จากการสำรวจหมวดหมู่งานวิทยาศาสตร์ที่นักเรียนชื่นชอบ ผลสำรวจแสดงเป็นแผนภูมิวงกลมโดยระบุมุมองศา มีนักเรียน 54 คนเลือกเคมี (108°) มีนักเรียนกี่คนที่เลือกหุ่นยนต์ (60°)`},options:[{id:`A`,label:{en:`30 students`,th:`30 คน`}},{id:`B`,label:{en:`9 students`,th:`9 คน`}},{id:`C`,label:{en:`36 students`,th:`36 คน`}},{id:`D`,label:{en:`120 students`,th:`120 คน`}}],correctOptionId:`A`,explanation:{en:`Since 108° corresponds to 54 students, each degree represents 54 ÷ 108 = \\frac{1}{2} of a student. Robotics' 60° therefore represents 60 × \\frac{1}{2} = 30 students.`,th:`เนื่องจาก 108° แทนนักเรียน 54 คน แต่ละองศาแทนนักเรียน 54 ÷ 108 = \\frac{1}{2} คน ดังนั้น 60° ของหุ่นยนต์จึงแทนนักเรียน 60 × \\frac{1}{2} = 30 คน`},distractorNotes:{B:{en:`This uses the full 360° circle as the reference instead of Chemistry's actual 108°, computing 54 × 60 ÷ 360 = 9.`,th:`ใช้วงกลมเต็ม 360° เป็นตัวอ้างอิงแทนที่จะใช้ 108° ของเคมี ทำให้คำนวณเป็น 54 × 60 ÷ 360 = 9`},C:{en:`This mistakenly reads the degree value from the neighboring 72° slice (Biology) instead of Robotics' 60° slice.`,th:`อ่านค่ามุมผิดจากส่วนข้างเคียงที่ 72° (ชีววิทยา) แทนที่จะเป็นส่วนหุ่นยนต์ที่ 60°`},D:{en:`This sets up the proportion upside down, multiplying 60 × (108 ÷ 54) = 120 instead of dividing correctly.`,th:`ตั้งสัดส่วนกลับด้าน โดยคูณ 60 × (108 ÷ 54) = 120 แทนที่จะหารให้ถูกทิศทาง`}},hints:[{en:`Find out how many students each single degree of the pie chart represents.`,th:`หาว่าแต่ละองศาของแผนภูมิวงกลมแทนนักเรียนกี่คน`},{en:`Use the given slice (108° = 54 students) to find the students-per-degree rate.`,th:`ใช้ส่วนที่โจทย์ให้มา (108° = นักเรียน 54 คน) เพื่อหาอัตรานักเรียนต่อองศา`},{en:`Multiply that rate by 60 to find how many students chose Robotics.`,th:`นำอัตรานั้นไปคูณกับ 60 เพื่อหาจำนวนนักเรียนที่เลือกหุ่นยนต์`}],visual:{kind:`pieChart`,slices:[{label:`Chemistry`,degrees:108,color:`coral`},{label:`Biology`,degrees:72,color:`sage`},{label:`Physics`,degrees:120,color:`teal`},{label:`Robotics`,degrees:60,color:`gold`}],alt:{en:`A pie chart of favourite science fair categories: Chemistry 108 degrees, Biology 72 degrees, Physics 120 degrees, and Robotics 60 degrees.`,th:`แผนภูมิวงกลมแสดงหมวดหมู่งานวิทยาศาสตร์ที่ชื่นชอบ: เคมี 108 องศา, ชีววิทยา 72 องศา, ฟิสิกส์ 120 องศา และหุ่นยนต์ 60 องศา`}},estimatedSeconds:145},{id:`D-19`,testId:`stw-mock-d`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Intended vs Actual Profit`,th:`กำไรที่ตั้งใจกับกำไรจริง`},difficulty:F(19),prompt:{en:`The garden club bought potted succulents for the fair at a cost of 60 baht each, hoping to mark them up for a 45% profit. However, during the closing clearance sale, they actually sold the succulents for only 25% more than the cost price. Find the club's ACTUAL profit per succulent.`,th:`ชมรมสวนซื้อไม้อวบน้ำกระถางมาสำหรับงานวิทยาศาสตร์ต้นทุนต้นละ 60 บาท โดยตั้งใจจะตั้งราคาขายเพื่อให้ได้กำไร 45% แต่ในการลดราคาล้างสต๊อกช่วงท้ายงาน ชมรมขายไม้อวบน้ำได้จริงในราคาที่สูงกว่าต้นทุนเพียง 25% เท่านั้น จงหากำไรที่ชมรมได้จริงต่อต้นหนึ่งต้น`},options:[{id:`A`,label:{en:`27 baht`,th:`27 บาท`}},{id:`B`,label:{en:`75 baht`,th:`75 บาท`}},{id:`C`,label:{en:`12 baht`,th:`12 บาท`}},{id:`D`,label:{en:`15 baht`,th:`15 บาท`}}],correctOptionId:`D`,explanation:{en:`The actual selling price = 60 + 25% of 60 = 60 + 15 = 75 baht. Actual profit = 75 − 60 = 15 baht. (The 45% figure was only the club's original plan, not what actually happened.)`,th:`ราคาขายจริง = 60 + 25% ของ 60 = 60 + 15 = 75 บาท กำไรจริง = 75 − 60 = 15 บาท (ตัวเลข 45% เป็นเพียงแผนเดิมของชมรม ไม่ใช่สิ่งที่เกิดขึ้นจริง)`},distractorNotes:{A:{en:`This uses the intended 45% markup (60 × 0.45 = 27) instead of the actual 25% that the succulents were really sold for.`,th:`ใช้อัตรากำไรที่ตั้งใจไว้ 45% (60 × 0.45 = 27) แทนที่จะใช้ 25% ที่ขายได้จริง`},B:{en:`This correctly finds the actual selling price (75 baht) but reports it as the profit instead of subtracting the cost price first.`,th:`หาราคาขายจริงได้ถูกต้อง (75 บาท) แต่ตอบเป็นกำไรโดยไม่ได้ลบต้นทุนออกก่อน`},C:{en:`This uses the DIFFERENCE between the intended and actual percentages (45% − 25% = 20%) applied to the cost, giving 60 × 0.20 = 12, which does not represent actual profit.`,th:`ใช้ผลต่างระหว่างเปอร์เซ็นต์ที่ตั้งใจกับที่ได้จริง (45% − 25% = 20%) คูณกับต้นทุน ได้ 60 × 0.20 = 12 ซึ่งไม่ใช่กำไรที่แท้จริง`}},hints:[{en:`The 45% figure describes what the club hoped for, not what actually happened.`,th:`ตัวเลข 45% เป็นสิ่งที่ชมรมตั้งใจไว้ ไม่ใช่สิ่งที่เกิดขึ้นจริง`},{en:`Use the ACTUAL 25% markup on the 60-baht cost to find the real selling price.`,th:`ใช้ส่วนเพิ่ม 25% ที่เกิดขึ้นจริงกับต้นทุน 60 บาท เพื่อหาราคาขายจริง`},{en:`Actual selling price = 60 + (25% of 60). Then subtract the 60-baht cost to find the actual profit.`,th:`ราคาขายจริง = 60 + (25% ของ 60) จากนั้นลบต้นทุน 60 บาทออกเพื่อหากำไรจริง`}],visual:null,estimatedSeconds:140},{id:`D-20`,testId:`stw-mock-d`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Three-Way Percentage Relationships`,th:`ความสัมพันธ์ร้อยละสามฝ่าย`},difficulty:F(20),prompt:{en:`Fah, Ing, and Beam together raised 825 baht selling raffle tickets for the science fair. Ing raised 25% more than Fah, and Beam raised 40% of what Ing raised. What is the difference between the amounts raised by Ing and Beam?`,th:`ฟ้า อิง และบีม ร่วมกันขายบัตรจับฉลากสำหรับงานวิทยาศาสตร์ได้เงินรวม 825 บาท อิงขายได้เงินมากกว่าฟ้า 25% และบีมขายได้เงินเป็น 40% ของที่อิงขายได้ ผลต่างระหว่างเงินที่อิงและบีมขายได้เป็นเท่าใด`},options:[{id:`A`,label:{en:`300 baht`,th:`300 บาท`}},{id:`B`,label:{en:`225 baht`,th:`225 บาท`}},{id:`C`,label:{en:`375 baht`,th:`375 บาท`}},{id:`D`,label:{en:`450 baht`,th:`450 บาท`}}],correctOptionId:`B`,explanation:{en:`Let Fah's amount be F. Ing = 1.25F. Beam = 0.4 × 1.25F = 0.5F. Total = F + 1.25F + 0.5F = 2.75F = 825, so F = 300 baht. Ing = 1.25 × 300 = 375 baht and Beam = 0.5 × 300 = 150 baht. The difference between Ing and Beam = 375 − 150 = 225 baht.`,th:`ให้เงินของฟ้าเป็น F อิง = 1.25F บีม = 0.4 × 1.25F = 0.5F รวม = F + 1.25F + 0.5F = 2.75F = 825 ดังนั้น F = 300 บาท อิง = 1.25 × 300 = 375 บาท และบีม = 0.5 × 300 = 150 บาท ผลต่างระหว่างอิงกับบีม = 375 − 150 = 225 บาท`},distractorNotes:{A:{en:`This reports Fah's amount (300 baht), mistaking it for the difference between Ing and Beam.`,th:`ตอบเงินของฟ้า (300 บาท) โดยสับสนว่าเป็นผลต่างระหว่างอิงกับบีม`},C:{en:`This reports Ing's amount alone (375 baht) instead of the difference between Ing and Beam.`,th:`ตอบเงินของอิงเพียงคนเดียว (375 บาท) แทนที่จะเป็นผลต่างระหว่างอิงกับบีม`},D:{en:`This adds Fah's and Beam's amounts together (300 + 150 = 450 baht) instead of finding the difference between Ing and Beam.`,th:`นำเงินของฟ้าและบีมมาบวกกัน (300 + 150 = 450 บาท) แทนที่จะหาผลต่างระหว่างอิงกับบีม`}},hints:[{en:`Let F stand for the amount Fah raised, and write Ing and Beam's amounts in terms of F.`,th:`ให้ F แทนเงินที่ฟ้าขายได้ แล้วเขียนเงินของอิงและบีมในรูปของ F`},{en:`Ing = 1.25F (25% more than Fah). Beam = 40% of Ing, so Beam = 0.5F.`,th:`อิง = 1.25F (มากกว่าฟ้า 25%) บีม = 40% ของอิง ดังนั้นบีม = 0.5F`},{en:`Add all three in terms of F: F + 1.25F + 0.5F = 2.75F = 825. Solve for F, then find Ing and Beam separately before subtracting.`,th:`บวกทั้งสามคนในรูปของ F: F + 1.25F + 0.5F = 2.75F = 825 แก้หาค่า F แล้วหาเงินของอิงและบีมแยกกันก่อนนำไปลบกัน`}],visual:null,estimatedSeconds:150}]},{id:`stw-mock-e`,title:{en:`Mock Test E`,th:`ข้อสอบชุด E`},subtitle:{en:`City & Community Paper`,th:`ชุดเมืองและชุมชน`},recommendedMinutes:40,questions:[{id:`E-01`,testId:`stw-mock-e`,number:1,skill:`Number & Operations`,topic:{en:`Largest/Smallest Number Formation`,th:`การสร้างจำนวนที่มากที่สุด/น้อยที่สุด`},difficulty:F(1),prompt:{en:`Nid has five number cards: 1, 3, 4, 7, 8. Using each card exactly once, she arranges them to form the largest possible 5-digit EVEN number. What number does she form?`,th:`นิดมีบัตรตัวเลข 5 ใบ คือ 1, 3, 4, 7, 8 เธอนำบัตรทั้งหมดมาเรียงกันโดยใช้แต่ละใบเพียงครั้งเดียว เพื่อให้ได้จำนวน 5 หลักที่เป็นจำนวนคู่และมีค่ามากที่สุด จำนวนนั้นคือข้อใด`},options:[{id:`A`,label:{en:`87,314`,th:`87,314`}},{id:`B`,label:{en:`87,431`,th:`87,431`}},{id:`C`,label:{en:`74,318`,th:`74,318`}},{id:`D`,label:{en:`13,478`,th:`13,478`}}],correctOptionId:`A`,explanation:{en:`For the number to be even, the last digit must be 4 or 8. Ending in 4 leaves the front digits 8,7,3,1 to arrange in descending order (8731), giving 87,314. Ending in 8 leaves 7,4,3,1 in front, giving only 74,318 — smaller. So 87,314 is the largest even arrangement.`,th:`จำนวนที่เป็นจำนวนคู่ต้องลงท้ายด้วย 4 หรือ 8 ถ้าลงท้ายด้วย 4 จะนำหลักที่เหลือ 8,7,3,1 มาเรียงจากมากไปน้อยหน้าสุดได้ 8731 รวมเป็น 87,314 ถ้าลงท้ายด้วย 8 จะได้เพียง 74,318 ซึ่งน้อยกว่า ดังนั้น 87,314 จึงมากที่สุด`},distractorNotes:{B:{en:`87,431 is simply all five digits sorted from largest to smallest, ignoring the requirement that the number must be even.`,th:`87,431 เกิดจากการเรียงตัวเลขทั้งห้าจากมากไปน้อยเฉยๆ โดยลืมเงื่อนไขที่ว่าต้องเป็นจำนวนคู่`},C:{en:`This correctly ends in an even digit (8), but placing 8 in the last position wastes a large digit on the smallest place value instead of using 4 there.`,th:`จำนวนนี้ลงท้ายด้วยเลขคู่ (8) ถูกต้อง แต่การนำ 8 ไปไว้หลักหน่วยทำให้เสียเลขค่าสูงไปอยู
