่หลักที่มีค่าน้อยที่สุด ทั้งที่ควรใช้ 4 แทน`},D:{en:`This is the digits arranged from smallest to largest — the smallest possible number, not the largest.`,th:`จำนวนนี้เกิดจากการเรียงตัวเลขจากน้อยไปมาก ซึ่งเป็นจำนวนที่น้อยที่สุด ไม่ใช่มากที่สุด`}},hints:[{en:`Think about which digit can go last so the whole number is even.`,th:`ลองคิดว่าหลักหน่วยควรเป็นตัวเลขใดจึงจะทำให้จำนวนนั้นเป็นจำนวนคู่`},{en:`Only 4 and 8 are even digits here — try both as the last digit and compare.`,th:`มีเพียง 4 กับ 8 เท่านั้นที่เป็นเลขคู่ ลองใช้ทั้งสองตัวเป็นหลักหน่วยแล้วเปรียบเทียบกัน`},{en:`For each choice of last digit, arrange the remaining four digits in descending order at the front, then compare the two full numbers.`,th:`เมื่อเลือกหลักหน่วยแล้ว ให้นำตัวเลขที่เหลืออีกสี่ตัวเรียงจากมากไปน้อยไว้ข้างหน้า แล้วเปรียบเทียบจำนวนทั้งสองที่ได้`}],visual:null,estimatedSeconds:45},{id:`E-02`,testId:`stw-mock-e`,number:2,skill:`Word Problems & Logic`,topic:{en:`Two-Scenario Pricing Puzzle`,th:`โจทย์ราคาสองสถานการณ์`},difficulty:F(2),prompt:{en:`At a community fair booth, notebooks cost 15 baht each and Fah has just enough money to buy some, with none left over. If notebooks cost 12 baht each instead, she could buy 3 more notebooks and still have 6 baht left over. How much money does Fah have?`,th:`ที่บูธในงานออกร้านชุมชนแห่งหนึ่ง สมุดเล่มละ 15 บาท ฟ้ามีเงินพอดีซื้อสมุดได้จำนวนหนึ่งโดยไม่เหลือเงินเลย แต่ถ้าสมุดราคาเล่มละ 12 บาท เธอจะซื้อได้เพิ่มอีก 3 เล่ม และยังเหลือเงิน 6 บาท ฟ้ามีเงินทั้งหมดกี่บาท`},options:[{id:`A`,label:{en:`150 baht`,th:`150 บาท`}},{id:`B`,label:{en:`210 baht`,th:`210 บาท`}},{id:`C`,label:{en:`204 baht`,th:`204 บาท`}},{id:`D`,label:{en:`180 baht`,th:`180 บาท`}}],correctOptionId:`B`,explanation:{en:`Let n be the number of notebooks at 15 baht, so her money is 15n. At 12 baht she buys (n+3) notebooks with 6 baht left: 15n = 12(n+3) + 6, so 3n = 42 and n = 14. Her money is 15 × 14 = 210 baht (check: 210 ÷ 12 = 17 notebooks with 6 baht left, and 17 = 14 + 3, which matches).`,th:`ให้ n เป็นจำนวนสมุดที่ซื้อได้เมื่อราคาเล่มละ 15 บาท เงินของฟ้าคือ 15n เมื่อราคาลดเป็น 12 บาท เธอซื้อได้ (n+3) เล่ม เหลือเงิน 6 บาท จะได้สมการ 15n = 12(n+3) + 6 ซึ่งให้ 3n = 42 ดังนั้น n = 14 เงินของฟ้าคือ 15 × 14 = 210 บาท (ตรวจสอบ: 210 ÷ 12 = 17 เล่ม เหลือ 6 บาท และ 17 = 14 + 3 ตรงกันพอดี)`},distractorNotes:{A:{en:`This comes from forgetting the 6 baht left over, solving 15n = 12n + 36 instead of 15n = 12n + 36 + 6, giving the wrong quantity n = 12.`,th:`ค่านี้เกิดจากการลืมเงื่อนไขเงินเหลือ 6 บาท โดยตั้งสมการเป็น 15n = 12n + 36 แทนที่จะเป็น 15n = 12n + 36 + 6 ทำให้ได้ n = 12 ซึ่งผิด`},C:{en:`This is the cost of the 17 notebooks bought at the new price (12 × 17 = 204), which forgets to add back the 6 baht that was left over.`,th:`ค่านี้คือเงินที่จ่ายซื้อสมุด 17 เล่มในราคาใหม่ (12 × 17 = 204) ซึ่งลืมบวกเงิน 6 บาทที่เหลือกลับเข้าไปด้วย`},D:{en:`This comes from a sign error in the equation — subtracting the 6 baht instead of adding it, giving 15n = 12n + 30 and the wrong total.`,th:`ค่านี้เกิดจากการตั้งเครื่องหมายผิดในสมการ คือนำ 6 บาทไปลบแทนที่จะบวก ทำให้ได้ 15n = 12n + 30 ซึ่งให้คำตอบที่ผิด`}},hints:[{en:`Let n be the number of notebooks Fah can buy at 15 baht each.`,th:`ให้ n เป็นจำนวนสมุดที่ฟ้าซื้อได้เมื่อราคาเล่มละ 15 บาท`},{en:`Write her total money two ways: as 15 times n, and as 12 times (n+3) plus the 6 baht left over.`,th:`เขียนเงินทั้งหมดของฟ้าสองแบบ คือ 15 คูณ n และ 12 คูณ (n+3) บวกเงินที่เหลืออีก 6 บาท`},{en:`Set the two expressions equal and solve for n, then multiply n by 15 to get her total money.`,th:`ให้สองนิพจน์นั้นเท่ากันแล้วแก้หาค่า n จากนั้นนำ n คูณ 15 เพื่อหาเงินทั้งหมดของฟ้า`}],visual:null,estimatedSeconds:55},{id:`E-03`,testId:`stw-mock-e`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Unlike Fractions`,th:`การเรียงลำดับเศษส่วนไม่เท่ากัน`},difficulty:F(3),prompt:{en:`Six friends compared how much of their community-service hour target they had completed: \\frac{2}{3}, \\frac{5}{8}, \\frac{3}{4}, \\frac{7}{12}, \\frac{5}{6}, and \\frac{1}{2}. Which fraction is the 4th largest?`,th:`เพื่อนหกคนเปรียบเทียบสัดส่วนชั่วโมงจิตอาสาที่ทำได้เทียบกับเป้าหมาย ได้แก่ \\frac{2}{3}, \\frac{5}{8}, \\frac{3}{4}, \\frac{7}{12}, \\frac{5}{6} และ \\frac{1}{2} เศษส่วนใดมีค่ามากเป็นอันดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{3}{4}`,th:`\\frac{3}{4}`}},{id:`B`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`C`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}},{id:`D`,label:{en:`\\frac{7}{12}`,th:`\\frac{7}{12}`}}],correctOptionId:`C`,explanation:{en:`Convert all six to 24ths: \\frac{2}{3}=\\frac{16}{24}, \\frac{5}{8}=\\frac{15}{24}, \\frac{3}{4}=\\frac{18}{24}, \\frac{7}{12}=\\frac{14}{24}, \\frac{5}{6}=\\frac{20}{24}, \\frac{1}{2}=\\frac{12}{24}. Ordered from largest: \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{1}{2}. The 4th largest is \\frac{5}{8}.`,th:`แปลงทุกจำนวนให้เป็นเศษส่วนที่มีตัวส่วน 24 ได้แก่ \\frac{2}{3}=\\frac{16}{24}, \\frac{5}{8}=\\frac{15}{24}, \\frac{3}{4}=\\frac{18}{24}, \\frac{7}{12}=\\frac{14}{24}, \\frac{5}{6}=\\frac{20}{24}, \\frac{1}{2}=\\frac{12}{24} เรียงจากมากไปน้อยได้ \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{1}{2} ดังนั้นอันดับที่ 4 คือ \\frac{5}{8}`},distractorNotes:{A:{en:`\\frac{3}{4} is actually the 2nd largest fraction, not the 4th.`,th:`\\frac{3}{4} จริงๆ แล้วมีค่ามากเป็นอันดับที่ 2 ไม่ใช่อันดับที่ 4`},B:{en:`\\frac{2}{3} is the 3rd largest fraction, one place ahead of the correct answer.`,th:`\\frac{2}{3} มีค่ามากเป็นอันดับที่ 3 ซึ่งอยู่ก่อนหน้าคำตอบที่ถูกต้องหนึ่งอันดับ`},D:{en:`\\frac{7}{12} is the 5th largest, one place behind the correct answer — an easy off-by-one slip when counting through the ordered list.`,th:`\\frac{7}{12} มีค่ามากเป็นอันดับที่ 5 ซึ่งอยู่ถัดจากคำตอบที่ถูกต้องหนึ่งอันดับ เป็นความผิดพลาดที่เกิดง่ายเวลานับลำดับ`}},hints:[{en:`You cannot compare these fractions directly — they need a common denominator first.`,th:`ไม่สามารถเปรียบเทียบเศษส่วนเหล่านี้ได้โดยตรง ต้องทำตัวส่วนให้เท่ากันก่อน`},{en:`The denominators 3, 8, 4, 12, 6, 2 all divide into 24 — convert every fraction to 24ths.`,th:`ตัวส่วน 3, 8, 4, 12, 6, 2 ทั้งหมดหาร 24 ลงตัว ให้แปลงทุกเศษส่วนเป็นเศษส่วนที่มีตัวส่วน 24`},{en:`Once all six are over 24, list the numerators from largest to smallest and count to the 4th position.`,th:`เมื่อทุกเศษส่วนมีตัวส่วนเป็น 24 แล้ว ให้เรียงตัวเศษจากมากไปน้อยแล้วนับหาตำแหน่งที่ 4`}],visual:null,estimatedSeconds:50},{id:`E-04`,testId:`stw-mock-e`,number:4,skill:`Number & Operations`,topic:{en:`Mixed Operations with Brackets`,th:`การดำเนินการผสมและวงเล็บ`},difficulty:F(4),prompt:{en:`At the school book fair, Ice calculated two numbers: A = (7 − 2) × 4 − 2 and B = (9 + 3) ÷ 2. What is the value of 2 × (A ÷ B)?`,th:`ที่งานหนังสือของโรงเรียน ไอซ์คำนวณตัวเลขสองจำนวน คือ A = (7 − 2) × 4 − 2 และ B = (9 + 3) ÷ 2 จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`B`,label:{en:`3`,th:`3`}},{id:`C`,label:{en:`36`,th:`36`}},{id:`D`,label:{en:`6`,th:`6`}}],correctOptionId:`D`,explanation:{en:`A = (7 − 2) × 4 − 2 = 5 × 4 − 2 = 20 − 2 = 18. B = (9 + 3) ÷ 2 = 12 ÷ 2 = 6. So A ÷ B = 18 ÷ 6 = 3, and 2 × 3 = 6.`,th:`A = (7 − 2) × 4 − 2 = 5 × 4 − 2 = 20 − 2 = 18 และ B = (9 + 3) ÷ 2 = 12 ÷ 2 = 6 ดังนั้น A ÷ B = 18 ÷ 6 = 3 และ 2 × 3 = 6`},distractorNotes:{A:{en:`This comes from computing B ÷ A instead of A ÷ B (2 × (6 ÷ 18) = \\frac{2}{3}) — the two values were swapped.`,th:`ค่านี้เกิดจากการคำนวณ B ÷ A แทนที่จะเป็น A ÷ B (2 × (6 ÷ 18) = \\frac{2}{3}) คือสลับค่าทั้งสองกัน`},B:{en:`This is just A ÷ B (18 ÷ 6 = 3) with the final ×2 forgotten.`,th:`ค่านี้คือ A ÷ B (18 ÷ 6 = 3) เพียงอย่างเดียว โดยลืมคูณ 2 ในขั้นตอนสุดท้าย`},C:{en:`This comes from computing 2 × A correctly (36) but then forgetting to divide by B entirely.`,th:`ค่านี้เกิดจากการคำนวณ 2 × A ได้ถูกต้อง (36) แต่ลืมหารด้วย B ไปเลย`}},hints:[{en:`Work out A and B separately first, following the brackets in each.`,th:`หาค่า A และ B แยกกันก่อน โดยทำตามวงเล็บของแต่ละนิพจน์`},{en:`Inside each bracket, do the operation in the parentheses first, then continue left to right.`,th:`ภายในวงเล็บให้คำนวณก่อน จากนั้นจึงคำนวณต่อจากซ้ายไปขวา`},{en:`Once you have A = 18 and B = 6, divide A by B, then multiply the result by 2.`,th:`เมื่อได้ A = 18 และ B = 6 แล้ว ให้นำ A หาร B จากนั้นนำผลลัพธ์ไปคูณด้วย 2`}],visual:null,estimatedSeconds:60},{id:`E-05`,testId:`stw-mock-e`,number:5,skill:`Number & Operations`,topic:{en:`LCM and GCF from a Ratio Clue`,th:`ค.ร.น. และ ห.ร.ม. จากเงื่อนไขอัตราส่วน`},difficulty:F(5),prompt:{en:`Two class monitors, Bee and Ann, are assigned locker numbers. Bee's locker number is 4 times Ann's locker number, and the sum of their two locker numbers is 60. What is the LCM of their locker numbers?`,th:`บีและแอนเป็นหัวหน้าห้องได้รับหมายเลขล็อกเกอร์คนละหมายเลข โดยหมายเลขของบีเป็น 4 เท่าของหมายเลขของแอน และผลรวมของหมายเลขทั้งสองเท่ากับ 60 ค.ร.น. ของหมายเลขล็อกเกอร์ทั้งสองคือเท่าใด`},options:[{id:`A`,label:{en:`48`,th:`48`}},{id:`B`,label:{en:`12`,th:`12`}},{id:`C`,label:{en:`60`,th:`60`}},{id:`D`,label:{en:`576`,th:`576`}}],correctOptionId:`A`,explanation:{en:`Let Ann's number be x, so Bee's is 4x. Then x + 4x = 60, so 5x = 60 and x = 12. Ann has locker 12 and Bee has locker 48. Since 48 is already a multiple of 12, the LCM(12, 48) = 48.`,th:`ให้หมายเลขของแอนเป็น x ดังนั้นหมายเลขของบีคือ 4x จะได้ x + 4x = 60 หรือ 5x = 60 ดังนั้น x = 12 แอนได้หมายเลข 12 และบีได้หมายเลข 48 เนื่องจาก 48 เป็นพหุคูณของ 12 อยู่แล้ว ค.ร.น. ของ 12 และ 48 คือ 48`},distractorNotes:{B:{en:`12 is the GCF (ห.ร.ม.) of the two locker numbers, not the LCM.`,th:`12 คือ ห.ร.ม. ของหมายเลขล็อกเกอร์ทั้งสอง ไม่ใช่ ค.ร.น.`},C:{en:`60 is the sum of the two locker numbers given in the problem, mistaken for the LCM.`,th:`60 คือผลรวมของหมายเลขล็อกเกอร์ทั้งสองที่โจทย์กำหนดให้ ไม่ใช่ ค.ร.น.`},D:{en:`This is the product of the two numbers (12 × 48 = 576), which equals LCM × GCF rather than the LCM alone.`,th:`ค่านี้คือผลคูณของสองจำนวน (12 × 48 = 576) ซึ่งเท่ากับ ค.ร.น. คูณ ห.ร.ม. ไม่ใช่ ค.ร.น. เพียงอย่างเดียว`}},hints:[{en:`Set up an equation using Ann's number and the fact that Bee's is 4 times as large.`,th:`ตั้งสมการโดยใช้หมายเลขของแอน และข้อเท็จจริงที่ว่าหมายเลขของบีมากกว่าถึง 4 เท่า`},{en:`Once you find both actual locker numbers, notice that one is a multiple of the other.`,th:`เมื่อหาหมายเลขล็อกเกอร์จริงของทั้งสองคนได้แล้ว ให้สังเกตว่าตัวหนึ่งเป็นพหุคูณของอีกตัวหนึ่งหรือไม่`},{en:`If one number is already a multiple of the other, the larger number itself is their LCM.`,th:`ถ้าจำนวนหนึ่งเป็นพหุคูณของอีกจำนวนหนึ่งอยู่แล้ว จำนวนที่มากกว่านั้นก็คือ ค.ร.น. ของทั้งสองจำนวนนั่นเอง`}],visual:null,estimatedSeconds:65},{id:`E-06`,testId:`stw-mock-e`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Visual Patterns`,th:`แบบรูปที่เพิ่มขึ้นเรื่อยๆ`},difficulty:F(6),prompt:{en:`Students are building a growing sequence of square picture frames from tiles for a mural project. Figure 2 is a solid 2×2 square (4 tiles). Figure 3 is a hollow 3×3 square using only border tiles (8 tiles). Figure 4, shown below, is a hollow 4×4 square border (12 tiles). If this pattern continues, how many tiles will Figure 12 need?`,th:`นักเรียนกำลังต่อกระเบื้องเป็นกรอบภาพสี่เหลี่ยมจัตุรัสที่ขยายขึ้นเรื่อยๆ สำหรับงานภาพจิตรกรรมฝาผนัง รูปที่ 2 เป็นสี่เหลี่ยมจัตุรัสขนาด 2×2 ที่ปูเต็ม (4 แผ่น) รูปที่ 3 เป็นสี่เหลี่ยมจัตุรัสขนาด 3×3 ที่ปูเฉพาะขอบ (8 แผ่น) รูปที่ 4 ซึ่งแสดงไว้ด้านล่าง เป็นสี่เหลี่ยมจัตุรัสขนาด 4×4 ที่ปูเฉพาะขอบ (12 แผ่น) ถ้าแบบรูปนี้ดำเนินต่อไปเรื่อยๆ รูปที่ 12 จะต้องใช้กระเบื้องกี่แผ่น`},options:[{id:`A`,label:{en:`40`,th:`40`}},{id:`B`,label:{en:`44`,th:`44`}},{id:`C`,label:{en:`36`,th:`36`}},{id:`D`,label:{en:`48`,th:`48`}}],correctOptionId:`B`,explanation:{en:`The tile count grows by 4 each time: Figure 2 uses 4, Figure 3 uses 8, Figure 4 uses 12 — so Figure n uses 4 × (n − 1) tiles. For Figure 12, that is 4 × (12 − 1) = 4 × 11 = 44 tiles.`,th:`จำนวนกระเบื้องเพิ่มขึ้นครั้งละ 4 แผ่น คือ รูปที่ 2 ใช้ 4 แผ่น รูปที่ 3 ใช้ 8 แผ่น รูปที่ 4 ใช้ 12 แผ่น ดังนั้นรูปที่ n ใช้กระเบื้อง 4 × (n − 1) แผ่น สำหรับรูปที่ 12 จะได้ 4 × (12 − 1) = 4 × 11 = 44 แผ่น`},distractorNotes:{A:{en:`This uses 4 × (12 − 2) instead of 4 × (12 − 1), one step behind the correct pattern rule.`,th:`ค่านี้เกิดจากการใช้ 4 × (12 − 2) แทนที่จะเป็น 4 × (12 − 1) ซึ่งช้ากว่าแบบรูปที่ถูกต้องไปหนึ่งขั้น`},C:{en:`This comes from starting the count two steps too late, effectively using 4 × (12 − 3) = 36.`,th:`ค่านี้เกิดจากการเริ่มนับช้าไปสองขั้น ซึ่งเท่ากับการใช้ 4 × (12 − 3) = 36`},D:{en:`This is simply 4 × 12, forgetting that the pattern is 4 tiles below a plain multiple of 4 (Figure 1 would need 0 tiles by the correct rule).`,th:`ค่านี้คือ 4 × 12 เฉยๆ โดยลืมว่าแบบรูปนี้น้อยกว่าพหุคูณของ 4 อยู่ 4 แผ่นเสมอ (ถ้าใช้กฎที่ถูกต้อง รูปที่ 1 จะต้องใช้ 0 แผ่น)`}},hints:[{en:`Look at how many more tiles are added each time you move to the next figure.`,th:`ลองสังเกตว่าแต่ละครั้งที่เปลี่ยนไปรูปถัดไป จำนวนกระเบื้องเพิ่มขึ้นเท่าใด`},{en:`The number of tiles increases by a fixed amount of 4 each time — this is a simple arithmetic pattern.`,th:`จำนวนกระเบื้องเพิ่มขึ้นครั้งละ 4 แผ่นเท่าๆ กันทุกครั้ง เป็นแบบรูปเลขคณิตอย่างง่าย`},{en:`Write the rule as 4 × (figure number − 1), then substitute 12 for the figure number.`,th:`เขียนกฎเป็น 4 × (หมายเลขรูป − 1) จากนั้นแทนหมายเลขรูปด้วย 12`}],visual:{kind:`gridPattern`,gridSize:4,cells:[{row:0,col:0},{row:0,col:1},{row:0,col:2},{row:0,col:3},{row:1,col:0},{row:1,col:3},{row:2,col:0},{row:2,col:3},{row:3,col:0},{row:3,col:1},{row:3,col:2},{row:3,col:3}],alt:{en:`A 4×4 grid of tiles with only the border tiles shaded (12 tiles), showing Figure 4 of the growing picture-frame pattern.`,th:`ตารางกระเบื้องขนาด 4×4 ที่แรเงาเฉพาะกระเบื้องขอบ (12 แผ่น) แสดงรูปที่ 4 ของแบบรูปกรอบภาพที่ขยายขึ้นเรื่อยๆ`}},estimatedSeconds:70},{id:`E-07`,testId:`stw-mock-e`,number:7,skill:`Word Problems & Logic`,topic:{en:`Meeting Point on a Circular Track`,th:`จุดพบกันบนเส้นทางวงกลม`},difficulty:F(7),prompt:{en:`Time and Nook cycle around a circular park path in opposite directions, starting from the same point at the same time. Time cycles at 250 m/min and Nook cycles at 200 m/min. They meet for the first time after 4 minutes. What is the length of the path around the park?`,th:`ไทม์และนุ๊กปั่นจักรยานรอบสวนสาธารณะที่เป็นเส้นทางวงกลม โดยออกจากจุดเดียวกันในเวลาเดียวกันแต่ปั่นสวนทางกัน ไทม์ปั่นด้วยความเร็ว 250 เมตร/นาที และนุ๊กปั่นด้วยความเร็ว 200 เมตร/นาที ทั้งสองพบกันครั้งแรกหลังจากผ่านไป 4 นาที เส้นทางรอบสวนสาธารณะยาวเท่าใด`},options:[{id:`A`,label:{en:`200 m`,th:`200 เมตร`}},{id:`B`,label:{en:`900 m`,th:`900 เมตร`}},{id:`C`,label:{en:`1,800 m`,th:`1,800 เมตร`}},{id:`D`,label:{en:`1,000 m`,th:`1,000 เมตร`}}],correctOptionId:`C`,explanation:{en:`Since they cycle in opposite directions from the same point, together they cover the whole loop by the time they first meet. Combined speed = 250 + 200 = 450 m/min. Distance covered together in 4 minutes = 450 × 4 = 1,800 m, which is the length of the path.`,th:`เนื่องจากทั้งสองปั่นสวนทางกันจากจุดเดียวกัน เมื่อพบกันครั้งแรก ระยะทางที่ทั้งสองปั่นรวมกันจะเท่ากับความยาวรอบเส้นทางพอดี ความเร็วรวม = 250 + 200 = 450 เมตร/นาที ระยะทางรวมใน 4 นาที = 450 × 4 = 1,800 เมตร ซึ่งคือความยาวของเส้นทาง`},distractorNotes:{A:{en:`This uses the DIFFERENCE of the speeds (250 − 200 = 50, × 4 = 200), which is the method for one cyclist catching up to another moving the SAME direction, not for cyclists moving toward each other.`,th:`ค่านี้เกิดจากการใช้ผลต่างของความเร็ว (250 − 200 = 50, × 4 = 200) ซึ่งเป็นวิธีคิดสำหรับกรณีไล่ตามกันไปทางเดียวกัน ไม่ใช่กรณีปั่นสวนทางเข้าหากัน`},B:{en:`This uses the average of the two speeds ((250+200)÷2 = 225, × 4 = 900) instead of the sum of the two speeds.`,th:`ค่านี้เกิดจากการใช้ค่าเฉลี่ยของความเร็วทั้งสอง ((250+200)÷2 = 225, × 4 = 900) แทนที่จะใช้ผลรวมของความเร็วทั้งสอง`},D:{en:`This is only the distance Time alone travelled (250 × 4 = 1,000 m), forgetting that Nook also contributes distance toward the meeting point.`,th:`ค่านี้คือระยะทางที่ไทม์คนเดียวปั่นได้ (250 × 4 = 1,000 เมตร) โดยลืมว่านุ๊กก็ปั่นระยะทางเข้าหาจุดพบกันด้วยเช่นกัน`}},hints:[{en:`Think about how far apart the two cyclists are just before they meet, and how that gap closes.`,th:`ลองคิดว่าก่อนที่ทั้งสองจะพบกัน ระยะห่างระหว่างพวกเขาลดลงอย่างไร`},{en:`When two people move toward each other from the same starting point around a loop, their combined distance at the first meeting equals the whole loop length.`,th:`เมื่อสองคนปั่นสวนทางกันรอบวงจากจุดเริ่มต้นเดียวกัน ระยะทางรวมของทั้งสองคนตอนพบกันครั้งแรกจะเท่ากับความยาวรอบเส้นทางพอดี`},{en:`Add the two speeds together to get their combined speed, then multiply by the 4 minutes.`,th:`นำความเร็วทั้งสองมาบวกกันเพื่อหาความเร็วรวม แล้วคูณด้วยเวลา 4 นาที`}],visual:null,estimatedSeconds:78},{id:`E-08`,testId:`stw-mock-e`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing Money in a Ratio`,th:`การแบ่งเงินตามอัตราส่วน`},difficulty:F(8),prompt:{en:`For a community clean-up day, a class collected 2,400 baht in donations to share among three student teams — Recycling, Planting, and Painting — in the ratio 5:4:3, to spend on supplies. The Painting team then spent \\frac{2}{3} of its share on paintbrushes. How much money does the Painting team have left?`,th:`ในวันทำความสะอาดชุมชน ห้องเรียนหนึ่งได้เงินบริจาครวม 2,400 บาท เพื่อแบ่งให้ทีมนักเรียนสามทีม ได้แก่ ทีมรีไซเคิล ทีมปลูกต้นไม้ และทีมทาสี ในอัตราส่วน 5:4:3 สำหรับซื้ออุปกรณ์ ต่อมาทีมทาสีใช้เงิน \\frac{2}{3} ของส่วนแบ่งที่ได้ไปซื้อแปรงทาสี ทีมทาสีเหลือเงินเท่าใด`},options:[{id:`A`,label:{en:`600 baht`,th:`600 บาท`}},{id:`B`,label:{en:`400 baht`,th:`400 บาท`}},{id:`C`,label:{en:`300 baht`,th:`300 บาท`}},{id:`D`,label:{en:`200 baht`,th:`200 บาท`}}],correctOptionId:`D`,explanation:{en:`The ratio parts total 5+4+3 = 12, so each part is worth 2,400 ÷ 12 = 200 baht. The Painting team gets 3 parts = 600 baht. They spent \\frac{2}{3} of 600 = 400 baht, leaving 600 − 400 = 200 baht.`,th:`ผลรวมของอัตราส่วนคือ 5+4+3 = 12 ส่วน ดังนั้นแต่ละส่วนมีค่า 2,400 ÷ 12 = 200 บาท ทีมทาสีได้ 3 ส่วน คือ 600 บาท ใช้ไป \\frac{2}{3} ของ 600 บาท คือ 400 บาท จึงเหลือเงิน 600 − 400 = 200 บาท`},distractorNotes:{A:{en:`600 baht is the Painting team's full share before any spending, forgetting to subtract the cost of the paintbrushes.`,th:`600 บาท คือส่วนแบ่งทั้งหมดของทีมทาสีก่อนใช้จ่าย ซึ่งลืมหักค่าแปรงทาสีที่ซื้อไปออก`},B:{en:`400 baht is the amount the Painting team SPENT, not the amount left over — this answers the wrong quantity.`,th:`400 บาท คือจำนวนเงินที่ทีมทาสีใช้ไป ไม่ใช่จำนวนเงินที่เหลือ ตอบผิดปริมาณที่โจทย์ถาม`},C:{en:`This uses an incorrect total of 8 parts instead of the correct 12 parts (5+4+3), giving the wrong baht-per-part value before finding the Painting team's remaining money.`,th:`ค่านี้เกิดจากการใช้ผลรวมอัตราส่วนผิดเป็น 8 ส่วน แทนที่จะเป็น 12 ส่วน (5+4+3) ทำให้ได้มูลค่าต่อส่วนผิดตั้งแต่ต้น`}},hints:[{en:`First find the total number of ratio parts, then the baht value of one part.`,th:`หาผลรวมของอัตราส่วนก่อน แล้วจึงหามูลค่าเงินของหนึ่งส่วน`},{en:`Use the ratio to find the Painting team's full share before any money is spent.`,th:`ใช้อัตราส่วนหาส่วนแบ่งเต็มของทีมทาสีก่อนที่จะมีการใช้จ่ายเงินใดๆ`},{en:`Subtract the \\frac{2}{3} spent on paintbrushes from the Painting team's full share to find what remains.`,th:`นำเงินที่ใช้ไป \\frac{2}{3} ของส่วนแบ่ง ไปลบออกจากส่วนแบ่งเต็มของทีมทาสี เพื่อหาจำนวนเงินที่เหลือ`}],visual:null,estimatedSeconds:85},{id:`E-09`,testId:`stw-mock-e`,number:9,skill:`Geometry & Angles`,topic:{en:`Exterior Angle of a Triangle`,th:`มุมภายนอกของรูปสามเหลี่ยม`},difficulty:F(9),prompt:{en:`The diagram shows two straight paths, PQ and RS, running parallel to each other through a community park. A third path connects point A on PQ to point B on RS, and another connects point C on PQ to point B, forming triangle ABC. Angle BAC = 50° and the exterior angle at C (between CB and line PQ extended beyond C) is 125°. What is the size of angle ABC?`,th:`ในรูปด้านล่าง เส้นทางตรงสองเส้น PQ และ RS ขนานกันผ่านสวนสาธารณะแห่งหนึ่ง มีเส้นทางเชื่อมจากจุด A บนเส้น PQ ไปยังจุด B บนเส้น RS และอีกเส้นทางหนึ่งเชื่อมจากจุด C บนเส้น PQ ไปยังจุด B เกิดเป็นรูปสามเหลี่ยม ABC มุม BAC เท่ากับ 50° และมุมภายนอกที่จุด C (ระหว่าง CB กับเส้น PQ ที่ลากต่อออกไปเลยจุด C) เท่ากับ 125° มุม ABC มีขนาดเท่าใด`},options:[{id:`A`,label:{en:`75°`,th:`75°`}},{id:`B`,label:{en:`55°`,th:`55°`}},{id:`C`,label:{en:`105°`,th:`105°`}},{id:`D`,label:{en:`5°`,th:`5°`}}],correctOptionId:`A`,explanation:{en:`By the exterior angle theorem, the exterior angle of a triangle equals the sum of the two remote interior angles: 125° = angle BAC + angle ABC = 50° + angle ABC. So angle ABC = 125° − 50° = 75°.`,th:`ตามทฤษฎีมุมภายนอกของรูปสามเหลี่ยม มุมภายนอกมีค่าเท่ากับผลรวมของมุมภายในที่ไม่ประชิดกันสองมุม นั่นคือ 125° = มุม BAC + มุม ABC = 50° + มุม ABC ดังนั้นมุม ABC = 125° − 50° = 75°`},distractorNotes:{B:{en:`This is the interior angle at C (180° − 125° = 55°), mistaken for angle ABC.`,th:`ค่านี้คือมุมภายในที่จุด C (180° − 125° = 55°) ซึ่งเข้าใจผิดว่าเป็นมุม ABC`},C:{en:`This is the supplementary angle of the correct answer (180° − 75° = 105°), as if angle ABC were measured on the straight line at B instead of inside the triangle.`,th:`ค่านี้คือมุมประกอบมุมตรงของคำตอบที่ถูกต้อง (180° − 75° = 105°) เหมือนวัดมุม ABC บนเส้นตรงที่จุด B แทนที่จะวัดมุมภายในสามเหลี่ยม`},D:{en:`This comes from wrongly treating 125° as an interior angle of the triangle and using the angle sum 180° − 50° − 125° = 5°.`,th:`ค่านี้เกิดจากการเข้าใจผิดว่า 125° เป็นมุมภายในของสามเหลี่ยม แล้วใช้ผลรวมมุม 180° − 50° − 125° = 5°`}},hints:[{en:`Angle ABC is inside the triangle — think about how the marked exterior angle at C relates to the triangle's interior angles.`,th:`มุม ABC เป็นมุมภายในสามเหลี่ยม ลองคิดว่ามุมภายนอกที่จุด C สัมพันธ์กับมุมภายในของสามเหลี่ยมอย่างไร`},{en:`Recall the exterior angle theorem: an exterior angle of a triangle equals the sum of the two interior angles not next to it.`,th:`ทบทวนทฤษฎีมุมภายนอก: มุมภายนอกของสามเหลี่ยมมีค่าเท่ากับผลรวมของมุมภายในสองมุมที่ไม่ประชิดกับมันเลย`},{en:`Subtract the given 50° angle from the 125° exterior angle to find angle ABC.`,th:`นำมุม 50° ที่โจทย์ให้ไปลบออกจากมุมภายนอก 125° เพื่อหามุม ABC`}],visual:{kind:`geometryFigure`,width:320,height:170,segments:[{x1:20,y1:40,x2:300,y2:40,ticks:1},{x1:20,y1:131,x2:300,y2:131,ticks:1},{x1:90,y1:40,x2:166,y2:131},{x1:230,y1:40,x2:166,y2:131}],points:[{x:90,y:40,label:`A`,labelOffset:[-4,-12]},{x:230,y:40,label:`C`,labelOffset:[4,-12]},{x:166,y:131,label:`B`,labelOffset:[0,18]}],labels:[{x:12,y:34,text:`P`},{x:308,y:34,text:`Q`},{x:12,y:145,text:`R`},{x:308,y:145,text:`S`}],angleMarks:[{x:90,y:40,fromDeg:-50,toDeg:0,label:`50°`,radius:22},{x:230,y:40,fromDeg:-125,toDeg:0,label:`125°`,radius:22},{x:166,y:131,fromDeg:55,toDeg:130,label:`?`,radius:20,color:`var(--navy)`}],alt:{en:`Triangle ABC with vertices A and C on parallel line PQ and vertex B on parallel line RS; a 50° angle is marked at A and a 125° exterior angle at C, with a question mark marking the unknown angle at B.`,th:`รูปสามเหลี่ยม ABC โดยจุด A และ C อยู่บนเส้นขนาน PQ และจุด B อยู่บนเส้นขนาน RS มีมุม 50° ที่จุด A และมุมภายนอก 125° ที่จุด C ส่วนมุมที่จุด B ทำเครื่องหมายคำถามไว้`}},estimatedSeconds:90},{id:`E-10`,testId:`stw-mock-e`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Equal Volumes, Different Radii`,th:`ปริมาตรเท่ากัน รัศมีต่างกัน`},difficulty:F(10),prompt:{en:`Two cylindrical rain barrels at a community garden hold the same volume of water. Barrel A has a base radius of 4 dm and a height of 18 dm. Barrel B has a base radius of 6 dm. What is the height of Barrel B?`,th:`ถังเก็บน้ำฝนทรงกระบอกสองใบในสวนชุมชนบรรจุน้ำปริมาตรเท่ากัน ถัง A มีรัศมีฐาน 4 เดซิเมตร สูง 18 เดซิเมตร ถัง B มีรัศมีฐาน 6 เดซิเมตร ถัง B สูงเท่าใด`},options:[{id:`A`,label:{en:`12 dm`,th:`12 เดซิเมตร`}},{id:`B`,label:{en:`40.5 dm`,th:`40.5 เดซิเมตร`}},{id:`C`,label:{en:`8 dm`,th:`8 เดซิเมตร`}},{id:`D`,label:{en:`27 dm`,th:`27 เดซิเมตร`}}],correctOptionId:`C`,explanation:{en:`Equal volume means πr₁²h₁ = πr₂²h₂, so 4² × 18 = 6² × h_B, giving 16 × 18 = 36 × h_B, so 288 = 36 × h_B and h_B = 8 dm.`,th:`ปริมาตรเท่ากันหมายความว่า πr₁²h₁ = πr₂²h₂ ดังนั้น 4² × 18 = 6² × h_B จะได้ 16 × 18 = 36 × h_B หรือ 288 = 36 × h_B ดังนั้น h_B = 8 เดซิเมตร`},distractorNotes:{A:{en:`This uses the plain radius ratio instead of the squared radius ratio: 18 × (4÷6) = 12, forgetting that volume depends on radius SQUARED.`,th:`ค่านี้เกิดจากการใช้อัตราส่วนของรัศมีตรงๆ แทนที่จะยกกำลังสอง คือ 18 × (4÷6) = 12 ซึ่งลืมว่าปริมาตรขึ้นกับรัศมี "ยกกำลังสอง"`},B:{en:`This uses the squared radius ratio but inverted (radius of B squared over radius of A squared): 18 × (36÷16) = 40.5, instead of the correct direction (16÷36).`,th:`ค่านี้เกิดจากการใช้อัตราส่วนรัศมียกกำลังสองแบบกลับด้าน คือ 18 × (36÷16) = 40.5 แทนที่จะเป็นทิศทางที่ถูกต้อง (16÷36)`},D:{en:`This uses the plain radius ratio inverted: 18 × (6÷4) = 27.`,th:`ค่านี้เกิดจากการใช้อัตราส่วนของรัศมีตรงๆ แบบกลับด้าน คือ 18 × (6÷4) = 27`}},hints:[{en:`The volume of a cylinder depends on the radius squared, not just the radius.`,th:`ปริมาตรของทรงกระบอกขึ้นอยู่กับรัศมี "ยกกำลังสอง" ไม่ใช่รัศมีเฉยๆ`},{en:`Set up r₁² × h₁ = r₂² × h₂ using the two radii and the known height of Barrel A.`,th:`ตั้งสมการ r₁² × h₁ = r₂² × h₂ โดยใช้รัศมีทั้งสองและความสูงที่ทราบของถัง A`},{en:`Substitute 4² × 18 = 6² × h_B, simplify both sides, then divide to solve for h_B.`,th:`แทนค่า 4² × 18 = 6² × h_B ทำให้ทั้งสองข้างง่ายขึ้น แล้วหารเพื่อแก้หาค่า h_B`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:8,height:18,label:`A`},{baseSide:12,height:8,heightLabel:`h`,label:`B`}],alt:{en:`Two cylindrical rain barrels, A and B, holding equal volumes of water; Barrel A has base radius 4 dm and height 18 dm, Barrel B has base radius 6 dm and an unlabeled height h.`,th:`ถังเก็บน้ำฝนทรงกระบอกสองใบ A และ B บรรจุน้ำปริมาตรเท่ากัน ถัง A มีรัศมีฐาน 4 เดซิเมตร สูง 18 เดซิเมตร ถัง B มีรัศมีฐาน 6 เดซิเมตร และความสูง h ที่ยังไม่ทราบค่า`}},estimatedSeconds:95},{id:`E-11`,testId:`stw-mock-e`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area (Rectangle Minus Corners)`,th:`พื้นที่รูปประกอบ (สี่เหลี่ยมตัดมุม)`},difficulty:F(11),prompt:{en:`A rectangular plot of community garden land measures 20 m by 14 m. Two triangular corners are cut off to make room for footpaths: a right-triangle corner with legs 6 m and 4 m, and another with legs 8 m and 5 m (as shown, shaded). What is the area of the remaining shaded plot?`,th:`ที่ดินสวนชุมชนรูปสี่เหลี่ยมผืนผ้าขนาด 20 เมตร คูณ 14 เมตร ถูกตัดมุมออกสองมุมเพื่อทำทางเดิน โดยมุมหนึ่งเป็นรูปสามเหลี่ยมมุมฉากด้านประกอบมุมฉากยาว 6 เมตร และ 4 เมตร ส่วนอีกมุมหนึ่งยาว 8 เมตร และ 5 เมตร (ดังรูป พื้นที่แรเงา) พื้นที่ที่ดินส่วนที่เหลือ (แรเงา) มีค่าเท่าใด`},options:[{id:`A`,label:{en:`280 m²`,th:`280 ตารางเมตร`}},{id:`B`,label:{en:`260 m²`,th:`260 ตารางเมตร`}},{id:`C`,label:{en:`236 m²`,th:`236 ตารางเมตร`}},{id:`D`,label:{en:`248 m²`,th:`248 ตารางเมตร`}}],correctOptionId:`D`,explanation:{en:`The full rectangle is 20 × 14 = 280 m². The first cut-off triangle has area (6 × 4) ÷ 2 = 12 m², and the second has area (8 × 5) ÷ 2 = 20 m². The remaining shaded area is 280 − 12 − 20 = 248 m².`,th:`พื้นที่สี่เหลี่ยมผืนผ้าเต็มคือ 20 × 14 = 280 ตารางเมตร รูปสามเหลี่ยมมุมแรกที่ตัดออกมีพื้นที่ (6 × 4) ÷ 2 = 12 ตารางเมตร และรูปที่สองมีพื้นที่ (8 × 5) ÷ 2 = 20 ตารางเมตร พื้นที่ส่วนที่เหลือ (แรเงา) คือ 280 − 12 − 20 = 248 ตารางเมตร`},distractorNotes:{A:{en:`280 m² is the full rectangle area with the two corner triangles never subtracted at all.`,th:`280 ตารางเมตร คือพื้นที่สี่เหลี่ยมผืนผ้าเต็ม โดยยังไม่ได้ลบพื้นที่รูปสามเหลี่ยมทั้งสองมุมออกเลย`},B:{en:`This only subtracts the larger triangle (280 − 20 = 260), forgetting the smaller 6 m by 4 m corner.`,th:`ค่านี้ลบเฉพาะรูปสามเหลี่ยมมุมใหญ่ (280 − 20 = 260) โดยลืมลบมุมเล็กขนาด 6 เมตร คูณ 4 เมตรออกไปด้วย`},C:{en:`This subtracts both triangles but forgets to halve one of them, using the full rectangle 6 × 4 = 24 instead of the triangle area 12: 280 − 24 − 20 = 236.`,th:`ค่านี้ลบรูปสามเหลี่ยมทั้งสองมุม แต่ลืมหารครึ่งมุมหนึ่ง โดยใช้พื้นที่สี่เหลี่ยมเต็ม 6 × 4 = 24 แทนที่จะเป็นพื้นที่สามเหลี่ยม 12 คือ 280 − 24 − 20 = 236`}},hints:[{en:`Start by finding the area of the full rectangle before any corners are cut off.`,th:`เริ่มจากหาพื้นที่สี่เหลี่ยมผืนผ้าเต็มก่อนที่จะตัดมุมใดๆ ออก`},{en:`Each cut-off corner is a right triangle — remember its area is half of base times height.`,th:`มุมที่ถูกตัดออกแต่ละมุมเป็นรูปสามเหลี่ยมมุมฉาก อย่าลืมว่าพื้นที่คือครึ่งหนึ่งของฐานคูณสูง`},{en:`Subtract both triangle areas from the full rectangle area to get the shaded remainder.`,th:`นำพื้นที่สามเหลี่ยมทั้งสองรูปไปลบออกจากพื้นที่สี่เหลี่ยมผืนผ้าเต็ม จะได้พื้นที่ส่วนที่เหลือ (แรเงา)`}],visual:{kind:`geometryFigure`,width:200,height:140,showGrid:!0,gridStep:20,polygons:[{points:[[60,0],[200,0],[200,90],[120,140],[0,140],[0,40]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:200,y2:0,style:`dashed`},{x1:200,y1:0,x2:200,y2:140,style:`dashed`},{x1:0,y1:140,x2:200,y2:140,style:`dashed`},{x1:0,y1:0,x2:0,y2:140,style:`dashed`}],labels:[{x:100,y:-12,text:`20 m`,bold:!0},{x:-16,y:70,text:`14 m`,bold:!0},{x:30,y:-10,text:`6 m`},{x:-14,y:20,text:`4 m`},{x:160,y:152,text:`8 m`},{x:214,y:115,text:`5 m`}],alt:{en:`A 20 m by 14 m rectangular plot with a 6 m by 4 m triangle cut from the top-left corner and an 8 m by 5 m triangle cut from the bottom-right corner; the remaining hexagon-shaped plot is shaded.`,th:`พื้นที่สี่เหลี่ยมผืนผ้าขนาด 20 เมตร คูณ 14 เมตร ถูกตัดมุมบนซ้ายออกเป็นรูปสามเหลี่ยมขนาด 6 เมตร คูณ 4 เมตร และตัดมุมล่างขวาออกเป็นรูปสามเหลี่ยมขนาด 8 เมตร คูณ 5 เมตร พื้นที่รูปหกเหลี่ยมที่เหลือแรเงาไว้`}},estimatedSeconds:100},{id:`E-12`,testId:`stw-mock-e`,number:12,skill:`Geometry & Angles`,topic:{en:`Zigzag Transversal Between Parallel Lines`,th:`เส้นตัดหักมุมระหว่างเส้นขนาน`},difficulty:F(12),prompt:{en:`In the diagram, road PQ is parallel to road RS. A delivery path bends at point M, connecting point A on PQ to point B on RS. The angle at the bend, angle AMB, is 95°. If angle QAM = (3x + 5)° and angle SBM = (2x + 15)°, find the value of angle SBM.`,th:`ในรูปด้านล่าง ถนน PQ ขนานกับถนน RS เส้นทางส่งของหักมุมที่จุด M เชื่อมจุด A บนถนน PQ กับจุด B บนถนน RS มุมที่จุดหักมุม คือมุม AMB เท่ากับ 95° ถ้ามุม QAM = (3x + 5)° และมุม SBM = (2x + 15)° จงหาค่าของมุม SBM`},options:[{id:`A`,label:{en:`50°`,th:`50°`}},{id:`B`,label:{en:`15°`,th:`15°`}},{id:`C`,label:{en:`35°`,th:`35°`}},{id:`D`,label:{en:`45°`,th:`45°`}}],correctOptionId:`D`,explanation:{en:`Drawing a line through M parallel to PQ and RS splits angle AMB into two alternate-interior angles equal to angle QAM and angle SBM. So (3x+5) + (2x+15) = 95, giving 5x + 20 = 95, so 5x = 75 and x = 15. Then angle SBM = 2(15) + 15 = 45°.`,th:`เมื่อลากเส้นผ่านจุด M ขนานกับ PQ และ RS จะแบ่งมุม AMB ออกเป็นมุมแย้งสองมุมที่เท่ากับมุม QAM และมุม SBM ตามลำดับ ดังนั้น (3x+5) + (2x+15) = 95 จะได้ 5x + 20 = 95 หรือ 5x = 75 ดังนั้น x = 15 แล้วมุม SBM = 2(15) + 15 = 45°`},distractorNotes:{A:{en:`50° is the value of angle QAM (3×15+5), not angle SBM — the question asked for the wrong angle.`,th:`50° คือค่าของมุม QAM (3×15+5) ไม่ใช่มุม SBM ตอบผิดมุมที่โจทย์ถาม`},B:{en:`15° is the value of x itself, mistaken for the angle SBM.`,th:`15° คือค่าของ x เอง ซึ่งเข้าใจผิดว่าเป็นมุม SBM`},C:{en:`This comes from wrongly assuming the two expressions are equal to each other, solving 3x+5 = 2x+15 to get x = 10, then 2(10)+15 = 35.`,th:`ค่านี้เกิดจากการเข้าใจผิดว่านิพจน์ทั้งสองมีค่าเท่ากัน โดยตั้งสมการ 3x+5 = 2x+15 ได้ x = 10 แล้วคำนวณ 2(10)+15 = 35`}},hints:[{en:`Imagine drawing an extra line through the bend point M, parallel to both roads.`,th:`ลองจินตนาการว่าลากเส้นเพิ่มผ่านจุดหักมุม M ให้ขนานกับถนนทั้งสองเส้น`},{en:`That extra line splits the 95° bend angle into two parts equal to angle QAM and angle SBM (alternate angles).`,th:`เส้นที่ลากเพิ่มนั้นจะแบ่งมุมหักมุม 95° ออกเป็นสองส่วนที่เท่ากับมุม QAM และมุม SBM (มุมแย้ง)`},{en:`Add the two expressions and set the sum equal to 95° to solve for x, then substitute x back into the SBM expression.`,th:`นำนิพจน์ทั้งสองมาบวกกันแล้วให้เท่ากับ 95° เพื่อแก้หาค่า x จากนั้นแทนค่า x กลับเข้าไปในนิพจน์ของมุม SBM`}],visual:{kind:`geometryFigure`,width:260,height:210,segments:[{x1:20,y1:30,x2:240,y2:30,ticks:1},{x1:20,y1:190,x2:240,y2:190,ticks:1},{x1:93,y1:30,x2:160,y2:110},{x1:160,y1:110,x2:80,y2:190}],points:[{x:93,y:30,label:`A`,labelOffset:[-4,-12]},{x:80,y:190,label:`B`,labelOffset:[-14,14]},{x:160,y:110,label:`M`,labelOffset:[10,-4]}],labels:[{x:12,y:24,text:`P`},{x:248,y:24,text:`Q`},{x:12,y:200,text:`R`},{x:248,y:200,text:`S`}],angleMarks:[{x:93,y:30,fromDeg:-50,toDeg:0,label:`(3x+5)°`,radius:20},{x:80,y:190,fromDeg:0,toDeg:45,label:`(2x+15)°`,radius:20},{x:160,y:110,fromDeg:130,toDeg:225,label:`95°`,radius:24,color:`var(--navy)`}],alt:{en:`A bent path from point A on parallel road PQ to point B on parallel road RS, bending at point M; the angle at A is (3x+5)°, the angle at B is (2x+15)°, and the angle at the bend M is 95°.`,th:`เส้นทางหักมุมจากจุด A บนถนนขนาน PQ ไปยังจุด B บนถนนขนาน RS โดยหักมุมที่จุด M มุมที่จุด A เท่ากับ (3x+5)° มุมที่จุด B เท่ากับ (2x+15)° และมุมที่จุด M เท่ากับ 95°`}},estimatedSeconds:110},{id:`E-13`,testId:`stw-mock-e`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Ratio of Radii from Ring Area`,th:`อัตราส่วนรัศมีจากพื้นที่วงแหวน`},difficulty:F(13),prompt:{en:`A circular fountain is surrounded by a paved ring, as shown. The area of the paved ring is 8 times the area of the circular fountain. What is the ratio of the outer radius to the inner radius?`,th:`น้ำพุทรงกลมแห่งหนึ่งล้อมรอบด้วยทางเดินปูพื้นเป็นวงแหวน ดังรูป พื้นที่ของทางเดินวงแหวนมีค่าเป็น 8 เท่าของพื้นที่น้ำพุ อัตราส่วนของรัศมีวงนอกต่อรัศมีวงในเป็นเท่าใด`},options:[{id:`A`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`B`,label:{en:`9 : 1`,th:`9 : 1`}},{id:`C`,label:{en:`2 : 1`,th:`2 : 1`}},{id:`D`,label:{en:`8 : 1`,th:`8 : 1`}}],correctOptionId:`A`,explanation:{en:`Let the inner radius be r and outer radius R. The ring area is π(R² − r²) = 8 × πr², so R² − r² = 8r², giving R² = 9r². Taking the square root, R = 3r, so the ratio R : r = 3 : 1.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R พื้นที่วงแหวนคือ π(R² − r²) = 8 × πr² ดังนั้น R² − r² = 8r² จะได้ R² = 9r² ถอดรากที่สองได้ R = 3r ดังนั้นอัตราส่วน R : r = 3 : 1`},distractorNotes:{B:{en:`This correctly finds R² = 9r² but stops there, reporting the ratio of the AREAS instead of taking the square root to get the ratio of the RADII.`,th:`ค่านี้หา R² = 9r² ได้ถูกต้อง แต่หยุดตรงนั้น รายงานอัตราส่วนของ "พื้นที่" แทนที่จะถอดรากที่สองเพื่อหาอัตราส่วนของ "รัศมี"`},C:{en:`This comes from an arithmetic slip that halves the multiplier before solving, treating the relationship as R² − r² = 4r² instead of 8r², giving R² = 5r² rounded down to a clean 4r² → R = 2r.`,th:`ค่านี้เกิดจากการคำนวณผิดพลาดโดยลดตัวคูณลงครึ่งหนึ่งก่อนแก้สมการ กลายเป็น R² − r² = 4r² แทนที่จะเป็น 8r² ทำให้ได้ R = 2r`},D:{en:`This sets up R² = 8r² directly, forgetting that the ring's area is the OUTER circle's area minus the INNER circle's area, not the outer area alone.`,th:`ค่านี้ตั้งสมการ R² = 8r² โดยตรง ซึ่งลืมไปว่าพื้นที่วงแหวนคือพื้นที่วงนอก "ลบ" พื้นที่วงใน ไม่ใช่พื้นที่วงนอกเพียงอย่างเดียว`}},hints:[{en:`The paved ring is the outer circle's area with the inner circle's area removed.`,th:`ทางเดินวงแหวนคือพื้นที่วงนอกที่หักพื้นที่วงในออกไปแล้ว`},{en:`Write the ring's area as π(R² − r²) and set it equal to 8 times the inner circle's area, πr².`,th:`เขียนพื้นที่วงแหวนเป็น π(R² − r²) แล้วให้เท่ากับ 8 เท่าของพื้นที่วงใน คือ πr²`},{en:`Simplify to find R² in terms of r², then take the square root of both sides to get the ratio of R to r.`,th:`ทำสมการให้ง่ายขึ้นเพื่อหา R² ในรูปของ r² แล้วถอดรากที่สองทั้งสองข้างเพื่อหาอัตราส่วนของ R ต่อ r`}],visual:{kind:`concentricCircles`,outerRadius:12,innerRadius:4,alt:{en:`Two concentric circles: an inner circle representing a fountain, surrounded by an outer ring representing a paved path.`,th:`วงกลมสองวงที่มีจุดศูนย์กลางเดียวกัน วงในแทนน้ำพุ ล้อมรอบด้วยวงแหวนด้านนอกแทนทางเดินปูพื้น`}},estimatedSeconds:105},{id:`E-14`,testId:`stw-mock-e`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Leaf-Shaped Area from Quarter Circles`,th:`พื้นที่รูปใบไม้จากเสี้ยววงกลม`},difficulty:F(14),prompt:{en:`A square tile has side length 14 cm. Two quarter-circle arcs are drawn, each centred at opposite corners with radius equal to the side length, creating a shaded leaf-shaped design in the middle (as shown). What is the area of the shaded leaf shape? (Use π ≈ \\frac{22}{7}.)`,th:`กระเบื้องสี่เหลี่ยมจัตุรัสแผ่นหนึ่งมีด้านยาว 14 เซนติเมตร มีการลากเสี้ยววงกลมสองเสี้ยว โดยแต่ละเสี้ยวมีจุดศูนย์กลางอยู่ที่มุมตรงข้ามกันและมีรัศมีเท่ากับความยาวด้าน เกิดเป็นลวดลายรูปใบไม้แรเงาตรงกลาง (ดังรูป) พื้นที่รูปใบไม้ที่แรเงาไว้มีค่าเท่าใด (กำหนด π ≈ \\frac{22}{7})`},options:[{id:`A`,label:{en:`42 cm²`,th:`42 ตารางเซนติเมตร`}},{id:`B`,label:{en:`112 cm²`,th:`112 ตารางเซนติเมตร`}},{id:`C`,label:{en:`154 cm²`,th:`154 ตารางเซนติเมตร`}},{id:`D`,label:{en:`196 cm²`,th:`196 ตารางเซนติเมตร`}}],correctOptionId:`B`,explanation:{en:`Each quarter circle has area \\frac{1}{4} × \\frac{22}{7} × 14² = \\frac{1}{4} × \\frac{22}{7} × 196 = 154 cm². The leaf shape is the overlap of the two quarter circles: adding both quarter circles (2 × 154 = 308) counts the square's area twice over the leaf and once over the rest, so the leaf area is 308 − 196 = 112 cm².`,th:`เสี้ยววงกลมแต่ละเสี้ยวมีพื้นที่ \\frac{1}{4} × \\frac{22}{7} × 14² = \\frac{1}{4} × \\frac{22}{7} × 196 = 154 ตารางเซนติเมตร รูปใบไม้คือส่วนที่เสี้ยววงกลมทั้งสองซ้อนทับกัน เมื่อนำพื้นที่เสี้ยวทั้งสองมาบวกกัน (2 × 154 = 308) จะนับพื้นที่สี่เหลี่ยมจัตุรัสซ้ำสองครั้งในส่วนใบไม้ ดังนั้นพื้นที่ใบไม้คือ 308 − 196 = 112 ตารางเซนติเมตร`},distractorNotes:{A:{en:`This is the square's area minus just ONE quarter circle (196 − 154 = 42), which is the region outside one arc, not the leaf-shaped overlap of both arcs.`,th:`ค่านี้คือพื้นที่สี่เหลี่ยมจัตุรัสลบเสี้ยววงกลมเพียงเสี้ยวเดียว (196 − 154 = 42) ซึ่งเป็นพื้นที่นอกเสี้ยวหนึ่งเสี้ยว ไม่ใช่พื้นที่ใบไม้ที่เกิดจากการซ้อนทับของทั้งสองเสี้ยว`},C:{en:`This is the area of just ONE quarter circle (154 cm²), forgetting there are two arcs and forgetting to subtract the square's area to isolate the overlap.`,th:`ค่านี้คือพื้นที่ของเสี้ยววงกลมเพียงเสี้ยวเดียว (154 ตารางเซนติเมตร) ซึ่งลืมว่ามีเสี้ยวสองเสี้ยว และลืมลบพื้นที่สี่เหลี่ยมจัตุรัสเพื่อหาส่วนที่ซ้อนทับ`},D:{en:`This is simply the full square's area (14 × 14 = 196), ignoring the arcs entirely.`,th:`ค่านี้คือพื้นที่สี่เหลี่ยมจัตุรัสเต็มแผ่น (14 × 14 = 196) โดยไม่ได้คำนึงถึงเสี้ยววงกลมเลย`}},hints:[{en:`First find the area of just one quarter circle using the tile's side length as the radius.`,th:`หาพื้นที่ของเสี้ยววงกลมหนึ่งเสี้ยวก่อน โดยใช้ความยาวด้านของกระเบื้องเป็นรัศมี`},{en:`The leaf shape is where the two quarter circles overlap — adding both quarter-circle areas double-counts the square once.`,th:`รูปใบไม้คือส่วนที่เสี้ยววงกลมทั้งสองซ้อนทับกัน การนำพื้นที่เสี้ยวทั้งสองมาบวกกันจะนับพื้นที่สี่เหลี่ยมจัตุรัสซ้ำหนึ่งครั้ง`},{en:`Add the two quarter-circle areas together, then subtract the square's area once to leave just the leaf.`,th:`นำพื้นที่เสี้ยววงกลมทั้งสองมาบวกกัน แล้วลบพื้นที่สี่เหลี่ยมจัตุรัสออกหนึ่งครั้ง จะเหลือเฉพาะพื้นที่ใบไม้`}],visual:{kind:`leafShape`,width:14,height:14,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A 14 cm square tile with two quarter-circle arcs drawn from the top-left and bottom-right corners, forming a shaded leaf-shaped region in the middle.`,th:`กระเบื้องสี่เหลี่ยมจัตุรัสด้านยาว 14 เซนติเมตร มีเสี้ยววงกลมสองเสี้ยวลากจากมุมบนซ้ายและมุมล่างขวา เกิดเป็นรูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:115},{id:`E-15`,testId:`stw-mock-e`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Fraction Remaining`,th:`เศษส่วนของเศษส่วนที่เหลือ`},difficulty:F(15),prompt:{en:`A community center's water tank holds 80 litres when full. In the morning, \\frac{2}{5} of the water is used for cleaning. In the afternoon, \\frac{3}{8} of the water that remained is used for watering the garden. How many litres of water are left at the end of the day?`,th:`ถังน้ำของศูนย์ชุมชนแห่งหนึ่งจุน้ำได้ 80 ลิตรเมื่อเต็มถัง ในตอนเช้ามีการใช้น้ำไป \\frac{2}{5} ของทั้งหมดเพื่อทำความสะอาด ในตอนบ่ายมีการใช้น้ำที่เหลืออยู่ไปอีก \\frac{3}{8} เพื่อรดน้ำต้นไม้ เมื่อสิ้นวันเหลือน้ำอยู่กี่ลิตร`},options:[{id:`A`,label:{en:`18 litres`,th:`18 ลิตร`}},{id:`B`,label:{en:`30 litres`,th:`30 ลิตร`}},{id:`C`,label:{en:`48 litres`,th:`48 ลิตร`}},{id:`D`,label:{en:`50 litres`,th:`50 ลิตร`}}],correctOptionId:`B`,explanation:{en:`In the morning, \\frac{2}{5} × 80 = 32 litres are used, leaving 80 − 32 = 48 litres. In the afternoon, \\frac{3}{8} × 48 = 18 litres are used, leaving 48 − 18 = 30 litres at the end of the day.`,th:`ตอนเช้าใช้น้ำไป \\frac{2}{5} × 80 = 32 ลิตร เหลือน้ำ 80 − 32 = 48 ลิตร ตอนบ่ายใช้น้ำที่เหลือไปอีก \\frac{3}{8} × 48 = 18 ลิตร จึงเหลือน้ำ 48 − 18 = 30 ลิตร เมื่อสิ้นวัน`},distractorNotes:{A:{en:`This mistakenly takes \\frac{3}{8} of the ORIGINAL 80 litres (getting 30) instead of the 48 litres that remained after the morning, then adds it to the morning amount used instead of subtracting properly, landing on the afternoon-used figure of 18.`,th:`ค่านี้เกิดจากการคิด \\frac{3}{8} ของน้ำเดิม 80 ลิตรโดยตรง แทนที่จะคิดจากน้ำ 48 ลิตรที่เหลือหลังตอนเช้า ทำให้สับสนจนได้ตัวเลขปริมาณน้ำที่ใช้ตอนบ่ายมาแทนคำตอบ`},C:{en:`This only subtracts the morning's usage (32 litres) from the full tank, forgetting the afternoon watering entirely.`,th:`ค่านี้ลบเฉพาะน้ำที่ใช้ตอนเช้า (32 ลิตร) ออกจากถังเต็ม โดยลืมน้ำที่ใช้รดต้นไม้ตอนบ่ายไปเลย`},D:{en:`This adds the two amounts of water USED (32 + 18 = 50) instead of subtracting them from the full tank to find what is left.`,th:`ค่านี้นำปริมาณน้ำที่ "ใช้ไป" ทั้งสองช่วงมาบวกกัน (32 + 18 = 50) แทนที่จะนำไปลบออกจากน้ำเต็มถังเพื่อหาปริมาณที่เหลือ`}},hints:[{en:`Work out the morning and afternoon separately, one step at a time.`,th:`คำนวณตอนเช้าและตอนบ่ายแยกกัน ทีละขั้นตอน`},{en:`The afternoon fraction is taken from the water that REMAINED after the morning, not from the original 80 litres.`,th:`เศษส่วนตอนบ่ายคิดจากน้ำที่ "เหลืออยู่" หลังตอนเช้า ไม่ใช่คิดจากน้ำเดิม 80 ลิตร`},{en:`Find how much is left after the morning first, then take \\frac{3}{8} of that new amount for the afternoon, and subtract again.`,th:`หาน้ำที่เหลือหลังตอนเช้าก่อน แล้วจึงคิด \\frac{3}{8} ของน้ำที่เหลือนั้นสำหรับตอนบ่าย แล้วลบออกอีกครั้ง`}],visual:null,estimatedSeconds:100},{id:`E-16`,testId:`stw-mock-e`,number:16,skill:`Algebra & Patterns`,topic:{en:`Area Equation for a Cut-Corner Shape`,th:`สมการพื้นที่รูปตัดมุม`},difficulty:F(16),prompt:{en:`For the school poster fair, Ploy cuts a square cardboard sheet with side length 18 cm. She cuts off each of the four corners as a congruent right-triangle notch, with both legs of every notch measuring x cm (as shown), leaving an octagon-shaped poster with area 252 cm². What is the value of x?`,th:`สำหรับงานนิทรรศการโปสเตอร์ของโรงเรียน พลอยตัดแผ่นกระดาษแข็งรูปสี่เหลี่ยมจัตุรัสด้านยาว 18 เซนติเมตร โดยตัดมุมทั้งสี่มุมออกเป็นรูปสามเหลี่ยมมุมฉากที่เท่ากันทุกมุม ซึ่งแต่ละมุมมีด้านประกอบมุมฉากยาว x เซนติเมตรเท่ากัน (ดังรูป) เหลือเป็นโปสเตอร์รูปแปดเหลี่ยมมีพื้นที่ 252 ตารางเซนติเมตร ค่าของ x เท่ากับเท่าใด`},options:[{id:`A`,label:{en:`3 cm`,th:`3 เซนติเมตร`}},{id:`B`,label:{en:`6 cm`,th:`6 เซนติเมตร`}},{id:`C`,label:{en:`12 cm`,th:`12 เซนติเมตร`}},{id:`D`,label:{en:`18 cm`,th:`18 เซนติเมตร`}}],correctOptionId:`B`,explanation:{en:`The square's area is 18² = 324 cm². Each corner triangle has area \\frac{x²}{2}, and there are 4 corners, so the total area removed is 4 × \\frac{x²}{2} = 2x². This gives 324 − 2x² = 252, so 2x² = 72, x² = 36, and x = 6 cm.`,th:`พื้นที่สี่เหลี่ยมจัตุรัสคือ 18² = 324 ตารางเซนติเมตร รูปสามเหลี่ยมมุมหนึ่งมีพื้นที่ \\frac{x²}{2} และมีทั้งหมด 4 มุม ดังนั้นพื้นที่ที่ถูกตัดออกทั้งหมดคือ 4 × \\frac{x²}{2} = 2x² จะได้ 324 − 2x² = 252 ดังนั้น 2x² = 72 หรือ x² = 36 นั่นคือ x = 6 เซนติเมตร`},distractorNotes:{A:{en:`This takes half of the correct answer, as if mis-simplifying √36 as 6 ÷ 2 instead of correctly evaluating it as 6.`,th:`ค่านี้เกิดจากการนำคำตอบที่ถูกต้องมาหารครึ่งอย่างผิดพลาด เหมือนตีความ √36 ว่าเป็น 6 ÷ 2 แทนที่จะได้ 6 โดยตรง`},C:{en:`This comes from forgetting that all FOUR corners are cut, using only one triangle's area: 324 − \\frac{x²}{2} = 252, giving x² = 144 and x = 12.`,th:`ค่านี้เกิดจากการลืมว่าตัดมุมออกทั้ง 4 มุม โดยใช้พื้นที่สามเหลี่ยมเพียงมุมเดียว: 324 − \\frac{x²}{2} = 252 ทำให้ได้ x² = 144 และ x = 12`},D:{en:`This mistakenly gives the original square's side length (18 cm) instead of solving for the smaller notch length x.`,th:`ค่านี้ตอบความยาวด้านเดิมของสี่เหลี่ยมจัตุรัส (18 เซนติเมตร) โดยไม่ได้แก้สมการเพื่อหาความยาว x ที่เล็กกว่า`}},hints:[{en:`Start with the area of the whole square before any corners are cut.`,th:`เริ่มจากพื้นที่สี่เหลี่ยมจัตุรัสทั้งแผ่นก่อนตัดมุมใดๆ`},{en:`Each corner cut is a right triangle with both legs x, so its area is \\frac{x²}{2} — and there are 4 identical corners.`,th:`มุมที่ตัดออกแต่ละมุมเป็นสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว x ดังนั้นพื้นที่คือ \\frac{x²}{2} และมีมุมแบบนี้ทั้งหมด 4 มุม`},{en:`Set up: square area − 4 × (triangle area) = octagon area, then solve the equation for x.`,th:`ตั้งสมการ: พื้นที่สี่เหลี่ยมจัตุรัส − 4 × (พื้นที่สามเหลี่ยม) = พื้นที่แปดเหลี่ยม แล้วแก้สมการเพื่อหาค่า x`}],visual:{kind:`geometryFigure`,width:200,height:200,polygons:[{points:[[40,0],[160,0],[200,40],[200,160],[160,200],[40,200],[0,160],[0,40]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:200,y2:0,style:`dashed`},{x1:200,y1:0,x2:200,y2:200,style:`dashed`},{x1:200,y1:200,x2:0,y2:200,style:`dashed`},{x1:0,y1:200,x2:0,y2:0,style:`dashed`}],labels:[{x:100,y:-14,text:`18 cm`,bold:!0},{x:20,y:-12,text:`x`},{x:-14,y:20,text:`x`},{x:100,y:104,text:`Area = 252 cm²`,bold:!0}],alt:{en:`A square sheet with side 18 cm, dashed to show its original outline, with each of its four corners cut off as congruent right triangles with legs x cm (two are labeled), leaving a shaded octagon of area 252 cm² in the middle.`,th:`แผ่นกระดาษสี่เหลี่ยมจัตุรัสด้านยาว 18 เซนติเมตร (เส้นประแสดงรูปเดิม) ถูกตัดมุมทั้งสี่ออกเป็นรูปสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว x เซนติเมตรเท่ากัน (มีป้ายกำกับ x สองจุด) เหลือเป็นรูปแปดเหลี่ยมแรเงาตรงกลางมีพื้นที่ 252 ตารางเซนติเมตร`}},estimatedSeconds:130},{id:`E-17`,testId:`stw-mock-e`,number:17,skill:`Graphs & Data`,topic:{en:`Reading a Grouped Bar Chart`,th:`การอ่านกราฟแท่งเปรียบเทียบ`},difficulty:F(17),prompt:{en:`The bar chart shows the number of visitors at two community library branches, North and South, from May to August. Which statement below is INCORRECT?`,th:`กราฟแท่งด้านล่างแสดงจำนวนผู้ใช้บริการห้องสมุดชุมชนสองสาขา คือสาขาเหนือและสาขาใต้ ตั้งแต่เดือนพฤษภาคมถึงสิงหาคม ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Overall, North Branch had more total visitors than South Branch across the four months.`,th:`โดยรวมแล้ว สาขาเหนือมีผู้ใช้บริการรวมมากกว่าสาขาใต้ตลอดสี่เดือน`}},{id:`B`,label:{en:`South Branch had more visitors than North Branch in both May and August.`,th:`สาขาใต้มีผู้ใช้บริการมากกว่าสาขาเหนือทั้งในเดือนพฤษภาคมและเดือนสิงหาคม`}},{id:`C`,label:{en:`The difference between the two branches' visitor counts was greatest in August.`,th:`ผลต่างของจำนวนผู้ใช้บริการระหว่างสองสาขามีค่ามากที่สุดในเดือนสิงหาคม`}},{id:`D`,label:{en:`North Branch's visitor count increased every month from May to July.`,th:`จำนวนผู้ใช้บริการของสาขาเหนือเพิ่มขึ้นทุกเดือนตั้งแต่พฤษภาคมถึงกรกฎาคม`}}],correctOptionId:`A`,explanation:{en:`North Branch's total is 120+150+180+160 = 610, while South Branch's total is 140+130+170+190 = 630. South Branch actually had MORE total visitors, so the statement claiming North had more is incorrect. The other three statements all match the chart.`,th:`ผู้ใช้บริการรวมของสาขาเหนือคือ 120+150+180+160 = 610 คน ส่วนสาขาใต้คือ 140+130+170+190 = 630 คน ซึ่งสาขาใต้มีผู้ใช้บริการรวมมากกว่าจริง ดังนั้นข้อความที่บอกว่าสาขาเหนือมากกว่าจึงไม่ถูกต้อง ส่วนอีกสามข้อความตรงกับข้อมูลในกราฟ`},distractorNotes:{B:{en:`This statement is actually TRUE (May: 140>120, August: 190>160) — picking it means misreading the bar heights for May or August.`,th:`ข้อความนี้ถูกต้องจริง (พฤษภาคม: 140>120, สิงหาคม: 190>160) การเลือกข้อนี้แสดงว่าอ่านความสูงของแท่งกราฟเดือนพฤษภาคมหรือสิงหาคมผิด`},C:{en:`This statement is actually TRUE (the gap is 20, 20, 10, and 30 for May–August, so August has the largest gap) — picking it likely means comparing the wrong pair of months.`,th:`ข้อความนี้ถูกต้องจริง (ผลต่างคือ 20, 20, 10 และ 30 ในเดือนพฤษภาคมถึงสิงหาคม เดือนสิงหาคมมีผลต่างมากที่สุด) การเลือกข้อนี้แสดงว่าเปรียบเทียบเดือนผิดคู่`},D:{en:`This statement is actually TRUE for May–July (120→150→180 both increase); it only drops in August, which is outside the range the statement describes, so extending the comparison into August is a misreading of the claim.`,th:`ข้อความนี้ถูกต้องจริงสำหรับช่วงพฤษภาคมถึงกรกฎาคม (120→150→180 เพิ่มขึ้นทั้งคู่) ตัวเลขลดลงเฉพาะเดือนสิงหาคมซึ่งอยู่นอกช่วงที่ข้อความกล่าวถึง การขยายการเปรียบเทียบไปถึงเดือนสิงหาคมจึงเป็นการอ่านข้อความผิด`}},hints:[{en:`Check each statement against the chart one at a time — three of them are true.`,th:`ตรวจสอบข้อความแต่ละข้อกับกราฟทีละข้อ มีสามข้อที่ถูกต้อง`},{en:`For the statement about total visitors, you need to add up all four months for each branch and compare.`,th:`สำหรับข้อความเกี่ยวกับผู้ใช้บริการรวม ต้องนำตัวเลขทั้งสี่เดือนของแต่ละสาขามาบวกกันแล้วเปรียบเทียบ`},{en:`Add North Branch's four monthly values, add South Branch's four monthly values, then see which is actually larger.`,th:`บวกตัวเลขรายเดือนทั้งสี่เดือนของสาขาเหนือ และบวกของสาขาใต้ แล้วดูว่าค่าใดมากกว่ากันจริง`}],visual:{kind:`barChart`,categories:[`May`,`Jun`,`Jul`,`Aug`],series:[{name:{en:`North Branch`,th:`สาขาเหนือ`},color:`coral`,values:[120,150,180,160]},{name:{en:`South Branch`,th:`สาขาใต้`},color:`teal`,values:[140,130,170,190]}],yStep:40,yMax:200,alt:{en:`Grouped bar chart comparing monthly visitor counts at North Branch and South Branch libraries from May to August.`,th:`กราฟแท่งเปรียบเทียบจำนวนผู้ใช้บริการรายเดือนของห้องสมุดสาขาเหนือและสาขาใต้ ตั้งแต่เดือนพฤษภาคมถึงสิงหาคม`}},estimatedSeconds:150},{id:`E-18`,testId:`stw-mock-e`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Chart Degrees to Frequency`,th:`มุมในแผนภูมิวงกลมกับจำนวนคน`},difficulty:F(18),prompt:{en:`A survey asked 180 Prathom 6 students at a district fair which community activity they enjoyed most. The results are shown in the pie chart. The "Plant" (tree planting) slice measures 100° and represents 50 students. How many students chose "Mural" (street mural), which measures 70°?`,th:`มีการสำรวจนักเรียนชั้นประถมศึกษาปีที่ 6 จำนวน 180 คนในงานออกร้านของเขตพื้นที่ ว่าชื่นชอบกิจกรรมชุมชนใดมากที่สุด ผลสำรวจแสดงในแผนภูมิวงกลม โดยส่วน "Plant" (ปลูกต้นไม้) มีมุม 100° และคิดเป็นนักเรียน 50 คน มีนักเรียนกี่คนที่เลือก "Mural" (วาดภาพฝาผนัง) ซึ่งมีมุม 70°`},options:[{id:`A`,label:{en:`50 students`,th:`50 คน`}},{id:`B`,label:{en:`40 students`,th:`40 คน`}},{id:`C`,label:{en:`35 students`,th:`35 คน`}},{id:`D`,label:{en:`70 students`,th:`70 คน`}}],correctOptionId:`C`,explanation:{en:`Since 100° represents 50 students, each degree represents 50 ÷ 100 = 0.5 students. The Mural slice measures 70°, so it represents 70 × 0.5 = 35 students. (Check: 0.5 students per degree × 360° = 180 students total, matching the survey size.)`,th:`เนื่องจาก 100° แทนนักเรียน 50 คน แต่ละองศาจึงแทนนักเรียน 50 ÷ 100 = 0.5 คน ส่วน Mural มีมุม 70° จึงแทนนักเรียน 70 × 0.5 = 35 คน (ตรวจสอบ: 0.5 คนต่อองศา × 360° = 180 คน ตรงกับจำนวนนักเรียนทั้งหมดที่สำรวจ)`},distractorNotes:{A:{en:`This is the number of students for the Plant slice (given as 50), mistakenly given as the answer for the Mural slice instead.`,th:`ค่านี้คือจำนวนนักเรียนของส่วน Plant (ที่โจทย์ให้มาคือ 50) ซึ่งตอบผิดโดยเข้าใจว่าเป็นคำตอบของส่วน Mural`},B:{en:`This comes from assuming the 180 students split evenly into 4 equal groups (180 ÷ 4 = 45… rounded/misapplied), ignoring the actual degree proportions shown in the chart.`,th:`ค่านี้เกิดจากการสมมติว่านักเรียน 180 คนแบ่งเท่าๆ กันเป็น 4 กลุ่ม (180 ÷ 4 = 45 แล้วคำนวณผิดพลาดต่อ) โดยไม่สนใจสัดส่วนมุมจริงที่แสดงในแผนภูมิ`},D:{en:`This confuses the DEGREES of the Mural slice (70°) with the NUMBER OF STUDENTS, reporting the angle itself as if it were the frequency.`,th:`ค่านี้สับสนระหว่างมุม (70°) ของส่วน Mural กับจำนวนนักเรียน โดยนำค่ามุมมาตอบเป็นจำนวนคนโดยตรง`}},hints:[{en:`Use the Plant slice as your key: 100° corresponds to 50 students.`,th:`ใช้ส่วน Plant เป็นตัวช่วย: มุม 100° เทียบเท่ากับนักเรียน 50 คน`},{en:`Find how many students each single degree of the pie chart represents.`,th:`หาว่าแต่ละ 1 องศาของแผนภูมิวงกลมแทนนักเรียนกี่คน`},{en:`Multiply that per-degree value by 70° to find the number of students in the Mural slice.`,th:`นำค่าต่อ 1 องศานั้นไปคูณด้วย 70° เพื่อหาจำนวนนักเรียนในส่วน Mural`}],visual:{kind:`pieChart`,slices:[{label:`Recycle`,degrees:110,color:`teal`},{label:`Plant`,degrees:100,color:`sage`},{label:`Mural`,degrees:70,color:`gold`},{label:`Cleanup`,degrees:80,color:`coral`}],alt:{en:`Pie chart of 180 students' favourite community activity: Recycle 110°, Plant 100°, Mural 70°, Cleanup 80°.`,th:`แผนภูมิวงกลมแสดงกิจกรรมชุมชนที่นักเรียน 180 คนชื่นชอบมากที่สุด แบ่งเป็น Recycle 110°, Plant 100°, Mural 70°, Cleanup 80°`}},estimatedSeconds:140},{id:`E-19`,testId:`stw-mock-e`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Markup vs. Actual Selling Price`,th:`ราคาตั้งขายกับราคาขายจริง`},difficulty:F(19),prompt:{en:`A vendor at a street market buys phone cases for 150 baht each. She marks up the price hoping for a 40% profit, but during a clearance sale she actually sells each case for 30 baht less than her marked price. What is her actual profit or loss per case?`,th:`พ่อค้าแม่ค้าในตลาดนัดรายหนึ่งซื้อเคสโทรศัพท์มาในราคาต้นทุนชิ้นละ 150 บาท ตั้งราคาขายโดยหวังกำไรร้อยละ 40 แต่เมื่อถึงช่วงลดราคาล้างสต๊อก กลับขายจริงในราคาที่ถูกกว่าราคาที่ตั้งไว้ชิ้นละ 30 บาท กำไรหรือขาดทุนจริงต่อชิ้นเป็นเท่าใด`},options:[{id:`A`,label:{en:`60 baht profit`,th:`กำไร 60 บาท`}},{id:`B`,label:{en:`30 baht loss`,th:`ขาดทุน 30 บาท`}},{id:`C`,label:{en:`30 baht profit`,th:`กำไร 30 บาท`}},{id:`D`,label:{en:`90 baht profit`,th:`กำไร 90 บาท`}}],correctOptionId:`C`,explanation:{en:`The marked price for a 40% profit is 150 × 1.4 = 210 baht. Selling 30 baht less than this gives an actual selling price of 210 − 30 = 180 baht. Since 180 > 150, the actual profit is 180 − 150 = 30 baht.`,th:`ราคาที่ตั้งไว้เพื่อให้ได้กำไรร้อยละ 40 คือ 150 × 1.4 = 210 บาท เมื่อขายถูกกว่านี้ 30 บาท ราคาขายจริงคือ 210 − 30 = 180 บาท เนื่องจาก 180 มากกว่า 150 กำไรจริงคือ 180 − 150 = 30 บาท`},distractorNotes:{A:{en:`This uses the marked price of 210 baht as if it were the actual selling price, forgetting the 30 baht clearance discount entirely (210 − 150 = 60).`,th:`ค่านี้ใช้ราคาที่ตั้งไว้ 210 บาทเป็นราคาขายจริง โดยลืมส่วนลดล้างสต๊อก 30 บาทไปเลย (210 − 150 = 60)`},B:{en:`This has the right numbers but the wrong direction — computing cost minus selling price (150 − 180) instead of selling price minus cost, wrongly concluding a loss.`,th:`ค่านี้ใช้ตัวเลขถูกต้องแต่คำนวณสลับทิศทาง คือนำต้นทุนลบราคาขาย (150 − 180) แทนที่จะเป็นราคาขายลบต้นทุน จึงสรุปผิดว่าขาดทุน`},D:{en:`This mistakenly ADDS the 30 baht discount to the marked price instead of subtracting it (210 + 30 = 240), giving an inflated selling price and profit.`,th:`ค่านี้เกิดจากการนำส่วนลด 30 บาทไป "บวก" เพิ่มในราคาที่ตั้งไว้ แทนที่จะลบออก (210 + 30 = 240) ทำให้ได้ราคาขายและกำไรที่สูงเกินจริง`}},hints:[{en:`First work out the marked price the vendor intended to sell at, based on the 40% target profit.`,th:`หาราคาที่พ่อค้าแม่ค้าตั้งใจจะขายก่อน โดยอิงจากเป้าหมายกำไรร้อยละ 40`},{en:`The actual selling price is 30 baht LESS than that marked price, not the cost price.`,th:`ราคาขายจริงคือราคาที่ตั้งไว้ "ลบ" ด้วย 30 บาท ไม่ใช่ลบจากราคาต้นทุน`},{en:`Compare the actual selling price to the original cost of 150 baht to see whether it is a profit or a loss.`,th:`เปรียบเทียบราคาขายจริงกับต้นทุนเดิม 150 บาท เพื่อดูว่าเป็นกำไรหรือขาดทุน`}],visual:null,estimatedSeconds:160},{id:`E-20`,testId:`stw-mock-e`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Chained Percentage Relationships`,th:`ร้อยละต่อเนื่องกันสามจำนวน`},difficulty:F(20),prompt:{en:`Three friends raised money for a river-cleanup fundraiser: Mo raised 20% more than Gap, and Fon raised 25% less than Mo. Together, all three raised 3,100 baht. How much did Fon raise?`,th:`เพื่อนสามคนระดมทุนเพื่อกิจกรรมทำความสะอาดแม่น้ำ โดยโมระดมทุนได้มากกว่าแก๊ปร้อยละ 20 และฝนระดมทุนได้น้อยกว่าโมร้อยละ 25 ทั้งสามคนระดมทุนรวมกันได้ 3,100 บาท ฝนระดมทุนได้เท่าใด`},options:[{id:`A`,label:{en:`1,200 baht`,th:`1,200 บาท`}},{id:`B`,label:{en:`750 baht`,th:`750 บาท`}},{id:`C`,label:{en:`1,000 baht`,th:`1,000 บาท`}},{id:`D`,label:{en:`900 baht`,th:`900 บาท`}}],correctOptionId:`D`,explanation:{en:`Let Gap's amount be g. Mo raised 1.2g, and Fon raised 0.75 × 1.2g = 0.9g. The total is g + 1.2g + 0.9g = 3.1g = 3,100, so g = 1,000. Fon raised 0.9 × 1,000 = 900 baht.`,th:`ให้เงินของแก๊ปเป็น g โมระดมทุนได้ 1.2g และฝนระดมทุนได้ 0.75 × 1.2g = 0.9g ผลรวมคือ g + 1.2g + 0.9g = 3.1g = 3,100 ดังนั้น g = 1,000 ฝนระดมทุนได้ 0.9 × 1,000 = 900 บาท`},distractorNotes:{A:{en:`This is how much Mo raised (1.2 × 1,000 = 1,200), not Fon — mixing up which friend the question asks about.`,th:`ค่านี้คือเงินที่โมระดมทุนได้ (1.2 × 1,000 = 1,200) ไม่ใช่ของฝน สับสนว่าโจทย์ถามถึงใคร`},B:{en:`This finds 25% less than GAP's amount (1,000 × 0.75 = 750) instead of 25% less than MO's amount, applying the percentage to the wrong person.`,th:`ค่านี้คำนวณน้อยกว่าเงินของ "แก๊ป" ร้อยละ 25 (1,000 × 0.75 = 750) แทนที่จะคำนวณน้อยกว่าเงินของ "โม" ซึ่งใช้ร้อยละกับคนผิด`},C:{en:`This is Gap's amount (the base value g = 1,000), mistaken for Fon's amount.`,th:`ค่านี้คือเงินของแก๊ป (ค่าตั้งต้น g = 1,000) ซึ่งเข้าใจผิดว่าเป็นเงินของฝน`}},hints:[{en:`Let Gap's amount be a variable, then write Mo's and Fon's amounts in terms of it.`,th:`ให้เงินของแก๊ปเป็นตัวแปร แล้วเขียนเงินของโมและฝนในรูปของตัวแปรนั้น`},{en:`Fon's percentage is taken from Mo's amount, not from Gap's amount directly — chain the two percentages together.`,th:`ร้อยละของฝนคิดจากเงินของ "โม" ไม่ใช่คิดจากเงินของแก๊ปโดยตรง ต้องคำนวณต่อเนื่องกันสองขั้น`},{en:`Add all three expressions together, set the sum equal to 3,100, solve for Gap's amount, then compute Fon's.`,th:`นำนิพจน์ทั้งสามมาบวกกัน ให้เท่ากับ 3,100 แก้หาค่าเงินของแก๊ป แล้วจึงคำนวณเงินของฝน`}],visual:null,estimatedSeconds:170}]},{id:`stw-mock-f`,title:{en:`Mock Test F`,th:`ข้อสอบชุด F`},subtitle:{en:`Final Countdown Paper`,th:`ชุดสุดท้ายก่อนสอบจริง`},recommendedMinutes:40,questions:[{id:`F-01`,testId:`stw-mock-f`,number:1,skill:`Number & Operations`,topic:{en:`Largest & smallest numbers`,th:`จำนวนมากที่สุด/น้อยที่สุด`},difficulty:F(1),prompt:{en:`For Satriwithaya's final mock exam, each student is given a 4-digit exam seat number formed from the digits 2, 6, 7, and 9, using each digit exactly once. What is the smallest possible seat number that is an even number?`,th:`ในการสอบเสมือนจริงครั้งสุดท้ายของโรงเรียนสตรีวิทยา นักเรียนแต่ละคนจะได้เลขที่นั่งสอบ 4 หลัก ซึ่งสร้างจากเลขโดด 2, 6, 7 และ 9 โดยใช้แต่ละตัวเพียงครั้งเดียว เลขที่นั่งสอบที่น้อยที่สุดที่เป็นจำนวนคู่คือข้อใด`},options:[{id:`A`,label:{en:`2679`,th:`2679`}},{id:`B`,label:{en:`2796`,th:`2796`}},{id:`C`,label:{en:`6792`,th:`6792`}},{id:`D`,label:{en:`9726`,th:`9726`}}],correctOptionId:`B`,explanation:{en:`To make the smallest even number, try each even digit (2 and 6) as the last digit and arrange the rest in ascending order in front. Ending in 2 gives 6792, but ending in 6 gives 2796 — which lets the small digit 2 lead the number. Since 2796 < 6792, the smallest even seat number is 2796.`,th:`การจะได้เลขคู่ที่น้อยที่สุด ให้ลองใช้เลขคู่แต่ละตัว (2 กับ 6) เป็นหลักหน่วย แล้วเรียงเลขที่เหลือจากน้อยไปมากไว้ข้างหน้า ถ้าลงท้ายด้วย 2 จะได้ 6792 แต่ถ้าลงท้ายด้วย 6 จะได้ 2796 เพราะทำให้เลข 2 ซึ่งเป็นเลขน้อยได้อยู่หลักพัน เมื่อเทียบกันแล้ว 2796 น้อยกว่า 6792 ดังนั้นเลขที่นั่งสอบคู่ที่น้อยที่สุดคือ 2796`},distractorNotes:{A:{en:`This just sorts all four digits from smallest to largest, ignoring the requirement that the number must be even — 2679 actually ends in 9, an odd digit.`,th:`วิธีนี้เรียงเลขโดดทั้งสี่ตัวจากน้อยไปมากเฉยๆ โดยลืมเงื่อนไขว่าต้องเป็นจำนวนคู่ ซึ่ง 2679 ลงท้ายด้วย 9 ซึ่งเป็นเลขคี่`},C:{en:`This assumes the smallest even digit (2) should always go last, then arranges the rest ascending — but that traps the small digit 2 in the units place instead of letting it lead the number.`,th:`วิธีนี้คิดว่าต้องใช้เลขคู่ที่เล็กที่สุด (2) เป็นหลักหน่วยเสมอ แล้วเรียงเลขที่เหลือจากน้อยไปมาก แต่กลับทำให้เลข 2 ซึ่งมีค่าน้อยไปติดอยู่หลักหน่วย แทนที่จะได้เป็นหลักนำหน้า`},D:{en:`This chooses 6 as the last digit correctly, but then arranges the remaining digits 2, 7, 9 in descending order instead of ascending order.`,th:`วิธีนี้เลือกเลข 6 เป็นหลักหน่วยถูกต้อง แต่กลับเรียงเลขที่เหลือ 2, 7, 9 จากมากไปน้อย แทนที่จะเรียงจากน้อยไปมาก`}},hints:[{en:`An even number must end in an even digit — check which digits in the set are even.`,th:`จำนวนคู่ต้องลงท้ายด้วยเลขโดดที่เป็นเลขคู่ ลองดูว่าในชุดนี้มีเลขโดดตัวไหนเป็นเลขคู่บ้าง`},{en:`There are two even digits to choose from for the last place. Try both and compare — don't assume the smaller even digit always wins.`,th:`มีเลขคู่ให้เลือกเป็นหลักหน่วยสองตัว ลองทำทั้งสองแบบแล้วเทียบกัน อย่าเพิ่งคิดว่าเลขคู่ตัวเล็กกว่าจะให้คำตอบน้อยกว่าเสมอไป`},{en:`Try ending in 2: arrange 6, 7, 9 ascending in front, giving 6792. Try ending in 6: arrange 2, 7, 9 ascending in front, giving 2796. Compare and pick the smaller.`,th:`ลองลงท้ายด้วย 2 แล้วเรียง 6, 7, 9 จากน้อยไปมากไว้ข้างหน้า จะได้ 6792 แล้วลองลงท้ายด้วย 6 แล้วเรียง 2, 7, 9 จากน้อยไปมากไว้ข้างหน้า จะได้ 2796 เทียบสองคำตอบแล้วเลือกจำนวนที่น้อยกว่า`}],visual:null,estimatedSeconds:55},{id:`F-02`,testId:`stw-mock-f`,number:2,skill:`Word Problems & Logic`,topic:{en:`Two-scenario price puzzle`,th:`โจทย์ราคาสองสถานการณ์`},difficulty:F(2),prompt:{en:`Nan has exactly enough money to buy a set of pencils for the exam at 8 baht each, with nothing left over. If the pencils had cost 6 baht each instead, she could have bought 5 more pencils and still had 4 baht left over. How much money does Nan have in total?`,th:`หนานมีเงินพอดีสำหรับซื้อดินสอไปสอบราคาแท่งละ 8 บาท โดยไม่เหลือเงินเลย แต่ถ้าดินสอราคาแท่งละ 6 บาท เธอจะซื้อได้เพิ่มอีก 5 แท่ง และยังเหลือเงิน 4 บาท หนานมีเงินทั้งหมดกี่บาท`},options:[{id:`A`,label:{en:`120 baht`,th:`120 บาท`}},{id:`B`,label:{en:`132 baht`,th:`132 บาท`}},{id:`C`,label:{en:`136 baht`,th:`136 บาท`}},{id:`D`,label:{en:`150 baht`,th:`150 บาท`}}],correctOptionId:`C`,explanation:{en:`Let n be the number of pencils she buys at 8 baht (using all her money): money = 8n. At 6 baht she buys (n + 5) pencils with 4 baht left: money = 6(n + 5) + 4. Setting these equal: 8n = 6n + 34, so n = 17 and money = 8 × 17 = 136 baht.`,th:`ให้ n เป็นจำนวนดินสอที่ซื้อในราคาแท่งละ 8 บาท (ใช้เงินหมดพอดี) จะได้เงิน = 8n และเมื่อราคาแท่งละ 6 บาท เธอซื้อได้ (n + 5) แท่ง เหลือเงิน 4 บาท จะได้เงิน = 6(n + 5) + 4 นำสองสมการมาเท่ากัน: 8n = 6n + 34 ดังนั้น n = 17 และเงินทั้งหมด = 8 × 17 = 136 บาท`},distractorNotes:{A:{en:`This solves the equation without including the 4-baht leftover (8n = 6(n + 5)), which gives n = 15 and 120 baht — missing the leftover condition entirely.`,th:`วิธีนี้แก้สมการโดยไม่รวมเงินที่เหลือ 4 บาท (8n = 6(n + 5)) ทำให้ได้ n = 15 และ 120 บาท ซึ่งลืมเงื่อนไขเงินเหลือไปเลย`},B:{en:`This correctly finds that she buys 22 pencils at 6 baht each (6 × 22 = 132), but forgets to add back the 4 baht that was left over.`,th:`วิธีนี้หาได้ถูกต้องว่าซื้อดินสอราคา 6 บาทได้ 22 แท่ง (6 × 22 = 132) แต่ลืมบวกเงินที่เหลืออีก 4 บาทกลับเข้าไป`},D:{en:`This mistakenly adds the 4-baht leftover into the calculation twice, overshooting the true total.`,th:`วิธีนี้บวกเงินที่เหลือ 4 บาทเข้าไปในการคำนวณซ้ำสองครั้งโดยไม่ตั้งใจ ทำให้ได้คำตอบมากเกินจริง`}},hints:[{en:`Write Nan's money the same way in both pricing scenarios and set the two expressions equal.`,th:`ลองเขียนจำนวนเงินของหนานในรูปแบบเดียวกันทั้งสองสถานการณ์ แล้วนำมาเท่ากัน`},{en:`Let n be the number of pencils bought at 8 baht each. At 6 baht each she buys 5 more, with 4 baht left over.`,th:`ให้ n เป็นจำนวนดินสอที่ซื้อได้ราคาแท่งละ 8 บาท เมื่อราคาแท่งละ 6 บาท เธอซื้อได้เพิ่ม 5 แท่ง และเหลือเงิน 4 บาท`},{en:`Set 8n = 6(n + 5) + 4. Solve for n, then multiply n by 8 to find the total money.`,th:`ตั้งสมการ 8n = 6(n + 5) + 4 แก้หาค่า n แล้วนำ n ไปคูณ 8 เพื่อหาจำนวนเงินทั้งหมด`}],visual:null,estimatedSeconds:70},{id:`F-03`,testId:`stw-mock-f`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:F(3),prompt:{en:`On exam-prep day, seven study groups each finished this fraction of their assigned review packet: \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{11}{24}, and \\frac{7}{10}. When these fractions are ranked from largest to smallest, which fraction comes 4th?`,th:`ในวันเตรียมสอบ กลุ่มติวทั้ง 7 กลุ่มทำแบบฝึกหัดทบทวนเสร็จเป็นสัดส่วนดังนี้ \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{11}{24} และ \\frac{7}{10} เมื่อเรียงเศษส่วนเหล่านี้จากมากไปน้อย เศษส่วนใดอยู่ในอันดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}},{id:`B`,label:{en:`\\frac{7}{12}`,th:`\\frac{7}{12}`}},{id:`C`,label:{en:`\\frac{7}{10}`,th:`\\frac{7}{10}`}},{id:`D`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}}],correctOptionId:`D`,explanation:{en:`Converting to decimals: \\frac{5}{6} ≈ 0.833, \\frac{3}{4} = 0.75, \\frac{7}{10} = 0.7, \\frac{2}{3} ≈ 0.667, \\frac{5}{8} = 0.625, \\frac{7}{12} ≈ 0.583, \\frac{11}{24} ≈ 0.458. Ranked largest to smallest: \\frac{5}{6}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{11}{24}. The 4th largest is \\frac{2}{3}.`,th:`แปลงเป็นทศนิยม: \\frac{5}{6} ≈ 0.833, \\frac{3}{4} = 0.75, \\frac{7}{10} = 0.7, \\frac{2}{3} ≈ 0.667, \\frac{5}{8} = 0.625, \\frac{7}{12} ≈ 0.583, \\frac{11}{24} ≈ 0.458 เรียงจากมากไปน้อยได้: \\frac{5}{6}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{11}{24} อันดับที่ 4 คือ \\frac{2}{3}`},distractorNotes:{A:{en:`This is actually the 5th largest fraction — a common off-by-one counting slip when ranking from the top.`,th:`ค่านี้จริงๆ แล้วเป็นอันดับที่ 5 ไม่ใช่อันดับที่ 4 เป็นความผิดพลาดในการนับตำแหน่งคลาดเคลื่อนไปหนึ่งอันดับ`},B:{en:`This is the 6th largest fraction, far past the 4th position — likely from counting from the smallest end instead of the largest.`,th:`ค่านี้เป็นอันดับที่ 6 ซึ่งเลยตำแหน่งที่ 4 ไปมาก อาจเกิดจากการนับจากด้านน้อยที่สุดแทนที่จะนับจากด้านมากที่สุด`},C:{en:`This is the 3rd largest fraction, one position too early — an easy off-by-one mistake in the other direction.`,th:`ค่านี้เป็นอันดับที่ 3 ซึ่งนับเร็วไปหนึ่งอันดับ เป็นความผิดพลาดแบบคลาดเคลื่อนไปหนึ่งตำแหน่งเช่นกัน`}},hints:[{en:`Fractions are easiest to compare once they are all written the same way — try converting each one to a decimal.`,th:`การเทียบเศษส่วนจะง่ายขึ้นถ้าทุกตัวอยู่ในรูปเดียวกัน ลองแปลงแต่ละตัวเป็นทศนิยมดู`},{en:`Divide the numerator by the denominator for each fraction, then line up all seven decimal values from largest to smallest.`,th:`นำตัวเศษหารด้วยตัวส่วนของแต่ละเศษส่วน แล้วเรียงค่าทศนิยมทั้ง 7 ค่าจากมากไปน้อย`},{en:`The order from largest to smallest is 5/6, 3/4, 7/10, 2/3, 5/8, 7/12, 11/24 — count carefully to the 4th position.`,th:`ลำดับจากมากไปน้อยคือ 5/6, 3/4, 7/10, 2/3, 5/8, 7/12, 11/24 นับตำแหน่งให้ถูกต้องจนถึงอันดับที่ 4`}],visual:null,estimatedSeconds:65},{id:`F-04`,testId:`stw-mock-f`,number:4,skill:`Number & Operations`,topic:{en:`Mixed expressions`,th:`การคำนวณนิพจน์ผสม`},difficulty:F(4),prompt:{en:`Let A = (16 − 4) ÷ 2 × 5 and B = 2 × 4 − \\frac{1}{2} × 4. What is the value of 2 × (A ÷ B)?`,th:`กำหนดให้ A = (16 − 4) ÷ 2 × 5 และ B = 2 × 4 − \\frac{1}{2} × 4 จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`10`,th:`10`}},{id:`B`,label:{en:`15`,th:`15`}},{id:`C`,label:{en:`6`,th:`6`}},{id:`D`,label:{en:`5`,th:`5`}}],correctOptionId:`A`,explanation:{en:`A = (16 − 4) ÷ 2 × 5 = 12 ÷ 2 × 5 = 6 × 5 = 30. B = 2 × 4 − \\frac{1}{2} × 4 = 8 − 2 = 6. So A ÷ B = 30 ÷ 6 = 5, and 2 × (A ÷ B) = 2 × 5 = 10.`,th:`A = (16 − 4) ÷ 2 × 5 = 12 ÷ 2 × 5 = 6 × 5 = 30 และ B = 2 × 4 − \\frac{1}{2} × 4 = 8 − 2 = 6 ดังนั้น A ÷ B = 30 ÷ 6 = 5 และ 2 × (A ÷ B) = 2 × 5 = 10`},distractorNotes:{B:{en:`This computes 3 × (A ÷ B) instead of 2 × (A ÷ B), using the wrong multiplier: 3 × 5 = 15.`,th:`วิธีนี้คำนวณ 3 × (A ÷ B) แทนที่จะเป็น 2 × (A ÷ B) ใช้ตัวคูณผิด: 3 × 5 = 15`},C:{en:`This gives the value of B (6) instead of finishing the full expression — a common mistake of stopping at an intermediate result.`,th:`วิธีนี้ตอบค่าของ B (คือ 6) แทนที่จะคำนวณนิพจน์ทั้งหมดให้เสร็จ เป็นความผิดพลาดที่หยุดไว้ที่ผลลัพธ์ระหว่างทาง`},D:{en:`This correctly finds A ÷ B = 5, but forgets to multiply the final result by 2.`,th:`วิธีนี้หา A ÷ B ได้ถูกต้องเท่ากับ 5 แต่ลืมคูณผลลัพธ์สุดท้ายด้วย 2`}},hints:[{en:`Work out A and B separately first, following the order of operations carefully inside each bracket.`,th:`หาค่า A และ B แยกกันก่อน โดยทำตามลำดับการคำนวณในวงเล็บอย่างระมัดระวัง`},{en:`For A: do the bracket first, then divide, then multiply. For B: do the multiplications before the subtraction.`,th:`สำหรับ A ให้ทำในวงเล็บก่อน แล้วหาร แล้วคูณ สำหรับ B ให้คูณก่อนแล้วค่อยลบ`},{en:`A = 30 and B = 6, so A ÷ B = 5. Remember the whole expression asks for 2 times that result, not A ÷ B by itself.`,th:`A = 30 และ B = 6 ดังนั้น A ÷ B = 5 อย่าลืมว่าโจทย์ถามหา 2 เท่าของผลลัพธ์นี้ ไม่ใช่แค่ A ÷ B เฉยๆ`}],visual:null,estimatedSeconds:65},{id:`F-05`,testId:`stw-mock-f`,number:5,skill:`Number & Operations`,topic:{en:`LCM from a multiple clue`,th:`ค.ร.น. จากเงื่อนไขจำนวนเท่า`},difficulty:F(5),prompt:{en:`Two numbers add up to 60. The larger number is exactly 4 times the smaller number. What is the LCM (lowest common multiple) of the two numbers?`,th:`จำนวนสองจำนวนรวมกันได้ 60 โดยจำนวนที่มากกว่าเป็น 4 เท่าของจำนวนที่น้อยกว่าพอดี ค.ร.น. ของจำนวนทั้งสองคือเท่าใด`},options:[{id:`A`,label:{en:`12`,th:`12`}},{id:`B`,label:{en:`48`,th:`48`}},{id:`C`,label:{en:`60`,th:`60`}},{id:`D`,label:{en:`30`,th:`30`}}],correctOptionId:`B`,explanation:{en:`Let the smaller number be s and the larger be 4s. Since s + 4s = 60, 5s = 60, so s = 12 and the larger number is 48. Since 48 is itself a multiple of 12, the LCM of 12 and 48 is simply 48.`,th:`ให้จำนวนที่น้อยกว่าเป็น s และจำนวนที่มากกว่าเป็น 4s เนื่องจาก s + 4s = 60 จะได้ 5s = 60 ดังนั้น s = 12 และจำนวนที่มากกว่าคือ 48 เนื่องจาก 48 เป็นพหุคูณของ 12 อยู่แล้ว ค.ร.น. ของ 12 และ 48 จึงเท่ากับ 48 นั่นเอง`},distractorNotes:{A:{en:`This gives 12, the smaller of the two numbers, but stops there instead of finding the LCM.`,th:`วิธีนี้ตอบ 12 ซึ่งเป็นจำนวนที่น้อยกว่าเท่านั้น แต่ยังไม่ได้หา ค.ร.น. ต่อ`},C:{en:`This gives 60, the sum stated in the problem, instead of actually computing the LCM of the two numbers found.`,th:`วิธีนี้ตอบ 60 ซึ่งเป็นผลบวกที่โจทย์ให้มา แทนที่จะคำนวณ ค.ร.น. ของจำนวนทั้งสองที่หาได้`},D:{en:`This averages the two numbers ((12 + 48) ÷ 2 = 30) instead of finding their lowest common multiple.`,th:`วิธีนี้หาค่าเฉลี่ยของจำนวนทั้งสอง ((12 + 48) ÷ 2 = 30) แทนที่จะหา ค.ร.น. ของทั้งสองจำนวน`}},hints:[{en:`First figure out what the two numbers actually are, using the sum and the "4 times" relationship.`,th:`หาก่อนว่าจำนวนทั้งสองคืออะไรจริงๆ โดยใช้ผลบวกและความสัมพันธ์ "4 เท่า"`},{en:`If the smaller number is s, the larger is 4s, and together they make 5 equal parts totalling 60.`,th:`ถ้าจำนวนที่น้อยกว่าเป็น s จำนวนที่มากกว่าจะเป็น 4s รวมกันเป็น 5 ส่วนเท่ากันซึ่งรวมได้ 60`},{en:`Solve 5s = 60 to get s = 12 and the larger number = 48. Then notice 48 is already a multiple of 12.`,th:`แก้สมการ 5s = 60 จะได้ s = 12 และจำนวนที่มากกว่า = 48 จากนั้นสังเกตว่า 48 เป็นพหุคูณของ 12 อยู่แล้ว`}],visual:null,estimatedSeconds:60},{id:`F-06`,testId:`stw-mock-f`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing number patterns`,th:`แบบรูปที่เพิ่มขึ้น`},difficulty:F(6),prompt:{en:`For the countdown-to-exam calendar, Kru Fah shades a growing triangular pattern of squares each day. Figure 1 has 1 shaded square, Figure 2 has 3, Figure 3 has 6 (shown below), and Figure 4 has 10. Following the same pattern, how many shaded squares will Figure 12 have?`,th:`ในปฏิทินนับถอยหลังก่อนสอบ ครูฟ้าแรเงาช่องสี่เหลี่ยมเป็นแบบรูปสามเหลี่ยมที่เพิ่มขึ้นทุกวัน รูปที่ 1 มี 1 ช่อง รูปที่ 2 มี 3 ช่อง รูปที่ 3 มี 6 ช่อง (ดังภาพ) และรูปที่ 4 มี 10 ช่อง ตามแบบรูปนี้ รูปที่ 12 จะมีช่องที่แรเงากี่ช่อง`},options:[{id:`A`,label:{en:`66`,th:`66`}},{id:`B`,label:{en:`72`,th:`72`}},{id:`C`,label:{en:`78`,th:`78`}},{id:`D`,label:{en:`91`,th:`91`}}],correctOptionId:`C`,explanation:{en:`This is the triangular number pattern: the count for Figure n is n × (n + 1) ÷ 2 (1, 3, 6, 10, 15, ...). For Figure 12: 12 × 13 ÷ 2 = 78.`,th:`นี่คือแบบรูปจำนวนสามเหลี่ยม โดยจำนวนช่องในรูปที่ n เท่ากับ n × (n + 1) ÷ 2 (คือ 1, 3, 6, 10, 15, ...) สำหรับรูปที่ 12: 12 × 13 ÷ 2 = 78`},distractorNotes:{A:{en:`This uses n × (n − 1) ÷ 2 with n = 12, an off-by-one indexing slip that actually gives the 11th triangular number.`,th:`วิธีนี้ใช้สูตร n × (n − 1) ÷ 2 โดย n = 12 ซึ่งคลาดเคลื่อนไปหนึ่งตำแหน่ง แท้จริงแล้วเป็นจำนวนสามเหลี่ยมลำดับที่ 11`},B:{en:`This assumes the pattern grows by a constant 6 squares each time (a linear pattern) instead of a triangular one, giving 12 × 6 = 72.`,th:`วิธีนี้คิดว่าแบบรูปเพิ่มขึ้นครั้งละ 6 ช่องคงที่ (แบบเชิงเส้น) แทนที่จะเป็นแบบสามเหลี่ยม ทำให้ได้ 12 × 6 = 72`},D:{en:`This shifts the figure index by one, treating Figure 12 as if it were the 13th term: 13 × 14 ÷ 2 = 91.`,th:`วิธีนี้เลื่อนลำดับรูปไปหนึ่งตำแหน่ง โดยถือว่ารูปที่ 12 เป็นลำดับที่ 13 แทน: 13 × 14 ÷ 2 = 91`}},hints:[{en:`Look at how many more squares are added each time you move from one figure to the next.`,th:`ลองสังเกตว่าแต่ละรูปเพิ่มช่องขึ้นจากรูปก่อนหน้ากี่ช่อง`},{en:`The counts 1, 3, 6, 10 are triangular numbers — each figure adds one more square than the previous jump did.`,th:`จำนวน 1, 3, 6, 10 คือจำนวนสามเหลี่ยม แต่ละรูปเพิ่มขึ้นมากกว่ารูปก่อนหน้าอยู่หนึ่งช่องเสมอ`},{en:`The nth triangular number is n × (n + 1) ÷ 2. Substitute n = 12 to find the answer.`,th:`จำนวนสามเหลี่ยมลำดับที่ n คำนวณจาก n × (n + 1) ÷ 2 แทนค่า n = 12 เพื่อหาคำตอบ`}],visual:{kind:`gridPattern`,gridSize:3,cells:[{row:0,col:0},{row:1,col:0},{row:1,col:1},{row:2,col:0},{row:2,col:1},{row:2,col:2}],alt:{en:`Figure 3 of the triangular pattern: a stair-step triangle of 6 shaded squares (1 in the top row, 2 in the middle row, 3 in the bottom row).`,th:`รูปที่ 3 ของแบบรูปสามเหลี่ยม: ช่องแรเงาเรียงเป็นขั้นบันได 6 ช่อง (แถวบน 1 ช่อง แถวกลาง 2 ช่อง แถวล่าง 3 ช่อง)`}},estimatedSeconds:90},{id:`F-07`,testId:`stw-mock-f`,number:7,skill:`Word Problems & Logic`,topic:{en:`Meeting on a track`,th:`การเจอกันบนลู่วิ่ง`},difficulty:F(7),prompt:{en:`On exam morning, Ploy and Kai start cycling around the same circular practice track at the same time, from the same point, in opposite directions. Ploy cycles at 240 m/min and Kai cycles at 210 m/min. They meet again for the first time after 4 minutes. What is the length of the track?`,th:`เช้าวันสอบ พลอยกับใกล้เริ่มปั่นจักรยานรอบลู่ฝึกซ้อมวงกลมเดียวกัน ออกจากจุดเดียวกันในเวลาเดียวกัน แต่ปั่นสวนทางกัน พลอยปั่นด้วยความเร็ว 240 เมตร/นาที ส่วนใกล้ปั่นด้วยความเร็ว 210 เมตร/นาที ทั้งสองคนเจอกันครั้งแรกอีกครั้งหลังจากผ่านไป 4 นาที ลู่ฝึกซ้อมมีความยาวเท่าใด`},options:[{id:`A`,label:{en:`960 m`,th:`960 เมตร`}},{id:`B`,label:{en:`840 m`,th:`840 เมตร`}},{id:`C`,label:{en:`120 m`,th:`120 เมตร`}},{id:`D`,label:{en:`1800 m`,th:`1800 เมตร`}}],correctOptionId:`D`,explanation:{en:`When two people start from the same point and cycle in opposite directions around a loop, they first meet when their combined distance equals the full length of the track. Combined speed = 240 + 210 = 450 m/min. Track length = 450 × 4 = 1800 m.`,th:`เมื่อสองคนออกจากจุดเดียวกันแล้วปั่นสวนทางกันรอบลู่วงกลม พวกเขาจะเจอกันครั้งแรกเมื่อระยะทางรวมกันเท่ากับความยาวลู่ทั้งหมดพอดี ความเร็วรวม = 240 + 210 = 450 เมตร/นาที ความยาวลู่ = 450 × 4 = 1800 เมตร`},distractorNotes:{A:{en:`This only counts Ploy's own distance (240 × 4 = 960), forgetting that Kai is also approaching from the opposite direction and contributing to how quickly they meet.`,th:`วิธีนี้นับเฉพาะระยะทางของพลอย (240 × 4 = 960) โดยลืมว่าใกล้ก็ปั่นสวนเข้ามาด้วย ซึ่งมีส่วนทำให้เจอกันเร็วขึ้น`},B:{en:`This only counts Kai's distance (210 × 4 = 840) instead of the combined distance travelled by both cyclists.`,th:`วิธีนี้นับเฉพาะระยะทางของใกล้ (210 × 4 = 840) แทนที่จะนับระยะทางรวมของทั้งสองคน`},C:{en:`This subtracts the two speeds (as if one cyclist were catching up to the other from behind) instead of adding them for a head-on meeting.`,th:`วิธีนี้นำความเร็วทั้งสองมาลบกัน (เหมือนกรณีปั่นไล่ตามกันในทิศทางเดียวกัน) แทนที่จะบวกกันสำหรับกรณีปั่นสวนทางเข้าหากัน`}},hints:[{en:`Think about which direction each cyclist is moving relative to the other.`,th:`ลองคิดดูว่านักปั่นแต่ละคนเคลื่อนที่ไปในทิศทางใดเมื่อเทียบกับอีกคน`},{en:`When two people move in opposite directions around a loop starting from the same spot, their distances add up to the full track length at the first meeting.`,th:`เมื่อสองคนออกจากจุดเดียวกันแล้วเคลื่อนที่สวนทางกันรอบลู่วงกลม ระยะทางของทั้งสองคนรวมกันจะเท่ากับความยาวลู่พอดีตอนที่เจอกันครั้งแรก`},{en:`Add the two speeds to get the combined speed, then multiply by the time (4 minutes) to find the track length.`,th:`บวกความเร็วทั้งสองเข้าด้วยกันเพื่อหาความเร็วรวม แล้วคูณด้วยเวลา (4 นาที) เพื่อหาความยาวลู่`}],visual:null,estimatedSeconds:85},{id:`F-08`,testId:`stw-mock-f`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing money in a ratio`,th:`การแบ่งเงินตามอัตราส่วน`},difficulty:F(8),prompt:{en:`Three classmates pooled their snack money for exam day in the ratio 5 : 4 : 3. The classmate with the largest share had 90 baht more than the classmate with the smallest share. How many 15-baht sandwiches can they buy in total with the pooled money?`,th:`เพื่อนสามคนรวมเงินค่าขนมสำหรับวันสอบในอัตราส่วน 5 : 4 : 3 คนที่ได้ส่วนแบ่งมากที่สุดมีเงินมากกว่าคนที่ได้ส่วนแบ่งน้อยที่สุดอยู่ 90 บาท เมื่อรวมเงินทั้งหมดแล้ว จะซื้อแซนด์วิชราคาชิ้นละ 15 บาทได้กี่ชิ้น`},options:[{id:`A`,label:{en:`36`,th:`36`}},{id:`B`,label:{en:`72`,th:`72`}},{id:`C`,label:{en:`27`,th:`27`}},{id:`D`,label:{en:`18`,th:`18`}}],correctOptionId:`A`,explanation:{en:`The gap between the largest share (5 parts) and smallest share (3 parts) is 2 parts, equal to 90 baht, so 1 part = 45 baht. Total parts = 5 + 4 + 3 = 12, so the pooled total = 12 × 45 = 540 baht. Sandwiches: 540 ÷ 15 = 36.`,th:`ส่วนต่างระหว่างส่วนแบ่งมากที่สุด (5 ส่วน) กับน้อยที่สุด (3 ส่วน) คือ 2 ส่วน ซึ่งเท่ากับ 90 บาท ดังนั้น 1 ส่วน = 45 บาท รวมทั้งหมด 5 + 4 + 3 = 12 ส่วน เงินรวม = 12 × 45 = 540 บาท ซื้อแซนด์วิชได้ 540 ÷ 15 = 36 ชิ้น`},distractorNotes:{B:{en:`This treats the 90-baht gap as equal to just 1 part instead of 2 parts, doubling the value of each part and overestimating the total.`,th:`วิธีนี้คิดว่าส่วนต่าง 90 บาทเท่ากับ 1 ส่วน แทนที่จะเป็น 2 ส่วน ทำให้มูลค่าต่อส่วนสูงเกินจริงเป็นสองเท่า`},C:{en:`This only adds the two larger shares (5 + 4 = 9 parts), leaving out the smallest classmate's contribution entirely: 9 × 45 = 405, and 405 ÷ 15 = 27.`,th:`วิธีนี้รวมเฉพาะส่วนแบ่งสองคนที่มากกว่า (5 + 4 = 9 ส่วน) โดยไม่รวมส่วนของคนที่มีเงินน้อยที่สุด: 9 × 45 = 405 และ 405 ÷ 15 = 27`},D:{en:`This finds the correct pooled total (540 baht) but divides by 30 baht instead of the actual sandwich price of 15 baht.`,th:`วิธีนี้หาเงินรวมได้ถูกต้อง (540 บาท) แต่นำไปหารด้วย 30 บาทแทนที่จะเป็นราคาแซนด์วิชจริงคือ 15 บาท`}},hints:[{en:`The difference between the largest and smallest ratio parts corresponds to the 90-baht gap.`,th:`ส่วนต่างระหว่างส่วนแบ่งที่มากที่สุดและน้อยที่สุดในอัตราส่วน สอดคล้องกับส่วนต่าง 90 บาท`},{en:`5 parts minus 3 parts is 2 parts, and that equals 90 baht. Find the value of 1 part first.`,th:`5 ส่วน ลบ 3 ส่วน เท่ากับ 2 ส่วน ซึ่งเท่ากับ 90 บาท หาค่าของ 1 ส่วนก่อน`},{en:`Once you know 1 part = 45 baht, find the total using all 12 parts (5 + 4 + 3), then divide by 15 to count the sandwiches.
