,th:`เมื่อหาจำนวนทั้งสองได้แล้ว (12 และ 39) ให้หา ห.ร.ม. ก่อน แล้วใช้ความสัมพันธ์ ค.ร.น. × ห.ร.ม. = ผลคูณของจำนวนทั้งสอง เพื่อหา ค.ร.น.`}],visual:null,estimatedSeconds:65},{id:`B-06`,testId:`stw-mock-b`,number:6,skill:`Algebra & Patterns`,topic:{en:`Triangular growing pattern`,th:`แบบรูปเติบโตแบบสามเหลี่ยม`},difficulty:F(6),prompt:{en:`The craft club is arranging shaded squares in a staircase pattern. Figure 1 has 1 shaded square, Figure 2 has 3, Figure 3 has 6, and Figure 4 (shown below) has 10. If the pattern continues in the same way, how many shaded squares will Figure 12 have?`,th:`ชมรมงานฝีมือจัดเรียงตารางที่แรเงาเป็นรูปขั้นบันได รูปที่ 1 มีตารางแรเงา 1 ช่อง รูปที่ 2 มี 3 ช่อง รูปที่ 3 มี 6 ช่อง และรูปที่ 4 (แสดงด้านล่าง) มี 10 ช่อง ถ้าแบบรูปนี้ดำเนินต่อไปเรื่อยๆ รูปที่ 12 จะมีตารางแรเงากี่ช่อง`},options:[{id:`A`,label:{en:`66`,th:`66`}},{id:`B`,label:{en:`144`,th:`144`}},{id:`C`,label:{en:`78`,th:`78`}},{id:`D`,label:{en:`156`,th:`156`}}],correctOptionId:`C`,explanation:{en:`These are triangular numbers: Figure n has \\frac{n(n+1)}{2} shaded squares (1, 3, 6, 10, 15, ...). For Figure 12: \\frac{12 × 13}{2} = \\frac{156}{2} = 78.`,th:`ตัวเลขเหล่านี้คือจำนวนสามเหลี่ยม โดยรูปที่ n มีตารางแรเงา \\frac{n(n+1)}{2} ช่อง (1, 3, 6, 10, 15, ...) สำหรับรูปที่ 12: \\frac{12 × 13}{2} = \\frac{156}{2} = 78`},distractorNotes:{A:{en:`Uses n(n−1)÷2 instead of n(n+1)÷2 — an off-by-one error in the formula, giving 12×11÷2 = 66.`,th:`ใช้สูตร n(n−1)÷2 แทนที่จะเป็น n(n+1)÷2 คลาดเคลื่อนไปหนึ่งตำแหน่ง ได้ 12×11÷2 = 66`},B:{en:`Confuses the triangular-number pattern with square numbers and computes 12² = 144.`,th:`สับสนแบบรูปจำนวนสามเหลี่ยมกับจำนวนกำลังสอง และคำนวณ 12² = 144`},D:{en:`Correctly computes n(n+1) = 12 × 13 = 156 but forgets to divide the result by 2.`,th:`คำนวณ n(n+1) = 12 × 13 = 156 ได้ถูกต้อง แต่ลืมนำผลลัพธ์ไปหารด้วย 2`}},hints:[{en:`Look at how many more shaded squares are added each time you move to the next figure.`,th:`สังเกตว่าในแต่ละรูปถัดไปมีตารางแรเงาเพิ่มขึ้นจากรูปก่อนหน้ากี่ช่อง`},{en:`These are triangular numbers — each figure number n corresponds to the sum 1 + 2 + 3 + ... + n.`,th:`ตัวเลขเหล่านี้คือจำนวนสามเหลี่ยม แต่ละรูปที่ n จะเท่ากับผลบวก 1 + 2 + 3 + ... + n`},{en:`Use the formula for the n-th triangular number, n times (n+1) divided by 2, with n = 12.`,th:`ใช้สูตรจำนวนสามเหลี่ยมลำดับที่ n คือ n คูณด้วย (n บวก 1) แล้วหารด้วย 2 โดยแทน n ด้วย 12`}],visual:{kind:`gridPattern`,gridSize:4,cells:[{row:0,col:0},{row:0,col:1},{row:0,col:2},{row:0,col:3},{row:1,col:0},{row:1,col:1},{row:1,col:2},{row:2,col:0},{row:2,col:1},{row:3,col:0}],alt:{en:`A staircase pattern of 10 shaded squares representing Figure 4 of the sequence.`,th:`แบบรูปขั้นบันไดของตารางแรเงา 10 ช่อง แทนรูปที่ 4 ของลำดับ`}},estimatedSeconds:85},{id:`B-07`,testId:`stw-mock-b`,number:7,skill:`Word Problems & Logic`,topic:{en:`Catch-up on a circular track`,th:`การไล่ทันกันบนลู่วิ่งวงกลม`},difficulty:F(7),prompt:{en:`Fon and Aew start cycling from the same point on a circular track at the same time, in the same direction. Fon cycles at 220 m/min and Aew cycles at 180 m/min. Fon first catches up to Aew from behind (completing exactly one more lap than Aew) after 15 minutes. What is the length of the track?`,th:`ฝนและแอ๋วเริ่มปั่นจักรยานจากจุดเดียวกันบนลู่วิ่งวงกลมในเวลาเดียวกันและไปทิศทางเดียวกัน ฝนปั่นด้วยความเร็ว 220 เมตร/นาที ส่วนแอ๋วปั่นด้วยความเร็ว 180 เมตร/นาที ฝนไล่ทันแอ๋วเป็นครั้งแรก (ปั่นได้มากกว่าแอ๋วอยู่ 1 รอบพอดี) หลังจากผ่านไป 15 นาที ลู่วิ่งนี้ยาวเท่าใด`},options:[{id:`A`,label:{en:`6,000 m`,th:`6,000 เมตร`}},{id:`B`,label:{en:`600 m`,th:`600 เมตร`}},{id:`C`,label:{en:`220 m`,th:`220 เมตร`}},{id:`D`,label:{en:`40 m`,th:`40 เมตร`}}],correctOptionId:`B`,explanation:{en:`Since they move in the same direction, the gap between them grows at the difference of their speeds: 220 − 180 = 40 m/min. To catch up exactly one full lap, this gap must equal the track length after 15 minutes: 40 × 15 = 600 m.`,th:`เนื่องจากปั่นไปทิศทางเดียวกัน ระยะห่างระหว่างทั้งสองคนจะเพิ่มขึ้นด้วยอัตราเท่ากับผลต่างความเร็ว คือ 220 − 180 = 40 เมตร/นาที เมื่อไล่ทันกันพอดี 1 รอบ ระยะห่างนี้จะเท่ากับความยาวลู่วิ่งหลังผ่านไป 15 นาที คือ 40 × 15 = 600 เมตร`},distractorNotes:{A:{en:`Uses the sum of the two speeds (220 + 180 = 400) as if this were an opposite-direction meeting problem, then multiplies by 15.`,th:`ใช้ผลบวกของความเร็วทั้งสอง (220 + 180 = 400) ราวกับเป็นโจทย์วิ่งสวนทางกัน แล้วคูณด้วย 15`},C:{en:`Just uses Fon's speed (220 m/min) as the track length, ignoring the time and Aew's speed entirely.`,th:`ใช้ความเร็วของฝน (220 เมตร/นาที) เป็นความยาวลู่วิ่งเฉยๆ โดยไม่นำเวลาและความเร็วของแอ๋วมาคิด`},D:{en:`Finds the speed difference (40 m/min) correctly but forgets to multiply it by the 15 minutes.`,th:`หาผลต่างความเร็ว (40 เมตร/นาที) ได้ถูกต้อง แต่ลืมนำไปคูณด้วยเวลา 15 นาที`}},hints:[{en:`Since they cycle in the same direction, think about how the gap between them changes over time.`,th:`เนื่องจากทั้งสองปั่นไปทิศทางเดียวกัน ให้คิดว่าระยะห่างระหว่างทั้งสองเปลี่ยนแปลงอย่างไรเมื่อเวลาผ่านไป`},{en:`The gap grows at a rate equal to the DIFFERENCE of their speeds, not the sum.`,th:`ระยะห่างจะเพิ่มขึ้นด้วยอัตราเท่ากับผลต่างของความเร็ว ไม่ใช่ผลบวก`},{en:`Catching up by exactly one lap means the gap equals the whole track length. Multiply the speed difference (40 m/min) by the time (15 min).`,th:`การไล่ทันกันพอดี 1 รอบ หมายความว่าระยะห่างเท่ากับความยาวลู่วิ่งทั้งหมด ให้นำผลต่างความเร็ว (40 เมตร/นาที) คูณด้วยเวลา (15 นาที)`}],visual:null,estimatedSeconds:90},{id:`B-08`,testId:`stw-mock-b`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Ratio split with leftover money`,th:`การแบ่งเงินตามอัตราส่วนและเงินที่เหลือ`},difficulty:F(8),prompt:{en:`Mint, Palm, and Kwan share 960 baht for a class trip fund in the ratio 5 : 3 : 2. Mint uses her share to buy postcards that cost 13 baht each, buying as many as she can. How much money will she have left over?`,th:`มิ้นท์ ปาล์ม และขวัญ แบ่งเงินกองทุนไปทัศนศึกษาจำนวน 960 บาท ตามอัตราส่วน 5 : 3 : 2 มิ้นท์นำส่วนแบ่งของตนไปซื้อโปสการ์ดใบละ 13 บาท โดยซื้อให้ได้มากที่สุด เธอจะเหลือเงินเท่าใด`},options:[{id:`A`,label:{en:`11 baht`,th:`11 บาท`}},{id:`B`,label:{en:`8 baht`,th:`8 บาท`}},{id:`C`,label:{en:`2 baht`,th:`2 บาท`}},{id:`D`,label:{en:`12 baht`,th:`12 บาท`}}],correctOptionId:`D`,explanation:{en:`The ratio parts total 5+3+2 = 10, so Mint's share is \\frac{5}{10} × 960 = 480 baht. Dividing by 13: 480 ÷ 13 = 36 postcards with 36 × 13 = 468 baht spent, leaving 480 − 468 = 12 baht.`,th:`ผลรวมของอัตราส่วนคือ 5+3+2 = 10 ส่วน มิ้นท์จึงได้ส่วนแบ่ง \\frac{5}{10} × 960 = 480 บาท เมื่อนำไปหารด้วย 13: 480 ÷ 13 = 36 ใบ ใช้เงินไป 36 × 13 = 468 บาท เหลือเงิน 480 − 468 = 12 บาท`},distractorNotes:{A:{en:`Divides the whole 960 baht by 13 directly, forgetting to split the money by the ratio first.`,th:`นำเงินทั้งหมด 960 บาท ไปหารด้วย 13 โดยตรง โดยลืมแบ่งเงินตามอัตราส่วนก่อน`},B:{en:`Splits the 960 baht equally among the three people (320 each) instead of using the 5:3:2 ratio.`,th:`แบ่งเงิน 960 บาท เท่าๆ กันให้ทั้งสามคน (คนละ 320 บาท) แทนที่จะแบ่งตามอัตราส่วน 5:3:2`},C:{en:`Accidentally uses Palm's ratio share (3 parts, 288 baht) instead of Mint's (5 parts).`,th:`ใช้ส่วนแบ่งของปาล์ม (3 ส่วน คือ 288 บาท) แทนที่จะเป็นส่วนแบ่งของมิ้นท์ (5 ส่วน) โดยไม่ได้ตั้งใจ`}},hints:[{en:`First figure out exactly how much money is Mint's share of the 960 baht.`,th:`ก่อนอื่นให้หาว่ามิ้นท์ได้รับเงินส่วนแบ่งจาก 960 บาท เป็นจำนวนเท่าใด`},{en:`The ratio 5:3:2 has 10 total parts. Mint gets 5 of those 10 parts.`,th:`อัตราส่วน 5:3:2 มีทั้งหมด 10 ส่วน มิ้นท์ได้รับ 5 ใน 10 ส่วนนั้น`},{en:`Mint's share is 480 baht. Divide 480 by 13 to find how many postcards she can buy, then find the remainder.`,th:`มิ้นท์ได้เงิน 480 บาท ให้นำ 480 หารด้วย 13 เพื่อหาว่าซื้อโปสการ์ดได้กี่ใบ แล้วหาเงินที่เหลือ`}],visual:null,estimatedSeconds:95},{id:`B-09`,testId:`stw-mock-b`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel lines and triangle angle sum`,th:`เส้นขนานกับผลรวมมุมในรูปสามเหลี่ยม`},difficulty:F(9),prompt:{en:`In the diagram, line AB is parallel to line CD. Segment PQ crosses AB at P and CD at Q, and R is a point on CD, forming triangle PQR. Angle APQ = 60° and angle PRQ = 45°. Find the size of angle QPR (marked x).`,th:`จากรูป เส้น AB ขนานกับเส้น CD ส่วนของเส้นตรง PQ ตัดกับ AB ที่จุด P และตัดกับ CD ที่จุด Q และ R เป็นจุดบนเส้น CD ทำให้เกิดรูปสามเหลี่ยม PQR มุม APQ = 60° และมุม PRQ = 45° จงหาขนาดของมุม QPR (มุม x ในรูป)`},options:[{id:`A`,label:{en:`75°`,th:`75°`}},{id:`B`,label:{en:`60°`,th:`60°`}},{id:`C`,label:{en:`105°`,th:`105°`}},{id:`D`,label:{en:`45°`,th:`45°`}}],correctOptionId:`A`,explanation:{en:`Since AB ∥ CD, angle PQR (alternate angle to APQ) also equals 60°. Using the angle sum of triangle PQR: angle QPR = 180° − 60° − 45° = 75°.`,th:`เนื่องจาก AB ขนานกับ CD มุม PQR (มุมแย้งกับมุม APQ) จึงเท่ากับ 60° เช่นกัน จากผลรวมมุมในรูปสามเหลี่ยม PQR: มุม QPR = 180° − 60° − 45° = 75°`},distractorNotes:{B:{en:`Mistakenly assumes angle QPR is the same as the given angle APQ, without using the triangle angle sum at all.`,th:`เข้าใจผิดว่ามุม QPR เท่ากับมุม APQ ที่กำหนดให้ โดยไม่ได้ใช้ผลรวมมุมในรูปสามเหลี่ยมเลย`},C:{en:`Correctly finds angle PQR = 60° using the parallel-line rule, but then makes an arithmetic slip in the final subtraction, mixing up the two given values.`,th:`หามุม PQR = 60° ได้ถูกต้องจากกฎเส้นขนาน แต่คำนวณลบในขั้นสุดท้ายผิดพลาด โดยสลับตัวเลขที่กำหนดให้ทั้งสองค่า`},D:{en:`Simply copies the given angle PRQ (45°) as the answer instead of computing the missing angle.`,th:`คัดลอกมุม PRQ ที่กำหนดให้ (45°) มาเป็นคำตอบเฉยๆ แทนที่จะคำนวณหามุมที่ขาดหายไป`}},hints:[{en:`AB is parallel to CD — think about which angle on line CD matches the given angle APQ.`,th:`AB ขนานกับ CD ให้คิดว่ามุมใดบนเส้น CD ที่สอดคล้องกับมุม APQ ที่กำหนดให้`},{en:`Because the lines are parallel, angle PQR equals angle APQ (alternate angles). Then use the fact that angles in a triangle add up to 180°.`,th:`เนื่องจากเส้นทั้งสองขนานกัน มุม PQR จะเท่ากับมุม APQ (มุมแย้ง) จากนั้นใช้ข้อเท็จจริงที่ว่ามุมในรูปสามเหลี่ยมรวมกันได้ 180°`},{en:`First find angle PQR = 60° (equal to angle APQ). Then angle QPR = 180° − 60° − 45°.`,th:`หามุม PQR = 60° ก่อน (เท่ากับมุม APQ) จากนั้นมุม QPR = 180° − 60° − 45°`}],visual:{kind:`geometryFigure`,width:310,height:190,segments:[{x1:20,y1:40,x2:310,y2:40,ticks:2},{x1:20,y1:170,x2:310,y2:170,ticks:2},{x1:150,y1:40,x2:75,y2:170},{x1:150,y1:40,x2:280,y2:170}],points:[{x:20,y:40,label:`A`,labelOffset:[-14,4]},{x:310,y:40,label:`B`,labelOffset:[10,4]},{x:150,y:40,label:`P`,labelOffset:[0,-10]},{x:20,y:170,label:`C`,labelOffset:[-14,10]},{x:310,y:170,label:`D`,labelOffset:[10,10]},{x:75,y:170,label:`Q`,labelOffset:[-8,16]},{x:280,y:170,label:`R`,labelOffset:[8,16]}],angleMarks:[{x:150,y:40,fromDeg:180,toDeg:240,radius:16,label:`60°`,color:`var(--coral)`},{x:150,y:40,fromDeg:240,toDeg:315,radius:30,label:`x`,color:`var(--navy)`},{x:280,y:170,fromDeg:135,toDeg:180,radius:18,label:`45°`,color:`var(--coral)`}],alt:{en:`Two parallel lines AB and CD cut by a triangle PQR, with a 60-degree angle at P, a 45-degree angle at R, and unknown angle x at P.`,th:`เส้นขนานสองเส้น AB และ CD ตัดกับรูปสามเหลี่ยม PQR โดยมีมุม 60 องศาที่จุด P มุม 45 องศาที่จุด R และมุม x ที่ไม่ทราบค่าที่จุด P`}},estimatedSeconds:100},{id:`B-10`,testId:`stw-mock-b`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Equal-volume cylinders`,th:`ทรงกระบอกที่มีปริมาตรเท่ากัน`},difficulty:F(10),prompt:{en:`Tank A is a cylinder with base radius 8 cm and height 9 cm, completely full of water. All the water is poured into empty Tank B, a cylinder with base radius 6 cm, and it exactly fills Tank B to the top. What is the height of Tank B?`,th:`ถังน้ำ A เป็นทรงกระบอกรัศมีฐาน 8 เซนติเมตร สูง 9 เซนติเมตร มีน้ำเต็มถัง เมื่อเทน้ำทั้งหมดลงในถัง B ซึ่งเป็นทรงกระบอกรัศมีฐาน 6 เซนติเมตรที่ว่างเปล่า ปรากฏว่าน้ำเต็มถัง B พอดี ถัง B สูงเท่าใด`},options:[{id:`A`,label:{en:`12 cm`,th:`12 เซนติเมตร`}},{id:`B`,label:{en:`2 cm`,th:`2 เซนติเมตร`}},{id:`C`,label:{en:`16 cm`,th:`16 เซนติเมตร`}},{id:`D`,label:{en:`96 cm`,th:`96 เซนติเมตร`}}],correctOptionId:`C`,explanation:{en:`Equal volumes mean r₁² × h₁ = r₂² × h₂, so 8² × 9 = 6² × h₂, giving 576 = 36 × h₂, so h₂ = 576 ÷ 36 = 16 cm.`,th:`ปริมาตรเท่ากันหมายความว่า r₁² × h₁ = r₂² × h₂ ดังนั้น 8² × 9 = 6² × h₂ ได้ 576 = 36 × h₂ จะได้ h₂ = 576 ÷ 36 = 16 เซนติเมตร`},distractorNotes:{A:{en:`Scales the height by the simple radius ratio (8:6) without squaring it, forgetting that volume depends on the radius squared.`,th:`ปรับความสูงตามอัตราส่วนรัศมี (8:6) แบบตรงๆ โดยไม่ยกกำลังสอง ลืมไปว่าปริมาตรขึ้นอยู่กับรัศมียกกำลังสอง`},B:{en:`Divides by the square of Tank A's radius instead of Tank B's, mixing up which radius needs to be squared in the denominator.`,th:`หารด้วยรัศมีของถัง A ยกกำลังสอง แทนที่จะเป็นรัศมีของถัง B ทำให้สลับตัวหารที่ต้องยกกำลังสอง`},D:{en:`Uses Tank B's radius without squaring it (divides by 6 instead of 36), making the height come out far too large.`,th:`ใช้รัศมีของถัง B โดยไม่ยกกำลังสอง (หารด้วย 6 แทนที่จะเป็น 36) ทำให้ความสูงที่ได้มากเกินจริงไปมาก`}},hints:[{en:`Remember that the volume of a cylinder depends on the SQUARE of its radius, not just the radius itself.`,th:`อย่าลืมว่าปริมาตรของทรงกระบอกขึ้นอยู่กับรัศมียกกำลังสอง ไม่ใช่รัศมีเฉยๆ`},{en:`Since the two volumes are equal, set (radius of A)² × (height of A) equal to (radius of B)² × (height of B).`,th:`เนื่องจากปริมาตรทั้งสองเท่ากัน ให้ตั้งสมการ (รัศมีถัง A)² × (ความสูงถัง A) เท่ากับ (รัศมีถัง B)² × (ความสูงถัง B)`},{en:`Compute 8² × 9 = 576, then divide by 6² = 36 to find the height of Tank B.`,th:`คำนวณ 8² × 9 = 576 แล้วนำไปหารด้วย 6² = 36 เพื่อหาความสูงของถัง B`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:16,height:9,label:`Tank A`},{baseSide:12,height:16,heightLabel:`h`,label:`Tank B`}],alt:{en:`Tank A, a wide short cylinder, and Tank B, a narrower taller cylinder with unknown height h.`,th:`ถัง A เป็นทรงกระบอกเตี้ยและกว้าง ส่วนถัง B เป็นทรงกระบอกที่แคบกว่าและสูงกว่าโดยมีความสูง h ที่ไม่ทราบค่า`}},estimatedSeconds:100},{id:`B-11`,testId:`stw-mock-b`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite area — rectangle minus a corner triangle`,th:`พื้นที่รูปประกอบ: สี่เหลี่ยมผืนผ้าตัดมุมสามเหลี่ยม`},difficulty:F(11),prompt:{en:`A rectangular piece of card measures 24 cm by 16 cm. A triangular corner is cut off, with the two legs of the cut measuring 8 cm and 6 cm as shown (shaded region). What is the area of the remaining shaded pentagon?`,th:`กระดาษแข็งรูปสี่เหลี่ยมผืนผ้าขนาด 24 เซนติเมตร คูณ 16 เซนติเมตร ถูกตัดมุมออกเป็นรูปสามเหลี่ยม โดยด้านประกอบมุมฉากยาว 8 เซนติเมตร และ 6 เซนติเมตร ดังรูป (บริเวณแรเงา) พื้นที่รูปห้าเหลี่ยมที่แรเงาที่เหลืออยู่มีค่าเท่าใด`},options:[{id:`A`,label:{en:`384 cm²`,th:`384 ตารางเซนติเมตร`}},{id:`B`,label:{en:`360 cm²`,th:`360 ตารางเซนติเมตร`}},{id:`C`,label:{en:`336 cm²`,th:`336 ตารางเซนติเมตร`}},{id:`D`,label:{en:`160 cm²`,th:`160 ตารางเซนติเมตร`}}],correctOptionId:`B`,explanation:{en:`The rectangle's area is 24 × 16 = 384 cm². The cut-off triangle has area \\frac{8 × 6}{2} = 24 cm². The shaded pentagon's area is 384 − 24 = 360 cm².`,th:`พื้นที่สี่เหลี่ยมผืนผ้าคือ 24 × 16 = 384 ตารางเซนติเมตร พื้นที่รูปสามเหลี่ยมที่ถูกตัดออกคือ \\frac{8 × 6}{2} = 24 ตารางเซนติเมตร พื้นที่รูปห้าเหลี่ยมที่แรเงาคือ 384 − 24 = 360 ตารางเซนติเมตร`},distractorNotes:{A:{en:`Forgets to subtract the cut-off triangle at all, just reporting the full rectangle's area.`,th:`ลืมลบพื้นที่รูปสามเหลี่ยมที่ถูกตัดออกไปเลย โดยตอบเป็นพื้นที่สี่เหลี่ยมผืนผ้าเต็มรูป`},C:{en:`Subtracts the full 8 × 6 = 48 rectangle area of the cut instead of the triangle's half-area, giving 384 − 48 = 336.`,th:`ลบพื้นที่สี่เหลี่ยม 8 × 6 = 48 ทั้งหมด แทนที่จะลบเพียงครึ่งเดียวซึ่งเป็นพื้นที่สามเหลี่ยม ทำให้ได้ 384 − 48 = 336`},D:{en:`Incorrectly treats it as (24 − 8) × (16 − 6), multiplying the reduced side lengths together instead of subtracting the triangle's area from the rectangle.`,th:`คำนวณผิดพลาดโดยใช้ (24 − 8) × (16 − 6) คือนำด้านที่ลดลงมาคูณกัน แทนที่จะลบพื้นที่สามเหลี่ยมออกจากสี่เหลี่ยมผืนผ้า`}},hints:[{en:`Start by finding the area of the whole rectangle before any cutting.`,th:`เริ่มจากหาพื้นที่ของสี่เหลี่ยมผืนผ้าทั้งรูปก่อนที่จะถูกตัด`},{en:`The shaded area is the rectangle's area minus the area of the small triangle that was cut away.`,th:`พื้นที่แรเงาคือพื้นที่สี่เหลี่ยมผืนผ้าลบด้วยพื้นที่รูปสามเหลี่ยมเล็กที่ถูกตัดออก`},{en:`Rectangle area = 24 × 16 = 384. Triangle area = (8 × 6) ÷ 2 = 24. Subtract to find the shaded area.`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 24 × 16 = 384 พื้นที่สามเหลี่ยม = (8 × 6) ÷ 2 = 24 นำมาลบกันเพื่อหาพื้นที่แรเงา`}],visual:{kind:`geometryFigure`,width:192,height:128,showGrid:!0,gridStep:16,polygons:[{points:[[0,0],[128,0],[192,48],[192,128],[0,128]],fill:`shaded`}],segments:[{x1:128,y1:0,x2:192,y2:0,style:`dashed`},{x1:192,y1:0,x2:192,y2:48,style:`dashed`}],labels:[{x:96,y:144,text:`24 cm`},{x:-14,y:64,text:`16 cm`},{x:160,y:-12,text:`8 cm`},{x:212,y:24,text:`6 cm`}],alt:{en:`A rectangle with its top-right corner cut off by a triangle, leaving a shaded pentagon.`,th:`สี่เหลี่ยมผืนผ้าที่ถูกตัดมุมบนขวาออกเป็นรูปสามเหลี่ยม เหลือเป็นรูปห้าเหลี่ยมที่แรเงา`}},estimatedSeconds:110},{id:`B-12`,testId:`stw-mock-b`,number:12,skill:`Geometry & Angles`,topic:{en:`Zigzag angles between parallel lines`,th:`มุมหักมุมระหว่างเส้นขนาน`},difficulty:F(12),prompt:{en:`In the diagram, line PQ is parallel to line RS. A bent path runs from A (on PQ) to M, then from M to B (on RS); the dashed line through M is parallel to both PQ and RS. Angle QAM = (2x + 15)° and angle MBR = (3x − 5)°, and together these two angles make up the full turn at M, so (2x + 15) + (3x − 5) = 100. Find angle MBR.`,th:`จากรูป เส้น PQ ขนานกับเส้น RS มีเส้นหักมุมจากจุด A (บนเส้น PQ) ไปยังจุด M แล้วจากจุด M ไปยังจุด B (บนเส้น RS) โดยเส้นประที่ลากผ่าน M ขนานกับทั้ง PQ และ RS มุม QAM = (2x + 15)° และมุม MBR = (3x − 5)° และมุมทั้งสองนี้รวมกันเท่ากับมุมหักเต็มที่จุด M นั่นคือ (2x + 15) + (3x − 5) = 100 จงหามุม MBR`},options:[{id:`A`,label:{en:`51°`,th:`51°`}},{id:`B`,label:{en:`18°`,th:`18°`}},{id:`C`,label:{en:`43°`,th:`43°`}},{id:`D`,label:{en:`49°`,th:`49°`}}],correctOptionId:`D`,explanation:{en:`Solve (2x+15) + (3x-5) = 100: 5x + 10 = 100, so 5x = 90 and x = 18. Angle MBR = 3(18) − 5 = 54 − 5 = 49°.`,th:`แก้สมการ (2x+15) + (3x-5) = 100: 5x + 10 = 100 ดังนั้น 5x = 90 และ x = 18 มุม MBR = 3(18) − 5 = 54 − 5 = 49°`},distractorNotes:{A:{en:`Finds x = 18 correctly but substitutes it into the wrong expression (2x + 15, the top angle) instead of the one asked for.`,th:`หาค่า x = 18 ได้ถูกต้อง แต่แทนค่าลงในนิพจน์ผิด (2x + 15 ซึ่งเป็นมุมด้านบน) แทนที่จะเป็นมุมที่โจทย์ถาม`},B:{en:`Solves for x correctly but forgets to substitute it back into the angle expression, giving the value of x itself as the final answer.`,th:`หาค่า x ได้ถูกต้อง แต่ลืมแทนค่ากลับเข้าไปในนิพจน์ของมุม ทำให้ตอบค่า x เองเป็นคำตอบสุดท้าย`},C:{en:`Sets up the equation using 90° instead of the correct 100° for the full turn at M, getting x = 16, then computes 3(16) − 5 = 43.`,th:`ตั้งสมการโดยใช้ 90° แทนที่จะเป็น 100° ที่ถูกต้องสำหรับมุมหักเต็มที่จุด M ทำให้ได้ x = 16 แล้วคำนวณ 3(16) − 5 = 43`}},hints:[{en:`This is an equation problem — first combine the two angle expressions and set them equal to 100.`,th:`นี่คือโจทย์สมการ ให้เริ่มจากนำนิพจน์มุมทั้งสองมารวมกันแล้วตั้งให้เท่ากับ 100`},{en:`Combine like terms: (2x + 15) + (3x − 5) = 5x + 10. Set this equal to 100 and solve for x.`,th:`รวมพจน์ที่คล้ายกัน: (2x + 15) + (3x − 5) = 5x + 10 ตั้งให้เท่ากับ 100 แล้วแก้หาค่า x`},{en:`Once you find x = 18, substitute it into (3x − 5), the expression for angle MBR, not the other one.`,th:`เมื่อหาค่า x = 18 ได้แล้ว ให้แทนค่าลงในนิพจน์ (3x − 5) ซึ่งเป็นมุม MBR ไม่ใช่นิพจน์อีกตัว`}],visual:{kind:`geometryFigure`,width:300,height:190,segments:[{x1:20,y1:30,x2:300,y2:30,ticks:2},{x1:20,y1:170,x2:300,y2:170,ticks:2},{x1:40,y1:108,x2:280,y2:108,style:`dashed`,ticks:2},{x1:80,y1:30,x2:143,y2:108},{x1:143,y1:108,x2:197,y2:170}],points:[{x:20,y:30,label:`P`,labelOffset:[-14,4]},{x:300,y:30,label:`Q`,labelOffset:[10,4]},{x:80,y:30,label:`A`,labelOffset:[0,-10]},{x:20,y:170,label:`R`,labelOffset:[-14,4]},{x:300,y:170,label:`S`,labelOffset:[10,4]},{x:197,y:170,label:`B`,labelOffset:[4,18]},{x:143,y:108,label:`M`,labelOffset:[10,-6]}],angleMarks:[{x:80,y:30,fromDeg:309,toDeg:360,radius:18,label:`(2x+15)°`,color:`var(--coral)`},{x:197,y:170,fromDeg:131,toDeg:180,radius:18,label:`(3x-5)°`,color:`var(--coral)`}],alt:{en:`A bent path zigzagging between two parallel lines PQ and RS, with algebraic angles marked at the bend points.`,th:`เส้นหักมุมระหว่างเส้นขนานสองเส้น PQ และ RS โดยมีมุมที่เป็นนิพจน์พีชคณิตกำกับไว้ที่จุดหักมุม`}},estimatedSeconds:115},{id:`B-13`,testId:`stw-mock-b`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Ring area and radius ratio`,th:`พื้นที่วงแหวนกับอัตราส่วนรัศมี`},difficulty:F(13),prompt:{en:`Two circles share the same center. The area of the ring (shaded region) between them is 3 times the area of the inner circle. Find the ratio of the outer radius to the inner radius.`,th:`วงกลมสองวงมีจุดศูนย์กลางเดียวกัน พื้นที่วงแหวน (บริเวณแรเงา) ระหว่างวงกลมทั้งสองมีค่าเป็น 3 เท่าของพื้นที่วงกลมวงใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`2 : 1`,th:`2 : 1`}},{id:`B`,label:{en:`4 : 1`,th:`4 : 1`}},{id:`C`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`D`,label:{en:`1 : 2`,th:`1 : 2`}}],correctOptionId:`A`,explanation:{en:`Let the inner radius be r and outer radius R. The outer circle's area equals the ring plus the inner circle: 3 times the inner circle plus the inner circle = 4 times the inner circle. So R² = 4r², which means R = 2r. The ratio is 2 : 1.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R พื้นที่วงกลมวงนอกเท่ากับพื้นที่วงแหวนบวกกับพื้นที่วงกลมวงใน คือ 3 เท่าของวงในบวกกับวงใน เท่ากับ 4 เท่าของวงใน ดังนั้น R² = 4r² ซึ่งหมายความว่า R = 2r อัตราส่วนคือ 2 : 1`},distractorNotes:{B:{en:`Confuses the total-area ratio (outer circle to inner circle is 4:1) with the radius ratio, forgetting that area ratio equals the square of the radius ratio.`,th:`สับสนระหว่างอัตราส่วนพื้นที่รวม (วงกลมวงนอกต่อวงใน เท่ากับ 4:1) กับอัตราส่วนรัศมี โดยลืมว่าอัตราส่วนพื้นที่เท่ากับอัตราส่วนรัศมียกกำลังสอง`},C:{en:`Uses the given "3 times" ring-to-inner-circle relationship directly as the radius ratio, without accounting for it being an area relationship.`,th:`นำตัวเลข "3 เท่า" ที่กำหนดให้ของพื้นที่วงแหวนต่อวงในมาใช้เป็นอัตราส่วนรัศมีโดยตรง โดยไม่คำนึงว่าเป็นความสัมพันธ์ของพื้นที่`},D:{en:`Correctly finds the ratio's magnitude but inverts it, mixing up which radius (inner or outer) is larger.`,th:`หาค่าขนาดของอัตราส่วนได้ถูกต้อง แต่สลับกลับด้าน โดยสับสนว่ารัศมีใด (วงในหรือวงนอก) มีค่ามากกว่ากัน`}},hints:[{en:`Think about how the ring's area, the inner circle's area, and the outer circle's area are related.`,th:`ลองคิดว่าพื้นที่วงแหวน พื้นที่วงกลมวงใน และพื้นที่วงกลมวงนอก สัมพันธ์กันอย่างไร`},{en:`The outer circle's total area = the ring's area + the inner circle's area. Work out this total as a multiple of the inner circle's area first.`,th:`พื้นที่รวมของวงกลมวงนอก = พื้นที่วงแหวน + พื้นที่วงกลมวงใน ให้หาผลรวมนี้เป็นกี่เท่าของพื้นที่วงในก่อน`},{en:`The outer circle's area is 4 times the inner circle's area, so R² = 4r². Take the square root of both sides to find the ratio of R to r.`,th:`พื้นที่วงกลมวงนอกเป็น 4 เท่าของพื้นที่วงใน ดังนั้น R² = 4r² ให้ถอดรากที่สองทั้งสองข้างเพื่อหาอัตราส่วนของ R ต่อ r`}],visual:{kind:`concentricCircles`,outerRadius:20,innerRadius:10,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles, with the shaded ring between them equal to 3 times the area of the inner circle.`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกัน โดยวงแหวนที่แรเงาระหว่างวงกลมทั้งสองมีพื้นที่เป็น 3 เท่าของวงกลมวงใน`}},estimatedSeconds:120},{id:`B-14`,testId:`stw-mock-b`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Overlapping quarter circles (leaf area)`,th:`พื้นที่รูปใบไม้จากส่วนโค้งวงกลมซ้อนทับ`},difficulty:F(14),prompt:{en:`A square piece of card has sides 14 cm long. Two quarter-circle arcs are drawn, one centered at each of two opposite corners, each with radius equal to the side of the square, as shown. Find the area of the shaded leaf-shaped region where the two quarter circles overlap. (Use π = \\frac{22}{7}.)`,th:`กระดาษแข็งรูปสี่เหลี่ยมจัตุรัสมีด้านยาว 14 เซนติเมตร มีการลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้น โดยมีจุดศูนย์กลางอยู่ที่มุมตรงข้ามกันสองมุม แต่ละเส้นมีรัศมีเท่ากับด้านของสี่เหลี่ยมจัตุรัส ดังรูป จงหาพื้นที่รูปใบไม้ที่แรเงาซึ่งเกิดจากส่วนที่ซ้อนทับกันของส่วนโค้งทั้งสอง (กำหนดให้ π = \\frac{22}{7})`},options:[{id:`A`,label:{en:`196 cm²`,th:`196 ตารางเซนติเมตร`}},{id:`B`,label:{en:`308 cm²`,th:`308 ตารางเซนติเมตร`}},{id:`C`,label:{en:`112 cm²`,th:`112 ตารางเซนติเมตร`}},{id:`D`,label:{en:`84 cm²`,th:`84 ตารางเซนติเมตร`}}],correctOptionId:`C`,explanation:{en:`Each quarter circle has area \\frac{1}{4} × \\frac{22}{7} × 14^2 = 154 cm², so the two together give 308 cm². The square's area is 14 × 14 = 196 cm². The leaf area is the two quarter circles minus the square (since the square is covered twice): 308 − 196 = 112 cm².`,th:`ส่วนโค้งหนึ่งในสี่ของวงกลมแต่ละเส้นมีพื้นที่ \\frac{1}{4} × \\frac{22}{7} × 14^2 = 154 ตารางเซนติเมตร รวมสองเส้นได้ 308 ตารางเซนติเมตร พื้นที่สี่เหลี่ยมจัตุรัสคือ 14 × 14 = 196 ตารางเซนติเมตร พื้นที่รูปใบไม้คือผลรวมของส่วนโค้งทั้งสองลบด้วยพื้นที่สี่เหลี่ยม (เพราะสี่เหลี่ยมถูกนับซ้อนสองครั้ง): 308 − 196 = 112 ตารางเซนติเมตร`},distractorNotes:{A:{en:`Mistakenly gives the area of the whole square, not accounting for the arcs at all.`,th:`ตอบพื้นที่สี่เหลี่ยมจัตุรัสทั้งรูปเฉยๆ โดยไม่ได้คำนึงถึงส่วนโค้งเลย`},B:{en:`Adds the two quarter-circle areas together but forgets to subtract the square's area, which is double-counted in that sum.`,th:`นำพื้นที่ส่วนโค้งหนึ่งในสี่ของวงกลมทั้งสองมาบวกกัน แต่ลืมลบพื้นที่สี่เหลี่ยมจัตุรัสที่ถูกนับซ้ำในผลรวมนั้นออก`},D:{en:`Subtracts the square's area twice instead of once from the two quarter circles' combined area.`,th:`ลบพื้นที่สี่เหลี่ยมจัตุรัสออกสองครั้งแทนที่จะลบเพียงครั้งเดียวจากผลรวมพื้นที่ส่วนโค้งทั้งสอง`}},hints:[{en:`Think about what shape you get if you add the two quarter circles together — where do they overlap?`,th:`ลองคิดว่าถ้านำพื้นที่ส่วนโค้งหนึ่งในสี่ของวงกลมทั้งสองมาบวกกัน จะได้รูปร่างอย่างไร และซ้อนทับกันตรงไหน`},{en:`The two quarter circles together cover the whole square, but the square itself gets counted twice in that sum.`,th:`ส่วนโค้งหนึ่งในสี่ของวงกลมทั้งสองรวมกันจะครอบคลุมสี่เหลี่ยมจัตุรัสทั้งรูป แต่ตัวสี่เหลี่ยมจัตุรัสเองจะถูกนับซ้ำสองครั้งในผลรวมนั้น`},{en:`Find each quarter circle's area (154 cm² each), add them (308 cm²), then subtract the square's area (196 cm²) once.`,th:`หาพื้นที่ส่วนโค้งหนึ่งในสี่ของวงกลมแต่ละเส้น (154 ตารางเซนติเมตร) นำมาบวกกัน (308 ตารางเซนติเมตร) แล้วลบพื้นที่สี่เหลี่ยมจัตุรัส (196 ตารางเซนติเมตร) ออกหนึ่งครั้ง`}],visual:{kind:`leafShape`,width:60,height:60,corners:`topLeft-bottomRight`,alt:{en:`A square with side 14 cm and two quarter-circle arcs from opposite corners overlapping to form a shaded leaf shape.`,th:`สี่เหลี่ยมจัตุรัสด้านยาว 14 เซนติเมตร มีส่วนโค้งหนึ่งในสี่ของวงกลมจากมุมตรงข้ามสองมุมซ้อนทับกันเป็นรูปใบไม้ที่แรเงา`}},estimatedSeconds:115},{id:`B-15`,testId:`stw-mock-b`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a remaining amount`,th:`เศษส่วนของปริมาณที่เหลืออยู่`},difficulty:F(15),prompt:{en:`A container holds 72 liters of paint for the art room. On Monday, \\frac{3}{8} of the paint is used for a mural. On Tuesday, \\frac{2}{5} of the REMAINING paint is used for posters. Find the difference between the amount of paint used on Monday and the amount used on Tuesday.`,th:`ถังสีบรรจุสี 72 ลิตร สำหรับห้องศิลปะ วันจันทร์ใช้สีไป \\frac{3}{8} ของทั้งหมดเพื่อวาดภาพผนัง วันอังคารใช้สีไปอีก \\frac{2}{5} ของสีที่เหลืออยู่เพื่อทำโปสเตอร์ จงหาผลต่างระหว่างปริมาณสีที่ใช้ในวันจันทร์กับปริมาณสีที่ใช้ในวันอังคาร`},options:[{id:`A`,label:{en:`18 liters`,th:`18 ลิตร`}},{id:`B`,label:{en:`9 liters`,th:`9 ลิตร`}},{id:`C`,label:{en:`27 liters`,th:`27 ลิตร`}},{id:`D`,label:{en:`45 liters`,th:`45 ลิตร`}}],correctOptionId:`B`,explanation:{en:`Monday used \\frac{3}{8} × 72 = 27 liters, leaving 72 − 27 = 45 liters. Tuesday used \\frac{2}{5} × 45 = 18 liters. The difference is 27 − 18 = 9 liters.`,th:`วันจันทร์ใช้สี \\frac{3}{8} × 72 = 27 ลิตร เหลือสี 72 − 27 = 45 ลิตร วันอังคารใช้สี \\frac{2}{5} × 45 = 18 ลิตร ผลต่างคือ 27 − 18 = 9 ลิตร`},distractorNotes:{A:{en:`Gives the amount used on Tuesday only, forgetting to find the difference between the two days.`,th:`ตอบเฉพาะปริมาณสีที่ใช้ในวันอังคารเท่านั้น โดยลืมหาผลต่างระหว่างสองวัน`},C:{en:`Gives the amount used on Monday only, forgetting to find the difference between the two days.`,th:`ตอบเฉพาะปริมาณสีที่ใช้ในวันจันทร์เท่านั้น โดยลืมหาผลต่างระหว่างสองวัน`},D:{en:`Gives the amount of paint remaining after Monday (an intermediate value), not the difference the question asked for.`,th:`ตอบปริมาณสีที่เหลืออยู่หลังวันจันทร์ (ซึ่งเป็นค่าระหว่างการคำนวณ) แทนที่จะเป็นผลต่างที่โจทย์ถาม`}},hints:[{en:`Work out how much paint is used on Monday first.`,th:`หาปริมาณสีที่ใช้ในวันจันทร์ก่อน`},{en:`Tuesday's fraction applies to what is LEFT after Monday, not to the original 72 liters.`,th:`เศษส่วนของวันอังคารใช้กับปริมาณสีที่เหลืออยู่หลังวันจันทร์ ไม่ใช่กับสี 72 ลิตรตั้งแต่แรก`},{en:`Monday: 27 liters used, 45 liters remain. Tuesday: \\frac{2}{5} of 45 is used. Then subtract the two amounts used.`,th:`วันจันทร์ใช้ไป 27 ลิตร เหลือ 45 ลิตร วันอังคารใช้ \\frac{2}{5} ของ 45 ลิตร จากนั้นนำปริมาณที่ใช้ทั้งสองวันมาลบกัน`}],visual:null,estimatedSeconds:100},{id:`B-16`,testId:`stw-mock-b`,number:16,skill:`Algebra & Patterns`,topic:{en:`Cut corners — solving for the unknown leg`,th:`ตัดมุมสี่เหลี่ยม หาความยาวขาที่ไม่ทราบค่า`},difficulty:F(16),prompt:{en:`A square sheet of paper has side length 20 cm. Congruent right-angled triangles are cut from each of the four corners, with both legs of each triangle equal to x cm (as shown). The remaining eight-sided shape has an area of 328 cm². Find the value of x.`,th:`กระดาษรูปสี่เหลี่ยมจัตุรัสมีด้านยาว 20 เซนติเมตร ถูกตัดมุมทั้งสี่มุมออกเป็นรูปสามเหลี่ยมมุมฉากที่เท่ากันทุกมุม โดยแต่ละมุมมีด้านประกอบมุมฉากยาว x เซนติเมตรเท่ากันทั้งสองด้าน (ดังรูป) รูปแปดเหลี่ยมที่เหลือมีพื้นที่ 328 ตารางเซนติเมตร จงหาค่าของ x`},options:[{id:`A`,label:{en:`12 cm`,th:`12 เซนติเมตร`}},{id:`B`,label:{en:`18 cm`,th:`18 เซนติเมตร`}},{id:`C`,label:{en:`10 cm`,th:`10 เซนติเมตร`}},{id:`D`,label:{en:`6 cm`,th:`6 เซนติเมตร`}}],correctOptionId:`D`,explanation:{en:`Each corner triangle has area \\frac{x^2}{2}, and there are 4 corners, so the total cut area is 2x². The square's area minus the cut area equals the remaining shape: 400 − 2x² = 328, so 2x² = 72, x² = 36, and x = 6 cm.`,th:`สามเหลี่ยมที่มุมแต่ละมุมมีพื้นที่ \\frac{x^2}{2} และมีทั้งหมด 4 มุม พื้นที่ที่ถูกตัดออกรวมจึงเท่ากับ 2x² พื้นที่สี่เหลี่ยมจัตุรัสลบพื้นที่ที่ถูกตัดออกเท่ากับพื้นที่รูปที่เหลือ: 400 − 2x² = 328 ดังนั้น 2x² = 72, x² = 36 และ x = 6 เซนติเมตร`},distractorNotes:{A:{en:`Forgets to multiply the single triangle's area by 4, subtracting only one corner's worth of area: 400 − \\frac{x^2}{2} = 328 gives x = 12.`,th:`ลืมคูณพื้นที่สามเหลี่ยมมุมเดียวด้วย 4 โดยลบพื้นที่ออกเพียงมุมเดียว: 400 − \\frac{x^2}{2} = 328 ทำให้ได้ x = 12`},B:{en:`Correctly finds x² = 36 but then mistakenly halves it while looking for x, giving 18 instead of taking the square root.`,th:`หา x² = 36 ได้ถูกต้อง แต่คำนวณผิดพลาดโดยนำ 36 มาหารด้วย 2 แทนที่จะถอดรากที่สอง ทำให้ได้ 18`},C:{en:`Guesses that x equals half of the square's side length (20 ÷ 2 = 10), without setting up the area equation at all.`,th:`เดาว่า x เท่ากับครึ่งหนึ่งของด้านสี่เหลี่ยมจัตุรัส (20 ÷ 2 = 10) โดยไม่ได้ตั้งสมการพื้นที่เลย`}},hints:[{en:`Start with the area of the whole square before any corners are cut.`,th:`เริ่มจากพื้นที่สี่เหลี่ยมจัตุรัสทั้งรูปก่อนที่จะถูกตัดมุม`},{en:`Each cut-off corner is a right triangle with both legs x, so its area is \\frac{x^2}{2}. There are 4 identical corners.`,th:`แต่ละมุมที่ถูกตัดออกเป็นรูปสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว x ทั้งสองด้าน พื้นที่จึงเป็น \\frac{x^2}{2} และมีมุมแบบนี้ทั้งหมด 4 มุม`},{en:`Set up: 400 − 2x² = 328. Solve for x² first, then take the square root.`,th:`ตั้งสมการ: 400 − 2x² = 328 หาค่า x² ก่อน แล้วจึงถอดรากที่สอง`}],visual:{kind:`geometryFigure`,width:200,height:200,polygons:[{points:[[60,0],[140,0],[200,60],[200,140],[140,200],[60,200],[0,140],[0,60]],fill:`shaded`}],segments:[{x1:60,y1:0,x2:0,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:60,style:`dashed`}],labels:[{x:30,y:-12,text:`x`},{x:-14,y:30,text:`x`}],alt:{en:`A square with all four corners cut off by congruent right triangles, leaving a shaded octagon in the middle.`,th:`สี่เหลี่ยมจัตุรัสที่ถูกตัดมุมทั้งสี่มุมออกเป็นรูปสามเหลี่ยมมุมฉากที่เท่ากัน เหลือรูปแปดเหลี่ยมที่แรเงาอยู่ตรงกลาง`}},estimatedSeconds:130},{id:`B-17`,testId:`stw-mock-b`,number:17,skill:`Graphs & Data`,topic:{en:`Reading a grouped bar chart`,th:`การอ่านกราฟแท่งแบบกลุ่ม`},difficulty:F(17),prompt:{en:`The bar chart shows monthly attendance for the Art Club and the Music Club. Which of the following statements is INCORRECT?`,th:`กราฟแท่งแสดงจำนวนผู้เข้าร่วมของชมรมศิลปะและชมรมดนตรีในแต่ละเดือน ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Art Club's attendance in August was higher than in June.`,th:`ผู้เข้าร่วมชมรมศิลปะในเดือนสิงหาคมมากกว่าเดือนมิถุนายน`}},{id:`B`,label:{en:`The Music Club's total attendance over the four months was 100.`,th:`ผู้เข้าร่วมชมรมดนตรีรวมทั้งสี่เดือนเท่ากับ 100 คน`}},{id:`C`,label:{en:`In July, the Art Club had more attendees than the Music Club.`,th:`ในเดือนกรกฎาคม ชมรมศิลปะมีผู้เข้าร่วมมากกว่าชมรมดนตรี`}},{id:`D`,label:{en:`June and August had the same combined (Art + Music) attendance.`,th:`เดือนมิถุนายนและสิงหาคมมีผู้เข้าร่วมรวม (ศิลปะ + ดนตรี) เท่ากัน`}}],correctOptionId:`A`,explanation:{en:`Art Club's June attendance was 22 and August's was 18 — August was LOWER than June, so this statement is false. Checking the others: Music Club's total is 26+24+30+20 = 100 (true), July's Art Club (28) beat Music Club (24) (true), and June (22+26=48) equals August (18+30=48) (true).`,th:`ผู้เข้าร่วมชมรมศิลปะเดือนมิถุนายนคือ 22 คน และเดือนสิงหาคมคือ 18 คน ซึ่งเดือนสิงหาคมน้อยกว่าเดือนมิถุนายน ข้อความนี้จึงไม่ถูกต้อง เมื่อตรวจสอบข้ออื่น: ผู้เข้าร่วมชมรมดนตรีรวมคือ 26+24+30+20 = 100 (ถูกต้อง) เดือนกรกฎาคมชมรมศิลปะ (28) มากกว่าชมรมดนตรี (24) (ถูกต้อง) และเดือนมิถุนายน (22+26=48) เท่ากับเดือนสิงหาคม (18+30=48) (ถูกต้อง)`},distractorNotes:{B:{en:`This statement is actually true — likely misread one of the Music Club bars, making the total seem wrong when it correctly adds up to 100.`,th:`ข้อความนี้จริงๆ แล้วถูกต้อง อาจอ่านค่าแท่งกราฟชมรมดนตรีผิดพลาด ทำให้คิดว่าผลรวมไม่ถูกต้อง ทั้งที่รวมแล้วได้ 100 พอดี`},C:{en:`This statement is also true — likely compared the wrong pair of bars (e.g. a different month), since July does show the Art Club ahead.`,th:`ข้อความนี้ก็ถูกต้องเช่นกัน อาจเปรียบเทียบแท่งกราฟผิดเดือน เพราะเดือนกรกฎาคมชมรมศิลปะมีผู้เข้าร่วมมากกว่าจริง`},D:{en:`This statement is true as well — likely misread one of the bar heights, making June and August seem unequal when both actually total 48.`,th:`ข้อความนี้ถูกต้องเช่นกัน อาจอ่านความสูงของแท่งกราฟผิดพลาด ทำให้คิดว่ามิถุนายนกับสิงหาคมไม่เท่ากัน ทั้งที่รวมแล้วได้ 48 เท่ากันทั้งคู่`}},hints:[{en:`Check each statement one at a time against the actual bar heights — do not just trust your first impression.`,th:`ตรวจสอบข้อความแต่ละข้อทีละข้อเทียบกับความสูงของแท่งกราฟจริง อย่าเพิ่งเชื่อความรู้สึกแรก`},{en:`Pay close attention to the Art Club bars for June and August specifically — compare their exact heights.`,th:`สังเกตแท่งกราฟของชมรมศิลปะในเดือนมิถุนายนและสิงหาคมให้ดี แล้วเปรียบเทียบความสูงที่แท้จริง`},{en:`Art Club's June value (22) is actually higher than its August value (18), which makes the statement about August being higher false.`,th:`ค่าของชมรมศิลปะเดือนมิถุนายน (22) จริงๆ แล้วมากกว่าเดือนสิงหาคม (18) ทำให้ข้อความที่บอกว่าสิงหาคมมากกว่านั้นไม่ถูกต้อง`}],visual:{kind:`barChart`,categories:[`Jun`,`Jul`,`Aug`,`Sep`],series:[{name:{en:`Art Club`,th:`ชมรมศิลปะ`},color:`coral`,values:[22,28,18,32]},{name:{en:`Music Club`,th:`ชมรมดนตรี`},color:`teal`,values:[26,24,30,20]}],yStep:10,yMax:40,alt:{en:`A grouped bar chart comparing monthly attendance of the Art Club and Music Club from June to September.`,th:`กราฟแท่งแบบกลุ่มเปรียบเทียบจำนวนผู้เข้าร่วมของชมรมศิลปะและชมรมดนตรีในแต่ละเดือนตั้งแต่มิถุนายนถึงกันยายน`}},estimatedSeconds:130},{id:`B-18`,testId:`stw-mock-b`,number:18,skill:`Graphs & Data`,topic:{en:`Pie chart proportions`,th:`สัดส่วนในแผนภูมิวงกลม`},difficulty:F(18),prompt:{en:`A survey asked Primary 6 students which library corner they liked best. The results are shown in the pie chart. If 45 students chose 'Comics', how many students chose 'Fiction'?`,th:`มีการสำรวจนักเรียนชั้นประถมศึกษาปีที่ 6 ว่าชอบมุมใดในห้องสมุดมากที่สุด ผลสำรวจแสดงในแผนภูมิวงกลม ถ้ามีนักเรียน 45 คนเลือก "การ์ตูน" มีนักเรียนกี่คนที่เลือก "นวนิยาย"`},options:[{id:`A`,label:{en:`150 students`,th:`150 คน`}},{id:`B`,label:{en:`27 students`,th:`27 คน`}},{id:`C`,label:{en:`75 students`,th:`75 คน`}},{id:`D`,label:{en:`105 students`,th:`105 คน`}}],correctOptionId:`C`,explanation:{en:`Comics is 90° and represents 45 students, so each degree represents 45 ÷ 90 = 0.5 students. Fiction is 150°, so it represents 150 × 0.5 = 75 students.`,th:`การ์ตูนมีมุม 90° แทนนักเรียน 45 คน ดังนั้น 1 องศาแทนนักเรียน 45 ÷ 90 = 0.5 คน นวนิยายมีมุม 150° จึงแทนนักเรียน 150 × 0.5 = 75 คน`},distractorNotes:{A:{en:`Uses the degree value (150) itself as the number of students, without working out the actual students-per-degree ratio.`,th:`ใช้ค่าองศา (150) เป็นจำนวนนักเรียนโดยตรง โดยไม่ได้หาอัตราส่วนจำนวนนักเรียนต่อองศาที่แท้จริง`},B:{en:`Inverts the ratio, computing 45 × (90 ÷ 150) instead of 45 × (150 ÷ 90).`,th:`คำนวณอัตราส่วนกลับด้าน โดยคิด 45 × (90 ÷ 150) แทนที่จะเป็น 45 × (150 ÷ 90)`},D:{en:`Adds the difference in degrees between Fiction and Comics (150 − 90 = 60) to the given 45 students, instead of scaling proportionally.`,th:`นำผลต่างขององศาระหว่างนวนิยายกับการ์ตูน (150 − 90 = 60) มาบวกกับนักเรียน 45 คนที่กำหนดให้ แทนที่จะคิดตามสัดส่วนที่ถูกต้อง`}},hints:[{en:`The number of students in each slice is proportional to its angle in degrees.`,th:`จำนวนนักเรียนในแต่ละส่วนของแผนภูมิเป็นสัดส่วนโดยตรงกับมุมองศาของส่วนนั้น`},{en:`First find how many students each single degree represents, using the Comics slice.`,th:`หาก่อนว่าแต่ละองศาแทนนักเรียนกี่คน โดยใช้ข้อมูลจากส่วนการ์ตูน`},{en:`Comics: 90° = 45 students, so 1° = 0.5 students. Multiply this by Fiction's 150° to find its number of students.`,th:`การ์ตูน: 90° = 45 คน ดังนั้น 1° = 0.5 คน นำไปคูณกับมุม 150° ของนวนิยายเพื่อหาจำนวนนักเรียน`}],visual:{kind:`pieChart`,slices:[{label:`Fiction`,degrees:150,color:`coral`},{label:`Comics`,degrees:90,color:`teal`},{label:`Science`,degrees:80,color:`gold`},{label:`Reference`,degrees:40,color:`sage`}],alt:{en:`A pie chart showing the proportion of Primary 6 students who prefer each of four library corners: Fiction, Comics, Science, and Reference.`,th:`แผนภูมิวงกลมแสดงสัดส่วนนักเรียนชั้นประถมศึกษาปีที่ 6 ที่ชื่นชอบมุมห้องสมุดแต่ละมุม ได้แก่ นวนิยาย การ์ตูน วิทยาศาสตร์ และหนังสืออ้างอิง`}},estimatedSeconds:125},{id:`B-19`,testId:`stw-mock-b`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Markup, discount, and actual profit`,th:`การตั้งราคา ส่วนลด และกำไรที่แท้จริง`},difficulty:F(19),prompt:{en:`A bookshop bought a set of art supplies for 480 baht. The owner marked up the price hoping for a 35% profit, but during a clearance sale actually sold it for 40 baht less than the marked price. Find the owner's actual profit.`,th:`ร้านหนังสือซื้ออุปกรณ์ศิลปะชุดหนึ่งมาในราคา 480 บาท เจ้าของร้านตั้งราคาขายโดยหวังกำไร 35% แต่ในช่วงลดราคาล้างสต็อกกลับขายได้จริงในราคาที่ถูกกว่าราคาที่ตั้งไว้อยู่ 40 บาท จงหากำไรที่แท้จริงของเจ้าของร้าน`},options:[{id:`A`,label:{en:`168 baht`,th:`168 บาท`}},{id:`B`,label:{en:`128 baht`,th:`128 บาท`}},{id:`C`,label:{en:`88 baht`,th:`88 บาท`}},{id:`D`,label:{en:`40 baht`,th:`40 บาท`}}],correctOptionId:`B`,explanation:{en:`The marked price is 480 × 1.35 = 648 baht. The actual selling price is 648 − 40 = 608 baht. The actual profit is 608 − 480 = 128 baht.`,th:`ราคาที่ตั้งไว้คือ 480 × 1.35 = 648 บาท ราคาขายจริงคือ 648 − 40 = 608 บาท กำไรที่แท้จริงคือ 608 − 480 = 128 บาท`},distractorNotes:{A:{en:`Uses the marked price itself as the actual selling price, computing 648 − 480 = 168, without subtracting the 40-baht discount.`,th:`ใช้ราคาที่ตั้งไว้เป็นราคาขายจริงโดยตรง คำนวณ 648 − 480 = 168 โดยไม่ได้ลบส่วนลด 40 บาทออก`},C:{en:`Subtracts the discount twice (648 − 80 = 568), then computes the profit as 568 − 480 = 88.`,th:`ลบส่วนลดออกสองครั้ง (648 − 80 = 568) แล้วคำนวณกำไรเป็น 568 − 480 = 88`},D:{en:`Simply reports the 40-baht discount amount, confusing it with the actual profit.`,th:`ตอบเป็นจำนวนส่วนลด 40 บาทเฉยๆ โดยสับสนว่าเป็นกำไรที่แท้จริง`}},hints:[{en:`First figure out the marked price the owner set, before the clearance sale.`,th:`ก่อนอื่นให้หาราคาที่เจ้าของร้านตั้งไว้ ก่อนที่จะมีการลดราคา`},{en:`The actual selling price is 40 baht less than that marked price, not the same as the marked price.`,th:`ราคาขายจริงถูกกว่าราคาที่ตั้งไว้อยู่ 40 บาท ไม่ใช่ราคาเดียวกับที่ตั้งไว้`},{en:`Marked price = 480 × 1.35 = 648. Actual selling price = 648 − 40. Profit = actual selling price − cost price (480).`,th:`ราคาที่ตั้งไว้ = 480 × 1.35 = 648 ราคาขายจริง = 648 − 40 กำไร = ราคาขายจริง − ราคาทุน (480)`}],visual:null,estimatedSeconds:120},{id:`B-20`,testId:`stw-mock-b`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Percentage relationships among three amounts`,th:`ความสัมพันธ์ร้อยละระหว่างสามจำนวน`},difficulty:F(20),prompt:{en:`Three sisters — Bua, Kaew, and Dao — saved money together for a craft workshop, totaling 3,100 baht. Kaew saved 20% more than Bua, and Dao saved 25% less than Kaew. How much more did Kaew save than Dao?`,th:`พี่น้องสามคน คือ บัว แก้ว และดาว ร่วมกันเก็บเงินสำหรับเวิร์กช็อปงานฝีมือ รวมทั้งหมด 3,100 บาท แก้วเก็บเงินได้มากกว่าบัวอยู่ 20% และดาวเก็บเงินได้น้อยกว่าแก้วอยู่ 25% แก้วเก็บเงินได้มากกว่าดาวเท่าใด`},options:[{id:`A`,label:{en:`450 baht`,th:`450 บาท`}},{id:`B`,label:{en:`900 baht`,th:`900 บาท`}},{id:`C`,label:{en:`100 baht`,th:`100 บาท`}},{id:`D`,label:{en:`300 baht`,th:`300 บาท`}}],correctOptionId:`D`,explanation:{en:`Let Bua = x baht. Kaew = 1.2x. Dao = 0.75 × 1.2x = 0.9x. Sum: x + 1.2x + 0.9x = 3.1x = 3,100, so x = 1,000. Bua = 1,000, Kaew = 1,200, Dao = 900. Kaew − Dao = 1,200 − 900 = 300 baht.`,th:`ให้บัวเก็บเงินได้ x บาท แก้วเก็บได้ 1.2x ดาวเก็บได้ 0.75 × 1.2x = 0.9x ผลรวม: x + 1.2x + 0.9x = 3.1x = 3,100 ดังนั้น x = 1,000 บัวได้ 1,000 แก้วได้ 1,200 ดาวได้ 900 แก้วเก็บได้มากกว่าดาว = 1,200 − 900 = 300 บาท`},distractorNotes:{A:{en:`Mistakenly computes Dao as 25% less than Bua instead of 25% less than Kaew, giving Dao = 750 and a difference of 1,200 − 750 = 450.`,th:`คำนวณผิดพลาดโดยคิดว่าดาวเก็บเงินได้น้อยกว่าบัวอยู่ 25% แทนที่จะน้อยกว่าแก้ว ทำให้ได้ดาว = 750 และผลต่างเป็น 1,200 − 750 = 450`},B:{en:`Gives Dao's own savings amount (900) instead of the difference between Kaew and Dao that was asked for.`,th:`ตอบเป็นจำนวนเงินที่ดาวเก็บได้ (900) แทนที่จะเป็นผลต่างระหว่างแก้วกับดาวตามที่โจทย์ถาม`},C:{en:`Computes the difference between Bua and Dao (1,000 − 900 = 100) instead of between Kaew and Dao.`,th:`คำนวณผลต่างระหว่างบัวกับดาว (1,000 − 900 = 100) แทนที่จะเป็นผลต่างระหว่างแก้วกับดาว`}},hints:[{en:`Express all three sisters' savings in terms of one unknown, say Bua's amount as x.`,th:`เขียนจำนวนเงินที่ทั้งสามคนเก็บได้ในรูปของตัวไม่ทราบค่าตัวเดียว โดยให้จำนวนเงินของบัวเป็น x`},{en:`Kaew = 1.2 × Bua. Dao = 0.75 × Kaew (not 0.75 × Bua). Add all three in terms of x and set equal to 3,100.`,th:`แก้ว = 1.2 × บัว ดาว = 0.75 × แก้ว (ไม่ใช่ 0.75 × บัว) นำทั้งสามจำนวนในรูปของ x มารวมกันแล้วตั้งให้เท่ากับ 3,100`},{en:`Solve 3.1x = 3,100 to get x = 1,000, then find Kaew (1,200) and Dao (900), and subtract.`,th:`แก้สมการ 3.1x = 3,100 จะได้ x = 1,000 จากนั้นหาแก้ว (1,200) และดาว (900) แล้วนำมาลบกัน`}],visual:null,estimatedSeconds:130}]},{id:`stw-mock-c`,title:{en:`Mock Test C`,th:`ข้อสอบชุด C`},subtitle:{en:`Sports Day & Music Paper`,th:`ชุดกีฬาสีและดนตรี`},recommendedMinutes:40,questions:[{id:`C-01`,testId:`stw-mock-c`,number:1,skill:`Number & Operations`,topic:{en:`Largest number from digits`,th:`จำนวนมากที่สุดจากตัวเลข`},difficulty:F(1),prompt:{en:`The sports-day scoreboard technician has five digit cards: 1, 3, 4, 6, and 8. Using each digit exactly once, what is the largest possible 5-digit EVEN number she can form?`,th:`ช่างทำป้ายคะแนนกีฬาสีมีบัตรตัวเลข 5 ใบ คือ 1, 3, 4, 6 และ 8 ถ้าใช้ตัวเลขแต่ละใบเพียงครั้งเดียว จำนวน 5 หลักที่เป็นจำนวนคู่และมีค่ามากที่สุดที่เป็นไปได้คือเท่าใด`},options:[{id:`A`,label:{en:`86,431`,th:`86,431`}},{id:`B`,label:{en:`84,316`,th:`84,316`}},{id:`C`,label:{en:`86,314`,th:`86,314`}},{id:`D`,label:{en:`64,318`,th:`64,318`}}],correctOptionId:`C`,explanation:{en:`To make the number as large as possible, place the biggest digits first, but the last digit must be even (4, 6, or 8). Testing each: ending in 4 gives 86,314; ending in 6 gives 84,316; ending in 8 gives 64,318. The largest of these is 86,314.`,th:`เพื่อให้จำนวนมีค่ามากที่สุด ต้องวางตัวเลขที่มีค่ามากไว้หลักหน้าสุด แต่หลักหน่วยต้องเป็นเลขคู่ (4, 6 หรือ 8) เมื่อลองแต่ละกรณี: ลงท้ายด้วย 4 ได้ 86,314 ลงท้ายด้วย 6 ได้ 84,316 ลงท้ายด้วย 8 ได้ 64,318 จำนวนที่มากที่สุดคือ 86,314`},distractorNotes:{A:{en:`This is simply all five digits arranged in descending order (86,431), which ignores the requirement that the number must be even — it ends in 1, an odd digit.`,th:`นี่คือการเรียงตัวเลขทั้งห้าจากมากไปน้อยตรง ๆ (86,431) โดยลืมเงื่อนไขว่าต้องเป็นจำนวนคู่ เพราะหลักหน่วยคือ 1 ซึ่งเป็นเลขคี่`},B:{en:`This comes from ending the number in 6 instead of testing all even options — 84,316 is smaller than the best choice, which ends in 4.`,th:`ค่านี้ได้จากการลงท้ายด้วย 6 โดยไม่ได้ลองเปรียบเทียบกับตัวเลือกคู่อื่น 84,316 มีค่าน้อยกว่าคำตอบที่ถูกต้องซึ่งลงท้ายด้วย 4`},D:{en:`This mistakenly assumes the largest even digit (8) should be saved for last, which actually produces the smallest of the three even arrangements.`,th:`เข้าใจผิดว่าต้องเก็บเลขคู่ที่มากที่สุด (8) ไว้ลงท้าย ซึ่งจริง ๆ แล้วกลับให้จำนวนที่น้อยที่สุดในสามกรณีที่เป็นไปได้`}},hints:[{en:`The last digit of the number must be even.`,th:`หลักหน่วยของจำนวนต้องเป็นเลขคู่`},{en:`Try each even digit (4, 6, 8) as the last digit, then arrange the rest in descending order.`,th:`ลองใช้เลขคู่แต่ละตัว (4, 6, 8) เป็นหลักหน่วย แล้วเรียงเลขที่เหลือจากมากไปน้อย`},{en:`Compare the three results: ending in 4 gives 86,314; ending in 6 gives 84,316; ending in 8 gives 64,318. Pick the largest.`,th:`เปรียบเทียบสามคำตอบ: ลงท้าย 4 ได้ 86,314 ลงท้าย 6 ได้ 84,316 ลงท้าย 8 ได้ 64,318 แล้วเลือกจำนวนที่มากที่สุด`}],visual:null,estimatedSeconds:55},{id:`C-02`,testId:`stw-mock-c`,number:2,skill:`Word Problems & Logic`,topic:{en:`Two-price ribbon puzzle`,th:`โจทย์ราคาสองกรณี`},difficulty:F(2),prompt:{en:`Nancy is buying ribbon for the cheerleading squad. If ribbon costs 15 baht per roll, she has exactly enough to buy some rolls and has 20 baht left over. If ribbon costs 12 baht per roll instead, she can buy 3 more rolls than before and still have 5 baht left over. How much money does Nancy have?`,th:`แนนซี่กำลังซื้อริบบิ้นให้ทีมเชียร์ลีดเดอร์ ถ้าริบบิ้นราคาม้วนละ 15 บาท เธอมีเงินพอซื้อได้จำนวนหนึ่งและเหลือเงิน 20 บาท แต่ถ้าริบบิ้นราคาม้วนละ 12 บาท เธอจะซื้อได้มากกว่าเดิม 3 ม้วน และยังเหลือเงิน 5 บาท แนนซี่มีเงินทั้งหมดเท่าใด`},options:[{id:`A`,label:{en:`105 baht`,th:`105 บาท`}},{id:`B`,label:{en:`125 baht`,th:`125 บาท`}},{id:`C`,label:{en:`120 baht`,th:`120 บาท`}},{id:`D`,label:{en:`260 baht`,th:`260 บาท`}}],correctOptionId:`B`,explanation:{en:`Let n be the number of rolls bought at 15 baht each. Her money is 15n + 20, and also 12(n+3) + 5. Setting these equal: 15n + 20 = 12n + 41, so 3n = 21 and n = 7. Her money is 15(7) + 20 = 125 baht. Check: 12(10) + 5 = 125. ✓`,th:`ให้ n เป็นจำนวนม้วนที่ซื้อได้เมื่อราคาม้วนละ 15 บาท เงินของเธอคือ 15n + 20 และเท่ากับ 12(n+3) + 5 ด้วย ตั้งสมการ: 15n + 20 = 12n + 41 ได้ 3n = 21 ดังนั้น n = 7 เงินของเธอคือ 15(7) + 20 = 125 บาท ตรวจสอบ: 12(10) + 5 = 125 บาท ✓`},distractorNotes:{A:{en:`This uses 15 × 7 = 105 but forgets to add the 20 baht left over from the first scenario.`,th:`ใช้ 15 × 7 = 105 แต่ลืมบวกเงิน 20 บาทที่เหลือจากกรณีแรก`},C:{en:`This uses 12 × 10 = 120 but forgets to add the 5 baht left over from the second scenario.`,th:`ใช้ 12 × 10 = 120 แต่ลืมบวกเงิน 5 บาทที่เหลือจากกรณีที่สอง`},D:{en:`This swaps which price belongs to which scenario, solving the system backwards and producing an inflated total.`,th:`สลับราคาผิดกรณี ทำให้แก้สมการย้อนกลับและได้ยอดเงินที่สูงเกินจริง`}},hints:[{en:`Let n be the number of rolls she buys at 15 baht each.`,th:`ให้ n เป็นจำนวนม้วนที่ซื้อได้เมื่อราคาม้วนละ 15 บาท`},{en:`Her total money can be written two ways: 15n + 20, and also 12 times (n + 3) plus 5.`,th:`เงินทั้งหมดของเธอเขียนได้สองแบบ คือ 15n + 20 และ 12 คูณ (n + 3) บวก 5`},{en:`Set the two expressions equal and solve for n, then plug n back into 15n + 20 to find the money.`,th:`ให้สองสมการเท่ากันแล้วแก้หา n จากนั้นแทนค่า n กลับในสมการ 15n + 20 เพื่อหาจำนวนเงิน`}],visual:null,estimatedSeconds:70},{id:`C-03`,testId:`stw-mock-c`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering unlike fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:F(3),prompt:{en:`Seven relay teams recorded the fraction of the track they had completed when the baton was passed: \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{4}{9}, and \\frac{11}{16}. Ranking the fractions from greatest to least, which fraction is the 4th greatest?`,th:`ทีมวิ่งผลัดเจ็ดทีมบันทึกเศษส่วนของลู่วิ่งที่วิ่งได้ตอนส่งไม้ผลัด ได้แก่ \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{4}{9} และ \\frac{11}{16} เมื่อเรียงเศษส่วนจากมากไปน้อย เศษส่วนใดอยู่ในอันดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`B`,label:{en:`\\frac{5}{6}`,th:`\\frac{5}{6}`}},{id:`C`,label:{en:`\\frac{11}{16}`,th:`\\frac{11}{16}`}},{id:`D`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}}],correctOptionId:`A`,explanation:{en:`Converting to decimals: \\frac{5}{6} ≈ 0.833, \\frac{3}{4} = 0.75, \\frac{11}{16} ≈ 0.688, \\frac{2}{3} ≈ 0.667, \\frac{5}{8} = 0.625, \\frac{7}{12} ≈ 0.583, \\frac{4}{9} ≈ 0.444. Ranked from greatest to least: \\frac{5}{6}, \\frac{3}{4}, \\frac{11}{16}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{4}{9}. The 4th greatest is \\frac{2}{3}.`,th:`แปลงเป็นทศนิยม: \\frac{5}{6} ≈ 0.833, \\frac{3}{4} = 0.75, \\frac{11}{16} ≈ 0.688, \\frac{2}{3} ≈ 0.667, \\frac{5}{8} = 0.625, \\frac{7}{12} ≈ 0.583, \\frac{4}{9} ≈ 0.444 เรียงจากมากไปน้อย: \\frac{5}{6}, \\frac{3}{4}, \\frac{11}{16}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{4}{9} อันดับที่ 4 คือ \\frac{2}{3}`},distractorNotes:{B:{en:`\\frac{5}{6} is the largest fraction in the list (rank 1), not the 4th largest.`,th:`\\frac{5}{6} เป็นเศษส่วนที่มากที่สุดในรายการ (อันดับ 1) ไม่ใช่อันดับที่ 4`},C:{en:`\\frac{11}{16} is actually the 3rd largest fraction, one rank off from the correct answer.`,th:`\\frac{11}{16} จริง ๆ แล้วเป็นอันดับที่ 3 คลาดเคลื่อนไปหนึ่งอันดับจากคำตอบที่ถูกต้อง`},D:{en:`\\frac{5}{8} is the 5th largest fraction, one rank past the correct answer.`,th:`\\frac{5}{8} เป็นอันดับที่ 5 เลยคำตอบที่ถูกต้องไปหนึ่งอันดับ`}},hints:[{en:`Convert every fraction to a decimal so they are easy to compare.`,th:`แปลงเศษส่วนทุกตัวเป็นทศนิยมเพื่อให้เปรียบเทียบง่ายขึ้น`},{en:`Write all seven decimals in a line from greatest to least before picking a rank.`,th:`เขียนทศนิยมทั้งเจ็ดตัวเรียงจากมากไปน้อยก่อนจะเลือกอันดับ`},{en:`The order is 5/6, 3/4, 11/16, 2/3, 5/8, 7/12, 4/9 — count carefully to the 4th position.`,th:`ลำดับคือ 5/6, 3/4, 11/16, 2/3, 5/8, 7/12, 4/9 นับให้ถูกต้องไปยังตำแหน่งที่ 4`}],visual:null,estimatedSeconds:60},{id:`C-04`,testId:`stw-mock-c`,number:4,skill:`Number & Operations`,topic:{en:`Nested expressions`,th:`นิพจน์ซ้อนวงเล็บ`},difficulty:F(4),prompt:{en:`Let A = \\frac{1}{2} × (18 − 4) + 8 and B = (\\frac{1}{3} + \\frac{2}{3}) × 5. What is the value of 2 × (A ÷ B)?`,th:`กำหนดให้ A = \\frac{1}{2} × (18 − 4) + 8 และ B = (\\frac{1}{3} + \\frac{2}{3}) × 5 จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`B`,label:{en:`3`,th:`3`}},{id:`C`,label:{en:`30`,th:`30`}},{id:`D`,label:{en:`6`,th:`6`}}],correctOptionId:`D`,explanation:{en:`First, A = \\frac{1}{2} × 14 + 8 = 7 + 8 = 15. Next, B = 1 × 5 = 5. Then A ÷ B = 15 ÷ 5 = 3, and 2 × 3 = 6.`,th:`ก่อนอื่นหา A = \\frac{1}{2} × 14 + 8 = 7 + 8 = 15 จากนั้นหา B = 1 × 5 = 5 แล้วหา A ÷ B = 15 ÷ 5 = 3 และ 2 × 3 = 6`},distractorNotes:{A:{en:`This computes 2 × (B ÷ A) instead of 2 × (A ÷ B) — the two letters were swapped.`,th:`คำนวณ 2 × (B ÷ A) แทนที่จะเป็น 2 × (A ÷ B) โดยสลับตัวอักษรทั้งสองผิด`},B:{en:`This correctly finds A ÷ B = 3 but forgets to multiply the result by 2.`,th:`หา A ÷ B = 3 ได้ถูกต้อง แต่ลืมคูณผลลัพธ์ด้วย 2`},C:{en:`This multiplies A by 2 to get 30 but forgets to divide by B afterward.`,th:`คูณ A ด้วย 2 ได้ 30 แต่ลืมหารด้วย B ต่อ`}},hints:[{en:`Work out A and B separately first, following the order of operations.`,th:`หาค่า A และ B แยกกันก่อน โดยทำตามลำดับการดำเนินการ`},{en:`Remember: brackets first, then multiplication/division, then addition/subtraction.`,th:`จำไว้ว่าต้องทำในวงเล็บก่อน แล้วตามด้วยคูณหาร จากนั้นบวกลบ`},{en:`A = 15 and B = 5, so A ÷ B = 3. The question asks for 2 times that result.`,th:`A = 15 และ B = 5 ดังนั้น A ÷ B = 3 โจทย์ถามหา 2 เท่าของผลลัพธ์นี้`}],visual:null,estimatedSeconds:65},{id:`C-05`,testId:`stw-mock-c`,number:5,skill:`Number & Operations`,topic:{en:`Two unknowns and LCM`,th:`ตัวไม่ทราบค่าสองจำนวนและ ค.ร.น.`},difficulty:F(5),prompt:{en:`Two boxes of relay-race tickets are packed. The larger box holds 4 times as many tickets as the smaller box, plus 5 more. Together the two boxes hold 55 tickets. Find the LCM of the two amounts.`,th:`มีกล่องใส่บัตรกิจกรรมวิ่งผลัดสองกล่อง กล่องใหญ่มีบัตรเป็น 4 เท่าของกล่องเล็ก และมากกว่านั้นอีก 5 ใบ รวมกันทั้งสองกล่องมีบัตร 55 ใบ จงหา ค.ร.น. ของจำนวนบัตรทั้งสองกล่อง`},options:[{id:`A`,label:{en:`5`,th:`5`}},{id:`B`,label:{en:`90`,th:`90`}},{id:`C`,label:{en:`450`,th:`450`}},{id:`D`,label:{en:`44`,th:`44`}}],correctOptionId:`B`,explanation:{en:`Let the smaller box hold s tickets. The larger box holds 4s + 5. Since s + (4s+5) = 55, we get 5s = 50, so s = 10 and the larger box holds 45. LCM(10, 45): 10 = 2×5 and 45 = 3²×5, so LCM = 2×3²×5 = 90.`,th:`ให้กล่องเล็กมีบัตร s ใบ กล่องใหญ่มี 4s + 5 ใบ เนื่องจาก s + (4s+5) = 55 จะได้ 5s = 50 ดังนั้น s = 10 และกล่องใหญ่มี 45 ใบ หา ค.ร.น.(10, 45): 10 = 2×5 และ 45 = 3²×5 ดังนั้น ค.ร.น. = 2×3²×5 = 90`},distractorNotes:{A:{en:`This finds the GCF of 10 and 45 (which is 5), not the LCM that the question asks for.`,th:`หา ห.ร.ม. ของ 10 และ 45 (ซึ่งคือ 5) ไม่ใช่ ค.ร.น. ที่โจทย์ถาม`},C:{en:`This finds the product of the two amounts (10 × 45 = 450) instead of the LCM.`,th:`หาผลคูณของจำนวนทั้งสอง (10 × 45 = 450) แทนที่จะหา ค.ร.น.`},D:{en:`This drops the "plus 5" from the relationship, solving 4s = 55 − s to get s = 11 and the larger box as 44, then reports 44 itself instead of a correct LCM.`,th:`ลืมส่วน "มากกว่าอีก 5" ในความสัมพันธ์ แก้สมการ 4s = 55 − s ได้ s = 11 และกล่องใหญ่เป็น 44 แล้วตอบ 44 ไปเลยแทนที่จะหา ค.ร.น. ที่ถูกต้อง`}},hints:[{en:`Let s stand for the number of tickets in the smaller box.`,th:`ให้ s แทนจำนวนบัตรในกล่องเล็ก`},{en:`Write the larger box as 4s + 5, then use "smaller + larger = 55" to form an equation.`,th:`เขียนกล่องใหญ่เป็น 4s + 5 แล้วใช้ "กล่องเล็ก + กล่องใหญ่ = 55" ตั้งเป็นสมการ`},{en:`Solve to get s = 10 and the larger box = 45, then find the LCM of 10 and 45 using prime factors.`,th:`แก้สมการได้ s = 10 และกล่องใหญ่ = 45 จากนั้นหา ค.ร.น. ของ 10 และ 45 โดยใช้การแยกตัวประกอบเฉพาะ`}],visual:null,estimatedSeconds:65},{id:`C-06`,testId:`stw-mock-c`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing staircase pattern`,th:`แบบรูปขั้นบันไดที่เพิ่มขึ้น`},difficulty:F(6),prompt:{en:`Pom-poms for the cheer formation are stacked in a growing staircase pattern. Figure 1 has 1 pom-pom, Figure 2 has 3 pom-poms, and Figure 3 has 6 pom-poms, arranged as staircases. The picture shows Figure 4. If the pattern continues in the same way, how many pom-poms will Figure 10 have?`,th:`ปอมปอมสำหรับจัดฟอร์เมชันเชียร์ถูกวางเรียงเป็นขั้นบันไดที่เพิ่มขึ้นเรื่อย ๆ รูปที่ 1 มี 1 อัน รูปที่ 2 มี 3 อัน และรูปที่ 3 มี 6 อัน จัดเรียงเป็นขั้นบันได ภาพที่แสดงคือรูปที่ 4 ถ้าแบบรูปนี้เป็นแบบนี้ต่อไปเรื่อย ๆ รูปที่ 10 จะมีปอมปอมกี่อัน`},options:[{id:`A`,label:{en:`19`,th:`19`}},{id:`B`,label:{en:`45`,th:`45`}},{id:`C`,label:{en:`55`,th:`55`}},{id:`D`,label:{en:`110`,th:`110`}}],correctOptionId:`C`,explanation:{en:`The number of pom-poms in Figure n is the triangular number 1 + 2 + 3 + ... + n = n(n+1)/2 (Figure 1: 1, Figure 2: 1+2=3, Figure 3: 1+2+3=6, Figure 4: 1+2+3+4=10, matching the picture). For Figure 10: 10 × 11 ÷ 2 = 55.`,th:`จำนวนปอมปอมในรูปที่ n คือจำนวนสามเหลี่ยม 1 + 2 + 3 + ... + n = n(n+1)/2 (รูปที่ 1 มี 1, รูปที่ 2 มี 1+2=3, รูปที่ 3 มี 1+2+3=6, รูปที่ 4 มี 1+2+3+4=10 ตรงกับภาพ) สำหรับรูปที่ 10: 10 × 11 ÷ 2 = 55`},distractorNotes:{A:{en:`This wrongly assumes the pattern grows by a fixed amount of 2 each time (like 1, 3, 5, 7, ...) instead of an increasing amount, giving 1 + 2×9 = 19.`,th:`เข้าใจผิดว่าแบบรูปเพิ่มขึ้นครั้งละ 2 คงที่ (เหมือน 1, 3, 5, 7, ...) แทนที่จะเพิ่มขึ้นมากขึ้นเรื่อย ๆ ทำให้ได้ 1 + 2×9 = 19`},B:{en:`This is an off-by-one error: it calculates the count for Figure 9 (9×10÷2 = 45) instead of Figure 10.`,th:`เป็นความผิดพลาดเลื่อนอันดับไปหนึ่ง คำนวณจำนวนของรูปที่ 9 (9×10÷2 = 45) แทนที่จะเป็นรูปที่ 10`},D:{en:`This forgets to divide by 2 in the triangular-number formula, computing 10 × 11 = 110 instead.`,th:`ลืมหารด้วย 2 ในสูตรจำนวนสามเหลี่ยม คำนวณเป็น 10 × 11 = 110 แทน`}},hints:[{en:`Count how many pom-poms are added to go from one figure to the next.`,th:`นับดูว่าปอมปอมเพิ่มขึ้นกี่อันเมื่อเลื่อนจากรูปหนึ่งไปอีกรูปหนึ่ง`},{en:`The counts 1, 3, 6, 10, ... are triangular numbers, formed by adding 1 + 2 + 3 + ... up to n.`,th:`จำนวน 1, 3, 6, 10, ... คือจำนวนสามเหลี่ยม ซึ่งเกิดจากการบวก 1 + 2 + 3 + ... ไปจนถึง n`},{en:`Use the formula n(n+1) ÷ 2 with n = 10 to find Figure 10.`,th:`ใช้สูตร n(n+1) ÷ 2 โดยแทน n = 10 เพื่อหาคำตอบของรูปที่ 10`}],visual:{kind:`gridPattern`,gridSize:4,cells:[{row:0,col:0},{row:1,col:0},{row:1,col:1},{row:2,col:0},{row:2,col:1},{row:2,col:2},{row:3,col:0},{row:3,col:1},{row:3,col:2},{row:3,col:3}],alt:{en:`A staircase pattern of shaded cells: Figure 4 with 10 shaded cells arranged in rows of 1, 2, 3, and 4.`,th:`แบบรูปขั้นบันไดของช่องที่แรเงา: รูปที่ 4 มี 10 ช่องแรเงา จัดเรียงเป็นแถวละ 1, 2, 3 และ 4 ช่อง`}},estimatedSeconds:75},{id:`C-07`,testId:`stw-mock-c`,number:7,skill:`Word Problems & Logic`,topic:{en:`Catch-up on the way to the stadium`,th:`โจทย์การเดินตามทัน`},difficulty:F(7),prompt:{en:`During sports-day rehearsal, Nan walks from the school gate toward the stadium at 50 m/min. Six minutes later, her sister Mimi cycles from the same gate along the same path at 200 m/min to bring the megaphone. How many minutes after Mimi starts cycling will she catch up with Nan?`,th:`ระหว่างซ้อมกีฬาสี น่านเดินจากประตูโรงเรียนไปยังสนามกีฬาด้วยความเร็ว 50 เมตร/นาที ผ่านไป 6 นาที มีมี่ น้องสาวของเธอปั่นจักรยานจากประตูเดียวกันไปตามทางเดียวกันด้วยความเร็ว 200 เมตร/นาที เพื่อนำโทรโข่งไปให้ มีมี่จะปั่นตามทันน่านหลังจากออกตัวไปกี่นาที`},options:[{id:`A`,label:{en:`2 minutes`,th:`2 นาที`}},{id:`B`,label:{en:`1.5 minutes`,th:`1.5 นาที`}},{id:`C`,label:{en:`1.2 minutes`,th:`1.2 นาที`}},{id:`D`,label:{en:`6 minutes`,th:`6 นาที`}}],correctOptionId:`A`,explanation:{en:`When Mimi starts, Nan already has a 6-minute head start, covering 50 × 6 = 300 m. Mimi gains on Nan at a relative speed of 200 − 50 = 150 m/min. Time to catch up = 300 ÷ 150 = 2 minutes.`,th:`เมื่อมีมี่เริ่มปั่น น่านได้ออกตัวไปแล้ว 6 นาที เป็นระยะทาง 50 × 6 = 300 เมตร มีมี่ไล่ตามด้วยความเร็วสัมพัทธ์ 200 − 50 = 150 เมตร/นาที เวลาที่ใช้ตามทัน = 300 ÷ 150 = 2 นาที`},distractorNotes:{B:{en:`This divides the 300 m head-start distance by Mimi's full speed (200 m/min) instead of the relative speed, giving 1.5 minutes.`,th:`นำระยะห่างเริ่มต้น 300 เมตร ไปหารด้วยความเร็วเต็มของมีมี่ (200 เมตร/นาที) แทนที่จะใช้ความเร็วสัมพัทธ์ ได้ 1.5 นาที`},C:{en:`This adds the two speeds (200 + 50 = 250) as if they were moving toward each other, giving 300 ÷ 250 = 1.2 minutes.`,th:`นำความเร็วทั้งสองมาบวกกัน (200 + 50 = 250) ราวกับว่าเดินสวนทางเข้าหากัน ได้ 300 ÷ 250 = 1.2 นาที`},D:{en:`This mistakes the 6-minute head start itself for the catch-up time.`,th:`เข้าใจผิดว่าเวลาที่น่านออกตัวก่อน 6 นาที คือเวลาที่ใช้ตามทัน`}},hints:[{en:`Work out how far ahead Nan already is when Mimi starts moving.`,th:`หาว่าน่านเดินไปได้ไกลแค่ไหนแล้วก่อนที่มีมี่จะเริ่มปั่น`},{en:`Since they move the same direction, use the relative (difference in) speed to close the gap.`,th:`เนื่องจากทั้งสองคนเดินไปทิศทางเดียวกัน ให้ใช้ผลต่างของความเร็วในการไล่ตามระยะห่าง`},{en:`Head-start distance = 300 m. Relative speed = 200 − 50 = 150 m/min. Divide distance by relative speed.`,th:`ระยะห่างเริ่มต้น = 300 เมตร ความเร็วสัมพัทธ์ = 200 − 50 = 150 เมตร/นาที นำระยะทางหารด้วยความเร็วสัมพัทธ์`}],visual:null,estimatedSeconds:85},{id:`C-08`,testId:`stw-mock-c`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing a fund by ratio`,th:`การแบ่งเงินตามอัตราส่วน`},difficulty:F(8),prompt:{en:`The music room fund of 960 baht is shared between the choir and the band in the ratio 5:3. The band then spends \\frac{2}{3} of its share on new drumsticks. How much money does the band have left?`,th:`กองทุนห้องดนตรี 960 บาท แบ่งให้คณะนักร้องประสานเสียงและวงดนตรีในอัตราส่วน 5:3 หลังจากนั้นวงดนตรีนำเงิน \\frac{2}{3} ของส่วนแบ่งไปซื้อไม้กลองชุดใหม่ วงดนตรีจะเหลือเงินเท่าใด`},options:[{id:`A`,label:{en:`600 baht`,th:`600 บาท`}},{id:`B`,label:{en:`240 baht`,th:`240 บาท`}},{id:`C`,label:{en:`192 baht`,th:`192 บาท`}},{id:`D`,label:{en:`120 baht`,th:`120 บาท`}}],correctOptionId:`D`,explanation:{en:`The ratio 5:3 has 8 parts total, so each part = 960 ÷ 8 = 120 baht. The band's share = 3 × 120 = 360 baht. Spending \\frac{2}{3} of it leaves \\frac{1}{3} remaining: 360 ÷ 3 = 120 baht.`,th:`อัตราส่วน 5:3 มีทั้งหมด 8 ส่วน ดังนั้นแต่ละส่วน = 960 ÷ 8 = 120 บาท ส่วนแบ่งของวงดนตรี = 3 × 120 = 360 บาท เมื่อใช้ไป \\frac{2}{3} จะเหลือ \\frac{1}{3}: 360 ÷ 3 = 120 บาท`},distractorNotes:{A:{en:`This is the choir's share (5 × 120 = 600 baht), not what remains of the band's share.`,th:`นี่คือส่วนแบ่งของคณะนักร้องประสานเสียง (5 × 120 = 600 บาท) ไม่ใช่เงินที่เหลือของวงดนตรี`},B:{en:`This calculates how much the band SPENT (\\frac{2}{3} × 360 = 240 baht) instead of how much is left over.`,th:`คำนวณเงินที่วงดนตรี "ใช้ไป" (\\frac{2}{3} × 360 = 240 บาท) แทนที่จะเป็นเงินที่เหลือ`},C:{en:`This inverts the ratio, treating the band as getting \\frac{3}{5} of the total (960 × \\frac{3}{5} = 576) then spending \\frac{2}{3} of that, leaving 192.`,th:`สลับอัตราส่วนผิด โดยคิดว่าวงดนตรีได้ \\frac{3}{5} ของทั้งหมด (960 × \\frac{3}{5} = 576) แล้วใช้ไป \\frac{2}{3} ของจำนวนนั้น เหลือ 192 บาท`}},hints:[{en:`Find the value of one part of the ratio first.`,th:`หาค่าของหนึ่งส่วนในอัตราส่วนก่อน`},{en:`The band gets 3 parts out of 8 total parts. Find the band's full share before thinking about spending.`,th:`วงดนตรีได้ 3 ส่วนจากทั้งหมด 8 ส่วน หาส่วนแบ่งเต็มของวงดนตรีก่อนคิดเรื่องการใช้จ่าย`},{en:`If two-thirds of the band's share is spent, one-third remains — divide the band's share by 3.`,th:`ถ้าใช้ไปสองในสามของส่วนแบ่งวงดนตรี จะเหลือหนึ่งในสาม ให้นำส่วนแบ่งของวงดนตรีมาหารด้วย 3`}],visual:null,estimatedSeconds:80},{id:`C-09`,testId:`stw-mock-c`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel lines and a triangle`,th:`เส้นขนานกับรูปสามเหลี่ยม`},difficulty:F(9),prompt:{en:`In the figure, line l₁ is parallel to line l₂. Triangle ABC has vertex A on l₁, and vertices B and C on l₂. The marked 50° angle is between line l₁ and side AB. Angle BCA = 65°. Find the size of angle x = angle BAC.`,th:`จากภาพ เส้น l₁ ขนานกับเส้น l₂ รูปสามเหลี่ยม ABC มีจุดยอด A อยู่บนเส้น l₁ และจุดยอด B กับ C อยู่บนเส้น l₂ มุม 50° ที่กำกับไว้อยู่ระหว่างเส้น l₁ กับด้าน AB และมุม BCA = 65° จงหาขนาดของมุม x ซึ่งคือมุม BAC`},options:[{id:`A`,label:{en:`50°`,th:`50°`}},{id:`B`,label:{en:`65°`,th:`65°`}},{id:`C`,label:{en:`115°`,th:`115°`}},{id:`D`,label:{en:`130°`,th:`130°`}}],correctOptionId:`B`,explanation:{en:`Since l₁ is parallel to l₂, the marked 50° angle and angle ABC are corresponding angles, so angle ABC = 50°. In triangle ABC, the angles sum to 180°, so angle BAC = 180° − 50° − 65° = 65°.`,th:`เนื่องจาก l₁ ขนานกับ l₂ มุม 50° ที่กำกับไว้กับมุม ABC เป็นมุมภายในบทเดียวกัน (corresponding angles) ดังนั้นมุม ABC = 50° ในรูปสามเหลี่ยม ABC ผลรวมมุมภายในเท่ากับ 180° ดังนั้นมุม BAC = 180° − 50° − 65° = 65°`},distractorNotes:{A:{en:`This just copies the given 50° angle directly as the answer, without using the triangle angle sum to find angle BAC.`,th:`คัดลอกมุม 50° ที่โจทย์ให้มาเป็นคำตอบตรง ๆ โดยไม่ได้ใช้ผลรวมมุมภายในสามเหลี่ยมหามุม BAC`},C:{en:`This adds the two given angles (50° + 65° = 115°) instead of subtracting their sum from 180°.`,th:`นำมุมสองมุมที่โจทย์ให้มาบวกกัน (50° + 65° = 115°) แทนที่จะนำผลรวมไปลบออกจาก 180°`},D:{en:`This doubles the 65° angle (65° × 2 = 130°) instead of correctly applying the triangle angle sum.`,th:`นำมุม 65° มาคูณสอง (65° × 2 = 130°) แทนที่จะใช้ผลรวมมุมภายในสามเหลี่ยมอย่างถูกต้อง`}},hints:[{en:`The two parallel lines mean some angles around point A and point B are equal.`,th:`เส้นขนานสองเส้นทำให้มุมบางมุมรอบจุด A และจุด B มีขนาดเท่ากัน`},{en:`Use the fact that l₁ ∥ l₂ to find angle ABC first, using corresponding angles.`,th:`ใช้ข้อเท็จจริงที่ว่า l₁ ขนานกับ l₂ เพื่อหามุม ABC ก่อน โดยใช้มุมภายในบทเดียวกัน`},{en:`Once you know angle ABC = 50° and angle BCA = 65°, subtract their sum from 180° to get angle BAC.`,th:`เมื่อรู้ว่ามุม ABC = 50° และมุม BCA = 65° แล้ว ให้นำผลรวมไปลบออกจาก 180° เพื่อหามุม BAC`}],visual:{kind:`geometryFigure`,width:320,height:200,segments:[{x1:20,y1:40,x2:300,y2:40,ticks:1},{x1:20,y1:160,x2:300,y2:160,ticks:1},{x1:140,y1:40,x2:39,y2:160},{x1:140,y1:40,x2:196,y2:160}],points:[{x:140,y:40,label:`A`,labelOffset:[0,-12]},{x:39,y:160,label:`B`,labelOffset:[-14,16]},{x:196,y:160,label:`C`,labelOffset:[10,16]}],angleMarks:[{x:140,y:40,fromDeg:180,toDeg:230,radius:16,label:`50°`},{x:196,y:160,fromDeg:115,toDeg:180,radius:16,label:`65°`},{x:140,y:40,fromDeg:230,toDeg:295,radius:26,label:`x`,color:`var(--navy)`}],alt:{en:`Two parallel horizontal lines l1 and l2 with a triangle ABC; A is on l1, B and C are on l2. A 50° angle is marked between l1 and side AB, a 65° angle is marked at C, and angle x is marked at A between sides AB and AC.`,th:`เส้นขนานแนวนอนสองเส้น l1 และ l2 พร้อมรูปสามเหลี่ยม ABC จุด A อยู่บน l1 จุด B และ C อยู่บน l2 มีมุม 50° กำกับระหว่าง l1 กับด้าน AB มุม 65° กำกับที่จุด C และมุม x กำกับที่จุด A ระหว่างด้าน AB กับ AC`}},estimatedSeconds:95},{id:`C-10`,testId:`stw-mock-c`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Equal-volume cylinders`,th:`ทรงกระบอกที่มีปริมาตรเท่ากัน`},difficulty:F(10),prompt:{en:`Two cylindrical water tanks used for the sports-day water-relay hold the same volume of water. Tank A has a base radius of 4 cm and water height of 18 cm. Tank B has a base radius of 6 cm. What is the height of the water in Tank B?`,th:`ถังน้ำทรงกระบอกสองถังที่ใช้ในเกมวิ่งผลัดสายน้ำบรรจุน้ำปริมาตรเท่ากัน ถัง A มีรัศมีฐาน 4 เซนติเมตร และความสูงของน้ำ 18 เซนติเมตร ถัง B มีรัศมีฐาน 6 เซนติเมตร ความสูงของน้ำในถัง B เป็นเท่าใด`},options:[{id:`A`,label:{en:`12 cm`,th:`12 เซนติเมตร`}},{id:`B`,label:{en:`18 cm`,th:`18 เซนติเมตร`}},{id:`C`,label:{en:`8 cm`,th:`8 เซนติเมตร`}},{id:`D`,label:{en:`40.5 cm`,th:`40.5 เซนติเมตร`}}],correctOptionId:`C`,explanation:{en:`Volume = π × r² × h stays constant. For Tank A: r² × h = 4² × 18 = 288. For Tank B: 6² × h = 288, so 36 × h = 288, giving h = 8 cm.`,th:`ปริมาตร = π × r² × h มีค่าคงที่ สำหรับถัง A: r² × h = 4² × 18 = 288 สำหรับถัง B: 6² × h = 288 ดังนั้น 36 × h = 288 จะได้ h = 8 เซนติเมตร`},distractorNotes:{A:{en:`This uses a straight (linear) ratio of radii instead of squaring them: 18 × (4÷6) = 12.`,th:`ใช้อัตราส่วนของรัศมีแบบเชิงเส้นตรง ๆ โดยไม่ยกกำลังสอง: 18 × (4÷6) = 12`},B:{en:`This assumes the height stays the same even though the base radius changed, which ignores how volume depends on radius squared.`,th:`สมมติว่าความสูงเท่าเดิมทั้งที่รัศมีฐานเปลี่ยนไป ซึ่งละเลยความสัมพันธ์ที่ปริมาตรขึ้นกับรัศมียกกำลังสอง`},D:{en:`This inverts the squared-radius ratio, computing 18 × (6÷4)² = 40.5 instead of dividing correctly.`,th:`สลับอัตราส่วนรัศมียกกำลังสองกลับด้าน คำนวณเป็น 18 × (6÷4)² = 40.5 แทนที่จะหารให้ถูกทิศทาง`}},hints:[{en:`The volume formula for a cylinder is π × radius² × height.`,th:`สูตรปริมาตรทรงกระบอกคือ π × รัศมี² × ความสูง`},{en:`Since both tanks hold equal volume, radius² × height must be equal for both — the π cancels out.`,th:`เนื่องจากถังทั้งสองมีปริมาตรเท่ากัน รัศมี² × ความสูง ของทั้งสองถังต้องเท่ากัน โดย π จะตัดกันไป`},{en:`Compute 4² × 18 for Tank A, then divide that by 6² to find Tank B's height.`,th:`คำนวณ 4² × 18 ของถัง A แล้วนำไปหารด้วย 6² เพื่อหาความสูงของถัง B`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:8,height:18,label:`Tank A`},{baseSide:12,height:8,heightLabel:`h`,label:`Tank B`}],alt:{en:`Two cylindrical water tanks. Tank A has a smaller base and taller water column. Tank B has a wider base and a height labeled h that must be found.`,th:`ถังน้ำทรงกระบอกสองถัง ถัง A มีฐานเล็กกว่าและมีระดับน้ำสูงกว่า ถัง B มีฐานกว้างกว่าและมีความสูงกำกับด้วยตัวอักษร h ที่ต้องหาคำตอบ`}},estimatedSeconds:90},{id:`C-11`,testId:`stw-mock-c`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite banner area`,th:`พื้นที่รูปประกอบ`},difficulty:F(11),prompt:{en:`A team banner is cut from a rectangular sheet of fabric 20 cm by 14 cm. Two triangular corners are cut off, as shown: one with legs 6 cm and 4 cm, and another with legs 8 cm and 5 cm. What is the area of the remaining shaded banner?`,th:`ป้ายผ้าประจำทีมถูกตัดจากผืนผ้าสี่เหลี่ยมผืนผ้าขนาด 20 เซนติเมตร คูณ 14 เซนติเมตร โดยตัดมุมสามเหลี่ยมออกสองมุมดังภาพ มุมหนึ่งมีด้านประกอบมุมฉากยาว 6 และ 4 เซนติเมตร อีกมุมหนึ่งยาว 8 และ 5 เซนติเมตร พื้นที่ของป้ายผ้าส่วนที่แรเงาที่เหลืออยู่เป็นเท่าใด`},options:[{id:`A`,label:{en:`248 cm²`,th:`248 ตารางเซนติเมตร`}},{id:`B`,label:{en:`260 cm²`,th:`260 ตารางเซนติเมตร`}},{id:`C`,label:{en:`268 cm²`,th:`268 ตารางเซนติเมตร`}},{id:`D`,label:{en:`312 cm²`,th:`312 ตารางเซนติเมตร`}}],correctOptionId:`A`,explanation:{en:`The rectangle's area = 20 × 14 = 280 cm². The first triangle removed has area (6 × 4) ÷ 2 = 12 cm². The second has area (8 × 5) ÷ 2 = 20 cm². Shaded area = 280 − 12 − 20 = 248 cm².`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 20 × 14 = 280 ตารางเซนติเมตร สามเหลี่ยมแรกที่ตัดออกมีพื้นที่ (6 × 4) ÷ 2 = 12 ตารางเซนติเมตร สามเหลี่ยมที่สองมีพื้นที่ (8 × 5) ÷ 2 = 20 ตารางเซนติเมตร พื้นที่ส่วนที่แรเงา = 280 − 12 − 20 = 248 ตารางเซนติเมตร`},distractorNotes:{B:{en:`This only subtracts the 8×5 triangle (280 − 20 = 260) and forgets to also subtract the 6×4 triangle.`,th:`ลบออกเฉพาะสามเหลี่ยม 8×5 (280 − 20 = 260) และลืมลบสามเหลี่ยม 6×4 ออกด้วย`},C:{en:`This only subtracts the 6×4 triangle (280 − 12 = 268) and forgets to also subtract the 8×5 triangle.`,th:`ลบออกเฉพาะสามเหลี่ยม 6×4 (280 − 12 = 268) และลืมลบสามเหลี่ยม 8×5 ออกด้วย`},D:{en:`This adds the two triangle areas to the rectangle instead of subtracting them (280 + 12 + 20 = 312).`,th:`นำพื้นที่สามเหลี่ยมทั้งสองไปบวกกับพื้นที่สี่เหลี่ยมแทนที่จะลบออก (280 + 12 + 20 = 312)`}},hints:[{en:`Start by finding the full area of the original rectangle.`,th:`เริ่มจากหาพื้นที่ทั้งหมดของสี่เหลี่ยมผืนผ้าเดิมก่อน`},{en:`Each cut-off corner is a right triangle — its area is (leg × leg) ÷ 2.`,th:`มุมที่ถูกตัดออกแต่ละมุมเป็นรูปสามเหลี่ยมมุมฉาก พื้นที่คือ (ด้าน × ด้าน) ÷ 2`},{en:`Subtract BOTH triangle areas from the rectangle's area: 280 − 12 − 20.`,th:`ลบพื้นที่สามเหลี่ยมทั้งสองมุมออกจากพื้นที่สี่เหลี่ยม: 280 − 12 − 20`}],visual:{kind:`geometryFigure`,width:160,height:112,showGrid:!0,gridStep:8,polygons:[{points:[[48,0],[160,0],[160,72],[96,112],[0,112],[0,32]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:48,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:32,style:`dashed`},{x1:160,y1:112,x2:96,y2:112,style:`dashed`},{x1:160,y1:112,x2:160,y2:72,style:`dashed`}],labels:[{x:24,y:-10,text:`6`},{x:-12,y:18,text:`4`},{x:128,y:128,text:`8`},{x:174,y:92,text:`5`}],alt:{en:`A hexagonal banner shape formed by cutting two triangular corners off a rectangle. The top-left corner is cut with legs 6 and 4; the bottom-right corner is cut with legs 8 and 5.`,th:`รูปหกเหลี่ยมของป้ายผ้าที่เกิดจากการตัดมุมสามเหลี่ยมออกสองมุมจากสี่เหลี่ยมผืนผ้า มุมบนซ้ายตัดด้วยด้าน 6 และ 4 มุมล่างขวาตัดด้วยด้าน 8 และ 5`}},estimatedSeconds:110},{id:`C-12`,testId:`stw-mock-c`,number:12,skill:`Geometry & Angles`,topic:{en:`Zigzag between parallel lines`,th:`มุมหักเหระหว่างเส้นขนาน`},difficulty:F(12),prompt:{en:`Lines l₁ and l₂ are parallel. Point E lies between them and is joined to point A on l₁ and point D on l₂, forming a bend at E. The angle between l₁ and EA is (2x + 10)°, the angle between l₂ and ED is (3x − 5)°, and the bend angle AED is 130°. Find angle ADE, which equals (3x − 5)°.`,th:`เส้น l₁ และ l₂ ขนานกัน จุด E อยู่ระหว่างเส้นทั้งสอง เชื่อมกับจุด A บนเส้น l₁ และจุด D บนเส้น l₂ เกิดเป็นมุมหักที่จุด E มุมระหว่างเส้น l₁ กับ EA คือ (2x + 10)° มุมระหว่างเส้น l₂ กับ ED คือ (3x − 5)° และมุม AED ที่จุดหักมีขนาด 130° จงหามุม ADE ซึ่งมีค่าเท่ากับ (3x − 5)°`},options:[{id:`A`,label:{en:`25°`,th:`25°`}},{id:`B`,label:{en:`60°`,th:`60°`}},{id:`C`,label:{en:`40°`,th:`40°`}},{id:`D`,label:{en:`70°`,th:`70°`}}],correctOptionId:`D`,explanation:{en:`Drawing a line through E parallel to l₁ and l₂ splits angle AED into two alternate angles equal to (2x+10)° and (3x−5)°. So (2x+10) + (3x−5) = 130, giving 5x + 5 = 130, so x = 25. Angle ADE = 3(25) − 5 = 70°.`,th:`ลากเส้นผ่านจุด E ขนานกับ l₁ และ l₂ จะแบ่งมุม AED ออกเป็นมุมแทรกที่เท่ากับ (2x+10)° และ (3x−5)° ดังนั้น (2x+10) + (3x−5) = 130 จะได้ 5x + 5 = 130 ดังนั้น x = 25 มุม ADE = 3(25) − 5 = 70°`},distractorNotes:{A:{en:`This reports the value of x (25) instead of substituting it into the expression (3x − 5)° to find angle ADE.`,th:`ตอบค่า x (25) โดยตรง แทนที่จะแทนค่ากลับในนิพจน์ (3x − 5)° เพื่อหามุม ADE`},B:{en:`This computes angle at A instead of angle ADE: (2x+10) at x=25 gives 60°, which is the wrong vertex.`,th:`คำนวณมุมที่จุด A แทนมุม ADE: (2x+10) เมื่อ x=25 ได้ 60° ซึ่งเป็นจุดยอดที่ผิด`},C:{en:`This wrongly sets the two expressions equal to each other (2x+10 = 3x−5) instead of summing them to 130, getting x = 15 and then 3(15)−5 = 40.`,th:`ตั้งสมการผิดโดยให้สองนิพจน์เท่ากัน (2x+10 = 3x−5) แทนที่จะบวกกันให้เท่ากับ 130 ได้ x = 15 แล้วคำนวณ 3(15)−5 = 40`}},hints:[{en:`Imagine a third line through E, drawn parallel to both l₁ and l₂.`,th:`ลองจินตนาการเส้นที่สามผ่านจุด E ที่ลากขนานกับทั้ง l₁ และ l₂`},{en:`That imaginary line splits the bend angle at E into two parts that equal the two given expressions.`,th:`เส้นสมมตินั้นจะแบ่งมุมหักที่จุด E ออกเป็นสองส่วนที่มีค่าเท่ากับสองนิพจน์ที่โจทย์ให้มา`},{en:`Set (2x+10) + (3x−5) = 130, solve for x, then substitute x back into (3x−5) to answer the question.`,th:`ตั้งสมการ (2x+10) + (3x−5) = 130 แก้หา x แล้วแทนค่า x กลับในนิพจน์ (3x−5) เพื่อตอบคำถาม`}],visual:{kind:`geometryFigure`,width:320,height:200,segments:[{x1:20,y1:30,x2:300,y2:30,ticks:1},{x1:20,y1:170,x2:300,y2:170,ticks:1},{x1:110,y1:30,x2:150,y2:100},{x1:150,y1:100,x2:125,y2:170}],points:[{x:110,y:30,label:`A`,labelOffset:[-6,-12]},{x:150,y:100,label:`E`,labelOffset:[12,-4]},{x:125,y:170,label:`D`,labelOffset:[6,18]}],angleMarks:[{x:110,y:30,fromDeg:300,toDeg:360,radius:16,label:`(2x+10)°`},{x:125,y:170,fromDeg:0,toDeg:70,radius:16,label:`(3x-5)°`},{x:150,y:100,fromDeg:120,toDeg:250,radius:22,label:`130°`,color:`var(--navy)`}],alt:{en:`Two parallel horizontal lines l1 and l2 with a bent path from point A on l1, through point E between the lines, to point D on l2. Angles are marked (2x+10) degrees at A, (3x-5) degrees at D, and 130 degrees at the bend E.`,th:`เส้นขนานแนวนอนสองเส้น l1 และ l2 พร้อมเส้นหักจากจุด A บน l1 ผ่านจุด E ระหว่างเส้นทั้งสอง ไปยังจุด D บน l2 มีมุมกำกับ (2x+10) องศาที่จุด A, (3x-5) องศาที่จุด D และ 130 องศาที่จุดหัก E`}},estimatedSeconds:130},{id:`C-13`,testId:`stw-mock-c`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Ring area and radius ratio`,th:`พื้นที่วงแหวนกับอัตราส่วนรัศมี`},difficulty:F(13),prompt:{en:`The target-toss game at sports day uses two concentric circles. The area of the shaded ring between the two circles is exactly 3 times the area of the inner circle. Find the ratio of the outer radius to the inner radius.`,th:`เกมโยนห่วงเข้าเป้าในวันกีฬาสีใช้วงกลมสองวงที่มีจุดศูนย์กลางร่วมกัน พื้นที่ของวงแหวนที่แรเงาระหว่างวงกลมทั้งสองมีค่าเป็น 3 เท่าของพื้นที่วงกลมวงใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`3:1`,th:`3:1`}},{id:`B`,label:{en:`2:1`,th:`2:1`}},{id:`C`,label:{en:`1:2`,th:`1:2`}},{id:`D`,label:{en:`4:1`,th:`4:1`}}],correctOptionId:`B`,explanation:{en:`Let r = inner radius and R = outer radius. Ring area = πR² − πr² = 3 × πr², so R² − r² = 3r², meaning R² = 4r². Taking the square root, R = 2r, so R:r = 2:1.`,th:`ให้ r = รัศมีวงใน และ R = รัศมีวงนอก พื้นที่วงแหวน = πR² − πr² = 3 × πr² ดังนั้น R² − r² = 3r² หมายความว่า R² = 4r² ถอดรากที่สองได้ R = 2r ดังนั้น R:r = 2:1`},distractorNotes:{A:{en:`This wrongly treats "3 times the area" as meaning the radius itself is 3 times as large, giving R:r = 3:1.`,th:`เข้าใจผิดว่า "พื้นที่เป็น 3 เท่า" หมายถึงรัศมีเองเป็น 3 เท่า จึงตอบ R:r = 3:1`},C:{en:`This finds the correct relationship R = 2r but then states the ratio backwards as r:R instead of R:r.`,th:`หาความสัมพันธ์ R = 2r ได้ถูกต้อง แต่เขียนอัตราส่วนสลับด้านเป็น r:R แทนที่จะเป็น R:r`},D:{en:`This correctly finds R²÷r² = 4 but forgets to take the square root, reporting 4:1 as if it were the radius ratio directly.`,th:`หา R²÷r² = 4 ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบ 4:1 ราวกับเป็นอัตราส่วนรัศมีโดยตรง`}},hints:[{en:`The ring area is the outer circle's area minus the inner circle's area.`,th:`พื้นที่วงแหวนคือพื้นที่วงกลมวงนอกลบด้วยพื้นที่วงกลมวงใน`},{en:`Write the equation πR² − πr² = 3πr² and simplify to relate R² and r².`,th:`เขียนสมการ πR² − πr² = 3πr² แล้วจัดรูปเพื่อหาความสัมพันธ์ระหว่าง R² และ r²`},{en:`You should reach R² = 4r². Take the square root of both sides to find R:r.`,th:`ควรได้สมการ R² = 4r² ถอดรากที่สองทั้งสองข้างเพื่อหา R:r`}],visual:{kind:`concentricCircles`,outerRadius:2,innerRadius:1,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles forming a target with a shaded ring between the outer circle (radius R) and the inner circle (radius r).`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกันเป็นเป้า มีวงแหวนแรเงาอยู่ระหว่างวงกลมวงนอก (รัศมี R) กับวงกลมวงใน (รัศมี r)`}},estimatedSeconds:100},{id:`C-14`,testId:`stw-mock-c`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Leaf-shaped area`,th:`พื้นที่รูปใบไม้`},difficulty:F(14),prompt:{en:`A square badge for the sports-day mascot has side length 14 cm. Two quarter-circle arcs, each with radius equal to the side of the square, are drawn from opposite corners, creating a shaded leaf shape where the two arcs overlap. Find the area of the shaded leaf shape. (Use π = 22/7.)`,th:`เข็มกลัดรูปสี่เหลี่ยมจัตุรัสของมาสคอตกีฬาสีมีความยาวด้าน 14 เซนติเมตร มีการลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้น แต่ละเส้นมีรัศมีเท่ากับความยาวด้านของสี่เหลี่ยม จากมุมตรงข้ามกัน เกิดเป็นรูปใบไม้ที่แรเงาตรงบริเวณที่ส่วนโค้งทั้งสองซ้อนทับกัน จงหาพื้นที่ของรูปใบไม้ที่แรเงา (กำหนดให้ π = 22/7)`},options:[{id:`A`,label:{en:`308 cm²`,th:`308 ตารางเซนติเมตร`}},{id:`B`,label:{en:`154 cm²`,th:`154 ตารางเซนติเมตร`}},{id:`C`,label:{en:`112 cm²`,th:`112 ตารางเซนติเมตร`}},{id:`D`,label:{en:`42 cm²`,th:`42 ตารางเซนติเมตร`}}],correctOptionId:`C`,explanation:{en:`Each quarter circle has area = \\frac{1}{4} × π × 14² = \\frac{1}{4} × 22/7 × 196 = 154 cm². Two quarter circles together = 308 cm². This double-counts the square
