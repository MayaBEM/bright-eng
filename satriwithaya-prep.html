ebra & Patterns`,th:`พีชคณิตและแบบรูป`},"Geometry & Angles":{en:`Geometry & Angles`,th:`เรขาคณิตและมุม`},"Area, Perimeter & Circles":{en:`Area, Perimeter & Circles`,th:`พื้นที่ เส้นรอบรูป และวงกลม`},"Graphs & Data":{en:`Graphs & Data`,th:`กราฟและข้อมูล`},"Word Problems & Logic":{en:`Word Problems & Logic`,th:`โจทย์ปัญหาและตรรกะ`}},ti={Easy:{en:`Easy`,th:`ง่าย`},Medium:{en:`Medium`,th:`ปานกลาง`},Hard:{en:`Hard`,th:`ยาก`},VeryHard:{en:`Very Hard`,th:`ยากมาก`}};function F(e){return e<=5?`Easy`:e<=10?`Medium`:e<=16?`Hard`:`VeryHard`}var ni=[{id:`stw-mock-a`,title:{en:`Mock Test A`,th:`ข้อสอบชุด A`},subtitle:{en:`Foundations Paper`,th:`ชุดพื้นฐาน`},recommendedMinutes:40,questions:[{id:`A-01`,testId:`stw-mock-a`,number:1,skill:`Number & Operations`,topic:{en:`Largest & Smallest Numbers`,th:`การสร้างจำนวนที่มากที่สุดและน้อยที่สุด`},difficulty:F(1),prompt:{en:`Using each of the digits 1, 3, 6, 8, and 9 exactly once, Kanya wants to form the largest possible 5-digit even number. What number should she form?`,th:`กันย่าต้องการนำตัวเลข 1, 3, 6, 8 และ 9 มาเรียงเป็นจำนวนคู่ 5 หลักที่มีค่ามากที่สุด โดยใช้ตัวเลขแต่ละตัวเพียงครั้งเดียว จำนวนที่กันย่าควรเรียงคือข้อใด`},options:[{id:`A`,label:{en:`89,316`,th:`89,316`}},{id:`B`,label:{en:`96,318`,th:`96,318`}},{id:`C`,label:{en:`98,316`,th:`98,316`}},{id:`D`,label:{en:`98,631`,th:`98,631`}}],correctOptionId:`C`,explanation:{en:`For the number to be as large as possible, place the biggest digits first: 9 and 8 should lead. Since the number must be even, the last digit can only be 6 or 8 (the even digits available). Ending in 6 lets the front four digits be 9,8,3,1 (98,316), which beats ending in 8 (which would only allow 96,318 in front). So 98,316 is the largest even arrangement.`,th:`เพื่อให้จำนวนมีค่ามากที่สุด ต้องจัดหลักสูงสุดด้วยเลขที่มากที่สุดก่อน คือ 9 และ 8 นำหน้า และเพราะโจทย์ต้องการจำนวนคู่ ตัวสุดท้ายต้องเป็นเลขคู่ที่มีอยู่คือ 6 หรือ 8 เท่านั้น ถ้าให้ตัวสุดท้ายเป็น 6 จะนำ 9, 8, 3, 1 มาเรียงหน้าได้เป็น 98,316 ซึ่งมากกว่ากรณีให้ตัวสุดท้ายเป็น 8 (ได้เพียง 96,318) ดังนั้นคำตอบคือ 98,316`},distractorNotes:{A:{en:`This uses 6 as the last digit correctly but arranges the front digits as 8,9,3,1 instead of sorting them from largest to smallest (9,8,3,1), so it isn't the largest possible arrangement.`,th:`ข้อนี้ใช้ 6 เป็นหลักหน่วยถูกต้อง แต่เรียงหลักหน้าเป็น 8, 9, 3, 1 แทนที่จะเรียงจากมากไปน้อยเป็น 9, 8, 3, 1 จึงยังไม่ใช่จำนวนที่มากที่สุด`},B:{en:`This comes from ending the number in 8 instead of 6. Although 8 is a larger digit, using it last forces a smaller digit (6) to the front, giving a smaller overall number than ending in 6.`,th:`ข้อนี้เกิดจากการให้ตัวสุดท้ายเป็น 8 แทนที่จะเป็น 6 แม้ 8 จะเป็นเลขที่มากกว่า แต่การนำไปไว้ท้ายกลับทำให้ต้องดึงเลข 6 ไปไว้ข้างหน้าแทน ทำให้จำนวนโดยรวมมีค่าน้อยกว่าการให้ 6 อยู่ท้าย`},D:{en:`This is simply the digits sorted from largest to smallest (9,8,6,3,1) without checking the last digit — it ends in 1, which is odd, so it does not satisfy the 'even number' condition at all.`,th:`ข้อนี้เป็นเพียงการเรียงตัวเลขจากมากไปน้อย (9, 8, 6, 3, 1) โดยไม่ได้ตรวจสอบหลักหน่วย ซึ่งลงท้ายด้วย 1 อันเป็นเลขคี่ จึงไม่ตรงกับเงื่อนไข 'จำนวนคู่' เลย`}},hints:[{en:`Think about which digit needs to go in the ones place first.`,th:`ลองคิดก่อนว่าหลักหน่วยต้องเป็นเลขอะไร`},{en:`The number must be even, so the last digit can only be one of the even digits in the set.`,th:`จำนวนนี้ต้องเป็นจำนวนคู่ ดังนั้นหลักหน่วยต้องเป็นเลขคู่ตัวใดตัวหนึ่งในชุดตัวเลขที่กำหนดเท่านั้น`},{en:`Try both even digits as the last digit, arrange the remaining four digits from largest to smallest in front each time, then compare the two results.`,th:`ลองใช้เลขคู่ทั้งสองตัวเป็นหลักหน่วยทีละตัว แล้วเรียงเลข 4 ตัวที่เหลือจากมากไปน้อยไว้ข้างหน้าในแต่ละกรณี จากนั้นเปรียบเทียบว่าจำนวนใดมากกว่ากัน`}],visual:null,estimatedSeconds:55},{id:`A-02`,testId:`stw-mock-a`,number:2,skill:`Word Problems & Logic`,topic:{en:`Pricing Puzzles`,th:`โจทย์ปัญหาราคาสองสถานการณ์`},difficulty:F(2),prompt:{en:`Mint has just enough money to buy some notebooks at 15 baht each, with 20 baht left over. If the notebooks cost 25 baht each instead, she could buy exactly 4 fewer notebooks and would have no money left over. How much money does Mint have?`,th:`มิ้นท์มีเงินพอซื้อสมุดราคาเล่มละ 15 บาท ได้จำนวนหนึ่ง และเหลือเงิน 20 บาท แต่ถ้าสมุดราคาเล่มละ 25 บาท เธอจะซื้อได้น้อยกว่าเดิม 4 เล่มพอดี และใช้เงินหมดพอดีไม่มีเหลือ มิ้นท์มีเงินทั้งหมดเท่าไร`},options:[{id:`A`,label:{en:`200 baht`,th:`200 บาท`}},{id:`B`,label:{en:`150 baht`,th:`150 บาท`}},{id:`C`,label:{en:`180 baht`,th:`180 บาท`}},{id:`D`,label:{en:`220 baht`,th:`220 บาท`}}],correctOptionId:`A`,explanation:{en:`Let n be the number of notebooks Mint can buy at 15 baht each. Her money = 15n + 20. At 25 baht each she buys (n − 4) notebooks with nothing left, so her money = 25(n − 4). Setting these equal: 15n + 20 = 25n − 100, so 10n = 120 and n = 12. Her money = 15(12) + 20 = 200 baht (check: 25 × 8 = 200).`,th:`ให้ n เป็นจำนวนสมุดที่มิ้นท์ซื้อได้เมื่อราคาเล่มละ 15 บาท เงินของมิ้นท์ = 15n + 20 เมื่อราคาเล่มละ 25 บาท เธอซื้อได้ (n − 4) เล่มพอดีไม่มีเหลือ เงินของเธอ = 25(n − 4) ให้สองสมการนี้เท่ากัน: 15n + 20 = 25n − 100 จะได้ 10n = 120 ดังนั้น n = 12 เงินของมิ้นท์ = 15(12) + 20 = 200 บาท (ตรวจสอบ: 25 × 8 = 200 บาท เท่ากันจริง)`},distractorNotes:{B:{en:`This comes from solving 15n = 25(n−4) without adding the 20 baht left over, which ignores part of the given information.`,th:`ข้อนี้เกิดจากการแก้สมการ 15n = 25(n−4) โดยลืมบวกเงิน 20 บาทที่เหลือเข้าไปด้วย ทำให้ใช้ข้อมูลโจทย์ไม่ครบ`},C:{en:`This finds the correct number of notebooks (n = 12) but reports only 15 × 12 = 180, forgetting to add the 20 baht that was left over.`,th:`ข้อนี้หาจำนวนสมุดได้ถูกต้อง (n = 12) แต่คำนวณเพียง 15 × 12 = 180 โดยลืมบวกเงิน 20 บาทที่เหลืออยู่เข้าไปด้วย`},D:{en:`This takes the correct answer (200) and mistakenly adds the 20 baht leftover a second time.`,th:`ข้อนี้นำคำตอบที่ถูกต้อง (200) มาบวกเงินที่เหลือ 20 บาทซ้ำเป็นครั้งที่สองโดยไม่ตั้งใจ`}},hints:[{en:`Try using a letter to stand for the number of notebooks in the first situation.`,th:`ลองตั้งตัวแปรแทนจำนวนสมุดในสถานการณ์แรกดูสิ`},{en:`Write Mint's total money as an expression in both situations, then set the two expressions equal to each other.`,th:`เขียนเงินทั้งหมดของมิ้นท์เป็นสมการจากทั้งสองสถานการณ์ แล้วให้สมการทั้งสองมีค่าเท่ากัน`},{en:`If n is the number of notebooks at 15 baht, her money is 15n+20. At 25 baht she buys (n−4) notebooks exactly, so her money is 25(n−4). Solve 15n+20 = 25(n−4) for n, then find the money.`,th:`ถ้า n คือจำนวนสมุดตอนราคา 15 บาท เงินของเธอคือ 15n+20 ส่วนตอนราคา 25 บาท เธอซื้อได้ (n−4) เล่มพอดี เงินของเธอคือ 25(n−4) แก้สมการ 15n+20 = 25(n−4) หาค่า n แล้วจึงคำนวณเงินทั้งหมด`}],visual:null,estimatedSeconds:70},{id:`A-03`,testId:`stw-mock-a`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Unlike Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:F(3),prompt:{en:`Look at these seven fractions: \\frac{5}{6}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{8}, \\frac{3}{5}, \\frac{7}{12}. Which fraction is the 4th largest?`,th:`พิจารณาเศษส่วน 7 จำนวนต่อไปนี้ \\frac{5}{6}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{8}, \\frac{3}{5}, \\frac{7}{12} เศษส่วนใดมีค่ามากเป็นอันดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{7}{10}`,th:`\\frac{7}{10}`}},{id:`B`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}},{id:`C`,label:{en:`\\frac{3}{5}`,th:`\\frac{3}{5}`}},{id:`D`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}}],correctOptionId:`D`,explanation:{en:`Convert all seven fractions to a common denominator of 120: \\frac{5}{6}=\\frac{100}{120}, \\frac{3}{4}=\\frac{90}{120}, \\frac{7}{10}=\\frac{84}{120}, \\frac{2}{3}=\\frac{80}{120}, \\frac{5}{8}=\\frac{75}{120}, \\frac{3}{5}=\\frac{72}{120}, \\frac{7}{12}=\\frac{70}{120}. Ranking from largest: \\frac{5}{6}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{8}, \\frac{3}{5}, \\frac{7}{12}. The 4th largest is \\frac{2}{3}.`,th:`แปลงเศษส่วนทั้งเจ็ดให้มีตัวส่วนร่วมเป็น 120 จะได้ \\frac{5}{6}=\\frac{100}{120}, \\frac{3}{4}=\\frac{90}{120}, \\frac{7}{10}=\\frac{84}{120}, \\frac{2}{3}=\\frac{80}{120}, \\frac{5}{8}=\\frac{75}{120}, \\frac{3}{5}=\\frac{72}{120}, \\frac{7}{12}=\\frac{70}{120} เรียงจากมากไปน้อยได้ \\frac{5}{6}, \\frac{3}{4}, \\frac{7}{10}, \\frac{2}{3}, \\frac{5}{8}, \\frac{3}{5}, \\frac{7}{12} ดังนั้นอันดับที่ 4 คือ \\frac{2}{3}`},distractorNotes:{A:{en:`\\frac{7}{10} is actually the 3rd largest, not the 4th — this comes from being one position off in the ranking.`,th:`\\frac{7}{10} ที่จริงมีค่ามากเป็นอันดับ 3 ไม่ใช่อันดับ 4 ข้อนี้เกิดจากการนับลำดับผิดไปหนึ่งตำแหน่ง`},B:{en:`\\frac{5}{8} is the 5th largest, one rank below the correct answer — a likely mix-up between the 4th and 5th positions.`,th:`\\frac{5}{8} มีค่ามากเป็นอันดับ 5 ซึ่งต่ำกว่าคำตอบที่ถูกต้องหนึ่งอันดับ อาจเกิดจากการสับสนระหว่างอันดับ 4 กับอันดับ 5`},C:{en:`\\frac{3}{5} is the 6th largest. Choosing it likely comes from comparing the fractions by their denominators or numerators alone instead of converting to a common denominator.`,th:`\\frac{3}{5} มีค่ามากเป็นอันดับ 6 การเลือกข้อนี้อาจเกิดจากการเทียบเศษหรือส่วนตรง ๆ โดยไม่ได้แปลงให้เป็นตัวส่วนร่วมก่อน`}},hints:[{en:`You can't compare these fractions just by looking at them — they need a common denominator first.`,th:`ไม่สามารถเทียบเศษส่วนเหล่านี้ได้จากการมองเฉยๆ ต้องแปลงให้มีตัวส่วนร่วมก่อน`},{en:`Find a common denominator for all seven fractions (a number that 6, 4, 10, 3, 8, 5, and 12 all divide into).`,th:`หาตัวส่วนร่วมของเศษส่วนทั้งเจ็ด (จำนวนที่ 6, 4, 10, 3, 8, 5 และ 12 หารลงตัวทุกตัว)`},{en:`120 works as a common denominator for all seven. Rewrite each fraction over 120, then rank the numerators from largest to smallest and count down to the 4th one.`,th:`120 หารลงตัวกับตัวส่วนทั้งเจ็ดตัว ให้เขียนเศษส่วนแต่ละตัวใหม่โดยใช้ตัวส่วน 120 แล้วเรียงตัวเศษจากมากไปน้อย นับลงมาถึงอันดับที่ 4`}],visual:null,estimatedSeconds:65},{id:`A-04`,testId:`stw-mock-a`,number:4,skill:`Number & Operations`,topic:{en:`Order of Operations`,th:`ลำดับการดำเนินการกับเศษส่วน`},difficulty:F(4),prompt:{en:`If A = 3\\frac{1}{2} × 4 − 2 and B = (15 ÷ 5 + 1) × 2, what is the value of 2 × (A ÷ B)?`,th:`ถ้า A = 3\\frac{1}{2} × 4 − 2 และ B = (15 ÷ 5 + 1) × 2 จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`1`,th:`1`}},{id:`B`,label:{en:`3`,th:`3`}},{id:`C`,label:{en:`1\\frac{1}{3}`,th:`1\\frac{1}{3}`}},{id:`D`,label:{en:`1\\frac{1}{2}`,th:`1\\frac{1}{2}`}}],correctOptionId:`B`,explanation:{en:`First, A = 3\\frac{1}{2} × 4 − 2 = 14 − 2 = 12. Next, B = (15 ÷ 5 + 1) × 2 = (3 + 1) × 2 = 8. Then A ÷ B = 12 ÷ 8 = \\frac{3}{2}. Finally, 2 × \\frac{3}{2} = 3.`,th:`หา A ก่อน: A = 3\\frac{1}{2} × 4 − 2 = 14 − 2 = 12 จากนั้นหา B: B = (15 ÷ 5 + 1) × 2 = (3 + 1) × 2 = 8 แล้ว A ÷ B = 12 ÷ 8 = \\frac{3}{2} สุดท้าย 2 × \\frac{3}{2} = 3`},distractorNotes:{A:{en:`This comes from misreading 3\\frac{1}{2} as 3 × \\frac{1}{2}, giving A = 1.5 × 4 − 2 = 4 instead of 12, then computing 2 × (4 ÷ 8) = 1.`,th:`ข้อนี้เกิดจากการอ่าน 3\\frac{1}{2} ผิดเป็น 3 × \\frac{1}{2} ทำให้ A = 1.5 × 4 − 2 = 4 แทนที่จะเป็น 12 แล้วคำนวณ 2 × (4 ÷ 8) = 1`},C:{en:`This divides B by A instead of A by B: 2 × (8 ÷ 12) = 2 × \\frac{2}{3} = 1\\frac{1}{3}, mixing up which value goes on top.`,th:`ข้อนี้นำ B หารด้วย A แทนที่จะเป็น A หารด้วย B คือ 2 × (8 ÷ 12) = 2 × \\frac{2}{3} = 1\\frac{1}{3} ซึ่งสลับตัวตั้งกับตัวหารผิด`},D:{en:`This correctly finds A ÷ B = \\frac{3}{2} but forgets to multiply the whole thing by the leading 2, stopping one step too early.`,th:`ข้อนี้หา A ÷ B = \\frac{3}{2} ได้ถูกต้อง แต่ลืมคูณด้วย 2 ที่อยู่ข้างหน้า ทำให้หยุดคำนวณก่อนครบขั้นตอน`}},hints:[{en:`Work out A and B separately first, one step at a time.`,th:`หาค่า A และ B แยกกันก่อน ทำทีละขั้นตอน`},{en:`Remember 3 and a half means 3 whole plus one half, not 3 times one half — and follow the order of operations (brackets, then multiply/divide, then add/subtract) inside each expression.`,th:`อย่าลืมว่า 3 กับครึ่งหมายถึง 3 บวกด้วยครึ่งหนึ่ง ไม่ใช่ 3 คูณครึ่งหนึ่ง และให้ทำตามลำดับการดำเนินการ (วงเล็บก่อน แล้วคูณหรือหาร แล้วจึงบวกหรือลบ) ในแต่ละนิพจน์`},{en:`A = 12 and B = 8. Divide A by B first to get a fraction, then multiply that fraction by 2 — make sure A stays on top of the division.`,th:`A มีค่าเท่ากับ 12 และ B มีค่าเท่ากับ 8 ให้หาร A ด้วย B ก่อนเพื่อให้ได้เศษส่วน แล้วจึงนำ 2 ไปคูณเศษส่วนนั้น ระวังอย่าสลับตัวตั้งกับตัวหาร`}],visual:null,estimatedSeconds:60},{id:`A-05`,testId:`stw-mock-a`,number:5,skill:`Number & Operations`,topic:{en:`LCM & GCF from Clues`,th:`ตัวคูณร่วมน้อยและตัวหารร่วมมาก`},difficulty:F(5),prompt:{en:`Two whole numbers add up to 84. When the larger number is divided by the smaller number, the quotient is 3 and the remainder is 4. Find the LCM (lowest common multiple) of the two numbers.`,th:`จำนวนเต็มสองจำนวนบวกกันได้ 84 เมื่อนำจำนวนที่มากกว่าหารด้วยจำนวนที่น้อยกว่า จะได้ผลหาร 3 เศษ 4 จงหา ค.ร.น. ของจำนวนทั้งสอง`},options:[{id:`A`,label:{en:`320`,th:`320`}},{id:`B`,label:{en:`4`,th:`4`}},{id:`C`,label:{en:`256`,th:`256`}},{id:`D`,label:{en:`1,280`,th:`1,280`}}],correctOptionId:`A`,explanation:{en:`Let the smaller number be s; the larger is 3s + 4. Their sum: s + 3s + 4 = 84, so 4s = 80 and s = 20. The larger number is 3(20) + 4 = 64. Check: 20 + 64 = 84 ✓, and 64 ÷ 20 = 3 remainder 4 ✓. Since 20 = 2² × 5 and 64 = 2⁶, the GCF is 2² = 4, so the LCM = (20 × 64) ÷ 4 = 320.`,th:`ให้จำนวนที่น้อยกว่าเป็น s จำนวนที่มากกว่าคือ 3s + 4 ผลรวม: s + 3s + 4 = 84 จะได้ 4s = 80 ดังนั้น s = 20 จำนวนที่มากกว่าคือ 3(20) + 4 = 64 ตรวจสอบ: 20 + 64 = 84 ✓ และ 64 ÷ 20 = 3 เศษ 4 ✓ เนื่องจาก 20 = 2² × 5 และ 64 = 2⁶ ห.ร.ม. คือ 2² = 4 ดังนั้น ค.ร.น. = (20 × 64) ÷ 4 = 320`},distractorNotes:{B:{en:`This is the GCF (HCF) of the two numbers, not the LCM — a mix-up between the two related quantities.`,th:`ข้อนี้คือ ห.ร.ม. ของจำนวนทั้งสอง ไม่ใช่ ค.ร.น. เกิดจากการสับสนระหว่างสองปริมาณที่เกี่ยวข้องกัน`},C:{en:`This divides the product 20 × 64 = 1280 by an incorrect GCF of 5 instead of the correct GCF of 4, giving 256 instead of 320.`,th:`ข้อนี้นำผลคูณ 20 × 64 = 1280 ไปหารด้วย ห.ร.ม. ที่ผิดคือ 5 แทนที่จะเป็น 4 ที่ถูกต้อง จึงได้ 256 แทนที่จะเป็น 320`},D:{en:`This is simply the product of the two numbers (20 × 64) without dividing by their GCF at all, which only equals the LCM when the two numbers share no common factors.`,th:`ข้อนี้เป็นเพียงผลคูณของจำนวนทั้งสอง (20 × 64) โดยไม่ได้หารด้วย ห.ร.ม. เลย ซึ่งจะเท่ากับ ค.ร.น. ก็ต่อเมื่อจำนวนทั้งสองไม่มีตัวประกอบร่วมกันเท่านั้น`}},hints:[{en:`Set up two equations from the sum and the division clue before solving.`,th:`ตั้งสมการสองสมการจากผลรวมและเงื่อนไขการหารก่อนแก้ปัญหา`},{en:`'Divided by, quotient 3, remainder 4' means larger = 3 × smaller + 4. Combine this with the sum to find both numbers first.`,th:`'หารได้ผลหาร 3 เศษ 4' หมายความว่า จำนวนที่มากกว่า = 3 × จำนวนที่น้อยกว่า + 4 นำไปรวมกับผลรวมที่โจทย์ให้เพื่อหาจำนวนทั้งสองก่อน`},{en:`Once you find the two numbers are 20 and 64, break each into prime factors to find their GCF, then use LCM = (number 1 × number 2) ÷ GCF.`,th:`เมื่อหาได้ว่าจำนวนทั้งสองคือ 20 และ 64 ให้แยกตัวประกอบเฉพาะของแต่ละจำนวนเพื่อหา ห.ร.ม. จากนั้นใช้สูตร ค.ร.น. = (จำนวนที่ 1 × จำนวนที่ 2) ÷ ห.ร.ม.`}],visual:null,estimatedSeconds:70},{id:`A-06`,testId:`stw-mock-a`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Number Patterns`,th:`แบบรูปที่เพิ่มขึ้น`},difficulty:F(6),prompt:{en:`The picture shows Figure 4 of a staircase pattern made from small shaded squares. Figure 1 has 1 shaded square, Figure 2 has 3, Figure 3 has 6, and Figure 4 (shown) has 10. If the pattern continues in the same way, how many shaded squares will Figure 7 have?`,th:`ภาพแสดงรูปที่ 4 ของแบบรูปขั้นบันไดที่สร้างจากตารางเล็กๆ ที่แรเงา รูปที่ 1 มี 1 ช่อง รูปที่ 2 มี 3 ช่อง รูปที่ 3 มี 6 ช่อง และรูปที่ 4 (ในภาพ) มี 10 ช่อง ถ้าแบบรูปนี้ดำเนินต่อไปในลักษณะเดียวกัน รูปที่ 7 จะมีช่องที่แรเงากี่ช่อง`},options:[{id:`A`,label:{en:`21`,th:`21`}},{id:`B`,label:{en:`22`,th:`22`}},{id:`C`,label:{en:`49`,th:`49`}},{id:`D`,label:{en:`28`,th:`28`}}],correctOptionId:`D`,explanation:{en:`Each figure adds one more row than the last: Figure n has 1+2+3+...+n shaded squares (a triangular number). Figure 7 has 1+2+3+4+5+6+7 = 28 shaded squares. This matches the formula n(n+1)÷2 = 7×8÷2 = 28.`,th:`แต่ละรูปจะเพิ่มขึ้นอีกหนึ่งแถวจากรูปก่อนหน้า รูปที่ n จะมีช่องแรเงา 1+2+3+...+n ช่อง (จำนวนสามเหลี่ยม) รูปที่ 7 จะมีช่องแรเงา 1+2+3+4+5+6+7 = 28 ช่อง ตรงกับสูตร n(n+1)÷2 = 7×8÷2 = 28`},distractorNotes:{A:{en:`This uses the formula n(n−1)÷2 = 7×6÷2 = 21 instead of n(n+1)÷2, missing the '+1' in the pattern's growth rule.`,th:`ข้อนี้ใช้สูตร n(n−1)÷2 = 7×6÷2 = 21 แทนที่จะเป็น n(n+1)÷2 ทำให้ขาด '+1' ในกฎการเพิ่มของแบบรูปไป`},B:{en:`This assumes the pattern keeps adding a constant 4 squares each time (the difference seen going from Figure 3 to Figure 4), giving 10, 14, 18, 22 for Figures 4–7 — but the amount added actually keeps growing by one each time, not staying fixed at 4.`,th:`ข้อนี้สมมติว่าแบบรูปเพิ่มขึ้นคงที่ครั้งละ 4 ช่องตลอด (ผลต่างที่เห็นจากรูปที่ 3 ไปรูปที่ 4) จะได้ 10, 14, 18, 22 สำหรับรูปที่ 4-7 แต่จริงๆ แล้วจำนวนที่เพิ่มขึ้นจะมากขึ้นทีละ 1 ในแต่ละรูป ไม่ได้คงที่ที่ 4`},C:{en:`This treats the pattern as square numbers (n²), giving 7² = 49 — but the shaded-square count grows as a triangular number, not a square number.`,th:`ข้อนี้มองแบบรูปเป็นจำนวนกำลังสอง (n²) จะได้ 7² = 49 แต่จริงๆ แล้วจำนวนช่องแรเงาเพิ่มขึ้นแบบจำนวนสามเหลี่ยม ไม่ใช่จำนวนกำลังสอง`}},hints:[{en:`Look at how many MORE squares get added each time you move to the next figure.`,th:`สังเกตว่าในแต่ละรูปที่เพิ่มขึ้น จะมีช่องเพิ่มขึ้นมาอีกกี่ช่อง`},{en:`The number added each time itself grows by 1 (Figure 1→2 adds 2, Figure 2→3 adds 3, Figure 3→4 adds 4...). This is a triangular number pattern.`,th:`จำนวนที่เพิ่มขึ้นในแต่ละครั้งจะมากขึ้นทีละ 1 (รูปที่ 1→2 เพิ่ม 2 ช่อง, รูปที่ 2→3 เพิ่ม 3 ช่อง, รูปที่ 3→4 เพิ่ม 4 ช่อง...) นี่คือแบบรูปจำนวนสามเหลี่ยม`},{en:`Figure n has 1+2+3+...+n shaded squares in total. For Figure 7, add up 1+2+3+4+5+6+7.`,th:`รูปที่ n จะมีช่องแรเงารวมทั้งหมด 1+2+3+...+n ช่อง สำหรับรูปที่ 7 ให้บวก 1+2+3+4+5+6+7`}],visual:{kind:`gridPattern`,gridSize:4,cells:[{row:0,col:0},{row:1,col:0},{row:1,col:1},{row:2,col:0},{row:2,col:1},{row:2,col:2},{row:3,col:0},{row:3,col:1},{row:3,col:2},{row:3,col:3}],alt:{en:`A staircase pattern of shaded squares showing Figure 4, with rows of 1, 2, 3, and 4 shaded squares stacked from top to bottom, each row aligned to the left, giving 10 shaded squares in total.`,th:`ภาพแบบรูปขั้นบันไดของช่องที่แรเงา แสดงรูปที่ 4 ซึ่งมีแถวของช่องแรเงา 1, 2, 3 และ 4 ช่องเรียงจากบนลงล่าง แต่ละแถวชิดด้านซ้าย รวมเป็นช่องแรเงาทั้งหมด 10 ช่อง`}},estimatedSeconds:75},{id:`A-07`,testId:`stw-mock-a`,number:7,skill:`Word Problems & Logic`,topic:{en:`Speed, Distance & Time`,th:`อัตราเร็ว ระยะทาง และเวลา`},difficulty:F(7),prompt:{en:`Ploy and Kate both start from the school gate and walk along the same straight 900-metre path to the sports field, in the same direction. Ploy sets off first, walking at 50 metres per minute. Kate starts 3 minutes later, jogging at 80 metres per minute along the same path. How many minutes after Kate starts will she catch up to Ploy?`,th:`พลอยและเคทออกเดินจากประตูโรงเรียนไปตามทางตรงเส้นเดียวกันยาว 900 เมตร สู่สนามกีฬา ในทิศทางเดียวกัน พลอยออกเดินก่อนด้วยความเร็ว 50 เมตรต่อนาที ส่วนเคทออกช้ากว่า 3 นาที และวิ่งเหยาะด้วยความเร็ว 80 เมตรต่อนาทีตามเส้นทางเดียวกัน อีกกี่นาทีหลังจากเคทออกวิ่ง เธอจึงจะวิ่งทันพลอย`},options:[{id:`A`,label:{en:`6 minutes`,th:`6 นาที`}},{id:`B`,label:{en:`8 minutes`,th:`8 นาที`}},{id:`C`,label:{en:`5 minutes`,th:`5 นาที`}},{id:`D`,label:{en:`10 minutes`,th:`10 นาที`}}],correctOptionId:`C`,explanation:{en:`By the time Kate starts, Ploy already has a 3-minute head start, covering 50 × 3 = 150 metres. From then on, Kate closes the gap at a rate of 80 − 50 = 30 metres per minute. Time to catch up = 150 ÷ 30 = 5 minutes after Kate starts.`,th:`เมื่อเคทเริ่มวิ่ง พลอยได้ออกเดินนำหน้าไปแล้ว 3 นาที คิดเป็นระยะทาง 50 × 3 = 150 เมตร นับจากนั้นเคทจะไล่ตามด้วยอัตราส่วนต่างความเร็ว 80 − 50 = 30 เมตรต่อนาที เวลาที่ใช้ไล่ทัน = 150 ÷ 30 = 5 นาที หลังจากเคทเริ่มวิ่ง`},distractorNotes:{A:{en:`This uses an incorrect closing speed of 25 m/min (an average of the two speeds) instead of the correct difference of 30 m/min: 150 ÷ 25 = 6.`,th:`ข้อนี้ใช้อัตราไล่ทันที่ผิดคือ 25 เมตรต่อนาที (ค่าเฉลี่ยของสองความเร็ว) แทนที่จะเป็นผลต่างที่ถูกต้องคือ 30 เมตรต่อนาที: 150 ÷ 25 = 6`},B:{en:`This adds Ploy's 3-minute head start onto the correct catch-up time (5 + 3 = 8), but the question asks for minutes after Kate starts, so the head start should not be added again.`,th:`ข้อนี้นำเวลาที่พลอยออกก่อน 3 นาที ไปบวกเพิ่มกับเวลาไล่ทันที่ถูกต้อง (5 + 3 = 8) แต่โจทย์ถามเวลาหลังจากเคทเริ่มวิ่ง จึงไม่ควรบวกเวลาที่ออกก่อนซ้ำอีก`},D:{en:`This comes from an arithmetic slip, such as using a head-start distance of 300 m instead of 150 m, giving 300 ÷ 30 = 10.`,th:`ข้อนี้เกิดจากการคำนวณผิดพลาด เช่น ใช้ระยะนำหน้าเป็น 300 เมตรแทนที่จะเป็น 150 เมตร ทำให้ได้ 300 ÷ 30 = 10`}},hints:[{en:`Before Kate even starts, Ploy is already ahead — work out by how much distance.`,th:`ก่อนที่เคทจะเริ่มวิ่งด้วยซ้ำ พลอยได้เดินนำหน้าไปแล้ว ลองหาว่านำหน้าไปเป็นระยะทางเท่าไร`},{en:`Find Ploy's head-start distance, then think about how much faster Kate is moving than Ploy each minute — that's the rate the gap closes.`,th:`หาระยะทางที่พลอยนำหน้าก่อน แล้วคิดว่าเคทเร็วกว่าพลอยเท่าไรในแต่ละนาที นั่นคืออัตราที่ระยะห่างลดลง`},{en:`Head start = 50 × 3 = 150 m. The gap closes at 80 − 50 = 30 m per minute. Divide the head-start distance by this closing speed.`,th:`ระยะนำหน้า = 50 × 3 = 150 เมตร ระยะห่างลดลงด้วยอัตรา 80 − 50 = 30 เมตรต่อนาที ให้นำระยะนำหน้าไปหารด้วยอัตราการไล่ทันนี้`}],visual:null,estimatedSeconds:90},{id:`A-08`,testId:`stw-mock-a`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing Money in a Ratio`,th:`การแบ่งเงินตามอัตราส่วน`},difficulty:F(8),prompt:{en:`Two sisters, Ning and Orn, share 960 baht in the ratio 7:5. Ning then spends \\frac{2}{5} of her own share on storybooks. How much money does Ning have left?`,th:`พี่น้องสองคนคือหนิงและอ้อนแบ่งเงิน 960 บาท ตามอัตราส่วน 7:5 จากนั้นหนิงนำเงินส่วนของตัวเอง \\frac{2}{5} ไปซื้อหนังสือนิทาน หนิงจะเหลือเงินเท่าไร`},options:[{id:`A`,label:{en:`176 baht`,th:`176 บาท`}},{id:`B`,label:{en:`336 baht`,th:`336 บาท`}},{id:`C`,label:{en:`224 baht`,th:`224 บาท`}},{id:`D`,label:{en:`400 baht`,th:`400 บาท`}}],correctOptionId:`B`,explanation:{en:`Ning's share = 960 × \\frac{7}{12} = 560 baht. She spends \\frac{2}{5} of her own 560 baht: 560 × \\frac{2}{5} = 224 baht. Money left = 560 − 224 = 336 baht.`,th:`ส่วนของหนิง = 960 × \\frac{7}{12} = 560 บาท เธอใช้เงิน \\frac{2}{5} ของส่วนตัวเอง 560 บาท: 560 × \\frac{2}{5} = 224 บาท เงินที่เหลือ = 560 − 224 = 336 บาท`},distractorNotes:{A:{en:`This mistakenly takes \\frac{2}{5} of the whole 960 baht (instead of just Ning's own share) and subtracts that from Ning's share: 560 − 384 = 176.`,th:`ข้อนี้คำนวณ \\frac{2}{5} ของเงินทั้งหมด 960 บาทผิดพลาด (แทนที่จะเป็น \\frac{2}{5} ของส่วนหนิงเท่านั้น) แล้วนำไปลบออกจากส่วนของหนิง: 560 − 384 = 176`},C:{en:`This is the amount Ning spent, not the amount she has left — the two quantities have been switched.`,th:`ข้อนี้คือจำนวนเงินที่หนิงใช้ไป ไม่ใช่เงินที่เหลืออยู่ เกิดจากการสลับสองปริมาณนี้`},D:{en:`This is Orn's share of the money (960 × \\frac{5}{12} = 400), not Ning's remaining money — the wrong person's amount has been calculated.`,th:`ข้อนี้คือส่วนแบ่งของอ้อน (960 × \\frac{5}{12} = 400) ไม่ใช่เงินที่เหลือของหนิง เกิดจากการคำนวณส่วนของคนละคนผิด`}},hints:[{en:`First work out how much money Ning received before she spent anything.`,th:`หาก่อนว่าหนิงได้รับเงินเท่าไรก่อนที่จะเริ่มใช้จ่าย`},{en:`Split 960 baht into 12 equal parts (since 7+5=12), find how many baht one part is worth, then find Ning's 7 parts.`,th:`แบ่งเงิน 960 บาทออกเป็น 12 ส่วนเท่าๆ กัน (เพราะ 7+5=12) หาว่าหนึ่งส่วนมีค่ากี่บาท แล้วหาส่วนของหนิงซึ่งมี 7 ส่วน`},{en:`Ning's share is 560 baht. She spends two-fifths of THAT amount (not the original 960), so subtract 560 × 2/5 from 560 to find what's left.`,th:`ส่วนของหนิงคือ 560 บาท เธอใช้ไปสองในห้าของจำนวนนี้ (ไม่ใช่ของ 960 บาทเดิม) จึงนำ 560 ลบด้วย 560 × 2/5 เพื่อหาเงินที่เหลือ`}],visual:null,estimatedSeconds:85},{id:`A-09`,testId:`stw-mock-a`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel Lines & Triangle Angles`,th:`เส้นขนานและมุมในรูปสามเหลี่ยม`},difficulty:F(9),prompt:{en:`In the figure, line ℓ passes through vertex C of triangle ABC and is parallel to side AB. The angle between ℓ and CA is 52°, and the angle between ℓ and CB is 61°. Find the size of angle ACB.`,th:`จากรูป เส้นตรง ℓ ลากผ่านจุดยอด C ของรูปสามเหลี่ยม ABC และขนานกับด้าน AB มุมระหว่าง ℓ กับ CA มีขนาด 52° และมุมระหว่าง ℓ กับ CB มีขนาด 61° จงหาขนาดของมุม ACB`},options:[{id:`A`,label:{en:`113°`,th:`113°`}},{id:`B`,label:{en:`119°`,th:`119°`}},{id:`C`,label:{en:`128°`,th:`128°`}},{id:`D`,label:{en:`67°`,th:`67°`}}],correctOptionId:`D`,explanation:{en:`Since ℓ ∥ AB, CA and CB act as transversals. By alternate angles, the 52° angle equals angle CAB and the 61° angle equals angle CBA. The three angles marked at C (52°, angle ACB, and 61°) lie on the straight line ℓ, so they add up to 180°: angle ACB = 180° − 52° − 61° = 67°.`,th:`เนื่องจาก ℓ ขนานกับ AB โดยมี CA และ CB เป็นเส้นตัด ตามคุณสมบัติมุมแย้ง มุม 52° จะเท่ากับมุม CAB และมุม 61° จะเท่ากับมุม CBA มุมทั้งสามที่จุด C (มุม 52°, มุม ACB และมุม 61°) อยู่บนเส้นตรง ℓ เดียวกัน จึงรวมกันได้ 180°: มุม ACB = 180° − 52° − 61° = 67°`},distractorNotes:{A:{en:`This simply adds the two given angles (52° + 61° = 113°) instead of subtracting their sum from 180°, treating angle ACB as if it equalled the sum directly.`,th:`ข้อนี้เพียงนำมุมที่กำหนดสองมุมมาบวกกัน (52° + 61° = 113°) แทนที่จะนำผลรวมไปลบออกจาก 180° โดยเข้าใจผิดว่ามุม ACB เท่ากับผลรวมนั้นโดยตรง`},B:{en:`This only subtracts the 61° angle from 180° (180° − 61° = 119°) and forgets to also subtract the 52° angle.`,th:`ข้อนี้นำ 180° ลบด้วยมุม 61° เพียงมุมเดียว (180° − 61° = 119°) โดยลืมลบมุม 52° ออกไปด้วย`},C:{en:`This only subtracts the 52° angle from 180° (180° − 52° = 128°) and forgets to also subtract the 61° angle.`,th:`ข้อนี้นำ 180° ลบด้วยมุม 52° เพียงมุมเดียว (180° − 52° = 128°) โดยลืมลบมุม 61° ออกไปด้วย`}},hints:[{en:`The line through C and the two sides of the triangle meet at C, all lying along a straight line together with angle ACB.`,th:`เส้นตรงที่ผ่าน C และด้านทั้งสองของรูปสามเหลี่ยมมาบรรจบกันที่ C โดยอยู่บนเส้นตรงเดียวกันร่วมกับมุม ACB`},{en:`Angles on a straight line add up to 180°. The 52°, the 61°, and angle ACB together make up that straight line at point C.`,th:`มุมบนเส้นตรงรวมกันได้ 180° มุม 52°, มุม 61° และมุม ACB รวมกันเป็นเส้นตรงที่จุด C`},{en:`angle ACB = 180° − 52° − 61°. Subtract both given angles from 180° to get the answer.`,th:`มุม ACB = 180° − 52° − 61° นำมุมที่กำหนดทั้งสองมุมไปลบออกจาก 180° เพื่อหาคำตอบ`}],visual:{kind:`geometryFigure`,width:300,height:140,segments:[{x1:20,y1:10,x2:280,y2:10,ticks:2},{x1:40,y1:110,x2:260,y2:110,ticks:2},{x1:150,y1:10,x2:72,y2:110},{x1:150,y1:10,x2:205,y2:110}],points:[{x:150,y:10,label:`C`,labelOffset:[6,-10]},{x:72,y:110,label:`A`,labelOffset:[-14,16]},{x:205,y:110,label:`B`,labelOffset:[8,16]}],angleMarks:[{x:150,y:10,fromDeg:180,toDeg:232,radius:22,label:`52°`},{x:150,y:10,fromDeg:299,toDeg:360,radius:22,label:`61°`}],alt:{en:`Triangle ABC with a line ℓ through vertex C parallel to side AB. The angle between ℓ and CA is marked 52°, the angle between ℓ and CB is marked 61°, and angle ACB is unmarked.`,th:`รูปสามเหลี่ยม ABC มีเส้นตรง ℓ ผ่านจุดยอด C ขนานกับด้าน AB มุมระหว่าง ℓ กับ CA กำกับไว้ 52° มุมระหว่าง ℓ กับ CB กำกับไว้ 61° และมุม ACB ไม่ได้กำกับขนาดไว้`}},estimatedSeconds:90},{id:`A-10`,testId:`stw-mock-a`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Cylinder Volume Comparison`,th:`การเปรียบเทียบปริมาตรทรงกระบอก`},difficulty:F(10),prompt:{en:`Tank A and Tank B are cylindrical water tanks that hold exactly the same volume of water. Tank A has base radius 6 cm and height 24 cm. Tank B has base radius 12 cm (double Tank A's radius). What is the height of Tank B?`,th:`ถังน้ำ A และถังน้ำ B เป็นทรงกระบอกที่บรรจุน้ำได้ปริมาตรเท่ากันพอดี ถัง A มีรัศมีฐาน 6 ซม. และสูง 24 ซม. ถัง B มีรัศมีฐาน 12 ซม. (เป็นสองเท่าของรัศมีถัง A) ถัง B สูงเท่าไร`},options:[{id:`A`,label:{en:`6 cm`,th:`6 ซม.`}},{id:`B`,label:{en:`3 cm`,th:`3 ซม.`}},{id:`C`,label:{en:`12 cm`,th:`12 ซม.`}},{id:`D`,label:{en:`48 cm`,th:`48 ซม.`}}],correctOptionId:`A`,explanation:{en:`Volume of a cylinder is proportional to (radius)² × height. Tank A: 6² × 24 = 864 (in these units). Tank B has radius 12, so 12² × h = 864, giving 144h = 864 and h = 6 cm. Doubling the radius multiplies the base area by 4, so the height must shrink to a quarter to keep the same volume: 24 ÷ 4 = 6.`,th:`ปริมาตรทรงกระบอกแปรผันตาม (รัศมี)² × สูง ถัง A: 6² × 24 = 864 (หน่วยเปรียบเทียบ) ถัง B มีรัศมี 12 จะได้ 12² × h = 864 ดังนั้น 144h = 864 และ h = 6 ซม. เมื่อรัศมีเพิ่มเป็นสองเท่า พื้นที่ฐานจะเพิ่มเป็น 4 เท่า ความสูงจึงต้องลดลงเหลือหนึ่งในสี่เพื่อให้ปริมาตรเท่าเดิม: 24 ÷ 4 = 6`},distractorNotes:{B:{en:`This assumes the height must shrink by the same factor the radius grew (÷2 more, i.e. 6÷2), but since volume depends on radius SQUARED, the height should be divided by 2² = 4, not repeatedly halved.`,th:`ข้อนี้เข้าใจว่าความสูงต้องลดลงตามอัตราเดียวกับที่รัศมีเพิ่ม (หารด้วย 2 ซ้ำอีกครั้งจาก 6) แต่เนื่องจากปริมาตรขึ้นกับรัศมี ยกกำลังสอง ความสูงจึงควรหารด้วย 2² = 4 ไม่ใช่หารด้วย 2 ซ้ำสองครั้ง`},C:{en:`This assumes height changes in direct (not squared) proportion to radius, so doubling the radius means simply halving the height (24÷2=12) — this ignores that volume depends on radius squared.`,th:`ข้อนี้เข้าใจว่าความสูงเปลี่ยนแปลงเป็นสัดส่วนตรงกับรัศมี (ไม่ใช่กำลังสอง) จึงคิดว่ารัศมีเพิ่มเป็นสองเท่า ความสูงก็แค่ลดลงครึ่งหนึ่ง (24÷2=12) ซึ่งไม่ได้คำนึงว่าปริมาตรขึ้นกับรัศมียกกำลังสอง`},D:{en:`This doubles the height instead of reducing it, perhaps by confusing which tank is larger — a bigger radius should need a SMALLER height to keep the same volume, not a larger one.`,th:`ข้อนี้เพิ่มความสูงเป็นสองเท่าแทนที่จะลดลง อาจเกิดจากความสับสนว่าถังใดใหญ่กว่า ความจริงรัศมีที่มากขึ้นควรทำให้ความสูงลดลงเพื่อคงปริมาตรเท่าเดิม ไม่ใช่เพิ่มขึ้น`}},hints:[{en:`Volume depends on both the base and the height — think about what happens to the base area when the radius doubles.`,th:`ปริมาตรขึ้นอยู่กับทั้งพื้นที่ฐานและความสูง ลองคิดดูว่าพื้นที่ฐานจะเปลี่ยนแปลงอย่างไรเมื่อรัศมีเพิ่มเป็นสองเท่า`},{en:`The volume of a cylinder uses radius SQUARED, not just radius. Doubling the radius makes the base area 4 times bigger, not just 2 times.`,th:`ปริมาตรทรงกระบอกใช้รัศมี ยกกำลังสอง ไม่ใช่แค่รัศมีเฉยๆ เมื่อรัศมีเพิ่มเป็นสองเท่า พื้นที่ฐานจะเพิ่มขึ้นเป็น 4 เท่า ไม่ใช่ 2 เท่า`},{en:`Since the base area becomes 4 times bigger, the height must become 4 times smaller to keep the same volume. Divide Tank A's height (24 cm) by 4.`,th:`เนื่องจากพื้นที่ฐานเพิ่มขึ้นเป็น 4 เท่า ความสูงจึงต้องลดลงเหลือหนึ่งในสี่เพื่อให้ปริมาตรเท่าเดิม ให้นำความสูงของถัง A (24 ซม.) หารด้วย 4`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:12,height:24,label:`Tank A`},{baseSide:24,height:6,heightLabel:`h`,label:`Tank B`}],alt:{en:`Two cylindrical tanks side by side: Tank A is tall and narrow with radius 6 cm and height 24 cm; Tank B is short and wide with radius 12 cm and an unlabeled height marked h.`,th:`ถังทรงกระบอกสองใบวางเคียงกัน ถัง A สูงและแคบ มีรัศมี 6 ซม. สูง 24 ซม. ถัง B เตี้ยและกว้าง มีรัศมี 12 ซม. และความสูงไม่ได้ระบุตัวเลข กำกับด้วย h`}},estimatedSeconds:95},{id:`A-11`,testId:`stw-mock-a`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area`,th:`พื้นที่รูปประกอบ (สี่เหลี่ยมตัดมุม)`},difficulty:F(11),prompt:{en:`A rectangular sheet of paper measures 18 cm by 12 cm. A right-triangle corner measuring 6 cm by 4 cm is cut from one corner, and a right-triangle corner measuring 5 cm by 4 cm is cut from the opposite corner, as shown. Find the area of the remaining shaded shape.`,th:`กระดาษรูปสี่เหลี่ยมผืนผ้าขนาด 18 ซม. คูณ 12 ซม. ถูกตัดมุมรูปสามเหลี่ยมมุมฉากขนาด 6 ซม. คูณ 4 ซม. ออกจากมุมหนึ่ง และตัดมุมรูปสามเหลี่ยมมุมฉากขนาด 5 ซม. คูณ 4 ซม. ออกจากมุมตรงข้าม ดังภาพ จงหาพื้นที่ของรูปที่แรเงาที่เหลืออยู่`},options:[{id:`A`,label:{en:`182 cm²`,th:`182 ตร.ซม.`}},{id:`B`,label:{en:`194 cm²`,th:`194 ตร.ซม.`}},{id:`C`,label:{en:`204 cm²`,th:`204 ตร.ซม.`}},{id:`D`,label:{en:`238 cm²`,th:`238 ตร.ซม.`}}],correctOptionId:`B`,explanation:{en:`The full rectangle's area is 18 × 12 = 216 cm². The first cut-off triangle has area \\frac{1}{2} × 6 × 4 = 12 cm², and the second has area \\frac{1}{2} × 5 × 4 = 10 cm². Remaining shaded area = 216 − 12 − 10 = 194 cm².`,th:`พื้นที่สี่เหลี่ยมผืนผ้าทั้งหมด = 18 × 12 = 216 ตร.ซม. สามเหลี่ยมที่ถูกตัดรูปแรกมีพื้นที่ \\frac{1}{2} × 6 × 4 = 12 ตร.ซม. และรูปที่สองมีพื้นที่ \\frac{1}{2} × 5 × 4 = 10 ตร.ซม. พื้นที่ที่แรเงาเหลืออยู่ = 216 − 12 − 10 = 194 ตร.ซม.`},distractorNotes:{A:{en:`This overcounts the area removed at the two cut corners (for example by mis-computing one triangle's area too large), so the remaining shaded area comes out lower than the correct 194.`,th:`ข้อนี้คำนวณพื้นที่ที่ถูกตัดออกจากมุมทั้งสองมากเกินจริง (เช่น คำนวณพื้นที่สามเหลี่ยมรูปใดรูปหนึ่งผิดพลาดจนได้ค่ามากเกินไป) ทำให้พื้นที่ที่เหลือคำนวณได้น้อยกว่าคำตอบที่ถูกต้องคือ 194`},C:{en:`This subtracts only one triangle (the 6×4 one) and forgets to subtract the second triangle (5×4) as well: 216 − 12 = 204.`,th:`ข้อนี้ลบพื้นที่ออกเพียงสามเหลี่ยมรูปเดียว (6×4) และลืมลบสามเหลี่ยมรูปที่สอง (5×4) ออกไปด้วย: 216 − 12 = 204`},D:{en:`This adds the two triangles' areas to the rectangle instead of subtracting them: 216 + 12 + 10 = 238, treating the corners as added-on pieces rather than removed pieces.`,th:`ข้อนี้นำพื้นที่สามเหลี่ยมทั้งสองไปบวกเพิ่มกับสี่เหลี่ยมผืนผ้าแทนที่จะลบออก: 216 + 12 + 10 = 238 โดยเข้าใจผิดว่ามุมทั้งสองเป็นส่วนที่เพิ่มเข้ามาแทนที่จะเป็นส่วนที่ถูกตัดออก`}},hints:[{en:`Start with the area of the full rectangle before any corners were cut.`,th:`เริ่มจากหาพื้นที่สี่เหลี่ยมผืนผ้าทั้งหมดก่อนที่จะมีการตัดมุมใดๆ`},{en:`Each cut-off corner is a right triangle. Find the area of each triangle separately using half of base times height.`,th:`มุมที่ถูกตัดแต่ละมุมเป็นรูปสามเหลี่ยมมุมฉาก หาพื้นที่ของแต่ละรูปแยกกันโดยใช้ครึ่งหนึ่งของฐานคูณสูง`},{en:`Subtract BOTH triangles' areas from the rectangle's area: 216 − 12 − 10.`,th:`นำพื้นที่สามเหลี่ยมทั้งสองรูปไปลบออกจากพื้นที่สี่เหลี่ยมผืนผ้า: 216 − 12 − 10`}],visual:{kind:`geometryFigure`,width:216,height:144,segments:[{x1:0,y1:0,x2:216,y2:0,style:`dashed`},{x1:216,y1:0,x2:216,y2:144,style:`dashed`},{x1:216,y1:144,x2:0,y2:144,style:`dashed`},{x1:0,y1:144,x2:0,y2:0,style:`dashed`}],polygons:[{points:[[0,0],[156,0],[216,48],[216,144],[72,144],[0,96]],fill:`shaded`}],labels:[{x:108,y:-14,text:`18 cm`},{x:-20,y:72,text:`12 cm`},{x:30,y:162,text:`6 cm`},{x:-16,y:120,text:`4 cm`},{x:186,y:-14,text:`5 cm`},{x:228,y:24,text:`4 cm`}],alt:{en:`A rectangle with two opposite corners cut off by right triangles, leaving a shaded six-sided shape. The original rectangle is shown as a dashed outline, with side lengths 18 cm and 12 cm, and the two cut corners labeled 6 cm by 4 cm and 5 cm by 4 cm.`,th:`รูปสี่เหลี่ยมผืนผ้าที่มีมุมตรงข้ามสองมุมถูกตัดออกด้วยรูปสามเหลี่ยมมุมฉาก เหลือเป็นรูปหกเหลี่ยมที่แรเงา แสดงกรอบสี่เหลี่ยมผืนผ้าเดิมเป็นเส้นประ มีความยาวด้าน 18 ซม. และ 12 ซม. และมุมที่ถูกตัดทั้งสองกำกับขนาด 6 ซม. คูณ 4 ซม. และ 5 ซม. คูณ 4 ซม.`}},estimatedSeconds:120},{id:`A-12`,testId:`stw-mock-a`,number:12,skill:`Geometry & Angles`,topic:{en:`Zig-zag Angles Between Parallels`,th:`มุมฟันปลาระหว่างเส้นขนาน`},difficulty:F(12),prompt:{en:`In the figure, line m is parallel to line n. A bent path goes from point A on line m to point P, then to point D on line n. Angle BAP = (2x + 5)° and angle PDC = (3x − 5)°, where B and C are points further along lines m and n. If angle APD = 150°, find the value of x, then find the size of angle PDC.`,th:`จากรูป เส้นตรง m ขนานกับเส้นตรง n มีเส้นหักมุมลากจากจุด A บนเส้น m ไปยังจุด P แล้วไปยังจุด D บนเส้น n โดยมุม BAP = (2x + 5)° และมุม PDC = (3x − 5)° เมื่อ B และ C เป็นจุดที่อยู่ถัดไปบนเส้น m และเส้น n ตามลำดับ ถ้ามุม APD = 150° จงหาค่า x แล้วจึงหาขนาดของมุม PDC`},options:[{id:`A`,label:{en:`30°`,th:`30°`}},{id:`B`,label:{en:`55°`,th:`55°`}},{id:`C`,label:{en:`85°`,th:`85°`}},{id:`D`,label:{en:`65°`,th:`65°`}}],correctOptionId:`C`,explanation:{en:`Draw a helper line through P parallel to both m and n. This splits angle APD into two alternate angles equal to angle BAP and angle PDC, so angle BAP + angle PDC = angle APD: (2x+5) + (3x−5) = 150, giving 5x = 150, so x = 30. Then angle PDC = 3(30) − 5 = 85°.`,th:`ลากเส้นช่วยผ่านจุด P ให้ขนานกับทั้งเส้น m และเส้น n จะแบ่งมุม APD ออกเป็นมุมแย้งสองมุมที่เท่ากับมุม BAP และมุม PDC ดังนั้นมุม BAP + มุม PDC = มุม APD: (2x+5) + (3x−5) = 150 จะได้ 5x = 150 ดังนั้น x = 30 แล้วมุม PDC = 3(30) − 5 = 85°`},distractorNotes:{A:{en:`This reports the value of x itself (30) instead of computing the actual size of angle PDC using that value of x.`,th:`ข้อนี้ตอบค่าของ x เอง (30) แทนที่จะนำค่า x ไปคำนวณหาขนาดจริงของมุม PDC`},B:{en:`This substitutes x = 30 into the wrong expression with a sign slip, such as 3(30) − 35 or a similar miscalculation, instead of correctly computing 3(30) − 5 = 85.`,th:`ข้อนี้แทนค่า x = 30 ลงในนิพจน์ที่คำนวณผิดพลาด เช่น คำนวณเครื่องหมายหรือตัวเลขผิด แทนที่จะคำนวณ 3(30) − 5 = 85 ให้ถูกต้อง`},D:{en:`This correctly solves for x = 30 but then substitutes it into angle BAP's expression (2x+5 = 65) instead of the angle PDC expression that the question actually asks for.`,th:`ข้อนี้แก้หาค่า x = 30 ได้ถูกต้อง แต่นำไปแทนในนิพจน์ของมุม BAP (2x+5 = 65) แทนที่จะเป็นมุม PDC ที่โจทย์ถามจริงๆ`}},hints:[{en:`The bend angle at P is related to the two angles at A and D through the two parallel lines — think about drawing a third line.`,th:`มุมหักที่จุด P มีความสัมพันธ์กับมุมทั้งสองที่ A และ D ผ่านเส้นขนานทั้งสองเส้น ลองคิดถึงการลากเส้นที่สาม`},{en:`If you draw a line through P parallel to m and n, angle APD splits into two parts that are each alternate angles with BAP and PDC — so the two given expressions add up to 150.`,th:`ถ้าลากเส้นผ่าน P ให้ขนานกับเส้น m และ n มุม APD จะถูกแบ่งเป็นสองส่วนที่เป็นมุมแย้งกับมุม BAP และมุม PDC ตามลำดับ ดังนั้นนิพจน์ทั้งสองที่กำหนดจะรวมกันได้ 150`},{en:`Solve (2x+5) + (3x−5) = 150 to get x = 30. Then substitute x back into the PDC expression, 3x − 5, not the BAP one, since that's what the question asks for.`,th:`แก้สมการ (2x+5) + (3x−5) = 150 จะได้ x = 30 จากนั้นแทนค่า x กลับเข้าไปในนิพจน์ของมุม PDC คือ 3x − 5 ไม่ใช่มุม BAP เพราะเป็นสิ่งที่โจทย์ถามจริงๆ`}],visual:{kind:`geometryFigure`,width:300,height:200,segments:[{x1:30,y1:40,x2:280,y2:40,ticks:2},{x1:30,y1:190,x2:280,y2:190,ticks:2},{x1:204,y1:40,x2:237,y2:110},{x1:237,y1:110,x2:230,y2:190}],points:[{x:204,y:40,label:`A`,labelOffset:[-4,-10]},{x:260,y:40,label:`B`,labelOffset:[10,-8]},{x:230,y:190,label:`D`,labelOffset:[-6,18]},{x:270,y:190,label:`C`,labelOffset:[10,18]},{x:237,y:110,label:`P`,labelOffset:[10,-4]}],angleMarks:[{x:204,y:40,fromDeg:295,toDeg:360,radius:20,label:`(2x+5)°`},{x:230,y:190,fromDeg:0,toDeg:85,radius:20,label:`(3x-5)°`},{x:237,y:110,fromDeg:115,toDeg:265,radius:24,label:`150°`}],alt:{en:`Two parallel horizontal lines m and n with a bent path from point A on line m, to a bend point P between the lines, to point D on line n. The angle at A is marked (2x+5)°, the angle at D is marked (3x-5)°, and the angle at the bend P is marked 150°.`,th:`เส้นขนานแนวนอนสองเส้นคือ m และ n มีเส้นหักมุมจากจุด A บนเส้น m ไปยังจุดหักมุม P ระหว่างเส้นทั้งสอง แล้วไปยังจุด D บนเส้น n มุมที่จุด A กำกับ (2x+5)° มุมที่จุด D กำกับ (3x-5)° และมุมที่จุดหักมุม P กำกับ 150°`}},estimatedSeconds:130},{id:`A-13`,testId:`stw-mock-a`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Concentric Circles & Ring Area`,th:`วงกลมร่วมศูนย์และพื้นที่วงแหวน`},difficulty:F(13),prompt:{en:`Two circles share the same centre, as shown. The area of the ring (shaded region) between the two circles is 3 times the area of the inner circle. Find the ratio of the outer radius to the inner radius (R : r).`,th:`วงกลมสองวงมีจุดศูนย์กลางร่วมกัน ดังภาพ พื้นที่วงแหวน (ส่วนที่แรเงา) ระหว่างวงกลมทั้งสองมีค่าเป็น 3 เท่าของพื้นที่วงกลมวงใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน (R : r)`},options:[{id:`A`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`B`,label:{en:`4 : 1`,th:`4 : 1`}},{id:`C`,label:{en:`3 : 4`,th:`3 : 4`}},{id:`D`,label:{en:`2 : 1`,th:`2 : 1`}}],correctOptionId:`D`,explanation:{en:`Let the inner radius be r and outer radius R. Ring area = πR² − πr² = 3 × πr², so R² − r² = 3r², giving R² = 4r². Taking the square root, R = 2r, so R : r = 2 : 1.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R พื้นที่วงแหวน = πR² − πr² = 3 × πr² จะได้ R² − r² = 3r² ดังนั้น R² = 4r² ถอดรากที่สองจะได้ R = 2r ดังนั้น R : r = 2 : 1`},distractorNotes:{A:{en:`This takes the '3 times' from the problem and uses it directly as the radius ratio, skipping the step of adding 1 (for the inner circle itself) and taking a square root.`,th:`ข้อนี้นำเลข 'สามเท่า' จากโจทย์มาใช้เป็นอัตราส่วนรัศมีโดยตรง โดยข้ามขั้นตอนการบวก 1 (สำหรับวงกลมวงในเอง) และการถอดรากที่สองไป`},B:{en:`This correctly finds R² = 4r² but stops there, reporting the ratio of the AREAS (R²:r² = 4:1) instead of taking the square root to find the ratio of the RADII.`,th:`ข้อนี้หา R² = 4r² ได้ถูกต้อง แต่หยุดเพียงเท่านั้น โดยรายงานอัตราส่วนของ พื้นที่ (R²:r² = 4:1) แทนที่จะถอดรากที่สองเพื่อหาอัตราส่วนของ รัศมี`},C:{en:`This sets up the ring-to-inner-circle relationship backwards, essentially misapplying the '3 times' condition rather than correctly forming R² = 4r².`,th:`ข้อนี้ตั้งความสัมพันธ์ระหว่างวงแหวนกับวงกลมวงในสลับด้าน ทำให้แปลความหมายของเงื่อนไข 'สามเท่า' ผิดพลาด แทนที่จะได้สมการ R² = 4r² ที่ถูกต้อง`}},hints:[{en:`Write an equation connecting the ring's area to the inner circle's area using π, R, and r.`,th:`เขียนสมการที่เชื่อมโยงพื้นที่วงแหวนกับพื้นที่วงกลมวงใน โดยใช้ π, R และ r`},{en:`Ring area = πR² − πr². Set this equal to 3 times the inner circle's area (3πr²), then simplify — the π's will cancel out.`,th:`พื้นที่วงแหวน = πR² − πr² ให้ตั้งเท่ากับ 3 เท่าของพื้นที่วงกลมวงใน (3πr²) แล้วจัดรูปสมการ ค่า π จะตัดกันไป`},{en:`After simplifying you should get R² = 4r². Remember to take the square root of both sides to turn this into a ratio of radii, not areas.`,th:`หลังจัดรูปสมการแล้วจะได้ R² = 4r² อย่าลืมถอดรากที่สองทั้งสองข้างเพื่อเปลี่ยนเป็นอัตราส่วนของรัศมี ไม่ใช่อัตราส่วนของพื้นที่`}],visual:{kind:`concentricCircles`,outerRadius:18,innerRadius:11,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two circles sharing the same centre, with the outer circle labeled R and the inner circle labeled r; the ring between them is shaded.`,th:`วงกลมสองวงมีจุดศูนย์กลางร่วมกัน วงนอกกำกับด้วย R และวงในกำกับด้วย r โดยพื้นที่วงแหวนระหว่างวงกลมทั้งสองแรเงาไว้`}},estimatedSeconds:110},{id:`A-14`,testId:`stw-mock-a`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Overlapping Quarter-Circles`,th:`พื้นที่ส่วนโค้งซ้อนทับ (รูปใบไม้)`},difficulty:F(14),prompt:{en:`A square has side length 14 cm. Two quarter-circle arcs, each with radius equal to the side of the square, are drawn from two opposite corners, overlapping to form the shaded leaf shape shown. Find the area of the shaded leaf shape. (Use π ≈ \\frac{22}{7}.)`,th:`รูปสี่เหลี่ยมจัตุรัสมีด้านยาว 14 ซม. มีการลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้น แต่ละเส้นมีรัศมีเท่ากับด้านของสี่เหลี่ยมจัตุรัส จากมุมตรงข้ามสองมุม เกิดการซ้อนทับกันเป็นรูปใบไม้ที่แรเงาดังภาพ จงหาพื้นที่ของรูปใบไม้ที่แรเงา (กำหนดให้ π ≈ \\frac{22}{7})`},options:[{id:`A`,label:{en:`112 cm²`,th:`112 ตร.ซม.`}},{id:`B`,label:{en:`84 cm²`,th:`84 ตร.ซม.`}},{id:`C`,label:{en:`154 cm²`,th:`154 ตร.ซม.`}},{id:`D`,label:{en:`308 cm²`,th:`308 ตร.ซม.`}}],correctOptionId:`A`,explanation:{en:`Each quarter circle has area \\frac{1}{4} × \\frac{22}{7} × 14 × 14 = 154 cm². The two quarter circles together cover the whole square exactly once, plus the leaf shape a second time (since the leaf is where they overlap). So: leaf area = (154 + 154) − 196 = 112 cm², where 196 = 14 × 14 is the square's area.`,th:`พื้นที่ส่วนโค้งหนึ่งในสี่ของวงกลมแต่ละเส้น = \\frac{1}{4} × \\frac{22}{7} × 14 × 14 = 154 ตร.ซม. เมื่อรวมส่วนโค้งทั้งสองเข้าด้วยกัน จะครอบคลุมพื้นที่สี่เหลี่ยมจัตุรัสทั้งหมดพอดีหนึ่งครั้ง บวกกับพื้นที่รูปใบไม้อีกหนึ่งครั้ง (เพราะรูปใบไม้คือส่วนที่ซ้อนทับกัน) ดังนั้น พื้นที่รูปใบไม้ = (154 + 154) − 196 = 112 ตร.ซม. โดย 196 = 14 × 14 คือพื้นที่สี่เหลี่ยมจัตุรัส`},distractorNotes:{B:{en:`This finds the two leftover corner regions (the parts of the square NOT covered by the leaf) instead of the leaf itself: 196 − 112 = 84.`,th:`ข้อนี้หาพื้นที่ส่วนมุมที่เหลือสองมุม (ส่วนของสี่เหลี่ยมจัตุรัสที่ไม่ได้เป็นรูปใบไม้) แทนที่จะเป็นตัวรูปใบไม้เอง: 196 − 112 = 84`},C:{en:`This is the area of just ONE quarter circle, stopping before combining both arcs and subtracting the square's area.`,th:`ข้อนี้คือพื้นที่ของส่วนโค้งหนึ่งในสี่ของวงกลมเพียงเส้นเดียว โดยหยุดคำนวณก่อนที่จะรวมส่วนโค้งทั้งสองเข้าด้วยกันและลบพื้นที่สี่เหลี่ยมจัตุรัสออก`},D:{en:`This adds the two quarter-circle areas together (154 + 154 = 308) but forgets to subtract the square's area, which double-counts the overlapping leaf region as if it were the answer itself.`,th:`ข้อนี้นำพื้นที่ส่วนโค้งหนึ่งในสี่ของวงกลมทั้งสองมาบวกกัน (154 + 154 = 308) แต่ลืมลบพื้นที่สี่เหลี่ยมจัตุรัสออก ทำให้นับพื้นที่ส่วนที่ซ้อนทับ (รูปใบไม้) ซ้ำโดยไม่ได้ตั้งใจ`}},hints:[{en:`The leaf shape is the region counted by BOTH quarter circles at once — think about what happens when you add the two quarter-circle areas together.`,th:`รูปใบไม้คือส่วนที่ถูกนับซ้ำโดยส่วนโค้งทั้งสองเส้นพร้อมกัน ลองคิดดูว่าจะเกิดอะไรขึ้นเมื่อนำพื้นที่ส่วนโค้งทั้งสองมาบวกกัน`},{en:`Adding the two quarter-circle areas covers the whole square once, plus the overlapping leaf a second time. So (quarter + quarter) − square = leaf.`,th:`การบวกพื้นที่ส่วนโค้งทั้งสองจะครอบคลุมสี่เหลี่ยมจัตุรัสหนึ่งครั้ง บวกกับส่วนที่ซ้อนทับ (รูปใบไม้) อีกหนึ่งครั้ง ดังนั้น (ส่วนโค้ง + ส่วนโค้ง) − สี่เหลี่ยมจัตุรัส = รูปใบไม้`},{en:`Each quarter circle has area 154 cm² (using π ≈ 22/7). The square has area 196 cm². Compute 154 + 154 − 196.`,th:`ส่วนโค้งหนึ่งในสี่ของวงกลมแต่ละเส้นมีพื้นที่ 154 ตร.ซม. (ใช้ π ≈ 22/7) สี่เหลี่ยมจัตุรัสมีพื้นที่ 196 ตร.ซม. คำนวณ 154 + 154 − 196`}],visual:{kind:`leafShape`,width:50,height:50,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A square labeled 14 cm on each side, with two quarter-circle arcs drawn from opposite corners overlapping in the middle to form a shaded leaf shape.`,th:`รูปสี่เหลี่ยมจัตุรัสกำกับด้านยาว 14 ซม. มีส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้นลากจากมุมตรงข้ามซ้อนทับกันตรงกลางเป็นรูปใบไม้ที่แรเงา`}},estimatedSeconds:125},{id:`A-15`,testId:`stw-mock-a`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Remaining Amount`,th:`เศษส่วนของสิ่งที่เหลือ`},difficulty:F(15),prompt:{en:`A tank contains 96 litres of water. On Monday, \\frac{3}{8} of the water is used. On Tuesday, \\frac{2}{5} of the remaining water is used. How many more litres were used on Monday than on Tuesday?`,th:`ถังน้ำใบหนึ่งมีน้ำอยู่ 96 ลิตร วันจันทร์มีการใช้น้ำไป \\frac{3}{8} ของน้ำทั้งหมด วันอังคารมีการใช้น้ำไป \\frac{2}{5} ของน้ำที่เหลืออยู่ วันจันทร์ใช้น้ำมากกว่าวันอังคารกี่ลิตร`},options:[{id:`A`,label:{en:`24 litres`,th:`24 ลิตร`}},{id:`B`,label:{en:`36 litres`,th:`36 ลิตร`}},{id:`C`,label:{en:`12 litres`,th:`12 ลิตร`}},{id:`D`,label:{en:`60 litres`,th:`60 ลิตร`}}],correctOptionId:`C`,explanation:{en:`Monday's usage = \\frac{3}{8} × 96 = 36 litres. Water remaining after Monday = 96 − 36 = 60 litres. Tuesday's usage = \\frac{2}{5} × 60 = 24 litres. Difference = 36 − 24 = 12 litres.`,th:`น้ำที่ใช้วันจันทร์ = \\frac{3}{8} × 96 = 36 ลิตร น้ำที่เหลือหลังวันจันทร์ = 96 − 36 = 60 ลิตร น้ำที่ใช้วันอังคาร = \\frac{2}{5} × 60 = 24 ลิตร ผลต่าง = 36 − 24 = 12 ลิตร`},distractorNotes:{A:{en:`This reports Tuesday's usage alone (24 litres) instead of computing the difference between Monday's and Tuesday's usage.`,th:`ข้อนี้ตอบเพียงปริมาณน้ำที่ใช้วันอังคาร (24 ลิตร) แทนที่จะคำนวณผลต่างระหว่างน้ำที่ใช้วันจันทร์กับวันอังคาร`},B:{en:`This reports the amount of water remaining after Tuesday (60 − 24 = 36 litres), confusing 'water left' with the difference the question actually asks for.`,th:`ข้อนี้ตอบปริมาณน้ำที่เหลืออยู่หลังวันอังคาร (60 − 24 = 36 ลิตร) เกิดจากความสับสนระหว่าง 'น้ำที่เหลือ' กับผลต่างที่โจทย์ถามจริงๆ`},D:{en:`This reports the water remaining after Monday alone (96 − 36 = 60 litres), stopping before working out Tuesday's usage or the actual difference.`,th:`ข้อนี้ตอบปริมาณน้ำที่เหลือหลังวันจันทร์เพียงอย่างเดียว (96 − 36 = 60 ลิตร) โดยหยุดคำนวณก่อนที่จะหาปริมาณน้ำที่ใช้วันอังคารหรือผลต่างที่แท้จริง`}},hints:[{en:`Work out Monday's usage and Tuesday's usage as two separate steps before comparing them.`,th:`หาปริมาณน้ำที่ใช้วันจันทร์และวันอังคารแยกกันก่อน แล้วจึงนำมาเปรียบเทียบกัน`},{en:`Tuesday's fraction (2/5) applies to the water left AFTER Monday's usage, not to the original 96 litres.`,th:`เศษส่วนของวันอังคาร (2/5) ใช้กับน้ำที่เหลือ หลังจาก ใช้น้ำวันจันทร์ไปแล้ว ไม่ใช่ของน้ำ 96 ลิตรเดิม`},{en:`Monday used 36 L, leaving 60 L. Tuesday used 2/5 of that 60 L, which is 24 L. Subtract to find how much more Monday used than Tuesday.`,th:`วันจันทร์ใช้น้ำ 36 ลิตร เหลือ 60 ลิตร วันอังคารใช้ไป 2/5 ของ 60 ลิตรนั้น ซึ่งเท่ากับ 24 ลิตร นำมาลบกันเพื่อหาว่าวันจันทร์ใช้มากกว่าวันอังคารเท่าไร`}],visual:null,estimatedSeconds:100},{id:`A-16`,testId:`stw-mock-a`,number:16,skill:`Algebra & Patterns`,topic:{en:`Area Equations from Cut Corners`,th:`สมการพื้นที่จากมุมที่ถูกตัด`},difficulty:F(16),prompt:{en:`A square sheet of paper has side length 20 cm. Each of its 4 corners is cut off as a right-angled isosceles triangle with both legs equal to x cm, leaving the shaded octagon shown, which has area 328 cm². Find the value of x.`,th:`กระดาษรูปสี่เหลี่ยมจัตุรัสมีด้านยาว 20 ซม. มุมทั้ง 4 มุมถูกตัดออกเป็นรูปสามเหลี่ยมมุมฉากหน้าจั่วที่มีด้านประกอบมุมฉากยาวด้านละ x ซม. เท่ากัน เหลือเป็นรูปแปดเหลี่ยมที่แรเงาดังภาพ ซึ่งมีพื้นที่ 328 ตร.ซม. จงหาค่า x`},options:[{id:`A`,label:{en:`8 cm`,th:`8 ซม.`}},{id:`B`,label:{en:`6 cm`,th:`6 ซม.`}},{id:`C`,label:{en:`12 cm`,th:`12 ซม.`}},{id:`D`,label:{en:`18 cm`,th:`18 ซม.`}}],correctOptionId:`B`,explanation:{en:`The square's area is 20 × 20 = 400 cm². The total area removed by the 4 corner triangles is 400 − 328 = 72 cm². Each triangle has area \\frac{1}{2}x², so 4 × \\frac{1}{2}x² = 72, giving 2x² = 72, so x² = 36 and x = 6 cm.`,th:`พื้นที่สี่เหลี่ยมจัตุรัส = 20 × 20 = 400 ตร.ซม. พื้นที่ที่ถูกตัดออกทั้งหมดจากสามเหลี่ยม 4 มุม = 400 − 328 = 72 ตร.ซม. สามเหลี่ยมแต่ละรูปมีพื้นที่ \\frac{1}{2}x² ดังนั้น 4 × \\frac{1}{2}x² = 72 จะได้ 2x² = 72 ดังนั้น x² = 36 และ x = 6 ซม.`},distractorNotes:{A:{en:`This is the length of one flat edge of the octagon (20 − 2×6 = 8), not the value of x — the two different lengths in the figure have been mixed up.`,th:`ข้อนี้คือความยาวของด้านราบด้านหนึ่งของรูปแปดเหลี่ยม (20 − 2×6 = 8) ไม่ใช่ค่าของ x เกิดจากการสับสนระหว่างความยาวสองแบบที่ต่างกันในรูป`},C:{en:`This doubles the correct value of x (2 × 6 = 12), perhaps from a mix-up between the leg length and the distance spanning across a corner.`,th:`ข้อนี้เพิ่มค่า x ที่ถูกต้องเป็นสองเท่า (2 × 6 = 12) อาจเกิดจากความสับสนระหว่างความยาวด้านประกอบมุมฉากกับระยะทางพาดผ่านมุม`},D:{en:`This treats the area removed from one corner (72 ÷ 4 = 18 cm²) as if it were the length x itself, mixing up an area value with a length value.`,th:`ข้อนี้นำพื้นที่ที่ถูกตัดออกจากมุมเดียว (72 ÷ 4 = 18 ตร.ซม.) มาใช้เป็นความยาว x โดยตรง เกิดจากการสับสนระหว่างค่าพื้นที่กับค่าความยาว`}},hints:[{en:`Start by finding the total area that was cut away from all 4 corners combined.`,th:`เริ่มจากหาพื้นที่รวมทั้งหมดที่ถูกตัดออกจากมุมทั้ง 4 มุม`},{en:`Each corner triangle has legs of length x, so its area is half of x times x. There are 4 identical corners.`,th:`สามเหลี่ยมแต่ละมุมมีด้านประกอบมุมฉากยาว x ดังนั้นพื้นที่ของแต่ละรูปคือครึ่งหนึ่งของ x คูณ x และมีมุมที่เหมือนกันแบบนี้ 4 มุม`},{en:`Set up 4 × (half of x²) = 72, the total area removed. Solve for x² first, then take the square root.`,th:`ตั้งสมการ 4 × (ครึ่งหนึ่งของ x²) = 72 ซึ่งเป็นพื้นที่รวมที่ถูกตัดออก แก้หาค่า x² ก่อน แล้วจึงถอดรากที่สอง`}],visual:{kind:`geometryFigure`,width:200,height:200,segments:[{x1:0,y1:0,x2:200,y2:0,style:`dashed`},{x1:200,y1:0,x2:200,y2:200,style:`dashed`},{x1:200,y1:200,x2:0,y2:200,style:`dashed`},{x1:0,y1:200,x2:0,y2:0,style:`dashed`}],polygons:[{points:[[55,0],[145,0],[200,55],[200,145],[145,200],[55,200],[0,145],[0,55]],fill:`shaded`}],labels:[{x:27,y:-14,text:`x`},{x:-16,y:27,text:`x`}],alt:{en:`A square with all four corners cut off, leaving a shaded octagon. The original square is shown as a dashed outline, and at one corner both cut legs are labeled x, positioned near their own edges.`,th:`รูปสี่เหลี่ยมจัตุรัสที่ถูกตัดมุมทั้งสี่มุมออก เหลือเป็นรูปแปดเหลี่ยมที่แรเงา แสดงกรอบสี่เหลี่ยมจัตุรัสเดิมเป็นเส้นประ และที่มุมหนึ่งมีด้านที่ถูกตัดทั้งสองด้านกำกับด้วย x โดยอยู่ใกล้กับด้านของตัวเอง`}},estimatedSeconds:135},{id:`A-17`,testId:`stw-mock-a`,number:17,skill:`Graphs & Data`,topic:{en:`Reading Grouped Bar Charts`,th:`การอ่านกราฟแท่งเปรียบเทียบ`},difficulty:F(17),prompt:{en:`The bar chart shows the number of books sold by the Falcon Club and the Comet Club during a 4-week book fair. Which of the following statements is INCORRECT?`,th:`กราฟแท่งแสดงจำนวนหนังสือที่ชมรมเหยี่ยวและชมรมดาวหางขายได้ในช่วงงานหนังสือ 4 สัปดาห์ ข้อความใดต่อไปนี้ ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Over the four weeks, Falcon Club sold more books in total than Comet Club.`,th:`ตลอดสี่สัปดาห์ ชมรมเหยี่ยวขายหนังสือได้รวมมากกว่าชมรมดาวหาง`}},{id:`B`,label:{en:`In Week 4, Falcon Club sold more books than Comet Club.`,th:`ในสัปดาห์ที่ 4 ชมรมเหยี่ยวขายหนังสือได้มากกว่าชมรมดาวหาง`}},{id:`C`,label:{en:`The combined number of books sold by both clubs in Week 2 was 55.`,th:`จำนวนหนังสือรวมที่ทั้งสองชมรมขายได้ในสัปดาห์ที่ 2 คือ 55 เล่ม`}},{id:`D`,label:{en:`Comet Club's Week 3 sales of 45 books were higher than any other single bar on the chart.`,th:`ยอดขายของชมรมดาวหางในสัปดาห์ที่ 3 จำนวน 45 เล่ม สูงกว่าแท่งกราฟอื่นใดทั้งหมดในภาพ`}}],correctOptionId:`A`,explanation:{en:`Falcon's weekly totals are 20, 35, 25, 40 (total 120). Comet's are 30, 20, 45, 35 (total 130). Since 120 < 130, Comet actually sold more books in total than Falcon, so the statement claiming Falcon sold more in total is incorrect. The other three statements check out: Falcon (40) beats Comet (35) in Week 4; Week 2's combined total is 35+20=55; and Comet's 45 in Week 3 is indeed the tallest bar on the whole chart.`,th:`ยอดขายรายสัปดาห์ของชมรมเหยี่ยวคือ 20, 35, 25, 40 (รวม 120) ของชมรมดาวหางคือ 30, 20, 45, 35 (รวม 130) เนื่องจาก 120 น้อยกว่า 130 ชมรมดาวหางจึงขายได้รวมมากกว่าชมรมเหยี่ยว ข้อความที่บอกว่าเหยี่ยวขายได้รวมมากกว่าจึงไม่ถูกต้อง ส่วนข้อความอีกสามข้อถูกต้องทั้งหมด คือ สัปดาห์ที่ 4 เหยี่ยว (40) ขายได้มากกว่าดาวหาง (35) จริง สัปดาห์ที่ 2 รวมกันได้ 35+20=55 จริง และยอดขาย 45 เล่มของดาวหางในสัปดาห์ที่ 3 เป็นแท่งกราฟที่สูงที่สุดในภาพจริง`},distractorNotes:{B:{en:`This statement is actually TRUE (Falcon's 40 in Week 4 beats Comet's 35), so it is not the incorrect one being asked for — check each bar's height carefully before deciding.`,th:`ข้อความนี้เป็นจริง (เหยี่ยว 40 เล่มในสัปดาห์ที่ 4 มากกว่าดาวหาง 35 เล่ม) จึงไม่ใช่ข้อที่ไม่ถูกต้องตามที่โจทย์ถาม ควรตรวจสอบความสูงของแท่งกราฟแต่ละแท่งให้ละเอียดก่อนตัดสินใจ`},C:{en:`This statement is actually TRUE (35 + 20 = 55 for Week 2), so choosing it means the addition wasn't checked carefully enough before deciding it was wrong.`,th:`ข้อความนี้เป็นจริง (35 + 20 = 55 สำหรับสัปดาห์ที่ 2) การเลือกข้อนี้แสดงว่ายังไม่ได้ตรวจสอบการบวกเลขให้ละเอียดก่อนตัดสินใจว่าผิด`},D:{en:`This statement is actually TRUE (45 is indeed the tallest single bar across both clubs and all four weeks), so it should not be picked as the incorrect statement.`,th:`ข้อความนี้เป็นจริง (45 เป็นแท่งกราฟที่สูงที่สุดจริงเมื่อเทียบทุกแท่งของทั้งสองชมรมตลอดสี่สัปดาห์) จึงไม่ควรเลือกข้อนี้เป็นข้อความที่ไม่ถูกต้อง`}},hints:[{en:`Check each statement one at a time against the actual bar heights — don't just trust your first impression of the chart.`,th:`ตรวจสอบข้อความแต่ละข้อทีละข้อเทียบกับความสูงจริงของแท่งกราฟ อย่าเพิ่งเชื่อความรู้สึกแรกที่มองเห็นจากกราฟ`},{en:`Three of the four statements are true and only one is false — the false one usually involves adding up several bars, where a mistake is easy to make.`,th:`สามในสี่ข้อความเป็นจริง มีเพียงข้อเดียวที่เป็นเท็จ ข้อที่เป็นเท็จมักเกี่ยวข้องกับการบวกแท่งกราฟหลายแท่งเข้าด้วยกัน ซึ่งเป็นจุดที่ผิดพลาดได้ง่าย`},{en:`Add up all four weeks for each club separately (Falcon: 20+35+25+40, Comet: 30+20+45+35) and compare the two totals carefully.`,th:`บวกยอดขายทั้งสี่สัปดาห์ของแต่ละชมรมแยกกัน (เหยี่ยว: 20+35+25+40, ดาวหาง: 30+20+45+35) แล้วเปรียบเทียบผลรวมทั้งสองอย่างละเอียด`}],visual:{kind:`barChart`,categories:[`Week 1`,`Week 2`,`Week 3`,`Week 4`],series:[{name:{en:`Falcon Club`,th:`ชมรมเหยี่ยว`},color:`coral`,values:[20,35,25,40]},{name:{en:`Comet Club`,th:`ชมรมดาวหาง`},color:`teal`,values:[30,20,45,35]}],yStep:10,yMax:50,alt:{en:`A grouped bar chart comparing Falcon Club and Comet Club book sales across four weeks, with Falcon Club's bars in coral and Comet Club's bars in teal.`,th:`กราฟแท่งเปรียบเทียบยอดขายหนังสือของชมรมเหยี่ยวและชมรมดาวหางตลอดสี่สัปดาห์ แท่งของชมรมเหยี่ยวเป็นสีส้มปะการัง และแท่งของชมรมดาวหางเป็นสีเขียวอมฟ้า`}},estimatedSeconds:140},{id:`A-18`,testId:`stw-mock-a`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Charts in Degrees`,th:`แผนภูมิวงกลมเป็นองศา`},difficulty:F(18),prompt:{en:`In a survey of Grade 6 students about their favourite school club, the results are shown in the pie chart in degrees. Starting from the top and going clockwise, the slices are Art, Music, Sports, and Drama. If 25 students chose Music, how many students chose Sports?`,th:`จากการสำรวจนักเรียนชั้นประถมศึกษาปีที่ 6 เกี่ยวกับชมรมโปรดของโรงเรียน ผลสำรวจแสดงในแผนภูมิวงกลมเป็นองศาดังภาพ เริ่มจากด้านบนวนตามเข็มนาฬิกา ส่วนต่างๆ คือ ศิลปะ ดนตรี กีฬา และการแสดง ถ้ามีนักเรียน 25 คนเลือกชมรมดนตรี จะมีนักเรียนกี่คนที่เลือกชมรมกีฬา`},options:[{id:`A`,label:{en:`20 students`,th:`20 คน`}},{id:`B`,label:{en:`100 students`,th:`100 คน`}},{id:`C`,label:{en:`120 students`,th:`120 คน`}},{id:`D`,label:{en:`30 students`,th:`30 คน`}}],correctOptionId:`D`,explanation:{en:`Music's slice is 100° and represents 25 students, so each degree represents 25 ÷ 100 = 0.25 students. Sport's slice is 120°, so the number of students who chose Sports = 120 × 0.25 = 30.`,th:`ส่วนของดนตรีมีขนาด 100° และแทนนักเรียน 25 คน ดังนั้นแต่ละองศาแทนนักเรียน 25 ÷ 100 = 0.25 คน ส่วนของกีฬามีขนาด 120° ดังนั้นจำนวนนักเรียนที่เลือกกีฬา = 120 × 0.25 = 30 คน`},distractorNotes:{A:{en:`This applies the correct method (degrees × 0.25) to the Art slice's 80° instead of the Sports slice's 120°, answering for the wrong category.`,th:`ข้อนี้ใช้วิธีคำนวณที่ถูกต้อง (องศา × 0.25) กับส่วนของศิลปะ 80° แทนที่จะเป็นส่วนของกีฬา 120° จึงตอบผิดหมวดหมู่`},B:{en:`This is Music's degree measure (100°), not the number of students who chose Sports — the wrong number from the chart has been carried over.`,th:`ข้อนี้คือขนาดองศาของส่วนดนตรี (100°) ไม่ใช่จำนวนนักเรียนที่เลือกกีฬา เป็นการนำตัวเลขผิดจากแผนภูมิมาใช้`},C:{en:`This takes the Sports slice's degree measure (120°) and reports it directly as the number of students, without converting degrees into a student count using the Music ratio.`,th:`ข้อนี้นำขนาดองศาของส่วนกีฬา (120°) มาตอบเป็นจำนวนนักเรียนโดยตรง โดยไม่ได้แปลงองศาเป็นจำนวนคนโดยใช้อัตราส่วนจากข้อมูลของดนตรีก่อน`}},hints:[{en:`Use the Music slice as your key: you know both its degrees AND its number of students.`,th:`ใช้ส่วนของดนตรีเป็นตัวช่วยหลัก เพราะรู้ทั้งขนาดองศาและจำนวนนักเรียนของส่วนนี้`},{en:`Find out how many students one degree of the pie chart represents, using Music's 100° = 25 students.`,th:`หาว่าหนึ่งองศาของแผนภูมิวงกลมแทนนักเรียนกี่คน โดยใช้ข้อมูลดนตรี 100° = นักเรียน 25 คน`},{en:`One degree = 25 ÷ 100 = 0.25 students. Multiply the Sports slice's degrees (120°) by 0.25 to find its number of students.`,th:`หนึ่งองศา = 25 ÷ 100 = 0.25 คน นำขนาดองศาของส่วนกีฬา (120°) คูณด้วย 0.25 เพื่อหาจำนวนนักเรียน`}],visual:{kind:`pieChart`,slices:[{label:`80°`,degrees:80,color:`coral`},{label:`100°`,degrees:100,color:`gold`},{label:`120°`,degrees:120,color:`teal`},{label:`60°`,degrees:60,color:`sage`}],alt:{en:`A pie chart divided into four slices labeled 80°, 100°, 120°, and 60°, arranged clockwise starting from the top.`,th:`แผนภูมิวงกลมแบ่งเป็นสี่ส่วน กำกับด้วย 80°, 100°, 120° และ 60° เรียงตามเข็มนาฬิกาเริ่มจากด้านบน`}},estimatedSeconds:150},{id:`A-19`,testId:`stw-mock-a`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Profit, Markup & Discount`,th:`กำไร การขึ้นราคา และส่วนลด`},difficulty:F(19),prompt:{en:`A shopkeeper bought a calculator for 480 baht. She marked up the price so that, if sold at the marked price, she would make a profit of 25%. During a sale, she actually sold it for 15% off the marked price. Find her actual profit or loss.`,th:`แม่ค้าซื้อเครื่องคิดเลขมาในราคา 480 บาท เธอตั้งราคาขายไว้สูงกว่าราคาทุน โดยหวังว่าถ้าขายได้ตามราคาที่ตั้งไว้จะได้กำไร 25% แต่ในช่วงลดราคา เธอขายเครื่องคิดเลขนั้นไปในราคาที่ลดลง 15% จากราคาที่ตั้งไว้ จงหากำไรหรือขาดทุนที่แท้จริงของเธอ`},options:[{id:`A`,label:{en:`Loss of 30 baht`,th:`ขาดทุน 30 บาท`}},{id:`B`,label:{en:`Profit of 30 baht`,th:`กำไร 30 บาท`}},{id:`C`,label:{en:`Profit of 48 baht`,th:`กำไร 48 บาท`}},{id:`D`,label:{en:`Profit of 90 baht`,th:`กำไร 90 บาท`}}],correctOptionId:`B`,explanation:{en:`Marked price = 480 × 1.25 = 600 baht. Actual selling price = 600 × (1 − 0.15) = 600 × 0.85 = 510 baht. Actual profit = 510 − 480 = 30 baht.`,th:`ราคาที่ตั้งไว้ = 480 × 1.25 = 600 บาท ราคาขายจริง = 600 × (1 − 0.15) = 600 × 0.85 = 510 บาท กำไรที่แท้จริง = 510 − 480 = 30 บาท`},distractorNotes:{A:{en:`This gets the correct number (30) but flips the sign, treating a profit as a loss — the shopkeeper still sold the item for more than she paid (510 > 480), so it is a profit, not a loss.`,th:`ข้อนี้ได้ตัวเลขถูกต้อง (30) แต่สลับเครื่องหมายผิด โดยเข้าใจว่าเป็นการขาดทุนทั้งที่จริงแล้วแม่ค้ายังคงขายได้ในราคาสูงกว่าที่ซื้อมา (510 มากกว่า 480) จึงเป็นกำไร ไม่ใช่ขาดทุน`},C:{en:`This treats the net change as simply 25% − 15% = 10% of the cost price (10% × 480 = 48), which is not valid since the 15% discount is taken off the MARKED price, not the cost price.`,th:`ข้อนี้เข้าใจว่าผลต่างสุทธิคือ 25% − 15% = 10% ของราคาทุนโดยตรง (10% × 480 = 48) ซึ่งไม่ถูกต้อง เพราะส่วนลด 15% คิดจาก ราคาที่ตั้งไว้ ไม่ใช่จากราคาทุน`},D:{en:`This is the discount AMOUNT taken off the marked price (600 − 510 = 90 baht), not the actual profit compared to the cost price — two different baseline comparisons have been mixed up.`,th:`ข้อนี้คือจำนวนเงิน ส่วนลด ที่ลดจากราคาที่ตั้งไว้ (600 − 510 = 90 บาท) ไม่ใช่กำไรที่แท้จริงเมื่อเทียบกับราคาทุน เกิดจากการสับสนระหว่างฐานการเปรียบเทียบสองแบบที่ต่างกัน`}},hints:[{en:`Work out the marked price first, before thinking about the sale discount at all.`,th:`หาราคาที่ตั้งไว้ก่อน ก่อนที่จะคิดเรื่องส่วนลดในช่วงลดราคาเลย`},{en:`The 25% profit applies to the cost price to find the marked price. The 15% discount then applies to the MARKED price (not the cost price) to find the actual selling price.`,th:`กำไร 25% คิดจากราคาทุนเพื่อหาราคาที่ตั้งไว้ จากนั้นส่วนลด 15% คิดจาก ราคาที่ตั้งไว้ (ไม่ใช่ราคาทุน) เพื่อหาราคาขายจริง`},{en:`Marked price = 480 × 1.25 = 600. Selling price = 600 × 0.85 = 510. Compare 510 to the original cost of 480 to find the actual profit.`,th:`ราคาที่ตั้งไว้ = 480 × 1.25 = 600 ราคาขายจริง = 600 × 0.85 = 510 นำ 510 ไปเทียบกับราคาทุนเดิม 480 เพื่อหากำไรที่แท้จริง`}],visual:null,estimatedSeconds:160},{id:`A-20`,testId:`stw-mock-a`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Percentage Relationships Between Three Amounts`,th:`ความสัมพันธ์ร้อยละระหว่างสามจำนวน`},difficulty:F(20),prompt:{en:`Anya, Bella, and Cara together saved 620 baht for a class trip. Bella saved 20% more money than Anya. Cara saved 25% less money than Bella. How much more money did Bella save than Cara?`,th:`อัญญา เบลล่า และคาร่า ร่วมกันเก็บเงินได้ 620 บาท สำหรับทริปของห้อง เบลล่าเก็บเงินได้มากกว่าอัญญา 20% ส่วนคาร่าเก็บเงินได้น้อยกว่าเบลล่า 25% เบลล่าเก็บเงินได้มากกว่าคาร่ากี่บาท`},options:[{id:`A`,label:{en:`40 baht`,th:`40 บาท`}},{id:`B`,label:{en:`48 baht`,th:`48 บาท`}},{id:`C`,label:{en:`60 baht`,th:`60 บาท`}},{id:`D`,label:{en:`90 baht`,th:`90 บาท`}}],correctOptionId:`C`,explanation:{en:`Let Anya's savings = a. Bella = 1.2a. Cara = 0.75 × Bella = 0.75 × 1.2a = 0.9a. Sum: a + 1.2a + 0.9a = 3.1a = 620, so a = 200. Bella = 1.2 × 200 = 240. Cara = 0.9 × 200 = 180. Bella − Cara = 240 − 180 = 60 baht.`,th:`ให้เงินของอัญญา = a เบลล่า = 1.2a คาร่า = 0.75 × เบลล่า = 0.75 × 1.2a = 0.9a ผลรวม: a + 1.2a + 0.9a = 3.1a = 620 จะได้ a = 200 เบลล่า = 1.2 × 200 = 240 คาร่า = 0.9 × 200 = 180 เบลล่า − คาร่า = 240 − 180 = 60 บาท`},distractorNotes:{A:{en:`This finds the difference between Bella and Anya (240 − 200 = 40) instead of the difference between Bella and Cara, which is what the question actually asks.`,th:`ข้อนี้หาผลต่างระหว่างเบลล่ากับอัญญา (240 − 200 = 40) แทนที่จะเป็นผลต่างระหว่างเบลล่ากับคาร่าตามที่โจทย์ถามจริงๆ`},B:{en:`This mistakenly reuses Anya's 20% figure to find Cara's amount (240 × 0.8 = 192) instead of correctly applying Cara's own 25% discount off Bella, leading to a difference of 240 − 192 = 48.`,th:`ข้อนี้นำตัวเลข 20% ของอัญญามาใช้ผิดพลาดเพื่อหาเงินของคาร่า (240 × 0.8 = 192) แทนที่จะใช้ส่วนลด 25% ของคาร่าเองที่คิดจากเบลล่าให้ถูกต้อง ทำให้ได้ผลต่าง 240 − 192 = 48`},D:{en:`This mistakenly applies Cara's 25% discount to Anya's amount instead of Bella's (200 × 0.75 = 150), giving a difference of 240 − 150 = 90 based on the wrong starting amount.`,th:`ข้อนี้นำส่วนลด 25% ของคาร่าไปคิดจากเงินของอัญญาผิดพลาด แทนที่จะคิดจากเงินของเบลล่า (200 × 0.75 = 150) ทำให้ได้ผลต่าง 240 − 150 = 90 จากฐานที่ผิด`}},hints:[{en:`Use Anya's amount as your starting variable, then express Bella's and Cara's amounts in terms of it.`,th:`ใช้เงินของอัญญาเป็นตัวแปรเริ่มต้น แล้วเขียนเงินของเบลล่าและคาร่าในรูปของตัวแปรนั้น`},{en:`Cara's 25% discount is taken off BELLA's amount, not Anya's — read the problem carefully to see whose amount each percentage compares to.`,th:`ส่วนลด 25% ของคาร่าคิดจากเงินของ เบลล่า ไม่ใช่ของอัญญา อ่านโจทย์ให้ละเอียดว่าแต่ละเปอร์เซ็นต์เทียบกับเงินของใคร`},{en:`Bella = 1.2 × Anya, Cara = 0.75 × Bella = 0.9 × Anya. Add all three in terms of Anya's amount (a + 1.2a + 0.9a = 3.1a = 620) to find each person's actual savings.`,th:`เบลล่า = 1.2 × อัญญา, คาร่า = 0.75 × เบลล่า = 0.9 × อัญญา นำทั้งสามคนมาบวกกันในรูปของเงินอัญญา (a + 1.2a + 0.9a = 3.1a = 620) เพื่อหาเงินจริงของแต่ละคน`}],visual:null,estimatedSeconds:170}]},{id:`stw-mock-b`,title:{en:`Mock Test B`,th:`ข้อสอบชุด B`},subtitle:{en:`Library & Arts Paper`,th:`ชุดห้องสมุดและศิลปะ`},recommendedMinutes:40,questions:[{id:`B-01`,testId:`stw-mock-b`,number:1,skill:`Number & Operations`,topic:{en:`Largest number from digits`,th:`จำนวนที่มากที่สุดจากตัวเลขที่กำหนด`},difficulty:F(1),prompt:{en:`The library club is numbering shelves using four different digits chosen from 0, 3, 5, 7, 8 (each digit used at most once). What is the largest possible 4-digit EVEN number they can form?`,th:`ชมรมห้องสมุดต้องการติดเลขชั้นหนังสือโดยเลือกเลขโดด 4 ตัวที่แตกต่างกันจาก 0, 3, 5, 7, 8 (ใช้แต่ละตัวได้ไม่เกิน 1 ครั้ง) จำนวนคู่ 4 หลักที่มากที่สุดที่เป็นไปได้คือเท่าใด`},options:[{id:`A`,label:{en:`8750`,th:`8750`}},{id:`B`,label:{en:`8570`,th:`8570`}},{id:`C`,label:{en:`8753`,th:`8753`}},{id:`D`,label:{en:`7850`,th:`7850`}}],correctOptionId:`A`,explanation:{en:`To make the number as large as possible, put the biggest digit (8) first. Since the number must be even, the last digit can only be 0 (the other even digit, 8, is already used). That leaves 7 and 5 for the remaining two places, placed in descending order: 8-7-5-0 = 8750.`,th:`เพื่อให้จำนวนมากที่สุด ให้นำเลขโดดที่มากที่สุดคือ 8 มาไว้หลักพัน เนื่องจากต้องเป็นจำนวนคู่ หลักหน่วยจึงต้องเป็น 0 เท่านั้น (เพราะ 8 ถูกใช้ไปแล้ว) เหลือ 7 และ 5 ให้เรียงจากมากไปน้อยในหลักที่เหลือ ได้ 8-7-5-0 = 8750`},distractorNotes:{B:{en:`Uses the correct four digits (8, 7, 5, 0) but places the hundreds and tens digits in the wrong order, giving a smaller number than the true maximum.`,th:`ใช้เลขโดดที่ถูกต้องคือ 8, 7, 5, 0 แต่เรียงหลักร้อยและหลักสิบสลับกัน ทำให้ได้จำนวนที่น้อยกว่าคำตอบที่ถูกต้อง`},C:{en:`Forgets the "even number" requirement and simply arranges the four largest digits (8, 7, 5, 3) in descending order, ending in an odd digit.`,th:`ลืมเงื่อนไข "จำนวนคู่" และเรียงเลขโดดที่มากที่สุดสี่ตัว (8, 7, 5, 3) จากมากไปน้อยเฉยๆ ทำให้ลงท้ายด้วยเลขคี่`},D:{en:`Does not place the largest available digit (8) in the leading position, starting with 7 instead.`,th:`ไม่นำเลขโดดที่มากที่สุด (8) มาไว้หลักหน้าสุด แต่เริ่มด้วย 7 แทน`}},hints:[{en:`Think about which digit should go in the front to make the number as big as possible.`,th:`ลองคิดว่าควรนำเลขโดดตัวใดไว้หลักหน้าสุดเพื่อให้จำนวนมากที่สุด`},{en:`The number must be even, so its last digit has to be one of the even digits available in the set.`,th:`จำนวนนี้ต้องเป็นจำนวนคู่ ดังนั้นหลักหน่วยต้องเป็นเลขโดดคู่ที่มีอยู่ในชุดตัวเลข`},{en:`Put 8 first. Since 8 is used, the only even digit left for the last place is 0. Arrange the two remaining digits (7 and 5) in descending order in between.`,th:`นำ 8 ไว้หลักแรก เมื่อใช้ 8 ไปแล้ว เลขคู่ที่เหลือสำหรับหลักหน่วยมีเพียง 0 จากนั้นเรียง 7 กับ 5 ที่เหลือจากมากไปน้อยในหลักตรงกลาง`}],visual:null,estimatedSeconds:45},{id:`B-02`,testId:`stw-mock-b`,number:2,skill:`Word Problems & Logic`,topic:{en:`Two-price purchase puzzle`,th:`โจทย์ซื้อของด้วยราคาสองแบบ`},difficulty:F(2),prompt:{en:`Preeda wants to buy the same number of sketchbooks for every member of her art class. If each sketchbook costs 8 baht, she will have 18 baht left after buying them all. If each sketchbook costs 11 baht, she will be short 12 baht. How many sketchbooks does she want to buy?`,th:`ปรีดาต้องการซื้อสมุดวาดภาพให้เพื่อนในชมรมศิลปะคนละเล่มเท่าๆ กัน ถ้าซื้อเล่มละ 8 บาท เธอจะเหลือเงิน 18 บาทหลังซื้อครบ แต่ถ้าซื้อเล่มละ 11 บาท เธอจะขาดเงินอีก 12 บาท ปรีดาต้องการซื้อสมุดวาดภาพกี่เล่ม`},options:[{id:`A`,label:{en:`6 sketchbooks`,th:`6 เล่ม`}},{id:`B`,label:{en:`4 sketchbooks`,th:`4 เล่ม`}},{id:`C`,label:{en:`10 sketchbooks`,th:`10 เล่ม`}},{id:`D`,label:{en:`30 sketchbooks`,th:`30 เล่ม`}}],correctOptionId:`C`,explanation:{en:`The gap between the two prices (11 − 8 = 3 baht) accounts exactly for the leftover money plus the shortfall (18 + 12 = 30 baht) across all the sketchbooks. So the number of sketchbooks is 30 ÷ 3 = 10.`,th:`ผลต่างของราคาทั้งสอง (11 − 8 = 3 บาท) จะครอบคลุมเงินที่เหลือรวมกับเงินที่ขาด (18 + 12 = 30 บาท) พอดีเมื่อคูณกับจำนวนสมุด ดังนั้นจำนวนสมุดคือ 30 ÷ 3 = 10 เล่ม`},distractorNotes:{A:{en:`Divides only the leftover money (18) by the price difference (3), ignoring the shortage amount entirely.`,th:`นำเฉพาะเงินที่เหลือ (18) มาหารด้วยผลต่างราคา (3) โดยไม่นำเงินที่ขาดมาคิดด้วย`},B:{en:`Divides only the shortage amount (12) by the price difference (3), ignoring the leftover money.`,th:`นำเฉพาะเงินที่ขาด (12) มาหารด้วยผลต่างราคา (3) โดยไม่นำเงินที่เหลือมาคิดด้วย`},D:{en:`Adds the leftover and shortage correctly (18 + 12 = 30) but forgets to divide by the price difference.`,th:`บวกเงินที่เหลือกับเงินที่ขาดถูกต้อง (18 + 12 = 30) แต่ลืมนำไปหารด้วยผลต่างของราคา`}},hints:[{en:`Try imagining she buys the same number of sketchbooks in both situations, and compare the total money needed each time.`,th:`ลองนึกภาพว่าเธอซื้อสมุดจำนวนเท่ากันทั้งสองครั้ง แล้วเปรียบเทียบเงินรวมที่ต้องใช้ในแต่ละครั้ง`},{en:`The difference in the two prices, multiplied by the number of sketchbooks, must equal the total swing in money (leftover plus shortage).`,th:`ผลต่างของราคาทั้งสองคูณกับจำนวนสมุด จะต้องเท่ากับผลรวมของเงินที่เหลือและเงินที่ขาด`},{en:`Add the leftover money and the shortage together (18 + 12 = 30), then divide by the price difference (11 − 8 = 3) to get the number of sketchbooks.`,th:`นำเงินที่เหลือบวกกับเงินที่ขาด (18 + 12 = 30) แล้วหารด้วยผลต่างราคา (11 − 8 = 3) จะได้จำนวนสมุด`}],visual:null,estimatedSeconds:65},{id:`B-03`,testId:`stw-mock-b`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering unlike fractions`,th:`การเรียงลำดับเศษส่วนต่างส่วน`},difficulty:F(3),prompt:{en:`The music room has six practice slots left, and six students each want the longest slot they can get, measured as a fraction of an hour: \\frac{3}{4}, \\frac{5}{6}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{8}, and \\frac{11}{12}. If the slots are given out from the largest fraction to the smallest, which fraction represents the 4th-largest slot?`,th:`ห้องดนตรีเหลือคิวฝึกซ้อม 6 คิว นักเรียน 6 คนต่างอยากได้คิวที่ยาวที่สุดเท่าที่จะได้ โดยความยาวคิวคิดเป็นเศษส่วนของชั่วโมง ได้แก่ \\frac{3}{4}, \\frac{5}{6}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{8} และ \\frac{11}{12} ถ้าจัดคิวจากเศษส่วนที่มากที่สุดไปน้อยที่สุด เศษส่วนใดคือคิวที่มากเป็นอันดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}},{id:`B`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`C`,label:{en:`\\frac{3}{4}`,th:`\\frac{3}{4}`}},{id:`D`,label:{en:`\\frac{7}{12}`,th:`\\frac{7}{12}`}}],correctOptionId:`B`,explanation:{en:`Convert all six fractions to seventy-seconds: \\frac{3}{4}=\\frac{54}{72}, \\frac{5}{6}=\\frac{60}{72}, \\frac{7}{12}=\\frac{42}{72}, \\frac{2}{3}=\\frac{48}{72}, \\frac{5}{8}=\\frac{45}{72}, \\frac{11}{12}=\\frac{66}{72}. From largest to smallest: \\frac{11}{12}, \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}. The 4th largest is \\frac{2}{3}.`,th:`แปลงเศษส่วนทั้งหกให้มีตัวส่วนเป็น 72: \\frac{3}{4}=\\frac{54}{72}, \\frac{5}{6}=\\frac{60}{72}, \\frac{7}{12}=\\frac{42}{72}, \\frac{2}{3}=\\frac{48}{72}, \\frac{5}{8}=\\frac{45}{72}, \\frac{11}{12}=\\frac{66}{72} เรียงจากมากไปน้อยได้ \\frac{11}{12}, \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12} อันดับที่ 4 คือ \\frac{2}{3}`},distractorNotes:{A:{en:`This fraction is actually the 5th largest, one rank too low — likely mixed up when comparing it against \\frac{2}{3} since their converted values (45/72 and 48/72) are close.`,th:`เศษส่วนนี้จริงๆ แล้วมากเป็นอันดับ 5 คลาดไปหนึ่งอันดับ อาจเปรียบเทียบกับ \\frac{2}{3} ผิดพลาดเนื่องจากค่าที่แปลงแล้วใกล้กันมาก (45/72 กับ 48/72)`},C:{en:`This fraction is the 3rd largest, one rank too high — a simple off-by-one slip when counting down the ordered list.`,th:`เศษส่วนนี้มากเป็นอันดับ 3 คลาดไปหนึ่งอันดับ อาจนับลำดับผิดขณะไล่เรียงรายการที่จัดลำดับแล้ว`},D:{en:`Counted from the smallest fraction instead of the largest — this is the 4th smallest (i.e. 3rd from the top when counting the other way), not the 4th largest.`,th:`นับจากเศษส่วนที่น้อยที่สุดแทนที่จะนับจากมากที่สุด ค่านี้คืออันดับที่ 4 จากน้อยไปมาก ไม่ใช่อันดับที่ 4 จากมากไปน้อย`}},hints:[{en:`You cannot compare these fractions directly because their denominators are different.`,th:`เปรียบเทียบเศษส่วนเหล่านี้โดยตรงไม่ได้ เพราะตัวส่วนไม่เท่ากัน`},{en:`Find a common denominator for all six fractions so you can compare their numerators directly.`,th:`หาตัวส่วนร่วมของเศษส่วนทั้งหกตัว เพื่อจะได้เปรียบเทียบตัวเศษกันโดยตรง`},{en:`Using 72 as the common denominator, convert every fraction, list the new numerators from largest to smallest, then count down to the 4th one.`,th:`ใช้ 72 เป็นตัวส่วนร่วม แปลงเศษส่วนทุกตัว แล้วเรียงตัวเศษที่ได้จากมากไปน้อย จากนั้นนับไปจนถึงอันดับที่ 4`}],visual:null,estimatedSeconds:70},{id:`B-04`,testId:`stw-mock-b`,number:4,skill:`Number & Operations`,topic:{en:`Mixed expressions with fractions`,th:`นิพจน์ผสมที่มีเศษส่วน`},difficulty:F(4),prompt:{en:`Let A = (\\frac{2}{3} + \\frac{1}{6}) × 3 - \\frac{1}{2} and B = (5 - 3\\frac{1}{2}) ÷ \\frac{1}{4}. What is 2 × (A ÷ B)?`,th:`กำหนดให้ A = (\\frac{2}{3} + \\frac{1}{6}) × 3 - \\frac{1}{2} และ B = (5 - 3\\frac{1}{2}) ÷ \\frac{1}{4} จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`\\frac{1}{3}`,th:`\\frac{1}{3}`}},{id:`B`,label:{en:`\\frac{1}{6}`,th:`\\frac{1}{6}`}},{id:`C`,label:{en:`\\frac{1}{2}`,th:`\\frac{1}{2}`}},{id:`D`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}}],correctOptionId:`D`,explanation:{en:`A = (\\frac{2}{3}+\\frac{1}{6})× 3 - \\frac{1}{2} = \\frac{5}{6}× 3 - \\frac{1}{2} = \\frac{5}{2}-\\frac{1}{2} = 2. B = (5-3\\frac{1}{2})÷\\frac{1}{4} = 1\\frac{1}{2}× 4 = 6. So 2×(A÷ B) = 2×\\frac{2}{6} = \\frac{2}{3}.`,th:`A = (\\frac{2}{3}+\\frac{1}{6})× 3 - \\frac{1}{2} = \\frac{5}{6}× 3 - \\frac{1}{2} = \\frac{5}{2}-\\frac{1}{2} = 2 และ B = (5-3\\frac{1}{2})÷\\frac{1}{4} = 1\\frac{1}{2}× 4 = 6 ดังนั้น 2×(A÷ B) = 2×\\frac{2}{6} = \\frac{2}{3}`},distractorNotes:{A:{en:`Correctly finds A ÷ B = \\frac{2}{6} = \\frac{1}{3} but forgets to multiply the final result by 2.`,th:`หาค่า A ÷ B = \\frac{2}{6} = \\frac{1}{3} ได้ถูกต้อง แต่ลืมคูณผลลัพธ์ด้วย 2 ในขั้นสุดท้าย`},B:{en:`Miscalculates A by adding \\frac{2}{3}+\\frac{1}{6} as if the denominators just combine directly, getting \\frac{1}{3} instead of \\frac{5}{6}, which makes A come out too small.`,th:`บวก \\frac{2}{3}+\\frac{1}{6} ผิดพลาด โดยคิดว่าตัวส่วนรวมกันตรงๆ ได้ \\frac{1}{3} แทนที่จะเป็น \\frac{5}{6} ทำให้ค่า A ที่ได้น้อยเกินไป`},C:{en:`Miscalculates B by treating "5 − 3\\frac{1}{2}" as simply 5 − 3 = 2 (ignoring the extra half), giving B = 8 instead of 6.`,th:`คำนวณ B ผิดพลาด โดยคิดว่า "5 − 3\\frac{1}{2}" เท่ากับ 5 − 3 = 2 เฉยๆ (ลืมครึ่งที่เหลือ) ทำให้ได้ B = 8 แทนที่จะเป็น 6`}},hints:[{en:`Work out the value of A first, then B, before combining them.`,th:`หาค่าของ A ก่อน จากนั้นหาค่าของ B แล้วจึงนำมารวมกัน`},{en:`Follow the order of operations carefully inside each bracket — do the addition/subtraction inside the parentheses first.`,th:`ทำตามลำดับการดำเนินการอย่างระมัดระวังในแต่ละวงเล็บ โดยบวกลบภายในวงเล็บก่อน`},{en:`A = 2 and B = 6. Divide A by B first to get a fraction, then multiply that fraction by 2.`,th:`A มีค่าเท่ากับ 2 และ B มีค่าเท่ากับ 6 ให้นำ A หารด้วย B ก่อนเพื่อให้ได้เศษส่วน แล้วจึงนำเศษส่วนนั้นไปคูณด้วย 2`}],visual:null,estimatedSeconds:70},{id:`B-05`,testId:`stw-mock-b`,number:5,skill:`Number & Operations`,topic:{en:`LCM and GCF from a division clue`,th:`ค.ร.น. และ ห.ร.ม. จากเงื่อนไขการหาร`},difficulty:F(5),prompt:{en:`Two numbers have a sum of 51. When the larger number is divided by the smaller number, the quotient is 3 and the remainder is 3. Find the LCM of the two numbers.`,th:`จำนวนสองจำนวนมีผลบวกเท่ากับ 51 เมื่อนำจำนวนที่มากกว่าไปหารด้วยจำนวนที่น้อยกว่า จะได้ผลหาร 3 เศษ 3 จงหา ค.ร.น. ของจำนวนทั้งสอง`},options:[{id:`A`,label:{en:`156`,th:`156`}},{id:`B`,label:{en:`3`,th:`3`}},{id:`C`,label:{en:`468`,th:`468`}},{id:`D`,label:{en:`39`,th:`39`}}],correctOptionId:`A`,explanation:{en:`Let the smaller number be x. The larger number is 3x + 3. Since x + (3x+3) = 51, 4x = 48, so x = 12 and the larger number is 39. The GCF of 12 and 39 is 3, so the LCM = (12 × 39) ÷ 3 = 156.`,th:`ให้จำนวนที่น้อยกว่าคือ x จำนวนที่มากกว่าคือ 3x + 3 เนื่องจาก x + (3x+3) = 51 จะได้ 4x = 48 ดังนั้น x = 12 และจำนวนที่มากกว่าคือ 39 ห.ร.ม. ของ 12 และ 39 คือ 3 ดังนั้น ค.ร.น. = (12 × 39) ÷ 3 = 156`},distractorNotes:{B:{en:`Gives the GCF (greatest common factor) of the two numbers instead of the LCM that was asked for.`,th:`ตอบเป็น ห.ร.ม. (ตัวหารร่วมมาก) ของจำนวนทั้งสอง แทนที่จะเป็น ค.ร.น. ตามที่โจทย์ถาม`},C:{en:`Multiplies the two numbers together (12 × 39 = 468) but forgets to divide by their GCF to get the true LCM.`,th:`นำจำนวนทั้งสองมาคูณกันตรงๆ (12 × 39 = 468) แต่ลืมนำไปหารด้วย ห.ร.ม. เพื่อให้ได้ ค.ร.น. ที่ถูกต้อง`},D:{en:`Simply reports the larger of the two numbers (39), misreading what the question is asking for.`,th:`ตอบเพียงจำนวนที่มากกว่าของทั้งสอง (39) ซึ่งเป็นการอ่านโจทย์ผิดพลาดว่าต้องการอะไร`}},hints:[{en:`Turn "divided by the smaller gives quotient 3, remainder 3" into an equation for the larger number.`,th:`เปลี่ยนประโยค "หารด้วยจำนวนที่น้อยกว่าได้ผลหาร 3 เศษ 3" ให้เป็นสมการของจำนวนที่มากกว่า`},{en:`If the smaller number is x, the larger number is 3x + 3. Use the sum 51 to solve for x.`,th:`ถ้าจำนวนที่น้อยกว่าคือ x จำนวนที่มากกว่าจะเป็น 3x + 3 ใช้ผลบวก 51 ในการหาค่า x`},{en:`Once you find both numbers (12 and 39), find their GCF, then use LCM × GCF = product of the two numbers to find the LCM.`
