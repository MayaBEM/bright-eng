`,th:`เมื่อรู้ว่า 1 ส่วน = 45 บาท ให้หาผลรวมจากทั้ง 12 ส่วน (5 + 4 + 3) แล้วหารด้วย 15 เพื่อหาจำนวนแซนด์วิช`}],visual:null,estimatedSeconds:95},{id:`F-09`,testId:`stw-mock-f`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel lines & triangles`,th:`เส้นขนานกับสามเหลี่ยม`},difficulty:F(9),prompt:{en:`In the diagram, line l₁ is parallel to line l₂. Points Q and R lie on l₁, and point P lies on l₂, forming triangle PQR. The angle between PQ and l₂ measures 42°, and the angle QPR at the top of the triangle measures 78°. Find the size of angle x = ∠PRQ.`,th:`จากรูป เส้น l₁ ขนานกับเส้น l₂ จุด Q และ R อยู่บนเส้น l₁ ส่วนจุด P อยู่บนเส้น l₂ ทำให้เกิดรูปสามเหลี่ยม PQR มุมระหว่าง PQ กับเส้น l₂ มีขนาด 42° และมุม QPR ที่ยอดสามเหลี่ยมมีขนาด 78° จงหาขนาดของมุม x = ∠PRQ`},options:[{id:`A`,label:{en:`50°`,th:`50°`}},{id:`B`,label:{en:`60°`,th:`60°`}},{id:`C`,label:{en:`70°`,th:`70°`}},{id:`D`,label:{en:`78°`,th:`78°`}}],correctOptionId:`B`,explanation:{en:`Since l₁ ∥ l₂ and PQ is a transversal, alternate interior angles give ∠PQR = 42° (equal to the angle PQ makes with l₂). The triangle's angles must sum to 180°, so ∠PRQ = 180° − 42° − 78° = 60°.`,th:`เนื่องจาก l₁ ขนานกับ l₂ และ PQ เป็นเส้นตัด มุมแย้งจึงทำให้ ∠PQR = 42° (เท่ากับมุมที่ PQ ทำกับ l₂) และผลรวมมุมในสามเหลี่ยมเท่ากับ 180° ดังนั้น ∠PRQ = 180° − 42° − 78° = 60°`},distractorNotes:{A:{en:`This comes from a bracket slip when subtracting from 180° — adding the two given angles incorrectly before subtracting.`,th:`ค่านี้เกิดจากการลบออกจาก 180° ผิดพลาด โดยบวกมุมที่กำหนดให้สองมุมผิดก่อนนำไปลบ`},C:{en:`This mixes up which two angles to subtract from 180°, effectively using the wrong value for the apex angle.`,th:`ค่านี้สับสนว่าควรนำมุมใดสองมุมไปลบออกจาก 180° ทำให้ใช้ค่ามุมยอดผิดไป`},D:{en:`This simply repeats the given apex angle (78°) instead of solving for the third, unknown angle of the triangle.`,th:`ค่านี้เพียงแค่ตอบมุมยอดที่โจทย์กำหนดให้ (78°) ซ้ำ แทนที่จะหามุมที่สามซึ่งเป็นมุมที่ไม่ทราบค่า`}},hints:[{en:`The tick marks on the two horizontal lines show they are parallel — that fact lets you transfer one of the given angles to a vertex of the triangle.`,th:`เครื่องหมายขีดบนเส้นแนวนอนทั้งสองบอกว่าเส้นทั้งสองขนานกัน ข้อเท็จจริงนี้ช่วยให้ย้ายมุมที่กำหนดให้ไปยังมุมหนึ่งของสามเหลี่ยมได้`},{en:`Alternate interior angles formed by a transversal crossing two parallel lines are equal — use this to find angle PQR.`,th:`มุมแย้งที่เกิดจากเส้นตัดที่ผ่านเส้นขนานสองเส้นจะมีขนาดเท่ากัน ใช้หลักการนี้เพื่อหามุม PQR`},{en:`Once you know angle PQR = 42° and angle QPR = 78°, use the fact that the three angles of a triangle add up to 180° to find angle x.`,th:`เมื่อทราบว่ามุม PQR = 42° และมุม QPR = 78° แล้ว ใช้หลักที่ว่ามุมทั้งสามในสามเหลี่ยมรวมกันได้ 180° เพื่อหามุม x`}],visual:{kind:`geometryFigure`,width:260,height:190,segments:[{x1:0,y1:40,x2:260,y2:40,ticks:2},{x1:0,y1:190,x2:260,y2:190,ticks:2},{x1:170,y1:190,x2:3,y2:40},{x1:170,y1:190,x2:257,y2:40}],points:[{x:3,y:40,label:`Q`,labelOffset:[-14,-6]},{x:257,y:40,label:`R`,labelOffset:[8,-6]},{x:170,y:190,label:`P`,labelOffset:[-4,20]}],angleMarks:[{x:170,y:190,fromDeg:138,toDeg:180,radius:20,label:`42°`,color:`var(--navy)`},{x:170,y:190,fromDeg:60,toDeg:138,radius:20,label:`78°`,color:`var(--navy)`},{x:257,y:40,fromDeg:180,toDeg:240,radius:22,label:`x`}],alt:{en:`Two parallel horizontal lines l1 (top) and l2 (bottom) with tick marks. Points Q and R lie on the top line, point P lies on the bottom line, and segments PQ and PR form a triangle. A 42-degree angle is marked at P between PQ and the bottom line, a 78-degree angle is marked at P between PQ and PR, and an unknown angle x is marked at R.`,th:`เส้นแนวนอนขนานกันสองเส้น l1 (บน) และ l2 (ล่าง) มีเครื่องหมายขีดกำกับ จุด Q และ R อยู่บนเส้นบน จุด P อยู่บนเส้นล่าง ส่วนเส้น PQ และ PR ประกอบกันเป็นรูปสามเหลี่ยม มีมุม 42 องศาที่จุด P ระหว่าง PQ กับเส้นล่าง มุม 78 องศาที่จุด P ระหว่าง PQ กับ PR และมุม x ที่ยังไม่ทราบค่าที่จุด R`}},estimatedSeconds:100},{id:`F-10`,testId:`stw-mock-f`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Equal-volume cylinders`,th:`ทรงกระบอกปริมาตรเท่ากัน`},difficulty:F(10),prompt:{en:`Two cylindrical water tanks hold exactly the same volume of water for the exam-day hydration station. Tank A has a base radius of 6 cm and a height of 20 cm. Tank B has a base radius of 4 cm. What is the height of Tank B?`,th:`ถังน้ำทรงกระบอกสองถังบรรจุน้ำปริมาตรเท่ากันพอดีสำหรับจุดบริการน้ำดื่มในวันสอบ ถัง A มีรัศมีฐาน 6 ซม. และสูง 20 ซม. ส่วนถัง B มีรัศมีฐาน 4 ซม. ถัง B สูงเท่าใด`},options:[{id:`A`,label:{en:`30 cm`,th:`30 ซม.`}},{id:`B`,label:{en:`13 cm`,th:`13 ซม.`}},{id:`C`,label:{en:`45 cm`,th:`45 ซม.`}},{id:`D`,label:{en:`90 cm`,th:`90 ซม.`}}],correctOptionId:`C`,explanation:{en:`Cylinder volume is π × r² × h. For equal volumes: r_A² × h_A = r_B² × h_B, so 6² × 20 = 4² × h_B, giving 720 = 16 × h_B, so h_B = 45 cm.`,th:`ปริมาตรทรงกระบอกคือ π × r² × h เมื่อปริมาตรเท่ากัน จะได้ r_A² × h_A = r_B² × h_B ดังนั้น 6² × 20 = 4² × h_B ได้ 720 = 16 × h_B ดังนั้น h_B = 45 ซม.`},distractorNotes:{A:{en:`This scales the height by the plain ratio of the radii (6 : 4) instead of the ratio of the radii squared, since volume depends on radius squared, not radius alone.`,th:`วิธีนี้ปรับความสูงตามอัตราส่วนรัศมีธรรมดา (6 : 4) แทนที่จะเป็นอัตราส่วนรัศมียกกำลังสอง เนื่องจากปริมาตรขึ้นกับรัศมียกกำลังสอง ไม่ใช่รัศมีเฉยๆ`},B:{en:`This inverts the ratio, scaling the height down using (radius of B ÷ radius of A) instead of up — but Tank B has the smaller radius, so it needs a taller height to match the volume.`,th:`วิธีนี้กลับอัตราส่วนผิดด้าน โดยปรับความสูงลงด้วย (รัศมี B ÷ รัศมี A) แทนที่จะปรับขึ้น ทั้งที่ถัง B มีรัศมีเล็กกว่า จึงต้องสูงกว่าเพื่อให้ปริมาตรเท่ากัน`},D:{en:`This applies the squared ratio twice by mistake, effectively doubling the correctly scaled height.`,th:`วิธีนี้ใช้อัตราส่วนยกกำลังสองซ้ำสองครั้งโดยไม่ตั้งใจ ทำให้ความสูงที่ปรับแล้วเพิ่มขึ้นเป็นสองเท่าโดยไม่ถูกต้อง`}},hints:[{en:`The volume formula for a cylinder involves the radius squared, not just the radius.`,th:`สูตรปริมาตรทรงกระบอกเกี่ยวข้องกับรัศมียกกำลังสอง ไม่ใช่รัศมีเฉยๆ`},{en:`Since both tanks have the same volume, r_A² × h_A must equal r_B² × h_B.`,th:`เนื่องจากถังทั้งสองมีปริมาตรเท่ากัน ดังนั้น r_A² × h_A ต้องเท่ากับ r_B² × h_B`},{en:`Substitute the known values: 6² × 20 = 4² × h_B. Solve 720 = 16 × h_B for h_B.`,th:`แทนค่าที่ทราบ: 6² × 20 = 4² × h_B แก้สมการ 720 = 16 × h_B เพื่อหา h_B`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:12,height:20,label:`Tank A`},{baseSide:8,height:45,heightLabel:`h`,label:`Tank B`}],alt:{en:`Two cylinders side by side: Tank A is wider and shorter, labeled with height 20; Tank B is narrower and taller, with its height labeled h (unknown).`,th:`ทรงกระบอกสองอันวางเรียงกัน: ถัง A กว้างกว่าและเตี้ยกว่า กำกับความสูง 20 ส่วนถัง B แคบกว่าและสูงกว่า กำกับความสูงด้วย h (ยังไม่ทราบค่า)`}},estimatedSeconds:95},{id:`F-11`,testId:`stw-mock-f`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite area (cut corner)`,th:`พื้นที่รูปประกอบ (ตัดมุม)`},difficulty:F(11),prompt:{en:`A rectangular banner for the exam-day assembly measures 26 cm by 18 cm. Its top-right corner is cut off in a straight line to make room for a hanging hook, forming a right triangle with legs 10 cm and 6 cm (shown shaded in the figure). What is the area of the remaining shaded banner?`,th:`ป้ายผ้ารูปสี่เหลี่ยมผืนผ้าสำหรับพิธีเข้าแถววันสอบมีขนาดกว้าง 26 ซม. ยาว 18 ซม. มุมขวาบนถูกตัดออกเป็นเส้นตรงเพื่อเว้นที่แขวนตะขอ ทำให้เกิดรูปสามเหลี่ยมมุมฉากขา 10 ซม. และ 6 ซม. (ดังรูปแรเงา) พื้นที่ของป้ายผ้าส่วนที่เหลือ (แรเงา) เท่ากับเท่าใด`},options:[{id:`A`,label:{en:`408 cm²`,th:`408 ตร.ซม.`}},{id:`B`,label:{en:`420 cm²`,th:`420 ตร.ซม.`}},{id:`C`,label:{en:`468 cm²`,th:`468 ตร.ซม.`}},{id:`D`,label:{en:`438 cm²`,th:`438 ตร.ซม.`}}],correctOptionId:`D`,explanation:{en:`The full rectangle has area 26 × 18 = 468 cm². The cut-off triangle has area \\frac{1}{2} × 10 × 6 = 30 cm². The shaded area is 468 − 30 = 438 cm².`,th:`สี่เหลี่ยมผืนผ้าทั้งหมดมีพื้นที่ 26 × 18 = 468 ตร.ซม. สามเหลี่ยมที่ถูกตัดออกมีพื้นที่ \\frac{1}{2} × 10 × 6 = 30 ตร.ซม. พื้นที่ส่วนแรเงาคือ 468 − 30 = 438 ตร.ซม.`},distractorNotes:{A:{en:`This subtracts the full product of the two legs (10 × 6 = 60) instead of half that product, forgetting the triangle area formula includes ÷ 2.`,th:`วิธีนี้ลบด้วยผลคูณเต็มของสองขา (10 × 6 = 60) แทนที่จะเป็นครึ่งหนึ่งของผลคูณนั้น เนื่องจากลืมว่าสูตรพื้นที่สามเหลี่ยมต้องหารด้วย 2`},B:{en:`This misreads one leg of the triangle as 8 cm instead of 10 cm, subtracting only 48 cm² instead of the correct 30 cm².`,th:`วิธีนี้อ่านขาสามเหลี่ยมด้านหนึ่งผิดเป็น 8 ซม. แทนที่จะเป็น 10 ซม. ทำให้ลบออกเพียง 48 ตร.ซม. แทนที่จะเป็น 30 ตร.ซม. ที่ถูกต้อง`},C:{en:`This gives the area of the full, uncut rectangle, forgetting to subtract the cut-off triangle at all.`,th:`วิธีนี้ตอบพื้นที่สี่เหลี่ยมผืนผ้าเต็มรูปโดยไม่ได้ตัดมุมออก ลืมลบพื้นที่สามเหลี่ยมที่ถูกตัดไปเลย`}},hints:[{en:`The shaded shape is a rectangle with one corner missing — think about what area was removed.`,th:`รูปแรเงาคือสี่เหลี่ยมผืนผ้าที่หายไปหนึ่งมุม ลองคิดดูว่าพื้นที่ส่วนที่หายไปมีเท่าใด`},{en:`Find the area of the full rectangle first, then find the area of the triangular corner that was cut off.`,th:`หาพื้นที่สี่เหลี่ยมผืนผ้าเต็มรูปก่อน แล้วจึงหาพื้นที่สามเหลี่ยมมุมที่ถูกตัดออก`},{en:`Rectangle area = 26 × 18 = 468 cm². Triangle area = ½ × 10 × 6 = 30 cm². Subtract the triangle from the rectangle.`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 26 × 18 = 468 ตร.ซม. พื้นที่สามเหลี่ยม = ½ × 10 × 6 = 30 ตร.ซม. นำพื้นที่สามเหลี่ยมไปลบออกจากพื้นที่สี่เหลี่ยมผืนผ้า`}],visual:{kind:`geometryFigure`,width:200,height:140,showGrid:!0,gridStep:20,segments:[{x1:130,y1:0,x2:200,y2:0,style:`dashed`},{x1:200,y1:0,x2:200,y2:45,style:`dashed`}],polygons:[{points:[[0,0],[130,0],[200,45],[200,140],[0,140]],fill:`shaded`}],labels:[{x:65,y:-12,text:`26 cm`,bold:!0},{x:-16,y:70,text:`18 cm`,bold:!0},{x:165,y:-12,text:`10 cm`},{x:214,y:24,text:`6 cm`}],alt:{en:`A rectangle 26 cm by 18 cm with its top-right corner cut off by a right triangle with legs 10 cm and 6 cm, leaving a shaded pentagon.`,th:`สี่เหลี่ยมผืนผ้ากว้าง 26 ซม. ยาว 18 ซม. ถูกตัดมุมขวาบนออกเป็นรูปสามเหลี่ยมมุมฉากขา 10 ซม. และ 6 ซม. เหลือเป็นรูปห้าเหลี่ยมแรเงา`}},estimatedSeconds:110},{id:`F-12`,testId:`stw-mock-f`,number:12,skill:`Geometry & Angles`,topic:{en:`Zig-zag parallel lines`,th:`เส้นขนานหักมุม`},difficulty:F(12),prompt:{en:`In the diagram, ℓ₁ is parallel to ℓ₂. A transversal runs from ℓ₁ to ℓ₂ but bends at point E between them. The angle at M (where the transversal meets ℓ₁) is (2x + 10)°, the angle at N (where it meets ℓ₂) is (3x − 5)°, and the total bend angle at E, ∠MEN, is 125°. Find the angle marked (2x + 10)° at M.`,th:`จากรูป ℓ₁ ขนานกับ ℓ₂ เส้นตัดเส้นหนึ่งลากจาก ℓ₁ ไปยัง ℓ₂ แต่หักมุมที่จุด E ระหว่างเส้นทั้งสอง มุมที่จุด M (ซึ่งเส้นตัดพบกับ ℓ₁) มีขนาด (2x + 10)° มุมที่จุด N (ซึ่งเส้นตัดพบกับ ℓ₂) มีขนาด (3x − 5)° และมุมหักทั้งหมดที่จุด E คือ ∠MEN มีขนาด 125° จงหาขนาดมุม (2x + 10)° ที่จุด M`},options:[{id:`A`,label:{en:`58°`,th:`58°`}},{id:`B`,label:{en:`67°`,th:`67°`}},{id:`C`,label:{en:`60°`,th:`60°`}},{id:`D`,label:{en:`62°`,th:`62°`}}],correctOptionId:`A`,explanation:{en:`When a dashed line parallel to ℓ₁ and ℓ₂ is drawn through the bend point E, the two given angles split the bend angle exactly (alternate angles): (2x + 10) + (3x − 5) = 125. This gives 5x + 5 = 125, so x = 24. The angle at M is 2(24) + 10 = 58°.`,th:`เมื่อลากเส้นประขนานกับ ℓ₁ และ ℓ₂ ผ่านจุดหักมุม E มุมที่กำหนดให้ทั้งสองจะรวมกันเป็นมุมหักพอดี (จากหลักมุมแย้ง): (2x + 10) + (3x − 5) = 125 จะได้ 5x + 5 = 125 ดังนั้น x = 24 มุมที่จุด M คือ 2(24) + 10 = 58°`},distractorNotes:{B:{en:`This correctly solves for x but then reports the angle at N, (3x − 5)° = 67°, instead of the angle at M that was actually asked for.`,th:`วิธีนี้แก้หาค่า x ได้ถูกต้อง แต่ตอบมุมที่จุด N ซึ่งคือ (3x − 5)° = 67° แทนที่จะเป็นมุมที่จุด M ตามที่โจทย์ถาม`},C:{en:`This makes an algebra slip solving 5x + 5 = 125, forgetting to subtract the 5 (treating it as 5x = 125, so x = 25), giving 2(25) + 10 = 60°.`,th:`วิธีนี้แก้สมการ 5x + 5 = 125 ผิดพลาด โดยลืมลบ 5 ออก (คิดว่า 5x = 125 ดังนั้น x = 25) ทำให้ได้ 2(25) + 10 = 60°`},D:{en:`This makes a sign slip, solving 5x − 5 = 125 instead of 5x + 5 = 125, giving x = 26 and 2(26) + 10 = 62°.`,th:`วิธีนี้ตั้งสมการผิดเครื่องหมาย โดยแก้ 5x − 5 = 125 แทนที่จะเป็น 5x + 5 = 125 ทำให้ได้ x = 26 และ 2(26) + 10 = 62°`}},hints:[{en:`When a transversal bends between two parallel lines, the bend angle relates to the two angles at the parallel lines.`,th:`เมื่อเส้นตัดหักมุมระหว่างเส้นขนานสองเส้น มุมหักจะสัมพันธ์กับมุมทั้งสองที่เส้นขนาน`},{en:`Drawing a dashed line through the bend point, parallel to both ℓ₁ and ℓ₂, splits the bend angle into two parts that equal the two given angles.`,th:`การลากเส้นประผ่านจุดหักมุม ขนานกับทั้ง ℓ₁ และ ℓ₂ จะแบ่งมุมหักออกเป็นสองส่วนที่มีขนาดเท่ากับมุมทั้งสองที่กำหนดให้`},{en:`Set up (2x + 10) + (3x − 5) = 125, solve for x, then substitute back into 2x + 10 to answer the actual question asked.`,th:`ตั้งสมการ (2x + 10) + (3x − 5) = 125 แก้หาค่า x แล้วแทนกลับในนิพจน์ 2x + 10 เพื่อตอบคำถามที่โจทย์ถามจริง`}],visual:{kind:`geometryFigure`,width:260,height:190,segments:[{x1:0,y1:30,x2:260,y2:30,ticks:1},{x1:0,y1:180,x2:260,y2:180,ticks:1},{x1:40,y1:105,x2:260,y2:105,style:`dashed`,ticks:1},{x1:60,y1:30,x2:107,y2:105},{x1:107,y1:105,x2:75,y2:180}],points:[{x:60,y:30,label:`M`,labelOffset:[-16,12]},{x:107,y:105,label:`E`,labelOffset:[10,-4]},{x:75,y:180,label:`N`,labelOffset:[-18,14]}],angleMarks:[{x:60,y:30,fromDeg:302,toDeg:360,radius:20,label:`(2x+10)°`,color:`var(--navy)`},{x:75,y:180,fromDeg:0,toDeg:67,radius:20,label:`(3x-5)°`,color:`var(--navy)`},{x:107,y:105,fromDeg:122,toDeg:247,radius:24,label:`125°`}],alt:{en:`Two parallel horizontal lines with a bent transversal: from point M on the top line down to bend point E, then to point N on the bottom line, plus a dashed helper line through E parallel to both. Angle (2x+10) is marked at M, (3x-5) at N, and 125 degrees at the bend E.`,th:`เส้นแนวนอนขนานกันสองเส้น มีเส้นตัดหักมุมจากจุด M บนเส้นบน ลงไปยังจุดหักมุม E แล้วไปยังจุด N บนเส้นล่าง พร้อมเส้นประช่วยผ่านจุด E ขนานกับเส้นทั้งสอง มีมุม (2x+10) กำกับที่จุด M มุม (3x-5) ที่จุด N และมุม 125 องศาที่จุดหักมุม E`}},estimatedSeconds:130},{id:`F-13`,testId:`stw-mock-f`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Ring area between circles`,th:`พื้นที่วงแหวน`},difficulty:F(13),prompt:{en:`Two concentric circles form a target used for a stress-relief game on exam-review day. The area of the shaded ring between the two circles is 8 times the area of the inner circle. What is the ratio of the outer radius R to the inner radius r?`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกันประกอบเป็นเป้าเล่นเกมคลายเครียดในวันทบทวนก่อนสอบ พื้นที่วงแหวนแรเงาระหว่างวงกลมทั้งสองเป็น 8 เท่าของพื้นที่วงกลมวงใน อัตราส่วนของรัศมีวงนอก R ต่อรัศมีวงใน r เท่ากับเท่าใด`},options:[{id:`A`,label:{en:`8 : 1`,th:`8 : 1`}},{id:`B`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`C`,label:{en:`4 : 1`,th:`4 : 1`}},{id:`D`,label:{en:`9 : 1`,th:`9 : 1`}}],correctOptionId:`B`,explanation:{en:`The ring area is π(R² − r²), which equals 8 × πr². So R² − r² = 8r², giving R² = 9r². Taking the square root, R : r = 3 : 1.`,th:`พื้นที่วงแหวนคือ π(R² − r²) ซึ่งเท่ากับ 8 × πr² ดังนั้น R² − r² = 8r² จะได้ R² = 9r² เมื่อถอดรากที่สอง จะได้ R : r = 3 : 1`},distractorNotes:{A:{en:`This uses the given multiple (8) directly as the radius ratio, without realizing that area scales with the square of the radius.`,th:`วิธีนี้ใช้ตัวเลข 8 ที่โจทย์กำหนดเป็นอัตราส่วนรัศมีโดยตรง โดยไม่ได้คำนึงว่าพื้นที่แปรผันตามรัศมียกกำลังสอง`},C:{en:`This finds that the ratio of areas (outer to inner) is 9 : 1, then mistakenly halves 9 to estimate the radius ratio instead of taking a square root.`,th:`วิธีนี้หาได้ว่าอัตราส่วนพื้นที่ (วงนอกต่อวงใน) คือ 9 : 1 แต่กลับนำ 9 มาหารครึ่งเพื่อประมาณอัตราส่วนรัศมี แทนที่จะถอดรากที่สอง`},D:{en:`This correctly finds that the ratio of the two full circle areas is 9 : 1, but forgets to take the square root to convert an area ratio into a radius ratio.`,th:`วิธีนี้หาอัตราส่วนพื้นที่วงกลมทั้งสองได้ถูกต้องเป็น 9 : 1 แต่ลืมถอดรากที่สองเพื่อแปลงอัตราส่วนพื้นที่ให้เป็นอัตราส่วนรัศมี`}},hints:[{en:`The ring is the outer circle with the inner circle removed — write its area in terms of R and r.`,th:`วงแหวนคือวงกลมวงนอกที่เอาวงในออก ลองเขียนพื้นที่ในรูปของ R และ r`},{en:`Ring area = π(R² − r²). Set this equal to 8 times the inner circle's area, π r².`,th:`พื้นที่วงแหวน = π(R² − r²) ให้เท่ากับ 8 เท่าของพื้นที่วงกลมวงใน คือ π r²`},{en:`Solve R² − r² = 8r² to get R² = 9r², then take the square root of both sides to find R : r.`,th:`แก้สมการ R² − r² = 8r² จะได้ R² = 9r² จากนั้นถอดรากที่สองทั้งสองข้างเพื่อหา R : r`}],visual:{kind:`concentricCircles`,outerRadius:3,innerRadius:1,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles with the outer radius labeled R and the inner radius labeled r, with the ring between them shaded.`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกัน รัศมีวงนอกกำกับด้วย R และรัศมีวงในกำกับด้วย r โดยพื้นที่วงแหวนระหว่างวงกลมถูกแรเงา`}},estimatedSeconds:115},{id:`F-14`,testId:`stw-mock-f`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Lens-shaped shaded area`,th:`พื้นที่รูปใบไม้`},difficulty:F(14),prompt:{en:`A square exam-hall floor tile has side length 14 cm. Two quarter-circle arcs, each with radius equal to the side of the square, are drawn from opposite corners, creating a shaded leaf shape in the middle (shown in the figure). Using π = \\frac{22}{7}, find the area of the shaded leaf.`,th:`กระเบื้องพื้นห้องสอบรูปสี่เหลี่ยมจัตุรัสมีความยาวด้าน 14 ซม. มีการลากส่วนโค้งหนึ่งในสี่วงกลมสองเส้น รัศมีเท่ากับความยาวด้านของสี่เหลี่ยมจัตุรัส จากมุมตรงข้ามกัน ทำให้เกิดรูปใบไม้แรเงาตรงกลาง (ดังรูป) กำหนดให้ π = \\frac{22}{7} จงหาพื้นที่ของรูปใบไม้ที่แรเงา`},options:[{id:`A`,label:{en:`196 cm²`,th:`196 ตร.ซม.`}},{id:`B`,label:{en:`154 cm²`,th:`154 ตร.ซม.`}},{id:`C`,label:{en:`112 cm²`,th:`112 ตร.ซม.`}},{id:`D`,label:{en:`308 cm²`,th:`308 ตร.ซม.`}}],correctOptionId:`C`,explanation:{en:`Each quarter circle has area \\frac{1}{4} × \\frac{22}{7} × 14² = 154 cm². The leaf shape is formed by the two quarter circles overlapping inside the square, so its area equals (2 × 154) − (the square's area) = 308 − 196 = 112 cm².`,th:`วงกลมหนึ่งในสี่แต่ละส่วนมีพื้นที่ \\frac{1}{4} × \\frac{22}{7} × 14² = 154 ตร.ซม. รูปใบไม้เกิดจากส่วนโค้งหนึ่งในสี่วงกลมสองส่วนซ้อนทับกันในสี่เหลี่ยมจัตุรัส พื้นที่จึงเท่ากับ (2 × 154) − (พื้นที่สี่เหลี่ยมจัตุรัส) = 308 − 196 = 112 ตร.ซม.`},distractorNotes:{A:{en:`This is simply the area of the whole square (14 × 14 = 196), as if the entire tile were shaded instead of just the leaf shape.`,th:`ค่านี้คือพื้นที่สี่เหลี่ยมจัตุรัสทั้งแผ่น (14 × 14 = 196) เหมือนกับแรเงาทั้งแผ่นกระเบื้อง แทนที่จะเป็นเฉพาะรูปใบไม้`},B:{en:`This is the area of just one quarter circle, as if the leaf shape were the same as a single quarter-circle sector.`,th:`ค่านี้คือพื้นที่ของวงกลมหนึ่งในสี่เพียงส่วนเดียว เหมือนกับคิดว่ารูปใบไม้เท่ากับเซกเตอร์หนึ่งในสี่วงกลมเพียงส่วนเดียว`},D:{en:`This adds the two quarter-circle areas together (2 × 154 = 308) but forgets the final step of subtracting the square's area.`,th:`ค่านี้นำพื้นที่วงกลมหนึ่งในสี่สองส่วนมาบวกกัน (2 × 154 = 308) แต่ลืมขั้นตอนสุดท้ายคือลบพื้นที่สี่เหลี่ยมจัตุรัสออก`}},hints:[{en:`The leaf shape is made of two overlapping quarter circles inside the square — think about what happens when you add both quarter-circle areas.`,th:`รูปใบไม้เกิดจากวงกลมหนึ่งในสี่สองส่วนที่ซ้อนทับกันในสี่เหลี่ยมจัตุรัส ลองคิดดูว่าจะเกิดอะไรขึ้นเมื่อนำพื้นที่วงกลมหนึ่งในสี่ทั้งสองมาบวกกัน`},{en:`Adding the two quarter-circle areas counts the square's area exactly once extra — find each quarter-circle area first.`,th:`การบวกพื้นที่วงกลมหนึ่งในสี่ทั้งสองจะนับพื้นที่สี่เหลี่ยมจัตุรัสเกินไปพอดีหนึ่งเท่า หาพื้นที่วงกลมหนึ่งในสี่แต่ละส่วนก่อน`},{en:`Leaf area = (2 × quarter-circle area) − square area = (2 × 154) − 196.`,th:`พื้นที่ใบไม้ = (2 × พื้นที่วงกลมหนึ่งในสี่) − พื้นที่สี่เหลี่ยมจัตุรัส = (2 × 154) − 196`}],visual:{kind:`leafShape`,width:14,height:14,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A square tile with side 14 cm, with two quarter-circle arcs drawn from the top-left and bottom-right corners, forming a shaded leaf shape in the middle.`,th:`กระเบื้องสี่เหลี่ยมจัตุรัสด้าน 14 ซม. มีส่วนโค้งหนึ่งในสี่วงกลมสองเส้นจากมุมซ้ายบนและมุมขวาล่าง ทำให้เกิดรูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:120},{id:`F-15`,testId:`stw-mock-f`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a fraction`,th:`เศษส่วนของเศษส่วนที่เหลือ`},difficulty:F(15),prompt:{en:`A container holds 72 liters of drinking water set up for exam day. In the morning, \\frac{3}{8} of the water is used. In the afternoon, \\frac{2}{5} of the remaining water is used. How many liters of water are left at the end of the day?`,th:`ถังบรรจุน้ำดื่ม 72 ลิตร สำหรับใช้ในวันสอบ ช่วงเช้าใช้น้ำไป \\frac{3}{8} ของทั้งหมด ช่วงบ่ายใช้น้ำที่เหลือไปอีก \\frac{2}{5} ของน้ำที่เหลือ เมื่อสิ้นวันจะเหลือน้ำอยู่กี่ลิตร`},options:[{id:`A`,label:{en:`18 liters`,th:`18 ลิตร`}},{id:`B`,label:{en:`45 liters`,th:`45 ลิตร`}},{id:`C`,label:{en:`36 liters`,th:`36 ลิตร`}},{id:`D`,label:{en:`27 liters`,th:`27 ลิตร`}}],correctOptionId:`D`,explanation:{en:`Morning usage: \\frac{3}{8} × 72 = 27 liters, leaving 72 − 27 = 45 liters. Afternoon usage: \\frac{2}{5} × 45 = 18 liters, leaving 45 − 18 = 27 liters.`,th:`ช่วงเช้าใช้น้ำ \\frac{3}{8} × 72 = 27 ลิตร เหลือ 72 − 27 = 45 ลิตร ช่วงบ่ายใช้น้ำ \\frac{2}{5} × 45 = 18 ลิตร เหลือ 45 − 18 = 27 ลิตร`},distractorNotes:{A:{en:`This gives the amount used in the afternoon (18 liters), not the amount left over at the end of the day.`,th:`ค่านี้คือปริมาณน้ำที่ใช้ไปช่วงบ่าย (18 ลิตร) ไม่ใช่ปริมาณที่เหลืออยู่ในตอนสิ้นวัน`},B:{en:`This stops after the morning calculation (72 − 27 = 45) and forgets to subtract the water used in the afternoon.`,th:`วิธีนี้หยุดคำนวณหลังช่วงเช้า (72 − 27 = 45) และลืมลบน้ำที่ใช้ไปในช่วงบ่ายออกอีก`},C:{en:`This assumes roughly half the water was used in total over the whole day, without actually working through the two fractional steps.`,th:`วิธีนี้สมมติว่าใช้น้ำไปประมาณครึ่งหนึ่งของทั้งหมดตลอดทั้งวัน โดยไม่ได้คำนวณทีละขั้นตอนตามเศษส่วนที่โจทย์ให้จริง`}},hints:[{en:`Work through the day in two separate steps — morning, then afternoon.`,th:`คำนวณแยกเป็นสองช่วง คือช่วงเช้าและช่วงบ่าย`},{en:`The afternoon fraction \\frac{2}{5} applies to the water remaining after the morning, not to the original 72 liters.`,th:`เศษส่วน \\frac{2}{5} ในช่วงบ่ายใช้กับน้ำที่เหลือหลังช่วงเช้า ไม่ใช่กับน้ำ 72 ลิตรตั้งต้น`},{en:`First find 72 − (3/8 × 72) = 45 liters remaining after the morning. Then find 45 − (2/5 × 45) for the final amount.`,th:`หาก่อนว่า 72 − (3/8 × 72) = 45 ลิตร ที่เหลือหลังช่วงเช้า จากนั้นหา 45 − (2/5 × 45) เพื่อหาปริมาณสุดท้าย`}],visual:null,estimatedSeconds:100},{id:`F-16`,testId:`stw-mock-f`,number:16,skill:`Algebra & Patterns`,topic:{en:`Cut-corner square (algebra)`,th:`สี่เหลี่ยมตัดมุม (พีชคณิต)`},difficulty:F(16),prompt:{en:`A square sheet of paper has an area of 400 cm². A congruent right-triangle with two equal legs of length x is cut from each of its four corners (as shown), leaving an octagon-shaped piece with an area of 328 cm². Find the value of x.`,th:`กระดาษรูปสี่เหลี่ยมจัตุรัสมีพื้นที่ 400 ตร.ซม. มีการตัดมุมทั้งสี่มุมออกด้วยสามเหลี่ยมมุมฉากที่มีขาสองข้างยาวเท่ากันคือ x หน่วย (ดังรูป) เหลือเป็นรูปแปดเหลี่ยมที่มีพื้นที่ 328 ตร.ซม. จงหาค่าของ x`},options:[{id:`A`,label:{en:`6 cm`,th:`6 ซม.`}},{id:`B`,label:{en:`8 cm`,th:`8 ซม.`}},{id:`C`,label:{en:`9 cm`,th:`9 ซม.`}},{id:`D`,label:{en:`12 cm`,th:`12 ซม.`}}],correctOptionId:`A`,explanation:{en:`The square's side is \\frac{400}{√400} = 20 cm. The area removed by the 4 corner triangles is 400 − 328 = 72 cm². Each triangle has area \\frac{1}{2}x², so 4 × \\frac{1}{2}x² = 72, giving 2x² = 72, x² = 36, so x = 6 cm.`,th:`ด้านของสี่เหลี่ยมจัตุรัสคือ √400 = 20 ซม. พื้นที่ที่ถูกตัดออกจากสามเหลี่ยมมุมทั้ง 4 มุมคือ 400 − 328 = 72 ตร.ซม. สามเหลี่ยมแต่ละรูปมีพื้นที่ \\frac{1}{2}x² ดังนั้น 4 × \\frac{1}{2}x² = 72 จะได้ 2x² = 72 นั่นคือ x² = 36 ดังนั้น x = 6 ซม.`},distractorNotes:{B:{en:`This forgets to divide the area difference by 2 before taking the square root, using x² = 72 instead of x² = 36.`,th:`วิธีนี้ลืมหารส่วนต่างพื้นที่ด้วย 2 ก่อนถอดรากที่สอง โดยใช้ x² = 72 แทนที่จะเป็น x² = 36`},C:{en:`This divides the area difference by the number of corners first (72 ÷ 4 = 18) without applying the ½ factor from the triangle-area formula correctly, leading to a rounded, incorrect estimate.`,th:`วิธีนี้หารส่วนต่างพื้นที่ด้วยจำนวนมุม (72 ÷ 4 = 18) โดยไม่ได้ใช้ตัวคูณ ½ จากสูตรพื้นที่สามเหลี่ยมอย่างถูกต้อง ทำให้ได้ค่าประมาณที่ไม่ถูกต้อง`},D:{en:`This confuses the cut length x with a different length in the figure, roughly doubling the correct value.`,th:`วิธีนี้สับสนความยาว x กับความยาวอื่นในรูป ทำให้ได้ค่าที่มากเกินไปประมาณสองเท่าของค่าที่ถูกต้อง`}},hints:[{en:`First find the side length of the square from its area, then find how much area was removed altogether.`,th:`หาความยาวด้านของสี่เหลี่ยมจัตุรัสจากพื้นที่ก่อน แล้วหาว่าพื้นที่ทั้งหมดที่ถูกตัดออกมีเท่าใด`},{en:`Each corner triangle is a right triangle with both legs equal to x, so each has area ½x². There are 4 such triangles.`,th:`สามเหลี่ยมที่มุมแต่ละรูปเป็นสามเหลี่ยมมุมฉากที่มีขาทั้งสองยาวเท่ากับ x ดังนั้นแต่ละรูปมีพื้นที่ ½x² มีสามเหลี่ยมแบบนี้อยู่ 4 รูป`},{en:`Set up 4 × ½x² = 400 − 328. Simplify to 2x² = 72, then solve for x.`,th:`ตั้งสมการ 4 × ½x² = 400 − 328 ทำให้เป็น 2x² = 72 แล้วแก้หาค่า x`}],visual:{kind:`geometryFigure`,width:160,height:160,polygons:[{points:[[48,0],[112,0],[160,48],[160,112],[112,160],[48,160],[0,112],[0,48]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:48,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:48,style:`dashed`},{x1:160,y1:160,x2:160,y2:112,style:`dashed`},{x1:160,y1:160,x2:112,y2:160,style:`dashed`}],labels:[{x:24,y:-12,text:`x`,bold:!0},{x:176,y:136,text:`x`,bold:!0}],alt:{en:`A square with all four corners cut off by small right triangles, leaving a shaded octagon in the middle. The horizontal leg of the top-left cut triangle and the vertical leg of the bottom-right cut triangle are each labeled x, positioned near their own corner.`,th:`สี่เหลี่ยมจัตุรัสที่ถูกตัดมุมทั้งสี่มุมด้วยสามเหลี่ยมมุมฉากเล็กๆ เหลือเป็นรูปแปดเหลี่ยมแรเงาตรงกลาง ขาด้านนอนของสามเหลี่ยมที่ถูกตัดมุมซ้ายบน และขาด้านตั้งของสามเหลี่ยมที่ถูกตัดมุมขวาล่าง ต่างกำกับด้วย x อยู่ใกล้มุมของตนเอง`}},estimatedSeconds:130},{id:`F-17`,testId:`stw-mock-f`,number:17,skill:`Graphs & Data`,topic:{en:`Reading a bar chart`,th:`การอ่านกราฟแท่ง`},difficulty:F(17),prompt:{en:`The bar chart shows how many students from Group A and Group B attended the final revision sessions from Monday to Thursday. Which statement about the data is INCORRECT?`,th:`กราฟแท่งแสดงจำนวนนักเรียนกลุ่ม A และกลุ่ม B ที่เข้าร่วมติวทบทวนครั้งสุดท้าย ตั้งแต่วันจันทร์ถึงวันพฤหัสบดี ข้อความใดเกี่ยวกับข้อมูลนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Group A had more students than Group B on both Monday and Tuesday.`,th:`กลุ่ม A มีนักเรียนมากกว่ากลุ่ม B ทั้งวันจันทร์และวันอังคาร`}},{id:`B`,label:{en:`Group A's attendance increased every single day from Monday to Thursday.`,th:`จำนวนนักเรียนกลุ่ม A เพิ่มขึ้นทุกวันตั้งแต่วันจันทร์ถึงวันพฤหัสบดี`}},{id:`C`,label:{en:`Group B had more students than Group A on both Wednesday and Thursday.`,th:`กลุ่ม B มีนักเรียนมากกว่ากลุ่ม A ทั้งวันพุธและวันพฤหัสบดี`}},{id:`D`,label:{en:`The combined attendance of both groups was highest on Thursday.`,th:`จำนวนนักเรียนรวมของทั้งสองกลุ่มมากที่สุดในวันพฤหัสบดี`}}],correctOptionId:`B`,explanation:{en:`Group A's values across Monday–Thursday are 24, 30, 18, 26. It rises from Monday to Tuesday, but then drops on Wednesday (30 → 18) before rising again — so it does not increase every single day. This statement is the incorrect one.`,th:`จำนวนนักเรียนกลุ่ม A ตั้งแต่วันจันทร์ถึงพฤหัสบดีคือ 24, 30, 18, 26 ซึ่งเพิ่มขึ้นจากจันทร์ไปอังคาร แต่กลับลดลงในวันพุธ (30 → 18) ก่อนจะเพิ่มขึ้นอีกครั้ง จึงไม่ได้เพิ่มขึ้นทุกวันอย่างที่ข้อความกล่าว นี่คือข้อความที่ไม่ถูกต้อง`},distractorNotes:{A:{en:`This statement is actually true — Group A's bar is taller than Group B's on both Monday (24 vs 20) and Tuesday (30 vs 22). Picking this suggests one of those two bars was misread.`,th:`ข้อความนี้เป็นจริง เพราะแท่งของกลุ่ม A สูงกว่ากลุ่ม B ทั้งวันจันทร์ (24 กับ 20) และวันอังคาร (30 กับ 22) การเลือกข้อนี้แสดงว่าอ่านแท่งใดแท่งหนึ่งผิดไป`},C:{en:`This statement is also true — Group B's bar is taller on both Wednesday (24 vs 18) and Thursday (30 vs 26). Picking this suggests misreading the Wednesday or Thursday bars.`,th:`ข้อความนี้เป็นจริงเช่นกัน เพราะแท่งของกลุ่ม B สูงกว่าทั้งวันพุธ (24 กับ 18) และวันพฤหัสบดี (30 กับ 26) การเลือกข้อนี้แสดงว่าอ่านแท่งวันพุธหรือพฤหัสบดีผิดไป`},D:{en:`This is also true — the combined total is highest on Thursday (26 + 30 = 56), the tallest combined columns on the chart. Picking this suggests the totals for another day were added incorrectly.`,th:`ข้อความนี้เป็นจริงเช่นกัน เพราะผลรวมของทั้งสองกลุ่มมากที่สุดในวันพฤหัสบดี (26 + 30 = 56) ซึ่งเป็นผลรวมแท่งที่สูงที่สุดในกราฟ การเลือกข้อนี้แสดงว่าบวกผลรวมของวันอื่นผิดไป`}},hints:[{en:`Check each statement carefully against the chart — three of them are true and one is false.`,th:`ตรวจสอบแต่ละข้อความอย่างละเอียดเทียบกับกราฟ มีสามข้อที่ถูกต้องและหนึ่งข้อที่ไม่ถูกต้อง`},{en:`Statements comparing Group A to Group B on specific days, or the combined totals, can be checked directly from the bar heights. Pay close attention to the word 'every' in one statement.`,th:`ข้อความที่เปรียบเทียบกลุ่ม A กับกลุ่ม B ในแต่ละวัน หรือผลรวมของทั้งสองกลุ่ม สามารถตรวจสอบได้โดยตรงจากความสูงของแท่ง สังเกตคำว่า "ทุกวัน" ในข้อความหนึ่งให้ดี`},{en:`Trace Group A's bars day by day: 24, 30, 18, 26. Does that go up every single day without ever dropping?`,th:`ไล่ดูแท่งของกลุ่ม A ทีละวัน: 24, 30, 18, 26 ค่านี้เพิ่มขึ้นทุกวันโดยไม่มีวันไหนลดลงเลยหรือไม่`}],visual:{kind:`barChart`,categories:[`Mon`,`Tue`,`Wed`,`Thu`],series:[{name:{en:`Group A`,th:`กลุ่ม A`},color:`coral`,values:[24,30,18,26]},{name:{en:`Group B`,th:`กลุ่ม B`},color:`teal`,values:[20,22,24,30]}],yStep:10,yMax:40,alt:{en:`A grouped bar chart showing Group A (coral) and Group B (teal) attendance from Monday to Thursday: Group A has 24, 30, 18, 26; Group B has 20, 22, 24, 30.`,th:`กราฟแท่งเปรียบเทียบจำนวนนักเรียนกลุ่ม A (สีส้มแดง) และกลุ่ม B (สีเขียวน้ำเงิน) ตั้งแต่วันจันทร์ถึงพฤหัสบดี กลุ่ม A มี 24, 30, 18, 26 และกลุ่ม B มี 20, 22, 24, 30`}},estimatedSeconds:120},{id:`F-18`,testId:`stw-mock-f`,number:18,skill:`Graphs & Data`,topic:{en:`Pie chart in degrees`,th:`แผนภูมิวงกลมเป็นองศา`},difficulty:F(18),prompt:{en:`The pie chart shows the results of a survey asking Primary 6 students which subject they most wanted to review before the exam. The Math slice measures 150° and represents 75 students. The English slice measures 90°. How many students chose English?`,th:`แผนภูมิวงกลมแสดงผลสำรวจนักเรียนชั้นประถมศึกษาปีที่ 6 ว่าอยากทบทวนวิชาใดมากที่สุดก่อนสอบ สัดส่วนวิชาคณิตศาสตร์มีขนาด 150° แทนนักเรียน 75 คน ส่วนวิชาภาษาอังกฤษมีขนาด 90° มีนักเรียนกี่คนที่เลือกวิชาภาษาอังกฤษ`},options:[{id:`A`,label:{en:`30`,th:`30`}},{id:`B`,label:{en:`20`,th:`20`}},{id:`C`,label:{en:`45`,th:`45`}},{id:`D`,label:{en:`90`,th:`90`}}],correctOptionId:`C`,explanation:{en:`Since 150° represents 75 students, each degree represents 75 ÷ 150 = 0.5 students. The English slice (90°) represents 90 × 0.5 = 45 students.`,th:`เนื่องจาก 150° แทนนักเรียน 75 คน แต่ละองศาจึงแทนนักเรียน 75 ÷ 150 = 0.5 คน สัดส่วนวิชาภาษาอังกฤษ (90°) จึงแทนนักเรียน 90 × 0.5 = 45 คน`},distractorNotes:{A:{en:`This is actually the Science slice's count (60° × 0.5 = 30), not English's — a mix-up between two different slices.`,th:`ค่านี้จริงๆ แล้วคือจำนวนนักเรียนของสัดส่วนวิชาวิทยาศาสตร์ (60° × 0.5 = 30) ไม่ใช่วิชาภาษาอังกฤษ เป็นการสับสนระหว่างสัดส่วนคนละส่วน`},B:{en:`This is actually the Thai slice's count (40° × 0.5 = 20), not English's — another mix-up between slices.`,th:`ค่านี้จริงๆ แล้วคือจำนวนนักเรียนของสัดส่วนวิชาภาษาไทย (40° × 0.5 = 20) ไม่ใช่วิชาภาษาอังกฤษ เป็นการสับสนระหว่างสัดส่วนอีกเช่นกัน`},D:{en:`This simply uses the degree measure of the English slice (90) directly as the number of students, without converting using the given Math ratio at all.`,th:`วิธีนี้ใช้ค่าองศาของสัดส่วนวิชาภาษาอังกฤษ (90) เป็นจำนวนนักเรียนโดยตรง โดยไม่ได้แปลงค่าโดยใช้อัตราส่วนจากวิชาคณิตศาสตร์ที่โจทย์ให้มาเลย`}},hints:[{en:`The number of students in each slice is proportional to that slice's angle in degrees.`,th:`จำนวนนักเรียนในแต่ละสัดส่วนแปรผันตรงกับขนาดมุมองศาของสัดส่วนนั้น`},{en:`Use the Math slice to find out how many students each degree represents, then apply that rate to the English slice.`,th:`ใช้สัดส่วนวิชาคณิตศาสตร์เพื่อหาว่าแต่ละองศาแทนนักเรียนกี่คน แล้วนำอัตรานั้นไปใช้กับสัดส่วนวิชาภาษาอังกฤษ`},{en:`75 students ÷ 150° = 0.5 students per degree. Multiply this rate by the English slice's 90°.`,th:`75 คน ÷ 150° = 0.5 คนต่อองศา นำอัตรานี้ไปคูณกับ 90° ของสัดส่วนวิชาภาษาอังกฤษ`}],visual:{kind:`pieChart`,slices:[{label:`Math`,degrees:150,color:`coral`},{label:`Eng`,degrees:90,color:`teal`},{label:`Sci`,degrees:60,color:`sage`},{label:`Thai`,degrees:40,color:`gold`},{label:`Soc`,degrees:20,color:`charcoal`}],alt:{en:`A pie chart of survey results: Math 150 degrees, English 90 degrees, Science 60 degrees, Thai 40 degrees, Social Studies 20 degrees.`,th:`แผนภูมิวงกลมผลสำรวจ: คณิตศาสตร์ 150 องศา ภาษาอังกฤษ 90 องศา วิทยาศาสตร์ 60 องศา ภาษาไทย 40 องศา สังคมศึกษา 20 องศา`}},estimatedSeconds:125},{id:`F-19`,testId:`stw-mock-f`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Markup, discount & profit`,th:`การขึ้นราคา ส่วนลด และกำไร`},difficulty:F(19),prompt:{en:`A bookshop bought a batch of exam review guides for 150 baht each. The owner marked up the price hoping for a 40% profit on each book. During a clearance sale, however, the books were actually sold at a 10% discount off the marked price. What was the actual profit per book?`,th:`ร้านหนังสือซื้อคู่มือทบทวนก่อนสอบมาในราคาต้นทุนเล่มละ 150 บาท เจ้าของร้านตั้งราคาขายโดยหวังกำไร 40% ต่อเล่ม แต่ในช่วงลดราคาล้างสต็อก หนังสือกลับถูกขายจริงในราคาลด 10% จากราคาที่ตั้งไว้ กำไรที่ได้จริงต่อเล่มเป็นเท่าใด`},options:[{id:`A`,label:{en:`Profit of 60 baht`,th:`กำไร 60 บาท`}},{id:`B`,label:{en:`Loss of 21 baht`,th:`ขาดทุน 21 บาท`}},{id:`C`,label:{en:`Profit of 21 baht`,th:`กำไร 21 บาท`}},{id:`D`,label:{en:`Profit of 39 baht`,th:`กำไร 39 บาท`}}],correctOptionId:`D`,explanation:{en:`The marked price is 150 × 1.4 = 210 baht. After a 10% discount, the actual selling price is 210 × 0.9 = 189 baht. The actual profit is 189 − 150 = 39 baht.`,th:`ราคาที่ตั้งไว้คือ 150 × 1.4 = 210 บาท เมื่อลดราคา 10% ราคาขายจริงคือ 210 × 0.9 = 189 บาท กำไรที่ได้จริงคือ 189 − 150 = 39 บาท`},distractorNotes:{A:{en:`This is the profit the owner originally hoped for (40% of 150 = 60 baht), before the clearance discount was ever applied — it ignores the actual 10% discount entirely.`,th:`ค่านี้คือกำไรที่เจ้าของร้านหวังไว้แต่แรก (40% ของ 150 = 60 บาท) ก่อนจะมีการลดราคาล้างสต็อก เป็นการละเลยส่วนลด 10% ที่เกิดขึ้นจริงไปเลย`},B:{en:`This takes the discount amount (10% of 210 = 21 baht) and mistakenly treats it as a loss, rather than realizing the shop still sold above cost price.`,th:`ค่านี้นำจำนวนเงินส่วนลด (10% ของ 210 = 21 บาท) มาคิดว่าเป็นเงินขาดทุน ทั้งที่จริงแล้วร้านยังคงขายได้สูงกว่าราคาต้นทุน`},C:{en:`This takes the discount amount (10% of 210 = 21 baht) and presents it directly as the profit figure, without actually comparing the final selling price to the cost price.`,th:`ค่านี้นำจำนวนเงินส่วนลด (10% ของ 210 = 21 บาท) มาตอบเป็นกำไรโดยตรง โดยไม่ได้เปรียบเทียบราคาขายจริงกับราคาต้นทุนเลย`}},hints:[{en:`This problem has two separate percentage steps — a markup on the cost, then a discount on the marked price.`,th:`โจทย์นี้มีการคิดร้อยละสองขั้นตอนแยกกัน คือการขึ้นราคาจากต้นทุน แล้วจึงลดราคาจากราคาที่ตั้งไว้`},{en:`First find the marked price (cost + 40%). Then apply the 10% discount to that marked price, not to the original cost.`,th:`หาก่อนว่าราคาที่ตั้งไว้เป็นเท่าใด (ต้นทุน + 40%) แล้วจึงลดราคา 10% จากราคาที่ตั้งไว้นั้น ไม่ใช่จากต้นทุนเดิม`},{en:`Marked price = 150 × 1.4 = 210. Selling price after discount = 210 × 0.9 = 189. Compare this final selling price to the original cost of 150 to find the actual profit.`,th:`ราคาที่ตั้งไว้ = 150 × 1.4 = 210 ราคาขายหลังลด = 210 × 0.9 = 189 นำราคาขายจริงนี้ไปเทียบกับต้นทุน 150 เพื่อหากำไรที่ได้จริง`}],visual:null,estimatedSeconds:150},{id:`F-20`,testId:`stw-mock-f`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Percentages of each other`,th:`ร้อยละของกันและกัน`},difficulty:F(20),prompt:{en:`Anda, Bo, and Cee saved money for an exam-day celebration trip. Bo's savings is 150% of Anda's savings, and Cee's savings is 80% of Bo's savings. Altogether the three of them saved 740 baht. How much did Cee save?`,th:`อันดา โบ และซี ออมเงินไว้สำหรับทริปฉลองหลังสอบเสร็จ โบมีเงินออมเป็น 150% ของอันดา ส่วนซีมีเงินออมเป็น 80% ของโบ รวมกันทั้งสามคนออมเงินได้ 740 บาท ซีออมเงินไว้เท่าใด`},options:[{id:`A`,label:{en:`240 baht`,th:`240 บาท`}},{id:`B`,label:{en:`300 baht`,th:`300 บาท`}},{id:`C`,label:{en:`200 baht`,th:`200 บาท`}},{id:`D`,label:{en:`160 baht`,th:`160 บาท`}}],correctOptionId:`A`,explanation:{en:`Let Anda's savings = A. Bo's savings = 1.5A. Cee's savings = 0.8 × 1.5A = 1.2A. The total is A + 1.5A + 1.2A = 3.7A = 740, so A = 200. Cee's savings = 1.2 × 200 = 240 baht.`,th:`ให้เงินออมของอันดา = A เงินออมของโบ = 1.5A เงินออมของซี = 0.8 × 1.5A = 1.2A ผลรวมคือ A + 1.5A + 1.2A = 3.7A = 740 ดังนั้น A = 200 เงินออมของซี = 1.2 × 200 = 240 บาท`},distractorNotes:{B:{en:`This correctly finds Bo's savings (300 baht) but answers with the wrong person's amount — the question asks for Cee's savings, not Bo's.`,th:`วิธีนี้หาเงินออมของโบได้ถูกต้อง (300 บาท) แต่ตอบเป็นเงินของคนละคนกับที่โจทย์ถาม เพราะโจทย์ถามเงินออมของซี ไม่ใช่ของโบ`},C:{en:`This correctly finds Anda's savings (200 baht) but answers with the wrong person's amount instead of Cee's.`,th:`วิธีนี้หาเงินออมของอันดาได้ถูกต้อง (2
