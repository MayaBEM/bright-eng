:root{
  --cream:#fff8ec;--paper:#ffffff;--ink:#21352a;--ink-2:#56685c;--line:#eadcc3;--line-2:#dccaa9;
  --leaf:#2e9a57;--leaf-d:#1d7441;--leaf-l:#e2f3e7;--coral:#ff6a4d;--coral-d:#cf4a2f;--coral-l:#ffe5dd;
  --sun:#ffc83a;--sun-d:#d99a00;--sun-l:#fff1c4;--sky:#ddf0f6;--wood:#d39a57;--wood-d:#8f5f2a;
  --good:#1b7f45;--bad:#b83a24;--r:18px;--shadow:0 2px 0 rgba(80,55,20,.06),0 8px 22px rgba(80,55,20,.07);
  --fs:19px;
}
@media (min-width:1600px){:root{--fs:22px}main,.foot{max-width:1560px}}
@media (min-width:2200px){:root{--fs:26px}}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Andika',ui-rounded,'Trebuchet MS',sans-serif;line-height:1.4;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px;border-radius:10px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{margin:0;line-height:1.15;font-weight:700}
h2{font-size:1.55rem}h3{font-size:1.15rem}
p{margin:0}
[hidden]{display:none!important}
.ic{width:1.25em;height:1.25em;flex:none}
.fruit-svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:56px;padding:.45em 1.05em;border-radius:16px;border:2px solid var(--line-2);border-bottom-width:4px;background:var(--paper);font-weight:700;font-size:1.02rem;line-height:1.1;text-decoration:none;color:var(--ink);transition:transform .08s,background .15s,border-color .15s;touch-action:manipulation;user-select:none}
.btn:hover:not(:disabled){border-color:var(--wood)}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--leaf);border-color:var(--leaf-d);color:#fff}
.btn.primary:hover:not(:disabled){background:#33a861;border-color:var(--leaf-d)}
.btn.coral{background:var(--coral);border-color:var(--coral-d);color:#fff}
.btn.coral:hover:not(:disabled){background:#ff7c62;border-color:var(--coral-d)}
.btn.sm{min-height:48px;font-size:.9rem;padding:.35em .8em;border-radius:14px}
.btn.big{min-height:68px;font-size:1.2rem;padding:.5em 1.4em;border-radius:20px}
.btn.listen{background:var(--sky);border-color:#a9d3e2}
.btn.live{background:var(--coral);border-color:var(--coral-d);color:#fff}
.btn.tick[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf-d);color:#fff}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:.35em;min-width:52px;min-height:52px;padding:0 .6em;border-radius:14px;border:2px solid transparent;background:transparent;font-weight:700;font-size:.95rem}
.ib:hover{background:var(--sun-l)}
.ib[aria-pressed=true]{background:var(--leaf-l)}
.ib.big{min-width:62px;min-height:62px;background:var(--sky);border-color:#a9d3e2}
.ib.sm{min-width:44px;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:.4em;min-height:52px;padding:.3em 1em;border-radius:999px;border:2px solid var(--line-2);background:var(--paper);font-weight:700}
.chip.on,.chip[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf-d);color:#fff}
.chip.add{border-style:dashed}
.chip.sm{min-height:40px;padding:.15em .7em;font-size:.85rem}
.chip .dot{width:.9em;height:.9em;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.note{color:var(--ink-2);font-size:.88rem}
.round{font-weight:700;color:var(--ink-2);font-size:.95rem;white-space:nowrap}
.fb{min-height:1.6em;font-weight:700;font-size:1.1rem;text-align:center;margin-top:10px}
.stars{display:inline-flex;gap:4px}.stars svg{width:28px;height:28px}
.cchip,.wchip{display:inline-flex;align-items:center;gap:.4em;padding:.15em .7em;border-radius:999px;background:var(--cream);border:2px solid var(--line);font-weight:700;font-size:.92rem;margin:2px 4px 2px 0}
.cchip i{width:1em;height:1em;border-radius:50%;border:2px solid rgba(0,0,0,.22)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;background:var(--cream);border:2px solid var(--line);padding:5px;border-radius:16px}
.seg button{min-height:46px;padding:.2em .9em;border-radius:12px;border:0;background:transparent;font-weight:700;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--leaf);color:#fff}
.seg span{align-self:center;padding:0 .4em;font-weight:700;font-size:.9rem;color:var(--ink-2)}

/* ---------- shell */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--paper);border-bottom:2px solid var(--line)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:6px;background:repeating-linear-gradient(90deg,var(--coral) 0 28px,#fff3e3 28px 56px);opacity:.9}
.crumb{display:flex;flex-direction:column;line-height:1.1;min-width:0;margin-right:auto}
.crumb b{font-size:1.1rem;color:var(--leaf-d)}
.crumb .where{font-size:.9rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;gap:4px;background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:4px}
.lvl button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;min-height:48px;border:0;border-radius:12px;background:transparent;line-height:1}
.lvl button b{font-size:1.15rem}.lvl button small{font-size:.66rem;font-weight:700;color:var(--ink-2);margin-top:2px}
.lvl button[aria-pressed=true]{background:var(--sun);}
.lvl button[aria-pressed=true] small{color:var(--ink)}
.lvl.wide{flex-direction:column}.lvl.wide button{align-items:flex-start;padding:8px 12px;text-align:left}.lvl.wide small{font-size:.8rem!important}
.tools{display:flex;gap:4px}
main{max-width:1240px;margin:0 auto;padding:22px 16px 30px}
.on-start main{max-width:none;padding:0}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:10px 16px 24px;color:var(--ink-2);font-size:.82rem}
.on-start .foot{display:none}
.foot-brand{display:inline-flex;align-items:center;gap:8px}.foot-brand img{height:46px;width:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;z-index:90;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;max-width:min(92vw,560px);text-align:center;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ghead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ghead .help{color:var(--ink-2);margin-top:4px;font-size:1rem;max-width:720px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- tutor panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:60;background:var(--paper);border-left:2px solid var(--line);box-shadow:-10px 0 40px rgba(60,40,10,.18);display:flex;flex-direction:column}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.ptabs{display:flex;gap:4px;padding:0 12px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.ptabs button{border:0;background:transparent;font-weight:700;padding:10px 10px;min-height:46px;border-bottom:4px solid transparent;font-size:.9rem}
.ptabs button[aria-selected=true]{border-bottom-color:var(--coral);color:var(--coral-d)}
.pbody{overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:12px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;font-size:.9rem;background:var(--cream);border-radius:12px;padding:8px 10px}
.plan b{color:var(--leaf-d)}
.asks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ask{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:.95rem;font-weight:700;min-height:52px}
.ask:hover{background:var(--sun-l)}
.setrow{display:flex;gap:8px;flex-wrap:wrap}
.profs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.profs li{display:flex;gap:6px;align-items:center}
.profs li.cur input{border-color:var(--leaf)}
.profs input{flex:1;min-width:0;min-height:48px;border:2px solid var(--line-2);border-radius:12px;padding:0 10px;font-weight:700}
.keys{width:100%;border-collapse:collapse;font-size:.92rem}.keys td{padding:8px 4px;border-bottom:1px solid var(--line)}
kbd{display:inline-block;background:var(--cream);border:2px solid var(--line-2);border-bottom-width:3px;border-radius:8px;padding:1px 8px;font-family:inherit;font-weight:700;white-space:nowrap}

/* ---------- start */
.scr-start{min-height:100vh;display:flex;flex-direction:column;background:var(--cream)}
.awning{height:70px;overflow:hidden}.awning svg{width:100%;height:100%;display:block}
.start-in{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:12px 16px 20px;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto auto 1fr;column-gap:40px;align-items:start}
.start-in .by{grid-column:1;margin:8px 0 6px}.start-in .by img{display:block;height:92px;width:auto}
.start-in h1{grid-column:1;font-size:clamp(3rem,7vw,5.2rem);color:var(--leaf-d);line-height:.95;letter-spacing:-.01em}
.start-in .sub{grid-column:1;font-size:1.35rem;margin-top:6px;color:var(--ink)}
.stall-front{grid-column:1;margin-top:24px;background:#c98a49;border-radius:20px;padding:14px 12px 16px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.crate-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#e2b072;border-radius:12px;padding:6px 8px 2px;border-bottom:6px solid #a86f35}
.crate-row.r2{margin-top:10px}
.sf{display:block}
.pick-box{grid-column:2;grid-row:1/5;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;margin-top:10px}
.pick-h{font-size:1.15rem}
.who{display:flex;flex-wrap:wrap;gap:8px}
.newp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newp label{display:flex;gap:8px;align-items:center;font-weight:700}
.newp input{min-height:50px;border:2px solid var(--line-2);border-radius:12px;padding:0 12px;width:12em}
.lvl-pick{display:grid;gap:8px}
.lvcard{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;min-height:64px;padding:8px 14px;border-radius:16px;border:2px solid var(--line-2);background:var(--paper)}
.lvcard b{font-size:1.1rem}.lvcard span{justify-self:end;font-weight:700;color:var(--ink-2)}
.lvcard small{grid-column:1/-1;color:var(--ink-2);font-size:.86rem}
.lvcard.on{background:var(--sun-l);border-color:var(--sun-d);box-shadow:inset 0 0 0 2px var(--sun)}
.startbtn{margin-top:6px;width:100%}
.start-foot{text-align:center;color:var(--ink-2);font-size:.85rem;padding:10px 16px 18px}

/* ---------- home */
.hello{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.hello h2{font-size:1.9rem}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700;color:var(--ink-2)}
.flow span{background:var(--paper);border:2px solid var(--line);padding:.2em .8em;border-radius:999px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.step{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:10px;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;background:var(--paper);padding:14px;box-shadow:var(--shadow)}
.step:hover{border-color:var(--wood)}
.step .num{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;z-index:1}
.step .pic{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:110px;background:var(--cream);border-radius:14px;padding:8px}
.step .pic svg{height:92px;width:auto;max-width:48%}
.scn{display:flex;align-items:flex-end;justify-content:center}.step .pic .scn svg,.gtile .pic .scn svg,.scn svg{height:84px;width:auto;max-width:none}
.scn.mic{color:var(--coral-d)}.scn.mic .ic{width:54px;height:54px}
.scn.tall svg{height:96px}
.step .txt{display:flex;flex-direction:column;gap:3px;flex:1}
.step small{font-weight:700;color:var(--coral-d);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
.step b{font-size:1.25rem}
.step .txt>span{color:var(--ink-2);font-size:.92rem}
.step em{font-style:normal;margin-top:auto;padding-top:6px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.step em .stars svg{width:24px;height:24px}
.badge-tag{display:inline-block;background:var(--sun);color:var(--ink);border-radius:999px;padding:0 .6em;margin-left:4px}
.tip{display:flex;gap:10px;align-items:center;margin-top:20px;color:var(--ink-2);font-size:.95rem}

/* ---------- word studio */
.studio{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;align-items:start}
.tiles-wrap{display:flex;flex-direction:column;gap:12px}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ftile{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--paper);padding:8px 6px 6px;font-weight:700;font-size:.92rem;min-height:120px;touch-action:none;user-select:none}
.ftile svg{width:78%;max-width:92px}
.ftile:hover{border-color:var(--wood)}
.ftile[aria-pressed=true]{border-color:var(--leaf);background:var(--leaf-l);box-shadow:inset 0 0 0 2px var(--leaf)}
.detail{position:sticky;top:96px;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two figure{margin:0;background:var(--cream);border-radius:18px;padding:12px 18px 8px;text-align:center}
.two figure svg{max-width:200px;margin:0 auto}
.two figcaption{font-weight:700;color:var(--ink-2);font-size:.9rem}
.bigword{display:flex;align-items:center;gap:14px;border:0;background:transparent;font-size:2.4rem;font-weight:700;color:var(--leaf-d);padding:0;min-height:60px;text-align:left}
.bigword .ic{width:48px;height:48px;padding:9px;border-radius:50%;background:var(--sky);color:var(--ink)}
.forms{display:flex;gap:8px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--cream);border-radius:999px;padding:.3em .9em;font-weight:700;min-height:46px}
.facts{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.facts div{display:flex;flex-direction:column}.facts dt{font-size:.8rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}.facts dd{margin:0}
.examples{display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:10px}
.ex{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--sun-l);border-radius:14px;padding:.45em .8em;font-weight:700;font-size:1.1rem;min-height:52px}
.ex:hover{background:#ffe9a6}

/* ---------- small games */
.board{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px}
.opts{display:grid;gap:14px;width:100%;max-width:900px}
.opts.n3{grid-template-columns:repeat(3,1fr)}.opts.n4{grid-template-columns:repeat(4,1fr)}
.opt{position:relative;border:3px solid var(--line);border-bottom-width:5px;border-radius:20px;background:var(--paper);padding:12px;font-weight:700;font-size:1.1rem;min-height:64px}
.opt.pic svg{max-width:150px;margin:0 auto}
.opt .lab{display:block;margin-top:4px}
.opt:hover:not(:disabled){border-color:var(--wood)}
.opt.right{border-color:var(--good);background:#e5f5ea;box-shadow:inset 0 0 0 2px var(--good)}
.opt.wrong{border-color:var(--bad);background:#fbe7e2;opacity:.75}
.opt.right::after,.opt.wrong::after{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1rem}
.opt.right::after{content:'✓';background:var(--good)}.opt.wrong::after{content:'✕';background:var(--bad)}
.say-step{font-weight:700;font-size:1.2rem}
.shelf{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;background:#e2b072;border-bottom:8px solid #a86f35;border-radius:18px;padding:14px;width:100%;max-width:980px}
.slot{width:140px;border:0;background:rgba(255,255,255,.55);border-radius:16px;padding:8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot svg{width:100px}
.slot.empty{background:rgba(255,255,255,.3);border:3px dashed #a86f35;justify-content:center;min-height:140px}
.slot .q{font-size:3rem;color:var(--wood-d)}
.slot.back{background:#e5f5ea}
.cloth{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:var(--coral);display:flex;align-items:center;justify-content:center;flex-direction:column;animation:drop .35s ease-out}
.cloth svg{position:absolute;top:0;left:0;width:100%;height:60px}
.cloth b{position:relative;color:#fff;font-size:2rem}
@keyframes drop{from{transform:translateY(-100%)}to{transform:none}}
.act{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}

/* ---------- games menu */
.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;background:var(--paper);padding:14px;box-shadow:var(--shadow);min-height:250px}
.gtile:hover{border-color:var(--wood)}
.gtile .pic{display:flex;align-self:stretch;justify-content:center;align-items:flex-end;gap:2px;height:120px;background:var(--cream);border-radius:16px;padding:8px}
.gtile .pic>svg{height:96px;width:auto;max-width:34%}
.gtile b{font-size:1.35rem;margin-top:4px}
.gtile>span{color:var(--ink-2);font-size:.95rem}
.gtile .stars{margin-top:auto}

/* ---------- play fields */
.prompt-card{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;box-shadow:var(--shadow);max-width:100%}
.ptext{font-size:1.45rem;font-weight:700;color:var(--leaf-d)}
.field{position:relative;overflow:hidden;border-radius:24px;border:2px solid var(--line);height:min(62vh,600px);min-height:380px;touch-action:none;user-select:none}
.field.catch{background:linear-gradient(#dff1f7,#f2fae6 70%)}
.canopy{position:absolute;left:0;right:0;top:0;height:110px}.canopy svg{width:100%;height:100%;display:block}
.grass{position:absolute;left:0;right:0;bottom:0;height:46px;background:#9ccf6a;border-top:4px solid #7db54c}
.basket{position:absolute;left:0;bottom:6px;z-index:3;will-change:transform}
.basket svg{display:block;width:100%}
.faller,.flyer,.half{position:absolute;left:0;top:0;z-index:2;will-change:transform;pointer-events:none}
.faller.fade,.flyer.fade{opacity:.25;transition:opacity .3s}
.pop{position:absolute;left:50%;top:120px;transform:translateX(-50%) scale(.9);opacity:0;z-index:5;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 20px;font-size:1.4rem;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s,transform .2s}
.pop.show{opacity:1;transform:translateX(-50%) scale(1)}
.pop.good{border-color:var(--good);color:var(--good)}.pop.oops{border-color:var(--coral);color:var(--coral-d)}
.movekeys{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--ink-2);font-weight:700;text-align:center}
.movekeys .btn{min-width:110px}
.field.chop{background:radial-gradient(circle at 50% 120%,#ffe7b8,#fff6e2 60%,#fdf0d6);cursor:crosshair}
.trail{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.trail polyline{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(255,106,77,.8))}
.half{transition:transform .8s cubic-bezier(.3,.6,.5,1),opacity .8s}
.half.go{opacity:0}
.rm .half{transition:opacity .8s}
.chopcount{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:5}
.chopcount i{width:22px;height:22px;border-radius:50%;border:3px solid var(--leaf);background:var(--paper)}
.chopcount i.on{background:var(--leaf)}

/* ---------- smoothie */
.bar{display:grid;grid-template-columns:1fr 1.05fr 1.2fr;gap:16px;align-items:start}
.tk-h{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--coral-d);margin-bottom:6px}
.ticket{background:#fffdf6;border-style:dashed;display:flex;flex-direction:column;gap:10px}
.tk-text{font-size:1.4rem;font-weight:700;line-height:1.25}
.tk-pics{display:flex;gap:6px;flex-wrap:wrap}
.tk-pics span{width:84px;text-align:center;font-weight:700;font-size:.82rem}
.blend-zone{display:flex;flex-direction:column;align-items:center;gap:10px}
.bl-cap{font-weight:700;color:var(--ink-2);font-size:.9rem;text-align:center}
.blender{position:relative;width:min(260px,100%);border:3px dashed transparent;border-radius:24px;padding:6px;transition:border-color .2s,background .2s}
.blender>svg{display:block;width:72%;margin:0 auto}
.picking .blender,.blender.over{border-color:var(--leaf);background:var(--leaf-l)}
.blender.whirl>svg{animation:whirl .12s linear infinite}
.rm .blender.whirl>svg{animation:none}
@keyframes whirl{0%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}100%{transform:translateX(-2px)}}
.bl-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.blend-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.done-row{display:flex;gap:20px;align-items:center;margin-top:16px}
.done-row>div{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.cup{width:110px;flex:none}.cup svg{display:block;width:100%}
.big-sentence{font-size:1.5rem;font-weight:700;color:var(--leaf-d);line-height:1.3}
.speakbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sr-out{flex-basis:100%;font-weight:700;min-height:1.2em}
.sr-out.good{color:var(--good)}.sr-out.try{color:var(--coral-d)}

/* ---------- drag states */
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.92;transform-origin:center;box-shadow:0 14px 30px rgba(60,40,10,.25)}
.dragging{opacity:.35}
.picked{border-color:var(--coral)!important;box-shadow:inset 0 0 0 3px var(--coral)!important;background:var(--coral-l)!important}
.used{visibility:hidden}
.placed{opacity:.3}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rm .shake{animation:none;outline:3px solid var(--bad)}

/* ---------- sort */
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:150px;margin-bottom:16px}
.tray .ftile{width:124px}
.baskets{display:grid;gap:14px}
.baskets.n2{grid-template-columns:1fr 1fr}.baskets.n3{grid-template-columns:repeat(3,1fr)}.baskets.n4{grid-template-columns:repeat(4,1fr)}
.bask{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:240px;border:3px dashed var(--line-2);border-radius:22px;background:var(--paper);padding:12px 10px 0;transition:background .15s,border-color .15s;cursor:pointer}
.picking .bask{border-color:var(--leaf)}
.bask.over{background:var(--leaf-l);border-color:var(--leaf);border-style:solid}
.bask-label{display:flex;align-items:center;gap:8px;font-size:1.15rem;text-align:center}
.bask-label i{width:1.1em;height:1.1em;border-radius:50%;border:2px solid rgba(0,0,0,.25);flex:none}
.bask-in{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;flex:1;align-content:flex-end;position:relative;z-index:1;margin-bottom:-36px}
.inb{width:64px}
.bask-art{width:80%;max-width:220px;display:block}.bask-art svg{display:block;width:100%}

/* ---------- count */
.stall{width:100%;max-width:900px;background:#fff4e2;border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.stall-top{height:46px}.stall-top svg{width:100%;height:100%;display:block}
.cgrid{display:grid;gap:4px;padding:14px 20px 0;justify-items:center}
.cgrid.c1{grid-template-columns:repeat(1,130px);justify-content:center}.cgrid.c2{grid-template-columns:repeat(2,130px);justify-content:center}.cgrid.c3{grid-template-columns:repeat(3,130px);justify-content:center}.cgrid.c4{grid-template-columns:repeat(4,120px);justify-content:center}.cgrid.c5{grid-template-columns:repeat(5,1fr)}.cgrid.c6{grid-template-columns:repeat(6,1fr)}
.ci{width:100%;max-width:120px}
.stall-crate svg{display:block;width:100%;height:44px}
.cq{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.qline{display:flex;align-items:center;gap:12px;font-size:1.6rem}
.nums{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.num-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:110px;height:110px;border:3px solid var(--line);border-bottom-width:6px;border-radius:24px;background:var(--paper)}
.num-btn b{font-size:2.6rem;line-height:1}.num-btn small{font-weight:700;color:var(--ink-2)}
.num-btn.right{background:#e5f5ea;border-color:var(--good)}.num-btn.wrong{background:#fbe7e2;border-color:var(--bad);opacity:.6}
.cs{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

/* ---------- move & say */
.mcard{min-height:min(56vh,560px);display:flex;flex-direction:column;gap:14px;padding:22px 26px}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.kind{font-weight:700;padding:.25em .9em;border-radius:999px;font-size:1rem}
.k-do{background:var(--leaf-l);color:var(--leaf-d)}.k-choice{background:var(--sky);color:#1f5a70}.k-check{background:var(--sun-l);color:#7a5200}
.mc-main{flex:1;display:flex;align-items:center;gap:30px}
.mc-art{width:clamp(130px,22vw,300px);flex:none}
.mc-text{font-size:clamp(2rem,4.6vw,4.4rem);font-weight:700;line-height:1.12}
.mc-ans{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.ans{font-size:clamp(1.4rem,2.6vw,2.4rem);font-weight:700;color:var(--leaf-d)}
.mnav{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}

/* ---------- market */
.roles{align-self:center}
.setup{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;align-items:start}
.crate-box .sgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.stallwrap{background:#fff4e2;border:2px solid var(--line);border-radius:22px;overflow:hidden}
.stall-name{text-align:center;font-weight:700;font-size:1.2rem;color:var(--coral-d);padding:8px 0 0}
.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.shelf-slot{position:relative;min-height:170px;border:3px dashed var(--line-2);border-radius:18px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;border-bottom:8px solid #c98a49}
.shelf-slot.full{border-style:solid;border-color:#e2b072;border-bottom-color:#c98a49;background:#fffaf0}
.picking .shelf-slot,.shelf-slot.over{border-color:var(--leaf)}
.shelf-slot.over{background:var(--leaf-l)}
.slot-fruit{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-weight:700;padding:0;width:100%}
.slot-fruit svg{width:84px}
.empty-l{color:var(--ink-2);font-weight:700;font-size:.85rem}
.pricer{display:flex;align-items:center;gap:4px}
.pbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line-2);background:var(--paper);font-weight:700;font-size:1.3rem;line-height:1}
.ptag{display:inline-flex;flex-direction:column;align-items:center;line-height:1;background:var(--sun-l);border:2px solid #e6c066;border-radius:10px;padding:4px 8px;min-width:58px}
.ptag b{font-size:1.15rem}.ptag small{font-size:.7rem;font-weight:700;color:var(--ink-2)}
.ptag.sm{position:absolute;top:6px;right:6px}
.crate-front svg{display:block;width:100%;height:36px}
.setup+.act,.mk .act{margin-top:16px}
.play{display:grid;grid-template-columns:.85fr 2fr;gap:16px;align-items:start}
.slist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slist li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;background:var(--cream);border-radius:14px;padding:6px 10px}
.slist li.got{background:#e5f5ea;text-decoration:line-through;text-decoration-thickness:2px}
.li-pic{width:46px;flex:none}
.ok{margin-left:auto;color:var(--good)}
.tot{margin-top:10px;font-size:1.15rem}
.mybag{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.bagin{display:flex;flex-wrap:wrap;gap:4px;min-height:58px}
.bagitem{width:56px;height:56px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:3px}
.talk{display:flex;flex-direction:column;gap:14px}
.dcard{border-radius:22px;padding:16px 18px;border:3px solid;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.dcard.seller{border-color:var(--coral);background:#fff6f2}
.dcard.customer{border-color:var(--leaf);background:#f3fbf5}
.dcard .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;color:var(--ink-2)}
.dcard .who svg{width:56px;height:auto}
.dcard .line{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700;line-height:1.2}
.dbtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step-n{margin-left:auto;font-weight:700;color:var(--ink-2)}
.todo{font-weight:700;color:var(--coral-d);font-size:1.05rem}
.money,.paid{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.paid{margin-top:8px;min-height:50px}
.bill{border:0;background:transparent;padding:0;width:130px}.bill svg{display:block;width:100%}
.bill.sm{width:80px}
.stallwrap.mini .shelves{grid-template-columns:repeat(6,1fr);gap:6px;padding:8px}
.stallwrap.mini .shelf-slot{min-height:120px;padding:4px;border-bottom-width:6px}
.shelf-slot.buy{cursor:pointer;font-weight:700;font-size:.85rem}
.shelf-slot.buy svg{width:70px}
.shelf-slot.buy:not(:disabled):hover{background:var(--sun-l)}
.shelf-slot.buy:disabled{cursor:default;opacity:1}

/* ---------- speak */
.sp-grid{display:grid;grid-template-columns:.7fr 2fr;gap:16px;align-items:start}
.sp-pic{display:flex;flex-direction:column;align-items:center;gap:10px}.sp-pic svg{max-width:180px}
.frames{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:12px}
.frames li{font-size:1.35rem;font-weight:700}
.frames li::marker{color:var(--coral-d)}
.blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--coral);color:var(--ink-2);text-align:center;padding:0 .2em}
.blank.filled{color:var(--leaf-d);border-bottom-color:var(--leaf)}
.opts-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.opts-row .chip{font-size:1rem}
.sp-say{margin-top:18px;border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}

/* ---------- check */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.dots i{width:20px;height:20px;border-radius:50%;background:var(--paper);border:3px solid var(--line-2)}
.dots i.now{border-color:var(--ink)}.dots i.ok{background:var(--good);border-color:var(--good)}.dots i.no{background:var(--coral);border-color:var(--coral-d)}
.qp{font-size:1.3rem;font-weight:700;text-align:center;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.qp.big{font-size:1.9rem;color:var(--leaf-d)}
.qsub{color:var(--ink-2);font-weight:700}
.fallback{font-size:1.6rem;font-weight:700}
.qpic{width:200px}
.qpic.tf{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:auto;max-width:760px}
.qpic.tf svg{width:150px}
.qpic.tf.n3 svg,.qpic.tf.n4 svg,.qpic.tf.n5 svg{width:120px}
.wopts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt.word{font-size:1.5rem;min-width:200px;min-height:76px}
.tfopts{display:flex;gap:16px}
.opt.tfb{display:flex;align-items:center;gap:10px;font-size:1.5rem;min-width:190px;min-height:80px;justify-content:center}
.qfb{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:60px}
.qfb p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:1.15rem;text-align:center}
.qfb .g{color:var(--good)}.qfb .b{color:var(--bad)}.qfb span{color:var(--ink)}

/* ---------- finish */
.finish{position:fixed;inset:0;z-index:70;background:rgba(33,53,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.finish-card{background:var(--paper);border-radius:28px;padding:28px 30px;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;border:3px solid var(--sun);animation:pop .3s ease-out}
.finish-card .stars svg{width:54px;height:54px}
.finish-card h2{font-size:2rem;color:var(--leaf-d)}
.finish-card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.badge-art{width:140px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.rm *,.rm *::before,.rm *::after{animation-duration:0s!important;transition-duration:0s!important}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ---------- responsive */
@media (max-width:1100px){
  .path{grid-template-columns:repeat(3,1fr)}
  .bar{grid-template-columns:1fr 1fr}.fshelf{grid-column:1/-1}.fshelf .sgrid{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:900px){
  .start-in{grid-template-columns:1fr;column-gap:0}
  .pick-box{grid-column:1;grid-row:auto;margin-top:18px}
  .studio{grid-template-columns:1fr}.detail{position:static;order:-1}
  .gamegrid{grid-template-columns:1fr 1fr}
  .setup,.play,.sp-grid{grid-template-columns:1fr}
  .stallwrap.mini .shelves{grid-template-columns:repeat(3,1fr)}
  .top .homebtn span,.tutorbtn span{display:none}
}
@media (max-width:640px){
  :root{--fs:17px}
  main{padding:16px 12px 24px}
  .top{gap:4px;padding:6px 8px;flex-wrap:wrap}
  .crumb{order:-1;flex-basis:calc(100% - 120px)}
  .lvl button{min-width:44px}
  .ib{min-width:44px;min-height:44px;padding:0 .3em}
  .path{grid-template-columns:1fr}
  .step{flex-direction:row;align-items:center;padding:10px}
  .step .pic{width:118px;height:96px;flex:none;overflow:hidden}.step .pic svg{height:64px}
  .step .pic .scn svg{height:42px}.step .pic .scn.mic .ic{width:36px;height:36px}
  .sp-pic{flex-direction:row;flex-wrap:wrap;justify-content:center}.sp-pic svg{max-width:110px}
  .gamegrid{grid-template-columns:1fr}
  .gtile{min-height:0}
  .opts.n4{grid-template-columns:1fr 1fr}.opts.n3{grid-template-columns:repeat(3,1fr);gap:8px}
  .bar{grid-template-columns:1fr}.fshelf .sgrid{grid-template-columns:repeat(3,1fr)}
  .baskets.n3,.baskets.n4{grid-template-columns:1fr 1fr}
  .bask{min-height:190px}
  .field{height:58vh;min-height:340px}
  .ptext{font-size:1.15rem}
  .num-btn{width:90px;height:90px}
  .mc-main{flex-direction:column;gap:12px}
  .slot{width:44%}
  .facts{grid-template-columns:1fr}
  .bigword{font-size:1.9rem}
  .done-row{flex-direction:column;align-items:stretch}.cup{width:80px;align-self:center}
  .opt.word,.opt.tfb{min-width:0;flex:1}
  .wopts .opt.word{flex-basis:45%}
  .movekeys span{font-size:.8rem}
  .shelves{grid-template-columns:1fr 1fr}
  .stallwrap.mini .shelves{grid-template-columns:repeat(3,1fr)}
  .qpic.tf svg{width:96px}.qpic.tf.n3 svg,.qpic.tf.n4 svg,.qpic.tf.n5 svg{width:80px}
  .dcard .who svg{width:42px}
  .crate-row{grid-template-columns:repeat(6,1fr)}
}

</style>
</head>

/* Fruit Market: original vector artwork. One flat style: solid fills, a darker same-hue outline,

  'use strict';
  const f = (n) => Math.round(n * 10) / 10;
  const rng = (seed) => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
  const P = (d, fill, stroke, sw = 2.5, extra = '') => `<path d="${d}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ''} stroke-linejoin="round" stroke-linecap="round"${extra}/>`;
  const C = (cx, cy, r, fill, stroke, sw = 2.5, extra = '') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ''}${extra}/>`;
  const E = (cx, cy, rx, ry, fill, stroke, sw = 2.5, rot = 0, extra = '') => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ''}${rot ? ` transform="rotate(${rot} ${f(cx)} ${f(cy)})"` : ''}${extra}/>`;
  const L = (d, stroke, sw = 2.5, op = 1) => `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"${op < 1 ? ` opacity="${op}"` : ''}/>`;
  const shadow = (rx = 34, cy = 110) => E(60, cy, rx, 4.5, '#3b2a12', null, 0, 0, ' opacity=".10"');
  const hl = (cx, cy, rx, ry, rot = -25, op = 0.5) => E(cx, cy, rx, ry, '#ffffff', null, 0, rot, ` opacity="${op}"`);
  const stem = (x1, y1, cx, cy, x2, y2, w = 4) => L(`M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`, '#6b4a2b', w);
  const leaf = (x, y, rot = 0, s = 1, fill = '#4caf50', stroke = '#2e7d32') =>
    `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">${P('M0 0 C6 -10 20 -12 28 -6 C22 4 8 6 0 0 Z', fill, stroke, 2)}${L('M2 -1 C10 -4 18 -5 25 -6', stroke, 1.4, 0.8)}</g>`;
  const seed = (x, y, rot, fill = '#4a2c14', s = 1) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${s})">${P('M0 -5 C3 -2 3 3 0 5 C-3 3 -3 -2 0 -5 Z', fill)}</g>`;
  const segs = (cx, cy, r, n, fill, gap = 2.4, rot = 0) => {

    };

      }
      if (e.target.closest('[data-qnext]')) {
        qi++; if (qi < Q.length) { draw(); return; }
        const p = me(); p.check = Math.max(p.check || 0, score); const badge = score >= 8; if (badge) p.badge = true; save();
        finish(sec, { key: 'check', stars: score >= 9 ? 3 : score >= 6 ? 2 : 1, title: badge ? 'Fruit Market Star!' : `${score} out of 10`, line: badge ? `You got ${score} out of 10. You are a Fruit Market Star!` : 'Good work! Practice in Word Studio, then try again. 8 or more wins the badge.', badge, back: 'home', backLabel: 'Lesson map', say: badge ? `You got ${score} out of 10. You are a Fruit Market Star!` : `You got ${score} out of 10.` });
      }
    });
    draw(); cur.repeat = () => { const q = Q[qi]; say(q.say || q.statement || q.prompt); };
    window.__fm.checkApi = { Q: () => Q.map(q => ({ type: q.type, ans: String(q.ans), statement: q.statement, prompt: q.prompt, say: q.say, opts: (q.opts || []).map(x => x.id), wopts: q.wopts, pic: q.pic && (Array.isArray(q.pic) ? q.pic.map(x => x.id) : q.pic.id) })), qi: () => qi, score: () => score };
  };

  // test hooks (read-only helpers)
  Object.assign(window.__fm, { go, state: () => ({ screen: cur.name, level: S.level, sound: S.sound, reduced: S.reduced, profile: me().name, profiles: S.profiles.length }), buildCheck, makeClue: (id, n, lv) => makeClue(byId[id], n, D.pool(lv)), TTS, SR_OK, REC_OK });

  go('start');
})();

</script>
